  try { Object.keys(localStorage).forEach(function (k) { if (k.indexOf('mas-key-') === 0) localStorage.removeItem(k); }); } catch (e) {}
  var db = window.supabase.createClient(BV.sbUrl, BV.sbKey, { auth: { persistSession: true, autoRefreshToken: true } });
  db.auth.getSession().then(function (r) {
    var s = r.data && r.data.session; if (!s) return login();
    var C = 'lv-k-' + P.v + '-' + s.user.id, k = null;
    try { k = sessionStorage.getItem(C); } catch (e) {}
    if (k) return open(k).catch(function () { try { sessionStorage.removeItem(C); } catch (e) {} location.reload(); });
    return db.rpc('site_key').then(function (x) {
      if (x.error) throw x.error;
      if (!x.data) return say('<h1>Waiting for approval</h1><p>You are signed in, but your teacher has not approved your account yet. Classes and learning materials open as soon as you are approved.</p><a class="btn" href="/dashboard/">Go to my dashboard</a><a class="btn alt" href="/">Learnova home</a>');
      return open(x.data).then(function () { try { sessionStorage.setItem(C, x.data); } catch (e) {} });
    });
  }).catch(function () { say('<h1>Could not open this page</h1><p>Please sign in again.</p><a class="btn" href="/login/?next=' + encodeURIComponent(here) + '">Sign in</a>'); });
})();
