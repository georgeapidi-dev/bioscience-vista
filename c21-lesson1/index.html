      return open(x.data).then(function () { try { sessionStorage.setItem(C, x.data); } catch (e) {} });
    });
  }).catch(function () { say('<h1>Could not open this page</h1><p>Please sign in again.</p><a class="btn" href="/login/?next=' + encodeURIComponent(here) + '">Sign in</a>'); });
})();
</script></body></html>
