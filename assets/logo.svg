<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Vista Education (VistaEd) logo">
  <!-- VistaEd mark (25 Nov 2026): an open book whose two pages form a V, a sun rising over the horizon between them (the vista),
       and an orbit sweeping round it (science and discovery). Colours follow the site's palette: teal, blue, violet, pink, amber. -->
  <defs>
    <linearGradient id="veBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06b6d4"/>
      <stop offset=".38" stop-color="#4f46e5"/>
      <stop offset=".72" stop-color="#9333ea"/>
      <stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
    <radialGradient id="veGlow" cx="32" cy="22" r="30" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff7d6" stop-opacity=".55"/>
      <stop offset="1" stop-color="#fff7d6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="veSun" cx=".4" cy=".35" r=".75">
      <stop offset="0" stop-color="#fffbeb"/>
      <stop offset=".5" stop-color="#fde047"/>
      <stop offset="1" stop-color="#f97316"/>
    </radialGradient>
    <linearGradient id="vePageL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a3e635"/>
      <stop offset="1" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="vePageR" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="veOrbit" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity=".15"/>
      <stop offset=".5" stop-color="#fff" stop-opacity=".95"/>
      <stop offset="1" stop-color="#fbcfe8" stop-opacity=".35"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#veBg)"/>
  <rect width="64" height="64" rx="16" fill="url(#veGlow)"/>
  <!-- rays -->
  <g stroke="#fef08a" stroke-width="2" stroke-linecap="round" opacity=".9">
    <path d="M32 5.5v3.4M22.6 8.6l1.8 2.8M41.4 8.6l-1.8 2.8M16 14.6l2.9 1.6M48 14.6l-2.9 1.6"/>
  </g>
  <!-- rising sun -->
  <circle cx="32" cy="25" r="9.5" fill="url(#veSun)"/>
  <!-- orbit round the sun, with a moving electron -->
  <ellipse cx="32" cy="25" rx="17" ry="5.6" fill="none" stroke="url(#veOrbit)" stroke-width="1.7" transform="rotate(-18 32 25)"/>
  <circle cx="47.4" cy="19.2" r="2.1" fill="#fff"/>
  <!-- open book: two pages make the V -->
  <path d="M6 27.5c9.2-1.6 18 1.4 26 7.6V58C24 52 15.6 49.4 6 50.6Z" fill="url(#vePageL)"/>
  <path d="M58 27.5c-9.2-1.6-18 1.4-26 7.6V58c8-6 16.4-8.6 26-7.4Z" fill="url(#vePageR)"/>
  <!-- page lines -->
  <g stroke="#fff" stroke-width="1.3" stroke-linecap="round" opacity=".55" fill="none">
    <path d="M11 34.6c5.6-.4 10.6 1.4 16 4.8M11 40.2c5.6-.4 10.6 1.4 16 4.8"/>
    <path d="M53 34.6c-5.6-.4-10.6 1.4-16 4.8M53 40.2c-5.6-.4-10.6 1.4-16 4.8"/>
  </g>
  <!-- spine highlight -->
  <path d="M32 35.1V58" stroke="#fff" stroke-width="1.4" stroke-linecap="round" opacity=".8"/>
  <!-- spark -->
  <path d="M12.5 8.5l1 2.6 2.6 1-2.6 1-1 2.6-1-2.6-2.6-1 2.6-1Z" fill="#fff" opacity=".9"/>
</svg>
