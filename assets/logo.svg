<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="BioscienceVista logo">
  <defs>
    <linearGradient id="bvbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14b8a6"/>
      <stop offset=".45" stop-color="#2563eb"/>
      <stop offset=".8" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#db2777"/>
    </linearGradient>
    <radialGradient id="bvglow" cx="32" cy="18" r="34" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity=".5"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bvsun" cx=".42" cy=".38" r=".7">
      <stop offset="0" stop-color="#fffbeb"/>
      <stop offset=".55" stop-color="#fcd34d"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </radialGradient>
    <linearGradient id="bvleafL" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#16a34a"/>
      <stop offset="1" stop-color="#bef264"/>
    </linearGradient>
    <linearGradient id="bvleafR" x1="1" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#0891b2"/>
      <stop offset="1" stop-color="#a5f3fc"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="17" fill="url(#bvbg)"/>
  <rect width="64" height="64" rx="17" fill="url(#bvglow)"/>
  <!-- sun with rays -->
  <g stroke="#fde68a" stroke-width="2.2" stroke-linecap="round" opacity=".95">
    <path d="M32 3.5v3.2M21.6 7.6l1.9 2.6M42.4 7.6l-1.9 2.6M16.5 16.4l3 1.1M47.5 16.4l-3 1.1"/>
  </g>
  <circle cx="32" cy="17" r="6.2" fill="url(#bvsun)"/>
  <!-- horizon: the vista -->
  <path d="M4 50q28-13 56 0" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M8 55.5q24-9 48 0" fill="none" stroke="#f9a8d4" stroke-opacity=".7" stroke-width="2" stroke-linecap="round"/>
  <!-- two leaves making a V -->
  <path d="M31 52C18 45 9.5 31 12.5 15.5c11.5 3 20.5 13.5 18.5 36.5z" fill="url(#bvleafL)" stroke="#fff" stroke-width="1.2" stroke-opacity=".6"/>
  <path d="M33 52c13-7 21.5-21 18.5-36.5C40 18.5 31 29 33 52z" fill="url(#bvleafR)" stroke="#fff" stroke-width="1.2" stroke-opacity=".6"/>
  <path d="M30 48 16 20M34 48l14-28" stroke="#fff" stroke-opacity=".75" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M23.5 33l-5 1.5M25.5 38.5l-5.5.5M40.5 33l5 1.5M38.5 38.5l5.5.5" stroke="#fff" stroke-opacity=".55" stroke-width="1.1" stroke-linecap="round"/>
  <!-- sparkles -->
  <circle cx="9" cy="9" r="1.4" fill="#fff" opacity=".8"/><circle cx="55" cy="10" r="1.1" fill="#fff" opacity=".7"/><circle cx="56.5" cy="31" r="1" fill="#fde68a"/>
</svg>
