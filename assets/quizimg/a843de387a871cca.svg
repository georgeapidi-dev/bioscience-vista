<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 495" role="img" aria-label="Structural features common to viruses: a non-enveloped and an enveloped virus"><rect width="820" height="495" fill="#ffffff"/><text x="410" y="32" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#0f172a">Structural features common to viruses</text><text x="410" y="56" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#334155">Small, fixed size · nucleic acid (DNA or RNA) · protein capsid · no cytoplasm · few or no enzymes</text><polygon points="230.0,145.0 320.9,197.5 320.9,302.5 230.0,355.0 139.1,302.5 139.1,197.5" fill="#fde68a" stroke="#b45309" stroke-width="3"/><circle cx="230.0" cy="155.0" r="11" fill="#f59e0b" stroke="#b45309"/><circle cx="312.3" cy="202.5" r="11" fill="#f59e0b" stroke="#b45309"/><circle cx="312.3" cy="297.5" r="11" fill="#f59e0b" stroke="#b45309"/><circle cx="230.0" cy="345.0" r="11" fill="#f59e0b" stroke="#b45309"/><circle cx="147.7" cy="297.5" r="11" fill="#f59e0b" stroke="#b45309"/><circle cx="147.7" cy="202.5" r="11" fill="#f59e0b" stroke="#b45309"/><path d="M170 250 Q 178.6 236 187.1 250 Q 195.7 264 204.3 250 Q 212.9 236 221.4 250 Q 230.0 264 238.6 250 Q 247.1 236 255.7 250 Q 264.3 264 272.9 250 Q 281.4 236 290.0 250" fill="none" stroke="#1d4ed8" stroke-width="3"/><text x="230" y="455" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#0f172a">Non-enveloped virus</text><line x1="200" y1="160" x2="205" y2="100" stroke="#334155" stroke-width="1.4"/><circle cx="200" cy="160" r="3" fill="#334155"/><text x="199" y="105" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#0f172a">Capsid (made of protein)</text><line x1="200" y1="255" x2="175" y2="375" stroke="#334155" stroke-width="1.4"/><circle cx="200" cy="255" r="3" fill="#334155"/><text x="169" y="38