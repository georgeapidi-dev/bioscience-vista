<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-label="Progressive, regressive and virus-first hypotheses for the origin of viruses"><rect width="900" height="360" fill="#ffffff"/><text x="450" y="32" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#0f172a">Where did viruses come from? Three hypotheses</text><rect x="30" y="60" width="260" height="240" rx="16" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><rect x="30" y="60" width="260" height="44" rx="16" fill="#0f766e"/><text x="160" y="89" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#ffffff">Progressive (escape)</text><text x="160" y="140" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#0f172a">Pieces of genetic material</text><text x="160" y="166" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#0f172a">(like plasmids) escaped from</text><text x="160" y="192" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#0f172a">cells and gained a capsid.</text><text x="160" y="218" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#0f172a">Viruses got MORE complex.</text><rect x="320" y="60" width="260" height="240" rx="16" fill="#ffffff" stroke="#b45309" stroke-width="3"/><rect x="320" y="60" width="260" height="44" rx="16" fill="#b45309"/><text x="450" y="89" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#ffffff">Regressive (reduction)</text><text x="450" y="140" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#0f172a">Small cells became parasites</text><text x="450" y="166" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#0f172a">inside bigger cells and lost</text><text x="450" y="192" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#0f172a">the genes they no longer needed.</text><text x="450" y="218" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#0f172a">Viruses got SIMPLER.</text><text x="450" y="244" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#0f172a">Example: giant viruses (Mimivirus)</text><rect x="610" y="60" width="260" height="240" rx="16" fill="#ffffff" stroke="#7c3aed" stroke-width="3"/><rect x="610" y="60" width="260" height="44" rx="16" fill="#7c3aed"/><text x="740" y="89" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#ffffff">Virus-first</text><text x="740" y="140" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#0f172a">Viruses existed before cells.</text><text x="740" y="166" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#0f172a">Problem: every virus today</text><text x="740" y="192" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#0f172a">needs a host cell, so this</text><text x="740" y="218" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#0f172a">is the least supported idea.</text><text x="450" y="330" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#334155">Evidence: viruses are so diverse that they probably have SEVERAL origins. All use the same genetic code as cells,</text><text x="450" y="348" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#334155">and their shared features (capsid, tiny genome) may be convergent evolution for the same parasitic way of life.</text></svg>