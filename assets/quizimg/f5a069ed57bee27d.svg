<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" role="img" aria-label="Lytic and lysogenic cycles of bacteriophage lambda"><rect width="900" height="640" fill="#ffffff"/><text x="450" y="32" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#0f172a">Bacteriophage lambda: lytic and lysogenic cycles</text><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs><rect x="380" y="72" width="140" height="76" rx="38" fill="#e0f2fe" stroke="#0369a1" stroke-width="2.5"/><path d="M410 110 C 425 88, 475 132, 490 110" fill="none" stroke="#334155" stroke-width="3"/><path d="M420 95 q 8 -10 16 0 q 8 10 16 0" fill="none" stroke="#dc2626" stroke-width="3"/><text x="450" y="168" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#0f172a">1. Attachment and injection</text><text x="450" y="192" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#334155">Tail fibre binds a receptor on E. coli; the phage injects its DNA. The empty capsid stays outside.</text><text x="450" y="206" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#334155">The linear DNA closes into a circle inside the cell.</text><line x1="400" y1="214" x2="300" y2="236" stroke="#334155" stroke-width="3" marker-end="url(#ah)"/><line x1="500" y1="214" x2="600" y2="236" stroke="#334155" stroke-width="3" marker-end="url(#ah)"/><text x="225" y="258" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#b91c1c">LYTIC CYCLE</text><text x="675" y="258" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#1d4ed8">LYSOGENIC CYCLE</text><rect x="155" y="272" width="140" height="76" rx="38" fill="#e0f2fe" stroke="#0369a1" stroke-width="2.5"/><path d="M185 310 C 200 288, 250 332, 265 310" fill="none" stroke="#334155" stroke-width="3"/><path d="M190 300 q 8 -10 16 0 q 8 10 16 0" fill="none" stroke="#dc2626" stroke-width="3"/><path d="M212 318 q 8 -10 16 0 q 8 10 16 0" fill="none" stroke="#dc2626" stroke-width="3"/><path d="M234 300 q 8 -10 16 0 q 8 10 16 0" fill="none" stroke="#dc2626" stroke-width="3"/><text x="225" y="368" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#0f172a">2. Replication and protein synthesis</text><line x1="225" y1="375" x2="225" y2="400" stroke="#334155" stroke-width="3" marker-end="url(#ah)"/><rect x="155" y="402" width="140" height="76" rx="38" fill="#e0f2fe" stroke="#0369a1" stroke-width="2.5"/><path d="M185 440 C 200 418, 250 462, 265 440" fill="none" stroke="#334155" stroke-width="3"/><polygon points="185.0,425.0 193.7,430.0 193.7,440.0 185.0,445.0 176.3,440.0 176.3,430.0" fill="#fde68a" stroke="#b45309" stroke-width="3"/><polygon points="211.0,439.0 219.7,444.0 219.7,454.0 211.0,459.0 202.3,454.0 202.3,444.0" fill="#fde68a" stroke="#b45309" stroke-width="3"/><polygon points="237.0,425.0 245.7,430.0 245.7,440.0 237.0,445.0 228.3,440.0 228.3,430.0" fill="#fde68a" stroke="#b45309" stroke-width="3"/><polygon points="263.0,439.0 271.7,444.0 271.7,454.0 263.0,459.0 254.3,454.0 254.3,444.0" fill="#fde68a" stroke="#b45309" stroke-width="3"/><text x="225" y="498" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#0f172a">3. Assembly of new phages</text><line x1="225" y1="505" x2="225" y2="528" stroke="#334155" stroke-width="3" marker-end="url(#ah)"/><rect x="160" y="530" width="130" height="60" rx="30" fill="none" stroke="#0369a1" stroke-width="2.5" stroke-dasharray="10 8"/><polygon points="140.0,540.0 148.7,545.0 148.7,555.0 140.0,560.0 131.3,555.0 131.3,545.0" fill="#fde68a" stroke="#b45309" stroke-width="3"/><polygon points="174.0,562.0 182.7,567.0 182.7,577.0 174.0,582.0 165.3,577.0 165.3,567.0" fill="#fde68a" stroke="#b45309" stroke-width="3"/><polygon points="208.0,540.0 216.7,545.0 216.7,555.0 208.0,560.0 199.3,555.0 199.3,545.0" fill="#fde68a" stroke="#b45309" stroke-width="3"/><polygon points="242.0,562.0 250.7,567.0 250.7,577.0 242.0,582.0 233.3,577.0 233.3,567.0" fill="#fde68a" stroke="#b45309" stroke-width="3"/><polygon points="276.0,540.0 284.7,545.0 284.7,555.0 276.0,560.0 267.3,555.0 267.3,545.0" fill="#fde68a" stroke="#b45309" stroke-width="3"/><polygon points="310.0,562.0 318.7,567.0 318.7,577.0 310.0,582.0 301.3,577.0 301.3,567.0" fill="#fde68a" stroke="#b45309" stroke-width="3"/><text x="225" y="610" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#0f172a">4. Lysis: the cell bursts, releasing about 100 phages</text><text x="225" y="628" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="400" fill="#475569">Host ATP, ribosomes, nucleotides and amino acids are used throughout</text><rect x="605" y="272" width="140" height="76" rx="38" fill="#e0f2fe" stroke="#0369a1" stroke-width="2.5"/><path d="M635 310 C 650 288, 700 332, 715 310" fill="none" stroke="#334155" stroke-width="3"/><path d="M659 310 l 22 0" stroke="#dc2626" stroke-width="5"/><text x="675" y="368" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#0f172a">2. Integration: DNA joins the chromosome (prophage)</text><line x1="675" y1="394" x2="675" y2="408" stroke="#334155" stroke-width="3" marker-end="url(#ah)"/><rect x="575" y="410" width="90" height="58" rx="29" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/><rect x="685" y="410" width="90" height="58" rx="29" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/><path d="M590 440 c 10 -14 40 14 60 0" fill="none" stroke="#334155" stroke-width="3"/><path d="M612 440 l 14 0" stroke="#dc2626" stroke-width="5"/><path d="M700 440 c 10 -14 40 14 60 0" fill="none" stroke="#334155" stroke-width="3"/><path d="M722 440 l 14 0" stroke="#dc2626" stroke-width="5"/><text x="675" y="490" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#0f172a">3. Cell division copies the prophage</text><text x="675" y="506" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#334155">into every daughter cell (no new phages made)</text><line x1="572" y1="440" x2="300" y2="440" stroke="#7c3aed" stroke-width="3" marker-end="url(#ah)"/><text x="560" y="560" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#7c3aed">4. INDUCTION: stress such as UV light or DNA damage</text><text x="560" y="578" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#7c3aed">cuts the prophage out, and the cell switches to the lytic cycle</text></svg>