<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" role="img" aria-label="Circle with its radius marked"><rect width="640" height="300" fill="#ffffff"/><style>text{font-family:Arial,Helvetica,sans-serif}.s{opacity:0;animation:fade .6s ease forwards}@keyframes fade{to{opacity:1}}@media (prefers-reduced-motion:reduce){.s{opacity:1;animation:none}}</style><g class="s" style="animation-delay:0.00s"><circle cx="240" cy="150" r="110" fill="#eaf2fb" stroke="#1a1a1a" stroke-width="3"/></g><g class="s" style="animation-delay:0.25s"><line x1="240" y1="150" x2="350" y2="150" stroke="#b3261e" stroke-width="3" stroke-linecap="round"/></g><g class="s" style="animation-delay:0.50s"><circle cx="240" cy="150" r="5" fill="#1a1a1a"/></g><g class="s" style="animation-delay:0.75s"><text x="295.0" y="140" text-anchor="middle" font-size="20" fill="#b3261e" font-weight="bold">r</text></g><g class="s" style="animation-delay:1.00s"><text x="240" y="176" text-anchor="middle" font-size="15" fill="#8a8a8a">centre</text></g><g class="s" style="animation-delay:1.25s"><text x="470" y="130" text-anchor="start" font-size="20" fill="#1a1a1a" font-weight="bold">A = πr²</text></g><g class="s" style="animation-delay:1.50s"><text x="470" y="162" text-anchor="start" font-size="16" fill="#1a1a1a">r is the radius</text></g></svg>
