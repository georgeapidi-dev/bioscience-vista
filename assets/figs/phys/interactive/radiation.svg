<g class="part" data-part="a" data-name="Alpha (α)" data-info="Helium nucleus: 2 protons and 2 neutrons, charge +2. Very strongly ionising, so it loses its energy quickly: stopped by paper, skin or a few cm of air." tabindex="0" role="button" aria-label="Alpha (α)"><g transform="translate(240 150)"><g><circle cx="-6" cy="-6" r="7" fill="#ef4444" stroke="#7f1d1d"/><circle cx="6" cy="6" r="7" fill="#ef4444" stroke="#7f1d1d"/><circle cx="6" cy="-6" r="7" fill="#94a3b8" stroke="#334155"/><circle cx="-6" cy="6" r="7" fill="#94a3b8" stroke="#334155"/></g></g><text x="262" y="155" font-size="15" font-weight="700">alpha α</text></g>
<g class="part" data-part="b" data-name="Beta (β⁻)" data-info="A fast-moving electron made when a neutron in the nucleus turns into a proton. Charge −1. Passes through paper; stopped by a few mm of aluminium." tabindex="0" role="button" aria-label="Beta (β⁻)"><g transform="translate(240 280)"><circle r="6" fill="#2563eb" stroke="#1e3a8a"/><text y="-9" text-anchor="middle" font-size="10" font-weight="700" fill="#1e3a8a">−</text></g><text x="262" y="285" font-size="15" font-weight="700">beta β</text></g>
<g class="part" data-part="g" data-name="Gamma (γ)" data-info="High-frequency electromagnetic radiation: no mass and no charge. Weakly ionising, very penetrating: reduced by thick lead or concrete." tabindex="0" role="button" aria-label="Gamma (γ)"><g transform="translate(250 410)"><path d="M -28 0 q 3.5 -7 7.0 0 q 3.5 7 7.0 0 q 3.5 -7 7.0 0" fill="none" stroke="#7c3aed" stroke-width="3"/></g><text x="262" y="415" font-size="15" font-weight="700">gamma γ</text></g>
<g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.2000;0.2300;1.0000" values="0;0;1;1" dur="10s" begin="rd-play.begin+0s" fill="freeze"/><rect x="400.0" y="188" width="140" height="24" rx="12" fill="#fee2e2" stroke="#1f2937" stroke-width="1"/><text x="470" y="205" text-anchor="middle" font-size="12" font-weight="700">stopped by paper</text></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.4400;0.4700;1.0000" values="0;0;1;1" dur="10s" begin="rd-play.begin+0s" fill="freeze"/><rect x="635.0" y="318" width="170" height="24" rx="12" fill="#dbeafe" stroke="#1f2937" stroke-width="1"/><text x="720" y="335" text-anchor="middle" font-size="12" font-weight="700">stopped by aluminium</text></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.7000;0.7300;1.0000" values="0;0;1;1" dur="10s" begin="rd-play.begin+0s" fill="freeze"/><rect x="955.0" y="408" width="170" height="24" rx="12" fill="#ede9fe" stroke="#1f2937" stroke-width="1"/><text x="1040" y="425" text-anchor="middle" font-size="12" font-weight="700">reduced, not stopped</text></g>
<g font-size="13"><rect x="940" y="150" width="240" height="200" rx="10" fill="#f8fafc" stroke="#cbd5e1"/><text x="954" y="174" font-weight="700">Ionising ← → penetrating</text><text x="954" y="200">α: +2, very ionising, ~5 cm air</text><text x="954" y="224">β: −1, moderately ionising,</text><text x="970" y="242">~1 m air</text><text x="954" y="268">γ: no charge, weakly ionising,</text><text x="970" y="286">very penetrating</text><text x="954" y="318" fill="#475569">Red: protons. Grey: neutrons.</text></g>
</svg>