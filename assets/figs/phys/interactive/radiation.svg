s="0;0;1;1" dur="10s" begin="rd-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.1900;0.3300;0.9990;1.0000" values="140 221.0;140 221.0;368 221.0;368 221.0;368 221.0" dur="10s" begin="rd-play.begin+0s" fill="freeze"/><g><circle cx="-6" cy="-6" r="7" fill="#ef4444" stroke="#7f1d1d"/><circle cx="6" cy="6" r="7" fill="#ef4444" stroke="#7f1d1d"/><circle cx="6" cy="-6" r="7" fill="#94a3b8" stroke="#334155"/><circle cx="-6" cy="6" r="7" fill="#94a3b8" stroke="#334155"/></g></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.2400;0.2600;1.0000" values="0;0;1;1" dur="10s" begin="rd-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.2400;0.4200;0.9990;1.0000" values="140 309.0;140 309.0;592 309.0;592 309.0;592 309.0" dur="10s" begin="rd-play.begin+0s" fill="freeze"/><circle r="6" fill="#2563eb" stroke="#1e3a8a"/><text y="-9" text-anchor="middle" font-size="10" font-weight="700" fill="#1e3a8a">−</text></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.2850;0.3050;1.0000" values="0;0;1;1" dur="10s" begin="rd-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.2850;0.4650;0.9990;1.0000" values="140 323.0;140 323.0;592 323.0;592 323.0;592 323.0" dur="10s" begin="rd-play.begin+0s" fill="freeze"/><circle r="6" fill="#2563eb" stroke="#1e3a8a"/><text y="-9" text-anchor="middle" font-size="10" font-weight="700" fill="#1e3a8a">−</text></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.3300;0.3500;1.0000" values="0;0;1;1" dur="10s" begin="rd-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.3300;0.5100;0.9990;1.0000" values="140 337.0;140 337.0;592 337.0;592 337.0;592 337.0" dur="10s" begin="rd-play.begin+0s" fill="freeze"/><circle r="6" fill="#2563eb" stroke="#1e3a8a"/><text y="-9" text-anchor="middle" font-size="10" font-weight="700" fill="#1e3a8a">−</text></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.3750;0.3950;1.0000" values="0;0;1;1" dur="10s" begin="rd-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.3750;0.5550;0.9990;1.0000" values="140 351.0;140 351.0;592 351.0;592 351.0;592 351.0" dur="10s" begin="rd-play.begin+0s" fill="freeze"/><circle r="6" fill="#2563eb" stroke="#1e3a8a"/><text y="-9" text-anchor="middle" font-size="10" font-weight="700" fill="#1e3a8a">−</text></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.4400;0.4600;0.6700;0.6900;1.0000" values="0;0;1;1;0;0" dur="10s" begin="rd-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.4400;0.6700;1.0000" values="150 436.0;150 436.0;850 436.0;850 436.0" dur="10s" begin="rd-play.begin+0s" fill="freeze"/><path d="M -28 0 q 3.5 -7 7.0 0 q 3.5 7 7.0 0 q 3.5 -7 7.0 0 q 3.5 7 7.0 0" fill="none" stroke="#7c3aed" stroke-width="3"/></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.4800;0.5000;0.9400;0.9600;1.0000" values="0;0;1;1;0;0" dur="10s" begin="rd-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.4800;0.9400;1.0000" values="150 452.0;150 452.0;1150 452.0;1150 452.0" dur="10s" begin="rd-play.begin+0s" fill="freeze"/><path d="M -28 0 q 3.5 -7 7.0 0 q 3.5 7 7.0 0 q 3.5 -7 7.0 0 q 3.5 7 7.0 0" fill="none" stroke="#7c3aed" stroke-width="3"/></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.5200;0.5400;0.7500;0.7700;1.0000" values="0;0;1;1;0;0" dur="10s" begin="rd-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.5200;0.7500;1.0000" values="150 468.0;150 468.0;850 468.0;850 468.0" dur="10s" begin="rd-play.begin+0s" fill="freeze"