<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" class="vd-svg" role="img" aria-labelledby="rd-title rd-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="rd-play" data-vd-play-label="Play: what stops each type?" data-vd-steps="[[0, &quot;Three sources give out alpha, beta and gamma radiation. Each passes through different absorbers.&quot;], [1.5, &quot;Alpha particles are stopped by a sheet of paper: they are strongly ionising and lose their energy quickly.&quot;], [3.5, &quot;Beta particles pass through the paper but are stopped by a few millimetres of aluminium.&quot;], [5.5, &quot;Gamma rays pass through paper and aluminium. Several centimetres of lead only reduce them: some still get through.&quot;], [8, &quot;The more ionising the radiation, the less penetrating it is: alpha is most ionising and least penetrating; gamma the reverse.&quot;]]" data-vd-dur="10">
<title id="rd-title">Penetration of alpha, beta and gamma radiation</title><desc id="rd-desc">Alpha, beta and gamma radiation from sources pass towards a sheet of paper, a few millimetres of aluminium and several centimetres of lead. Alpha is stopped by paper, beta by aluminium, and gamma is only reduced by lead.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1200" height="620" fill="#ffffff"/>
<g aria-hidden="true"><animate id="rd-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<text class="head" x="30" y="34">Penetrating power of alpha, beta and gamma radiation</text><text class="note" x="30" y="56">Particles drawn much larger than real; not to scale.</text>
<g class="part" data-part="src" data-name="Radioactive sources" data-info="Unstable nuclei decay at random and give out radiation." tabindex="0" role="button" aria-label="Radioactive sources"><rect x="70" y="174" width="60" height="52" rx="8" fill="#fef3c7" stroke="#92400e" stroke-width="2"/><circle cx="100" cy="200" r="10" fill="#facc15" stroke="#92400e"/><rect x="70" y="304" width="60" height="52" rx="8" fill="#fef3c7" stroke="#92400e" stroke-width="2"/><circle cx="100" cy="330" r="10" fill="#facc15" stroke="#92400e"/><rect x="70" y="434" width="60" height="52" rx="8" fill="#fef3c7" stroke="#92400e" stroke-width="2"/><circle cx="100" cy="460" r="10" fill="#facc15" stroke="#92400e"/><g transform="translate(60 560)"><circle r="18" fill="#facc15" stroke="#111827" stroke-width="2"/><path d="M 0 0 L -8.0 -13.9 A 16 16 0 0 1 8.0 -13.9 Z" fill="#111827"/><path d="M 0 0 L 16.0 0.0 A 16 16 0 0 1 8.0 13.9 Z" fill="#111827"/><path d="M 0 0 L -8.0 13.9 A 16 16 0 0 1 -16.0 0.0 Z" fill="#111827"/><circle r="4" fill="#facc15" stroke="#111827"/></g><text x="88" y="566" font-size="12">radioactive sources</text></g>
<g class="part" data-part="pap" data-name="Paper" data-info="A sheet of paper stops alpha particles." tabindex="0" role="button" aria-label="Paper"><rect x="380" y="140" width="6" height="380" fill="#f8fafc" stroke="#94a3b8"/><text x="383" y="128" text-anchor="middle" font-size="14" font-weight="700">paper</text></g>
<g class="part" data-part="al" data-name="Aluminium, a few mm" data-info="Stops beta particles." tabindex="0" role="button" aria-label="Aluminium, a few mm"><rect x="600" y="140" width="16" height="380" fill="#cbd5e1" stroke="#64748b"/><text x="608" y="128" text-anchor="middle" font-size="14" font-weight="700">aluminium (few mm)</text></g>
<g class="part" data-part="pb" data-name="Lead, several cm" data-info="Greatly reduces gamma radiation, but some still gets through." tabindex="0" role="button" aria-label="Lead, several cm"><rect x="830" y="140" width="70" height="380" fill="#475569" stroke="#1e293b"/><text x="865" y="128" text-anchor="middle" font-size="14" font-weight="700">lead (several cm)</text></g>
