<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" class="vd-svg" role="img" aria-labelledby="fb-title fb-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="fb-play" data-vd-play-label="Play: pull the box" data-vd-steps="[[0, &quot;A 10 kg box on a rough floor. Weight (98 N) and the normal force (98 N) are balanced.&quot;], [2, &quot;A 30 N pull: static friction pushes back with 30 N. The forces are balanced, so the box stays still.&quot;], [5.5, &quot;The pull increases to 50 N. Sliding friction is 30 N, so the resultant force is 20 N to the right.&quot;], [8, &quot;The box accelerates: a = F \u00f7 m = 20 N \u00f7 10 kg = 2 m/s\u00b2.&quot;]]" data-vd-dur="12">
<title id="fb-title">Free-body diagram</title><desc id="fb-desc">A box on a rough floor with weight, normal contact force, friction and an applied pull; balanced forces at 30 N, then a 20 N resultant gives an acceleration of 2 m/s².</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="560" fill="#ffffff"/>
<g aria-hidden="true"><animate id="fb-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<defs><marker id="fb-dc2626" markerWidth="16" markerHeight="16" refX="8" refY="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L16,8 L0,16 z" fill="#dc2626"/></marker><marker id="fb-16a34a" markerWidth="16" markerHeight="16" refX="8" refY="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L16,8 L0,16 z" fill="#16a34a"/></marker><marker id="fb-2563eb" markerWidth="16" markerHeight="16" refX="8" refY="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L16,8 L0,16 z" fill="#2563eb"/></marker><marker id="fb-ea580c" markerWidth="16" markerHeight="16" refX="8" refY="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L16,8 L0,16 z" fill="#ea580c"/></marker><marker id="fb-7c3aed" markerWidth="16" markerHeight="16" refX="8" refY="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L16,8 L0,16 z" fill="#7c3aed"/></marker></defs>
<text class="head" x="30" y="34">Free-body diagram: forces on a box</text><text class="note" x="30" y="56">Arrow lengths are proportional to the forces (1 N = 1.6 px).</text>
