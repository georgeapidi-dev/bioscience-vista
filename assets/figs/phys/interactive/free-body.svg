"400" x2="596" y2="420" stroke="#78716c" stroke-width="2"/><line x1="632" y1="400" x2="618" y2="420" stroke="#78716c" stroke-width="2"/><line x1="654" y1="400" x2="640" y2="420" stroke="#78716c" stroke-width="2"/><line x1="676" y1="400" x2="662" y2="420" stroke="#78716c" stroke-width="2"/><line x1="698" y1="400" x2="684" y2="420" stroke="#78716c" stroke-width="2"/><line x1="720" y1="400" x2="706" y2="420" stroke="#78716c" stroke-width="2"/><line x1="742" y1="400" x2="728" y2="420" stroke="#78716c" stroke-width="2"/><line x1="764" y1="400" x2="750" y2="420" stroke="#78716c" stroke-width="2"/><line x1="786" y1="400" x2="772" y2="420" stroke="#78716c" stroke-width="2"/><line x1="808" y1="400" x2="794" y2="420" stroke="#78716c" stroke-width="2"/><line x1="830" y1="400" x2="816" y2="420" stroke="#78716c" stroke-width="2"/><line x1="852" y1="400" x2="838" y2="420" stroke="#78716c" stroke-width="2"/><line x1="874" y1="400" x2="860" y2="420" stroke="#78716c" stroke-width="2"/><line x1="896" y1="400" x2="882" y2="420" stroke="#78716c" stroke-width="2"/><line x1="918" y1="400" x2="904" y2="420" stroke="#78716c" stroke-width="2"/><line x1="940" y1="400" x2="926" y2="420" stroke="#78716c" stroke-width="2"/><line x1="962" y1="400" x2="948" y2="420" stroke="#78716c" stroke-width="2"/><line x1="984" y1="400" x2="970" y2="420" stroke="#78716c" stroke-width="2"/><line x1="1006" y1="400" x2="992" y2="420" stroke="#78716c" stroke-width="2"/><line x1="1028" y1="400" x2="1014" y2="420" stroke="#78716c" stroke-width="2"/><line x1="1050" y1="400" x2="1036" y2="420" stroke="#78716c" stroke-width="2"/>
<g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.5000;0.5833;0.6667;0.7500;0.8333;0.9167;1.0000" values="0 0;0 0;5 0;20 0;45 0;80 0;125 0;160 0" dur="12s" begin="fb-play.begin+0s" fill="freeze"/><rect x="300" y="260" width="160" height="120" rx="6" fill="#fde68a" stroke="#92400e" stroke-width="3"/><text x="380" y="298" text-anchor="middle" font-size="18" font-weight="800">10 kg</text><circle cx="380" cy="320" r="4" fill="#111827"/></g><g class="part" data-part="w" data-name="Weight, W = mg" data-info="10 kg × 9.8 N/kg = 98 N, acting downwards from the centre of mass." tabindex="0" role="button" aria-label="Weight, W = mg"><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.5000;0.5833;0.6667;0.7500;0.8333;0.9167;1.0000" values="0 0;0 0;5 0;20 0;45 0;80 0;125 0;160 0" dur="12s" begin="fb-play.begin+0s" fill="freeze"/><line x1="380" y1="320" x2="380" y2="476.8" stroke="#dc2626" stroke-width="6" marker-end="url(#fb-dc2626)"/><text x="392" y="472.8" font-size="15" font-weight="800" fill="#b91c1c">W = 98 N</text></g></g><g class="part" data-part="n" data-name="Normal contact force" data-info="The floor pushes up on the box: 98 N, equal and opposite to the weight here, so there is no vertical acceleration." tabindex="0" role="button" aria-label="Normal contact force"><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.5000;0.5833;0.6667;0.7500;0.8333;0.9167;1.0000" values="0 0;0 0;5 0;20 0;45 0;80 0;125 0;160 0" dur="12s" begin="fb-play.begin+0s" fill="freeze"/><line x1="380" y1="260" x2="380" y2="103.19999999999999" stroke="#16a34a" stroke-width="6" marker-end="url(#fb-16a34a)"/><text x="392" y="117.19999999999999" font-size="15" font-weight="800" fill="#15803d">N = 98 N</text></g></g><g class="part" data-part="p" data-name="Applied force (pull)" data-info="The force pulling the box." tabindex="0" role="button" aria-label="Applied force (pull)"><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.5000;0.5833;0.6667;0.7500;0.8333;0.9167;1.0000" values="0 0;0 0;5 0;20 0;45 0;80 0;125 0;160 0" dur="12s" begin="fb-play.begin+0s" fill="freeze"/><line x1="460" y1="320" x2="460" y2="320" stroke="#2563eb" stroke-width="6" marker-end="url(#fb-2563eb)" opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.1667;0.1750;1.0000" values="0;0;1;1" dur="12s" begin="fb-play.begin+0s" fill="freeze"/><animate attributeName="x2" keyTimes="0.0000;0.1667;0.2167;0.4583;0.5000;1.0000" values="460;460;508.0;508.0;540.0;540.0" dur="12s" begin="fb-play.begin+0s" fill="freeze"/></line><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.2167;0.2417;0.4583;0.4833;1.0000" values="0;0;1;1;0;0" dur="12s" begin="fb-play.begin+0s" fill="freeze"/><text x="470" y="306" font-size="15" font-weight="800" fill="#1d4ed8">pull 30 N</text></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.5000;0.5250;1.0000" values="0;0;1;1" dur="12s" begin="fb-play.begin+0s" fill="freeze"/><text x="470" y="306" font-size="15" font-weight="800" fill="#1d4ed8">pull 50 N</text></g></g></g><g class="part" data-part="f" data-name="Friction" data-info="Acts along the surface, opposing motion (or attempted motion). Static friction matches the pull up to a maximum; sliding friction here is 30 N." tabindex="0" role="button" aria-label="Friction"><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.5000;0.5833;0.6667;0.7500;0.8333;0.9167;1.0000" values="0 0;0 0;5 0;20 0;45 0;80 0;125 0;160 0" dur="12s" begin="fb-play.begin+0s" fill="freeze"/><line x1="300" y1="372" x2="300" y2="372" stroke="#ea580c" stroke-width="6" marker-end="url(#fb-ea580c)" opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.1667;0.1750;1.0000" values="0;0;1;1" dur="12s" begin="fb-play.begin+0s" fill="freeze"/><animate attributeName="x2" keyTimes="0.0000;0.1667;0.2167;1.0000" values="300;300;252.0;252.0" dur="12s" begin="fb-play.begin+0s" fill="freeze"/></line><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.2167;0.2417;1.0000" values="0;0;1;1" dur="12s" begin="fb-play.begin+0s" fill="freeze"/><text x="252.0" y="362" font-size="15" font-weight="800" fill="#c2410c">friction 30 N</text></g></g></g>
<g class="part" data-part="res" data-name="Resultant force" data-info="The overall force: F = ma. Zero resultant: stays still or moves at constant velocity." tabindex="0" role="button" aria-label="Resultant force"><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.4833;0.5083;1.0000" values="0;0;1;1" dur="12s" begin="fb-play.begin+0s" fill="freeze"/><rect x="640" y="100" width="420" height="140" rx="12" fill="#f5f3ff" stroke="#7c3aed"/><text x="660" y="132" font-size="16" font-weight="800" fill="#6d28d9">Resultant force = 50 − 30 = 20 N →</text><text x="660" y="164" font-size="16">a = F ÷ m = 20 ÷ 10 = 2 m/s²</text><text x="660" y="196" font-size="14" fill="#475569">Vertical forces still balance: W = N = 98 N.</text><line x1="660" y1="220" x2="692.0" y2="220" stroke="#7c3aed" stroke-width="6" marker-end="url(#fb-7c3aed)"/></g></g>
<g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.2167;0.2417;0.4583;0.4833;1.0000" values="0;0;1;1;0;0" dur="12s" begin="fb-play.begin+0s" fill="freeze"/><rect x="640" y="100" width="420" height="110" rx="12" fill="#f8fafc" stroke="#94a3b8"/><text x="660" y="134" font-size="16" font-weight="800">Balanced forces: resultant = 0</text><text x="660" y="166" font-size="15">pull 30 N = static friction 30 N</text><text x="660" y="192" font-size="14" fill="#475569">The box stays still.</text></g>
</svg>