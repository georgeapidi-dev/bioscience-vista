<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" class="vd-svg" role="img" aria-labelledby="ln-title ln-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="ln-play" data-vd-play-label="Play: rays through a lens" data-vd-steps="[[0, &quot;A converging lens, its principal axis and a principal focus F on each side, one focal length f from the lens.&quot;], [1, &quot;Rays parallel to the principal axis are refracted by the lens and all pass through the principal focus F.&quot;], [4.5, &quot;Ray diagram: an object stands beyond 2F. Ray 1 leaves parallel to the axis and is refracted through F.&quot;], [6.5, &quot;Ray 2 passes through the optical centre of the lens without changing direction.&quot;], [8.5, &quot;Ray 3 passes through F on the object side and leaves the lens parallel to the axis.&quot;], [10.5, &quot;Where the rays meet, a real, inverted, diminished image forms between F and 2F: as in a camera or the eye.&quot;]]" data-vd-dur="14">
<title id="ln-title">Converging lens and ray diagram</title><desc id="ln-desc">A converging lens with principal axis and foci. Parallel rays meet at the focus; then a ray diagram for an object beyond 2F gives a real, inverted, diminished image.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1200" height="560" fill="#ffffff"/>
<g aria-hidden="true"><animate id="ln-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<defs><marker id="ln-111827" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#111827"/></marker><marker id="ln-dc2626" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#dc2626"/></marker><marker id="ln-15803d" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#15803d"/></marker><marker id="ln-7c3aed" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#7c3aed"/></marker><marker id="ln-2563eb" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#2563eb"/></marker></defs>
<text class="head" x="30" y="34">Converging (convex) lens</text><text class="note" x="30" y="56">Rays are drawn bending once, at the centre line of the lens (thin-lens convention).</text>
<g class="part" data-part="axis" data-name="Principal axis" data-info="The line through the centre of the lens at right angles to it." tabindex="0" role="button" aria-label="Principal axis"><line x1="40" y1="300" x2="1160" y2="300" stroke="#334155" stroke-width="2"/></g>
<g class="part" data-part="lens" data-name="Converging (convex) lens" data-info="Thicker in the middle. It refracts light rays inwards so parallel rays meet at the principal focus." tabindex="0" role="button" aria-label="Converging (convex) lens"><path d="M 600 100 Q 646 300 600 500 Q 554 300 600 100 Z" fill="#bae6fd" fill-opacity=".6" stroke="#0369a1" stroke-width="3"/><line x1="600" y1="100" x2="600" y2="500" stroke="#0369a1" stroke-width="1" stroke-dasharray="4 4"/></g>
<g class="part" data-part="f" data-name="Principal focus, F" data-info="Where rays parallel to the axis meet after the lens. There is one on each side, the same distance from the lens." tabindex="0" role="button" aria-label="Principal focus, F"><circle cx="450" cy="300" r="5" fill="#111827"/><text x="450" y="324" text-anchor="middle" font-size="15" font-weight="700">F</text><circle cx="750" cy="300" r="5" fill="#111827"/><text x="750" y="324" text-anchor="middle" font-size="15" font-weight="700">F</text><circle cx="300" cy="300" r="5" fill="#111827"/><text x="300" y="324" text-anchor="middle" font-size="15" font-weight="700">2F</text><circle cx="900" cy="300" r="5" fill="#111827"/><text x="900" y="324" text-anchor="middle" font-size="15" font-weight="700">2F</text></g>
<g class="part" data-part="fl" data-name="Focal length, f" data-info="Distance from the centre of the lens to the principal focus. A fatter (more curved) lens has a shorter focal length." tabindex="0" role="button" aria-label="Focal length, f"><line x1="604" y1="360" x2="746" y2="360" stroke="#111827" stroke-width="2" marker-end="url(#ln-111827)" marker-start="url(#ln-111827)"/><text x="675.0" y="380" text-anchor="middle" font-size="14" font-style="italic">f</text></g>
<g><animate attributeName="opacity" keyTimes="0.0000;0.3000;0.3286;1.0000" values="1;1;0;0" dur="14s" begin="ln-play.begin+0s" fill="freeze"/><path d="M 60 150 L 600 150 L 750 300 L 900.0 450" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="2000" stroke-dashoffset="2000" ><animate attributeName="stroke-dashoffset" keyTimes="0.0000;0.0714;0.2500;1.0000" values="2000;2000;0;0" dur="14s" begin="ln-play.begin+0s" fill="freeze"/></path><path d="M 60 210 L 600 210 L 750 300 L 900.0 390" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="2000" stroke-dashoffset="2000" ><animate attributeName="stroke-dashoffset" keyTimes="0.0000;0.0821;0.2607;1.0000" values="2000;2000;0;0" dur="14s" begin="ln-play.begin+0s" fill="freeze"/></path><path d="M 60 260 L 600 260 L 750 300 L 900.0 340" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="2000" stroke-dashoffset="2000" ><animate attributeName="stroke-dashoffset" keyTimes="0.0000;0.0929;0.2714;1.0000" values="2000;2000;0;0" dur="14s" begin="ln-play.begin+0s" fill="freeze"/></path><path d="M 60 340 L 600 340 L 750 300 L 900.0 260" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="2000" stroke-dashoffset="2000" ><animate attributeName="stroke-dashoffset" keyTimes="0.0000;0.1036;0.2821;1.0000" values="2000;2000;0;0" dur="14s" begin="ln-play.begin+0s" fill="freeze"/></path><path d="M 60 390 L 600 390 L 750 300 L 900.0 210" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="2000" stroke-dashoffset="2000" ><animate attributeName="stroke-dashoffset" keyTimes="0.0000;0.1143;0.2929;1.0000" values="2000;2000;0;0" dur="14s" begin="ln-play.begin+0s" fill="freeze"/></path><path d="M 60 450 L 600 450 L 750 300 L 900.0 150" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="2000" stroke-dashoffset="2000" ><animate attributeName="stroke-dashoffset" keyTimes="0.0000;0.1250;0.3036;1.0000" values="2000;2000;0;0" dur="14s" begin="ln-play.begin+0s" fill="freeze"/></path></g>
<g class="part" data-part="obj" data-name="Object" data-info="Placed beyond 2F (more than two focal lengths from the lens)." tabindex="0" role="button" aria-label="Object"><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.3143;0.3357;1.0000" values="0;0;1;1" dur="14s" begin="ln-play.begin+0s" fill="freeze"/><line x1="200" y1="300" x2="200" y2="190" stroke="#111827" stroke-width="5" marker-end="url(#ln-111827)"/><text x="200" y="172" text-anchor="middle" font-size="14" font-weight="700">object</text></g></g>
<g class="part" data-part="r1" data-name="Ray 1" data-info="Parallel to the axis, then refracted through F on the far side." tabindex="0" role="button" aria-label="Ray 1"><path d="M 200 190 L 600 190 L 840.0 366.0 L 1000.0 483.3333333333333" fill="none" stroke="#dc2626" stroke-width="3" stroke-dasharray="2000" stroke-dashoffset="2000" ><animate attributeName="stroke-dashoffset" keyTimes="0.0000;0.3429;0.4571;1.0000" values="2000;2000;0;0" dur="14s" begin="ln-play.begin+0s" fill="freeze"/></path></g>
<g class="part" data-part="r2" data-name="Ray 2" data-info="Through the optical centre: it carries straight on, undeviated." tabindex="0" role="button" aria-label="Ray 2"><path d="M 200 190 L 600 300 L 1000.0 410.0" fill="none" stroke="#15803d" stroke-width="3" stroke-dasharray="2000" stroke-dashoffset="2000" ><animate attributeName="stroke-dashoffset" keyTimes="0.0000;0.4857;0.6000;1.0000" values="2000;2000;0;0" dur="14s" begin="ln-play.begin+0s" fill="freeze"/></path></g>
<g class="part" data-part="r3" data-name="Ray 3" data-info="Through F on the near side, then refracted to leave parallel to the axis." tabindex="0" role="button" aria-label="Ray 3"><path d="M 200 190 L 600 366.0 L 1000.0 366.0" fill="none" stroke="#7c3aed" stroke-width="3" stroke-dasharray="2000" stroke-dashoffset="2000" ><animate attributeName="stroke-dashoffset" keyTimes="0.0000;0.6286;0.7429;1.0000" values="2000;2000;0;0" dur="14s" begin="ln-play.begin+0s" fill="freeze"/></path></g>
<g class="part" data-part="img" data-name="Image" data-info="Real (light really meets there; it can be shown on a screen), inverted and diminished, between F and 2F on the other side. Like a camera or the eye." tabindex="0" role="button" aria-label="Image"><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.7571;0.7786;1.0000" values="0;0;1;1" dur="14s" begin="ln-play.begin+0s" fill="freeze"/><line x1="840.0" y1="300" x2="840.0" y2="366.0" stroke="#2563eb" stroke-width="5" marker-end="url(#ln-2563eb)"/><text x="852.0" y="390.0" font-size="14" font-weight="700" fill="#1d4ed8">image: real, inverted, diminished</text></g></g>
<g class="labels"><g class="lbl" data-for="lens"><polyline points="675.0,94.0 614.0,130.0"/><circle cx="614.0" cy="130.0" r="2.6"/><text x="680" y="100" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="4">Converging lens</text></g><g class="lbl" data-for="axis"><polyline points="100.0,340.0 100.0,300.0"/><circle cx="100.0" cy="300.0" r="2.6"/><text x="100" y="360" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="4">Principal axis</text></g></g>
</svg>