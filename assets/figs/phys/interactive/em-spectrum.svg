<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" class="vd-svg" role="img" aria-labelledby="em-title em-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="em-play" data-vd-play-label="Play: from radio to gamma" data-vd-steps="[[0, &quot;The electromagnetic spectrum: one family of transverse waves, all travelling at 3.00 \u00d7 10\u2078 m/s in a vacuum.&quot;], [1.0, &quot;Radio: wavelength &gt; 0.1 m. Uses: broadcasting, communications.&quot;], [2.7, &quot;Microwave: wavelength 1 mm \u2013 0.1 m. Uses: cooking, mobile phones, satellites.&quot;], [4.4, &quot;Infrared: wavelength 700 nm \u2013 1 mm. Uses: heaters, remote controls, thermal imaging.&quot;], [6.1, &quot;Visible: wavelength 400 \u2013 700 nm. Uses: seeing, optical fibres, photography.&quot;], [7.8, &quot;Ultraviolet: wavelength 10 \u2013 400 nm. Uses: sterilising, sun tanning, security marks.&quot;], [9.5, &quot;X-ray: wavelength 0.01 \u2013 10 nm. Uses: medical imaging, airport scanners.&quot;], [11.2, &quot;Gamma: wavelength &lt; 0.01 nm. Uses: cancer treatment, sterilising equipment.&quot;]]" data-vd-dur="14">
<title id="em-title">The electromagnetic spectrum</title><desc id="em-desc">Seven regions from radio to gamma rays with wavelength decreasing and frequency and energy increasing. Play: a wave shortens in wavelength as it moves across the regions.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1200" height="520" fill="#ffffff"/>
<g aria-hidden="true"><animate id="em-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<defs><marker id="em-334155" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#334155"/></marker></defs>
<defs><linearGradient id="em-vis" x1="0" x2="1"><stop offset="0" stop-color="#ef4444"/><stop offset=".2" stop-color="#f97316"/><stop offset=".4" stop-color="#facc15"/><stop offset=".6" stop-color="#22c55e"/><stop offset=".8" stop-color="#3b82f6"/><stop offset="1" stop-color="#7c3aed"/></linearGradient></defs>
<text class="head" x="30" y="34">The electromagnetic spectrum</text><text class="note" x="30" y="56">Wavelength ranges are approximate; the scale is not linear.</text>
<g class="part" data-part="band" data-name="Regions of the spectrum" data-info="From long to short wavelength: radio, microwaves, infrared, visible, ultraviolet, X-rays, gamma rays. They form a continuous spectrum." tabindex="0" role="button" aria-label="Regions of the spectrum"><rect x="40" y="120" width="160" height="80" fill="#fca5a5" stroke="#fff" stroke-width="2"/><text x="120.0" y="165" text-anchor="middle" font-size="16" font-weight="800" fill="#111827" paint-order="stroke" stroke="#fff" stroke-width="0">Radio</text><text x="120.0" y="220" text-anchor="middle" font-size="12">> 0.1 m</text><rect x="200" y="120" width="160" height="80" fill="#fdba74" stroke="#fff" stroke-width="2"/><text x="280.0" y="165" text-anchor="middle" font-size="16" font-weight="800" fill="#111827" paint-order="stroke" stroke="#fff" stroke-width="0">Microwave</text><text x="280.0" y="220" text-anchor="middle" font-size="12">1 mm – 0.1 m</text><rect x="360" y="120" width="160" height="80" fill="#fcd34d" stroke="#fff" stroke-width="2"/><text x="440.0" y="165" text-anchor="middle" font-size="16" font-weight="800" fill="#111827" paint-order="stroke" stroke="#fff" stroke-width="0">Infrared</text><text x="440.0" y="220" text-anchor="middle" font-size="12">700 nm – 1 mm</text><rect x="520" y="120" width="160" height="80" fill="url(#em-vis)" stroke="#fff" stroke-width="2"/><text x="600.0" y="165" text-anchor="middle" font-size="16" font-weight="800" fill="#111827" paint-order="stroke" stroke="#fff" stroke-width="4">Visible</text><text x="600.0" y="220" text-anchor="middle" font-size="12">400 – 700 nm</text><rect x="680" y="120" width="160" height="80" fill="#c4b5fd" stroke="#fff" stroke-width="2"/><text x="760.0" y="165" text-anchor="middle" font-size="16" font-weight="800" fill="#111827" paint-order="stroke" stroke="#fff" stroke-width="0">Ultraviolet</text><text x="760.0" y="220" text-anchor="middle" font-size="12">10 – 400 nm</text><rect x="840" y="120" width="160" height="80" fill="#a5b4fc" stroke="#fff" stroke-width="2"/><text x="920.0" y="165" text-anchor="middle" font-size="16" font-weight="800" fill="#111827" paint-order="stroke" stroke="#fff" stroke-width="0">X-ray</text><text x="920.0" y="220" text-anchor="middle" font-size="12">0.01 – 10 nm</text><rect x="1000" y="120" width="160" height="80" fill="#93c5fd" stroke="#fff" stroke-width="2"/><text x="1080.0" y="165" text-anchor="middle" font-size="16" font-weight="800" fill="#111827" paint-order="stroke" stroke="#fff" stroke-width="0">Gamma</text><text x="1080.0" y="220" text-anchor="middle" font-size="12">< 0.01 nm</text></g>
<g class="part" data-part="vis" data-name="Visible light" data-info="The only part our eyes detect: about 700 nm (red) to 400 nm (violet)." tabindex="0" role="button" aria-label="Visible light"><rect x="520" y="120" width="160" height="80" fill="none" stroke="#111827" stroke-width="3"/><text x="526" y="114" font-size="11">700 nm</text><text x="674" y="114" text-anchor="end" font-size="11">400 nm</text></g>
<g class="part" data-part="lam" data-name="Wavelength" data-info="Decreases from radio waves (metres to kilometres) to gamma rays (smaller than an atomic nucleus)." tabindex="0" role="button" aria-label="Wavelength"><line x1="1160" y1="270" x2="40" y2="270" stroke="#334155" stroke-width="3" marker-end="url(#em-334155)"/><text x="60" y="262" font-size="14" font-weight="700">longer wavelength</text></g>
<g class="part" data-part="f" data-name="Frequency and energy" data-info="Increase from radio to gamma. Photon energy E = hf, so gamma rays carry the most energy per photon and are the most dangerous (ionising)." tabindex="0" role="button" aria-label="Frequency and energy"><line x1="40" y1="300" x2="1160" y2="300" stroke="#334155" stroke-width="3" marker-end="url(#em-334155)"/><text x="1140" y="292" text-anchor="end" font-size="14" font-weight="700">higher frequency and energy</text></g>
<g class="part" data-part="c" data-name="Speed in a vacuum" data-info="All electromagnetic waves travel at 3.00 × 10⁸ m/s in a vacuum: c = f λ." tabindex="0" role="button" aria-label="Speed in a vacuum"><text x="600" y="490" text-anchor="middle" font-size="15" font-weight="700">All travel at c = 3.00 × 10⁸ m/s in a vacuum;  c = f λ</text></g>
