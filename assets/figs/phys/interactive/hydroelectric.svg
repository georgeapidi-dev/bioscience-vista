<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" class="vd-svg" role="img" aria-labelledby="hy-title hy-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="hy-play" data-vd-play-label="Play: water to electricity" data-vd-steps="[[0, &quot;A hydroelectric power station. Water stored high in the reservoir has gravitational potential energy.&quot;], [1.5, &quot;Water flows down the penstock: gravitational potential energy \u2192 kinetic energy.&quot;], [4, &quot;The water spins the turbine, which turns the generator: kinetic energy \u2192 electrical energy.&quot;], [7, &quot;A transformer steps up the voltage and the electricity goes out along the National Grid.&quot;], [9.5, &quot;Renewable and reliable (output can be changed quickly), but flooding a valley destroys habitats and homes.&quot;]]" data-vd-dur="12">
<title id="hy-title">Hydroelectric power</title><desc id="hy-desc">A reservoir behind a dam, a penstock carrying water down to a turbine and generator, a transformer and power lines, with the energy transfers from gravitational potential to kinetic to electrical.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1200" height="620" fill="#ffffff"/>
<g aria-hidden="true"><animate id="hy-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<text class="head" x="30" y="34">Hydroelectric power</text><text class="note" x="30" y="56">Cross-section, simplified and not to scale.</text>
<path d="M 20 560 L 20 300 Q 200 280 380 300 L 470 560 Z" fill="#a16207" opacity=".5"/>
<g class="part" data-part="res" data-name="Reservoir" data-info="Water stored high up behind the dam has gravitational potential energy (GPE = mgh)." tabindex="0" role="button" aria-label="Reservoir"><path d="M 20 170 L 400 170 L 440 560 L 20 560 Z" fill="#38bdf8" opacity=".75"/><text x="180" y="240" text-anchor="middle" font-size="16" font-weight="800" fill="#0c4a6e">reservoir</text><text x="180" y="262" text-anchor="middle" font-size="13" fill="#0c4a6e">gravitational potential energy</text></g>
<g class="part" data-part="dam" data-name="Dam" data-info="Holds back the water, creating the height difference." tabindex="0" role="button" aria-label="Dam"><path d="M 400 130 L 470 130 L 560 560 L 400 560 Z" fill="#a8a29e" stroke="#57534e" stroke-width="3"/></g>
<g class="part" data-part="pen" data-name="Penstock" data-info="Pipe where the water falls: GPE is transferred to kinetic energy." tabindex="0" role="button" aria-label="Penstock"><path d="M 410 470 L 560 520 L 640 540" fill="none" stroke="#475569" stroke-width="30" stroke-linejoin="round"/><path d="M 410 470 L 560 520 L 640 540" fill="none" stroke="#7dd3fc" stroke-width="20" stroke-linejoin="round"/></g>
<path d="M 560 560 L 1180 560 L 1180 600 L 20 600 L 20 560 Z" fill="#78716c"/>
<g class="part" data-part="river" data-name="Outflow" data-info="The water returns to the river at a lower level." tabindex="0" role="button" aria-label="Outflow"><path d="M 700 548 L 1180 548 L 1180 560 L 700 560 Z" fill="#38bdf8"/><text x="1000" y="540" font-size="13" fill="#0369a1">river</text></g>
<g class="part" data-part="tur" data-name="Turbine" data-info="Fast-moving water pushes the blades round: kinetic energy of the water → kinetic (rotational) energy of the turbine." tabindex="0" role="button" aria-label="Turbine"><rect x="620" y="490" width="100" height="70" rx="8" fill="#e2e8f0" stroke="#334155" stroke-width="2"/><g transform="translate(670 525)"><g><animateTransform attributeName="transform" type="rotate" keyTimes="0.0000;0.2500;1.0000" values="0 0 0;0 0 0;1800 0 0" dur="12s" begin="hy-play.begin+0s" fill="freeze"/><path d="M 0 0 L 26.0 0.0" stroke="#1f2937" stroke-width="7" stroke-linecap="round"/><path d="M 0 0 L 18.4 18.4" stroke="#1f2937" stroke-width="7" stroke-linecap="round"/><path d="M 0 0 L 0.0 26.0" stroke="#1f2937" stroke-width="7" stroke-linecap="round"/><path d="M 0 0 L -18.4 18.4" stroke="#1f2937" stroke-width="7" stroke-linecap="round"/><path d="M 0 0 L -26.0 0.0" stroke="#1f2937" stroke-width="7" stroke-linecap="round"/><path d="M 0 0 L -18.4 -18.4" stroke="#1f2937" stroke-width="7" stroke-linecap="round"/><path d="M 0 0 L -0.0 -26.0" stroke="#1f2937" stroke-width="7" stroke-linecap="round"/><path d="M 0 0 L 18.4 -18.4" stroke="#1f2937" stroke-width="7" stroke-linecap="round"/><circle r="8" fill="#64748b"/></g></g><text x="670" y="482" text-anchor="middle" font-size="13" font-weight="700">turbine</text></g>
<g class="part" data-part="gen" data-name="Generator" data-info="The turbine turns a coil in a magnetic field: electromagnetic induction produces electrical energy." tabindex="0" role="button" aria-label="Generator"><line x1="670" y1="490" x2="670" y2="420" stroke="#334155" stroke-width="8"/><rect x="620" y="360" width="100" height="62" rx="10" fill="#fde68a" stroke="#92400e" stroke-width="2"/><text x="670" y="396" text-anchor="middle" font-size="13" font-weight="800">generator</text></g>
<g class="part" data-part="grid" data-name="Transformer and power lines" data-info="A step-up transformer increases the voltage so less energy is wasted as heat in the cables of the National Grid." tabindex="0" role="button" aria-label="Transformer and power lines"><path d="M 720 390 L 800 390" stroke="#111827" stroke-width="3"/><rect x="800" y="370" width="50" height="40" fill="#cbd5e1" stroke="#334155"/><text x="825" y="364" text-anchor="middle" font-size="11">transformer</text><path d="M 850 390 L 940 300 L 1090 300" stroke="#111827" stroke-width="3" fill="none"/><path d="M 920 560 L 940 260 L 960 560 M 925 300 L 955 300" stroke="#475569" stroke-width="3" fill="none"/><path d="M 1070 560 L 1090 260 L 1110 560 M 1075 300 L 1105 300" stroke="#475569" stroke-width="3" fill="none"/></g>
