<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" class="vd-svg" role="img" aria-labelledby="sk-title sk-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="sk-play" data-vd-play-label="Play: the jump" data-vd-steps="[[0, &quot;A skydiver of mass 80 kg jumps from a plane.&quot;], [1, &quot;At the start only weight acts: the skydiver accelerates at 9.8 m/s\u00b2.&quot;], [3, &quot;As the speed increases, air resistance increases, so the resultant force and the acceleration decrease.&quot;], [6, &quot;Air resistance = weight: no resultant force, so the speed is constant: terminal velocity.&quot;], [9, &quot;The parachute opens: air resistance is now much bigger than weight, so the skydiver decelerates.&quot;], [12, &quot;As the speed falls, air resistance falls until it equals the weight again: a new, lower terminal velocity.&quot;]]" data-vd-dur="16">
<title id="sk-title">Skydiver and terminal velocity</title><desc id="sk-desc">A skydiver with weight and air resistance arrows that change size, beside a velocity–time graph: acceleration, terminal velocity, parachute opening, deceleration and a lower terminal velocity.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
