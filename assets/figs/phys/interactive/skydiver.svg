<g class="part" data-part="tv1" data-name="Terminal velocity" data-info="Air resistance = weight, so the resultant force is zero and the speed stays constant (about 55 m/s, freefall)." tabindex="0" role="button" aria-label="Terminal velocity"><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.3750;0.3937;1.0000" values="0;0;1;1" dur="16s" begin="sk-play.begin+0s" fill="freeze"/><text x="685.3333333333334" y="144.66666666666669" font-size="13" font-weight="700" fill="#6d28d9">terminal velocity (≈55 m/s)</text></g></g>
<g class="part" data-part="para" data-name="Parachute opens" data-info="Air resistance becomes much bigger than the weight: the resultant force is upwards, so the skydiver slows down." tabindex="0" role="button" aria-label="Parachute opens"><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.5938;0.6125;1.0000" values="0;0;1;1" dur="16s" begin="sk-play.begin+0s" fill="freeze"/><line x1="850.6666666666667" y1="560" x2="850.6666666666667" y2="120" stroke="#f97316" stroke-dasharray="5 4" stroke-width="2"/><text x="856.6666666666667" y="340.0" font-size="13" font-weight="700" fill="#c2410c">parachute opens</text></g></g>
<g class="part" data-part="tv2" data-name="Lower terminal velocity" data-info="Air resistance falls as the speed falls, until it equals the weight again: about 5 m/s, slow enough to land safely." tabindex="0" role="button" aria-label="Lower terminal velocity"><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.7812;0.8000;1.0000" values="0;0;1;1" dur="16s" begin="sk-play.begin+0s" fill="freeze"/><text x="995.3333333333334" y="511.33333333333337" font-size="13" font-weight="700" fill="#6d28d9">lower terminal velocity (≈5 m/s)</text></g></g>
<g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.0625;0.0813;0.3438;0.3625;1.0000" values="0;0;1;1;0;0" dur="16s" begin="sk-play.begin+0s" fill="freeze"/><rect x="60.0" y="588" width="280" height="24" rx="12" fill="#fee2e2" stroke="#1f2937" stroke-width="1"/><text x="200" y="605" text-anchor="middle" font-size="12" font-weight="700">weight > air resistance: accelerates</text></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.3625;0.3812;0.6125;0.6313;1.0000" values="0;0;1;1;0;0" dur="16s" begin="sk-play.begin+0s" fill="freeze"/><rect x="70.0" y="588" width="260" height="24" rx="12" fill="#f1f5f9" stroke="#1f2937" stroke-width="1"/><text x="200" y="605" text-anchor="middle" font-size="12" font-weight="700">forces balanced: constant speed</text></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.6250;0.6438;0.7750;0.7938;1.0000" values="0;0;1;1;0;0" dur="16s" begin="sk-play.begin+0s" fill="freeze"/><rect x="60.0" y="588" width="280" height="24" rx="12" fill="#dbeafe" stroke="#1f2937" stroke-width="1"/><text x="200" y="605" text-anchor="middle" font-size="12" font-weight="700">air resistance > weight: slows down</text></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.7875;0.8063;1.0000" values="0;0;1;1" dur="16s" begin="sk-play.begin+0s" fill="freeze"/><rect x="60.0" y="588" width="280" height="24" rx="12" fill="#f1f5f9" stroke="#1f2937" stroke-width="1"/><text x="200" y="605" text-anchor="middle" font-size="12" font-weight="700">balanced again: steady, slow descent</text></g>
</svg>