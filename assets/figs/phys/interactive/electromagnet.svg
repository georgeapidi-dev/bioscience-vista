<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" class="vd-svg" role="img" aria-labelledby="em2-title em2-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="em2-play" data-vd-play-label="Play: switch on, then off" data-vd-steps="[[0, &quot;A coil of insulated wire wound on a soft-iron core, connected to a cell and a switch. The switch is open.&quot;], [2, &quot;Switch on: current flows in the coil and makes a magnetic field like a bar magnet\u2019s. The soft iron is magnetised and makes the field much stronger.&quot;], [4, &quot;The electromagnet attracts iron objects. The right-hand grip rule gives which end is the north pole.&quot;], [8, &quot;Switch off: the soft iron loses its magnetism at once, so the clips fall. That is why soft iron is used, not steel.&quot;]]" data-vd-dur="12">
<title id="em2-title">An electromagnet</title><desc id="em2-desc">A coil on a soft-iron core with a cell and switch. When switched on, a magnetic field like a bar magnet’s appears and paper clips are attracted; when switched off the field disappears and the clips fall.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1200" height="600" fill="#ffffff"/>
<g aria-hidden="true"><animate id="em2-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<defs><marker id="em2-7c3aed" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#7c3aed"/></marker></defs>
<text class="head" x="30" y="34">An electromagnet</text><text class="note" x="30" y="56">Field lines drawn while the current is on.</text>
<g class="part" data-part="core" data-name="Soft-iron core" data-info="Becomes strongly magnetised while current flows, making the field much stronger; loses its magnetism as soon as the current stops." tabindex="0" role="button" aria-label="Soft-iron core"><rect x="380" y="260" width="380" height="80" rx="8" fill="#a8a29e" stroke="#44403c" stroke-width="3"/></g>
<g class="part" data-part="coil" data-name="Coil (solenoid)" data-info="Insulated wire wound round the core. More turns or more current make a stronger electromagnet." tabindex="0" role="button" aria-label="Coil (solenoid)"><path d="M 400 248 Q 414 300 404 352" fill="none" stroke="#b45309" stroke-width="7"/><path d="M 426 248 Q 440 300 430 352" fill="none" stroke="#b45309" stroke-width="7"/><path d="M 452 248 Q 466 300 456 352" fill="none" stroke="#b45309" stroke-width="7"/><path d="M 478 248 Q 492 300 482 352" fill="none" stroke="#b45309" stroke-width="7"/><path d="M 504 248 Q 518 300 508 352" fill="none" stroke="#b45309" stroke-width="7"/><path d="M 530 248 Q 544 300 534 352" fill="none" stroke="#b45309" stroke-width="7"/><path d="M 556 248 Q 570 300 560 352" fill="none" stroke="#b45309" stroke-width="7"/><path d="M 582 248 Q 596 300 586 352" fill="none" stroke="#b45309" stroke-width="7"/><path d="M 608 248 Q 622 300 612 352" fill="none" stroke="#b45309" stroke-width="7"/><path d="M 634 248 Q 648 300 638 352" fill="none" stroke="#b45309" stroke-width="7"/><path d="M 660 248 Q 674 300 664 352" fill="none" stroke="#b45309" stroke-width="7"/><path d="M 686 248 Q 700 300 690 352" fill="none" stroke="#b45309" stroke-width="7"/><path d="M 712 248 Q 726 300 716 352" fill="none" stroke="#b45309" stroke-width="7"/><path d="M 738 248 Q 752 300 742 352" fill="none" stroke="#b45309" stroke-width="7"/><path d="M 404 352 L 404 540 L 520 540 M 620 540 L 736 540 L 736 352" fill="none" stroke="#b45309" stroke-width="5"/></g>
<g class="part" data-part="sw" data-name="Switch and cell" data-info="The electromagnet can be switched on and off: used in relays, scrap-metal cranes, door locks and bells." tabindex="0" role="button" aria-label="Switch and cell"><line x1="526" y1="520" x2="526" y2="560" stroke="#111827" stroke-width="4"/><line x1="540" y1="530" x2="540" y2="550" stroke="#111827" stroke-width="8"/><line x1="520" y1="540" x2="526" y2="540" stroke="#111827" stroke-width="3"/><line x1="540" y1="540" x2="575" y2="540" stroke="#111827" stroke-width="3"/><circle cx="575" cy="540" r="4" fill="#111827"/><circle cx="615" cy="540" r="4" fill="#111827"/><g transform="rotate(-30 575 540)"><animateTransform attributeName="transform" type="rotate" keyTimes="0.0000;0.1333;0.1667;0.6417;0.6667;1.0000" values="-30 575 540;-30 575 540;0 575 540;0 575 540;-30 575 540;-30 575 540" dur="12s" begin="em2-play.begin+0s" fill="freeze"/><line x1="575" y1="540" x2="615" y2="540" stroke="#111827" stroke-width="3"/></g><text x="533" y="588" text-anchor="middle" font-size="12">cell</text><text x="595" y="588" text-anchor="middle" font-size="12">switch</text></g>
<g class="part" data-part="field" data-name="Magnetic field" data-info="Like a bar magnet’s. The right-hand grip rule gives the north pole: fingers curl with the current, thumb points to N." tabindex="0" role="button" aria-label="Magnetic field"><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.1833;0.2083;0.6667;0.6917;1.0000" values="0;0;1;1;0;0" dur="12s" begin="em2-play.begin+0s" fill="freeze"/><path d="M 770 290 C 820 220 320 220 370 290" fill="none" stroke="#7c3aed" stroke-width="2.5" marker-mid="url(#em2-7c3aed)"/><path d="M 770 310 C 820 380 320 380 370 310" fill="none" stroke="#7c3aed" stroke-width="2.5"/><path d="M 770 290 C 860 170 280 170 370 290" fill="none" stroke="#7c3aed" stroke-width="2.5" marker-mid="url(#em2-7c3aed)"/><path d="M 770 310 C 860 430 280 430 370 310" fill="none" stroke="#7c3aed" stroke-width="2.5"/><path d="M 770 290 C 900 120 240 120 370 290" fill="none" stroke="#7c3aed" stroke-width="2.5" marker-mid="url(#em2-7c3aed)"/><path d="M 770 310 C 900 480 240 480 370 310" fill="none" stroke="#7c3aed" stroke-width="2.5"/><path d="M 570 238 l 14 -7 l 0 14 z" fill="#7c3aed"/><path d="M 570 362 l 14 -7 l 0 14 z" fill="#7c3aed"/><path d="M 570 200 l 14 -7 l 0 14 z" fill="#7c3aed"/><path d="M 570 400 l 14 -7 l 0 14 z" fill="#7c3aed"/><path d="M 570 162 l 14 -7 l 0 14 z" fill="#7c3aed"/><path d="M 570 438 l 14 -7 l 0 14 z" fill="#7c3aed"/><text x="774" y="260" font-size="26" font-weight="800" fill="#b91c1c">N</text><text x="330" y="308" font-size="26" font-weight="800" fill="#1d4ed8">S</text></g></g>
<g class="part" data-part="clips" data-name="Iron paper clips" data-info="Attracted when the current is on; they fall when it is switched off." tabindex="0" role="button" aria-label="Iron paper clips"><g transform="translate(860 520)"><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.2167;0.2667;0.6667;0.7167;1.0000" values="860 520;860 520;766 276;766 276;860 520;860 520" dur="12s" begin="em2-play.begin+0s" fill="freeze"/><path d="M 0 0 L 0 40 Q 0 48 8 48 Q 16 48 16 40 L 16 8 Q 16 2 11 2 Q 6 2 6 8 L 6 34" fill="none" stroke="#475569" stroke-width="3"/></g><g transform="translate(890 520)"><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.2333;0.2833;0.6667;0.7167;1.0000" values="890 520;890 520;784 276;784 276;890 520;890 520" dur="12s" begin="em2-play.begin+0s" fill="freeze"/><path d="M 0 0 L 0 40 Q 0 48 8 48 Q 16 48 16 40 L 16 8 Q 16 2 11 2 Q 6 2 6 8 L 6 34" fill="none" stroke="#475569" stroke-width="3"/></g><g transform="translate(920 520)"><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.2500;0.3000;0.6667;0.7167;1.0000" values="920 520;920 520;802 276;802 276;920 520;920 520" dur="12s" begin="em2-play.begin+0s" fill="freeze"/><path d="M 0 0 L 0 40 Q 0 48 8 48 Q 16 48 16 40 L 16 8 Q 16 2 11 2 Q 6 2 6 8 L 6 34" fill="none" stroke="#475569" stroke-width="3"/></g></g>
<g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.1667;0.1917;0.6667;0.6917;1.0000" values="0;0;1;1;0;0" dur="12s" begin="em2-play.begin+0s" fill="freeze"/><rect x="505.0" y="128" width="190" height="24" rx="12" fill="#ede9fe" stroke="#1f2937" stroke-width="1"/><text x="600" y="145" text-anchor="middle" font-size="12" font-weight="700">current ON: magnetised</text></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.6750;0.7000;1.0000" values="0;0;1;1" dur="12s" begin="em2-play.begin+0s" fill="freeze"/><rect x="440.0" y="128" width="320" height="24" rx="12" fill="#f1f5f9" stroke="#1f2937" stroke-width="1"/><text x="600" y="145" text-anchor="middle" font-size="12" font-weight="700">current OFF: soft iron loses its magnetism</text></g>
<g class="labels"><g class="lbl" data-for="core"><polyline points="265.9,234.0 390.0,300.0"/><circle cx="390.0" cy="300.0" r="2.6"/><text x="200" y="240" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="4">Soft-iron core</text></g><g class="lbl" data-for="coil"><polyline points="400.7,414.0 500.0,350.0"/><circle cx="500.0" cy="350.0" r="2.6"/><text x="300" y="420" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="4">Coil of insulated wire</text></g></g>
</svg>