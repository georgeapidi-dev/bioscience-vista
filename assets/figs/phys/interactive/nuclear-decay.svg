<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" class="vd-svg" role="img" aria-labelledby="nd-title nd-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="nd-play" data-vd-play-label="Play: alpha, then beta decay" data-vd-steps="[[0, &quot;Two unstable nuclei: radium-226 (88 protons, 138 neutrons) and carbon-14 (6 protons, 8 neutrons).&quot;], [1, &quot;Alpha decay: the radium nucleus emits an alpha particle, 2 protons and 2 neutrons.&quot;], [3.5, &quot;The daughter nucleus is radon-222: mass number down by 4, atomic number down by 2.&quot;], [7, &quot;Beta-minus decay: in the carbon-14 nucleus a neutron changes into a proton and an electron. The electron leaves as a beta particle, with an antineutrino.&quot;], [10, &quot;The daughter nucleus is nitrogen-14: mass number unchanged, atomic number up by 1.&quot;], [12, &quot;In every nuclear equation the top numbers (mass) and bottom numbers (charge) balance.&quot;]]" data-vd-dur="14">
<title id="nd-title">Alpha and beta decay</title><desc id="nd-desc">Alpha decay of radium-226 to radon-222 with the emission of an alpha particle, and beta-minus decay of carbon-14 to nitrogen-14 with an electron and an antineutrino; nuclear equations balance.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1200" height="640" fill="#ffffff"/>
<g aria-hidden="true"><animate id="nd-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<text class="head" x="30" y="34">Alpha and beta-minus decay</text><text class="note" x="30" y="56">Red: protons. Grey: neutrons. Nuclei not to scale; radium is drawn with fewer particles than it has.</text>
<text x="300" y="100" text-anchor="middle" font-size="17" font-weight="700">Alpha decay</text><text x="900" y="100" text-anchor="middle" font-size="17" font-weight="700">Beta-minus decay</text><line x1="600" y1="90" x2="600" y2="600" stroke="#e2e8f0" stroke-width="2"/>
<g class="part" data-part="par" data-name="Parent nucleus" data-info="An unstable nucleus. It decays at random, giving out radiation to become more stable." tabindex="0" role="button" aria-label="Parent nucleus"><circle cx="220.0" cy="260.0" r="7" fill="#94a3b8" stroke="#334155"/><circle cx="206.3" cy="260.0" r="7" fill="#94a3b8" stroke="#334155"/><circle cx="233.7" cy="260.0" r="7" fill="#ef4444" stroke="#7f1d1d"/><circle cx="213.1" cy="248.1" r="7" fill="#ef4444" stroke="#7f1d1d"/><circle cx="213.1" cy="271.9" r="7" fill="#ef4444" stroke="#7f1d1d"/><circle cx="226.9" cy="248.1" r="7" fill="#94a3b8" stroke="#334155"/><circle cx="226.9" cy="271.9" r="7" fill="#ef4444" stroke="#7f1d1d"/><circle cx="199.4" cy="248.1" r="7" fill="#94a3b8" stroke="#334155"/><circle cx="199.4" cy="271.9" r="7" fill="#ef4444" stroke="#7f1d1d"/><circle cx="240.6" cy="248.1" r="7" fill="#ef4444" stroke="#7f1d1d"/><circle cx="240.6" cy="271.9" r="7" fill="#94a3b8" stroke="#334155"/><circle cx="220.0" cy="236.2" r="7" fill="#94a3b8" stroke="#334155"/><circle cx="220.0" cy="283.8" r="7" fill="#94a3b8" stroke="#334155"/><circle cx="192.6" cy="260.0" r="7" fill="#94a3b8" stroke="#334155"/><circle cx="247.4" cy="260.0" r="7" fill="#ef4444" stroke="#7f1d1d"/><circle cx="206.3" cy="236.2" r="7" fill="#94a3b8" stroke="#334155"/><circle cx="206.3" cy="283.8" r="7" fill="#ef4444" stroke="#7f1d1d"/><circle cx="233.7" cy="236.2" r="7" fill="#ef4444" stroke="#7f1d1d"/><circle cx="233.7" cy="283.8" r="7" fill="#ef4444" stroke="#7f1d1d"/><circle cx="185.7" cy="248.1" r="7" fill="#ef4444" stroke="#7f1d1d"/><circle cx="185.7" cy="271.9" r="7" fill="#ef4444" stroke="#7f1d1d"/><circle cx="254.3" cy="248.1" r="7" fill="#94a3b8" stroke="#334155"/><circle cx="254.3" cy="271.9" r="7" fill="#94a3b8" stroke="#334155"/><circle cx="192.6" cy="236.2" r="7" fill="#94a3b8" stroke="#334155"/><circle cx="192.6" cy="283.8" r="7" fill="#94a3b8" stroke="#334155"/><circle cx="247.4" cy="236.2" r="7" fill="#94a3b8" stroke="#334155"/><circle cx="247.4" cy="283.8" r="7" fill="#ef4444" stroke="#7f1d1d"/><circle cx="213.1" cy="224.3" r="7" fill="#94a3b8" stroke="#334155"/><circle cx="213.1" cy="295.7" r="7" fill="#94a3b8" stroke="#334155"/><circle cx="226.9" cy="224.3" r="7" fill="#94a3b8" stroke="#334155"/><circle cx="226.9" cy="295.7" r="7" fill="#94a3b8" stroke="#334155"/><circle cx="178.8" cy="260.0" r="7" fill="#94a3b8" stroke="#334155"/><circle cx="261.2" cy="260.0" r="7" fill="#94a3b8" stroke="#334155"/><circle cx="199.4" cy="224.3" r="7" fill="#ef4444" stroke="#7f1d1d"/><circle cx="199.4" cy="295.7" r="7" fill="#ef4444" stroke="#7f1d1d"/><circle cx="240.6" cy="224.3" r="7" fill="#ef4444" stroke="#7f1d1d"/><circle cx="240.6" cy="295.7" r="7" fill="#94a3b8" stroke="#334155"/><circle cx="178.8" cy="236.2" r="7" fill="#ef4444" stroke="#7f1d1d"/><circle cx="178.8" cy="283.8" r="7" fill="#ef4444" stroke="#7f1d1d"/><circle cx="261.2" cy="236.2" r="7" fill="#94a3b8" stroke="#334155"/><circle cx="261.2" cy="283.8" r="7" fill="#94a3b8" stroke="#334155"/><circle cx="220.0" cy="212.4" r="7" fill="#94a3b8" stroke="#334155"/><circle cx="220.0" cy="307.6" r="7" fill="#94a3b8" stroke="#334155"/><circle cx="172.0" cy="248.1" r="7" fill="#94a3b8" stroke="#334155"/><circle cx="172.0" cy="271.9" r="7" fill="#ef4444" stroke="#7f1d1d"/><circle cx="268.0" cy="248.1" r="7" fill="#94a3b8" stroke="#334155"/><circle cx="268.0" cy="271.9" r="7" fill="#94a3b8" stroke="#334155"/><circle cx="185.7" cy="224.3" r="7" fill="#ef4444" stroke="#7f1d1d"/><g opacity="1"><animate attributeName="opacity" keyTimes="0.0000;0.2357;0.2500;1.0000" values="1;1;0;0" dur="14s" begin="nd-play.begin+0s" fill="freeze"/><text x="200" y="368.3" text-anchor="end" font-size="14.3" fill="#111827">226</text><text x="200" y="389.1" text-anchor="end" font-size="14.3" fill="#111827">88</text><text x="203" y="387.8" font-size="26" font-weight="700" fill="#111827">Ra</text></g><circle cx="840.0" cy="260.0" r="9" fill="#ef4444" stroke="#7f1d1d"/><circle cx="822.4" cy="260.0" r="9" fill="#ef4444" stroke="#7f1d1d"/><circle cx="857.6" cy="260.0" r="9" fill="#94a3b8" stroke="#334155"/><circle cx="831.2" cy="244.7" r="9" fill="#94a3b8" stroke="#334155"/><circle cx="831.2" cy="275.3" r="9" fill="#94a3b8" stroke="#334155"/><circle cx="848.8" cy="244.7" r="9" fill="#ef4444" stroke="#7f1d1d"/><circle cx="848.8" cy="275.3" r="9" fill="#94a3b8" stroke="#334155"/><circle cx="813.5" cy="244.7" r="9" fill="#94a3b8" stroke="#334155"/><circle cx="813.5" cy="275.3" r="9" fill="#ef4444" stroke="#7f1d1d"/><circle cx="866.5" cy="244.7" r="9" fill="#94a3b8" stroke="#334155"/><circle cx="866.5" cy="275.3" r="9" fill="#ef4444" stroke="#7f1d1d"/><circle cx="840.0" cy="229.4" r="9" fill="#94a3b8" stroke="#334155"/><circle cx="840.0" cy="290.6" r="9" fill="#ef4444" stroke="#7f1d1d"/><circle cx="804.7" cy="260.0" r="9" fill="#94a3b8" stroke="#334155"/><g opacity="1"><animate attributeName="opacity" keyTimes="0.0000;0.7000;0.7143;1.0000" values="1;1;0;0" dur="14s" begin="nd-play.begin+0s" fill="freeze"/><text x="820" y="348.3" text-anchor="end" font-size="14.3" fill="#111827">14</text><text x="820" y="369.1" text-anchor="end" font-size="14.3" fill="#111827">6</text><text x="823" y="367.8" font-size="26" font-weight="700" fill="#111827">C</text></g></g>
<g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.2500;0.2714;1.0000" values="0;0;1;1" dur="14s" begin="nd-play.begin+0s" fill="freeze"/><text x="200" y="368.3" text-anchor="end" font-size="14.3" fill="#111827">222</text><text x="200" y="389.1" text-anchor="end" font-size="14.3" fill="#111827">86</text><text x="203" y="387.8" font-size="26" font-weight="700" fill="#111827">Rn</text></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.7143;0.7357;1.0000" values="0;0;1;1" dur="14s" begin="nd-play.begin+0s" fill="freeze"/><text x="820" y="348.3" text-anchor="end" font-size="14.3" fill="#111827">14</text><text x="820" y="369.1" text-anchor="end" font-size="14.3" fill="#111827">7</text><text x="823" y="367.8" font-size="26" font-weight="700" fill="#111827">N</text></g>
<g class="part" data-part="alpha" data-name="Alpha particle" data-info="Two protons and two neutrons (a helium nucleus), ⁴₂He or ⁴₂α." tabindex="0" role="button" aria-label="Alpha particle"><g transform="translate(266 232)"><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.0714;0.2286;1.0000" values="266 232;266 232;480 180;480 180" dur="14s" begin="nd-play.begin+0s" fill="freeze"/><g><circle cx="-7" cy="-7" r="8" fill="#ef4444" stroke="#7f1d1d"/><circle cx="7" cy="7" r="8" fill="#ef4444" stroke="#7f1d1d"/><circle cx="7" cy="-7" r="8" fill="#94a3b8" stroke="#334155"/><circle cx="-7" cy="7" r="8" fill="#94a3b8" stroke="#334155"/></g><text x="18" y="-14" font-size="13" font-weight="700">α</text></g></g>
<g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.2500;0.2714;1.0000" values="0;0;1;1" dur="14s" begin="nd-play.begin+0s" fill="freeze"/><text x="200" y="420" font-size="13" fill="#475569">daughter: radon-222</text></g>
<g class="part" data-part="eq" data-name="Nuclear equations" data-info="Mass numbers (top) and atomic numbers (bottom) must balance on both sides." tabindex="0" role="button" aria-label="Nuclear equations"><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.2500;0.2714;1.0000" values="0;0;1;1" dur="14s" begin="nd-play.begin+0s" fill="freeze"/><g transform="translate(70 520)"><text x="40" y="-11.700000000000001" text-anchor="end" font-size="14.3" fill="#111827">226</text><text x="40" y="9.1" text-anchor="end" font-size="14.3" fill="#111827">88</text><text x="43" y="7.8" font-size="26" font-weight="700" fill="#111827">Ra</text><text x="110" y="8" font-size="26">→</text><text x="190" y="-11.700000000000001" text-anchor="end" font-size="14.3" fill="#111827">222</text><text x="190" y="9.1" text-anchor="end" font-size="14.3" fill="#111827">86</text><text x="193" y="7.8" font-size="26" font-weight="700" fill="#111827">Rn</text><text x="262" y="8" font-size="26">+</text><text x="330" y="-11.700000000000001" text-anchor="end" font-size="14.3" fill="#111827">4</text><text x="330" y="9.1" text-anchor="end" font-size="14.3" fill="#111827">2</text><text x="333" y="7.8" font-size="26" font-weight="700" fill="#111827">He</text></g><text x="70" y="580" font-size="13" fill="#475569">top: 226 = 222 + 4    bottom: 88 = 86 + 2</text></g></g>
<g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.5000;0.5214;0.6143;0.6357;1.0000" values="0;0;1;1;0;0" dur="14s" begin="nd-play.begin+0s" fill="freeze"/><circle cx="857.6" cy="260.0" r="13" fill="none" stroke="#f59e0b" stroke-width="4"/></g>
<g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.6071;0.6214;1.0000" values="0;0;1;1" dur="14s" begin="nd-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.6071;0.7500;1.0000" values="857.64 260.0;857.64 260.0;1100 170;1100 170" dur="14s" begin="nd-play.begin+0s" fill="freeze"/><circle r="7" fill="#2563eb" stroke="#1e3a8a"/><text x="12" y="-8" font-size="13" font-weight="700">β⁻ (e⁻)</text></g></g>
<g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.6071;0.6214;1.0000" values="0;0;1;1" dur="14s" begin="nd-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.6071;0.7500;1.0000" values="857.64 260.0;857.64 260.0;1080 340;1080 340" dur="14s" begin="nd-play.begin+0s" fill="freeze"/><circle r="4" fill="#fff" stroke="#64748b"/><text x="10" y="4" font-size="13">ν̄ (antineutrino)</text></g></g>
<g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.6000;0.6214;1.0000" values="0;0;1;1" dur="14s" begin="nd-play.begin+0s" fill="freeze"/><circle cx="857.6" cy="260.0" r="9" fill="#ef4444" stroke="#7f1d1d"/></g>
<g class="part" data-part="beta" data-name="Beta-minus particle" data-info="A fast electron, ⁰₋₁e, made when a neutron in the nucleus changes into a proton. An antineutrino is also emitted." tabindex="0" role="button" aria-label="Beta-minus particle"><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.5357;0.5571;1.0000" values="0;0;1;1" dur="14s" begin="nd-play.begin+0s" fill="freeze"/><text x="900" y="460" text-anchor="middle" font-size="13" fill="#475569">n → p + e⁻ + ν̄  (inside the nucleus)</text></g></g>
<g class="part" data-part="dau" data-name="Daughter nucleus" data-info="The new nucleus formed: a different element, because the number of protons has changed." tabindex="0" role="button" aria-label="Daughter nucleus"><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.7143;0.7357;1.0000" values="0;0;1;1" dur="14s" begin="nd-play.begin+0s" fill="freeze"/><g transform="translate(660 520)"><text x="40" y="-11.700000000000001" text-anchor="end" font-size="14.3" fill="#111827">14</text><text x="40" y="9.1" text-anchor="end" font-size="14.3" fill="#111827">6</text><text x="43" y="7.8" font-size="26" font-weight="700" fill="#111827">C</text><text x="80" y="8" font-size="26">→</text><text x="150" y="-11.700000000000001" text-anchor="end" font-size="14.3" fill="#111827">14</text><text x="150" y="9.1" text-anchor="end" font-size="14.3" fill="#111827">7</text><text x="153" y="7.8" font-size="26" font-weight="700" fill="#111827">N</text><text x="210" y="8" font-size="26">+</text><text x="270" y="-11.700000000000001" text-anchor="end" font-size="14.3" fill="#111827">0</text><text x="270" y="9.1" text-anchor="end" font-size="14.3" fill="#111827">−1</text><text x="273" y="7.8" font-size="26" font-weight="700" fill="#111827">e</text><text x="320" y="8" font-size="26">+ ν̄</text></g><text x="660" y="580" font-size="13" fill="#475569">top: 14 = 14 + 0    bottom: 6 = 7 + (−1)</text></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.7143;0.7357;1.0000" values="0;0;1;1" dur="14s" begin="nd-play.begin+0s" fill="freeze"/><text x="820" y="420" font-size="13" fill="#475569">daughter: nitrogen-14</text></g></g>
</svg>