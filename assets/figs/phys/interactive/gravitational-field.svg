123.5,514.9 1129.0,515.5 1134.5,516.1 1140.0,516.7" fill="none" stroke="#dc2626" stroke-width="3.5"/><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.0833;0.1083;1.0000" values="0;0;1;1" dur="12s" begin="gf-play.begin+0s" fill="freeze"/><circle cx="810.0" cy="167.6" r="7" fill="#dc2626" stroke="#fff" stroke-width="2"/><text x="820.0" y="159.6" font-size="13" font-weight="700">9.80</text></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.3583;0.3833;1.0000" values="0;0;1;1" dur="12s" begin="gf-play.begin+0s" fill="freeze"/><circle cx="920.0" cy="446.9" r="7" fill="#dc2626" stroke="#fff" stroke-width="2"/><text x="930.0" y="438.9" font-size="13" font-weight="700">2.45</text></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.6083;0.6333;1.0000" values="0;0;1;1" dur="12s" begin="gf-play.begin+0s" fill="freeze"/><circle cx="1030.0" cy="498.6" r="7" fill="#dc2626" stroke="#fff" stroke-width="2"/><text x="1040.0" y="490.6" font-size="13" font-weight="700">1.09</text></g></g>
</svg>