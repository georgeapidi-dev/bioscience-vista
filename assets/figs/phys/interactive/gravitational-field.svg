<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" class="vd-svg" role="img" aria-labelledby="gf-title gf-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="gf-play" data-vd-play-label="Play: move the test mass outwards" data-vd-steps="[[0, &quot;Earth\u2019s gravitational field: field lines point towards the centre of the Earth.&quot;], [1, &quot;At the surface (r = R) a 1 kg mass feels a force of 9.8 N: g = 9.8 N/kg.&quot;], [4, &quot;At twice the distance from the centre (r = 2R), g is 9.8 \u00f7 4 = 2.45 N/kg.&quot;], [7, &quot;At r = 3R, g is 9.8 \u00f7 9 = 1.09 N/kg. g follows an inverse-square law: g = GM/r\u00b2.&quot;]]" data-vd-dur="12">
<title id="gf-title">Gravitational field of the Earth</title><desc id="gf-desc">Radial field lines around the Earth; a 1 kg test mass moves outwards and the force on it falls; a graph of g against distance shows the inverse-square law.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1200" height="620" fill="#ffffff"/>
<g aria-hidden="true"><animate id="gf-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<defs><marker id="gf-64748b" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#64748b"/></marker><marker id="gf-dc2626" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#dc2626"/></marker></defs>
<defs><marker id="gf-m" markerWidth="14" markerHeight="14" refX="7" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L14,7 L0,14 z" fill="#dc2626"/></marker></defs>
<text class="head" x="30" y="34">Earth’s gravitational field</text><text class="note" x="30" y="56">Distances not to scale for the Earth; field lines drawn radially.</text>
<g class="part" data-part="lines" data-name="Field lines" data-info="Show the direction of the force on a mass: towards the centre of the Earth. They spread out with distance, so the field gets weaker." tabindex="0" role="button" aria-label="Field lines"><line x1="580.0" y1="340.0" x2="388.0" y2="340.0" stroke="#64748b" stroke-width="2" marker-end="url(#gf-64748b)"/><line x1="542.5" y1="480.0" x2="376.2" y2="384.0" stroke="#64748b" stroke-width="2" marker-end="url(#gf-64748b)"/><line x1="440.0" y1="582.5" x2="344.0" y2="416.2" stroke="#64748b" stroke-width="2" marker-end="url(#gf-64748b)"/><line x1="300.0" y1="620.0" x2="300.0" y2="428.0" stroke="#64748b" stroke-width="2" marker-end="url(#gf-64748b)"/><line x1="160.0" y1="582.5" x2="256.0" y2="416.2" stroke="#64748b" stroke-width="2" marker-end="url(#gf-64748b)"/><line x1="57.5" y1="480.0" x2="223.8" y2="384.0" stroke="#64748b" stroke-width="2" marker-end="url(#gf-64748b)"/><line x1="20.0" y1="340.0" x2="212.0" y2="340.0" stroke="#64748b" stroke-width="2" marker-end="url(#gf-64748b)"/><line x1="57.5" y1="200.0" x2="223.8" y2="296.0" stroke="#64748b" stroke-width="2" marker-end="url(#gf-64748b)"/><line x1="160.0" y1="97.5" x2="256.0" y2="263.8" stroke="#64748b" stroke-width="2" marker-end="url(#gf-64748b)"/><line x1="300.0" y1="60.0" x2="300.0" y2="252.0" stroke="#64748b" stroke-width="2" marker-end="url(#gf-64748b)"/><line x1="440.0" y1="97.5" x2="344.0" y2="263.8" stroke="#64748b" stroke-width="2" marker-end="url(#gf-64748b)"/><line x1="542.5" y1="200.0" x2="376.2" y2="296.0" stroke="#64748b" stroke-width="2" marker-end="url(#gf-64748b)"/></g>
<g class="part" data-part="earth" data-name="Earth" data-info="Mass M = 6.0 × 10²⁴ kg, radius R = 6400 km." tabindex="0" role="button" aria-label="Earth"><circle cx="300" cy="340" r="80" fill="#60a5fa" stroke="#1e3a8a" stroke-width="3"/><path d="M 250 310 q 30 -20 50 0 q 10 30 -20 40 q -30 0 -30 -40" fill="#4ade80"/><text x="300" y="346" text-anchor="middle" font-size="16" font-weight="800">Earth</text></g>
<circle cx="300" cy="340" r="80" fill="none" stroke="#cbd5e1" stroke-dasharray="4 5"/><text x="384" y="334" font-size="12" fill="#64748b">1R</text>
<circle cx="300" cy="340" r="160" fill="none" stroke="#cbd5e1" stroke-dasharray="4 5"/><text x="464" y="334" font-size="12" fill="#64748b">2R</text>
<circle cx="300" cy="340" r="240" fill="none" stroke="#cbd5e1" stroke-dasharray="4 5"/><text x="544" y="334" font-size="12" fill="#64748b">3R</text>
<g class="part" data-part="mass" data-name="Test mass (1 kg)" data-info="The force on 1 kg is the gravitational field strength g, in N/kg." tabindex="0" role="button" aria-label="Test mass (1 kg)"><g transform="translate(380 340)"><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.0833;0.2917;0.3333;0.5417;0.5833;1.0000" values="0 0;0 0;0 0;80 0;80 0;160 0;160 0" dur="12s" begin="gf-play.begin+0s" fill="freeze"/><rect x="-14" y="-14" width="28" height="28" rx="4" fill="#fbbf24" stroke="#92400e" stroke-width="2"/><text y="5" text-anchor="middle" font-size="11" font-weight="800">1 kg</text><line x1="-16" y1="0" x2="-16" y2="0" stroke="#dc2626" stroke-width="6" marker-end="url(#gf-m)"><animate attributeName="x2" keyTimes="0.0000;0.0833;0.2917;0.3333;0.5417;0.5833;1.0000" values="-104.2;-104.2;-104.2;-38.0;-38.0;-25.8;-25.8" dur="12s" begin="gf-play.begin+0s" fill="freeze"/></line></g></g></g>
<g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.0833;0.1083;0.3250;0.3500;1.0000" values="0;0;1;1;0;0" dur="12s" begin="gf-play.begin+0s" fill="freeze"/><rect x="235.0" y="548" width="130" height="24" rx="12" fill="#fee2e2" stroke="#1f2937" stroke-width="1"/><text x="300" y="565" text-anchor="middle" font-size="12" font-weight="700">g = 9.8 N/kg</text></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.3583;0.3833;0.5750;0.6000;1.0000" values="0;0;1;1;0;0" dur="12s" begin="gf-play.begin+0s" fill="freeze"/><rect x="195.0" y="548" width="210" height="24" rx="12" fill="#fee2e2" stroke="#1f2937" stroke-width="1"/><text x="300" y="565" text-anchor="middle" font-size="12" font-weight="700">g = 2.45 N/kg (one quarter)</text></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.6083;0.6333;1.0000" values="0;0;1;1" dur="12s" begin="gf-play.begin+0s" fill="freeze"/><rect x="200.0" y="548" width="200" height="24" rx="12" fill="#fee2e2" stroke="#1f2937" stroke-width="1"/><text x="300" y="565" text-anchor="middle" font-size="12" font-weight="700">g = 1.09 N/kg (one ninth)</text></g>
