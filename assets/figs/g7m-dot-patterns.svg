<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" width="640" height="220" role="img" aria-label="Dot patterns showing a sequence increasing by three"><rect width="640" height="220" fill="#ffffff"/><style>text{font-family:Arial,Helvetica,sans-serif}.s{opacity:0;animation:fade .6s ease forwards}@keyframes fade{to{opacity:1}}@media (prefers-reduced-motion:reduce){.s{opacity:1;animation:none}}</style><g class="s" style="animation-delay:0.00s"><text x="150" y="40" text-anchor="middle" font-size="16" fill="#1a1a1a">Pattern 1</text></g><g class="s" style="animation-delay:0.25s"><circle cx="150" cy="90" r="9" fill="#1f5fa8"/></g><g class="s" style="animation-delay:0.50s"><circle cx="125" cy="130" r="9" fill="#b3261e"/></g><g class="s" style="animation-delay:0.75s"><circle cx="150" cy="130" r="9" fill="#1f5fa8"/></g><g class="s" style="animation-delay:1.00s"><circle cx="175" cy="130" r="9" fill="#1f5fa8"/></g><g class="s" style="animation-delay:1.25s"><text x="150" y="200" text-anchor="middle" font-size="16" fill="#1a1a1a">4 dots</text></g><g class="s" style="animation-delay:1.50s"><text x="350" y="40" text-anchor="middle" font-size="16" fill="#1a1a1a">Pattern 2</text></g><g class="s" style="animation-delay:1.75s"><circle cx="350" cy="90" r="9" fill="#1f5fa8"/></g><g class="s" style="animation-delay:2.00s"><circle cx="325" cy="130" r="9" fill="#b3261e"/></g><g class="s" style="animation-delay:2.25s"><circle cx="350" cy="130" r="9" fill="#1f5fa8"/></g><g class="s" style="animation-delay:2.50s"><circle cx="375" cy="130" r="9" fill="#1f5fa8"/></g><g class="s" style="animation-delay:2.75s"><circle cx="325" cy="158" r="9" fill="#b3261e"/></g><g class="s" style="animation-delay:3.00s"><circle cx="350" cy="158" r="9" fill="#1f5fa8"/></g><g class="s" style="animation-delay:3.25s"><circle cx="375" cy="158" r="9" fill="#1f5fa8"/></g><g class="s" style="animation-delay:3.50s"><text x="350" y="200" text-anchor="middle" font-size="16" fill="#1a1a1a">7 dots</text></g><g class="s" style="animation-delay:3.75s"><text x="550" y="40" text-anchor="middle" font-size="16" fill="#1a1a1a">Pattern 3</text></g><g class="s" style="animation-delay:4.00s"><circle cx="550" cy="90" r="9" fill="#1f5fa8"/></g><g class="s" style="animation-delay:4.25s"><circle cx="525" cy="130" r="9" fill="#b3261e"/></g><g class="s" style="animation-delay:4.50s"><circle cx="550" cy="130" r="9" fill="#1f5fa8"/></g><g class="s" style="animation-delay:4.75s"><circle cx="575" cy="130" r="9" fill="#1f5fa8"/></g><g class="s" style="animation-delay:5.00s"><circle cx="525" cy="158" r="9" fill="#b3261e"/></g><g class="s" style="animation-delay:5.25s"><circle cx="550" cy="158" r="9" fill="#1f5fa8"/></g><g class="s" style="animation-delay:5.50s"><circle cx="575" cy="158" r="9" fill="#1f5fa8"/></g><g class="s" style="animation-delay:5.75s"><circle cx="525" cy="186" r="9" fill="#b3261e"/></g><g class="s" style="animation-delay:6.00s"><circle cx="550" cy="186" r="9" fill="#1f5fa8"/></g><g class="s" style="animation-delay:6.00s"><circle cx="575" cy="186" r="9" fill="#1f5fa8"/></g><g class="s" style="animation-delay:6.00s"><text x="550" y="200" text-anchor="middle" font-size="16" fill="#1a1a1a">10 dots</text></g></svg>
