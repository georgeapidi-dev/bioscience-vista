<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" width="640" height="200" role="img" aria-label="Repeating strip made by translating one motif"><rect width="640" height="200" fill="#ffffff"/><style>text{font-family:Arial,Helvetica,sans-serif}.s{opacity:0;animation:fade .6s ease forwards}@keyframes fade{to{opacity:1}}@media (prefers-reduced-motion:reduce){.s{opacity:1;animation:none}}</style><g class="s" style="animation-delay:0.00s"><polygon points="60,100 110,60 140,100 110,140" fill="#eaf2fb" stroke="#1f5fa8" stroke-width="2.5" stroke-linejoin="round"/></g><g class="s" style="animation-delay:0.25s"><circle cx="110" cy="100" r="4" fill="#b3261e"/></g><g class="s" style="animation-delay:0.50s"><polygon points="170,100 220,60 250,100 220,140" fill="#fde8c4" stroke="#1f5fa8" stroke-width="2.5" stroke-linejoin="round"/></g><g class="s" style="animation-delay:0.75s"><circle cx="220" cy="100" r="4" fill="#b3261e"/></g><g class="s" style="animation-delay:1.00s"><polygon points="280,100 330,60 360,100 330,140" fill="#dcefdc" stroke="#1f5fa8" stroke-width="2.5" stroke-linejoin="round"/></g><g class="s" style="animation-delay:1.25s"><circle cx="330" cy="100" r="4" fill="#b3261e"/></g><g class="s" style="animation-delay:1.50s"><polygon points="390,100 440,60 470,100 440,140" fill="#eaf2fb" stroke="#1f5fa8" stroke-width="2.5" stroke-linejoin="round"/></g><g class="s" style="animation-delay:1.75s"><circle cx="440" cy="100" r="4" fill="#b3261e"/></g><g class="s" style="animation-delay:2.00s"><polygon points="500,100 550,60 580,100 550,140" fill="#fde8c4" stroke="#1f5fa8" stroke-width="2.5" stroke-linejoin="round"/></g><g class="s" style="animation-delay:2.25s"><circle cx="550" cy="100" r="4" fill="#b3261e"/></g><g class="s" style="animation-delay:2.50s"><line x1="70" y1="180" x2="170" y2="180" stroke="#b3261e" stroke-width="2.5" stroke-linecap="round"/></g><g class="s" style="animation-delay:2.75s"><polygon points="170,180 161.9,183.9 161.9,176.1" fill="#b3261e"/></g><g class="s" style="animation-delay:3.00s"><text x="120" y="175" text-anchor="middle" font-size="14" fill="#b3261e">translate 2 squares</text></g><g class="s" style="animation-delay:3.25s"><text x="320" y="190" text-anchor="middle" font-size="14" fill="#8a8a8a">Same motif, same size, same direction</text></g></svg>
