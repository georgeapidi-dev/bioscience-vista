<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" role="img" aria-label="Circle with diameter and circumference"><rect width="640" height="300" fill="#ffffff"/><style>text{font-family:Arial,Helvetica,sans-serif}.s{opacity:0;animation:fade .6s ease forwards}@keyframes fade{to{opacity:1}}@media (prefers-reduced-motion:reduce){.s{opacity:1;animation:none}}</style><g class="s" style="animation-delay:0.00s"><circle cx="240" cy="150" r="115" fill="#eaf2fb" stroke="#1a1a1a" stroke-width="3"/></g><g class="s" style="animation-delay:0.25s"><line x1="125" y1="150" x2="355" y2="150" stroke="#1f5fa8" stroke-width="3" stroke-linecap="round"/></g><g class="s" style="animation-delay:0.50s"><text x="240" y="138" text-anchor="middle" font-size="20" fill="#1f5fa8" font-weight="bold">d</text></g><g class="s" style="animation-delay:0.75s"><text x="470" y="130" text-anchor="start" font-size="22" fill="#1a1a1a" font-weight="bold">C = πd</text></g><g class="s" style="animation-delay:1.00s"><text x="470" y="160" text-anchor="start" font-size="18" fill="#1a1a1a">C = 2πr</text></g><g class="s" style="animation-delay:1.25s"><text x="470" y="200" text-anchor="start" font-size="15" fill="#8a8a8a">The circumference is</text></g><g class="s" style="animation-delay:1.50s"><text x="470" y="220" text-anchor="start" font-size="15" fill="#8a8a8a">about 3.14 diameters</text></g></svg>
