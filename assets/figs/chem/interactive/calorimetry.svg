<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 540" class="vd-svg" role="img" aria-labelledby="cm-title cm-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="cm-play" data-vd-play-label="Play: burn the fuel" data-vd-steps="[[0, &quot;Measuring \u0394H: q = mc\u0394T.&quot;], [1, &quot;Burn ethanol under a can of water.&quot;], [5, &quot;Calculate q, then \u0394H per mole.&quot;], [10, &quot;Heat losses make the value less negative than the data book.&quot;]]" data-vd-dur="14">
<title id="cm-title">Calorimetry</title><desc id="cm-desc">A spirit burner heating a can of 200 grams of water by 15 kelvin; q equals mc delta T gives 12 540 joules; dividing by 0.0100 moles gives minus 1 254 kilojoules per mole, less exothermic than the data book value because of heat losses.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="540" fill="#ffffff"/>
<g aria-hidden="true"><animate id="cm-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<text class="head" x="30" y="34">Measuring ΔH: q = mcΔT</text><text class="note" x="30" y="56">c(water) = 4.18 J g⁻¹ K⁻¹.</text>
<g class="part" data-part="app" data-name="Simple calorimeter" data-info="A known mass of water in an insulated cup; measure the temperature change when a reaction occurs or a fuel burns underneath." tabindex="0" role="button" aria-label="Simple calorimeter"><rect x="130" y="160" width="160" height="150" rx="8" fill="#e2e8f0" stroke="#475569" stroke-width="3"/><rect x="138" y="200" width="144" height="104" fill="#93c5fd"/><text x="210" y="260" text-anchor="middle" font-size="13" font-weight="800" fill="#1e3a8a">200 g water</text><rect x="230" y="70" width="10" height="200" fill="#fff" stroke="#334155"/><rect x="232" y="230" width="6" height="36" fill="#dc2626"><animate attributeName="y" keyTimes="0.0000;0.1429;0.3571;1.0000" values="230;230;170;170" dur="14s" begin="cm-play.begin+0s" fill="freeze"/><animate attributeName="height" keyTimes="0.0000;0.1429;0.3571;1.0000" values="36;36;96;96" dur="14s" begin="cm-play.begin+0s" fill="freeze"/></rect><path d="M 170 440 L 250 440 L 240 400 L 180 400 Z" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="2"/><rect x="205" y="380" width="10" height="20" fill="#475569"/><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.0714;0.0929;1.0000" values="0;0;1;1" dur="14s" begin="cm-play.begin+0s" fill="freeze"/><path d="M 196 380 Q 210 330 224 380 Z" fill="#f97316"/></g><text x="210" y="470" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">ethanol burner</text><g><animate attributeName="opacity" keyTimes="0.0000;0.3571;0.3786;1.0000" values="0;0;1;1" dur="14s" begin="cm-play.begin+0s" fill="freeze"/><text x="260" y="120" text-anchor="start" font-size="14" font-weight="800" fill="#b91c1c">ΔT = 15.0 K</text></g></g>
<g class="part" data-part="calc" data-name="q = mcΔT" data-info="Example: burning 0.46 g ethanol (M 46) heats 200 g water by 15.0 K. q = 200 × 4.18 × 15.0 = 12 540 J. n = 0.0100 mol. ΔHc = −12 540 ÷ 0.0100 = −1 254 kJ mol⁻¹." tabindex="0" role="button" aria-label="q = mcΔT"><g><animate attributeName="opacity" keyTimes="0.0000;0.3571;0.3786;1.0000" values="0;0;1;1" dur="14s" begin="cm-play.begin+0s" fill="freeze"/><rect x="420" y="90" width="640" height="270" rx="16" fill="#fef9c3" stroke="#eab308"/><text x="740" y="122" text-anchor="middle" font-size="15" font-weight="800" fill="#111827">q = m c ΔT = 200 × 4.18 × 15.0 = 12 540 J</text><text x="740" y="162" text-anchor="middle" font-size="15" font-weight="800" fill="#111827">n(ethanol) = 0.46 ÷ 46 = 0.0100 mol</text><text x="740" y="202" text-anchor="middle" font-size="15" font-weight="800" fill="#111827">ΔHc = − q ÷ n = −12 540 ÷ 0.0100</text><text x="740" y="248" text-anchor="middle" font-size="22" font-weight="800" fill="#b45309">= −1 254 kJ mol⁻¹</text><text x="740" y="290" text-anchor="middle" font-size="12" font-weight="700" fill="#475569">negative: exothermic (the water got hotter)</text><text x="740" y="330" text-anchor="middle" font-size="12" font-weight="800" fill="#b91c1c">use m of WATER, not of fuel, in q = mcΔT</text></g></g>
<g class="part" data-part="loss" data-name="Why lower than the data book" data-info="Heat lost to the surroundings, incomplete combustion, heating the container, evaporation: experimental values are less exothermic (data book: −1 367 kJ mol⁻¹)." tabindex="0" role="button" aria-label="Why lower than the data book"><g><animate attributeName="opacity" keyTimes="0.0000;0.7143;0.7357;1.0000" values="0;0;1;1" dur="14s" begin="cm-play.begin+0s" fill="freeze"/><rect x="420" y="380" width="640" height="140" rx="16" fill="#fef2f2" stroke="#fecaca"/><text x="740" y="408" text-anchor="middle" font-size="14" font-weight="800" fill="#b91c1c">data book: −1 367 kJ mol⁻¹. Why is ours lower?</text><text x="740" y="440" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">heat lost to surroundings · heating the can</text><text x="740" y="462" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">incomplete combustion (soot) · evaporation of fuel</text><text x="740" y="494" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">non-standard conditions</text></g></g>
</svg>