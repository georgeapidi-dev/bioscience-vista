<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 580" class="vd-svg" role="img" aria-labelledby="gc-title gc-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="gc-play" data-vd-play-label="Play: inject" data-vd-steps="[[0, &quot;Gas\u2013liquid chromatography.&quot;], [1, &quot;Carrier gas sweeps the vaporised sample through the heated column.&quot;], [5, &quot;Components leave at different retention times.&quot;], [10, &quot;Peak areas give the percentage composition.&quot;]]" data-vd-dur="15">
<title id="gc-title">Gas–liquid chromatography</title><desc id="gc-desc">A gas chromatograph with a carrier gas, injection port, coiled heated column and detector, the resulting chromatogram with peaks at different retention times, and the percentage composition from peak areas.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
