<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 540" class="vd-svg" role="img" aria-labelledby="si3-title si3-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="si3-play" data-vd-play-label="Play: rearrange" data-vd-steps="[[0, &quot;Structural isomers: same molecular formula, different structural formula.&quot;], [1, &quot;Chain isomers: C\u2084H\u2081\u2080.&quot;], [5, &quot;Positional isomers: C\u2083H\u2088O.&quot;], [9, &quot;Functional group isomers: C\u2083H\u2086O.&quot;]]" data-vd-dur="14">
<title id="si3-title">Structural isomerism</title><desc id="si3-desc">Skeletal formulas of chain isomers butane and 2-methylpropane, positional isomers propan-1-ol and propan-2-ol, and functional group isomers propanal and propanone.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="540" fill="#ffffff"/>
<g aria-hidden="true"><animate id="si3-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<text class="head" x="30" y="34">Structural isomerism</text><text class="note" x="30" y="56">Same molecular formula, different structure (skeletal formulas).</text>
<g class="part" data-part="chain" data-name="Chain isomers" data-info="Different carbon skeleton: butane and 2-methylpropane (C₄H₁₀)." tabindex="0" role="button" aria-label="Chain isomers"><g><animate attributeName="opacity" keyTimes="0.0000;0.0714;0.0929;1.0000" values="0;0;1;1" dur="14s" begin="si3-play.begin+0s" fill="freeze"/><rect x="30" y="80" width="330" height="430" rx="16" fill="#f8fafc" stroke="#1d4ed8" stroke-width="2"/><text x="195" y="106" text-anchor="middle" font-size="15" font-weight="800" fill="#1d4ed8">chain</text><text x="195" y="130" text-anchor="middle" font-size="14" font-weight="800" fill="#111827">C₄H₁₀</text><polyline points="90,220 140,190 190,220 240,190" fill="none" stroke="#111827" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><text x="195" y="280" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">butane</text><polyline points="110,410 160,380 210,410" fill="none" stroke="#111827" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><line x1="160" y1="380" x2="160" y2="330" stroke="#111827" stroke-width="5"/><text x="195" y="470" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">2-methylpropane</text></g></g>
<g class="part" data-part="pos" data-name="Positional isomers" data-info="Same skeleton, functional group in a different position: propan-1-ol and propan-2-ol (C₃H₈O)." tabindex="0" role="button" aria-label="Positional isomers"><g><animate attributeName="opacity" keyTimes="0.0000;0.3571;0.3786;1.0000" values="0;0;1;1" dur="14s" begin="si3-play.begin+0s" fill="freeze"/><rect x="385" y="80" width="330" height="430" rx="16" fill="#f8fafc" stroke="#16a34a" stroke-width="2"/><text x="550" y="106" text-anchor="middle" font-size="15" font-weight="800" fill="#16a34a">positional</text><text x="550" y="130" text-anchor="middle" font-size="14" font-weight="800" fill="#111827">C₃H₈O</text><polyline points="450,220 500,190 550,220" fill="none" stroke="#111827" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><line x1="550" y1="220" x2="590" y2="196" stroke="#111827" stroke-width="5"/><text x="596" y="200" text-anchor="start" font-size="16" font-weight="800" fill="#ef4444">OH</text><text x="550" y="280" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">propan-1-ol</text><polyline points="470,410 520,380 570,410" fill="none" stroke="#111827" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><line x1="520" y1="380" x2="520" y2="334" stroke="#111827" stroke-width="5"/><text x="520" y="326" text-anchor="middle" font-size="16" font-weight="800" fill="#ef4444">OH</text><text x="550" y="470" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">propan-2-ol</text></g></g>
<g class="part" data-part="fg" data-name="Functional group isomers" data-info="Different functional group: propanal and propanone (C₃H₆O); ethanol and methoxymethane (C₂H₆O)." tabindex="0" role="button" aria-label="Functional group isomers"><g><animate attributeName="opacity" keyTimes="0.0000;0.6429;0.6643;1.0000" values="0;0;1;1" dur="14s" begin="si3-play.begin+0s" fill="freeze"/><rect x="740" y="80" width="330" height="430" rx="16" fill="#f8fafc" stroke="#b45309" stroke-width="2"/><text x="905" y="106" text-anchor="middle" font-size="15" font-weight="800" fill="#b45309">functional group</text><text x="905" y="130" text-anchor="middle" font-size="14" font-weight="800" fill="#111827">C₃H₆O</text><polyline points="790,220 840,190 890,220" fill="none" stroke="#111827" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><line x1="890" y1="220" x2="930" y2="196" stroke="#111827" stroke-width="5"/><line x1="928" y1="196" x2="928" y2="150" stroke="#111827" stroke-width="4"/><line x1="936" y1="196" x2="936" y2="150" stroke="#111827" stroke-width="4"/><text x="932" y="142" text-anchor="middle" font-size="16" font-weight="800" fill="#ef4444">O</text><text x="950" y="210" text-anchor="start" font-size="14" font-weight="800" fill="#111827">H</text><text x="905" y="280" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">propanal (aldehyde)</text><polyline points="830,410 880,380 930,410" fill="none" stroke="#111827" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><line x1="876" y1="380" x2="876" y2="334" stroke="#111827" stroke-width="4"/><line x1="884" y1="380" x2="884" y2="334" stroke="#111827" stroke-width="4"/><text x="880" y="326" text-anchor="middle" font-size="16" font-weight="800" fill="#ef4444">O</text><text x="905" y="470" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">propanone (ketone)</text></g></g>
</svg>