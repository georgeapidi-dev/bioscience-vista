<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" class="vd-svg" role="img" aria-labelledby="ph2-title ph2-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="ph2-play" data-vd-play-label="Play: activate the ring" data-vd-steps="[[0, &quot;Phenol: the OH activates the ring.&quot;], [1, &quot;O lone pair overlaps the \u03c0 system.&quot;], [5, &quot;Bromine water: white precipitate of 2,4,6-tribromophenol, no catalyst.&quot;], [9.5, &quot;Dilute nitric acid at room temperature: 2- and 4-nitrophenol.&quot;], [13, &quot;Phenyl esters need an acyl chloride.&quot;]]" data-vd-dur="16">
<title id="ph2-title">Reactions of phenol</title><desc id="ph2-desc">The oxygen lone pair of phenol overlaps with the ring and activates it: bromine water gives a white precipitate of 2,4,6-tribromophenol at room temperature without a catalyst, and dilute nitric acid gives 2- and 4-nitrophenol.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="560" fill="#ffffff"/>
<g aria-hidden="true"><animate id="ph2-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<text class="head" x="30" y="34">Phenol: an activated ring</text><text class="note" x="30" y="56">Compare with benzene, which needs a catalyst and harsher conditions.</text>
<g class="part" data-part="act" data-name="An activated ring" data-info="A lone pair on O overlaps with the π system, increasing electron density in the ring (especially at 2, 4 and 6). Phenol reacts with electrophiles far more easily than benzene." tabindex="0" role="button" aria-label="An activated ring"><polygon points="180.0,224.0 228.5,252.0 228.5,308.0 180.0,336.0 131.5,308.0 131.5,252.0" fill="#fff" stroke="#111827" stroke-width="4"/><circle cx="180" cy="280" r="34" fill="none" stroke="#111827" stroke-width="3"/><line x1="180" y1="224" x2="180" y2="188" stroke="#111827" stroke-width="4"/><text x="180.0" y="186.0" text-anchor="middle" font-size="15" font-weight="800" fill="#ef4444">OH</text><g><animate attributeName="opacity" keyTimes="0.0000;0.0625;0.0813;1.0000" values="0;0;1;1" dur="16s" begin="ph2-play.begin+0s" fill="freeze"/><ellipse cx="180" cy="200" rx="16" ry="10" fill="#fca5a5" opacity=".7"/><circle cx="180" cy="280" r="70" fill="#fde68a" opacity=".3"/><text x="180" y="380" text-anchor="middle" font-size="12" font-weight="800" fill="#b45309">O lone pair → more electron</text><text x="180" y="398" text-anchor="middle" font-size="12" font-weight="800" fill="#b45309">density in the ring (2, 4, 6)</text></g></g>
<g class="part" data-part="br" data-name="Bromine water" data-info="Room temperature, no catalyst: decolourised, white precipitate of 2,4,6-tribromophenol + 3HBr. A test for phenol." tabindex="0" role="button" aria-label="Bromine water"><rect x="350" y="80" width="340" height="320" rx="16" fill="#f8fafc" stroke="#cbd5e1"/><text x="520" y="106" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">+ 3Br₂(aq), room temp</text><path d="M 470 130 L 470 300 Q 500 318 530 300 L 530 130" fill="#f8fafc" stroke="#334155" stroke-width="2"/><rect x="472" y="200" width="56" height="102" fill="#fb923c"><animate attributeName="fill" keyTimes="0.0000;0.3438;0.4375;1.0000" values="#fb923c;#fb923c;#f8fafc;#f8fafc" dur="16s" begin="ph2-play.begin+0s" fill="freeze"/></rect><circle cx="478" cy="282" r="3" fill="#e5e7eb" stroke="#94a3b8" opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.3750;0.4375;1.0000" values="0;0;1;1" dur="16s" begin="ph2-play.begin+0s" fill="freeze"/></circle><circle cx="487" cy="282" r="3" fill="#e5e7eb" stroke="#94a3b8" opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.3750;0.4375;1.0000" values="0;0;1;1" dur="16s" begin="ph2-play.begin+0s" fill="freeze"/></circle><circle cx="496" cy="282" r="3" fill="#e5e7eb" stroke="#94a3b8" opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.3750;0.4375;1.0000" values="0;0;1;1" dur="16s" begin="ph2-play.begin+0s" fill="freeze"/></circle><circle cx="505" cy="282" r="3" fill="#e5e7eb" stroke="#94a3b8" opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.3750;0.4375;1.0000" values="0;0;1;1" dur="16s" begin="ph2-play.begin+0s" fill="freeze"/></circle><circle cx="514" cy="282" r="3" fill="#e5e7eb" stroke="#94a3b8" opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.3750;0.4375;1.0000" values="0;0;1;1" dur="16s" begin="ph2-play.begin+0s" fill="freeze"/></circle><circle cx="523" cy="288" r="3" fill="#e5e7eb" stroke="#94a3b8" opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.3750;0.4375;1.0000" values="0;0;1;1" dur="16s" begin="ph2-play.begin+0s" fill="freeze"/></circle><circle cx="486" cy="288" r="3" fill="#e5e7eb" stroke="#94a3b8" opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.3750;0.4375;1.0000" values="0;0;1;1" dur="16s" begin="ph2-play.begin+0s" fill="freeze"/></circle><circle cx="495" cy="288" r="3" fill="#e5e7eb" stroke="#94a3b8" opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.3750;0.4375;1.0000" values="0;0;1;1" dur="16s" begin="ph2-play.begin+0s" fill="freeze"/></circle><circle cx="504" cy="288" r="3" fill="#e5e7eb" stroke="#94a3b8" opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.3750;0.4375;1.0000" values="0;0;1;1" dur="16s" begin="ph2-play.begin+0s" fill="freeze"/></circle><circle cx="513" cy="288" r="3" fill="#e5e7eb" stroke="#94a3b8" opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.3750;0.4375;1.0000" values="0;0;1;1" dur="16s" begin="ph2-play.begin+0s" fill="freeze"/></circle><circle cx="522" cy="294" r="3" fill="#e5e7eb" stroke="#94a3b8" opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.3750;0.4375;1.0000" values="0;0;1;1" dur="16s" begin="ph2-play.begin+0s" fill="freeze"/></circle><circle cx="485" cy="294" r="3" fill="#e5e7eb" stroke="#94a3b8" opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.3750;0.4375;1.0000" values="0;0;1;1" dur="16s" begin="ph2-play.begin+0s" fill="freeze"/></circle><circle cx="494" cy="294" r="3" fill="#e5e7eb" stroke="#94a3b8" opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.3750;0.4375;1.0000" values="0;0;1;1" dur="16s" begin="ph2-play.begin+0s" fill="freeze"/></circle><circle cx="503" cy="294" r="3" fill="#e5e7eb" stroke="#94a3b8" opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.3750;0.4375;1.0000" values="0;0;1;1" dur="16s" begin="ph2-play.begin+0s" fill="freeze"/></circle><circle cx="512" cy="294" r="3" fill="#e5e7eb" stroke="#94a3b8" opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.3750;0.4375;1.0000" values="0;0;1;1" dur="16s" begin="ph2-play.begin+0s" fill="freeze"/></circle><g><animate attributeName="opacity" keyTimes="0.0000;0.4375;0.4562;1.0000" values="0;0;1;1" dur="16s" begin="ph2-play.begin+0s" fill="freeze"/><polygon points="620.0,206.0 649.4,223.0 649.4,257.0 620.0,274.0 590.6,257.0 590.6,223.0" fill="#fff" stroke="#111827" stroke-width="3"/><circle cx="620" cy="240" r="20" fill="none" stroke="#111827" stroke-width="3"/><line x1="620" y1="206" x2="620" y2="184" stroke="#111827" stroke-width="4"/><text x="620.0" y="182.0" text-anchor="middle" font-size="12" font-weight="800" fill="#ef4444">OH</text><line x1="649" y1="223" x2="668" y2="212" stroke="#111827" stroke-width="4"/><text x="672.4974226119285" y="210.0" text-anchor="start" font-size="12" font-weight="800" fill="#9a3412">Br</text><line x1="620" y1="274" x2="620" y2="296" stroke="#111827" stroke-width="4"/><text x="620.0" y="302.0" text-anchor="middle" font-size="12" font-weight="800" fill="#9a3412">Br</text><line x1="591" y1="223" x2="572" y2="212" stroke="#111827" stroke-width="4"/><text x="567.5025773880715" y="210.0" text-anchor="end" font-size="12" font-weight="800" fill="#9a3412">Br</text><text x="520" y="360" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">orange → colourless; white ppt</text><text x="520" y="380" text-anchor="middle" font-size="12" font-weight="800" fill="#9a3412">2,4,6-tribromophenol</text></g></g>
<g class="part" data-part="no2" data-name="Nitration" data-info="Dilute HNO₃ at room temperature (benzene needs concentrated HNO₃ + H₂SO₄ at 50 °C): a mixture of 2-nitrophenol and 4-nitrophenol." tabindex="0" role="button" aria-label="Nitration"><rect x="710" y="80" width="360" height="320" rx="16" fill="#f8fafc" stroke="#cbd5e1"/><text x="890" y="106" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">dilute HNO₃, room temp</text><g><animate attributeName="opacity" keyTimes="0.0000;0.5938;0.6125;1.0000" values="0;0;1;1" dur="16s" begin="ph2-play.begin+0s" fill="freeze"/><polygon points="810.0,204.0 841.2,222.0 841.2,258.0 810.0,276.0 778.8,258.0 778.8,222.0" fill="#fff" stroke="#111827" stroke-width="3"/><circle cx="810" cy="240" r="22" fill="none" stroke="#111827" stroke-width="3"/><line x1="810" y1="204" x2="810" y2="182" stroke="#111827" stroke-width="4"/><text x="810.0" y="180.0" text-anchor="middle" font-size="12" font-weight="800" fill="#ef4444">OH</text><line x1="841" y1="222" x2="860" y2="211" stroke="#111827" stroke-width="4"/><text x="864.2294734194975" y="209.0" text-anchor="start" font-size="12" font-weight="800" fill="#7c3aed">NO₂</text><text x="810" y="330" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">2-nitrophenol</text><polygon points="980.0,204.0 1011.2,222.0 1011.2,258.0 980.0,276.0 948.8,258.0 948.8,222.0" fill="#fff" stroke="#111827" stroke-width="3"/><circle cx="980" cy="240" r="22" fill="none" stroke="#111827" stroke-width="3"/><line x1="980" y1="204" x2="980" y2="182" stroke="#111827" stroke-width="4"/><text x="980.0" y="180.0" text-anchor="middle" font-size="12" font-weight="800" fill="#ef4444">OH</text><line x1="980" y1="276" x2="980" y2="298" stroke="#111827" stroke-width="4"/><text x="980.0" y="304.0" text-anchor="middle" font-size="12" font-weight="800" fill="#7c3aed">NO₂</text><text x="980" y="330" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">4-nitrophenol</text><text x="890" y="372" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">benzene needs conc. HNO₃ + H₂SO₄</text></g></g>
<g class="part" data-part="more" data-name="Other reactions" data-info="As an acid: phenol + NaOH → sodium phenoxide + water (dissolves). Phenyl esters: phenol + acyl chloride (not carboxylic acid). Neutral FeCl₃: violet colour (test)." tabindex="0" role="button" aria-label="Other reactions"><g><animate attributeName="opacity" keyTimes="0.0000;0.8125;0.8313;1.0000" values="0;0;1;1" dur="16s" begin="ph2-play.begin+0s" fill="freeze"/><rect x="40" y="420" width="1030" height="120" rx="16" fill="#fef3c7" stroke="#fcd34d"/><text x="555" y="452" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">phenol + NaOH → C₆H₅O⁻Na⁺ + H₂O (dissolves) · phenol + CH₃COCl → phenyl ethanoate + HCl</text><text x="555" y="486" text-anchor="middle" font-size="12" font-weight="700" fill="#475569">phenol does NOT esterify with carboxylic acids · neutral FeCl₃(aq) → violet colour</text></g></g>
</svg>