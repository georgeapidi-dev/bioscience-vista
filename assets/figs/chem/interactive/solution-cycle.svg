<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" class="vd-svg" role="img" aria-labelledby="sc-title sc-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="sc-play" data-vd-play-label="Play: dissolve NaCl" data-vd-steps="[[0, &quot;Dissolving an ionic solid: an energy cycle.&quot;], [1, &quot;Break the lattice into gaseous ions: endothermic.&quot;], [5, &quot;Hydrate the ions: exothermic.&quot;], [9, &quot;\u0394Hsol = \u2212\u0394Hlatt + \u03a3\u0394Hhyd.&quot;], [12, &quot;Small, highly charged ions are strongly hydrated.&quot;]]" data-vd-dur="15">
<title id="sc-title">Enthalpy of solution cycle</title><desc id="sc-desc">An energy cycle for dissolving sodium chloride: the lattice is broken into gaseous ions, which are then hydrated; the enthalpy of solution equals minus the lattice energy plus the sum of the hydration enthalpies; water molecules orientate around the ions.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="560" fill="#ffffff"/>
<g aria-hidden="true"><animate id="sc-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<defs><marker id="sc-b91c1c" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="5.4" refY="6.0" orient="auto"><path d="M0,0 L12,6.0 L0,12 z" fill="#b91c1c"/></marker><marker id="sc-1d4ed8" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="5.4" refY="6.0" orient="auto"><path d="M0,0 L12,6.0 L0,12 z" fill="#1d4ed8"/></marker><marker id="sc-15803d" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="5.4" refY="6.0" orient="auto"><path d="M0,0 L12,6.0 L0,12 z" fill="#15803d"/></marker></defs>
<text class="head" x="30" y="34">Enthalpy change of solution: a Hess cycle</text><text class="note" x="30" y="56">kJ mol⁻¹. Data-book values vary slightly.</text>
<g class="part" data-part="cyc" data-name="The cycle" data-info="ΔH⦵sol = −ΔH⦵latt + ΣΔH⦵hyd. Route 1: dissolve the solid directly. Route 2: break the lattice into gaseous ions (−ΔHlatt, endothermic), then hydrate them." tabindex="0" role="button" aria-label="The cycle"><rect x="180.0" y="92.0" width="300" height="56" rx="12" fill="#f1f5f9" stroke="#475569" stroke-width="2"/><text x="330" y="126.0" text-anchor="middle" font-size="18" font-weight="800" fill="#111827">Na⁺(g) + Cl⁻(g)</text><rect x="30.0" y="412.0" width="220" height="56" rx="12" fill="#f1f5f9" stroke="#475569" stroke-width="2"/><text x="140" y="446.0" text-anchor="middle" font-size="18" font-weight="800" fill="#111827">NaCl(s)</text><rect x="370.0" y="412.0" width="300" height="56" rx="12" fill="#f1f5f9" stroke="#475569" stroke-width="2"/><text x="520" y="446.0" text-anchor="middle" font-size="18" font-weight="800" fill="#111827">Na⁺(aq) + Cl⁻(aq)</text><g><animate attributeName="opacity" keyTimes="0.0000;0.0667;0.0867;1.0000" values="0;0;1;1" dur="15s" begin="sc-play.begin+0s" fill="freeze"/><path d="M 160 410 L 260 152" stroke="#b91c1c" stroke-width="4" marker-end="url(#sc-b91c1c)"/><text x="150" y="280" text-anchor="middle" font-size="14" font-weight="800" fill="#b91c1c">−ΔHlatt</text><text x="150" y="300" text-anchor="middle" font-size="14" font-weight="800" fill="#b91c1c">= +787</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.3333;0.3533;1.0000" values="0;0;1;1" dur="15s" begin="sc-play.begin+0s" fill="freeze"/><path d="M 400 152 L 500 410" stroke="#1d4ed8" stroke-width="4" marker-end="url(#sc-1d4ed8)"/><text x="530" y="270" text-anchor="start" font-size="14" font-weight="800" fill="#1d4ed8">ΣΔHhyd</text><text x="530" y="290" text-anchor="start" font-size="14" font-weight="800" fill="#1d4ed8">= −406 + (−364) = −770</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.6000;0.6200;1.0000" values="0;0;1;1" dur="15s" begin="sc-play.begin+0s" fill="freeze"/><path d="M 252 440 L 366 440" stroke="#15803d" stroke-width="4" marker-end="url(#sc-15803d)"/><text x="310" y="425" text-anchor="middle" font-size="14" font-weight="800" fill="#15803d">ΔHsol</text></g></g>
<g class="part" data-part="num" data-name="NaCl" data-info="−(−787) + (−406) + (−364) = +17 kJ mol⁻¹ with these data (measured ≈ +4): slightly endothermic, yet NaCl dissolves because entropy increases." tabindex="0" role="button" aria-label="NaCl"><g><animate attributeName="opacity" keyTimes="0.0000;0.6667;0.6867;1.0000" values="0;0;1;1" dur="15s" begin="sc-play.begin+0s" fill="freeze"/><rect x="40" y="490" width="760" height="56" rx="14" fill="#dcfce7" stroke="#86efac"/><text x="420" y="524" text-anchor="middle" font-size="15" font-weight="800" fill="#15803d">ΔHsol = +787 + (−770) = +17 kJ mol⁻¹ (small; entropy drives dissolving)</text></g></g>
<g class="part" data-part="hyd" data-name="Hydration" data-info="Water molecules orient: δ− O towards cations, δ+ H towards anions. Smaller, more highly charged ions have more exothermic hydration enthalpies (Mg²⁺ −1926 vs Na⁺ −406)." tabindex="0" role="button" aria-label="Hydration"><rect x="840" y="90" width="230" height="390" rx="16" fill="#f0f9ff" stroke="#7dd3fc"/><text x="955" y="116" text-anchor="middle" font-size="14" font-weight="800" fill="#0369a1">hydrated ions</text><circle cx="955" cy="210" r="22" fill="#a78bfa" stroke="#334155"/><text x="955" y="215" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">Na⁺</text><g><animate attributeName="opacity" keyTimes="0.0000;0.8000;0.8200;1.0000" values="0;0;1;1" dur="15s" begin="sc-play.begin+0s" fill="freeze"/><g transform="translate(1017 210) rotate(180)"><circle r="11" fill="#ef4444"/><circle cx="13" cy="-9" r="6" fill="#fff" stroke="#475569"/><circle cx="13" cy="9" r="6" fill="#fff" stroke="#475569"/></g></g><g><animate attributeName="opacity" keyTimes="0.0000;0.8100;0.8300;1.0000" values="0;0;1;1" dur="15s" begin="sc-play.begin+0s" fill="freeze"/><g transform="translate(986 264) rotate(240)"><circle r="11" fill="#ef4444"/><circle cx="13" cy="-9" r="6" fill="#fff" stroke="#475569"/><circle cx="13" cy="9" r="6" fill="#fff" stroke="#475569"/></g></g><g><animate attributeName="opacity" keyTimes="0.0000;0.8200;0.8400;1.0000" values="0;0;1;1" dur="15s" begin="sc-play.begin+0s" fill="freeze"/><g transform="translate(924 264) rotate(300)"><circle r="11" fill="#ef4444"/><circle cx="13" cy="-9" r="6" fill="#fff" stroke="#475569"/><circle cx="13" cy="9" r="6" fill="#fff" stroke="#475569"/></g></g><g><animate attributeName="opacity" keyTimes="0.0000;0.8300;0.8500;1.0000" values="0;0;1;1" dur="15s" begin="sc-play.begin+0s" fill="freeze"/><g transform="translate(893 210) rotate(360)"><circle r="11" fill="#ef4444"/><circle cx="13" cy="-9" r="6" fill="#fff" stroke="#475569"/><circle cx="13" cy="9" r="6" fill="#fff" stroke="#475569"/></g></g><g><animate attributeName="opacity" keyTimes="0.0000;0.8400;0.8600;1.0000" values="0;0;1;1" dur="15s" begin="sc-play.begin+0s" fill="freeze"/><g transform="translate(924 156) rotate(420)"><circle r="11" fill="#ef4444"/><circle cx="13" cy="-9" r="6" fill="#fff" stroke="#475569"/><circle cx="13" cy="9" r="6" fill="#fff" stroke="#475569"/></g></g><g><animate attributeName="opacity" keyTimes="0.0000;0.8500;0.8700;1.0000" values="0;0;1;1" dur="15s" begin="sc-play.begin+0s" fill="freeze"/><g transform="translate(986 156) rotate(480)"><circle r="11" fill="#ef4444"/><circle cx="13" cy="-9" r="6" fill="#fff" stroke="#475569"/><circle cx="13" cy="9" r="6" fill="#fff" stroke="#475569"/></g></g><circle cx="955" cy="380" r="30" fill="#4ade80" stroke="#334155"/><text x="955" y="385" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">Cl⁻</text><g><animate attributeName="opacity" keyTimes="0.0000;0.8000;0.8200;1.0000" values="0;0;1;1" dur="15s" begin="sc-play.begin+0s" fill="freeze"/><g transform="translate(1017 380) rotate(0)"><circle r="11" fill="#ef4444"/><circle cx="13" cy="-9" r="6" fill="#fff" stroke="#475569"/><circle cx="13" cy="9" r="6" fill="#fff" stroke="#475569"/></g></g><g><animate attributeName="opacity" keyTimes="0.0000;0.8100;0.8300;1.0000" values="0;0;1;1" dur="15s" begin="sc-play.begin+0s" fill="freeze"/><g transform="translate(986 434) rotate(60)"><circle r="11" fill="#ef4444"/><circle cx="13" cy="-9" r="6" fill="#fff" stroke="#475569"/><circle cx="13" cy="9" r="6" fill="#fff" stroke="#475569"/></g></g><g><animate attributeName="opacity" keyTimes="0.0000;0.8200;0.8400;1.0000" values="0;0;1;1" dur="15s" begin="sc-play.begin+0s" fill="freeze"/><g transform="translate(924 434) rotate(120)"><circle r="11" fill="#ef4444"/><circle cx="13" cy="-9" r="6" fill="#fff" stroke="#475569"/><circle cx="13" cy="9" r="6" fill="#fff" stroke="#475569"/></g></g><g><animate attributeName="opacity" keyTimes="0.0000;0.8300;0.8500;1.0