<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 580" class="vd-svg" role="img" aria-labelledby="im-title im-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="im-play" data-vd-play-label="Play: attract" data-vd-steps="[[0, &quot;Intermolecular forces.&quot;], [1, &quot;London forces: temporary dipoles induce dipoles in neighbours.&quot;], [4.5, &quot;Permanent dipole\u2013dipole between polar molecules.&quot;], [8, &quot;Hydrogen bonds: H\u2013N, H\u2013O or H\u2013F with a lone pair.&quot;], [11, &quot;This explains why water boils so much higher than H\u2082S.&quot;]]" data-vd-dur="15">
<title id="im-title">Intermolecular forces</title><desc id="im-desc">Instantaneous dipole-induced dipole forces between two molecules, permanent dipole-dipole forces between HCl molecules, hydrogen bonds between water molecules, and a graph of boiling points of group 16 hydrides with water anomalously high.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="580" fill="#ffffff"/>
<g aria-hidden="true"><animate id="im-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<text class="head" x="30" y="34">Intermolecular forces</text><text class="note" x="30" y="56">Weakest to strongest: London &lt; pd–pd &lt; hydrogen bond (for molecules of similar size).</text>
<g class="part" data-part="idid" data-name="Instantaneous dipole–induced dipole (London)" data-info="Electrons move, creating a temporary dipole that induces dipoles in neighbours. Present between all molecules; stronger with more electrons." tabindex="0" role="button" aria-label="Instantaneous dipole–induced dipole (London)"><rect x="30" y="80" width="330" height="230" rx="16" fill="#f8fafc" stroke="#cbd5e1"/><text x="195" y="104" text-anchor="middle" font-size="14" font-weight="800" fill="#111827">id–id (London)</text><ellipse cx="120" cy="200" rx="60" ry="40" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2"/><ellipse cx="120" cy="200" rx="30" ry="24" fill="#a5b4fc" opacity=".8"><animate attributeName="cx" keyTimes="0.0000;0.0667;0.1667;1.0000" values="120;120;142;142" dur="15s" begin="im-play.begin+0s" fill="freeze"/></ellipse><ellipse cx="270" cy="200" rx="60" ry="40" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2"/><ellipse cx="270" cy="200" rx="30" ry="24" fill="#a5b4fc" opacity=".8"><animate attributeName="cx" keyTimes="0.0000;0.0667;0.1667;1.0000" values="270;270;292;292" dur="15s" begin="im-play.begin+0s" fill="freeze"/></ellipse><g><animate attributeName="opacity" keyTimes="0.0000;0.1667;0.1867;1.0000" values="0;0;1;1" dur="15s" begin="im-play.begin+0s" fill="freeze"/><text x="80" y="260" text-anchor="middle" font-size="14" font-weight="800" fill="#b91c1c">δ+</text><text x="160" y="260" text-anchor="middle" font-size="14" font-weight="800" fill="#1d4ed8">δ−</text><text x="230" y="260" text-anchor="middle" font-size="14" font-weight="800" fill="#b91c1c">δ+</text><text x="310" y="260" text-anchor="middle" font-size="14" font-weight="800" fill="#1d4ed8">δ−</text><text x="195" y="296" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">temporary dipole induces a dipole</text></g></g>
<g class="part" data-part="pdpd" data-name="Permanent dipole–permanent dipole" data-info="Between polar molecules (e.g. HCl): δ+ end attracts δ− end of a neighbour." tabindex="0" role="button" aria-label="Permanent dipole–permanent dipole"><rect x="380" y="80" width="330" height="230" rx="16" fill="#f8fafc" stroke="#cbd5e1"/><text x="545" y="104" text-anchor="middle" font-size="14" font-weight="800" fill="#111827">pd–pd (HCl)</text><g><animate attributeName="opacity" keyTimes="0.0000;0.3000;0.3200;1.0000" values="0;0;1;1" dur="15s" begin="im-play.begin+0s" fill="freeze"/><circle cx="428" cy="200" r="13" fill="#f8fafc" stroke="#1f2937" stroke-width="1.5"/><text x="428" y="205" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">H</text><line x1="428" y1="200" x2="472" y2="200" stroke="#334155" stroke-width="4"/><circle cx="472" cy="200" r="18" fill="#22c55e" stroke="#1f2937" stroke-width="1.5"/><text x="472" y="205" text-anchor="middle" font-size="10" font-weight="800" fill="#052e16">Cl</text><text x="428" y="170" text-anchor="middle" font-size="13" font-weight="800" fill="#b91c1c">δ+</text><text x="472" y="170" text-anchor="middle" font-size="13" font-weight="800" fill="#1d4ed8">δ−</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.3000;0.3200;1.0000" values="0;0;1;1" dur="15s" begin="im-play.begin+0s" fill="freeze"/><circle cx="588" cy="200" r="13" fill="#f8fafc" stroke="#1f2937" stroke-width="1.5"/><text x="588" y="205" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">H</text><line x1="588" y1="200" x2="632" y2="200" stroke="#334155" stroke-width="4"/><circle cx="632" cy="200" r="18" fill="#22c55e" stroke="#1f2937" stroke-width="1.5"/><text x="632" y="205" text-anchor="middle" font-size="10" font-weight="800" fill="#052e16">Cl</text><text x="588" y="170" text-anchor="middle" font-size="13" font-weight="800" fill="#b91c1c">δ+</text><text x="632" y="170" text-anchor="middle" font-size="13" font-weight="800" fill="#1d4ed8">δ−</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.3667;0.3867;1.0000" values="0;0;1;1" dur="15s" begin="im-play.begin+0s" fill="freeze"/><line x1="476" y1="200" x2="584" y2="200" stroke="#7c3aed" stroke-width="2" stroke-dasharray="5 4"/></g></g>
<g class="part" data-part="hb" data-name="Hydrogen bonding" data-info="Between H bonded to N, O or F and a lone pair on N, O or F of another molecule: the strongest intermolecular force. Explains the high boiling point of water." tabindex="0" role="button" aria-label="Hydrogen bonding"><rect x="730" y="80" width="340" height="230" rx="16" fill="#f8fafc" stroke="#cbd5e1"/><text x="900" y="104" text-anchor="middle" font-size="14" font-weight="800" fill="#111827">hydrogen bond (water)</text><g><animate attributeName="opacity" keyTimes="0.0000;0.5333;0.5533;1.0000" values="0;0;1;1" dur="15s" begin="im-play.begin+0s" fill="freeze"/><circle cx="820" cy="190" r="18" fill="#ef4444" stroke="#1f2937" stroke-width="1.5"/><text x="820" y="195" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">O</text><line x1="820" y1="190" x2="784" y2="220" stroke="#334155" stroke-width="4"/><circle cx="784" cy="220" r="13" fill="#f8fafc" stroke="#1f2937" stroke-width="1.5"/><text x="784" y="225" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">H</text><line x1="820" y1="190" x2="860" y2="200" stroke="#334155" stroke-width="4"/><circle cx="860" cy="200" r="13" fill="#f8fafc" stroke="#1f2937" stroke-width="1.5"/><text x="860" y="205" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">H</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.5333;0.5533;1.0000" values="0;0;1;1" dur="15s" begin="im-play.begin+0s" fill="freeze"/><circle cx="960" cy="230" r="18" fill="#ef4444" stroke="#1f2937" stroke-width="1.5"/><text x="960" y="235" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">O</text><line x1="960" y1="230" x2="924" y2="260" stroke="#334155" stroke-width="4"/><circle cx="924" cy="260" r="13" fill="#f8fafc" stroke="#1f2937" stroke-width="1.5"/><text x="924" y="265" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">H</text><line x1="960" y1="230" x2="1000" y2="240" stroke="#334155" stroke-width="4"/><circle cx="1000" cy="240" r="13" fill="#f8fafc" stroke="#1f2937" stroke-width="1.5"/><text x="1000" y="245" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">H</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.6000;0.6200;1.0000" values="0;0;1;1" dur="15s" begin="im-play.begin+0s" fill="freeze"/><line x1="873" y1="201" x2="940" y2="222" stroke="#7c3aed" stroke-width="3" stroke-dasharray="6 4"/><text x="900" y="285" text-anchor="middle" font-size="11" font-weight="800" fill="#7c3aed">H on O/N/F ··· lone pair on O/N/F</text></g></g>
<g class="part" data-part="bp" data-name="Boiling points" data-info="Group 16 hydrides: H₂O 373 K is anomalously high; H₂S 213, H₂Se 232, H₂Te 271 K rise with more electrons (stronger London forces)." tabindex="0" role="button" aria-label="Boiling points"><text x="400" y="340" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">boiling points of Group 16 hydrides / K</text><line x1="120" y1="540" x2="780" y2="540" stroke="#111827" stroke-width="2"/><rect x="180" y="381" width="90" height="159" fill="#ef4444" stroke="#334155"><animate attributeName="height" keyTimes="0.0000;0.7333;0.7733;1.0000" values="0;0;158.525;158.525" dur="15s" begin="im-play.begin+0s" fill="freeze"/><animate attributeName="y" keyTimes="0.0000;0.7333;0.7733;1.0000" values="540;540;381.475;381.475" dur="15s" begin="im-play.begin+0s" fill="freeze"/></rect><g><animate attributeName="opacity" keyTimes="0.0000;0.7733;0.7933;1.0000" values="0;0;1;1" dur="15s" begin="im-play.begin+0s" fill="freeze"/><text x="225.0" y="373.475" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">373</text></g><text x="225.0" y="558" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">H₂O</text><rect x="330" y="449" width="90" height="91" fill="#93c5fd" stroke="#334155"><animate attributeName="height" keyTimes="0.0000;0.7600;0.8000;1.0000" values="0;0;90.52499999999999;90.52499999999999" dur="15s" begin="im-play.begin+0s" fill="freeze"/><animate attributeName="y" keyTimes="0.0000;0.7600;0.8000;1.0000" values="540;540;449.475;449.475" dur="15s" begin="im-play.begin+0s" fill="freeze"/></rect><g><animate attributeName="opacity" keyTimes="0.0000;0.8000;0.8200;1.0000" values="0;0;1;1" dur="15s" begin="im-play.begin+0s" fill="freeze"/><text x="375.0" y="441.475" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">213</text></g><text x="375.0" y="558" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">H₂S</text><rect x="480" y="441" width="90" height="99" fill="#93c5fd" stroke="#334155"><animate attributeName="height" keyTimes="0.0000;0.7867;0.8267;1.0000" values="0;0;98.6;98.6" dur="15s" begin="im-play.begin+0s" fill="freeze"/><animate attributeName="y" keyTimes="0.0000;0.7867;0.8267;1.0000" values="540;540;441.4;441.4" dur="15s" begin="im-play.begin+0s" fill="freeze"/></rect><g><animate attributeName="opacity" keyTimes="0.0000;0.8267;0.8467;1.0000" values="0;0;1;1" dur="15s" begin="im-play.begin+0s" fill="freeze"/><text x="525.0" y="433.4" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">232</text></g><text x="525.0" y="558" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">H₂Se</text><rect x="630" y="425" width="90" height="115" fill="#93c5fd" stroke="#334155"><animate attributeName="height" keyTimes="0.0000;0.8133;0.8533;1.0000" values="0;0;115.175;115.175" dur="15s" begin="im-play.begin+0s" fill="freeze"/><animate attributeName="y" keyTimes="0.0000;0.8133;0.8533;1.0000" values="540;540;424.825;424.825" dur="15s" begin="im-play.begin+0s" fill="freeze"/></rect><g><animate attributeName="opacity" keyTimes="0.0000;0.8533;0.8733;1.0000" values="0;0;1;1" dur="15s" begin="im-play.begin+0s" fill="freeze"/><text x="675.0" y="416.825" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">271</text></g><text x="675.0" y="558" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">H₂Te</text><g><animate attributeName="opacity" keyTimes="0.0000;0.8667;0.8867;1.0000" values="0;0;1;1" dur="15s" begin="im-play.begin+0s" fill="freeze"/><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.8667;0.8867;1.0000" values="0;0;1;1" dur="15s" begin="im-play.begin+0s" fill="freeze"/><rect x="670.0" y="448" width="360" height="24" rx="12" fill="#fee2e2" stroke="#1f2937" stroke-width="1"/><text x="850" y="465" text-anchor="middle" font-size="12" font-weight="700">water: hydrogen bonding → anomalously high</text></g></g></g>
</svg>