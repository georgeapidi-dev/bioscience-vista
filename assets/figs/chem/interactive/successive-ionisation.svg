<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" class="vd-svg" role="img" aria-labelledby="si2-title si2-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="si2-play" data-vd-play-label="Play: remove electrons" data-vd-steps="[[0, &quot;Successive ionisation energies: aluminium.&quot;], [1, &quot;Each electron is harder to remove than the last.&quot;], [7, &quot;A big jump after the 3rd: the 4th comes from an inner shell. Al is in Group 13.&quot;]]" data-vd-dur="12">
<title id="si2-title">Successive ionisation energies</title><desc id="si2-desc">Bar chart of the first four successive ionisation energies of aluminium, 577, 1817, 2745 and 11 577 kilojoules per mole, with a large jump between the third and fourth showing three outer electrons.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="520" fill="#ffffff"/>
<g aria-hidden="true"><animate id="si2-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<text class="head" x="30" y="34">Successive ionisation energies: aluminium</text><text class="note" x="30" y="56">kJ mol⁻¹. Bar heights on a log scale.</text>
<g class="part" data-part="g" data-name="Successive ionisation energies of aluminium" data-info="IE1 577, IE2 1817, IE3 2745, IE4 11 577 kJ mol⁻¹ (then higher still). Log scale." tabindex="0" role="button" aria-label="Successive ionisation energies of aluminium"><line x1="120" y1="460" x2="680" y2="460" stroke="#111827" stroke-width="2"/><rect x="160" y="405" width="80" height="55" fill="#93c5fd" stroke="#334155"><animate attributeName="height" keyTimes="0.0000;0.0833;0.1333;1.0000" values="0;0;55.30781925650782;55.30781925650782" dur="12s" begin="si2-play.begin+0s" fill="freeze"/><animate attributeName="y" keyTimes="0.0000;0.0833;0.1333;1.0000" values="460;460;404.6921807434922;404.6921807434922" dur="12s" begin="si2-play.begin+0s" fill="freeze"/></rect><g><animate attributeName="opacity" keyTimes="0.0000;0.1333;0.1583;1.0000" values="0;0;1;1" dur="12s" begin="si2-play.begin+0s" fill="freeze"/><text x="200" y="396.6921807434922" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">577</text></g><text x="200" y="482" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">IE1</text><rect x="290" y="299" width="80" height="161" fill="#93c5fd" stroke="#334155"><animate attributeName="height" keyTimes="0.0000;0.1917;0.2417;1.0000" values="0;0;160.80457284170143;160.80457284170143" dur="12s" begin="si2-play.begin+0s" fill="freeze"/><animate attributeName="y" keyTimes="0.0000;0.1917;0.2417;1.0000" values="460;460;299.19542715829857;299.19542715829857" dur="12s" begin="si2-play.begin+0s" fill="freeze"/></rect><g><animate attributeName="opacity" keyTimes="0.0000;0.2417;0.2667;1.0000" values="0;0;1;1" dur="12s" begin="si2-play.begin+0s" fill="freeze"/><text x="330" y="291.19542715829857" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">1,817</text></g><text x="330" y="482" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">IE2</text><rect x="420" y="261" width="80" height="199" fill="#93c5fd" stroke="#334155"><animate attributeName="height" keyTimes="0.0000;0.3000;0.3500;1.0000" values="0;0;198.75014444882345;198.75014444882345" dur="12s" begin="si2-play.begin+0s" fill="freeze"/><animate attributeName="y" keyTimes="0.0000;0.3000;0.3500;1.0000" values="460;460;261.24985555117655;261.24985555117655" dur="12s" begin="si2-play.begin+0s" fill="freeze"/></rect><g><animate attributeName="opacity" keyTimes="0.0000;0.3500;0.3750;1.0000" values="0;0;1;1" dur="12s" begin="si2-play.begin+0s" fill="freeze"/><text x="460" y="253.24985555117655" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">2,745</text></g><text x="460" y="482" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">IE3</text><rect x="550" y="129" width="80" height="331" fill="#f87171" stroke="#334155"><animate attributeName="height" keyTimes="0.0000;0.4083;0.4583;1.0000" values="0;0;331.1144541086949;331.1144541086949" dur="12s" begin="si2-play.begin+0s" fill="freeze"/><animate attributeName="y" keyTimes="0.0000;0.4083;0.4583;1.0000" values="460;460;128.88554589130513;128.88554589130513" dur="12s" begin="si2-play.begin+0s" fill="freeze"/></rect><g><animate attributeName="opacity" keyTimes="0.0000;0.4583;0.4833;1.0000" values="0;0;1;1" dur="12s" begin="si2-play.begin+0s" fill="freeze"/><text x="590" y="120.88554589130513" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">11,577</text></g><text x="590" y="482" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">IE4</text></g>
<g class="part" data-part="jump" data-name="The big jump" data-info="Between IE3 and IE4: the 4th electron comes from a new shell nearer the nucleus (2p), less shielded: so Al has 3 outer electrons → Group 13." tabindex="0" role="button" aria-label="The big jump"><circle cx="880" cy="250" r="20" fill="#fca5a5" stroke="#991b1b"/><circle cx="880" cy="250" r="45" fill="none" stroke="#94a3b8" stroke-width="1.5"/><circle cx="880" cy="250" r="80" fill="none" stroke="#94a3b8" stroke-width="1.5"/><circle cx="880" cy="250" r="115" fill="none" stroke="#94a3b8" stroke-width="1.5"/><circle cx="995" cy="250" r="7" fill="#2563eb"><animate attributeName="opacity" keyTimes="0.0000;0.0833;0.1250;1.0000" values="1;1;0;0" dur="12s" begin="si2-play.begin+0s" fill="freeze"/></circle><circle cx="822" cy="349" r="7" fill="#2563eb"><animate attributeName="opacity" keyTimes="0.0000;0.1917;0.2333;1.0000" values="1;1;0;0" dur="12s" begin="si2-play.begin+0s" fill="freeze"/></circle><circle cx="824" cy="150" r="7" fill="#2563eb"><animate attributeName="opacity" keyTimes="0.0000;0.3000;0.3417;1.0000" values="1;1;0;0" dur="12s" begin="si2-play.begin+0s" fill="freeze"/></circle><circle cx="960" cy="250" r="6" fill="#1e3a8a"/><circle cx="937" cy="307" r="6" fill="#1e3a8a"/><circle cx="880" cy="330" r="6" fill="#1e3a8a"/><circle cx="823" cy="307" r="6" fill="#1e3a8a"/><circle cx="800" cy="250" r="6" fill="#1e3a8a"/><circle cx="823" cy="194" r="6" fill="#1e3a8a"/><circle cx="880" cy="170" r="6" fill="#1e3a8a"/><circle cx="936" cy="193" r="6" fill="#1e3a8a"/><circle cx="925" cy="250" r="6" fill="#1e3a8a"/><circle cx="835" cy="250" r="6" fill="#1e3a8a"/><g><animate attributeName="opacity" keyTimes="0.0000;0.5833;0.6083;1.0000" values="0;0;1;1" dur="12s" begin="si2-play.begin+0s" fill="freeze"/><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.5833;0.6083;1.0000" values="0;0;1;1" dur="12s" begin="si2-play.begin+0s" fill="freeze"/><rect x="715.0" y="408" width="330" height="24" rx="12" f