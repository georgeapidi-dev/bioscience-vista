<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" class="vd-svg" role="img" aria-labelledby="on-title on-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="on-play" data-vd-play-label="Play: assign numbers" data-vd-steps="[[0, &quot;Oxidation numbers.&quot;], [1, &quot;Learn the rules.&quot;], [4.5, &quot;Work out Cr in Cr\u2082O\u2087\u00b2\u207b: +6.&quot;], [8, &quot;Up = oxidised; down = reduced.&quot;], [11, &quot;Disproportionation: chlorine goes both up and down.&quot;]]" data-vd-dur="15">
<title id="on-title">Oxidation numbers</title><desc id="on-desc">Rules for assigning oxidation numbers, a worked example giving chromium plus six in dichromate, a number line showing oxidation as an increase and reduction as a decrease, and disproportionation of chlorine to minus one and plus one.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="560" fill="#ffffff"/>
<g aria-hidden="true"><animate id="on-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<text class="head" x="30" y="34">Oxidation numbers and redox</text><text class="note" x="30" y="56">OIL RIG; oxidation number rises when electrons are lost.</text>
<g class="part" data-part="rules" data-name="Rules" data-info="Elements 0; O usually −2 (−1 in peroxides); H usually +1 (−1 in metal hydrides); F always −1; sum = 0 in a compound, = charge in an ion." tabindex="0" role="button" aria-label="Rules"><rect x="30" y="80" width="400" height="300" rx="16" fill="#f8fafc" stroke="#cbd5e1"/><text x="230" y="106" text-anchor="middle" font-size="15" font-weight="800" fill="#111827">rules</text><g><animate attributeName="opacity" keyTimes="0.0000;0.0667;0.0867;1.0000" values="0;0;1;1" dur="15s" begin="on-play.begin+0s" fill="freeze"/><text x="60" y="146" text-anchor="start" font-size="13" font-weight="700" fill="#111827">• uncombined element: 0</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.0933;0.1133;1.0000" values="0;0;1;1" dur="15s" begin="on-play.begin+0s" fill="freeze"/><text x="60" y="182" text-anchor="start" font-size="13" font-weight="700" fill="#111827">• O: −2 (peroxides −1)</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.1200;0.1400;1.0000" values="0;0;1;1" dur="15s" begin="on-play.begin+0s" fill="freeze"/><text x="60" y="218" text-anchor="start" font-size="13" font-weight="700" fill="#111827">• H: +1 (metal hydrides −1)</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.1467;0.1667;1.0000" values="0;0;1;1" dur="15s" begin="on-play.begin+0s" fill="freeze"/><text x="60" y="254" text-anchor="start" font-size="13" font-weight="700" fill="#111827">• F: always −1</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.1733;0.1933;1.0000" values="0;0;1;1" dur="15s" begin="on-play.begin+0s" fill="freeze"/><text x="60" y="290" text-anchor="start" font-size="13" font-weight="700" fill="#111827">• Group 1: +1 · Group 2: +2</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.2000;0.2200;1.0000" values="0;0;1;1" dur="15s" begin="on-play.begin+0s" fill="freeze"/><text x="60" y="326" text-anchor="start" font-size="13" font-weight="700" fill="#111827">• sum = 0 (compound) or ion charge</text></g></g>
<g class="part" data-part="ex" data-name="Example" data-info="In Cr₂O₇²⁻: 2x + 7(−2) = −2 → x = +6. Named chromium(VI)." tabindex="0" role="button" aria-label="Example"><g><animate attributeName="opacity" keyTimes="0.0000;0.3000;0.3200;1.0000" values="0;0;1;1" dur="15s" begin="on-play.begin+0s" fill="freeze"/><rect x="30" y="400" width="400" height="140" rx="16" fill="#fef9c3" stroke="#eab308"/><text x="230" y="432" text-anchor="middle" font-size="22" font-weight="800" fill="#713f12">Cr₂O₇²⁻</text><text x="230" y="466" text-anchor="middle" font-size="15" font-weight="800" fill="#111827">2x + 7(−2) = −2</text><text x="230" y="500" text-anchor="middle" font-size="16" font-weight="800" fill="#b45309">x = +6 → chromium(VI)</text></g></g>
<g class="part" data-part="redox" data-name="Oxidised or reduced?" data-info="Oxidation = increase in oxidation number (loss of electrons); reduction = decrease (gain of electrons)." tabindex="0" role="button" aria-label="Oxidised or reduced?"><line x1="520" y1="230" x2="1040" y2="230" stroke="#111827" stroke-width="3"/><line x1="540" y1="222" x2="540" y2="238" stroke="#111827" stroke-width="2"/><text x="540" y="260" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">-4</text><line x1="600" y1="222" x2="600" y2="238" stroke="#111827" stroke-width="2"/><text x="600" y="260" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">-3</text><line x1="660" y1="222" x2="660" y2="238" stroke="#111827" stroke-width="2"/><text x="660" y="260" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">-2</text><line x1="720" y1="222" x2="720" y2="238" stroke="#111827" stroke-width="2"/><text x="720" y="260" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">-1</text><line x1="780" y1="222" x2="780" y2="238" stroke="#111827" stroke-width="2"/><text x="780" y="260" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">0</text><line x1="840" y1="222" x2="840" y2="238" stroke="#111827" stroke-width="2"/><text x="840" y="260" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">+1</text><line x1="900" y1="222" x2="900" y2="238" stroke="#111827" stroke-width="2"/><text x="900" y="260" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">+2</text><line x1="960" y1="222" x2="960" y2="238" stroke="#111827" stroke-width="2"/><text x="960" y="260" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">+3</text><line x1="1020" y1="222" x2="1020" y2="238" stroke="#111827" stroke-width="2"/><text x="1020" y="260" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">+4</text><g><animate attributeName="opacity" keyTimes="0.0000;0.5333;0.5533;1.0000" values="0;0;1;1" dur="15s" begin="on-play.begin+0s" fill="freeze"/><path d="M 780 210 Q 870 140 960 210" fill="none" stroke="#dc2626" stroke-width="4"/><text x="870" y="154" text-anchor="middle" font-size="13" font-weight="800" fill="#b91c1c">oxidation: number increases</text><path d="M 780 274 Q 690 340 600 274" fill="none" stroke="#2563eb" stroke-width="4"/><text x="690" y="346" text-anchor="middle" font-size="13" font-weight="800" fill="#1d4ed8">reduction: number decreases</text></g></g>
<g class="part" data-part="disp" data-name="Disproportionation" data-info="The same element is both oxidised and reduced: Cl₂ + 2NaOH → NaCl + NaClO + H₂O: Cl 0 → −1 and 0 → +1." tabindex="0" role="button" aria-label="Disproportionation"><g><animate attributeName="opacity" keyTimes="0.0000;0.7333;0.7533;1.0000" values="0;0;1;1" dur="15s" begin="on-play.begin+0s" fill="freeze"/><rect x="470" y="380" width="600" height="160" rx="16" fill="#f0fdf4" stroke="#86efac"/><text x="770" y="410" text-anchor="middle" font-size="15" font-weight="800" fill="#15803d">disproportionation</text><text x="770" y="446" text-anchor="middle" font-size="16" font-weight="800" fill="#111827">Cl₂ + 2NaOH → NaCl + NaClO + H₂O</text><text x="770" y="480" text-anchor="middle" font-size="14" font-weight="800" fill="#15803d">0 → −1 (reduced)  and  0 → +1 (oxidised)</text><text x="770" y="510" text-anchor="middle" font-size="12" font-weight="700" fill="#475569">the same element is both oxidised and reduced</text></g></g>
</svg>