<g class="part" data-part="cases" data-name="Four cases" data-info="ΔH −, ΔS +: always feasible. ΔH +, ΔS −: never. ΔH −, ΔS −: feasible below T = ΔH/ΔS. ΔH +, ΔS +: feasible above it. Feasible does not mean fast (Ea)." tabindex="0" role="button" aria-label="Four cases"><rect x="720" y="210" width="350" height="300" rx="16" fill="#f8fafc" stroke="#cbd5e1"/><text x="895" y="236" text-anchor="middle" font-size="14" font-weight="800" fill="#111827">sign of ΔH and ΔS</text><g><animate attributeName="opacity" keyTimes="0.0000;0.7857;0.8071;1.0000" values="0;0;1;1" dur="14s" begin="gb-play.begin+0s" fill="freeze"/><text x="760" y="280" text-anchor="start" font-size="14" font-weight="800" fill="#111827">ΔH −</text><text x="840" y="280" text-anchor="start" font-size="14" font-weight="800" fill="#111827">ΔS +</text><text x="1050" y="280" text-anchor="end" font-size="13" font-weight="800" fill="#15803d">always feasible</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.8143;0.8357;1.0000" values="0;0;1;1" dur="14s" begin="gb-play.begin+0s" fill="freeze"/><text x="760" y="332" text-anchor="start" font-size="14" font-weight="800" fill="#111827">ΔH +</text><text x="840" y="332" text-anchor="start" font-size="14" font-weight="800" fill="#111827">ΔS −</text><text x="1050" y="332" text-anchor="end" font-size="13" font-weight="800" fill="#b91c1c">never feasible</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.8429;0.8643;1.0000" values="0;0;1;1" dur="14s" begin="gb-play.begin+0s" fill="freeze"/><text x="760" y="384" text-anchor="start" font-size="14" font-weight="800" fill="#111827">ΔH −</text><text x="840" y="384" text-anchor="start" font-size="14" font-weight="800" fill="#111827">ΔS −</text><text x="1050" y="384" text-anchor="end" font-size="13" font-weight="800" fill="#1d4ed8">feasible at LOW T</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.8714;0.8929;1.0000" values="0;0;1;1" dur="14s" begin="gb-play.begin+0s" fill="freeze"/><text x="760" y="436" text-anchor="start" font-size="14" font-weight="800" fill="#111827">ΔH +</text><text x="840" y="436" text-anchor="start" font-size="14" font-weight="800" fill="#111827">ΔS +</text><text x="1050" y="436" text-anchor="end" font-size="13" font-weight="800" fill="#c2410c">feasible at HIGH T</text></g></g>
</svg>