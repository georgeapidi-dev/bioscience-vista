<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" class="vd-svg" role="img" aria-labelledby="gb-title gb-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="gb-play" data-vd-play-label="Play: heat it up" data-vd-steps="[[0, &quot;Gibbs free energy decides feasibility.&quot;], [1, &quot;\u0394G = \u0394H \u2212 T\u0394S.&quot;], [4, &quot;For CaCO\u2083 decomposition \u0394G falls as T rises.&quot;], [9, &quot;Feasible above about 1106 K.&quot;], [11, &quot;Four combinations of signs.&quot;]]" data-vd-dur="14">
<title id="gb-title">Gibbs free energy and temperature</title><desc id="gb-desc">A graph of the Gibbs free energy change against temperature for the decomposition of calcium carbonate: a straight line falling from plus 178 kilojoules per mole, crossing zero at about 1106 kelvin, above which the reaction is feasible; a table of the four sign combinations.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="560" fill="#ffffff"/>
<g aria-hidden="true"><animate id="gb-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<text class="head" x="30" y="34">ΔG = ΔH − TΔS: feasibility and temperature</text><text class="note" x="30" y="56">CaCO₃(s) → CaO(s) + CO₂(g): ΔH⦵ = +178 kJ mol⁻¹, ΔS⦵ = +161 J K⁻¹ mol⁻¹.</text>
<g class="part" data-part="eq" data-name="ΔG = ΔH − TΔS" data-info="A reaction is feasible when ΔG ≤ 0. Convert ΔS to kJ K⁻¹ mol⁻¹ (÷ 1000) and use T in K." tabindex="0" role="button" aria-label="ΔG = ΔH − TΔS"><g><animate attributeName="opacity" keyTimes="0.0000;0.0714;0.0929;1.0000" values="0;0;1;1" dur="14s" begin="gb-play.begin+0s" fill="freeze"/><rect x="110.0" y="80.0" width="380" height="60" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="300" y="108" text-anchor="middle" font-size="22" font-weight="800" fill="#111827">ΔG = ΔH − TΔS</text><text x="300" y="126" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">feasible if ΔG ≤ 0 · ΔS in kJ K⁻¹ mol⁻¹</text></g></g>
<g class="part" data-part="plot" data-name="ΔG against T" data-info="A straight line: intercept ΔH, gradient −ΔS. CaCO₃ → CaO + CO₂: ΔH +178, ΔS +0.161 kJ K⁻¹ mol⁻¹, so ΔG = 0 at T = 178/0.161 ≈ 1106 K; feasible above this." tabindex="0" role="button" aria-label="ΔG against T"><line x1="100" y1="500" x2="660" y2="500" stroke="#111827" stroke-width="2"/><line x1="100" y1="500" x2="100" y2="220" stroke="#111827" stroke-width="2"/><text x="380.0" y="528" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">temperature / K</text><text x="84" y="360.0" transform="rotate(-90 84 360.0)" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">ΔG / kJ mol⁻¹</text><line x1="100" y1="360.0" x2="660" y2="360.0" stroke="#94a3b8" stroke-dasharray="5 4"/><text x="94" y="364.0" text-anchor="end" font-size="11" font-weight="800" fill="#475569">0</text><text x="94" y="239.39999999999998" text-anchor="end" font-size="11" font-weight="800" fill="#475569">+178</text><text x="100.0" y="514" text-anchor="middle" font-size="10" font-weight="700" fill="#475569">0</text><text x="240.0" y="514" text-anchor="middle" font-size="10" font-weight="700" fill="#475569">400</text><text x="380.0" y="514" text-anchor="middle" font-size="10" font-weight="700" fill="#475569">800</text><text x="520.0" y="514" text-anchor="middle" font-size="10" font-weight="700" fill="#475569">1200</text><text x="660.0" y="514" text-anchor="middle" font-size="10" font-weight="700" fill="#475569">1600</text><clipPath id="gbl-c40216100"><rect x="100" y="216" width="564" height="288"><animate attributeName="width" keyTimes="0.0000;0.2857;0.6071;1.0000" values="0;0;564;564" dur="14s" begin="gb-play.begin+0s" fill="freeze"/></rect></clipPath><g clip-path="url(#gbl-c40216100)"><polyline points="100.0,235.4 107.0,237.7 114.0,239.9 121.0,242.2 128.0,244.4 135.0,246.7 142.0,248.9 149.0,251.2 156.0,253.4 163.0,255.7 170.0,257.9 177.0,260.2 184.0,262.4 191.0,264.7 198.0,267.0 205.0,269.2 212.0,271.5 219.