<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 680" class="vd-svg" role="img" aria-labelledby="ch-title ch-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="ch-play" data-vd-play-label="Play: mirror images" data-vd-steps="[[0, &quot;Chirality: molecules that are mirror images.&quot;], [1, &quot;Left and right hands: mirror images that do not superimpose.&quot;], [3.5, &quot;A carbon with four different groups is a chiral centre.&quot;], [5.5, &quot;Its mirror image is a different molecule: an enantiomer. Rotating it never makes them match.&quot;], [9.5, &quot;A planar carbocation can be attacked from either face...&quot;], [12, &quot;...giving a 50 : 50 racemic mixture.&quot;]]" data-vd-dur="15">
<title id="ch-title">Chirality and enantiomers</title><desc id="ch-desc">Left and right hands as non-superimposable mirror images, the two enantiomers of CHFClBr as mirror images about a chiral carbon, and attack on both faces of a planar carbocation giving a racemic mixture.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1220" height="680" fill="#ffffff"/>
<g aria-hidden="true"><animate id="ch-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<defs><marker id="ch-2563eb" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="6.3" refY="7.0" orient="auto"><path d="M0,0 L14,7.0 L0,14 z" fill="#2563eb"/></marker></defs>
<text class="head" x="30" y="34">Chirality and enantiomers</text><text class="note" x="30" y="56">Wedge = towards you, dashed = away from you.</text>
<g class="part" data-part="hands" data-name="Hands" data-info="Your left and right hands are mirror images that cannot be superimposed: they are chiral." tabindex="0" role="button" aria-label="Hands"><g><animate attributeName="opacity" keyTimes="0.0000;0.0667;0.0867;1.0000" values="0;0;1;1" dur="15s" begin="ch-play.begin+0s" fill="freeze"/><g transform="translate(130 220) scale(1 1)"><path d="M -40 60 L -40 -10 C -40 -30 -26 -30 -26 -10 L -26 -40 C -26 -60 -12 -60 -12 -40 L -12 -50 C -12 -70 2 -70 2 -50 L 2 -42 C 2 -60 16 -60 16 -40 L 16 10 C 26 0 46 -10 52 4 C 40 20 30 40 20 60 Z" fill="#fde68a" stroke="#92400e" stroke-width="3"/></g><g transform="translate(330 220) scale(-1 1)"><path d="M -40 60 L -40 -10 C -40 -30 -26 -30 -26 -10 L -26 -40 C -26 -60 -12 -60 -12 -40 L -12 -50 C -12 -70 2 -70 2 -50 L 2 -42 C 2 -60 16 -60 16 -40 L 16 10 C 26 0 46 -10 52 4 C 40 20 30 40 20 60 Z" fill="#fde68a" stroke="#92400e" stroke-width="3"/></g><line x1="230" y1="130" x2="230" y2="300" stroke="#94a3b8" stroke-width="3" stroke-dasharray="6 5"/><text x="230" y="320" text-anchor="middle" font-size="12" font-weight="800" fill="#64748b">mirror</text><text x="130" y="310" text-anchor="middle" font-size="12" font-weight="800" fill="#92400e">left</text><text x="330" y="310" text-anchor="middle" font-size="12" font-weight="800" fill="#92400e">right</text></g></g>
<g class="part" data-part="cc" data-name="Chiral centre" data-info="A carbon atom bonded to four different atoms or groups (here H, F, Cl, Br)." tabindex="0" role="button" aria-label="Chiral centre"><g><animate attributeName="opacity" keyTimes="0.0000;0.2333;0.2533;1.0000" values="0;0;1;1" dur="15s" begin="ch-play.begin+0s" fill="freeze"/><line x1="620" y1="230" x2="620" y2="150" stroke="#111827" stroke-width="4"/><line x1="620" y1="230" x2="690" y2="270" stroke="#111827" stroke-width="4"/><polygon points="620,227 620,233 556,284 546,272" fill="#111827"/><line x1="620" y1="230" x2="546" y2="210" stroke="#111827" stroke-width="4" stroke-dasharray="4 4"/><circle cx="620.0" cy="150.0" r="15" fill="#f3f4f6" stroke="#111827" stroke-width="1.5"/><text x="620" y="154" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">H</text><circle cx="692.0" cy="272.0" r="22" fill="#b45309" stroke="#111827" stroke-width="1.5"/><text x="692" y="276" text-anchor="middle" font-size="11" font-weight="800" fill="#fff">Br</text><circle cx="550.0" cy="280.0" r="21" fill="#22c55e" stroke="#111827" stroke-width="1.5"/><text x="550" y="284" text-anchor="middle" font-size="11" font-weight="800" fill="#fff">Cl</text><circle cx="542.0" cy="208.0" r="17" fill="#a3e635" stroke="#111827" stroke-width="1.5"/><text x="542" y="212" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">F</text><circle cx="620.0" cy="230.0" r="20" fill="#374151" stroke="#111827" stroke-width="1.5"/><text x="620" y="234" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">C</text><text x="620" y="340" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">chiral carbon: 4 different groups</text><circle cx="620" cy="230" r="30" fill="none" stroke="#f59e0b" stroke-width="3" stroke-dasharray="5 4"/></g></g>
<g class="part" data-part="en" data-name="Enantiomers" data-info="The two mirror-image forms. Same physical properties except that they rotate plane-polarised light by the same angle in opposite directions; they may act very differently in the body." tabindex="0" role="button" aria-label="Enantiomers"><g><animate attributeName="opacity" keyTimes="0.0000;0.3667;0.3867;1.0000" values="0;0;1;1" dur="15s" begin="ch-play.begin+0s" fill="freeze"/><line x1="900" y1="230" x2="900" y2="150" stroke="#111827" stroke-width="4"/><line x1="900" y1="230" x2="830" y2="270" stroke="#111827" stroke-width="4"/><polygon points="900,227 900,233 964,284 974,272" fill="#111827"/><line x1="900" y1="230" x2="974" y2="210" stroke="#111827" stroke-width="4" stroke-dasharray="4 4"/><circle cx="900.0" cy="150.0" r="15" fill="#f3f4f6" stroke="#111827" stroke-width="1.5"/><text x="900" y="154" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">H</text><circle cx="828.0" cy="272.0" r="22" fill="#b45309" stroke="#111827" stroke-width="1.5"/><text x="828" y="276" text-anchor="middle" font-size="11" font-weight="800" fill="#fff">Br</text><circle cx="970.0" cy="280.0" r="21" fill="#22c55e" stroke="#111827" stroke-width="1.5"/><text x="970" y="284" text-anchor="middle" font-size="11" font-weight="800" fill="#fff">Cl</text><circle cx="978.0" cy="208.0" r="17" fill="#a3e635" stroke="#111827" stroke-width="1.5"/><text x="978" y="212" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">F</text><circle cx="900.0" cy="230.0" r="20" fill="#374151" stroke="#111827" stroke-width="1.5"/><text x="900" y="234" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">C</text><line x1="760" y1="120" x2="760" y2="340" stroke="#94a3b8" stroke-width="3" stroke-dasharray="6 5"/><text x="760" y="108" text-anchor="middle" font-size="12" font-weight="800" fill="#64748b">mirror</text><text x="900" y="340" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">its enantiomer</text><rect x="980" y="140" width="220" height="150" rx="12" fill="#f8fafc" stroke="#cbd5e1"/><text x="1090" y="166" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">Plane-polarised light</text><text x="1090" y="196" text-anchor="middle" font-size="11" font-weight="600" fill="#111827">one enantiomer: rotates +θ</text><text x="1090" y="218" text-anchor="middle" font-size="11" font-weight="600" fill="#111827">the other: rotates −θ</text><text x="1090" y="246" text-anchor="middle" font-size="11" font-weight="600" fill="#475569">(optical isomers)</text><text x="1090" y="272" text-anchor="middle" font-size="11" font-weight="600" fill="#475569">e.g. thalidomide</text></g></g>
<g class="part" data-part="carb" data-name="Planar carbocation" data-info="In an SN1 reaction the intermediate carbocation is flat (trigonal planar)." tabindex="0" role="button" aria-label="Planar carbocation"><g><animate attributeName="opacity" keyTimes="0.0000;0.6333;0.6533;1.0000" values="0;0;1;1" dur="15s" begin="ch-play.begin+0s" fill="freeze"/><polygon points="240,570 520,570 560,510 280,510" fill="#e0f2fe" opacity=".7"/><line x1="380" y1="540" x2="290" y2="550" stroke="#111827" stroke-width="4"/><line x1="380" y1="540" x2="470" y2="550" stroke="#111827" stroke-width="4"/><line x1="380" y1="540" x2="410" y2="514" stroke="#111827" stroke-width="4"/><circle cx="290.0" cy="550.0" r="16" fill="#374151" stroke="#111827" stroke-width="1.5"/><text x="290" y="554" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">C</text><text x="290" y="582" text-anchor="middle" font-size="11" font-weight="800" fill="#111827">CH₃</text><circle cx="470.0" cy="550.0" r="16" fill="#374151" stroke="#111827" stroke-width="1.5"/><text x="470" y="554" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">C</text><text x="470" y="582" text-anchor="middle" font-size="11" font-weight="800" fill="#111827">C₂H₅</text><circle cx="410.0" cy="514.0" r="13" fill="#f3f4f6" stroke="#111827" stroke-width="1.5"/><text x="410" y="518" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">H</text><circle cx="380.0" cy="540.0" r="22" fill="#374151" stroke="#111827" stroke-width="1.5"/><text x="380" y="544" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">C</text><text x="398" y="526" text-anchor="middle" font-size="16" font-weight="800" fill="#dc2626">+</text><ellipse cx="380" cy="480" rx="16" ry="40" fill="none" stroke="#94a3b8" stroke-dasharray="4 3"/><ellipse cx="380" cy="600" rx="16" ry="40" fill="none" stroke="#94a3b8" stroke-dasharray="4 3"/><text x="380" y="670" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">planar carbocation (SN1 intermediate)</text></g></g>
<g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.6667;0.6800;0.7733;0.7867;1.0000" values="0;0;1;1;0;0" dur="15s" begin="ch-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.6667;0.7533;1.0000" values="350 400;350 400;380 490;380 490" dur="15s" begin="ch-play.begin+0s" fill="freeze"/><g><circle r="16" fill="#a7f3d0" stroke="#047857" stroke-width="2"/><text x="0" y="4" text-anchor="middle" font-size="9" font-weight="800" fill="#065f46">OH⁻</text></g></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.7067;0.7200;0.8133;0.8267;1.0000" values="0;0;1;1;0;0" dur="15s" begin="ch-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.7067;0.7933;1.0000" values="350 660;350 660;380 590;380 590" dur="15s" begin="ch-play.begin+0s" fill="freeze"/><g><circle r="16" fill="#a7f3d0" stroke="#047857" stroke-width="2"/><text x="0" y="4" text-anchor="middle" font-size="9" font-weight="800" fill="#065f46">OH⁻</text></g></g></g><g><animate attributeName="opacity" keyTimes="0.0000;0.6533;0.6733;1.0000" values="0;0;1;1" dur="15s" begin="ch-play.begin+0s" fill="freeze"/><path d="M 320 410 C 340 430 360 450 372 500" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#ch-2563eb)"/><path d="M 320 670 C 340 650 360 630 372 580" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#ch-2563eb)"/><text x="270" y="420" text-anchor="end" font-size="12" font-weight="800" fill="#1d4ed8">top face</text><text x="270" y="680" text-anchor="end" font-size="12" font-weight="800" fill="#1d4ed8">bottom face</text></g>
<g class="part" data-part="rac" data-name="Racemic mixture" data-info="The nucleophile can attack from either face with equal chance: a 50 : 50 mixture of enantiomers, which does not rotate plane-polarised light overall." tabindex="0" role="button" aria-label="Racemic mixture"><g><animate attributeName="opacity" keyTimes="0.0000;0.8000;0.8200;1.0000" values="0;0;1;1" dur="15s" begin="ch-play.begin+0s" fill="freeze"/><rect x="700" y="430" width="500" height="200" rx="16" fill="#fef9c3" stroke="#eab308"/><text x="950" y="460" text-anchor="middle" font-size="16" font-weight="800" fill="#713f12">Racemic mixture</text><rect x="740" y="490" width="200" height="40" fill="#93c5fd"/><rect x="940" y="490" width="200" height="40" fill="#fca5a5"/><text x="840" y="516" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">50% one enantiomer</text><text x="1040" y="516" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">50% the other</text><text x="950" y="562" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">equal chance of attack from each face</text><text x="950" y="588" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">rotations cancel: no net optical activity</text></g></g>
</svg>