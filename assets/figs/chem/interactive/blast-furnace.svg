<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 700" class="vd-svg" role="img" aria-labelledby="bf-title bf-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="bf-play" data-vd-play-label="Play: make iron" data-vd-steps="[[0, &quot;The blast furnace extracts iron from its ore.&quot;], [1, &quot;Iron ore, coke and limestone go in at the top.&quot;], [3, &quot;Hot air is blown in; coke burns to CO\u2082 and heats the furnace.&quot;], [5.5, &quot;CO\u2082 reacts with more coke to form carbon monoxide.&quot;], [8, &quot;Carbon monoxide reduces iron(III) oxide to iron.&quot;], [10.5, &quot;Limestone removes impurities as slag.&quot;], [13, &quot;Molten iron and slag are tapped from the bottom.&quot;]]" data-vd-dur="16">
<title id="bf-title">The blast furnace</title><desc id="bf-desc">A blast furnace: iron ore, coke and limestone enter at the top, hot air is blown in, coke burns to carbon dioxide which forms carbon monoxide, carbon monoxide reduces iron oxide to molten iron, and limestone forms slag; iron and slag are tapped off.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1220" height="700" fill="#ffffff"/>
<g aria-hidden="true"><animate id="bf-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<defs><marker id="bf-475569" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="6.3" refY="7.0" orient="auto"><path d="M0,0 L14,7.0 L0,14 z" fill="#475569"/></marker></defs>
<text class="head" x="30" y="34">The blast furnace</text><text class="note" x="30" y="56">Temperatures approximate.</text>
<defs><linearGradient id="bf-g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fde68a"/><stop offset=".5" stop-color="#fb923c"/><stop offset="1" stop-color="#dc2626"/></linearGradient></defs><path d="M 360 120 L 520 120 L 600 360 L 620 520 L 560 640 L 320 640 L 260 520 L 280 360 Z" fill="url(#bf-g)" stroke="#334155" stroke-width="8"/>
<text x="680" y="150" text-anchor="start" font-size="12" font-weight="800" fill="#475569">≈ 200 °C</text><text x="680" y="360" text-anchor="start" font-size="12" font-weight="800" fill="#475569">≈ 1000 °C</text><text x="680" y="560" text-anchor="start" font-size="12" font-weight="800" fill="#475569">≈ 1900 °C</text>
<g class="part" data-part="raw" data-name="Raw materials (the charge)" data-info="Iron ore (haematite, Fe₂O₃), coke (carbon) and limestone (CaCO₃) added at the top." tabindex="0" role="button" aria-label="Raw materials (the charge)"><path d="M 380 70 L 500 70 L 470 120 L 410 120 Z" fill="#64748b"/><text x="440" y="60" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">iron ore + coke + limestone</text><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.0625;0.0750;0.1938;0.2063;1.0000" values="0;0;1;1;0;0" dur="16s" begin="bf-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.0625;0.1875;1.0000" values="420 80;420 80;420 300;420 300" dur="16s" begin="bf-play.begin+0s" fill="freeze"/><rect x="-7" y="-7" width="14" height="14" fill="#7f1d1d" stroke="#334155"/></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.0875;0.1000;0.2188;0.2313;1.0000" values="0;0;1;1;0;0" dur="16s" begin="bf-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.0875;0.2125;1.0000" values="440 80;440 80;440 300;440 300" dur="16s" begin="bf-play.begin+0s" fill="freeze"/><rect x="-7" y="-7" width="14" height="14" fill="#111827" stroke="#334155"/></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.1125;0.1250;0.2438;0.2563;1.0000" values="0;0;1;1;0;0" dur="16s" begin="bf-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.1125;0.2375;1.0000" values="460 80;460 80;460 300;460 300" dur="16s" begin="bf-play.begin+0s" fill="freeze"/><rect x="-7" y="-7" width="14" height="14" fill="#e5e7eb" stroke="#334155"/></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.1375;0.1500;0.2688;0.2813;1.0000" values="0;0;1;1;0;0" dur="16s" begin="bf-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.1375;0.2625;1.0000" values="420 80;420 80;420 300;420 300" dur="16s" begin="bf-play.begin+0s" fill="freeze"/><rect x="-7" y="-7" width="14" height="14" fill="#7f1d1d" stroke="#334155"/></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.1625;0.1750;0.2938;0.3063;1.0000" values="0;0;1;1;0;0" dur="16s" begin="bf-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.1625;0.2875;1.0000" values="440 80;440 80;440 300;440 300" dur="16s" begin="bf-play.begin+0s" fill="freeze"/><rect x="-7" y="-7" width="14" height="14" fill="#111827" stroke="#334155"/></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.1875;0.2000;0.3187;0.3312;1.0000" values="0;0;1;1;0;0" dur="16s" begin="bf-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.1875;0.3125;1.0000" values="460 80;460 80;460 300;460 300" dur="16s" begin="bf-play.begin+0s" fill="freeze"/><rect x="-7" y="-7" width="14" height="14" fill="#e5e7eb" stroke="#334155"/></g></g></g>
<g class="part" data-part="air" data-name="Hot air blast" data-info="Blown in near the bottom." tabindex="0" role="button" aria-label="Hot air blast"><path d="M 120 520 L 262 520" stroke="#93c5fd" stroke-width="18"/><path d="M 760 520 L 618 520" stroke="#93c5fd" stroke-width="18"/><text x="150" y="504" text-anchor="middle" font-size="13" font-weight="800" fill="#1d4ed8">hot air</text><text x="730" y="504" text-anchor="middle" font-size="13" font-weight="800" fill="#1d4ed8">hot air</text></g>
<g class="part" data-part="burn" data-name="Coke burns" data-info="C + O₂ → CO₂: very exothermic, heating the furnace to about 1900 °C near the bottom." tabindex="0" role="button" aria-label="Coke burns"><g><animate attributeName="opacity" keyTimes="0.0000;0.1875;0.2062;1.0000" values="0;0;1;1" dur="16s" begin="bf-play.begin+0s" fill="freeze"/><line x1="440" y1="520" x2="820" y2="520" stroke="#475569" stroke-width="1.5" stroke-dasharray="4 4"/><rect x="820" y="502" width="380" height="36" rx="10" fill="#fff" stroke="#cbd5e1"/><text x="1010" y="525" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">C + O₂ → CO₂</text></g></g>
<g class="part" data-part="co" data-name="Carbon monoxide forms" data-info="CO₂ + C → 2CO, higher up." tabindex="0" role="button" aria-label="Carbon monoxide forms"><g><animate attributeName="opacity" keyTimes="0.0000;0.3438;0.3625;1.0000" values="0;0;1;1" dur="16s" begin="bf-play.begin+0s" fill="freeze"/><line x1="440" y1="420" x2="820" y2="420" stroke="#475569" stroke-width="1.5" stroke-dasharray="4 4"/><rect x="820" y="402" width="380" height="36" rx="10" fill="#fff" stroke="#cbd5e1"/><text x="1010" y="425" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">CO₂ + C → 2CO</text></g></g>
<g class="part" data-part="red" data-name="Iron oxide reduced" data-info="Fe₂O₃ + 3CO → 2Fe + 3CO₂. Molten iron trickles down." tabindex="0" role="button" aria-label="Iron oxide reduced"><g><animate attributeName="opacity" keyTimes="0.0000;0.5000;0.5188;1.0000" values="0;0;1;1" dur="16s" begin="bf-play.begin+0s" fill="freeze"/><line x1="440" y1="300" x2="820" y2="300" stroke="#475569" stroke-width="1.5" stroke-dasharray="4 4"/><rect x="820" y="282" width="380" height="36" rx="10" fill="#fff" stroke="#cbd5e1"/><text x="1010" y="305" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">Fe₂O₃ + 3CO → 2Fe + 3CO₂</text></g></g>
<g class="part" data-part="slag" data-name="Slag" data-info="Limestone decomposes, CaCO₃ → CaO + CO₂; CaO + SiO₂ (sandy impurities) → CaSiO₃, molten slag, which floats on the iron." tabindex="0" role="button" aria-label="Slag"><g><animate attributeName="opacity" keyTimes="0.0000;0.6562;0.6750;1.0000" values="0;0;1;1" dur="16s" begin="bf-play.begin+0s" fill="freeze"/><line x1="440" y1="230" x2="820" y2="230" stroke="#475569" stroke-width="1.5" stroke-dasharray="4 4"/><rect x="820" y="212" width="380" height="36" rx="10" fill="#fff" stroke="#cbd5e1"/><text x="1010" y="235" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">CaCO₃ → CaO + CO₂;  CaO + SiO₂ → CaSiO₃</text></g></g>
<g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.5312;0.5437;0.6625;0.6750;1.0000" values="0;0;1;1;0;0" dur="16s" begin="bf-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.5312;0.6562;1.0000" values="400 320;400 320;420 610;420 610" dur="16s" begin="bf-play.begin+0s" fill="freeze"/><circle r="6" fill="#ea580c" stroke="#7c2d12"/></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.5563;0.5687;0.6875;0.7000;1.0000" values="0;0;1;1;0;0" dur="16s" begin="bf-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.5563;0.6813;1.0000" values="415 320;415 320;432 610;432 610" dur="16s" begin="bf-play.begin+0s" fill="freeze"/><circle r="6" fill="#ea580c" stroke="#7c2d12"/></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.5813;0.5938;0.7125;0.7250;1.0000" values="0;0;1;1;0;0" dur="16s" begin="bf-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.5813;0.7063;1.0000" values="430 320;430 320;444 610;444 610" dur="16s" begin="bf-play.begin+0s" fill="freeze"/><circle r="6" fill="#ea580c" stroke="#7c2d12"/></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.6062;0.6187;0.7375;0.7500;1.0000" values="0;0;1;1;0;0" dur="16s" begin="bf-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.6062;0.7312;1.0000" values="445 320;445 320;456 610;456 610" dur="16s" begin="bf-play.begin+0s" fill="freeze"/><circle r="6" fill="#ea580c" stroke="#7c2d12"/></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.6312;0.6437;0.7625;0.7750;1.0000" values="0;0;1;1;0;0" dur="16s" begin="bf-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.6312;0.7562;1.0000" values="460 320;460 320;468 610;468 610" dur="16s" begin="bf-play.begin+0s" fill="freeze"/><circle r="6" fill="#ea580c" stroke="#7c2d12"/></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.6562;0.6687;0.7875;0.8000;1.0000" values="0;0;1;1;0;0" dur="16s" begin="bf-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.6562;0.7812;1.0000" values="475 320;475 320;480 610;480 610" dur="16s" begin="bf-play.begin+0s" fill="freeze"/><circle r="6" fill="#ea580c" stroke="#7c2d12"/></g></g>
<g class="part" data-part="out" data-name="Products" data-info="Molten iron and slag are tapped off at the bottom; waste gases leave at the top." tabindex="0" role="button" aria-label="Products"><rect x="330" y="590" width="220" height="45" fill="#f97316"/><text x="440" y="618" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">molten iron</text><rect x="330" y="560" width="220" height="30" fill="#a8a29e"/><text x="440" y="580" text-anchor="middle" font-size="12" font-weight="800" fill="#1c1917">molten slag</text><g><animate attributeName="opacity" keyTimes="0.0000;0.8125;0.8313;1.0000" values="0;0;1;1" dur="16s" begin="bf-play.begin+0s" fill="freeze"/><path d="M 330 612 L 200 612 L 200 660" fill="none" stroke="#f97316" stroke-width="10"/><path d="M 550 575 L 690 575 L 690 640" fill="none" stroke="#a8a29e" stroke-width="10"/><text x="200" y="680" text-anchor="middle" font-size="12" font-weight="800" fill="#c2410c">iron tapped off</text><text x="690" y="660" text-anchor="middle" font-size="12" font-weight="800" fill="#57534e">slag tapped off</text></g></g>
<path d="M 520 140 L 640 100" stroke="#64748b" stroke-width="10"/><text x="700" y="96" text-anchor="middle" font-size="12" font-weight="800" fill="#475569">waste gases</text>
