<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" class="vd-svg" role="img" aria-labelledby="h2-title h2-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="h2-play" data-vd-play-label="Play: forming H₂" data-vd-steps="[[0, &quot;Two hydrogen atoms, each with one electron (dot or cross) in its only shell.&quot;], [1.5, &quot;The atoms come close and their shells overlap.&quot;], [4, &quot;The two electrons are shared as a pair between the nuclei. Both nuclei attract the shared pair: a covalent bond.&quot;], [7, &quot;Each hydrogen atom now has 2 electrons in its outer shell, a full shell. The molecule is H\u2082, drawn H\u2013H.&quot;]]" data-vd-dur="10">
<title id="h2-title">A covalent bond: the hydrogen molecule</title><desc id="h2-desc">Dot-and-cross diagram: two hydrogen atoms approach, their shells overlap and they share a pair of electrons to form H₂.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1200" height="520" fill="#ffffff"/>
<g aria-hidden="true"><animate id="h2-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<text class="head" x="30" y="34">A covalent bond: two hydrogen atoms share a pair of electrons</text><text class="note" x="30" y="56">Dot-and-cross diagram: dot = electron from one atom, cross = electron from the other.</text>
<g class="part" data-part="h" data-name="Hydrogen atom" data-info="One proton and one electron in the first shell. One more electron would fill the shell." tabindex="0" role="button" aria-label="Hydrogen atom"><g transform="translate(330 260)"><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.1500;0.4000;1.0000" values="0 0;0 0;190 0;190 0" dur="10s" begin="h2-play.begin+0s" fill="freeze"/><circle r="90" fill="#e0f2fe" fill-opacity=".6" stroke="#0369a1" stroke-width="3"/><circle r="14" fill="#ef4444" stroke="#7f1d1d"/><text y="5" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">H</text><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.3000;0.4500;1.0000" values="0 0;0 0;170 -12;170 -12" dur="10s" begin="h2-play.begin+0s" fill="freeze"/><g transform="translate(-90 0)"><circle r="8" fill="#111827"/></g></g></g></g><g transform="translate(870 260)"><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.1500;0.4000;1.0000" values="0 0;0 0;-190 0;-190 0" dur="10s" begin="h2-play.begin+0s" fill="freeze"/><circle r="90" fill="#e0f2fe" fill-opacity=".6" stroke="#0369a1" stroke-width="3"/><circle r="14" fill="#ef4444" stroke="#7f1d1d"/><text y="5" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">H</text><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.3000;0.4500;1.0000" values="0 0;0 0;-170 12;-170 12" dur="10s" begin="h2-play.begin+0s" fill="freeze"/><g transform="translate(90 0)"><path d="M -8 -8 L 8 8 M -8 8 L 8 -8" stroke="#dc2626" stroke-width="4"/></g></g></g></g></g>
<g class="part" data-part="pair" data-name="Shared pair of electrons" data-info="Each atom provides one electron. Both nuclei are attracted to the shared pair: this electrostatic attraction is the covalent bond." tabindex="0" role="button" aria-label="Shared pair of electrons"><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.4600;0.4900;1.0000" values="0;0;1;1" dur="10s" begin="h2-play.begin+0s" fill="freeze"/><ellipse cx="600" cy="260" rx="34" ry="44" fill="none" stroke="#7c3aed" stroke-width="3" stroke-dasharray="5 4"/><text x="600" y="204" text-anchor="middle" font-size="14" font-weight="700" fill="#6d28d9">shared pair</text></g></g>
<g class="part" data-part="mol" data-name="Hydrogen molecule, H₂" data-info="Each atom now effectively has a full outer shell (2 electrons). Written H–H: a single covalent bond." tabindex="0" role="button" aria-label="Hydrogen molecule, H₂"><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.7000;0.7300;1.0000" values="0;0;1;1" dur="10s" begin="h2-play.begin+0s" fill="freeze"/><text x="600" y="430" text-anchor="middle" font-size="26" font-weight="800">H–H   (H₂)</text><text x="600" y="460" text-anchor="middle" font-size="14">each H atom: 2 electrons, a full shell</text></g></g>
<g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.0000;0.0300;0.1500;0.1800;1.0000" values="0;0;1;1;0;0" dur="10s" begin="h2-play.begin+0s" fill="freeze"/><text x="330" y="400" text-anchor="middle" font-size="14">H atom: 1 electron</text><text x="870" y="400" text-anchor="middle" font-size="14">H atom: 1 electron</text></g>
<text x="330" y="400" text-anchor="middle" font-size="14">H atom: 1 electron<set attributeName="opacity" to="0" begin="h2-play.begin+0s"/></text><text x="870" y="400" text-anchor="middle" font-size="14">H atom: 1 electron<set attributeName="opacity" to="0" begin="h2-play.begin+0s"/></text>
</svg>