<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 680" class="vd-svg" role="img" aria-labelledby="po-title po-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="po-play" data-vd-play-label="Play: add the dipoles" data-vd-steps="[[0, &quot;Polar bonds and polar molecules.&quot;], [1, &quot;A bond is polar when the atoms differ in electronegativity.&quot;], [3.5, &quot;CO\u2082: two polar bonds, but linear, so the dipoles cancel: non-polar.&quot;], [6, &quot;H\u2082O: bent, so the dipoles add: polar.&quot;], [8.5, &quot;BF\u2083 is non-polar; NH\u2083 is polar.&quot;], [11, &quot;The shape decides: symmetric molecules with identical bonds are non-polar.&quot;]]" data-vd-dur="14">
<title id="po-title">Bond and molecular polarity</title><desc id="po-desc">Bond dipoles from electronegativity differences and how molecular shape decides polarity: CO2 and BF3 are non-polar because dipoles cancel, while H2O and NH3 are polar with a net dipole.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1220" height="680" fill="#ffffff"/>
<g aria-hidden="true"><animate id="po-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<defs><marker id="po-dc2626" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="6.3" refY="7.0" orient="auto"><path d="M0,0 L14,7.0 L0,14 z" fill="#dc2626"/></marker><marker id="po-7c3aed" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="6.3" refY="7.0" orient="auto"><path d="M0,0 L14,7.0 L0,14 z" fill="#7c3aed"/></marker></defs>
<text class="head" x="30" y="34">Polarity depends on bonds and shape</text><text class="note" x="30" y="56">Dipole arrows point towards the δ− end (more electronegative atom).</text>
<g class="part" data-part="en" data-name="Electronegativity" data-info="How strongly an atom attracts the shared pair in a bond (Pauling scale: F 4.0, O 3.4, N 3.0, C 2.6, H 2.2)." tabindex="0" role="button" aria-label="Electronegativity"><rect x="40" y="90" width="1140" height="60" rx="12" fill="#f8fafc" stroke="#cbd5e1"/><text x="60" y="126" text-anchor="start" font-size="13" font-weight="800" fill="#111827">Electronegativity:</text><circle cx="250.0" cy="120.0" r="16" fill="#f3f4f6" stroke="#111827" stroke-width="1.5"/><text x="250" y="124" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">H</text><text x="276" y="126" text-anchor="start" font-size="13" font-weight="800" fill="#111827">2.2</text><circle cx="360.0" cy="120.0" r="16" fill="#374151" stroke="#111827" stroke-width="1.5"/><text x="360" y="124" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">C</text><text x="386" y="126" text-anchor="start" font-size="13" font-weight="800" fill="#111827">2.6</text><circle cx="470.0" cy="120.0" r="16" fill="#fda4af" stroke="#111827" stroke-width="1.5"/><text x="470" y="124" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">B</text><text x="496" y="126" text-anchor="start" font-size="13" font-weight="800" fill="#111827">2.0</text><circle cx="580.0" cy="120.0" r="16" fill="#3b82f6" stroke="#111827" stroke-width="1.5"/><text x="580" y="124" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">N</text><text x="606" y="126" text-anchor="start" font-size="13" font-weight="800" fill="#111827">3.0</text><circle cx="690.0" cy="120.0" r="16" fill="#ef4444" stroke="#111827" stroke-width="1.5"/><text x="690" y="124" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">O</text><text x="716" y="126" text-anchor="start" font-size="13" font-weight="800" fill="#111827">3.4</text><circle cx="800.0" cy="120.0" r="16" fill="#a3e635" stroke="#111827" stroke-width="1.5"/><text x="800" y="124" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">F</text><text x="826" y="126" text-anchor="start" font-size="13" font-weight="800" fill="#111827">4.0</text></g>
<g class="part" data-part="bond" data-name="Polar bond" data-info="Different electronegativities: electrons are pulled towards the more electronegative atom, giving δ− and δ+ ends: a bond dipole." tabindex="0" role="button" aria-label="Polar bond"><g><animate attributeName="opacity" keyTimes="0.0000;0.0714;0.0929;1.0000" values="0;0;1;1" dur="14s" begin="po-play.begin+0s" fill="freeze"/><circle cx="160.0" cy="240.0" r="16" fill="#f3f4f6" stroke="#111827" stroke-width="1.5"/><text x="160" y="244" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">H</text><line x1="176" y1="240" x2="244" y2="240" stroke="#111827" stroke-width="4"/><circle cx="270.0" cy="240.0" r="22" fill="#22c55e" stroke="#111827" stroke-width="1.5"/><text x="270" y="244" text-anchor="middle" font-size="11" font-weight="800" fill="#fff">Cl</text><text x="160" y="214" text-anchor="middle" font-size="14" font-weight="800" fill="#2563eb">δ+</text><text x="270" y="208" text-anchor="middle" font-size="14" font-weight="800" fill="#dc2626">δ−</text><path d="M 160 280 L 270 280" stroke="#dc2626" stroke-width="3" marker-end="url(#po-dc2626)"/><line x1="172" y1="272" x2="172" y2="288" stroke="#dc2626" stroke-width="3"/><text x="215" y="310" text-anchor="middle" font-size="12" font-weight="800" fill="#b91c1c">bond dipole</text></g></g>
<g class="part" data-part="co2" data-name="CO₂: non-polar molecule" data-info="Linear: the two C=O dipoles are equal and opposite and cancel." tabindex="0" role="button" aria-label="CO₂: non-polar molecule"><g><animate attributeName="opacity" keyTimes="0.0000;0.2500;0.2714;1.0000" values="0;0;1;1" dur="14s" begin="po-play.begin+0s" fill="freeze"/><circle cx="520.0" cy="240.0" r="20" fill="#374151" stroke="#111827" stroke-width="1.5"/><text x="520" y="244" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">C</text><line x1="440" y1="236" x2="500" y2="236" stroke="#111827" stroke-width="3"/><line x1="440" y1="244" x2="500" y2="244" stroke="#111827" stroke-width="3"/><line x1="540" y1="236" x2="600" y2="236" stroke="#111827" stroke-width="3"/><line x1="540" y1="244" x2="600" y2="244" stroke="#111827" stroke-width="3"/><circle cx="420.0" cy="240.0" r="20" fill="#ef4444" stroke="#111827" stroke-width="1.5"/><text x="420" y="244" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">O</text><circle cx="620.0" cy="240.0" r="20" fill="#ef4444" stroke="#111827" stroke-width="1.5"/><text x="620" y="244" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">O</text><g><animate attributeName="opacity" keyTimes="0.0000;0.2500;0.2714;1.0000" values="0;0;1;1" dur="14s" begin="po-play.begin+0s" fill="freeze"/><path d="M 500 280 L 430 280" stroke="#dc2626" stroke-width="3.5" marker-end="url(#po-dc2626)"/><path d="M 540 280 L 610 280" stroke="#dc2626" stroke-width="3.5" marker-end="url(#po-dc2626)"/><text x="520" y="318" text-anchor="middle" font-size="13" font-weight="800" fill="#475569">dipoles cancel → NON-POLAR</text></g><text x="520" y="190" text-anchor="middle" font-size="15" font-weight="800" fill="#111827">CO₂ (linear)</text></g></g>
<g class="part" data-part="h2o" data-name="H₂O: polar molecule" data-info="Bent: the two O–H dipoles add up to a net dipole." tabindex="0" role="button" aria-label="H₂O: polar molecule"><g><animate attributeName="opacity" keyTimes="0.0000;0.4286;0.4500;1.0000" values="0;0;1;1" dur="14s" begin="po-play.begin+0s" fill="freeze"/><circle cx="830.0" cy="290.0" r="16" fill="#f3f4f6" stroke="#111827" stroke-width="1.5"/><text x="830" y="294" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">H</text><circle cx="970.0" cy="290.0" r="16" fill="#f3f4f6" stroke="#111827" stroke-width="1.5"/><text x="970" y="294" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">H</text><line x1="900" y1="230" x2="840" y2="282" stroke="#111827" stroke-width="4"/><line x1="900" y1="230" x2="960" y2="282" stroke="#111827" stroke-width="4"/><circle cx="900.0" cy="230.0" r="22" fill="#ef4444" stroke="#111827" stroke-width="1.5"/><text x="900" y="234" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">O</text><g><animate attributeName="opacity" keyTimes="0.0000;0.4286;0.4500;1.0000" values="0;0;1;1" dur="14s" begin="po-play.begin+0s" fill="freeze"/><path d="M 820 320 L 880 270" stroke="#dc2626" stroke-width="3.5" marker-end="url(#po-dc2626)"/><path d="M 980 320 L 920 270" stroke="#dc2626" stroke-width="3.5" marker-end="url(#po-dc2626)"/><path d="M 1040 310 L 1040 220" stroke="#7c3aed" stroke-width="3.5" marker-end="url(#po-7c3aed)"/><text x="1054" y="270" text-anchor="start" font-size="12" font-weight="800" fill="#6d28d9">net</text><text x="1054" y="286" text-anchor="start" font-size="12" font-weight="800" fill="#6d28d9">dipole</text><text x="900" y="360" text-anchor="middle" font-size="13" font-weight="800" fill="#475569">dipoles add → POLAR</text></g><text x="900" y="180" text-anchor="middle" font-size="15" font-weight="800" fill="#111827">H₂O (bent)</text></g></g>
<g class="part" data-part="bf3" data-name="BF₃: non-polar molecule" data-info="Trigonal planar: three equal dipoles at 120° cancel." tabindex="0" role="button" aria-label="BF₃: non-polar molecule"><g><animate attributeName="opacity" keyTimes="0.0000;0.6071;0.6286;1.0000" values="0;0;1;1" dur="14s" begin="po-play.begin+0s" fill="freeze"/><line x1="330" y1="500" x2="330" y2="430" stroke="#111827" stroke-width="4"/><line x1="330" y1="500" x2="269" y2="535" stroke="#111827" stroke-width="4"/><line x1="330" y1="500" x2="391" y2="535" stroke="#111827" stroke-width="4"/><circle cx="330.0" cy="430.0" r="17" fill="#a3e635" stroke="#111827" stroke-width="1.5"/><text x="330.0" y="434.0" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">F</text><circle cx="269.4" cy="535.0" r="17" fill="#a3e635" stroke="#111827" stroke-width="1.5"/><text x="269.3782217350893" y="539.0" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">F</text><circle cx="390.6" cy="535.0" r="17" fill="#a3e635" stroke="#111827" stroke-width="1.5"/><text x="390.6217782649107" y="539.0" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">F</text><circle cx="330.0" cy="500.0" r="20" fill="#fda4af" stroke="#111827" stroke-width="1.5"/><text x="330" y="504" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">B</text><g><animate attributeName="opacity" keyTimes="0.0000;0.6071;0.6286;1.0000" values="0;0;1;1" dur="14s" begin="po-play.begin+0s" fill="freeze"/><path d="M 330 474 L 330 440" stroke="#dc2626" stroke-width="3.5" marker-end="url(#po-dc2626)"/><path d="M 307 513 L 278 530" stroke="#dc2626" stroke-width="3.5" marker-end="url(#po-dc2626)"/><path d="M 353 513 L 382 530" stroke="#dc2626" stroke-width="3.5" marker-end="url(#po-dc2626)"/></g><text x="330" y="610" text-anchor="middle" font-size="13" font-weight="800" fill="#475569">BF₃: symmetric → NON-POLAR</text></g></g>
<g class="part" data-part="nh3" data-name="NH₃: polar molecule" data-info="Trigonal pyramidal: the dipoles do not cancel; net dipole towards the lone pair side." tabindex="0" role="button" aria-label="NH₃: polar molecule"><g><animate attributeName="opacity" keyTimes="0.0000;0.6071;0.6286;1.0000" values="0;0;1;1" dur="14s" begin="po-play.begin+0s" fill="freeze"/><ellipse cx="850" cy="450" rx="16" ry="26" fill="#c7d2fe" stroke="#6366f1"/><line x1="850" y1="500" x2="780" y2="540" stroke="#111827" stroke-width="4"/><line x1="850" y1="500" x2="920" y2="540" stroke="#111827" stroke-width="4"/><line x1="850" y1="500" x2="870" y2="560" stroke="#111827" stroke-width="4"/><circle cx="780.0" cy="540.0" r="15" fill="#f3f4f6" stroke="#111827" stroke-width="1.5"/><text x="780" y="544" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">H</text><circle cx="920.0" cy="540.0" r="15" fill="#f3f4f6" stroke="#111827" stroke-width="1.5"/><text x="920" y="544" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">H</text><circle cx="870.0" cy="560.0" r="15" fill="#f3f4f6" stroke="#111827" stroke-width="1.5"/><text x="870" y="564" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">H</text><circle cx="850.0" cy="500.0" r="20" fill="#3b82f6" stroke="#111827" stroke-width="1.5"/><text x="850" y="504" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">N</text><g><animate attributeName="opacity" keyTimes="0.0000;0.6429;0.6643;1.0000" values="0;0;1;1" dur="14s" begin="po-play.begin+0s" fill="freeze"/><path d="M 1000 550 L 1000 460" stroke="#7c3aed" stroke-width="3.5" marker-end="url(#po-7c3aed)"/><text x="1014" y="510" text-anchor="start" font-size="12" font-weight="800" fill="#6d28d9">net dipole</text></g><text x="850" y="610" text-anchor="middle" font-size="13" font-weight="800" fill="#475569">NH₃: pyramidal → POLAR</text></g></g>
<g><animate attributeName="opacity" keyTimes="0.0000;0.7857;0.8071;1.0000" values="0;0;1;1" dur="14s" begin="po-play.begin+0s" fill="freeze"/><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.7857;0.8071;1.0000" values="0;0;1;1" dur="14s" begin="po-play.begin+0s" fill="freeze"/><rect x="310.0" y="643" width="600" height="24" rx="12" fill="#fef9c3" stroke="#1f2937" stroke-width="1"/><text x="610" y="660" text-anchor="middle" font-size="12" font-weight="700">Symmetrical shape + identical bonds → dipoles cancel → non-polar molecule</text></g></g>
</svg>