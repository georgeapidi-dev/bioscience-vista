<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" class="vd-svg" role="img" aria-labelledby="fd-title fd-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="fd-play" data-vd-play-label="Play: separating crude oil" data-vd-steps="[[0, &quot;Crude oil is heated in a furnace to about 350\u2013400 \u00b0C, so most of it vaporises.&quot;], [2, &quot;The vapour enters near the bottom of the column. It rises and cools as it goes up.&quot;], [4, &quot;Each hydrocarbon condenses at the level where the temperature falls below its boiling point: big molecules low down, small ones higher up.&quot;], [8, &quot;Each fraction is drawn off at its own level. Refinery gases leave at the top; bitumen (residue) is drained from the bottom.&quot;], [11, &quot;Down the column: longer chains, higher boiling points, more viscous and less flammable.&quot;]]" data-vd-dur="14">
<title id="fd-title">Fractional distillation of crude oil</title><desc id="fd-desc">A fractionating column with a furnace. Vapour rises, cools and condenses at different levels; fractions from refinery gases at the top to bitumen at the bottom are drawn off.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1200" height="760" fill="#ffffff"/>
<g aria-hidden="true"><animate id="fd-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<defs><marker id="fd-475569" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#475569"/></marker><marker id="fd-b91c1c" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#b91c1c"/></marker><marker id="fd-1d4ed8" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#1d4ed8"/></marker></defs>
<defs><linearGradient id="fd-g" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#fecaca"/><stop offset="1" stop-color="#dbeafe"/></linearGradient></defs>
<text class="head" x="30" y="34">Fractional distillation of crude oil</text><text class="note" x="30" y="56">Simplified; boiling points are approximate.</text>
<g class="part" data-part="col" data-name="Fractionating column" data-info="Hot at the bottom, cooler at the top: a temperature gradient. Vapours rise and condense at the level where the temperature is below their boiling point." tabindex="0" role="button" aria-label="Fractionating column"><rect x="440" y="110" width="160" height="570" rx="20" fill="url(#fd-g)" stroke="#334155" stroke-width="4"/></g>
<g class="part" data-part="tray" data-name="Trays with bubble caps" data-info="Vapour bubbles up through liquid on each tray; the liquid that condenses there is drawn off as a fraction." tabindex="0" role="button" aria-label="Trays with bubble caps"><line x1="444" y1="223" x2="596" y2="223" stroke="#475569" stroke-width="4"/><path d="M 470 223 L 470 213 Q 480 203 490 213 L 490 223" fill="#94a3b8" stroke="#334155"/><path d="M 550 223 L 550 213 Q 560 203 570 213 L 570 223" fill="#94a3b8" stroke="#334155"/><line x1="444" y1="298" x2="596" y2="298" stroke="#475569" stroke-width="4"/><path d="M 470 298 L 470 288 Q 480 278 490 288 L 490 298" fill="#94a3b8" stroke="#334155"/><path d="M 550 298 L 550 288 Q 560 278 570 288 L 570 298" fill="#94a3b8" stroke="#334155"/><line x1="444" y1="373" x2="596" y2="373" stroke="#475569" stroke-width="4"/><path d="M 470 373 L 470 363 Q 480 353 490 363 L 490 373" fill="#94a3b8" stroke="#334155"/><path d="M 550 373 L 550 363 Q 560 353 570 363 L 570 373" fill="#94a3b8" stroke="#334155"/><line x1="444" y1="448" x2="596" y2="448" stroke="#475569" stroke-width="4"/><path d="M 470 448 L 470 438 Q 480 428 490 438 L 490 448" fill="#94a3b8" stroke="#334155"/><path d="M 550 448 L 550 438 Q 560 428 570 438 L 570 448" fill="#94a3b8" stroke="#334155"/><line x1="444" y1="523" x2="596" y2="523" stroke="#475569" stroke-width="4"/><path d="M 470 523 L 470 513 Q 480 503 490 513 L 490 523" fill="#94a3b8" stroke="#334155"/><path d="M 550 523 L 550 513 Q 560 503 570 513 L 570 523" fill="#94a3b8" stroke="#334155"/></g>
<g class="part" data-part="f0" data-name="Refinery gases" data-info="C1–C4, boiling point below 25 °C. Bottled gas (LPG) for heating and cooking." tabindex="0" role="button" aria-label="Refinery gases"><path d="M 600 130 L 700 130" stroke="#475569" stroke-width="10"/><path d="M 600 130 L 700 130" stroke="#e0f2fe" stroke-width="5"/><rect x="706" y="112" width="300" height="36" rx="8" fill="#e0f2fe" stroke="#334155"/><text x="716" y="135" font-size="14" font-weight="700" fill="#111827">Refinery gases</text><text x="900" y="135" font-size="12" fill="#111827">< 25 °C · C1–C4</text></g>
<g class="part" data-part="f1" data-name="Petrol (gasoline)" data-info="About C5–C10, boiling point about 40 °C. Fuel for cars." tabindex="0" role="button" aria-label="Petrol (gasoline)"><path d="M 600 205 L 700 205" stroke="#475569" stroke-width="10"/><path d="M 600 205 L 700 205" stroke="#fef9c3" stroke-width="5"/><rect x="706" y="187" width="300" height="36" rx="8" fill="#fef9c3" stroke="#334155"/><text x="716" y="210" font-size="14" font-weight="700" fill="#111827">Petrol</text><text x="900" y="210" font-size="12" fill="#111827">40 °C · C5–C10</text></g>
<g class="part" data-part="f2" data-name="Naphtha" data-info="About C8–C12, about 110 °C. Feedstock for making chemicals and plastics." tabindex="0" role="button" aria-label="Naphtha"><path d="M 600 280 L 700 280" stroke="#475569" stroke-width="10"/><path d="M 600 280 L 700 280" stroke="#fde68a" stroke-width="5"/><rect x="706" y="262" width="300" height="36" rx="8" fill="#fde68a" stroke="#334155"/><text x="716" y="285" font-size="14" font-weight="700" fill="#111827">Naphtha</text><text x="900" y="285" font-size="12" fill="#111827">110 °C · C8–C12</text></g>
<g class="part" data-part="f3" data-name="Kerosene (paraffin)" data-info="About C10–C16, about 180 °C. Jet fuel, paraffin for lamps." tabindex="0" role="button" aria-label="Kerosene (paraffin)"><path d="M 600 355 L 700 355" stroke="#475569" stroke-width="10"/><path d="M 600 355 L 700 355" stroke="#fcd34d" stroke-width="5"/><rect x="706" y="337" width="300" height="36" rx="8" fill="#fcd34d" stroke="#334155"/><text x="716" y="360" font-size="14" font-weight="700" fill="#111827">Kerosene</text><text x="900" y="360" font-size="12" fill="#111827">180 °C · C10–C16</text></g>
<g class="part" data-part="f4" data-name="Diesel oil (gas oil)" data-info="About C14–C20, about 260 °C. Fuel for diesel engines." tabindex="0" role="button" aria-label="Diesel oil (gas oil)"><path d="M 600 430 L 700 430" stroke="#475569" stroke-width="10"/><path d="M 600 430 L 700 430" stroke="#f59e0b" stroke-width="5"/><rect x="706" y="412" width="300" height="36" rx="8" fill="#f59e0b" stroke="#334155"/><text x="716" y="435" font-size="14" font-weight="700" fill="#111827">Diesel</text><text x="900" y="435" font-size="12" fill="#111827">260 °C · C14–C20</text></g>
<g class="part" data-part="f5" data-name="Fuel oil" data-info="About C20–C40, about 340 °C. Fuel for ships and power stations." tabindex="0" role="button" aria-label="Fuel oil"><path d="M 600 505 L 700 505" stroke="#475569" stroke-width="10"/><path d="M 600 505 L 700 505" stroke="#b45309" stroke-width="5"/><rect x="706" y="487" width="300" height="36" rx="8" fill="#b45309" stroke="#334155"/><text x="716" y="510" font-size="14" font-weight="700" fill="#fff">Fuel oil</text><text x="900" y="510" font-size="12" fill="#fff">340 °C · C20–C40</text></g>
<g class="part" data-part="f6" data-name="Bitumen (residue)" data-info="More than C40, boiling point above 400 °C: does not vaporise. Roads and roofing." tabindex="0" role="button" aria-label="Bitumen (residue)"><path d="M 520 680 L 520 720 L 700 720" fill="none" stroke="#475569" stroke-width="10"/><path d="M 520 680 L 520 720 L 700 720" fill="none" stroke="#1c1917" stroke-width="5"/><rect x="706" y="702" width="300" height="36" rx="8" fill="#1c1917" stroke="#334155"/><text x="716" y="725" font-size="14" font-weight="700" fill="#fff">Bitumen</text><text x="900" y="725" font-size="12" fill="#fff">> 400 °C · > C40</text></g>
<g class="part" data-part="grad" data-name="Temperature gradient" data-info="About 25 °C at the top to about 350 °C at the bottom." tabindex="0" role="button" aria-label="Temperature gradient"><text x="428" y="140" text-anchor="end" font-size="13" font-weight="700" fill="#1d4ed8">25 °C</text><text x="428" y="580" text-anchor="end" font-size="13" font-weight="700" fill="#b91c1c">350 °C</text><path d="M 410 550 L 410 160" stroke="#475569" stroke-width="2.5" marker-end="url(#fd-475569)"/><text x="400" y="395.0" text-anchor="middle" font-size="12" transform="rotate(-90 400 395.0)">cooler going up</text></g>
<g class="part" data-part="fur" data-name="Furnace (heater)" data-info="Heats the crude oil to about 350–400 °C so that most of it vaporises." tabindex="0" role="button" aria-label="Furnace (heater)"><rect x="150" y="560" width="160" height="110" rx="12" fill="#fee2e2" stroke="#991b1b" stroke-width="3"/><text x="230" y="610" text-anchor="middle" font-size="14" font-weight="700">furnace</text><text x="230" y="630" text-anchor="middle" font-size="12">350–400 °C</text><path d="M 190 668 q -8 -18 0 -30 q 8 12 0 30" fill="#f97316"/><path d="M 230 668 q -8 -18 0 -30 q 8 12 0 30" fill="#f97316"/><path d="M 270 668 q -8 -18 0 -30 q 8 12 0 30" fill="#f97316"/><path d="M 310 600 L 440 600" stroke="#475569" stroke-width="12"/><path d="M 310 600 L 440 600" stroke="#fecaca" stroke-width="6"/></g>
<g class="part" data-part="crude" data-name="Crude oil" data-info="A mixture of many hydrocarbons (mostly alkanes) with different chain lengths and boiling points." tabindex="0" role="button" aria-label="Crude oil"><path d="M 40 615 L 150 615" stroke="#1c1917" stroke-width="12"/><text x="40" y="600" font-size="14" font-weight="700">crude oil</text></g>
<g class="part" data-part="trend" data-name="Trends down the column" data-info="Longer chains → higher boiling point, more viscous (thicker), less flammable, darker." tabindex="0" role="button" aria-label="Trends down the column"><rect x="1030" y="130" width="140" height="590" rx="10" fill="#f8fafc" stroke="#cbd5e1"/><path d="M 1100 160 L 1100 690" stroke="#475569" stroke-width="3" marker-end="url(#fd-475569)"/><text x="1100" y="210" text-anchor="middle" font-size="12" font-weight="700" paint-order="stroke" stroke="#f8fafc" stroke-width="6">longer chains</text><text x="1100" y="300" text-anchor="middle" font-size="12" font-weight="700" paint-order="stroke" stroke="#f8fafc" stroke-width="6">higher</text><text x="1100" y="316" text-anchor="middle" font-size="12" font-weight="700" paint-order="stroke" stroke="#f8fafc" stroke-width="6">boiling point</text><text x="1100" y="400" text-anchor="middle" font-size="12" font-weight="700" paint-order="stroke" stroke="#f8fafc" stroke-width="6">more viscous</text><text x="1100" y="490" text-anchor="middle" font-size="12" font-weight="700" paint-order="stroke" stroke="#f8fafc" stroke-width="6">less</text><text x="1100" y="506" text-anchor="middle" font-size="12" font-weight="700" paint-order="stroke" stroke="#f8fafc" stroke-width="6">flammable</text><text x="1100" y="590" text-anchor="middle" font-size="12" font-weight="700" paint-order="stroke" stroke="#f8fafc" stroke-width="6">darker</text></g>
