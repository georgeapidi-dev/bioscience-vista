<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 720" class="vd-svg" role="img" aria-labelledby="vs-title vs-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="vs-play" data-vd-play-label="Play: shape by shape" data-vd-steps="[[0, &quot;Valence shell electron pair repulsion (VSEPR): shapes of molecules.&quot;], [1, &quot;Two domains: linear, 180\u00b0.&quot;], [3, &quot;Three domains: trigonal planar, 120\u00b0; one lone pair makes it bent.&quot;], [6, &quot;Four domains: tetrahedral 109.5\u00b0; lone pairs squeeze the angles to 107\u00b0 and 104.5\u00b0.&quot;], [10, &quot;Five and six domains (HL): trigonal bipyramidal and octahedral.&quot;], [13, &quot;Lone pairs repel more strongly than bonding pairs.&quot;]]" data-vd-dur="16">
<title id="vs-title">Shapes of molecules (VSEPR)</title><desc id="vs-desc">Molecular shapes predicted by VSEPR: linear CO2, trigonal planar BF3, bent SO2, tetrahedral CH4, trigonal pyramidal NH3, bent H2O, trigonal bipyramidal PCl5 and octahedral SF6, with bond angles.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
