<g class="part" data-part="rule" data-name="VSEPR theory" data-info="Electron domains (bonding pairs, lone pairs, multiple bonds) around the central atom repel and get as far apart as possible." tabindex="0" role="button" aria-label="VSEPR theory"><g><animate attributeName="opacity" keyTimes="0.0000;0.8125;0.8313;1.0000" values="0;0;1;1" dur="16s" begin="vs-play.begin+0s" fill="freeze"/><rect x="40" y="670" width="1140" height="40" rx="12" fill="#fef9c3" stroke="#eab308"/><text x="610" y="696" text-anchor="middle" font-size="13" font-weight="800" fill="#713f12">Electron domains repel as far apart as possible. Repulsion: lone pair–lone pair > lone pair–bond pair > bond pair–bond pair</text></g></g>
