<g class="part" data-part="cat" data-name="Catalysed by Fe²⁺" data-info="Step 1: S₂O₈²⁻ + 2Fe²⁺ → 2SO₄²⁻ + 2Fe³⁺. Step 2: 2Fe³⁺ + 2I⁻ → 2Fe²⁺ + I₂. Oppositely charged ions attract; Fe²⁺ is regenerated. Fe³⁺ works equally well (starts at step 2)." tabindex="0" role="button" aria-label="Catalysed by Fe²⁺"><g><animate attributeName="opacity" keyTimes="0.0000;0.3333;0.3533;1.0000" values="0;0;1;1" dur="15s" begin="hm-play.begin+0s" fill="freeze"/><rect x="680.0" y="102.0" width="380" height="56" rx="12" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/><text x="870" y="128" text-anchor="middle" font-size="14" font-weight="800" fill="#111827">S₂O₈²⁻ + 2Fe²⁺ → 2SO₄²⁻ + 2Fe³⁺</text><text x="870" y="146" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">step 1: Fe²⁺ oxidised</text><rect x="680.0" y="192.0" width="380" height="56" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="870" y="218" text-anchor="middle" font-size="14" font-weight="800" fill="#111827">2Fe³⁺ + 2I⁻ → 2Fe²⁺ + I₂</text><text x="870" y="236" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">step 2: Fe²⁺ regenerated</text></g></g>
<g class="part" data-part="why" data-name="Why iron works" data-info="Transition metals have variable oxidation states. Both steps are feasible from E⦵: E⦵(S₂O₈²⁻/SO₄²⁻) +2.01 &gt; E⦵(Fe³⁺/Fe²⁺) +0.77 &gt; E⦵(I₂/I⁻) +0.54." tabindex="0" role="button" aria-label="Why iron works"><g><animate attributeName="opacity" keyTimes="0.0000;0.7333;0.7533;1.0000" values="0;0;1;1" dur="15s" begin="hm-play.begin+0s" fill="freeze"/><rect x="680" y="290" width="380" height="200" rx="16" fill="#fef9c3" stroke="#eab308"/><text x="870" y="320" text-anchor="middle" font-size="14" font-weight="800" fill="#713f12">E⦵ / V</text><text x="870" y="356" text-anchor="middle" font-size="14" font-weight="800" fill="#111827">S₂O₈²⁻/SO₄²⁻   +2.01</text><text x="870" y="386" text-anchor="middle" font-size="14" font-weight="800" fill="#1d4ed8">Fe³⁺/Fe²⁺   +0.77</text><text x="870" y="416" text-anchor="middle" font-size="14" font-weight="800" fill="#111827">I₂/I⁻   +0.54</text><text x="870" y="456" text-anchor="middle" font-size="12" font-weight="800" fill="#15803d">Fe value lies between → both steps feasible</text></g></g>
</svg>