<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" class="vd-svg" role="img" aria-labelledby="hm-title hm-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="hm-play" data-vd-play-label="Play: catalyse" data-vd-steps="[[0, &quot;Homogeneous catalysis: peroxodisulfate and iodide.&quot;], [1, &quot;Uncatalysed: two anions repel; high Ea.&quot;], [5, &quot;Fe\u00b2\u207a is oxidised to Fe\u00b3\u207a, then reduced back.&quot;], [11, &quot;E\u29b5 values show both steps are feasible.&quot;]]" data-vd-dur="15">
<title id="hm-title">Homogeneous catalysis by iron ions</title><desc id="hm-desc">An energy profile with a single high hump for the uncatalysed reaction of peroxodisulfate and iodide ions and two lower humps for the iron-catalysed route, with the two steps oxidising iron(II) to iron(III) and reducing it back.</desc>
