<text class="head" x="30" y="34">Homogeneous catalysis: Fe²⁺ / Fe³⁺</text><text class="note" x="30" y="56">S₂O₈²⁻(aq) + 2I⁻(aq) → 2SO₄²⁻(aq) + I₂(aq).</text>
