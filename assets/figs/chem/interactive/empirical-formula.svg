<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" class="vd-svg" role="img" aria-labelledby="ef-title ef-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="ef-play" data-vd-play-label="Play: work it out" data-vd-steps="[[0, &quot;Finding an empirical formula.&quot;], [1, &quot;Start with the percentage by mass.&quot;], [4, &quot;Divide each by its relative atomic mass.&quot;], [7.5, &quot;Divide by the smallest to get the simplest ratio: CH\u2082O.&quot;], [11, &quot;Use Mr to find the molecular formula: C\u2086H\u2081\u2082O\u2086.&quot;]]" data-vd-dur="14">
<title id="ef-title">Empirical and molecular formulas</title><desc id="ef-desc">A worked table: 40.0 percent carbon, 6.7 percent hydrogen and 53.3 percent oxygen are divided by relative atomic masses, then by the smallest, giving CH2O; with Mr 180 the molecular formula is C6H12O6.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="520" fill="#ffffff"/>
<g aria-hidden="true"><animate id="ef-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<text class="head" x="30" y="34">Empirical and molecular formula: the method</text><text class="note" x="30" y="56">Worked example.</text>
<g class="part" data-part="s1" data-name="Step 1: masses or %" data-info="A compound contains 40.0% C, 6.7% H, 53.3% O by mass." tabindex="0" role="button" aria-label="Step 1: masses or %"><rect x="70" y="100" width="220" height="58" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/><text x="180.0" y="136" text-anchor="middle" font-size="15" font-weight="800" fill="#111827"></text><rect x="300" y="100" width="250" height="58" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/><text x="425.0" y="136" text-anchor="middle" font-size="15" font-weight="800" fill="#111827">C</text><rect x="560" y="100" width="250" height="58" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/><text x="685.0" y="136" text-anchor="middle" font-size="15" font-weight="800" fill="#111827">H</text><rect x="820" y="100" width="250" height="58" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/><text x="945.0" y="136" text-anchor="middle" font-size="15" font-weight="800" fill="#111827">O</text><rect x="70" y="170" width="220" height="58" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/><text x="180.0" y="206" text-anchor="middle" font-size="15" font-weight="800" fill="#111827">% by mass</text><rect x="300" y="170" width="250" height="58" rx="8" fill="#fff" stroke="#cbd5e1"/><text x="425.0" y="206" text-anchor="middle" font-size="15" font-weight="800" fill="#111827">40.0</text><rect x="560" y="170" width="250" height="58" rx="8" fill="#fff" stroke="#cbd5e1"/><text x="685.0" y="206" text-anchor="middle" font-size="15" font-weight="800" fill="#111827">6.7</text><rect x="820" y="170" width="250" height="58" rx="8" fill="#fff" stroke="#cbd5e1"/><text x="945.0" y="206" text-anchor="middle" font-size="15" font-weight="800" fill="#111827">53.3</text><g><animate attributeName="opacity" keyTimes="0.0000;0.2857;0.3071;1.0000" values="0;0;1;1" dur="14s" begin="ef-play.begin+0s" fill="freeze"/><rect x="70" y="240" width="220" height="58" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/><text x="180.0" y="276" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">÷ Ar</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.3071;0.3286;1.0000" values="0;0;1;1" dur="14s" begin="ef-play.begin+0s" fill="freeze"/><rect x="300" y="240" width="250" height="58" rx="8" fill="#fff" stroke="#cbd5e1"/><text x="425.0" y="276" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">40.0 ÷ 12.0 = 3.33</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.3286;0.3500;1.0000" values="0;0;1;1" dur="14s" begin="ef-play.begin+0s" fill="freeze"/><rect x="560" y="240" width="250" height="58" rx="8" fill="#fff" stroke="#cbd5e1"/><text x="685.0" y="276" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">6.7 ÷ 1.0 = 6.7</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.3500;0.3714;1.0000" values="0;0;1;1" dur="14s" begin="ef-play.begin+0s" fill="freeze"/><rect x="820" y="240" width="250" height="58" rx="8" fill="#fff" stroke="#cbd5e1"/><text x="945.0" y="276" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">53.3 ÷ 16.0 = 3.33</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.5357;0.5571;1.0000" values="0;0;1;1" dur="14s" begin="ef-play.begin+0s" fill="freeze"/><rect x="70" y="310" width="220" height="58" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/><text x="180.0" y="346" text-anchor="middle" font-size="15" font-weight="800" fill="#111827">÷ smallest (3.33)</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.5571;0.5786;1.0000" values="0;0;1;1" dur="14s" begin="ef-play.begin+0s" fill="freeze"/><rect x="300" y="310" width="250" height="58" rx="8" fill="#fff" stroke="#cbd5e1"/><text x="425.0" y="346" text-anchor="middle" font-size="15" font-weight="800" fill="#111827">1</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.5786;0.6000;1.0000" values="0;0;1;1" dur="14s" begin="ef-play.begin+0s" fill="freeze"/><rect x="560" y="310" width="250" height="58" rx="8" fill="#fff" stroke="#cbd5e1"/><text x="685.0" y="346" text-anchor="middle" font-size="15" font-weight="800" fill="#111827">2</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.6000;0.6214;1.0000" values="0;0;1;1" dur="14s" begin="ef-play.begin+0s" fill="freeze"/><rect x="820" y="310" width="250" height="58" rx="8" fill="#fff" stroke="#cbd5e1"/><text x="945.0" y="346" text-anchor="middle" font-size="15" font-weight="800" fill="#111827">1</text></g></g>
<g class="part" data-part="s2" data-name="Step 2: divide by Ar" data-info="C 40.0 ÷ 12.0 = 3.33; H 6.7 ÷ 1.0 = 6.7; O 53.3 ÷ 16.0 = 3.33." tabindex="0" role="button" aria-label="Step 2: divide by Ar"></g>
<g class="part" data-part="s3" data-name="Step 3: divide by the smallest" data-info="C 1 : H 2 : O 1 → empirical formula CH₂O." tabindex="0" role="button" aria-label="Step 3: divide by the smallest"><g><animate attributeName="opacity" keyTimes="0.0000;0.6429;0.6643;1.0000" values="0;0;1;1" dur="14s" begin="ef-play.begin+0s" fill="freeze"/><rect x="140.0" y="392.0" width="380" height="56" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="330" y="426.0" text-anchor="middle" font-size="18" font-weight="800" fill="#111827">empirical formula: CH₂O</text></g></g>
<g class="part" data-part="s4" data-name="Molecular formula" data-info="If Mr = 180, (CH₂O)n: 30n = 180 → n = 6 → C₆H₁₂O₆." tabindex="0" role="button" aria-label="Molecular formula"><g><animate attributeName="opacity" keyTimes="0.0000;0.7857;0.8071;1.0000" values="0;0;1;1" dur="14s" begin="ef-play.begin+0s" fill="freeze"/><rect x="590.0" y="380.0" width="420" height="80" rx="12" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/><text x="800" y="418" text-anchor="middle" font-size="14" font-weight="800" fill="#111827">Mr = 180: (12 + 2 + 16)n = 180</text><text x="800" y="436" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">n = 6 → molecular formula C₆H₁₂O₆</text></g></g>
</svg>