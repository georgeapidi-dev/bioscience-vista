<g class="part" data-part="dec" data-name="Thermal decomposition" data-info="MCO₃ → MO + CO₂: carbonates (and nitrates) need higher temperatures down the group: larger cations polarise the anion less." tabindex="0" role="button" aria-label="Thermal decomposition"><rect x="30" y="340" width="1040" height="200" rx="16" fill="#fff7ed" stroke="#fdba74"/><text x="550" y="366" text-anchor="middle" font-size="13" font-weight="800" fill="#c2410c">thermal decomposition: MCO₃ → MO + CO₂ — needs a higher temperature down the group</text><g><animate attributeName="opacity" keyTimes="0.0000;0.7000;0.7200;1.0000" values="0;0;1;1" dur="15s" begin="g2-play.begin+0s" fill="freeze"/><rect x="100" y="400" width="120" height="70" rx="12" fill="#fff" stroke="#c2410c" stroke-width="2"/><text x="160" y="432" text-anchor="middle" font-size="14" font-weight="800" fill="#111827">MgCO₃</text><text x="160" y="456" text-anchor="middle" font-size="11" font-weight="800" fill="#c2410c">lowest T</text><rect x="110" y="490" width="25" height="16" fill="#ef4444"/></g><g><animate attributeName="opacity" keyTimes="0.0000;0.7400;0.7600;1.0000" values="0;0;1;1" dur="15s" begin="g2-play.begin+0s" fill="freeze"/><rect x="350" y="400" width="120" height="70" rx="12" fill="#fff" stroke="#c2410c" stroke-width="2"/><text x="410" y="432" text-anchor="middle" font-size="14" font-weight="800" fill="#111827">CaCO₃</text><text x="410" y="456" text-anchor="middle" font-size="11" font-weight="800" fill="#c2410c">↑</text><rect x="360" y="490" width="50" height="16" fill="#ef4444"/></g><g><animate attributeName="opacity" keyTimes="0.0000;0.7800;0.8000;1.0000" values="0;0;1;1" dur="15s" begin="g2-play.begin+0s" fill="freeze"/><rect x="600" y="400" width="120" height="70" rx="12" fill="#fff" stroke="#c2410c" stroke-width="2"/><text x="660" y="432" text-anchor="middle" font-size="14" font-weight="800" fill="#111827">SrCO₃</text><text x="660" y="456" text-anchor="middle" font-size="11" font-weight="800" fill="#c2410c">↑</text><rect x="610" y="490" width="75" height="16" fill="#ef4444"/></g><g><animate attributeName="opacity" keyTimes="0.0000;0.8200;0.8400;1.0000" values="0;0;1;1" dur="15s" begin="g2-play.begin+0s" fill="freeze"/><rect x="850" y="400" width="120" height="70" rx="12" fill="#fff" stroke="#c2410c" stroke-width="2"/><text x="910" y="432" text-anchor="middle" font-size="14" font-weight="800" fill="#111827">BaCO₃</text><text x="910" y="456" text-anchor="middle" font-size="11" font-weight="800" fill="#c2410c">highest T</text><rect x="860" y="490" width="100" height="16" fill="#ef4444"/></g><g><animate attributeName="opacity" keyTimes="0.0000;0.8667;0.8867;1.0000" values="0;0;1;1" dur="15s" begin="g2-play.begin+0s" fill="freeze"/><text x="550" y="530" text-anchor="middle" font-size="12" font-weight="700" fill="#475569">smaller cations (Mg²⁺) polarise the carbonate ion more, weakening it</text></g></g>
</svg>