indefinite"/></circle><circle cx="492" r="3" fill="#fff" stroke="#0369a1" opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.0667;0.0867;1.0000" values="0;0;1;1" dur="15s" begin="g2-play.begin+0s" fill="freeze"/><animate attributeName="cy" values="260;145" dur="0.7s" begin="1.35s" repeatCount="indefinite"/></circle></g>
<g class="part" data-part="sol" data-name="Solubility" data-info="Hydroxides become MORE soluble down the group (Mg(OH)₂ sparingly soluble → Ba(OH)₂ soluble); sulfates become LESS soluble (BaSO₄ insoluble: used as the test for sulfate)." tabindex="0" role="button" aria-label="Solubility"><rect x="570" y="80" width="500" height="240" rx="16" fill="#f8fafc" stroke="#cbd5e1"/><text x="820" y="104" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">solubility in water</text><rect x="620" y="261" width="34" height="29" fill="#60a5fa"><animate attributeName="height" keyTimes="0.0000;0.4000;0.4667;1.0000" values="0;0;29.030899869919438;29.030899869919438" dur="15s" begin="g2-play.begin+0s" fill="freeze"/><animate attributeName="y" keyTimes="0.0000;0.4000;0.4667;1.0000" values="290;290;260.96910013008056;260.96910013008056" dur="15s" begin="g2-play.begin+0s" fill="freeze"/></rect><rect x="660" y="170" width="34" height="120" fill="#f59e0b"><animate attributeName="height" keyTimes="0.0000;0.5000;0.5667;1.0000" values="0;0;119.96949697570606;119.96949697570606" dur="15s" begin="g2-play.begin+0s" fill="freeze"/><animate attributeName="y" keyTimes="0.0000;0.5000;0.5667;1.0000" values="290;290;170.03050302429392;170.03050302429392" dur="15s" begin="g2-play.begin+0s" fill="freeze"/></rect><text x="657" y="308" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">Mg</text><rect x="730" y="201" width="34" height="89" fill="#60a5fa"><animate attributeName="height" keyTimes="0.0000;0.4000;0.4667;1.0000" values="0;0;89.03089986991944;89.03089986991944" dur="15s" begin="g2-play.begin+0s" fill="freeze"/><animate attributeName="y" keyTimes="0.0000;0.4000;0.4667;1.0000" values="290;290;200.96910013008056;200.96910013008056" dur="15s" begin="g2-play.begin+0s" fill="freeze"/></rect><rect x="770" y="197" width="34" height="93" fill="#f59e0b"><animate attributeName="height" keyTimes="0.0000;0.5000;0.5667;1.0000" values="0;0;92.62265990460759;92.62265990460759" dur="15s" begin="g2-play.begin+0s" fill="freeze"/><animate attributeName="y" keyTimes="0.0000;0.5000;0.5667;1.0000" values="290;290;197.3773400953924;197.3773400953924" dur="15s" begin="g2-play.begin+0s" fill="freeze"/></rect><text x="767" y="308" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">Ca</text><rect x="840" y="180" width="34" height="110" fill="#60a5fa"><animate attributeName="height" keyTimes="0.0000;0.4000;0.4667;1.0000" values="0;0;110.0;110.0" dur="15s" begin="g2-play.begin+0s" fill="freeze"/><animate attributeName="y" keyTimes="0.0000;0.4000;0.4667;1.0000" values="290;290;180.0;180.0" dur="15s" begin="g2-play.begin+0s" fill="freeze"/></rect><rect x="880" y="226" width="34" height="64" fill="#f59e0b"><animate attributeName="height" keyTimes="0.0000;0.5000;0.5667;1.0000" values="0;0;64.0;64.0" dur="15s" begin="g2-play.begin+0s" fill="freeze"/><animate attributeName="y" keyTimes="0.0000;0.5000;0.5667;1.0000" values="290;290;226.0;226.0" dur="15s" begin="g2-play.begin+0s" fill="freeze"/></rect><text x="877" y="308" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">Sr</text><rect x="950" y="162" width="34" height="128" fill="#60a5fa"><animate attributeName="height" keyTimes="0.0000;0.4000;0.4667;1.0000" values="0;0;128.06179973983888;128.06179973983888" dur="15s" begin="g2-play.begin+0s" fill="freeze"/><animate attributeName="y" keyTimes="0.0000;0.4000;0.4667;1.0000" values="290;290;161.93820026016112;161.93820026016112" dur="15s" begin="g2-play.begin+0s" fill="freeze"/></rect><rect x="990" y="263" width="34" height="27" fill="#f59e0b"><animate attributeName="height" keyTimes="0.0000;0.5000;0.5667;1.0000" values="0;0;26.622659904607588;26.622659904607588" dur="15s" begin="g2-play.begin+0s" fill="freeze"/><animate attributeName="y" keyTimes="0.0000;0.5000;0.5667;1.0000" values="290;290;263.3773400953924;263.3773400953924" dur="15s" begin="g2-play.begin+0s" fill="freeze"/></rect><text x="987" y="308" text-anchor="mid