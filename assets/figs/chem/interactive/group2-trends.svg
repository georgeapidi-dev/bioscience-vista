<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" class="vd-svg" role="img" aria-labelledby="g2-title g2-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="g2-play" data-vd-play-label="Play: down the group" data-vd-steps="[[0, &quot;Group 2 trends.&quot;], [1, &quot;Reaction with water: more vigorous down the group.&quot;], [6, &quot;Hydroxides: more soluble down; sulfates: less soluble down.&quot;], [10.5, &quot;Carbonates: more stable down the group (higher decomposition temperature).&quot;]]" data-vd-dur="15">
<title id="g2-title">Group 2 trends</title><desc id="g2-desc">Rates of hydrogen bubbles from magnesium, calcium, strontium and barium in water increasing down the group, solubility of hydroxides increasing and sulfates decreasing, and thermal stability of carbonates increasing down the group.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="560" fill="#ffffff"/>
<g aria-hidden="true"><animate id="g2-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<text class="head" x="30" y="34">Group 2: trends down the group</text><text class="note" x="30" y="56">Mg → Ba: larger atoms, outer electrons lost more easily.</text>
<g class="part" data-part="water" data-name="With water" data-info="Reactivity increases down the group: Mg reacts very slowly with cold water (fast with steam → MgO + H₂); Ca, Sr, Ba react with cold water → M(OH)₂ + H₂, increasingly vigorously." tabindex="0" role="button" aria-label="With water"><rect x="30" y="80" width="520" height="240" rx="16" fill="#f8fafc" stroke="#cbd5e1"/><text x="290" y="104" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">metal + cold water → M(OH)₂ + H₂</text><path d="M 66 140 L 66 280 L 134 280 L 134 140" fill="#e0f2fe" stroke="#334155" stroke-width="2"/><rect x="88" y="256" width="24" height="16" fill="#a1a1aa"/><text x="100" y="306" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">Mg</text><circle cx="80" r="3" fill="#fff" stroke="#0369a1" opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.0667;0.0867;1.0000" values="0;0;1;1" dur="15s" begin="g2-play.begin+0s" fill="freeze"/><animate attributeName="cy" values="260;145" dur="1.6s" begin="0.00s" repeatCount="indefinite"/></circle><path d="M 191 140 L 191 280 L 259 280 L 259 140" fill="#e0f2fe" stroke="#334155" stroke-width="2"/><rect x="213" y="256" width="24" height="16" fill="#a1a1aa"/><text x="225" y="306" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">Ca</text><circle cx="205" r="3" fill="#fff" stroke="#0369a1" opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.0667;0.0867;1.0000" values="0;0;1;1" dur="15s" begin="g2-play.begin+0s" fill="freeze"/><animate attributeName="cy" values="260;145" dur="1.3s" begin="0.00s" repeatCount="indefinite"/></circle><circle cx="218" r="3" fill="#fff" stroke="#0369a1" opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.0667;0.0867;1.0000" values="0;0;1;1" dur="15s" begin="g2-play.begin+0s" fill="freeze"/><animate attributeName="cy" values="260;145" dur="1.3s" begin="0.15s" repeatCount="indefinite"/></circle><circle cx="231" r="3" fill="#fff" stroke="#