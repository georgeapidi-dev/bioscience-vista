145" dur="1.0s" begin="0.45s" repeatCount="indefinite"/></circle><circle cx="342" r="3" fill="#fff" stroke="#0369a1" opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.0667;0.0867;1.0000" values="0;0;1;1" dur="15s" begin="g2-play.begin+0s" fill="freeze"/><animate attributeName="cy" values="260;145" dur="1.0s" begin="0.60s" repeatCount="indefinite"/></circle><circle cx="355" r="3" fill="#fff" stroke="#0369a1" opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.0667;0.0867;1.0000" values="0;0;1;1" dur="15s" begin="g2-play.begin+0s" fill="freeze"/><animate attributeName="cy" values="260;145" dur="1.0s" begin="0.75s" repeatCount="indefinite"/></circle><circle cx="368" r="3" fill="#fff" stroke="#0369a1" opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.0667;0.0867;1.0000" values="0;0;1;1" dur="15s" begin="g2-play.begin+0s" fill="freeze"/><animate attributeName="cy" values="260;145" dur="1.0s" begin="0.90s" repeatCount="indefinite"/></circle><path d="M 441 140 L 441 280 L 509 280 L 509 140" fill="#e0f2fe" stroke="#334155" stroke-width="2"/><rect x="463" y="256" width="24" height="16" fill="#a1a1aa"/><text x="475" y="306" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">Ba</text><circle cx="455" r="3" fill="#fff" stroke="#0369a1" opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.0667;0.0867;1.0000" values="0;0;1;1" dur="15s" begin="g2-play.begin+0s" fill="freeze"/><animate attributeName="cy" values="260;145" dur="0.7s" begin="0.00s" repeatCount="indefinite"/></circle><circle cx="468" r="3" fill="#fff" stroke="#0369a1" opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.0667;0.0867;1.0000" values="0;0;1;1" dur="15s" begin="g2-play.begin+0s" fill="freeze"/><animate attributeName="cy" values="260;145" dur="0.7s" begin="0.15s" repeatCount="indefinite"/></circle><circle cx="481" r="3" fill="#fff" stroke="#0369a1" opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.0667;0.0867;1.0000