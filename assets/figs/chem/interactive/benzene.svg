<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 700" class="vd-svg" role="img" aria-labelledby="bz-title bz-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="bz-play" data-vd-play-label="Play: delocalise" data-vd-steps="[[0, &quot;The structure of benzene, C\u2086H\u2086.&quot;], [1, &quot;Six carbons in a flat hexagon, each bonded to one hydrogen.&quot;], [3, &quot;Each carbon has a p orbital with one electron, sticking up and down.&quot;], [5.5, &quot;The p orbitals overlap all round the ring: delocalised \u03c0 electrons.&quot;], [8.5, &quot;Evidence 1: all C\u2013C bonds are the same length, between single and double.&quot;], [11.5, &quot;Evidence 2: benzene is more stable than a structure with three C=C bonds.&quot;]]" data-vd-dur="15">
<title id="bz-title">Benzene and delocalisation</title><desc id="bz-desc">Benzene: six sp2 carbons in a planar hexagon, p orbitals overlapping sideways to give a delocalised ring of pi electrons above and below the plane, with bond-length and enthalpy evidence against the Kekulé structure.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1220" height="700" fill="#ffffff"/>
<g aria-hidden="true"><animate id="bz-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<text class="head" x="30" y="34">Benzene: delocalised π electrons</text><text class="note" x="30" y="56">Ring seen at an angle, so the p orbitals point up and down.</text>
<g class="part" data-part="p" data-name="p orbitals" data-info="Each carbon has one p orbital at right angles to the ring, holding one electron." tabindex="0" role="button" aria-label="p orbitals"><g><animate attributeName="opacity" keyTimes="0.0000;0.2000;0.2200;0.3867;0.4067;1.0000" values="0;0;1;1;0;0" dur="15s" begin="bz-play.begin+0s" fill="freeze"/><ellipse cx="510" cy="305" rx="18" ry="48" fill="#93c5fd" fill-opacity=".75" stroke="#1d4ed8" stroke-width="1.5"/><ellipse cx="510" cy="415" rx="18" ry="48" fill="#93c5fd" fill-opacity=".75" stroke="#1d4ed8" stroke-width="1.5"/><circle cx="510" cy="300" r="4" fill="#1e3a8a"/><ellipse cx="425" cy="366" rx="18" ry="48" fill="#93c5fd" fill-opacity=".75" stroke="#1d4ed8" stroke-width="1.5"/><ellipse cx="425" cy="476" rx="18" ry="48" fill="#93c5fd" fill-opacity=".75" stroke="#1d4ed8" stroke-width="1.5"/><circle cx="425" cy="361" r="4" fill="#1e3a8a"/><ellipse cx="255" cy="366" rx="18" ry="48" fill="#93c5fd" fill-opacity=".75" stroke="#1d4ed8" stroke-width="1.5"/><ellipse cx="255" cy="476" rx="18" ry="48" fill="#93c5fd" fill-opacity=".75" stroke="#1d4ed8" stroke-width="1.5"/><circle cx="255" cy="361" r="4" fill="#1e3a8a"/><ellipse cx="170" cy="305" rx="18" ry="48" fill="#93c5fd" fill-opacity=".75" stroke="#1d4ed8" stroke-width="1.5"/><ellipse cx="170" cy="415" rx="18" ry="48" fill="#93c5fd" fill-opacity=".75" stroke="#1d4ed8" stroke-width="1.5"/><circle cx="170" cy="300" r="4" fill="#1e3a8a"/><ellipse cx="255" cy="244" rx="18" ry="48" fill="#93c5fd" fill-opacity=".75" stroke="#1d4ed8" stroke-width="1.5"/><ellipse cx="255" cy="354" rx="18" ry="48" fill="#93c5fd" fill-opacity=".75" stroke="#1d4ed8" stroke-width="1.5"/><circle cx="255" cy="239" r="4" fill="#1e3a8a"/><ellipse cx="425" cy="244" rx="18" ry="48" fill="#93c5fd" fill-opacity=".75" stroke="#1d4ed8" stroke-width="1.5"/><ellipse cx="425" cy="354" rx="18" ry="48" fill="#93c5fd" fill-opacity=".75" stroke="#1d4ed8" stroke-width="1.5"/><circle cx="425" cy="239" r="4" fill="#1e3a8a"/></g></g>
<g class="part" data-part="deloc" data-name="Delocalised π electrons" data-info="The six p orbitals overlap sideways all round the ring: six electrons are shared by all six carbons, in rings of electron density above and below the plane." tabindex="0" role="button" aria-label="Delocalised π electrons"><g><animate attributeName="opacity" keyTimes="0.0000;0.3667;0.3867;1.0000" values="0;0;1;1" dur="15s" begin="bz-play.begin+0s" fill="freeze"/><ellipse cx="340" cy="300" rx="180" ry="84" fill="none" stroke="#2563eb" stroke-width="30" stroke-opacity=".55"/><ellipse cx="340" cy="420" rx="180" ry="84" fill="none" stroke="#2563eb" stroke-width="30" stroke-opacity=".55"/><circle r="5" fill="#1e3a8a"><animateMotion dur="4s" repeatCount="indefinite" begin="0.0s" path="M 520 300 A 180 84 0 1 1 160 300 A 180 84 0 1 1 520 300"/></circle><circle r="5" fill="#1e3a8a"><animateMotion dur="4s" repeatCount="indefinite" begin="0.66s" path="M 520 300 A 180 84 0 1 1 160 300 A 180 84 0 1 1 520 300"/></circle><circle r="5" fill="#1e3a8a"><animateMotion dur="4s" repeatCount="indefinite" begin="1.32s" path="M 520 300 A 180 84 0 1 1 160 300 A 180 84 0 1 1 520 300"/></circle><circle r="5" fill="#1e3a8a"><animateMotion dur="4s" repeatCount="indefinite" begin="1.98s" path="M 520 300 A 180 84 0 1 1 160 300 A 180 84 0 1 1 520 300"/></circle><circle r="5" fill="#1e3a8a"><animateMotion dur="4s" repeatCount="indefinite" begin="2.64s" path="M 520 300 A 180 84 0 1 1 160 300 A 180 84 0 1 1 520 300"/></circle><circle r="5" fill="#1e3a8a"><animateMotion dur="4s" repeatCount="indefinite" begin="3.3000000000000003s" path="M 520 300 A 180 84 0 1 1 160 300 A 180 84 0 1 1 520 300"/></circle><text x="340" y="190" text-anchor="middle" font-size="13" font-weight="800" fill="#1d4ed8">delocalised π ring (above)</text><text x="340" y="550" text-anchor="middle" font-size="13" font-weight="800" fill="#1d4ed8">and below the plane</text></g></g>
<g class="part" data-part="ring" data-name="Carbon skeleton" data-info="Six carbon atoms in a flat regular hexagon; each also bonded to one H. Bond angles 120°." tabindex="0" role="button" aria-label="Carbon skeleton"><polygon points="510,360 425,421 255,421 170,360 255,299 425,299" fill="none" stroke="#111827" stroke-width="5"/><line x1="510" y1="360" x2="580" y2="360" stroke="#111827" stroke-width="3"/><line x1="425" y1="421" x2="460" y2="447" stroke="#111827" stroke-width="3"/><line x1="255" y1="421" x2="220" y2="447" stroke="#111827" stroke-width="3"/><line x1="170" y1="360" x2="100" y2="360" stroke="#111827" stroke-width="3"/><line x1="255" y1="299" x2="220" y2="273" stroke="#111827" stroke-width="3"/><line x1="425" y1="299" x2="460" y2="273" stroke="#111827" stroke-width="3"/><circle cx="580.0" cy="360.0" r="14" fill="#f3f4f6" stroke="#111827" stroke-width="1.5"/><text x="580.0" y="364.0" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">H</text><circle cx="460.0" cy="446.6" r="14" fill="#f3f4f6" stroke="#111827" stroke-width="1.5"/><text x="460.0" y="450.60254037844385" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">H</text><circle cx="220.0" cy="446.6" r="14" fill="#f3f4f6" stroke="#111827" stroke-width="1.5"/><text x="220.00000000000006" y="450.6025403784439" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">H</text><circle cx="100.0" cy="360.0" r="14" fill="#f3f4f6" stroke="#111827" stroke-width="1.5"/><text x="100.0" y="364.0" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">H</text><circle cx="220.0" cy="273.4" r="14" fill="#f3f4f6" stroke="#111827" stroke-width="1.5"/><text x="219.9999999999999" y="277.39745962155615" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">H</text><circle cx="460.0" cy="273.4" r="14" fill="#f3f4f6" stroke="#111827" stroke-width="1.5"/><text x="460.0" y="277.39745962155615" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">H</text><circle cx="510.0" cy="360.0" r="18" fill="#374151" stroke="#111827" stroke-width="1.5"/><text x="510.0" y="364.0" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">C</text><circle cx="425.0" cy="420.6" r="18" fill="#374151" stroke="#111827" stroke-width="1.5"/><text x="425.0" y="424.6217782649107" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">C</text><circle cx="255.0" cy="420.6" r="18" fill="#374151" stroke="#111827" stroke-width="1.5"/><text x="255.00000000000006" y="424.6217782649107" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">C</text><circle cx="170.0" cy="360.0" r="18" fill="#374151" stroke="#111827" stroke-width="1.5"/><text x="170.0" y="364.0" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">C</text><circle cx="255.0" cy="299.4" r="18" fill="#374151" stroke="#111827" stroke-width="1.5"/><text x="254.99999999999994" y="303.3782217350893" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">C</text><circle cx="425.0" cy="299.4" r="18" fill="#374151" stroke="#111827" stroke-width="1.5"/><text x="425.0" y="303.3782217350893" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">C</text></g>
<g class="part" data-part="kek" data-name="Kekulé structures" data-info="Alternating single and double bonds would give two bond lengths; benzene has only one." tabindex="0" role="button" aria-label="Kekulé structures"><g><animate attributeName="opacity" keyTimes="0.0000;0.5000;0.5200;1.0000" values="0;0;1;1" dur="15s" begin="bz-play.begin+0s" fill="freeze"/><rect x="700" y="90" width="500" height="170" rx="14" fill="#f8fafc" stroke="#cbd5e1"/><polygon points="823,195 780,220 737,195 737,145 780,120 823,145" fill="none" stroke="#111827" stroke-width="3"/><line x1="819" y1="188" x2="776" y2="212" stroke="#111827" stroke-width="3"/><line x1="745" y1="195" x2="745" y2="145" stroke="#111827" stroke-width="3"/><line x1="776" y1="128" x2="819" y2="152" stroke="#111827" stroke-width="3"/><text x="860" y="176" text-anchor="middle" font-size="22" font-weight="800" fill="#111827">↔</text><polygon points="983,195 940,220 897,195 897,145 940,120 983,145" fill="none" stroke="#111827" stroke-width="3"/><line x1="944" y1="212" x2="901" y2="188" stroke="#111827" stroke-width="3"/><line x1="901" y1="152" x2="944" y2="128" stroke="#111827" stroke-width="3"/><line x1="975" y1="145" x2="975" y2="195" stroke="#111827" stroke-width="3"/><text x="1040" y="176" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">→ really</text><polygon points="1173,195 1130,220 1087,195 1087,145 1130,120 1173,145" fill="none" stroke="#111827" stroke-width="3"/><circle cx="1130" cy="170" r="27.500000000000004" fill="none" stroke="#2563eb" stroke-width="3"/><text x="860" y="242" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">Kekulé structures (not real)</text><text x="1130" y="242" text-anchor="middle" font-size="11" font-weight="800" fill="#1d4ed8">delocalised</text></g></g>
<g class="part" data-part="len" data-name="Bond length evidence" data-info="All C–C bonds are 0.139 nm, between C–C (0.154 nm) and C=C (0.134 nm)." tabindex="0" role="button" aria-label="Bond length evidence"><g><animate attributeName="opacity" keyTimes="0.0000;0.5667;0.5867;1.0000" values="0;0;1;1" dur="15s" begin="bz-play.begin+0s" fill="freeze"/><rect x="700" y="280" width="500" height="170" rx="14" fill="#fff" stroke="#cbd5e1"/><text x="950" y="306" text-anchor="middle" font-size="14" font-weight="800" fill="#111827">C–C bond lengths / nm</text><text x="800" y="348" text-anchor="end" font-size="12" font-weight="800" fill="#64748b">C–C single</text><rect x="812" y="330" width="0" height="24" fill="#64748b"><animate attributeName="width" keyTimes="0.0000;0.5667;0.6200;1.0000" values="0;0;269.99999999999994;269.99999999999994" dur="15s" begin="bz-play.begin+0s" fill="freeze"/></rect><text x="1100.0" y="348" text-anchor="start" font-size="12" font-weight="800" fill="#111827">0.154</text><text x="800" y="384" text-anchor="end" font-size="12" font-weight="800" fill="#2563eb">benzene</text><rect x="812" y="366" width="0" height="24" fill="#2563eb"><animate attributeName="width" keyTimes="0.0000;0.5867;0.6400;1.0000" values="0;0;195.00000000000003;195.00000000000003" dur="15s" begin="bz-play.begin+0s" fill="freeze"/></rect><text x="1025.0" y="384" text-anchor="start" font-size="12" font-weight="800" fill="#111827">0.139</text><text x="800" y="420" text-anchor="end" font-size="12" font-weight="800" fill="#dc2626">C=C double</text><rect x="812" y="402" width="0" height="24" fill="#dc2626"><animate attributeName="width" keyTimes="0.0000;0.6067;0.6600;1.0000" values="0;0;170.0;170.0" dur="15s" begin="bz-play.begin+0s" fill="freeze"/></rect><text x="1000.0" y="420" text-anchor="start" font-size="12" font-weight="800" fill="#111827">0.134</text></g></g>
<g class="part" data-part="enth" data-name="Stability evidence" data-info="Enthalpy of hydrogenation is −208 kJ mol⁻¹, not the −360 predicted for three C=C bonds: delocalisation makes benzene about 150 kJ mol⁻¹ more stable." tabindex="0" role="button" aria-label="Stability evidence"><g><animate attributeName="opacity" keyTimes="0.0000;0.7667;0.7867;1.0000" values="0;0;1;1" dur="15s" begin="bz-play.begin+0s" fill="freeze"/><rect x="700" y="470" width="500" height="210" rx="14" fill="#fff" stroke="#cbd5e1"/><text x="950" y="496" text-anchor="middle" font-size="14" font-weight="800" fill="#111827">Enthalpy of hydrogenation / kJ mol⁻¹</text><line x1="740" y1="520" x2="1170" y2="520" stroke="#111827" stroke-width="2"/><text x="745" y="514" text-anchor="start" font-size="11" font-weight="700" fill="#111827">C₆H₆ + 3H₂ (start)</text><rect x="800" y="520" width="80" height="0" fill="#fca5a5"><animate attributeName="height" keyTimes="0.0000;0.7667;0.8333;1.0000" values="0;0;144;144" dur="15s" begin="bz-play.begin+0s" fill="freeze"/></rect><g><animate attributeName="opacity" keyTimes="0.0000;0.8333;0.8533;1.0000" values="0;0;1;1" dur="15s" begin="bz-play.begin+0s" fill="freeze"/><text x="840" y="672" text-anchor="middle" font-size="11" font-weight="800" fill="#b91c1c">−360 predicted</text></g><rect x="980" y="520" width="80" height="0" fill="#93c5fd"><animate attributeName="height" keyTimes="0.0000;0.8000;0.8667;1.0000" values="0;0;83;83" dur="15s" begin="bz-play.begin+0s" fill="freeze"/></rect><g><animate attributeName="opacity" keyTimes="0.0000;0.8667;0.8867;1.0000" values="0;0;1;1" dur="15s" begin="bz-play.begin+0s" fill="freeze"/><text x="1020" y="620" text-anchor="middle" font-size="11" font-weight="800" fill="#1d4ed8">−208 actual</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.9000;0.9200;1.0000" values="0;0;1;1" dur="15s" begin="bz-play.begin+0s" fill="freeze"/><text x="1110" y="580" text-anchor="middle" font-size="12" font-weight="800" fill="#166534">≈150 kJ more</text><text x="1110" y="598" text-anchor="middle" font-size="12" font-weight="800" fill="#166534">stable</text></g></g></g>
</svg>