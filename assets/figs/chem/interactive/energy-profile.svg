<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" class="vd-svg" role="img" aria-labelledby="ep-title ep-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="ep-play" data-vd-play-label="Play: over the energy barrier" data-vd-steps="[[0, &quot;An energy profile shows the energy of the reactants and products, and the energy barrier between them.&quot;], [1, &quot;Exothermic: particles need the activation energy Ea to reach the transition state; the products are lower in energy, so energy is released (\u0394H negative).&quot;], [5, &quot;Endothermic: the products are higher in energy than the reactants, so energy is taken in from the surroundings (\u0394H positive).&quot;], [9, &quot;A catalyst gives an alternative pathway with a lower activation energy. More collisions have at least Ea, so the reaction is faster.&quot;], [13.5, &quot;The catalyst does not change the energy of the reactants or products, so \u0394H is the same.&quot;]]" data-vd-dur="16">
<title id="ep-title">Energy profiles: exothermic and endothermic reactions</title><desc id="ep-desc">Two energy profiles. Exothermic: products lower than reactants, ΔH negative. Endothermic: products higher, ΔH positive. Each shows the activation energy to the transition state, and a lower catalysed pathway.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1200" height="580" fill="#ffffff"/>
<g aria-hidden="true"><animate id="ep-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<defs><marker id="ep-1f2937" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#1f2937"/></marker><marker id="ep-b91c1c" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#b91c1c"/></marker><marker id="ep-7c3aed" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#7c3aed"/></marker><marker id="ep-16a34a" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#16a34a"/></marker></defs>
<text class="head" x="30" y="34">Energy profiles (reaction pathway diagrams)</text><text class="note" x="30" y="56">Not to scale. Solid blue: uncatalysed pathway. Dashed green: catalysed pathway.</text>
<g class="part" data-part="ax" data-name="Axes" data-info="Vertical: energy (enthalpy, H). Horizontal: progress of reaction (reaction coordinate)." tabindex="0" role="button" aria-label="Axes"><path d="M 80 120 L 80 520 L 550 520" fill="none" stroke="#1f2937" stroke-width="2.5" marker-end="url(#ep-1f2937)"/><line x1="80" y1="520" x2="80" y2="118" stroke="#1f2937" stroke-width="2.5" marker-end="url(#ep-1f2937)"/><text x="66" y="320" font-size="14" text-anchor="middle" transform="rotate(-90 66 320)">Energy (enthalpy)</text><text x="315" y="548" font-size="14" text-anchor="middle">Progress of reaction</text><text x="320" y="96" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">Exothermic reaction</text><path d="M 670 120 L 670 520 L 1140 520" fill="none" stroke="#1f2937" stroke-width="2.5" marker-end="url(#ep-1f2937)"/><line x1="670" y1="520" x2="670" y2="118" stroke="#1f2937" stroke-width="2.5" marker-end="url(#ep-1f2937)"/><text x="656" y="320" font-size="14" text-anchor="middle" transform="rotate(-90 656 320)">Energy (enthalpy)</text><text x="905" y="548" font-size="14" text-anchor="middle">Progress of reaction</text><text x="910" y="96" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">Endothermic reaction</text></g>
<g class="part" data-part="rea" data-name="Reactants" data-info="Energy level of the reactants." tabindex="0" role="button" aria-label="Reactants"><text x="140" y="390" text-anchor="middle" font-size="13" font-weight="700">reactants</text><text x="730" y="430" text-anchor="middle" font-size="13" font-weight="700">reactants</text></g>
<g class="part" data-part="pro" data-name="Products" data-info="Energy level of the products. Lower than the reactants: exothermic. Higher: endothermic." tabindex="0" role="button" aria-label="Products"><text x="480" y="492" text-anchor="middle" font-size="13" font-weight="700">products</text><text x="1070" y="310" text-anchor="middle" font-size="13" font-weight="700">products</text></g>
<g class="part" data-part="ts" data-name="Transition state (activated complex)" data-info="The highest-energy arrangement, at the top of the curve, where old bonds are breaking and new ones forming." tabindex="0" role="button" aria-label="Transition state (activated complex)"><circle cx="320" cy="180" r="7" fill="#fff" stroke="#1d4ed8" stroke-width="3"/><circle cx="910" cy="160" r="7" fill="#fff" stroke="#1d4ed8" stroke-width="3"/></g>
<g class="part" data-part="ea" data-name="Activation energy, Ea" data-info="The minimum energy colliding particles need to react: from the reactants up to the transition state." tabindex="0" role="button" aria-label="Activation energy, Ea"><line x1="190" y1="400" x2="440" y2="400" stroke="#64748b" stroke-dasharray="5 4"/><line x1="320" y1="397" x2="320" y2="188" stroke="#b91c1c" stroke-width="3" marker-end="url(#ep-b91c1c)"/><text x="312" y="330.0" text-anchor="end" font-size="15" font-weight="700" fill="#b91c1c">Ea</text><line x1="780" y1="440" x2="1030" y2="440" stroke="#64748b" stroke-dasharray="5 4"/><line x1="910" y1="437" x2="910" y2="168" stroke="#b91c1c" stroke-width="3" marker-end="url(#ep-b91c1c)"/><text x="902" y="340.0" text-anchor="end" font-size="15" font-weight="700" fill="#b91c1c">Ea</text></g>
<g class="part" data-part="dh" data-name="Enthalpy change, ΔH" data-info="Energy of products minus energy of reactants. Exothermic: ΔH negative (energy released to the surroundings). Endothermic: ΔH positive (energy taken in)." tabindex="0" role="button" aria-label="Enthalpy change, ΔH"><line x1="450" y1="400" x2="530" y2="400" stroke="#64748b" stroke-dasharray="5 4"/><line x1="520" y1="403" x2="520" y2="462" stroke="#7c3aed" stroke-width="3" marker-end="url(#ep-7c3aed)"/> <text x="528" y="440.0" font-size="14" font-weight="700" fill="#7c3aed">ΔH < 0</text><line x1="1040" y1="440" x2="1120" y2="440" stroke="#64748b" stroke-dasharray="5 4"/><line x1="1110" y1="437" x2="1110" y2="328" stroke="#7c3aed" stroke-width="3" marker-end="url(#ep-7c3aed)"/> <text x="1118" y="385.0" font-size="14" font-weight="700" fill="#7c3aed">ΔH > 0</text></g>
<g class="part" data-part="cat" data-name="Catalysed pathway" data-info="A catalyst provides an alternative pathway with a lower activation energy, so more collisions succeed. ΔH is unchanged and the catalyst is not used up." tabindex="0" role="button" aria-label="Catalysed pathway"><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.5625;0.5813;1.0000" values="0;0;1;1" dur="16s" begin="ep-play.begin+0s" fill="freeze"/><path d="M 100 400 L 190 400 C 260 400 260 290 320 290 C 380 290 380 470 450 470 L 540 470" fill="none" stroke="#16a34a" stroke-width="3.5" stroke-dasharray="9 6"/><line x1="320" y1="290" x2="370" y2="290" stroke="#64748b" stroke-dasharray="5 4"/><line x1="360" y1="397" x2="360" y2="298" stroke="#16a34a" stroke-width="3" marker-end="url(#ep-16a34a)"/><text x="368" y="365.0" font-size="13" font-weight="700" fill="#15803d">Ea (catalyst)</text></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.8125;0.8313;1.0000" values="0;0;1;1" dur="16s" begin="ep-play.begin+0s" fill="freeze"/><path d="M 690 440 L 780 440 C 850 440 850 260 910 260 C 970 260 970 320 1040 320 L 1130 320" fill="none" stroke="#16a34a" stroke-width="3.5" stroke-dasharray="9 6"/><line x1="910" y1="260" x2="960" y2="260" stroke="#64748b" stroke-dasharray="5 4"/><line x1="950" y1="437" x2="950" y2="268" stroke="#16a34a" stroke-width="3" marker-end="url(#ep-16a34a)"/><text x="958" y="370.0" font-size="13" font-weight="700" fill="#15803d">Ea (catalyst)</text></g></g>
<path d="M 100 400 L 190 400 C 260 400 260 180 320 180 C 380 180 380 470 450 470 L 540 470" fill="none" stroke="#1d4ed8" stroke-width="4"/><path d="M 690 440 L 780 440 C 850 440 850 160 910 160 C 970 160 970 320 1040 320 L 1130 320" fill="none" stroke="#1d4ed8" stroke-width="4"/><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.0625;0.0750;0.2875;0.3000;1.0000" values="0;0;1;1;0;0" dur="16s" begin="ep-play.begin+0s" fill="freeze"/><circle r="10" fill="#f59e0b" stroke="#fff" stroke-width="2.5"><animateMotion path="M 100 400 L 190 400 C 260 400 260 180 320 180 C 380 180 380 470 450 470 L 540 470" calcMode="linear" keyPoints="0.0000;0.0000;0.4200;0.5500;1.0000;1.0000" keyTimes="0.0000;0.0625;0.1375;0.2125;0.2750;1.0000" dur="16s" begin="ep-play.begin+0s" fill="freeze"/></circle></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.6562;0.6687;0.8812;0.8937;1.0000" values="0;0;1;1;0;0" dur="16s" begin="ep-play.begin+0s" fill="freeze"/><circle r="10" fill="#22c55e" stroke="#fff" stroke-width="2.5"><animateMotion path="M 100 400 L 190 400 C 260 400 260 290 320 290 C 380 290 380 470 450 470 L 540 470" calcMode="linear" keyPoints="0.0000;0.0000;0.4200;0.5500;1.0000;1.0000" keyTimes="0.0000;0.6562;0.7312;0.8063;0.8688;1.0000" dur="16s" begin="ep-play.begin+0s" fill="freeze"/></circle></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.3125;0.3250;0.5375;0.5500;1.0000" values="0;0;1;1;0;0" dur="16s" begin="ep-play.begin+0s" fill="freeze"/><circle r="10" fill="#f59e0b" stroke="#fff" stroke-width="2.5"><animateMotion path="M 690 440 L 780 440 C 850 440 850 160 910 160 C 970 160 970 320 1040 320 L 1130 320" calcMode="linear" keyPoints="0.0000;0.0000;0.4200;0.5500;1.0000;1.0000" keyTimes="0.0000;0.3125;0.3875;0.4625;0.5250;1.0000" dur="16s" begin="ep-play.begin+0s" fill="freeze"/></circle></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.9062;0.9187;1.0000;1.0000;1.0000" values="0;0;1;1;0;0" dur="16s" begin="ep-play.begin+0s" fill="freeze"/><circle r="10" fill="#22c55e" stroke="#fff" stroke-width="2.5"><animateMotion path="M 690 440 L 780 440 C 850 440 850 260 910 260 C 970 260 970 320 1040 320 L 1130 320" calcMode="linear" keyPoints="0.0000;0.0000;0.4200;0.5500;1.0000;1.0000" keyTimes="0.0000;0.9062;0.9812;1.0000;1.0000;1.0000" dur="16s" begin="ep-play.begin+0s" fill="freeze"/></circle></g>
<g class="labels"><g class="lbl" data-for="ts"><polyline points="385.0,134.0 320.0,180.0"/><circle cx="320.0" cy="180.0" r="2.6"/><text x="390" y="140" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="4">Transition state</text></g><g class="lbl" data-for="ts"><polyline points="975.0,124.0 910.0,160.0"/><circle cx="910.0" cy="160.0" r="2.6"/><text x="980" y="130" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="4">Transition state</text></g></g>
</svg>