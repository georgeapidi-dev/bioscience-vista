<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" class="vd-svg" role="img" aria-labelledby="mt-title mt-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="mt-play" data-vd-play-label="Play: titrate" data-vd-steps="[[0, &quot;Manganate(VII) titration.&quot;], [1, &quot;KMnO\u2084 in the burette; acidified Fe\u00b2\u207a in the flask.&quot;], [4, &quot;Purple drops are decolourised.&quot;], [9, &quot;End-point: first permanent pale pink.&quot;], [12, &quot;MnO\u2084\u207b : Fe\u00b2\u207a = 1 : 5.&quot;]]" data-vd-dur="15">
<title id="mt-title">Redox titration with manganate(VII)</title><desc id="mt-desc">A burette of purple potassium manganate(VII) above a flask of acidified iron(II); the purple colour disappears until the end-point, when the solution turns permanently pale pink; equation and worked calculation with a 1 to 5 mole ratio.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="560" fill="#ffffff"/>
<g aria-hidden="true"><animate id="mt-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<text class="head" x="30" y="34">Redox titration: MnO₄⁻ with Fe²⁺</text><text class="note" x="30" y="56">Self-indicating: purple → colourless → pale pink at the end-point.</text>
<g class="part" data-part="set" data-name="Set-up" data-info="Acidified KMnO₄ in the burette; Fe²⁺(aq) (with dilute H₂SO₄) in the flask. No indicator needed: KMnO₄ is self-indicating." tabindex="0" role="button" aria-label="Set-up"><rect x="200" y="70" width="30" height="250" fill="#f8fafc" stroke="#334155" stroke-width="2"/><rect x="202" y="80" width="26" height="238" fill="#7e22ce"><animate attributeName="height" keyTimes="0.0000;0.2000;0.6667;1.0000" values="238;238;150;150" dur="15s" begin="mt-play.begin+0s" fill="freeze"/><animate attributeName="y" keyTimes="0.0000;0.2000;0.6667;1.0000" values="80;80;168;168" dur="15s" begin="mt-play.begin+0s" fill="freeze"/></rect><path d="M 210 320 L 210 350 L 220 350 L 220 320" fill="#334155"/><text x="250" y="120" text-anchor="start" font-size="12" font-weight="800" fill="#7e22ce">KMnO₄(aq) 0.0200 mol dm⁻³</text><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.2000;0.2133;0.2367;0.2500;1.0000" values="0;0;1;1;0;0" dur="15s" begin="mt-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.2000;0.2333;1.0000" values="215 355;215 355;215 420;215 420" dur="15s" begin="mt-play.begin+0s" fill="freeze"/><circle r="5" fill="#7e22ce"/></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.2533;0.2667;0.2900;0.3033;1.0000" values="0;0;1;1;0;0" dur="15s" begin="mt-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.2533;0.2867;1.0000" values="215 355;215 355;215 420;215 420" dur="15s" begin="mt-play.begin+0s" fill="freeze"/><circle r="5" fill="#7e22ce"/></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.3067;0.3200;0.3433;0.3567;1.0000" values="0;0;1;1;0;0" dur="15s" begin="mt-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.3067;0.3400;1.0000" values="215 355;215 355;215 420;215 420" dur="15s" begin="mt-play.begin+0s" fill="freeze"/><circle r="5" fill="#7e22ce"/></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.3600;0.3733;0.3967;0.4100;1.0000" values="0;0;1;1;0;0" dur="15s" begin="mt-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.3600;0.3933;1.0000" values="215 355;215 355;215 420;215 420" dur="15s" begin="mt-play.begin+0s" fill="freeze"/><circle r="5" fill="#7e22ce"/></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.4133;0.4267;0.4500;0.4633;1.0000" values="0;0;1;1;0;0" dur="15s" begin="mt-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.4133;0.4467;1.0000" values="215 355;215 355;215 420;215 420" dur="15s" begin="mt-play.begin+0s" fill="freeze"/><circle r="5" fill="#7e22ce"/></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.4667;0.4800;0.5033;0.5167;1.0000" values="0;0;1;1;0;0" dur="15s" begin="mt-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.4667;0.5000;1.0000" values="215 355;215 355;215 420;215 420" dur="15s" begin="mt-play.begin+0s" fill="freeze"/><circle r="5" fill="#7e22ce"/></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.5200;0.5333;0.5567;0.5700;1.0000" values="0;0;1;1;0;0" dur="15s" begin="mt-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.5200;0.5533;1.0000" values="215 355;215 355;215 420;215 420" dur="15s" begin="mt-play.begin+0s" fill="freeze"/><circle r="5" fill="#7e22ce"/></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.5733;0.5867;0.6100;0.6233;1.0000" values="0;0;1;1;0;0" dur="15s" begin="mt-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.5733;0.6067;1.0000" values="215 355;215 355;215 420;215 420" dur="15s" begin="mt-play.begin+0s" fill="freeze"/><circle r="5" fill="#7e22ce"/></g></g><path d="M 190 380 L 150 480 Q 145 500 165 500 L 265 500 Q 285 500 280 480 L 240 380 Z" fill="#fef9c3" stroke="#334155" stroke-width="2"><animate attributeName="fill" keyTimes="0.0000;0.6267;0.6667;1.0000" values="#fef9c3;#fef9c3;#f5d0fe;#f5d0fe" dur="15s" begin="mt-play.begin+0s" fill="freeze"/></path><text x="215" y="530" text-anchor="middle" font-size="12" font-weight="800" fill="#475569">Fe²⁺(aq) + dilute H₂SO₄</text></g>
<g class="part" data-part="eq" data-name="Equation" data-info="MnO₄⁻ + 8H⁺ + 5Fe²⁺ → Mn²⁺ + 5Fe³⁺ + 4H₂O. Mole ratio MnO₄⁻ : Fe²⁺ = 1 : 5. Use H₂SO₄, not HCl (Cl⁻ would be oxidised to Cl₂)." tabindex="0" role="button" aria-label="Equation"><g><animate attributeName="opacity" keyTimes="0.0000;0.8000;0.8200;1.0000" values="0;0;1;1" dur="15s" begin="mt-play.begin+0s" fill="freeze"/><rect x="390.0" y="75.0" width="620" height="70" rx="12" fill="#f3e8ff" stroke="#7e22ce" stroke-width="2"/><text x="700" y="108" text-anchor="middle" font-size="16" font-weight="800" fill="#111827">MnO₄⁻ + 8H⁺ + 5Fe²⁺ → Mn²⁺ + 5Fe³⁺ + 4H₂O</text><text x="700" y="126" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">Mn +7 → +2 (gain 5e⁻) · Fe +2 → +3 (lose e⁻)</text></g></g>
<g class="part" data-part="end" data-name="End-point" data-info="Purple MnO₄⁻ is decolourised (Mn²⁺ is nearly colourless) until all Fe²⁺ has reacted; the first permanent pale pink colour is the end-point." tabindex="0" role="button" aria-label="End-point"><g><animate attributeName="opacity" keyTimes="0.0000;0.6333;0.6533;1.0000" values="0;0;1;1" dur="15s" begin="mt-play.begin+0s" fill="freeze"/><rect x="390" y="190" width="620" height="80" rx="14" fill="#fdf4ff" stroke="#f0abfc"/><text x="700" y="222" text-anchor="middle" font-size="16" font-weight="800" fill="#a21caf">end-point: first permanent pale pink</text><text x="700" y="250" text-anchor="middle" font-size="12" font-weight="700" fill="#475569">excess MnO₄⁻ no longer decolourised</text></g></g>
<g class="part" data-part="calc" data-name="Calculation" data-info="25.0 cm³ Fe²⁺ needs 22.40 cm³ of 0.0200 mol dm⁻³ MnO₄⁻: n(MnO₄⁻) = 4.48 × 10⁻⁴; n(Fe²⁺) = 2.24 × 10⁻³; [Fe²⁺] = 0.0896 mol dm⁻³." tabindex="0" role="button" aria-label="Calculation"><g><animate attributeName="opacity" keyTimes="0.0000;0.8333;0.8533;1.0000" values="0;0;1;1" dur="15s" begin="mt-play.begin+0s" fill="freeze"/><rect x="390" y="290" width="620" height="230" rx="16" fill="#fef9c3" stroke="#eab308"/><text x="410" y="330" text-anchor="start" font-size="14" font-weight="800" fill="#111827">n(MnO₄⁻) = 0.0200 × 0.02240 = 4.48 × 10⁻⁴ mol</text><text x="410" y="370" text-anchor="start" font-size="14" font-weight="800" fill="#111827">n(Fe²⁺) = 5 × 4.48 × 10⁻⁴ = 2.24 × 10⁻³ mol</text><text x="410" y="410" text-anchor="start" font-size="14" font-weight="800" fill="#111827">[Fe²⁺] = 2.24 × 10⁻³ ÷ 0.0250 = 0.0896 mol dm⁻³</text><text x="410" y="450" text-anchor="start" font-size="14" font-weight="800" fill="#111827">acid: H₂SO₄ not HCl (Cl⁻ would be oxidised)</text><text x="410" y="490" text-anchor="start" font-size="14" font-weight="800" fill="#111827">Cr₂O₇²⁻ : Fe²⁺ = 1 : 6 (orange → green)</text></g></g>
</svg>