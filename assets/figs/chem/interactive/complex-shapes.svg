<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 540" class="vd-svg" role="img" aria-labelledby="cs-title cs-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="cs-play" data-vd-play-label="Play: build the shapes" data-vd-steps="[[0, &quot;Shapes of complex ions.&quot;], [1, &quot;Octahedral: six ligands.&quot;], [4, &quot;Tetrahedral: four ligands.&quot;], [7, &quot;Square planar.&quot;], [10, &quot;Linear.&quot;]]" data-vd-dur="13">
<title id="cs-title">Shapes of complex ions</title><desc id="cs-desc">Four complex ion geometries: octahedral hexaaquacopper(II), tetrahedral tetrachlorocuprate(II), square planar cisplatin and linear diamminesilver(I), with bond angles and coordination numbers.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="540" fill="#ffffff"/>
<g aria-hidden="true"><animate id="cs-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<text class="head" x="30" y="34">Shapes of complex ions</text><text class="note" x="30" y="56">Ligands donate lone pairs (dative bonds) to the central metal ion.</text>
<g class="part" data-part="oct" data-name="Octahedral" data-info="Six ligands at 90°: [Cu(H₂O)₆]²⁺, [Fe(CN)₆]³⁻. Coordination number 6." tabindex="0" role="button" aria-label="Octahedral"><g><animate attributeName="opacity" keyTimes="0.0000;0.0769;0.1000;1.0000" values="0;0;1;1" dur="13s" begin="cs-play.begin+0s" fill="freeze"/><rect x="30" y="80" width="250" height="420" rx="16" fill="#f8fafc" stroke="#cbd5e1"/><text x="155" y="108" text-anchor="middle" font-size="15" font-weight="800" fill="#111827">octahedral</text><text x="155" y="128" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">[Cu(H₂O)₆]²⁺ · CN 6</text><line x1="155" y1="290" x2="155" y2="180" stroke="#334155" stroke-width="4"/><line x1="155" y1="290" x2="155" y2="400" stroke="#334155" stroke-width="4"/><line x1="155" y1="290" x2="65" y2="270" stroke="#334155" stroke-width="4"/><line x1="155" y1="290" x2="245" y2="310" stroke="#334155" stroke-width="4"/><line x1="155" y1="290" x2="105" y2="340" stroke="#334155" stroke-width="6"/><line x1="155" y1="290" x2="205" y2="240" stroke="#334155" stroke-width="2" stroke-dasharray="5 4"/><circle cx="155" cy="290" r="24" fill="#2563eb" stroke="#334155" stroke-width="2"/><text x="155" y="295" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">Cu²⁺</text><circle cx="155" cy="180" r="20" fill="#fca5a5" stroke="#334155"/><text x="155" y="184" text-anchor="middle" font-size="10" font-weight="800" fill="#111827">H₂O</text><circle cx="155" cy="400" r="20" fill="#fca5a5" stroke="#334155"/><text x="155" y="404" text-anchor="middle" font-size="10" font-weight="800" fill="#111827">H₂O</text><circle cx="65" cy="270" r="20" fill="#fca5a5" stroke="#334155"/><text x="65" y="274" text-anchor="middle" font-size="10" font-weight="800" fill="#111827">H₂O</text><circle cx="245" cy="310" r="20" fill="#fca5a5" stroke="#334155"/><text x="245" y="314" text-anchor="middle" font-size="10" font-weight="800" fill="#111827">H₂O</text><circle cx="105" cy="340" r="20" fill="#fca5a5" stroke="#334155"/><text x="105" y="344" text-anchor="middle" font-size="10" font-weight="800" fill="#111827">H₂O</text><circle cx="205" cy="240" r="20" fill="#fca5a5" stroke="#334155"/><text x="205" y="244" text-anchor="middle" font-size="10" font-weight="800" fill="#111827">H₂O</text><text x="155" y="470" text-anchor="middle" font-size="13" font-weight="800" fill="#1d4ed8">90°</text></g></g>
<g class="part" data-part="tet" data-name="Tetrahedral" data-info="Four larger ligands such as Cl⁻ at 109.5°: [CuCl₄]²⁻, [CoCl₄]²⁻." tabindex="0" role="button" aria-label="Tetrahedral"><g><animate attributeName="opacity" keyTimes="0.0000;0.3077;0.3308;1.0000" values="0;0;1;1" dur="13s" begin="cs-play.begin+0s" fill="freeze"/><rect x="295" y="80" width="250" height="420" rx="16" fill="#f8fafc" stroke="#cbd5e1"/><text x="420" y="108" text-anchor="middle" font-size="15" font-weight="800" fill="#111827">tetrahedral</text><text x="420" y="128" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">[CuCl₄]²⁻ · CN 4</text><line x1="420" y1="290" x2="420" y2="190" stroke="#334155" stroke-width="4"/><line x1="420" y1="290" x2="330" y2="330" stroke="#334155" stroke-width="4"/><line x1="420" y1="290" x2="480" y2="360" stroke="#334155" stroke-width="6"/><line x1="420" y1="290" x2="500" y2="310" stroke="#334155" stroke-width="2" stroke-dasharray="5 4"/><circle cx="420" cy="290" r="24" fill="#2563eb" stroke="#334155" stroke-width="2"/><text x="420" y="295" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">Cu²⁺</text><circle cx="420" cy="190" r="20" fill="#86efac" stroke="#334155"/><text x="420" y="194" text-anchor="middle" font-size="10" font-weight="800" fill="#111827">Cl</text><circle cx="330" cy="330" r="20" fill="#86efac" stroke="#334155"/><text x="330" y="334" text-anchor="middle" font-size="10" font-weight="800" fill="#111827">Cl</text><circle cx="480" cy="360" r="20" fill="#86efac" stroke="#334155"/><text x="480" y="364" text-anchor="middle" font-size="10" font-weight="800" fill="#111827">Cl</text><circle cx="500" cy="310" r="20" fill="#86efac" stroke="#334155"/><text x="500" y="314" text-anchor="middle" font-size="10" font-weight="800" fill="#111827">Cl</text><text x="420" y="470" text-anchor="middle" font-size="13" font-weight="800" fill="#1d4ed8">109.5°</text></g></g>
<g class="part" data-part="sq" data-name="Square planar" data-info="Four ligands in a plane at 90°: cisplatin [Pt(NH₃)₂Cl₂]." tabindex="0" role="button" aria-label="Square planar"><g><animate attributeName="opacity" keyTimes="0.0000;0.5385;0.5615;1.0000" values="0;0;1;1" dur="13s" begin="cs-play.begin+0s" fill="freeze"/><rect x="560" y="80" width="250" height="420" rx="16" fill="#f8fafc" stroke="#cbd5e1"/><text x="685" y="108" text-anchor="middle" font-size="15" font-weight="800" fill="#111827">square planar</text><text x="685" y="128" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">cisplatin [Pt(NH₃)₂Cl₂]</text><line x1="685" y1="290" x2="595" y2="290" stroke="#334155" stroke-width="4"/><line x1="685" y1="290" x2="685" y2="200" stroke="#334155" stroke-width="4"/><line x1="685" y1="290" x2="775" y2="290" stroke="#334155" stroke-width="4"/><line x1="685" y1="290" x2="685" y2="380" stroke="#334155" stroke-width="4"/><circle cx="685" cy="290" r="24" fill="#64748b" stroke="#334155" stroke-width="2"/><text x="685" y="295" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">Pt²⁺</text><circle cx="595" cy="290" r="20" fill="#86efac" stroke="#334155"/><text x="595" y="294" text-anchor="middle" font-size="10" font-weight="800" fill="#111827">Cl</text><circle cx="685" cy="200" r="20" fill="#86efac" stroke="#334155"/><text x="685" y="204" text-anchor="middle" font-size="10" font-weight="800" fill="#111827">Cl</text><circle cx="775" cy="290" r="20" fill="#93c5fd" stroke="#334155"/><text x="775" y="294" text-anchor="middle" font-size="10" font-weight="800" fill="#111827">NH₃</text><circle cx="685" cy="380" r="20" fill="#93c5fd" stroke="#334155"/><text x="685" y="384" text-anchor="middle" font-size="10" font-weight="800" fill="#111827">NH₃</text><text x="685" y="470" text-anchor="middle" font-size="13" font-weight="800" fill="#1d4ed8">90° (planar)</text></g></g>
<g class="part" data-part="lin" data-name="Linear" data-info="Two ligands at 180°: [Ag(NH₃)₂]⁺ (Tollens&#x27; reagent)." tabindex="0" role="button" aria-label="Linear"><g><animate attributeName="opacity" keyTimes="0.0000;0.7692;0.7923;1.0000" values="0;0;1;1" dur="13s" begin="cs-play.begin+0s" fill="freeze"/><rect x="825" y="80" width="250" height="420" rx="16" fill="#f8fafc" stroke="#cbd5e1"/><text x="950" y="108" text-anchor="middle" font-size="15" font-weight="800" fill="#111827">linear</text><text x="950" y="128" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">[Ag(NH₃)₂]⁺ · CN 2</text><line x1="950" y1="290" x2="850" y2="290" stroke="#334155" stroke-width="4"/><line x1="950" y1="290" x2="1050" y2="290" stroke="#334155" stroke-width="4"/><circle cx="950" cy="290" r="24" fill="#94a3b8" stroke="#334155" stroke-width="2"/><text x="950" y="295" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">Ag⁺</text><circle cx="850" cy="290" r="20" fill="#93c5fd" stroke="#334155"/><text x="850" y="294" text-anchor="middle" font-size="10" font-weight="800" fill="#111827">NH₃</text><circle cx="1050" cy="290" r="20" fill="#93c5fd" stroke="#334155"/><text x="1050" y="294" text-anchor="middle" font-size="10" font-weight="800" fill="#111827">NH₃</text><text x="950" y="470" text-anchor="middle" font-size="13" font-weight="800" fill="#1d4ed8">180°</text></g></g>
</svg>