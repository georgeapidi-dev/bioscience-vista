<g class="part" data-part="log" data-name="A logarithmic scale" data-info="pH = −log₁₀[H⁺]. Each step of 1 is a ten-fold change in hydrogen ion concentration: pH 3 has 10 times more H⁺ than pH 4." tabindex="0" role="button" aria-label="A logarithmic scale"><rect x="60" y="460" width="1080" height="44" rx="10" fill="#f8fafc" stroke="#cbd5e1"/><text x="600" y="488" text-anchor="middle" font-size="15" font-weight="700">pH = −log₁₀[H⁺]: each step of 1 pH unit is a ten-fold change in [H⁺]. pH 2 is 100 times more acidic than pH 4.</text></g>
