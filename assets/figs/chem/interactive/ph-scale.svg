<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" class="vd-svg" role="img" aria-labelledby="ph-title ph-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="ph-play" data-vd-play-label="Play: tour the pH scale" data-vd-steps="[[0, &quot;The pH scale runs from 0 to 14. Universal indicator turns a different colour at each pH.&quot;], [1.0, &quot;pH 0: battery acid. [H\u207a] = 10^\u22120 mol dm\u207b\u00b3.&quot;], [2.0, &quot;pH 1.5: stomach acid. [H\u207a] = 10^\u22121.5 mol dm\u207b\u00b3.&quot;], [3.0, &quot;pH 2.2: lemon juice. [H\u207a] = 10^\u22122.2 mol dm\u207b\u00b3.&quot;], [4.0, &quot;pH 3: vinegar. [H\u207a] = 10^\u22123 mol dm\u207b\u00b3.&quot;], [5.0, &quot;pH 4.5: tomato. [H\u207a] = 10^\u22124.5 mol dm\u207b\u00b3.&quot;], [6.0, &quot;pH 5.6: rain water. [H\u207a] = 10^\u22125.6 mol dm\u207b\u00b3.&quot;], [7.0, &quot;pH 7: pure water. [H\u207a] = 10^\u22127 mol dm\u207b\u00b3.&quot;], [8.0, &quot;pH 7.4: blood. [H\u207a] = 10^\u22127.4 mol dm\u207b\u00b3.&quot;], [9.0, &quot;pH 8.3: sea water. [H\u207a] = 10^\u22128.3 mol dm\u207b\u00b3.&quot;], [10.0, &quot;pH 9: baking soda. [H\u207a] = 10^\u22129 mol dm\u207b\u00b3.&quot;], [11.0, &quot;pH 11: ammonia. [H\u207a] = 10^\u221211 mol dm\u207b\u00b3.&quot;], [12.0, &quot;pH 12.5: bleach. [H\u207a] = 10^\u221212.5 mol dm\u207b\u00b3.&quot;], [13.0, &quot;pH 14: sodium hydroxide. [H\u207a] = 10^\u221214 mol dm\u207b\u00b3.&quot;]]" data-vd-dur="15">
<title id="ph-title">The pH scale</title><desc id="ph-desc">The pH scale from 0 to 14 with universal indicator colours and everyday examples; acids below 7, neutral at 7, alkalis above 7; each unit is a ten-fold change in hydrogen ion concentration.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1200" height="520" fill="#ffffff"/>
<g aria-hidden="true"><animate id="ph-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<text class="head" x="30" y="34">The pH scale</text><text class="note" x="30" y="56">Universal indicator colours (approximate). Values at 25 °C.</text>
<g class="part" data-part="scale" data-name="The pH scale" data-info="From 0 to 14 (at 25 °C). Below 7 is acidic, 7 is neutral, above 7 is alkaline." tabindex="0" role="button" aria-label="The pH scale"><rect x="60.0" y="140" width="72.0" height="70" fill="#dc2626"/><text x="96.0" y="184" text-anchor="middle" font-size="20" font-weight="800" fill="#fff" paint-order="stroke" stroke="#0005" stroke-width="2">0</text><rect x="132.0" y="140" width="72.0" height="70" fill="#ef4444"/><text x="168.0" y="184" text-anchor="middle" font-size="20" font-weight="800" fill="#fff" paint-order="stroke" stroke="#0005" stroke-width="2">1</text><rect x="204.0" y="140" width="72.0" height="70" fill="#f97316"/><text x="240.0" y="184" text-anchor="middle" font-size="20" font-weight="800" fill="#fff" paint-order="stroke" stroke="#0005" stroke-width="2">2</text><rect x="276.0" y="140" width="72.0" height="70" fill="#fb923c"/><text x="312.0" y="184" text-anchor="middle" font-size="20" font-weight="800" fill="#fff" paint-order="stroke" stroke="#0005" stroke-width="2">3</text><rect x="348.0" y="140" width="72.0" height="70" fill="#f59e0b"/><text x="384.0" y="184" text-anchor="middle" font-size="20" font-weight="800" fill="#fff" paint-order="stroke" stroke="#0005" stroke-width="2">4</text><rect x="420.0" y="140" width="72.0" height="70" fill="#facc15"/><text x="456.0" y="184" text-anchor="middle" font-size="20" font-weight="800" fill="#fff" paint-order="stroke" stroke="#0005" stroke-width="2">5</text><rect x="492.0" y="140" width="72.0" height="70" fill="#a3e635"/><text x="528.0" y="184" text-anchor="middle" font-size="20" font-weight="800" fill="#fff" paint-order="stroke" stroke="#0005" stroke-width="2">6</text><rect x="564.0" y="140" width="72.0" height="70" fill="#22c55e"/><text x="600.0" y="184" text-anchor="middle" font-size="20" font-weight="800" fill="#fff" paint-order="stroke" stroke="#0005" stroke-width="2">7</text><rect x="636.0" y="140" width="72.0" height="70" fill="#14b8a6"/><text x="672.0" y="184" text-anchor="middle" font-size="20" font-weight="800" fill="#fff" paint-order="stroke" stroke="#0005" stroke-width="2">8</text><rect x="708.0" y="140" width="72.0" height="70" fill="#06b6d4"/><text x="744.0" y="184" text-anchor="middle" font-size="20" font-weight="800" fill="#fff" paint-order="stroke" stroke="#0005" stroke-width="2">9</text><rect x="780.0" y="140" width="72.0" height="70" fill="#3b82f6"/><text x="816.0" y="184" text-anchor="middle" font-size="20" font-weight="800" fill="#fff" paint-order="stroke" stroke="#0005" stroke-width="2">10</text><rect x="852.0" y="140" width="72.0" height="70" fill="#4f46e5"/><text x="888.0" y="184" text-anchor="middle" font-size="20" font-weight="800" fill="#fff" paint-order="stroke" stroke="#0005" stroke-width="2">11</text><rect x="924.0" y="140" width="72.0" height="70" fill="#6d28d9"/><text x="960.0" y="184" text-anchor="middle" font-size="20" font-weight="800" fill="#fff" paint-order="stroke" stroke="#0005" stroke-width="2">12</text><rect x="996.0" y="140" width="72.0" height="70" fill="#7e22ce"/><text x="1032.0" y="184" text-anchor="middle" font-size="20" font-weight="800" fill="#fff" paint-order="stroke" stroke="#0005" stroke-width="2">13</text><rect x="1068.0" y="140" width="72.0" height="70" fill="#581c87"/><text x="1104.0" y="184" text-anchor="middle" font-size="20" font-weight="800" fill="#fff" paint-order="stroke" stroke="#0005" stroke-width="2">14</text><rect x="60" y="140" width="1080" height="70" fill="none" stroke="#1f2937" stroke-width="2"/></g>
<g class="part" data-part="acid" data-name="Acids" data-info="Contain more H⁺ ions than OH⁻ ions. The lower the pH, the stronger the acidity." tabindex="0" role="button" aria-label="Acids"><path d="M 60 120 L 554.0 120" stroke="#dc2626" stroke-width="4"/><text x="312.0" y="110" text-anchor="middle" font-size="16" font-weight="800" fill="#b91c1c">ACIDIC: stronger ←</text></g>
<g class="part" data-part="neut" data-name="Neutral" data-info="pH 7: [H⁺] = [OH⁻], e.g. pure water." tabindex="0" role="button" aria-label="Neutral"><text x="600.0" y="110" text-anchor="middle" font-size="16" font-weight="800" fill="#15803d">NEUTRAL</text></g>
<g class="part" data-part="alk" data-name="Alkalis" data-info="More OH⁻ than H⁺ ions. The higher the pH, the more alkaline." tabindex="0" role="button" aria-label="Alkalis"><path d="M 646.0 120 L 1140 120" stroke="#6d28d9" stroke-width="4"/><text x="888.0" y="110" text-anchor="middle" font-size="16" font-weight="800" fill="#6d28d9">→ stronger: ALKALINE</text></g>
