<g class="part" data-part="react" data-name="Predicting ΔS" data-info="ΔS is positive when moles of gas increase, a solid dissolves, or temperature rises. CaCO₃(s) → CaO(s) + CO₂(g): ΔS positive." tabindex="0" role="button" aria-label="Predicting ΔS"><g><animate attributeName="opacity" keyTimes="0.0000;0.5000;0.5214;1.0000" values="0;0;1;1" dur="14s" begin="en-play.begin+0s" fill="freeze"/><rect x="40" y="350" width="660" height="80" rx="14" fill="#fef3c7" stroke="#fcd34d"/><text x="370" y="382" text-anchor="middle" font-size="17" font-weight="800" fill="#111827">CaCO₃(s) → CaO(s) + CO₂(g)</text><text x="370" y="412" text-anchor="middle" font-size="13" font-weight="800" fill="#a16207">0 mol gas → 1 mol gas: ΔS positive</text></g></g>
<g class="part" data-part="calc" data-name="Calculating" data-info="ΔS⦵ = ΣS⦵(products) − ΣS⦵(reactants). Units J K⁻¹ mol⁻¹." tabindex="0" role="button" aria-label="Calculating"><g><animate attributeName="opacity" keyTimes="0.0000;0.7857;0.8071;1.0000" values="0;0;1;1" dur="14s" begin="en-play.begin+0s" fill="freeze"/><rect x="40" y="450" width="1020" height="90" rx="14" fill="#f0fdf4" stroke="#86efac"/><text x="550" y="482" text-anchor="middle" font-size="15" font-weight="800" fill="#15803d">ΔS⦵ = (S CaO 40 + S CO₂ 214) − (S CaCO₃ 93) = +161 J K⁻¹ mol⁻¹</text><text x="550" y="512" text-anchor="middle" font-size="12" font-weight="700" fill="#475569">always check: gas formed → positive</text></g></g>
<g><animate attributeName="opacity" keyTimes="0.0000;0.5714;0.5929;1.0000" values="0;0;1;1" dur="14s" begin="en-play.begin+0s" fill="freeze"/><rect x="720" y="350" width="340" height="80" rx="14" fill="#ede9fe" stroke="#c4b5fd"/><text x="890" y="382" text-anchor="middle" font-size="13" font-weight="800" fill="#6d28d9">ΔS positive when:</text><text x="890" y="404" text-anchor="middle" font-size="12" font-weight="700" fill="#6d28d9">gas moles ↑ · s → l → g · dissolving</text></g>
