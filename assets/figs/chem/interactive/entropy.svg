<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" class="vd-svg" role="img" aria-labelledby="en-title en-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="en-play" data-vd-play-label="Play: spread out" data-vd-steps="[[0, &quot;Entropy: the number of possible arrangements.&quot;], [1, &quot;Solid \u2192 liquid \u2192 gas: entropy increases greatly.&quot;], [7, &quot;More moles of gas: \u0394S positive.&quot;], [11, &quot;\u0394S = \u03a3S(products) \u2212 \u03a3S(reactants).&quot;]]" data-vd-dur="14">
<title id="en-title">Entropy</title><desc id="en-desc">Particle pictures of ice, liquid water and steam with standard entropies 48, 70 and 189 joules per kelvin per mole, and the decomposition of calcium carbonate producing a gas so the entropy change is positive.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
