<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" class="vd-svg" role="img" aria-labelledby="na-title na-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="na-play" data-vd-play-label="Play: add HCN" data-vd-steps="[[0, &quot;Nucleophilic addition to C=O: HCN and ethanal.&quot;], [1, &quot;The C=O bond is polar: C\u03b4+.&quot;], [4, &quot;CN\u207b attacks the \u03b4+ carbon; \u03c0 electrons move onto oxygen.&quot;], [9, &quot;O\u207b picks up H\u207a: 2-hydroxypropanenitrile.&quot;], [13, &quot;NaBH\u2084 reduces carbonyls back to alcohols.&quot;]]" data-vd-dur="16">
<title id="na-title">Nucleophilic addition</title><desc id="na-desc">Curly-arrow mechanism: cyanide attacks the delta-positive carbon of ethanal, the pi electrons move to oxygen forming an alkoxide, which takes a proton to give 2-hydroxypropanenitrile; sodium borohydride reduces carbonyls to alcohols.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="560" fill="#ffffff"/>
<g aria-hidden="true"><animate id="na-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<defs><marker id="na-dc2626" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="5.4" refY="6.0" orient="auto"><path d="M0,0 L12,6.0 L0,12 z" fill="#dc2626"/></marker><marker id="na-2563eb" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="5.4" refY="6.0" orient="auto"><path d="M0,0 L12,6.0 L0,12 z" fill="#2563eb"/></marker></defs>
<text class="head" x="30" y="34">Nucleophilic addition: HCN + ethanal</text><text class="note" x="30" y="56">Conditions: HCN with a trace of KCN (source of CN⁻), room temperature.</text>
<g class="part" data-part="pol" data-name="Polar C=O" data-info="O is more electronegative: C is δ+ and attracts nucleophiles. Unlike C=C, C=O undergoes nucleophilic (not electrophilic) addition." tabindex="0" role="button" aria-label="Polar C=O"><circle cx="260" cy="300" r="18" fill="#374151" stroke="#1f2937" stroke-width="1.5"/><text x="260" y="305" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">C</text><line x1="264.0" y1="282.0" x2="264.0" y2="236.0" stroke="#334155" stroke-width="3"/><line x1="256.0" y1="282.0" x2="256.0" y2="236.0" stroke="#334155" stroke-width="3"/><circle cx="260" cy="220" r="18" fill="#ef4444" stroke="#1f2937" stroke-width="1.5"/><text x="260" y="225" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">O</text><line x1="242" y1="300" x2="198" y2="330" stroke="#334155" stroke-width="4"/><rect x="150" y="318" width="52" height="28" rx="10" fill="#fde68a" stroke="#a16207"/><text x="176" y="337" text-anchor="middle" font-size="12" font-weight="800" fill="#713f12">CH₃</text><line x1="278" y1="300" x2="318" y2="328" stroke="#334155" stroke-width="4"/><circle cx="326" cy="334" r="11" fill="#f8fafc" stroke="#1f2937" stroke-width="1.5"/><text x="326" y="339" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">H</text><g><animate attributeName="opacity" keyTimes="0.0000;0.0938;0.1125;1.0000" values="0;0;1;1" dur="16s" begin="na-play.begin+0s" fill="freeze"/><text x="292" y="296" text-anchor="start" font-size="13" font-weight="800" fill="#b91c1c">δ+</text><text x="292" y="216" text-anchor="start" font-size="13" font-weight="800" fill="#1d4ed8">δ−</text></g></g>
<g class="part" data-part="s1" data-name="Step 1" data-info="CN⁻ (from HCN with a little KCN) attacks the δ+ carbon; the π bond electrons move to O: an alkoxide intermediate with O⁻." tabindex="0" role="button" aria-label="Step 1"><g transform="translate(130 400)"><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.2500;0.3438;1.0000" values="100 420;100 420;170 390;170 390" dur="16s" begin="na-play.begin+0s" fill="freeze"/><circle cx="0" cy="0" r="14" fill="#374151" stroke="#1f2937" stroke-width="1.5"/><text x="0" y="5" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">C</text><line x1="14.0" y1="6.4" x2="40.0" y2="6.4" stroke="#334155" stroke-width="3"/><line x1="14.0" y1="0.0" x2="40.0" y2="0.0" stroke="#334155" stroke-width="3"/><line x1="14.0" y1="-6.4" x2="40.0" y2="-6.4" stroke="#334155" stroke-width="3"/><circle cx="50" cy="0" r="14" fill="#3b82f6" stroke="#1f2937" stroke-width="1.5"/><text x="50" y="5" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">N</text><text x="-24" y="-14" text-anchor="middle" font-size="22" font-weight="800" fill="#1d4ed8">⁻</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.3438;0.3625;1.0000" values="0;0;1;1" dur="16s" begin="na-play.begin+0s" fill="freeze"/><path d="M 172 380 Q 200 330 244 312" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#na-2563eb)"/><path d="M 254 262 Q 230 245 248 228" fill="none" stroke="#dc2626" stroke-width="3" marker-end="url(#na-dc2626)"/></g><g><animate attributeName="opacity" keyTimes="0.0000;0.4375;0.4562;1.0000" values="0;0;1;1" dur="16s" begin="na-play.begin+0s" fill="freeze"/><rect x="420" y="150" width="280" height="260" rx="14" fill="#fef2f2" stroke="#fecaca"/><circle cx="560" cy="300" r="18" fill="#374151" stroke="#1f2937" stroke-width="1.5"/><text x="560" y="305" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">C</text><line x1="560" y1="282" x2="560" y2="240" stroke="#334155" stroke-width="4"/><circle cx="560" cy="226" r="18" fill="#ef4444" stroke="#1f2937" stroke-width="1.5"/><text x="560" y="231" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">O</text><text x="582" y="214" text-anchor="middle" font-size="22" font-weight="800" fill="#1d4ed8">−</text><line x1="560" y1="318" x2="560" y2="350" stroke="#334155" stroke-width="4"/><text x="560" y="372" text-anchor="middle" font-size="14" font-weight="800" fill="#111827">CN</text><line x1="542" y1="300" x2="500" y2="300" stroke="#334155" stroke-width="4"/><text x="478" y="305" text-anchor="middle" font-size="12" font-weight="800" fill="#713f12">CH₃</text><line x1="578" y1="300" x2="618" y2="300" stroke="#334155" stroke-width="4"/><circle cx="628" cy="300" r="11" fill="#f8fafc" stroke="#1f2937" stroke-width="1.5"/><text x="628" y="305" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">H</text><text x="560" y="400" text-anchor="middle" font-size="12" font-weight="800" fill="#b91c1c">alkoxide intermediate</text></g></g>
<g class="part" data-part="s2" data-name="Step 2" data-info="O⁻ takes H⁺ (from HCN or water): a 2-hydroxynitrile, e.g. 2-hydroxypropanenitrile from ethanal. A planar C=O can be attacked from either side: a racemic mixture if the product is chiral." tabindex="0" role="button" aria-label="Step 2"><g><animate attributeName="opacity" keyTimes="0.0000;0.5625;0.5813;1.0000" values="0;0;1;1" dur="16s" begin="na-play.begin+0s" fill="freeze"/><rect x="740" y="150" width="330" height="260" rx="14" fill="#f0fdf4" stroke="#86efac"/><circle cx="900" cy="300" r="18" fill="#374151" stroke="#1f2937" stroke-width="1.5"/><text x="900" y="305" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">C</text><line x1="900" y1="282" x2="900" y2="240" stroke="#334155" stroke-width="4"/><circle cx="900" cy="226" r="18" fill="#ef4444" stroke="#1f2937" stroke-width="1.5"/><text x="900" y="231" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">O</text><line x1="916" y1="222" x2="944" y2="210" stroke="#334155" stroke-width="4"/><circle cx="952" cy="206" r="11" fill="#f8fafc" stroke="#1f2937" stroke-width="1.5"/><text x="952" y="211" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">H</text><line x1="900" y1="318" x2="900" y2="350" stroke="#334155" stroke-width="4"/><text x="900" y="372" text-anchor="middle" font-size="14" font-weight="800" fill="#111827">CN</text><line x1="882" y1="300" x2="840" y2="300" stroke="#334155" stroke-width="4"/><text x="818" y="305" text-anchor="middle" font-size="12" font-weight="800" fill="#713f12">CH₃</text><line x1="918" y1="300" x2="958" y2="300" stroke="#334155" stroke-width="4"/><circle cx="968" cy="300" r="11" fill="#f8fafc" stroke="#1f2937" stroke-width="1.5"/><text x="968" y="305" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">H</text><text x="905" y="400" text-anchor="middle" font-size="13" font-weight="800" fill="#15803d">2-hydroxypropanenitrile</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.5625;0.5813;1.0000" values="0;0;1;1" dur="16s" begin="na-play.begin+0s" fill="freeze"/><path d="M 700 240 L 740 240" stroke="#2563eb" stroke-width="3" marker-end="url(#na-2563eb)"/><text x="720" y="230" text-anchor="middle" font-size="13" font-weight="800" fill="#1d4ed8">H⁺</text></g></g>
<g class="part" data-part="red" data-name="Reduction" data-info="NaBH₄ (a source of H⁻) reduces aldehydes to primary alcohols and ketones to secondary alcohols." tabindex="0" role="button" aria-label="Reduction"><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.8125;0.8313;1.0000" values="0;0;1;1" dur="16s" begin="na-play.begin+0s" fill="freeze"/><rect x="290.0" y="458" width="520" height="24" rx="12" fill="#dbeafe" stroke="#1f2937" stroke-width="1"/><text x="550" y="475" text-anchor="middle" font-size="12" font-weight="700">NaBH₄: aldehyde → primary alcohol · ketone → secondary alcohol</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.8750;0.8938;1.0000" values="0;0;1;1" dur="16s" begin="na-play.begin+0s" fill="freeze"/><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.8750;0.8938;1.0000" values="0;0;1;1" dur="16s" begin="na-play.begin+0s" fill="freeze"/><rect x="330.0" y="503" width="440" height="24" rx="12" fill="#f5f3ff" stroke="#1f2937" stroke-width="1"/><text x="550" y="520" text-anchor="middle" font-size="12" font-weight="700">planar C=O attacked from either side → racemic mixture</text></g></g></g>
</svg>