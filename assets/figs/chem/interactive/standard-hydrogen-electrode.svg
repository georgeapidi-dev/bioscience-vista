<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" class="vd-svg" role="img" aria-labelledby="sh-title sh-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="sh-play" data-vd-play-label="Play: measure E⦵" data-vd-steps="[[0, &quot;Measuring a standard electrode potential.&quot;], [1, &quot;The standard hydrogen electrode: 0.00 V by definition.&quot;], [5, &quot;Zinc in 1.00 mol dm\u207b\u00b3 Zn\u00b2\u207a.&quot;], [9, &quot;Salt bridge and voltmeter: E\u29b5 = \u22120.76 V.&quot;]]" data-vd-dur="14">
<title id="sh-title">The standard hydrogen electrode</title><desc id="sh-desc">A standard hydrogen electrode with hydrogen gas at 100 kilopascals bubbling over platinum in 1 mole per cubic decimetre acid, connected by a salt bridge and high-resistance voltmeter to a zinc half-cell, reading minus 0.76 volts.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="560" fill="#ffffff"/>
<g aria-hidden="true"><animate id="sh-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<text class="head" x="30" y="34">Measuring E⦵ with the standard hydrogen electrode</text><text class="note" x="30" y="56">Standard conditions: 298 K, 100 kPa, 1.00 mol dm⁻³.</text>
<g class="part" data-part="she" data-name="The standard hydrogen electrode" data-info="H₂ gas at 100 kPa bubbling over platinum (coated in platinum black) in 1.00 mol dm⁻³ H⁺ at 298 K. 2H⁺ + 2e⁻ ⇌ H₂, E⦵ = 0.00 V by definition." tabindex="0" role="button" aria-label="The standard hydrogen electrode"><path d="M 90 260 L 90 470 Q 90 490 110 490 L 310 490 Q 330 490 330 470 L 330 260" fill="#f8fafc" stroke="#334155" stroke-width="3"/><rect x="92" y="320" width="236" height="168" fill="#93c5fd" opacity=".5"/><path d="M 180 150 L 180 440 L 230 440 L 230 150" fill="#f8fafc" fill-opacity=".6" stroke="#334155" stroke-width="2.5"/><rect x="190" y="400" width="30" height="34" fill="#475569"/><text x="205" y="140" text-anchor="middle" font-size="11" font-weight="800" fill="#1d4ed8">H₂(g) 100 kPa in</text><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.0714;0.0857;0.2286;0.2429;1.0000" values="0;0;1;1;0;0" dur="14s" begin="sh-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.0714;0.2143;1.0000" values="200 432;200 432;200 330;200 330" dur="14s" begin="sh-play.begin+0s" fill="freeze"/><circle r="5" fill="#fff" stroke="#1d4ed8"/></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.1071;0.1214;0.2643;0.2786;1.0000" values="0;0;1;1;0;0" dur="14s" begin="sh-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.1071;0.2500;1.0000" values="206 432;206 432;206 330;206 330" dur="14s" begin="sh-play.begin+0s" fill="freeze"/><circle r="5" fill="#fff" stroke="#1d4ed8"/></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.1429;0.1571;0.3000;0.3143;1.0000" values="0;0;1;1;0;0" dur="14s" begin="sh-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.1429;0.2857;1.0000" values="212 432;212 432;212 330;212 330" dur="14s" begin="sh-play.begin+0s" fill="freeze"/><circle r="5" fill="#fff" stroke="#1d4ed8"/></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.1786;0.1929;0.3357;0.3500;1.0000" values="0;0;1;1;0;0" dur="14s" begin="sh-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.1786;0.3214;1.0000" values="200 432;200 432;200 330;200 330" dur="14s" begin="sh-play.begin+0s" fill="freeze"/><circle r="5" fill="#fff" stroke="#1d4ed8"/></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.2143;0.2286;0.3714;0.3857;1.0000" values="0;0;1;1;0;0" dur="14s" begin="sh-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.2143;0.3571;1.0000" values="206 432;206 432;206 330;206 330" dur="14s" begin="sh-play.begin+0s" fill="freeze"/><circle r="5" fill="#fff" stroke="#1d4ed8"/></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.2500;0.2643;0.4071;0.4214;1.0000" values="0;0;1;1;0;0" dur="14s" begin="sh-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.2500;0.3929;1.0000" values="212 432;212 432;212 330;212 330" dur="14s" begin="sh-play.begin+0s" fill="freeze"/><circle r="5" fill="#fff" stroke="#1d4ed8"/></g></g><g><animate attributeName="opacity" keyTimes="0.0000;0.0714;0.0929;1.0000" values="0;0;1;1" dur="14s" begin="sh-play.begin+0s" fill="freeze"/><text x="210" y="520" text-anchor="middle" font-size="12" font-weight="800" fill="#1d4ed8">1.00 mol dm⁻³ H⁺(aq)</text><text x="270" y="412" text-anchor="start" font-size="10" font-weight="800" fill="#475569">Pt (platinum black)</text><text x="210" y="540" text-anchor="middle" font-size="13" font-weight="800" fill="#1d4ed8">E⦵ = 0.00 V</text></g></g>
<g class="part" data-part="half" data-name="The other half-cell" data-info="Metal in 1.00 mol dm⁻³ of its ions (Zn/Zn²⁺), or Pt in a solution of both ions of a redox pair (Fe³⁺/Fe²⁺, each 1.00 mol dm⁻³)." tabindex="0" role="button" aria-label="The other half-cell"><g><animate attributeName="opacity" keyTimes="0.0000;0.3571;0.3786;1.0000" values="0;0;1;1" dur="14s" begin="sh-play.begin+0s" fill="freeze"/><path d="M 700 260 L 700 470 Q 700 490 720 490 L 920 490 Q 940 490 940 470 L 940 260" fill="#f8fafc" stroke="#334155" stroke-width="3"/><rect x="702" y="320" width="236" height="168" fill="#d1d5db" opacity=".5"/><rect x="805" y="200" width="30" height="270" fill="#94a3b8" stroke="#475569"/><text x="820" y="190" text-anchor="middle" font-size="14" font-weight="800" fill="#111827">Zn</text><text x="820" y="520" text-anchor="middle" font-size="12" font-weight="800" fill="#475569">1.00 mol dm⁻³ Zn²⁺(aq)</text></g></g>
<g class="part" data-part="bridge" data-name="Salt bridge and voltmeter" data-info="A salt bridge (filter paper soaked in KNO₃(aq)) completes the circuit without reacting; a high-resistance voltmeter measures E with almost no current. Zn/Zn²⁺: −0.76 V." tabindex="0" role="button" aria-label="Salt bridge and voltmeter"><g><animate attributeName="opacity" keyTimes="0.0000;0.6429;0.6643;1.0000" values="0;0;1;1" dur="14s" begin="sh-play.begin+0s" fill="freeze"/><path d="M 300 330 L 300 240 Q 300 220 320 220 L 690 220 Q 710 220 710 240 L 710 330" fill="none" stroke="#fde68a" stroke-width="26"/><text x="505" y="250" text-anchor="middle" font-size="12" font-weight="800" fill="#a16207">salt bridge (KNO₃(aq))</text><path d="M 205 150 L 205 110 L 440 110" fill="none" stroke="#334155" stroke-width="3"/><path d="M 570 110 L 820 110 L 820 200" fill="none" stroke="#334155" stroke-width="3"/><circle cx="505" cy="110" r="48" fill="#fff" stroke="#334155" stroke-width="3"/><text x="505" y="98" text-anchor="middle" font-size="16" font-weight="800" fill="#111827">V</text><text x="505" y="128" text-anchor="middle" font-size="16" font-weight="800" fill="#b91c1c" opacity="0">−0.76 V<animate attributeName="opacity" keyTimes="0.0000;0.7143;0.7571;1.0000" values="0;0;1;1" dur="14s" begin="sh-play.begin+0s" fill="freeze"/></text></g></g>
</svg>