<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" class="vd-svg" role="img" aria-labelledby="hl-title hl-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="hl-play" data-vd-play-label="Play: the halogens" data-vd-steps="[[0, &quot;Group 17: the halogens.&quot;], [1, &quot;Colours and states: gas, liquid, solid down the group.&quot;], [5.5, &quot;Oxidising power falls: a halogen displaces those below it.&quot;], [10.5, &quot;H\u2013X bonds weaken: HI decomposes most easily.&quot;]]" data-vd-dur="15">
<title id="hl-title">The halogens</title><desc id="hl-desc">Chlorine as a pale green gas, bromine as a red-brown liquid and iodine as a grey-black solid; chlorine water displacing bromine and iodine from their salts; and the thermal stability of the hydrogen halides decreasing with bond energy.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="560" fill="#ffffff"/>
<g aria-hidden="true"><animate id="hl-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<text class="head" x="30" y="34">Group 17: the halogens</text><text class="note" x="30" y="56">Bond energies / kJ mol⁻¹: H–Cl 431, H–Br 366, H–I 299.</text>
<g class="part" data-part="phys" data-name="Physical properties" data-info="Cl₂ pale green gas; Br₂ red-brown liquid; I₂ grey-black solid (purple vapour). Volatility decreases down the group: more electrons → stronger London forces." tabindex="0" role="button" aria-label="Physical properties"><g><animate attributeName="opacity" keyTimes="0.0000;0.0667;0.0867;1.0000" values="0;0;1;1" dur="15s" begin="hl-play.begin+0s" fill="freeze"/><path d="M 90 110 L 90 280 Q 130 300 170 280 L 170 110" fill="#f8fafc" stroke="#334155" stroke-width="2"/><rect x="92" y="130" width="76" height="150" fill="#bbf7d0" opacity=".6"/><text x="130" y="320" text-anchor="middle" font-size="15" font-weight="800" fill="#111827">Cl₂</text><text x="130" y="342" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">pale green gas</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.1467;0.1667;1.0000" values="0;0;1;1" dur="15s" begin="hl-play.begin+0s" fill="freeze"/><path d="M 260 110 L 260 280 Q 300 300 340 280 L 340 110" fill="#f8fafc" stroke="#334155" stroke-width="2"/><rect x="262" y="230" width="76" height="52" fill="#9a3412"/><rect x="262" y="130" width="76" height="100" fill="#ea580c" opacity=".35"/><text x="300" y="320" text-anchor="middle" font-size="15" font-weight="800" fill="#111827">Br₂</text><text x="300" y="342" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">red-brown liquid</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.2267;0.2467;1.0000" values="0;0;1;1" dur="15s" begin="hl-play.begin+0s" fill="freeze"/><path d="M 430 110 L 430 280 Q 470 300 510 280 L 510 110" fill="#f8fafc" stroke="#334155" stroke-width="2"/><rect x="432" y="230" width="76" height="52" fill="#334155"/><rect x="432" y="130" width="76" height="100" fill="#7c3aed" opacity=".2"/><text x="470" y="320" text-anchor="middle" font-size="15" font-weight="800" fill="#111827">I₂</text><text x="470" y="342" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">grey-black solid</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.3000;0.3200;1.0000" values="0;0;1;1" dur="15s" begin="hl-play.begin+0s" fill="freeze"/><text x="300" y="375" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">volatility decreases ↓ (stronger London forces)</text></g></g>
<g class="part" data-part="ox" data-name="Oxidising power" data-info="Decreases down the group: Cl₂ displaces Br⁻ and I⁻; Br₂ displaces I⁻. Cl₂ + 2Br⁻ → 2Cl⁻ + Br₂ (orange)." tabindex="0" role="button" aria-label="Oxidising power"><rect x="560" y="80" width="510" height="300" rx="16" fill="#f8fafc" stroke="#cbd5e1"/><text x="815" y="104" text-anchor="middle" font-size="14" font-weight="800" fill="#111827">displacement: Cl₂(aq) added</text><path d="M 630 140 L 630 300 Q 660 318 690 300 L 690 140" fill="#f8fafc" stroke="#334155" stroke-width="2"/><rect x="632" y="200" width="56" height="102" fill="#e0f2fe"><animate attributeName="fill" keyTimes="0.0000;0.4000;0.4667;1.0000" values="#e0f2fe;#e0f2fe;#e0f2fe;#e0f2fe" dur="15s" begin="hl-play.begin+0s" fill="freeze"/></rect><text x="660" y="334" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">KCl</text><g><animate attributeName="opacity" keyTimes="0.0000;0.4667;0.4867;1.0000" values="0;0;1;1" dur="15s" begin="hl-play.begin+0s" fill="freeze"/><text x="660" y="356" text-anchor="middle" font-size="11" font-weight="800" fill="#111827">no change</text></g><path d="M 780 140 L 780 300 Q 810 318 840 300 L 840 140" fill="#f8fafc" stroke="#334155" stroke-width="2"/><rect x="782" y="200" width="56" height="102" fill="#e0f2fe"><animate attributeName="fill" keyTimes="0.0000;0.4400;0.5067;1.0000" values="#e0f2fe;#e0f2fe;#fb923c;#fb923c" dur="15s" begin="hl-play.begin+0s" fill="freeze"/></rect><text x="810" y="334" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">KBr</text><g><animate attributeName="opacity" keyTimes="0.0000;0.5067;0.5267;1.0000" values="0;0;1;1" dur="15s" begin="hl-play.begin+0s" fill="freeze"/><text x="810" y="356" text-anchor="middle" font-size="11" font-weight="800" fill="#111827">orange: Br₂</text></g><path d="M 930 140 L 930 300 Q 960 318 990 300 L 990 140" fill="#f8fafc" stroke="#334155" stroke-width="2"/><rect x="932" y="200" width="56" height="102" fill="#e0f2fe"><animate attributeName="fill" keyTimes="0.0000;0.4800;0.5467;1.0000" values="#e0f2fe;#e0f2fe;#92400e;#92400e" dur="15s" begin="hl-play.begin+0s" fill="freeze"/></rect><text x="960" y="334" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">KI</text><g><animate attributeName="opacity" keyTimes="0.0000;0.5467;0.5667;1.0000" values="0;0;1;1" dur="15s" begin="hl-play.begin+0s" fill="freeze"/><text x="960" y="356" text-anchor="middle" font-size="11" font-weight="800" fill="#111827">brown: I₂</text></g></g>
<g class="part" data-part="hx" data-name="Hydrogen halides" data-info="Thermal stability decreases HCl &gt; HBr &gt; HI as the H–X bond gets longer and weaker: a hot wire decomposes HI to purple iodine vapour." tabindex="0" role="button" aria-label="Hydrogen halides"><rect x="30" y="400" width="1040" height="140" rx="16" fill="#fff7ed" stroke="#fdba74"/><text x="550" y="426" text-anchor="middle" font-size="14" font-weight="800" fill="#c2410c">hydrogen halides: thermal stability HCl > HBr > HI</text><g><animate attributeName="opacity" keyTimes="0.0000;0.7000;0.7200;1.0000" values="0;0;1;1" dur="15s" begin="hl-play.begin+0s" fill="freeze"/><text x="220" y="470" text-anchor="middle" font-size="16" font-weight="800" fill="#111827">HCl</text><rect x="120" y="484" width="196" height="18" fill="#f97316"/><text x="230" y="524" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">431 kJ mol⁻¹</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.7400;0.7600;1.0000" values="0;0;1;1" dur="15s" begin="hl-play.begin+0s" fill="freeze"/><text x="550" y="470" text-anchor="middle" font-size="16" font-weight="800" fill="#111827">HBr</text><rect x="450" y="484" width="166" height="18" fill="#f97316"/><text x="560" y="524" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">366 kJ mol⁻¹</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.7800;0.8000;1.0000" values="0;0;1;1" dur="15s" begin="hl-play.begin+0s" fill="freeze"/><text x="880" y="470" text-anchor="middle" font-size="16" font-weight="800" fill="#111827">HI</text><rect x="780" y="484" width="136" height="18" fill="#f97316"/><text x="890" y="524" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">299 kJ mol⁻¹</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.8333;0.8533;1.0000" values="0;0;1;1" dur="15s" begin="hl-play.begin+0s" fill="freeze"/><text x="1010" y="512" text-anchor="middle" font-size="12" font-weight="800" fill="#7c3aed">hot wire →</text><text x="1010" y="528" text-anchor="middle" font-size="12" font-weight="800" fill="#7c3aed">purple I₂</text></g></g>
</svg>