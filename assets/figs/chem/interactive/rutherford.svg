30" dur="16s" begin="ru-play.begin+0s" fill="freeze"/><circle r="5" fill="#dc2626"/></g></g><g><animate attributeName="opacity" keyTimes="0.0000;0.7188;0.7375;1.0000" values="0;0;1;1" dur="16s" begin="ru-play.begin+0s" fill="freeze"/><polyline points="520,507 638,507 700,430" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4 4" opacity=".6"/></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.6438;0.6562;0.7875;0.8000;1.0000" values="0;0;1;1;0;0" dur="16s" begin="ru-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.6438;0.7063;0.7688;1.0000" values="520 511;520 511;752 511;680 570;680 570" dur="16s" begin="ru-play.begin+0s" fill="freeze"/><circle r="5" fill="#dc2626"/></g></g><g><animate attributeName="opacity" keyTimes="0.0000;0.7688;0.7875;1.0000" values="0;0;1;1" dur="16s" begin="ru-play.begin+0s" fill="freeze"/><polyline points="520,511 752,511 680,570" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4 4" opacity=".6"/></g></g></g>
<g><animate attributeName="opacity" keyTimes="0.0000;0.7812;0.8000;1.0000" values="0;0;1;1" dur="16s" begin="ru-play.begin+0s" fill="freeze"/><rect x="40" y="440" width="400" height="190" rx="16" fill="#fef9c3" stroke="#eab308"/><text x="240" y="468" text-anchor="middle" font-size="15" font-weight="800" fill="#713f12">Conclusions</text><text x="60" y="500" text-anchor="start" font-size="13" font-weight="600" fill="#111827">• most alphas pass: atom mostly empty space</text><text x="60" y="528" text-anchor="start" font-size="13" font-weight="600" fill="#111827">• large deflections: a concentrated</text><text x="60" y="556" text-anchor="start" font-size="13" font-weight="600" fill="#111827">•    positive charge (repels alphas)</text><text x="60" y="584" text-anchor="start" font-size="13" font-weight="600" fill="#111827">• rebounds: nucleus is very dense,</text><text x="60" y="612" text-anchor="start" font-size="13" font-weight="600" fill="#111827">•    holding most of the mass</text></g>
