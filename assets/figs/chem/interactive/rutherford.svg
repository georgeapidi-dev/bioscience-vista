0 236;170 236;300 236;440.0 236.0;440.0 236.0" dur="16s" begin="ru-play.begin+0s" fill="freeze"/><circle r="4" fill="#dc2626"/></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.1406;0.1531;0.2469;0.2594;1.0000" values="0;0;1;1;0;0" dur="16s" begin="ru-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.1406;0.1906;0.2406;1.0000" values="170 252;170 252;300 252;426.883090185131 192.83344335630207;426.883090185131 192.83344335630207" dur="16s" begin="ru-play.begin+0s" fill="freeze"/><circle r="4" fill="#dc2626"/></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.1562;0.1688;0.2625;0.2750;1.0000" values="0;0;1;1;0;0" dur="16s" begin="ru-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.1562;0.2062;0.2562;1.0000" values="170 226;170 226;300 226;407.24622203665695 315.9902653561155;407.24622203665695 315.9902653561155" dur="16s" begin="ru-play.begin+0s" fill="freeze"/><circle r="4" fill="#dc2626"/></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.1719;0.1844;0.2781;0.2906;1.0000" values="0;0;1;1;0;0" dur="16s" begin="ru-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.1719;0.2219;0.2719;1.0000" values="170 242;170 242;300 242;178.75644347017857 172.0;178.75644347017857 172.0" dur="16s" begin="ru-play.begin+0s" fill="freeze"/><circle r="4" fill="#dc2626"/></g></g>
<g class="part" data-part="plum" data-name="Prediction: plum-pudding model" data-info="Positive charge spread through the atom: alpha particles should pass through with only tiny deflections." tabindex="0" role="button" aria-label="Prediction: plum-pudding model"><g><animate attributeName="opacity" keyTimes="0.0000;0.1875;0.2062;1.0000" values="0;0;1;1" dur="16s" begin="ru-play.begin+0s" fill="freeze"/><rect x="510" y="110" width="460" height="220" rx="16" fill="#f8fafc" stroke="#cbd5e1"/><text x="740" y="134" text-anchor="middle" font-size="14" font-weight="800" fill="#111827">Prediction: plum-pudding atoms</text><circle cx="640" cy="230" r="50" fill="#fecaca" opacity=".8"/><circle cx="670" cy="230" r="5" fill="#2563eb"/><circle cx="642" cy="260" r="5" fill="#2563eb"/><circle cx="610" cy="234" r="5" fill="#2563eb"/><circle cx="634" cy="201" r="5" fill="#2563eb"/><circle cx="760" cy="230" r="50" fill="#fecaca" opacity=".8"/><circle cx="790" cy="230" r="5" fill="#2563eb"/><circle cx="762" cy="260" r="5" fill="#2563eb"/><circle cx="730" cy="234" r="5" fill="#2563eb"/><circle cx="754" cy="201" r="5" fill="#2563eb"/><circle cx="880" cy="230" r="50" fill="#fecaca" opacity=".8"/><circle cx="910" cy="230" r="5" fill="#2563eb"/><circle cx="882" cy="260" r="5" fill="#2563eb"/><circle cx="850" cy="234" r="5" fill="#2563eb"/><circle cx="874" cy="201" r="5" fill="#2563eb"/><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.1875;0.2000;0.3250;0.3375;1.0000" values="0;0;1;1;0;0" dur="16s" begin="ru-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.1875;0.3125;1.0000" values="520 180;520 180;960 178;960 178" dur="16s" begin="ru-play.begin+0s" fill="freeze"/><circle r="5" fill="#dc2626"/></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.2062;0.2188;0.3438;0.3563;1.0000" values="0;0;1;1;0;0" dur="16s" begin="ru-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="tran