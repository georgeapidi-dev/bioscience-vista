<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 700" class="vd-svg" role="img" aria-labelledby="ru-title ru-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="ru-play" data-vd-play-label="Play: fire alpha particles" data-vd-steps="[[0, &quot;The gold foil experiment (Geiger and Marsden, explained by Rutherford, 1911).&quot;], [1, &quot;Alpha particles are fired at thin gold foil.&quot;], [3, &quot;Plum-pudding prediction: they all pass through, barely deflected.&quot;], [7, &quot;What happened: most went straight through...&quot;], [9.5, &quot;...a few were deflected strongly, and about 1 in 8000 bounced back.&quot;], [12.5, &quot;Conclusion: a tiny, dense, positive nucleus; the atom is mostly empty space.&quot;]]" data-vd-dur="16">
<title id="ru-title">Rutherford&#x27;s gold foil experiment</title><desc id="ru-desc">Alpha particles fired at gold foil: the plum-pudding model predicts only small deflections; the observed large deflections and rebounds show a small, dense, positive nucleus.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1220" height="700" fill="#ffffff"/>
<g aria-hidden="true"><animate id="ru-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<text class="head" x="30" y="34">Rutherford's gold foil experiment</text><text class="note" x="30" y="56">Atoms hugely enlarged on the right; real nucleus about 1/100 000 of the atom's width.</text>
<g class="part" data-part="src" data-name="Alpha source" data-info="Radioactive source in a lead block giving a narrow beam of alpha particles (positive helium nuclei)." tabindex="0" role="button" aria-label="Alpha source"><rect x="40" y="200" width="90" height="80" rx="6" fill="#475569"/><rect x="130" y="232" width="40" height="16" fill="#475569"/><text x="85" y="300" text-anchor="middle" font-size="12" font-weight="800" fill="#334155">alpha source</text><text x="85" y="316" text-anchor="middle" font-size="11" font-weight="600" fill="#334155">in lead block</text></g>
<g class="part" data-part="foil" data-name="Thin gold foil" data-info="Only a few hundred atoms thick." tabindex="0" role="button" aria-label="Thin gold foil"><rect x="296" y="150" width="8" height="180" fill="#f59e0b" stroke="#92400e"/><text x="300" y="140" text-anchor="middle" font-size="12" font-weight="800" fill="#92400e">gold foil</text></g>
<g class="part" data-part="det" data-name="Detector" data-info="A zinc sulfide screen that flashes where an alpha particle hits, viewed through a microscope that could be moved round the foil." tabindex="0" role="button" aria-label="Detector"><path d="M 300 240 m -140 0 a 140 140 0 1 1 280 0 a 140 140 0 1 1 -280 0" fill="none" stroke="#22c55e" stroke-width="6" stroke-dasharray="12 8" opacity=".6"/><text x="300" y="400" text-anchor="middle" font-size="12" font-weight="800" fill="#15803d">zinc sulfide screen (all around)</text></g>
