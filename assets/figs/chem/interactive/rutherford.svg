<g class="part" data-part="nuc" data-name="Result: nuclear model" data-info="Most passed straight through, a few were deflected through large angles and about 1 in 8000 bounced back: a tiny, dense, positive nucleus with the atom mostly empty space." tabindex="0" role="button" aria-label="Result: nuclear model"><g><animate attributeName="opacity" keyTimes="0.0000;0.4375;0.4562;1.0000" values="0;0;1;1" dur="16s" begin="ru-play.begin+0s" fill="freeze"/><rect x="510" y="390" width="460" height="220" rx="16" fill="#f8fafc" stroke="#cbd5e1"/><text x="740" y="414" text-anchor="middle" font-size="14" font-weight="800" fill="#111827">Result: nuclear atoms</text><circle cx="640" cy="510" r="50" fill="none" stroke="#cbd5e1" stroke-dasharray="4 4"/><circle cx="640" cy="510" r="5" fill="#ef4444"/><circle cx="675" cy="529" r="3.5" fill="#2563eb"/><circle cx="623" cy="546" r="3.5" fill="#2563eb"/><circle cx="603" cy="496" r="3.5" fill="#2563eb"/><circle cx="651" cy="472" r="3.5" fill="#2563eb"/><circle cx="760" cy="510" r="50" fill="none" stroke="#cbd5e1" stroke-dasharray="4 4"/><circle cx="760" cy="510" r="5" fill="#ef4444"/><circle cx="795" cy="529" r="3.5" fill="#2563eb"/><circle cx="743" cy="546" r="3.5" fill="#2563eb"/><circle cx="723" cy="496" r="3.5" fill="#2563eb"/><circle cx="771" cy="472" r="3.5" fill="#2563eb"/><circle cx="880" cy="510" r="50" fill="none" stroke="#cbd5e1" stroke-dasharray="4 4"/><circle cx="880" cy="510" r="5" fill="#ef4444"/><circle cx="915" cy="529" r="3.5" fill="#2563eb"/><circle cx="863" cy="546" r="3.5" fill="#2563eb"/><circle cx="843" cy="496" r="3.5" fill="#2563eb"/><circle cx="891" cy="472" r="3.5" fill="#2563eb"/><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.4375;0.4500;0.5813;0.5938;1.0000" values="0;0;1;1;0;0" dur="16s" begin="ru-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.4375;0.5625;1.0000" values="520 460;520 460;960 460;960 460" dur="16s" begin="ru-p