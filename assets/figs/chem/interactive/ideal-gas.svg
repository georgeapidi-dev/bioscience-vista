<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 540" class="vd-svg" role="img" aria-labelledby="ig-title ig-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="ig-play" data-vd-play-label="Play: heat the gas" data-vd-steps="[[0, &quot;Gases: pressure and the ideal gas equation.&quot;], [1, &quot;Pressure comes from molecules hitting the walls.&quot;], [5, &quot;Ideal: negligible volume, no attractions. Real gases deviate at high p and low T.&quot;], [9.5, &quot;pV = nRT with SI units.&quot;]]" data-vd-dur="14">
<title id="ig-title">Ideal and real gases</title><desc id="ig-desc">Gas molecules colliding with the walls of a container produce pressure; ideal gas assumptions and why real gases deviate at high pressure and low temperature; the ideal gas equation pV equals nRT with SI units and a worked example.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="540" fill="#ffffff"/>
<g aria-hidden="true"><animate id="ig-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<text class="head" x="30" y="34">The gaseous state: pV = nRT</text><text class="note" x="30" y="56">Convert: cm³ × 10⁻⁶ = m³; °C + 273 = K; kPa × 1000 = Pa.</text>
<g class="part" data-part="kin" data-name="Gas pressure" data-info="Molecules collide with the container walls; more collisions per second or harder collisions → higher pressure." tabindex="0" role="button" aria-label="Gas pressure"><rect x="60" y="100" width="360" height="300" fill="#f8fafc" stroke="#334155" stroke-width="4"/><circle r="8" fill="#60a5fa" stroke="#1e3a8a"><animate attributeName="cx" values="161;197;161" dur="1.8s" repeatCount="indefinite"/><animate attributeName="cy" values="261;284;261" dur="1.3s" repeatCount="indefinite"/></circle><circle r="8" fill="#60a5fa" stroke="#1e3a8a"><animate attributeName="cx" values="94;161;94" dur="1.4s" repeatCount="indefinite"/><animate attributeName="cy" values="331;384;331" dur="1.7s" repeatCount="indefinite"/></circle><circle r="8" fill="#60a5fa" stroke="#1e3a8a"><animate attributeName="cx" values="341;286;341" dur="1.4s" repeatCount="indefinite"/><animate attributeName="cy" values="244;286;244" dur="2.1s" repeatCount="indefinite"/></circle><circle r="8" fill="#60a5fa" stroke="#1e3a8a"><animate attributeName="cx" values="247;297;247" dur="1.3s" repeatCount="indefinite"/><animate attributeName="cy" values="308;320;308" dur="1.8s" repeatCount="indefinite"/></circle><circle r="8" fill="#60a5fa" stroke="#1e3a8a"><animate attributeName="cx" values="180;361;180" dur="1.7s" repeatCount="indefinite"/><animate attributeName="cy" values="137;309;137" dur="2.1s" repeatCount="indefinite"/></circle><circle r="8" fill="#60a5fa" stroke="#1e3a8a"><animate attributeName="cx" values="304;205;304" dur="2.0s" repeatCount="indefinite"/><animate attributeName="cy" values="351;235;351" dur="2.1s" repeatCount="indefinite"/></circle><circle r="8" fill="#60a5fa" stroke="#1e3a8a"><animate attributeName="cx" values="354;120;354" dur="1.4s" repeatCount="indefinite"/><animate attributeName="cy" values="153;376;153" dur="1.6s" repeatCount="indefinite"/></circle><circle r="8" fill="#60a5fa" stroke="#1e3a8a"><animate attributeName="cx" values="278;242;278" dur="1.6s" repeatCount="indefinite"/><animate attributeName="cy" values="202;210;202" dur="1.8s" repeatCount="indefinite"/></circle><circle r="8" fill="#60a5fa" stroke="#1e3a8a"><animate attributeName="cx" values="265;300;265" dur="2.1s" repeatCount="indefinite"/><animate attributeName="cy" values="347;346;347" dur="2.2s" repeatCount="indefinite"/></circle><circle r="8" fill="#60a5fa" stroke="#1e3a8a"><animate attributeName="cx" values="291;359;291" dur="2.2s" repeatCount="indefinite"/><animate attributeName="cy" values="169;359;169" dur="1.8s" repeatCount="indefinite"/></circle><circle r="8" fill="#60a5fa" stroke="#1e3a8a"><animate attributeName="cx" values="304;349;304" dur="1.8s" repeatCount="indefinite"/><animate attributeName="cy" values="181;192;181" dur="1.3s" repeatCount="indefinite"/></circle><circle r="8" fill="#60a5fa" stroke="#1e3a8a"><animate attributeName="cx" values="346;104;346" dur="2.0s" repeatCount="indefinite"/><animate attributeName="cy" values="368;226;368" dur="1.4s" repeatCount="indefinite"/></circle><circle r="8" fill="#60a5fa" stroke="#1e3a8a"><animate attributeName="cx" values="178;363;178" dur="1.2s" repeatCount="indefinite"/><animate attributeName="cy" values="315;281;315" dur="1.2s" repeatCount="indefinite"/></circle><circle r="8" fill="#60a5fa" stroke="#1e3a8a"><animate attributeName="cx" values="306;366;306" dur="2.2s" repeatCount="indefinite"/><animate attributeName="cy" values="209;251;209" dur="2.2s" repeatCount="indefinite"/></circle><text x="240" y="430" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">collisions with walls → pressure</text></g>
<g class="part" data-part="ideal" data-name="Ideal gas assumptions" data-info="Molecules have negligible volume; no intermolecular forces; collisions are elastic. Real gases are most ideal at high temperature and low pressure." tabindex="0" role="button" aria-label="Ideal gas assumptions"><g><animate attributeName="opacity" keyTimes="0.0000;0.3571;0.3786;1.0000" values="0;0;1;1" dur="14s" begin="ig-play.begin+0s" fill="freeze"/><rect x="470" y="90" width="580" height="200" rx="16" fill="#f0f9ff" stroke="#7dd3fc"/><text x="760" y="118" text-anchor="middle" font-size="15" font-weight="800" fill="#0369a1">ideal gas assumptions</text><text x="760" y="150" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">molecules have negligible volume</text><text x="760" y="174" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">no intermolecular forces · elastic collisions</text><text x="760" y="214" text-anchor="middle" font-size="13" font-weight="800" fill="#b91c1c">real gases deviate most at HIGH p and LOW T</text><text x="760" y="238" text-anchor="middle" font-size="12" font-weight="700" fill="#475569">(molecules close together: volume and attractions matter)</text></g></g>
<g class="part" data-part="eq" data-name="pV = nRT" data-info="p in Pa, V in m³, T in K, R = 8.31 J K⁻¹ mol⁻¹. Example: 0.500 mol at 298 K in 0.0100 m³: p = 0.500 × 8.31 × 298 ÷ 0.0100 = 1.24 × 10⁵ Pa." tabindex="0" role="button" aria-label="pV = nRT"><g><animate attributeName="opacity" keyTimes="0.0000;0.6786;0.7000;1.0000" values="0;0;1;1" dur="14s" begin="ig-play.begin+0s" fill="freeze"/><rect x="470" y="310" width="580" height="200" rx="16" fill="#fef9c3" stroke="#eab308"/><text x="760" y="352" text-anchor="middle" font-size="30" font-weight="800" fill="#713f12">pV = nRT</text><text x="760" y="386" text-anchor="middle" font-size="12" font-weight="700" fill="#713f12">Pa · m³ · mol · 8.31 J K⁻¹ mol⁻¹ · K</text><text x="760" y="426" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">0.500 mol, 298 K, 0.0100 m³:</text><text x="760" y="452" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">p = 0.500 × 8.31 × 298 ÷ 0.0100</text><text x="760" y="480" text-anchor="middle" font-size="15" font-weight="800" fill="#b45309">= 1.24 × 10⁵ Pa</text></g></g>
</svg>