<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" class="vd-svg" role="img" aria-labelledby="eq-title eq-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="eq-play" data-vd-play-label="Play: reach equilibrium" data-vd-steps="[[0, &quot;Dynamic equilibrium.&quot;], [1, &quot;Reactant concentration falls, product rises, then both level off.&quot;], [5, &quot;Forward and backward rates become equal: dynamic equilibrium.&quot;], [9, &quot;Add more reactant: the position shifts right to oppose the change.&quot;], [13, &quot;Kc expression; only temperature changes Kc.&quot;]]" data-vd-dur="16">
<title id="eq-title">Dynamic equilibrium and Le Chatelier</title><desc id="eq-desc">Graphs of concentration and rate against time: reactant falls and product rises until they level off as forward and backward rates become equal; adding reactant shifts the equilibrium to the right; the Kc expression.</desc>
