ont-weight="800" fill="#b45309">backward rate</text><text x="342.0" y="480" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">equal → dynamic equilibrium</text></g></g>
<g class="part" data-part="lc" data-name="Le Chatelier&#x27;s principle" data-info="If a condition changes, the position of equilibrium shifts to oppose the change: add reactant → shifts right; increase pressure → shifts to fewer gas moles; increase temperature → shifts in the endothermic direction." tabindex="0" role="button" aria-label="Le Chatelier&#x27;s principle"><g><animate attributeName="opacity" keyTimes="0.0000;0.5625;0.5813;1.0000" values="0;0;1;1" dur="16s" begin="eq-play.begin+0s" fill="freeze"/><rect x="700" y="90" width="370" height="250" rx="16" fill="#f0fdf4" stroke="#86efac"/><text x="885" y="118" text-anchor="middle" font-size="14" font-weight="800" fill="#15803d">Le Chatelier: oppose the change</text><text x="720" y="156" text-anchor="start" font-size="12" font-weight="700" fill="#111827">add reactant → shifts right</text><text x="720" y="190" text-anchor="start" font-size="12" font-weight="700" fill="#111827">remove product → shifts right</text><text x="720" y="224" text-anchor="start" font-size="12" font-weight="700" fill="#111827">raise pressure → fewer gas moles</text><text x="720" y="258" text-anchor="start" font-size="12" font-weight="700" fill="#111827">raise temperature → endothermic way</text><text x="720" y="292" text-anchor="start" font-size="12" font-weight="700" fill="#111827">catalyst → no shift, faster to reach</text></g></g>
<g class="part" data-part="kc" data-name="Kc" data-info="For aA + bB ⇌ cC + dD, Kc = [C]ᶜ[D]ᵈ ÷ [A]ᵃ[B]ᵇ. Only temperature changes the value of Kc; a catalyst does not change the position." tabindex="0" role="button" aria-label="Kc"><g><animate attributeName="opacity" keyTimes="0.0000;0.8125;0.8313;1.0000" values="0;0;1;1" dur="16s" begin="eq-play.begin+0s" fill="freeze"/><rect x="700" y="360" width="370" height="180" rx="16" fill="#fef9c3" stroke="#eab308"/><text x="885" y="392" text-anchor="middle" font-size="14" font-weight="800" fill="#111827">aA + bB ⇌ cC + dD</text><text x="885" y="434" text-anchor="middle" font-size="18" font-weight="800" fill="#713f12">Kc = [C]ᶜ[D]ᵈ ÷ [A]ᵃ[B]ᵇ</text><text x="885" y="474" text-anchor="middle" font-size="12" font-weight="700" fill="#475569">Kp: use partial pressures</text><text x="885" y="504" text-anchor="middle" font-size="13" font-weight="800" fill="#b91c1c">only temperature changes K</text></g></g>
</svg>