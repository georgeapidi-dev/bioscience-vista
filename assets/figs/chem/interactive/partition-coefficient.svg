<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" class="vd-svg" role="img" aria-labelledby="pt2-title pt2-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="pt2-play" data-vd-play-label="Play: shake the funnel" data-vd-steps="[[0, &quot;Partition between two solvents.&quot;], [1, &quot;Shake: the solute distributes between the layers.&quot;], [6, &quot;Kpc = [organic] \u00f7 [aqueous].&quot;], [10, &quot;Calculate the mass extracted.&quot;]]" data-vd-dur="14">
<title id="pt2-title">Partition coefficient</title><desc id="pt2-desc">A separating funnel with an upper organic layer and lower aqueous layer; solute particles distribute between them until equilibrium; the partition coefficient is the ratio of concentrations; a worked example calculating mass extracted.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="560" fill="#ffffff"/>
<g aria-hidden="true"><animate id="pt2-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<text class="head" x="30" y="34">Partition coefficient, Kpc</text><text class="note" x="30" y="56">Hexane is less dense than water: it forms the upper layer.</text>
<g class="part" data-part="funnel" data-name="Two immiscible solvents" data-info="A solute shaken with water and an immiscible organic solvent (e.g. hexane) distributes between the layers until equilibrium is reached." tabindex="0" role="button" aria-label="Two immiscible solvents"><path d="M 200 100 L 160 120 Q 90 220 130 340 L 230 440 L 230 500 L 250 500 L 250 440 L 350 340 Q 390 220 320 120 L 280 100 Z" fill="#f8fafc" stroke="#334155" stroke-width="3"/><path d="M 112 220 Q 120 190 140 160 L 340 160 Q 360 190 368 220 Z" fill="#fde68a" opacity=".7"/><path d="M 112 222 L 368 222 Q 372 300 350 340 L 230 440 L 250 440 L 130 340 Q 108 300 112 222 Z" fill="#bfdbfe" opacity=".8"/><text x="420" y="190" text-anchor="start" font-size="13" font-weight="800" fill="#a16207">hexane (organic)</text><text x="420" y="300" text-anchor="start" font-size="13" font-weight="800" fill="#1d4ed8">water (aqueous)</text><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.0000;0.0143;1.0000" values="0;0;1;1" dur="14s" begin="pt2-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.0714;0.3571;1.0000" values="198.0743403347026 283.53833802367615;198.0743403347026 283.53833802367615;216.59192997865426 194.1568015438478;216.59192997865426 194.1568015438478" dur="14s" begin="pt2-play.begin+0s" fill="freeze"/><circle r="8" fill="#7c3aed"/></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.0000;0.0143;1.0000" values="0;0;1;1" dur="14s" begin="pt2-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.0714;0.3571;1.0000" values="260.11524865728865 245.24230873918503;260.11524865728865 245.24230873918503;152.37023847987734 203.4987632838584;152.37023847987734 203.4987632838584" dur="14s" begin="pt2-play.begin+0s" fill="freeze"/><circle r="8" fill="#7c3aed"/></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.0000;0.0143;1.0000" values="0;0;1;1" dur="14s" begin="pt2-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.0714;0.3571;1.0000" values="201.49664229248123 258.7464768837357;201.49664229248123 258.7464768837357;329.2160703918833 188.8105403008979;329.2160703918833 188.8105403008979" dur="14s" begin="pt2-play.begin+0s" fill="freeze"/><circle r="8" fill="#7c3aed"/></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.0000;0.0143;1.0000" values="0;0;1;1" dur="14s" begin="pt2-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.0714;0.3571;1.0000" values="293.8338322039022 278.1082566959468;293.8338322039022 278.1082566959468;265.03226529794915 176.02465696094094;265.03226529794915 176.02465696094094" dur="14s" begin="pt2-play.begin+0s" fill="freeze"/><circle r="8" fill="#7c3aed"/></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.0000;0.0143;1.0000" values="0;0;1;1" dur="14s" begin="pt2-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.0714;0.3571;1.0000" values="261.5777053256302 309.4436245714637;261.5777053256302 309.4436245714637;244.17261786899422 199.6500742480596;244.17261786899422 199.6500742480596" dur="14s" begin="pt2-play.begin+0s" fill="freeze"/><circle r="8" fill="#7c3aed"/></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.0000;0.0143;1.0000" values="0;0;1;1" dur="14s" begin="pt2-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.0714;0.3571;1.0000" values="267.4258360591348 245.1225150581598;267.4258360591348 245.1225150581598;286.48144433162713 193.64398331725272;286.48144433162713 193.64398331725272" dur="14s" begin="pt2-play.begin+0s" fill="freeze"/><circle r="8" fill="#7c3aed"/></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.0000;0.0143;1.0000" values="0;0;1;1" dur="14s" begin="pt2-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.0714;0.3571;1.0000" values="208.202825522514 242.48094011758;208.202825522514 242.48094011758;305.7949026562102 188.90996354661868;305.7949026562102 188.90996354661868" dur="14s" begin="pt2-play.begin+0s" fill="freeze"/><circle r="8" fill="#7c3aed"/></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.0000;0.0143;1.0000" values="0;0;1;1" dur="14s" begin="pt2-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.0714;0.3571;1.0000" values="275.0118278505285 310.3050240204385;275.0118278505285 310.3050240204385;278.54330705001644 206.843946703355;278.54330705001644 206.843946703355" dur="14s" begin="pt2-play.begin+0s" fill="freeze"/><circle r="8" fill="#7c3aed"/></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.0000;0.0143;1.0000" values="0;0;1;1" dur="14s" begin="pt2-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.0714;0.3571;1.0000" values="223.19414464011902 304.07270167881825;223.19414464011902 304.07270167881825;223.19414464011902 304.07270167881825;223.19414464011902 304.07270167881825" dur="14s" begin="pt2-play.begin+0s" fill="freeze"/><circle r="8" fill="#7c3aed"/></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.0000;0.0143;1.0000" values="0;0;1;1" dur="14s" begin="pt2-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.0714;0.3571;1.0000" values="231.1393689681217 314.84693773636167;231.1393689681217 314.84693773636167;231.1393689681217 314.84693773636167;231.1393689681217 314.84693773636167" dur="14s" begin="pt2-play.begin+0s" fill="freeze"/><circle r="8" fill="#7c3aed"/></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.0000;0.0143;1.0000" values="0;0;1;1" dur="14s" begin="pt2-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.0714;0.3571;1.0000" values="300.61866565408667 247.79634477847017;300.61866565408667 247.79634477847017;300.61866565408667 247.79634477847017;300.61866565408667 247.79634477847017" dur="14s" begin="pt2-play.begin+0s" fill="freeze"/><circle r="8" fill="#7c3aed"/></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.0000;0.0143;1.0000" values="0;0;1;1" dur="14s" begin="pt2-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.0714;0.3571;1.0000" values="181.755017632107 257.358955298651;181.755017632107 257.358955298651;181.755017632107 257.358955298651;181.755017632107 257.358955298651" dur="14s" begin="pt2-play.begin+0s" fill="freeze"/><circle r="8" fill="#7c3aed"/></g></g><g><animate attributeName="opacity" keyTimes="0.0000;0.3571;0.3786;1.0000" values="0;0;1;1" dur="14s" begin="pt2-play.begin+0s" fill="freeze"/><text x="240" y="530" text-anchor="middle" font-size="12" font-weight="800" fill="#6d28d9">8 particles organic : 4 aqueous (equal volumes) → Kpc = 2</text></g></g>
<g class="part" data-part="kpc" data-name="Kpc" data-info="Kpc = [X in organic] / [X in aqueous] at equilibrium, at a given temperature. Ammonia between water and trichloromethane: Kpc is small (NH₃ is polar, H-bonds with water); iodine between hexane and water: large." tabindex="0" role="button" aria-label="Kpc"><g><animate attributeName="opacity" keyTimes="0.0000;0.4286;0.4500;1.0000" values="0;0;1;1" dur="14s" begin="pt2-play.begin+0s" fill="freeze"/><rect x="560.0" y="115.0" width="480" height="70" rx="12" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/><text x="800" y="148" text-anchor="middle" font-size="20" font-weight="800" fill="#111827">Kpc = [X]organic / [X]aqueous</text><text x="800" y="166" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">at equilibrium, fixed temperature · no units</text></g></g>
<g class="part" data-part="calc" data-name="Calculation" data-info="0.500 g of X in 50 cm³ water, shaken with 25 cm³ hexane, Kpc (hexane/water) = 4.0: let m g move into hexane; (m/25)/((0.500 − m)/50) = 4.0 → m = 0.333 g extracted." tabindex="0" role="button" aria-label="Calculation"><g><animate attributeName="opacity" keyTimes="0.0000;0.7143;0.7357;1.0000" values="0;0;1;1" dur="14s" begin="pt2-play.begin+0s" fill="freeze"/><rect x="560" y="230" width="480" height="270" rx="16" fill="#fef9c3" stroke="#eab308"/><text x="800" y="260" text-anchor="middle" font-size="13" font-weight="800" fill="#713f12">0.500 g X in 50 cm³ water + 25 cm³ hexane</text><text x="800" y="288" text-anchor="middle" font-size="13" font-weight="800" fill="#713f12">Kpc (hexane/water) = 4.0</text><text x="800" y="330" text-anchor="middle" font-size="14" font-weight="800" fill="#111827">(m ÷ 25) ÷ ((0.500 − m) ÷ 50) = 4.0</text><text x="800" y="366" text-anchor="middle" font-size="14" font-weight="800" fill="#111827">2m = 4.0 (0.500 − m)</text><text x="800" y="402" text-anchor="middle" font-size="16" font-weight="800" fill="#15803d">m = 0.333 g extracted (67%)</text><text x="800" y="450" text-anchor="middle" font-size="12" font-weight="700" fill="#475569">two smaller extractions remove more</text><text x="800" y="470" text-anchor="middle" font-size="12" font-weight="700" fill="#475569">than one large one</text></g></g>
</svg>