<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 720" class="vd-svg" role="img" aria-labelledby="bh-title bh-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="bh-play" data-vd-play-label="Play: around the cycle" data-vd-steps="[[0, &quot;A Born\u2013Haber cycle for sodium chloride.&quot;], [1, &quot;Start with sodium and chlorine in their standard states.&quot;], [2, &quot;Atomise sodium: +107.&quot;], [3.5, &quot;Atomise chlorine: +122.&quot;], [5, &quot;Ionise sodium: +496.&quot;], [6.5, &quot;Chlorine gains an electron: \u2212349.&quot;], [8, &quot;Gaseous ions form the lattice: \u2212787 (lattice enthalpy +787).&quot;], [9.5, &quot;Directly: enthalpy of formation \u2212411.&quot;], [11.5, &quot;Hess&#x27;s law: the totals agree.&quot;]]" data-vd-dur="16">
<title id="bh-title">Born–Haber cycle for NaCl</title><desc id="bh-desc">A Born–Haber cycle for sodium chloride drawn to scale: atomisation of sodium and chlorine, ionisation of sodium, electron affinity of chlorine, lattice enthalpy and enthalpy of formation, with the Hess&#x27;s law calculation.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1220" height="720" fill="#ffffff"/>
<g aria-hidden="true"><animate id="bh-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<defs><marker id="bh-dc2626" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="6.3" refY="7.0" orient="auto"><path d="M0,0 L14,7.0 L0,14 z" fill="#dc2626"/></marker><marker id="bh-2563eb" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="6.3" refY="7.0" orient="auto"><path d="M0,0 L14,7.0 L0,14 z" fill="#2563eb"/></marker><marker id="bh-7c3aed" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="6.3" refY="7.0" orient="auto"><path d="M0,0 L14,7.0 L0,14 z" fill="#7c3aed"/></marker></defs>
<text class="head" x="30" y="34">Born–Haber cycle: sodium chloride</text><text class="note" x="30" y="56">Drawn to scale; values in kJ mol⁻¹. Red arrows endothermic, blue exothermic.</text>
<g><animate attributeName="opacity" keyTimes="0.0000;0.0625;0.0813;1.0000" values="0;0;1;1" dur="16s" begin="bh-play.begin+0s" fill="freeze"/><line x1="120" y1="480" x2="520" y2="480" stroke="#111827" stroke-width="3"/><text x="514" y="472.0" text-anchor="end" font-size="13" font-weight="800" fill="#111827">Na(s) + ½Cl₂(g)</text></g>
<g><animate attributeName="opacity" keyTimes="0.0000;0.1250;0.1437;1.0000" values="0;0;1;1" dur="16s" begin="bh-play.begin+0s" fill="freeze"/><line x1="120" y1="426" x2="520" y2="426" stroke="#111827" stroke-width="3"/><text x="514" y="418.5" text-anchor="end" font-size="13" font-weight="800" fill="#111827">Na(g) + ½Cl₂(g)</text></g>
<g><animate attributeName="opacity" keyTimes="0.0000;0.2188;0.2375;1.0000" values="0;0;1;1" dur="16s" begin="bh-play.begin+0s" fill="freeze"/><line x1="120" y1="366" x2="520" y2="366" stroke="#111827" stroke-width="3"/><text x="514" y="357.5" text-anchor="end" font-size="13" font-weight="800" fill="#111827">Na(g) + Cl(g)</text></g>
<g><animate attributeName="opacity" keyTimes="0.0000;0.3125;0.3312;1.0000" values="0;0;1;1" dur="16s" begin="bh-play.begin+0s" fill="freeze"/><line x1="120" y1="118" x2="700" y2="118" stroke="#111827" stroke-width="3"/><text x="126" y="109.5" text-anchor="start" font-size="13" font-weight="800" fill="#111827">Na⁺(g) + e⁻ + Cl(g)</text></g>
<g><animate attributeName="opacity" keyTimes="0.0000;0.4062;0.4250;1.0000" values="0;0;1;1" dur="16s" begin="bh-play.begin+0s" fill="freeze"/><line x1="560" y1="292" x2="900" y2="292" stroke="#111827" stroke-width="3"/><text x="566" y="284.0" text-anchor="start" font-size="13" font-weight="800" fill="#111827">Na⁺(g) + Cl⁻(g)</text></g>
<g><animate attributeName="opacity" keyTimes="0.0000;0.5938;0.6125;1.0000" values="0;0;1;1" dur="16s" begin="bh-play.begin+0s" fill="freeze"/><line x1="120" y1="686" x2="900" y2="686" stroke="#111827" stroke-width="3"/><text x="700" y="677.5" text-anchor="end" font-size="13" font-weight="800" fill="#111827">NaCl(s)</text></g>
<g class="part" data-part="atNa" data-name="Atomisation of sodium" data-info="Na(s) → Na(g), +107 kJ mol⁻¹." tabindex="0" role="button" aria-label="Atomisation of sodium"><g><animate attributeName="opacity" keyTimes="0.0000;0.1250;0.1437;1.0000" values="0;0;1;1" dur="16s" begin="bh-play.begin+0s" fill="freeze"/><line x1="180" y1="480" x2="180" y2="434" stroke="#dc2626" stroke-width="4" marker-end="url(#bh-dc2626)"/><text x="190" y="449.25" text-anchor="start" font-size="12" font-weight="800" fill="#dc2626">atomisation Na</text><text x="190" y="467.25" text-anchor="start" font-size="13" font-weight="800" fill="#dc2626">+107</text></g></g>
<g class="part" data-part="atCl" data-name="Atomisation of chlorine" data-info="½Cl₂(g) → Cl(g), +122 kJ mol⁻¹ (half the bond enthalpy)." tabindex="0" role="button" aria-label="Atomisation of chlorine"><g><animate attributeName="opacity" keyTimes="0.0000;0.2188;0.2375;1.0000" values="0;0;1;1" dur="16s" begin="bh-play.begin+0s" fill="freeze"/><line x1="300" y1="426" x2="300" y2="374" stroke="#dc2626" stroke-width="4" marker-end="url(#bh-dc2626)"/><text x="310" y="392.0" text-anchor="start" font-size="12" font-weight="800" fill="#dc2626">atomisation Cl</text><text x="310" y="410.0" text-anchor="start" font-size="13" font-weight="800" fill="#dc2626">+122</text></g></g>
<g class="part" data-part="ie" data-name="First ionisation energy of Na" data-info="Na(g) → Na⁺(g) + e⁻, +496 kJ mol⁻¹." tabindex="0" role="button" aria-label="First ionisation energy of Na"><g><animate attributeName="opacity" keyTimes="0.0000;0.3125;0.3312;1.0000" values="0;0;1;1" dur="16s" begin="bh-play.begin+0s" fill="freeze"/><line x1="420" y1="366" x2="420" y2="126" stroke="#dc2626" stroke-width="4" marker-end="url(#bh-dc2626)"/><text x="430" y="237.5" text-anchor="start" font-size="12" font-weight="800" fill="#dc2626">IE₁ of Na</text><text x="430" y="255.5" text-anchor="start" font-size="13" font-weight="800" fill="#dc2626">+496</text></g></g>
<g class="part" data-part="ea" data-name="Electron affinity of Cl" data-info="Cl(g) + e⁻ → Cl⁻(g), −349 kJ mol⁻¹ (exothermic)." tabindex="0" role="button" aria-label="Electron affinity of Cl"><g><animate attributeName="opacity" keyTimes="0.0000;0.4062;0.4250;1.0000" values="0;0;1;1" dur="16s" begin="bh-play.begin+0s" fill="freeze"/><line x1="620" y1="118" x2="620" y2="284" stroke="#2563eb" stroke-width="4" marker-end="url(#bh-2563eb)"/><text x="630" y="200.75" text-anchor="start" font-size="12" font-weight="800" fill="#2563eb">electron affinity Cl</text><text x="630" y="218.75" text-anchor="start" font-size="13" font-weight="800" fill="#2563eb">−349</text></g></g>
<g class="part" data-part="lat" data-name="Lattice enthalpy" data-info="NaCl(s) → Na⁺(g) + Cl⁻(g), +787 kJ mol⁻¹. Forming the lattice from gaseous ions releases 787 kJ mol⁻¹." tabindex="0" role="button" aria-label="Lattice enthalpy"><g><animate attributeName="opacity" keyTimes="0.0000;0.5000;0.5188;1.0000" values="0;0;1;1" dur="16s" begin="bh-play.begin+0s" fill="freeze"/><line x1="820" y1="686" x2="820" y2="300" stroke="#7c3aed" stroke-width="4" marker-end="url(#bh-7c3aed)"/><line x1="860" y1="292" x2="860" y2="678" stroke="#2563eb" stroke-width="4" stroke-dasharray="8 5" marker-end="url(#bh-2563eb)"/><text x="806" y="470.0" text-anchor="end" font-size="12" font-weight="800" fill="#6d28d9">lattice</text><text x="806" y="488.0" text-anchor="end" font-size="13" font-weight="800" fill="#6d28d9">enthalpy +787</text><text x="806" y="508.0" text-anchor="end" font-size="11" font-weight="700" fill="#1d4ed8">(forming the lattice</text><text x="806" y="524.0" text-anchor="end" font-size="11" font-weight="700" fill="#1d4ed8">from ions: −787)</text></g></g>
<g class="part" data-part="f" data-name="Enthalpy of formation" data-info="Na(s) + ½Cl₂(g) → NaCl(s), −411 kJ mol⁻¹." tabindex="0" role="button" aria-label="Enthalpy of formation"><g><animate attributeName="opacity" keyTimes="0.0000;0.5938;0.6125;1.0000" values="0;0;1;1" dur="16s" begin="bh-play.begin+0s" fill="freeze"/><line x1="140" y1="480" x2="140" y2="678" stroke="#2563eb" stroke-width="5" marker-end="url(#bh-2563eb)"/><text x="150" y="580.0" text-anchor="start" font-size="13" font-weight="800" fill="#1d4ed8">ΔH_f</text><text x="150" y="598.0" text-anchor="start" font-size="14" font-weight="800" fill="#1d4ed8">−411</text></g></g>
<g class="part" data-part="start" data-name="Elements" data-info="Na(s) + ½Cl₂(g): the elements in their standard states (energy zero)." tabindex="0" role="button" aria-label="Elements"><g><animate attributeName="opacity" keyTimes="0.0000;0.0625;0.0813;1.0000" values="0;0;1;1" dur="16s" begin="bh-play.begin+0s" fill="freeze"/><line x1="100" y1="480" x2="1000" y2="480" stroke="#94a3b8" stroke-dasharray="4 4"/><text x="1000" y="474.0" text-anchor="end" font-size="12" font-weight="700" fill="#64748b">0</text></g></g>
<g class="part" data-part="hess" data-name="Hess&#x27;s law" data-info="Both routes from elements to NaCl(s) have the same total: −411 = 107 + 122 + 496 − 349 − 787." tabindex="0" role="button" aria-label="Hess&#x27;s law"><g><animate attributeName="opacity" keyTimes="0.0000;0.7188;0.7375;1.0000" values="0;0;1;1" dur="16s" begin="bh-play.begin+0s" fill="freeze"/><rect x="940" y="420" width="260" height="270" rx="16" fill="#fef9c3" stroke="#eab308"/><text x="1070" y="448" text-anchor="middle" font-size="14" font-weight="800" fill="#713f12">Hess's law check</text><text x="960" y="478" text-anchor="start" font-size="13" font-weight="700" fill="#111827">+107  atomise Na</text><text x="960" y="502" text-anchor="start" font-size="13" font-weight="700" fill="#111827">+122  atomise Cl</text><text x="960" y="526" text-anchor="start" font-size="13" font-weight="700" fill="#111827">+496  ionise Na</text><text x="960" y="550" text-anchor="start" font-size="13" font-weight="700" fill="#111827">−349  electron affinity</text><text x="960" y="574" text-anchor="start" font-size="13" font-weight="700" fill="#111827">−787  form lattice</text><line x1="960" y1="600" x2="1180" y2="600" stroke="#713f12" stroke-width="2"/><text x="960" y="624" text-anchor="start" font-size="14" font-weight="800" fill="#111827">−411  = ΔH_f(NaCl) ✓</text><text x="1070" y="664" text-anchor="middle" font-size="12" font-weight="800" fill="#6d28d9">lattice enthalpy = +787</text></g></g>
</svg>