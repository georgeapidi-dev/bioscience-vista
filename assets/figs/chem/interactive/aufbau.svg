<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 640" class="vd-svg" role="img" aria-labelledby="au-title au-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="au-play" data-vd-play-label="Play: fill nitrogen" data-vd-steps="[[0, &quot;The Aufbau principle: electrons fill the lowest-energy orbitals first.&quot;], [1, &quot;Follow the diagonals for the order of filling.&quot;], [4.5, &quot;Now fill nitrogen, 7 electrons: 1s holds two, with opposite spins.&quot;], [7, &quot;2s holds the next two.&quot;], [8.8, &quot;The three 2p electrons go into separate orbitals with parallel spins: Hund&#x27;s rule.&quot;], [12, &quot;Nitrogen: 1s\u00b2 2s\u00b2 2p\u00b3.&quot;]]" data-vd-dur="15">
<title id="au-title">Filling atomic orbitals</title><desc id="au-desc">The order of filling sub-levels shown by the diagonal rule, and an orbital box diagram for nitrogen filled electron by electron following the Pauli exclusion principle and Hund&#x27;s rule.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1220" height="640" fill="#ffffff"/>
<g aria-hidden="true"><animate id="au-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<text class="head" x="30" y="34">Filling orbitals: the Aufbau principle</text><text class="note" x="30" y="56">Order shown by the diagonal rule (Madelung or Klechkowski rule).</text>
<defs><marker id="au-dc2626" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="5.4" refY="6.0" orient="auto"><path d="M0,0 L12,6.0 L0,12 z" fill="#dc2626"/></marker></defs>
<g class="part" data-part="order" data-name="Order of filling" data-info="Follow the diagonal arrows: 1s 2s 2p 3s 3p 4s 3d 4p 5s 4d 5p 6s 4f 5d 6p … (4s fills before 3d because it is lower in energy)." tabindex="0" role="button" aria-label="Order of filling"><circle cx="80" cy="110" r="24" fill="#fff" stroke="#334155" stroke-width="2"/><text x="80" y="115" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">1s</text><circle cx="80" cy="172" r="24" fill="#fff" stroke="#334155" stroke-width="2"/><text x="80" y="177" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">2s</text><circle cx="150" cy="172" r="24" fill="#fff" stroke="#334155" stroke-width="2"/><text x="150" y="177" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">2p</text><circle cx="80" cy="234" r="24" fill="#fff" stroke="#334155" stroke-width="2"/><text x="80" y="239" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">3s</text><circle cx="150" cy="234" r="24" fill="#fff" stroke="#334155" stroke-width="2"/><text x="150" y="239" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">3p</text><circle cx="220" cy="234" r="24" fill="#fff" stroke="#334155" stroke-width="2"/><text x="220" y="239" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">3d</text><circle cx="80" cy="296" r="24" fill="#fff" stroke="#334155" stroke-width="2"/><text x="80" y="301" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">4s</text><circle cx="150" cy="296" r="24" fill="#fff" stroke="#334155" stroke-width="2"/><text x="150" y="301" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">4p</text><circle cx="220" cy="296" r="24" fill="#fff" stroke="#334155" stroke-width="2"/><text x="220" y="301" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">4d</text><circle cx="290" cy="296" r="24" fill="#fff" stroke="#334155" stroke-width="2"/><text x="290" y="301" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">4f</text><circle cx="80" cy="358" r="24" fill="#fff" stroke="#334155" stroke-width="2"/><text x="80" y="363" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">5s</text><circle cx="150" cy="358" r="24" fill="#fff" stroke="#334155" stroke-width="2"/><text x="150" y="363" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">5p</text><circle cx="220" cy="358" r="24" fill="#fff" stroke="#334155" stroke-width="2"/><text x="220" y="363" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">5d</text><circle cx="290" cy="358" r="24" fill="#fff" stroke="#334155" stroke-width="2"/><text x="290" y="363" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">5f</text><circle cx="80" cy="420" r="24" fill="#fff" stroke="#334155" stroke-width="2"/><text x="80" y="425" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">6s</text><circle cx="150" cy="420" r="24" fill="#fff" stroke="#334155" stroke-width="2"/><text x="150" y="425" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">6p</text><circle cx="220" cy="420" r="24" fill="#fff" stroke="#334155" stroke-width="2"/><text x="220" y="425" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">6d</text><circle cx="80" cy="482" r="24" fill="#fff" stroke="#334155" stroke-width="2"/><text x="80" y="487" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">7s</text><circle cx="150" cy="482" r="24" fill="#fff" stroke="#334155" stroke-width="2"/><text x="150" y="487" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">7p</text><g><animate attributeName="opacity" keyTimes="0.0000;0.0667;0.0867;1.0000" values="0;0;1;1" dur="15s" begin="au-play.begin+0s" fill="freeze"/><path d="M 110 80 L 58 132" stroke="#dc2626" stroke-width="3" marker-end="url(#au-dc2626)"/></g><g><animate attributeName="opacity" keyTimes="0.0000;0.0967;0.1167;1.0000" values="0;0;1;1" dur="15s" begin="au-play.begin+0s" fill="freeze"/><path d="M 110 142 L 58 194" stroke="#dc2626" stroke-width="3" marker-end="url(#au-dc2626)"/></g><g><animate attributeName="opacity" keyTimes="0.0000;0.1267;0.1467;1.0000" values="0;0;1;1" dur="15s" begin="au-play.begin+0s" fill="freeze"/><path d="M 180 142 L 58 256" stroke="#dc2626" stroke-width="3" marker-end="url(#au-dc2626)"/></g><g><animate attributeName="opacity" keyTimes="0.0000;0.1567;0.1767;1.0000" values="0;0;1;1" dur="15s" begin="au-play.begin+0s" fill="freeze"/><path d="M 180 204 L 58 318" stroke="#dc2626" stroke-width="3" marker-end="url(#au-dc2626)"/></g><g><animate attributeName="opacity" keyTimes="0.0000;0.1867;0.2067;1.0000" values="0;0;1;1" dur="15s" begin="au-play.begin+0s" fill="freeze"/><path d="M 250 204 L 58 380" stroke="#dc2626" stroke-width="3" marker-end="url(#au-dc2626)"/></g><g><animate attributeName="opacity" keyTimes="0.0000;0.2167;0.2367;1.0000" values="0;0;1;1" dur="15s" begin="au-play.begin+0s" fill="freeze"/><path d="M 250 266 L 58 442" stroke="#dc2626" stroke-width="3" marker-end="url(#au-dc2626)"/></g><g><animate attributeName="opacity" keyTimes="0.0000;0.2467;0.2667;1.0000" values="0;0;1;1" dur="15s" begin="au-play.begin+0s" fill="freeze"/><path d="M 320 266 L 58 504" stroke="#dc2626" stroke-width="3" marker-end="url(#au-dc2626)"/></g><g><animate attributeName="opacity" keyTimes="0.0000;0.2667;0.2867;1.0000" values="0;0;1;1" dur="15s" begin="au-play.begin+0s" fill="freeze"/><text x="380" y="560" text-anchor="start" font-size="13" font-weight="800" fill="#b91c1c">1s → 2s → 2p → 3s → 3p → 4s → 3d → 4p → 5s → 4d → 5p → 6s → 4f …</text></g></g>
<g class="part" data-part="box" data-name="Orbital (box) diagram" data-info="Each box is an orbital; arrows are electrons with their spin." tabindex="0" role="button" aria-label="Orbital (box) diagram"><rect x="520" y="300" width="56" height="56" fill="#fff" stroke="#111827" stroke-width="2.5"/><text x="548" y="372" text-anchor="middle" font-size="14" font-weight="800" fill="#111827">1s</text><rect x="640" y="240" width="56" height="56" fill="#fff" stroke="#111827" stroke-width="2.5"/><text x="668" y="312" text-anchor="middle" font-size="14" font-weight="800" fill="#111827">2s</text><rect x="760" y="180" width="56" height="56" fill="#fff" stroke="#111827" stroke-width="2.5"/><rect x="816" y="180" width="56" height="56" fill="#fff" stroke="#111827" stroke-width="2.5"/><rect x="872" y="180" width="56" height="56" fill="#fff" stroke="#111827" stroke-width="2.5"/><text x="844" y="252" text-anchor="middle" font-size="14" font-weight="800" fill="#111827">2p</text><line x1="480" y1="400" x2="480" y2="130" stroke="#475569" stroke-width="2" marker-end="url(#au-dc2626)"/><text x="464" y="260" font-size="12" font-weight="700" text-anchor="middle" transform="rotate(-90 464 260)">energy</text></g>
<g class="part" data-part="pauli" data-name="Pauli exclusion principle" data-info="An orbital holds at most two electrons, and they must have opposite spins (↑↓)." tabindex="0" role="button" aria-label="Pauli exclusion principle"><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.3000;0.3200;1.0000" values="0;0;1;1" dur="15s" begin="au-play.begin+0s" fill="freeze"/><text x="538" y="328" text-anchor="middle" font-size="34" font-weight="800" fill="#2563eb">↑</text></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.3667;0.3867;1.0000" values="0;0;1;1" dur="15s" begin="au-play.begin+0s" fill="freeze"/><text x="558" y="328" text-anchor="middle" font-size="34" font-weight="800" fill="#2563eb">↓</text></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.4667;0.4867;1.0000" values="0;0;1;1" dur="15s" begin="au-play.begin+0s" fill="freeze"/><text x="658" y="268" text-anchor="middle" font-size="34" font-weight="800" fill="#2563eb">↑</text></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.5067;0.5267;1.0000" values="0;0;1;1" dur="15s" begin="au-play.begin+0s" fill="freeze"/><text x="678" y="268" text-anchor="middle" font-size="34" font-weight="800" fill="#2563eb">↓</text></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.5867;0.6067;1.0000" values="0;0;1;1" dur="15s" begin="au-play.begin+0s" fill="freeze"/><text x="788" y="208" text-anchor="middle" font-size="34" font-weight="800" fill="#2563eb">↑</text></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.6400;0.6600;1.0000" values="0;0;1;1" dur="15s" begin="au-play.begin+0s" fill="freeze"/><text x="844" y="208" text-anchor="middle" font-size="34" font-weight="800" fill="#2563eb">↑</text></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.6933;0.7133;1.0000" values="0;0;1;1" dur="15s" begin="au-play.begin+0s" fill="freeze"/><text x="900" y="208" text-anchor="middle" font-size="34" font-weight="800" fill="#2563eb">↑</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.3667;0.3867;1.0000" values="0;0;1;1" dur="15s" begin="au-play.begin+0s" fill="freeze"/><text x="548" y="406" text-anchor="middle" font-size="11" font-weight="800" fill="#1d4ed8">opposite spins</text></g></g>
<g class="part" data-part="hund" data-name="Hund&#x27;s rule" data-info="Electrons fill the orbitals of a sub-level singly, with parallel spins, before pairing up: nitrogen has three unpaired 2p electrons." tabindex="0" role="button" aria-label="Hund&#x27;s rule"><g><animate attributeName="opacity" keyTimes="0.0000;0.5867;0.6067;1.0000" values="0;0;1;1" dur="15s" begin="au-play.begin+0s" fill="freeze"/><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.5867;0.6067;1.0000" values="0;0;1;1" dur="15s" begin="au-play.begin+0s" fill="freeze"/><rect x="719.0" y="108" width="250" height="24" rx="12" fill="#dbeafe" stroke="#1f2937" stroke-width="1"/><text x="844" y="125" text-anchor="middle" font-size="12" font-weight="700">Hund: singly, parallel spins first</text></g></g></g>
<g class="part" data-part="conf" data-name="Electron configuration" data-info="Nitrogen: 1s² 2s² 2p³." tabindex="0" role="button" aria-label="Electron configuration"><g><animate attributeName="opacity" keyTimes="0.0000;0.8000;0.8200;1.0000" values="0;0;1;1" dur="15s" begin="au-play.begin+0s" fill="freeze"/><rect x="860" y="430" width="340" height="110" rx="16" fill="#eff6ff" stroke="#93c5fd"/><text x="1030" y="462" text-anchor="middle" font-size="14" font-weight="800" fill="#1e3a8a">Nitrogen (7 electrons)</text><text x="1030" y="500" text-anchor="middle" font-size="26" font-weight="800" fill="#111827">1s² 2s² 2p³</text><text x="1030" y="528" text-anchor="middle" font-size="12" font-weight="700" fill="#475569">three unpaired electrons</text></g></g>
</svg>