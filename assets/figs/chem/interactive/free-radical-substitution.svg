<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" class="vd-svg" role="img" aria-labelledby="fr-title fr-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="fr-play" data-vd-play-label="Play: start the chain" data-vd-steps="[[0, &quot;Free-radical substitution: methane and chlorine in UV light.&quot;], [1, &quot;Initiation: UV splits Cl\u2082 into two radicals.&quot;], [4, &quot;Propagation 1: Cl\u2022 takes an H from methane.&quot;], [7, &quot;Propagation 2: \u2022CH\u2083 takes a Cl from Cl\u2082, regenerating Cl\u2022.&quot;], [10.5, &quot;The chain repeats thousands of times.&quot;], [13, &quot;Termination: two radicals meet.&quot;]]" data-vd-dur="17">
<title id="fr-title">Free-radical substitution</title><desc id="fr-desc">Initiation by UV light splitting chlorine into radicals, two propagation steps in which a chlorine radical removes hydrogen from methane and the methyl radical takes chlorine from Cl2 regenerating a chlorine radical, and termination when two radicals combine.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="560" fill="#ffffff"/>
<g aria-hidden="true"><animate id="fr-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<defs><marker id="fr-475569" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="6.3" refY="7.0" orient="auto"><path d="M0,0 L14,7.0 L0,14 z" fill="#475569"/></marker><marker id="fr-dc2626" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="6.3" refY="7.0" orient="auto"><path d="M0,0 L14,7.0 L0,14 z" fill="#dc2626"/></marker></defs>
<text class="head" x="30" y="34">Free-radical substitution: CH₄ + Cl₂ (UV)</text><text class="note" x="30" y="56">• = unpaired electron. One radical in, one radical out in each propagation step.</text>
<g class="part" data-part="init" data-name="Initiation" data-info="UV light breaks Cl–Cl homolytically: Cl₂ → 2Cl•." tabindex="0" role="button" aria-label="Initiation"><g><animate attributeName="opacity" keyTimes="0.0000;0.0588;0.0765;1.0000" values="0;0;1;1" dur="17s" begin="fr-play.begin+0s" fill="freeze"/><rect x="40" y="80" width="1020" height="90" rx="14" fill="#fff" stroke="#7c3aed" stroke-width="2"/><text x="150" y="132" text-anchor="middle" font-size="16" font-weight="800" fill="#7c3aed">initiation</text><text x="620" y="132" text-anchor="middle" font-size="19" font-weight="800" fill="#111827">Cl₂ —UV→ 2Cl•</text><text x="620" y="158" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">homolytic fission</text></g></g>
<g class="part" data-part="prop" data-name="Propagation" data-info="Cl• + CH₄ → •CH₃ + HCl, then •CH₃ + Cl₂ → CH₃Cl + Cl•. The Cl• is regenerated: a chain reaction." tabindex="0" role="button" aria-label="Propagation"><g><animate attributeName="opacity" keyTimes="0.0000;0.2353;0.2529;1.0000" values="0;0;1;1" dur="17s" begin="fr-play.begin+0s" fill="freeze"/><rect x="40" y="190" width="1020" height="90" rx="14" fill="#fff" stroke="#dc2626" stroke-width="2"/><text x="150" y="242" text-anchor="middle" font-size="16" font-weight="800" fill="#dc2626">propagation 1</text><text x="620" y="242" text-anchor="middle" font-size="19" font-weight="800" fill="#111827">Cl• + CH₄ → •CH₃ + HCl</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.4118;0.4294;1.0000" values="0;0;1;1" dur="17s" begin="fr-play.begin+0s" fill="freeze"/><rect x="40" y="290" width="1020" height="90" rx="14" fill="#fff" stroke="#dc2626" stroke-width="2"/><text x="150" y="342" text-anchor="middle" font-size="16" font-weight="800" fill="#dc2626">propagation 2</text><text x="620" y="342" text-anchor="middle" font-size="19" font-weight="800" fill="#111827">•CH₃ + Cl₂ → CH₃Cl + Cl•</text><text x="620" y="368" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">Cl• regenerated → chain reaction</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.6176;0.6353;1.0000" values="0;0;1;1" dur="17s" begin="fr-play.begin+0s" fill="freeze"/><path d="M 980 330 C 1080 300 1080 230 990 232" fill="none" stroke="#dc2626" stroke-width="3" stroke-dasharray="6 4" marker-end="url(#fr-dc2626)"/></g></g>
<g class="part" data-part="term" data-name="Termination" data-info="Two radicals combine: Cl• + Cl• → Cl₂; •CH₃ + Cl• → CH₃Cl; •CH₃ + •CH₃ → C₂H₆ (evidence for the mechanism)." tabindex="0" role="button" aria-label="Termination"><g><animate attributeName="opacity" keyTimes="0.0000;0.7647;0.7824;1.0000" values="0;0;1;1" dur="17s" begin="fr-play.begin+0s" fill="freeze"/><rect x="40" y="400" width="1020" height="90" rx="14" fill="#fff" stroke="#475569" stroke-width="2"/><text x="150" y="452" text-anchor="middle" font-size="16" font-weight="800" fill="#475569">termination</text><text x="620" y="452" text-anchor="middle" font-size="19" font-weight="800" fill="#111827">Cl• + Cl• → Cl₂ · •CH₃ + Cl• → CH₃Cl · 2•CH₃ → C₂H₆</text></g></g>
<g class="part" data-part="multi" data-name="Further substitution" data-info="With excess Cl₂: CH₂Cl₂, CHCl₃, CCl₄. Use excess methane for mainly CH₃Cl." tabindex="0" role="button" aria-label="Further substitution"><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.8529;0.8706;1.0000" values="0;0;1;1" dur="17s" begin="fr-play.begin+0s" fill="freeze"/><rect x="270.0" y="513" width="560" height="24" rx="12" fill="#fef3c7" stroke="#1f2937" stroke-width="1"/><text x="550" y="530" text-anchor="middle" font-size="12" font-weight="700">excess Cl₂ → CH₂Cl₂, CHCl₃, CCl₄ · excess CH₄ → mainly CH₃Cl</text></g></g>
</svg>