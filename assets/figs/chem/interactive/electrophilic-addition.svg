<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 580" class="vd-svg" role="img" aria-labelledby="ea2-title ea2-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="ea2-play" data-vd-play-label="Play: the mechanism" data-vd-steps="[[0, &quot;Electrophilic addition: bromine and ethene.&quot;], [1, &quot;C=C induces a dipole in Br\u2082.&quot;], [4, &quot;\u03c0 electrons attack Br\u03b4+; Br\u2013Br breaks: carbocation + Br\u207b.&quot;], [8.5, &quot;Br\u207b attacks the carbocation: 1,2-dibromoethane.&quot;], [12.5, &quot;With propene and HBr, the more stable secondary carbocation forms: 2-bromopropane.&quot;]]" data-vd-dur="17">
<title id="ea2-title">Electrophilic addition mechanism</title><desc id="ea2-desc">Curly-arrow mechanism of bromine adding to ethene: the double bond induces a dipole in bromine, pi electrons attack the delta-positive bromine forming a carbocation and bromide ion, then bromide attacks the carbocation; with propene and HBr the secondary carbocation is more stable giving 2-bromopropane.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="580" fill="#ffffff"/>
<g aria-hidden="true"><animate id="ea2-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<defs><marker id="ea2-dc2626" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="5.4" refY="6.0" orient="auto"><path d="M0,0 L12,6.0 L0,12 z" fill="#dc2626"/></marker><marker id="ea2-2563eb" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="5.4" refY="6.0" orient="auto"><path d="M0,0 L12,6.0 L0,12 z" fill="#2563eb"/></marker></defs>
<text class="head" x="30" y="34">Electrophilic addition: Br₂ + CH₂=CH₂</text><text class="note" x="30" y="56">Red arrows: movement of electron pairs.</text>
<g class="part" data-part="dip" data-name="Induced dipole" data-info="The electron-rich C=C repels electrons in Br₂, making the nearer Br δ+." tabindex="0" role="button" aria-label="Induced dipole"><circle cx="160" cy="300" r="18" fill="#374151" stroke="#1f2937" stroke-width="1.5"/><text x="160" y="305" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">C</text><line x1="178.0" y1="304.0" x2="222.0" y2="304.0" stroke="#334155" stroke-width="3"/><line x1="178.0" y1="296.0" x2="222.0" y2="296.0" stroke="#334155" stroke-width="3"/><circle cx="240" cy="300" r="18" fill="#374151" stroke="#1f2937" stroke-width="1.5"/><text x="240" y="305" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">C</text><line x1="160" y1="300" x2="126" y2="270" stroke="#334155" stroke-width="4"/><circle cx="120.9" cy="265.5" r="11" fill="#f8fafc" stroke="#1f2937" stroke-width="1.5"/><text x="120.9" y="270.5" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">H</text><line x1="160" y1="300" x2="126" y2="330" stroke="#334155" stroke-width="4"/><circle cx="120.9" cy="334.5" r="11" fill="#f8fafc" stroke="#1f2937" stroke-width="1.5"/><text x="120.9" y="339.5" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">H</text><line x1="240" y1="300" x2="274" y2="270" stroke="#334155" stroke-width="4"/><circle cx="279.1" cy="265.5" r="11" fill="#f8fafc" stroke="#1f2937" stroke-width="1.5"/><text x="279.1" y="270.5" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">H</text><line x1="240" y1="300" x2="274" y2="330" stroke="#334155" stroke-width="4"/><circle cx="279.1" cy="334.5" r="11" fill="#f8fafc" stroke="#1f2937" stroke-width="1.5"/><text x="279.1" y="339.5" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">H</text><circle cx="200" cy="220" r="16" fill="#9a3412" stroke="#1f2937" stroke-width="1.5"/><text x="200" y="225" text-anchor="middle" font-size="10" font-weight="800" fill="#fff">Br</text><line x1="200" y1="204" x2="200" y2="166" stroke="#334155" stroke-width="4"/><circle cx="200" cy="150" r="16" fill="#9a3412" stroke="#1f2937" stroke-width="1.5"/><text x="200" y="155" text-anchor="middle" font-size="10" font-weight="800" fill="#fff">Br</text><g><animate attributeName="opacity" keyTimes="0.0000;0.0882;0.1059;1.0000" values="0;0;1;1" dur="17s" begin="ea2-play.begin+0s" fill="freeze"/><text x="232" y="224" text-anchor="start" font-size="13" font-weight="800" fill="#b91c1c">δ+</text><text x="232" y="154" text-anchor="start" font-size="13" font-weight="800" fill="#1d4ed8">δ−</text></g></g>
<g class="part" data-part="step1" data-name="Step 1" data-info="The π electrons attack Brδ+; the Br–Br bond breaks heterolytically: a carbocation and Br⁻ form." tabindex="0" role="button" aria-label="Step 1"><g><animate attributeName="opacity" keyTimes="0.0000;0.2353;0.2529;1.0000" values="0;0;1;1" dur="17s" begin="ea2-play.begin+0s" fill="freeze"/><path d="M 200 292 Q 170 260 192 238" fill="none" stroke="#dc2626" stroke-width="3" marker-end="url(#ea2-dc2626)"/><path d="M 196 186 Q 170 170 192 160" fill="none" stroke="#dc2626" stroke-width="3" marker-end="url(#ea2-dc2626)"/></g><g><animate attributeName="opacity" keyTimes="0.0000;0.3529;0.3706;1.0000" values="0;0;1;1" dur="17s" begin="ea2-play.begin+0s" fill="freeze"/><rect x="350" y="150" width="300" height="220" rx="14" fill="#fef2f2" stroke="#fecaca"/><circle cx="430" cy="300" r="18" fill="#374151" stroke="#1f2937" stroke-width="1.5"/><text x="430" y="305" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">C</text><line x1="448" y1="300" x2="492" y2="300" stroke="#334155" stroke-width="4"/><circle cx="510" cy="300" r="18" fill="#374151" stroke="#1f2937" stroke-width="1.5"/><text x="510" y="305" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">C</text><line x1="430" y1="282" x2="430" y2="250" stroke="#334155" stroke-width="4"/><circle cx="430" cy="236" r="15" fill="#9a3412" stroke="#1f2937" stroke-width="1.5"/><text x="430" y="241" text-anchor="middle" font-size="10" font-weight="800" fill="#fff">Br</text><text x="530" y="280" text-anchor="middle" font-size="22" font-weight="800" fill="#b91c1c">+</text><circle cx="590" cy="200" r="16" fill="#9a3412" stroke="#1f2937" stroke-width="1.5"/><text x="590" y="205" text-anchor="middle" font-size="10" font-weight="800" fill="#fff">Br</text><text x="612" y="190" text-anchor="middle" font-size="18" font-weight="800" fill="#1d4ed8">−</text><text x="500" y="360" text-anchor="middle" font-size="13" font-weight="800" fill="#b91c1c">carbocation + Br⁻</text></g></g>
<g class="part" data-part="step2" data-name="Step 2" data-info="Br⁻ (a lone pair) attacks the carbocation: 1,2-dibromoethane. Bromine water is decolourised (orange → colourless): the test for C=C." tabindex="0" role="button" aria-label="Step 2"><g><animate attributeName="opacity" keyTimes="0.0000;0.5000;0.5176;1.0000" values="0;0;1;1" dur="17s" begin="ea2-play.begin+0s" fill="freeze"/><path d="M 580 218 Q 560 260 524 290" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#ea2-2563eb)"/></g><g><animate attributeName="opacity" keyTimes="0.0000;0.5882;0.6059;1.0000" values="0;0;1;1" dur="17s" begin="ea2-play.begin+0s" fill="freeze"/><rect x="700" y="150" width="360" height="220" rx="14" fill="#f0fdf4" stroke="#86efac"/><circle cx="800" cy="280" r="18" fill="#374151" stroke="#1f2937" stroke-width="1.5"/><text x="800" y="285" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">C</text><line x1="818" y1="280" x2="882" y2="280" stroke="#334155" stroke-width="4"/><circle cx="900" cy="280" r="18" fill="#374151" stroke="#1f2937" stroke-width="1.5"/><text x="900" y="285" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">C</text><line x1="800" y1="262" x2="800" y2="230" stroke="#334155" stroke-width="4"/><circle cx="800" cy="216" r="15" fill="#9a3412" stroke="#1f2937" stroke-width="1.5"/><text x="800" y="221" text-anchor="middle" font-size="10" font-weight="800" fill="#fff">Br</text><line x1="900" y1="298" x2="900" y2="330" stroke="#334155" stroke-width="4"/><circle cx="900" cy="344" r="15" fill="#9a3412" stroke="#1f2937" stroke-width="1.5"/><text x="900" y="349" text-anchor="middle" font-size="10" font-weight="800" fill="#fff">Br</text><text x="880" y="220" text-anchor="start" font-size="13" font-weight="800" fill="#15803d">1,2-dibromoethane</text><text x="880" y="400" text-anchor="middle" font-size="12" font-weight="800" fill="#a16207">bromine water: orange → colourless</text></g></g>
<g class="part" data-part="mark" data-name="Unsymmetrical alkenes" data-info="HBr + propene: H adds to give the more stable carbocation (secondary &gt; primary, because alkyl groups push electrons), so 2-bromopropane is the major product." tabindex="0" role="button" aria-label="Unsymmetrical alkenes"><rect x="40" y="420" width="1020" height="140" rx="16" fill="#fefce8" stroke="#fde047"/><text x="550" y="444" text-anchor="middle" font-size="14" font-weight="800" fill="#a16207">propene + HBr: which carbocation?</text><g><animate attributeName="opacity" keyTimes="0.0000;0.7647;0.7824;1.0000" values="0;0;1;1" dur="17s" begin="ea2-play.begin+0s" fill="freeze"/><rect x="130.0" y="470.0" width="380" height="60" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="320" y="498" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">CH₃–C⁺H–CH₃ secondary: MORE stable</text><text x="320" y="516" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">→ 2-bromopropane (major)</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.8118;0.8294;1.0000" values="0;0;1;1" dur="17s" begin="ea2-play.begin+0s" fill="freeze"/><rect x="590.0" y="470.0" width="380" height="60" rx="12" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/><text x="780" y="498" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">CH₃CH₂–C⁺H₂ primary: less stable</text><text x="780" y="516" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">→ 1-bromopropane (minor)</text></g></g>
</svg>