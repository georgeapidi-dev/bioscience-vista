<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 720" class="vd-svg" role="img" aria-labelledby="sn-title sn-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="sn-play" data-vd-play-label="Play: both mechanisms" data-vd-steps="[[0, &quot;Nucleophilic substitution: two mechanisms.&quot;], [1, &quot;SN2 (primary, e.g. bromoethane): OH\u207b attacks the carbon from the back.&quot;], [3.5, &quot;Transition state: OH and Br both partly bonded.&quot;], [5.5, &quot;Br\u207b leaves and the molecule inverts. Rate = k[RBr][OH\u207b].&quot;], [9, &quot;SN1 (tertiary, e.g. 2-bromo-2-methylpropane): the C\u2013Br bond breaks first, slowly.&quot;], [12, &quot;A tertiary carbocation forms.&quot;], [14, &quot;OH\u207b attacks quickly. Rate = k[RBr].&quot;]]" data-vd-dur="18">
<title id="sn-title">SN1 and SN2 mechanisms</title><desc id="sn-desc">The SN2 mechanism with backside attack of hydroxide on a primary bromoalkane through a transition state with inversion, rate = k[RBr][OH-], and the SN1 mechanism with slow ionisation of a tertiary bromoalkane to a carbocation then fast attack, rate = k[RBr].</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1220" height="720" fill="#ffffff"/>
<g aria-hidden="true"><animate id="sn-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<defs><marker id="sn-2563eb" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="5.4" refY="6.0" orient="auto"><path d="M0,0 L12,6.0 L0,12 z" fill="#2563eb"/></marker></defs>
<text class="head" x="30" y="34">Nucleophilic substitution: SN2 and SN1</text><text class="note" x="30" y="56">Curly arrows show movement of electron pairs; R groups: H, CH₃.</text>
<rect x="30" y="80" width="1160" height="280" rx="16" fill="#eff6ff" stroke="#93c5fd"/><text x="60" y="108" text-anchor="start" font-size="15" font-weight="800" fill="#1e3a8a">SN2 — primary halogenoalkane</text>
<g class="part" data-part="sn2" data-name="SN2: one step" data-info="The nucleophile (OH⁻) attacks the carbon from the side opposite the bromine while the C–Br bond breaks: a single step through a transition state." tabindex="0" role="button" aria-label="SN2: one step"><g><animate attributeName="opacity" keyTimes="0.0000;0.0556;0.0722;1.0000" values="0;0;1;1" dur="18s" begin="sn-play.begin+0s" fill="freeze"/><circle cx="120" cy="230" r="22" fill="#ef4444" stroke="#111827" stroke-width="1.5"/><text x="120" y="235" text-anchor="middle" font-size="11" font-weight="800" fill="#fff">HO⁻</text><circle cx="260" cy="230" r="18" fill="#374151" stroke="#111827" stroke-width="1.5"/><text x="260" y="235" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">C</text><line x1="278" y1="230" x2="330" y2="230" stroke="#111827" stroke-width="3"/><circle cx="350" cy="230" r="22" fill="#b45309" stroke="#111827" stroke-width="1.5"/><text x="350" y="235" text-anchor="middle" font-size="11" font-weight="800" fill="#fff">Br</text><line x1="260" y1="230" x2="230" y2="170" stroke="#111827" stroke-width="3"/><circle cx="230" cy="170" r="13" fill="#f3f4f6" stroke="#111827" stroke-width="1.5"/><text x="230" y="175" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">H</text><line x1="260" y1="230" x2="230" y2="290" stroke="#111827" stroke-width="3"/><circle cx="230" cy="290" r="13" fill="#f3f4f6" stroke="#111827" stroke-width="1.5"/><text x="230" y="295" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">H</text><line x1="260" y1="230" x2="210" y2="240" stroke="#111827" stroke-width="3"/><circle cx="210" cy="240" r="16" fill="#374151" stroke="#111827" stroke-width="1.5"/><text x="210" y="245" text-anchor="middle" font-size="11" font-weight="800" fill="#fff">CH₃</text><g><animate attributeName="opacity" keyTimes="0.0000;0.0833;0.1000;1.0000" values="0;0;1;1" dur="18s" begin="sn-play.begin+0s" fill="freeze"/><path d="M 140 210 C 170 170 220 180 244 216" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#sn-2563eb)"/><path d="M 300 226 C 310 190 340 190 348 206" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#sn-2563eb)"/></g></g></g>
<g class="part" data-part="ts" data-name="Transition state" data-info="Five groups partly bonded to carbon, the OH and Br partial bonds in a straight line; the three other groups flatten." tabindex="0" role="button" aria-label="Transition state"><g><animate attributeName="opacity" keyTimes="0.0000;0.1944;0.2111;1.0000" values="0;0;1;1" dur="18s" begin="sn-play.begin+0s" fill="freeze"/><path d="M 430 120 l -10 0 l 0 220 l 10 0 M 750 120 l 10 0 l 0 220 l -10 0" fill="none" stroke="#111827" stroke-width="2.5"/><text x="770" y="130" text-anchor="start" font-size="16" font-weight="800" fill="#111827">‡ −</text><circle cx="480" cy="230" r="20" fill="#ef4444" stroke="#111827" stroke-width="1.5"/><text x="480" y="235" text-anchor="middle" font-size="11" font-weight="800" fill="#fff">HO</text><line x1="500" y1="230" x2="572" y2="230" stroke="#111827" stroke-width="3" stroke-dasharray="5 4"/><circle cx="590" cy="230" r="18" fill="#374151" stroke="#111827" stroke-width="1.5"/><text x="590" y="235" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">C</text><line x1="608" y1="230" x2="680" y2="230" stroke="#111827" stroke-width="3" stroke-dasharray="5 4"/><circle cx="700" cy="230" r="22" fill="#b45309" stroke="#111827" stroke-width="1.5"/><text x="700" y="235" text-anchor="middle" font-size="11" font-weight="800" fill="#fff">Br</text><line x1="590" y1="230" x2="590" y2="164" stroke="#111827" stroke-width="3"/><circle cx="590" cy="164" r="13" fill="#f3f4f6" stroke="#111827" stroke-width="1.5"/><text x="590" y="169" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">H</text><line x1="590" y1="230" x2="590" y2="296" stroke="#111827" stroke-width="3"/><circle cx="590" cy="296" r="13" fill="#f3f4f6" stroke="#111827" stroke-width="1.5"/><text x="590" y="301" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">H</text><line x1="590" y1="230" x2="566" y2="270" stroke="#111827" stroke-width="3"/><circle cx="566" cy="270" r="16" fill="#374151" stroke="#111827" stroke-width="1.5"/><text x="566" y="275" text-anchor="middle" font-size="11" font-weight="800" fill="#fff">CH₃</text><text x="590" y="342" text-anchor="middle" font-size="13" font-weight="800" fill="#1e3a8a">transition state</text></g></g>
<g class="part" data-part="inv" data-name="Inversion" data-info="The other three groups flip over like an umbrella in the wind." tabindex="0" role="button" aria-label="Inversion"><g><animate attributeName="opacity" keyTimes="0.0000;0.3056;0.3222;1.0000" values="0;0;1;1" dur="18s" begin="sn-play.begin+0s" fill="freeze"/><circle cx="880" cy="230" r="20" fill="#ef4444" stroke="#111827" stroke-width="1.5"/><text x="880" y="235" text-anchor="middle" font-size="11" font-weight="800" fill="#fff">HO</text><line x1="900" y1="230" x2="942" y2="230" stroke="#111827" stroke-width="3"/><circle cx="960" cy="230" r="18" fill="#374151" stroke="#111827" stroke-width="1.5"/><text x="960" y="235" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">C</text><circle cx="1130" cy="230" r="22" fill="#b45309" stroke="#111827" stroke-width="1.5"/><text x="1130" y="235" text-anchor="middle" font-size="11" font-weight="800" fill="#fff">Br⁻</text><line x1="960" y1="230" x2="990" y2="170" stroke="#111827" stroke-width="3"/><circle cx="990" cy="170" r="13" fill="#f3f4f6" stroke="#111827" stroke-width="1.5"/><text x="990" y="175" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">H</text><line x1="960" y1="230" x2="990" y2="290" stroke="#111827" stroke-width="3"/><circle cx="990" cy="290" r="13" fill="#f3f4f6" stroke="#111827" stroke-width="1.5"/><text x="990" y="295" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">H</text><line x1="960" y1="230" x2="1010" y2="240" stroke="#111827" stroke-width="3"/><circle cx="1010" cy="240" r="16" fill="#374151" stroke="#111827" stroke-width="1.5"/><text x="1010" y="245" text-anchor="middle" font-size="11" font-weight="800" fill="#fff">CH₃</text><text x="1000" y="342" text-anchor="middle" font-size="13" font-weight="800" fill="#1e3a8a">inverted product + Br⁻</text></g></g>
<g class="part" data-part="rate2" data-name="Rate = k[RBr][OH⁻]" data-info="Both species are in the one (rate-determining) step: second order overall. Typical of primary halogenoalkanes." tabindex="0" role="button" aria-label="Rate = k[RBr][OH⁻]"><g><animate attributeName="opacity" keyTimes="0.0000;0.3889;0.4056;1.0000" values="0;0;1;1" dur="18s" begin="sn-play.begin+0s" fill="freeze"/><rect x="440" y="96" width="320" height="30" rx="10" fill="#dbeafe"/><text x="600" y="117" text-anchor="middle" font-size="13" font-weight="800" fill="#1e3a8a">rate = k[RBr][OH⁻]  (second order)</text></g></g>
<rect x="30" y="380" width="1160" height="320" rx="16" fill="#fff7ed" stroke="#fdba74"/><text x="60" y="408" text-anchor="start" font-size="15" font-weight="800" fill="#9a3412">SN1 — tertiary halogenoalkane</text>
<g class="part" data-part="sn1" data-name="SN1: two steps" data-info="First the C–Br bond breaks heterolytically (slow) to give a carbocation and Br⁻; then OH⁻ attacks the carbocation (fast)." tabindex="0" role="button" aria-label="SN1: two steps"><g><animate attributeName="opacity" keyTimes="0.0000;0.5000;0.5167;1.0000" values="0;0;1;1" dur="18s" begin="sn-play.begin+0s" fill="freeze"/><line x1="160" y1="540" x2="230" y2="540" stroke="#111827" stroke-width="3"/><line x1="160" y1="540" x2="160" y2="470" stroke="#111827" stroke-width="3"/><line x1="160" y1="540" x2="100" y2="580" stroke="#111827" stroke-width="3"/><line x1="160" y1="540" x2="100" y2="500" stroke="#111827" stroke-width="3"/><circle cx="160" cy="540" r="20" fill="#374151" stroke="#111827" stroke-width="1.5"/><text x="160" y="545" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">C</text><circle cx="100" cy="500" r="17" fill="#374151" stroke="#111827" stroke-width="1.5"/><text x="100" y="505" text-anchor="middle" font-size="11" font-weight="800" fill="#fff">CH₃</text><circle cx="100" cy="580" r="17" fill="#374151" stroke="#111827" stroke-width="1.5"/><text x="100" y="585" text-anchor="middle" font-size="11" font-weight="800" fill="#fff">CH₃</text><circle cx="160" cy="470" r="17" fill="#374151" stroke="#111827" stroke-width="1.5"/><text x="160" y="475" text-anchor="middle" font-size="11" font-weight="800" fill="#fff">CH₃</text><circle cx="250" cy="540" r="22" fill="#b45309" stroke="#111827" stroke-width="1.5"/><text x="250" y="545" text-anchor="middle" font-size="11" font-weight="800" fill="#fff">Br</text><g><animate attributeName="opacity" keyTimes="0.0000;0.5278;0.5444;1.0000" values="0;0;1;1" dur="18s" begin="sn-play.begin+0s" fill="freeze"/><path d="M 200 536 C 210 496 250 496 258 518" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#sn-2563eb)"/></g><text x="330" y="536" text-anchor="middle" font-size="14" font-weight="800" fill="#b91c1c">slow</text><path d="M 300 550 L 380 550" stroke="#475569" stroke-width="3" marker-end="url(#sn-2563eb)"/><text x="160" y="650" text-anchor="middle" font-size="12" font-weight="800" fill="#7c2d12">2-bromo-2-methylpropane</text></g></g>
<g class="part" data-part="carb" data-name="Tertiary carbocation" data-info="Stabilised by three alkyl groups pushing electrons towards the positive carbon; also crowding stops backside attack." tabindex="0" role="button" aria-label="Tertiary carbocation"><g><animate attributeName="opacity" keyTimes="0.0000;0.6667;0.6833;1.0000" values="0;0;1;1" dur="18s" begin="sn-play.begin+0s" fill="freeze"/><line x1="500" y1="540" x2="560" y2="540" stroke="#111827" stroke-width="3"/><line x1="500" y1="540" x2="440" y2="580" stroke="#111827" stroke-width="3"/><line x1="500" y1="540" x2="440" y2="500" stroke="#111827" stroke-width="3"/><circle cx="500" cy="540" r="20" fill="#374151" stroke="#111827" stroke-width="1.5"/><text x="500" y="545" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">C</text><circle cx="440" cy="500" r="17" fill="#374151" stroke="#111827" stroke-width="1.5"/><text x="440" y="505" text-anchor="middle" font-size="11" font-weight="800" fill="#fff">CH₃</text><circle cx="440" cy="580" r="17" fill="#374151" stroke="#111827" stroke-width="1.5"/><text x="440" y="585" text-anchor="middle" font-size="11" font-weight="800" fill="#fff">CH₃</text><circle cx="560" cy="540" r="17" fill="#374151" stroke="#111827" stroke-width="1.5"/><text x="560" y="545" text-anchor="middle" font-size="11" font-weight="800" fill="#fff">CH₃</text><text x="518" y="522" text-anchor="middle" font-size="22" font-weight="800" fill="#dc2626">+</text><circle cx="620" cy="610" r="20" fill="#b45309" stroke="#111827" stroke-width="1.5"/><text x="620" y="615" text-anchor="middle" font-size="11" font-weight="800" fill="#fff">Br⁻</text><g><animate attributeName="opacity" keyTimes="0.0000;0.7778;0.7944;1.0000" values="0;0;1;1" dur="18s" begin="sn-play.begin+0s" fill="freeze"/><circle cx="420" cy="460" r="20" fill="#ef4444" stroke="#111827" stroke-width="1.5"/><text x="420" y="465" text-anchor="middle" font-size="11" font-weight="800" fill="#fff">HO⁻</text><path d="M 440 470 C 470 480 480 500 488 518" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#sn-2563eb)"/></g><text x="500" y="650" text-anchor="middle" font-size="12" font-weight="800" fill="#7c2d12">tertiary carbocation (planar)</text><text x="700" y="536" text-anchor="middle" font-size="14" font-weight="800" fill="#16a34a">fast</text><path d="M 670 550 L 750 550" stroke="#475569" stroke-width="3" marker-end="url(#sn-2563eb)"/></g></g>
<g><animate attributeName="opacity" keyTimes="0.0000;0.8333;0.8500;1.0000" values="0;0;1;1" dur="18s" begin="sn-play.begin+0s" fill="freeze"/><line x1="880" y1="540" x2="880" y2="474" stroke="#111827" stroke-width="3"/><line x1="880" y1="540" x2="940" y2="540" stroke="#111827" stroke-width="3"/><line x1="880" y1="540" x2="820" y2="580" stroke="#111827" stroke-width="3"/><line x1="880" y1="540" x2="820" y2="500" stroke="#111827" stroke-width="3"/><circle cx="880" cy="540" r="20" fill="#374151" stroke="#111827" stroke-width="1.5"/><text x="880" y="545" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">C</text><circle cx="820" cy="500" r="17" fill="#374151" stroke="#111827" stroke-width="1.5"/><text x="820" y="505" text-anchor="middle" font-size="11" font-weight="800" fill="#fff">CH₃</text><circle cx="820" cy="580" r="17" fill="#374151" stroke="#111827" stroke-width="1.5"/><text x="820" y="585" text-anchor="middle" font-size="11" font-weight="800" fill="#fff">CH₃</text><circle cx="940" cy="540" r="17" fill="#374151" stroke="#111827" stroke-width="1.5"/><text x="940" y="545" text-anchor="middle" font-size="11" font-weight="800" fill="#fff">CH₃</text><circle cx="880" cy="460" r="18" fill="#ef4444" stroke="#111827" stroke-width="1.5"/><text x="880" y="465" text-anchor="middle" font-size="11" font-weight="800" fill="#fff">OH</text><text x="880" y="650" text-anchor="middle" font-size="12" font-weight="800" fill="#7c2d12">2-methylpropan-2-ol</text></g>
