ributeName="opacity" keyTimes="0.0000;0.1667;0.2333;0.4733;0.5400;1.0000" values="0;0;1;1;1;1" dur="15s" begin="ht-play.begin+0s" fill="freeze"/></circle><text x="490" y="90" text-anchor="middle" font-size="16" font-weight="800" fill="#111827">I⁻</text><g><animate attributeName="opacity" keyTimes="0.0000;0.2333;0.2533;1.0000" values="0;0;1;1" dur="15s" begin="ht-play.begin+0s" fill="freeze"/><text x="490" y="346" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">yellow AgI</text></g></g>
<g class="part" data-part="nh3" data-name="Add ammonia" data-info="AgCl dissolves in dilute NH₃; AgBr dissolves in concentrated NH₃; AgI does not dissolve." tabindex="0" role="button" aria-label="Add ammonia"><g><animate attributeName="opacity" keyTimes="0.0000;0.4000;0.4200;1.0000" values="0;0;1;1" dur="15s" begin="ht-play.begin+0s" fill="freeze"/><text x="150" y="372" text-anchor="middle" font-size="11" font-weight="800" fill="#0369a1">dissolves in dilute NH₃</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.4533;0.4733;1.0000" values="0;0;1;1" dur="15s" begin="ht-play.begin+0s" fill="freeze"/><text x="320" y="372" text-anchor="middle" font-size="11" font-weight="800" fill="#0369a1">dissolves in conc. NH₃</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.5067;0.5267;1.0000" values="0;0;1;1" dur="15s" begin="ht-play.begin+0s" fill="freeze"/><text x="490" y="372" text-anchor="middle" font-size="11" font-weight="800" fill="#0369a1">insoluble in NH₃</text></g></g>
<g class="part" data-part="h2so4" data-name="With concentrated H₂SO₄" data-info="NaCl: HCl only (acid–base). NaBr: HBr, then some reduced to Br₂ (orange) + SO₂. NaI: HI, I₂ (purple/black), SO₂, S and H₂S: iodide is the strongest reducing agent." tabindex="0" role="button" aria-label="With concentrated H₂SO₄"><rect x="620" y="80" width="450" height="460" rx="16" fill="#fff7ed" stroke="#fdba74"/><text x="845" y="106" text-anchor="middle" font-size="14" font-weight="800" fill="#c2410c">solid NaX + concentrated H₂SO₄</text><g><animate attributeName="opacity" keyTimes="0.0000;0.6667;0.6867;1.0000" values="0;0;1;1" dur="15s" begin="ht-play.begin+0s" fill="freeze"/><rect x="640" y="150" width="410" height="100" rx="12" fill="#fff" stroke="#fdba74"/><text x="700" y="184" text-anchor="middle" font-size="15" font-weight="800" fill="#111827">NaCl</text><text x="890" y="184" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">HCl (steamy fumes) only</text><text x="845" y="220" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">acid–base: Cl⁻ cannot reduce H₂SO₄</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.7200;0.7400;1.0000" values="0;0;1;1" dur="15s" begin="ht-play.begin+0s" fill="freeze"/><rect x="640" y="270" width="410" height="100" rx="12" fill="#fff" stroke="#fdba74"/><text x="700" y="304" text-anchor="middle" font-size="15" font-weight="800" fill="#111827">NaBr</text><text x="890" y="304" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">HBr + Br₂ (orange) + SO₂</text><text x="845" y="340" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">Br⁻ reduces S from +6 to +4</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.7733;0.7933;1.0000" values="0;0;1;1" dur="15s" begin="ht-play.begin+0s" fill="freeze"/><rect x="640" y="390" width="410" height="100" rx="12" fill="#fff" stroke="#fdba74"/><text x="700" y="424" text-anchor="middle" font-size="15" font-weight="800" fill="#111827">NaI</text><text x="890" y="424" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">HI + I₂ + SO₂ + S + H₂S</text><text x="845" y="460" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">I⁻ reduces S to +4, 0 and −2</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.8333;0.8533;1.0000" values="0;0;1;1" dur="15s" begin="ht-play.begin+0s" fill="freeze"/><text x="845" y="520" text-anchor="middle" font-size="13" font-weight="800" fill="#b91c1c">reducing power: Cl⁻ < Br⁻ < I⁻</text></g></g>
</svg>