<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" class="vd-svg" role="img" aria-labelledby="ht-title ht-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="ht-play" data-vd-play-label="Play: test the halides" data-vd-steps="[[0, &quot;Testing for halide ions.&quot;], [1, &quot;Silver nitrate: white, cream, yellow precipitates.&quot;], [5.5, &quot;Ammonia distinguishes them further.&quot;], [10, &quot;Concentrated sulfuric acid: reducing power increases Cl\u207b &lt; Br\u207b &lt; I\u207b.&quot;]]" data-vd-dur="15">
<title id="ht-title">Tests for halide ions</title><desc id="ht-desc">Silver nitrate gives a white precipitate of silver chloride, cream silver bromide and yellow silver iodide; silver chloride dissolves in dilute ammonia, silver bromide in concentrated ammonia and silver iodide not at all; with concentrated sulfuric acid chloride gives HCl, bromide also gives bromine and sulfur dioxide, and iodide gives iodine, sulfur and hydrogen sulfide.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="560" fill="#ffffff"/>
<g aria-hidden="true"><animate id="ht-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<text class="head" x="30" y="34">Halide ions: three tests</text><text class="note" x="30" y="56">Acidify with dilute nitric acid before adding AgNO₃.</text>
