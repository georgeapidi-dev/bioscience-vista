<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" class="vd-svg" role="img" aria-labelledby="ab-title ab-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="ab-play" data-vd-play-label="Play: rank the bases" data-vd-steps="[[0, &quot;Which is the strongest base?&quot;], [1, &quot;Ethylamine &gt; ammonia &gt; phenylamine.&quot;], [6, &quot;It depends on how available the N lone pair is.&quot;], [10, &quot;Amines form salts with acids; NaOH releases the amine.&quot;]]" data-vd-dur="13">
<title id="ab-title">Base strength of amines</title><desc id="ab-desc">Ethylamine is a stronger base than ammonia because the ethyl group releases electrons onto nitrogen, while phenylamine is weaker because the nitrogen lone pair is delocalised into the benzene ring.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="520" fill="#ffffff"/>
<g aria-hidden="true"><animate id="ab-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<text class="head" x="30" y="34">Basicity: ethylamine, ammonia, phenylamine</text><text class="note" x="30" y="56">Base strength = ability of the N lone pair to accept H⁺.</text>
<g class="part" data-part="order" data-name="Order of base strength" data-info="Ethylamine &gt; ammonia &gt; phenylamine." tabindex="0" role="button" aria-label="Order of base strength"><g><animate attributeName="opacity" keyTimes="0.0000;0.0769;0.1000;1.0000" values="0;0;1;1" dur="13s" begin="ab-play.begin+0s" fill="freeze"/><rect x="40" y="90" width="330" height="320" rx="16" fill="#fff" stroke="#7c3aed" stroke-width="2"/><text x="205" y="120" text-anchor="middle" font-size="16" font-weight="800" fill="#7c3aed">ethylamine</text><rect x="155" y="150" width="100" height="180" fill="#7c3aed" opacity=".7"/><text x="205" y="352" text-anchor="middle" font-size="13" font-weight="800" fill="#7c3aed">strongest</text><text x="205" y="390" text-anchor="middle" font-size="10" font-weight="700" fill="#475569">C₂H₅ pushes electrons onto N: lone pair more available</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.1769;0.2000;1.0000" values="0;0;1;1" dur="13s" begin="ab-play.begin+0s" fill="freeze"/><rect x="390" y="90" width="330" height="320" rx="16" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="555" y="120" text-anchor="middle" font-size="16" font-weight="800" fill="#2563eb">ammonia</text><rect x="505" y="210" width="100" height="120" fill="#2563eb" opacity=".7"/><text x="555" y="352" text-anchor="middle" font-size="13" font-weight="800" fill="#2563eb">middle</text><text x="555" y="390" text-anchor="middle" font-size="10" font-weight="700" fill="#475569">reference</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.2769;0.3000;1.0000" values="0;0;1;1" dur="13s" begin="ab-play.begin+0s" fill="freeze"/><rect x="740" y="90" width="330" height="320" rx="16" fill="#fff" stroke="#94a3b8" stroke-width="2"/><text x="905" y="120" text-anchor="middle" font-size="16" font-weight="800" fill="#94a3b8">phenylamine</text><rect x="855" y="270" width="100" height="60" fill="#94a3b8" opacity=".7"/><text x="905" y="352" text-anchor="middle" font-size="13" font-weight="800" fill="#94a3b8">weakest</text><text x="905" y="390" text-anchor="middle" font-size="10" font-weight="700" fill="#475569">N lone pair delocalised into the ring: less available</text></g></g>
<g class="part" data-part="why" data-name="Availability of the lone pair" data-info="Alkyl groups are electron-releasing (positive inductive effect): more electron density on N. In phenylamine the N lone pair overlaps with the ring π system, so it is less available to accept H⁺." tabindex="0" role="button" aria-label="Availability of the lone pair"><g><animate attributeName="opacity" keyTimes="0.0000;0.4615;0.4846;1.0000" values="0;0;1;1" dur="13s" begin="ab-play.begin+0s" fill="freeze"/><polygon points="1010.0,192.0 1034.2,206.0 1034.2,234.0 1010.0,248.0 985.8,234.0 985.8,206.0" fill="#fff" stroke="#111827" stroke-width="3"/><circle cx="1010" cy="220" r="17" fill="none" stroke="#111827" stroke-width="3"/><line x1="1010" y1="192" x2="1010" y2="174" stroke="#111827" stroke-width="4"/><text x="1010.0" y="172.0" text-anchor="middle" font-size="12" font-weight="800" fill="#2563eb">NH₂</text><ellipse cx="1010" cy="220" rx="40" ry="14" fill="#a78bfa" opacity=".3"/></g></g>
<g class="part" data-part="salt" data-name="Salts" data-info="Amines + acids → salts: C₂H₅NH₂ + HCl → C₂H₅NH₃⁺Cl⁻. Adding NaOH releases the free amine again." tabindex="0" role="button" aria-label="Salts"><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.7692;0.7923;1.0000" values="0;0;1;1" dur="13s" begin="ab-play.begin+0s" fill="freeze"/><rect x="310.0" y="458" width="480" height="24" rx="12" fill="#ede9fe" stroke="#1f2937" stroke-width="1"/><text x="550" y="475" text-anchor="middle" font-size="12" font-weight="700">RNH₂ + HCl → RNH₃⁺Cl⁻ · then + NaOH → RNH₂ released</text></g></g>
</svg>