<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 640" class="vd-svg" role="img" aria-labelledby="sp-title sp-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="sp-play" data-vd-play-label="Play: build the double bond" data-vd-steps="[[0, &quot;Bonding in ethene, C\u2082H\u2084.&quot;], [1, &quot;Each carbon forms three \u03c3 bonds in a flat triangle: two to H, one to the other C.&quot;], [4, &quot;Each carbon also has one p orbital, at right angles to that plane.&quot;], [6.5, &quot;The p orbitals overlap sideways: a \u03c0 bond above and below the axis.&quot;], [9.5, &quot;So C=C is one \u03c3 and one \u03c0 bond; the \u03c0 bond stops rotation.&quot;]]" data-vd-dur="14">
<title id="sp-title">σ and π bonds in ethene</title><desc id="sp-desc">Ethene bonding: sp2 carbons form sigma bonds to two hydrogens and to each other in a plane; unhybridised p orbitals overlap sideways above and below to form a pi bond, so the C=C double bond is one sigma and one pi bond.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1220" height="640" fill="#ffffff"/>
<g aria-hidden="true"><animate id="sp-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<text class="head" x="30" y="34">σ and π bonds: ethene</text><text class="note" x="30" y="56">The molecule is flat; p orbitals stand up from the plane.</text>
<polygon points="200,420 880,420 1000,280 320,280" fill="#e0f2fe" opacity=".6" stroke="#bae6fd"/>
<g class="part" data-part="ch" data-name="C–H σ bonds" data-info="Overlap of carbon sp² hybrid orbitals with hydrogen 1s orbitals; all in one plane, 120° apart." tabindex="0" role="button" aria-label="C–H σ bonds"><g><animate attributeName="opacity" keyTimes="0.0000;0.0714;0.0929;1.0000" values="0;0;1;1" dur="14s" begin="sp-play.begin+0s" fill="freeze"/><path d="M 440 340 L 380 297" stroke="#fbbf24" stroke-width="22" stroke-linecap="round" opacity=".8"/><circle cx="380.0" cy="296.7" r="16" fill="#f3f4f6" stroke="#111827" stroke-width="1.5"/><text x="380.0" y="300.69872981077805" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">H</text><path d="M 440 340 L 380 383" stroke="#fbbf24" stroke-width="22" stroke-linecap="round" opacity=".8"/><circle cx="380.0" cy="383.3" r="16" fill="#f3f4f6" stroke="#111827" stroke-width="1.5"/><text x="379.99999999999994" y="387.3012701892219" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">H</text><path d="M 640 340 L 700 297" stroke="#fbbf24" stroke-width="22" stroke-linecap="round" opacity=".8"/><circle cx="700.0" cy="296.7" r="16" fill="#f3f4f6" stroke="#111827" stroke-width="1.5"/><text x="700.0" y="300.69872981077805" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">H</text><path d="M 640 340 L 700 383" stroke="#fbbf24" stroke-width="22" stroke-linecap="round" opacity=".8"/><circle cx="700.0" cy="383.3" r="16" fill="#f3f4f6" stroke="#111827" stroke-width="1.5"/><text x="700.0" y="387.30127018922195" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">H</text></g></g>
<g class="part" data-part="sig" data-name="σ (sigma) bond" data-info="Formed by end-on overlap of orbitals along the line between the two nuclei. Every single bond is a σ bond." tabindex="0" role="button" aria-label="σ (sigma) bond"><g><animate attributeName="opacity" keyTimes="0.0000;0.1429;0.1643;1.0000" values="0;0;1;1" dur="14s" begin="sp-play.begin+0s" fill="freeze"/><ellipse cx="540.0" cy="340" rx="110" ry="20" fill="#fbbf24" stroke="#b45309" stroke-width="2"/><text x="540.0" y="345" text-anchor="middle" font-size="18" font-weight="800" fill="#7c2d12">σ</text></g></g>
<g><animate attributeName="opacity" keyTimes="0.0000;0.2857;0.3071;0.4857;0.5071;1.0000" values="0;0;1;1;0;0" dur="14s" begin="sp-play.begin+0s" fill="freeze"/><ellipse cx="440" cy="270" rx="26" ry="60" fill="#93c5fd" fill-opacity=".8" stroke="#1d4ed8" stroke-width="2"/><ellipse cx="440" cy="410" rx="26" ry="60" fill="#93c5fd" fill-opacity=".8" stroke="#1d4ed8" stroke-width="2"/><ellipse cx="640" cy="270" rx="26" ry="60" fill="#93c5fd" fill-opacity=".8" stroke="#1d4ed8" stroke-width="2"/><ellipse cx="640" cy="410" rx="26" ry="60" fill="#93c5fd" fill-opacity=".8" stroke="#1d4ed8" stroke-width="2"/></g><g><animate attributeName="opacity" keyTimes="0.0000;0.2857;0.3071;0.4857;0.5071;1.0000" values="0;0;1;1;0;0" dur="14s" begin="sp-play.begin+0s" fill="freeze"/><text x="380" y="200" text-anchor="middle" font-size="13" font-weight="800" fill="#1d4ed8">p orbital</text></g>
<g class="part" data-part="pi" data-name="π (pi) bond" data-info="Formed by sideways overlap of two parallel p orbitals; electron density above and below the C–C axis." tabindex="0" role="button" aria-label="π (pi) bond"><g><animate attributeName="opacity" keyTimes="0.0000;0.4643;0.4857;1.0000" values="0;0;1;1" dur="14s" begin="sp-play.begin+0s" fill="freeze"/><path d="M 414 270 C 414 190 666 190 666 270 C 666 310 414 310 414 270 Z" fill="#60a5fa" fill-opacity=".75" stroke="#1d4ed8" stroke-width="2"/><path d="M 414 410 C 414 490 666 490 666 410 C 666 370 414 370 414 410 Z" fill="#60a5fa" fill-opacity=".75" stroke="#1d4ed8" stroke-width="2"/><text x="540" y="244" text-anchor="middle" font-size="22" font-weight="800" fill="#1e3a8a">π</text><text x="540" y="450" text-anchor="middle" font-size="22" font-weight="800" fill="#1e3a8a">π</text></g></g>
<circle cx="440.0" cy="340.0" r="24" fill="#374151" stroke="#111827" stroke-width="1.5"/><text x="440" y="344" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">C</text><circle cx="640.0" cy="340.0" r="24" fill="#374151" stroke="#111827" stroke-width="1.5"/><text x="640" y="344" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">C</text>
<g><animate attributeName="opacity" keyTimes="0.0000;0.1429;0.1643;1.0000" values="0;0;1;1" dur="14s" begin="sp-play.begin+0s" fill="freeze"/><line x1="540" y1="340" x2="540" y2="560" stroke="#475569" stroke-width="1.5"/><circle cx="540" cy="340" r="3" fill="#475569"/><text x="540" y="576" text-anchor="middle" font-size="13" font-weight="800" fill="#b45309">σ bond: end-on overlap along the axis</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.4643;0.4857;1.0000" values="0;0;1;1" dur="14s" begin="sp-play.begin+0s" fill="freeze"/><line x1="700" y1="230" x2="860" y2="140" stroke="#475569" stroke-width="1.5"/><circle cx="700" cy="230" r="3" fill="#475569"/><text x="866" y="144" text-anchor="start" font-size="13" font-weight="800" fill="#1d4ed8">π bond: sideways overlap,</text><text x="866" y="162" text-anchor="start" font-size="13" font-weight="800" fill="#1d4ed8">above and below the axis</text></g>
<g class="part" data-part="rot" data-name="No rotation" data-info="Twisting about a C=C bond would break the π overlap, so rotation is restricted: this is why cis/trans isomers exist." tabindex="0" role="button" aria-label="No rotation"><g><animate attributeName="opacity" keyTimes="0.0000;0.6786;0.7000;1.0000" values="0;0;1;1" dur="14s" begin="sp-play.begin+0s" fill="freeze"/><rect x="900" y="300" width="300" height="120" rx="14" fill="#fef2f2" stroke="#fca5a5"/><text x="1050" y="328" text-anchor="middle" font-size="14" font-weight="800" fill="#991b1b">No rotation about C=C</text><text x="1050" y="354" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">twisting would break the π overlap</text><text x="1050" y="378" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">→ cis and trans isomers</text><path d="M 1000 400 a 50 14 0 1 0 100 0" fill="none" stroke="#dc2626" stroke-width="3"/><line x1="1000" y1="388" x2="1100" y2="412" stroke="#dc2626" stroke-width="4"/></g></g>
<g class="part" data-part="sum" data-name="Double bond = 1 σ + 1 π" data-info="A triple bond is 1 σ + 2 π. The π bond is weaker and more exposed, so alkenes react by addition." tabindex="0" role="button" aria-label="Double bond = 1 σ + 1 π"><g><animate attributeName="opacity" keyTimes="0.0000;0.6786;0.7000;1.0000" values="0;0;1;1" dur="14s" begin="sp-play.begin+0s" fill="freeze"/><rect x="900" y="440" width="300" height="150" rx="14" fill="#f0fdf4" stroke="#86efac"/><text x="1050" y="468" text-anchor="middle" font-size="16" font-weight="800" fill="#166534">C=C = 1 σ + 1 π</text><text x="1050" y="496" text-anchor="middle" font-size="14" font-weight="800" fill="#166534">C≡C = 1 σ + 2 π</text><text x="1050" y="524" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">π bond is weaker than σ,</text><text x="1050" y="544" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">electrons more exposed</text><text x="1050" y="568" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">→ alkenes undergo addition</text></g></g>
</svg>