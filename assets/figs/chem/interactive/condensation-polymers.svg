CONH– amide</text></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.4375;0.4500;0.5687;0.5812;1.0000" values="0;0;1;1;0;0" dur="16s" begin="cp-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.4500;0.5437;1.0000" values="410 330;410 330;410 260;410 260" dur="16s" begin="cp-play.begin+0s" fill="freeze"/><g><circle r="9" fill="#38bdf8"/><text x="0" y="4" text-anchor="middle" font-size="7" font-weight="800" fill="#0c4a6e">H₂O</text></g></g></g><g><animate attributeName="opacity" keyTimes="0.0000;0.5312;0.5500;1.0000" values="0;0;1;1" dur="16s" begin="cp-play.begin+0s" fill="freeze"/><text x="555" y="376" text-anchor="middle" font-size="12" font-weight="800" fill="#b91c1c">–CONH– amide</text></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.4375;0.4500;0.5813;0.5938;1.0000" values="0;0;1;1;0;0" dur="16s" begin="cp-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.4625;0.5563;1.0000" values="570 330;570 330;570 260;570 260" dur="16s" begin="cp-play.begin+0s" fill="freeze"/><g><circle r="9" fill="#38bdf8"/><text x="0" y="4" text-anchor="middle" font-size="7" font-weight="800" fill="#0c4a6e">H₂O</text></g></g></g><g><animate attributeName="opacity" keyTimes="0.0000;0.5312;0.5500;1.0000" values="0;0;1;1" dur="16s" begin="cp-play.begin+0s" fill="freeze"/><text x="705" y="376" text-anchor="middle" font-size="12" font-weight="800" fill="#b91c1c">–CONH– amide</text></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.4375;0.4500;0.5938;0.6062;1.0000" values="0;0;1;1;0;0" dur="16s" begin="cp-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.4750;0.5687;1.0000" values="730 330;730 330;730 260;730 260" dur="16s" begin="cp-play.begin+0s" fill="freeze"/><g><circle r="9" fill="#38bdf8"/><text x="0" y="4" text-anchor="middle" font-size="7" 