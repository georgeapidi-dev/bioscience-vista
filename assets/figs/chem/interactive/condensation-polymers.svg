0.0000;0.0938;0.1062;0.2250;0.2375;1.0000" values="0;0;1;1;0;0" dur="16s" begin="cp-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.1062;0.2000;1.0000" values="410 150;410 150;410 80;410 80" dur="16s" begin="cp-play.begin+0s" fill="freeze"/><g><circle r="9" fill="#38bdf8"/><text x="0" y="4" text-anchor="middle" font-size="7" font-weight="800" fill="#0c4a6e">H₂O</text></g></g></g><g><animate attributeName="opacity" keyTimes="0.0000;0.1875;0.2062;1.0000" values="0;0;1;1" dur="16s" begin="cp-play.begin+0s" fill="freeze"/><text x="555" y="196" text-anchor="middle" font-size="12" font-weight="800" fill="#1d4ed8">–COO– ester</text></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.0938;0.1062;0.2375;0.2500;1.0000" values="0;0;1;1;0;0" dur="16s" begin="cp-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.1187;0.2125;1.0000" values="570 150;570 150;570 80;570 80" dur="16s" begin="cp-play.begin+0s" fill="freeze"/><g><circle r="9" fill="#38bdf8"/><text x="0" y="4" text-anchor="middle" font-size="7" font-weight="800" fill="#0c4a6e">H₂O</text></g></g></g><g><animate attributeName="opacity" keyTimes="0.0000;0.1875;0.2062;1.0000" values="0;0;1;1" dur="16s" begin="cp-play.begin+0s" fill="freeze"/><text x="705" y="196" text-anchor="middle" font-size="12" font-weight="800" fill="#1d4ed8">–COO– ester</text></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.0938;0.1062;0.2500;0.2625;1.0000" values="0;0;1;1;0;0" dur="16s" begin="cp-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.1313;0.2250;1.0000" values="730 150;730 150;730 80;730 80" dur="16s" begin="cp-play.begin+0s" fill="freeze"/><g><circle r="9" fill="#38bdf8"/><text x="0" y="4" text-anchor="middle" font-size="7" font-weight="800" fill="#0c4a6e">H₂O</text></g></g></g><g><animate attributeName="opacit