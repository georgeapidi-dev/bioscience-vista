<g class="part" data-part="pa" data-name="Polyamide" data-info="A diamine + a dicarboxylic acid (or diacyl chloride): amide links, losing H₂O (or HCl). Nylon-6,6: hexane-1,6-diamine + hexanedioic acid. Kevlar: aromatic rings: rigid chains with strong hydrogen bonding between them." tabindex="0" role="button" aria-label="Polyamide"><text x="550" y="290" text-anchor="middle" font-size="15" font-weight="800" fill="#b91c1c">POLYAMIDE (e.g. nylon-6,6, Kevlar)</text><g transform="translate(80 330)"><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.4062;0.5312;1.0000" values="80 330;80 330;120 330;120 330" dur="16s" begin="cp-play.begin+0s" fill="freeze"/><rect x="0" y="-22" width="120" height="44" rx="10" fill="#dbeafe" stroke="#334155"/><text x="60" y="5" text-anchor="middle" font-size="11" font-weight="800" fill="#111827">H₂N–diamine–NH₂</text></g><g transform="translate(255 330)"><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.4062;0.5312;1.0000" values="255 330;255 330;270 330;270 330" dur="16s" begin="cp-play.begin+0s" fill="freeze"/><rect x="0" y="-22" width="120" height="44" rx="10" fill="#fee2e2" stroke="#334155"/><text x="60" y="5" text-anchor="middle" font-size="11" font-weight="800" fill="#111827">HOOC–acid–COOH</text></g><g transform="translate(430 330)"><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.4062;0.5312;1.0000" values="430 330;430 330;420 330;420 330" dur="16s" begin="cp-play.begin+0s" fill="freeze"/><rect x="0" y="-22" width="120" height="44" rx="10" fill="#dbeafe" stroke="#334155"/><text x="60" y="5" text-anchor="middle" font-size="11" font-weight="800" fill="#111827">H₂N–diamine–NH₂</text></g><g transform="translate(605 330)"><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.4062;0.5312;1.0000" values="605 330;605 330;570 330;570 330" dur="16s" begin="cp-play.begin+0s" fill="freeze"/><rect x="0" y="-22" width="120" height="44