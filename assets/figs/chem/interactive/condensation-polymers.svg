<g class="part" data-part="hyd" data-name="Hydrolysis and biodegradability" data-info="Ester and amide links can be hydrolysed (by acid, alkali or enzymes), so condensation polymers can be biodegradable; poly(alkene)s cannot." tabindex="0" role="button" aria-label="Hydrolysis and biodegradability"><g><animate attributeName="opacity" keyTimes="0.0000;0.7500;0.7688;1.0000" values="0;0;1;1" dur="16s" begin="cp-play.begin+0s" fill="freeze"/><rect x="60" y="450" width="980" height="110" rx="16" fill="#f0fdf4" stroke="#86efac"/><text x="550" y="480" text-anchor="middle" font-size="14" font-weight="800" fill="#15803d">ester and amide links hydrolyse (acid, alkali, enzymes) → can be biodegradable</text><text x="550" y="510" text-anchor="middle" font-size="12" font-weight="700" fill="#475569">poly(alkene)s have only C–C and C–H: not biodegradable · Kevlar: H-bonds between rigid chains → very strong</text></g></g>
</svg>