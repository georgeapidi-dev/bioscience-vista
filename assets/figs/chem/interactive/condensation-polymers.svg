<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 580" class="vd-svg" role="img" aria-labelledby="cp-title cp-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="cp-play" data-vd-play-label="Play: link monomers" data-vd-steps="[[0, &quot;Condensation polymerisation.&quot;], [1, &quot;Polyester: diol + dicarboxylic acid, losing water.&quot;], [6.5, &quot;Polyamide: diamine + dicarboxylic acid, losing water.&quot;], [12, &quot;Ester and amide links can be hydrolysed.&quot;]]" data-vd-dur="16">
<title id="cp-title">Condensation polymers</title><desc id="cp-desc">Monomers joining with loss of water: a diol and a dicarboxylic acid form a polyester with ester links, and a diamine and a dicarboxylic acid form a polyamide with amide links; these links can be hydrolysed so the polymers can biodegrade.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="580" fill="#ffffff"/>
<g aria-hidden="true"><animate id="cp-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<text class="head" x="30" y="34">Condensation polymerisation: polyesters and polyamides</text><text class="note" x="30" y="56">Boxes = the carbon chain or ring of each monomer.</text>
