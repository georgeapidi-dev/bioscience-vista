<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 580" class="vd-svg" role="img" aria-labelledby="ir-title ir-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="ir-play" data-vd-play-label="Play: scan" data-vd-steps="[[0, &quot;Infrared spectroscopy: bonds absorb at characteristic wavenumbers.&quot;], [1, &quot;Bonds vibrate and absorb IR.&quot;], [4, &quot;Ethanol: broad O\u2013H around 3300 cm\u207b\u00b9, no C=O.&quot;], [9, &quot;Ethanoic acid: very broad O\u2013H plus C=O at ~1720 cm\u207b\u00b9.&quot;]]" data-vd-dur="16">
<title id="ir-title">Infrared spectroscopy</title><desc id="ir-desc">Simplified infrared spectra of ethanol, with a broad O-H absorption near 3300 per centimetre and no C=O, and of ethanoic acid, with a very broad O-H from 2500 to 3300 and a strong C=O near 1720, plus a table of key absorptions.</desc>
