<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" class="vd-svg" role="img" aria-labelledby="vc-title vc-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="vc-play" data-vd-play-label="Play: how the cell makes a current" data-vd-steps="[[0, &quot;Two half-cells: zinc in zinc sulfate and copper in copper(II) sulfate, joined by a wire and a salt bridge.&quot;], [1.5, &quot;At the zinc anode (\u2212): Zn \u2192 Zn\u00b2\u207a + 2e\u207b (oxidation). Zinc atoms lose electrons and go into solution as ions.&quot;], [3.5, &quot;The electrons flow through the external wire from zinc to copper: the voltmeter reads about 1.10 V.&quot;], [6, &quot;At the copper cathode (+): Cu\u00b2\u207a + 2e\u207b \u2192 Cu (reduction). Copper ions gain electrons and copper is deposited.&quot;], [9, &quot;In the salt bridge, NO\u2083\u207b ions move towards the zinc half-cell and K\u207a ions towards the copper half-cell, so the circuit is complete.&quot;]]" data-vd-dur="14">
<title id="vc-title">Zinc–copper voltaic cell</title><desc id="vc-desc">A voltaic (galvanic) cell: zinc in zinc sulfate and copper in copper sulfate, a salt bridge and a voltmeter. Electrons flow from zinc to copper; zinc is oxidised and copper ions are reduced.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1200" height="640" fill="#ffffff"/>
<g aria-hidden="true"><animate id="vc-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<defs><marker id="vc-2563eb" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#2563eb"/></marker></defs>
<text class="head" x="30" y="34">A voltaic (galvanic) cell: zinc and copper</text><text class="note" x="30" y="56">Zn(s) | Zn²⁺(aq) || Cu²⁺(aq) | Cu(s)   E°cell = +1.10 V. Ions drawn much larger than real.</text>
<path d="M 120 300 L 120 560 Q 120 590 150 590 L 370 590 Q 400 590 400 560 L 400 300" fill="none" stroke="#334155" stroke-width="4"/><path d="M 800 300 L 800 560 Q 800 590 830 590 L 1050 590 Q 1080 590 1080 560 L 1080 300" fill="none" stroke="#334155" stroke-width="4"/>
<g class="part" data-part="zs" data-name="Zinc sulfate solution" data-info="Contains Zn²⁺(aq) ions (1 mol dm⁻³ under standard conditions)." tabindex="0" role="button" aria-label="Zinc sulfate solution"><rect x="122" y="360" width="276" height="228" fill="#f1f5f9"/><text x="260" y="575" text-anchor="middle" font-size="13">ZnSO₄(aq)</text></g>
<g class="part" data-part="cs" data-name="Copper(II) sulfate solution" data-info="Contains Cu²⁺(aq) ions; the blue colour fades as they are used up." tabindex="0" role="button" aria-label="Copper(II) sulfate solution"><rect x="802" y="360" width="276" height="228" fill="#93c5fd"><animate attributeName="fill" values="#93c5fd;#93c5fd;#cfe4fb;#cfe4fb" keyTimes="0;0.429;0.929;1" dur="14s" begin="vc-play.begin+0s" fill="freeze"/></rect><text x="940" y="575" text-anchor="middle" font-size="13">CuSO₄(aq)</text></g>
<g class="part" data-part="zn" data-name="Zinc electrode: anode (−)" data-info="Zinc is more reactive: it is oxidised, Zn(s) → Zn²⁺(aq) + 2e⁻. The electrode slowly dissolves." tabindex="0" role="button" aria-label="Zinc electrode: anode (−)"><rect x="240" y="230" width="40" height="300" fill="#a1a1aa" stroke="#3f3f46" stroke-width="2"><animate attributeName="width" values="40;40;30;30" keyTimes="0;0.107;0.929;1" dur="14s" begin="vc-play.begin+0s" fill="freeze"/><animate attributeName="x" values="240;240;245;245" keyTimes="0;0.107;0.929;1" dur="14s" begin="vc-play.begin+0s" fill="freeze"/></rect><text x="236" y="250" text-anchor="end" font-size="15" font-weight="800">Zn anode (−)</text></g>
<g class="part" data-part="cu" data-name="Copper electrode: cathode (+)" data-info="Copper(II) ions are reduced: Cu²⁺(aq) + 2e⁻ → Cu(s). Copper is deposited on the electrode." tabindex="0" role="button" aria-label="Copper electrode: cathode (+)"><rect x="920" y="230" width="40" height="300" fill="#ea580c" stroke="#7c2d12" stroke-width="2"><animate attributeName="width" values="40;40;52;52" keyTimes="0;0.429;0.929;1" dur="14s" begin="vc-play.begin+0s" fill="freeze"/><animate attributeName="x" values="920;920;914;914" keyTimes="0;0.429;0.929;1" dur="14s" begin="vc-play.begin+0s" fill="freeze"/></rect><text x="968" y="250" font-size="15" font-weight="800">Cu cathode (+)</text></g>
<g class="part" data-part="sb" data-name="Salt bridge (KNO₃)" data-info="Completes the circuit: anions (NO₃⁻) move towards the zinc half-cell and cations (K⁺) towards the copper half-cell, keeping the solutions neutral." tabindex="0" role="button" aria-label="Salt bridge (KNO₃)"><path d="M 330 590 L 330 300 Q 330 260 370 260 L 830 260 Q 870 260 870 300 L 870 590" fill="none" stroke="#e7e5e4" stroke-width="44" opacity="0"/><path d="M 340 520 L 340 300 Q 340 270 380 270 L 820 270 Q 860 270 860 300 L 860 520" fill="none" stroke="#78716c" stroke-width="40"/><path d="M 340 520 L 340 300 Q 340 270 380 270 L 820 270 Q 860 270 860 300 L 860 520" fill="none" stroke="#f5f5f4" stroke-width="32"/><text x="600" y="300" text-anchor="middle" font-size="13" font-weight="700">salt bridge (KNO₃)</text></g>
<g class="part" data-part="wire" data-name="External circuit" data-info="Electrons flow through the wire from the zinc (anode) to the copper (cathode)." tabindex="0" role="button" aria-label="External circuit"><path d="M 260 230 L 260 120 L 540 120 M 660 120 L 940 120 L 940 230" fill="none" stroke="#111827" stroke-width="4"/></g>
<g class="part" data-part="vm" data-name="Voltmeter" data-info="Measures the cell potential: about 1.10 V for zinc–copper under standard conditions." tabindex="0" role="button" aria-label="Voltmeter"><circle cx="600" cy="120" r="56" fill="#fff" stroke="#111827" stroke-width="4"/><text x="600" y="112" text-anchor="middle" font-size="18" font-weight="800">V</text><text x="600" y="140" text-anchor="middle" font-size="16" font-weight="700" fill="#15803d"><tspan>0.00 V</tspan><set attributeName="opacity" to="0" begin="vc-play.begin+3.5s"/></text><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.2500;0.2714;1.0000" values="0;0;1;1" dur="14s" begin="vc-play.begin+0s" fill="freeze"/><text x="600" y="140" text-anchor="middle" font-size="16" font-weight="700" fill="#15803d">1.10 V</text></g></g>
