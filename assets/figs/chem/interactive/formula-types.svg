<g class="part" data-part="name" data-name="Naming: butan-2-ol" data-info="Longest chain 4 C → but-; single bonds → -an-; –OH → -ol; number from the end that gives the lowest locant → 2." tabindex="0" role="button" aria-label="Naming: butan-2-ol"><rect x="60" y="380" width="980" height="150" rx="16" fill="#f8fafc" stroke="#cbd5e1"/><g><animate attributeName="opacity" keyTimes="0.0000;0.7667;0.7867;1.0000" values="0;0;1;1" dur="15s" begin="ft-play.begin+0s" fill="freeze"/><text x="190" y="440" text-anchor="middle" font-size="30" font-weight="800" fill="#1d4ed8">but</text><text x="190" y="480" text-anchor="middle" font-size="12" font-weight="700" fill="#475569">longest chain: 4 C</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.8067;0.8267;1.0000" values="0;0;1;1" dur="15s" begin="ft-play.begin+0s" fill="freeze"/><text x="430" y="440" text-anchor="middle" font-size="30" font-weight="800" fill="#16a34a">an</text><text x="430" y="480" text-anchor="middle" font-size="12" font-weight="700" fill="#475569">all C–C single</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.8467;0.8667;1.0000" values="0;0;1;1" dur="15s" begin="ft-play.begin+0s" fill="freeze"/><text x="670" y="440" text-anchor="middle" font-size="30" font-weight="800" fill="#b45309">2</text><text x="670" y="480" text-anchor="middle" font-size="12" font-weight="700" fill="#475569">position of –OH: lowest number</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.8867;0.9067;1.0000" values="0;0;1;1" dur="15s" begin="ft-play.begin+0s" fill="freeze"/><text x="910" y="440" text-anchor="middle" font-size="30" font-weight="800" fill="#dc2626">ol</text><text x="910" y="480" text-anchor="middle" font-size="12" font-weight="700" fill="#475569">alcohol suffix</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.9333;0.9533;1.0000" values="0;0;1;1" dur="15s" begin="ft-play.begin+0s" fill="freeze"/><text x="550" y="516" text-anchor="middle" font-size="16" font-weight="8