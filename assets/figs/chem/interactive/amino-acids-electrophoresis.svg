<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 580" class="vd-svg" role="img" aria-labelledby="aa2-title aa2-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="aa2-play" data-vd-play-label="Play: change the pH" data-vd-steps="[[0, &quot;Amino acids in solution.&quot;], [1, &quot;The zwitterion: both groups ionised.&quot;], [5, &quot;Change the pH: cation in acid, anion in alkali.&quot;], [10, &quot;Electrophoresis separates them by charge and size.&quot;]]" data-vd-dur="16">
<title id="aa2-title">Amino acids: zwitterions and electrophoresis</title><desc id="aa2-desc">An amino acid as a cation at low pH, a zwitterion at its isoelectric point and an anion at high pH, and an electrophoresis gel in which positive species move to the cathode and negative species to the anode.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="580" fill="#ffffff"/>
<g aria-hidden="true"><animate id="aa2-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<defs><marker id="aa2-475569" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="5.4" refY="6.0" orient="auto"><path d="M0,0 L12,6.0 L0,12 z" fill="#475569"/></marker></defs>
<text class="head" x="30" y="34">Amino acids: zwitterions, pH and electrophoresis</text><text class="note" x="30" y="56">Glycine: R = H.</text>
<g class="part" data-part="zw" data-name="Zwitterions" data-info="In the solid and near neutral pH, amino acids exist as H₃N⁺–CHR–COO⁻: high melting points and soluble in water (ionic)." tabindex="0" role="button" aria-label="Zwitterions"><g><animate attributeName="opacity" keyTimes="0.0000;0.3125;0.3312;1.0000" values="0;0;1;1" dur="16s" begin="aa2-play.begin+0s" fill="freeze"/><rect x="30" y="90" width="320" height="150" rx="16" fill="#fff" stroke="#dc2626" stroke-width="2"/><text x="190" y="118" text-anchor="middle" font-size="13" font-weight="800" fill="#dc2626">low pH (acid)</text><text x="190" y="168" text-anchor="middle" font-size="18" font-weight="800" fill="#111827">H₃N⁺–CH₂–COOH</text><text x="190" y="212" text-anchor="middle" font-size="14" font-weight="800" fill="#dc2626">cation</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.0625;0.0813;1.0000" values="0;0;1;1" dur="16s" begin="aa2-play.begin+0s" fill="freeze"/><rect x="390" y="90" width="320" height="150" rx="16" fill="#fff" stroke="#7c3aed" stroke-width="2"/><text x="550" y="118" text-anchor="middle" font-size="13" font-weight="800" fill="#7c3aed">isoelectric point</text><text x="550" y="168" text-anchor="middle" font-size="18" font-weight="800" fill="#111827">H₃N⁺–CH₂–COO⁻</text><text x="550" y="212" text-anchor="middle" font-size="14" font-weight="800" fill="#7c3aed">zwitterion</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.4062;0.4250;1.0000" values="0;0;1;1" dur="16s" begin="aa2-play.begin+0s" fill="freeze"/><rect x="750" y="90" width="320" height="150" rx="16" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="910" y="118" text-anchor="middle" font-size="13" font-weight="800" fill="#2563eb">high pH (alkali)</text><text x="910" y="168" text-anchor="middle" font-size="18" font-weight="800" fill="#111827">H₂N–CH₂–COO⁻</text><text x="910" y="212" text-anchor="middle" font-size="14" font-weight="800" fill="#2563eb">anion</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.4688;0.4875;1.0000" values="0;0;1;1" dur="16s" begin="aa2-play.begin+0s" fill="freeze"/><path d="M 375 165 L 395 165" stroke="#475569" stroke-width="3" marker-end="url(#aa2-475569)"/><path d="M 715 165 L 735 165" stroke="#475569" stroke-width="3" marker-end="url(#aa2-475569)"/></g></g>
<g class="part" data-part="ph" data-name="pH and the isoelectric point" data-info="Low pH: H₃N⁺–CHR–COOH (cation). High pH: H₂N–CHR–COO⁻ (anion). At the isoelectric point the zwitterion has no overall charge." tabindex="0" role="button" aria-label="pH and the isoelectric point"></g>
<g class="part" data-part="elec" data-name="Electrophoresis" data-info="On a gel at a fixed pH, cations move to the cathode (−), anions to the anode (+); neutral species stay. Smaller and more highly charged ions move further. Used to separate amino acids and peptides after hydrolysis." tabindex="0" role="button" aria-label="Electrophoresis"><rect x="80" y="300" width="940" height="150" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/><rect x="40" y="300" width="40" height="150" fill="#2563eb"/><text x="60" y="470" text-anchor="middle" font-size="12" font-weight="800" fill="#1d4ed8">− cathode</text><rect x="1020" y="300" width="40" height="150" fill="#dc2626"/><text x="1040" y="470" text-anchor="middle" font-size="12" font-weight="800" fill="#b91c1c">+ anode</text><line x1="550" y1="300" x2="550" y2="450" stroke="#475569" stroke-dasharray="5 4"/><text x="550" y="470" text-anchor="middle" font-size="11" font-weight="800" fill="#475569">start</text><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.6250;0.6375;1.0000" values="0;0;1;1" dur="16s" begin="aa2-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.6250;0.8438;1.0000" values="550 340;550 340;250 340;250 340" dur="16s" begin="aa2-play.begin+0s" fill="freeze"/><ellipse rx="26" ry="11" fill="#dc2626" opacity=".8"/></g></g><g><animate attributeName="opacity" keyTimes="0.0000;0.8438;0.8625;1.0000" values="0;0;1;1" dur="16s" begin="aa2-play.begin+0s" fill="freeze"/><text x="250" y="324" text-anchor="middle" font-size="12" font-weight="800" fill="#dc2626">lysine (+)</text></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.6250;0.6375;1.0000" values="0;0;1;1" dur="16s" begin="aa2-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.6250;0.8438;1.0000" values="550 375;550 375;550 375;550 375" dur="16s" begin="aa2-play.begin+0s" fill="freeze"/><ellipse rx="26" ry="11" fill="#7c3aed" opacity=".8"/></g></g><g><animate attributeName="opacity" keyTimes="0.0000;0.8438;0.8625;1.0000" values="0;0;1;1" dur="16s" begin="aa2-play.begin+0s" fill="freeze"/><text x="550" y="359" text-anchor="middle" font-size="12" font-weight="800" fill="#7c3aed">glycine (0)</text></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.6250;0.6375;1.0000" values="0;0;1;1" dur="16s" begin="aa2-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.6250;0.8438;1.0000" values="550 410;550 410;880 410;880 410" dur="16s" begin="aa2-play.begin+0s" fill="freeze"/><ellipse rx="26" ry="11" fill="#2563eb" opacity=".8"/></g></g><g><animate attributeName="opacity" keyTimes="0.0000;0.8438;0.8625;1.0000" values="0;0;1;1" dur="16s" begin="aa2-play.begin+0s" fill="freeze"/><text x="880" y="394" text-anchor="middle" font-size="12" font-weight="800" fill="#2563eb">aspartic acid (−)</text></g><text x="550" y="280" text-anchor="middle" font-size="14" font-weight="800" fill="#111827">electrophoresis at pH 6</text><g><animate attributeName="opacity" keyTimes="0.0000;0.8750;0.8938;1.0000" values="0;0;1;1" dur="16s" begin="aa2-play.begin+0s" fill="freeze"/><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.8750;0.8938;1.0000" values="0;0;1;1" dur="16s" begin="aa2-play.begin+0s" fill="freeze"/><rect x="250.0" y="528" width="600" height="24" rx="12" fill="#f1f5f9" stroke="#1f2937" stroke-width="1"/><text x="550" y="545" text-anchor="middle" font-size="12" font-weight="700">cations → cathode · anions → anode · smaller, more charged ions move further</text></g></g></g>
</svg>