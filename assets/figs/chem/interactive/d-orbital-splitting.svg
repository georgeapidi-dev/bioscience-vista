<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" class="vd-svg" role="img" aria-labelledby="ds-title ds-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="ds-play" data-vd-play-label="Play: absorb light" data-vd-steps="[[0, &quot;Why transition metal complexes are coloured.&quot;], [1, &quot;Ligands split the 3d orbitals.&quot;], [6, &quot;An electron absorbs light and jumps up.&quot;], [10, &quot;We see the complementary colour.&quot;]]" data-vd-dur="15">
<title id="ds-title">d-orbital splitting and colour</title><desc id="ds-desc">Five degenerate 3d orbitals split into three lower and two higher in an octahedral complex; an electron absorbs orange-red light to jump the energy gap; the solution appears pale blue, the complementary colour; colour wheel.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="560" fill="#ffffff"/>
<g aria-hidden="true"><animate id="ds-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<text class="head" x="30" y="34">Why complexes are coloured: d-orbital splitting</text><text class="note" x="30" y="56">Cu²⁺: 3d⁹. Octahedral splitting shown.</text>
<g class="part" data-part="split" data-name="Splitting" data-info="In an isolated ion the five 3d orbitals have equal energy. In an octahedral complex, ligand lone pairs repel the d orbitals pointing at them more: three lower and two higher, separated by ΔE." tabindex="0" role="button" aria-label="Splitting"><text x="170" y="110" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">free ion: 5 equal 3d</text><rect x="60" y="250" width="44" height="34" fill="#fff" stroke="#334155" stroke-width="2"/><text x="82" y="274" text-anchor="middle" font-size="16" font-weight="800" fill="#1d4ed8">↑↓</text><rect x="106" y="250" width="44" height="34" fill="#fff" stroke="#334155" stroke-width="2"/><text x="128" y="274" text-anchor="middle" font-size="16" font-weight="800" fill="#1d4ed8">↑↓</text><rect x="152" y="250" width="44" height="34" fill="#fff" stroke="#334155" stroke-width="2"/><text x="174" y="274" text-anchor="middle" font-size="16" font-weight="800" fill="#1d4ed8">↑↓</text><rect x="198" y="250" width="44" height="34" fill="#fff" stroke="#334155" stroke-width="2"/><text x="220" y="274" text-anchor="middle" font-size="16" font-weight="800" fill="#1d4ed8">↑↓</text><rect x="244" y="250" width="44" height="34" fill="#fff" stroke="#334155" stroke-width="2"/><text x="266" y="274" text-anchor="middle" font-size="16" font-weight="800" fill="#1d4ed8">↑</text><g><animate attributeName="opacity" keyTimes="0.0000;0.0667;0.0867;1.0000" values="0;0;1;1" dur="15s" begin="ds-play.begin+0s" fill="freeze"/><rect x="420" y="150" width="44" height="34" fill="#fff" stroke="#334155" stroke-width="2"/><text x="442" y="174" text-anchor="middle" font-size="16" font-weight="800" fill="#1d4ed8">↑↓</text><rect x="466" y="150" width="44" height="34" fill="#fff" stroke="#334155" stroke-width="2"/><text x="488" y="174" text-anchor="middle" font-size="16" font-weight="800" fill="#1d4ed8">↑</text><rect x="400" y="340" width="44" height="34" fill="#fff" stroke="#334155" stroke-width="2"/><text x="422" y="364" text-anchor="middle" font-size="16" font-weight="800" fill="#1d4ed8">↑↓</text><rect x="446" y="340" width="44" height="34" fill="#fff" stroke="#334155" stroke-width="2"/><text x="468" y="364" text-anchor="middle" font-size="16" font-weight="800" fill="#1d4ed8">↑↓</text><rect x="492" y="340" width="44" height="34" fill="#fff" stroke="#334155" stroke-width="2"/><text x="514" y="364" text-anchor="middle" font-size="16" font-weight="800" fill="#1d4ed8">↑↓</text><line x1="560" y1="167" x2="560" y2="357" stroke="#7c3aed" stroke-width="3"/><text x="572" y="266" text-anchor="start" font-size="16" font-weight="800" fill="#7c3aed">ΔE</text><text x="468" y="120" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">octahedral complex</text><path d="M 300 267 L 390 200 M 300 267 L 390 350" stroke="#94a3b8" stroke-dasharray="4 3"/></g></g>
<g class="part" data-part="abs" data-name="Absorption" data-info="An electron is promoted from a lower to a higher d orbital by absorbing light with energy ΔE = hf. [Cu(H₂O)₆]²⁺ absorbs orange-red light." tabindex="0" role="button" aria-label="Absorption"><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.4000;0.4133;0.5467;0.5600;1.0000" values="0;0;1;1;0;0" dur="15s" begin="ds-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.4000;0.5333;1.0000" values="470 340;470 340;490 155;490 155" dur="15s" begin="ds-play.begin+0s" fill="freeze"/><circle r="7" fill="#f59e0b" stroke="#b45309"/></g></g><g><animate attributeName="opacity" keyTimes="0.0000;0.4000;0.4200;1.0000" values="0;0;1;1" dur="15s" begin="ds-play.begin+0s" fill="freeze"/><path d="M 640 300 L 590 280" stroke="#f97316" stroke-width="6"/><text x="660" y="304" text-anchor="start" font-size="12" font-weight="800" fill="#c2410c">orange-red light absorbed</text><text x="660" y="322" text-anchor="start" font-size="12" font-weight="800" fill="#c2410c">ΔE = hf</text></g></g>
<g class="part" data-part="col" data-name="Observed colour" data-info="The colour seen is complementary to the light absorbed: Cu²⁺(aq) looks pale blue. Different ligands, oxidation states or coordination numbers change ΔE and so the colour. Sc³⁺ (3d⁰) and Zn²⁺ (3d¹⁰) are colourless: no d–d transition possible." tabindex="0" role="button" aria-label="Observed colour"><path d="M 900 230 L 850.0 143.4 A 100 100 0 0 1 950.0 143.4 Z" fill="#ef4444" opacity=".85"/><text x="900.0" y="164.0" text-anchor="middle" font-size="11" font-weight="800" fill="#fff">red</text><path d="M 900 230 L 950.0 143.4 A 100 100 0 0 1 1000.0 230.0 Z" fill="#f97316" opacity=".85"/><text x="960.6217782649107" y="199.0" text-anchor="middle" font-size="11" font-weight="800" fill="#fff">orange</text><path d="M 900 230 L 1000.0 230.0 A 100 100 0 0 1 950.0 316.6 Z" fill="#eab308" opacity=".85"/><text x="960.6217782649107" y="269.0" text-anchor="middle" font-size="11" font-weight="800" fill="#fff">yellow</text><path d="M 900 230 L 950.0 316.6 A 100 100 0 0 1 850.0 316.6 Z" fill="#22c55e" opacity=".85"/><text x="900.0" y="304.0" text-anchor="middle" font-size="11" font-weight="800" fill="#fff">green</text><path d="M 900 230 L 850.0 316.6 A 100 100 0 0 1 800.0 230.0 Z" fill="#3b82f6" opacity=".85"/><text x="839.3782217350893" y="269.0" text-anchor="middle" font-size="11" font-weight="800" fill="#fff">blue</text><path d="M 900 230 L 800.0 230.0 A 100 100 0 0 1 850.0 143.4 Z" fill="#8b5cf6" opacity=".85"/><text x="839.3782217350893" y="199.00000000000003" text-anchor="middle" font-size="11" font-weight="800" fill="#fff">violet</text><g><animate attributeName="opacity" keyTimes="0.0000;0.6667;0.6867;1.0000" values="0;0;1;1" dur="15s" begin="ds-play.begin+0s" fill="freeze"/><text x="900" y="360" text-anchor="middle" font-size="13" font-weight="800" fill="#1d4ed8">absorbs orange → appears blue</text><path d="M 860 400 L 860 500 Q 900 516 940 500 L 940 400" fill="#bfdbfe" stroke="#334155" stroke-width="2"/><text x="900" y="530" text-anchor="middle" font-size="12" font-weight="800" fill="#1d4ed8">[Cu(H₂O)₆]²⁺(aq)</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.8000;0.8200;1.0000" values="0;0;1;1" dur="15s" begin="ds-play.begin+0s" fill="freeze"/><rect x="40" y="430" width="740" height="110" rx="16" fill="#fef3c7" stroke="#fcd34d"/><text x="410" y="462" text-anchor="middle" font-size="13" font-weight="800" fill="#a16207">ΔE depends on: metal, oxidation state, ligand, coordination number (shape)</text><text x="410" y="492" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">colourless: Sc³⁺ 3d⁰ and Zn²⁺ / Cu⁺ 3d¹⁰ (no d–d transition)</text><text x="410" y="518" text-anchor="middle" font-size="12" font-weight="700" fill="#475569">colour seen = complementary to colour absorbed</text></g></g>
</svg>