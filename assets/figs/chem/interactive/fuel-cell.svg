<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 660" class="vd-svg" role="img" aria-labelledby="fc-title fc-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="fc-play" data-vd-play-label="Play: run the cell" data-vd-steps="[[0, &quot;A hydrogen\u2013oxygen fuel cell (acidic electrolyte).&quot;], [1, &quot;Hydrogen enters at the anode and is oxidised to H\u207a ions and electrons.&quot;], [4, &quot;Electrons flow through the external circuit and power the load.&quot;], [6.5, &quot;H\u207a ions pass through the membrane to the cathode.&quot;], [9, &quot;At the cathode oxygen is reduced and combines with H\u207a to make water.&quot;], [12, &quot;Overall: 2H\u2082 + O\u2082 \u2192 2H\u2082O, with only water as the product.&quot;]]" data-vd-dur="16">
<title id="fc-title">Hydrogen fuel cell</title><desc id="fc-desc">A hydrogen–oxygen fuel cell with a proton exchange membrane: hydrogen is oxidised at the anode, electrons flow through an external circuit, hydrogen ions cross the membrane, and oxygen is reduced at the cathode to form water.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1220" height="660" fill="#ffffff"/>
<g aria-hidden="true"><animate id="fc-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<defs><marker id="fc-475569" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="6.3" refY="7.0" orient="auto"><path d="M0,0 L14,7.0 L0,14 z" fill="#475569"/></marker></defs>
<text class="head" x="30" y="34">The hydrogen fuel cell</text><text class="note" x="30" y="56">Proton exchange membrane (PEM) type, acidic electrolyte.</text>
<rect x="200" y="200" width="820" height="360" rx="16" fill="#f8fafc" stroke="#334155" stroke-width="3"/>
<g class="part" data-part="an" data-name="Anode (negative electrode)" data-info="Hydrogen is oxidised: H₂ → 2H⁺ + 2e⁻. A platinum catalyst helps." tabindex="0" role="button" aria-label="Anode (negative electrode)"><rect x="420" y="210" width="40" height="340" fill="#475569"/><text x="440" y="580" text-anchor="middle" font-size="14" font-weight="800" fill="#111827">anode (−)</text><text x="440" y="600" text-anchor="middle" font-size="13" font-weight="800" fill="#1d4ed8">H₂ → 2H⁺ + 2e⁻</text></g>
<g class="part" data-part="cat" data-name="Cathode (positive electrode)" data-info="Oxygen is reduced: O₂ + 4H⁺ + 4e⁻ → 2H₂O." tabindex="0" role="button" aria-label="Cathode (positive electrode)"><rect x="760" y="210" width="40" height="340" fill="#475569"/><text x="780" y="580" text-anchor="middle" font-size="14" font-weight="800" fill="#111827">cathode (+)</text><text x="780" y="600" text-anchor="middle" font-size="13" font-weight="800" fill="#b91c1c">O₂ + 4H⁺ + 4e⁻ → 2H₂O</text></g>
<g class="part" data-part="mem" data-name="Electrolyte membrane" data-info="A proton exchange membrane lets H⁺ ions through but not electrons or gases." tabindex="0" role="button" aria-label="Electrolyte membrane"><rect x="580" y="210" width="60" height="340" fill="#fde68a" stroke="#ca8a04" stroke-width="2"/><text x="610" y="192" text-anchor="middle" font-size="13" font-weight="800" fill="#92400e">membrane</text></g>
<g class="part" data-part="h2" data-name="Hydrogen in" data-info="Fuel supplied continuously, unlike a battery." tabindex="0" role="button" aria-label="Hydrogen in"><path d="M 60 300 L 200 300" stroke="#3b82f6" stroke-width="18"/><text x="120" y="286" text-anchor="middle" font-size="14" font-weight="800" fill="#1d4ed8">H₂ in</text><path d="M 200 460 L 60 460" stroke="#93c5fd" stroke-width="14"/><text x="120" y="446" text-anchor="middle" font-size="12" font-weight="700" fill="#475569">unused H₂</text></g>
<path d="M 1020 300 L 1160 300" stroke="#ef4444" stroke-width="18"/><text x="1100" y="286" text-anchor="middle" font-size="14" font-weight="800" fill="#b91c1c">O₂ (air) in</text><path d="M 1020 460 L 1160 460" stroke="#93c5fd" stroke-width="14"/><text x="1100" y="446" text-anchor="middle" font-size="14" font-weight="800" fill="#1d4ed8">H₂O out</text>
<g class="part" data-part="circ" data-name="External circuit" data-info="Electrons flow from anode to cathode through the load (e.g. a motor), doing useful work." tabindex="0" role="button" aria-label="External circuit"><path d="M 440 210 L 440 120 L 780 120 L 780 210" fill="none" stroke="#111827" stroke-width="4"/><circle cx="610" cy="120" r="30" fill="#fff" stroke="#111827" stroke-width="3"/><text x="610" y="126" text-anchor="middle" font-size="18" font-weight="800" fill="#111827">M</text><text x="610" y="84" text-anchor="middle" font-size="12" font-weight="800" fill="#334155">load (motor)</text></g>
