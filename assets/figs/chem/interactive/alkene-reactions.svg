<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 640" class="vd-svg" role="img" aria-labelledby="ar-title ar-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="ar-play" data-vd-play-label="Play: react ethene" data-vd-steps="[[0, &quot;Reactions of alkenes, using ethene.&quot;], [1, &quot;Additions: H\u2082, steam, HBr, Br\u2082.&quot;], [9, &quot;Oxidation with KMnO\u2084: cold gives a diol; hot breaks the C=C.&quot;]]" data-vd-dur="16">
<title id="ar-title">Reactions of alkenes</title><desc id="ar-desc">A reaction map for ethene: hydrogenation to ethane, hydration to ethanol, addition of HBr and bromine, oxidation by cold dilute potassium manganate seven to the diol, and by hot concentrated manganate seven breaking the double bond.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="640" fill="#ffffff"/>
<g aria-hidden="true"><animate id="ar-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<defs><marker id="ar-475569" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="5.4" refY="6.0" orient="auto"><path d="M0,0 L12,6.0 L0,12 z" fill="#475569"/></marker></defs>
<text class="head" x="30" y="34">Reactions of alkenes (ethene)</text><text class="note" x="30" y="56">Reagents and conditions on each arrow.</text>
<g class="part" data-part="map" data-name="Reactions of ethene" data-info="Addition of H₂, H₂O, HX and X₂; oxidation with KMnO₄ (cold: diol; hot, concentrated: the C=C is broken)." tabindex="0" role="button" aria-label="Reactions of ethene"><circle cx="550" cy="320" r="70" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="550" y="316" text-anchor="middle" font-size="16" font-weight="800" fill="#14532d">CH₂=CH₂</text><text x="550" y="338" text-anchor="middle" font-size="12" font-weight="700" fill="#14532d">ethene</text><g><animate attributeName="opacity" keyTimes="0.0000;0.0625;0.0813;1.0000" values="0;0;1;1" dur="16s" begin="ar-play.begin+0s" fill="freeze"/><path d="M 550 246 L 550 150" stroke="#475569" stroke-width="3" marker-end="url(#ar-475569)"/><rect x="400" y="70" width="300" height="80" rx="14" fill="#fff" stroke="#16a34a" stroke-width="2"/><text x="550.0" y="96.0" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">ethane</text><text x="550.0" y="116.0" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">H₂, Ni catalyst, 140 °C</text><text x="550.0" y="136.0" text-anchor="middle" font-size="11" font-weight="800" fill="#15803d">hydrogenation (margarine)</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.1437;0.1625;1.0000" values="0;0;1;1" dur="16s" begin="ar-play.begin+0s" fill="freeze"/><path d="M 614 283 L 758 235" stroke="#475569" stroke-width="3" marker-end="url(#ar-475569)"/><rect x="712" y="175" width="300" height="80" rx="14" fill="#fff" stroke="#16a34a" stroke-width="2"/><text x="861.7691453623979" y="201.0" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">ethanol</text><text x="861.7691453623979" y="221.0" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">steam, H₃PO₄, 300 °C, 6 MPa</text><text x="861.7691453623979" y="241.0" text-anchor="middle" font-size="11" font-weight="800" fill="#15803d">hydration</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.2250;0.2437;1.0000" values="0;0;1;1" dur="16s" begin="ar-play.begin+0s" fill="freeze"/><path d="M 614 357 L 758 405" stroke="#475569" stroke-width="3" marker-end="url(#ar-475569)"/><rect x="712" y="385" width="300" height="80" rx="14" fill="#fff" stroke="#16a34a" stroke-width="2"/><text x="861.7691453623979" y="411.0" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">bromoethane</text><text x="861.7691453623979" y="431.0" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">HBr(g), room temp</text><text x="861.7691453623979" y="451.0" text-anchor="middle" font-size="11" font-weight="800" fill="#15803d">electrophilic addition</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.3063;0.3250;1.0000" values="0;0;1;1" dur="16s" begin="ar-play.begin+0s" fill="freeze"/><path d="M 550 394 L 550 490" stroke="#475569" stroke-width="3" marker-end="url(#ar-475569)"/><rect x="400" y="490" width="300" height="80" rx="14" fill="#fff" stroke="#16a34a" stroke-width="2"/><text x="550.0" y="516.0" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">1,2-dibromoethane</text><text x="550.0" y="536.0" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">Br₂(aq)</text><text x="550.0" y="556.0" text-anchor="middle" font-size="11" font-weight="800" fill="#15803d">orange → colourless: test</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.5875;0.6063;1.0000" values="0;0;1;1" dur="16s" begin="ar-play.begin+0s" fill="freeze"/><path d="M 486 357 L 342 405" stroke="#475569" stroke-width="3" marker-end="url(#ar-475569)"/><rect x="88" y="385" width="300" height="80" rx="14" fill="#fff" stroke="#7c3aed" stroke-width="2"/><text x="238.23085463760208" y="411.0" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">ethane-1,2-diol</text><text x="238.23085463760208" y="431.0" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">cold dilute acidified KMnO₄</text><text x="238.23085463760208" y="451.0" text-anchor="middle" font-size="11" font-weight="800" fill="#7c3aed">purple → colourless</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.6875;0.7063;1.0000" values="0;0;1;1" dur="16s" begin="ar-play.begin+0s" fill="freeze"/><path d="M 486 283 L 342 235" stroke="#475569" stroke-width="3" marker-end="url(#ar-475569)"/><rect x="88" y="175" width="300" height="80" rx="14" fill="#fff" stroke="#7c3aed" stroke-width="2"/><text x="238.23085463760208" y="200.99999999999997" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">C=C split: ketones / carboxylic acids / CO₂</text><text x="238.23085463760208" y="220.99999999999997" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">hot conc. acidified KMnO₄</text><text x="238.23085463760208" y="240.99999999999997" text-anchor="middle" font-size="11" font-weight="800" fill="#7c3aed">locates the C=C</text></g></g>
<g class="part" data-part="hot" data-name="Finding the double bond" data-info="Hot KMnO₄ products: R₂C= → ketone; RCH= → carboxylic acid; CH₂= → CO₂ + H₂O." tabindex="0" role="button" aria-label="Finding the double bond"><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.8125;0.8313;1.0000" values="0;0;1;1" dur="16s" begin="ar-play.begin+0s" fill="freeze"/><rect x="270.0" y="608" width="560" height="24" rx="12" fill="#ede9fe" stroke="#1f2937" stroke-width="1"/><text x="550" y="625" text-anchor="middle" font-size="12" font-weight="700">hot KMnO₄: R₂C= → ketone · RCH= → acid · CH₂= → CO₂ + H₂O</text></g></g>
</svg>