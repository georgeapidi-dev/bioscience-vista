<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 540" class="vd-svg" role="img" aria-labelledby="dr2-title dr2-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="dr2-play" data-vd-play-label="Play: direct the group" data-vd-steps="[[0, &quot;Where does a second group go?&quot;], [1, &quot;Electron-donating groups activate the ring and direct to 2 and 4.&quot;], [6.5, &quot;Electron-withdrawing groups deactivate it and direct to 3.&quot;], [11, &quot;Plan the order of steps in a synthesis.&quot;]]" data-vd-dur="14">
<title id="dr2-title">Directing effects</title><desc id="dr2-desc">Methylbenzene with an electron-donating methyl group directs substitution to positions 2 and 4 and activates the ring; nitrobenzene with an electron-withdrawing nitro group directs to position 3 and deactivates the ring.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="540" fill="#ffffff"/>
<g aria-hidden="true"><animate id="dr2-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<text class="head" x="30" y="34">Directing effects in substituted benzenes</text><text class="note" x="30" y="56">Position 1 = the carbon carrying the existing group.</text>
<g class="part" data-part="act" data-name="2,4-directing, activating" data-info="–OH, –NH₂, –CH₃ (and other alkyl groups) donate electron density into the ring, making it more reactive and directing new groups to positions 2 and 4 (and 6)." tabindex="0" role="button" aria-label="2,4-directing, activating"><g><animate attributeName="opacity" keyTimes="0.0000;0.0714;0.0929;1.0000" values="0;0;1;1" dur="14s" begin="dr2-play.begin+0s" fill="freeze"/><rect x="30" y="80" width="510" height="380" rx="16" fill="#f8fafc" stroke="#15803d" stroke-width="2"/><text x="285" y="106" text-anchor="middle" font-size="15" font-weight="800" fill="#15803d">activating: –CH₃, –OH, –NH₂</text><polygon points="285.0,208.0 338.7,239.0 338.7,301.0 285.0,332.0 231.3,301.0 231.3,239.0" fill="#fff" stroke="#111827" stroke-width="4"/><circle cx="285" cy="270" r="37" fill="none" stroke="#111827" stroke-width="3"/><line x1="285" y1="208" x2="285" y2="172" stroke="#111827" stroke-width="4"/><text x="285.0" y="170.0" text-anchor="middle" font-size="15" font-weight="800" fill="#15803d">CH₃</text><text x="361.21023553303064" y="231.0" text-anchor="middle" font-size="12" font-weight="800" fill="#64748b">2</text><g><animate attributeName="opacity" keyTimes="0.0000;0.1071;0.1286;1.0000" values="0;0;1;1" dur="14s" begin="dr2-play.begin+0s" fill="freeze"/><circle cx="339" cy="239" r="14" fill="#15803d" opacity=".35"/></g><text x="361.21023553303064" y="319.0" text-anchor="middle" font-size="12" font-weight="800" fill="#64748b">3</text><text x="285.0" y="363.0" text-anchor="middle" font-size="12" font-weight="800" fill="#64748b">4</text><g><animate attributeName="opacity" keyTimes="0.0000;0.1071;0.1286;1.0000" values="0;0;1;1" dur="14s" begin="dr2-play.begin+0s" fill="freeze"/><circle cx="285" cy="332" r="14" fill="#15803d" opacity=".35"/></g><text x="208.7897644669694" y="319.0" text-anchor="middle" font-size="12" font-weight="800" fill="#64748b">5</text><text x="208.78976446696942" y="231.0" text-anchor="middle" font-size="12" font-weight="800" fill="#64748b">6</text><g><animate attributeName="opacity" keyTimes="0.0000;0.1071;0.1286;1.0000" values="0;0;1;1" dur="14s" begin="dr2-play.begin+0s" fill="freeze"/><circle cx="231" cy="239" r="14" fill="#15803d" opacity=".35"/></g><g><animate attributeName="opacity" keyTimes="0.0000;0.1429;0.1643;1.0000" values="0;0;1;1" dur="14s" begin="dr2-play.begin+0s" fill="freeze"/><text x="285" y="400" text-anchor="middle" font-size="13" font-weight="800" fill="#15803d">new group goes to 2 and 4 (6): faster than benzene</text></g></g></g>
<g class="part" data-part="deact" data-name="3-directing, deactivating" data-info="–NO₂, –COOH, –CHO, –COR withdraw electron density, making the ring less reactive and directing new groups to position 3 (and 5)." tabindex="0" role="button" aria-label="3-directing, deactivating"><g><animate attributeName="opacity" keyTimes="0.0000;0.4643;0.4857;1.0000" values="0;0;1;1" dur="14s" begin="dr2-play.begin+0s" fill="freeze"/><rect x="560" y="80" width="510" height="380" rx="16" fill="#f8fafc" stroke="#b91c1c" stroke-width="2"/><text x="815" y="106" text-anchor="middle" font-size="15" font-weight="800" fill="#b91c1c">deactivating: –NO₂, –COOH, –CHO</text><polygon points="815.0,208.0 868.7,239.0 868.7,301.0 815.0,332.0 761.3,301.0 761.3,239.0" fill="#fff" stroke="#111827" stroke-width="4"/><circle cx="815" cy="270" r="37" fill="none" stroke="#111827" stroke-width="3"/><line x1="815" y1="208" x2="815" y2="172" stroke="#111827" stroke-width="4"/><text x="815.0" y="170.0" text-anchor="middle" font-size="15" font-weight="800" fill="#b91c1c">NO₂</text><text x="891.2102355330306" y="231.0" text-anchor="middle" font-size="12" font-weight="800" fill="#64748b">2</text><text x="891.2102355330306" y="319.0" text-anchor="middle" font-size="12" font-weight="800" fill="#64748b">3</text><g><animate attributeName="opacity" keyTimes="0.0000;0.5000;0.5214;1.0000" values="0;0;1;1" dur="14s" begin="dr2-play.begin+0s" fill="freeze"/><circle cx="869" cy="301" r="14" fill="#b91c1c" opacity=".35"/></g><text x="815.0" y="363.0" text-anchor="middle" font-size="12" font-weight="800" fill="#64748b">4</text><text x="738.7897644669694" y="319.0" text-anchor="middle" font-size="12" font-weight="800" fill="#64748b">5</text><g><animate attributeName="opacity" keyTimes="0.0000;0.5000;0.5214;1.0000" values="0;0;1;1" dur="14s" begin="dr2-play.begin+0s" fill="freeze"/><circle cx="761" cy="301" r="14" fill="#b91c1c" opacity=".35"/></g><text x="738.7897644669694" y="231.0" text-anchor="middle" font-size="12" font-weight="800" fill="#64748b">6</text><g><animate attributeName="opacity" keyTimes="0.0000;0.5357;0.5571;1.0000" values="0;0;1;1" dur="14s" begin="dr2-play.begin+0s" fill="freeze"/><text x="815" y="400" text-anchor="middle" font-size="13" font-weight="800" fill="#b91c1c">new group goes to 3 (5): slower than benzene</text></g></g></g>
<g class="part" data-part="use" data-name="Using it" data-info="Order matters in synthesis: nitrate methylbenzene → 2- and 4-nitromethylbenzene; nitrate nitrobenzene (hotter) → 1,3-dinitrobenzene." tabindex="0" role="button" aria-label="Using it"><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.7857;0.8071;1.0000" values="0;0;1;1" dur="14s" begin="dr2-play.begin+0s" fill="freeze"/><rect x="380.0" y="493" width="340" height="24" rx="12" fill="#fef3c7" stroke="#1f2937" stroke-width="1"/><text x="550" y="510" text-anchor="middle" font-size="12" font-weight="700">synthesis: choose which group to add first</text></g></g>
</svg>