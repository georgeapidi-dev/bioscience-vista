<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 540" class="vd-svg" role="img" aria-labelledby="lf-title lf-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="lf-play" data-vd-play-label="Play: compare lattices" data-vd-steps="[[0, &quot;What makes lattice energy large?&quot;], [1, &quot;Charge: MgO is nearly five times NaCl.&quot;], [6, &quot;Radius: smaller ions, stronger attraction.&quot;], [10.5, &quot;Higher melting point.&quot;]]" data-vd-dur="13">
<title id="lf-title">Factors affecting lattice energy</title><desc id="lf-desc">Bar charts comparing lattice energies: magnesium oxide much more exothermic than sodium chloride because of higher ionic charges, and sodium fluoride, sodium chloride and potassium chloride decreasing as ionic radius increases.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="540" fill="#ffffff"/>
<g aria-hidden="true"><animate id="lf-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<text class="head" x="30" y="34">What decides the size of a lattice energy?</text><text class="note" x="30" y="56">ΔH⦵latt / kJ mol⁻¹ (size of the exothermic value shown).</text>
<g class="part" data-part="charge" data-name="Ionic charge" data-info="Doubling both charges (Na⁺Cl⁻ → Mg²⁺O²⁻) makes lattice energy far more exothermic: −787 → −3791 kJ mol⁻¹. Force ∝ product of charges." tabindex="0" role="button" aria-label="Ionic charge"><rect x="30" y="80" width="500" height="390" rx="16" fill="#f8fafc" stroke="#cbd5e1"/><text x="280" y="106" text-anchor="middle" font-size="14" font-weight="800" fill="#b91c1c">charge: 1+/1− vs 2+/2−</text><line x1="110" y1="430" x2="650" y2="430" stroke="#111827" stroke-width="2"/><rect x="210" y="375" width="120" height="55" fill="#94a3b8" stroke="#334155"><animate attributeName="height" keyTimes="0.0000;0.0769;0.1231;1.0000" values="0;0;55.09;55.09" dur="13s" begin="lf-play.begin+0s" fill="freeze"/><animate attributeName="y" keyTimes="0.0000;0.0769;0.1231;1.0000" values="430;430;374.90999999999997;374.90999999999997" dur="13s" begin="lf-play.begin+0s" fill="freeze"/></rect><g><animate attributeName="opacity" keyTimes="0.0000;0.1231;0.1462;1.0000" values="0;0;1;1" dur="13s" begin="lf-play.begin+0s" fill="freeze"/><text x="270.0" y="366.90999999999997" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">−787</text></g><text x="270.0" y="448" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">NaCl</text><rect x="430" y="165" width="120" height="265" fill="#ef4444" stroke="#334155"><animate attributeName="height" keyTimes="0.0000;0.1538;0.2000;1.0000" values="0;0;265.37;265.37" dur="13s" begin="lf-play.begin+0s" fill="freeze"/><animate attributeName="y" keyTimes="0.0000;0.1538;0.2000;1.0000" values="430;430;164.63;164.63" dur="13s" begin="lf-play.begin+0s" fill="freeze"/></rect><g><animate attributeName="opacity" keyTimes="0.0000;0.2000;0.2231;1.0000" values="0;0;1;1" dur="13s" begin="lf-play.begin+0s" fill="freeze"/><text x="490.0" y="156.63" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">−3791</text></g><text x="490.0" y="448" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">MgO</text></g>
<g class="part" data-part="radius" data-name="Ionic radius" data-info="Smaller ions sit closer together, so the attraction is stronger: NaF −923 &gt; NaCl −787 &gt; KCl −701 kJ mol⁻¹." tabindex="0" role="button" aria-label="Ionic radius"><rect x="570" y="80" width="500" height="390" rx="16" fill="#f8fafc" stroke="#cbd5e1"/><text x="820" y="106" text-anchor="middle" font-size="14" font-weight="800" fill="#1d4ed8">radius: same charges, bigger ions</text><line x1="620" y1="430" x2="1110" y2="430" stroke="#111827" stroke-width="2"/><rect x="660" y="172" width="110" height="258" fill="#2563eb" stroke="#334155"><animate attributeName="height" keyTimes="0.0000;0.4615;0.5077;1.0000" values="0;0;258.44;258.44" dur="13s" begin="lf-play.begin+0s" fill="freeze"/><animate attributeName="y" keyTimes="0.0000;0.4615;0.5077;1.0000" values="430;430;171.56;171.56" dur="13s" begin="lf-play.begin+0s" fill="freeze"/></rect><g><animate attributeName="opacity" keyTimes="0.0000;0.5077;0.5308;1.0000" values="0;0;1;1" dur="13s" begin="lf-play.begin+0s" fill="freeze"/><text x="715.0" y="163.56" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">−923</text></g><text x="715.0" y="448" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">NaF</text><rect x="810" y="210" width="110" height="220" fill="#60a5fa" stroke="#334155"><animate attributeName="height" keyTimes="0.0000;0.5385;0.5846;1.0000" values="0;0;220.36;220.36" dur="13s" begin="lf-play.begin+0s" fill="freeze"/><animate attributeName="y" keyTimes="0.0000;0.5385;0.5846;1.0000" values="430;430;209.64;209.64" dur="13s" begin="lf-play.begin+0s" fill="freeze"/></rect><g><animate attributeName="opacity" keyTimes="0.0000;0.5846;0.6077;1.0000" values="0;0;1;1" dur="13s" begin="lf-play.begin+0s" fill="freeze"/><text x="865.0" y="201.64" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">−787</text></g><text x="865.0" y="448" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">NaCl</text><rect x="960" y="234" width="110" height="196" fill="#bfdbfe" stroke="#334155"><animate attributeName="height" keyTimes="0.0000;0.6154;0.6615;1.0000" values="0;0;196.28;196.28" dur="13s" begin="lf-play.begin+0s" fill="freeze"/><animate attributeName="y" keyTimes="0.0000;0.6154;0.6615;1.0000" values="430;430;233.72;233.72" dur="13s" begin="lf-play.begin+0s" fill="freeze"/></rect><g><animate attributeName="opacity" keyTimes="0.0000;0.6615;0.6846;1.0000" values="0;0;1;1" dur="13s" begin="lf-play.begin+0s" fill="freeze"/><text x="1015.0" y="225.72" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">−701</text></g><text x="1015.0" y="448" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">KCl</text></g>
<g class="part" data-part="prop" data-name="Consequences" data-info="More exothermic lattice energy → higher melting point and lower solubility tendency." tabindex="0" role="button" aria-label="Consequences"><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.8077;0.8308;1.0000" values="0;0;1;1" dur="13s" begin="lf-play.begin+0s" fill="freeze"/><rect x="230.0" y="493" width="640" height="24" rx="12" fill="#fef3c7" stroke="#1f2937" stroke-width="1"/><text x="550" y="510" text-anchor="middle" font-size="12" font-weight="700">larger charge, smaller ions → more exothermic lattice energy → higher melting point</text></g></g>
</svg>