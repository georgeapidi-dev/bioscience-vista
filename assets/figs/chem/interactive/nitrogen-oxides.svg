<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" class="vd-svg" role="img" aria-labelledby="ni-title ni-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="ni-play" data-vd-play-label="Play: nitrogen chemistry" data-vd-steps="[[0, &quot;Nitrogen and its compounds.&quot;], [1, &quot;N\u2261N: a very strong triple bond: unreactive.&quot;], [4.5, &quot;Ammonia is a base; test for ammonium ions.&quot;], [9, &quot;Engines make NO; catalytic converters remove it.&quot;]]" data-vd-dur="15">
<title id="ni-title">Nitrogen, ammonia and NOx</title><desc id="ni-desc">The strong nitrogen triple bond, ammonia accepting a proton to form ammonium and the warm-with-NaOH test turning red litmus blue, and nitrogen monoxide formed in engines removed in catalytic converters, with roles in acid rain and photochemical smog.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="560" fill="#ffffff"/>
<g aria-hidden="true"><animate id="ni-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<defs><marker id="ni-475569" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="6.3" refY="7.0" orient="auto"><path d="M0,0 L14,7.0 L0,14 z" fill="#475569"/></marker></defs>
<text class="head" x="30" y="34">Nitrogen, ammonia and oxides of nitrogen</text><text class="note" x="30" y="56">From the syllabus.</text>
<g class="part" data-part="n2" data-name="Unreactive nitrogen" data-info="N≡N triple bond (945 kJ mol⁻¹) is very strong, and N₂ is non-polar." tabindex="0" role="button" aria-label="Unreactive nitrogen"><g><animate attributeName="opacity" keyTimes="0.0000;0.0667;0.0867;1.0000" values="0;0;1;1" dur="15s" begin="ni-play.begin+0s" fill="freeze"/><circle cx="140" cy="180" r="24" fill="#3b82f6" stroke="#1f2937" stroke-width="1.5"/><text x="140" y="185" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">N</text><line x1="164.0" y1="186.4" x2="236.0" y2="186.4" stroke="#334155" stroke-width="3"/><line x1="164.0" y1="180.0" x2="236.0" y2="180.0" stroke="#334155" stroke-width="3"/><line x1="164.0" y1="173.6" x2="236.0" y2="173.6" stroke="#334155" stroke-width="3"/><circle cx="260" cy="180" r="24" fill="#3b82f6" stroke="#1f2937" stroke-width="1.5"/><text x="260" y="185" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">N</text><text x="200" y="240" text-anchor="middle" font-size="13" font-weight="800" fill="#1d4ed8">N≡N 945 kJ mol⁻¹</text><text x="200" y="262" text-anchor="middle" font-size="12" font-weight="700" fill="#475569">very strong, non-polar</text></g></g>
<g class="part" data-part="nh3" data-name="Ammonia and ammonium" data-info="NH₃ is a Brønsted base: NH₃ + H⁺ → NH₄⁺. Test for NH₄⁺: warm with NaOH(aq) → NH₃, turns damp red litmus blue." tabindex="0" role="button" aria-label="Ammonia and ammonium"><g><animate attributeName="opacity" keyTimes="0.0000;0.3000;0.3200;1.0000" values="0;0;1;1" dur="15s" begin="ni-play.begin+0s" fill="freeze"/><path d="M 420 110 L 420 280 Q 450 300 480 280 L 480 110" fill="#f8fafc" stroke="#334155" stroke-width="2"/><rect x="422" y="220" width="56" height="62" fill="#e0e7ff"/><text x="450" y="320" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">NH₄⁺ + NaOH, warm</text><rect x="520" y="100" width="16" height="70" fill="#f87171"><animate attributeName="fill" keyTimes="0.0000;0.4333;0.5000;1.0000" values="#f87171;#f87171;#60a5fa;#60a5fa" dur="15s" begin="ni-play.begin+0s" fill="freeze"/></rect><text x="528" y="92" text-anchor="middle" font-size="11" font-weight="800" fill="#111827">damp red litmus</text><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.3333;0.3467;0.4467;0.4600;1.0000" values="0;0;1;1;0;0" dur="15s" begin="ni-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.3333;0.4333;1.0000" values="450 220;450 220;528 140;528 140" dur="15s" begin="ni-play.begin+0s" fill="freeze"/><circle r="5" fill="#3b82f6" opacity=".7"/></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.3533;0.3667;0.4667;0.4800;1.0000" values="0;0;1;1;0;0" dur="15s" begin="ni-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.3533;0.4533;1.0000" values="450 220;450 220;528 140;528 140" dur="15s" begin="ni-play.begin+0s" fill="freeze"/><circle r="5" fill="#3b82f6" opacity=".7"/></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.3733;0.3867;0.4867;0.5000;1.0000" values="0;0;1;1;0;0" dur="15s" begin="ni-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.3733;0.4733;1.0000" values="450 220;450 220;528 140;528 140" dur="15s" begin="ni-play.begin+0s" fill="freeze"/><circle r="5" fill="#3b82f6" opacity=".7"/></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.3933;0.4067;0.5067;0.5200;1.0000" values="0;0;1;1;0;0" dur="15s" begin="ni-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.3933;0.4933;1.0000" values="450 220;450 220;528 140;528 140" dur="15s" begin="ni-play.begin+0s" fill="freeze"/><circle r="5" fill="#3b82f6" opacity=".7"/></g></g><text x="450" y="350" text-anchor="middle" font-size="14" font-weight="800" fill="#1d4ed8">NH₃ + H⁺ → NH₄⁺</text><g><animate attributeName="opacity" keyTimes="0.0000;0.5000;0.5200;1.0000" values="0;0;1;1" dur="15s" begin="ni-play.begin+0s" fill="freeze"/><text x="620" y="150" text-anchor="start" font-size="12" font-weight="800" fill="#1d4ed8">→ blue: NH₃ (alkaline)</text></g></g></g>
<g class="part" data-part="nox" data-name="Oxides of nitrogen" data-info="Formed in engines: N₂ + O₂ → 2NO at high temperature. Catalytic converters: 2CO + 2NO → 2CO₂ + N₂. NO₂ catalyses SO₂ → SO₃ (acid rain); NO reacts with unburnt hydrocarbons in sunlight → photochemical smog, including PAN." tabindex="0" role="button" aria-label="Oxides of nitrogen"><rect x="30" y="380" width="1040" height="160" rx="16" fill="#fff7ed" stroke="#fdba74"/><g><animate attributeName="opacity" keyTimes="0.0000;0.6000;0.6200;1.0000" values="0;0;1;1" dur="15s" begin="ni-play.begin+0s" fill="freeze"/><rect x="50.0" y="405.0" width="220" height="70" rx="12" fill="#fff" stroke="#c2410c" stroke-width="2"/><text x="160" y="438" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">engine: N₂ + O₂ → 2NO</text><text x="160" y="456" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">high temperature</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.6667;0.6867;1.0000" values="0;0;1;1" dur="15s" begin="ni-play.begin+0s" fill="freeze"/><path d="M 272 440 L 380 440" stroke="#475569" stroke-width="3" marker-end="url(#ni-475569)"/><rect x="385.0" y="405.0" width="250" height="70" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="510" y="438" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">catalytic converter</text><text x="510" y="456" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">2CO + 2NO → 2CO₂ + N₂</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.7667;0.7867;1.0000" values="0;0;1;1" dur="15s" begin="ni-play.begin+0s" fill="freeze"/><rect x="710.0" y="395.0" width="300" height="50" rx="12" fill="#fff" stroke="#b91c1c" stroke-width="2"/><text x="860" y="423.6666666666667" text-anchor="middle" font-size="11" font-weight="800" fill="#111827">acid rain: NO₂ catalyses SO₂ → SO₃</text><rect x="710.0" y="465.0" width="300" height="50" rx="12" fill="#fff" stroke="#b91c1c" stroke-width="2"/><text x="860" y="493.6666666666667" text-anchor="middle" font-size="11" font-weight="800" fill="#111827">smog: NO + hydrocarbons + light → PAN</text></g></g>
</svg>