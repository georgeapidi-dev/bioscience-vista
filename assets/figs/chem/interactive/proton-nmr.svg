<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 580" class="vd-svg" role="img" aria-labelledby="hn-title hn-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="hn-play" data-vd-play-label="Play: read the spectrum" data-vd-steps="[[0, &quot;\u00b9H NMR: ethyl ethanoate.&quot;], [1, &quot;Three proton environments: three peaks.&quot;], [5, &quot;Peak areas 3 : 2 : 3 count the H atoms.&quot;], [8.5, &quot;Splitting by the n + 1 rule shows neighbours: singlet, quartet, triplet.&quot;], [12.5, &quot;Chemical shifts locate each group; D\u2082O removes O\u2013H peaks.&quot;]]" data-vd-dur="16">
<title id="hn-title">Proton NMR</title><desc id="hn-desc">A proton NMR spectrum of ethyl ethanoate with a singlet near 2.0 for the CH3 next to C=O, a quartet near 4.1 for the OCH2 and a triplet near 1.3 for the CH3 of the ethyl group, with integration ratio 3 to 2 to 3, the n+1 rule and a table of chemical shifts.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="580" fill="#ffffff"/>
<g aria-hidden="true"><animate id="hn-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<text class="head" x="30" y="34">¹H NMR: ethyl ethanoate, CH₃COOCH₂CH₃</text><text class="note" x="30" y="56">Simplified spectrum; δ / ppm relative to TMS.</text>
<g class="part" data-part="env" data-name="Proton environments" data-info="Each set of equivalent H gives one peak. Ethyl ethanoate CH₃COOCH₂CH₃ has 3 environments." tabindex="0" role="button" aria-label="Proton environments"><g><animate attributeName="opacity" keyTimes="0.0000;0.0625;0.0813;1.0000" values="0;0;1;1" dur="16s" begin="hn-play.begin+0s" fill="freeze"/><rect x="497" y="280" width="6" height="150" fill="#7c3aed" opacity="1"><animate attributeName="opacity" keyTimes="0.0000;0.5312;0.5625;1.0000" values="1;1;0;0" dur="16s" begin="hn-play.begin+0s" fill="freeze"/></rect><text x="486.0" y="250" text-anchor="middle" font-size="11" font-weight="800" fill="#7c3aed">CH₃–C=O</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.1250;0.1437;1.0000" values="0;0;1;1" dur="16s" begin="hn-play.begin+0s" fill="freeze"/><rect x="203" y="330" width="6" height="100" fill="#dc2626" opacity="1"><animate attributeName="opacity" keyTimes="0.0000;0.5312;0.5625;1.0000" values="1;1;0;0" dur="16s" begin="hn-play.begin+0s" fill="freeze"/></rect><text x="206.0" y="300" text-anchor="middle" font-size="11" font-weight="800" fill="#dc2626">O–CH₂</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.1875;0.2062;1.0000" values="0;0;1;1" dur="16s" begin="hn-play.begin+0s" fill="freeze"/><rect x="595" y="280" width="6" height="150" fill="#2563eb" opacity="1"><animate attributeName="opacity" keyTimes="0.0000;0.5312;0.5625;1.0000" values="1;1;0;0" dur="16s" begin="hn-play.begin+0s" fill="freeze"/></rect><text x="612.0" y="250" text-anchor="middle" font-size="11" font-weight="800" fill="#2563eb">CH₃ (ethyl)</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.0625;0.0813;1.0000" values="0;0;1;1" dur="16s" begin="hn-play.begin+0s" fill="freeze"/><text x="780.0" y="400" text-anchor="middle" font-size="11" font-weight="800" fill="#475569">TMS</text><rect x="778" y="410" width="4" height="20" fill="#475569"/></g></g>
<g class="part" data-part="int" data-name="Integration" data-info="The area (integration trace) is proportional to the number of H: here 3 : 2 : 3." tabindex="0" role="button" aria-label="Integration"><g><animate attributeName="opacity" keyTimes="0.0000;0.3125;0.3312;1.0000" values="0;0;1;1" dur="16s" begin="hn-play.begin+0s" fill="freeze"/><text x="500.0" y="492" text-anchor="middle" font-size="14" font-weight="800" fill="#7c3aed">3H</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.3375;0.3563;1.0000" values="0;0;1;1" dur="16s" begin="hn-play.begin+0s" fill="freeze"/><text x="206.0" y="492" text-anchor="middle" font-size="14" font-weight="800" fill="#dc2626">2H</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.3625;0.3812;1.0000" values="0;0;1;1" dur="16s" begin="hn-play.begin+0s" fill="freeze"/><text x="598.0" y="492" text-anchor="middle" font-size="14" font-weight="800" fill="#2563eb">3H</text></g></g>
<g class="part" data-part="split" data-name="n + 1 rule" data-info="A peak is split into n + 1 lines by n H on ADJACENT carbons: CH₃ next to CH₂ → triplet; CH₂ next to CH₃ → quartet; CH₃ next to C=O (no H) → singlet." tabindex="0" role="button" aria-label="n + 1 rule"><rect x="498" y="280" width="4" height="150" fill="#7c3aed" opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.5312;0.5625;1.0000" values="0;0;1;1" dur="16s" begin="hn-play.begin+0s" fill="freeze"/></rect><g><animate attributeName="opacity" keyTimes="0.0000;0.5938;0.6125;1.0000" values="0;0;1;1" dur="16s" begin="hn-play.begin+0s" fill="freeze"/><text x="500.0" y="268" text-anchor="middle" font-size="10" font-weight="800" fill="#7c3aed">singlet</text></g><rect x="190" y="397" width="4" height="33" fill="#dc2626" opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.5312;0.5625;1.0000" values="0;0;1;1" dur="16s" begin="hn-play.begin+0s" fill="freeze"/></rect><rect x="200" y="330" width="4" height="100" fill="#dc2626" opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.5312;0.5625;1.0000" values="0;0;1;1" dur="16s" begin="hn-play.begin+0s" fill="freeze"/></rect><rect x="208" y="330" width="4" height="100" fill="#dc2626" opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.5312;0.5625;1.0000" values="0;0;1;1" dur="16s" begin="hn-play.begin+0s" fill="freeze"/></rect><rect x="218" y="397" width="4" height="33" fill="#dc2626" opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.5312;0.5625;1.0000" values="0;0;1;1" dur="16s" begin="hn-play.begin+0s" fill="freeze"/></rect><g><animate attributeName="opacity" keyTimes="0.0000;0.5938;0.6125;1.0000" values="0;0;1;1" dur="16s" begin="hn-play.begin+0s" fill="freeze"/><text x="206.0" y="318" text-anchor="middle" font-size="10" font-weight="800" fill="#dc2626">quartet</text></g><rect x="587" y="355" width="4" height="75" fill="#2563eb" opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.5312;0.5625;1.0000" values="0;0;1;1" dur="16s" begin="hn-play.begin+0s" fill="freeze"/></rect><rect x="596" y="280" width="4" height="150" fill="#2563eb" opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.5312;0.5625;1.0000" values="0;0;1;1" dur="16s" begin="hn-play.begin+0s" fill="freeze"/></rect><rect x="605" y="355" width="4" height="75" fill="#2563eb" opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.5312;0.5625;1.0000" values="0;0;1;1" dur="16s" begin="hn-play.begin+0s" fill="freeze"/></rect><g><animate attributeName="opacity" keyTimes="0.0000;0.5938;0.6125;1.0000" values="0;0;1;1" dur="16s" begin="hn-play.begin+0s" fill="freeze"/><text x="598.0" y="268" text-anchor="middle" font-size="10" font-weight="800" fill="#2563eb">triplet</text></g></g>
<g class="part" data-part="shift" data-name="Chemical shifts" data-info="TMS = 0. R–CH₃ ≈ 0.9–1.3; CH₃–C=O ≈ 2.0–2.5; O–CH ≈ 3.3–4.3; aromatic 6.5–8.0; CHO 9–10; COOH 11–12. O–H and N–H peaks disappear when D₂O is added (H exchanged for D)." tabindex="0" role="button" aria-label="Chemical shifts"><g><animate attributeName="opacity" keyTimes="0.0000;0.7812;0.8000;1.0000" values="0;0;1;1" dur="16s" begin="hn-play.begin+0s" fill="freeze"/><rect x="810" y="90" width="270" height="420" rx="16" fill="#f8fafc" stroke="#cbd5e1"/><text x="945" y="118" text-anchor="middle" font-size="14" font-weight="800" fill="#111827">typical δ / ppm</text><text x="828" y="156" text-anchor="start" font-size="12" font-weight="800" fill="#111827">R–CH₃</text><text x="1062" y="156" text-anchor="end" font-size="11" font-weight="700" fill="#475569">0.9–1.3</text><text x="828" y="190" text-anchor="start" font-size="12" font-weight="800" fill="#111827">CH₃–C=O</text><text x="1062" y="190" text-anchor="end" font-size="11" font-weight="700" fill="#475569">2.0–2.5</text><text x="828" y="224" text-anchor="start" font-size="12" font-weight="800" fill="#111827">Ar–CH₃</text><text x="1062" y="224" text-anchor="end" font-size="11" font-weight="700" fill="#475569">2.3–2.7</text><text x="828" y="258" text-anchor="start" font-size="12" font-weight="800" fill="#111827">O–CH</text><text x="1062" y="258" text-anchor="end" font-size="11" font-weight="700" fill="#475569">3.3–4.3</text><text x="828" y="292" text-anchor="start" font-size="12" font-weight="800" fill="#111827">R–OH</text><text x="1062" y="292" text-anchor="end" font-size="11" font-weight="700" fill="#475569">1–5 (variable)</text><text x="828" y="326" text-anchor="start" font-size="12" font-weight="800" fill="#111827">aromatic H</text><text x="1062" y="326" text-anchor="end" font-size="11" font-weight="700" fill="#475569">6.5–8.0</text><text x="828" y="360" text-anchor="start" font-size="12" font-weight="800" fill="#111827">–CHO</text><text x="1062" y="360" text-anchor="end" font-size="11" font-weight="700" fill="#475569">9–10</text><text x="828" y="394" text-anchor="start" font-size="12" font-weight="800" fill="#111827">–COOH</text><text x="1062" y="394" text-anchor="end" font-size="11" font-weight="700" fill="#475569">11–12</text><text x="945" y="440" text-anchor="middle" font-size="12" font-weight="800" fill="#b91c1c">D₂O shake: O–H, N–H</text><text x="945" y="460" text-anchor="middle" font-size="12" font-weight="800" fill="#b91c1c">peaks disappear</text></g></g>
</svg>