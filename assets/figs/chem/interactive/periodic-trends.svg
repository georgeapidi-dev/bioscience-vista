<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" class="vd-svg" role="img" aria-labelledby="tr-title tr-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="tr-play" data-vd-play-label="Play: the trends" data-vd-steps="[[0, &quot;Periodic trends: patterns in properties across a period and down a group.&quot;], [1, &quot;Across period 3, first ionisation energy generally increases (data in kJ/mol).&quot;], [5, &quot;The small dips at aluminium and sulfur are evidence for sub-shells (3s, 3p) and for paired electrons.&quot;], [7, &quot;Down group 1, atomic radius increases: each atom has one more electron shell.&quot;], [11, &quot;Summary: across a period, radius decreases while ionisation energy and electronegativity increase; down a group, the opposite.&quot;]]" data-vd-dur="14">
<title id="tr-title">Periodic trends</title><desc id="tr-desc">Bar chart of first ionisation energies across period 3 and circles showing atomic radius increasing down group 1, with trend arrows across a period and down a group.</desc>
