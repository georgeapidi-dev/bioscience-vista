<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 640" class="vd-svg" role="img" aria-labelledby="bo-title bo-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="bo-play" data-vd-play-label="Play: compress the gas" data-vd-steps="[[0, &quot;Gas pressure comes from particles colliding with the walls.&quot;], [1, &quot;The gas fills the cylinder; particles hit the walls and the piston.&quot;], [5, &quot;Push the piston in to half the volume (temperature constant).&quot;], [8, &quot;Now there are twice as many collisions per second on each area: the pressure doubles.&quot;], [11, &quot;Boyle&#x27;s law: pV = constant.&quot;]]" data-vd-dur="15">
<title id="bo-title">Gas pressure and Boyle&#x27;s law</title><desc id="bo-desc">Gas particles colliding with the walls of a cylinder; halving the volume with a piston doubles the collision rate per unit area and the pressure, shown by the inverse curve of p against V and a straight line of p against 1/V.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1220" height="640" fill="#ffffff"/>
<g aria-hidden="true"><animate id="bo-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<text class="head" x="30" y="34">Gas pressure and Boyle's law</text><text class="note" x="30" y="56">Fixed amount of gas at constant temperature.</text>
<g class="part" data-part="cyl" data-name="Gas in a cylinder" data-info="Particles move randomly and collide with the walls; each collision pushes on the wall. Pressure = force per unit area." tabindex="0" role="button" aria-label="Gas in a cylinder"><path d="M 540 160 L 60 160 L 60 440 L 540 440" fill="#f8fafc" stroke="#334155" stroke-width="6"/></g>
<g class="part" data-part="pist" data-name="Piston" data-info="Pushing the piston in halves the volume at constant temperature." tabindex="0" role="button" aria-label="Piston"><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.3333;0.4667;1.0000" values="0 0;0 0;-240.0 0;-240.0 0" dur="15s" begin="bo-play.begin+0s" fill="freeze"/><rect x="530" y="164" width="24" height="272" fill="#64748b"/><rect x="554" y="290.0" width="140" height="20" fill="#94a3b8"/></g><g><animate attributeName="opacity" keyTimes="0.0000;0.3333;0.3533;0.4667;0.4867;1.0000" values="0;0;1;1;0;0" dur="15s" begin="bo-play.begin+0s" fill="freeze"/><text x="620" y="144" text-anchor="middle" font-size="13" font-weight="800" fill="#475569">push</text></g></g>
