" dur="2.4s" repeatCount="indefinite"/></circle></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.4467;0.4600;1.0000" values="0;0;1;1" dur="15s" begin="bo-play.begin+0s" fill="freeze"/><circle r="9" fill="#2563eb"><animateTransform attributeName="transform" type="translate" values="157 236;270 296;286 321;112 243;118 181;130 281;157 236" dur="1.2s" repeatCount="indefinite"/></circle></g></g><g><g><animate attributeName="opacity" keyTimes="0.0000;0.4333;0.4467;1.0000" values="1;1;0;0" dur="15s" begin="bo-play.begin+0s" fill="freeze"/><circle r="9" fill="#2563eb"><animateTransform attributeName="transform" type="translate" values="239 342;324 193;490 396;377 367;302 390;346 371;239 342" dur="2.4s" repeatCount="indefinite"/></circle></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.4467;0.4600;1.0000" values="0;0;1;1" dur="15s" begin="bo-play.begin+0s" fill="freeze"/><circle r="9" fill="#2563eb"><animateTransform attributeName="transform" type="translate" values="159 342;202 193;285 396;228 367;191 390;213 371;159 342" dur="1.2s" repeatCount="indefinite"/></circle></g></g><g><g><animate attributeName="opacity" keyTimes="0.0000;0.4333;0.4467;1.0000" values="1;1;0;0" dur="15s" begin="bo-play.begin+0s" fill="freeze"/><circle r="9" fill="#2563eb"><animateTransform attributeName="transform" type="translate" values="249 230;252 219;125 262;353 193;107 180;109 216;249 230" dur="2.4s" repeatCount="indefinite"/></circle></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.4467;0.4600;1.0000" values="0;0;1;1" dur="15s" begin="bo-play.begin+0s" fill="freeze"/><circle r="9" fill="#2563eb"><animateTransform attributeName="transform" type="translate" values="164 230;166 219;102 262;216 193;93 180;94 216;164 230" dur="1.2s" repeatCount="indefinite"/></circle></g></g><g><g><animate attributeName="opacity" keyTimes="0.0000;0.4333;0.4467;1.0000" values="1;1;0;0" dur="15s" begin="bo-play.begin+0s" fill="freeze"/><circle r="9" fill="#2563eb"><animateTransform attributeName="transform" type="translate" values="124 241;236 263;91 267;456 209;344 384;144 418;124 241" dur="2.4s" repeatCount="indefinite"/></circle></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.4467;0.4600;1.0000" values="0;0;1;1" dur="15s" begin="bo-play.begin+0s" fill="freeze"/><circle r="9" fill="#2563eb"><animateTransform attributeName="transform" type="translate" values="102 241;158 263;85 267;268 209;212 384;112 418;102 241" dur="1.2s" repeatCount="indefinite"/></circle></g></g><g><g><animate attributeName="opacity" keyTimes="0.0000;0.4333;0.4467;1.0000" values="1;1;0;0" dur="15s" begin="bo-play.begin+0s" fill="freeze"/><circle r="9" fill="#2563eb"><animateTransform attributeName="transform" type="translate" values="280 379;288 219;117 186;124 408;227 307;194 215;280 379" dur="2.4s" repeatCount="indefinite"/></circle></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.4467;0.4600;1.0000" values="0;0;1;1" dur="15s" begin="bo-play.begin+0s" fill="freeze"/><circle r="9" fill="#2563eb"><animateTransform attributeName="transform" type="translate" values="180 379;184 219;98 186;102 408;154 307;137 215;180 379" dur="1.2s" repeatCount="indefinite"/></circle></g></g><g><g><animate attributeName="opacity" keyTimes="0.0000;0.4333;0.4467;1.0000" values="1;1;0;0" dur="15s" begin="bo-play.begin+0s" fill="freeze"/><circle r="9" fill="#2563eb"><animateTransform attributeName="transform" type="translate" values="314 243;92 268;307 220;501 365;451 308;379 367;314 243" dur="2.4s" repeatCount="indefinite"/></circle></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.4467;0.4600;1.0000" values="0;0;1;1" dur="15s" begin="bo-play.begin+0s" fill="freeze"/><circle r="9" fill="#2563eb"><animateTransform attributeName="transform" type="translate" values="197 243;86 268;194 220;290 365;266 308;230 367;197 243" dur="1.2s" repeatCount="indefinite"/></circle></g></g>
<g class="part" data-part="col" data-name="More collisions" data-info="Same particles, same speed, half the space: twice as many collisions per second on each unit area, so the pressure doubles." tabindex="0" role="button" aria-label="More collisions"><g><animate attributeName="opacity" keyTimes="0.0000;0.5333;0.5533;1.0000" values="0;0;1;1" dur="15s" begin="bo-play.begin+0s" fill="freeze"/><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.5333;0.5533;1.0000" values="0;0;1;1" dur="15s" begin="bo-play.begin+0s" fill="freeze"/><rect x="0.0" y="468" width="380" height="24" rx="12" fill="#fee2e2" stroke="#1f2937" stroke-width="1"/><text x="190.0" y="485" text-anchor="middle" font-size="12" font-weight="700">half volume → 2× collisions per area → 2× pressure</text></g></g></g>
<g><animate attributeName="opacity" keyTimes="0.0000;0.0667;0.0867;0.3333;0.3533;1.0000" values="0;0;1;1;0;0" dur="15s" begin="bo-play.begin+0s" fill="freeze"/><text x="300.0" y="480" text-anchor="middle" font-size="14" font-weight="800" fill="#334155">V = 100 cm³, p = 100 kPa</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.5333;0.5533;1.0000" values="0;0;1;1" dur="15s" begin="bo-play.begin+0s" fill="freeze"/><text x="300.0" y="520" text-anchor="middle" font-size="14" font-weight="800" fill="#b91c1c">V = 50 cm³, p = 200 kPa</text></g>
<g class="part" data-part="graph" data-name="Boyle&#x27;s law" data-info="At constant temperature and amount of gas, pV = constant: p is inversely proportional to V." tabindex="0" role="button" aria-label="Boyle&#x27;s law"><g><animate attributeName="opacity" keyTimes="0.0000;0.7333;0.7533;1.0000" values="0;0;1;1" dur="15s" begin="bo-play.begin+0s" fill="freeze"/><rect x="620" y="90" width="270" height="290" rx="14" fill="#fff" stroke="#cbd5e1"/><text x="755" y="112" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">p against V</text><line x1="660" y1="340" x2="870" y2="340" stroke="#111827" stroke-width="2"/><line x1="660" y1="340" x2="660" y2="130" stroke="#111827" stroke-width="2"/><polyline points="700,140 704,158 708,173 712,186 716,197 720,207 724,215 728,222 732,229 736,235 740,240 744,245 748,249 752,253 756,257 760,260 764,263 768,266 772,269 776,271 780,273 784,275 788,278 792,279 796,281 800,283 804,284 808,286 812,287 816,289 820,290 824,291 828,292 832,293 836,295 840,296 844,297 848,297 852,298 856,299 860,300 864,301 868,302" fill="none" stroke="#2563eb" stroke-width="3.5"/><text x="765" y="364" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">V</text><text x="646" y="235" text-anchor="end" font-size="13" font-weight="800" fill="#111827">p</text><text x="755" y="400" text-anchor="middle" font-size="15" font-weight="800" fill="#1d4ed8">pV = constant</text></g></g>
<g class="part" data-part="lin" data-name="Straight-line test" data-info="p plotted against 1/V gives a straight line through the origin." tabindex="0" role="button" aria-label="Straight-line test"><g><animate attributeName="opacity" keyTimes="0.0000;0.8000;0.8200;1.0000" values="0;0;1;1" dur="15s" begin="bo-play.begin+0s" fill="freeze"/><rect x="920" y="90" width="270" height="290" rx="14" fill="#fff" stroke="#cbd5e1"/><text x="1055" y="112" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">p against 1/V</text><line x1="960" y1="340" x2="1170" y2="340" stroke="#111827" stroke-width="2"/><line x1="960" y1="340" x2="960" y2="130" stroke="#111827" stroke-width="2"/><line x1="960" y1="340" x2="1160" y2="150" stroke="#16a34a" stroke-width="3.5"/><text x="1065" y="364" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">1/V</text><text x="946" y="235" text-anchor="end" font-size="13" font-weight="800" fill="#111827">p</text><text x="1055" y="400" text-anchor="middle" font-size="13" font-weight="800" fill="#15803d">straight line through origin</text></g></g>
<g><animate attributeName="opacity" keyTimes="0.0000;0.6000;0.6200;1.0000" values="0;0;1;1" dur="15s" begin="bo-play.begin+0s" fill="freeze"/><rect x="620" y="440" width="560" height="150" rx="14" fill="#f8fafc" stroke="#cbd5e1"/><text x="900" y="468" text-anchor="middle" font-size="14" font-weight="800" fill="#111827">Particle explanation</text><text x="900" y="496" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">constant temperature → same average speed</text><text x="900" y="520" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">smaller volume → particles hit each area more often</text><text x="900" y="544" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">→ larger force per unit area → higher pressure</text><text x="900" y="572" text-anchor="middle" font-size="15" font-weight="800" fill="#1d4ed8">p₁V₁ = p₂V₂</text></g>
</svg>