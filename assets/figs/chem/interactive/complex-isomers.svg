<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" class="vd-svg" role="img" aria-labelledby="ci-title ci-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="ci-play" data-vd-play-label="Play: find the isomers" data-vd-steps="[[0, &quot;Stereoisomerism in complexes.&quot;], [1, &quot;Square planar: cis- and trans-platin.&quot;], [6, &quot;Octahedral cis and trans.&quot;], [10, &quot;Optical isomers with three bidentate ligands.&quot;]]" data-vd-dur="14">
<title id="ci-title">Stereoisomerism in complexes</title><desc id="ci-desc">Cis and trans isomers of diamminedichloroplatinum(II), cis and trans tetraamminedichlorocobalt(III), and two non-superimposable mirror-image forms of tris(1,2-diaminoethane)nickel(II).</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
