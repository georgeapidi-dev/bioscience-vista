<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 580" class="vd-svg" role="img" aria-labelledby="acl-title acl-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="acl-play" data-vd-play-label="Play: react ethanoyl chloride" data-vd-steps="[[0, &quot;Acyl chlorides: very reactive carboxylic acid derivatives.&quot;], [1, &quot;Water, alcohols, phenol, ammonia and amines all react at room temperature.&quot;], [10.5, &quot;The acyl carbon is very \u03b4+; HCl is released.&quot;]]" data-vd-dur="15">
<title id="acl-title">Reactions of acyl chlorides</title><desc id="acl-desc">Ethanoyl chloride reacting with water to give ethanoic acid, with alcohols and phenol to give esters, with ammonia to give ethanamide and with amines to give substituted amides, each releasing hydrogen chloride.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="580" fill="#ffffff"/>
<g aria-hidden="true"><animate id="acl-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<defs><marker id="acl-475569" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="5.4" refY="6.0" orient="auto"><path d="M0,0 L12,6.0 L0,12 z" fill="#475569"/></marker></defs>
<text class="head" x="30" y="34">Acyl chlorides: ethanoyl chloride, CH₃COCl</text><text class="note" x="30" y="56">All at room temperature; steamy HCl fumes are given off.</text>
<g class="part" data-part="map" data-name="Reactions of ethanoyl chloride" data-info="Every reaction replaces Cl with a nucleophile and releases HCl (steamy fumes): faster and complete, unlike reactions of carboxylic acids." tabindex="0" role="button" aria-label="Reactions of ethanoyl chloride"><circle cx="240" cy="320" r="80" fill="#ccfbf1" stroke="#0f766e" stroke-width="3"/><text x="240" y="326" text-anchor="middle" font-size="18" font-weight="800" fill="#134e4a">CH₃COCl</text><g><animate attributeName="opacity" keyTimes="0.0000;0.0667;0.0867;1.0000" values="0;0;1;1" dur="15s" begin="acl-play.begin+0s" fill="freeze"/><path d="M 322 270 L 520 120" stroke="#475569" stroke-width="3" marker-end="url(#acl-475569)"/><rect x="530" y="84" width="520" height="72" rx="14" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="790" y="112" text-anchor="middle" font-size="14" font-weight="800" fill="#111827">+ H₂O → carboxylic acid + HCl</text><text x="790" y="138" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">room temp, violent</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.1867;0.2067;1.0000" values="0;0;1;1" dur="15s" begin="acl-play.begin+0s" fill="freeze"/><path d="M 322 293 L 520 212" stroke="#475569" stroke-width="3" marker-end="url(#acl-475569)"/><rect x="530" y="176" width="520" height="72" rx="14" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="790" y="204" text-anchor="middle" font-size="14" font-weight="800" fill="#111827">+ alcohol (ROH) → ester + HCl</text><text x="790" y="230" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">room temp</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.3067;0.3267;1.0000" values="0;0;1;1" dur="15s" begin="acl-play.begin+0s" fill="freeze"/><path d="M 322 316 L 520 304" stroke="#475569" stroke-width="3" marker-end="url(#acl-475569)"/><rect x="530" y="268" width="520" height="72" rx="14" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="790" y="296" text-anchor="middle" font-size="14" font-weight="800" fill="#111827">+ phenol → phenyl ester + HCl</text><text x="790" y="322" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">room temp (NaOH helps)</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.4267;0.4467;1.0000" values="0;0;1;1" dur="15s" begin="acl-play.begin+0s" fill="freeze"/><path d="M 322 339 L 520 396" stroke="#475569" stroke-width="3" marker-end="url(#acl-475569)"/><rect x="530" y="360" width="520" height="72" rx="14" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="790" y="388" text-anchor="middle" font-size="14" font-weight="800" fill="#111827">+ NH₃ (conc.) → primary amide + NH₄Cl</text><text x="790" y="414" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">room temp</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.5467;0.5667;1.0000" values="0;0;1;1" dur="15s" begin="acl-play.begin+0s" fill="freeze"/><path d="M 322 362 L 520 488" stroke="#475569" stroke-width="3" marker-end="url(#acl-475569)"/><rect x="530" y="452" width="520" height="72" rx="14" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="790" y="480" text-anchor="middle" font-size="14" font-weight="800" fill="#111827">+ amine (RNH₂) → N-substituted amide</text><text x="790" y="506" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">room temp</text></g></g>
<g class="part" data-part="why" data-name="Why so reactive" data-info="The acyl carbon is bonded to two electronegative atoms (O and Cl), so it is strongly δ+; Cl⁻ is a good leaving group." tabindex="0" role="button" aria-label="Why so reactive"><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.7000;0.7200;1.0000" values="0;0;1;1" dur="15s" begin="acl-play.begin+0s" fill="freeze"/><rect x="240.0" y="548" width="620" height="24" rx="12" fill="#ccfbf1" stroke="#1f2937" stroke-width="1"/><text x="550" y="565" text-anchor="middle" font-size="12" font-weight="700">acyl C bonded to O and Cl: very δ+ · Cl⁻ leaves easily · reactions go to completion</text></g></g>
</svg>