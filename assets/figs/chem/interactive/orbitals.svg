<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 640" class="vd-svg" role="img" aria-labelledby="or-title or-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="or-play" data-vd-play-label="Play: s, p, d" data-vd-steps="[[0, &quot;Atomic orbitals: regions where an electron is likely to be found.&quot;], [1, &quot;The s orbital is a sphere.&quot;], [3.5, &quot;Three p orbitals point along x, y and z.&quot;], [7, &quot;Five d orbitals have more complex shapes.&quot;], [10.5, &quot;Each orbital holds up to two electrons.&quot;]]" data-vd-dur="14">
<title id="or-title">Shapes of atomic orbitals</title><desc id="or-desc">The shapes of atomic orbitals: a spherical s orbital, three dumbbell-shaped p orbitals along the x, y and z axes, and five d orbitals, with their electron capacities.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1220" height="640" fill="#ffffff"/>
<g aria-hidden="true"><animate id="or-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<text class="head" x="30" y="34">Shapes of atomic orbitals</text><text class="note" x="30" y="56">Each shape encloses the region where the electron is found about 90% of the time; nucleus at the centre.</text>
<g class="part" data-part="s" data-name="s orbital" data-info="Spherical. One s orbital in each energy level; holds up to 2 electrons." tabindex="0" role="button" aria-label="s orbital"><g><animate attributeName="opacity" keyTimes="0.0000;0.0714;0.0929;1.0000" values="0;0;1;1" dur="14s" begin="or-play.begin+0s" fill="freeze"/><line x1="70" y1="250" x2="230" y2="250" stroke="#94a3b8"/><line x1="150" y1="170" x2="150" y2="330" stroke="#94a3b8"/><line x1="102.0" y1="290.0" x2="198.0" y2="210.0" stroke="#94a3b8"/><circle cx="150" cy="250" r="4" fill="#111827"/><circle cx="150" cy="250" r="60" fill="#fca5a5" fill-opacity=".75" stroke="#991b1b" stroke-width="2"/><circle cx="150" cy="250" r="4" fill="#111827"/><text x="150" y="370" text-anchor="middle" font-size="20" font-weight="800" fill="#991b1b">s</text></g></g>
<g class="part" data-part="p" data-name="p orbitals" data-info="Dumbbell-shaped, three per level from n = 2, along the x, y and z axes; together hold up to 6 electrons." tabindex="0" role="button" aria-label="p orbitals"><g><animate attributeName="opacity" keyTimes="0.0000;0.2500;0.2714;1.0000" values="0;0;1;1" dur="14s" begin="or-play.begin+0s" fill="freeze"/><line x1="300" y1="250" x2="460" y2="250" stroke="#94a3b8"/><line x1="380" y1="170" x2="380" y2="330" stroke="#94a3b8"/><line x1="332.0" y1="290.0" x2="428.0" y2="210.0" stroke="#94a3b8"/><circle cx="380" cy="250" r="4" fill="#111827"/><ellipse cx="415.0" cy="250.0" rx="35.0" ry="28" fill="#60a5fa" fill-opacity=".75" stroke="#1e3a8a" stroke-width="1.5" transform="rotate(0 415.0 250.0)"/><ellipse cx="345.0" cy="250.0" rx="35.0" ry="28" fill="#60a5fa" fill-opacity=".75" stroke="#1e3a8a" stroke-width="1.5" transform="rotate(-180 345.0 250.0)"/><circle cx="380" cy="250" r="4" fill="#111827"/><text x="380" y="370" text-anchor="middle" font-size="18" font-weight="800" fill="#1d4ed8">p (x)</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.3071;0.3286;1.0000" values="0;0;1;1" dur="14s" begin="or-play.begin+0s" fill="freeze"/><line x1="490" y1="250" x2="650" y2="250" stroke="#94a3b8"/><line x1="570" y1="170" x2="570" y2="330" stroke="#94a3b8"/><line x1="522.0" y1="290.0" x2="618.0" y2="210.0" stroke="#94a3b8"/><circle cx="570" cy="250" r="4" fill="#111827"/><ellipse cx="570.0" cy="215.0" rx="35.0" ry="28" fill="#60a5fa" fill-opacity=".75" stroke="#1e3a8a" stroke-width="1.5" transform="rotate(-90 570.0 215.0)"/><ellipse cx="570.0" cy="285.0" rx="35.0" ry="28" fill="#60a5fa" fill-opacity=".75" stroke="#1e3a8a" stroke-width="1.5" transform="rotate(-270 570.0 285.0)"/><circle cx="570" cy="250" r="4" fill="#111827"/><text x="570" y="370" text-anchor="middle" font-size="18" font-weight="800" fill="#1d4ed8">p (y)</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.3643;0.3857;1.0000" values="0;0;1;1" dur="14s" begin="or-play.begin+0s" fill="freeze"/><line x1="680" y1="250" x2="840" y2="250" stroke="#94a3b8"/><line x1="760" y1="170" x2="760" y2="330" stroke="#94a3b8"/><line x1="712.0" y1="290.0" x2="808.0" y2="210.0" stroke="#94a3b8"/><circle cx="760" cy="250" r="4" fill="#111827"/><ellipse cx="788.7" cy="229.9" rx="35.0" ry="28" fill="#60a5fa" fill-opacity=".75" stroke="#1e3a8a" stroke-width="1.5" transform="rotate(-35 788.7 229.9)"/><ellipse cx="731.3" cy="270.1" rx="35.0" ry="28" fill="#60a5fa" fill-opacity=".75" stroke="#1e3a8a" stroke-width="1.5" transform="rotate(-215 731.3 270.1)"/><circle cx="760" cy="250" r="4" fill="#111827"/><text x="760" y="370" text-anchor="middle" font-size="18" font-weight="800" fill="#1d4ed8">p (z)</text></g></g>
<g class="part" data-part="d" data-name="d orbitals" data-info="Five per level from n = 3; four have four lobes, one (d_z²) has two lobes and a ring; together hold up to 10 electrons." tabindex="0" role="button" aria-label="d orbitals"><g><animate attributeName="opacity" keyTimes="0.0000;0.5000;0.5214;1.0000" values="0;0;1;1" dur="14s" begin="or-play.begin+0s" fill="freeze"/><line x1="60" y1="470" x2="200" y2="470" stroke="#94a3b8"/><line x1="130" y1="400" x2="130" y2="540" stroke="#94a3b8"/><line x1="88.0" y1="505.0" x2="172.0" y2="435.0" stroke="#94a3b8"/><circle cx="130" cy="470" r="4" fill="#111827"/><ellipse cx="149.8" cy="450.2" rx="28.0" ry="20" fill="#86efac" fill-opacity=".75" stroke="#1e3a8a" stroke-width="1.5" transform="rotate(-45 149.8 450.2)"/><ellipse cx="110.2" cy="450.2" rx="28.0" ry="20" fill="#86efac" fill-opacity=".75" stroke="#1e3a8a" stroke-width="1.5" transform="rotate(-135 110.2 450.2)"/><ellipse cx="110.2" cy="489.8" rx="28.0" ry="20" fill="#86efac" fill-opacity=".75" stroke="#1e3a8a" stroke-width="1.5" transform="rotate(-225 110.2 489.8)"/><ellipse cx="149.8" cy="489.8" rx="28.0" ry="20" fill="#86efac" fill-opacity=".75" stroke="#1e3a8a" stroke-width="1.5" transform="rotate(-315 149.8 489.8)"/><circle cx="130" cy="470" r="4" fill="#111827"/><text x="130" y="570" text-anchor="middle" font-size="15" font-weight="800" fill="#15803d">dxy</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.5357;0.5571;1.0000" values="0;0;1;1" dur="14s" begin="or-play.begin+0s" fill="freeze"/><line x1="280" y1="470" x2="420" y2="470" stroke="#94a3b8"/><line x1="350" y1="400" x2="350" y2="540" stroke="#94a3b8"/><line x1="308.0" y1="505.0" x2="392.0" y2="435.0" stroke="#94a3b8"/><circle cx="350" cy="470" r="4" fill="#111827"/><ellipse cx="369.8" cy="450.2" rx="28.0" ry="20" fill="#86efac" fill-opacity=".75" stroke="#1e3a8a" stroke-width="1.5" transform="rotate(-45 369.8 450.2)"/><ellipse cx="330.2" cy="450.2" rx="28.0" ry="20" fill="#86efac" fill-opacity=".75" stroke="#1e3a8a" stroke-width="1.5" transform="rotate(-135 330.2 450.2)"/><ellipse cx="330.2" cy="489.8" rx="28.0" ry="20" fill="#86efac" fill-opacity=".75" stroke="#1e3a8a" stroke-width="1.5" transform="rotate(-225 330.2 489.8)"/><ellipse cx="369.8" cy="489.8" rx="28.0" ry="20" fill="#86efac" fill-opacity=".75" stroke="#1e3a8a" stroke-width="1.5" transform="rotate(-315 369.8 489.8)"/><circle cx="350" cy="470" r="4" fill="#111827"/><text x="350" y="570" text-anchor="middle" font-size="15" font-weight="800" fill="#15803d">dxz</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.5714;0.5929;1.0000" values="0;0;1;1" dur="14s" begin="or-play.begin+0s" fill="freeze"/><line x1="500" y1="470" x2="640" y2="470" stroke="#94a3b8"/><line x1="570" y1="400" x2="570" y2="540" stroke="#94a3b8"/><line x1="528.0" y1="505.0" x2="612.0" y2="435.0" stroke="#94a3b8"/><circle cx="570" cy="470" r="4" fill="#111827"/><ellipse cx="589.8" cy="450.2" rx="28.0" ry="20" fill="#86efac" fill-opacity=".75" stroke="#1e3a8a" stroke-width="1.5" transform="rotate(-45 589.8 450.2)"/><ellipse cx="550.2" cy="450.2" rx="28.0" ry="20" fill="#86efac" fill-opacity=".75" stroke="#1e3a8a" stroke-width="1.5" transform="rotate(-135 550.2 450.2)"/><ellipse cx="550.2" cy="489.8" rx="28.0" ry="20" fill="#86efac" fill-opacity=".75" stroke="#1e3a8a" stroke-width="1.5" transform="rotate(-225 550.2 489.8)"/><ellipse cx="589.8" cy="489.8" rx="28.0" ry="20" fill="#86efac" fill-opacity=".75" stroke="#1e3a8a" stroke-width="1.5" transform="rotate(-315 589.8 489.8)"/><circle cx="570" cy="470" r="4" fill="#111827"/><text x="570" y="570" text-anchor="middle" font-size="15" font-weight="800" fill="#15803d">dyz</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.6071;0.6286;1.0000" values="0;0;1;1" dur="14s" begin="or-play.begin+0s" fill="freeze"/><line x1="720" y1="470" x2="860" y2="470" stroke="#94a3b8"/><line x1="790" y1="400" x2="790" y2="540" stroke="#94a3b8"/><line x1="748.0" y1="505.0" x2="832.0" y2="435.0" stroke="#94a3b8"/><circle cx="790" cy="470" r="4" fill="#111827"/><ellipse cx="818.0" cy="470.0" rx="28.0" ry="20" fill="#86efac" fill-opacity=".75" stroke="#1e3a8a" stroke-width="1.5" transform="rotate(0 818.0 470.0)"/><ellipse cx="790.0" cy="442.0" rx="28.0" ry="20" fill="#86efac" fill-opacity=".75" stroke="#1e3a8a" stroke-width="1.5" transform="rotate(-90 790.0 442.0)"/><ellipse cx="762.0" cy="470.0" rx="28.0" ry="20" fill="#86efac" fill-opacity=".75" stroke="#1e3a8a" stroke-width="1.5" transform="rotate(-180 762.0 470.0)"/><ellipse cx="790.0" cy="498.0" rx="28.0" ry="20" fill="#86efac" fill-opacity=".75" stroke="#1e3a8a" stroke-width="1.5" transform="rotate(-270 790.0 498.0)"/><circle cx="790" cy="470" r="4" fill="#111827"/><text x="790" y="570" text-anchor="middle" font-size="15" font-weight="800" fill="#15803d">dx²−y²</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.6429;0.6643;1.0000" values="0;0;1;1" dur="14s" begin="or-play.begin+0s" fill="freeze"/><line x1="940" y1="470" x2="1080" y2="470" stroke="#94a3b8"/><line x1="1010" y1="400" x2="1010" y2="540" stroke="#94a3b8"/><line x1="968.0" y1="505.0" x2="1052.0" y2="435.0" stroke="#94a3b8"/><circle cx="1010" cy="470" r="4" fill="#111827"/><ellipse cx="1010.0" cy="440.0" rx="30.0" ry="22" fill="#86efac" fill-opacity=".75" stroke="#1e3a8a" stroke-width="1.5" transform="rotate(-90 1010.0 440.0)"/><ellipse cx="1010.0" cy="500.0" rx="30.0" ry="22" fill="#86efac" fill-opacity=".75" stroke="#1e3a8a" stroke-width="1.5" transform="rotate(-270 1010.0 500.0)"/><ellipse cx="1010" cy="470" rx="40" ry="12" fill="#bbf7d0" stroke="#14532d" stroke-width="1.5"/><circle cx="1010" cy="470" r="4" fill="#111827"/><text x="1010" y="570" text-anchor="middle" font-size="15" font-weight="800" fill="#15803d">dz²</text></g></g>
<g class="part" data-part="cap" data-name="Capacity" data-info="Each orbital holds a maximum of 2 electrons with opposite spins (Pauli). Sub-levels: s 2, p 6, d 10, f 14." tabindex="0" role="button" aria-label="Capacity"><g><animate attributeName="opacity" keyTimes="0.0000;0.7500;0.7714;1.0000" values="0;0;1;1" dur="14s" begin="or-play.begin+0s" fill="freeze"/><rect x="900" y="110" width="300" height="250" rx="14" fill="#f8fafc" stroke="#cbd5e1"/><text x="1050" y="138" text-anchor="middle" font-size="15" font-weight="800" fill="#111827">Capacity</text><text x="920" y="172" text-anchor="start" font-size="13" font-weight="700" fill="#111827">s: 1 orbital → 2 electrons</text><text x="920" y="204" text-anchor="start" font-size="13" font-weight="700" fill="#111827">p: 3 orbitals → 6 electrons</text><text x="920" y="236" text-anchor="start" font-size="13" font-weight="700" fill="#111827">d: 5 orbitals → 10 electrons</text><text x="920" y="268" text-anchor="start" font-size="13" font-weight="700" fill="#111827">f: 7 orbitals → 14 electrons</text><text x="1050" y="316" text-anchor="middle" font-size="12" font-weight="600" fill="#475569">max 2 electrons per orbital,</text><text x="1050" y="336" text-anchor="middle" font-size="12" font-weight="600" fill="#475569">opposite spins ↑↓</text></g></g>
</svg>