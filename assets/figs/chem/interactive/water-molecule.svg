<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 600" class="vd-svg" role="img" aria-labelledby="wm-title wm-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="wm-play" data-vd-play-label="Play: shape and polarity" data-vd-steps="[[0, &quot;A water molecule, H\u2082O: one oxygen atom covalently bonded to two hydrogen atoms.&quot;], [1.5, &quot;Each O\u2013H bond is a shared pair of electrons. Oxygen also has two lone pairs.&quot;], [4, &quot;The lone pairs repel more strongly than bonding pairs, so the molecule is bent with a bond angle of 104.5\u00b0.&quot;], [6.5, &quot;Oxygen attracts the shared electrons more strongly: O is \u03b4\u2212 and each H is \u03b4+. Water is a polar molecule.&quot;]]" data-vd-dur="10">
<title id="wm-title">The water molecule</title><desc id="wm-desc">A bent water molecule with bond angle 104.5°, two bonding pairs, two lone pairs, partial charges and a dipole.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="600" fill="#ffffff"/>
<g aria-hidden="true"><animate id="wm-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<defs><marker id="wm-7c3aed" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#7c3aed"/></marker></defs>
<text class="head" x="30" y="34">The water molecule (H₂O)</text><text class="note" x="30" y="56">Dots and crosses: electrons from H and O. Not to scale.</text>
<g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.6500;0.6800;1.0000" values="0;0;1;1" dur="10s" begin="wm-play.begin+0s" fill="freeze"/><ellipse cx="500" cy="290" rx="260" ry="190" fill="#fecaca" opacity=".35"/><ellipse cx="500" cy="200" rx="90" ry="80" fill="#ef4444" opacity=".25"/></g>
<g class="part" data-part="bond" data-name="Covalent bonds (bonding pairs)" data-info="Each O–H bond is a shared pair of electrons: one electron from O, one from H." tabindex="0" role="button" aria-label="Covalent bonds (bonding pairs)"><line x1="500" y1="220" x2="666.0" y2="348.6" stroke="#334155" stroke-width="10" stroke-linecap="round"/><line x1="500" y1="220" x2="334.0" y2="348.6" stroke="#334155" stroke-width="10" stroke-linecap="round"/></g>
<g class="part" data-part="o" data-name="Oxygen atom" data-info="8 protons. More electronegative than hydrogen, so it pulls the shared electrons towards itself: partial negative charge δ−." tabindex="0" role="button" aria-label="Oxygen atom"><circle cx="500" cy="220" r="54" fill="#ef4444" stroke="#7f1d1d" stroke-width="3"/><text x="500" y="230" text-anchor="middle" font-size="32" font-weight="800" fill="#fff">O</text></g>
<g class="part" data-part="h" data-name="Hydrogen atoms" data-info="Each shares one pair of electrons with oxygen. Partial positive charge δ+." tabindex="0" role="button" aria-label="Hydrogen atoms"><circle cx="666.0" cy="348.6" r="34" fill="#f8fafc" stroke="#334155" stroke-width="3"/><text x="666.0" y="357.6" text-anchor="middle" font-size="26" font-weight="800">H</text><circle cx="334.0" cy="348.6" r="34" fill="#f8fafc" stroke="#334155" stroke-width="3"/><text x="334.0" y="357.6" text-anchor="middle" font-size="26" font-weight="800">H</text></g>
<g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.1500;0.1800;1.0000" values="0;0;1;1" dur="10s" begin="wm-play.begin+0s" fill="freeze"/><circle cx="583.3" cy="290.7" r="6" fill="#111827"/><path d="M 594.3 285.7 l 10 10 m -10 0 l 10 -10" stroke="#2563eb" stroke-width="3"/><circle cx="400.7" cy="290.7" r="6" fill="#111827"/><path d="M 411.7 285.7 l 10 10 m -10 0 l 10 -10" stroke="#2563eb" stroke-width="3"/></g>
<g class="part" data-part="lp" data-name="Lone pairs" data-info="Two non-bonding pairs on oxygen. They repel the bonding pairs more strongly, squeezing the bond angle to 104.5° (less than 109.5°)." tabindex="0" role="button" aria-label="Lone pairs"><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.1500;0.1800;1.0000" values="0;0;1;1" dur="10s" begin="wm-play.begin+0s" fill="freeze"/><ellipse cx="542.0" cy="147.3" rx="26" ry="18" transform="rotate(30 542.0 147.3)" fill="#fde68a" stroke="#ca8a04" stroke-width="2"/><circle cx="535.0" cy="147.3" r="5" fill="#111827"/><circle cx="549.0" cy="147.3" r="5" fill="#111827"/><ellipse cx="458.0" cy="147.3" rx="26" ry="18" transform="rotate(-30 458.0 147.3)" fill="#fde68a" stroke="#ca8a04" stroke-width="2"/><circle cx="451.0" cy="147.3" r="5" fill="#111827"/><circle cx="465.0" cy="147.3" r="5" fill="#111827"/></g></g>
<g class="part" data-part="ang" data-name="Bond angle 104.5°" data-info="Four electron domains around oxygen (tetrahedral arrangement) but only two are bonds, so the molecule is bent (V-shaped)." tabindex="0" role="button" aria-label="Bond angle 104.5°"><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.4000;0.4300;1.0000" values="0;0;1;1" dur="10s" begin="wm-play.begin+0s" fill="freeze"/><path d="M 587.0 287.3 A 110 110 0 0 1 413.0 287.3" fill="none" stroke="#0f766e" stroke-width="3"/><text x="500" y="356" text-anchor="middle" font-size="18" font-weight="800" fill="#0f766e">104.5°</text></g></g>
<g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.6500;0.6800;1.0000" values="0;0;1;1" dur="10s" begin="wm-play.begin+0s" fill="freeze"/><text x="380" y="228" font-size="24" font-weight="800" fill="#b91c1c">δ−</text><text x="706.0" y="388.6" font-size="24" font-weight="800" fill="#1d4ed8">δ+</text><text x="270.0" y="388.6" font-size="24" font-weight="800" fill="#1d4ed8">δ+</text></g>
<g class="part" data-part="dip" data-name="Dipole" data-info="The charges are unevenly spread and the shape is not symmetrical, so water is a polar molecule. This allows hydrogen bonding." tabindex="0" role="button" aria-label="Dipole"><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.7500;0.7800;1.0000" values="0;0;1;1" dur="10s" begin="wm-play.begin+0s" fill="freeze"/><line x1="800" y1="340" x2="800" y2="180" stroke="#7c3aed" stroke-width="5" marker-end="url(#wm-7c3aed)"/><line x1="788" y1="320" x2="812" y2="320" stroke="#7c3aed" stroke-width="5"/><text x="822" y="260" font-size="15" font-weight="700" fill="#6d28d9">dipole (towards δ−)</text></g></g>
<g class="labels"><g class="lbl" data-for="o"><polyline points="232.8,134.0 450.0,190.0"/><circle cx="450.0" cy="190.0" r="2.6"/><text x="180" y="140" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="4">Oxygen atom</text></g><g class="lbl" data-for="h"><polyline points="211.6,464.0 304.0,358.6"/><circle cx="304.0" cy="358.6" r="2.6"/><text x="150" y="470" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="4">Hydrogen atom</text></g><g class="lbl" data-for="bond"><polyline points="757.5,464.0 613.0,284.3"/><circle cx="613.0" cy="284.3" r="2.6"/><text x="880" y="470" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="4">Shared pair (covalent bond)</text></g><g class="lbl" data-for="lp"><polyline points="835.9,114.0 543.0,145.0"/><circle cx="543.0" cy="145.0" r="2.6"/><text x="880" y="120" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="4">Lone pair</text></g></g>
</svg>