<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" class="vd-svg" role="img" aria-labelledby="bh-title bh-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="bh-play" data-vd-play-label="Play: excitation and emission" data-vd-steps="[[0, &quot;A sodium atom: 11 protons and 12 neutrons in the nucleus, and 11 electrons in shells: 2, 8, 1.&quot;], [2, &quot;The outer electron absorbs energy (from heat or light) and jumps to a higher energy level: the atom is excited.&quot;], [5, &quot;The excited state is unstable. The electron falls back to a lower level\u2026&quot;], [6, &quot;\u2026and emits a photon. Its energy equals the difference between the levels (E = hf). For sodium this is yellow light (589 nm).&quot;], [9, &quot;Each element has its own energy levels, so it emits its own pattern of lines: an emission (line) spectrum.&quot;]]" data-vd-dur="12">
<title id="bh-title">Bohr model of the atom</title><desc id="bh-desc">A sodium atom with a nucleus of protons and neutrons and electrons in three shells (2, 8, 1). Play: the outer electron is excited to a higher level, then falls back and emits a photon.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1200" height="620" fill="#ffffff"/>
<g aria-hidden="true"><animate id="bh-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<text class="head" x="30" y="34">Bohr model of the atom: sodium (2, 8, 1)</text><text class="note" x="30" y="56">Not to scale: the nucleus is about 100 000 times smaller than the atom.</text>
<g class="part" data-part="sh" data-name="Shells (energy levels)" data-info="Electrons occupy fixed energy levels. The first holds up to 2 electrons, the second up to 8." tabindex="0" role="button" aria-label="Shells (energy levels)"><circle cx="420" cy="340" r="70" fill="none" stroke="#94a3b8" stroke-width="2" /><circle cx="420" cy="340" r="130" fill="none" stroke="#94a3b8" stroke-width="2" /><circle cx="420" cy="340" r="190" fill="none" stroke="#94a3b8" stroke-width="2" /><circle cx="420" cy="340" r="250" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 5"/><text x="676" y="334" font-size="12" fill="#64748b">empty higher level</text></g>
<g class="part" data-part="nuc" data-name="Nucleus" data-info="Tiny, dense centre of the atom: protons and neutrons. Sodium: 11 protons and 12 neutrons (mass number 23)." tabindex="0" role="button" aria-label="Nucleus"><circle cx="427.3" cy="348.4" r="7" fill="#94a3b8" stroke="#334155"/><circle cx="435.5" cy="336.6" r="7" fill="#94a3b8" stroke="#334155"/><circle cx="438.2" cy="351.3" r="7" fill="#94a3b8" stroke="#334155"/><circle cx="437.4" cy="323.8" r="7" fill="#94a3b8" stroke="#334155"/><circle cx="410.8" cy="361.6" r="7" fill="#94a3b8" stroke="#334155"/><circle cx="413.9" cy="327.1" r="7" fill="#94a3b8" stroke="#334155"/><circle cx="430.1" cy="358.8" r="7" fill="#94a3b8" stroke="#334155"/><circle cx="407.7" cy="332.5" r="7" fill="#94a3b8" stroke="#334155"/><circle cx="408.5" cy="342.9" r="7" fill="#94a3b8" stroke="#334155"/><circle cx="411.5" cy="318.2" r="7" fill="#94a3b8" stroke="#334155"/><circle cx="415.0" cy="351.4" r="7" fill="#94a3b8" stroke="#334155"/><circle cx="442.2" cy="331.1" r="7" fill="#94a3b8" stroke="#334155"/><circle cx="421.3" cy="357.7" r="7" fill="#ef4444" stroke="#7f1d1d"/><circle cx="407.2" cy="353.6" r="7" fill="#ef4444" stroke="#7f1d1d"/><circle cx="415.7" cy="335.6" r="7" fill="#ef4444" stroke="#7f1d1d"/><circle cx="441.9" cy="341.8" r="7" fill="#ef4444" stroke="#7f1d1d"/><circle cx="428.6" cy="325.8" r="7" fill="#ef4444" stroke="#7f1d1d"/><circle cx="405.2" cy="323.2" r="7" fill="#ef4444" stroke="#7f1d1d"/><circle cx="399.6" cy="337.0" r="7" fill="#ef4444" stroke="#7f1d1d"/><circle cx="421.0" cy="321.6" r="7" fill="#ef4444" stroke="#7f1d1d"/><circle cx="418.7" cy="344.0" r="7" fill="#ef4444" stroke="#7f1d1d"/><circle cx="398.2" cy="347.9" r="7" fill="#ef4444" stroke="#7f1d1d"/><circle cx="425.4" cy="334.8" r="7" fill="#ef4444" stroke="#7f1d1d"/></g>
<g class="part" data-part="p" data-name="Proton" data-info="Charge +1, relative mass 1. The number of protons is the atomic number (sodium: 11)." tabindex="0" role="button" aria-label="Proton"><circle cx="421.3" cy="357.7" r="7" fill="#ef4444" stroke="#7f1d1d" stroke-width="2"/></g>
<g class="part" data-part="n" data-name="Neutron" data-info="No charge, relative mass 1." tabindex="0" role="button" aria-label="Neutron"><circle cx="427.3" cy="348.4" r="7" fill="#94a3b8" stroke="#334155" stroke-width="2"/></g>
<g class="part" data-part="e" data-name="Electron" data-info="Charge −1, very small mass (about 1/1840). Sodium has 11 electrons: 2, 8, 1." tabindex="0" role="button" aria-label="Electron"><circle cx="490.0" cy="340.0" r="8" fill="#2563eb" stroke="#1e3a8a"/><circle cx="350.0" cy="340.0" r="8" fill="#2563eb" stroke="#1e3a8a"/><circle cx="544.2" cy="378.4" r="8" fill="#2563eb" stroke="#1e3a8a"/><circle cx="480.7" cy="455.0" r="8" fill="#2563eb" stroke="#1e3a8a"/><circle cx="381.6" cy="464.2" r="8" fill="#2563eb" stroke="#1e3a8a"/><circle cx="305.0" cy="400.7" r="8" fill="#2563eb" stroke="#1e3a8a"/><circle cx="295.8" cy="301.6" r="8" fill="#2563eb" stroke="#1e3a8a"/><circle cx="359.3" cy="225.0" r="8" fill="#2563eb" stroke="#1e3a8a"/><circle cx="458.4" cy="215.8" r="8" fill="#2563eb" stroke="#1e3a8a"/><circle cx="535.0" cy="279.3" r="8" fill="#2563eb" stroke="#1e3a8a"/></g>
<g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.2167;0.2667;0.4167;0.4667;1.0000" values="0 0;0 0;30.0 -51.96152422706632;30.0 -51.96152422706632;0 0;0 0" dur="12s" begin="bh-play.begin+0s" fill="freeze"/><circle cx="515.0" cy="175.5" r="8" fill="#2563eb" stroke="#1e3a8a"/></g>
<g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.1667;0.1833;0.2333;0.2500;1.0000" values="0;0;1;1;0;0" dur="12s" begin="bh-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.1667;0.2250;1.0000" values="685.0 55.45517328095667;685.0 55.45517328095667;525.0 165.45517328095667;525.0 165.45517328095667" dur="12s" begin="bh-play.begin+0s" fill="freeze"/><g transform="rotate(144)"><path d="M 0 0 q 6 -8 12 0 q 6 8 12 0 q 6 -8 12 0 q 6 8 12 0 q 6 -8 12 0 q 6 8 12 0" fill="none" stroke="#a855f7" stroke-width="3"/></g></g></g>
<g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.1667;0.1917;0.3833;0.4083;1.0000" values="0;0;1;1;0;0" dur="12s" begin="bh-play.begin+0s" fill="freeze"/><rect x="590.0" y="71.49364905389035" width="130" height="24" rx="12" fill="#ede9fe" stroke="#1f2937" stroke-width="1"/><text x="655.0" y="88.49364905389035" text-anchor="middle" font-size="12" font-weight="700">energy absorbed</text></g>
<g class="part" data-part="ph" data-name="Photon" data-info="When an electron falls to a lower level it emits a photon. Its energy equals the difference between the two levels (E = hf), so only certain frequencies are emitted: a line spectrum." tabindex="0" role="button" aria-label="Photon"><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.4667;0.4833;0.7500;0.7667;1.0000" values="0;0;1;1;0;0" dur="12s" begin="bh-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.4667;0.6333;1.0000" values="525.0 175.45517328095667;525.0 175.45517328095667;845.0 135.45517328095667;845.0 135.45517328095667" dur="12s" begin="bh-play.begin+0s" fill="freeze"/><path d="M 0 0 q 6 -8 12 0 q 6 8 12 0 q 6 -8 12 0 q 6 8 12 0 q 6 -8 12 0 q 6 8 12 0" fill="none" stroke="#eab308" stroke-width="3"/></g></g></g>
<g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.5000;0.5250;1.0000" values="0;0;1;1" dur="12s" begin="bh-play.begin+0s" fill="freeze"/><rect x="655.0" y="151.49364905389035" width="180" height="24" rx="12" fill="#fef9c3" stroke="#1f2937" stroke-width="1"/><text x="745.0" y="168.49364905389035" text-anchor="middle" font-size="12" font-weight="700">photon emitted: E = hf</text></g>
<g font-size="13"><text x="820" y="300" font-weight="700">Energy levels</text><line x1="820" y1="560" x2="1000" y2="560" stroke="#334155" stroke-width="3"/><text x="1010" y="565">n = 1</text><line x1="820" y1="480" x2="1000" y2="480" stroke="#334155" stroke-width="3"/><text x="1010" y="485">n = 2</text><line x1="820" y1="410" x2="1000" y2="410" stroke="#334155" stroke-width="3"/><text x="1010" y="415">n = 3</text><line x1="820" y1="370" x2="1000" y2="370" stroke="#334155" stroke-width="3"/><text x="1010" y="375">n = 4</text><path d="M 810 560 L 810 330" stroke="#334155" stroke-width="2" marker-end="url(#bh-334155)"/><text x="800" y="450" text-anchor="middle" transform="rotate(-90 800 450)">energy</text></g>
