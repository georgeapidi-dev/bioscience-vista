<g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.2000;0.2250;0.4167;0.4417;1.0000" values="0;0;1;1;0;0" dur="12s" begin="bh-play.begin+0s" fill="freeze"/><line x1="880" y1="408" x2="880" y2="376" stroke="#a855f7" stroke-width="3" marker-end="url(#bh-a855f7)"/><text x="868" y="394" text-anchor="end" font-size="12" fill="#7c3aed">absorbs</text></g>
<g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.4500;0.4750;1.0000" values="0;0;1;1" dur="12s" begin="bh-play.begin+0s" fill="freeze"/><line x1="940" y1="372" x2="940" y2="404" stroke="#ca8a04" stroke-width="3" marker-end="url(#bh-ca8a04)"/><text x="950" y="394" font-size="12" fill="#a16207">emits</text></g>
<g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.7500;0.7750;1.0000" values="0;0;1;1" dur="12s" begin="bh-play.begin+0s" fill="freeze"/><rect x="820" y="216" width="340" height="36" fill="#111827"/><rect x="1012" y="216" width="5" height="36" fill="#facc15"/><text x="820" y="270" font-size="12">Sodium emission spectrum: bright yellow line at 589 nm</text><text x="820" y="208" font-size="12" font-weight="700">Line spectrum</text></g>
<g class="labels"><g class="lbl" data-for="nuc"><polyline points="175.4,104.0 170.0,140.0 440.0,322.0"/><circle cx="440.0" cy="322.0" r="2.6"/><text x="140" y="110" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="4">Nucleus</text></g><g class="lbl" data-for="p"><polyline points="152.0,194.0 421.3,357.7"/><circle cx="421.3" cy="357.7" r="2.6"/><text x="60" y="200" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="4">Proton (+)</text></g><g class="lbl" data-for="n"><polyline points="125.9,244.0 427.3,348.4"/><circle cx="427.3" cy="348.4" r="2.6"/><text x="60" y="250" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="4">Neutron</text></g><g class="lbl" data-for="e"><polyline points="169.4,464.0 240.0,470.0 550.0,340.0"/><circle cx="550.0" cy="340.0" r="2.6"/><text x="60" y="470" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="4">Electron (−)</text></g><g class="lbl" data-for="sh"><polyline points="239.0,534.0 280.0,540.0 371.0,389.0"/><circle cx="371.0" cy="389.0" r="2.6"/><text x="60" y="540" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="4">Shell (energy level)</text></g></g>
