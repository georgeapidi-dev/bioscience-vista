<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 540" class="vd-svg" role="img" aria-labelledby="hc-title hc-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="hc-play" data-vd-play-label="Play: catalyse" data-vd-steps="[[0, &quot;Heterogeneous catalysis: the Haber process on iron.&quot;], [1, &quot;Adsorption: N\u2082 and H\u2082 stick to active sites.&quot;], [4.5, &quot;Bonds weaken and new N\u2013H bonds form.&quot;], [8.5, &quot;Desorption: ammonia leaves, freeing the sites.&quot;], [11.5, &quot;Homogeneous catalysts are in the same phase.&quot;]]" data-vd-dur="14">
<title id="hc-title">Heterogeneous catalysis</title><desc id="hc-desc">Nitrogen and hydrogen molecules adsorb onto active sites on an iron surface, their bonds weaken and ammonia forms, then desorbs; homogeneous catalysts are in the same phase as the reactants.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="540" fill="#ffffff"/>
<g aria-hidden="true"><animate id="hc-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<text class="head" x="30" y="34">Heterogeneous catalysis: adsorption, reaction, desorption</text><text class="note" x="30" y="56">N₂ + 3H₂ ⇌ 2NH₃ on iron (schematic).</text>
<rect x="40" y="390" width="760" height="70" fill="#94a3b8"/><circle cx="60" cy="390" r="18" fill="#a1a1aa" stroke="#52525b"/><circle cx="100" cy="390" r="18" fill="#a1a1aa" stroke="#52525b"/><circle cx="140" cy="390" r="18" fill="#a1a1aa" stroke="#52525b"/><circle cx="180" cy="390" r="18" fill="#a1a1aa" stroke="#52525b"/><circle cx="220" cy="390" r="18" fill="#a1a1aa" stroke="#52525b"/><circle cx="260" cy="390" r="18" fill="#a1a1aa" stroke="#52525b"/><circle cx="300" cy="390" r="18" fill="#a1a1aa" stroke="#52525b"/><circle cx="340" cy="390" r="18" fill="#a1a1aa" stroke="#52525b"/><circle cx="380" cy="390" r="18" fill="#a1a1aa" stroke="#52525b"/><circle cx="420" cy="390" r="18" fill="#a1a1aa" stroke="#52525b"/><circle cx="460" cy="390" r="18" fill="#a1a1aa" stroke="#52525b"/><circle cx="500" cy="390" r="18" fill="#a1a1aa" stroke="#52525b"/><circle cx="540" cy="390" r="18" fill="#a1a1aa" stroke="#52525b"/><circle cx="580" cy="390" r="18" fill="#a1a1aa" stroke="#52525b"/><circle cx="620" cy="390" r="18" fill="#a1a1aa" stroke="#52525b"/><circle cx="660" cy="390" r="18" fill="#a1a1aa" stroke="#52525b"/><circle cx="700" cy="390" r="18" fill="#a1a1aa" stroke="#52525b"/><circle cx="740" cy="390" r="18" fill="#a1a1aa" stroke="#52525b"/><circle cx="780" cy="390" r="18" fill="#a1a1aa" stroke="#52525b"/><text x="420" y="490" text-anchor="middle" font-size="13" font-weight="800" fill="#334155">iron catalyst surface (active sites)</text>
<g class="part" data-part="ads" data-name="Adsorption" data-info="Reactant molecules (e.g. N₂ and H₂ on iron) form weak bonds to active sites on the catalyst surface." tabindex="0" role="button" aria-label="Adsorption"><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.0000;0.0143;0.4286;0.4429;1.0000" values="0;0;1;1;0;0" dur="14s" begin="hc-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.0714;0.2143;1.0000" values="200 150;200 150;240 355;240 355" dur="14s" begin="hc-play.begin+0s" fill="freeze"/><circle cx="0" cy="0" r="14" fill="#3b82f6" stroke="#1f2937" stroke-width="1.5"/><text x="0" y="5" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">N</text><line x1="0.0" y1="6.4" x2="28.0" y2="6.4" stroke="#334155" stroke-width="3"/><line x1="0.0" y1="0.0" x2="28.0" y2="0.0" stroke="#334155" stroke-width="3"/><line x1="0.0" y1="-6.4" x2="28.0" y2="-6.4" stroke="#334155" stroke-width="3"/><circle cx="28" cy="0" r="14" fill="#3b82f6" stroke="#1f2937" stroke-width="1.5"/><text x="28" y="5" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">N</text></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.0000;0.0143;0.4286;0.4429;1.0000" values="0;0;1;1;0;0" dur="14s" begin="hc-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.0929;0.2357;1.0000" values="420 140;420 140;440 360;440 360" dur="14s" begin="hc-play.begin+0s" fill="freeze"/><circle cx="0" cy="0" r="10" fill="#f8fafc" stroke="#1f2937" stroke-width="1.5"/><text x="0" y="5" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">H</text><line x1="0" y1="0" x2="20" y2="0" stroke="#334155" stroke-width="4"/><circle cx="20" cy="0" r="10" fill="#f8fafc" stroke="#1f2937" stroke-width="1.5"/><text x="20" y="5" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">H</text></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.0000;0.0143;0.4286;0.4429;1.0000" values="0;0;1;1;0;0" dur="14s" begin="hc-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.1143;0.2571;1.0000" values="560 160;560 160;560 360;560 360" dur="14s" begin="hc-play.begin+0s" fill="freeze"/><circle cx="0" cy="0" r="10" fill="#f8fafc" stroke="#1f2937" stroke-width="1.5"/><text x="0" y="5" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">H</text><line x1="0" y1="0" x2="20" y2="0" stroke="#334155" stroke-width="4"/><circle cx="20" cy="0" r="10" fill="#f8fafc" stroke="#1f2937" stroke-width="1.5"/><text x="20" y="5" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">H</text></g></g><g><animate attributeName="opacity" keyTimes="0.0000;0.2143;0.2357;1.0000" values="0;0;1;1" dur="14s" begin="hc-play.begin+0s" fill="freeze"/><text x="150" y="300" text-anchor="middle" font-size="13" font-weight="800" fill="#1d4ed8">adsorbed</text></g></g>
<g class="part" data-part="weak" data-name="Bonds weaken" data-info="Bonds within the reactants weaken, lowering the activation energy; reactants are held close together in a good orientation." tabindex="0" role="button" aria-label="Bonds weaken"><g><animate attributeName="opacity" keyTimes="0.0000;0.3214;0.3429;1.0000" values="0;0;1;1" dur="14s" begin="hc-play.begin+0s" fill="freeze"/><circle cx="254" cy="355" r="30" fill="#fde68a" opacity=".5"/><text x="300" y="290" text-anchor="middle" font-size="13" font-weight="800" fill="#a16207">bonds weaken: lower Ea</text></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.4286;0.4429;0.6143;0.6286;1.0000" values="0;0;1;1;0;0" dur="14s" begin="hc-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.4286;0.6071;1.0000" values="330 350;330 350;340 350;340 350" dur="14s" begin="hc-play.begin+0s" fill="freeze"/><circle cx="0" cy="0" r="14" fill="#3b82f6" stroke="#1f2937" stroke-width="1.5"/><text x="0" y="5" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">N</text><line x1="0" y1="0" x2="0" y2="-24" stroke="#334155" stroke-width="4"/><circle cx="0" cy="-24" r="9" fill="#f8fafc" stroke="#1f2937" stroke-width="1.5"/><text x="0" y="-19" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">H</text><line x1="0" y1="0" x2="22" y2="8" stroke="#334155" stroke-width="4"/><circle cx="22" cy="8" r="9" fill="#f8fafc" stroke="#1f2937" stroke-width="1.5"/><text x="22" y="13" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">H</text><line x1="0" y1="0" x2="-22" y2="8" stroke="#334155" stroke-width="4"/><circle cx="-22" cy="8" r="9" fill="#f8fafc" stroke="#1f2937" stroke-width="1.5"/><text x="-22" y="13" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">H</text></g></g></g>
<g class="part" data-part="des" data-name="Desorption" data-info="Products form and leave the surface, freeing the active sites." tabindex="0" role="button" aria-label="Desorption"><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.6071;0.6214;1.0000" values="0;0;1;1" dur="14s" begin="hc-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.6071;0.7857;1.0000" values="340 350;340 350;420 140;420 140" dur="14s" begin="hc-play.begin+0s" fill="freeze"/><circle cx="0" cy="0" r="14" fill="#3b82f6" stroke="#1f2937" stroke-width="1.5"/><text x="0" y="5" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">N</text><line x1="0" y1="0" x2="0" y2="-24" stroke="#334155" stroke-width="4"/><circle cx="0" cy="-24" r="9" fill="#f8fafc" stroke="#1f2937" stroke-width="1.5"/><text x="0" y="-19" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">H</text><line x1="0" y1="0" x2="22" y2="8" stroke="#334155" stroke-width="4"/><circle cx="22" cy="8" r="9" fill="#f8fafc" stroke="#1f2937" stroke-width="1.5"/><text x="22" y="13" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">H</text><line x1="0" y1="0" x2="-22" y2="8" stroke="#334155" stroke-width="4"/><circle cx="-22" cy="8" r="9" fill="#f8fafc" stroke="#1f2937" stroke-width="1.5"/><text x="-22" y="13" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">H</text></g></g><g><animate attributeName="opacity" keyTimes="0.0000;0.6786;0.7000;1.0000" values="0;0;1;1" dur="14s" begin="hc-play.begin+0s" fill="freeze"/><text x="500" y="130" text-anchor="start" font-size="13" font-weight="800" fill="#15803d">NH₃ desorbs</text></g></g>
<g class="part" data-part="homo" data-name="Homogeneous catalysts" data-info="Same phase as the reactants, e.g. NO₂ catalysing the oxidation of SO₂ in the atmosphere; Fe²⁺/Fe³⁺ for I⁻ + S₂O₈²⁻." tabindex="0" role="button" aria-label="Homogeneous catalysts"><g><animate attributeName="opacity" keyTimes="0.0000;0.8214;0.8429;1.0000" values="0;0;1;1" dur="14s" begin="hc-play.begin+0s" fill="freeze"/><rect x="830" y="100" width="240" height="330" rx="16" fill="#f0f9ff" stroke="#7dd3fc"/><text x="950" y="128" text-anchor="middle" font-size="14" font-weight="800" fill="#0369a1">homogeneous</text><text x="950" y="150" text-anchor="middle" font-size="12" font-weight="700" fill="#0369a1">(same phase)</text><text x="950" y="196" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">NO₂ in air:</text><text x="950" y="218" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">SO₂ + NO₂ → SO₃ + NO</text><text x="950" y="238" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">NO + ½O₂ → NO₂</text><text x="950" y="290" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">Fe²⁺/Fe³⁺ in solution:</text><text x="950" y="312" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">S₂O₈²⁻ + 2I⁻</text><text x="950" y="332" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">→ 2SO₄²⁻ + I₂</text><text x="950" y="390" text-anchor="middle" font-size="12" font-weight="800" fill="#15803d">catalyst regenerated</text></g></g>
</svg>