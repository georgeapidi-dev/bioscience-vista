<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" class="vd-svg" role="img" aria-labelledby="pc-title pc-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="pc-play" data-vd-play-label="Play: calculate pH" data-vd-steps="[[0, &quot;Calculating pH.&quot;], [1, &quot;Strong acid: [H\u207a] = concentration.&quot;], [4, &quot;Strong base: use Kw.&quot;], [7, &quot;Weak acid: [H\u207a] = \u221a(Ka \u00d7 c).&quot;], [11, &quot;Same concentration, very different pH.&quot;]]" data-vd-dur="14">
<title id="pc-title">Calculating pH</title><desc id="pc-desc">Worked calculations of pH for 0.100 mole per cubic decimetre hydrochloric acid, sodium hydroxide and ethanoic acid, giving pH 1.00, 13.00 and 2.88, shown on a pH scale.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="560" fill="#ffffff"/>
<g aria-hidden="true"><animate id="pc-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<text class="head" x="30" y="34">Calculating pH: strong acids, strong bases and weak acids</text><text class="note" x="30" y="56">All solutions 0.100 mol dm⁻³ at 298 K; Kw = 1.00 × 10⁻¹⁴ mol² dm⁻⁶.</text>
<g class="part" data-part="strong" data-name="Strong acids and bases" data-info="pH = −log[H⁺]. 0.100 mol dm⁻³ HCl: pH 1.00. Strong bases: [H⁺] = Kw/[OH⁻]; 0.100 mol dm⁻³ NaOH: pH 13.00 (Kw = 1.00 × 10⁻¹⁴ at 298 K)." tabindex="0" role="button" aria-label="Strong acids and bases"><g><animate attributeName="opacity" keyTimes="0.0000;0.0714;0.0929;1.0000" values="0;0;1;1" dur="14s" begin="pc-play.begin+0s" fill="freeze"/><rect x="40" y="80" width="330" height="220" rx="16" fill="#fff" stroke="#dc2626" stroke-width="2"/><text x="205" y="110" text-anchor="middle" font-size="15" font-weight="800" fill="#dc2626">HCl (strong acid)</text><text x="205" y="156" text-anchor="middle" font-size="14" font-weight="800" fill="#111827">[H⁺] = 0.100</text><text x="205" y="196" text-anchor="middle" font-size="14" font-weight="800" fill="#111827">pH = −log 0.100</text><text x="205" y="236" text-anchor="middle" font-size="14" font-weight="800" fill="#111827">= 1.00</text></g></g>
<g><animate attributeName="opacity" keyTimes="0.0000;0.2857;0.3071;1.0000" values="0;0;1;1" dur="14s" begin="pc-play.begin+0s" fill="freeze"/><rect x="390" y="80" width="330" height="220" rx="16" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="555" y="110" text-anchor="middle" font-size="15" font-weight="800" fill="#2563eb">NaOH (strong base)</text><text x="555" y="156" text-anchor="middle" font-size="14" font-weight="800" fill="#111827">[OH⁻] = 0.100</text><text x="555" y="196" text-anchor="middle" font-size="14" font-weight="800" fill="#111827">[H⁺] = 10⁻¹⁴ ÷ 0.100 = 10⁻¹³</text><text x="555" y="236" text-anchor="middle" font-size="14" font-weight="800" fill="#111827">pH = 13.00</text></g>
<g class="part" data-part="weak" data-name="Weak acids" data-info="Ka = [H⁺][A⁻]/[HA]; assume [H⁺] = [A⁻] and [HA] ≈ initial concentration: [H⁺] = √(Ka × c). 0.100 mol dm⁻³ CH₃COOH (Ka 1.74 × 10⁻⁵): [H⁺] = 1.32 × 10⁻³, pH 2.88." tabindex="0" role="button" aria-label="Weak acids"><g><animate attributeName="opacity" keyTimes="0.0000;0.5000;0.5214;1.0000" values="0;0;1;1" dur="14s" begin="pc-play.begin+0s" fill="freeze"/><rect x="740" y="80" width="330" height="220" rx="16" fill="#fff" stroke="#f59e0b" stroke-width="2"/><text x="905" y="110" text-anchor="middle" font-size="15" font-weight="800" fill="#f59e0b">CH₃COOH (weak acid)</text><text x="905" y="156" text-anchor="middle" font-size="14" font-weight="800" fill="#111827">[H⁺] = √(1.74 × 10⁻⁵ × 0.100)</text><text x="905" y="196" text-anchor="middle" font-size="14" font-weight="800" fill="#111827">= 1.32 × 10⁻³</text><text x="905" y="236" text-anchor="middle" font-size="14" font-weight="800" fill="#111827">pH = 2.88</text></g></g>
<rect x="80" y="360" width="68" height="40" fill="hsl(0,80%,60%)"/><rect x="147" y="360" width="68" height="40" fill="hsl(19,80%,60%)"/><rect x="214" y="360" width="68" height="40" fill="hsl(37,80%,60%)"/><rect x="281" y="360" width="68" height="40" fill="hsl(56,80%,60%)"/><rect x="349" y="360" width="68" height="40" fill="hsl(74,80%,60%)"/><rect x="416" y="360" width="68" height="40" fill="hsl(93,80%,60%)"/><rect x="483" y="360" width="68" height="40" fill="hsl(111,80%,60%)"/><rect x="550" y="360" width="68" height="40" fill="hsl(130,80%,60%)"/><rect x="617" y="360" width="68" height="40" fill="hsl(149,80%,60%)"/><rect x="684" y="360" width="68" height="40" fill="hsl(167,80%,60%)"/><rect x="751" y="360" width="68" height="40" fill="hsl(186,80%,60%)"/><rect x="819" y="360" width="68" height="40" fill="hsl(204,80%,60%)"/><rect x="886" y="360" width="68" height="40" fill="hsl(223,80%,60%)"/><rect x="953" y="360" width="68" height="40" fill="hsl(241,80%,60%)"/><text x="80.0" y="418" text-anchor="middle" font-size="11" font-weight="800" fill="#111827">0</text><text x="147.14285714285714" y="418" text-anchor="middle" font-size="11" font-weight="800" fill="#111827">1</text><text x="214.28571428571428" y="418" text-anchor="middle" font-size="11" font-weight="800" fill="#111827">2</text><text x="281.42857142857144" y="418" text-anchor="middle" font-size="11" font-weight="800" fill="#111827">3</text><text x="348.57142857142856" y="418" text-anchor="middle" font-size="11" font-weight="800" fill="#111827">4</text><text x="415.7142857142857" y="418" text-anchor="middle" font-size="11" font-weight="800" fill="#111827">5</text><text x="482.85714285714283" y="418" text-anchor="middle" font-size="11" font-weight="800" fill="#111827">6</text><text x="550.0" y="418" text-anchor="middle" font-size="11" font-weight="800" fill="#111827">7</text><text x="617.1428571428571" y="418" text-anchor="middle" font-size="11" font-weight="800" fill="#111827">8</text><text x="684.2857142857143" y="418" text-anchor="middle" font-size="11" font-weight="800" fill="#111827">9</text><text x="751.4285714285714" y="418" text-anchor="middle" font-size="11" font-weight="800" fill="#111827">10</text><text x="818.5714285714286" y="418" text-anchor="middle" font-size="11" font-weight="800" fill="#111827">11</text><text x="885.7142857142857" y="418" text-anchor="middle" font-size="11" font-weight="800" fill="#111827">12</text><text x="952.8571428571429" y="418" text-anchor="middle" font-size="11" font-weight="800" fill="#111827">13</text><text x="1020.0" y="418" text-anchor="middle" font-size="11" font-weight="800" fill="#111827">14</text><g><animate attributeName="opacity" keyTimes="0.0000;0.2143;0.2357;1.0000" values="0;0;1;1" dur="14s" begin="pc-play.begin+0s" fill="freeze"/><path d="M 147 350 l -8 -14 l 16 0 z" fill="#dc2626"/><text x="147.14285714285714" y="330" text-anchor="middle" font-size="13" font-weight="800" fill="#dc2626">1.00</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.4286;0.4500;1.0000" values="0;0;1;1" dur="14s" begin="pc-play.begin+0s" fill="freeze"/><path d="M 953 350 l -8 -14 l 16 0 z" fill="#2563eb"/><text x="952.8571428571429" y="330" text-anchor="middle" font-size="13" font-weight="800" fill="#2563eb">13.00</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.6429;0.6643;1.0000" values="0;0;1;1" dur="14s" begin="pc-play.begin+0s" fill="freeze"/><path d="M 273 350 l -8 -14 l 16 0 z" fill="#f59e0b"/><text x="273.37142857142857" y="330" text-anchor="middle" font-size="13" font-weight="800" fill="#f59e0b">2.88</text></g>
<g class="part" data-part="pka" data-name="pKa" data-info="pKa = −log Ka. Smaller pKa → stronger acid. Ethanoic acid pKa 4.76." tabindex="0" role="button" aria-label="pKa"><g><animate attributeName="opacity" keyTimes="0.0000;0.7857;0.8071;1.0000" values="0;0;1;1" dur="14s" begin="pc-play.begin+0s" fill="freeze"/><rect x="40" y="450" width="1020" height="90" rx="16" fill="#f0fdf4" stroke="#86efac"/><text x="550" y="482" text-anchor="middle" font-size="14" font-weight="800" fill="#15803d">Ka = [H⁺][A⁻] / [HA] · pKa = −log Ka (ethanoic acid 4.76) · smaller pKa = stronger acid</text><text x="550" y="512" text-anchor="middle" font-size="12" font-weight="700" fill="#475569">weak acid assumptions: [H⁺] = [A⁻]; [HA] at equilibrium ≈ initial concentration</text></g></g>
</svg>