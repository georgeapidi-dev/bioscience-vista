<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" class="vd-svg" role="img" aria-labelledby="tl-title tl-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="tl-play" data-vd-play-label="Play: run the plate" data-vd-steps="[[0, &quot;Thin-layer chromatography.&quot;], [1, &quot;Spots on a pencil baseline, above the solvent.&quot;], [4, &quot;The solvent front rises; components separate.&quot;], [10, &quot;Calculate Rf = spot distance \u00f7 solvent distance.&quot;]]" data-vd-dur="15">
<title id="tl-title">Thin-layer chromatography</title><desc id="tl-desc">A TLC plate in a covered tank: a mixture and two standards are spotted on a pencil baseline, the solvent front rises and separates the spots, and the Rf value is calculated as the distance moved by the spot divided by the distance moved by the solvent.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="560" fill="#ffffff"/>
<g aria-hidden="true"><animate id="tl-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<text class="head" x="30" y="34">Thin-layer chromatography (TLC)</text><text class="note" x="30" y="56">Rf = distance moved by spot ÷ distance moved by solvent front.</text>
<g class="part" data-part="plate" data-name="The plate" data-info="Stationary phase: a thin layer of silica (or alumina) on a plate. Spots on a pencil baseline, above the solvent level; a lid keeps the tank saturated." tabindex="0" role="button" aria-label="The plate"><rect x="120" y="90" width="320" height="420" rx="10" fill="#f8fafc" stroke="#334155" stroke-width="3"/><rect x="110" y="80" width="340" height="16" fill="#94a3b8"/><rect x="122" y="460" width="316" height="48" fill="#bfdbfe" opacity=".8"/><rect x="170" y="110" width="220" height="380" fill="#fff" stroke="#64748b"/><line x1="170" y1="440" x2="390" y2="440" stroke="#475569" stroke-width="2" stroke-dasharray="4 3"/><text x="160" y="444" text-anchor="end" font-size="10" font-weight="800" fill="#475569">baseline (pencil)</text><rect x="171" y="440" width="218" height="0" fill="#bfdbfe" opacity=".5"><animate attributeName="y" keyTimes="0.0000;0.2667;0.6000;1.0000" values="440;440;150;150" dur="15s" begin="tl-play.begin+0s" fill="freeze"/><animate attributeName="height" keyTimes="0.0000;0.2667;0.6000;1.0000" values="0;0;290;290" dur="15s" begin="tl-play.begin+0s" fill="freeze"/></rect><g><animate attributeName="opacity" keyTimes="0.0000;0.6000;0.6200;1.0000" values="0;0;1;1" dur="15s" begin="tl-play.begin+0s" fill="freeze"/><line x1="170" y1="150" x2="390" y2="150" stroke="#1d4ed8" stroke-width="2"/><text x="400" y="154" text-anchor="start" font-size="11" font-weight="800" fill="#1d4ed8">solvent front</text></g><text x="210" y="470" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">mixture</text><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.0000;0.0133;1.0000" values="0;0;1;1" dur="15s" begin="tl-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.2667;0.6000;1.0000" values="210 440;210 440;210 222.5;210 222.5" dur="15s" begin="tl-play.begin+0s" fill="freeze"/><ellipse rx="12" ry="8" fill="#dc2626" opacity=".8"/></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.0000;0.0133;1.0000" values="0;0;1;1" dur="15s" begin="tl-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.2667;0.6000;1.0000" values="210 440;210 440;210 353.0;210 353.0" dur="15s" begin="tl-play.begin+0s" fill="freeze"/><ellipse rx="12" ry="8" fill="#16a34a" opacity=".8"/></g></g><text x="280" y="470" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">A</text><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.0000;0.0133;1.0000" values="0;0;1;1" dur="15s" begin="tl-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.2667;0.6000;1.0000" values="280 440;280 440;280 222.5;280 222.5" dur="15s" begin="tl-play.begin+0s" fill="freeze"/><ellipse rx="12" ry="8" fill="#dc2626" opacity=".8"/></g></g><text x="350" y="470" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">B</text><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.0000;0.0133;1.0000" values="0;0;1;1" dur="15s" begin="tl-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.2667;0.6000;1.0000" values="350 440;350 440;350 353.0;350 353.0" dur="15s" begin="tl-play.begin+0s" fill="freeze"/><ellipse rx="12" ry="8" fill="#16a34a" opacity=".8"/></g></g></g>
<g class="part" data-part="run" data-name="Separation" data-info="The solvent (mobile phase) rises by capillary action. Components that are more soluble in the solvent and less strongly adsorbed onto the stationary phase move further." tabindex="0" role="button" aria-label="Separation"><g><animate attributeName="opacity" keyTimes="0.0000;0.4000;0.4200;1.0000" values="0;0;1;1" dur="15s" begin="tl-play.begin+0s" fill="freeze"/><rect x="500" y="90" width="570" height="170" rx="16" fill="#f0f9ff" stroke="#7dd3fc"/><text x="785" y="118" text-anchor="middle" font-size="14" font-weight="800" fill="#0369a1">why they separate</text><text x="785" y="156" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">stationary phase: silica (polar) · mobile phase: solvent</text><text x="785" y="186" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">more soluble in solvent / less adsorbed → moves further</text><text x="785" y="216" text-anchor="middle" font-size="12" font-weight="800" fill="#15803d">mixture = A + B (same Rf on the same plate)</text></g></g>
<g class="part" data-part="rf" data-name="Rf values" data-info="Rf = distance moved by the spot ÷ distance moved by the solvent front. Compare with standards run on the same plate. Colourless spots: UV lamp, iodine, or ninhydrin (amino acids)." tabindex="0" role="button" aria-label="Rf values"><g><animate attributeName="opacity" keyTimes="0.0000;0.6667;0.6867;1.0000" values="0;0;1;1" dur="15s" begin="tl-play.begin+0s" fill="freeze"/><rect x="500" y="290" width="570" height="220" rx="16" fill="#fef9c3" stroke="#eab308"/><text x="785" y="320" text-anchor="middle" font-size="14" font-weight="800" fill="#713f12">Rf calculation</text><text x="785" y="360" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">solvent front: 10.0 cm from baseline</text><text x="785" y="390" text-anchor="middle" font-size="14" font-weight="800" fill="#b91c1c">red spot: 7.5 cm → Rf = 7.5 ÷ 10.0 = 0.75</text><text x="785" y="420" text-anchor="middle" font-size="14" font-weight="800" fill="#15803d">green spot: 3.0 cm → Rf = 0.30</text><text x="785" y="462" text-anchor="middle" font-size="12" font-weight="700" fill="#475569">colourless spots: UV lamp, iodine, ninhydrin</text></g></g>
</svg>