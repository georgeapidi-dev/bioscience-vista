" y1="260" x2="291.68309414322493" y2="241.18889211708822" stroke="#334155" stroke-width="4"/><circle cx="296.3815572471545" cy="239.47879140045987" r="11" fill="#f8fafc" stroke="#1f2937" stroke-width="1.5"/><text x="296.3815572471545" y="244.47879140045987" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">H</text><line x1="240" y1="260" x2="258.81110788291176" y2="208.31690585677504" stroke="#334155" stroke-width="4"/><circle cx="260.52120859954016" cy="203.6184427528455" r="11" fill="#f8fafc" stroke="#1f2937" stroke-width="1.5"/><text x="260.52120859954016" y="208.6184427528455" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">H</text><circle cx="150" cy="260" r="18" fill="#374151" stroke="#1f2937" stroke-width="1.5"/><text x="150" y="265" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">C</text><circle cx="240" cy="260" r="18" fill="#374151" stroke="#1f2937" stroke-width="1.5"/><text x="240" y="265" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">C</text><g><animate attributeName="opacity" keyTimes="0.0000;0.1071;0.1286;1.0000" values="0;0;1;1" dur="14s" begin="hy-play.begin+0s" fill="freeze"/><text x="195" y="400" text-anchor="middle" font-size="15" font-weight="800" fill="#1d4ed8">tetrahedral · 109.5°</text><text x="195" y="428" text-anchor="middle" font-size="12" font-weight="700" fill="#475569">4 σ bonds</text></g></g></g>
<g class="part" data-part="sp2" data-name="sp² carbon" data-info="Three σ bonds and one π bond, trigonal planar, 120°: e.g. ethene; the π bond is above and below the plane, so no rotation about C=C." tabindex="0" role="button" aria-label="sp² carbon"><g><animate attributeName="opacity" keyTimes="0.0000;0.3571;0.3786;1.0000" values="0;0;1;1" dur="14s" begin="hy-play.begin+0s" fill="freeze"/><rect x="385" y="80" width="330" height="400" rx="16" fill="#f8fafc" stroke="#cbd5e1"/><text x="550" y="106" text-anchor="middle" font-size="15" font-weight="800" fill="#111827">sp²: ethene</text><g><animate attributeName="opacity" keyTimes="0.0000;0.4643;0.4857;1.0000" values="0;0;1;1" dur="14s" begin="hy-play.begin+0s" fill="freeze"/><ellipse cx="550" cy="225" rx="60" ry="22" fill="#a78bfa" opacity=".5"/><ellipse cx="550" cy="295" rx="60" ry="22" fill="#a78bfa" opacity=".5"/><text x="640" y="220" text-anchor="middle" font-size="18" font-weight="800" fill="#6d28d9">π</text></g><line x1="505" y1="260" x2="595" y2="260" stroke="#334155" stroke-width="4"/><line x1="505" y1="260" x2="477.5" y2="307.6313972081441" stroke="#334155" stroke-width="4"/><circle cx="474.0" cy="313.6935750346352" r="11" fill="#f8fafc" stroke="#1f2937" stroke-width="1.5"/><text x="474.0" y="318.6935750346352" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">H</text><line x1="505" y1="260" x2="477.5" y2="212.3686027918559" stroke="#334155" stroke-width="4"/><circle cx="474.0" cy="206.3064249653648" r="11" fill="#f8fafc" stroke="#1f2937" stroke-width="1.5"/><text x="474.0" y="211.3064249653648" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">H</text><line x1="595" y1="260" x2="622.5" y2="307.6313972081441" stroke="#334155" stroke-width="4"/><circle cx="626.0" cy="313.6935750346352" r="11" fill="#f8fafc" stroke="#1f2937" stroke-width="1.5"/><text x="626.0" y="318.6935750346352" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">H</text><line x1="595" y1="260" x2="622.5" y2="212.3686027918559" stroke="#334155" stroke-width="4"/><circle cx="626.0" cy="206.3064249653648" r="11" fill="#f8fafc" stroke="#1f2937" stroke-width="1.5"/><text x="626.0" y="211.3064249653648" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">H</text><circle cx="505" cy="260" r="18" fill="#374151" stroke="#1f2937" stroke-width="1.5"/><text x="505" y="265" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">C</text><circle cx="595" cy="260" r="18" fill="#374151" stroke="#1f2937" stroke-width="1.5"/><text x="595" y="265" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">C</text><g><animate attributeName="opacity" keyTimes="0.0000;0.5000;0.5214;1.0000" values="0;0;1;1" dur="14s" begin="hy-play.begin+0s" fill="freeze"/><text x="550" y="400" text-anchor="middle" font-size="15" font-weight="800" fill="#7c3aed">trigonal planar · 120°</text><text x="550" y="428" text-anchor="middle" font-size="12" font-weight="700" fill="#475569">3 σ + 1 π · no rotation</text></g></g></g>
<g class="part" data-part="sp" data-name="sp carbon" data-info="Two σ bonds and two π bonds, linear, 180°: e.g. ethyne, and the C of a nitrile." tabindex="0" role="button" aria-label="sp carbon"><g><animate attributeName="opacity" keyTimes="0.0000;0.6786;0.7000;1.0000" values="0;0;1;1" dur="14s" begin="hy-play.begin+0s" fill="freeze"/><rect x="740" y="80" width="330" height="400" rx="16" fill="#f8fafc" stroke="#cbd5e1"/><text x="905" y="106" text-anchor="middle" font-size="15" font-weight="800" fill="#111827">sp: ethyne</text><circle cx="790" cy="260" r="11" fill="#f8fafc" stroke="#1f2937" stroke-width="1.5"/><text x="790" y="265" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">H</text><line x1="802" y1="260" x2="848" y2="260" stroke="#334155" stroke-width="4"/><line x1="866.0" y1="266.4" x2="944.0" y2="266.4" stroke="#334155" stroke-width="3"/><line x1="866.0" y1="260.0" x2="944.0" y2="260.0" stroke="#334155" stroke-width="3"/><line x1="866.0" y1="253.6" x2="944.0" y2="253.6" stroke="#334155" stroke-width="3"/><line x1="962" y1="260" x2="1008" y2="260" stroke="#334155" stroke-width="4"/><circle cx="866" cy="260" r="18" fill="#374151" stroke="#1f2937" stroke-width="1.5"/><text x="866" y="265" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">C</text><circle cx="944" cy="260" r="18" fill="#374151" stroke="#1f2937" stroke-width="1.5"/><text x="944" y="265" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">C</text><circle cx="1020" cy="260" r="11" fill="#f8fafc" stroke="#1f2937" stroke-width="1.5"/><text x="1020" y="265" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">H</text><g><animate attributeName="opacity" keyTimes="0.0000;0.7143;0.7357;1.0000" values="0;0;1;1" dur="14s" begin="hy-play.begin+0s" fill="freeze"/><text x="905" y="400" text-anchor="middle" font-size="15" font-weight="800" fill="#b91c1c">linear · 180°</text><text x="905" y="428" text-anchor="middle" font-size="12" font-weight="70