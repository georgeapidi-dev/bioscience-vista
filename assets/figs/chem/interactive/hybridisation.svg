<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" class="vd-svg" role="img" aria-labelledby="hy-title hy-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="hy-play" data-vd-play-label="Play: shapes" data-vd-steps="[[0, &quot;Shapes around carbon.&quot;], [1, &quot;sp\u00b3: tetrahedral, 109.5\u00b0.&quot;], [5, &quot;sp\u00b2: trigonal planar, 120\u00b0, with a \u03c0 bond.&quot;], [9.5, &quot;sp: linear, 180\u00b0, two \u03c0 bonds.&quot;]]" data-vd-dur="14">
<title id="hy-title">Hybridisation and shape</title><desc id="hy-desc">Ethane with tetrahedral sp3 carbons at 109.5 degrees, ethene with planar sp2 carbons at 120 degrees and a pi bond above and below the plane, and ethyne with linear sp carbons at 180 degrees.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="520" fill="#ffffff"/>
<g aria-hidden="true"><animate id="hy-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<text class="head" x="30" y="34">Hybridisation: sp³, sp² and sp carbon</text><text class="note" x="30" y="56">σ bonds set the shape; π bonds are extra overlap above and below.</text>
