<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 540" class="vd-svg" role="img" aria-labelledby="ct-title ct-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="ct-play" data-vd-play-label="Play: lock the bond" data-vd-steps="[[0, &quot;Stereoisomerism: same structure, different arrangement in space.&quot;], [1, &quot;The C=C cannot rotate.&quot;], [4, &quot;cis- and trans-but-2-ene.&quot;], [8.5, &quot;Not possible if one carbon has two identical groups (but-1-ene).&quot;], [11, &quot;Optical isomerism needs a chiral centre.&quot;]]" data-vd-dur="14">
<title id="ct-title">Geometrical (cis/trans) isomerism</title><desc id="ct-desc">Cis-but-2-ene with both methyl groups on the same side of the double bond and trans-but-2-ene with them on opposite sides; but-1-ene has no geometrical isomers because one carbon carries two hydrogens; a chiral carbon gives optical isomers.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="540" fill="#ffffff"/>
<g aria-hidden="true"><animate id="ct-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<text class="head" x="30" y="34">Stereoisomerism: cis/trans and optical</text><text class="note" x="30" y="56">cis = Z (same side); trans = E (opposite sides) when the groups are ranked.</text>
<g class="part" data-part="why" data-name="Why geometrical isomers exist" data-info="The π bond prevents rotation about C=C." tabindex="0" role="button" aria-label="Why geometrical isomers exist"><g><animate attributeName="opacity" keyTimes="0.0000;0.0714;0.0929;1.0000" values="0;0;1;1" dur="14s" begin="ct-play.begin+0s" fill="freeze"/><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.0714;0.0929;1.0000" values="0;0;1;1" dur="14s" begin="ct-play.begin+0s" fill="freeze"/><rect x="410.0" y="78" width="280" height="24" rx="12" fill="#ede9fe" stroke="#1f2937" stroke-width="1"/><text x="550" y="95" text-anchor="middle" font-size="12" font-weight="700">π bond: no rotation about C=C</text></g></g></g>
<g class="part" data-part="pair" data-name="cis and trans" data-info="But-2-ene: cis (Z) has both CH₃ groups on the same side; trans (E) on opposite sides. Different physical properties (e.g. boiling points)." tabindex="0" role="button" aria-label="cis and trans"><g><animate attributeName="opacity" keyTimes="0.0000;0.2857;0.3071;1.0000" values="0;0;1;1" dur="14s" begin="ct-play.begin+0s" fill="freeze"/><line x1="185.0" y1="234.0" x2="255.0" y2="234.0" stroke="#334155" stroke-width="3"/><line x1="185.0" y1="226.0" x2="255.0" y2="226.0" stroke="#334155" stroke-width="3"/><circle cx="185" cy="230" r="18" fill="#374151" stroke="#1f2937" stroke-width="1.5"/><text x="185" y="235" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">C</text><circle cx="255" cy="230" r="18" fill="#374151" stroke="#1f2937" stroke-width="1.5"/><text x="255" y="235" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">C</text><line x1="185" y1="230" x2="140" y2="175" stroke="#334155" stroke-width="4"/><rect x="114" y="161" width="52" height="28" rx="10" fill="#fde68a" stroke="#a16207"/><text x="140" y="180" text-anchor="middle" font-size="12" font-weight="800" fill="#713f12">CH₃</text><line x1="185" y1="230" x2="140" y2="285" stroke="#334155" stroke-width="4"/><circle cx="140" cy="285" r="11" fill="#f8fafc" stroke="#1f2937" stroke-width="1.5"/><text x="140" y="290" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">H</text><line x1="255" y1="230" x2="300" y2="175" stroke="#334155" stroke-width="4"/><rect x="274" y="161" width="52" height="28" rx="10" fill="#fde68a" stroke="#a16207"/><text x="300" y="180" text-anchor="middle" font-size="12" font-weight="800" fill="#713f12">CH₃</text><line x1="255" y1="230" x2="300" y2="285" stroke="#334155" stroke-width="4"/><circle cx="300" cy="285" r="11" fill="#f8fafc" stroke="#1f2937" stroke-width="1.5"/><text x="300" y="290" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">H</text><text x="220" y="320" text-anchor="middle" font-size="14" font-weight="800" fill="#1d4ed8">cis-but-2-ene (Z)</text><text x="220" y="342" text-anchor="middle" font-size="12" font-weight="700" fill="#475569">bp 277 K</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.3929;0.4143;1.0000" values="0;0;1;1" dur="14s" begin="ct-play.begin+0s" fill="freeze"/><line x1="565.0" y1="234.0" x2="635.0" y2="234.0" stroke="#334155" stroke-width="3"/><line x1="565.0" y1="226.0" x2="635.0" y2="226.0" stroke="#334155" stroke-width="3"/><circle cx="565" cy="230" r="18" fill="#374151" stroke="#1f2937" stroke-width="1.5"/><text x="565" y="235" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">C</text><circle cx="635" cy="230" r="18" fill="#374151" stroke="#1f2937" stroke-width="1.5"/><text x="635" y="235" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">C</text><line x1="565" y1="230" x2="520" y2="175" stroke="#334155" stroke-width="4"/><rect x="494" y="161" width="52" height="28" rx="10" fill="#fde68a" stroke="#a16207"/><text x="520" y="180" text-anchor="middle" font-size="12" font-weight="800" fill="#713f12">CH₃</text><line x1="565" y1="230" x2="520" y2="285" stroke="#334155" stroke-width="4"/><circle cx="520" cy="285" r="11" fill="#f8fafc" stroke="#1f2937" stroke-width="1.5"/><text x="520" y="290" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">H</text><line x1="635" y1="230" x2="680" y2="175" stroke="#334155" stroke-width="4"/><circle cx="680" cy="175" r="11" fill="#f8fafc" stroke="#1f2937" stroke-width="1.5"/><text x="680" y="180" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">H</text><line x1="635" y1="230" x2="680" y2="285" stroke="#334155" stroke-width="4"/><rect x="654" y="271" width="52" height="28" rx="10" fill="#fde68a" stroke="#a16207"/><text x="680" y="290" text-anchor="middle" font-size="12" font-weight="800" fill="#713f12">CH₃</text><text x="600" y="320" text-anchor="middle" font-size="14" font-weight="800" fill="#b91c1c">trans-but-2-ene (E)</text><text x="600" y="342" text-anchor="middle" font-size="12" font-weight="700" fill="#475569">bp 274 K</text></g></g>
<g class="part" data-part="need" data-name="The condition" data-info="Each carbon of the C=C must carry two DIFFERENT groups." tabindex="0" role="button" aria-label="The condition"><g><animate attributeName="opacity" keyTimes="0.0000;0.6071;0.6286;1.0000" values="0;0;1;1" dur="14s" begin="ct-play.begin+0s" fill="freeze"/><line x1="885.0" y1="234.0" x2="955.0" y2="234.0" stroke="#334155" stroke-width="3"/><line x1="885.0" y1="226.0" x2="955.0" y2="226.0" stroke="#334155" stroke-width="3"/><circle cx="885" cy="230" r="18" fill="#374151" stroke="#1f2937" stroke-width="1.5"/><text x="885" y="235" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">C</text><circle cx="955" cy="230" r="18" fill="#374151" stroke="#1f2937" stroke-width="1.5"/><text x="955" y="235" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">C</text><line x1="885" y1="230" x2="840" y2="175" stroke="#334155" stroke-width="4"/><circle cx="840" cy="175" r="11" fill="#f8fafc" stroke="#1f2937" stroke-width="1.5"/><text x="840" y="180" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">H</text><line x1="885" y1="230" x2="840" y2="285" stroke="#334155" stroke-width="4"/><circle cx="840" cy="285" r="11" fill="#f8fafc" stroke="#1f2937" stroke-width="1.5"/><text x="840" y="290" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">H</text><line x1="955" y1="230" x2="1000" y2="175" stroke="#334155" stroke-width="4"/><rect x="974" y="161" width="52" height="28" rx="10" fill="#fde68a" stroke="#a16207"/><text x="1000" y="180" text-anchor="middle" font-size="12" font-weight="800" fill="#713f12">C₂H₅</text><line x1="955" y1="230" x2="1000" y2="285" stroke="#334155" stroke-width="4"/><circle cx="1000" cy="285" r="11" fill="#f8fafc" stroke="#1f2937" stroke-width="1.5"/><text x="1000" y="290" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">H</text><text x="920" y="320" text-anchor="middle" font-size="14" font-weight="800" fill="#475569">but-1-ene: no cis/trans</text><text x="920" y="342" text-anchor="middle" font-size="12" font-weight="700" fill="#475569">(left C has two H)</text></g></g>
<g class="part" data-part="opt" data-name="Optical isomers" data-info="A chiral carbon has four different groups: two non-superimposable mirror images (enantiomers) that rotate plane-polarised light in opposite directions." tabindex="0" role="button" aria-label="Optical isomers"><g><animate attributeName="opacity" keyTimes="0.0000;0.7857;0.8071;1.0000" values="0;0;1;1" dur="14s" begin="ct-play.begin+0s" fill="freeze"/><rect x="60" y="380" width="980" height="140" rx="16" fill="#f5f3ff" stroke="#c4b5fd"/><text x="550" y="404" text-anchor="middle" font-size="14" font-weight="800" fill="#6d28d9">optical isomers: a chiral carbon (four different groups)</text><circle cx="400" cy="460" r="18" fill="#374151" stroke="#1f2937" stroke-width="1.5"/><text x="400" y="465" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">C</text><line x1="400" y1="460" x2="350" y2="434" stroke="#334155" stroke-width="4"/><circle cx="350" cy="434" r="11" fill="#ef4444"/><line x1="400" y1="460" x2="450" y2="434" stroke="#334155" stroke-width="4"/><circle cx="450" cy="434" r="11" fill="#3b82f6"/><line x1="400" y1="460" x2="360" y2="496" stroke="#334155" stroke-width="4"/><circle cx="360" cy="496" r="11" fill="#22c55e"/><line x1="400" y1="460" x2="440" y2="496" stroke="#334155" stroke-width="4"/><circle cx="440" cy="496" r="11" fill="#f59e0b"/><circle cx="700" cy="460" r="18" fill="#374151" stroke="#1f2937" stroke-width="1.5"/><text x="700" y="465" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">C</text><line x1="700" y1="460" x2="750" y2="434" stroke="#334155" stroke-width="4"/><circle cx="750" cy="434" r="11" fill="#ef4444"/><line x1="700" y1="460" x2="650" y2="434" stroke="#334155" stroke-width="4"/><circle cx="650" cy="434" r="11" fill="#3b82f6"/><line x1="700" y1="460" x2="740" y2="496" stroke="#334155" stroke-width="4"/><circle cx="740" cy="496" r="11" fill="#22c55e"/><line x1="700" y1="460" x2="660" y2="496" stroke="#334155" stroke-width="4"/><circle cx="660" cy="496" r="11" fill="#f59e0b"/><line x1="550" y1="420" x2="550" y2="510" stroke="#94a3b8" stroke-dasharray="5 4"/><text x="550" y="512" text-anchor="middle" font-size="10" font-weight="700" fill="#475569">mirror</text></g></g>
</svg>