<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 580" class="vd-svg" role="img" aria-labelledby="ac-title ac-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="ac-play" data-vd-play-label="Play: rank the acids" data-vd-steps="[[0, &quot;Comparing acidity: ethanol, water, phenol, ethanoic acid.&quot;], [1, &quot;Order of acid strength (pKa).&quot;], [6, &quot;Explained by the stability of the anion: delocalisation.&quot;], [11, &quot;Tests that tell them apart.&quot;]]" data-vd-dur="15">
<title id="ac-title">Acidity of alcohols, phenol and carboxylic acids</title><desc id="ac-desc">A pKa scale with ethanol at 16, water 14, phenol 10 and ethanoic acid 4.8; anions with more delocalisation are more stable; reactions with sodium, sodium hydroxide and sodium carbonate distinguish them.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="580" fill="#ffffff"/>
<g aria-hidden="true"><animate id="ac-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<text class="head" x="30" y="34">Acidity: alcohols, water, phenol and carboxylic acids</text><text class="note" x="30" y="56">pKa values approximate.</text>
<g class="part" data-part="scale" data-name="Relative acidity" data-info="Ethanol (pKa ≈ 16) &lt; water (14) &lt; phenol (10) &lt; ethanoic acid (4.8). Lower pKa = stronger acid." tabindex="0" role="button" aria-label="Relative acidity"><line x1="80" y1="200" x2="1020" y2="200" stroke="#111827" stroke-width="3"/><text x="80" y="230" text-anchor="start" font-size="12" font-weight="800" fill="#475569">weaker acid (high pKa)</text><text x="1020" y="230" text-anchor="end" font-size="12" font-weight="800" fill="#b91c1c">stronger acid (low pKa)</text><g><animate attributeName="opacity" keyTimes="0.0000;0.0667;0.0867;1.0000" values="0;0;1;1" dur="15s" begin="ac-play.begin+0s" fill="freeze"/><circle cx="152" cy="200" r="14" fill="#94a3b8" stroke="#334155"/><text x="152.30769230769232" y="170" text-anchor="middle" font-size="14" font-weight="800" fill="#111827">ethanol</text><text x="152.30769230769232" y="150" text-anchor="middle" font-size="12" font-weight="800" fill="#94a3b8">pKa 16</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.1333;0.1533;1.0000" values="0;0;1;1" dur="15s" begin="ac-play.begin+0s" fill="freeze"/><circle cx="297" cy="200" r="14" fill="#60a5fa" stroke="#334155"/><text x="296.9230769230769" y="170" text-anchor="middle" font-size="14" font-weight="800" fill="#111827">water</text><text x="296.9230769230769" y="150" text-anchor="middle" font-size="12" font-weight="800" fill="#60a5fa">pKa 14</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.2000;0.2200;1.0000" values="0;0;1;1" dur="15s" begin="ac-play.begin+0s" fill="freeze"/><circle cx="586" cy="200" r="14" fill="#f59e0b" stroke="#334155"/><text x="586.1538461538462" y="170" text-anchor="middle" font-size="14" font-weight="800" fill="#111827">phenol</text><text x="586.1538461538462" y="150" text-anchor="middle" font-size="12" font-weight="800" fill="#f59e0b">pKa 10</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.2667;0.2867;1.0000" values="0;0;1;1" dur="15s" begin="ac-play.begin+0s" fill="freeze"/><circle cx="962" cy="200" r="14" fill="#ef4444" stroke="#334155"/><text x="962.1538461538462" y="170" text-anchor="middle" font-size="14" font-weight="800" fill="#111827">ethanoic acid</text><text x="962.1538461538462" y="150" text-anchor="middle" font-size="12" font-weight="800" fill="#ef4444">pKa 4.8</text></g></g>
<g class="part" data-part="why" data-name="Why" data-info="The more stable the anion, the stronger the acid. Ethoxide: the ethyl group pushes electrons onto O⁻ (destabilised). Phenoxide: the charge is partly delocalised into the ring. Ethanoate: the charge is fully delocalised over two O atoms." tabindex="0" role="button" aria-label="Why"><g><animate attributeName="opacity" keyTimes="0.0000;0.4000;0.4200;1.0000" values="0;0;1;1" dur="15s" begin="ac-play.begin+0s" fill="freeze"/><rect x="40" y="260" width="330" height="140" rx="16" fill="#fff" stroke="#64748b" stroke-width="2"/><text x="205" y="290" text-anchor="middle" font-size="15" font-weight="800" fill="#64748b">ethoxide</text><text x="205" y="326" text-anchor="middle" font-size="18" font-weight="800" fill="#111827">C₂H₅–O⁻</text><text x="205" y="370" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">charge on one O, pushed by C₂H₅: least stable</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.4800;0.5000;1.0000" values="0;0;1;1" dur="15s" begin="ac-play.begin+0s" fill="freeze"/><rect x="390" y="260" width="330" height="140" rx="16" fill="#fff" stroke="#d97706" stroke-width="2"/><text x="555" y="290" text-anchor="middle" font-size="15" font-weight="800" fill="#d97706">phenoxide</text><text x="555" y="326" text-anchor="middle" font-size="18" font-weight="800" fill="#111827">C₆H₅–O⁻</text><text x="555" y="370" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">charge spread into the ring</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.5600;0.5800;1.0000" values="0;0;1;1" dur="15s" begin="ac-play.begin+0s" fill="freeze"/><rect x="740" y="260" width="330" height="140" rx="16" fill="#fff" stroke="#dc2626" stroke-width="2"/><text x="905" y="290" text-anchor="middle" font-size="15" font-weight="800" fill="#dc2626">ethanoate</text><text x="905" y="326" text-anchor="middle" font-size="18" font-weight="800" fill="#111827">CH₃COO⁻</text><text x="905" y="370" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">charge shared by two O atoms</text></g></g>
<g class="part" data-part="test" data-name="Reactions" data-info="Na: all four give H₂. NaOH: phenol and ethanoic acid react. Na₂CO₃/NaHCO₃: only the carboxylic acid fizzes (CO₂)." tabindex="0" role="button" aria-label="Reactions"><rect x="40" y="420" width="1020" height="140" rx="16" fill="#f8fafc" stroke="#cbd5e1"/><g><animate attributeName="opacity" keyTimes="0.0000;0.7333;0.7533;1.0000" values="0;0;1;1" dur="15s" begin="ac-play.begin+0s" fill="freeze"/><text x="150" y="450" text-anchor="middle" font-size="13" font-weight="800" fill="#1d4ed8"></text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.7333;0.7533;1.0000" values="0;0;1;1" dur="15s" begin="ac-play.begin+0s" fill="freeze"/><text x="410" y="450" text-anchor="middle" font-size="13" font-weight="800" fill="#1d4ed8">ethanol</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.7333;0.7533;1.0000" values="0;0;1;1" dur="15s" begin="ac-play.begin+0s" fill="freeze"/><text x="670" y="450" text-anchor="middle" font-size="13" font-weight="800" fill="#1d4ed8">phenol</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.7333;0.7533;1.0000" values="0;0;1;1" dur="15s" begin="ac-play.begin+0s" fill="freeze"/><text x="930" y="450" text-anchor="middle" font-size="13" font-weight="800" fill="#1d4ed8">ethanoic acid</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.7600;0.7800;1.0000" values="0;0;1;1" dur="15s" begin="ac-play.begin+0s" fill="freeze"/><text x="150" y="480" text-anchor="middle" font-size="13" font-weight="800" fill="#1d4ed8">Na</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.7600;0.7800;1.0000" values="0;0;1;1" dur="15s" begin="ac-play.begin+0s" fill="freeze"/><text x="410" y="480" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">✓ H₂</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.7600;0.7800;1.0000" values="0;0;1;1" dur="15s" begin="ac-play.begin+0s" fill="freeze"/><text x="670" y="480" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">✓ H₂</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.7600;0.7800;1.0000" values="0;0;1;1" dur="15s" begin="ac-play.begin+0s" fill="freeze"/><text x="930" y="480" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">✓ H₂</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.7867;0.8067;1.0000" values="0;0;1;1" dur="15s" begin="ac-play.begin+0s" fill="freeze"/><text x="150" y="510" text-anchor="middle" font-size="13" font-weight="800" fill="#1d4ed8">NaOH(aq)</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.7867;0.8067;1.0000" values="0;0;1;1" dur="15s" begin="ac-play.begin+0s" fill="freeze"/><text x="410" y="510" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">✗</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.7867;0.8067;1.0000" values="0;0;1;1" dur="15s" begin="ac-play.begin+0s" fill="freeze"/><text x="670" y="510" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">✓</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.7867;0.8067;1.0000" values="0;0;1;1" dur="15s" begin="ac-play.begin+0s" fill="freeze"/><text x="930" y="510" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">✓</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.8133;0.8333;1.0000" values="0;0;1;1" dur="15s" begin="ac-play.begin+0s" fill="freeze"/><text x="150" y="540" text-anchor="middle" font-size="13" font-weight="800" fill="#1d4ed8">Na₂CO₃</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.8133;0.8333;1.0000" values="0;0;1;1" dur="15s" begin="ac-play.begin+0s" fill="freeze"/><text x="410" y="540" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">✗</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.8133;0.8333;1.0000" values="0;0;1;1" dur="15s" begin="ac-play.begin+0s" fill="freeze"/><text x="670" y="540" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">✗</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.8133;0.8333;1.0000" values="0;0;1;1" dur="15s" begin="ac-play.begin+0s" fill="freeze"/><text x="930" y="540" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">✓ CO₂ fizz</text></g></g>
</svg>