<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" class="vd-svg" role="img" aria-labelledby="kk-title kk-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="kk-play" data-vd-play-label="Play: weigh the evidence" data-vd-steps="[[0, &quot;Evidence that benzene is not Kekul\u00e9&#x27;s triene.&quot;], [1, &quot;Enthalpy of hydrogenation: \u2212208, not \u2212360 kJ mol\u207b\u00b9.&quot;], [7, &quot;All C\u2013C bonds 139 pm.&quot;], [10.5, &quot;No addition with bromine water.&quot;]]" data-vd-dur="14">
<title id="kk-title">Evidence for delocalisation in benzene</title><desc id="kk-desc">An enthalpy level diagram: cyclohexene hydrogenation releases 120 kilojoules per mole, a Kekulé benzene would release 360 but real benzene releases 208, so benzene is 152 kilojoules per mole more stable; all carbon-carbon bonds are 139 picometres.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="560" fill="#ffffff"/>
<g aria-hidden="true"><animate id="kk-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<text class="head" x="30" y="34">Evidence for delocalisation in benzene</text><text class="note" x="30" y="56">Enthalpy changes of hydrogenation / kJ mol⁻¹.</text>
<g class="part" data-part="h" data-name="Hydrogenation data" data-info="Cyclohexene + H₂: ΔH = −120 kJ mol⁻¹. A Kekulé benzene with 3 C=C would give 3 × −120 = −360. Real benzene: −208. Benzene is 152 kJ mol⁻¹ more stable: delocalisation energy." tabindex="0" role="button" aria-label="Hydrogenation data"><line x1="80" y1="500.0" x2="640" y2="500.0" stroke="#111827" stroke-width="3"/><text x="360" y="524.0" text-anchor="middle" font-size="14" font-weight="800" fill="#111827">cyclohexane</text><g><animate attributeName="opacity" keyTimes="0.0000;0.0714;0.0929;1.0000" values="0;0;1;1" dur="14s" begin="kk-play.begin+0s" fill="freeze"/><line x1="80" y1="386" x2="200" y2="386" stroke="#16a34a" stroke-width="4"/><text x="140" y="376.0" text-anchor="middle" font-size="12" font-weight="800" fill="#16a34a">cyclohexene (−120)</text><line x1="140" y1="386" x2="140" y2="500" stroke="#16a34a" stroke-width="3" stroke-dasharray="6 4"/></g><g><animate attributeName="opacity" keyTimes="0.0000;0.2143;0.2357;1.0000" values="0;0;1;1" dur="14s" begin="kk-play.begin+0s" fill="freeze"/><line x1="270" y1="158" x2="390" y2="158" stroke="#94a3b8" stroke-width="4"/><text x="330" y="148.0" text-anchor="middle" font-size="12" font-weight="800" fill="#94a3b8">“Kekulé benzene” (−360)</text><line x1="330" y1="158" x2="330" y2="500" stroke="#94a3b8" stroke-width="3" stroke-dasharray="6 4"/></g><g><animate attributeName="opacity" keyTimes="0.0000;0.3571;0.3786;1.0000" values="0;0;1;1" dur="14s" begin="kk-play.begin+0s" fill="freeze"/><line x1="460" y1="302" x2="580" y2="302" stroke="#2563eb" stroke-width="4"/><text x="520" y="292.4" text-anchor="middle" font-size="12" font-weight="800" fill="#2563eb">real benzene (−208)</text><line x1="520" y1="302" x2="520" y2="500" stroke="#2563eb" stroke-width="3" stroke-dasharray="6 4"/></g><g><animate attributeName="opacity" keyTimes="0.0000;0.4643;0.4857;1.0000" values="0;0;1;1" dur="14s" begin="kk-play.begin+0s" fill="freeze"/><path d="M 440 158 L 440 302" stroke="#dc2626" stroke-width="4"/><text x="456" y="224.5" text-anchor="start" font-size="13" font-weight="800" fill="#b91c1c">152 kJ mol⁻¹ more stable</text><text x="456" y="241.60000000000002" text-anchor="start" font-size="11" font-weight="700" fill="#b91c1c">(delocalisation energy)</text></g></g>
<g class="part" data-part="len" data-name="Bond lengths" data-info="All six C–C bonds in benzene are 139 pm: between C–C (154) and C=C (134). Kekulé would have alternating lengths." tabindex="0" role="button" aria-label="Bond lengths"><g><animate attributeName="opacity" keyTimes="0.0000;0.5000;0.5214;1.0000" values="0;0;1;1" dur="14s" begin="kk-play.begin+0s" fill="freeze"/><rect x="700" y="90" width="370" height="230" rx="16" fill="#f8fafc" stroke="#cbd5e1"/><text x="885" y="116" text-anchor="middle" font-size="14" font-weight="800" fill="#111827">bond lengths / pm</text><line x1="730" y1="290" x2="1090" y2="290" stroke="#111827" stroke-width="2"/><rect x="760" y="155" width="80" height="135" fill="#94a3b8" stroke="#334155"><animate attributeName="height" keyTimes="0.0000;0.5000;0.5429;1.0000" values="0;0;134.75;134.75" dur="14s" begin="kk-play.begin+0s" fill="freeze"/><animate attributeName="y" keyTimes="0.0000;0.5000;0.5429;1.0000" values="290;290;155.25;155.25" dur="14s" begin="kk-play.begin+0s" fill="freeze"/></rect><g><animate attributeName="opacity" keyTimes="0.0000;0.5429;0.5643;1.0000" values="0;0;1;1" dur="14s" begin="kk-play.begin+0s" fill="freeze"/><text x="800.0" y="147.25" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">154</text></g><text x="800.0" y="308" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">C–C</text><rect x="870" y="168" width="80" height="122" fill="#2563eb" stroke="#334155"><animate attributeName="height" keyTimes="0.0000;0.5357;0.5786;1.0000" values="0;0;121.625;121.625" dur="14s" begin="kk-play.begin+0s" fill="freeze"/><animate attributeName="y" keyTimes="0.0000;0.5357;0.5786;1.0000" values="290;290;168.375;168.375" dur="14s" begin="kk-play.begin+0s" fill="freeze"/></rect><g><animate attributeName="opacity" keyTimes="0.0000;0.5786;0.6000;1.0000" values="0;0;1;1" dur="14s" begin="kk-play.begin+0s" fill="freeze"/><text x="910.0" y="160.375" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">139</text></g><text x="910.0" y="308" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">benzene</text><rect x="980" y="173" width="80" height="117" fill="#94a3b8" stroke="#334155"><animate attributeName="height" keyTimes="0.0000;0.5714;0.6143;1.0000" values="0;0;117.25;117.25" dur="14s" begin="kk-play.begin+0s" fill="freeze"/><animate attributeName="y" keyTimes="0.0000;0.5714;0.6143;1.0000" values="290;290;172.75;172.75" dur="14s" begin="kk-play.begin+0s" fill="freeze"/></rect><g><animate attributeName="opacity" keyTimes="0.0000;0.6143;0.6357;1.0000" values="0;0;1;1" dur="14s" begin="kk-play.begin+0s" fill="freeze"/><text x="1020.0" y="164.75" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">134</text></g><text x="1020.0" y="308" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">C=C</text></g></g>
<g class="part" data-part="br" data-name="Reactivity" data-info="Benzene does not decolourise bromine water: it resists addition, which would destroy the delocalised system." tabindex="0" role="button" aria-label="Reactivity"><g><animate attributeName="opacity" keyTimes="0.0000;0.7500;0.7714;1.0000" values="0;0;1;1" dur="14s" begin="kk-play.begin+0s" fill="freeze"/><rect x="700" y="340" width="370" height="180" rx="16" fill="#fef3c7" stroke="#fcd34d"/><text x="885" y="368" text-anchor="middle" font-size="14" font-weight="800" fill="#a16207">bromine water + benzene</text><text x="885" y="410" text-anchor="middle" font-size="14" font-weight="800" fill="#111827">stays orange: no addition</text><text x="885" y="446" text-anchor="middle" font-size="12" font-weight="700" fill="#475569">addition would destroy the</text><text x="885" y="466" text-anchor="middle" font-size="12" font-weight="700" fill="#475569">stable delocalised π system</text></g></g>
</svg>