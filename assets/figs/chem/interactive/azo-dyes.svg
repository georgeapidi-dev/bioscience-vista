<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" class="vd-svg" role="img" aria-labelledby="az-title az-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="az-play" data-vd-play-label="Play: make a dye" data-vd-steps="[[0, &quot;From nitrobenzene to an azo dye.&quot;], [1, &quot;Reduce nitrobenzene with Sn/HCl, then NaOH: phenylamine.&quot;], [6, &quot;Diazotise with NaNO\u2082 + HCl below 10 \u00b0C.&quot;], [11, &quot;Couple with alkaline phenol: a coloured azo dye.&quot;]]" data-vd-dur="17">
<title id="az-title">Phenylamine and azo dyes</title><desc id="az-desc">Nitrobenzene is reduced by tin and hydrochloric acid to phenylamine; phenylamine is diazotised with nitrous acid below 10 degrees Celsius to benzenediazonium chloride; this couples with phenol in alkali to form a yellow-orange azo dye.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="560" fill="#ffffff"/>
<g aria-hidden="true"><animate id="az-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<defs><marker id="az-475569" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="5.4" refY="6.0" orient="auto"><path d="M0,0 L12,6.0 L0,12 z" fill="#475569"/></marker></defs>
<text class="head" x="30" y="34">Phenylamine and azo dyes</text><text class="note" x="30" y="56">Three-step route.</text>
<g class="part" data-part="red" data-name="Making phenylamine" data-info="Nitrobenzene + tin and concentrated HCl, heat under reflux (reduction), then NaOH to release the free amine: C₆H₅NO₂ + 6[H] → C₆H₅NH₂ + 2H₂O." tabindex="0" role="button" aria-label="Making phenylamine"><polygon points="110.0,180.0 144.6,200.0 144.6,240.0 110.0,260.0 75.4,240.0 75.4,200.0" fill="#fff" stroke="#111827" stroke-width="3"/><circle cx="110" cy="220" r="24" fill="none" stroke="#111827" stroke-width="3"/><line x1="110" y1="180" x2="110" y2="156" stroke="#111827" stroke-width="4"/><text x="110.0" y="154.0" text-anchor="middle" font-size="13" font-weight="800" fill="#7c3aed">NO₂</text><text x="110" y="300" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">nitrobenzene</text><g><animate attributeName="opacity" keyTimes="0.0000;0.0588;0.0765;1.0000" values="0;0;1;1" dur="17s" begin="az-play.begin+0s" fill="freeze"/><path d="M 170 220 L 270 220" stroke="#475569" stroke-width="3" marker-end="url(#az-475569)"/><text x="220" y="200" text-anchor="middle" font-size="10" font-weight="800" fill="#475569">Sn, conc. HCl, reflux</text><text x="220" y="244" text-anchor="middle" font-size="10" font-weight="800" fill="#475569">then NaOH</text><polygon points="340.0,180.0 374.6,200.0 374.6,240.0 340.0,260.0 305.4,240.0 305.4,200.0" fill="#fff" stroke="#111827" stroke-width="3"/><circle cx="340" cy="220" r="24" fill="none" stroke="#111827" stroke-width="3"/><line x1="340" y1="180" x2="340" y2="156" stroke="#111827" stroke-width="4"/><text x="340.0" y="154.0" text-anchor="middle" font-size="13" font-weight="800" fill="#2563eb">NH₂</text><text x="340" y="300" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">phenylamine</text></g></g>
<g class="part" data-part="diaz" data-name="Diazotisation" data-info="Phenylamine + HNO₂ (made from NaNO₂ + HCl) below 10 °C → benzenediazonium chloride, C₆H₅N₂⁺Cl⁻. Above 10 °C it decomposes to phenol + N₂." tabindex="0" role="button" aria-label="Diazotisation"><g><animate attributeName="opacity" keyTimes="0.0000;0.3529;0.3706;1.0000" values="0;0;1;1" dur="17s" begin="az-play.begin+0s" fill="freeze"/><path d="M 400 220 L 520 220" stroke="#475569" stroke-width="3" marker-end="url(#az-475569)"/><text x="460" y="200" text-anchor="middle" font-size="10" font-weight="800" fill="#475569">NaNO₂ + HCl</text><text x="460" y="244" text-anchor="middle" font-size="11" font-weight="800" fill="#b91c1c">< 10 °C</text><polygon points="600.0,180.0 634.6,200.0 634.6,240.0 600.0,260.0 565.4,240.0 565.4,200.0" fill="#fff" stroke="#111827" stroke-width="3"/><circle cx="600" cy="220" r="24" fill="none" stroke="#111827" stroke-width="3"/><line x1="600" y1="180" x2="600" y2="156" stroke="#111827" stroke-width="4"/><text x="600.0" y="154.0" text-anchor="middle" font-size="13" font-weight="800" fill="#b91c1c">N₂⁺ Cl⁻</text><text x="600" y="300" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">benzenediazonium chloride</text><g><rect x="520" y="320" width="160" height="34" rx="10" fill="#dbeafe" stroke="#1d4ed8"/><text x="600" y="342" text-anchor="middle" font-size="11" font-weight="800" fill="#1d4ed8">ice bath: unstable</text></g></g></g>
<g class="part" data-part="couple" data-name="Coupling" data-info="The diazonium ion (a weak electrophile) attacks phenol in NaOH(aq), usually at position 4: an azo compound with –N=N– linking two rings: a yellow-orange azo dye. The extended delocalised system absorbs visible light." tabindex="0" role="button" aria-label="Coupling"><g><animate attributeName="opacity" keyTimes="0.0000;0.6471;0.6647;1.0000" values="0;0;1;1" dur="17s" begin="az-play.begin+0s" fill="freeze"/><path d="M 660 220 L 760 220" stroke="#475569" stroke-width="3" marker-end="url(#az-475569)"/><text x="710" y="200" text-anchor="middle" font-size="10" font-weight="800" fill="#475569">phenol, NaOH(aq)</text><polygon points="830.0,186.0 859.4,203.0 859.4,237.0 830.0,254.0 800.6,237.0 800.6,203.0" fill="#fff" stroke="#111827" stroke-width="3"/><circle cx="830" cy="220" r="20" fill="none" stroke="#111827" stroke-width="3"/><line x1="864" y1="220" x2="890" y2="220" stroke="#111827" stroke-width="4"/><text x="910" y="214" text-anchor="middle" font-size="14" font-weight="800" fill="#f97316">N=N</text><line x1="932" y1="220" x2="950" y2="220" stroke="#111827" stroke-width="4"/><polygon points="984.0,186.0 1013.4,203.0 1013.4,237.0 984.0,254.0 954.6,237.0 954.6,203.0" fill="#fff" stroke="#111827" stroke-width="3"/><circle cx="984" cy="220" r="20" fill="none" stroke="#111827" stroke-width="3"/><line x1="1018" y1="220" x2="1036" y2="220" stroke="#111827" stroke-width="4"/><text x="1052" y="225" text-anchor="middle" font-size="13" font-weight="800" fill="#ef4444">OH</text></g><rect x="760" y="320" width="300" height="160" rx="16" fill="#fff7ed" stroke="#fdba74" opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.7353;0.7647;1.0000" values="0;0;1;1" dur="17s" begin="az-play.begin+0s" fill="freeze"/></rect><path d="M 860 340 L 860 450 Q 890 468 920 450 L 920 340" fill="#f8fafc" stroke="#334155" stroke-width="2" opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.7353;0.7647;1.0000" values="0;0;1;1" dur="17s" begin="az-play.begin+0s" fill="freeze"/></path><rect x="862" y="380" width="56" height="72" fill="#e0f2fe" opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.7353;0.7647;1.0000" values="0;0;1;1" dur="17s" begin="az-play.begin+0s" fill="freeze"/><animate attributeName="fill" keyTimes="0.0000;0.7647;0.8529;1.0000" values="#e0f2fe;#e0f2fe;#f97316;#f97316" dur="17s" begin="az-play.begin+0s" fill="freeze"/></rect><g><animate attributeName="opacity" keyTimes="0.0000;0.8529;0.8706;1.0000" values="0;0;1;1" dur="17s" begin="az-play.begin+0s" fill="freeze"/><text x="990" y="420" text-anchor="middle" font-size="12" font-weight="800" fill="#c2410c">yellow-orange</text><text x="990" y="438" text-anchor="middle" font-size="12" font-weight="800" fill="#c2410c">azo dye</text></g></g>
<g><animate attributeName="opacity" keyTimes="0.0000;0.8824;0.9000;1.0000" values="0;0;1;1" dur="17s" begin="az-play.begin+0s" fill="freeze"/><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.8824;0.9000;1.0000" values="0;0;1;1" dur="17s" begin="az-play.begin+0s" fill="freeze"/><rect x="270.0" y="513" width="560" height="24" rx="12" fill="#ffedd5" stroke="#1f2937" stroke-width="1"/><text x="550" y="530" text-anchor="middle" font-size="12" font-weight="700">–N=N– links two rings: extended delocalisation absorbs visible light → colour</text></g></g>
</svg>