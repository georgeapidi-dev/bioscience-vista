<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 640" class="vd-svg" role="img" aria-labelledby="ac-title ac-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="ac-play" data-vd-play-label="Play: take readings" data-vd-steps="[[0, &quot;Accuracy and precision, shown with targets: the centre is the true value.&quot;], [1, &quot;Accurate and precise: tightly grouped at the centre.&quot;], [4, &quot;Precise but not accurate: tightly grouped, but off-centre \u2014 a systematic error.&quot;], [7, &quot;Accurate but not precise: spread out around the centre \u2014 random errors.&quot;], [10, &quot;Neither accurate nor precise.&quot;]]" data-vd-dur="14">
<title id="ac-title">Accuracy and precision</title><desc id="ac-desc">Four targets showing results that are accurate and precise, precise but not accurate (systematic error), accurate but not precise (random error) and neither, with definitions and a titration example.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1220" height="640" fill="#ffffff"/>
<g aria-hidden="true"><animate id="ac-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<text class="head" x="30" y="34">Accuracy and precision</text><text class="note" x="30" y="56">Centre of each target = the true value.</text>
<g class="part" data-part="ap" data-name="Accurate and precise" data-info="Readings close to the true value and close to each other: small random and systematic errors." tabindex="0" role="button" aria-label="Accurate and precise"><g><animate attributeName="opacity" keyTimes="0.0000;0.0357;0.0571;1.0000" values="0;0;1;1" dur="14s" begin="ac-play.begin+0s" fill="freeze"/><circle cx="160" cy="260" r="110" fill="#fff" stroke="#94a3b8"/><circle cx="160" cy="260" r="80" fill="#f1f5f9" stroke="#94a3b8"/><circle cx="160" cy="260" r="50" fill="#fff" stroke="#94a3b8"/><circle cx="160" cy="260" r="20" fill="#fecaca" stroke="#94a3b8"/><g><animate attributeName="opacity" keyTimes="0.0000;0.0714;0.0929;1.0000" values="0;0;1;1" dur="14s" begin="ac-play.begin+0s" fill="freeze"/><circle cx="154" cy="262" r="7" fill="#16a34a" stroke="#111827"/></g><g><animate attributeName="opacity" keyTimes="0.0000;0.0929;0.1143;1.0000" values="0;0;1;1" dur="14s" begin="ac-play.begin+0s" fill="freeze"/><circle cx="165" cy="257" r="7" fill="#16a34a" stroke="#111827"/></g><g><animate attributeName="opacity" keyTimes="0.0000;0.1143;0.1357;1.0000" values="0;0;1;1" dur="14s" begin="ac-play.begin+0s" fill="freeze"/><circle cx="153" cy="260" r="7" fill="#16a34a" stroke="#111827"/></g><g><animate attributeName="opacity" keyTimes="0.0000;0.1357;0.1571;1.0000" values="0;0;1;1" dur="14s" begin="ac-play.begin+0s" fill="freeze"/><circle cx="162" cy="265" r="7" fill="#16a34a" stroke="#111827"/></g><g><animate attributeName="opacity" keyTimes="0.0000;0.1571;0.1786;1.0000" values="0;0;1;1" dur="14s" begin="ac-play.begin+0s" fill="freeze"/><circle cx="154" cy="254" r="7" fill="#16a34a" stroke="#111827"/></g><g><animate attributeName="opacity" keyTimes="0.0000;0.1786;0.2000;1.0000" values="0;0;1;1" dur="14s" begin="ac-play.begin+0s" fill="freeze"/><circle cx="164" cy="262" r="7" fill="#16a34a" stroke="#111827"/></g><g><animate attributeName="opacity" keyTimes="0.0000;0.2143;0.2357;1.0000" values="0;0;1;1" dur="14s" begin="ac-play.begin+0s" fill="freeze"/><path d="M 150 260 L 168 260 M 159 251 L 159 269" stroke="#111827" stroke-width="3"/></g><text x="160" y="400" text-anchor="middle" font-size="15" font-weight="800" fill="#16a34a">accurate and precise</text><text x="160" y="422" text-anchor="middle" font-size="12" font-weight="700" fill="#475569">small errors</text></g></g>
<g class="part" data-part="p" data-name="Precise but not accurate" data-info="Readings close together but all off the true value: a systematic error (e.g. a balance not zeroed, reading the meniscus wrongly every time)." tabindex="0" role="button" aria-label="Precise but not accurate"><g><animate attributeName="opacity" keyTimes="0.0000;0.2500;0.2714;1.0000" values="0;0;1;1" dur="14s" begin="ac-play.begin+0s" fill="freeze"/><circle cx="460" cy="260" r="110" fill="#fff" stroke="#94a3b8"/><circle cx="460" cy="260" r="80" fill="#f1f5f9" stroke="#94a3b8"/><circle cx="460" cy="260" r="50" fill="#fff" stroke="#94a3b8"/><circle cx="460" cy="260" r="20" fill="#fecaca" stroke="#94a3b8"/><g><animate attributeName="opacity" keyTimes="0.0000;0.2857;0.3071;1.0000" values="0;0;1;1" dur="14s" begin="ac-play.begin+0s" fill="freeze"/><circle cx="508" cy="235" r="7" fill="#2563eb" stroke="#111827"/></g><g><animate attributeName="opacity" keyTimes="0.0000;0.3071;0.3286;1.0000" values="0;0;1;1" dur="14s" begin="ac-play.begin+0s" fill="freeze"/><circle cx="499" cy="229" r="7" fill="#2563eb" stroke="#111827"/></g><g><animate attributeName="opacity" keyTimes="0.0000;0.3286;0.3500;1.0000" values="0;0;1;1" dur="14s" begin="ac-play.begin+0s" fill="freeze"/><circle cx="513" cy="229" r="7" fill="#2563eb" stroke="#111827"/></g><g><animate attributeName="opacity" keyTimes="0.0000;0.3500;0.3714;1.0000" values="0;0;1;1" dur="14s" begin="ac-play.begin+0s" fill="freeze"/><circle cx="496" cy="224" r="7" fill="#2563eb" stroke="#111827"/></g><g><animate attributeName="opacity" keyTimes="0.0000;0.3714;0.3929;1.0000" values="0;0;1;1" dur="14s" begin="ac-play.begin+0s" fill="freeze"/><circle cx="500" cy="231" r="7" fill="#2563eb" stroke="#111827"/></g><g><animate attributeName="opacity" keyTimes="0.0000;0.3929;0.4143;1.0000" values="0;0;1;1" dur="14s" begin="ac-play.begin+0s" fill="freeze"/><circle cx="498" cy="230" r="7" fill="#2563eb" stroke="#111827"/></g><g><animate attributeName="opacity" keyTimes="0.0000;0.4286;0.4500;1.0000" values="0;0;1;1" dur="14s" begin="ac-play.begin+0s" fill="freeze"/><path d="M 493 229 L 511 229 M 502 220 L 502 238" stroke="#111827" stroke-width="3"/></g><text x="460" y="400" text-anchor="middle" font-size="15" font-weight="800" fill="#2563eb">precise, not accurate</text><text x="460" y="422" text-anchor="middle" font-size="12" font-weight="700" fill="#475569">systematic error</text></g></g>
<g class="part" data-part="a" data-name="Accurate but not precise" data-info="Readings spread out but their mean is close to the true value: large random errors. Repeating and averaging helps." tabindex="0" role="button" aria-label="Accurate but not precise"><g><animate attributeName="opacity" keyTimes="0.0000;0.4643;0.4857;1.0000" values="0;0;1;1" dur="14s" begin="ac-play.begin+0s" fill="freeze"/><circle cx="760" cy="260" r="110" fill="#fff" stroke="#94a3b8"/><circle cx="760" cy="260" r="80" fill="#f1f5f9" stroke="#94a3b8"/><circle cx="760" cy="260" r="50" fill="#fff" stroke="#94a3b8"/><circle cx="760" cy="260" r="20" fill="#fecaca" stroke="#94a3b8"/><g><animate attributeName="opacity" keyTimes="0.0000;0.5000;0.5214;1.0000" values="0;0;1;1" dur="14s" begin="ac-play.begin+0s" fill="freeze"/><circle cx="798" cy="267" r="7" fill="#ea580c" stroke="#111827"/></g><g><animate attributeName="opacity" keyTimes="0.0000;0.5214;0.5429;1.0000" values="0;0;1;1" dur="14s" begin="ac-play.begin+0s" fill="freeze"/><circle cx="780" cy="298" r="7" fill="#ea580c" stroke="#111827"/></g><g><animate attributeName="opacity" keyTimes="0.0000;0.5429;0.5643;1.0000" values="0;0;1;1" dur="14s" begin="ac-play.begin+0s" fill="freeze"/><circle cx="718" cy="289" r="7" fill="#ea580c" stroke="#111827"/></g><g><animate attributeName="opacity" keyTimes="0.0000;0.5643;0.5857;1.0000" values="0;0;1;1" dur="14s" begin="ac-play.begin+0s" fill="freeze"/><circle cx="719" cy="237" r="7" fill="#ea580c" stroke="#111827"/></g><g><animate attributeName="opacity" keyTimes="0.0000;0.5857;0.6071;1.0000" values="0;0;1;1" dur="14s" begin="ac-play.begin+0s" fill="freeze"/><circle cx="759" cy="212" r="7" fill="#ea580c" stroke="#111827"/></g><g><animate attributeName="opacity" keyTimes="0.0000;0.6071;0.6286;1.0000" values="0;0;1;1" dur="14s" begin="ac-play.begin+0s" fill="freeze"/><circle cx="793" cy="238" r="7" fill="#ea580c" stroke="#111827"/></g><g><animate attributeName="opacity" keyTimes="0.0000;0.6429;0.6643;1.0000" values="0;0;1;1" dur="14s" begin="ac-play.begin+0s" fill="freeze"/><path d="M 752 257 L 770 257 M 761 248 L 761 266" stroke="#111827" stroke-width="3"/></g><text x="760" y="400" text-anchor="middle" font-size="15" font-weight="800" fill="#ea580c">accurate, not precise</text><text x="760" y="422" text-anchor="middle" font-size="12" font-weight="700" fill="#475569">random errors</text></g></g>
<g class="part" data-part="n" data-name="Neither" data-info="Readings spread out and the mean is off the true value." tabindex="0" role="button" aria-label="Neither"><g><animate attributeName="opacity" keyTimes="0.0000;0.6786;0.7000;1.0000" values="0;0;1;1" dur="14s" begin="ac-play.begin+0s" fill="freeze"/><circle cx="1060" cy="260" r="110" fill="#fff" stroke="#94a3b8"/><circle cx="1060" cy="260" r="80" fill="#f1f5f9" stroke="#94a3b8"/><circle cx="1060" cy="260" r="50" fill="#fff" stroke="#94a3b8"/><circle cx="1060" cy="260" r="20" fill="#fecaca" stroke="#94a3b8"/><g><animate attributeName="opacity" keyTimes="0.0000;0.7143;0.7357;1.0000" values="0;0;1;1" dur="14s" begin="ac-play.begin+0s" fill="freeze"/><circle cx="1186" cy="289" r="7" fill="#dc2626" stroke="#111827"/></g><g><animate attributeName="opacity" keyTimes="0.0000;0.7357;0.7571;1.0000" values="0;0;1;1" dur="14s" begin="ac-play.begin+0s" fill="freeze"/><circle cx="1118" cy="254" r="7" fill="#dc2626" stroke="#111827"/></g><g><animate attributeName="opacity" keyTimes="0.0000;0.7571;0.7786;1.0000" values="0;0;1;1" dur="14s" begin="ac-play.begin+0s" fill="freeze"/><circle cx="1087" cy="308" r="7" fill="#dc2626" stroke="#111827"/></g><g><animate attributeName="opacity" keyTimes="0.0000;0.7786;0.8000;1.0000" values="0;0;1;1" dur="14s" begin="ac-play.begin+0s" fill="freeze"/><circle cx="1092" cy="300" r="7" fill="#dc2626" stroke="#111827"/></g><g><animate attributeName="opacity" keyTimes="0.0000;0.8000;0.8214;1.0000" values="0;0;1;1" dur="14s" begin="ac-play.begin+0s" fill="freeze"/><circle cx="1098" cy="262" r="7" fill="#dc2626" stroke="#111827"/></g><g><animate attributeName="opacity" keyTimes="0.0000;0.8214;0.8429;1.0000" values="0;0;1;1" dur="14s" begin="ac-play.begin+0s" fill="freeze"/><circle cx="1111" cy="268" r="7" fill="#dc2626" stroke="#111827"/></g><g><animate attributeName="opacity" keyTimes="0.0000;0.8571;0.8786;1.0000" values="0;0;1;1" dur="14s" begin="ac-play.begin+0s" fill="freeze"/><path d="M 1106 280 L 1124 280 M 1115 271 L 1115 289" stroke="#111827" stroke-width="3"/></g><text x="1060" y="400" text-anchor="middle" font-size="15" font-weight="800" fill="#dc2626">neither</text><text x="1060" y="422" text-anchor="middle" font-size="12" font-weight="700" fill="#475569">both</text></g></g>
<g class="part" data-part="def" data-name="Definitions" data-info="Accuracy: how close a measurement is to the true value. Precision: how close repeated measurements are to each other." tabindex="0" role="button" aria-label="Definitions"><rect x="30" y="470" width="1160" height="150" rx="16" fill="#f8fafc" stroke="#cbd5e1"/><text x="60" y="500" text-anchor="start" font-size="13" font-weight="700" fill="#111827">Accuracy: closeness to the true value (reduced by removing systematic errors, e.g. calibrating, zeroing the balance).</text><text x="60" y="530" text-anchor="start" font-size="13" font-weight="700" fill="#111827">Precision: closeness of repeated readings to each other (improved by reducing random errors: repeats, more precise instruments).</text><text x="60" y="566" text-anchor="start" font-size="12" font-weight="600" fill="#475569">Example, true titre 25.00 cm³: 25.40, 25.45, 25.40 → precise, not accurate;  24.60, 25.40, 25.05 → mean 25.02, accurate, not precise.</text><text x="60" y="596" text-anchor="start" font-size="12" font-weight="600" fill="#475569">+ marks the mean of the readings on each target.</text></g>
</svg>