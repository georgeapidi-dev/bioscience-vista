<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 540" class="vd-svg" role="img" aria-labelledby="ae-title ae-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="ae-play" data-vd-play-label="Play: the mechanism" data-vd-steps="[[0, &quot;Addition\u2013elimination: ethanoyl chloride + water.&quot;], [1, &quot;Water&#x27;s lone pair attacks the \u03b4+ carbon; \u03c0 electrons move to O.&quot;], [6, &quot;Tetrahedral intermediate.&quot;], [9, &quot;C=O re-forms, Cl\u207b leaves, H\u207a lost: ethanoic acid + HCl.&quot;]]" data-vd-dur="16">
<title id="ae-title">Addition–elimination mechanism</title><desc id="ae-desc">A water molecule attacks the delta-positive carbonyl carbon of ethanoyl chloride, the pi electrons move onto oxygen to form a tetrahedral intermediate, then the carbon-oxygen double bond reforms, chloride leaves and a proton is lost to give ethanoic acid and hydrogen chloride.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="540" fill="#ffffff"/>
<g aria-hidden="true"><animate id="ae-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<defs><marker id="ae-dc2626" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="5.4" refY="6.0" orient="auto"><path d="M0,0 L12,6.0 L0,12 z" fill="#dc2626"/></marker><marker id="ae-2563eb" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="5.4" refY="6.0" orient="auto"><path d="M0,0 L12,6.0 L0,12 z" fill="#2563eb"/></marker></defs>
<text class="head" x="30" y="34">Addition–elimination: CH₃COCl + H₂O</text><text class="note" x="30" y="56">Same pattern with alcohols, NH₃ and amines.</text>
<g class="part" data-part="s1" data-name="Addition" data-info="A lone pair on the nucleophile (here the O of water, or N of NH₃) attacks the δ+ acyl carbon; the C=O π electrons move onto O: a tetrahedral intermediate." tabindex="0" role="button" aria-label="Addition"><circle cx="220" cy="300" r="18" fill="#374151" stroke="#1f2937" stroke-width="1.5"/><text x="220" y="305" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">C</text><line x1="224.0" y1="282.0" x2="224.0" y2="240.0" stroke="#334155" stroke-width="3"/><line x1="216.0" y1="282.0" x2="216.0" y2="240.0" stroke="#334155" stroke-width="3"/><circle cx="220" cy="224" r="18" fill="#ef4444" stroke="#1f2937" stroke-width="1.5"/><text x="220" y="229" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">O</text><line x1="238" y1="300" x2="282" y2="324" stroke="#334155" stroke-width="4"/><circle cx="296" cy="332" r="15" fill="#22c55e" stroke="#1f2937" stroke-width="1.5"/><text x="296" y="337" text-anchor="middle" font-size="10" font-weight="800" fill="#052e16">Cl</text><line x1="202" y1="300" x2="160" y2="300" stroke="#334155" stroke-width="4"/><text x="135" y="305" text-anchor="middle" font-size="13" font-weight="800" fill="#713f12">CH₃</text><text x="252" y="296" text-anchor="start" font-size="12" font-weight="800" fill="#b91c1c">δ+</text><circle cx="220" cy="410" r="18" fill="#ef4444" stroke="#1f2937" stroke-width="1.5"/><text x="220" y="415" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">O</text><line x1="204" y1="418" x2="180" y2="436" stroke="#334155" stroke-width="4"/><circle cx="172" cy="442" r="11" fill="#f8fafc" stroke="#1f2937" stroke-width="1.5"/><text x="172" y="447" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">H</text><line x1="236" y1="418" x2="260" y2="436" stroke="#334155" stroke-width="4"/><circle cx="268" cy="442" r="11" fill="#f8fafc" stroke="#1f2937" stroke-width="1.5"/><text x="268" y="447" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">H</text><text x="220" y="384" text-anchor="middle" font-size="16" font-weight="800" fill="#2563eb">••</text><g><animate attributeName="opacity" keyTimes="0.0000;0.0938;0.1125;1.0000" values="0;0;1;1" dur="16s" begin="ae-play.begin+0s" fill="freeze"/><path d="M 212 392 Q 190 350 210 318" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#ae-2563eb)"/><path d="M 214 270 Q 192 252 210 236" fill="none" stroke="#dc2626" stroke-width="3" marker-end="url(#ae-dc2626)"/></g></g>
<g class="part" data-part="s2" data-name="Elimination" data-info="The O⁻ lone pair re-forms C=O and Cl⁻ is expelled; then H⁺ is lost from the nucleophile, which combines with Cl⁻ as HCl." tabindex="0" role="button" aria-label="Elimination"><g><animate attributeName="opacity" keyTimes="0.0000;0.3750;0.3937;1.0000" values="0;0;1;1" dur="16s" begin="ae-play.begin+0s" fill="freeze"/><rect x="380" y="150" width="320" height="330" rx="16" fill="#fef2f2" stroke="#fecaca"/><circle cx="540" cy="310" r="18" fill="#374151" stroke="#1f2937" stroke-width="1.5"/><text x="540" y="315" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">C</text><line x1="540" y1="292" x2="540" y2="250" stroke="#334155" stroke-width="4"/><circle cx="540" cy="236" r="18" fill="#ef4444" stroke="#1f2937" stroke-width="1.5"/><text x="540" y="241" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">O</text><text x="562" y="222" text-anchor="middle" font-size="20" font-weight="800" fill="#1d4ed8">−</text><line x1="558" y1="310" x2="600" y2="330" stroke="#334155" stroke-width="4"/><circle cx="614" cy="338" r="15" fill="#22c55e" stroke="#1f2937" stroke-width="1.5"/><text x="614" y="343" text-anchor="middle" font-size="10" font-weight="800" fill="#052e16">Cl</text><line x1="522" y1="310" x2="480" y2="310" stroke="#334155" stroke-width="4"/><text x="456" y="315" text-anchor="middle" font-size="13" font-weight="800" fill="#713f12">CH₃</text><line x1="540" y1="328" x2="540" y2="372" stroke="#334155" stroke-width="4"/><circle cx="540" cy="388" r="18" fill="#ef4444" stroke="#1f2937" stroke-width="1.5"/><text x="540" y="393" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">O</text><text x="562" y="380" text-anchor="middle" font-size="18" font-weight="800" fill="#b91c1c">+</text><line x1="524" y1="396" x2="500" y2="414" stroke="#334155" stroke-width="4"/><circle cx="492" cy="420" r="11" fill="#f8fafc" stroke="#1f2937" stroke-width="1.5"/><text x="492" y="425" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">H</text><line x1="556" y1="396" x2="580" y2="414" stroke="#334155" stroke-width="4"/><circle cx="588" cy="420" r="11" fill="#f8fafc" stroke="#1f2937" stroke-width="1.5"/><text x="588" y="425" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">H</text><text x="540" y="462" text-anchor="middle" font-size="12" font-weight="800" fill="#b91c1c">tetrahedral intermediate</text><g><animate attributeName="opacity" keyTimes="0.0000;0.5625;0.5813;1.0000" values="0;0;1;1" dur="16s" begin="ae-play.begin+0s" fill="freeze"/><path d="M 548 254 Q 570 280 552 296" fill="none" stroke="#dc2626" stroke-width="3" marker-end="url(#ae-dc2626)"/><path d="M 570 316 Q 600 300 604 322" fill="none" stroke="#dc2626" stroke-width="3" marker-end="url(#ae-dc2626)"/></g></g></g>
<g class="part" data-part="res" data-name="Result" data-info="Overall a substitution of Cl by the nucleophile, by an addition–elimination (nucleophilic acyl substitution) mechanism." tabindex="0" role="button" aria-label="Result"><g><animate attributeName="opacity" keyTimes="0.0000;0.6875;0.7063;1.0000" values="0;0;1;1" dur="16s" begin="ae-play.begin+0s" fill="freeze"/><rect x="730" y="150" width="340" height="330" rx="16" fill="#f0fdf4" stroke="#86efac"/><circle cx="880" cy="300" r="18" fill="#374151" stroke="#1f2937" stroke-width="1.5"/><text x="880" y="305" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">C</text><line x1="884.0" y1="282.0" x2="884.0" y2="240.0" stroke="#334155" stroke-width="3"/><line x1="876.0" y1="282.0" x2="876.0" y2="240.0" stroke="#334155" stroke-width="3"/><circle cx="880" cy="224" r="18" fill="#ef4444" stroke="#1f2937" stroke-width="1.5"/><text x="880" y="229" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">O</text><line x1="898" y1="300" x2="940" y2="324" stroke="#334155" stroke-width="4"/><circle cx="954" cy="330" r="18" fill="#ef4444" stroke="#1f2937" stroke-width="1.5"/><text x="954" y="335" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">O</text><line x1="970" y1="330" x2="1000" y2="330" stroke="#334155" stroke-width="4"/><circle cx="1010" cy="330" r="11" fill="#f8fafc" stroke="#1f2937" stroke-width="1.5"/><text x="1010" y="335" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">H</text><line x1="862" y1="300" x2="820" y2="300" stroke="#334155" stroke-width="4"/><text x="796" y="305" text-anchor="middle" font-size="13" font-weight="800" fill="#713f12">CH₃</text><text x="900" y="400" text-anchor="middle" font-size="15" font-weight="800" fill="#15803d">ethanoic acid + HCl</text><text x="900" y="426" text-anchor="middle" font-size="12" font-weight="700" fill="#475569">(H⁺ + Cl⁻)</text></g></g>
</svg>