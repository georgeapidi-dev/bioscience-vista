<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 540" class="vd-svg" role="img" aria-labelledby="mo-title mo-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="mo-play" data-vd-play-label="Play: weigh a mole" data-vd-steps="[[0, &quot;The mole: counting particles by weighing.&quot;], [1, &quot;1 mol of anything = 6.02 \u00d7 10\u00b2\u00b3 particles.&quot;], [5, &quot;Different substances: different molar masses.&quot;], [9, &quot;Worked example: 9.0 g of water.&quot;]]" data-vd-dur="14">
<title id="mo-title">The mole and the Avogadro constant</title><desc id="mo-desc">One mole samples of carbon, water and sodium chloride each contain 6.02 times ten to the 23 particles but have different masses; the formula n equals m over M, with a worked example for 9.0 grams of water.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="540" fill="#ffffff"/>
<g aria-hidden="true"><animate id="mo-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<text class="head" x="30" y="34">The mole: counting by weighing</text><text class="note" x="30" y="56">L = 6.02 × 10²³ mol⁻¹.</text>
<g class="part" data-part="count" data-name="Counting by weighing" data-info="One mole of any substance contains 6.02 × 10²³ particles (the Avogadro constant, L)." tabindex="0" role="button" aria-label="Counting by weighing"><g><animate attributeName="opacity" keyTimes="0.0000;0.0714;0.0929;1.0000" values="0;0;1;1" dur="14s" begin="mo-play.begin+0s" fill="freeze"/><rect x="120.0" y="100.0" width="560" height="60" rx="12" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/><text x="400" y="135.0" text-anchor="middle" font-size="15" font-weight="800" fill="#111827">1 mole = 6.02 × 10²³ particles (atoms, molecules or ions)</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.3571;0.3786;1.0000" values="0;0;1;1" dur="14s" begin="mo-play.begin+0s" fill="freeze"/><rect x="80" y="300" width="160" height="20" fill="#94a3b8"/><path d="M 110 300 L 120 230 L 200 230 L 210 300 Z" fill="#374151" stroke="#334155" stroke-width="2"/><text x="160" y="352" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">carbon</text><text x="160" y="372" text-anchor="middle" font-size="13" font-weight="800" fill="#1d4ed8">1 mol = 12.0 g</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.4143;0.4357;1.0000" values="0;0;1;1" dur="14s" begin="mo-play.begin+0s" fill="freeze"/><rect x="310" y="300" width="160" height="20" fill="#94a3b8"/><path d="M 340 300 L 350 230 L 430 230 L 440 300 Z" fill="#60a5fa" stroke="#334155" stroke-width="2"/><text x="390" y="352" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">water</text><text x="390" y="372" text-anchor="middle" font-size="13" font-weight="800" fill="#1d4ed8">1 mol = 18.0 g</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.4714;0.4929;1.0000" values="0;0;1;1" dur="14s" begin="mo-play.begin+0s" fill="freeze"/><rect x="540" y="300" width="160" height="20" fill="#94a3b8"/><path d="M 570 300 L 580 230 L 660 230 L 670 300 Z" fill="#e5e7eb" stroke="#334155" stroke-width="2"/><text x="620" y="352" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">sodium chloride</text><text x="620" y="372" text-anchor="middle" font-size="13" font-weight="800" fill="#1d4ed8">1 mol = 58.5 g</text></g></g>
<g class="part" data-part="eq" data-name="Moles from mass" data-info="n = m ÷ M. 12.0 g of carbon-12 is exactly 1 mol of atoms." tabindex="0" role="button" aria-label="Moles from mass"><rect x="760" y="230" width="300" height="120" rx="16" fill="#fef9c3" stroke="#eab308"/><text x="910" y="290" text-anchor="middle" font-size="28" font-weight="800" fill="#713f12">n = m ÷ M</text><text x="910" y="330" text-anchor="middle" font-size="12" font-weight="700" fill="#713f12">mol = g ÷ g mol⁻¹</text></g>
<g class="part" data-part="ex" data-name="Worked example" data-info="9.0 g of water: M = 18.0 g mol⁻¹; n = 9.0 ÷ 18.0 = 0.50 mol; molecules = 0.50 × 6.02 × 10²³ = 3.01 × 10²³." tabindex="0" role="button" aria-label="Worked example"><g><animate attributeName="opacity" keyTimes="0.0000;0.6429;0.6643;1.0000" values="0;0;1;1" dur="14s" begin="mo-play.begin+0s" fill="freeze"/><rect x="60" y="410" width="1000" height="110" rx="16" fill="#f0fdf4" stroke="#86efac"/><text x="560" y="440" text-anchor="middle" font-size="14" font-weight="800" fill="#111827">9.0 g of water (M = 18.0 g mol⁻¹)</text><text x="560" y="470" text-anchor="middle" font-size="15" font-weight="800" fill="#15803d">n = 9.0 ÷ 18.0 = 0.50 mol</text><text x="560" y="500" text-anchor="middle" font-size="15" font-weight="800" fill="#15803d">molecules = 0.50 × 6.02 × 10²³ = 3.01 × 10²³</text></g></g>
</svg>