<text class="head" x="30" y="34">Heating under reflux</text><text class="note" x="30" y="56">The top of the condenser is left open.</text>
<g class="part" data-part="heat" data-name="Heating" data-info="An electric heating mantle or water bath: no naked flame, since organic liquids are flammable." tabindex="0" role="button" aria-label="Heating"><rect x="290" y="590" width="220" height="70" rx="12" fill="#475569"/><text x="400" y="632" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">heating mantle</text></g>
<g class="part" data-part="flask" data-name="Round-bottomed flask" data-info="Contains the reaction mixture and anti-bumping granules (for smooth boiling)." tabindex="0" role="button" aria-label="Round-bottomed flask"><circle cx="400" cy="520" r="100" fill="#f8fafc" stroke="#334155" stroke-width="4"/><path d="M 302 540 A 100 100 0 0 0 498 540 Z" fill="#f97316"><animate attributeName="fill" values="#f97316;#f97316;#16a34a;#16a34a" keyTimes="0;0.600;0.867;1" dur="15s" begin="rf-play.begin" fill="freeze"/></path><rect x="378" y="360" width="44" height="70" fill="#f8fafc" stroke="#334155" stroke-width="4"/><circle cx="360" cy="600" r="6" fill="#e5e7eb" stroke="#475569"/><circle cx="386" cy="592" r="6" fill="#e5e7eb" stroke="#475569"/><circle cx="412" cy="600" r="6" fill="#e5e7eb" stroke="#475569"/><circle cx="438" cy="592" r="6" fill="#e5e7eb" stroke="#475569"/><circle cx="340" cy="580" r="5" fill="#fff" opacity=".9"><animate attributeName="cy" values="590;545" dur="0.8s" repeatCount="indefinite"/></circle><circle cx="370" cy="580" r="5" fill="#fff" opacity=".9"><animate attributeName="cy" values="590;545" dur="0.9s" repeatCount="indefinite"/></circle><circle cx="400" cy="580" r="5" fill="#fff" opacity=".9"><animate attributeName="cy" values="590;545" dur="1.0s" repeatCount="indefinite"/></circle><circle cx="430" cy="580" r="5" fill="#fff" opacity=".9"><animate attributeName="cy" values="590;545" dur="1.1s" repeatCount="indefinite"/></circle><circle cx="460" cy="580" r="5" fill="#fff" opacity=".9"><animate attributeName="cy" values="590;545" dur="1.2s" repeatCount="indefinite"/></circle><line x1="370" y1="596" x2="160" y2="620" stroke="#475569" stroke-width="1.5"/><circle cx="370" cy="596" r="3" fill="#475569"/><text x="160" y="636" text-anchor="middle" font-size="12" font-weight="800" fill="#334155">anti-bumping granules</text></g>
<g class="part" data-part="cond" data-name="Condenser (vertical)" data-info="Cooling water enters at the bottom and leaves at the top, so the jacket stays full and cold." tabindex="0" role="button" aria-label="Condenser (vertical)"><rect x="360" y="140" width="80" height="230" rx="10" fill="#dbeafe" stroke="#334155" stroke-width="4"/><rect x="386" y="100" width="28" height="270" fill="#fff" stroke="#334155" stroke-width="3"/><path d="M 440 340 L 530 340" stroke="#334155" stroke-width="10"/><path d="M 440 170 L 530 170" stroke="#334155" stroke-width="10"/><g><animate attributeName="opacity" keyTimes="0.0000;0.2333;0.2533;1.0000" values="0;0;1;1" dur="15s" begin="rf-play.begin+0s" fill="freeze"/><path d="M 600 340 L 540 340" stroke="#2563eb" stroke-width="4" marker-end="url(#rf-2563eb)"/><text x="610" y="344" text-anchor="start" font-size="13" font-weight="800" fill="#1d4ed8">cold water in</text><path d="M 540 170 L 600 170" stroke="#2563eb" stroke-width="4" marker-end="url(#rf-2563eb)"/><text x="610" y="174" text-anchor="start" font-size="13" font-weight="800" fill="#1d4ed8">water out</text></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.2333;0.2467;0.4067;0.4200;1.0000" values="0;0;1;1;0;0" dur="15s" begin="rf-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.2333;0.4000;1.0000" values="430 340;430 340;430 170;430 170" dur="15s" begin="rf-play.begin+0s" fill="freeze"/><circle r="4" fill="#3b82f6"/></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.2533;0.2667;0.4267;0.4400;1.0000" values="0;0;1;1;0;0" dur="15s" begin="rf-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.2533;0.4200;1.0000" values="430 340;430 340;430 170;430 170" dur="15s" begin="rf-play.begin+0s" fill="freeze"/><circle r="4" fill="#3b82f6"/></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.2733;0.2867;0.4467;0.4600;1.0000" values="0;0;1;1;0;0" dur="15s" begin="rf-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.2733;0.4400;1.0000" values="430 340;430 340;430 170;430 170" dur="15s" begin="rf-play.begin+0s" fill="freeze"/><circle r="4" fill="#3b82f6"/></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.2933;0.3067;0.4667;0.4800;1.0000" values="0;0;1;1;0;0" dur="15s" begin="rf-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.2933;0.4600;1.0000" values="430 340;430 340;430 170;430 170" dur="15s" begin="rf-play.begin+0s" fill="freeze"/><circle r="4" fill="#3b82f6"/></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.3133;0.3267;0.4867;0.5000;1.0000" values="0;0;1;1;0;0" dur="15s" begin="rf-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.3133;0.4800;1.0000" values="430 340;430 340;430 170;430 170" dur="15s" begin="rf-play.begin+0s" fill="freeze"/><circle r="4" fill="#3b82f6"/></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.3333;0.3467;0.5067;0.5200;1.0000" values="0;0;1;1;0;0" dur="15s" begin="rf-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.3333;0.5000;1.0000" values="430 340;430 340;430 170;430 170" dur="15s" begin="rf-play.begin+0s" fill="freeze"/><circle r="4" fill="#3b82f6"/></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.3533;0.3667;0.5267;0.5400;1.0000" values="0;0;1;1;0;0" dur="15s" begin="rf-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.3533;0.5200;1.0000" values="430 340;430 340;430 170;430 170" dur="15s" begin="rf-play.begin+0s" fill="freeze"/><circle r="4" fill="#3b82f6"/></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.3733;0.3867;0.5467;0.5600;1.0000" values="0;0;1;1;0;0" dur="15s" begin="rf-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.3733;0.5400;1.0000" values="430 340;430 340;430 170;430 170" dur="15s" begin="rf-play.begin+0s" fill="freeze"/><circle r="4" fill="#3b82f6"/></g></g><text x="340" y="250" text-anchor="end" font-size="13" font-weight="800" fill="#111827">condenser</text></g>
<g class="part" data-part="vap" data-name="Vapour condenses and returns" data-info="Volatile substances boil, condense in the condenser and drip back into the flask: nothing is lost, so the reaction can be heated for a long time." tabindex="0" role="button" aria-label="Vapour condenses and returns"><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.3667;0.3800;0.5867;0.6000;1.0000" values="0;0;1;1;0;0" dur="15s" begin="rf-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.3667;0.4533;0.5067;0.5733;1.0000" values="400 460;400 460;400 300;400 230;400 490;400 490" dur="15s" begin="rf-play.begin+0s" fill="freeze"/><circle r="5" fill="#f1f5f9" stroke="#64748b"/></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.3967;0.4100;0.6167;0.6300;1.0000" values="0;0;1;1;0;0" dur="15s" begin="rf-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.3967;0.4833;0.5367;0.6033;1.0000" values="400 460;400 460;400 300;400 230;400 490;400 490" dur="15s" begin="rf-play.begin+0s" fill="freeze"/><circle r="5" fill="#f1f5f9" stroke="#64748b"/></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.4267;0.4400;0.6467;0.6600;1.0000" values="0;0;1;1;0;0" dur="15s" begin="rf-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.4267;0.5133;0.5667;0.6333;1.0000" values="400 460;400 460;400 300;400 230;400 490;400 490" dur="15s" begin="rf-play.begin+0s" fill="freeze"/><circle r="5" fill="#f1f5f9" stroke="#64748b"/></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.4567;0.4700;0.6767;0.6900;1.0000" values="0;0;1;1;0;0" dur="15s" begin="rf-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.4567;0.5433;0.5967;0.6633;1.0000" values="400 460;400 460;400 300;400 230;400 490;400 490" d