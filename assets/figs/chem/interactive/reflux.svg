<g class="part" data-part="open" data-name="Open top" data-info="Never seal the apparatus: heating a closed system could make it explode." tabindex="0" role="button" aria-label="Open top"><text x="400" y="88" text-anchor="middle" font-size="13" font-weight="800" fill="#b91c1c">open to the air</text></g>
<g class="part" data-part="eg" data-name="Example" data-info="Ethanol + excess acidified K₂Cr₂O₇ under reflux → ethanoic acid. Colour change: orange Cr₂O₇²⁻ → green Cr³⁺." tabindex="0" role="button" aria-label="Example"><g><animate attributeName="opacity" keyTimes="0.0000;0.6000;0.6200;1.0000" values="0;0;1;1" dur="15s" begin="rf-play.begin+0s" fill="freeze"/><rect x="760" y="380" width="440" height="200" rx="16" fill="#fff7ed" stroke="#fdba74"/><text x="980" y="408" text-anchor="middle" font-size="15" font-weight="800" fill="#9a3412">Example: oxidising ethanol</text><text x="980" y="440" text-anchor="middle" font-size="14" font-weight="800" fill="#111827">CH₃CH₂OH + 2[O] → CH₃COOH + H₂O</text><text x="980" y="468" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">excess acidified K₂Cr₂O₇, under reflux</text><rect x="800" y="490" width="60" height="30" rx="6" fill="#f97316"/><text x="900" y="512" text-anchor="middle" font-size="20" font-weight="800" fill="#111827">→</text><rect x="940" y="490" width="60" height="30" rx="6" fill="#16a34a"/><text x="1080" y="504" text-anchor="middle" font-size="12" font-weight="800" fill="#c2410c">Cr₂O₇²⁻ orange</text><text x="1080" y="522" text-anchor="middle" font-size="12" font-weight="800" fill="#15803d">→ Cr³⁺ green</text><text x="980" y="560" text-anchor="middle" font-size="12" font-weight="600" fill="#475569">(distil instead to stop at the aldehyde, ethanal)</text></g></g>
</svg>