<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 700" class="vd-svg" role="img" aria-labelledby="rf-title rf-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="rf-play" data-vd-play-label="Play: reflux" data-vd-steps="[[0, &quot;Heating under reflux.&quot;], [1, &quot;The mixture is heated in a round-bottomed flask with anti-bumping granules.&quot;], [3.5, &quot;Cold water flows into the condenser at the bottom and out at the top.&quot;], [5.5, &quot;Vapour rises, condenses on the cold surface and drips back into the flask.&quot;], [9, &quot;Example: ethanol oxidised fully to ethanoic acid; dichromate turns from orange to green.&quot;]]" data-vd-dur="15">
<title id="rf-title">Heating under reflux</title><desc id="rf-desc">Reflux apparatus: a round-bottomed flask with anti-bumping granules on a heating mantle, a vertical condenser with water in at the bottom and out at the top, vapour condensing and returning; example oxidation of ethanol with acidified dichromate.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1220" height="700" fill="#ffffff"/>
<g aria-hidden="true"><animate id="rf-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
