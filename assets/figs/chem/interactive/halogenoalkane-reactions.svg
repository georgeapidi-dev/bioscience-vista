<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 580" class="vd-svg" role="img" aria-labelledby="hr2-title hr2-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="hr2-play" data-vd-play-label="Play: substitute" data-vd-steps="[[0, &quot;Halogenoalkanes: a polar C\u2013X bond.&quot;], [1, &quot;Nucleophiles substitute; ethanolic hydroxide eliminates.&quot;], [9, &quot;C\u2013I breaks fastest: rate follows bond strength.&quot;]]" data-vd-dur="16">
<title id="hr2-title">Reactions of halogenoalkanes</title><desc id="hr2-desc">Bromoethane reacting with aqueous sodium hydroxide to give ethanol, potassium cyanide to give propanenitrile, excess ammonia to give ethylamine, and ethanolic sodium hydroxide to give ethene by elimination; silver nitrate hydrolysis rates follow carbon-halogen bond strength.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="580" fill="#ffffff"/>
<g aria-hidden="true"><animate id="hr2-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<defs><marker id="hr2-475569" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="5.4" refY="6.0" orient="auto"><path d="M0,0 L12,6.0 L0,12 z" fill="#475569"/></marker></defs>
<text class="head" x="30" y="34">Halogenoalkanes: substitution and elimination</text><text class="note" x="30" y="56">Starting from bromoethane, CH₃CH₂Br.</text>
<g class="part" data-part="map" data-name="Reactions of bromoethane" data-info="OH⁻, CN⁻ and NH₃ are nucleophiles that substitute for Br; ethanolic OH⁻ acts as a base and eliminates HBr." tabindex="0" role="button" aria-label="Reactions of bromoethane"><circle cx="230" cy="300" r="70" fill="#fee2e2" stroke="#b91c1c" stroke-width="3"/><text x="230" y="296" text-anchor="middle" font-size="16" font-weight="800" fill="#7f1d1d">CH₃CH₂Br</text><text x="200" y="322" text-anchor="middle" font-size="11" font-weight="800" fill="#b91c1c">Cδ+</text><text x="260" y="322" text-anchor="middle" font-size="11" font-weight="800" fill="#1d4ed8">Brδ−</text><g><animate attributeName="opacity" keyTimes="0.0000;0.0625;0.0813;1.0000" values="0;0;1;1" dur="16s" begin="hr2-play.begin+0s" fill="freeze"/><path d="M 193 236 L 95 127" stroke="#475569" stroke-width="3" marker-end="url(#hr2-475569)"/><rect x="100" y="85" width="300" height="84" rx="14" fill="#fff" stroke="#b91c1c" stroke-width="2"/><text x="250.00000000000006" y="110.79491924311225" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">CH₃CH₂OH (alcohol)</text><text x="250.00000000000006" y="132.79491924311225" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">NaOH(aq), heat under reflux</text><text x="250.00000000000006" y="152.79491924311225" text-anchor="middle" font-size="11" font-weight="800" fill="#b91c1c">nucleophilic substitution (hydrolysis)</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.1750;0.1937;1.0000" values="0;0;1;1" dur="16s" begin="hr2-play.begin+0s" fill="freeze"/><path d="M 287 252 L 386 171" stroke="#475569" stroke-width="3" marker-end="url(#hr2-475569)"/><rect x="391" y="129" width="300" height="84" rx="14" fill="#fff" stroke="#b91c1c" stroke-width="2"/><text x="541.190221917365" y="155.44247806269215" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">CH₃CH₂CN (nitrile (+1 C))</text><text x="541.190221917365" y="177.44247806269215" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">KCN in ethanol, heat</text><text x="541.190221917365" y="197.44247806269215" text-anchor="middle" font-size="11" font-weight="800" fill="#b91c1c">nucleophilic substitution</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.2875;0.3062;1.0000" values="0;0;1;1" dur="16s" begin="hr2-play.begin+0s" fill="freeze"/><path d="M 287 348 L 386 429" stroke="#475569" stroke-width="3" marker-end="url(#hr2-475569)"/><rect x="391" y="387" width="300" height="84" rx="14" fill="#fff" stroke="#b91c1c" stroke-width="2"/><text x="541.190221917365" y="412.55752193730785" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">CH₃CH₂NH₂ (amine)</text><text x="541.190221917365" y="434.55752193730785" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">excess NH₃ in ethanol, heat, sealed tube</text><text x="541.190221917365" y="454.55752193730785" text-anchor="middle" font-size="11" font-weight="800" fill="#b91c1c">nucleophilic substitution</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.4000;0.4188;1.0000" values="0;0;1;1" dur="16s" begin="hr2-play.begin+0s" fill="freeze"/><path d="M 193 364 L 95 473" stroke="#475569" stroke-width="3" marker-end="url(#hr2-475569)"/><rect x="100" y="431" width="300" height="84" rx="14" fill="#fff" stroke="#7c3aed" stroke-width="2"/><text x="250.00000000000006" y="457.20508075688775" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">CH₂=CH₂ (alkene)</text><text x="250.00000000000006" y="479.20508075688775" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">NaOH in ethanol, heat</text><text x="250.00000000000006" y="499.20508075688775" text-anchor="middle" font-size="11" font-weight="800" fill="#7c3aed">elimination</text></g></g>
<g class="part" data-part="rate" data-name="Which halogen reacts fastest?" data-info="Hydrolysis with AgNO₃(aq) in ethanol: iodo- forms a yellow precipitate first, then bromo- (cream), chloro- (white) last. Rate depends on C–X bond strength (C–I weakest), not polarity." tabindex="0" role="button" aria-label="Which halogen reacts fastest?"><rect x="760" y="80" width="310" height="480" rx="16" fill="#f8fafc" stroke="#cbd5e1"/><text x="915" y="106" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">rate of hydrolysis (AgNO₃)</text><path d="M 800 140 L 800 230 Q 830 246 860 230 L 860 140" fill="#f8fafc" stroke="#334155" stroke-width="2"/><rect x="802" y="180" width="56" height="52" fill="#e0f2fe"><animate attributeName="fill" keyTimes="0.0000;0.5938;0.6438;1.0000" values="#e0f2fe;#e0f2fe;#fde047;#fde047" dur="16s" begin="hr2-play.begin+0s" fill="freeze"/></rect><text x="960" y="184" text-anchor="middle" font-size="15" font-weight="800" fill="#111827">C–I</text><text x="960" y="206" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">238 kJ mol⁻¹</text><text x="960" y="226" text-anchor="middle" font-size="11" font-weight="800" fill="#111827">1st: yellow</text><path d="M 800 270 L 800 360 Q 830 376 860 360 L 860 270" fill="#f8fafc" stroke="#334155" stroke-width="2"/><rect x="802" y="310" width="56" height="52" fill="#e0f2fe"><animate attributeName="fill" keyTimes="0.0000;0.6750;0.7250;1.0000" values="#e0f2fe;#e0f2fe;#fef3c7;#fef3c7" dur="16s" begin="hr2-play.begin+0s" fill="freeze"/></rect><text x="960" y="314" text-anchor="middle" font-size="15" font-weight="800" fill="#111827">C–Br</text><text x="960" y="336" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">276 kJ mol⁻¹</text><text x="960" y="356" text-anchor="middle" font-size="11" font-weight="800" fill="#111827">2nd: cream</text><path d="M 800 400 L 800 490 Q 830 506 860 490 L 860 400" fill="#f8fafc" stroke="#334155" stroke-width="2"/><rect x="802" y="440" width="56" height="52" fill="#e0f2fe"><animate attributeName="fill" keyTimes="0.0000;0.7688;0.8188;1.0000" values="#e0f2fe;#e0f2fe;#e2e8f0;#e2e8f0" dur="16s" begin="hr2-play.begin+0s" fill="freeze"/></rect><text x="960" y="444" text-anchor="middle" font-size="15" font-weight="800" fill="#111827">C–Cl</text><text x="960" y="466" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">338 kJ mol⁻¹</text><text x="960" y="486" text-anchor="middle" font-size="11" font-weight="800" fill="#111827">3rd: white</text><g><animate attributeName="opacity" keyTimes="0.0000;0.8125;0.8313;1.0000" values="0;0;1;1" dur="16s" begin="hr2-play.begin+0s" fill="freeze"/><text x="915" y="545" text-anchor="middle" font-size="12" font-weight="800" fill="#b91c1c">weakest bond breaks fastest</text></g></g>
</svg>