<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" class="vd-svg" role="img" aria-labelledby="kb-title kb-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="kb-play" data-vd-play-label="Play: compare ligands" data-vd-steps="[[0, &quot;Stability constants.&quot;], [1, &quot;Kstab expressions leave out water.&quot;], [5, &quot;log Kstab: Cl\u207b &lt; NH\u2083 &lt; EDTA.&quot;], [10, &quot;The chelate effect: entropy increases.&quot;]]" data-vd-dur="14">
<title id="kb-title">Stability constants and the chelate effect</title><desc id="kb-desc">A bar chart of log stability constants for copper(II) complexes with chloride 5.6, ammonia 13.1 and EDTA 18.8; EDTA replacing six water molecules increases the number of particles, an entropy-driven chelate effect.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="560" fill="#ffffff"/>
<g aria-hidden="true"><animate id="kb-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<text class="head" x="30" y="34">Stability constants (Kstab) and the chelate effect</text><text class="note" x="30" y="56">Copper(II) complexes, log Kstab values.</text>
<g class="part" data-part="def" data-name="Kstab" data-info="For [Cu(H₂O)₆]²⁺ + 4NH₃ ⇌ [Cu(NH₃)₄(H₂O)₂]²⁺ + 4H₂O: Kstab = [Cu(NH₃)₄(H₂O)₂²⁺] / ([Cu(H₂O)₆²⁺][NH₃]⁴). Water is not included (solvent, constant)." tabindex="0" role="button" aria-label="Kstab"><g><animate attributeName="opacity" keyTimes="0.0000;0.0714;0.0929;1.0000" values="0;0;1;1" dur="14s" begin="kb-play.begin+0s" fill="freeze"/><rect x="90.0" y="78.0" width="920" height="64" rx="12" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/><text x="550" y="108" text-anchor="middle" font-size="16" font-weight="800" fill="#111827">Kstab = [Cu(NH₃)₄(H₂O)₂²⁺] / ([Cu(H₂O)₆²⁺] [NH₃]⁴)</text><text x="550" y="126" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">units: dm¹² mol⁻⁴ here · water omitted</text></g></g>
<g class="part" data-part="cmp" data-name="Comparing" data-info="Larger Kstab (or log Kstab) → more stable complex. A ligand forming a complex with larger Kstab will replace one with smaller Kstab." tabindex="0" role="button" aria-label="Comparing"><text x="260" y="180" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">log Kstab</text><line x1="60" y1="470" x2="540" y2="470" stroke="#111827" stroke-width="2"/><rect x="90" y="397" width="120" height="73" fill="#facc15" stroke="#334155"><animate attributeName="height" keyTimes="0.0000;0.3571;0.4000;1.0000" values="0;0;72.8;72.8" dur="14s" begin="kb-play.begin+0s" fill="freeze"/><animate attributeName="y" keyTimes="0.0000;0.3571;0.4000;1.0000" values="470;470;397.2;397.2" dur="14s" begin="kb-play.begin+0s" fill="freeze"/></rect><g><animate attributeName="opacity" keyTimes="0.0000;0.4000;0.4214;1.0000" values="0;0;1;1" dur="14s" begin="kb-play.begin+0s" fill="freeze"/><text x="150.0" y="389.2" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">5.6</text></g><text x="150.0" y="488" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">[CuCl₄]²⁻</text><rect x="240" y="300" width="120" height="170" fill="#1e40af" stroke="#334155"><animate attributeName="height" keyTimes="0.0000;0.4286;0.4714;1.0000" values="0;0;170.3;170.3" dur="14s" begin="kb-play.begin+0s" fill="freeze"/><animate attributeName="y" keyTimes="0.0000;0.4286;0.4714;1.0000" values="470;470;299.7;299.7" dur="14s" begin="kb-play.begin+0s" fill="freeze"/></rect><g><animate attributeName="opacity" keyTimes="0.0000;0.4714;0.4929;1.0000" values="0;0;1;1" dur="14s" begin="kb-play.begin+0s" fill="freeze"/><text x="300.0" y="291.7" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">13.1</text></g><text x="300.0" y="488" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">[Cu(NH₃)₄(H₂O)₂]²⁺</text><rect x="390" y="226" width="120" height="244" fill="#7c3aed" stroke="#334155"><animate attributeName="height" keyTimes="0.0000;0.5000;0.5429;1.0000" values="0;0;244.4;244.4" dur="14s" begin="kb-play.begin+0s" fill="freeze"/><animate attributeName="y" keyTimes="0.0000;0.5000;0.5429;1.0000" values="470;470;225.6;225.6" dur="14s" begin="kb-play.begin+0s" fill="freeze"/></rect><g><animate attributeName="opacity" keyTimes="0.0000;0.5429;0.5643;1.0000" values="0;0;1;1" dur="14s" begin="kb-play.begin+0s" fill="freeze"/><text x="450.0" y="217.6" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">18.8</text></g><text x="450.0" y="488" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">[Cu(EDTA)]²⁻</text></g>
<g class="part" data-part="chel" data-name="Chelate effect" data-info="Polydentate ligands such as EDTA⁴⁻ (hexadentate) form very stable complexes: one EDTA replaces six water molecules, so the number of particles increases and ΔS is large and positive." tabindex="0" role="button" aria-label="Chelate effect"><g><animate attributeName="opacity" keyTimes="0.0000;0.7143;0.7357;1.0000" values="0;0;1;1" dur="14s" begin="kb-play.begin+0s" fill="freeze"/><rect x="560" y="190" width="510" height="330" rx="16" fill="#f5f3ff" stroke="#c4b5fd"/><text x="815" y="220" text-anchor="middle" font-size="16" font-weight="800" fill="#6d28d9">chelate effect</text><text x="815" y="262" text-anchor="middle" font-size="14" font-weight="800" fill="#111827">[Cu(H₂O)₆]²⁺ + EDTA⁴⁻ → [Cu(EDTA)]²⁻ + 6H₂O</text><text x="815" y="300" text-anchor="middle" font-size="16" font-weight="800" fill="#15803d">2 particles → 7 particles</text><text x="815" y="330" text-anchor="middle" font-size="13" font-weight="800" fill="#15803d">ΔS large and positive → ΔG more negative</text><text x="815" y="380" text-anchor="middle" font-size="12" font-weight="700" fill="#475569">EDTA⁴⁻: hexadentate (2 N + 4 O donors)</text><text x="815" y="410" text-anchor="middle" font-size="12" font-weight="700" fill="#475569">uses: treating lead poisoning, water softening,</text><text x="815" y="430" text-anchor="middle" font-size="12" font-weight="700" fill="#475569">preserving foods (binds metal ions)</text><text x="815" y="480" text-anchor="middle" font-size="13" font-weight="800" fill="#b91c1c">larger Kstab ligand replaces smaller</text></g></g>
</svg>