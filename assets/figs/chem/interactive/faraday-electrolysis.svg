<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" class="vd-svg" role="img" aria-labelledby="fd-title fd-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="fd-play" data-vd-play-label="Play: plate copper" data-vd-steps="[[0, &quot;Quantitative electrolysis.&quot;], [1, &quot;Electrons deposit copper on the cathode.&quot;], [7, &quot;Q = It; moles of electrons = Q \u00f7 F.&quot;], [11, &quot;Mass of copper from the 2 : 1 ratio.&quot;]]" data-vd-dur="15">
<title id="fd-title">Quantitative electrolysis</title><desc id="fd-desc">A copper plating cell: copper ions gain electrons at the cathode, the anode dissolves; a worked calculation with a current of 0.500 amperes for 30 minutes giving 0.296 grams of copper.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="560" fill="#ffffff"/>
<g aria-hidden="true"><animate id="fd-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<text class="head" x="30" y="34">Quantitative electrolysis: Q = It and F = Le</text><text class="note" x="30" y="56">F = 96 500 C mol⁻¹; e = 1.60 × 10⁻¹⁹ C.</text>
<g class="part" data-part="cell" data-name="Copper plating" data-info="Electrolysis of CuSO₄(aq) with copper electrodes: cathode Cu²⁺ + 2e⁻ → Cu (gains mass); anode Cu → Cu²⁺ + 2e⁻ (loses mass)." tabindex="0" role="button" aria-label="Copper plating"><path d="M 80 180 L 80 440 Q 80 460 100 460 L 440 460 Q 460 460 460 440 L 460 180" fill="#dbeafe" stroke="#334155" stroke-width="3"/><rect x="82" y="210" width="376" height="248" fill="#3b82f6" opacity=".35"/><rect x="140" y="140" width="34" height="260" fill="#b45309"/><rect x="366" y="140" width="34" height="260" fill="#b45309"><animate attributeName="width" dur="15s" begin="fd-play.begin+0s" values="34;34;24;24" keyTimes="0;.07;.7;1" fill="freeze"/><animate attributeName="x" dur="15s" begin="fd-play.begin+0s" values="366;366;371;371" keyTimes="0;.07;.7;1" fill="freeze"/></rect><rect x="174" y="210" width="0" height="190" fill="#c2410c"><animate attributeName="width" keyTimes="0.0000;0.0667;0.6667;1.0000" values="0;0;8;8" dur="15s" begin="fd-play.begin+0s" fill="freeze"/></rect><text x="157" y="128" text-anchor="middle" font-size="12" font-weight="800" fill="#1d4ed8">cathode (−)</text><text x="383" y="128" text-anchor="middle" font-size="12" font-weight="800" fill="#b91c1c">anode (+)</text><path d="M 157 140 L 157 90 L 383 90 L 383 140" fill="none" stroke="#334155" stroke-width="3"/><rect x="240" y="72" width="60" height="36" rx="6" fill="#fff" stroke="#334155" stroke-width="2"/><text x="270" y="96" text-anchor="middle" font-size="16" font-weight="800" fill="#111827">A</text><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.0667;0.0800;0.1800;0.1933;1.0000" values="0;0;1;1;0;0" dur="15s" begin="fd-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.0667;0.1733;1.0000" values="360 260;360 260;180 260;180 260" dur="15s" begin="fd-play.begin+0s" fill="freeze"/><g><circle r="10" fill="#38bdf8" stroke="#0369a1"/><text x="0" y="4" text-anchor="middle" font-size="7" font-weight="800" fill="#0c4a6e">Cu²⁺</text></g></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.1733;0.1867;0.2867;0.3000;1.0000" values="0;0;1;1;0;0" dur="15s" begin="fd-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.1733;0.2800;1.0000" values="360 285;360 285;180 285;180 285" dur="15s" begin="fd-play.begin+0s" fill="freeze"/><g><circle r="10" fill="#38bdf8" stroke="#0369a1"/><text x="0" y="4" text-anchor="middle" font-size="7" font-weight="800" fill="#0c4a6e">Cu²⁺</text></g></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.2800;0.2933;0.3933;0.4067;1.0000" values="0;0;1;1;0;0" dur="15s" begin="fd-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.2800;0.3867;1.0000" values="360 310;360 310;180 310;180 310" dur="15s" begin="fd-play.begin+0s" fill="freeze"/><g><circle r="10" fill="#38bdf8" stroke="#0369a1"/><text x="0" y="4" text-anchor="middle" font-size="7" font-weight="800" fill="#0c4a6e">Cu²⁺</text></g></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.3867;0.4000;0.5000;0.5133;1.0000" values="0;0;1;1;0;0" dur="15s" begin="fd-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.3867;0.4933;1.0000" values="360 335;360 335;180 335;180 335" dur="15s" begin="fd-play.begin+0s" fill="freeze"/><g><circle r="10" fill="#38bdf8" stroke="#0369a1"/><text x="0" y="4" text-anchor="middle" font-size="7" font-weight="800" fill="#0c4a6e">Cu²⁺</text></g></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.4933;0.5067;0.6067;0.6200;1.0000" values="0;0;1;1;0;0" dur="15s" begin="fd-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.4933;0.6000;1.0000" values="360 360;360 360;180 360;180 360" dur="15s" begin="fd-play.begin+0s" fill="freeze"/><g><circle r="10" fill="#38bdf8" stroke="#0369a1"/><text x="0" y="4" text-anchor="middle" font-size="7" font-weight="800" fill="#0c4a6e">Cu²⁺</text></g></g></g><text x="270" y="490" text-anchor="middle" font-size="12" font-weight="700" fill="#475569">CuSO₄(aq), copper electrodes</text><g><animate attributeName="opacity" keyTimes="0.0000;0.1333;0.1533;1.0000" values="0;0;1;1" dur="15s" begin="fd-play.begin+0s" fill="freeze"/><text x="157" y="420" text-anchor="middle" font-size="11" font-weight="800" fill="#1d4ed8">Cu²⁺ + 2e⁻ → Cu</text><text x="383" y="420" text-anchor="middle" font-size="11" font-weight="800" fill="#b91c1c">Cu → Cu²⁺ + 2e⁻</text></g></g>
<g class="part" data-part="q" data-name="Q = It" data-info="Charge Q (C) = current I (A) × time t (s). Moles of electrons = Q ÷ F, where F = 96 500 C mol⁻¹." tabindex="0" role="button" aria-label="Q = It"><g><animate attributeName="opacity" keyTimes="0.0000;0.4667;0.4867;1.0000" values="0;0;1;1" dur="15s" begin="fd-play.begin+0s" fill="freeze"/><rect x="520" y="90" width="550" height="290" rx="16" fill="#fef9c3" stroke="#eab308"/><text x="795" y="120" text-anchor="middle" font-size="14" font-weight="800" fill="#713f12">worked example: 0.500 A for 30.0 min</text><text x="545" y="165" text-anchor="start" font-size="14" font-weight="800" fill="#111827">Q = It = 0.500 × 1800 = 900 C</text><text x="545" y="205" text-anchor="start" font-size="14" font-weight="800" fill="#111827">n(e⁻) = 900 ÷ 96 500 = 9.33 × 10⁻³ mol</text><text x="545" y="245" text-anchor="start" font-size="14" font-weight="800" fill="#111827">n(Cu) = n(e⁻) ÷ 2 = 4.66 × 10⁻³ mol</text><text x="545" y="285" text-anchor="start" font-size="14" font-weight="800" fill="#111827">mass = 4.66 × 10⁻³ × 63.5 = 0.296 g</text><text x="545" y="325" text-anchor="start" font-size="14" font-weight="800" fill="#111827">volume of H₂ would be n ÷ 2 × 24.0 dm³</text></g></g>
<g class="part" data-part="L" data-name="F = Le" data-info="The Faraday constant is the charge on one mole of electrons: L = F ÷ e = 96 500 ÷ 1.60 × 10⁻¹⁹ = 6.02 × 10²³ mol⁻¹." tabindex="0" role="button" aria-label="F = Le"><g><animate attributeName="opacity" keyTimes="0.0000;0.8000;0.8200;1.0000" values="0;0;1;1" dur="15s" begin="fd-play.begin+0s" fill="freeze"/><rect x="520" y="400" width="550" height="120" rx="16" fill="#ede9fe" stroke="#c4b5fd"/><text x="795" y="436" text-anchor="middle" font-size="20" font-weight="800" fill="#6d28d9">F = L × e</text><text x="795" y="470" text-anchor="middle" font-size="14" font-weight="800" fill="#6d28d9">L = 96 500 ÷ 1.60 × 10⁻¹⁹ = 6.02 × 10²³ mol⁻¹</text><text x="795" y="498" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">measure mass gained, I and t to find L experimentally</text></g></g>
</svg>