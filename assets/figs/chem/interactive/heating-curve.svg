<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 660" class="vd-svg" role="img" aria-labelledby="hc-title hc-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="hc-play" data-vd-play-label="Play: heat the ice" data-vd-steps="[[0, &quot;Heating curve of water at a constant rate of heating.&quot;], [1, &quot;Ice warms up.&quot;], [2, &quot;At 0 \u00b0C the ice melts: the temperature stays constant until all of it has melted.&quot;], [4.5, &quot;Liquid water warms from 0 \u00b0C to 100 \u00b0C.&quot;], [7, &quot;At 100 \u00b0C water boils: a longer plateau, because more energy is needed to separate the molecules completely.&quot;], [13, &quot;Then the steam warms up.&quot;]]" data-vd-dur="16">
<title id="hc-title">Heating curve of water</title><desc id="hc-desc">A heating curve for water: ice warms to 0 °C, melts at constant temperature, liquid water warms to 100 °C, boils at constant temperature over a longer plateau, and steam then warms, with particle diagrams for each stage.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1220" height="660" fill="#ffffff"/>
<g aria-hidden="true"><animate id="hc-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<text class="head" x="30" y="34">Heating curve of water</text><text class="note" x="30" y="56">1 mol heated at a constant rate at 1 atm; horizontal lengths in proportion to the energy needed.</text>
<g class="part" data-part="ax" data-name="Axes" data-info="Temperature against time while heated at a constant rate (at 1 atm)." tabindex="0" role="button" aria-label="Axes"><line x1="120" y1="560" x2="1000" y2="560" stroke="#111827" stroke-width="2"/><line x1="120" y1="560" x2="120" y2="120" stroke="#111827" stroke-width="2"/><line x1="114" y1="560.0" x2="1000" y2="560.0" stroke="#e5e7eb"/><text x="110" y="564.0" text-anchor="end" font-size="12" font-weight="700" fill="#475569">-40</text><line x1="114" y1="462.22222222222223" x2="1000" y2="462.22222222222223" stroke="#e5e7eb"/><text x="110" y="466.22222222222223" text-anchor="end" font-size="12" font-weight="700" fill="#475569">0</text><line x1="114" y1="340.0" x2="1000" y2="340.0" stroke="#e5e7eb"/><text x="110" y="344.0" text-anchor="end" font-size="12" font-weight="700" fill="#475569">50</text><line x1="114" y1="217.77777777777777" x2="1000" y2="217.77777777777777" stroke="#e5e7eb"/><text x="110" y="221.77777777777777" text-anchor="end" font-size="12" font-weight="700" fill="#475569">100</text><line x1="114" y1="120.0" x2="1000" y2="120.0" stroke="#e5e7eb"/><text x="110" y="124.0" text-anchor="end" font-size="12" font-weight="700" fill="#475569">140</text><text x="60" y="340.0" font-size="13" font-weight="700" text-anchor="middle" transform="rotate(-90 60 340.0)">temperature / °C</text><text x="560.0" y="594" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">time (energy supplied) →</text></g>
<g class="part" data-part="ice" data-name="Ice warming" data-info="Energy increases the vibration of the water molecules; temperature rises." tabindex="0" role="button" aria-label="Ice warming"><line x1="120" y1="535.6" x2="140" y2="462.2" stroke="#60a5fa" stroke-width="6" stroke-linecap="round" stroke-dasharray="76" stroke-dashoffset="76"><animate attributeName="stroke-dashoffset" keyTimes="0.0000;0.0625;0.1250;1.0000" values="76.01169500660919;76.01169500660919;0;0" dur="16s" begin="hc-play.begin+0s" fill="freeze"/></line><g><animate attributeName="opacity" keyTimes="0.0000;0.0625;0.0813;1.0000" values="0;0;1;1" dur="16s" begin="hc-play.begin+0s" fill="freeze"/><text x="130.0" y="446.22222222222223" text-anchor="middle" font-size="13" font-weight="800" fill="#60a5fa"></text></g></g>
<g class="part" data-part="melt" data-name="Melting at 0 °C" data-info="Temperature stays constant: energy is used to overcome attractions (hydrogen bonds) between molecules, not to raise their kinetic energy. ΔH(fusion) = 6.0 kJ mol⁻¹." tabindex="0" role="button" aria-label="Melting at 0 °C"><line x1="140" y1="462.2" x2="232" y2="462.2" stroke="#a78bfa" stroke-width="6" stroke-linecap="round" stroke-dasharray="92" stroke-dashoffset="92"><animate attributeName="stroke-dashoffset" keyTimes="0.0000;0.1250;0.2812;1.0000" values="92.0;92.0;0;0" dur="16s" begin="hc-play.begin+0s" fill="freeze"/></line><g><animate attributeName="opacity" keyTimes="0.0000;0.1250;0.1437;1.0000" values="0;0;1;1" dur="16s" begin="hc-play.begin+0s" fill="freeze"/><text x="186.0" y="446.22222222222223" text-anchor="middle" font-size="13" font-weight="800" fill="#a78bfa">solid + liquid</text></g></g>
<g class="part" data-part="liq" data-name="Water warming" data-info="Kinetic energy of the molecules increases; temperature rises from 0 to 100 °C." tabindex="0" role="button" aria-label="Water warming"><line x1="232" y1="462.2" x2="347" y2="217.8" stroke="#3b82f6" stroke-width="6" stroke-linecap="round" stroke-dasharray="270" stroke-dashoffset="270"><animate attributeName="stroke-dashoffset" keyTimes="0.0000;0.2812;0.4375;1.0000" values="270.1445657786828;270.1445657786828;0;0" dur="16s" begin="hc-play.begin+0s" fill="freeze"/></line><g><animate attributeName="opacity" keyTimes="0.0000;0.2812;0.3000;1.0000" values="0;0;1;1" dur="16s" begin="hc-play.begin+0s" fill="freeze"/><text x="289.5" y="201.77777777777777" text-anchor="middle" font-size="13" font-weight="800" fill="#3b82f6">liquid</text></g></g>
<g class="part" data-part="boil" data-name="Boiling at 100 °C" data-info="Temperature constant again; much more energy needed, because the molecules separate completely. ΔH(vap) = 40.7 kJ mol⁻¹: a longer plateau." tabindex="0" role="button" aria-label="Boiling at 100 °C"><line x1="347" y1="217.8" x2="970" y2="217.8" stroke="#f97316" stroke-width="6" stroke-linecap="round" stroke-dasharray="623" stroke-dashoffset="623"><animate attributeName="stroke-dashoffset" keyTimes="0.0000;0.4375;0.8125;1.0000" values="623.0;623.0;0;0" dur="16s" begin="hc-play.begin+0s" fill="freeze"/></line><g><animate attributeName="opacity" keyTimes="0.0000;0.4375;0.4562;1.0000" values="0;0;1;1" dur="16s" begin="hc-play.begin+0s" fill="freeze"/><text x="658.5" y="201.77777777777777" text-anchor="middle" font-size="13" font-weight="800" fill="#f97316">liquid + gas</text></g></g>
<g class="part" data-part="gas" data-name="Steam warming" data-info="Temperature of the gas rises." tabindex="0" role="button" aria-label="Steam warming"><line x1="970" y1="217.8" x2="990" y2="156.7" stroke="#dc2626" stroke-width="6" stroke-linecap="round" stroke-dasharray="64" stroke-dashoffset="64"><animate attributeName="stroke-dashoffset" keyTimes="0.0000;0.8125;0.8750;1.0000" values="64.30060576102348;64.30060576102348;0;0" dur="16s" begin="hc-play.begin+0s" fill="freeze"/></line><g><animate attributeName="opacity" keyTimes="0.0000;0.8125;0.8313;1.0000" values="0;0;1;1" dur="16s" begin="hc-play.begin+0s" fill="freeze"/><text x="980.0" y="140.66666666666669" text-anchor="middle" font-size="13" font-weight="800" fill="#dc2626">gas</text></g></g>
<g><animate attributeName="opacity" keyTimes="0.0000;0.1562;0.1750;1.0000" values="0;0;1;1" dur="16s" begin="hc-play.begin+0s" fill="freeze"/><text x="186" y="488.22222222222223" text-anchor="middle" font-size="12" font-weight="800" fill="#6d28d9">melting point 0 °C</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.5625;0.5813;1.0000" values="0;0;1;1" dur="16s" begin="hc-play.begin+0s" fill="freeze"/><text x="690" y="243.77777777777777" text-anchor="middle" font-size="12" font-weight="800" fill="#c2410c">boiling point 100 °C</text></g>
<g><animate attributeName="opacity" keyTimes="0.0000;0.0625;0.0813;1.0000" values="0;0;1;1" dur="16s" begin="hc-play.begin+0s" fill="freeze"/><rect x="1060" y="120" width="90" height="90" rx="8" fill="#fff" stroke="#94a3b8"/><circle cx="1135" cy="195" r="8" fill="#dc2626"/><circle cx="1076" cy="138" r="8" fill="#dc2626"/><circle cx="1127" cy="181" r="8" fill="#dc2626"/><circle cx="1116" cy="152" r="8" fill="#dc2626"/><text x="1105" y="228" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">gas</text><rect x="1060" y="260" width="90" height="90" rx="8" fill="#fff" stroke="#94a3b8"/><circle cx="1112" cy="320" r="8" fill="#3b82f6"/><circle cx="1110" cy="298" r="8" fill="#3b82f6"/><circle cx="1100" cy="310" r="8" fill="#3b82f6"/><circle cx="1120" cy="340" r="8" fill="#3b82f6"/><circle cx="1135" cy="317" r="8" fill="#3b82f6"/><circle cx="1101" cy="303" r="8" fill="#3b82f6"/><circle cx="1074" cy="291" r="8" fill="#3b82f6"/><circle cx="1103" cy="306" r="8" fill="#3b82f6"/><circle cx="1097" cy="335" r="8" fill="#3b82f6"/><circle cx="1107" cy="318" r="8" fill="#3b82f6"/><circle cx="1088" cy="291" r="8" fill="#3b82f6"/><circle cx="1093" cy="297" r="8" fill="#3b82f6"/><text x="1105" y="368" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">liquid</text><rect x="1060" y="400" width="90" height="90" rx="8" fill="#fff" stroke="#94a3b8"/><circle cx="1075" cy="415" r="8" fill="#60a5fa"/><circle cx="1075" cy="435" r="8" fill="#60a5fa"/><circle cx="1075" cy="455" r="8" fill="#60a5fa"/><circle cx="1075" cy="475" r="8" fill="#60a5fa"/><circle cx="1095" cy="415" r="8" fill="#60a5fa"/><circle cx="1095" cy="435" r="8" fill="#60a5fa"/><circle cx="1095" cy="455" r="8" fill="#60a5fa"/><circle cx="1095" cy="475" r="8" fill="#60a5fa"/><circle cx="1115" cy="415" r="8" fill="#60a5fa"/><circle cx="1115" cy="435" r="8" fill="#60a5fa"/><circle cx="1115" cy="455" r="8" fill="#60a5fa"/><circle cx="1115" cy="475" r="8" fill="#60a5fa"/><circle cx="1135" cy="415" r="8" fill="#60a5fa"/><circle cx="1135" cy="435" r="8" fill="#60a5fa"/><circle cx="1135" cy="455" r="8" fill="#60a5fa"/><circle cx="1135" cy="475" r="8" fill="#60a5fa"/><text x="1105" y="508" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">solid</text></g>
<g><animate attributeName="opacity" keyTimes="0.0000;0.1875;0.2062;1.0000" values="0;0;1;1" dur="16s" begin="hc-play.begin+0s" fill="freeze"/><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.1875;0.2062;1.0000" values="0;0;1;1" dur="16s" begin="hc-play.begin+0s" fill="freeze"/><rect x="240.0" y="608" width="640" height="24" rx="12" fill="#fef9c3" stroke="#1f2937" stroke-width="1"/><text x="560" y="625" text-anchor="middle" font-size="12" font-weight="700">On a plateau, energy breaks intermolecular forces: temperature (average kinetic energy) is constant</text></g></g>
</svg>