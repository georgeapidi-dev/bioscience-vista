<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 580" class="vd-svg" role="img" aria-labelledby="rmap-title rmap-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="rmap-play" data-vd-play-label="Play: build the map" data-vd-steps="[[0, &quot;The AS organic reaction map.&quot;], [1, &quot;Families linked by reagents and conditions.&quot;], [11, &quot;Plan routes by chaining arrows: halogenoalkane \u2192 nitrile \u2192 carboxylic acid adds a carbon.&quot;]]" data-vd-dur="16">
<title id="rmap-title">AS organic reaction map</title><desc id="rmap-desc">A network of organic families, alkanes, alkenes, halogenoalkanes, alcohols, nitriles, amines, aldehydes, ketones, carboxylic acids and esters, joined by arrows labelled with reagents, with a highlighted two-step route from halogenoalkane to carboxylic acid.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
