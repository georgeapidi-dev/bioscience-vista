<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 620" class="vd-svg" role="img" aria-labelledby="bf-title bf-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="bf-play" data-vd-play-label="Play: break the bonds" data-vd-steps="[[0, &quot;A covalent bond can break in two ways.&quot;], [1, &quot;Homolytic fission: each atom takes one electron.&quot;], [4, &quot;Two radicals form, each with an unpaired electron (shown by a dot).&quot;], [7, &quot;Heterolytic fission: one atom takes both electrons.&quot;], [10, &quot;A cation and an anion form.&quot;]]" data-vd-dur="14">
<title id="bf-title">Homolytic and heterolytic fission</title><desc id="bf-desc">Homolytic fission of chlorine in UV light into two chlorine radicals shown with fish-hook arrows, and heterolytic fission of a carbon–bromine bond into a carbocation and a bromide ion shown with a curly arrow.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1220" height="620" fill="#ffffff"/>
<g aria-hidden="true"><animate id="bf-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<text class="head" x="30" y="34">Bond fission: two ways to break a covalent bond</text><text class="note" x="30" y="56">Dots are electrons.</text>
<rect x="30" y="90" width="570" height="430" rx="16" fill="#f0fdf4" stroke="#86efac"/><rect x="620" y="90" width="570" height="430" rx="16" fill="#eff6ff" stroke="#93c5fd"/>
<g class="part" data-part="homo" data-name="Homolytic fission" data-info="The covalent bond breaks evenly: each atom keeps one electron of the shared pair, forming two radicals (species with an unpaired electron). Needs energy, e.g. UV light for Cl₂." tabindex="0" role="button" aria-label="Homolytic fission"><text x="315" y="124" text-anchor="middle" font-size="17" font-weight="800" fill="#166534">Homolytic fission</text><text x="315" y="146" text-anchor="middle" font-size="12" font-weight="700" fill="#475569">e.g. Cl₂ in UV light</text><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.2857;0.3571;1.0000" values="0 0;0 0;-50 0;-50 0" dur="14s" begin="bf-play.begin+0s" fill="freeze"/><circle cx="255.0" cy="230.0" r="30" fill="#22c55e" stroke="#111827" stroke-width="1.5"/><text x="255" y="234" text-anchor="middle" font-size="11" font-weight="800" fill="#fff">Cl</text><circle cx="301" cy="230" r="5" fill="#111827"/></g><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.2857;0.3571;1.0000" values="0 0;0 0;50 0;50 0" dur="14s" begin="bf-play.begin+0s" fill="freeze"/><circle cx="375.0" cy="230.0" r="30" fill="#22c55e" stroke="#111827" stroke-width="1.5"/><text x="375" y="234" text-anchor="middle" font-size="11" font-weight="800" fill="#fff">Cl</text><circle cx="329" cy="230" r="5" fill="#111827"/></g><g><animate attributeName="opacity" keyTimes="0.0000;0.0000;0.0214;1.0000" values="0;0;1;1" dur="14s" begin="bf-play.begin+0s" fill="freeze"/><line x1="285" y1="210" x2="345" y2="210" stroke="#94a3b8" stroke-width="0"/></g><g><animate attributeName="opacity" keyTimes="0.0000;0.3214;0.3429;1.0000" values="0;0;1;1" dur="14s" begin="bf-play.begin+0s" fill="freeze"/><text x="315" y="350" text-anchor="middle" font-size="20" font-weight="800" fill="#111827">Cl–Cl → Cl• + Cl•</text><text x="315" y="380" text-anchor="middle" font-size="14" font-weight="800" fill="#166534">two radicals</text></g></g>
<g class="part" data-part="fish" data-name="Fish-hook arrows" data-info="A half-headed curly arrow shows the movement of ONE electron." tabindex="0" role="button" aria-label="Fish-hook arrows"><g><animate attributeName="opacity" keyTimes="0.0000;0.0714;0.0929;0.3000;0.3214;1.0000" values="0;0;1;1;0;0" dur="14s" begin="bf-play.begin+0s" fill="freeze"/><path d="M 311 218 C 305 170 265 170 255 194" fill="none" stroke="#15803d" stroke-width="3"/><path d="M 255 194 l 10 -2 l -4 -8" fill="none" stroke="#15803d" stroke-width="3"/><path d="M 319 218 C 325 170 365 170 375 194" fill="none" stroke="#15803d" stroke-width="3"/><path d="M 375 194 l -10 -2 l 4 -8" fill="none" stroke="#15803d" stroke-width="3"/><text x="315" y="150" text-anchor="middle" font-size="12" font-weight="800" fill="#15803d">fish-hook arrows: one electron each</text></g></g>
<g class="part" data-part="rad" data-name="Radicals" data-info="Very reactive because of the unpaired electron, e.g. in the substitution of alkanes and in ozone depletion." tabindex="0" role="button" aria-label="Radicals"><g><animate attributeName="opacity" keyTimes="0.0000;0.3571;0.3786;1.0000" values="0;0;1;1" dur="14s" begin="bf-play.begin+0s" fill="freeze"/><text x="315" y="430" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">radicals: unpaired electron → very reactive</text><text x="315" y="452" text-anchor="middle" font-size="12" font-weight="600" fill="#475569">(alkane substitution, ozone depletion)</text></g></g>
<g class="part" data-part="hetero" data-name="Heterolytic fission" data-info="The bond breaks unevenly: the more electronegative atom takes both electrons, forming an anion; the other becomes a cation." tabindex="0" role="button" aria-label="Heterolytic fission"><text x="905" y="124" text-anchor="middle" font-size="17" font-weight="800" fill="#1e3a8a">Heterolytic fission</text><text x="905" y="146" text-anchor="middle" font-size="12" font-weight="700" fill="#475569">e.g. a C–Br bond</text><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.7143;0.7857;1.0000" values="0 0;0 0;-50 0;-50 0" dur="14s" begin="bf-play.begin+0s" fill="freeze"/><circle cx="845.0" cy="230.0" r="30" fill="#374151" stroke="#111827" stroke-width="1.5"/><text x="845" y="234" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">C</text><g><animate attributeName="opacity" keyTimes="0.0000;0.7143;0.7500;1.0000" values="0;0;1;1" dur="14s" begin="bf-play.begin+0s" fill="freeze"/><text x="871" y="208" text-anchor="middle" font-size="22" font-weight="800" fill="#dc2626">+</text></g></g><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.7143;0.7857;1.0000" values="0 0;0 0;50 0;50 0" dur="14s" begin="bf-play.begin+0s" fill="freeze"/><circle cx="965.0" cy="230.0" r="30" fill="#b45309" stroke="#111827" stroke-width="1.5"/><text x="965" y="234" text-anchor="middle" font-size="11" font-weight="800" fill="#fff">Br</text><g><animate attributeName="opacity" keyTimes="0.0000;0.7143;0.7500;1.0000" values="0;0;1;1" dur="14s" begin="bf-play.begin+0s" fill="freeze"/><text x="997" y="208" text-anchor="middle" font-size="24" font-weight="800" fill="#2563eb">−</text></g></g><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.5714;0.7143;1.0000" values="0 0;0 0;58 14;58 14" dur="14s" begin="bf-play.begin+0s" fill="freeze"/><circle cx="899" cy="224" r="5" fill="#111827"/><circle cx="911" cy="236" r="5" fill="#111827"/></g><g><animate attributeName="opacity" keyTimes="0.0000;0.7500;0.7714;1.0000" values="0;0;1;1" dur="14s" begin="bf-play.begin+0s" fill="freeze"/><text x="905" y="350" text-anchor="middle" font-size="20" font-weight="800" fill="#111827">C–Br → C⁺ + Br⁻</text><text x="905" y="380" text-anchor="middle" font-size="14" font-weight="800" fill="#1d4ed8">a cation and an anion</text><text x="905" y="430" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">Br is more electronegative, so it takes both electrons</text></g></g>
<g class="part" data-part="curly" data-name="Curly arrow" data-info="A full-headed curly arrow shows the movement of an electron PAIR, from the bond to the atom that takes it." tabindex="0" role="button" aria-label="Curly arrow"><g><animate attributeName="opacity" keyTimes="0.0000;0.5000;0.5214;0.7143;0.7357;1.0000" values="0;0;1;1;0;0" dur="14s" begin="bf-play.begin+0s" fill="freeze"/><path d="M 905 216 C 915 160 955 160 965 192" fill="none" stroke="#1d4ed8" stroke-width="3"/><path d="M 965 194 l -9 -10 l 13 0 z" fill="#1d4ed8"/><text x="905" y="148" text-anchor="middle" font-size="12" font-weight="800" fill="#1d4ed8">curly arrow: an electron pair</text></g></g>
<g><animate attributeName="opacity" keyTimes="0.0000;0.7857;0.8071;1.0000" values="0;0;1;1" dur="14s" begin="bf-play.begin+0s" fill="freeze"/><rect x="30" y="540" width="1160" height="60" rx="12" fill="#fef9c3" stroke="#eab308"/><text x="610" y="576" text-anchor="middle" font-size="14" font-weight="800" fill="#713f12">Fish-hook (half) arrow = one electron moves.   Full curly arrow = a pair of electrons moves.</text></g>
</svg>