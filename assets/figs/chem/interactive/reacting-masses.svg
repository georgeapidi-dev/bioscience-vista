<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" class="vd-svg" role="img" aria-labelledby="rm-title rm-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="rm-play" data-vd-play-label="Play: calculate" data-vd-steps="[[0, &quot;Reacting masses: the three-step method.&quot;], [1, &quot;Step 1: mass to moles.&quot;], [4, &quot;Step 2: the mole ratio from the equation.&quot;], [7, &quot;Step 3: moles to mass, or to gas volume (24.0 dm\u00b3 mol\u207b\u00b9 at r.t.p.).&quot;], [11, &quot;Solutions: n = c \u00d7 V.&quot;]]" data-vd-dur="15">
<title id="rm-title">Reacting masses, gas volumes and solutions</title><desc id="rm-desc">A three-step method: 25.0 grams of calcium carbonate is 0.250 moles, which gives 0.250 moles of calcium oxide, 14.0 grams, and 0.250 moles of carbon dioxide, 6.00 cubic decimetres at room temperature and pressure; for solutions, moles equal concentration times volume.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="560" fill="#ffffff"/>
<g aria-hidden="true"><animate id="rm-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<defs><marker id="rm-475569" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="6.3" refY="7.0" orient="auto"><path d="M0,0 L14,7.0 L0,14 z" fill="#475569"/></marker></defs>
<text class="head" x="30" y="34">Reacting masses, gas volumes and solutions</text><text class="note" x="30" y="56">CaCO₃(s) → CaO(s) + CO₂(g)</text>
<g class="part" data-part="m" data-name="Three-step method" data-info="1 mass → moles (n = m ÷ M); 2 use the mole ratio from the balanced equation; 3 moles → mass (m = n × M)." tabindex="0" role="button" aria-label="Three-step method"><g><animate attributeName="opacity" keyTimes="0.0000;0.0667;0.0867;1.0000" values="0;0;1;1" dur="15s" begin="rm-play.begin+0s" fill="freeze"/><rect x="50.0" y="120.0" width="220" height="80" rx="12" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/><text x="160" y="158" text-anchor="middle" font-size="15" font-weight="800" fill="#111827">25.0 g CaCO₃</text><text x="160" y="176" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">M = 100 g mol⁻¹</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.1333;0.1533;1.0000" values="0;0;1;1" dur="15s" begin="rm-play.begin+0s" fill="freeze"/><path d="M 272 160 L 380 160" stroke="#475569" stroke-width="3" marker-end="url(#rm-475569)"/><text x="326" y="145" text-anchor="middle" font-size="12" font-weight="800" fill="#475569">÷ M</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.1667;0.1867;1.0000" values="0;0;1;1" dur="15s" begin="rm-play.begin+0s" fill="freeze"/><rect x="390.0" y="120.0" width="220" height="80" rx="12" fill="#f8fafc" stroke="#111827" stroke-width="2"/><text x="500" y="158" text-anchor="middle" font-size="15" font-weight="800" fill="#111827">0.250 mol CaCO₃</text><text x="500" y="176" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">step 1</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.2667;0.2867;1.0000" values="0;0;1;1" dur="15s" begin="rm-play.begin+0s" fill="freeze"/><path d="M 612 160 L 720 160" stroke="#475569" stroke-width="3" marker-end="url(#rm-475569)"/><text x="666" y="145" text-anchor="middle" font-size="12" font-weight="800" fill="#475569">1 : 1</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.3000;0.3200;1.0000" values="0;0;1;1" dur="15s" begin="rm-play.begin+0s" fill="freeze"/><rect x="730.0" y="120.0" width="220" height="80" rx="12" fill="#f8fafc" stroke="#111827" stroke-width="2"/><text x="840" y="158" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">0.250 mol CaO + 0.250 mol CO₂</text><text x="840" y="176" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">step 2</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.4667;0.4867;1.0000" values="0;0;1;1" dur="15s" begin="rm-play.begin+0s" fill="freeze"/><path d="M 840 202 L 700 300" stroke="#475569" stroke-width="3" marker-end="url(#rm-475569)"/><path d="M 880 202 L 940 300" stroke="#475569" stroke-width="3" marker-end="url(#rm-475569)"/><rect x="510.0" y="305.0" width="260" height="70" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="640" y="338" text-anchor="middle" font-size="15" font-weight="800" fill="#111827">× 56 = 14.0 g CaO</text><text x="640" y="356" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">step 3: mass</text><rect x="830.0" y="305.0" width="240" height="70" rx="12" fill="#fef3c7" stroke="#b45309" stroke-width="2"/><text x="950" y="338" text-anchor="middle" font-size="14" font-weight="800" fill="#111827">× 24.0 = 6.00 dm³ CO₂</text><text x="950" y="356" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">gas at r.t.p.</text></g></g>
<g class="part" data-part="ex" data-name="Example" data-info="CaCO₃ → CaO + CO₂. 25.0 g CaCO₃ (M 100) = 0.250 mol → 0.250 mol CaO (M 56) = 14.0 g; 0.250 mol CO₂ = 0.250 × 24.0 = 6.00 dm³ at r.t.p." tabindex="0" role="button" aria-label="Example"></g>
<g class="part" data-part="sol" data-name="Solutions" data-info="n = c × V (V in dm³). In a titration, find moles of the known solution, use the ratio, then c = n ÷ V for the unknown." tabindex="0" role="button" aria-label="Solutions"><g><animate attributeName="opacity" keyTimes="0.0000;0.7333;0.7533;1.0000" values="0;0;1;1" dur="15s" begin="rm-play.begin+0s" fill="freeze"/><rect x="40" y="290" width="460" height="230" rx="16" fill="#f0f9ff" stroke="#7dd3fc"/><text x="270" y="318" text-anchor="middle" font-size="15" font-weight="800" fill="#0369a1">solutions and titrations</text><text x="270" y="360" text-anchor="middle" font-size="18" font-weight="800" fill="#111827">n = c × V   (V in dm³)</text><text x="270" y="400" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">25.0 cm³ of 0.100 mol dm⁻³ NaOH</text><text x="270" y="422" text-anchor="middle" font-size="13" font-weight="800" fill="#0369a1">= 0.100 × 0.0250 = 2.50 × 10⁻³ mol</text><text x="270" y="460" text-anchor="middle" font-size="12" font-weight="700" fill="#475569">ratio → moles of acid → c = n ÷ V</text><text x="270" y="490" text-anchor="middle" font-size="12" font-weight="700" fill="#475569">cm³ ÷ 1000 = dm³</text></g></g>
</svg>