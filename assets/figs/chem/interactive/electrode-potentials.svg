<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 600" class="vd-svg" role="img" aria-labelledby="es3-title es3-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="es3-play" data-vd-play-label="Play: predict reactions" data-vd-steps="[[0, &quot;The electrochemical series.&quot;], [1, &quot;Most positive E\u29b5: strongest oxidising agents.&quot;], [8, &quot;Will chlorine oxidise Fe\u00b2\u207a? E\u29b5cell = +0.59 V: yes.&quot;], [12, &quot;Will iodine? E\u29b5cell negative: no.&quot;]]" data-vd-dur="15">
<title id="es3-title">Standard electrode potentials and feasibility</title><desc id="es3-desc">A table of standard electrode potentials from fluorine plus 2.87 volts to magnesium minus 2.38 volts; chlorine can oxidise iron(II) ions with a cell potential of plus 0.59 volts but iodine cannot.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="600" fill="#ffffff"/>
<g aria-hidden="true"><animate id="es3-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<defs><marker id="es3-15803d" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="5.4" refY="6.0" orient="auto"><path d="M0,0 L12,6.0 L0,12 z" fill="#15803d"/></marker><marker id="es3-b91c1c" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="5.4" refY="6.0" orient="auto"><path d="M0,0 L12,6.0 L0,12 z" fill="#b91c1c"/></marker></defs>
<text class="head" x="30" y="34">Standard electrode potentials: predicting reactions</text><text class="note" x="30" y="56">E⦵ / V at 298 K.</text>
<g class="part" data-part="list" data-name="The electrochemical series" data-info="Half-equations written as reductions. More positive E⦵: the left-hand species is a stronger oxidising agent. More negative: the right-hand species is a stronger reducing agent." tabindex="0" role="button" aria-label="The electrochemical series"><g><animate attributeName="opacity" keyTimes="0.0000;0.0667;0.0867;1.0000" values="0;0;1;1" dur="15s" begin="es3-play.begin+0s" fill="freeze"/><rect x="40" y="90" width="560" height="34" rx="8" fill="#fff" stroke="#e2e8f0"/><text x="60" y="113" text-anchor="start" font-size="13" font-weight="700" fill="#111827">F₂ + 2e⁻ ⇌ 2F⁻</text><text x="590" y="113" text-anchor="end" font-size="14" font-weight="800" fill="#b91c1c">+2.87</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.0833;0.1033;1.0000" values="0;0;1;1" dur="15s" begin="es3-play.begin+0s" fill="freeze"/><rect x="40" y="130" width="560" height="34" rx="8" fill="#fff" stroke="#e2e8f0"/><text x="60" y="153" text-anchor="start" font-size="13" font-weight="700" fill="#111827">MnO₄⁻ + 8H⁺ + 5e⁻ ⇌ Mn²⁺ + 4H₂O</text><text x="590" y="153" text-anchor="end" font-size="14" font-weight="800" fill="#b91c1c">+1.51</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.1000;0.1200;1.0000" values="0;0;1;1" dur="15s" begin="es3-play.begin+0s" fill="freeze"/><rect x="40" y="170" width="560" height="34" rx="8" fill="#fff" stroke="#e2e8f0"/><text x="60" y="193" text-anchor="start" font-size="13" font-weight="700" fill="#111827">Cl₂ + 2e⁻ ⇌ 2Cl⁻</text><text x="590" y="193" text-anchor="end" font-size="14" font-weight="800" fill="#b91c1c">+1.36</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.1167;0.1367;1.0000" values="0;0;1;1" dur="15s" begin="es3-play.begin+0s" fill="freeze"/><rect x="40" y="210" width="560" height="34" rx="8" fill="#fff" stroke="#e2e8f0"/><text x="60" y="233" text-anchor="start" font-size="13" font-weight="700" fill="#111827">Br₂ + 2e⁻ ⇌ 2Br⁻</text><text x="590" y="233" text-anchor="end" font-size="14" font-weight="800" fill="#b91c1c">+1.09</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.1333;0.1533;1.0000" values="0;0;1;1" dur="15s" begin="es3-play.begin+0s" fill="freeze"/><rect x="40" y="250" width="560" height="34" rx="8" fill="#fff" stroke="#e2e8f0"/><text x="60" y="273" text-anchor="start" font-size="13" font-weight="700" fill="#111827">Ag⁺ + e⁻ ⇌ Ag</text><text x="590" y="273" text-anchor="end" font-size="14" font-weight="800" fill="#b91c1c">+0.80</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.1500;0.1700;1.0000" values="0;0;1;1" dur="15s" begin="es3-play.begin+0s" fill="freeze"/><rect x="40" y="290" width="560" height="34" rx="8" fill="#fff" stroke="#e2e8f0"/><text x="60" y="313" text-anchor="start" font-size="13" font-weight="700" fill="#111827">Fe³⁺ + e⁻ ⇌ Fe²⁺</text><text x="590" y="313" text-anchor="end" font-size="14" font-weight="800" fill="#b91c1c">+0.77</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.1667;0.1867;1.0000" values="0;0;1;1" dur="15s" begin="es3-play.begin+0s" fill="freeze"/><rect x="40" y="330" width="560" height="34" rx="8" fill="#fff" stroke="#e2e8f0"/><text x="60" y="353" text-anchor="start" font-size="13" font-weight="700" fill="#111827">I₂ + 2e⁻ ⇌ 2I⁻</text><text x="590" y="353" text-anchor="end" font-size="14" font-weight="800" fill="#b91c1c">+0.54</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.1833;0.2033;1.0000" values="0;0;1;1" dur="15s" begin="es3-play.begin+0s" fill="freeze"/><rect x="40" y="370" width="560" height="34" rx="8" fill="#fff" stroke="#e2e8f0"/><text x="60" y="393" text-anchor="start" font-size="13" font-weight="700" fill="#111827">Cu²⁺ + 2e⁻ ⇌ Cu</text><text x="590" y="393" text-anchor="end" font-size="14" font-weight="800" fill="#b91c1c">+0.34</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.2000;0.2200;1.0000" values="0;0;1;1" dur="15s" begin="es3-play.begin+0s" fill="freeze"/><rect x="40" y="410" width="560" height="34" rx="8" fill="#fff" stroke="#e2e8f0"/><text x="60" y="433" text-anchor="start" font-size="13" font-weight="700" fill="#111827">2H⁺ + 2e⁻ ⇌ H₂</text><text x="590" y="433" text-anchor="end" font-size="14" font-weight="800" fill="#475569">+0.00</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.2167;0.2367;1.0000" values="0;0;1;1" dur="15s" begin="es3-play.begin+0s" fill="freeze"/><rect x="40" y="450" width="560" height="34" rx="8" fill="#fff" stroke="#e2e8f0"/><text x="60" y="473" text-anchor="start" font-size="13" font-weight="700" fill="#111827">Fe²⁺ + 2e⁻ ⇌ Fe</text><text x="590" y="473" text-anchor="end" font-size="14" font-weight="800" fill="#1d4ed8">-0.44</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.2333;0.2533;1.0000" values="0;0;1;1" dur="15s" begin="es3-play.begin+0s" fill="freeze"/><rect x="40" y="490" width="560" height="34" rx="8" fill="#fff" stroke="#e2e8f0"/><text x="60" y="513" text-anchor="start" font-size="13" font-weight="700" fill="#111827">Zn²⁺ + 2e⁻ ⇌ Zn</text><text x="590" y="513" text-anchor="end" font-size="14" font-weight="800" fill="#1d4ed8">-0.76</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.2500;0.2700;1.0000" values="0;0;1;1" dur="15s" begin="es3-play.begin+0s" fill="freeze"/><rect x="40" y="530" width="560" height="34" rx="8" fill="#fff" stroke="#e2e8f0"/><text x="60" y="553" text-anchor="start" font-size="13" font-weight="700" fill="#111827">Mg²⁺ + 2e⁻ ⇌ Mg</text><text x="590" y="553" text-anchor="end" font-size="14" font-weight="800" fill="#1d4ed8">-2.38</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.2667;0.2867;1.0000" values="0;0;1;1" dur="15s" begin="es3-play.begin+0s" fill="freeze"/><text x="625" y="104" text-anchor="start" font-size="11" font-weight="800" fill="#b91c1c">↑ stronger oxidising agents (left)</text><text x="625" y="540" text-anchor="start" font-size="11" font-weight="800" fill="#1d4ed8">↓ stronger reducing agents (right)</text></g></g>
<g class="part" data-part="feas" data-name="Feasibility" data-info="E⦵cell = E⦵(reduced half) − E⦵(oxidised half). If positive, the reaction is feasible. Cl₂ + 2Fe²⁺: 1.36 − 0.77 = +0.59 V → feasible. I₂ + 2Fe²⁺: 0.54 − 0.77 &lt; 0 → not." tabindex="0" role="button" aria-label="Feasibility"><g><animate attributeName="opacity" keyTimes="0.0000;0.5333;0.5533;1.0000" values="0;0;1;1" dur="15s" begin="es3-play.begin+0s" fill="freeze"/><rect x="640" y="160" width="430" height="180" rx="16" fill="#f0fdf4" stroke="#86efac"/><text x="855" y="190" text-anchor="middle" font-size="14" font-weight="800" fill="#111827">Cl₂ + 2Fe²⁺ → 2Cl⁻ + 2Fe³⁺ ?</text><text x="855" y="230" text-anchor="middle" font-size="16" font-weight="800" fill="#15803d">E⦵cell = 1.36 − 0.77 = +0.59 V</text><text x="855" y="264" text-anchor="middle" font-size="14" font-weight="800" fill="#15803d">positive → feasible ✓</text><text x="855" y="300" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">(reduced: Cl₂; oxidised: Fe²⁺)</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.8000;0.8200;1.0000" values="0;0;1;1" dur="15s" begin="es3-play.begin+0s" fill="freeze"/><rect x="640" y="360" width="430" height="150" rx="16" fill="#fef2f2" stroke="#fecaca"/><text x="855" y="390" text-anchor="middle" font-size="14" font-weight="800" fill="#111827">I₂ + 2Fe²⁺ → 2I⁻ + 2Fe³⁺ ?</text><text x="855" y="430" text-anchor="middle" font-size="16" font-weight="800" fill="#b91c1c">E⦵cell = 0.54 − 0.77 = −0.23 V</text><text x="855" y="464" text-anchor="middle" font-size="14" font-weight="800" fill="#b91c1c">negative → not feasible ✗</text></g></g>
<g class="part" data-part="rule" data-name="Anticlockwise rule" data-info="With the more positive half-cell below, reactions go anticlockwise: the species at bottom left reacts with the species at top right." tabindex="0" role="button" aria-label="Anticlockwise rule"><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.8667;0.8867;1.0000" values="0;0;1;1" dur="15s" begin="es3-play.begin+0s" fill="freeze"/><rect x="645.0" y="573" width="420" height="24" rx="12" fill="#fef3c7" stroke="#1f2937" stroke-width="1"/><text x="855" y="590" text-anchor="middle" font-size="12" font-weight="700">feasible ≠ fast: high Ea or non-standard conditions can change the outcome</text></g></g>
</svg>