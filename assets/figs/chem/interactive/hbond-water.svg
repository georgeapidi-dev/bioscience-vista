<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" class="vd-svg" role="img" aria-labelledby="hw-title hw-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="hw-play" data-vd-play-label="Play: liquid water" data-vd-steps="[[0, &quot;Water molecules: each O\u2013H bond is polar, with \u03b4\u2212 on oxygen and \u03b4+ on hydrogen.&quot;], [2, &quot;A hydrogen bond (dotted line) is between a \u03b4+ hydrogen of one molecule and a lone pair on the oxygen of another.&quot;], [5, &quot;In liquid water the molecules move about, so hydrogen bonds keep breaking and re-forming.&quot;], [8, &quot;Hydrogen bonds explain water\u2019s cohesion, surface tension, high specific heat and high boiling point.&quot;]]" data-vd-dur="10">
<title id="hw-title">Hydrogen bonding in water</title><desc id="hw-desc">Several water molecules with partial charges; dotted hydrogen bonds join a δ+ hydrogen of one molecule to the δ− oxygen of another.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1200" height="600" fill="#ffffff"/>
<g aria-hidden="true"><animate id="hw-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<text class="head" x="30" y="34">Hydrogen bonding between water molecules</text><text class="note" x="30" y="56">Solid lines: covalent bonds. Dotted lines: hydrogen bonds. Not to scale.</text>
<g class="part" data-part="hb" data-name="Hydrogen bond (between molecules)" data-info="Attraction between a δ+ hydrogen and a lone pair on a δ− oxygen of another molecule. Much weaker than a covalent bond but stronger than other intermolecular forces: gives water its high boiling point, cohesion and surface tension." tabindex="0" role="button" aria-label="Hydrogen bond (between molecules)"><line x1="664.8" y1="350.2" x2="724.9" y2="396.7" stroke="#7c3aed" stroke-width="3.5" stroke-dasharray="3 6" stroke-linecap="round"><animate attributeName="opacity" keyTimes="0.0000;0.5000;0.5400;0.6400;0.6800;1.0000" values="1;1;0.1;0.1;1;1" dur="10s" begin="hw-play.begin+0s" fill="freeze"/></line><line x1="535.2" y1="350.2" x2="475.1" y2="396.7" stroke="#7c3aed" stroke-width="3.5" stroke-dasharray="3 6" stroke-linecap="round"><animate attributeName="opacity" keyTimes="0.0000;0.5400;0.5800;0.6700;0.7100;1.0000" values="1;1;0.1;0.1;1;1" dur="10s" begin="hw-play.begin+0s" fill="freeze"/></line><line x1="538.1" y1="211.5" x2="581.6" y2="273.8" stroke="#7c3aed" stroke-width="3.5" stroke-dasharray="3 6" stroke-linecap="round"><animate attributeName="opacity" keyTimes="0.0000;0.5800;0.6200;0.7000;0.7400;1.0000" values="1;1;0.1;0.1;1;1" dur="10s" begin="hw-play.begin+0s" fill="freeze"/></line><line x1="661.9" y1="211.5" x2="618.4" y2="273.8" stroke="#7c3aed" stroke-width="3.5" stroke-dasharray="3 6" stroke-linecap="round"><animate attributeName="opacity" keyTimes="0.0000;0.6200;0.6600;0.7300;0.7700;1.0000" values="1;1;0.1;0.1;1;1" dur="10s" begin="hw-play.begin+0s" fill="freeze"/></line></g>
<g class="part" data-part="mol" data-name="Water molecule, H₂O" data-info="Bent shape (about 104.5°). The O–H covalent bonds are polar because oxygen is much more electronegative than hydrogen." tabindex="0" role="button" aria-label="Water molecule, H₂O"><g><line x1="600" y1="300" x2="649.0" y2="338.0" stroke="#111827" stroke-width="5"/><line x1="600" y1="300" x2="551.0" y2="338.0" stroke="#111827" stroke-width="5"/><circle cx="600" cy="300" r="30" fill="#ef4444" stroke="#7f1d1d" stroke-width="2"/><text x="600" y="306" text-anchor="middle" font-size="18" font-weight="800" fill="#fff">O</text><text x="600.0" y="259.0" text-anchor="middle" font-size="15" font-weight="700" fill="#b91c1c">δ−</text><circle cx="649.0" cy="338.0" r="18" fill="#f8fafc" stroke="#334155" stroke-width="2"/><text x="649.0" y="343.0" text-anchor="middle" font-size="14" font-weight="800">H</text><text x="641.1" y="369.8" text-anchor="middle" font-size="13" font-weight="700" fill="#1d4ed8">δ+</text><circle cx="551.0" cy="338.0" r="18" fill="#f8fafc" stroke="#334155" stroke-width="2"/><text x="551.0" y="343.0" text-anchor="middle" font-size="14" font-weight="800">H</text><text x="527.0" y="328.5" text-anchor="middle" font-size="13" font-weight="700" fill="#1d4ed8">δ+</text></g><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.0500;0.1500;0.2500;0.3500;0.4500;0.5500;0.6500;0.7500;0.8500;0.9500;1.0000" values="0 0;-2.9 2.8;2.1 -2.0;-0.0 -0.4;1.2 2.3;-3.2 -3.8;2.7 -0.5;2.1 -4.0;-0.4 1.8;-2.2 3.6;3.2 -3.8;0 0" dur="10s" begin="hw-play.begin+0s" fill="freeze"/><line x1="750.2310190113303" y1="416.3212832065454" x2="811.7" y2="424.7" stroke="#111827" stroke-width="5"/><line x1="750.2310190113303" y1="416.3212832065454" x2="726.8" y2="473.7" stroke="#111827" stroke-width="5"/><circle cx="750.2310190113303" cy="416.3212832065454" r="30" fill="#ef4444" stroke="#7f1d1d" stroke-width="2"/><text x="750.2310190113303" y="422.3212832065454" text-anchor="middle" font-size="18" fon