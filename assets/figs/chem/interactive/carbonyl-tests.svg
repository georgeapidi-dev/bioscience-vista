<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 540" class="vd-svg" role="img" aria-labelledby="ct2-title ct2-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="ct2-play" data-vd-play-label="Play: run the tests" data-vd-steps="[[0, &quot;Testing for carbonyl compounds.&quot;], [1, &quot;2,4-DNPH: orange precipitate with any aldehyde or ketone.&quot;], [5, &quot;Tollens&#x27;: silver mirror only with an aldehyde.&quot;], [8, &quot;Fehling&#x27;s: brick-red only with an aldehyde.&quot;], [11, &quot;Iodoform: yellow precipitate with CH\u2083CO\u2013.&quot;]]" data-vd-dur="15">
<title id="ct2-title">Tests for carbonyl compounds</title><desc id="ct2-desc">Four test tubes for ethanal and propanone: 2,4-DNPH gives orange precipitates with both, Tollens&#x27; reagent gives a silver mirror with ethanal only, Fehling&#x27;s solution gives a brick-red precipitate with ethanal only, and alkaline iodine gives yellow tri-iodomethane with both.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="540" fill="#ffffff"/>
<g aria-hidden="true"><animate id="ct2-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<text class="head" x="30" y="34">Tests for aldehydes and ketones</text><text class="note" x="30" y="56">Left tube: ethanal (aldehyde). Right tube: propanone (ketone).</text>
<g class="part" data-part="dnph" data-name="2,4-DNPH" data-info="Brady&#x27;s reagent: an orange precipitate with any C=O (aldehyde or ketone). Melting point of the purified precipitate identifies the compound." tabindex="0" role="button" aria-label="2,4-DNPH"><rect x="15" y="90" width="250" height="420" rx="16" fill="#f8fafc" stroke="#cbd5e1"/><text x="140" y="116" text-anchor="middle" font-size="14" font-weight="800" fill="#111827">2,4-DNPH</text><path d="M 64 150 L 64 360 Q 90 378 116 360 L 116 150" fill="#f8fafc" stroke="#334155" stroke-width="2"/><rect x="66" y="230" width="48" height="132" fill="#fef3c7"><animate attributeName="fill" keyTimes="0.0000;0.1000;0.2000;1.0000" values="#fef3c7;#fef3c7;#f97316;#f97316" dur="15s" begin="ct2-play.begin+0s" fill="freeze"/></rect><text x="90" y="400" text-anchor="middle" font-size="11" font-weight="800" fill="#111827">ethanal</text><path d="M 164 150 L 164 360 Q 190 378 216 360 L 216 150" fill="#f8fafc" stroke="#334155" stroke-width="2"/><rect x="166" y="230" width="48" height="132" fill="#fef3c7"><animate attributeName="fill" keyTimes="0.0000;0.1000;0.2000;1.0000" values="#fef3c7;#fef3c7;#f97316;#f97316" dur="15s" begin="ct2-play.begin+0s" fill="freeze"/></rect><text x="190" y="400" text-anchor="middle" font-size="11" font-weight="800" fill="#111827">propanone</text><g><animate attributeName="opacity" keyTimes="0.0000;0.2000;0.2200;1.0000" values="0;0;1;1" dur="15s" begin="ct2-play.begin+0s" fill="freeze"/><text x="140" y="450" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">both: orange ppt (C=O)</text></g></g>
<g class="part" data-part="tol" data-name="Tollens&#x27; reagent" data-info="Ammoniacal silver nitrate, warm: aldehydes give a silver mirror (Ag⁺ reduced to Ag); ketones no change." tabindex="0" role="button" aria-label="Tollens&#x27; reagent"><rect x="285" y="90" width="250" height="420" rx="16" fill="#f8fafc" stroke="#cbd5e1"/><text x="410" y="116" text-anchor="middle" font-size="14" font-weight="800" fill="#111827">Tollens', warm</text><path d="M 334 150 L 334 360 Q 360 378 386 360 L 386 150" fill="#f8fafc" stroke="#334155" stroke-width="2"/><rect x="336" y="230" width="48" height="132" fill="#f8fafc"><animate attributeName="fill" keyTimes="0.0000;0.3667;0.4667;1.0000" values="#f8fafc;#f8fafc;#94a3b8;#94a3b8" dur="15s" begin="ct2-play.begin+0s" fill="freeze"/></rect><text x="360" y="400" text-anchor="middle" font-size="11" font-weight="800" fill="#111827">ethanal</text><rect x="334" y="170" width="6" height="190" fill="#cbd5e1" opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.3667;0.4667;1.0000" values="0;0;1;1" dur="15s" begin="ct2-play.begin+0s" fill="freeze"/></rect><rect x="380" y="170" width="6" height="190" fill="#cbd5e1" opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.3667;0.4667;1.0000" values="0;0;1;1" dur="15s" begin="ct2-play.begin+0s" fill="freeze"/></rect><path d="M 434 150 L 434 360 Q 460 378 486 360 L 486 150" fill="#f8fafc" stroke="#334155" stroke-width="2"/><rect x="436" y="230" width="48" height="132" fill="#f8fafc"><animate attributeName="fill" keyTimes="0.0000;0.3667;0.4667;1.0000" values="#f8fafc;#f8fafc;#f8fafc;#f8fafc" dur="15s" begin="ct2-play.begin+0s" fill="freeze"/></rect><text x="460" y="400" text-anchor="middle" font-size="11" font-weight="800" fill="#111827">propanone</text><g><animate attributeName="opacity" keyTimes="0.0000;0.4667;0.4867;1.0000" values="0;0;1;1" dur="15s" begin="ct2-play.begin+0s" fill="freeze"/><text x="410" y="450" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">ethanal: silver mirror</text></g></g>
<g class="part" data-part="feh" data-name="Fehling&#x27;s solution" data-info="Blue Cu²⁺, warm: aldehydes give a brick-red precipitate of Cu₂O; ketones stay blue." tabindex="0" role="button" aria-label="Fehling&#x27;s solution"><rect x="555" y="90" width="250" height="420" rx="16" fill="#f8fafc" stroke="#cbd5e1"/><text x="680" y="116" text-anchor="middle" font-size="14" font-weight="800" fill="#111827">Fehling's, warm</text><path d="M 604 150 L 604 360 Q 630 378 656 360 L 656 150" fill="#f8fafc" stroke="#334155" stroke-width="2"/><rect x="606" y="230" width="48" height="132" fill="#60a5fa"><animate attributeName="fill" keyTimes="0.0000;0.5667;0.6667;1.0000" values="#60a5fa;#60a5fa;#b45309;#b45309" dur="15s" begin="ct2-play.begin+0s" fill="freeze"/></rect><text x="630" y="400" text-anchor="middle" font-size="11" font-weight="800" fill="#111827">ethanal</text><path d="M 704 150 L 704 360 Q 730 378 756 360 L 756 150" fill="#f8fafc" stroke="#334155" stroke-width="2"/><rect x="706" y="230" width="48" height="132" fill="#60a5fa"><animate attributeName="fill" keyTimes="0.0000;0.5667;0.6667;1.0000" values="#60a5fa;#60a5fa;#60a5fa;#60a5fa" dur="15s" begin="ct2-play.begin+0s" fill="freeze"/></rect><text x="730" y="400" text-anchor="middle" font-size="11" font-weight="800" fill="#111827">propanone</text><g><animate attributeName="opacity" keyTimes="0.0000;0.6667;0.6867;1.0000" values="0;0;1;1" dur="15s" begin="ct2-play.begin+0s" fill="freeze"/><text x="680" y="450" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">ethanal: brick-red Cu₂O</text></g></g>
<g class="part" data-part="io" data-name="Methyl carbonyl test" data-info="Alkaline I₂, warm: yellow CHI₃ with CH₃CO– compounds (ethanal and methyl ketones)." tabindex="0" role="button" aria-label="Methyl carbonyl test"><rect x="825" y="90" width="250" height="420" rx="16" fill="#f8fafc" stroke="#cbd5e1"/><text x="950" y="116" text-anchor="middle" font-size="14" font-weight="800" fill="#111827">I₂ + NaOH, warm</text><path d="M 874 150 L 874 360 Q 900 378 926 360 L 926 150" fill="#f8fafc" stroke="#334155" stroke-width="2"/><rect x="876" y="230" width="48" height="132" fill="#fde68a"><animate attributeName="fill" keyTimes="0.0000;0.7667;0.8667;1.0000" values="#fde68a;#fde68a;#facc15;#facc15" dur="15s" begin="ct2-play.begin+0s" fill="freeze"/></rect><text x="900" y="400" text-anchor="middle" font-size="11" font-weight="800" fill="#111827">ethanal</text><path d="M 974 150 L 974 360 Q 1000 378 1026 360 L 1026 150" fill="#f8fafc" stroke="#334155" stroke-width="2"/><rect x="976" y="230" width="48" height="132" fill="#fde68a"><animate attributeName="fill" keyTimes="0.0000;0.7667;0.8667;1.0000" values="#fde68a;#fde68a;#facc15;#facc15" dur="15s" begin="ct2-play.begin+0s" fill="freeze"/></rect><text x="1000" y="400" text-anchor="middle" font-size="11" font-weight="800" fill="#111827">propanone</text><g><animate attributeName="opacity" keyTimes="0.0000;0.8667;0.8867;1.0000" values="0;0;1;1" dur="15s" begin="ct2-play.begin+0s" fill="freeze"/><text x="950" y="450" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">both: yellow CHI₃</text></g></g>
</svg>