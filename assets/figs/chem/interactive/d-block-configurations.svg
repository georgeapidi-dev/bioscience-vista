<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" class="vd-svg" role="img" aria-labelledby="db-title db-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="db-play" data-vd-play-label="Play: fill the boxes" data-vd-steps="[[0, &quot;Electron configurations of the 3d elements.&quot;], [1, &quot;Electrons fill 3d after 4s.&quot;], [6, &quot;Chromium and copper: one 4s electron moves to 3d.&quot;], [10, &quot;Ions: 4s electrons are removed first.&quot;]]" data-vd-dur="15">
<title id="db-title">Filling the 3d sub-shell</title><desc id="db-desc">Electrons-in-boxes for 3d and 4s of vanadium, chromium, iron and copper, showing the chromium and copper exceptions, and iron losing its 4s electrons first to form Fe2+ and Fe3+.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="560" fill="#ffffff"/>
