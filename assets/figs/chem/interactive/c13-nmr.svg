<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 580" class="vd-svg" role="img" aria-labelledby="cn3-title cn3-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="cn3-play" data-vd-play-label="Play: count carbons" data-vd-steps="[[0, &quot;\u00b9\u00b3C NMR spectroscopy.&quot;], [1, &quot;Count the carbon environments.&quot;], [5, &quot;Chemical shifts: electronegative atoms move peaks to higher \u03b4.&quot;], [10, &quot;Propan-1-ol versus propan-2-ol: 3 peaks versus 2.&quot;]]" data-vd-dur="15">
<title id="cn3-title">Carbon-13 NMR</title><desc id="cn3-desc">Carbon-13 NMR spectra of propan-1-ol with three peaks and propan-2-ol with two peaks, with a chemical shift scale from 0 to 220 parts per million showing ranges for C-C, C-O, aromatic and C=O carbons.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="580" fill="#ffffff"/>
<g aria-hidden="true"><animate id="cn3-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<text class="head" x="30" y="34">¹³C NMR spectroscopy</text><text class="note" x="30" y="56">δ / ppm relative to TMS (0). Approximate shifts.</text>
<g class="part" data-part="env" data-name="Carbon environments" data-info="Carbons in identical surroundings give one peak. Propan-1-ol CH₃CH₂CH₂OH: 3 environments; propan-2-ol (CH₃)₂CHOH: 2 environments (both CH₃ are equivalent)." tabindex="0" role="button" aria-label="Carbon environments"><line x1="80" y1="220" x2="800" y2="220" stroke="#111827" stroke-width="2"/><text x="80" y="110" text-anchor="start" font-size="14" font-weight="800" fill="#1d4ed8">propan-1-ol CH₃CH₂CH₂OH: 3 environments</text><rect x="589" y="140" width="4" height="80" fill="#1d4ed8"><animate attributeName="height" keyTimes="0.0000;0.0667;0.1000;1.0000" values="0;0;80;80" dur="15s" begin="cn3-play.begin+0s" fill="freeze"/><animate attributeName="y" keyTimes="0.0000;0.0667;0.1000;1.0000" values="220;220;140;140" dur="15s" begin="cn3-play.begin+0s" fill="freeze"/></rect><g><animate attributeName="opacity" keyTimes="0.0000;0.1000;0.1200;1.0000" values="0;0;1;1" dur="15s" begin="cn3-play.begin+0s" fill="freeze"/><text x="590.5454545454545" y="132" text-anchor="middle" font-size="11" font-weight="800" fill="#1d4ed8">CH₂OH 64</text></g><rect x="713" y="150" width="4" height="70" fill="#1d4ed8"><animate attributeName="height" keyTimes="0.0000;0.1000;0.1333;1.0000" values="0;0;70;70" dur="15s" begin="cn3-play.begin+0s" fill="freeze"/><animate attributeName="y" keyTimes="0.0000;0.1000;0.1333;1.0000" values="220;220;150;150" dur="15s" begin="cn3-play.begin+0s" fill="freeze"/></rect><g><animate attributeName="opacity" keyTimes="0.0000;0.1333;0.1533;1.0000" values="0;0;1;1" dur="15s" begin="cn3-play.begin+0s" fill="freeze"/><text x="714.9090909090909" y="142" text-anchor="middle" font-size="11" font-weight="800" fill="#1d4ed8">CH₂ 26</text></g><rect x="765" y="146" width="4" height="74" fill="#1d4ed8"><animate attributeName="height" keyTimes="0.0000;0.1333;0.1667;1.0000" values="0;0;74;74" dur="15s" begin="cn3-play.begin+0s" fill="freeze"/><animate attributeName="y" keyTimes="0.0000;0.1333;0.1667;1.0000" values="220;220;146;146" dur="15s" begin="cn3-play.begin+0s" fill="freeze"/></rect><g><animate attributeName="opacity" keyTimes="0.0000;0.1667;0.1867;1.0000" values="0;0;1;1" dur="15s" begin="cn3-play.begin+0s" fill="freeze"/><text x="767.2727272727273" y="138" text-anchor="middle" font-size="11" font-weight="800" fill="#1d4ed8">CH₃ 10</text></g></g>
<g class="part" data-part="shift" data-name="Chemical shift" data-info="Measured in ppm relative to TMS (δ = 0). Approximate ranges: C–C 5–40; C–O/C–N/C–Cl 30–90; C=C and aromatic 110–160; C=O 160–220. Electronegative neighbours deshield a carbon (higher δ)." tabindex="0" role="button" aria-label="Chemical shift"><text x="800.0" y="540" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">0</text><text x="734.5454545454545" y="540" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">20</text><text x="669.0909090909091" y="540" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">40</text><text x="603.6363636363636" y="540" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">60</text><text x="538.1818181818182" y="540" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">80</text><text x="472.72727272727275" y="540" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">100</text><text x="407.2727272727273" y="540" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">120</text><text x="341.8181818181818" y="540" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">140</text><text x="276.3636363636364" y="540" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">160</text><text x="210.90909090909088" y="540" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">180</text><text x="145.4545454545455" y="540" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">200</text><text x="80.0" y="540" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">220</text><text x="440.0" y="562" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">δ / ppm</text><g><animate attributeName="opacity" keyTimes="0.0000;0.3333;0.3533;1.0000" values="0;0;1;1" dur="15s" begin="cn3-play.begin+0s" fill="freeze"/><rect x="669" y="490" width="115" height="28" rx="6" fill="#94a3b8" opacity=".6"/><text x="726.3636363636364" y="509" text-anchor="middle" font-size="11" font-weight="800" fill="#111827">C–C</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.3733;0.3933;1.0000" values="0;0;1;1" dur="15s" begin="cn3-play.begin+0s" fill="freeze"/><rect x="505" y="490" width="131" height="28" rx="6" fill="#60a5fa" opacity=".6"/><text x="570.9090909090909" y="509" text-anchor="middle" font-size="11" font-weight="800" fill="#111827">C–O</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.4133;0.4333;1.0000" values="0;0;1;1" dur="15s" begin="cn3-play.begin+0s" fill="freeze"/><rect x="276" y="490" width="164" height="28" rx="6" fill="#4ade80" opacity=".6"/><text x="358.1818181818182" y="509" text-anchor="middle" font-size="11" font-weight="800" fill="#111827">C=C, aromatic</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.4533;0.4733;1.0000" values="0;0;1;1" dur="15s" begin="cn3-play.begin+0s" fill="freeze"/><rect x="80" y="490" width="196" height="28" rx="6" fill="#f87171" opacity=".6"/><text x="178.1818181818182" y="509" text-anchor="middle" font-size="11" font-weight="800" fill="#111827">C=O</text></g></g>
<g class="part" data-part="iso" data-name="Telling isomers apart" data-info="Count the peaks and check the shifts: propanal has a peak near 200 (C=O); propanone near 205 with only 2 peaks." tabindex="0" role="button" aria-label="Telling isomers apart"><line x1="80" y1="430" x2="800" y2="430" stroke="#111827" stroke-width="2"/><text x="80" y="320" text-anchor="start" font-size="14" font-weight="800" fill="#b91c1c">propan-2-ol (CH₃)₂CHOH: 2 environments</text><rect x="589" y="360" width="4" height="70" fill="#b91c1c"><animate attributeName="height" keyTimes="0.0000;0.6667;0.7000;1.0000" values="0;0;70;70" dur="15s" begin="cn3-play.begin+0s" fill="freeze"/><animate attributeName="y" keyTimes="0.0000;0.6667;0.7000;1.0000" values="430;430;360;360" dur="15s" begin="cn3-play.begin+0s" fill="freeze"/></rect><g><animate attributeName="opacity" keyTimes="0.0000;0.7000;0.7200;1.0000" values="0;0;1;1" dur="15s" begin="cn3-play.begin+0s" fill="freeze"/><text x="590.5454545454545" y="352" text-anchor="middle" font-size="11" font-weight="800" fill="#b91c1c">CHOH 64</text></g><rect x="716" y="340" width="4" height="90" fill="#b91c1c"><animate attributeName="height" keyTimes="0.0000;0.7000;0.7333;1.0000" values="0;0;90;90" dur="15s" begin="cn3-play.begin+0s" fill="freeze"/><animate attributeName="y" keyTimes="0.0000;0.7000;0.7333;1.0000" values="430;430;340;340" dur="15s" begin="cn3-play.begin+0s" fill="freeze"/></rect><g><animate attributeName="opacity" keyTimes="0.0000;0.7333;0.7533;1.0000" values="0;0;1;1" dur="15s" begin="cn3-play.begin+0s" fill="freeze"/><text x="718.1818181818182" y="332" text-anchor="middle" font-size="11" font-weight="800" fill="#b91c1c">2×CH₃ 25</text></g></g>
<g><animate attributeName="opacity" keyTimes="0.0000;0.2000;0.2200;1.0000" values="0;0;1;1" dur="15s" begin="cn3-play.begin+0s" fill="freeze"/><rect x="830" y="90" width="240" height="360" rx="16" fill="#f8fafc" stroke="#cbd5e1"/><text x="950" y="118" text-anchor="middle" font-size="14" font-weight="800" fill="#111827">method</text><text x="846" y="152" text-anchor="start" font-size="12" font-weight="700" fill="#111827">1 count environments</text><text x="846" y="182" text-anchor="start" font-size="12" font-weight="700" fill="#111827">   (symmetry!)</text><text x="846" y="212" text-anchor="start" font-size="12" font-weight="700" fill="#111827">2 match each peak to a</text><text x="846" y="242" text-anchor="start" font-size="12" font-weight="700" fill="#111827">   range of δ</text><text x="846" y="272" text-anchor="start" font-size="12" font-weight="700" fill="#111827">3 high δ: near O or C=O</text><text x="846" y="302" text-anchor="start" font-size="12" font-weight="700" fill="#111827">4 propose a structure</text><text x="846" y="332" text-anchor="start" font-size="12" font-weight="700" fill="#111827">5 check the number of</text><text x="846" y="362" text-anchor="start" font-size="12" font-weight="700" fill="#111827">   peaks again</text></g>
</svg>