<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 580" class="vd-svg" role="img" aria-labelledby="a2m-title a2m-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="a2m-play" data-vd-play-label="Play: build the map" data-vd-steps="[[0, &quot;The A2 organic reaction map.&quot;], [1, &quot;Each arrow: reagent and conditions.&quot;], [11, &quot;Judge routes: steps, overall yield, safety.&quot;]]" data-vd-dur="15">
<title id="a2m-title">A2 organic reaction map</title><desc id="a2m-desc">A network linking benzene, nitrobenzene, phenylamine, diazonium salts, azo dyes, phenol, carboxylic acids, acyl chlorides, esters, amides, amines and alcohols, with reagents on each arrow.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="580" fill="#ffffff"/>
<g aria-hidden="true"><animate id="a2m-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
