<g class="part" data-part="judge" data-name="Judging a route" data-info="Fewest steps, highest overall yield (multiply step yields), safe reagents, and avoid steps that need separating isomers." tabindex="0" role="button" aria-label="Judging a route"><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.7333;0.7533;1.0000" values="0;0;1;1" dur="15s" begin="a2m-play.begin+0s" fill="freeze"/><rect x="310.0" y="543" width="480" height="24" rx="12" fill="#fef3c7" stroke="#1f2937" stroke-width="1"/><text x="550" y="560" text-anchor="middle" font-size="12" font-weight="700">overall yield = product of step yields: 80% × 70% × 60% = 34%</text></g></g>
