<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 660" class="vd-svg" role="img" aria-labelledby="hh-title hh-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="hh-play" data-vd-play-label="Play: electrolyse" data-vd-steps="[[0, &quot;Extracting aluminium: the Hall\u2013H\u00e9roult process.&quot;], [1, &quot;Aluminium oxide is dissolved in molten cryolite, at about 950 \u00b0C.&quot;], [3, &quot;Al\u00b3\u207a ions move to the cathode and gain electrons: molten aluminium forms.&quot;], [7, &quot;O\u00b2\u207b ions move to the carbon anodes and lose electrons: oxygen forms.&quot;], [10, &quot;The oxygen reacts with the carbon anodes to make CO\u2082: the anodes burn away.&quot;], [13, &quot;Molten aluminium is tapped from the bottom.&quot;]]" data-vd-dur="16">
<title id="hh-title">The Hall–Héroult cell</title><desc id="hh-desc">Electrolysis of aluminium oxide dissolved in molten cryolite: aluminium ions are reduced at the carbon-lined cathode to molten aluminium; oxide ions are oxidised at carbon anodes, which react with the oxygen to form carbon dioxide.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1220" height="660" fill="#ffffff"/>
<g aria-hidden="true"><animate id="hh-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<text class="head" x="30" y="34">Extracting aluminium: the Hall–Héroult cell</text><text class="note" x="30" y="56">Simplified cross-section.</text>
<rect x="120" y="230" width="700" height="350" fill="#1f2937"/>
<g class="part" data-part="cat" data-name="Carbon-lined cell: cathode (−)" data-info="Aluminium ions are reduced: Al³⁺ + 3e⁻ → Al." tabindex="0" role="button" aria-label="Carbon-lined cell: cathode (−)"><rect x="140" y="240" width="660" height="320" fill="#374151"/><text x="470" y="620" text-anchor="middle" font-size="14" font-weight="800" fill="#111827">carbon lining = cathode (−)</text><text x="470" y="640" text-anchor="middle" font-size="14" font-weight="800" fill="#1d4ed8">Al³⁺ + 3e⁻ → Al</text></g>
<g class="part" data-part="cry" data-name="Alumina in molten cryolite" data-info="Aluminium oxide dissolved in molten cryolite at about 950 °C (pure Al₂O₃ melts at about 2050 °C), saving energy." tabindex="0" role="button" aria-label="Alumina in molten cryolite"><rect x="160" y="260" width="620" height="200" fill="#fdba74"/><text x="470" y="440" text-anchor="middle" font-size="14" font-weight="800" fill="#7c2d12">Al₂O₃ dissolved in molten cryolite, ≈950 °C</text></g>
<g class="part" data-part="al" data-name="Molten aluminium" data-info="Denser than the electrolyte; collects at the bottom and is siphoned off." tabindex="0" role="button" aria-label="Molten aluminium"><rect x="160" y="460" width="620" height="80" fill="#cbd5e1"/><text x="470" y="506" text-anchor="middle" font-size="14" font-weight="800" fill="#334155">molten aluminium</text><rect x="160" y="540" width="620" height="0" fill="#e2e8f0"><animate attributeName="height" keyTimes="0.0000;0.1875;0.8125;1.0000" values="0;0;0;0" dur="16s" begin="hh-play.begin+0s" fill="freeze"/></rect></g>
<g class="part" data-part="an" data-name="Carbon anodes (+)" data-info="Oxide ions are oxidised: 2O²⁻ → O₂ + 4e⁻. The oxygen reacts with the hot carbon to form CO₂, so the anodes burn away and must be replaced." tabindex="0" role="button" aria-label="Carbon anodes (+)"><rect x="220" y="180" width="100" height="200" rx="4" fill="#111827" stroke="#475569"><animate attributeName="height" values="200;200;175;175" keyTimes="0;0.625;0.875;1" dur="16s" begin="hh-play.begin" fill="freeze"/></rect><rect x="400" y="180" width="100" height="200" rx="4" fill="#111827" stroke="#475569"><animate attributeName="height" values="200;200;175;175" keyTimes="0;0.625;0.875;1" dur="16s" begin="hh-play.begin" fill="freeze"/></rect><rect x="580" y="180" width="100" height="200" rx="4" fill="#111827" stroke="#475569"><animate attributeName="height" values="200;200;175;175" keyTimes="0;0.625;0.875;1" dur="16s" begin="hh-play.begin" fill="freeze"/></rect><path d="M 270 180 L 270 130 L 670 130 L 670 180" fill="none" stroke="#111827" stroke-width="4"/><path d="M 450 130 L 450 180" stroke="#111827" stroke-width="4"/><text x="470" y="116" text-anchor="middle" font-size="14" font-weight="800" fill="#111827">carbon anodes (+)</text></g>
