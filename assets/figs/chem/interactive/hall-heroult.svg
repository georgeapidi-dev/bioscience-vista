" type="translate" keyTimes="0.0000;0.5125;0.5938;1.0000" values="250 420;250 420;270 386;270 386" dur="16s" begin="hh-play.begin+0s" fill="freeze"/><g><circle r="11" fill="#fecaca" stroke="#b91c1c"/><text x="0" y="4" text-anchor="middle" font-size="8" font-weight="800" fill="#7f1d1d">O²⁻</text></g></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.5375;0.5500;0.6250;0.6375;1.0000" values="0;0;1;1;0;0" dur="16s" begin="hh-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.5375;0.6188;1.0000" values="430 420;430 420;450 386;450 386" dur="16s" begin="hh-play.begin+0s" fill="freeze"/><g><circle r="11" fill="#fecaca" stroke="#b91c1c"/><text x="0" y="4" text-anchor="middle" font-size="8" font-weight="800" fill="#7f1d1d">O²⁻</text></g></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.5625;0.5750;0.6500;0.6625;1.0000" values="0;0;1;1;0;0" dur="16s" begin="hh-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.5625;0.6438;1.0000" values="610 420;610 420;630 386;630 386" dur="16s" begin="hh-play.begin+0s" fill="freeze"/><g><circle r="11" fill="#fecaca" stroke="#b91c1c"/><text x="0" y="4" text-anchor="middle" font-size="8" font-weight="800" fill="#7f1d1d">O²⁻</text></g></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.6250;0.6375;0.7625;0.7750;1.0000" values="0;0;1;1;0;0" dur="16s" begin="hh-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.6250;0.7500;1.0000" values="250 370;250 370;330 200;330 200" dur="16s" begin="hh-play.begin+0s" fill="freeze"/><g><circle r="8" fill="#374151"/><circle cx="-12" r="7" fill="#ef4444"/><circle cx="12" r="7" fill="#ef4444"/></g></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.6500;0.6625;0.7875;0.8000;1.0000" values="0;0;1;1;0;0" dur="16s" begin="hh-play.begin+0