Name="transform" type="translate" keyTimes="0.0000;0.7500;0.8750;1.0000" values="610 370;610 370;690 200;690 200" dur="16s" begin="hh-play.begin+0s" fill="freeze"/><g><circle r="8" fill="#374151"/><circle cx="-12" r="7" fill="#ef4444"/><circle cx="12" r="7" fill="#ef4444"/></g></g></g><g><animate attributeName="opacity" keyTimes="0.0000;0.5000;0.5188;1.0000" values="0;0;1;1" dur="16s" begin="hh-play.begin+0s" fill="freeze"/><text x="980" y="220" text-anchor="middle" font-size="15" font-weight="800" fill="#b91c1c">2O²⁻ → O₂ + 4e⁻</text><text x="980" y="246" text-anchor="middle" font-size="15" font-weight="800" fill="#111827">C + O₂ → CO₂</text><text x="980" y="272" text-anchor="middle" font-size="12" font-weight="700" fill="#475569">(anodes burn away)</text></g>
