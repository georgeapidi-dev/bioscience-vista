<g class="part" data-part="cost" data-name="Energy cost" data-info="Needs a very large electric current (often hundreds of thousands of amperes), so plants are built near cheap electricity, e.g. hydroelectric power." tabindex="0" role="button" aria-label="Energy cost"><g><animate attributeName="opacity" keyTimes="0.0000;0.1250;0.1437;1.0000" values="0;0;1;1" dur="16s" begin="hh-play.begin+0s" fill="freeze"/><rect x="860" y="320" width="340" height="160" rx="14" fill="#fef9c3" stroke="#eab308"/><text x="1030" y="348" text-anchor="middle" font-size="14" font-weight="800" fill="#713f12">Why cryolite? Why so costly?</text><text x="1030" y="376" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">cryolite lowers the operating</text><text x="1030" y="396" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">temperature (Al₂O₃ melts ≈2050 °C)</text><text x="1030" y="424" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">huge current needed → plants</text><text x="1030" y="444" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">built near cheap (hydro)electricity</text></g></g>
