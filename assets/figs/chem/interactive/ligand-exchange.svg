<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" class="vd-svg" role="img" aria-labelledby="le-title le-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="le-play" data-vd-play-label="Play: swap ligands" data-vd-steps="[[0, &quot;Ligand exchange in copper(II) complexes.&quot;], [1, &quot;Add hydroxide: blue precipitate.&quot;], [5, &quot;Excess ammonia: deep blue solution.&quot;], [10, &quot;Concentrated HCl: yellow tetrachlorocuprate(II).&quot;]]" data-vd-dur="16">
<title id="le-title">Ligand exchange</title><desc id="le-desc">Test tubes showing hexaaquacopper(II) pale blue, copper(II) hydroxide blue precipitate with hydroxide, deep blue tetraammine complex with excess ammonia, and yellow tetrachlorocuprate(II) with concentrated hydrochloric acid; cobalt(II) pink to blue with chloride.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="560" fill="#ffffff"/>
<g aria-hidden="true"><animate id="le-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<text class="head" x="30" y="34">Ligand exchange: copper(II) and cobalt(II)</text><text class="note" x="30" y="56">Start: [Cu(H₂O)₆]²⁺(aq), pale blue.</text>
<g class="part" data-part="oh" data-name="With hydroxide" data-info="[Cu(H₂O)₆]²⁺ + 2OH⁻ → Cu(OH)₂(H₂O)₄ + 2H₂O: pale blue solution → blue precipitate." tabindex="0" role="button" aria-label="With hydroxide"><g><animate attributeName="opacity" keyTimes="0.0000;0.0000;0.0187;1.0000" values="0;0;1;1" dur="16s" begin="le-play.begin+0s" fill="freeze"/><path d="M 90 120 L 90 330 Q 120 350 150 330 L 150 120" fill="#f8fafc" stroke="#334155" stroke-width="2"/><rect x="92" y="200" width="56" height="134" fill="#bfdbfe"><animate attributeName="fill" keyTimes="0.0000;0.0000;0.0625;1.0000" values="#bfdbfe;#bfdbfe;#bfdbfe;#bfdbfe" dur="16s" begin="le-play.begin+0s" fill="freeze"/></rect><text x="120" y="104" text-anchor="middle" font-size="11" font-weight="800" fill="#475569">start</text><text x="120" y="372" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">[Cu(H₂O)₆]²⁺</text><text x="120" y="392" text-anchor="middle" font-size="11" font-weight="800" fill="#1d4ed8">pale blue</text></g></g>
<g class="part" data-part="oh" data-name="With hydroxide" data-info="[Cu(H₂O)₆]²⁺ + 2OH⁻ → Cu(OH)₂(H₂O)₄ + 2H₂O: pale blue solution → blue precipitate." tabindex="0" role="button" aria-label="With hydroxide"><g><animate attributeName="opacity" keyTimes="0.0000;0.0312;0.0500;1.0000" values="0;0;1;1" dur="16s" begin="le-play.begin+0s" fill="freeze"/><path d="M 300 120 L 300 330 Q 330 350 360 330 L 360 120" fill="#f8fafc" stroke="#334155" stroke-width="2"/><rect x="302" y="200" width="56" height="134" fill="#bfdbfe"><animate attributeName="fill" keyTimes="0.0000;0.0625;0.1250;1.0000" values="#bfdbfe;#bfdbfe;#bfdbfe;#bfdbfe" dur="16s" begin="le-play.begin+0s" fill="freeze"/></rect><circle cx="308" cy="318" r="4" fill="#1d4ed8" opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.0938;0.1375;1.0000" values="0;0;1;1" dur="16s" begin="le-play.begin+0s" fill="freeze"/></circle><circle cx="317" cy="318" r="4" fill="#1d4ed8" opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.0938;0.1375;1.0000" values="0;0;1;1" dur="16s" begin="le-play.begin+0s" fill="freeze"/></circle><circle cx="326" cy="318" r="4" fill="#1d4ed8" opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.0938;0.1375;1.0000" values="0;0;1;1" dur="16s" begin="le-play.begin+0s" fill="freeze"/></circle><circle cx="335" cy="318" r="4" fill="#1d4ed8" opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.0938;0.1375;1.0000" values="0;0;1;1" dur="16s" begin="le-play.begin+0s" fill="freeze"/></circle><circle cx="344" cy="318" r="4" fill="#1d4ed8" opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.0938;0.1375;1.0000" values="0;0;1;1" dur="16s" begin="le-play.begin+0s" fill="freeze"/></circle><circle cx="353" cy="311" r="4" fill="#1d4ed8" opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.0938;0.1375;1.0000" values="0;0;1;1" dur="16s" begin="le-play.begin+0s" fill="freeze"/></circle><circle cx="316" cy="311" r="4" fill="#1d4ed8" opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.0938;0.1375;1.0000" values="0;0;1;1" dur="16s" begin="le-play.begin+0s" fill="freeze"/></circle><circle cx="325" cy="311" r="4" fill="#1d4ed8" opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.0938;0.1375;1.0000" values="0;0;1;1" dur="16s" begin="le-play.begin+0s" fill="freeze"/></circle><circle cx="334" cy="311" r="4" fill="#1d4ed8" opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.0938;0.1375;1.0000" values="0;0;1;1" dur="16s" begin="le-play.begin+0s" fill="freeze"/></circle><circle cx="343" cy="311" r="4" fill="#1d4ed8" opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.0938;0.1375;1.0000" values="0;0;1;1" dur="16s" begin="le-play.begin+0s" fill="freeze"/></circle><circle cx="352" cy="304" r="4" fill="#1d4ed8" opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.0938;0.1375;1.0000" values="0;0;1;1" dur="16s" begin="le-play.begin+0s" fill="freeze"/></circle><circle cx="315" cy="304" r="4" fill="#1d4ed8" opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.0938;0.1375;1.0000" values="0;0;1;1" dur="16s" begin="le-play.begin+0s" fill="freeze"/></circle><circle cx="324" cy="304" r="4" fill="#1d4ed8" opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.0938;0.1375;1.0000" values="0;0;1;1" dur="16s" begin="le-play.begin+0s" fill="freeze"/></circle><circle cx="333" cy="304" r="4" fill="#1d4ed8" opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.0938;0.1375;1.0000" values="0;0;1;1" dur="16s" begin="le-play.begin+0s" fill="freeze"/></circle><circle cx="342" cy="304" r="4" fill="#1d4ed8" opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.0938;0.1375;1.0000" values="0;0;1;1" dur="16s" begin="le-play.begin+0s" fill="freeze"/></circle><text x="330" y="104" text-anchor="middle" font-size="11" font-weight="800" fill="#475569">+ OH⁻ or a little NH₃</text><text x="330" y="372" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">Cu(OH)₂(H₂O)₄</text><text x="330" y="392" text-anchor="middle" font-size="11" font-weight="800" fill="#1d4ed8">blue ppt</text></g></g>
<g class="part" data-part="nh3" data-name="With excess ammonia" data-info="A little NH₃ gives the same blue precipitate; excess dissolves it: [Cu(H₂O)₆]²⁺ + 4NH₃ → [Cu(NH₃)₄(H₂O)₂]²⁺ + 4H₂O: deep blue solution. Same coordination number (6)." tabindex="0" role="button" aria-label="With excess ammonia"><g><animate attributeName="opacity" keyTimes="0.0000;0.3125;0.3312;1.0000" values="0;0;1;1" dur="16s" begin="le-play.begin+0s" fill="freeze"/><path d="M 530 120 L 530 330 Q 560 350 590 330 L 590 120" fill="#f8fafc" stroke="#334155" stroke-width="2"/><rect x="532" y="200" width="56" height="134" fill="#bfdbfe"><animate attributeName="fill" keyTimes="0.0000;0.3438;0.4062;1.0000" values="#bfdbfe;#bfdbfe;#1e40af;#1e40af" dur="16s" begin="le-play.begin+0s" fill="freeze"/></rect><text x="560" y="104" text-anchor="middle" font-size="11" font-weight="800" fill="#475569">+ excess NH₃</text><text x="560" y="372" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">[Cu(NH₃)₄(H₂O)₂]²⁺</text><text x="560" y="392" text-anchor="middle" font-size="11" font-weight="800" fill="#1d4ed8">deep blue solution</text></g></g>
<g class="part" data-part="cl" data-name="With concentrated HCl" data-info="[Cu(H₂O)₆]²⁺ + 4Cl⁻ ⇌ [CuCl₄]²⁻ + 6H₂O: yellow(-green); octahedral → tetrahedral (Cl⁻ is larger). [Co(H₂O)₆]²⁺ (pink) + 4Cl⁻ ⇌ [CoCl₄]²⁻ (blue). Adding water reverses it." tabindex="0" role="button" aria-label="With concentrated HCl"><g><animate attributeName="opacity" keyTimes="0.0000;0.5938;0.6125;1.0000" values="0;0;1;1" dur="16s" begin="le-play.begin+0s" fill="freeze"/><path d="M 770 120 L 770 330 Q 800 350 830 330 L 830 120" fill="#f8fafc" stroke="#334155" stroke-width="2"/><rect x="772" y="200" width="56" height="134" fill="#bfdbfe"><animate attributeName="fill" keyTimes="0.0000;0.6250;0.6875;1.0000" values="#bfdbfe;#bfdbfe;#facc15;#facc15" dur="16s" begin="le-play.begin+0s" fill="freeze"/></rect><text x="800" y="104" text-anchor="middle" font-size="11" font-weight="800" fill="#475569">+ conc. HCl</text><text x="800" y="372" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">[CuCl₄]²⁻</text><text x="800" y="392" text-anchor="middle" font-size="11" font-weight="800" fill="#a16207">yellow · tetrahedral</text></g></g>
<g><animate attributeName="opacity" keyTimes="0.0000;0.6875;0.7063;1.0000" values="0;0;1;1" dur="16s" begin="le-play.begin+0s" fill="freeze"/><rect x="900" y="110" width="170" height="290" rx="14" fill="#fdf2f8" stroke="#f9a8d4"/><text x="985" y="136" text-anchor="middle" font-size="13" font-weight="800" fill="#9d174d">cobalt(II)</text><rect x="935" y="160" width="100" height="40" rx="8" fill="#f9a8d4"><animate attributeName="fill" keyTimes="0.0000;0.7500;0.8125;1.0000" values="#f9a8d4;#f9a8d4;#2563eb;#2563eb" dur="16s" begin="le-play.begin+0s" fill="freeze"/></rect><text x="985" y="224" text-anchor="middle" font-size="11" font-weight="800" fill="#9d174d">[Co(H₂O)₆]²⁺ pink</text><text x="985" y="250" text-anchor="middle" font-size="11" font-weight="800" fill="#475569">+ conc. HCl ⇌</text><text x="985" y="276" text-anchor="middle" font-size="11" font-weight="800" fill="#1d4ed8">[CoCl₄]²⁻ blue</text><text x="985" y="320" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">add water:</text><text x="985" y="340" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">back to pink</text></g>
<g><animate attributeName="opacity" keyTimes="0.0000;0.8125;0.8313;1.0000" values="0;0;1;1" dur="16s" begin="le-play.begin+0s" fill="freeze"/><rect x="40" y="420" width="1030" height="120" rx="16" fill="#f0f9ff" stroke="#7dd3fc"/><text x="555" y="452" text-anchor="middle" font-size="14" font-weight="800" fill="#0369a1">[Cu(H₂O)₆]²⁺ + 4NH₃ → [Cu(NH₃)₄(H₂O)₂]²⁺ + 4H₂O   (CN 6 → 6, octahedral)</text><text x="555" y="488" text-anchor="middle" font-size="14" font-weight="800" fill="#a16207">[Cu(H₂O)₆]²⁺ + 4Cl⁻ ⇌ [CuCl₄]²⁻ + 6H₂O   (CN 6 → 4: Cl⁻ is larger)</text><text x="555" y="518" text-anchor="middle" font-size="12" font-weight="700" fill="#475569">a ligand forming a more stable complex (larger Kstab) replaces the other</text></g>
</svg>