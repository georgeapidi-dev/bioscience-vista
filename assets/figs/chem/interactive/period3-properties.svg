e" font-size="10" font-weight="800" fill="#dc2626">hydrolysed</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.8333;0.8533;1.0000" values="0;0;1;1" dur="15s" begin="p3-play.begin+0s" fill="freeze"/><rect x="906" y="380" width="74" height="110" rx="8" fill="#dc2626" opacity=".25"/><text x="943" y="410" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">SiCl₄</text><text x="943" y="450" text-anchor="middle" font-size="13" font-weight="800" fill="#dc2626">pH 2</text><text x="943" y="478" text-anchor="middle" font-size="10" font-weight="800" fill="#dc2626">hydrolysed</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.8667;0.8867;1.0000" values="0;0;1;1" dur="15s" begin="p3-play.begin+0s" fill="freeze"/><rect x="988" y="380" width="74" height="110" rx="8" fill="#dc2626" opacity=".25"/><text x="1025" y="410" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">PCl₅</text><text x="1025" y="450" text-anchor="middle" font-size="13" font-weight="800" fill="#dc2626">pH 2</text><text x="1025" y="478" text-anchor="middle" font-size="10" font-weight="800" fill="#dc2626">hydrolysed</text></g><text x="855" y="535" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">covalent chlorides: white fumes of HCl</text></g>
