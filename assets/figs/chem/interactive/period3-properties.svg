<g class="part" data-part="ox" data-name="Oxides with water" data-info="Na₂O → NaOH (pH 13–14), MgO → Mg(OH)₂ (pH ~9): basic; Al₂O₃ insoluble, amphoteric; SiO₂ insoluble, acidic; P₄O₁₀ → H₃PO₄, SO₂/SO₃ → H₂SO₃/H₂SO₄ (pH 1–2): acidic." tabindex="0" role="button" aria-label="Oxides with water"><rect x="640" y="80" width="430" height="230" rx="16" fill="#f8fafc" stroke="#cbd5e1"/><text x="855" y="104" text-anchor="middle" font-size="14" font-weight="800" fill="#111827">oxides + water</text><g><animate attributeName="opacity" keyTimes="0.0000;0.4667;0.4867;1.0000" values="0;0;1;1" dur="15s" begin="p3-play.begin+0s" fill="freeze"/><rect x="660" y="130" width="60" height="110" rx="8" fill="#2563eb" opacity=".25"/><text x="690" y="160" text-anchor="middle" font-size="11" font-weight="800" fill="#111827">Na₂O</text><text x="690" y="200" text-anchor="middle" font-size="12" font-weight="800" fill="#2563eb">pH 14</text><text x="690" y="228" text-anchor="middle" font-size="10" font-weight="800" fill="#2563eb">basic</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.5000;0.5200;1.0000" values="0;0;1;1" dur="15s" begin="p3-play.begin+0s" fill="freeze"/><rect x="728" y="130" width="60" height="110" rx="8" fill="#2563eb" opacity=".25"/><text x="758" y="160" text-anchor="middle" font-size="11" font-weight="800" fill="#111827">MgO</text><text x="758" y="200" text-anchor="middle" font-size="12" font-weight="800" fill="#2563eb">pH 9</text><text x="758" y="228" text-anchor="middle" font-size="10" font-weight="800" fill="#2563eb">basic</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.5333;0.5533;1.0000" values="0;0;1;1" dur="15s" begin="p3-play.begin+0s" fill="freeze"/><rect x="796" y="130" width="60" height="110" rx="8" fill="#16a34a" opacity=".25"/><text x="826" y="160" text-anchor="middle" font-size="11" font-weight="800" fill="#111827">Al₂O₃</text><text x="826" y="200" text-anchor="middle" font-size="12" font-weight="800" fill="#16a34a">insol.</text><tex