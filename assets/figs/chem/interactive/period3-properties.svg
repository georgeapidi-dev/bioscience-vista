<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 580" class="vd-svg" role="img" aria-labelledby="p3-title p3-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="p3-play" data-vd-play-label="Play: cross the period" data-vd-steps="[[0, &quot;Periodicity across Period 3.&quot;], [1, &quot;Melting points: metallic \u2192 giant covalent \u2192 simple molecular.&quot;], [7, &quot;Oxides: basic \u2192 amphoteric \u2192 acidic.&quot;], [11, &quot;Chlorides: ionic dissolve; covalent are hydrolysed.&quot;]]" data-vd-dur="15">
<title id="p3-title">Period 3 periodicity</title><desc id="p3-desc">A bar chart of Period 3 melting points from sodium to argon with structure types, and the pH of the solutions formed by the oxides and chlorides with water, from basic to acidic.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="580" fill="#ffffff"/>
<g aria-hidden="true"><animate id="p3-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<text class="head" x="30" y="34">Period 3: physical and chemical periodicity</text><text class="note" x="30" y="56">Melting points in K.</text>
