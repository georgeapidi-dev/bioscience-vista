<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" class="vd-svg" role="img" aria-labelledby="fi-title fi-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="fi-play" data-vd-play-label="Play: filter the mixture" data-vd-steps="[[0, &quot;Filtration separates an insoluble solid from a liquid, e.g. sand from water.&quot;], [1, &quot;The mixture is poured slowly into a filter funnel lined with filter paper.&quot;], [4, &quot;Water passes through the tiny holes in the paper: this is the filtrate.&quot;], [7, &quot;The sand particles are too big to pass through: they stay on the paper as the residue.&quot;]]" data-vd-dur="12">
<title id="fi-title">Filtration</title><desc id="fi-desc">A beaker of sand and water poured into a funnel lined with filter paper; water drips through into a flask as filtrate, sand stays as residue.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1000" height="640" fill="#ffffff"/>
<g aria-hidden="true"><animate id="fi-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<text class="head" x="30" y="34">Filtration</text><text class="note" x="30" y="56">Separating sand from water.</text>
<g class="part" data-part="fun" data-name="Filter funnel" data-info="Holds the filter paper." tabindex="0" role="button" aria-label="Filter funnel"><path d="M 330 200 L 570 200 L 470 360 L 470 440 L 430 440 L 430 360 Z" fill="#f8fafc" stroke="#334155" stroke-width="4"/></g>
<g class="part" data-part="pap" data-name="Filter paper (folded cone)" data-info="Has tiny holes: water molecules and dissolved particles pass through; insoluble solid particles are too big." tabindex="0" role="button" aria-label="Filter paper (folded cone)"><path d="M 350 206 L 550 206 L 450 350 Z" fill="#fff" stroke="#94a3b8" stroke-width="2" stroke-dasharray="3 3"/></g>
<rect x="440" y="440" width="20" height="10" fill="none"/>
<path d="M 360 470 L 360 600 Q 360 620 380 620 L 520 620 Q 540 620 540 600 L 540 470" fill="none" stroke="#334155" stroke-width="4"/>
