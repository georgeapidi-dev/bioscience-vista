<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 540" class="vd-svg" role="img" aria-labelledby="ne-title ne-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="ne-play" data-vd-play-label="Play: dilute Cu²⁺" data-vd-steps="[[0, &quot;Electrode potential depends on concentration.&quot;], [1, &quot;E = E\u29b5 + (0.059/z) log([ox]/[red]).&quot;], [4, &quot;Diluting Cu\u00b2\u207a makes E less positive.&quot;], [9, &quot;0.010 mol dm\u207b\u00b3 Cu\u00b2\u207a: E = +0.28 V.&quot;]]" data-vd-dur="13">
<title id="ne-title">The Nernst equation</title><desc id="ne-desc">A straight-line graph of electrode potential against log of copper(II) concentration with gradient 0.0295 volts, passing through 0.34 volts at 1 mole per cubic decimetre and 0.28 volts at 0.010.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="540" fill="#ffffff"/>
<g aria-hidden="true"><animate id="ne-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<text class="head" x="30" y="34">The Nernst equation: E changes with concentration</text><text class="note" x="30" y="56">Cu²⁺ + 2e⁻ ⇌ Cu, E⦵ = +0.34 V, 298 K.</text>
<g class="part" data-part="eq" data-name="The Nernst equation" data-info="E = E⦵ + (0.059/z) log([oxidised]/[reduced]) at 298 K; z = electrons transferred. For a metal/metal-ion cell [reduced] = 1: E = E⦵ + (0.059/z) log[Mⁿ⁺]." tabindex="0" role="button" aria-label="The Nernst equation"><g><animate attributeName="opacity" keyTimes="0.0000;0.0769;0.1000;1.0000" values="0;0;1;1" dur="13s" begin="ne-play.begin+0s" fill="freeze"/><rect x="650.0" y="95.0" width="420" height="70" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="860" y="128" text-anchor="middle" font-size="15" font-weight="800" fill="#111827">E = E⦵ + (0.059 / z) log [ox] / [red]</text><text x="860" y="146" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">z = electrons transferred · metal: [red] = 1</text></g></g>
<g class="part" data-part="plot" data-name="Concentration effect" data-info="For Cu²⁺/Cu (z = 2) E falls by 0.0295 V for each tenfold dilution of Cu²⁺. Lower [oxidised form] → less positive E: equilibrium shifts to the left." tabindex="0" role="button" aria-label="Concentration effect"><line x1="100" y1="480" x2="580" y2="480" stroke="#111827" stroke-width="2"/><line x1="100" y1="480" x2="100" y2="120" stroke="#111827" stroke-width="2"/><text x="340.0" y="508" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">log [Cu²⁺]</text><text x="84" y="300.0" transform="rotate(-90 84 300.0)" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">E / V</text><text x="100.0" y="494" text-anchor="middle" font-size="10" font-weight="700" fill="#475569">-4</text><text x="220.0" y="494" text-anchor="middle" font-size="10" font-weight="700" fill="#475569">-3</text><text x="340.0" y="494" text-anchor="middle" font-size="10" font-weight="700" fill="#475569">-2</text><text x="460.0" y="494" text-anchor="middle" font-size="10" font-weight="700" fill="#475569">-1</text><text x="580.0" y="494" text-anchor="middle" font-size="10" font-weight="700" fill="#475569">0</text><text x="94" y="439.0" text-anchor="end" font-size="10" font-weight="700" fill="#475569">0.22</text><text x="94" y="349.0" text-anchor="end" font-size="10" font-weight="700" fill="#475569">0.26</text><text x="94" y="259.0" text-anchor="end" font-size="10" font-weight="700" fill="#475569">0.30</text><text x="94" y="168.99999999999994" text-anchor="end" font-size="10" font-weight="700" fill="#475569">0.34</text><clipPath id="nel-c40116100"><rect x="100" y="116" width="484" height="368"><animate attributeName="width" keyTimes="0.0000;0.3077;0.6154;1.0000" values="0;0;484;484" dur="13s" begin="ne-play.begin+0s" fill="freeze"/></rect></clipPath><g clip-path="url(#nel-c40116100)"><polyline points="100.0,430.5 112.0,423.9 124.0,417.2 136.0,410.6 148.0,403.9 160.0,397.3 172.0,390.7 184.0,384.0 196.0,377.4 208.0,370.8 220.0,364.1 232.0,357.5 244.0,350.9 256.0,344.2 268.0,337.6 280.0,330.9 292.0,324.3 304.0,317.7 316.0,311.0 328.0,304.4 340.0,297.8 352.0,291.1 364.0,284.5 376.0,277.8 388.0,271.2 400.0,264.6 412.0,257.9 424.0,251.3 436.0,244.6 448.0,238.0 460.0,231.4 472.0,224.7 484.0,218.1 496.0,211.5 508.0,204.8 520.0,198.2 532.0,191.5 544.0,184.9 556.0,178.3 568.0,171.6 580.0,165.0" fill="none" stroke="#b45309" stroke-width="3"/></g><g><animate attributeName="opacity" keyTimes="0.0000;0.3077;0.3308;1.0000" values="0;0;1;1" dur="13s" begin="ne-play.begin+0s" fill="freeze"/><circle cx="580" cy="165" r="7" fill="#b45309"/><text x="570.0" y="152.99999999999994" text-anchor="end" font-size="12" font-weight="800" fill="#b45309">E⦵ = 0.34 V</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.6923;0.7154;1.0000" values="0;0;1;1" dur="13s" begin="ne-play.begin+0s" fill="freeze"/><circle cx="340" cy="298" r="7" fill="#dc2626"/><line x1="340" y1="298" x2="340" y2="480" stroke="#dc2626" stroke-dasharray="4 3"/><line x1="340" y1="298" x2="100" y2="298" stroke="#dc2626" stroke-dasharray="4 3"/><text x="350.0" y="317.75" text-anchor="start" font-size="12" font-weight="800" fill="#b91c1c">0.010 mol dm⁻³ → 0.28 V</text></g></g>
<g class="part" data-part="ex" data-name="Worked example" data-info="[Cu²⁺] = 0.010 mol dm⁻³: E = 0.34 + 0.0295 × log 0.010 = 0.34 − 0.059 = +0.28 V." tabindex="0" role="button" aria-label="Worked example"><g><animate attributeName="opacity" keyTimes="0.0000;0.6923;0.7154;1.0000" values="0;0;1;1" dur="13s" begin="ne-play.begin+0s" fill="freeze"/><rect x="620" y="240" width="450" height="200" rx="16" fill="#fef9c3" stroke="#eab308"/><text x="845" y="270" text-anchor="middle" font-size="14" font-weight="800" fill="#713f12">[Cu²⁺] = 0.010 mol dm⁻³</text><text x="845" y="310" text-anchor="middle" font-size="14" font-weight="800" fill="#111827">E = 0.34 + (0.059 / 2) log 0.010</text><text x="845" y="344" text-anchor="middle" font-size="14" font-weight="800" fill="#111827">= 0.34 + 0.0295 × (−2)</text><text x="845" y="382" text-anchor="middle" font-size="18" font-weight="800" fill="#b91c1c">= +0.28 V</text><text x="845" y="418" text-anchor="middle" font-size="12" font-weight="700" fill="#475569">lower [ox] → less positive E</text></g></g>
</svg>