<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 660" class="vd-svg" role="img" aria-labelledby="arn-title arn-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="arn-play" data-vd-play-label="Play: react benzene" data-vd-steps="[[0, &quot;Reactions of benzene and methylbenzene.&quot;], [1, &quot;Electrophilic substitutions with their catalysts.&quot;], [11, &quot;Side chains: oxidised by KMnO\u2084; chlorinated in UV light.&quot;]]" data-vd-dur="16">
<title id="arn-title">Reactions of arenes</title><desc id="arn-desc">A reaction map for benzene: nitration, bromination with an iron bromide catalyst, Friedel-Crafts alkylation and acylation with aluminium chloride, hydrogenation to cyclohexane, and oxidation of a methylbenzene side chain to benzoic acid.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="660" fill="#ffffff"/>
<g aria-hidden="true"><animate id="arn-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<defs><marker id="arn-475569" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="5.4" refY="6.0" orient="auto"><path d="M0,0 L12,6.0 L0,12 z" fill="#475569"/></marker></defs>
<text class="head" x="30" y="34">Reactions of arenes</text><text class="note" x="30" y="56">Ring: electrophilic substitution. Side chain: oxidation or free-radical substitution.</text>
<g class="part" data-part="map" data-name="Reactions of benzene" data-info="Electrophilic substitution keeps the delocalised ring: nitration, halogenation, Friedel–Crafts alkylation and acylation. Addition of H₂ needs harsh conditions." tabindex="0" role="button" aria-label="Reactions of benzene"><polygon points="550.0,283.0 595.0,309.0 595.0,361.0 550.0,387.0 505.0,361.0 505.0,309.0" fill="#fff" stroke="#111827" stroke-width="4"/><circle cx="550" cy="335" r="31" fill="none" stroke="#111827" stroke-width="3"/><g><animate attributeName="opacity" keyTimes="0.0000;0.0625;0.0813;1.0000" values="0;0;1;1" dur="16s" begin="arn-play.begin+0s" fill="freeze"/><path d="M 550 265 L 550 180" stroke="#475569" stroke-width="3" marker-end="url(#arn-475569)"/><rect x="385" y="88" width="330" height="84" rx="14" fill="#fff" stroke="#1d4ed8" stroke-width="2"/><text x="550.0" y="118.0" text-anchor="middle" font-size="14" font-weight="800" fill="#111827">nitrobenzene</text><text x="550.0" y="140.0" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">conc. HNO₃ + conc. H₂SO₄, < 55 °C</text><text x="550.0" y="160.0" text-anchor="middle" font-size="11" font-weight="800" fill="#1d4ed8">electrophilic substitution</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.1500;0.1687;1.0000" values="0;0;1;1" dur="16s" begin="arn-play.begin+0s" fill="freeze"/><path d="M 611 300 L 749 258" stroke="#475569" stroke-width="3" marker-end="url(#arn-475569)"/><rect x="705" y="190" width="330" height="84" rx="14" fill="#fff" stroke="#1d4ed8" stroke-width="2"/><text x="870.4293994002423" y="220.5" text-anchor="middle" font-size="14" font-weight="800" fill="#111827">bromobenzene</text><text x="870.4293994002423" y="242.5" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">Br₂, FeBr₃ (or Fe) catalyst</text><text x="870.4293994002423" y="262.5" text-anchor="middle" font-size="11" font-weight="800" fill="#1d4ed8">electrophilic substitution</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.2375;0.2562;1.0000" values="0;0;1;1" dur="16s" begin="arn-play.begin+0s" fill="freeze"/><path d="M 611 370 L 749 412" stroke="#475569" stroke-width="3" marker-end="url(#arn-475569)"/><rect x="705" y="396" width="330" height="84" rx="14" fill="#fff" stroke="#1d4ed8" stroke-width="2"/><text x="870.4293994002423" y="425.5" text-anchor="middle" font-size="14" font-weight="800" fill="#111827">methylbenzene</text><text x="870.4293994002423" y="447.5" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">CH₃Cl, AlCl₃, anhydrous</text><text x="870.4293994002423" y="467.5" text-anchor="middle" font-size="11" font-weight="800" fill="#1d4ed8">electrophilic substitution</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.3250;0.3437;1.0000" values="0;0;1;1" dur="16s" begin="arn-play.begin+0s" fill="freeze"/><path d="M 550 405 L 550 490" stroke="#475569" stroke-width="3" marker-end="url(#arn-475569)"/><rect x="385" y="498" width="330" height="84" rx="14" fill="#fff" stroke="#1d4ed8" stroke-width="2"/><text x="550.0" y="528.0" text-anchor="middle" font-size="14" font-weight="800" fill="#111827">phenylethanone</text><text x="550.0" y="550.0" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">CH₃COCl, AlCl₃, anhydrous</text><text x="550.0" y="570.0" text-anchor="middle" font-size="11" font-weight="800" fill="#1d4ed8">electrophilic substitution</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.4750;0.4937;1.0000" values="0;0;1;1" dur="16s" begin="arn-play.begin+0s" fill="freeze"/><path d="M 489 370 L 351 412" stroke="#475569" stroke-width="3" marker-end="url(#arn-475569)"/><rect x="65" y="396" width="330" height="84" rx="14" fill="#fff" stroke="#7c3aed" stroke-width="2"/><text x="229.57060059975765" y="425.5" text-anchor="middle" font-size="14" font-weight="800" fill="#111827">cyclohexane</text><text x="229.57060059975765" y="447.5" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">H₂, Ni or Pt, heat, pressure</text><text x="229.57060059975765" y="467.5" text-anchor="middle" font-size="11" font-weight="800" fill="#7c3aed">addition (harsh)</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.5625;0.5813;1.0000" values="0;0;1;1" dur="16s" begin="arn-play.begin+0s" fill="freeze"/><path d="M 489 300 L 351 258" stroke="#475569" stroke-width="3" marker-end="url(#arn-475569)"/><rect x="65" y="190" width="330" height="84" rx="14" fill="#fff" stroke="#7c3aed" stroke-width="2"/><text x="229.5706005997577" y="220.49999999999997" text-anchor="middle" font-size="14" font-weight="800" fill="#111827">(from methylbenzene) benzoic acid</text><text x="229.5706005997577" y="242.49999999999997" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">hot alkaline KMnO₄, then acidify</text><text x="229.5706005997577" y="262.5" text-anchor="middle" font-size="11" font-weight="800" fill="#7c3aed">side-chain oxidation</text></g></g>
<g class="part" data-part="side" data-name="Side-chain reactions" data-info="Alkylbenzenes: hot alkaline KMnO₄ oxidises any side chain to –COOH (benzoic acid); Cl₂ in UV light substitutes on the side chain (free radical) rather than the ring." tabindex="0" role="button" aria-label="Side-chain reactions"><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.7500;0.7688;1.0000" values="0;0;1;1" dur="16s" begin="arn-play.begin+0s" fill="freeze"/><rect x="230.0" y="628" width="640" height="24" rx="12" fill="#ede9fe" stroke="#1f2937" stroke-width="1"/><text x="550" y="645" text-anchor="middle" font-size="12" font-weight="700">side chain: KMnO₄ → –COOH · Cl₂/UV → C₆H₅CH₂Cl (free radical, not the ring)</text></g></g>
</svg>