<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" class="vd-svg" role="img" aria-labelledby="bf-title bf-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="bf-play" data-vd-play-label="Play: test the buffer" data-vd-steps="[[0, &quot;Buffers resist changes in pH.&quot;], [1, &quot;Large reservoirs of CH\u2083COOH and CH\u2083COO\u207b.&quot;], [4, &quot;Add H\u207a: it is mopped up by CH\u2083COO\u207b.&quot;], [8, &quot;Add OH\u207b: it is removed by CH\u2083COOH.&quot;], [12, &quot;pH = pKa + log([A\u207b]/[HA]).&quot;]]" data-vd-dur="16">
<title id="bf-title">Buffer solutions</title><desc id="bf-desc">An ethanoic acid and sodium ethanoate buffer with large reservoirs of acid and conjugate base; added hydrogen ions react with ethanoate ions and added hydroxide ions react with ethanoic acid, so the pH stays almost constant; the buffer pH formula.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="560" fill="#ffffff"/>
<g aria-hidden="true"><animate id="bf-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<text class="head" x="30" y="34">Buffer solutions: CH₃COOH / CH₃COO⁻</text><text class="note" x="30" y="56">Ka(CH₃COOH) = 1.74 × 10⁻⁵ mol dm⁻³; pKa 4.76.</text>
<g class="part" data-part="what" data-name="A buffer" data-info="A solution that resists changes in pH when small amounts of acid or alkali are added. Acidic buffer: a weak acid + its conjugate base (CH₃COOH + CH₃COONa) in large amounts." tabindex="0" role="button" aria-label="A buffer"><g><animate attributeName="opacity" keyTimes="0.0000;0.0625;0.0813;1.0000" values="0;0;1;1" dur="16s" begin="bf-play.begin+0s" fill="freeze"/><rect x="80" y="110" width="200" height="220" rx="14" fill="#f8fafc" stroke="#dc2626" stroke-width="2"/><text x="180" y="100" text-anchor="middle" font-size="14" font-weight="800" fill="#dc2626">CH₃COOH (HA)</text><rect x="100" y="150" width="160" height="170" fill="#dc2626" opacity=".35"><animate attributeName="height" keyTimes="0.0000;0.2500;0.3250;0.5000;0.5750;1.0000" values="170;170;196;196;170;170" dur="16s" begin="bf-play.begin+0s" fill="freeze"/><animate attributeName="y" keyTimes="0.0000;0.2500;0.3250;0.5000;0.5750;1.0000" values="150;150;124;124;150;150" dur="16s" begin="bf-play.begin+0s" fill="freeze"/></rect><rect x="380" y="110" width="200" height="220" rx="14" fill="#f8fafc" stroke="#2563eb" stroke-width="2"/><text x="480" y="100" text-anchor="middle" font-size="14" font-weight="800" fill="#2563eb">CH₃COO⁻ (A⁻)</text><rect x="400" y="150" width="160" height="170" fill="#2563eb" opacity=".35"><animate attributeName="height" keyTimes="0.0000;0.2500;0.3250;0.5000;0.5750;1.0000" values="170;170;144;144;170;170" dur="16s" begin="bf-play.begin+0s" fill="freeze"/><animate attributeName="y" keyTimes="0.0000;0.2500;0.3250;0.5000;0.5750;1.0000" values="150;150;176;176;150;150" dur="16s" begin="bf-play.begin+0s" fill="freeze"/></rect><text x="330" y="230" text-anchor="middle" font-size="30" font-weight="800" fill="#111827">⇌</text><text x="330" y="360" text-anchor="middle" font-size="12" font-weight="800" fill="#475569">large amounts of both</text></g></g>
<g class="part" data-part="acid" data-name="Adding acid" data-info="Added H⁺ reacts with the large reservoir of CH₃COO⁻: CH₃COO⁻ + H⁺ → CH₃COOH. [H⁺] hardly changes." tabindex="0" role="button" aria-label="Adding acid"><g><animate attributeName="opacity" keyTimes="0.0000;0.2500;0.2687;1.0000" values="0;0;1;1" dur="16s" begin="bf-play.begin+0s" fill="freeze"/><rect x="620" y="100" width="450" height="110" rx="16" fill="#fef2f2" stroke="#fecaca"/><text x="845" y="130" text-anchor="middle" font-size="15" font-weight="800" fill="#b91c1c">add a little H⁺</text><text x="845" y="166" text-anchor="middle" font-size="15" font-weight="800" fill="#111827">CH₃COO⁻ + H⁺ → CH₃COOH</text><text x="845" y="194" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">A⁻ falls slightly, HA rises slightly</text></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.2500;0.2625;0.3312;0.3438;1.0000" values="0;0;1;1;0;0" dur="16s" begin="bf-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.2500;0.3250;1.0000" values="520 60;520 60;480 200;480 200" dur="16s" begin="bf-play.begin+0s" fill="freeze"/><g><circle r="13" fill="#fca5a5" stroke="#b91c1c"/><text x="0" y="5" text-anchor="middle" font-size="11" font-weight="800" fill="#7f1d1d">H⁺</text></g></g></g></g>
<g class="part" data-part="alk" data-name="Adding alkali" data-info="Added OH⁻ reacts with CH₃COOH: CH₃COOH + OH⁻ → CH₃COO⁻ + H₂O. The ratio [HA]/[A⁻] changes only slightly." tabindex="0" role="button" aria-label="Adding alkali"><g><animate attributeName="opacity" keyTimes="0.0000;0.5000;0.5188;1.0000" values="0;0;1;1" dur="16s" begin="bf-play.begin+0s" fill="freeze"/><rect x="620" y="230" width="450" height="110" rx="16" fill="#eff6ff" stroke="#bfdbfe"/><text x="845" y="260" text-anchor="middle" font-size="15" font-weight="800" fill="#1d4ed8">add a little OH⁻</text><text x="845" y="296" text-anchor="middle" font-size="15" font-weight="800" fill="#111827">CH₃COOH + OH⁻ → CH₃COO⁻ + H₂O</text><text x="845" y="324" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">HA falls slightly, A⁻ rises slightly</text></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.5000;0.5125;0.5813;0.5938;1.0000" values="0;0;1;1;0;0" dur="16s" begin="bf-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.5000;0.5750;1.0000" values="220 60;220 60;180 200;180 200" dur="16s" begin="bf-play.begin+0s" fill="freeze"/><g><circle r="14" fill="#93c5fd" stroke="#1d4ed8"/><text x="0" y="5" text-anchor="middle" font-size="10" font-weight="800" fill="#1e3a8a">OH⁻</text></g></g></g></g>
<g class="part" data-part="calc" data-name="Buffer pH" data-info="[H⁺] = Ka × [HA]/[A⁻]; pH = pKa + log([A⁻]/[HA]). Equal concentrations: pH = pKa = 4.76. Blood: H₂CO₃/HCO₃⁻ keeps pH near 7.4." tabindex="0" role="button" aria-label="Buffer pH"><g><animate attributeName="opacity" keyTimes="0.0000;0.7500;0.7688;1.0000" values="0;0;1;1" dur="16s" begin="bf-play.begin+0s" fill="freeze"/><rect x="40" y="390" width="1030" height="150" rx="16" fill="#f0fdf4" stroke="#86efac"/><text x="555" y="424" text-anchor="middle" font-size="20" font-weight="800" fill="#15803d">pH = pKa + log ([A⁻] / [HA])</text><text x="555" y="462" text-anchor="middle" font-size="14" font-weight="800" fill="#111827">0.100 mol dm⁻³ HA + 0.200 mol dm⁻³ A⁻: pH = 4.76 + log 2 = 5.06</text><text x="555" y="500" text-anchor="middle" font-size="13" font-weight="700" fill="#475569">blood: H₂CO₃ ⇌ H⁺ + HCO₃⁻ keeps pH 7.35–7.45</text></g></g>
</svg>