<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 540" class="vd-svg" role="img" aria-labelledby="cb-title cb-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="cb-play" data-vd-play-label="Play: compare chlorides" data-vd-steps="[[0, &quot;Why chlorobenzene resists hydrolysis.&quot;], [1, &quot;Cl lone pair overlaps the \u03c0 ring: a stronger C\u2013Cl bond.&quot;], [5, &quot;The \u03c0 cloud repels nucleophiles.&quot;], [8.5, &quot;Compare: acyl chloride &gt; chloroalkane &gt; chlorobenzene.&quot;]]" data-vd-dur="14">
<title id="cb-title">Chlorobenzene and hydrolysis</title><desc id="cb-desc">A chlorine lone pair overlapping the delocalised ring of chlorobenzene strengthens the carbon-chlorine bond and the ring repels nucleophiles; silver nitrate tests show ethanoyl chloride hydrolyses instantly, chloroethane slowly and chlorobenzene not at all.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="540" fill="#ffffff"/>
<g aria-hidden="true"><animate id="cb-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<text class="head" x="30" y="34">Halogen compounds: why chlorobenzene is unreactive</text><text class="note" x="30" y="56">AgNO₃(aq) in ethanol: white AgCl shows Cl⁻ has been released.</text>
<g class="part" data-part="over" data-name="Overlap" data-info="A lone pair on Cl overlaps with the delocalised π system: the C–Cl bond gains partial double-bond character and is stronger and shorter." tabindex="0" role="button" aria-label="Overlap"><polygon points="200.0,200.0 252.0,230.0 252.0,290.0 200.0,320.0 148.0,290.0 148.0,230.0" fill="#fff" stroke="#111827" stroke-width="4"/><circle cx="200" cy="260" r="36" fill="none" stroke="#111827" stroke-width="3"/><line x1="252" y1="230" x2="290" y2="208" stroke="#111827" stroke-width="4"/><text x="294.06664199358164" y="206.0" text-anchor="start" font-size="18" font-weight="800" fill="#16a34a">Cl</text><g><animate attributeName="opacity" keyTimes="0.0000;0.0714;0.0929;1.0000" values="0;0;1;1" dur="14s" begin="cb-play.begin+0s" fill="freeze"/><ellipse cx="270" cy="210" rx="26" ry="14" fill="#86efac" opacity=".6"/><ellipse cx="200" cy="260" rx="74" ry="22" fill="#a78bfa" opacity=".3"/><text x="200" y="360" text-anchor="middle" font-size="13" font-weight="800" fill="#15803d">Cl lone pair overlaps the π system</text><text x="200" y="380" text-anchor="middle" font-size="12" font-weight="700" fill="#15803d">C–Cl stronger (partial double bond)</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.3571;0.3786;1.0000" values="0;0;1;1" dur="14s" begin="cb-play.begin+0s" fill="freeze"/><g transform="translate(60 170)"><text x="0" y="0" text-anchor="middle" font-size="16" font-weight="800" fill="#1d4ed8">OH⁻</text></g><path d="M 80 180 L 120 210" stroke="#1d4ed8" stroke-width="3"/><line x1="100" y1="185" x2="120" y2="205" stroke="#dc2626" stroke-width="4"/><line x1="120" y1="185" x2="100" y2="205" stroke="#dc2626" stroke-width="4"/><text x="200" y="410" text-anchor="middle" font-size="12" font-weight="800" fill="#b91c1c">π electrons repel nucleophiles</text></g></g>
<g class="part" data-part="repel" data-name="Nucleophiles repelled" data-info="The electron-rich ring repels nucleophiles, and backside attack through the ring is impossible." tabindex="0" role="button" aria-label="Nucleophiles repelled"></g>
<g class="part" data-part="order" data-name="Ease of hydrolysis" data-info="Ethanoyl chloride (instant, steamy HCl fumes in water) &gt; chloroethane (slow, warm with AgNO₃(aq)) &gt; chlorobenzene (no reaction)." tabindex="0" role="button" aria-label="Ease of hydrolysis"><rect x="440" y="90" width="630" height="400" rx="16" fill="#f8fafc" stroke="#cbd5e1"/><text x="755" y="116" text-anchor="middle" font-size="14" font-weight="800" fill="#111827">AgNO₃(aq), warm: how fast is Cl⁻ released?</text><path d="M 530 150 L 530 350 Q 560 368 590 350 L 590 150" fill="#f8fafc" stroke="#334155" stroke-width="2"/><rect x="532" y="230" width="56" height="122" fill="#e0f2fe"><animate attributeName="fill" keyTimes="0.0000;0.6214;0.6929;1.0000" values="#e0f2fe;#e0f2fe;#cbd5e1;#cbd5e1" dur="14s" begin="cb-play.begin+0s" fill="freeze"/></rect><text x="560" y="392" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">ethanoyl chloride</text><g><animate attributeName="opacity" keyTimes="0.0000;0.6929;0.7143;1.0000" values="0;0;1;1" dur="14s" begin="cb-play.begin+0s" fill="freeze"/><text x="560" y="414" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">instant white ppt; steamy HCl</text></g><path d="M 730 150 L 730 350 Q 760 368 790 350 L 790 150" fill="#f8fafc" stroke="#334155" stroke-width="2"/><rect x="732" y="230" width="56" height="122" fill="#e0f2fe"><animate attributeName="fill" keyTimes="0.0000;0.7500;0.8214;1.0000" values="#e0f2fe;#e0f2fe;#cbd5e1;#cbd5e1" dur="14s" begin="cb-play.begin+0s" fill="freeze"/></rect><text x="760" y="392" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">chloroethane</text><g><animate attributeName="opacity" keyTimes="0.0000;0.8214;0.8429;1.0000" values="0;0;1;1" dur="14s" begin="cb-play.begin+0s" fill="freeze"/><text x="760" y="414" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">white ppt after warming</text></g><path d="M 930 150 L 930 350 Q 960 368 990 350 L 990 150" fill="#f8fafc" stroke="#334155" stroke-width="2"/><rect x="932" y="230" width="56" height="122" fill="#e0f2fe"><animate attributeName="fill" keyTimes="0.0000;0.8929;0.9643;1.0000" values="#e0f2fe;#e0f2fe;#e0f2fe;#e0f2fe" dur="14s" begin="cb-play.begin+0s" fill="freeze"/></rect><text x="960" y="392" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">chlorobenzene</text><g><animate attributeName="opacity" keyTimes="0.0000;0.9643;0.9857;1.0000" values="0;0;1;1" dur="14s" begin="cb-play.begin+0s" fill="freeze"/><text x="960" y="414" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">no ppt</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.9286;0.9500;1.0000" values="0;0;1;1" dur="14s" begin="cb-play.begin+0s" fill="freeze"/><text x="755" y="460" text-anchor="middle" font-size="14" font-weight="800" fill="#b91c1c">acyl chloride > chloroalkane > chlorobenzene</text></g></g>
</svg>