ze="12" font-weight="700" fill="#475569">propanone</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.3538;0.3769;1.0000" values="0;0;1;1" dur="13s" begin="fg-play.begin+0s" fill="freeze"/><rect x="560" y="235" width="240" height="125" rx="16" fill="#fff" stroke="#ef4444" stroke-width="3"/><rect x="560" y="235" width="240" height="34" rx="16" fill="#ef4444"/><text x="680" y="258" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">carboxylic acid</text><text x="680" y="309" text-anchor="middle" font-size="20" font-weight="800" fill="#111827">–COOH</text><text x="680" y="341" text-anchor="middle" font-size="12" font-weight="700" fill="#475569">ethanoic acid</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.4000;0.4231;1.0000" values="0;0;1;1" dur="13s" begin="fg-play.begin+0s" fill="freeze"/><rect x="820" y="235" width="240" height="125" rx="16" fill="#fff" stroke="#ec4899" stroke-width="3"/><rect x="820" y="235" width="240" height="34" rx="16" fill="#ec4899"/><text x="940" y="258" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">ester</text><text x="940" y="309" text-anchor="middle" font-size="20" font-weight="800" fill="#111827">–COO–</text><text x="940" y="341" text-anchor="middle" font-size="12" font-weight="700" fill="#475569">ethyl ethanoate</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.4462;0.4692;1.0000" values="0;0;1;1" dur="13s" begin="fg-play.begin+0s" fill="freeze"/><rect x="40" y="380" width="240" height="125" rx="16" fill="#fff" stroke="#8b5cf6" stroke-width="3"/><rect x="40" y="380" width="240" height="34" rx="16" fill="#8b5cf6"/><text x="160" y="403" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">amine</text><text x="160" y="454" text-anchor="middle" font-size="20" font-weight="800" fill="#111827">–NH₂</text><text x="160" y="486" text-anchor="middle" font-size="12" font-weight="700" fill="#475569">ethylamine</text></g><g><animate attributeName="opacity" k