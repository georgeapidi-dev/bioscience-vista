<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" class="vd-svg" role="img" aria-labelledby="fg-title fg-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="fg-play" data-vd-play-label="Play: meet the families" data-vd-steps="[[0, &quot;Functional groups: the reactive part of an organic molecule.&quot;], [1, &quot;Each family is recognised by its functional group.&quot;], [9, &quot;Same functional group \u2192 same reactions, whatever the chain length.&quot;]]" data-vd-dur="13">
<title id="fg-title">Functional groups</title><desc id="fg-desc">Twelve organic families with their functional groups and a two-carbon example: alkane, alkene, halogenoalkane, alcohol, aldehyde, ketone, carboxylic acid, ester, amine, nitrile, acyl chloride and amide.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="560" fill="#ffffff"/>
<g aria-hidden="true"><animate id="fg-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<text class="head" x="30" y="34">Functional groups</text><text class="note" x="30" y="56">Family · functional group · example.</text>
