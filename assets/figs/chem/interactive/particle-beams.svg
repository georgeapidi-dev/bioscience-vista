<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 500" class="vd-svg" role="img" aria-labelledby="bm-title bm-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="bm-play" data-vd-play-label="Play: fire the beams" data-vd-steps="[[0, &quot;Sub-atomic particles in an electric field.&quot;], [1, &quot;Neutrons: no charge, straight through.&quot;], [4, &quot;Protons: bent slightly towards the negative plate.&quot;], [7, &quot;Electrons: bent sharply towards the positive plate: tiny mass.&quot;]]" data-vd-dur="12">
<title id="bm-title">Particle beams in an electric field</title><desc id="bm-desc">Beams of neutrons pass straight between charged plates, protons bend slightly towards the negative plate and electrons bend strongly towards the positive plate.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="500" fill="#ffffff"/>
<g aria-hidden="true"><animate id="bm-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<text class="head" x="30" y="34">Protons, neutrons and electrons in an electric field</text><text class="note" x="30" y="56">Deflection ∝ charge ÷ mass.</text>
<g class="part" data-part="src" data-name="Beams of particles" data-info="Beams of protons, neutrons and electrons pass between two charged plates." tabindex="0" role="button" aria-label="Beams of particles"><rect x="60" y="210" width="90" height="80" rx="10" fill="#e5e7eb" stroke="#334155" stroke-width="2"/><text x="105" y="256" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">source</text><rect x="330" y="120" width="400" height="22" fill="#fecaca" stroke="#b91c1c"/><text x="530" y="136" text-anchor="middle" font-size="14" font-weight="800" fill="#b91c1c">+ + + + + + +</text><rect x="330" y="360" width="400" height="22" fill="#bfdbfe" stroke="#1d4ed8"/><text x="530" y="376" text-anchor="middle" font-size="14" font-weight="800" fill="#1d4ed8">− − − − − − −</text></g>
<g class="part" data-part="n" data-name="Neutrons" data-info="No charge: not deflected." tabindex="0" role="button" aria-label="Neutrons"><clipPath id="bmn-c1060150"><rect x="150" y="60" width="900" height="400"><animate attributeName="width" keyTimes="0.0000;0.0833;0.2917;1.0000" values="0;0;900;900" dur="12s" begin="bm-play.begin+0s" fill="freeze"/></rect></clipPath><g clip-path="url(#bmn-c1060150)"><path d="M 150 250 L 1000 250" fill="none" stroke="#64748b" stroke-width="5"/></g><g><animate attributeName="opacity" keyTimes="0.0000;0.2500;0.2750;1.0000" values="0;0;1;1" dur="12s" begin="bm-play.begin+0s" fill="freeze"/><text x="830" y="244" text-anchor="start" font-size="14" font-weight="800" fill="#64748b">neutrons: no deflection</text></g></g>
<g class="part" data-part="p" data-name="Protons" data-info="Positive: deflected towards the negative plate, only slightly (large mass)." tabindex="0" role="button" aria-label="Protons"><clipPath id="bmp-c4060150"><rect x="150" y="60" width="900" height="400"><animate attributeName="width" keyTimes="0.0000;0.3333;0.5417;1.0000" values="0;0;900;900" dur="12s" begin="bm-play.begin+0s" fill="freeze"/></rect></clipPath><g clip-path="url(#bmp-c4060150)"><path d="M 150 250 L 330 250 Q 530 262 730 280 L 1000 300" fill="none" stroke="#dc2626" stroke-width="5"/></g><g><animate attributeName="opacity" keyTimes="0.0000;0.5000;0.5250;1.0000" values="0;0;1;1" dur="12s" begin="bm-play.begin+0s" fill="freeze"/><text x="830" y="318" text-anchor="start" font-size="14" font-weight="800" fill="#dc2626">protons: small deflection to −</text></g></g>
<g class="part" data-part="e" data-name="Electrons" data-info="Negative: deflected towards the positive plate, far more than protons (about 1/1836 of the mass). Angle of deflection is proportional to charge ÷ mass." tabindex="0" role="button" aria-label="Electrons"><clipPath id="bme-c7060150"><rect x="150" y="60" width="900" height="400"><animate attributeName="width" keyTimes="0.0000;0.5833;0.7917;1.0000" values="0;0;900;900" dur="12s" begin="bm-play.begin+0s" fill="freeze"/></rect></clipPath><g clip-path="url(#bme-c7060150)"><path d="M 150 250 L 330 250 Q 450 220 560 150" fill="none" stroke="#2563eb" stroke-width="5"/></g><g><animate attributeName="opacity" keyTimes="0.0000;0.7500;0.7750;1.0000" values="0;0;1;1" dur="12s" begin="bm-play.begin+0s" fill="freeze"/><text x="580" y="180" text-anchor="start" font-size="14" font-weight="800" fill="#2563eb">electrons: large deflection to +</text></g></g>
</svg>