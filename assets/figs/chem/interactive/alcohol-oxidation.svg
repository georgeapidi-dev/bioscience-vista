<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 580" class="vd-svg" role="img" aria-labelledby="ao-title ao-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="ao-play" data-vd-play-label="Play: oxidise" data-vd-steps="[[0, &quot;Oxidising alcohols with acidified potassium dichromate(VI).&quot;], [1, &quot;Primary: aldehyde (distil) then carboxylic acid (reflux).&quot;], [6, &quot;Secondary: ketone.&quot;], [9, &quot;Tertiary: no reaction, stays orange.&quot;], [12, &quot;Tri-iodomethane test: yellow precipitate for CH\u2083CH(OH)\u2013.&quot;]]" data-vd-dur="16">
<title id="ao-title">Oxidation of alcohols</title><desc id="ao-desc">Acidified dichromate turns from orange to green when it oxidises primary alcohols to aldehydes, by distillation, and to carboxylic acids under reflux, and secondary alcohols to ketones; tertiary alcohols do not react; the tri-iodomethane test gives a yellow precipitate.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="580" fill="#ffffff"/>
<g aria-hidden="true"><animate id="ao-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<defs><marker id="ao-475569" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="5.4" refY="6.0" orient="auto"><path d="M0,0 L12,6.0 L0,12 z" fill="#475569"/></marker></defs>
<text class="head" x="30" y="34">Oxidation of alcohols: orange to green</text><text class="note" x="30" y="56">[O] = oxygen from the oxidising agent.</text>
<g class="part" data-part="prim" data-name="Primary alcohols" data-info="Acidified K₂Cr₂O₇, heat: distil immediately → aldehyde; heat under reflux with excess oxidant → carboxylic acid." tabindex="0" role="button" aria-label="Primary alcohols"><g><animate attributeName="opacity" keyTimes="0.0000;0.0625;0.0813;1.0000" values="0;0;1;1" dur="16s" begin="ao-play.begin+0s" fill="freeze"/><path d="M 64 110 L 64 230 Q 90 246 116 230 L 116 110" fill="#f8fafc" stroke="#334155" stroke-width="2"/><rect x="66" y="150" width="48" height="82" fill="#f97316"><animate attributeName="fill" keyTimes="0.0000;0.1250;0.2188;1.0000" values="#f97316;#f97316;#16a34a;#16a34a" dur="16s" begin="ao-play.begin+0s" fill="freeze"/></rect><rect x="185.0" y="138.0" width="230" height="64" rx="12" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/><text x="300" y="168" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">CH₃CH₂OH → CH₃CHO</text><text x="300" y="186" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">distil: aldehyde</text><g><animate attributeName="opacity" keyTimes="0.0000;0.2500;0.2687;1.0000" values="0;0;1;1" dur="16s" begin="ao-play.begin+0s" fill="freeze"/><path d="M 415 170 L 520 170" stroke="#475569" stroke-width="3" marker-end="url(#ao-475569)"/><rect x="530.0" y="138.0" width="300" height="64" rx="12" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/><text x="680" y="168" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">→ CH₃COOH (carboxylic acid)</text><text x="680" y="186" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">reflux with excess oxidant</text></g><text x="90" y="270" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">primary</text></g></g>
<g class="part" data-part="sec" data-name="Secondary alcohols" data-info="Oxidised to ketones (no further oxidation)." tabindex="0" role="button" aria-label="Secondary alcohols"><g><animate attributeName="opacity" keyTimes="0.0000;0.3750;0.3937;1.0000" values="0;0;1;1" dur="16s" begin="ao-play.begin+0s" fill="freeze"/><path d="M 64 290 L 64 410 Q 90 426 116 410 L 116 290" fill="#f8fafc" stroke="#334155" stroke-width="2"/><rect x="66" y="330" width="48" height="82" fill="#f97316"><animate attributeName="fill" keyTimes="0.0000;0.4062;0.5000;1.0000" values="#f97316;#f97316;#16a34a;#16a34a" dur="16s" begin="ao-play.begin+0s" fill="freeze"/></rect><text x="90" y="450" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">secondary</text><rect x="185.0" y="318.0" width="230" height="64" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="300" y="348" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">CH₃CH(OH)CH₃ → CH₃COCH₃</text><text x="300" y="366" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">ketone</text></g></g>
<g class="part" data-part="tert" data-name="Tertiary alcohols" data-info="Not oxidised: the dichromate stays orange." tabindex="0" role="button" aria-label="Tertiary alcohols"><g><animate attributeName="opacity" keyTimes="0.0000;0.5625;0.5813;1.0000" values="0;0;1;1" dur="16s" begin="ao-play.begin+0s" fill="freeze"/><path d="M 540 290 L 540 410 Q 566 426 592 410 L 592 290" fill="#f8fafc" stroke="#334155" stroke-width="2"/><rect x="542" y="330" width="48" height="82" fill="#f97316"/><text x="566" y="450" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">tertiary</text><rect x="650.0" y="318.0" width="260" height="64" rx="12" fill="#f1f5f9" stroke="#475569" stroke-width="2"/><text x="780" y="348" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">(CH₃)₃COH: no reaction</text><text x="780" y="366" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">stays orange</text></g></g>
<g class="part" data-part="colour" data-name="Colour change" data-info="Cr₂O₇²⁻ (orange) is reduced to Cr³⁺ (green)." tabindex="0" role="button" aria-label="Colour change"><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.1875;0.2062;1.0000" values="0;0;1;1" dur="16s" begin="ao-play.begin+0s" fill="freeze"/><rect x="650.0" y="258" width="300" height="24" rx="12" fill="#dcfce7" stroke="#1f2937" stroke-width="1"/><text x="800" y="275" text-anchor="middle" font-size="12" font-weight="700">Cr₂O₇²⁻ (orange) → Cr³⁺ (green)</text></g></g>
<g class="part" data-part="iodo" data-name="Tri-iodomethane test" data-info="Alkaline I₂, warm: a yellow precipitate of CHI₃ (antiseptic smell) with CH₃CH(OH)– alcohols (ethanol, propan-2-ol) and methyl ketones/ethanal." tabindex="0" role="button" aria-label="Tri-iodomethane test"><g><animate attributeName="opacity" keyTimes="0.0000;0.7500;0.7688;1.0000" values="0;0;1;1" dur="16s" begin="ao-play.begin+0s" fill="freeze"/><rect x="40" y="480" width="1020" height="80" rx="14" fill="#fefce8" stroke="#fde047"/><text x="550" y="512" text-anchor="middle" font-size="14" font-weight="800" fill="#a16207">tri-iodomethane test: alkaline I₂, warm → yellow CHI₃ precipitate</text><text x="550" y="540" text-anchor="middle" font-size="12" font-weight="700" fill="#475569">positive for CH₃CH(OH)– (ethanol, propan-2-ol) and CH₃CO– (ethanal, methyl ketones)</text></g></g>
</svg>