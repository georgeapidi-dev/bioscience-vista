<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 540" class="vd-svg" role="img" aria-labelledby="es-title es-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="es-play" data-vd-play-label="Play: esterify" data-vd-steps="[[0, &quot;Esters: making and breaking them.&quot;], [1, &quot;Acid + alcohol, conc. H\u2082SO\u2084, reflux: ester + water.&quot;], [5.5, &quot;Name: alcohol part first, acid part second.&quot;], [8.5, &quot;Acid hydrolysis is reversible; alkaline hydrolysis goes to completion.&quot;]]" data-vd-dur="15">
<title id="es-title">Esters</title><desc id="es-desc">Ethanoic acid and ethanol react with a concentrated sulfuric acid catalyst to give ethyl ethanoate and water; naming takes the alcohol part first; acid hydrolysis is reversible while alkaline hydrolysis with sodium hydroxide goes to completion giving sodium ethanoate and ethanol.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="540" fill="#ffffff"/>
<g aria-hidden="true"><animate id="es-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<defs><marker id="es-475569" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="5.4" refY="6.0" orient="auto"><path d="M0,0 L12,6.0 L0,12 z" fill="#475569"/></marker></defs>
<text class="head" x="30" y="34">Esters: esterification and hydrolysis</text><text class="note" x="30" y="56">The water forms from OH of the acid and H of the alcohol.</text>
<g class="part" data-part="make" data-name="Esterification" data-info="Carboxylic acid + alcohol ⇌ ester + water, heated under reflux with concentrated H₂SO₄ as catalyst; reversible. Ethanoic acid + ethanol → ethyl ethanoate." tabindex="0" role="button" aria-label="Esterification"><rect x="50.0" y="125.0" width="260" height="70" rx="12" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/><text x="180" y="158" text-anchor="middle" font-size="18" font-weight="800" fill="#111827">CH₃COOH</text><text x="180" y="176" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">ethanoic acid</text><text x="330" y="168" text-anchor="middle" font-size="24" font-weight="800" fill="#111827">+</text><rect x="350.0" y="125.0" width="240" height="70" rx="12" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/><text x="470" y="158" text-anchor="middle" font-size="18" font-weight="800" fill="#111827">HOCH₂CH₃</text><text x="470" y="176" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">ethanol</text><g><animate attributeName="opacity" keyTimes="0.0000;0.1333;0.1533;1.0000" values="0;0;1;1" dur="15s" begin="es-play.begin+0s" fill="freeze"/><text x="680" y="150" text-anchor="middle" font-size="30" font-weight="800" fill="#111827">⇌</text><text x="680" y="186" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">conc. H₂SO₄, reflux</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.2333;0.2533;1.0000" values="0;0;1;1" dur="15s" begin="es-play.begin+0s" fill="freeze"/><rect x="760.0" y="125.0" width="280" height="70" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="900" y="158" text-anchor="middle" font-size="16" font-weight="800" fill="#111827">CH₃COOCH₂CH₃ + H₂O</text><text x="900" y="176" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">ethyl ethanoate</text></g></g>
<g class="part" data-part="name" data-name="Naming" data-info="Alcohol part first (ethyl), acid part second (ethanoate): ethyl ethanoate CH₃COOCH₂CH₃." tabindex="0" role="button" aria-label="Naming"><g><animate attributeName="opacity" keyTimes="0.0000;0.3667;0.3867;1.0000" values="0;0;1;1" dur="15s" begin="es-play.begin+0s" fill="freeze"/><rect x="300" y="240" width="500" height="80" rx="14" fill="#fff" stroke="#cbd5e1"/><text x="460" y="290" text-anchor="middle" font-size="26" font-weight="800" fill="#1d4ed8">ethyl</text><text x="640" y="290" text-anchor="middle" font-size="26" font-weight="800" fill="#b91c1c">ethanoate</text><text x="460" y="312" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">from the alcohol</text><text x="640" y="312" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">from the acid</text></g></g>
<g class="part" data-part="acid" data-name="Acid hydrolysis" data-info="Heat with dilute acid: reversible, gives the carboxylic acid and the alcohol." tabindex="0" role="button" aria-label="Acid hydrolysis"><g><animate attributeName="opacity" keyTimes="0.0000;0.5667;0.5867;1.0000" values="0;0;1;1" dur="15s" begin="es-play.begin+0s" fill="freeze"/><rect x="40" y="350" width="500" height="170" rx="16" fill="#fef2f2" stroke="#fecaca"/><text x="290" y="378" text-anchor="middle" font-size="14" font-weight="800" fill="#b91c1c">acid hydrolysis (dilute H₂SO₄, heat)</text><text x="290" y="420" text-anchor="middle" font-size="15" font-weight="800" fill="#111827">ester + H₂O ⇌ acid + alcohol</text><text x="290" y="460" text-anchor="middle" font-size="12" font-weight="700" fill="#475569">reversible: incomplete</text></g></g>
<g class="part" data-part="alk" data-name="Alkaline hydrolysis" data-info="Heat with NaOH(aq): goes to completion, gives the carboxylate salt and the alcohol. Fats + NaOH → soap (saponification) + glycerol." tabindex="0" role="button" aria-label="Alkaline hydrolysis"><g><animate attributeName="opacity" keyTimes="0.0000;0.6667;0.6867;1.0000" values="0;0;1;1" dur="15s" begin="es-play.begin+0s" fill="freeze"/><rect x="560" y="350" width="500" height="170" rx="16" fill="#f0fdf4" stroke="#86efac"/><text x="810" y="378" text-anchor="middle" font-size="14" font-weight="800" fill="#15803d">alkaline hydrolysis (NaOH(aq), heat)</text><text x="810" y="420" text-anchor="middle" font-size="14" font-weight="800" fill="#111827">ester + NaOH → CH₃COO⁻Na⁺ + alcohol</text><text x="810" y="460" text-anchor="middle" font-size="12" font-weight="700" fill="#475569">goes to completion · fats → soap + glycerol</text></g></g>
</svg>