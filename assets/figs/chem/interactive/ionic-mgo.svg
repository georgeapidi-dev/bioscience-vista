<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 640" class="vd-svg" role="img" aria-labelledby="ib-title ib-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="ib-play" data-vd-play-label="Play: transfer electrons" data-vd-steps="[[0, &quot;Ionic bonding in magnesium oxide.&quot;], [1, &quot;Magnesium has 2 outer electrons; oxygen has 6.&quot;], [3, &quot;Magnesium transfers its two outer electrons to oxygen.&quot;], [6.5, &quot;Mg\u00b2\u207a and O\u00b2\u207b ions form, both with full outer shells (2,8).&quot;], [9.5, &quot;The ions attract each other in a giant lattice.&quot;]]" data-vd-dur="14">
<title id="ib-title">Ionic bonding: magnesium oxide</title><desc id="ib-desc">Dot-and-cross diagrams: a magnesium atom transfers its two outer electrons to an oxygen atom, forming Mg2+ and O2- ions with full shells, which attract in a giant ionic lattice.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
