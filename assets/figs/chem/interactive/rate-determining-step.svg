<g class="part" data-part="rate" data-name="Rate equation from the mechanism" data-info="Species in the rate-determining step (and before it) appear in the rate equation: rate = k[NO₂][F₂], not [NO₂]²[F₂]." tabindex="0" role="button" aria-label="Rate equation from the mechanism"><g><animate attributeName="opacity" keyTimes="0.0000;0.7143;0.7357;1.0000" values="0;0;1;1" dur="14s" begin="rd-play.begin+0s" fill="freeze"/><rect x="40" y="290" width="440" height="190" rx="16" fill="#fef9c3" stroke="#eab308"/><text x="260" y="324" text-anchor="middle" font-size="22" font-weight="800" fill="#713f12">rate = k[NO₂][F₂]</text><text x="260" y="364" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">species in the slow step</text><text x="260" y="388" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">(and steps before it) appear</text><text x="260" y="428" text-anchor="middle" font-size="13" font-weight="800" fill="#b91c1c">stoichiometry ≠ orders</text><text x="260" y="452" text-anchor="middle" font-size="12" font-weight="700" fill="#475569">F does not appear (intermediate)</text></g></g>
</svg>