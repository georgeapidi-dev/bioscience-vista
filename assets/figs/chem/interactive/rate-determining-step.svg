<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" class="vd-svg" role="img" aria-labelledby="rd-title rd-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="rd-play" data-vd-play-label="Play: find the slow step" data-vd-steps="[[0, &quot;Rate-determining step.&quot;], [1, &quot;Two steps; the first is slow.&quot;], [5, &quot;The slow step has the larger activation energy.&quot;], [10, &quot;Rate equation: rate = k[NO\u2082][F\u2082].&quot;]]" data-vd-dur="14">
<title id="rd-title">The rate-determining step</title><desc id="rd-desc">A two-step mechanism for nitrogen dioxide and fluorine, an energy profile with two humps where the first has the higher activation energy and an intermediate in the trough between, and the rate equation from the slow step.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="560" fill="#ffffff"/>
<g aria-hidden="true"><animate id="rd-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<text class="head" x="30" y="34">The rate-determining step</text><text class="note" x="30" y="56">2NO₂ + F₂ → 2NO₂F (overall).</text>
<g class="part" data-part="mech" data-name="A two-step mechanism" data-info="2NO₂ + F₂ → 2NO₂F. Step 1 (slow): NO₂ + F₂ → NO₂F + F. Step 2 (fast): NO₂ + F → NO₂F." tabindex="0" role="button" aria-label="A two-step mechanism"><g><animate attributeName="opacity" keyTimes="0.0000;0.0714;0.0929;1.0000" values="0;0;1;1" dur="14s" begin="rd-play.begin+0s" fill="freeze"/><rect x="50.0" y="92.0" width="400" height="56" rx="12" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/><text x="250" y="124.66666666666667" text-anchor="middle" font-size="14" font-weight="800" fill="#111827">step 1 (slow): NO₂ + F₂ → NO₂F + F</text><rect x="50.0" y="162.0" width="400" height="56" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="250" y="194.66666666666666" text-anchor="middle" font-size="14" font-weight="800" fill="#111827">step 2 (fast): NO₂ + F → NO₂F</text></g></g>
<g class="part" data-part="prof" data-name="Energy profile" data-info="Each step has its own activation energy; the step with the highest barrier is slowest: the rate-determining step. F is an intermediate (in a trough between steps)." tabindex="0" role="button" aria-label="Energy profile"><line x1="520" y1="470" x2="1040" y2="470" stroke="#111827" stroke-width="2"/><line x1="520" y1="470" x2="520" y2="130" stroke="#111827" stroke-width="2"/><text x="780.0" y="498" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">reaction pathway</text><text x="504" y="300.0" transform="rotate(-90 504 300.0)" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">energy</text><clipPath id="rdc-c50126520"><rect x="520" y="126" width="524" height="348"><animate attributeName="width" keyTimes="0.0000;0.3571;0.6071;1.0000" values="0;0;524;524" dur="14s" begin="rd-play.begin+0s" fill="freeze"/></rect></clipPath><g clip-path="url(#rdc-c50126520)"><polyline points="520.0,385.0 522.6,385.0 525.2,385.0 527.8,385.0 530.4,385.0 533.0,384.9 535.6,384.9 538.2,384.9 540.8,384.8 543.4,384.8 546.0,384.7 548.6,384.6 551.2,384.5 553.8,384.4 556.4,384.2 559.0,384.0 561.6,383.7 564.2,383.3 566.8,382.8 569.4,382.3 572.0,381.6 574.6,380.7 577.2,379.7 579.8,378.5 582.4,377.1 585.0,375.4 587.6,373.4 590.2,371.1 592.8,368.4 595.4,365.3 598.0,361.8 600.6,357.8 603.2,353.4 605.8,348.5 608.4,343.0 611.0,337.1 613.6,330.6 616.2,323.6 618.8,316.2 621.4,308.4 624.0,300.2 626.6,291.6 629.2,282.9 631.8,274.0 634.4,265.1 637.0,256.3 639.6,247.7 642.2,239.4 644.8,231.6 647.4,224.3 650.0,217.8 652.6,212.0 655.2,207.1 657.8,203.3 660.4,200.5 663.0,198.8 665.6,198.2 668.2,198.9 670.8,200.6 673.4,203.5 676.0,207.5 678.6,212.4 681.2,218.3 683.8,224.9 686.4,232.3 689.0,240.3 691.6,248.7 694.2,257.5 696.8,266.6 699.4,275.7 702.0,284.8 704.6,293.9 707.2,302.7 709.8,311.3 712.4,319.6 715.0,327.5 717.6,335.0 720.2,342.1 722.8,348.8 725.4,355.0 728.0,360.8 730.6,366.2 733.2,371.2 735.8,375.9 73