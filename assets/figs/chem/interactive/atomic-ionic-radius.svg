<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" class="vd-svg" role="img" aria-labelledby="rd-title rd-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="rd-play" data-vd-play-label="Play: compare sizes" data-vd-steps="[[0, &quot;Atomic and ionic radius across Period 3.&quot;], [1, &quot;Atoms shrink across the period: more protons, same shielding.&quot;], [5.5, &quot;Cations are smaller than their atoms...&quot;], [9, &quot;...anions are larger.&quot;]]" data-vd-dur="13">
<title id="rd-title">Atomic and ionic radii in Period 3</title><desc id="rd-desc">Circles drawn to scale for Period 3 atoms decreasing from sodium to chlorine, positive ions much smaller than their atoms and negative ions larger.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="520" fill="#ffffff"/>
<g aria-hidden="true"><animate id="rd-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<text class="head" x="30" y="34">Atomic and ionic radius across Period 3</text><text class="note" x="30" y="56">Radii in pm (metallic / covalent / ionic); circles to scale.</text>
<g class="part" data-part="atoms" data-name="Atomic radius across Period 3" data-info="Decreases from Na to Cl: nuclear charge increases while shielding stays about the same, so electrons are pulled closer." tabindex="0" role="button" aria-label="Atomic radius across Period 3"><g><animate attributeName="opacity" keyTimes="0.0000;0.0769;0.1000;1.0000" values="0;0;1;1" dur="13s" begin="rd-play.begin+0s" fill="freeze"/><circle cx="100" cy="190" r="55" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/><text x="100" y="195" text-anchor="middle" font-size="14" font-weight="800" fill="#1e3a8a">Na</text><text x="100" y="268" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">186</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.1154;0.1385;1.0000" values="0;0;1;1" dur="13s" begin="rd-play.begin+0s" fill="freeze"/><circle cx="250" cy="190" r="47" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/><text x="250" y="195" text-anchor="middle" font-size="14" font-weight="800" fill="#1e3a8a">Mg</text><text x="250" y="268" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">160</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.1538;0.1769;1.0000" values="0;0;1;1" dur="13s" begin="rd-play.begin+0s" fill="freeze"/><circle cx="400" cy="190" r="42" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/><text x="400" y="195" text-anchor="middle" font-size="14" font-weight="800" fill="#1e3a8a">Al</text><text x="400" y="268" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">143</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.1923;0.2154;1.0000" values="0;0;1;1" dur="13s" begin="rd-play.begin+0s" fill="freeze"/><circle cx="550" cy="190" r="35" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/><text x="550" y="195" text-anchor="middle" font-size="14" font-weight="800" fill="#1e3a8a">Si</text><text x="550" y="268" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">118</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.2308;0.2538;1.0000" values="0;0;1;1" dur="13s" begin="rd-play.begin+0s" fill="freeze"/><circle cx="700" cy="190" r="32" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/><text x="700" y="195" text-anchor="middle" font-size="14" font-weight="800" fill="#1e3a8a">P</text><text x="700" y="268" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">110</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.2692;0.2923;1.0000" values="0;0;1;1" dur="13s" begin="rd-play.begin+0s" fill="freeze"/><circle cx="850" cy="190" r="31" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/><text x="850" y="195" text-anchor="middle" font-size="14" font-weight="800" fill="#1e3a8a">S</text><text x="850" y="268" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">104</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.3077;0.3308;1.0000" values="0;0;1;1" dur="13s" begin="rd-play.begin+0s" fill="freeze"/><circle cx="1000" cy="190" r="29" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/><text x="1000" y="195" text-anchor="middle" font-size="14" font-weight="800" fill="#1e3a8a">Cl</text><text x="1000" y="268" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">99</text></g><text x="40" y="195" text-anchor="start" font-size="12" font-weight="800" fill="#1d4ed8">atoms</text></g>
<g class="part" data-part="cat" data-name="Cations" data-info="Smaller than their atoms: a whole shell is lost and the remaining electrons are pulled in more strongly." tabindex="0" role="button" aria-label="Cations"><g><animate attributeName="opacity" keyTimes="0.0000;0.4231;0.4462;1.0000" values="0;0;1;1" dur="13s" begin="rd-play.begin+0s" fill="freeze"/><circle cx="100" cy="380" r="30" fill="#fde68a" stroke="#334155" stroke-width="2"/><text x="100" y="385" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">Na⁺</text><text x="100" y="470" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">102</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.4538;0.4769;1.0000" values="0;0;1;1" dur="13s" begin="rd-play.begin+0s" fill="freeze"/><circle cx="250" cy="380" r="21" fill="#fde68a" stroke="#334155" stroke-width="2"/><text x="250" y="385" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">Mg²⁺</text><text x="250" y="470" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">72</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.4846;0.5077;1.0000" values="0;0;1;1" dur="13s" begin="rd-play.begin+0s" fill="freeze"/><circle cx="400" cy="380" r="16" fill="#fde68a" stroke="#334155" stroke-width="2"/><text x="400" y="385" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">Al³⁺</text><text x="400" y="470" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">54</text></g><text x="40" y="385" text-anchor="start" font-size="12" font-weight="800" fill="#111827">ions</text></g>
<g class="part" data-part="an" data-name="Anions" data-info="Larger than their atoms: extra electrons repel each other in the same shell." tabindex="0" role="button" aria-label="Anions"><g><animate attributeName="opacity" keyTimes="0.0000;0.6923;0.7154;1.0000" values="0;0;1;1" dur="13s" begin="rd-play.begin+0s" fill="freeze"/><circle cx="700" cy="380" r="62" fill="#bbf7d0" stroke="#334155" stroke-width="2"/><text x="700" y="385" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">P³⁻</text><text x="700" y="470" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">212</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.7231;0.7462;1.0000" values="0;0;1;1" dur="13s" begin="rd-play.begin+0s" fill="freeze"/><circle cx="850" cy="380" r="54" fill="#bbf7d0" stroke="#334155" stroke-width="2"/><text x="850" y="385" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">S²⁻</text><text x="850" y="470" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">184</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.7538;0.7769;1.0000" values="0;0;1;1" dur="13s" begin="rd-play.begin+0s" fill="freeze"/><circle cx="1000" cy="380" r="53" fill="#bbf7d0" stroke="#334155" stroke-width="2"/><text x="1000" y="385" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">Cl⁻</text><text x="1000" y="470" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">181</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.8462;0.8692;1.0000" values="0;0;1;1" dur="13s" begin="rd-play.begin+0s" fill="freeze"/><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.8462;0.8692;1.0000" values="0;0;1;1" dur="13s" begin="rd-play.begin+0s" fill="freeze"/><rect x="380.0" y="488" width="340" height="24" rx="12" fill="#f1f5f9" stroke="#1f2937" stroke-width="1"/><text x="550" y="505" text-anchor="middle" font-size="12" font-weight="700">cations smaller than atoms · anions larger</text></g></g></g>
</svg>