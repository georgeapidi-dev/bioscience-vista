<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" class="vd-svg" role="img" aria-labelledby="sd-title sd-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="sd-play" data-vd-play-label="Play: distilling salt water" data-vd-steps="[[0, &quot;Salt water is heated in the flask.&quot;], [2, &quot;The water boils at 100 \u00b0C and turns to steam; the salt does not evaporate.&quot;], [4, &quot;The steam passes into the condenser, where cold water in the jacket cools it, so it condenses to liquid water.&quot;], [7, &quot;Pure water (the distillate) drips into the beaker. The salt is left behind in the flask.&quot;]]" data-vd-dur="12">
<title id="sd-title">Simple distillation</title><desc id="sd-desc">Apparatus: flask of salt water heated, thermometer at the side arm, Liebig condenser with water in at the bottom and out at the top, beaker of distillate.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1200" height="640" fill="#ffffff"/>
<g aria-hidden="true"><animate id="sd-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<defs><marker id="sd-0369a1" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#0369a1"/></marker><marker id="sd-475569" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#475569"/></marker></defs>
<text class="head" x="30" y="34">Simple distillation: pure water from salt water</text><text class="note" x="30" y="56">Laboratory apparatus, simplified.</text>
<g class="part" data-part="flask" data-name="Round-bottomed (distillation) flask" data-info="Holds the salt solution. Anti-bumping granules help it boil smoothly." tabindex="0" role="button" aria-label="Round-bottomed (distillation) flask"><path d="M 240 170 L 240 300 C 150 320 140 470 260 480 C 380 470 370 320 280 300 L 280 170 Z" fill="#f8fafc" stroke="#334155" stroke-width="3"/><path d="M 280 230 L 520 330" stroke="#334155" stroke-width="16" stroke-linecap="round"/><path d="M 280 230 L 520 330" stroke="#f8fafc" stroke-width="10" stroke-linecap="round"/></g>
<g><animate attributeName="opacity" keyTimes="0.0000;0.3333;0.9167;1.0000" values="1;1;0.75;0.75" dur="12s" begin="sd-play.begin+0s" fill="freeze"/><path d="M 168 390 C 160 440 190 476 260 478 C 330 476 360 440 352 390 Z" fill="#bae6fd"/></g>
<g class="part" data-part="salt" data-name="Salt left behind" data-info="Salt has a very high boiling point, so it stays in the flask as the water boils away." tabindex="0" role="button" aria-label="Salt left behind"><rect x="220" y="455" width="5" height="5" fill="#f8fafc" stroke="#64748b" stroke-width=".8" transform="rotate(20 220 455)"/><rect x="250" y="462" width="5" height="5" fill="#f8fafc" stroke="#64748b" stroke-width=".8" transform="rotate(20 250 462)"/><rect x="285" y="458" width="5" height="5" fill="#f8fafc" stroke="#64748b" stroke-width=".8" transform="rotate(20 285 458)"/><rect x="305" y="448" width="5" height="5" fill="#f8fafc" stroke="#64748b" stroke-width=".8" transform="rotate(20 305 448)"/><rect x="205" y="440" width="5" height="5" fill="#f8fafc" stroke="#64748b" stroke-width=".8" transform="rotate(20 205 440)"/><rect x="265" y="448" width="5" height="5" fill="#f8fafc" stroke="#64748b" stroke-width=".8" transform="rotate(20 265 448)"/></g>
<g class="part" data-part="therm" data-name="Thermometer" data-info="Bulb level with the side arm: it reads the temperature of the vapour going into the condenser (100 °C for water)." tabindex="0" role="button" aria-label="Thermometer"><rect x="253" y="100" width="14" height="140" rx="7" fill="#fff" stroke="#334155" stroke-width="2"/><circle cx="260" cy="236" r="8" fill="#ef4444"/><rect x="257" y="140" width="6" height="92" fill="#ef4444"><animate attributeName="y" values="190;190;140;140" keyTimes="0;0.083;0.200;1" dur="12s" begin="sd-play.begin+0s" fill="freeze"/><animate attributeName="height" values="42;42;92;92" keyTimes="0;0.083;0.200;1" dur="12s" begin="sd-play.begin+0s" fill="freeze"/></rect><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.2000;0.2250;1.0000" values="0;0;1;1" dur="12s" begin="sd-play.begin+0s" fill="freeze"/><rect x="298.0" y="118" width="64" height="24" rx="12" fill="#fee2e2" stroke="#1f2937" stroke-width="1"/><text x="330" y="135" text-anchor="middle" font-size="12" font-weight="700">100 °C</text></g></g>
<g class="part" data-part="heat" data-name="Heat" data-info="A Bunsen burner or heating mantle boils the solution." tabindex="0" role="button" aria-label="Heat"><rect x="235" y="530" width="50" height="60" fill="#94a3b8" stroke="#334155"/><path d="M 260 528 q -18 -30 0 -48 q 18 18 0 48" fill="#3b82f6" opacity=".8"/><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.0250;0.0500;1.0000" values="0;0;1;1" dur="12s" begin="sd-play.begin+0s" fill="freeze"/><path d="M 260 528 q -22 -36 0 -60 q 22 24 0 60" fill="#f97316" opacity=".7"/></g></g>
<g class="part" data-part="cond" data-name="Liebig condenser" data-info="A tube inside a water jacket. The vapour cools and condenses back to a liquid." tabindex="0" role="button" aria-label="Liebig condenser"><g transform="translate(520 330) rotate(22.62)"><rect x="20" y="-30" width="330" height="60" rx="14" fill="#e0f2fe" stroke="#0369a1" stroke-width="3"/><rect x="0" y="-7" width="400" height="14" fill="#fff" stroke="#334155" stroke-width="2"/></g></g>
<g class="part" data-part="win" data-name="Cold water in" data-info="Enters at the bottom, so the jacket fills completely and cooling is most efficient." tabindex="0" role="button" aria-label="Cold water in"><path d="M 800 545 L 800 478" stroke="#0369a1" stroke-width="10"/><path d="M 800 590 L 800 552" stroke="#0369a1" stroke-width="3" marker-end="url(#sd-0369a1)"/><text x="790" y="606" text-anchor="end" font-size="13" font-weight="700" fill="#0369a1">cold water in</text></g>
<g class="part" data-part="wout" data-name="Water out" data-info="Leaves at the top." tabindex="0" role="button" aria-label="Water out"><path d="M 580 324 L 580 270" stroke="#0369a1" stroke-width="10"/><path d="M 580 270 L 580 230" stroke="#0369a1" stroke-width="3" marker-end="url(#sd-0369a1)"/><text x="590" y="236" font-size="13" font-weight="700" fill="#0369a1">water out</text></g>
