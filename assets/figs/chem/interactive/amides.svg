<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 540" class="vd-svg" role="img" aria-labelledby="am-title am-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="am-play" data-vd-play-label="Play: amides" data-vd-steps="[[0, &quot;Amides.&quot;], [1, &quot;Made from acyl chlorides with ammonia or amines.&quot;], [5, &quot;Hydrolysed by acid or alkali.&quot;], [9, &quot;Not basic: the N lone pair is delocalised; the group is planar.&quot;], [12.5, &quot;LiAlH\u2084 reduces amides to amines.&quot;]]" data-vd-dur="15">
<title id="am-title">Amides</title><desc id="am-desc">Ethanoyl chloride reacting with ammonia to give ethanamide; hydrolysis of amides with acid or alkali; the nitrogen lone pair delocalised over the planar amide group so amides are not basic; reduction to amines with lithium aluminium hydride.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="540" fill="#ffffff"/>
<g aria-hidden="true"><animate id="am-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<text class="head" x="30" y="34">Amides</text><text class="note" x="30" y="56">Primary amide RCONH₂; secondary amide RCONHR'.</text>
<g class="part" data-part="make" data-name="Making amides" data-info="Acyl chloride + concentrated NH₃ → primary amide (ethanamide CH₃CONH₂); + a primary amine → secondary (N-substituted) amide, e.g. N-methylethanamide." tabindex="0" role="button" aria-label="Making amides"><g><animate attributeName="opacity" keyTimes="0.0000;0.0667;0.0867;1.0000" values="0;0;1;1" dur="15s" begin="am-play.begin+0s" fill="freeze"/><rect x="40.0" y="100.0" width="480" height="60" rx="12" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/><text x="280" y="128" text-anchor="middle" font-size="15" font-weight="800" fill="#111827">CH₃COCl + 2NH₃ → CH₃CONH₂ + NH₄Cl</text><text x="280" y="146" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">ethanamide</text><rect x="560.0" y="100.0" width="480" height="60" rx="12" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/><text x="800" y="128" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">CH₃COCl + CH₃NH₂ → CH₃CONHCH₃ + HCl</text><text x="800" y="146" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">N-methylethanamide</text></g></g>
<g class="part" data-part="hyd" data-name="Hydrolysis" data-info="Heat with dilute acid → carboxylic acid + ammonium salt; with NaOH(aq) → carboxylate salt + NH₃ (turns damp red litmus blue)." tabindex="0" role="button" aria-label="Hydrolysis"><g><animate attributeName="opacity" keyTimes="0.0000;0.3333;0.3533;1.0000" values="0;0;1;1" dur="15s" begin="am-play.begin+0s" fill="freeze"/><rect x="40.0" y="205.0" width="480" height="70" rx="12" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/><text x="280" y="238" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">acid: CH₃CONH₂ + H₂O + HCl → CH₃COOH + NH₄Cl</text><text x="280" y="256" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">heat under reflux</text><rect x="560.0" y="205.0" width="480" height="70" rx="12" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/><text x="800" y="238" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">alkali: CH₃CONH₂ + NaOH → CH₃COONa + NH₃</text><text x="800" y="256" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">NH₃ turns damp red litmus blue</text></g></g>
<g class="part" data-part="notbase" data-name="Not basic" data-info="The N lone pair is delocalised over N–C=O, so it is not available to accept H⁺; the C–N bond has partial double-bond character and the amide group is planar." tabindex="0" role="button" aria-label="Not basic"><circle cx="200" cy="420" r="18" fill="#374151" stroke="#1f2937" stroke-width="1.5"/><text x="200" y="425" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">C</text><line x1="204.0" y1="402.0" x2="204.0" y2="364.0" stroke="#334155" stroke-width="3"/><line x1="196.0" y1="402.0" x2="196.0" y2="364.0" stroke="#334155" stroke-width="3"/><circle cx="200" cy="350" r="18" fill="#ef4444" stroke="#1f2937" stroke-width="1.5"/><text x="200" y="355" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">O</text><line x1="218" y1="420" x2="262" y2="420" stroke="#334155" stroke-width="4"/><circle cx="280" cy="420" r="18" fill="#3b82f6" stroke="#1f2937" stroke-width="1.5"/><text x="280" y="425" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">N</text><line x1="298" y1="420" x2="330" y2="404" stroke="#334155" stroke-width="4"/><circle cx="338" cy="398" r="11" fill="#f8fafc" stroke="#1f2937" stroke-width="1.5"/><text x="338" y="403" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">H</text><line x1="298" y1="420" x2="330" y2="436" stroke="#334155" stroke-width="4"/><circle cx="338" cy="442" r="11" fill="#f8fafc" stroke="#1f2937" stroke-width="1.5"/><text x="338" y="447" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">H</text><line x1="182" y1="420" x2="150" y2="420" stroke="#334155" stroke-width="4"/><text x="126" y="425" text-anchor="middle" font-size="13" font-weight="800" fill="#713f12">CH₃</text><g><animate attributeName="opacity" keyTimes="0.0000;0.6000;0.6200;1.0000" values="0;0;1;1" dur="15s" begin="am-play.begin+0s" fill="freeze"/><ellipse cx="240" cy="400" rx="80" ry="54" fill="#a78bfa" opacity=".25"/><text x="280" y="392" text-anchor="middle" font-size="16" font-weight="800" fill="#7c3aed">••</text><text x="440" y="400" text-anchor="start" font-size="13" font-weight="800" fill="#6d28d9">N lone pair delocalised over N–C=O</text><text x="440" y="422" text-anchor="start" font-size="13" font-weight="800" fill="#6d28d9">→ not available for H⁺: amides are not basic</text><text x="440" y="444" text-anchor="start" font-size="13" font-weight="800" fill="#6d28d9">→ planar amide group, partial C=N character</text></g></g>
<g class="part" data-part="redn" data-name="Reduction" data-info="LiAlH₄ in dry ether reduces amides to amines: CH₃CONH₂ → CH₃CH₂NH₂." tabindex="0" role="button" aria-label="Reduction"><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.8333;0.8533;1.0000" values="0;0;1;1" dur="15s" begin="am-play.begin+0s" fill="freeze"/><rect x="360.0" y="498" width="380" height="24" rx="12" fill="#f1f5f9" stroke="#1f2937" stroke-width="1"/><text x="550" y="515" text-anchor="middle" font-size="12" font-weight="700">LiAlH₄ (dry ether): CH₃CONH₂ → CH₃CH₂NH₂</text></g></g>
</svg>