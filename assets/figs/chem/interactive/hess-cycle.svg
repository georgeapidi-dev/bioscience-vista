<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 540" class="vd-svg" role="img" aria-labelledby="hs-title hs-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="hs-play" data-vd-play-label="Play: take both routes" data-vd-steps="[[0, &quot;Hess&#x27;s law: the route does not matter.&quot;], [1, &quot;Direct route versus the indirect route through the elements.&quot;], [6, &quot;\u0394Hr = \u03a3\u0394Hf(products) \u2212 \u03a3\u0394Hf(reactants) = \u2212891 kJ mol\u207b\u00b9.&quot;], [11, &quot;With combustion data, arrows point down to CO\u2082 and H\u2082O.&quot;]]" data-vd-dur="15">
<title id="hs-title">Hess&#x27;s law energy cycle</title><desc id="hs-desc">An energy cycle for the combustion of methane: the direct route equals the route via the elements; using enthalpies of formation the enthalpy change is minus 891 kilojoules per mole.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="540" fill="#ffffff"/>
<g aria-hidden="true"><animate id="hs-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<defs><marker id="hs-1d4ed8" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="6.3" refY="7.0" orient="auto"><path d="M0,0 L14,7.0 L0,14 z" fill="#1d4ed8"/></marker><marker id="hs-dc2626" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="6.3" refY="7.0" orient="auto"><path d="M0,0 L14,7.0 L0,14 z" fill="#dc2626"/></marker><marker id="hs-16a34a" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="6.3" refY="7.0" orient="auto"><path d="M0,0 L14,7.0 L0,14 z" fill="#16a34a"/></marker></defs>
<text class="head" x="30" y="34">Hess's law: building an energy cycle</text><text class="note" x="30" y="56">ΔHf / kJ mol⁻¹: CH₄ −75, CO₂ −394, H₂O(l) −286; O₂ 0.</text>
<g class="part" data-part="route" data-name="Hess&#x27;s law" data-info="The enthalpy change of a reaction is independent of the route taken, as long as start and end are the same." tabindex="0" role="button" aria-label="Hess&#x27;s law"><rect x="100.0" y="120.0" width="300" height="60" rx="12" fill="#f8fafc" stroke="#111827" stroke-width="2"/><text x="250" y="156.0" text-anchor="middle" font-size="18" font-weight="800" fill="#111827">CH₄ + 2O₂</text><rect x="600.0" y="120.0" width="300" height="60" rx="12" fill="#f8fafc" stroke="#111827" stroke-width="2"/><text x="750" y="156.0" text-anchor="middle" font-size="18" font-weight="800" fill="#111827">CO₂ + 2H₂O</text><rect x="310.0" y="390.0" width="380" height="60" rx="12" fill="#f1f5f9" stroke="#111827" stroke-width="2"/><text x="500" y="425.3333333333333" text-anchor="middle" font-size="16" font-weight="800" fill="#111827">C + 2H₂ + 2O₂ (elements)</text><clipPath id="hsd-c10120400"><rect x="400" y="120" width="200" height="60"><animate attributeName="width" keyTimes="0.0000;0.0667;0.2000;1.0000" values="0;0;200;200" dur="15s" begin="hs-play.begin+0s" fill="freeze"/></rect></clipPath><g clip-path="url(#hsd-c10120400)"><path d="M 400 150 L 596 150" stroke="#1d4ed8" stroke-width="5" marker-end="url(#hs-1d4ed8)"/></g><g><animate attributeName="opacity" keyTimes="0.0000;0.0667;0.0867;1.0000" values="0;0;1;1" dur="15s" begin="hs-play.begin+0s" fill="freeze"/><text x="500" y="136" text-anchor="middle" font-size="16" font-weight="800" fill="#1d4ed8">ΔHr = ?</text></g></g>
<g class="part" data-part="form" data-name="Using ΔHf" data-info="ΔHr = ΣΔHf(products) − ΣΔHf(reactants). Example: CH₄ + 2O₂ → CO₂ + 2H₂O: ΔHf CH₄ −75, CO₂ −394, H₂O(l) −286 kJ mol⁻¹ → ΔHr = (−394 + 2(−286)) − (−75) = −891 kJ mol⁻¹." tabindex="0" role="button" aria-label="Using ΔHf"><clipPath id="hsa-c35180250"><rect x="250" y="180" width="260" height="240"><animate attributeName="width" keyTimes="0.0000;0.2333;0.3333;1.0000" values="0;0;260;260" dur="15s" begin="hs-play.begin+0s" fill="freeze"/></rect></clipPath><g clip-path="url(#hsa-c35180250)"><path d="M 420 390 L 290 182" stroke="#dc2626" stroke-width="4" marker-end="url(#hs-dc2626)"/></g><g><animate attributeName="opacity" keyTimes="0.0000;0.2667;0.2867;1.0000" values="0;0;1;1" dur="15s" begin="hs-play.begin+0s" fill="freeze"/><text x="260" y="300" text-anchor="end" font-size="16" font-weight="800" fill="#b91c1c">−75</text><text x="260" y="320" text-anchor="end" font-size="11" font-weight="800" fill="#b91c1c">ΔHf (reactants)</text></g><clipPath id="hsb-c50180580"><rect x="580" y="180" width="200" height="240"><animate attributeName="width" keyTimes="0.0000;0.3333;0.4333;1.0000" values="0;0;200;200" dur="15s" begin="hs-play.begin+0s" fill="freeze"/></rect></clipPath><g clip-path="url(#hsb-c50180580)"><path d="M 580 390 L 710 182" stroke="#16a34a" stroke-width="4" marker-end="url(#hs-16a34a)"/></g><g><animate attributeName="opacity" keyTimes="0.0000;0.3667;0.3867;1.0000" values="0;0;1;1" dur="15s" begin="hs-play.begin+0s" fill="freeze"/><text x="740" y="300" text-anchor="start" font-size="16" font-weight="800" fill="#15803d">−394 + 2(−286)</text><text x="740" y="320" text-anchor="start" font-size="11" font-weight="800" fill="#15803d">ΔHf (products)</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.4000;0.4200;1.0000" values="0;0;1;1" dur="15s" begin="hs-play.begin+0s" fill="freeze"/><rect x="300" y="200" width="400" height="80" rx="14" fill="#fef9c3" stroke="#eab308"/><text x="500" y="230" text-anchor="middle" font-size="15" font-weight="800" fill="#111827">ΔHr = (−394 − 572) − (−75)</text><text x="500" y="262" text-anchor="middle" font-size="18" font-weight="800" fill="#b45309">= −891 kJ mol⁻¹</text></g></g>
<g class="part" data-part="comb" data-name="Using ΔHc" data-info="For ΔHf of a compound you cannot make directly: ΔHf = ΣΔHc(reactants) − ΣΔHc(products), cycle going down to combustion products." tabindex="0" role="button" aria-label="Using ΔHc"><g><animate attributeName="opacity" keyTimes="0.0000;0.7333;0.7533;1.0000" values="0;0;1;1" dur="15s" begin="hs-play.begin+0s" fill="freeze"/><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.7333;0.7533;1.0000" values="0;0;1;1" dur="15s" begin="hs-play.begin+0s" fill="freeze"/><rect x="200.0" y="503" width="700" height="24" rx="12" fill="#f1f5f9" stroke="#1f2937" stroke-width="1"/><text x="550" y="520" text-anchor="middle" font-size="12" font-weight="700">ΔHc cycles: arrows point DOWN to CO₂ + H₂O; ΔHf = ΣΔHc(reactants) − ΣΔHc(product)</text></g></g></g>
</svg>