<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 600" class="vd-svg" role="img" aria-labelledby="pl-title pl-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="pl-play" data-vd-play-label="Play: link the monomers" data-vd-steps="[[0, &quot;Addition polymerisation of ethene.&quot;], [1, &quot;Many ethene monomers, each with a C=C double bond.&quot;], [4, &quot;The double bonds open and the monomers join end to end.&quot;], [8, &quot;The polymer: poly(ethene), shown by its repeat unit.&quot;], [11, &quot;All atoms end up in the product: 100% atom economy.&quot;]]" data-vd-dur="14">
<title id="pl-title">Addition polymerisation</title><desc id="pl-desc">Ethene monomers with carbon–carbon double bonds join by addition polymerisation: the double bonds open and the monomers link into a long poly(ethene) chain, shown with its repeat unit; 100% atom economy.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1220" height="600" fill="#ffffff"/>
<g aria-hidden="true"><animate id="pl-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<text class="head" x="30" y="34">Addition polymerisation: ethene → poly(ethene)</text><text class="note" x="30" y="56">Only four monomers shown; real chains have thousands.</text>
<defs><marker id="pl-475569" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="6.3" refY="7.0" orient="auto"><path d="M0,0 L14,7.0 L0,14 z" fill="#475569"/></marker></defs>
<g class="part" data-part="mono" data-name="Monomer: ethene" data-info="Small molecules with a C=C double bond." tabindex="0" role="button" aria-label="Monomer: ethene"><g><animate attributeName="opacity" keyTimes="0.0000;0.0714;0.0929;0.2857;0.3071;1.0000" values="0;0;1;1;0;0" dur="14s" begin="pl-play.begin+0s" fill="freeze"/><text x="195" y="150" text-anchor="middle" font-size="12" font-weight="800" fill="#b91c1c">C=C</text></g><text x="610" y="330" text-anchor="middle" font-size="13" font-weight="700" fill="#000"></text></g>
<g class="part" data-part="pi" data-name="Double bond opens" data-info="The π bond of each C=C breaks and each carbon forms a new single bond to the next monomer." tabindex="0" role="button" aria-label="Double bond opens"><g transform="translate(0 0)"><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.2857;0.5000;1.0000" values="0 0;0 0;0 0;0 0" dur="14s" begin="pl-play.begin+0s" fill="freeze"/><g><animate attributeName="opacity" keyTimes="0.0000;0.2857;0.3571;1.0000" values="1;1;0;0" dur="14s" begin="pl-play.begin+0s" fill="freeze"/><line x1="160" y1="215" x2="230" y2="215" stroke="#dc2626" stroke-width="4"/></g><line x1="160" y1="225" x2="230" y2="225" stroke="#111827" stroke-width="4"/><line x1="160" y1="220" x2="160" y2="170" stroke="#111827" stroke-width="3"/><line x1="160" y1="220" x2="160" y2="270" stroke="#111827" stroke-width="3"/><line x1="230" y1="220" x2="230" y2="170" stroke="#111827" stroke-width="3"/><line x1="230" y1="220" x2="230" y2="270" stroke="#111827" stroke-width="3"/><circle cx="160" cy="220" r="16" fill="#374151" stroke="#111827"/><text x="160" y="225" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">C</text><circle cx="230" cy="220" r="16" fill="#374151" stroke="#111827"/><text x="230" y="225" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">C</text><circle cx="160" cy="170" r="11" fill="#f3f4f6" stroke="#111827"/><text x="160" y="174" text-anchor="middle" font-size="10" font-weight="800" fill="#111827">H</text><circle cx="160" cy="270" r="11" fill="#f3f4f6" stroke="#111827"/><text x="160" y="274" text-anchor="middle" font-size="10" font-weight="800" fill="#111827">H</text><circle cx="230" cy="170" r="11" fill="#f3f4f6" stroke="#111827"/><text x="230" y="174" text-anchor="middle" font-size="10" font-weight="800" fill="#111827">H</text><circle cx="230" cy="270" r="11" fill="#f3f4f6" stroke="#111827"/><text x="230" y="274" text-anchor="middle" font-size="10" font-weight="800" fill