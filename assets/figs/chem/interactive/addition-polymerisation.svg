" font-size="10" font-weight="800" fill="#111827">H</text><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.3929;0.4643;1.0000" values="0;0;1;1" dur="14s" begin="pl-play.begin+0s" fill="freeze"/><line x1="486" y1="220" x2="624" y2="220" stroke="#16a34a" stroke-width="4"/></g></g><g transform="translate(100 0)"><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.2857;0.5000;1.0000" values="100 0;100 0;0 0;0 0" dur="14s" begin="pl-play.begin+0s" fill="freeze"/><g><animate attributeName="opacity" keyTimes="0.0000;0.2857;0.3571;1.0000" values="1;1;0;0" dur="14s" begin="pl-play.begin+0s" fill="freeze"/><line x1="640" y1="215" x2="710" y2="215" stroke="#dc2626" stroke-width="4"/></g><line x1="640" y1="225" x2="710" y2="225" stroke="#111827" stroke-width="4"/><line x1="640" y1="220" x2="640" y2="170" stroke="#111827" stroke-width="3"/><line x1="640" y1="220" x2="640" y2="270" stroke="#111827" stroke-width="3"/><line x1="710" y1="220" x2="710" y2="170" stroke="#111827" stroke-width="3"/><line x1="710" y1="220" x2="710" y2="270" stroke="#111827" stroke-width="3"/><circle cx="640" cy="220" r="16" fill="#374151" stroke="#111827"/><text x="640" y="225" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">C</text><circle cx="710" cy="220" r="16" fill="#374151" stroke="#111827"/><text x="710" y="225" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">C</text><circle cx="640" cy="170" r="11" fill="#f3f4f6" stroke="#111827"/><text x="640" y="174" text-anchor="middle" font-size="10" font-weight="800" fill="#111827">H</text><circle cx="640" cy="270" r="11" fill="#f3f4f6" stroke="#111827"/><text x="640" y="274" text-anchor="middle" font-size="10" font-weight="800" fill="#111827">H</text><circle cx="710" cy="170" r="11" fill="#f3f4f6" stroke="#111827"/><text x="710" y="174" text-anchor="middle" font-size="10" font-weight="800" fill="#111827">H</text><circle cx="710" cy="270" r="11" fill="#f3f4f6" stroke="#111827"/><text x="710" y="274" text-anchor="middle" font-size="10" font-weight="800" fill="#111827">H</text><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.3929;0.4643;1.0000" values="0;0;1;1" dur="14s" begin="pl-play.begin+0s" fill="freeze"/><line x1="726" y1="220" x2="864" y2="220" stroke="#16a34a" stroke-width="4"/></g></g><g transform="translate(150 0)"><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.2857;0.5000;1.0000" values="150 0;150 0;0 0;0 0" dur="14s" begin="pl-play.begin+0s" fill="freeze"/><g><animate attributeName="opacity" keyTimes="0.0000;0.2857;0.3571;1.0000" values="1;1;0;0" dur="14s" begin="pl-play.begin+0s" fill="freeze"/><line x1="880" y1="215" x2="950" y2="215" stroke="#dc2626" stroke-width="4"/></g><line x1="880" y1="225" x2="950" y2="225" stroke="#111827" stroke-width="4"/><line x1="880" y1="220" x2="880" y2="170" stroke="#111827" stroke-width="3"/><line x1="880" y1="220" x2="880" y2="270" stroke="#111827" stroke-width="3"/><line x1="950" y1="220" x2="950" y2="170" stroke="#111827" stroke-width="3"/><line x1="950" y1="220" x2="950" y2="270" stroke="#111827" stroke-width="3"/><circle cx="880" cy="220" r="16" fill="#374151" stroke="#111827"/><text x="880" y="225" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">C</text><circle cx="950" cy="220" r="16" fill="#374151" stroke="#111827"/><text x="950" y="225" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">C</text><circle cx="880" cy="170" r="11" fill="#f3f4f6" stroke="#111827"/><text x="880" y="174" text-anchor="middle" font-size="10" font-weight="800" fill="#111827">H</text><circle cx="880" cy="270" r="11" fill="#f3f4f6" stroke="#111827"/><text x="880" y="274" text-anchor="middle" font-size="10" font-weight="800" fill="#111827">H</text><circle cx="950" cy="170" r="11" fill="#f3f4f6" stroke="#111827"/><text x="950" y="174" text-anchor="middle" font-size="10" font-weight="800" fill="#111827">H</text><circle cx="950" cy="270" r="11" fill="#f3f4f6" stroke="#111827"/><text x="950" y="274" text-anchor="middle" font-size="10" font-weight="800" fill="#111827">H</text><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.3929;0.4643;1.0000" values="0;0;1;1" dur="14s" begin="pl-play.begin+0s" fill="freeze"/></g></g><g><animate attributeName="opacity" keyTimes="0.0000;0.2857;0.3071;1.0000" values="0;0;1;1" dur="14s" begin="pl-play.begin+0s" fill="freeze"/><text x="610" y="140" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">π bonds break (red) → new C–C single bonds join the monomers (green)</text></g></g>
<g class="part" data-part="rep" data-name="Repeat unit" data-info="The bracketed unit –CH₂–CH₂– repeated n times: n CH₂=CH₂ → –[CH₂–CH₂]ₙ–." tabindex="0" role="button" aria-label="Repeat unit"><g><animate attributeName="opacity" keyTimes="0.0000;0.5714;0.5929;1.0000" values="0;0;1;1" dur="14s" begin="pl-play.begin+0s" fill="freeze"/><rect x="40" y="380" width="700" height="190" rx="16" fill="#f8fafc" stroke="#cbd5e1"/><text x="390" y="408" text-anchor="middle" font-size="15" font-weight="800" fill="#111827">The equation</text><text x="150" y="470" text-anchor="middle" font-size="22" font-weight="800" fill="#111827">n</text><text x="230" y="470" text-anchor="middle" font-size="22" font-weight="800" fill="#111827">CH₂=CH₂</text><path d="M 330 462 L 400 462" stroke="#475569" stroke-width="3" marker-end="url(#pl-475569)"/><text x="420" y="472" font-size="40" font-weight="300">[</text><text x="520" y="470" text-anchor="middle" font-size="22" font-weight="800" fill="#111827">–CH₂–CH₂–</text><text x="610" y="472" font-size="40" font-weight="300">]</text><text x="632" y="482" text-anchor="start" font-size="16" font-weight="800" fill="#111827">n</text><text x="520" y="510" text-anchor="middle" font-size="13" font-weight="800" fill="#1d4ed8">repeat unit</text><text x="230" y="510" text-anchor="middle" font-size="13" font-weight="800" fill="#475569">monomer</text><text x="390" y="550" text-anchor="middle" font-size="12" font-weight="700" fill="#475569">monomer: ethene   →   polymer: poly(ethene)</text></g></g>
<g class="part" data-part="chain" data-name="Polymer: poly(ethene)" data-info="A long saturated chain of thousands of carbon atoms." tabindex="0" role="button" aria-label="Polymer: poly(ethene)"><g><animate attributeName="opacity" keyTimes="0.0000;0.5000;0.5214;1.0000" values="0;0;1;1" dur="14s" begin="pl-play.begin+0s" fill="freeze"/><path d="M 60 300 L 1160 300" stroke="#16a34a" stroke-width="2" stroke-dasharray="6 5"/><text x="610" y="322" text-anchor="middle" font-size="13" font-weight="800" fill="#15803d">one long chain: …–CH₂–CH₂–CH₂–CH₂–…</text></g></g>
<g class="part" data-part="atom" data-name="100% atom economy" data-info="Every atom of the monomers ends up in the polymer: no by-products." tabindex="0" role="button" aria-label="100% atom economy"><g><animate attributeName="opacity" keyTimes="0.0000;0.7857;0.8071;1.0000" values="0;0;1;1" dur="14s" begin="pl-play.begin+0s" fill="freeze"/><rect x="780" y="380" width="400" height="190" rx="16" fill="#f0fdf4" stroke="#86efac"/><text x="980" y="410" text-anchor="middle" font-size="16" font-weight="800" fill="#166534">100% atom economy</text><text x="980" y="442" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">every atom of the monomers is</text><text x="980" y="464" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">in the polymer: no by-products</text><text x="980" y="500" text-anchor="middle" font-size="12" font-weight="700" fill="#475569">other examples:</text><text x="980" y="522" text-anchor="middle" font-size="12" font-weight="600" fill="#475569">propene → poly(propene)</text><text x="980" y="542" text-anchor="middle" font-size="12" font-weight="600" fill="#475569">chloroethene → PVC</text></g></g>
</svg>