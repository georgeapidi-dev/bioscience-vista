<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" class="vd-svg" role="img" aria-labelledby="ca3-title ca3-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="ca3-play" data-vd-play-label="Play: add chlorine" data-vd-steps="[[0, &quot;Chlorine-substituted ethanoic acids.&quot;], [1, &quot;Each Cl lowers pKa: a stronger acid.&quot;], [7, &quot;Cl withdraws electrons and stabilises the carboxylate ion.&quot;]]" data-vd-dur="13">
<title id="ca3-title">Chloroethanoic acids</title><desc id="ca3-desc">Bar chart of pKa values for ethanoic acid 4.76, chloroethanoic acid 2.86, dichloroethanoic acid 1.29 and trichloroethanoic acid 0.65, explained by chlorine atoms withdrawing electron density and stabilising the carboxylate ion.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="520" fill="#ffffff"/>
<g aria-hidden="true"><animate id="ca3-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<defs><marker id="ca3-16a34a" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="4.5" refY="5.0" orient="auto"><path d="M0,0 L10,5.0 L0,10 z" fill="#16a34a"/></marker></defs>
<text class="head" x="30" y="34">Why chlorine-substituted acids are stronger</text><text class="note" x="30" y="56">Lower pKa = stronger acid.</text>
<g class="part" data-part="pka" data-name="pKa values" data-info="CH₃COOH 4.76; ClCH₂COOH 2.86; Cl₂CHCOOH 1.29; Cl₃CCOOH 0.65. Each Cl makes the acid stronger." tabindex="0" role="button" aria-label="pKa values"><text x="330" y="100" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">pKa</text><line x1="30" y1="460" x2="650" y2="460" stroke="#111827" stroke-width="2"/><rect x="70" y="174" width="105" height="286" fill="#94a3b8" stroke="#334155"><animate attributeName="height" keyTimes="0.0000;0.0769;0.1231;1.0000" values="0;0;285.59999999999997;285.59999999999997" dur="13s" begin="ca3-play.begin+0s" fill="freeze"/><animate attributeName="y" keyTimes="0.0000;0.0769;0.1231;1.0000" values="460;460;174.40000000000003;174.40000000000003" dur="13s" begin="ca3-play.begin+0s" fill="freeze"/></rect><g><animate attributeName="opacity" keyTimes="0.0000;0.1231;0.1462;1.0000" values="0;0;1;1" dur="13s" begin="ca3-play.begin+0s" fill="freeze"/><text x="122.5" y="166.40000000000003" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">4.76</text></g><text x="122.5" y="478" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">CH₃COOH</text><rect x="215" y="288" width="105" height="172" fill="#86efac" stroke="#334155"><animate attributeName="height" keyTimes="0.0000;0.1692;0.2154;1.0000" values="0;0;171.6;171.6" dur="13s" begin="ca3-play.begin+0s" fill="freeze"/><animate attributeName="y" keyTimes="0.0000;0.1692;0.2154;1.0000" values="460;460;288.4;288.4" dur="13s" begin="ca3-play.begin+0s" fill="freeze"/></rect><g><animate attributeName="opacity" keyTimes="0.0000;0.2154;0.2385;1.0000" values="0;0;1;1" dur="13s" begin="ca3-play.begin+0s" fill="freeze"/><text x="267.5" y="280.4" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">2.86</text></g><text x="267.5" y="478" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">ClCH₂COOH</text><rect x="360" y="383" width="105" height="77" fill="#22c55e" stroke="#334155"><animate attributeName="height" keyTimes="0.0000;0.2615;0.3077;1.0000" values="0;0;77.4;77.4" dur="13s" begin="ca3-play.begin+0s" fill="freeze"/><animate attributeName="y" keyTimes="0.0000;0.2615;0.3077;1.0000" values="460;460;382.6;382.6" dur="13s" begin="ca3-play.begin+0s" fill="freeze"/></rect><g><animate attributeName="opacity" keyTimes="0.0000;0.3077;0.3308;1.0000" values="0;0;1;1" dur="13s" begin="ca3-play.begin+0s" fill="freeze"/><text x="412.5" y="374.6" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">1.29</text></g><text x="412.5" y="478" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">Cl₂CHCOOH</text><rect x="505" y="421" width="105" height="39" fill="#15803d" stroke="#334155"><animate attributeName="height" keyTimes="0.0000;0.3538;0.4000;1.0000" values="0;0;39.0;39.0" dur="13s" begin="ca3-play.begin+0s" fill="freeze"/><animate attributeName="y" keyTimes="0.0000;0.3538;0.4000;1.0000" values="460;460;421.0;421.0" dur="13s" begin="ca3-play.begin+0s" fill="freeze"/></rect><g><animate attributeName="opacity" keyTimes="0.0000;0.4000;0.4231;1.0000" values="0;0;1;1" dur="13s" begin="ca3-play.begin+0s" fill="freeze"/><text x="557.5" y="413.0" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">0.65</text></g><text x="557.5" y="478" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">Cl₃CCOOH</text></g>
<g class="part" data-part="why" data-name="Electron-withdrawing Cl" data-info="Cl atoms pull electron density away from the COO⁻ group (negative inductive effect), spreading the negative charge and stabilising the anion, so the acid dissociates more. Alkyl groups do the opposite: propanoic acid is weaker than ethanoic acid." tabindex="0" role="button" aria-label="Electron-withdrawing Cl"><g><animate attributeName="opacity" keyTimes="0.0000;0.5385;0.5615;1.0000" values="0;0;1;1" dur="13s" begin="ca3-play.begin+0s" fill="freeze"/><rect x="690" y="100" width="390" height="360" rx="16" fill="#f0fdf4" stroke="#86efac"/><text x="885" y="130" text-anchor="middle" font-size="15" font-weight="800" fill="#15803d">stabilising the anion</text><circle cx="800" cy="270" r="18" fill="#374151" stroke="#1f2937" stroke-width="1.5"/><text x="800" y="275" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">C</text><line x1="818" y1="270" x2="862" y2="270" stroke="#334155" stroke-width="4"/><circle cx="880" cy="270" r="18" fill="#374151" stroke="#1f2937" stroke-width="1.5"/><text x="880" y="275" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">C</text><line x1="900.1730051126291" y1="265.3582806286086" x2="934.1730051126291" y2="243.3582806286086" stroke="#334155" stroke-width="3"/><line x1="895.8269948873709" y1="258.6417193713914" x2="929.8269948873709" y2="236.6417193713914" stroke="#334155" stroke-width="3"/><circle cx="946" cy="232" r="18" fill="#ef4444" stroke="#1f2937" stroke-width="1.5"/><text x="946" y="237" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">O</text><line x1="898" y1="278" x2="932" y2="300" stroke="#334155" stroke-width="4"/><circle cx="946" cy="308" r="18" fill="#ef4444" stroke="#1f2937" stroke-width="1.5"/><text x="946" y="313" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">O</text><text x="972" y="300" text-anchor="middle" font-size="22" font-weight="800" fill="#1d4ed8">−</text><line x1="800" y1="270" x2="760" y2="234" stroke="#334155" stroke-width="4"/><circle cx="752.0" cy="226.8" r="14" fill="#22c55e" stroke="#1f2937" stroke-width="1.5"/><text x="752.0" y="231.8" text-anchor="middle" font-size="10" font-weight="800" fill="#052e16">Cl</text><line x1="800" y1="270" x2="750" y2="270" stroke="#334155" stroke-width="4"/><circle cx="740.0" cy="270.0" r="14" fill="#22c55e" stroke="#1f2937" stroke-width="1.5"/><text x="740.0" y="275.0" text-anchor="middle" font-size="10" font-weight="800" fill="#052e16">Cl</text><line x1="800" y1="270" x2="760" y2="306" stroke="#334155" stroke-width="4"/><circle cx="752.0" cy="313.2" r="14" fill="#22c55e" stroke="#1f2937" stroke-width="1.5"/><text x="752.0" y="318.2" text-anchor="middle" font-size="10" font-weight="800" fill="#052e16">Cl</text><path d="M 870 248 L 826 248" stroke="#16a34a" stroke-width="3" stroke-dasharray="4 3" marker-end="url(#ca3-16a34a)"/><text x="885" y="380" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">Cl pulls electron density away from COO⁻</text><text x="885" y="404" text-anchor="middle" font-size="12" font-weight="800" fill="#15803d">→ charge spread → anion more stable</text><text x="885" y="428" text-anchor="middle" font-size="12" font-weight="800" fill="#15803d">→ more dissociation → stronger acid</text></g></g>
</svg>