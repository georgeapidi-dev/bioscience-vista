<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 540" class="vd-svg" role="img" aria-labelledby="ak-title ak-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="ak-play" data-vd-play-label="Play: crack and burn" data-vd-steps="[[0, &quot;Alkanes: cracking and combustion.&quot;], [1, &quot;Cracking: a long alkane breaks into a shorter alkane and an alkene.&quot;], [6, &quot;Complete combustion gives CO\u2082 and water; incomplete gives CO and soot.&quot;], [10.5, &quot;Catalytic converters remove CO and NO.&quot;]]" data-vd-dur="15">
<title id="ak-title">Alkanes: cracking, combustion and pollution</title><desc id="ak-desc">Decane cracking over a hot catalyst into octane and ethene; complete combustion giving carbon dioxide and water and incomplete combustion giving carbon monoxide and soot; a catalytic converter removing carbon monoxide and nitrogen monoxide.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="540" fill="#ffffff"/>
<g aria-hidden="true"><animate id="ak-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<text class="head" x="30" y="34">Alkanes: cracking, combustion and pollution</text><text class="note" x="30" y="56">Beads = carbon atoms.</text>
<g class="part" data-part="crack" data-name="Cracking" data-info="Long-chain alkanes are broken into shorter alkanes and alkenes, using heat and a catalyst (zeolite / Al₂O₃): e.g. C₁₀H₂₂ → C₈H₁₈ + C₂H₄. Makes more petrol and alkenes for polymers." tabindex="0" role="button" aria-label="Cracking"><rect x="30" y="80" width="1040" height="170" rx="16" fill="#f8fafc" stroke="#cbd5e1"/><text x="550" y="104" text-anchor="middle" font-size="14" font-weight="800" fill="#111827">cracking: C₁₀H₂₂ → C₈H₁₈ + C₂H₄ (heat + zeolite catalyst)</text><g transform="translate(140 180)"><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.1333;0.2667;1.0000" values="140 180;140 180;560 180;560 180" dur="15s" begin="ak-play.begin+0s" fill="freeze"/><circle r="14" fill="#374151"/></g><g transform="translate(174 180)"><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.1333;0.2667;1.0000" values="174 180;174 180;594 180;594 180" dur="15s" begin="ak-play.begin+0s" fill="freeze"/><circle r="14" fill="#374151"/></g><g transform="translate(208 180)"><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.1333;0.2667;1.0000" values="208 180;208 180;628 180;628 180" dur="15s" begin="ak-play.begin+0s" fill="freeze"/><circle r="14" fill="#374151"/></g><g transform="translate(242 180)"><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.1333;0.2667;1.0000" values="242 180;242 180;662 180;662 180" dur="15s" begin="ak-play.begin+0s" fill="freeze"/><circle r="14" fill="#374151"/></g><g transform="translate(276 180)"><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.1333;0.2667;1.0000" values="276 180;276 180;696 180;696 180" dur="15s" begin="ak-play.begin+0s" fill="freeze"/><circle r="14" fill="#374151"/></g><g transform="translate(310 180)"><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.1333;0.2667;1.0000" values="310 180;310 180;730 180;730 180" dur="15s" begin="ak-play.begin+0s" fill="freeze"/><circle r="14" fill="#374151"/></g><g transform="translate(344 180)"><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.1333;0.2667;1.0000" values="344 180;344 180;764 180;764 180" dur="15s" begin="ak-play.begin+0s" fill="freeze"/><circle r="14" fill="#374151"/></g><g transform="translate(378 180)"><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.1333;0.2667;1.0000" values="378 180;378 180;798 180;798 180" dur="15s" begin="ak-play.begin+0s" fill="freeze"/><circle r="14" fill="#374151"/></g><g transform="translate(412 180)"><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.1333;0.2667;1.0000" values="412 180;412 180;840 180;840 180" dur="15s" begin="ak-play.begin+0s" fill="freeze"/><circle r="14" fill="#374151"/></g><g transform="translate(446 180)"><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.1333;0.2667;1.0000" values="446 180;446 180;880 180;880 180" dur="15s" begin="ak-play.begin+0s" fill="freeze"/><circle r="14" fill="#374151"/></g><g><animate attributeName="opacity" keyTimes="0.0000;0.2667;0.2867;1.0000" values="0;0;1;1" dur="15s" begin="ak-play.begin+0s" fill="freeze"/><text x="680" y="225" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">octane (petrol)</text><line x1="862" y1="172" x2="862" y2="188" stroke="#fff" stroke-width="3"/><text x="860" y="225" text-anchor="middle" font-size="12" font-weight="800" fill="#16a34a">ethene (C=C)</text></g></g>
<g class="part" data-part="comb" data-name="Combustion" data-info="Complete: alkane + O₂ → CO₂ + H₂O. Incomplete (limited O₂): CO and C (soot)." tabindex="0" role="button" aria-label="Combustion"><rect x="30" y="270" width="510" height="250" rx="16" fill="#fff7ed" stroke="#fdba74"/><text x="285" y="294" text-anchor="middle" font-size="14" font-weight="800" fill="#c2410c">combustion</text><g><animate attributeName="opacity" keyTimes="0.0000;0.4000;0.4200;1.0000" values="0;0;1;1" dur="15s" begin="ak-play.begin+0s" fill="freeze"/><text x="285" y="340" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">complete: C₈H₁₈ + 12½O₂ → 8CO₂ + 9H₂O</text><text x="285" y="390" text-anchor="middle" font-size="13" font-weight="800" fill="#b91c1c">incomplete (less O₂): CO and C (soot)</text><text x="285" y="440" text-anchor="middle" font-size="12" font-weight="700" fill="#475569">CO: toxic, binds haemoglobin</text><text x="285" y="470" text-anchor="middle" font-size="12" font-weight="700" fill="#475569">soot: particulates, global dimming</text></g></g>
<g class="part" data-part="pol" data-name="Pollutants from engines" data-info="CO (toxic), unburnt hydrocarbons, NO and NO₂ (from N₂ + O₂ at high temperature): removed by catalytic converters: 2CO + 2NO → 2CO₂ + N₂." tabindex="0" role="button" aria-label="Pollutants from engines"><rect x="560" y="270" width="510" height="250" rx="16" fill="#f0fdf4" stroke="#86efac"/><text x="815" y="294" text-anchor="middle" font-size="14" font-weight="800" fill="#15803d">catalytic converter (Pt/Rh/Pd)</text><rect x="700" y="330" width="230" height="110" rx="20" fill="#d1d5db" stroke="#475569" stroke-width="2"/><line x1="710" y1="335" x2="710" y2="435" stroke="#9ca3af" stroke-width="3"/><line x1="732" y1="335" x2="732" y2="435" stroke="#9ca3af" stroke-width="3"/><line x1="754" y1="335" x2="754" y2="435" stroke="#9ca3af" stroke-width="3"/><line x1="776" y1="335" x2="776" y2="435" stroke="#9ca3af" stroke-width="3"/><line x1="798" y1="335" x2="798" y2="435" stroke="#9ca3af" stroke-width="3"/><line x1="820" y1="335" x2="820" y2="435" stroke="#9ca3af" stroke-width="3"/><line x1="842" y1="335" x2="842" y2="435" stroke="#9ca3af" stroke-width="3"/><line x1="864" y1="335" x2="864" y2="435" stroke="#9ca3af" stroke-width="3"/><line x1="886" y1="335" x2="886" y2="435" stroke="#9ca3af" stroke-width="3"/><line x1="908" y1="335" x2="908" y2="435" stroke="#9ca3af" stroke-width="3"/><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.7000;0.7133;0.8200;0.8333;1.0000" values="0;0;1;1;0;0" dur="15s" begin="ak-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.7000;0.8000;1.0000" values="600 385;600 385;980 385;980 385" dur="15s" begin="ak-play.begin+0s" fill="freeze"/><g><circle r="9" fill="#f97316"/></g></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.7200;0.7333;0.8400;0.8533;1.0000" values="0;0;1;1;0;0" dur="15s" begin="ak-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.7200;0.8200;1.0000" values="600 385;600 385;980 385;980 385" dur="15s" begin="ak-play.begin+0s" fill="freeze"/><g><circle r="9" fill="#64748b"/></g></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.7400;0.7533;0.8600;0.8733;1.0000" values="0;0;1;1;0;0" dur="15s" begin="ak-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.7400;0.8400;1.0000" values="600 385;600 385;980 385;980 385" dur="15s" begin="ak-play.begin+0s" fill="freeze"/><g><circle r="9" fill="#f97316"/></g></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.7600;0.7733;0.8800;0.8933;1.0000" values="0;0;1;1;0;0" dur="15s" begin="ak-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.7600;0.8600;1.0000" values="600 385;600 385;980 385;980 385" dur="15s" begin="ak-play.begin+0s" fill="freeze"/><g><circle r="9" fill="#64748b"/></g></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.7800;0.7933;0.9000;0.9133;1.0000" values="0;0;1;1;0;0" dur="15s" begin="ak-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.7800;0.8800;1.0000" values="600 385;600 385;980 385;980 385" dur="15s" begin="ak-play.begin+0s" fill="freeze"/><g><circle r="9" fill="#f97316"/></g></g></g><g><animate attributeName="opacity" keyTimes="0.0000;0.7333;0.7533;1.0000" values="0;0;1;1" dur="15s" begin="ak-play.begin+0s" fill="freeze"/><text x="815" y="470" text-anchor="middle" font-size="14" font-weight="800" fill="#15803d">2CO + 2NO → 2CO₂ + N₂</text><text x="815" y="496" text-anchor="middle" font-size="12" font-weight="700" fill="#475569">unburnt hydrocarbons → CO₂ + H₂O</text></g></g>
</svg>