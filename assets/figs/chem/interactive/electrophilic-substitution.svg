<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" class="vd-svg" role="img" aria-labelledby="es2-title es2-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="es2-play" data-vd-play-label="Play: nitrate benzene" data-vd-steps="[[0, &quot;Electrophilic substitution: nitration of benzene.&quot;], [1, &quot;Sulfuric acid helps make the nitronium ion, NO\u2082\u207a.&quot;], [5, &quot;\u03c0 electrons attack NO\u2082\u207a: an intermediate with a broken ring of delocalisation.&quot;], [10, &quot;C\u2013H electrons return to the ring: H\u207a is lost and delocalisation restored.&quot;], [14, &quot;Keep below about 55 \u00b0C.&quot;]]" data-vd-dur="17">
<title id="es2-title">Electrophilic substitution: nitration</title><desc id="es2-desc">Formation of the nitronium ion from nitric and sulfuric acids, attack of the benzene pi system on NO2+ forming a positively charged intermediate, and loss of H+ to restore the delocalised ring giving nitrobenzene.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="560" fill="#ffffff"/>
<g aria-hidden="true"><animate id="es2-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<defs><marker id="es2-dc2626" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="5.4" refY="6.0" orient="auto"><path d="M0,0 L12,6.0 L0,12 z" fill="#dc2626"/></marker><marker id="es2-475569" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="5.4" refY="6.0" orient="auto"><path d="M0,0 L12,6.0 L0,12 z" fill="#475569"/></marker></defs>
<text class="head" x="30" y="34">Electrophilic substitution: nitration of benzene</text><text class="note" x="30" y="56">Conc. HNO₃ + conc. H₂SO₄, below 55 °C.</text>
<g class="part" data-part="elec" data-name="Making the electrophile" data-info="Concentrated HNO₃ + concentrated H₂SO₄: HNO₃ + 2H₂SO₄ → NO₂⁺ + H₃O⁺ + 2HSO₄⁻. The nitronium ion NO₂⁺ is the electrophile." tabindex="0" role="button" aria-label="Making the electrophile"><g><animate attributeName="opacity" keyTimes="0.0000;0.0588;0.0765;1.0000" values="0;0;1;1" dur="17s" begin="es2-play.begin+0s" fill="freeze"/><rect x="170.0" y="82.0" width="760" height="56" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="550" y="115.33333333333333" text-anchor="middle" font-size="16" font-weight="800" fill="#111827">HNO₃ + 2H₂SO₄ → NO₂⁺ + H₃O⁺ + 2HSO₄⁻</text></g></g>
<g class="part" data-part="attack" data-name="Attack on the ring" data-info="Two electrons from the delocalised π system bond to NO₂⁺: an intermediate cation in which the ring&#x27;s delocalisation is partly broken (horseshoe, + charge)." tabindex="0" role="button" aria-label="Attack on the ring"><polygon points="180.0,284.0 219.8,307.0 219.8,353.0 180.0,376.0 140.2,353.0 140.2,307.0" fill="#fff" stroke="#111827" stroke-width="4"/><circle cx="180" cy="330" r="28" fill="none" stroke="#111827" stroke-width="3"/><g transform="translate(180 220)"><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.2941;0.3824;1.0000" values="120 200;120 200;180 226;180 226" dur="17s" begin="es2-play.begin+0s" fill="freeze"/><text x="0" y="5" text-anchor="middle" font-size="18" font-weight="800" fill="#7c3aed">NO₂⁺</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.3824;0.4000;1.0000" values="0;0;1;1" dur="17s" begin="es2-play.begin+0s" fill="freeze"/><path d="M 192 304 Q 220 270 194 246" fill="none" stroke="#dc2626" stroke-width="3" marker-end="url(#es2-dc2626)"/></g></g>
<g><animate attributeName="opacity" keyTimes="0.0000;0.4412;0.4588;1.0000" values="0;0;1;1" dur="17s" begin="es2-play.begin+0s" fill="freeze"/><rect x="360" y="190" width="300" height="290" rx="16" fill="#fef2f2" stroke="#fecaca"/><polygon points="510.0,294.0 549.8,317.0 549.8,363.0 510.0,386.0 470.2,363.0 470.2,317.0" fill="#fff" stroke="#111827" stroke-width="4"/><path d="M 476 352 A 34 34 0 1 1 544 352" fill="none" stroke="#111827" stroke-width="3"/><text x="510" y="356" text-anchor="middle" font-size="20" font-weight="800" fill="#b91c1c">+</text><line x1="510" y1="294" x2="510" y2="264" stroke="#111827" stroke-width="4"/><text x="510.0" y="262.0" text-anchor="middle" font-size="15" font-weight="800" fill="#111827">H</text><line x1="510" y1="294" x2="548" y2="270" stroke="#111827" stroke-width="4"/><text x="578" y="268" text-anchor="middle" font-size="15" font-weight="800" fill="#7c3aed">NO₂</text><text x="510" y="456" text-anchor="middle" font-size="12" font-weight="800" fill="#b91c1c">intermediate (delocalisation broken)</text></g>
<g class="part" data-part="loss" data-name="Losing H⁺" data-info="The C–H bond electrons return to the ring, restoring the stable delocalised system: nitrobenzene + H⁺. H⁺ + HSO₄⁻ → H₂SO₄ regenerates the catalyst." tabindex="0" role="button" aria-label="Losing H⁺"><g><animate attributeName="opacity" keyTimes="0.0000;0.5882;0.6059;1.0000" values="0;0;1;1" dur="17s" begin="es2-play.begin+0s" fill="freeze"/><path d="M 500 284 Q 470 300 490 316" fill="none" stroke="#dc2626" stroke-width="3" marker-end="url(#es2-dc2626)"/></g><g><animate attributeName="opacity" keyTimes="0.0000;0.6471;0.6647;1.0000" values="0;0;1;1" dur="17s" begin="es2-play.begin+0s" fill="freeze"/><rect x="700" y="190" width="360" height="290" rx="16" fill="#f0fdf4" stroke="#86efac"/><polygon points="860.0,304.0 899.8,327.0 899.8,373.0 860.0,396.0 820.2,373.0 820.2,327.0" fill="#fff" stroke="#111827" stroke-width="4"/><circle cx="860" cy="350" r="28" fill="none" stroke="#111827" stroke-width="3"/><line x1="860" y1="304" x2="860" y2="268" stroke="#111827" stroke-width="4"/><text x="860.0" y="266.0" text-anchor="middle" font-size="15" font-weight="800" fill="#7c3aed">NO₂</text><text x="860" y="440" text-anchor="middle" font-size="15" font-weight="800" fill="#15803d">nitrobenzene + H⁺</text><text x="860" y="462" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">H⁺ + HSO₄⁻ → H₂SO₄ (catalyst back)</text><path d="M 665 330 L 698 330" stroke="#475569" stroke-width="3" marker-end="url(#es2-475569)"/></g></g>
<g class="part" data-part="cond" data-name="Conditions" data-info="Below 55–60 °C to avoid further nitration (1,3-dinitrobenzene). Substitution, not addition, because it keeps the delocalised ring." tabindex="0" role="button" aria-label="Conditions"><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.8235;0.8412;1.0000" values="0;0;1;1" dur="17s" begin="es2-play.begin+0s" fill="freeze"/><rect x="340.0" y="513" width="420" height="24" rx="12" fill="#fef3c7" stroke="#1f2937" stroke-width="1"/><text x="550" y="530" text-anchor="middle" font-size="12" font-weight="700">keep below ~55 °C: hotter gives 1,3-dinitrobenzene</text></g></g>
</svg>