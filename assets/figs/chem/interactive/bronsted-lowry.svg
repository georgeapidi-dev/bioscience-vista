d">−</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.6571;0.6786;1.0000" values="0;0;1;1" dur="14s" begin="bl2-play.begin+0s" fill="freeze"/><ellipse cx="678" cy="488" rx="16" ry="10" fill="#e5e7eb" stroke="#64748b"/></g><g><animate attributeName="opacity" keyTimes="0.0000;0.6643;0.6857;1.0000" values="0;0;1;1" dur="14s" begin="bl2-play.begin+0s" fill="freeze"/><ellipse cx="718" cy="488" rx="16" ry="10" fill="#e5e7eb" stroke="#64748b"/></g><g><animate attributeName="opacity" keyTimes="0.0000;0.6714;0.6929;1.0000" values="0;0;1;1" dur="14s" begin="bl2-play.begin+0s" fill="freeze"/><ellipse cx="758" cy="488" rx="16" ry="10" fill="#e5e7eb" stroke="#64748b"/></g><g><animate attributeName="opacity" keyTimes="0.0000;0.6786;0.7000;1.0000" values="0;0;1;1" dur="14s" begin="bl2-play.begin+0s" fill="freeze"/><ellipse cx="798" cy="488" rx="16" ry="10" fill="#e5e7eb" stroke="#64748b"/></g><g><animate attributeName="opacity" keyTimes="0.0000;0.6857;0.7071;1.0000" values="0;0;1;1" dur="14s" begin="bl2-play.begin+0s" fill="freeze"/><ellipse cx="838" cy="488" rx="16" ry="10" fill="#e5e7eb" stroke="#64748b"/></g><g><animate attributeName="opacity" keyTimes="0.0000;0.6929;0.7143;1.0000" values="0;0;1;1" dur="14s" begin="bl2-play.begin+0s" fill="freeze"/><ellipse cx="878" cy="488" rx="16" ry="10" fill="#e5e7eb" stroke="#64748b"/></g><g><animate attributeName="opacity" keyTimes="0.0000;0.7000;0.7214;1.0000" values="0;0;1;1" dur="14s" begin="bl2-play.begin+0s" fill="freeze"/><ellipse cx="918" cy="488" rx="16" ry="10" fill="#e5e7eb" stroke="#64748b"/></g><g><animate attributeName="opacity" keyTimes="0.0000;0.7071;0.7286;1.0000" values="0;0;1;1" dur="14s" begin="bl2-play.begin+0s" fill="freeze"/><ellipse cx="958" cy="488" rx="16" ry="10" fill="#e5e7eb" stroke="#64748b"/></g></g>
