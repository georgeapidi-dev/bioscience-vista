<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 540" class="vd-svg" role="img" aria-labelledby="bl2-title bl2-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="bl2-play" data-vd-play-label="Play: pass the proton" data-vd-steps="[[0, &quot;Br\u00f8nsted\u2013Lowry acids and bases.&quot;], [1, &quot;HCl donates a proton to water.&quot;], [5, &quot;Conjugate pairs differ by one H\u207a.&quot;], [9, &quot;Strong acids dissociate fully; weak acids only partly.&quot;]]" data-vd-dur="14">
<title id="bl2-title">Brønsted–Lowry acids and bases</title><desc id="bl2-desc">Hydrogen chloride donates a proton to water forming chloride and oxonium ions, with the two conjugate acid-base pairs, and particle pictures of a strong acid fully dissociated compared with a weak acid mostly undissociated.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="540" fill="#ffffff"/>
<g aria-hidden="true"><animate id="bl2-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<text class="head" x="30" y="34">Brønsted–Lowry acids and bases</text><text class="note" x="30" y="56">Acid = proton donor; base = proton acceptor.</text>
<g class="part" data-part="def" data-name="Brønsted–Lowry" data-info="An acid is a proton (H⁺) donor; a base is a proton acceptor." tabindex="0" role="button" aria-label="Brønsted–Lowry"><circle cx="180" cy="200" r="18" fill="#22c55e" stroke="#1f2937" stroke-width="1.5"/><text x="180" y="205" text-anchor="middle" font-size="10" font-weight="800" fill="#052e16">Cl</text><line x1="180" y1="200" x2="220" y2="200" stroke="#334155" stroke-width="4"/><circle cx="260" cy="200" r="18" fill="#ef4444" stroke="#1f2937" stroke-width="1.5"/><text x="260" y="205" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">O</text><line x1="260" y1="200" x2="290" y2="230" stroke="#334155" stroke-width="4"/><circle cx="290" cy="230" r="13" fill="#f8fafc" stroke="#1f2937" stroke-width="1.5"/><text x="290" y="235" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">H</text><line x1="260" y1="200" x2="290" y2="170" stroke="#334155" stroke-width="4"/><circle cx="290" cy="170" r="13" fill="#f8fafc" stroke="#1f2937" stroke-width="1.5"/><text x="290" y="175" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">H</text><g transform="translate(222 200)"><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.0714;0.2143;1.0000" values="222 200;222 200;240 150;240 150" dur="14s" begin="bl2-play.begin+0s" fill="freeze"/><circle cx="0" cy="0" r="11" fill="#f8fafc" stroke="#1f2937" stroke-width="1.5"/><text x="0" y="5" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">H</text></g><text x="180" y="270" text-anchor="middle" font-size="13" font-weight="800" fill="#b91c1c">acid</text><text x="270" y="280" text-anchor="middle" font-size="13" font-weight="800" fill="#1d4ed8">base</text><g><animate attributeName="opacity" keyTimes="0.0000;0.2143;0.2357;1.0000" values="0;0;1;1" dur="14s" begin="bl2-play.begin+0s" fill="freeze"/><text x="500" y="205" text-anchor="middle" font-size="30" font-weight="800" fill="#111827">→</text><text x="700" y="205" text-anchor="middle" font-size="22" font-weight="800" fill="#111827">Cl⁻   +   H₃O⁺</text></g></g>
<g class="part" data-part="pairs" data-name="Conjugate pairs" data-info="HCl + H₂O → Cl⁻ + H₃O⁺: HCl/Cl⁻ and H₃O⁺/H₂O are conjugate acid–base pairs." tabindex="0" role="button" aria-label="Conjugate pairs"><g><animate attributeName="opacity" keyTimes="0.0000;0.3571;0.3786;1.0000" values="0;0;1;1" dur="14s" begin="bl2-play.begin+0s" fill="freeze"/><path d="M 180 300 Q 420 360 640 230" fill="none" stroke="#b91c1c" stroke-width="3" stroke-dasharray="6 4"/><path d="M 270 300 Q 520 380 770 230" fill="none" stroke="#1d4ed8" stroke-width="3" stroke-dasharray="6 4"/><text x="420" y="360" text-anchor="middle" font-size="12" font-weight="800" fill="#b91c1c">conjugate pair: HCl / Cl⁻</text><text x="560" y="390" text-anchor="middle" font-size="12" font-weight="800" fill="#1d4ed8">conjugate pair: H₃O⁺ / H₂O</text></g></g>
<g class="part" data-part="sw" data-name="Strong and weak" data-info="Strong acids (HCl) dissociate fully; weak acids (CH₃COOH) only partly: an equilibrium lies to the left. Same concentration → higher pH and slower reactions for the weak acid." tabindex="0" role="button" aria-label="Strong and weak"><rect x="40" y="410" width="460" height="120" rx="14" fill="#f8fafc" stroke="#cbd5e1"/><text x="270" y="432" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">strong: HCl (all ionised)</text><g><animate attributeName="opacity" keyTimes="0.0000;0.6429;0.6643;1.0000" values="0;0;1;1" dur="14s" begin="bl2-play.begin+0s" fill="freeze"/><circle cx="90" cy="480" r="9" fill="#fca5a5"/><text x="90" y="484" text-anchor="middle" font-size="10" font-weight="800" fill="#7f1d1d">+</text><circle cx="106" cy="498" r="9" fill="#bbf7d0"/><text x="106" y="502" text-anchor="middle" font-size="10" font-weight="800" fill="#14532d">−</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.6500;0.6714;1.0000" values="0;0;1;1" dur="14s" begin="bl2-play.begin+0s" fill="freeze"/><circle cx="130" cy="480" r="9" fill="#fca5a5"/><text x="130" y="484" text-anchor="middle" font-size="10" font-weight="800" fill="#7f1d1d">+</text><circle cx="146" cy="498" r="9" fill="#bbf7d0"/><text x="146" y="502" text-anchor="middle" font-size="10" font-weight="800" fill="#14532d">−</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.6571;0.6786;1.0000" values="0;0;1;1" dur="14s" begin="bl2-play.begin+0s" fill="freeze"/><circle cx="170" cy="480" r="9" fill="#fca5a5"/><text x="170" y="484" text-anchor="middle" font-size="10" font-weight="800" fill="#7f1d1d">+</text><circle cx="186" cy="498" r="9" fill="#bbf7d0"/><text x="186" y="502" text-anchor="middle" font-size="10" font-weight="800" fill="#14532d">−</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.6643;0.6857;1.0000" values="0;0;1;1" dur="14s" begin="bl2-play.begin+0s" fill="freeze"/><circle cx="210" cy="480" r="9" fill="#fca5a5"/><text x="210" y="484" text-anchor="middle" font-size="10" font-weight="800" fill="#7f1d1d">+</text><circle cx="226" cy="498" r="9" fill="#bbf7d0"/><text x="226" y="502" text-anchor="middle" font-size="10" font-weight="800" fill="#14532d">−</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.6714;0.6929;1.0000" values="0;0;1;1" dur="14s" begin="bl2-play.begin+0s" fill="freeze"/><circle cx="250" cy="480" r="9" fill="#fca5a5"/><text x="250" y="484" text-anchor="middle" font-size="10" font-weight="800" fill="#7f1d1d">+</text><circle cx="266" cy="498" r="9" fill="#bbf7d0"/><text x="266" y="502" text-anchor="middle" font-size="10" font-weight="800" fill="#14532d">−</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.6786;0.7000;1.0000" values="0;0;1;1" dur="14s" begin="bl2-play.begin+0s" fill="freeze"/><circle cx="290" cy="480" r="9" fill="#fca5a5"/><text x="290" y="484" text-anchor="middle" font-size="10" font-weight="800" fill="#7f1d1d">+</text><circle cx="306" cy="498" r="9" fill="#bbf7d0"/><text x="306" y="502" text-anchor="middle" font-size="10" font-weight="800" fill="#14532d">−</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.6857;0.7071;1.0000" values="0;0;1;1" dur="14s" begin="bl2-play.begin+0s" fill="freeze"/><circle cx="330" cy="480" r="9" fill="#fca5a5"/><text x="330" y="484" text-anchor="middle" font-size="10" font-weight="800" fill="#7f1d1d">+</text><circle cx="346" cy="498" r="9" fill="#bbf7d0"/><text x="346" y="502" text-anchor="middle" font-size="10" font-weight="800" fill="#14532d">−</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.6929;0.7143;1.0000" values="0;0;1;1" dur="14s" begin="bl2-play.begin+0s" fill="freeze"/><circle cx="370" cy="480" r="9" fill="#fca5a5"/><text x="370" y="484" text-anchor="middle" font-size="10" font-weight="800" fill="#7f1d1d">+</text><circle cx="386" cy="498" r="9" fill="#bbf7d0"/><text x="386" y="502" text-anchor="middle" font-size="10" font-we