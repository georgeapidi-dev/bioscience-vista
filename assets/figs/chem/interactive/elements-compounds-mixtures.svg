<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" class="vd-svg" role="img" aria-labelledby="ecm-title ecm-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="ecm-play" data-vd-play-label="Play: build the particles" data-vd-steps="[[0, &quot;Three kinds of substance, drawn as particles.&quot;], [1, &quot;Element: one type of atom.&quot;], [4, &quot;Compound: different atoms chemically joined.&quot;], [7, &quot;Mixture: substances not joined together.&quot;]]" data-vd-dur="12">
<title id="ecm-title">Elements, compounds and mixtures</title><desc id="ecm-desc">Particle diagrams: an element with one kind of atom, a compound with two kinds of atom joined in fixed pairs, and a mixture of separate element and compound particles.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="520" fill="#ffffff"/>
<g aria-hidden="true"><animate id="ecm-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<text class="head" x="30" y="34">Elements, compounds and mixtures</text><text class="note" x="30" y="56">Each circle is an atom; touching circles are joined.</text>
<g class="part" data-part="el" data-name="Element" data-info="Only one type of atom. Atoms may be single (iron) or joined in molecules of the same atom (oxygen, O₂)." tabindex="0" role="button" aria-label="Element"><g><animate attributeName="opacity" keyTimes="0.0000;0.0833;0.1083;1.0000" values="0;0;1;1" dur="12s" begin="ecm-play.begin+0s" fill="freeze"/><rect x="60" y="90" width="320" height="300" rx="18" fill="#fff" stroke="#b91c1c" stroke-width="3"/><text x="220" y="124" text-anchor="middle" font-size="20" font-weight="800" fill="#b91c1c">Element</text><circle cx="150" cy="190" r="15" fill="#ef4444" stroke="#991b1b" stroke-width="2"/><circle cx="205" cy="190" r="15" fill="#ef4444" stroke="#991b1b" stroke-width="2"/><circle cx="260" cy="190" r="15" fill="#ef4444" stroke="#991b1b" stroke-width="2"/><circle cx="315" cy="190" r="15" fill="#ef4444" stroke="#991b1b" stroke-width="2"/><circle cx="150" cy="250" r="15" fill="#ef4444" stroke="#991b1b" stroke-width="2"/><circle cx="205" cy="250" r="15" fill="#ef4444" stroke="#991b1b" stroke-width="2"/><circle cx="260" cy="250" r="15" fill="#ef4444" stroke="#991b1b" stroke-width="2"/><circle cx="315" cy="250" r="15" fill="#ef4444" stroke="#991b1b" stroke-width="2"/><circle cx="150" cy="310" r="15" fill="#ef4444" stroke="#991b1b" stroke-width="2"/><circle cx="205" cy="310" r="15" fill="#ef4444" stroke="#991b1b" stroke-width="2"/><circle cx="260" cy="310" r="15" fill="#ef4444" stroke="#991b1b" stroke-width="2"/><circle cx="315" cy="310" r="15" fill="#ef4444" stroke="#991b1b" stroke-width="2"/></g></g>
<g class="part" data-part="co" data-name="Compound" data-info="Two or more different atoms chemically joined in a fixed ratio (water H₂O, carbon dioxide CO₂). Properties differ from the elements; separated only by chemical reactions." tabindex="0" role="button" aria-label="Compound"><g><animate attributeName="opacity" keyTimes="0.0000;0.3333;0.3583;1.0000" values="0;0;1;1" dur="12s" begin="ecm-play.begin+0s" fill="freeze"/><rect x="400" y="90" width="320" height="300" rx="18" fill="#fff" stroke="#7c3aed" stroke-width="3"/><text x="560" y="124" text-anchor="middle" font-size="20" font-weight="800" fill="#7c3aed">Compound</text><circle cx="470" cy="185" r="15" fill="#ef4444" stroke="#991b1b" stroke-width="2"/><circle cx="498" cy="185" r="15" fill="#3b82f6" stroke="#1e3a8a" stroke-width="2"/><circle cx="555" cy="185" r="15" fill="#ef4444" stroke="#991b1b" stroke-width="2"/><circle cx="583" cy="185" r="15" fill="#3b82f6" stroke="#1e3a8a" stroke-width="2"/><circle cx="640" cy="185" r="15" fill="#ef4444" stroke="#991b1b" stroke-width="2"/><circle cx="668" cy="185" r="15" fill="#3b82f6" stroke="#1e3a8a" stroke-width="2"/><circle cx="470" cy="280" r="15" fill="#ef4444" stroke="#991b1b" stroke-width="2"/><circle cx="498" cy="280" r="15" fill="#3b82f6" stroke="#1e3a8a" stroke-width="2"/><circle cx="555" cy="280" r="15" fill="#ef4444" stroke="#991b1b" stroke-width="2"/><circle cx="583" cy="280" r="15" fill="#3b82f6" stroke="#1e3a8a" stroke-width="2"/><circle cx="640" cy="280" r="15" fill="#ef4444" stroke="#991b1b" stroke-width="2"/><circle cx="668" cy="280" r="15" fill="#3b82f6" stroke="#1e3a8a" stroke-width="2"/></g></g>
<g class="part" data-part="mx" data-name="Mixture" data-info="Different substances mixed but not chemically joined (air, sea water, alloys). Separated by physical methods: filtering, evaporation, distillation, chromatography." tabindex="0" role="button" aria-label="Mixture"><g><animate attributeName="opacity" keyTimes="0.0000;0.5833;0.6083;1.0000" values="0;0;1;1" dur="12s" begin="ecm-play.begin+0s" fill="freeze"/><rect x="740" y="90" width="320" height="300" rx="18" fill="#fff" stroke="#047857" stroke-width="3"/><text x="900" y="124" text-anchor="middle" font-size="20" font-weight="800" fill="#047857">Mixture</text><circle cx="790" cy="185" r="15" fill="#ef4444" stroke="#991b1b" stroke-width="2"/><circle cx="880" cy="225" r="15" fill="#3b82f6" stroke="#1e3a8a" stroke-width="2"/><circle cx="908" cy="225" r="15" fill="#ef4444" stroke="#991b1b" stroke-width="2"/><circle cx="980" cy="185" r="15" fill="#ef4444" stroke="#991b1b" stroke-width="2"/><circle cx="820" cy="295" r="15" fill="#3b82f6" stroke="#1e3a8a" stroke-width="2"/><circle cx="848" cy="295" r="15" fill="#ef4444" stroke="#991b1b" stroke-width="2"/><circle cx="920" cy="305" r="15" fill="#ef4444" stroke="#991b1b" stroke-width="2"/><circle cx="990" cy="275" r="15" fill="#3b82f6" stroke="#1e3a8a" stroke-width="2"/><circle cx="1018" cy="275" r="15" fill="#ef4444" stroke="#991b1b" stroke-width="2"/></g></g>
<g><animate attributeName="opacity" keyTimes="0.0000;0.7917;0.8167;1.0000" values="0;0;1;1" dur="12s" begin="ecm-play.begin+0s" fill="freeze"/><rect x="60.0" y="393.0" width="1000" height="64" rx="12" fill="#f1f5f9" stroke="#334155" stroke-width="2"/><text x="560" y="430.0" text-anchor="middle" font-size="15" font-weight="800" fill="#111827">Compounds: fixed ratio, chemically joined, new properties.   Mixtures: any ratio, not joined, separated physically.</text></g>
</svg>