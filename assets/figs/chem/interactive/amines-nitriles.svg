<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" class="vd-svg" role="img" aria-labelledby="an2-title an2-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="an2-play" data-vd-play-label="Play: substitute" data-vd-steps="[[0, &quot;Amines and nitriles.&quot;], [1, &quot;Bromoethane + ammonia: ethylamine, but further substitution follows.&quot;], [6, &quot;Amines are bases: the lone pair accepts H\u207a.&quot;], [9, &quot;Nitriles add a carbon; hydrolysis gives a carboxylic acid.&quot;]]" data-vd-dur="15">
<title id="an2-title">Amines and nitriles</title><desc id="an2-desc">Bromoethane and ammonia give ethylamine, then diethylamine, triethylamine and a quaternary ammonium salt unless ammonia is in excess; amines accept protons as bases; nitriles made from halogenoalkanes or carbonyls are hydrolysed to carboxylic acids.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="560" fill="#ffffff"/>
<g aria-hidden="true"><animate id="an2-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<defs><marker id="an2-475569" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="5.4" refY="6.0" orient="auto"><path d="M0,0 L12,6.0 L0,12 z" fill="#475569"/></marker></defs>
<text class="head" x="30" y="34">Amines and nitriles</text><text class="note" x="30" y="56">R = CH₃CH₂ (ethyl).</text>
<g class="part" data-part="amine" data-name="Making amines" data-info="Halogenoalkane + excess ethanolic NH₃, heated in a sealed tube: ethylamine. The amine product is itself a nucleophile, so further substitution gives secondary and tertiary amines and a quaternary salt: use excess NH₃." tabindex="0" role="button" aria-label="Making amines"><rect x="30.0" y="120.0" width="180" height="60" rx="12" fill="#f1f5f9" stroke="#111827" stroke-width="2"/><text x="120" y="148" text-anchor="middle" font-size="15" font-weight="800" fill="#111827">RBr + NH₃</text><text x="120" y="166" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">ethanol, heat, sealed tube</text><g><animate attributeName="opacity" keyTimes="0.0000;0.0667;0.0867;1.0000" values="0;0;1;1" dur="15s" begin="an2-play.begin+0s" fill="freeze"/><path d="M 225 150 L 258 150" stroke="#475569" stroke-width="3" marker-end="url(#an2-475569)"/><rect x="260.0" y="123.0" width="160" height="54" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="340" y="154.66666666666666" text-anchor="middle" font-size="14" font-weight="800" fill="#111827">RNH₂ (1°)</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.1400;0.1600;1.0000" values="0;0;1;1" dur="15s" begin="an2-play.begin+0s" fill="freeze"/><path d="M 415 150 L 448 150" stroke="#475569" stroke-width="3" marker-end="url(#an2-475569)"/><rect x="450.0" y="123.0" width="160" height="54" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="530" y="154.66666666666666" text-anchor="middle" font-size="14" font-weight="800" fill="#111827">R₂NH (2°)</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.2133;0.2333;1.0000" values="0;0;1;1" dur="15s" begin="an2-play.begin+0s" fill="freeze"/><path d="M 605 150 L 638 150" stroke="#475569" stroke-width="3" marker-end="url(#an2-475569)"/><rect x="640.0" y="123.0" width="160" height="54" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="720" y="154.66666666666666" text-anchor="middle" font-size="14" font-weight="800" fill="#111827">R₃N (3°)</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.2867;0.3067;1.0000" values="0;0;1;1" dur="15s" begin="an2-play.begin+0s" fill="freeze"/><path d="M 795 150 L 828 150" stroke="#475569" stroke-width="3" marker-end="url(#an2-475569)"/><rect x="830.0" y="123.0" width="160" height="54" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="910" y="154.66666666666666" text-anchor="middle" font-size="14" font-weight="800" fill="#111827">R₄N⁺Br⁻</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.3333;0.3533;1.0000" values="0;0;1;1" dur="15s" begin="an2-play.begin+0s" fill="freeze"/><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.3333;0.3533;1.0000" values="0;0;1;1" dur="15s" begin="an2-play.begin+0s" fill="freeze"/><rect x="350.0" y="218" width="400" height="24" rx="12" fill="#ede9fe" stroke="#1f2937" stroke-width="1"/><text x="550" y="235" text-anchor="middle" font-size="12" font-weight="700">use EXCESS ammonia → mainly the primary amine</text></g></g></g>
<g class="part" data-part="base" data-name="Amines as bases" data-info="The N lone pair accepts H⁺: CH₃CH₂NH₂ + HCl → CH₃CH₂NH₃⁺Cl⁻." tabindex="0" role="button" aria-label="Amines as bases"><g><animate attributeName="opacity" keyTimes="0.0000;0.4000;0.4200;1.0000" values="0;0;1;1" dur="15s" begin="an2-play.begin+0s" fill="freeze"/><rect x="40" y="280" width="480" height="240" rx="16" fill="#f5f3ff" stroke="#c4b5fd"/><text x="280" y="306" text-anchor="middle" font-size="14" font-weight="800" fill="#6d28d9">amines are bases</text><circle cx="180" cy="400" r="18" fill="#3b82f6" stroke="#1f2937" stroke-width="1.5"/><text x="180" y="405" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">N</text><text x="180" y="366" text-anchor="middle" font-size="18" font-weight="800" fill="#7c3aed">••</text><line x1="162" y1="410" x2="130" y2="430" stroke="#334155" stroke-width="4"/><text x="110" y="440" text-anchor="middle" font-size="14" font-weight="800" fill="#111827">R</text><line x1="198" y1="410" x2="226" y2="430" stroke="#334155" stroke-width="4"/><circle cx="234" cy="436" r="11" fill="#f8fafc" stroke="#1f2937" stroke-width="1.5"/><text x="234" y="441" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">H</text><line x1="180" y1="418" x2="180" y2="450" stroke="#334155" stroke-width="4"/><circle cx="180" cy="462" r="11" fill="#f8fafc" stroke="#1f2937" stroke-width="1.5"/><text x="180" y="467" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">H</text><g transform="translate(180 330)"><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.4000;0.5000;1.0000" values="300 330;300 330;180 344;180 344" dur="15s" begin="an2-play.begin+0s" fill="freeze"/><circle cx="0" cy="0" r="11" fill="#f8fafc" stroke="#1f2937" stroke-width="1.5"/><text x="0" y="5" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">H</text><text x="18" y="-8" text-anchor="middle" font-size="14" font-weight="800" fill="#b91c1c">+</text></g><text x="380" y="420" text-anchor="middle" font-size="14" font-weight="800" fill="#111827">RNH₂ + H⁺ → RNH₃⁺</text><text x="380" y="446" text-anchor="middle" font-size="12" font-weight="700" fill="#475569">lone pair accepts H⁺</text></g></g>
<g class="part" data-part="nit" data-name="Nitriles" data-info="From halogenoalkanes (KCN in ethanol, heat) or carbonyls (HCN): the chain grows by one carbon. Hydrolysis (heat with dilute acid) → carboxylic acid; reduction (H₂/Ni or LiAlH₄) → amine." tabindex="0" role="button" aria-label="Nitriles"><rect x="540" y="280" width="520" height="240" rx="16" fill="#f0f9ff" stroke="#7dd3fc"/><text x="800" y="306" text-anchor="middle" font-size="14" font-weight="800" fill="#0369a1">nitriles: add one carbon</text><g><animate attributeName="opacity" keyTimes="0.0000;0.6000;0.6200;1.0000" values="0;0;1;1" dur="15s" begin="an2-play.begin+0s" fill="freeze"/><rect x="560.0" y="332.0" width="220" height="56" rx="12" fill="#fff" stroke="#0369a1" stroke-width="2"/><text x="670" y="358" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">CH₃CH₂Br → CH₃CH₂CN</text><text x="670" y="376" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">KCN, ethanol, heat</text><rect x="820.0" y="332.0" width="220" height="56" rx="12" fill="#fff" stroke="#0369a1" stroke-width="2"/><text x="930" y="358" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">CH₃CHO → CH₃CH(OH)CN</text><text x="930" y="376" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">HCN / KCN</text><rect x="590.0" y="432.0" width="420" height="56" rx="12" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/><text x="800" y="458" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">RCN + 2H₂O + H⁺ → RCOOH + NH₄⁺</text><text x="800" y="476" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">hydrolysis: heat with dilute HCl</text></g></g>
</svg>