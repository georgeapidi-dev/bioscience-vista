<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" class="vd-svg" role="img" aria-labelledby="ca2-title ca2-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="ca2-play" data-vd-play-label="Play: break bonds" data-vd-steps="[[0, &quot;Breaking bonds and curly arrows.&quot;], [1, &quot;Homolytic fission: one electron each \u2192 radicals.&quot;], [4.5, &quot;Heterolytic fission: both electrons to one atom \u2192 ions.&quot;], [8, &quot;Nucleophiles donate a pair; electrophiles accept one.&quot;], [12, &quot;Curly arrow rule: start at electrons, end where they go.&quot;]]" data-vd-dur="15">
<title id="ca2-title">Bond fission and curly arrows</title><desc id="ca2-desc">Homolytic fission of chlorine into two radicals shown with half-headed arrows, heterolytic fission of a carbon-bromine bond into ions, and nucleophiles such as hydroxide attacking a delta-positive carbon compared with electrophiles attacking a double bond.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="560" fill="#ffffff"/>
<g aria-hidden="true"><animate id="ca2-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<defs><marker id="ca2-dc2626" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="5.4" refY="6.0" orient="auto"><path d="M0,0 L12,6.0 L0,12 z" fill="#dc2626"/></marker><marker id="ca2-2563eb" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="5.4" refY="6.0" orient="auto"><path d="M0,0 L12,6.0 L0,12 z" fill="#2563eb"/></marker></defs>
<text class="head" x="30" y="34">Bond fission, nucleophiles, electrophiles and curly arrows</text><text class="note" x="30" y="56">A curly arrow shows the movement of a PAIR of electrons; a half arrow, one electron.</text>
<g class="part" data-part="homo" data-name="Homolytic fission" data-info="Each atom takes one electron: two free radicals (Cl–Cl → 2Cl•). Half-headed (fish-hook) arrows; needs UV or high temperature." tabindex="0" role="button" aria-label="Homolytic fission"><rect x="30" y="80" width="510" height="200" rx="16" fill="#f8fafc" stroke="#cbd5e1"/><text x="285" y="104" text-anchor="middle" font-size="14" font-weight="800" fill="#111827">homolytic</text><g transform="translate(160 180)"><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.1333;0.2000;1.0000" values="160 180;160 180;120 180;120 180" dur="15s" begin="ca2-play.begin+0s" fill="freeze"/><circle cx="0" cy="0" r="18" fill="#22c55e" stroke="#1f2937" stroke-width="1.5"/><text x="0" y="5" text-anchor="middle" font-size="10" font-weight="800" fill="#052e16">Cl</text></g><g transform="translate(240 180)"><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.1333;0.2000;1.0000" values="240 180;240 180;280 180;280 180" dur="15s" begin="ca2-play.begin+0s" fill="freeze"/><circle cx="0" cy="0" r="18" fill="#22c55e" stroke="#1f2937" stroke-width="1.5"/><text x="0" y="5" text-anchor="middle" font-size="10" font-weight="800" fill="#052e16">Cl</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.1333;0.1533;1.0000" values="1;1;0;0" dur="15s" begin="ca2-play.begin+0s" fill="freeze"/><line x1="178" y1="180" x2="222" y2="180" stroke="#334155" stroke-width="4"/><path d="M 200 172 Q 185 140 168 162" fill="none" stroke="#dc2626" stroke-width="2.5"/><path d="M 200 172 Q 215 140 232 162" fill="none" stroke="#dc2626" stroke-width="2.5"/></g><g><animate attributeName="opacity" keyTimes="0.0000;0.2000;0.2200;1.0000" values="0;0;1;1" dur="15s" begin="ca2-play.begin+0s" fill="freeze"/><text x="120" y="160" text-anchor="middle" font-size="30" font-weight="800" fill="#dc2626">•</text><text x="282" y="160" text-anchor="middle" font-size="30" font-weight="800" fill="#dc2626">•</text><text x="420" y="186" text-anchor="middle" font-size="14" font-weight="800" fill="#b91c1c">2 Cl• radicals</text></g></g>
<g class="part" data-part="hetero" data-name="Heterolytic fission" data-info="One atom takes both electrons: a cation and an anion. Full curly arrow from the bond to the more electronegative atom." tabindex="0" role="button" aria-label="Heterolytic fission"><rect x="560" y="80" width="510" height="200" rx="16" fill="#f8fafc" stroke="#cbd5e1"/><text x="815" y="104" text-anchor="middle" font-size="14" font-weight="800" fill="#111827">heterolytic</text><circle cx="690" cy="180" r="18" fill="#374151" stroke="#1f2937" stroke-width="1.5"/><text x="690" y="185" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">C</text><g transform="translate(770 180)"><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.3667;0.4333;1.0000" values="770 180;770 180;830 180;830 180" dur="15s" begin="ca2-play.begin+0s" fill="freeze"/><circle cx="0" cy="0" r="18" fill="#9a3412" stroke="#1f2937" stroke-width="1.5"/><text x="0" y="5" text-anchor="middle" font-size="10" font-weight="800" fill="#fff">Br</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.3667;0.3867;1.0000" values="1;1;0;0" dur="15s" begin="ca2-play.begin+0s" fill="freeze"/><line x1="708" y1="180" x2="752" y2="180" stroke="#334155" stroke-width="4"/><path d="M 730 172 Q 755 135 770 160" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#ca2-2563eb)"/></g><text x="690" y="150" text-anchor="middle" font-size="13" font-weight="800" fill="#b91c1c">δ+</text><text x="770" y="150" text-anchor="middle" font-size="13" font-weight="800" fill="#1d4ed8">δ−</text><g><animate attributeName="opacity" keyTimes="0.0000;0.4333;0.4533;1.0000" values="0;0;1;1" dur="15s" begin="ca2-play.begin+0s" fill="freeze"/><text x="690" y="230" text-anchor="middle" font-size="16" font-weight="800" fill="#b91c1c">C⁺</text><text x="830" y="230" text-anchor="middle" font-size="16" font-weight="800" fill="#1d4ed8">Br⁻</text><text x="950" y="186" text-anchor="middle" font-size="14" font-weight="800" fill="#111827">ions</text></g></g>
<g class="part" data-part="nu" data-name="Nucleophile" data-info="An electron-pair donor that attacks a δ+ carbon: OH⁻, CN⁻, NH₃, H₂O." tabindex="0" role="button" aria-label="Nucleophile"><rect x="30" y="300" width="510" height="230" rx="16" fill="#eff6ff" stroke="#93c5fd"/><text x="285" y="324" text-anchor="middle" font-size="14" font-weight="800" fill="#1d4ed8">nucleophile attacks δ+ carbon</text><circle cx="300" cy="420" r="18" fill="#374151" stroke="#1f2937" stroke-width="1.5"/><text x="300" y="425" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">C</text><line x1="318" y1="420" x2="362" y2="420" stroke="#334155" stroke-width="4"/><circle cx="380" cy="420" r="18" fill="#9a3412" stroke="#1f2937" stroke-width="1.5"/><text x="380" y="425" text-anchor="middle" font-size="10" font-weight="800" fill="#fff">Br</text><text x="300" y="392" text-anchor="middle" font-size="12" font-weight="800" fill="#b91c1c">δ+</text><text x="380" y="392" text-anchor="middle" font-size="12" font-weight="800" fill="#1d4ed8">δ−</text><g transform="translate(160 420)"><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.5333;0.6333;1.0000" values="130 420;130 420;180 420;180 420" dur="15s" begin="ca2-play.begin+0s" fill="freeze"/><circle cx="0" cy="0" r="18" fill="#ef4444" stroke="#1f2937" stroke-width="1.5"/><text x="0" y="5" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">O</text><text x="0" y="-26" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">HO⁻</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.6000;0.6200;1.0000" values="0;0;1;1" dur="15s" begin="ca2-play.begin+0s" fill="freeze"/><path d="M 196 410 Q 240 380 282 412" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#ca2-2563eb)"/><text x="285" y="500" text-anchor="middle" font-size="12" font-weight="800" fill="#1d4ed8">Nu: OH⁻, CN⁻, NH₃, H₂O — lone pair donors</text></g></g>
<g class="part" data-part="el" data-name="Electrophile" data-info="An electron-pair acceptor that attacks electron-rich sites such as C=C: Br₂ (induced dipole), H⁺, NO₂⁺." tabindex="0" role="button" aria-label="Electrophile"><rect x="560" y="300" width="510" height="230" rx="16" fill="#fef2f2" stroke="#fecaca"/><text x="815" y="324" text-anchor="middle" font-size="14" font-weight="800" fill="#b91c1c">electrophile attacks C=C</text><circle cx="760" cy="480" r="18" fill="#374151" stroke="#1f2937" stroke-width="1.5"/><text x="760" y="485" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">C</text><line x1="778.0" y1="484.0" x2="822.0" y2="484.0" stroke="#334155" stroke-width="3"/><line x1="778.0" y1="476.0" x2="822.0" y2="476.0" stroke="#334155" stroke-width="3"/><circle cx="840" cy="480" r="18" fill="#374151" stroke="#1f2937" stroke-width="1.5"/><text x="840" y="485" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">C</text><circle cx="800" cy="410" r="15" fill="#9a3412" stroke="#1f2937" stroke-width="1.5"/><text x="800" y="415" text-anchor="middle" font-size="10" font-weight="800" fill="#fff">Br</text><line x1="800" y1="392" x2="800" y2="368" stroke="#334155" stroke-width="4"/><circle cx="800" cy="354" r="15" fill="#9a3412" stroke="#1f2937" stroke-width="1.5"/><text x="800" y="359" text-anchor="middle" font-size="10" font-weight="800" fill="#fff">Br</text><text x="828" y="414" text-anchor="middle" font-size="12" font-weight="800" fill="#b91c1c">δ+</text><text x="828" y="356" text-anchor="middle" font-size="12" font-weight="800" fill="#1d4ed8">δ−</text><g><animate attributeName="opacity" keyTimes="0.0000;0.6667;0.6867;1.0000" values="0;0;1;1" dur="15s" begin="ca2-play.begin+0s" fill="freeze"/><path d="M 800 472 Q 770 445 790 426" fill="none" stroke="#dc2626" stroke-width="3" marker-end="url(#ca2-dc2626)"/><text x="940" y="440" text-anchor="middle" font-size="12" font-weight="800" fill="#b91c1c">E: Br₂, H⁺, NO₂⁺ — electron-pair acceptors</text></g></g>
<g class="part" data-part="types" data-name="Reaction types" data-info="Addition, substitution, elimination, hydrolysis, condensation, oxidation, reduction." tabindex="0" role="button" aria-label="Reaction types"><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.8000;0.8200;1.0000" values="0;0;1;1" dur="15s" begin="ca2-play.begin+0s" fill="freeze"/><rect x="230.0" y="533" width="640" height="24" rx="12" fill="#f1f5f9" stroke="#1f2937" stroke-width="1"/><text x="550" y="550" text-anchor="middle" font-size="12" font-weight="700">addition · substitution · elimination · hydrolysis · condensation · oxidation · reduction</text></g></g>
</svg>