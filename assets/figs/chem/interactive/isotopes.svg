<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 640" class="vd-svg" role="img" aria-labelledby="is-title is-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="is-play" data-vd-play-label="Play: add neutrons" data-vd-steps="[[0, &quot;Isotopes: atoms of the same element with different numbers of neutrons.&quot;], [1, &quot;Protium: one proton, no neutrons.&quot;], [3, &quot;Deuterium: one proton, one neutron.&quot;], [5, &quot;Tritium: one proton, two neutrons; it is radioactive.&quot;], [7.5, &quot;Nuclide notation shows mass number and atomic number.&quot;], [10, &quot;Same electrons \u2192 same chemical reactions; different masses \u2192 different physical properties.&quot;]]" data-vd-dur="14">
<title id="is-title">Isotopes of hydrogen</title><desc id="is-desc">The three isotopes of hydrogen: protium with one proton, deuterium with one proton and one neutron, and tritium with one proton and two neutrons, each with one electron, with nuclide notation.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1220" height="640" fill="#ffffff"/>
<g aria-hidden="true"><animate id="is-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<text class="head" x="30" y="34">Isotopes of hydrogen</text><text class="note" x="30" y="56">Red = proton, grey = neutron, blue = electron. Not to scale.</text>
<g class="part" data-part="h1" data-name="Protium, ¹H" data-info="1 proton, 0 neutrons, 1 electron. 99.98% of hydrogen." tabindex="0" role="button" aria-label="Protium, ¹H"><g><animate attributeName="opacity" keyTimes="0.0000;0.0714;0.0929;1.0000" values="0;0;1;1" dur="14s" begin="is-play.begin+0s" fill="freeze"/><circle cx="210" cy="270" r="120" fill="none" stroke="#93c5fd" stroke-width="2" stroke-dasharray="6 5"/><circle cx="330" cy="270" r="10" fill="#2563eb"><animateTransform attributeName="transform" type="rotate" from="0 210 270" to="360 210 270" dur="4s" repeatCount="indefinite"/></circle><circle cx="210.0" cy="270.0" r="16" fill="#ef4444" stroke="#1f2937" stroke-width="1.5"/><text x="210.0" y="274.0" text-anchor="middle" font-size="18" font-weight="800" fill="#fff">+</text><text x="210" y="440" text-anchor="middle" font-size="17" font-weight="800" fill="#111827">protium</text><text x="210" y="464" text-anchor="middle" font-size="13" font-weight="700" fill="#475569">1 p, 0 n, 1 e⁻</text><text x="210" y="486" text-anchor="middle" font-size="12" font-weight="800" fill="#16a34a">stable</text><text x="180" y="120" font-size="16" font-weight="800" fill="#111827" text-anchor="end">1</text><text x="180" y="142" font-size="16" font-weight="800" fill="#111827" text-anchor="end">1</text><text x="184" y="140" font-size="34" font-weight="800" fill="#111827">H</text></g></g>
<g class="part" data-part="h2" data-name="Deuterium, ²H (D)" data-info="1 proton, 1 neutron. Heavy water is D₂O." tabindex="0" role="button" aria-label="Deuterium, ²H (D)"><g><animate attributeName="opacity" keyTimes="0.0000;0.2143;0.2357;1.0000" values="0;0;1;1" dur="14s" begin="is-play.begin+0s" fill="freeze"/><circle cx="610" cy="270" r="120" fill="none" stroke="#93c5fd" stroke-width="2" stroke-dasharray="6 5"/><circle cx="730" cy="270" r="10" fill="#2563eb"><animateTransform attributeName="transform" type="rotate" from="0 610 270" to="360 610 270" dur="5s" repeatCount="indefinite"/></circle><circle cx="610.0" cy="270.0" r="16" fill="#94a3b8" stroke="#1f2937" stroke-width="1.5"/><circle cx="599.4" cy="279.7" r="16" fill="#ef4444" stroke="#1f2937" stroke-width="1.5"/><text x="599.3815304962061" y="283.7266697999366" text-anchor="middle" font-size="18" font-weight="800" fill="#fff">+</text><text x="610" y="440" text-anchor="middle" font-size="17" font-weight="800" fill="#111827">deuterium</text><text x="610" y="464" text-anchor="middle" font-size="13" font-weight="700" fill="#475569">1 p, 1 n, 1 e⁻</text><text x="610" y="486" text-anchor="middle" font-size="12" font-weight="800" fill="#16a34a">stable</text><text x="580" y="120" font-size="16" font-weight="800" fill="#111827" text-anchor="end">2</text><text x="580" y="142" font-size="16" font-weight="800" fill="#111827" text-anchor="end">1</text><text x="584" y="140" font-size="34" font-weight="800" fill="#111827">H</text></g></g>
<g class="part" data-part="h3" data-name="Tritium, ³H (T)" data-info="1 proton, 2 neutrons. Radioactive (beta emitter, half-life about 12 years)." tabindex="0" role="button" aria-label="Tritium, ³H (T)"><g><animate attributeName="opacity" keyTimes="0.0000;0.3571;0.3786;1.0000" values="0;0;1;1" dur="14s" begin="is-play.begin+0s" fill="freeze"/><circle cx="1010" cy="270" r="120" fill="none" stroke="#93c5fd" stroke-width="2" stroke-dasharray="6 5"/><circle cx="1130" cy="270" r="10" fill="#2563eb"><animateTransform attributeName="transform" type="rotate" from="0 1010 270" to="360 1010 270" dur="6s" repeatCount="indefinite"/></circle><circle cx="1010.0" cy="270.0" r="16" fill="#94a3b8" stroke="#1f2937" stroke-width="1.5"/><circle cx="999.4" cy="279.7" r="16" fill="#94a3b8" stroke="#1f2937" stroke-width="1.5"/><circle cx="1011.8" cy="249.7" r="16" fill="#ef4444" stroke="#1f2937" stroke-width="1.5"/><text x="1011.7818883866645" y="253.71343119752703" text-anchor="middle" font-size="18" font-weight="800" fill="#fff">+</text><text x="1010" y="440" text-anchor="middle" font-size="17" font-weight="800" fill="#111827">tritium</text><text x="1010" y="464" text-anchor="middle" font-size="13" font-weight="700" fill="#475569">1 p, 2 n, 1 e⁻</text><text x="1010" y="486" text-anchor="middle" font-size="12" font-weight="800" fill="#b91c1c">radioactive</text><text x="980" y="120" font-size="16" font-weight="800" fill="#111827" text-anchor="end">3</text><text x="980" y="142" font-size="16" font-weight="800" fill="#111827" text-anchor="end">1</text><text x="984" y="140" font-size="34" font-weight="800" fill="#111827">H</text></g></g>
<g class="part" data-part="not" data-name="Nuclide notation" data-info="Mass number A (protons + neutrons) at the top left; atomic number Z (protons) at the bottom left." tabindex="0" role="button" aria-label="Nuclide notation"><g><animate attributeName="opacity" keyTimes="0.0000;0.5357;0.5571;1.0000" values="0;0;1;1" dur="14s" begin="is-play.begin+0s" fill="freeze"/><rect x="40" y="520" width="520" height="100" rx="14" fill="#eff6ff" stroke="#93c5fd"/><text x="80" y="566" font-size="16" font-weight="800">A</text><text x="80" y="596" font-size="16" font-weight="800">Z</text><text x="96" y="590" font-size="40" font-weight="800">X</text><text x="150" y="566" text-anchor="start" font-size="13" font-weight="700" fill="#111827">A = mass number = protons + neutrons</text><text x="150" y="596" text-anchor="start" font-size="13" font-weight="700" fill="#111827">Z = atomic number = protons</text></g></g>
<g class="part" data-part="same" data-name="Same chemistry" data-info="Isotopes have the same number of electrons, so the same chemical properties; their masses differ, so physical properties such as density and rate of diffusion differ." tabindex="0" role="button" aria-label="Same chemistry"><g><animate attributeName="opacity" keyTimes="0.0000;0.7143;0.7357;1.0000" values="0;0;1;1" dur="14s" begin="is-play.begin+0s" fill="freeze"/><rect x="600" y="520" width="580" height="100" rx="14" fill="#f0fdf4" stroke="#86efac"/><text x="890" y="552" text-anchor="middle" font-size="14" font-weight="800" fill="#166534">same electrons → same chemical properties</text><text x="890" y="582" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">different mass → different density, boiling point, diffusion rate</text><text x="890" y="606" text-anchor="middle" font-size="12" font-weight="600" fill="#475569">e.g. D₂O boils at 101.4 °C</text></g></g>
</svg>