<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 540" class="vd-svg" role="img" aria-labelledby="hl-title hl-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="hl-play" data-vd-play-label="Play: halve it" data-vd-steps="[[0, &quot;Half-life of a first-order reaction.&quot;], [1, &quot;Each halving takes the same time.&quot;], [8, &quot;k = 0.693 \u00f7 t\u00bd.&quot;], [11, &quot;Higher temperature: larger k, shorter half-life.&quot;]]" data-vd-dur="14">
<title id="hl-title">Half-life of a first-order reaction</title><desc id="hl-desc">A concentration-time curve for a first-order reaction with successive half-lives of 20 seconds each, and the relationship k equals 0.693 divided by the half-life.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="540" fill="#ffffff"/>
<g aria-hidden="true"><animate id="hl-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<text class="head" x="30" y="34">First-order reactions: constant half-life</text><text class="note" x="30" y="56">t½ = 20 s in this example.</text>
<g class="part" data-part="curve" data-name="Constant half-life" data-info="For a first-order reaction the time for the concentration to halve is constant: 1.00 → 0.50 → 0.25 → 0.125, each taking t½." tabindex="0" role="button" aria-label="Constant half-life"><line x1="100" y1="460" x2="700" y2="460" stroke="#111827" stroke-width="2"/><line x1="100" y1="460" x2="100" y2="100" stroke="#111827" stroke-width="2"/><text x="400.0" y="488" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">time / s</text><text x="84" y="280.0" transform="rotate(-90 84 280.0)" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">[A] / mol dm⁻³</text><text x="100.0" y="474" text-anchor="middle" font-size="10" font-weight="700" fill="#475569">0</text><text x="250.0" y="474" text-anchor="middle" font-size="10" font-weight="700" fill="#475569">20</text><text x="400.0" y="474" text-anchor="middle" font-size="10" font-weight="700" fill="#475569">40</text><text x="550.0" y="474" text-anchor="middle" font-size="10" font-weight="700" fill="#475569">60</text><text x="700.0" y="474" text-anchor="middle" font-size="10" font-weight="700" fill="#475569">80</text><text x="94" y="104" text-anchor="end" font-size="10" font-weight="700" fill="#475569">1</text><text x="94" y="284.0" text-anchor="end" font-size="10" font-weight="700" fill="#475569">0.5</text><text x="94" y="374.0" text-anchor="end" font-size="10" font-weight="700" fill="#475569">0.25</text><text x="94" y="419.0" text-anchor="end" font-size="10" font-weight="700" fill="#475569">0.125</text><clipPath id="hlc-c1096100"><rect x="100" y="96" width="604" height="368"><animate attributeName="width" keyTimes="0.0000;0.0714;0.2857;1.0000" values="0;0;604;604" dur="14s" begin="hl-play.begin+0s" fill="freeze"/></rect></clipPath><g clip-path="url(#hlc-c1096100)"><polyline points="100.0,100.0 107.5,112.3 115.0,124.1 122.5,135.5 130.0,146.6 137.5,157.3 145.0,167.6 152.5,177.5 160.0,187.2 167.5,196.5 175.0,205.4 182.5,214.1 190.0,222.5 197.5,230.6 205.0,238.4 212.5,245.9 220.0,253.2 227.5,260.3 235.0,267.1 242.5,273.7 250.0,280.0 257.5,286.1 265.0,292.1 272.5,297.8 280.0,303.3 287.5,308.6 295.0,313.8 302.5,318.8 310.0,323.6 317.5,328.2 325.0,332.7 332.5,337.1 340.0,341.2 347.5,345.3 355.0,349.2 362.5,353.0 370.0,356.6 377.5,360.1 385.0,363.5 392.5,366.8 400.0,370.0 407.5,373.1 415.0,376.0 422.5,378.9 430.0,381.7 437.5,384.3 445.0,386.9 452.5,389.4 460.0,391.8 467.5,394.1 475.0,396.4 482.5,398.5 490.0,400.6 497.5,402.6 505.0,404.6 512.5,406.5 520.0,408.3 527.5,410.1 535.0,411.8 542.5,413.4 550.0,415.0 557.5,416.5 565.0,418.0 572.5,419.4 580.0,420.8 587.5,422.2 595.0,423.4 602.5,424.7 610.0,425.9 617.5,427.1 625.0,428.2 632.5,429.3 640.0,430.3 647.5,431.3 655.0,432.3 662.5,433.2 670.0,434.2 677.5,435.0 685.0,435.9 692.5,436.7 700.0,437.5" fill="none" stroke="#2563eb" stroke-width="3"/></g><g><animate attributeName="opacity" keyTimes="0.0000;0.3214;0.3429;1.0000" values="0;0;1;1" dur="14s" begin="hl-play.begin+0s" fill="freeze"/><line x1="100" y1="280" x2="250" y2="280" stroke="#dc2626" stroke-dasharray="5 4"/><line x1="250" y1="280" x2="250" y2="460" stroke="#dc2626" stroke-dasharray="5 4"/><text x="175.0" y="450" text-anchor="middle" font-size="12" font-weight="800" fill="#b91c1c">t½</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.3929;0.4143;1.0000" values="0;0;1;1" dur="14s" begin="hl-play.begin+0s" fill="freeze"/><line x1="100" y1="370" x2="400" y2="370" stroke="#dc2626" stroke-dasharray="5 4"/><line x1="400" y1="370" x2="400" y2="460" stroke="#dc2626" stroke-dasharray="5 4"/><text x="325.0" y="450" text-anchor="middle" font-size="12" font-weight="800" fill="#b91c1c">t½</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.4643;0.4857;1.0000" values="0;0;1;1" dur="14s" begin="hl-play.begin+0s" fill="freeze"/><line x1="100" y1="415" x2="550" y2="415" stroke="#dc2626" stroke-dasharray="5 4"/><line x1="550" y1="415" x2="550" y2="460" stroke="#dc2626" stroke-dasharray="5 4"/><text x="475.0" y="450" text-anchor="middle" font-size="12" font-weight="800" fill="#b91c1c">t½</text></g></g>
<g class="part" data-part="k" data-name="k from t½" data-info="k = 0.693 ÷ t½ (first order only). t½ = 20 s → k = 0.0347 s⁻¹. Half-life does not depend on the starting concentration." tabindex="0" role="button" aria-label="k from t½"><g><animate attributeName="opacity" keyTimes="0.0000;0.5714;0.5929;1.0000" values="0;0;1;1" dur="14s" begin="hl-play.begin+0s" fill="freeze"/><rect x="755.0" y="140.0" width="300" height="120" rx="12" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/><text x="905" y="198" text-anchor="middle" font-size="22" font-weight="800" fill="#111827">k = 0.693 ÷ t½</text><text x="905" y="216" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">= 0.693 ÷ 20 = 0.0347 s⁻¹</text></g></g>
<g class="part" data-part="temp" data-name="Temperature" data-info="Raising temperature increases k (more molecules with E ≥ Ea), so t½ shortens." tabindex="0" role="button" aria-label="Temperature"><g><animate attributeName="opacity" keyTimes="0.0000;0.7857;0.8071;1.0000" values="0;0;1;1" dur="14s" begin="hl-play.begin+0s" fill="freeze"/><rect x="755" y="300" width="300" height="140" rx="16" fill="#fef3c7" stroke="#fcd34d"/><text x="905" y="330" text-anchor="middle" font-size="13" font-weight="800" fill="#a16207">first order only:</text><text x="905" y="356" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">t½ independent of [A]₀</text><text x="905" y="392" text-anchor="middle" font-size="13" font-weight="800" fill="#b91c1c">hotter → larger k</text><text x="905" y="414" text-anchor="middle" font-size="13" font-weight="800" fill="#b91c1c">→ shorter half-life</text></g></g>
</svg>