<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 580" class="vd-svg" role="img" aria-labelledby="ms2-title ms2-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="ms2-play" data-vd-play-label="Play: fragment" data-vd-steps="[[0, &quot;Mass spectra of organic molecules: pentan-3-one.&quot;], [1, &quot;The molecular ion at m/z 86 gives Mr.&quot;], [4.5, &quot;The small M+1 peak counts the carbons.&quot;], [8, &quot;Fragments at 57 and 29 show the structure.&quot;], [12, &quot;Cl gives M:M+2 = 3:1; Br gives 1:1.&quot;]]" data-vd-dur="16">
<title id="ms2-title">Mass spectrometry of organic compounds</title><desc id="ms2-desc">A simplified mass spectrum of pentan-3-one with the molecular ion at 86, an M+1 peak used to count carbon atoms, and fragment peaks at 57 and 29, plus the M and M+2 patterns for chlorine and bromine compounds.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="580" fill="#ffffff"/>
<g aria-hidden="true"><animate id="ms2-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<text class="head" x="30" y="34">Mass spectra: M⁺, M+1, M+2 and fragments</text><text class="note" x="30" y="56">Pentan-3-one, CH₃CH₂COCH₂CH₃ (simplified).</text>
<line x1="80" y1="470" x2="720" y2="470" stroke="#111827" stroke-width="2"/><line x1="80" y1="470" x2="80" y2="110" stroke="#111827" stroke-width="2"/><text x="80.0" y="488" text-anchor="middle" font-size="10" font-weight="700" fill="#475569">10</text><text x="155.29411764705884" y="488" text-anchor="middle" font-size="10" font-weight="700" fill="#475569">20</text><text x="230.58823529411765" y="488" text-anchor="middle" font-size="10" font-weight="700" fill="#475569">30</text><text x="305.88235294117646" y="488" text-anchor="middle" font-size="10" font-weight="700" fill="#475569">40</text><text x="381.1764705882353" y="488" text-anchor="middle" font-size="10" font-weight="700" fill="#475569">50</text><text x="456.47058823529414" y="488" text-anchor="middle" font-size="10" font-weight="700" fill="#475569">60</text><text x="531.7647058823529" y="488" text-anchor="middle" font-size="10" font-weight="700" fill="#475569">70</text><text x="607.0588235294117" y="488" text-anchor="middle" font-size="10" font-weight="700" fill="#475569">80</text><text x="682.3529411764706" y="488" text-anchor="middle" font-size="10" font-weight="700" fill="#475569">90</text><text x="400.0" y="508" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">m/z</text><text x="70" y="102" text-anchor="start" font-size="11" font-weight="800" fill="#111827">relative abundance</text>
<rect x="220" y="110" width="6" height="360" fill="#2563eb"><animate attributeName="height" keyTimes="0.0000;0.5000;0.5500;1.0000" values="0;0;360.0;360.0" dur="16s" begin="ms2-play.begin+0s" fill="freeze"/><animate attributeName="y" keyTimes="0.0000;0.5000;0.5500;1.0000" values="470;470;110.0;110.0" dur="16s" begin="ms2-play.begin+0s" fill="freeze"/></rect><g><animate attributeName="opacity" keyTimes="0.0000;0.5500;0.5688;1.0000" values="0;0;1;1" dur="16s" begin="ms2-play.begin+0s" fill="freeze"/><text x="223.05882352941177" y="100.0" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">C₂H₅⁺ 29</text></g>
<g class="part" data-part="frag" data-name="Fragments" data-info="M⁺ breaks into a cation and a radical; only cations are detected: pentan-3-one gives CH₃CH₂CO⁺ at 57 and CH₃CH₂⁺ at 29." tabindex="0" role="button" aria-label="Fragments"><rect x="431" y="146" width="6" height="324" fill="#2563eb"><animate attributeName="height" keyTimes="0.0000;0.5625;0.6125;1.0000" values="0;0;324.0;324.0" dur="16s" begin="ms2-play.begin+0s" fill="freeze"/><animate attributeName="y" keyTimes="0.0000;0.5625;0.6125;1.0000" values="470;470;146.0;146.0" dur="16s" begin="ms2-play.begin+0s" fill="freeze"/></rect><g><animate attributeName="opacity" keyTimes="0.0000;0.6125;0.6313;1.0000" values="0;0;1;1" dur="16s" begin="ms2-play.begin+0s" fill="freeze"/><text x="433.88235294117646" y="136.0" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">CH₃CH₂CO⁺ 57</text></g></g>
<g class="part" data-part="mplus" data-name="Molecular ion" data-info="The peak with the highest m/z (ignoring M+1, M+2) is M⁺: gives Mr. Pentan-3-one: M⁺ at 86." tabindex="0" role="button" aria-label="Molecular ion"><rect x="649" y="326" width="6" height="144" fill="#2563eb"><animate attributeName="height" keyTimes="0.0000;0.0625;0.1125;1.0000" values="0;0;144.0;144.0" dur="16s" begin="ms2-play.begin+0s" fill="freeze"/><animate attributeName="y" keyTimes="0.0000;0.0625;0.1125;1.0000" values="470;470;326.0;326.0" dur="16s" begin="ms2-play.begin+0s" fill="freeze"/></rect><g><animate attributeName="opacity" keyTimes="0.0000;0.1125;0.1313;1.0000" values="0;0;1;1" dur="16s" begin="ms2-play.begin+0s" fill="freeze"/><text x="652.2352941176471" y="316.0" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">M⁺ 86</text></g></g>
<g class="part" data-part="m1" data-name="M+1 peak" data-info="From ¹³C (1.1% of carbon). Number of carbons n = 100 × (height of M+1) ÷ (1.1 × height of M⁺)." tabindex="0" role="button" aria-label="M+1 peak"><rect x="657" y="462" width="6" height="8" fill="#2563eb"><animate attributeName="height" keyTimes="0.0000;0.2812;0.3312;1.0000" values="0;0;7.920000000000001;7.920000000000001" dur="16s" begin="ms2-play.begin+0s" fill="freeze"/><animate attributeName="y" keyTimes="0.0000;0.2812;0.3312;1.0000" values="470;470;462.08;462.08" dur="16s" begin="ms2-play.begin+0s" fill="freeze"/></rect><g><animate attributeName="opacity" keyTimes="0.0000;0.3312;0.3500;1.0000" values="0;0;1;1" dur="16s" begin="ms2-play.begin+0s" fill="freeze"/><text x="671.7647058823529" y="452.08" text-anchor="start" font-size="12" font-weight="800" fill="#111827">M+1</text></g></g>
<g><animate attributeName="opacity" keyTimes="0.0000;0.3438;0.3625;1.0000" values="0;0;1;1" dur="16s" begin="ms2-play.begin+0s" fill="freeze"/><rect x="760" y="90" width="310" height="180" rx="16" fill="#fef9c3" stroke="#eab308"/><text x="915" y="118" text-anchor="middle" font-size="14" font-weight="800" fill="#713f12">counting carbons</text><text x="915" y="154" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">n = 100 × (M+1) ÷ (1.1 × M)</text><text x="915" y="186" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">= 100 × 2.2 ÷ (1.1 × 40)</text><text x="915" y="220" text-anchor="middle" font-size="16" font-weight="800" fill="#b45309">= 5 carbons ✓</text></g>
<g class="part" data-part="hal" data-name="Chlorine and bromine" data-info="Cl: M and M+2 in ratio 3 : 1 (³⁵Cl : ³⁷Cl). Br: M and M+2 in ratio 1 : 1 (⁷⁹Br : ⁸¹Br)." tabindex="0" role="button" aria-label="Chlorine and bromine"><g><animate attributeName="opacity" keyTimes="0.0000;0.7500;0.7688;1.0000" values="0;0;1;1" dur="16s" begin="ms2-play.begin+0s" fill="freeze"/><rect x="760" y="290" width="310" height="230" rx="16" fill="#f8fafc" stroke="#cbd5e1"/><text x="915" y="316" text-anchor="middle" font-size="14" font-weight="800" fill="#111827">halogen patterns</text><rect x="820" y="390" width="10" height="90" fill="#16a34a"/><rect x="860" y="450" width="10" height="30" fill="#16a34a"/><text x="825" y="498" text-anchor="middle" font-size="11" font-weight="800" fill="#111827">M</text><text x="865" y="498" text-anchor="middle" font-size="11" font-weight="800" fill="#111827">M+2</text><text x="850" y="380" text-anchor="middle" font-size="11" font-weight="800" fill="#15803d">Cl: M : M+2 = 3 : 1</text><rect x="970" y="420" width="10" height="60" fill="#16a34a"/><rect x="1010" y="420" width="10" height="60" fill="#16a34a"/><text x="975" y="498" text-anchor="middle" font-size="11" font-weight="800" fill="#111827">M</text><text x="1015" y="498" text-anchor="middle" font-size="11" font-weight="800" fill="#111827">M+2</text><text x="1000" y="380" text-anchor="middle" font-size="11" font-weight="800" fill="#15803d">Br: M : M+2 = 1 : 1</text></g></g>
</svg>