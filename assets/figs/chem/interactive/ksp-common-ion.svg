<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" class="vd-svg" role="img" aria-labelledby="ks-title ks-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="ks-play" data-vd-play-label="Play: add NaCl" data-vd-steps="[[0, &quot;Solubility product, Ksp.&quot;], [1, &quot;A saturated solution in equilibrium with solid.&quot;], [6, &quot;Ionic product &gt; Ksp \u2192 precipitate.&quot;], [9, &quot;Add NaCl: the common ion lowers solubility.&quot;]]" data-vd-dur="14">
<title id="ks-title">Solubility product and the common ion effect</title><desc id="ks-desc">A saturated silver chloride solution in equilibrium with solid; adding sodium chloride increases chloride ion concentration so more silver chloride precipitates; worked calculations of solubility from the solubility product.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="560" fill="#ffffff"/>
<g aria-hidden="true"><animate id="ks-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<text class="head" x="30" y="34">Ksp: solubility product and the common ion effect</text><text class="note" x="30" y="56">AgCl: Ksp = 1.8 × 10⁻¹⁰ mol² dm⁻⁶ at 298 K.</text>
<g class="part" data-part="eq" data-name="Solubility product" data-info="In a saturated solution: AgCl(s) ⇌ Ag⁺(aq) + Cl⁻(aq); Ksp = [Ag⁺][Cl⁻] = 1.8 × 10⁻¹⁰ mol² dm⁻⁶ at 298 K. Solubility s = √Ksp = 1.3 × 10⁻⁵ mol dm⁻³." tabindex="0" role="button" aria-label="Solubility product"><path d="M 80 140 L 80 450 Q 80 470 100 470 L 380 470 Q 400 470 400 450 L 400 140" fill="#f8fafc" stroke="#334155" stroke-width="3"/><rect x="82" y="190" width="316" height="278" fill="#e0f2fe"/><rect x="100" y="440" width="280" height="22" rx="6" fill="#f1f5f9" stroke="#94a3b8"><animate attributeName="height" dur="14s" begin="ks-play.begin+0s" values="22;22;40;40" keyTimes="0;0.679;0.786;1" fill="freeze"/><animate attributeName="y" dur="14s" begin="ks-play.begin+0s" values="440;440;422;422" keyTimes="0;0.679;0.786;1" fill="freeze"/></rect><text x="240" y="495" text-anchor="middle" font-size="12" font-weight="800" fill="#475569">AgCl(s)</text><g transform="translate(191 247)"><text x="0" y="4" text-anchor="middle" font-size="11" font-weight="800" fill="#64748b">Ag⁺</text></g><g transform="translate(273 233)"><text x="0" y="4" text-anchor="middle" font-size="11" font-weight="800" fill="#16a34a">Cl⁻</text></g><g transform="translate(244 286)"><text x="0" y="4" text-anchor="middle" font-size="11" font-weight="800" fill="#64748b">Ag⁺</text></g><g transform="translate(124 311)"><text x="0" y="4" text-anchor="middle" font-size="11" font-weight="800" fill="#16a34a">Cl⁻</text></g><g transform="translate(119 298)"><text x="0" y="4" text-anchor="middle" font-size="11" font-weight="800" fill="#64748b">Ag⁺</text></g><g transform="translate(127 236)"><text x="0" y="4" text-anchor="middle" font-size="11" font-weight="800" fill="#16a34a">Cl⁻</text></g><g transform="translate(216 369)"><text x="0" y="4" text-anchor="middle" font-size="11" font-weight="800" fill="#64748b">Ag⁺</text></g><g transform="translate(141 260)"><text x="0" y="4" text-anchor="middle" font-size="11" font-weight="800" fill="#16a34a">Cl⁻</text></g><g transform="translate(267 391)"><text x="0" y="4" text-anchor="middle" font-size="11" font-weight="800" fill="#64748b">Ag⁺</text></g><g transform="translate(254 291)"><text x="0" y="4" text-anchor="middle" font-size="11" font-weight="800" fill="#16a34a">Cl⁻</text></g><g transform="translate(354 228)"><text x="0" y="4" text-anchor="middle" font-size="11" font-weight="800" fill="#64748b">Ag⁺</text></g><g transform="translate(325 272)"><text x="0" y="4" text-anchor="middle" font-size="11" font-weight="800" fill="#16a34a">Cl⁻</text></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.6429;0.6857;1.0000" values="0;0;1;1" dur="14s" begin="ks-play.begin+0s" fill="freeze"/><g transform="translate(146 241)"><text x="0" y="4" text-anchor="middle" font-size="12" font-weight="800" fill="#15803d">Cl⁻</text></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.6429;0.6857;1.0000" values="0;0;1;1" dur="14s" begin="ks-play.begin+0s" fill="freeze"/><g transform="translate(187 367)"><text x="0" y="4" text-anchor="middle" font-size="12" font-weight="800" fill="#15803d">Cl⁻</text></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.6429;0.6857;1.0000" values="0;0;1;1" dur="14s" begin="ks-play.begin+0s" fill="freeze"/><g transform="translate(155 325)"><text x="0" y="4" text-anchor="middle" font-size="12" font-weight="800" fill="#15803d">Cl⁻</text></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.6429;0.6857;1.0000" values="0;0;1;1" dur="14s" begin="ks-play.begin+0s" fill="freeze"/><g transform="translate(270 287)"><text x="0" y="4" text-anchor="middle" font-size="12" font-weight="800" fill="#15803d">Cl⁻</text></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.6429;0.6857;1.0000" values="0;0;1;1" dur="14s" begin="ks-play.begin+0s" fill="freeze"/><g transform="translate(247 231)"><text x="0" y="4" text-anchor="middle" font-size="12" font-weight="800" fill="#15803d">Cl⁻</text></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.6429;0.6857;1.0000" values="0;0;1;1" dur="14s" begin="ks-play.begin+0s" fill="freeze"/><g transform="translate(125 257)"><text x="0" y="4" text-anchor="middle" font-size="12" font-weight="800" fill="#15803d">Cl⁻</text></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.6429;0.6857;1.0000" values="0;0;1;1" dur="14s" begin="ks-play.begin+0s" fill="freeze"/><g transform="translate(280 297)"><text x="0" y="4" text-anchor="middle" font-size="12" font-weight="800" fill="#15803d">Cl⁻</text></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.6429;0.6857;1.0000" values="0;0;1;1" dur="14s" begin="ks-play.begin+0s" fill="freeze"/><g transform="translate(189 325)"><text x="0" y="4" text-anchor="middle" font-size="12" font-weight="800" fill="#15803d">Cl⁻</text></g></g><g><animate attributeName="opacity" keyTimes="0.0000;0.6429;0.6643;1.0000" values="0;0;1;1" dur="14s" begin="ks-play.begin+0s" fill="freeze"/><text x="240" y="120" text-anchor="middle" font-size="14" font-weight="800" fill="#15803d">+ NaCl(aq)</text><path d="M 240 126 L 240 180" stroke="#15803d" stroke-width="3"/></g><g><animate attributeName="opacity" keyTimes="0.0000;0.0714;0.0929;1.0000" values="0;0;1;1" dur="14s" begin="ks-play.begin+0s" fill="freeze"/><rect x="415.0" y="98.0" width="640" height="64" rx="12" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/><text x="735" y="128" text-anchor="middle" font-size="15" font-weight="800" fill="#111827">AgCl(s) ⇌ Ag⁺(aq) + Cl⁻(aq)    Ksp = [Ag⁺][Cl⁻]</text><text x="735" y="146" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">s = √(1.8 × 10⁻¹⁰) = 1.3 × 10⁻⁵ mol dm⁻³ in pure water</text></g></g>
<g class="part" data-part="ppt" data-name="Will a precipitate form?" data-info="Calculate the ionic product with the concentrations after mixing. If it exceeds Ksp, a precipitate forms." tabindex="0" role="button" aria-label="Will a precipitate form?"><g><animate attributeName="opacity" keyTimes="0.0000;0.4286;0.4500;1.0000" values="0;0;1;1" dur="14s" begin="ks-play.begin+0s" fill="freeze"/><rect x="430" y="200" width="610" height="130" rx="16" fill="#fef9c3" stroke="#eab308"/><text x="735" y="230" text-anchor="middle" font-size="13" font-weight="800" fill="#713f12">mix equal volumes: 2.0 × 10⁻⁴ Ag⁺ and 2.0 × 10⁻⁴ Cl⁻</text><text x="735" y="264" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">after mixing each is 1.0 × 10⁻⁴ mol dm⁻³ (dilution!)</text><text x="735" y="296" text-anchor="middle" font-size="14" font-weight="800" fill="#b91c1c">ionic product = 1.0 × 10⁻⁸ > Ksp → precipitate forms</text></g></g>
<g class="part" data-part="common" data-name="Common ion effect" data-info="Adding Cl⁻ (as NaCl) increases [Cl⁻], so the equilibrium shifts left and AgCl precipitates: its solubility falls. In 0.10 mol dm⁻³ NaCl, s = 1.8 × 10⁻¹⁰ / 0.10 = 1.8 × 10⁻⁹ mol dm⁻³." tabindex="0" role="button" aria-label="Common ion effect"><g><animate attributeName="opacity" keyTimes="0.0000;0.7143;0.7357;1.0000" values="0;0;1;1" dur="14s" begin="ks-play.begin+0s" fill="freeze"/><rect x="430" y="350" width="610" height="150" rx="16" fill="#f0fdf4" stroke="#86efac"/><text x="735" y="380" text-anchor="middle" font-size="14" font-weight="800" fill="#15803d">common ion: add Cl⁻ → equilibrium shifts left</text><text x="735" y="418" text-anchor="middle" font-size="14" font-weight="800" fill="#111827">in 0.10 mol dm⁻³ NaCl: [Ag⁺] = 1.8 × 10⁻¹⁰ ÷ 0.10</text><text x="735" y="452" text-anchor="middle" font-size="14" font-weight="800" fill="#15803d">s = 1.8 × 10⁻⁹ mol dm⁻³ (7000 times less soluble)</text></g></g>
</svg>