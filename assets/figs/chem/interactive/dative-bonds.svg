<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 540" class="vd-svg" role="img" aria-labelledby="dv-title dv-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="dv-play" data-vd-play-label="Play: donate a pair" data-vd-steps="[[0, &quot;Coordinate (dative covalent) bonds: both electrons from one atom.&quot;], [1, &quot;NH\u2083 + H\u207a \u2192 NH\u2084\u207a: nitrogen donates its lone pair.&quot;], [5.5, &quot;H\u2082O + H\u207a \u2192 H\u2083O\u207a.&quot;], [9.5, &quot;Two AlCl\u2083 join into Al\u2082Cl\u2086 by two dative bonds.&quot;]]" data-vd-dur="14">
<title id="dv-title">Coordinate bonds</title><desc id="dv-desc">Ammonia&#x27;s lone pair forms a coordinate bond with a hydrogen ion to make the ammonium ion, water forms the oxonium ion, and two aluminium chloride molecules join through chlorine lone pairs into Al2Cl6.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="540" fill="#ffffff"/>
<g aria-hidden="true"><animate id="dv-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<defs><marker id="dv-7c3aed" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="6.3" refY="7.0" orient="auto"><path d="M0,0 L14,7.0 L0,14 z" fill="#7c3aed"/></marker></defs>
<text class="head" x="30" y="34">Coordinate (dative covalent) bonds</text><text class="note" x="30" y="56">Arrow → shows the donated lone pair.</text>
<g class="part" data-part="nh4" data-name="NH₄⁺" data-info="The lone pair on N in ammonia forms a coordinate bond to H⁺. Once formed, all four N–H bonds are identical." tabindex="0" role="button" aria-label="NH₄⁺"><circle cx="200" cy="260" r="18" fill="#3b82f6" stroke="#1f2937" stroke-width="1.5"/><text x="200" y="265" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">N</text><line x1="200" y1="260" x2="148.03847577293368" y2="290.0" stroke="#334155" stroke-width="4"/><circle cx="148.03847577293368" cy="290.0" r="13" fill="#f8fafc" stroke="#1f2937" stroke-width="1.5"/><text x="148.03847577293368" y="295.0" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">H</text><line x1="200" y1="260" x2="251.96152422706632" y2="290.0" stroke="#334155" stroke-width="4"/><circle cx="251.96152422706632" cy="290.0" r="13" fill="#f8fafc" stroke="#1f2937" stroke-width="1.5"/><text x="251.96152422706632" y="295.0" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">H</text><line x1="200" y1="260" x2="200.0" y2="320.0" stroke="#334155" stroke-width="4"/><circle cx="200.0" cy="320.0" r="13" fill="#f8fafc" stroke="#1f2937" stroke-width="1.5"/><text x="200.0" y="325.0" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">H</text><circle cx="194" cy="226" r="4" fill="#7c3aed"/><circle cx="206" cy="226" r="4" fill="#7c3aed"/><g transform="translate(200 140)"><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.0714;0.2143;1.0000" values="200 110;200 110;200 180;200 180" dur="14s" begin="dv-play.begin+0s" fill="freeze"/><circle cx="0" cy="0" r="13" fill="#f8fafc" stroke="#1f2937" stroke-width="1.5"/><text x="0" y="5" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">H</text><text x="22" y="-10" text-anchor="middle" font-size="16" font-weight="800" fill="#b91c1c">+</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.2143;0.2357;1.0000" values="0;0;1;1" dur="14s" begin="dv-play.begin+0s" fill="freeze"/><path d="M 200 222 L 200 196" stroke="#7c3aed" stroke-width="5" marker-end="url(#dv-7c3aed)"/><text x="200" y="360" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">NH₄⁺: 4 identical N–H bonds</text></g></g>
<g class="part" data-part="h3o" data-name="H₃O⁺" data-info="A lone pair on O in water bonds to H⁺." tabindex="0" role="button" aria-label="H₃O⁺"><circle cx="520" cy="260" r="18" fill="#ef4444" stroke="#1f2937" stroke-width="1.5"/><text x="520" y="265" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">O</text><line x1="520" y1="260" x2="466" y2="296" stroke="#334155" stroke-width="4"/><circle cx="466" cy="296" r="13" fill="#f8fafc" stroke="#1f2937" stroke-width="1.5"/><text x="466" y="301" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">H</text><line x1="520" y1="260" x2="574" y2="296" stroke="#334155" stroke-width="4"/><circle cx="574" cy="296" r="13" fill="#f8fafc" stroke="#1f2937" stroke-width="1.5"/><text x="574" y="301" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">H</text><circle cx="514" cy="226" r="4" fill="#7c3aed"/><circle cx="526" cy="226" r="4" fill="#7c3aed"/><g transform="translate(520 180)"><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.3929;0.5357;1.0000" values="520 110;520 110;520 180;520 180" dur="14s" begin="dv-play.begin+0s" fill="freeze"/><circle cx="0" cy="0" r="13" fill="#f8fafc" stroke="#1f2937" stroke-width="1.5"/><text x="0" y="5" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">H</text><text x="22" y="-10" text-anchor="middle" font-size="16" font-weight="800" fill="#b91c1c">+</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.5357;0.5571;1.0000" values="0;0;1;1" dur="14s" begin="dv-play.begin+0s" fill="freeze"/><path d="M 520 222 L 520 196" stroke="#7c3aed" stroke-width="5" marker-end="url(#dv-7c3aed)"/><text x="520" y="360" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">H₃O⁺</text></g></g>
<g class="part" data-part="al" data-name="Al₂Cl₆" data-info="A lone pair on a Cl of one AlCl₃ bonds to the Al of another (Al has only 6 outer electrons in AlCl₃)." tabindex="0" role="button" aria-label="Al₂Cl₆"><circle cx="790" cy="260" r="18" fill="#94a3b8" stroke="#1f2937" stroke-width="1.5"/><text x="790" y="265" text-anchor="middle" font-size="10" font-weight="800" fill="#111827">Al</text><circle cx="950" cy="260" r="18" fill="#94a3b8" stroke="#1f2937" stroke-width="1.5"/><text x="950" y="265" text-anchor="middle" font-size="10" font-weight="800" fill="#111827">Al</text><line x1="790" y1="260" x2="870" y2="200" stroke="#334155" stroke-width="4"/><line x1="950" y1="260" x2="870" y2="320" stroke="#334155" stroke-width="4"/><circle cx="870" cy="200" r="18" fill="#22c55e" stroke="#1f2937" stroke-width="1.5"/><text x="870" y="205" text-anchor="middle" font-size="10" font-weight="800" fill="#052e16">Cl</text><circle cx="870" cy="320" r="18" fill="#22c55e" stroke="#1f2937" stroke-width="1.5"/><text x="870" y="325" text-anchor="middle" font-size="10" font-weight="800" fill="#052e16">Cl</text><line x1="790" y1="260" x2="730" y2="210" stroke="#334155" stroke-width="4"/><circle cx="730" cy="210" r="18" fill="#22c55e" stroke="#1f2937" stroke-width="1.5"/><text x="730" y="215" text-anchor="middle" font-size="10" font-weight="800" fill="#052e16">Cl</text><line x1="790" y1="260" x2="730" y2="310" stroke="#334155" stroke-width="4"/><circle cx="730" cy="310" r="18" fill="#22c55e" stroke="#1f2937" stroke-width="1.5"/><text x="730" y="315" text-anchor="middle" font-size="10" font-weight="800" fill="#052e16">Cl</text><line x1="950" y1="260" x2="1010" y2="210" stroke="#334155" stroke-width="4"/><circle cx="1010" cy="210" r="18" fill="#22c55e" stroke="#1f2937" stroke-width="1.5"/><text x="1010" y="215" text-anchor="middle" font-size="10" font-weight="800" fill="#052e16">Cl</text><line x1="950" y1="260" x2="1010" y2="310" stroke="#334155" stroke-width="4"/><circle cx="1010" cy="310" r