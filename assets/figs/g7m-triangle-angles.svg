<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" role="img" aria-label="Triangle with angles 50, 60 and 70 degrees"><rect width="640" height="300" fill="#ffffff"/><style>text{font-family:Arial,Helvetica,sans-serif}.s{opacity:0;animation:fade .6s ease forwards}@keyframes fade{to{opacity:1}}@media (prefers-reduced-motion:reduce){.s{opacity:1;animation:none}}</style><g class="s" style="animation-delay:0.00s"><polygon points="120,240 520,240 300,60" fill="#eaf2fb" stroke="#1a1a1a" stroke-width="3" stroke-linejoin="round"/></g><g class="s" style="animation-delay:0.25s"><text x="138" y="230" text-anchor="start" font-size="17" fill="#b3261e" font-weight="bold">50°</text></g><g class="s" style="animation-delay:0.50s"><text x="502" y="230" text-anchor="end" font-size="17" fill="#2e7d32" font-weight="bold">60°</text></g><g class="s" style="animation-delay:0.75s"><text x="300" y="94" text-anchor="middle" font-size="17" fill="#1f5fa8" font-weight="bold">70°</text></g><g class="s" style="animation-delay:1.00s"><text x="320" y="285" text-anchor="middle" font-size="17" fill="#1a1a1a">50 + 60 + 70 = 180°</text></g></svg>
