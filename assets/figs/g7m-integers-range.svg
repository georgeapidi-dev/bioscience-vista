<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 180" width="640" height="180" role="img" aria-label="Integer solutions of an inequality on a number line"><rect width="640" height="180" fill="#ffffff"/><style>text{font-family:Arial,Helvetica,sans-serif}.s{opacity:0;animation:fade .6s ease forwards}@keyframes fade{to{opacity:1}}@media (prefers-reduced-motion:reduce){.s{opacity:1;animation:none}}</style><g class="s" style="animation-delay:0.00s"><line x1="40" y1="100" x2="600" y2="100" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round"/></g><g class="s" style="animation-delay:0.25s"><line x1="40.0" y1="92" x2="40.0" y2="108" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/></g><g class="s" style="animation-delay:0.50s"><text x="40.0" y="130" text-anchor="middle" font-size="15" fill="#1a1a1a">-3</text></g><g class="s" style="animation-delay:0.75s"><line x1="120.0" y1="92" x2="120.0" y2="108" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/></g><g class="s" style="animation-delay:1.00s"><text x="120.0" y="130" text-anchor="middle" font-size="15" fill="#1a1a1a">-2</text></g><g class="s" style="animation-delay:1.25s"><line x1="200.0" y1="92" x2="200.0" y2="108" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/></g><g class="s" style="animation-delay:1.50s"><text x="200.0" y="130" text-anchor="middle" font-size="15" fill="#1a1a1a">-1</text></g><g class="s" style="animation-delay:1.75s"><line x1="280.0" y1="92" x2="280.0" y2="108" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/></g><g class="s" style="animation-delay:2.00s"><text x="280.0" y="130" text-anchor="middle" font-size="15" fill="#1a1a1a">0</text></g><g class="s" style="animation-delay:2.25s"><line x1="360.0" y1="92" x2="360.0" y2="108" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/></g><g class="s" style="animation-delay:2.50s"><text x="360.0" y="130" text-anchor="middle" font-size="15" fill="#1a1a1a">1</text></g><g class="s" style="animation-delay:2.75s