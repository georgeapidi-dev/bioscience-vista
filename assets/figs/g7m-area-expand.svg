<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" width="640" height="260" role="img" aria-label="Area model of 3 times (x plus 4)"><rect width="640" height="260" fill="#ffffff"/><style>text{font-family:Arial,Helvetica,sans-serif}.s{opacity:0;animation:fade .6s ease forwards}@keyframes fade{to{opacity:1}}@media (prefers-reduced-motion:reduce){.s{opacity:1;animation:none}}</style><g class="s" style="animation-delay:0.00s"><rect x="170" y="60" width="300" height="140" rx="0" fill="#eaf2fb" stroke="#1a1a1a" stroke-width="2.5"/></g><g class="s" style="animation-delay:0.25s"><line x1="320.0" y1="60" x2="320.0" y2="200" stroke="#1a1a1a" stroke-width="2.5" stroke-linecap="round"/></g><g class="s" style="animation-delay:0.50s"><text x="245.0" y="136.0" text-anchor="middle" font-size="20" fill="#1a1a1a" font-weight="bold">3x</text></g><g class="s" style="animation-delay:0.75s"><text x="395.0" y="136.0" text-anchor="middle" font-size="20" fill="#1a1a1a" font-weight="bold">12</text></g><g class="s" style="animation-delay:1.00s"><text x="320.0" y="48" text-anchor="middle" font-size="16" fill="#1a1a1a">x + 4 (width)</text></g><g class="s" style="animation-delay:1.25s"><text x="120" y="130" text-anchor="middle" font-size="18" fill="#1a1a1a">3</text></g><g class="s" style="animation-delay:1.50s"><text x="150" y="225" text-anchor="end" font-size="16" fill="#1a1a1a">3 (height)</text></g><g class="s" style="animation-delay:1.75s"><text x="320" y="240" text-anchor="middle" font-size="16" fill="#1a1a1a">Total area = 3x + 12, so 3(x + 4) = 3x + 12</text></g></svg>
