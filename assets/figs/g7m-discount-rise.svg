<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 230" width="640" height="230" role="img" aria-label="Bar model of a 20 percent discount then a 20 percent rise"><rect width="640" height="230" fill="#ffffff"/><style>text{font-family:Arial,Helvetica,sans-serif}.s{opacity:0;animation:fade .6s ease forwards}@keyframes fade{to{opacity:1}}@media (prefers-reduced-motion:reduce){.s{opacity:1;animation:none}}</style><g class="s" style="animation-delay:0.00s"><text x="20" y="74" text-anchor="start" font-size="15" fill="#1a1a1a">Start</text></g><g class="s" style="animation-delay:0.25s"><rect x="150" y="50" width="420.0" height="40" rx="0" fill="#eaf2fb" stroke="#1a1a1a" stroke-width="2.5"/></g><g class="s" style="animation-delay:0.50s"><text x="578.0" y="76" text-anchor="start" font-size="15" fill="#1a1a1a" font-weight="bold">100</text></g><g class="s" style="animation-delay:0.75s"><text x="20" y="134" text-anchor="start" font-size="15" fill="#1a1a1a">−20%</text></g><g class="s" style="animation-delay:1.00s"><rect x="150" y="110" width="336.0" height="40" rx="0" fill="#dcefdc" stroke="#2e7d32" stroke-width="2.5"/></g><g class="s" style="animation-delay:1.25s"><text x="494.0" y="136" text-anchor="start" font-size="15" fill="#1a1a1a" font-weight="bold">80</text></g><g class="s" style="animation-delay:1.50s"><text x="20" y="194" text-anchor="start" font-size="15" fill="#1a1a1a">+20% of 80</text></g><g class="s" style="animation-delay:1.75s"><rect x="150" y="170" width="403.20000000000005" height="40" rx="0" fill="#fde8c4" stroke="#c98a00" stroke-width="2.5"/></g><g class="s" style="animation-delay:2.00s"><text x="561.2" y="196" text-anchor="start" font-size="15" fill="#1a1a1a" font-weight="bold">96</text></g><g class="s" style="animation-delay:2.25s"><text x="150" y="225" text-anchor="start" font-size="14" fill="#8a8a8a">96 is 4% below the start of 100</text></g></svg>
