<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320" role="img" aria-label="Pie chart of a family budget"><rect width="640" height="320" fill="#ffffff"/><style>text{font-family:Arial,Helvetica,sans-serif}.s{opacity:0;animation:fade .6s ease forwards}@keyframes fade{to{opacity:1}}@media (prefers-reduced-motion:reduce){.s{opacity:1;animation:none}}</style><g class="s" style="animation-delay:0.00s"><path d="M 200 165 L 200.0 40.0 A 125 125 0 0 1 273.5 266.1 Z" fill="#eaf2fb" stroke="#1a1a1a" stroke-width="2"/></g><g class="s" style="animation-delay:0.25s"><text x="276.0845213036123" y="145.27864045000422" text-anchor="middle" font-size="15" fill="#1a1a1a" font-weight="bold">40%</text></g><g class="s" style="animation-delay:0.50s"><path d="M 200 165 L 273.5 266.1 A 125 125 0 0 1 81.1 203.6 Z" fill="#fde8c4" stroke="#1a1a1a" stroke-width="2"/></g><g class="s" style="animation-delay:0.75s"><text x="175.27864045000422" y="246.0845213036123" text-anchor="middle" font-size="15" fill="#1a1a1a" font-weight="bold">30%</text></g><g class="s" style="animation-delay:1.00s"><path d="M 200 165 L 81.1 203.6 A 125 125 0 0 1 126.5 63.9 Z" fill="#dcefdc" stroke="#1a1a1a" stroke-width="2"/></g><g class="s" style="animation-delay:1.25s"><text x="123.91547869638771" y="145.27864045000422" text-anchor="middle" font-size="15" fill="#1a1a1a" font-weight="bold">20%</text></g><g class="s" style="animation-delay:1.50s"><path d="M 200 165 L 126.5 63.9 A 125 125 0 0 1 200.0 40.0 Z" fill="#f6dada" stroke="#1a1a1a" stroke-width="2"/></g><g class="s" style="animation-delay:1.75s"><text x="175.2786404500042" y="93.91547869638772" text-anchor="middle" font-size="15" fill="#1a1a1a" font-weight="bold">10%</text></g><g class="s" style="animation-delay:2.00s"><rect x="370" y="80" width="22" height="22" rx="0" fill="#eaf2fb" stroke="#1a1a1a" stroke-width="2"/></g><g class="s" style="animation-delay:2.25s"><text x="402" y="98" text-anchor="start" font-size="15" fill="#1a1a1a">Food: 40° = 40% × 360°</text></g><g class="s" style="animation-delay:2.50s"><rect x="370" y="124" width="22" height="22" rx="0" fill="#fde8c4" stroke="#1a1a1a" stroke-width="2"/></g><g class="s" style="animation-delay:2.75s"><text x="402" y="142" text-anchor="start" font-size="15" fill="#1a1a1a">Rent: 30° = 30% × 360°</text></g><g class="s" style="animation-delay:3.00s"><rect x="370" y="168" width="22" height="22" rx="0" fill="#dcefdc" stroke="#1a1a1a" stroke-width="2"/></g><g class="s" style="animation-delay:3.25s"><text x="402" y="186" text-anchor="start" font-size="15" fill="#1a1a1a">Transport: 20° = 20% × 360°</text></g><g class="s" style="animation-delay:3.50s"><rect x="370" y="212" width="22" height="22" rx="0" fill="#f6dada" stroke="#1a1a1a" stroke-width="2"/></g><g class="s" style="animation-delay:3.75s"><text x="402" y="230" text-anchor="start" font-size="15" fill="#1a1a1a">Other: 10° = 10% × 360°</text></g></svg>
