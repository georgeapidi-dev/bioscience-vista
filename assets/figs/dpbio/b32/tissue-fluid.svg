<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 990 515" font-family="system-ui,Arial,sans-serif" role="img" aria-label="Capillary bed: plasma forced out by pressure filtration at the arteriole end, water returning by osmosis at the venule end, substances exchanged with body cells, excess fluid draining into a lymph duct"><rect width="990" height="515" fill="#fff"/><defs><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker></defs><text x="450" y="28" font-size="19" text-anchor="middle" fill="#1f2937" font-weight="bold">Formation and reuptake of tissue fluid in a capillary bed</text><rect x="60" y="150" width="780" height="70" rx="35" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><linearGradient id="gcap" x1="0" x2="1"><stop offset="0" stop-color="#fecaca"/><stop offset="1" stop-color="#ddd6fe"/></linearGradient><rect x="60" y="150" width="780" height="70" rx="35" fill="url(#gcap)" stroke="#7f1d1d" stroke-width="2"/><text x="110" y="192" font-size="15" text-anchor="start" fill="#dc2626" font-weight="bold">ARTERIOLE END</text><text x="790" y="192" font-size="15" text-anchor="end" fill="#7c3aed" font-weight="bold">VENULE END</text><line x1="330" y1="185" x2="570" y2="185" stroke="#1f2937" stroke-width="2" marker-end="url(#ak)"/><text x="450" y="176" font-size="14" text-anchor="middle" fill="#1f2937" font-weight="normal">blood flow</text><line x1="150" y1="222" x2="150" y2="290" stroke="#dc2626" stroke-width="3" marker-end="url(#ar)"/><line x1="210" y1="222" x2="210" y2="290" stroke="#dc2626" stroke-width="3" marker-end="url(#ar)"/><line x1="270" y1="222" x2="270" y2="290" stroke="#dc2626" stroke-width="3" marker-end="url(#ar)"/><line x1="630" y1="290" x2="630" y2="224" stroke="#2563eb" stroke-width="3" marker-end="url(#ab)"/><line x1="690" y1="290" x2="690" y2="224" stroke="#2563eb" stroke-width="3" marker-end="url(#ab)"/><line x1="750" y1="290" x2="750" y2="224" stroke="#2563eb" stroke-width="3" marker-end="url(#ab)"/><text x="210" y="72" font-size="14" text-anchor="middle" fill="#dc2626" font-weight="normal">High hydrostatic (blood) pressure</text><text x="210" y="89" font-size="14" text-anchor="middle" fill="#dc2626" font-weight="normal">forces plasma out through gaps:</text><text x="210" y="106" font-size="14" text-anchor="middle" fill="#dc2626" font-weight="normal">PRESSURE FILTRATION</text><text x="640" y="72" font-size="14" text-anchor="middle" fill="#2563eb" font-weight="normal">Pressure lower; plasma proteins stay</text><text x="640" y="89" font-size="14" text-anchor="middle" fill="#2563eb" font-weight="normal">in the blood, so water potential of blood</text><text x="640" y="106" font-size="14" text-anchor="middle" fill="#2563eb" font-weight="normal">is lower: water returns by OSMOSIS</text><rect x="60" y="300" width="780" height="150" rx="12" fill="#f0f9ff" stroke="#93c5fd" stroke-width="1.5"/><text x="70" y="322" font-size="14" text-anchor="start" fill="#1e40af" font-weight="bold">Tissue fluid (bathes the cells)</text><ellipse cx="140" cy="395" rx="52" ry="34" fill="#fef9c3" stroke="#92400e" stroke-width="1.5"/><circle cx="140" cy="395" r="9" fill="#fde68a" stroke="#92400e" stroke-width="1.5"/><ellipse cx="270" cy="395" rx="52" ry="34" fill="#fef9c3" stroke="#92400e" stroke-width="1.5"/><circle cx="270" cy="395" r="9" fill="#fde68a" stroke="#92400e" stroke-width="1.5"/><ellipse cx="400" cy="395" rx="52" ry="34" fill="#fef9c3" stroke="#92400e" stroke-width="1.5"/><circle cx="400" cy="395" r="9" fill="#fde68a" stroke="#92400e" stroke-width="1.5"/><ellipse cx="530" cy="395" rx="52" ry="34" fill="#fef9c3" stroke="#92400e" stroke-width="1.5"/><circle cx="530" cy="395" r="9" fill="#fde68a" stroke="#92400e" stroke-width="1.5"/><ellipse cx="660" cy="395" rx="52" ry="34" fill="#fef9c3" stroke="#92400e" stroke-width="1.5"/><circle cx="660" cy="395" r="9" fill="#fde68a" stroke="#92400e" stroke-width="1.5"/><text x="270" y="440" font-size="13" text-anchor="middle" fill="#92400e" font-weight="normal">body cells</text><line x1="330" y1="330" x2="380" y2="368" stroke="#16a34a" stroke-width="2.5" marker-end="url(#ag)"/><text x="306" y="345" font-size="13" text-anchor="end" fill="#16a34a" font-weight="normal">O₂, glucose,</text><text x="306" y="361" font-size="13" text-anchor="end" fill="#16a34a" font-weight="normal">amino acids in</text><line x1="470" y1="368" x2="520" y2="330" stroke="#d97706" stroke-width="2.5" marker-end="url(#aa)"/><text x="528" y="342" font-size="13" text-anchor="start" fill="#d97706" font-weight="normal">CO₂, urea out</text><text x="450" y="470" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="normal">Substances move between tissue fluid and cells mainly by diffusion (some by facilitated diffusion or active transport).</text><path d="M 800 330 C 850 320 880 300 880 260 L 880 60" stroke="#0d9488" stroke-width="14" fill="none"/><path d="M 800 330 C 850 320 880 300 880 260 L 880 60" stroke="#ccfbf1" stroke-width="8" fill="none"/><line x1="880" y1="110" x2="880" y2="50" stroke="#0d9488" stroke-width="3" marker-end="url(#at)"/><text x="900" y="300" font-size="14" text-anchor="start" fill="#0d9488" font-weight="bold">lymph</text><text x="900" y="317" font-size="14" text-anchor="start" fill="#0d9488" font-weight="bold">duct</text><text x="900" y="90" font-size="12" text-anchor="start" fill="#0d9488" font-weight="normal">excess</text><text x="900" y="105" font-size="12" text-anchor="start" fill="#0d9488" font-weight="normal">tissue</text><text x="900" y="120" font-size="12" text-anchor="start" fill="#0d9488" font-weight="normal">fluid</text><text x="900" y="135" font-size="12" text-anchor="start" fill="#0d9488" font-weight="normal">drains</text><text x="900" y="150" font-size="12" text-anchor="start" fill="#0d9488" font-weight="normal">to lymph,</text><text x="900" y="165" font-size="12" text-anchor="start" fill="#0d9488" font-weight="normal">returned</text><text x="900" y="180" font-size="12" text-anchor="start" fill="#0d9488" font-weight="normal">to blood</text><text x="900" y="195" font-size="12" text-anchor="start" fill="#0d9488" font-weight="normal">in veins</text><text x="900" y="210" font-size="12" text-anchor="start" fill="#0d9488" font-weight="normal">near the</text><text x="900" y="225" font-size="12" text-anchor="start" fill="#0d9488" font-weight="normal">heart</text><text x="450" y="500" font-size="13" text-anchor="middle" fill="#475569" font-weight="normal" font-style="italic">More fluid leaves at the arteriole end than returns at the venule end; the excess drains into lymph ducts.</text></svg>