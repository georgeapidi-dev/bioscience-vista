<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 535" font-family="system-ui,Arial,sans-serif" role="img" aria-label="Fish: heart to gills to body and back to the heart in one circuit. Mammal: right side of heart to lungs, back to the left side, then to the body and back to the right side, in two circuits"><style>@media (prefers-reduced-motion: reduce){.anim{display:none}}</style><rect width="900" height="535" fill="#fff"/><defs><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker></defs><text x="450" y="30" font-size="19" text-anchor="middle" fill="#1f2937" font-weight="bold">Single circulation (bony fish) and double circulation (mammal)</text><rect x="130" y="70" width="160" height="54" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="210.0" y="93.16666666666667" font-size="14" text-anchor="middle" fill="#1f2937" font-weight="bold">GILLS</text><text x="210.0" y="110.16666666666667" font-size="14" text-anchor="middle" fill="#1f2937" font-weight="bold">capillaries</text><rect x="130" y="300" width="160" height="54" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="210.0" y="323.3333333333333" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="bold">HEART</text><text x="210.0" y="339.3333333333333" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="bold">1 atrium, 1 ventricle</text><rect x="130" y="420" width="160" height="54" rx="8" fill="#f3f4f6" stroke="#94a3b8" stroke-width="2"/><text x="210.0" y="443.1666666666667" font-size="14" text-anchor="middle" fill="#1f2937" font-weight="bold">BODY</text><text x="210.0" y="460.1666666666667" font-size="14" text-anchor="middle" fill="#1f2937" font-weight="bold">capillaries</text><path d="M 290 97 C 380 97 380 447 290 447" stroke="#dc2626" stroke-width="3" fill="none" marker-end="url(#ar)"/><path d="M 130 447 C 60 447 60 327 130 327" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#ab)"/><path d="M 210 300 L 210 128" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#ab)"/><text x="360" y="270" font-size="13" text-anchor="start" fill="#dc2626" font-weight="normal">low pressure</text><text x="360" y="286" font-size="13" text-anchor="start" fill="#dc2626" font-weight="normal">after the gills</text><text x="210" y="510" font-size="14" text-anchor="middle" fill="#1f2937" font-weight="bold">Blood passes through the heart ONCE per circuit</text><rect x="590" y="70" width="160" height="54" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="670.0" y="93.16666666666667" font-size="14" text-anchor="middle" fill="#1f2937" font-weight="bold">LUNGS</text><text x="670.0" y="110.16666666666667" font-size="14" text-anchor="middle" fill="#1f2937" font-weight="bold">capillaries</text><rect x="530" y="250" width="120" height="64" rx="8" fill="#e0e7ff" stroke="#2563eb" stroke-width="2"/><text x="590.0" y="278.1666666666667" font-size="14" text-anchor="middle" fill="#1f2937" font-weight="bold">RIGHT</text><text x="590.0" y="295.1666666666667" font-size="14" text-anchor="middle" fill="#1f2937" font-weight="bold">side</text><rect x="690" y="250" width="120" height="64" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="750.0" y="278.1666666666667" font-size="14" text-anchor="middle" fill="#1f2937" font-weight="bold">LEFT</text><text x="750.0" y="295.1666666666667" font-size="14" text-anchor="middle" fill="#1f2937" font-weight="bold">side</text><rect x="590" y="420" width="160" height="54" rx="8" fill="#f3f4f6" stroke="#94a3b8" stroke-width="2"/><text x="670.0" y="443.1666666666667" font-size="14" text-anchor="middle" fill="#1f2937" font-weight="bold">BODY</text><text x="670.0" y="460.1666666666667" font-size="14" text-anchor="middle" fill="#1f2937" font-weight="bold">capillaries</text><text x="670" y="340" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="bold">HEART: 2 pumps, separated by the septum</text><path d="M 570 250 L 600 128" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#ab)"/><text x="520" y="190" font-size="13" text-anchor="end" fill="#2563eb" font-weight="normal">pulmonary</text><text x="520" y="206" font-size="13" text-anchor="end" fill="#2563eb" font-weight="normal">artery</text><path d="M 740 128 L 770 250" stroke="#dc2626" stroke-width="3" fill="none" marker-end="url(#ar)"/><text x="780" y="190" font-size="13" text-anchor="start" fill="#dc2626" font-weight="normal">pulmonary</text><text x="780" y="206" font-size="13" text-anchor="start" fill="#dc2626" font-weight="normal">vein</text><path d="M 790 314 C 840 380 800 430 750 440" stroke="#dc2626" stroke-width="3" fill="none" marker-end="url(#ar)"/><text x="828" y="370" font-size="13" text-anchor="start" fill="#dc2626" font-weight="normal">aorta:</text><text x="828" y="386" font-size="13" text-anchor="start" fill="#dc2626" font-weight="normal">high</text><text x="828" y="402" font-size="13" text-anchor="start" fill="#dc2626" font-weight="normal">pressure</text><text x="828" y="418" font-size="13" text-anchor="start" fill="#dc2626" font-weight="normal">to the</text><text x="828" y="434" font-size="13" text-anchor="start" fill="#dc2626" font-weight="normal">body</text><path d="M 590 440 C 520 420 520 340 560 314" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#ab)"/><text x="512" y="400" font-size="13" text-anchor="end" fill="#2563eb" font-weight="normal">vena</text><text x="512" y="416" font-size="13" text-anchor="end" fill="#2563eb" font-weight="normal">cava</text><text x="670" y="510" font-size="14" text-anchor="middle" fill="#1f2937" font-weight="bold">Blood passes through the heart TWICE per circuit</text><line x1="450" y1="60" x2="450" y2="520" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6 6"/><g class="anim"><circle r="6" fill="#b91c1c" stroke="#fff" stroke-width="1"><animateMotion path="M 210 300 L 210 124 L 290 97 C 380 97 380 447 290 447 L 130 447 C 60 447 60 327 130 327 L 210 300" dur="8s" begin="0.00s" repeatCount="indefinite"/></circle><circle r="6" fill="#b91c1c" stroke="#fff" stroke-width="1"><animateMotion path="M 210 300 L 210 124 L 290 97 C 380 97 380 447 290 447 L 130 447 C 60 447 60 327 130 327 L 210 300" dur="8s" begin="-1.33s" repeatCount="indefinite"/></circle><circle r="6" fill="#b91c1c" stroke="#fff" stroke-width="1"><animateMotion path="M 210 300 L 210 124 L 290 97 C 380 97 380 447 290 447 L 130 447 C 60 447 60 327 130 327 L 210 300" dur="8s" begin="-2.67s" repeatCount="indefinite"/></circle><circle r="6" fill="#b91c1c" stroke="#fff" stroke-width="1"><animateMotion path="M 210 300 L 210 124 L 290 97 C 380 97 380 447 290 447 L 130 447 C 60 447 60 327 130 327 L 210 300" dur="8s" begin="-4.00s" repeatCount="indefinite"/></circle><circle r="6" fill="#b91c1c" stroke="#fff" stroke-width="1"><animateMotion path="M 210 300 L 210 124 L 290 97 C 380 97 380 447 290 447 L 130 447 C 60 447 60 327 130 327 L 210 300" dur="8s" begin="-5.33s" repeatCount="indefinite"/></circle><circle r="6" fill="#b91c1c" stroke="#fff" stroke-width="1"><animateMotion path="M 210 300 L 210 124 L 290 97 C 380 97 380 447 290 447 L 130 447 C 60 447 60 327 130 327 L 210 300" dur="8s" begin="-6.67s" repeatCount="indefinite"/></circle></g><g class="anim"><circle r="6" fill="#b91c1c" stroke="#fff" stroke-width="1"><animateMotion path="M 590 250 L 640 124 L 700 124 L 750 250 L 790 314 C 840 380 800 430 750 447 L 590 447 C 520 420 520 340 560 314 L 590 250" dur="9s" begin="0.00s" repeatCount="indefinite"/></circle><circle r="6" fill="#b91c1c" stroke="#fff" stroke-width="1"><animateMotion path="M 590 250 L 640 124 L 700 124 L 750 250 L 790 314 C 840 380 800 430 750 447 L 590 447 C 520 420 520 340 560 314 L 590 250" dur="9s" begin="-1.12s" repeatCount="indefinite"/></circle><circle r="6" fill="#b91c1c" stroke="#fff" stroke-width="1"><animateMotion path="M 590 250 L 640 124 L 700 124 L 750 250 L 790 314 C 840 380 800 430 750 447 L 590 447 C 520 420 520 340 560 314 L 590 250" dur="9s" begin="-2.25s" repeatCount="indefinite"/></circle><circle r="6" fill="#b91c1c" stroke="#fff" stroke-width="1"><animateMotion path="M 590 250 L 640 124 L 700 124 L 750 250 L 790 314 C 840 380 800 430 750 447 L 590 447 C 520 420 520 340 560 314 L 590 250" dur="9s" begin="-3.38s" repeatCount="indefinite"/></circle><circle r="6" fill="#b91c1c" stroke="#fff" stroke-width="1"><animateMotion path="M 590 250 L 640 124 L 700 124 L 750 250 L 790 314 C 840 380 800 430 750 447 L 590 447 C 520 420 520 340 560 314 L 590 250" dur="9s" begin="-4.50s" repeatCount="indefinite"/></circle><circle r="6" fill="#b91c1c" stroke="#fff" stroke-width="1"><animateMotion path="M 590 250 L 640 124 L 700 124 L 750 250 L 790 314 C 840 380 800 430 750 447 L 590 447 C 520 420 520 340 560 314 L 590 250" dur="9s" begin="-5.62s" repeatCount="indefinite"/></circle><circle r="6" fill="#b91c1c" stroke="#fff" stroke-width="1"><animateMotion path="M 590 250 L 640 124 L 700 124 L 750 250 L 790 314 C 840 380 800 430 750 447 L 590 447 C 520 420 520 340 560 314 L 590 250" dur="9s" begin="-6.75s" repeatCount="indefinite"/></circle><circle r="6" fill="#b91c1c" stroke="#fff" stroke-width="1"><animateMotion path="M 590 250 L 640 124 L 700 124 L 750 250 L 790 314 C 840 380 800 430 750 447 L 590 447 C 520 420 520 340 560 314 L 590 250" dur="9s" begin="-7.88s" repeatCount="indefinite"/></circle></g></svg>