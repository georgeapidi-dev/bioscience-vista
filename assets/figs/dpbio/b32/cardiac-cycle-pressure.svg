90.0 384.4 L 162.0 374.0 L 180.0 376.6 L 216.0 194.6 L 270.0 114.0 L 342.0 82.8 L 414.0 119.2 L 450.0 160.8 L 486.0 379.2 L 540.0 392.2 L 675.0 389.6 L 810.0 384.4" stroke="#7c3aed" stroke-width="3.5" fill="none"/><path d="M 90.0 384.4 L 144.0 371.4 L 180.0 381.8 L 216.0 389.6 L 360.0 379.2 L 468.0 368.8 L 504.0 379.2 L 630.0 387.0 L 810.0 384.4" stroke="#2563eb" stroke-width="3" fill="none" stroke-dasharray="7 4"/><text x="648.0" y="158.0" font-size="14" text-anchor="middle" fill="#dc2626" font-weight="bold">aorta</text><text x="279.0" y="244.0" font-size="14" text-anchor="start" fill="#7c3aed" font-weight="bold">left</text><text x="279.0" y="261.0" font-size="14" text-anchor="start" fill="#7c3aed" font-weight="bold">ventricle</text><text x="648.0" y="377.0" font-size="14" text-anchor="middle" fill="#2563eb" font-weight="bold">left atrium</text><circle cx="189.0" cy="376.6" r="6" fill="#fff" stroke="#1f2937" stroke-width="2.5"/><text x="197.0" y="316.6" font-size="12" text-anchor="start" fill="#1f2937" font-weight="bold">A: AV valve closes</text><text x="197.0" y="331.6" font-size="12" text-anchor="start" fill="#1f2937" font-weight="bold">(ventricle &gt; atrium)</text><circle cx="216.0" cy="194.6" r="6" fill="#fff" stroke="#1f2937" stroke-width="2.5"/><text x="224.0" y="116.6" font-size="12" text-anchor="start" fill="#1f2937" font-weight="bold">B: semilunar valve opens</text><text x="224.0" y="131.6" font-size="12" text-anchor="start" fill="#1f2937" font-weight="bold">(ventricle &gt; aorta)</text><circle cx="459.0" cy="160.79999999999998" r="6" fill="#fff" stroke="#1f2937" stroke-width="2.5"/><text x="467.0" y="112.79999999999998" font-size="12" text-anchor="start" fill="#1f2937" font-weight="bold">C: semilunar valve closes</text><text x="467.0" y="127.79999999999998" font-size="12" text-anchor="start" fill="#1f2937" font-weight="bold">(ventricle &lt; aorta)</text><circle cx="495.0" cy="381.8" r="6" fill="#fff" stroke="#1f2937" stroke-width="2.5"/><text x="503.0" y="341.8" font-size="12" text-anchor="start" fill="#1f2937" font-weight="bold">D: AV valve opens</text><text x="503.0" y="356.8" font-size="12" text-anchor="start" fill="#1f2937" font-weight="bold">(ventricle &lt; atrium)</text><text x="470" y="475" font-size="13" text-anchor="middle" fill="#475569" font-weight="normal" font-style="italic">Valves open and close passively when the pressure on one side becomes higher than on the other.</text><g class="anim"><line x1="0" y1="80" x2="0" y2="400" stroke="#1f2937" stroke-width="2" stroke-dasharray="4 3"><animateTransform attributeName="transform" type="translate" from="90 0" to="810.0 0" dur="8s" repeatCount="indefinite"/></line></g></svg>