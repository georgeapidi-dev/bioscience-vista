<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 490" font-family="system-ui,Arial,sans-serif" role="img" aria-label="Graph of pressure against time for the aorta, left ventricle and left atrium during one 0.8 s cardiac cycle, marking when the AV and semilunar valves close and open"><style>@media (prefers-reduced-motion: reduce){.anim{display:none}}</style><rect width="940" height="490" fill="#fff"/><defs><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker></defs><text x="470" y="28" font-size="18" text-anchor="middle" fill="#1f2937" font-weight="bold">Pressure changes in the left side of the heart during one cardiac cycle</text><rect x="90" y="50" width="90.0" height="350" fill="#fef3c7"/><rect x="180.0" y="50" width="270.0" height="350" fill="#fee2e2"/><rect x="450.0" y="50" width="360.0" height="350" fill="#e0f2fe"/><text x="135.0" y="66" font-si