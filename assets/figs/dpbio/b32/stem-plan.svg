<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="system-ui,Arial,sans-serif" role="img" aria-label="Plan diagram of a dicot stem: epidermis, cortex, a ring of eight vascular bundles each with phloem outside, cambium and xylem inside, and central pith, with the function of each tissue"><rect width="960" height="560" fill="#fff"/><defs><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker></defs><text x="450" y="30" font-size="19" text-anchor="middle" fill="#1f2937" font-weight="bold">Plan diagram: transverse section of a dicotyledonous stem</text><circle cx="300" cy="290" r="225" fill="#fff" stroke="#1f2937" stroke-width="2.5"/><circle cx="300" cy="290" r="218" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/><circle cx="300" cy="290" r="108" fill="#fafaf9" stroke="#a8a29e" stroke-width="1.5"/><g transform="translate(460.0 290.0) rotate(90.0)"><path d="M -30 -32 Q 0 -48 30 -32 L 26 -10 L -26 -10 Z" fill="#d9f99d" stroke="#3f6212" stroke-width="2"/><line x1="-28" y1="-6" x2="28" y2="-6" stroke="#0f766e" stroke-width="3" stroke-dasharray="4 3"/><path d="M -26 -2 L 26 -2 L 14 36 Q 0 44 -14 36 Z" fill="#fed7aa" stroke="#9a3412" stroke-width="2"/></g><g transform="translate(413.1 403.1) rotate(135.0)"><path d="M -30 -32 Q 0 -48 30 -32 L 26 -10 L -26 -10 Z" fill="#d9f99d" stroke="#3f6212" stroke-width="2"/><line x1="-28" y1="-6" x2="28" y2="-6" stroke="#0f766e" stroke-width="3" stroke-dasharray="4 3"/><path d="M -26 -2 L 26 -2 L 14 36 Q 0 44 -14 36 Z" fill="#fed7aa" stroke="#9a3412" stroke-width="2"/></g><g transform="translate(300.0 450.0) rotate(180.0)"><path d="M -30 -32 Q 0 -48 30 -32 L 26 -10 L -26 -10 Z" fill="#d9f99d" stroke="#3f6212" stroke-width="2"/><line x1="-28" y1="-6" x2="28" y2="-6" stroke="#0f766e" stroke-width="3" stroke-dasharray="4 3"/><path d="M -26 -2 L 26 -2 L 14 36 Q 0 44 -14 36 Z" fill="#fed7aa" stroke="#9a3412" stroke-width="2"/></g><g transform="translate(186.9 403.1) rotate(225.0)"><path d="M -30 -32 Q 0 -48 30 -32 L 26 -10 L -26 -10 Z" fill="#d9f99d" stroke="#3f6212" stroke-width="2"/><line x1="-28" y1="-6" x2="28" y2="-6" stroke="#0f766e" stroke-width="3" stroke-dasharray="4 3"/><path d="M -26 -2 L 26 -2 L 14 36 Q 0 44 -14 36 Z" fill="#fed7aa" stroke="#9a3412" stroke-width="2"/></g><g transform="translate(140.0 290.0) rotate(270.0)"><path d="M -30 -32 Q 0 -48 30 -32 L 26 -10 L -26 -10 Z" fill="#d9f99d" stroke="#3f6212" stroke-width="2"/><line x1="-28" y1="-6" x2="28" y2="-6" stroke="#0f766e" stroke-width="3" stroke-dasharray="4 3"/><path d="M -26 -2 L 26 -2 L 14 36 Q 0 44 -14 36 Z" fill="#fed7aa" stroke="#9a3412" stroke-width="2"/></g><g transform="translate(186.9 176.9) rotate(315.0)"><path d="M -30 -32 Q 0 -48 30 -32 L 26 -10 L -26 -10 Z" fill="#d9f99d" stroke="#3f6212" stroke-width="2"/><line x1="-28" y1="-6" x2="28" y2="-6" stroke="#0f766e" stroke-width="3" stroke-dasharray="4 3"/><path d="M -26 -2 L 26 -2 L 14 36 Q 0 44 -14 36 Z" fill="#fed7aa" stroke="#9a3412" stroke-width="2"/></g><g transform="translate(300.0 130.0) rotate(360.0)"><path d="M -30 -32 Q 0 -48 30 -32 L 26 -10 L -26 -10 Z" fill="#d9f99d" stroke="#3f6212" stroke-width="2"/><line x1="-28" y1="-6" x2="28" y2="-6" stroke="#0f766e" stroke-width="3" stroke-dasharray="4 3"/><path d="M -26 -2 L 26 -2 L 14 36 Q 0 44 -14 36 Z" fill="#fed7aa" stroke="#9a3412" stroke-width="2"/></g><g transform="translate(413.1 176.9) rotate(405.0)"><path d="M -30 -32 Q 0 -48 30 -32 L 26 -10 L -26 -10 Z" fill="#d9f99d" stroke="#3f6212" stroke-width="2"/><line x1="-28" y1="-6" x2="28" y2="-6" stroke="#0f766e" stroke-width="3" stroke-dasharray="4 3"/><path d="M -26 -2 L 26 -2 L 14 36 Q 0 44 -14 36 Z" fill="#fed7aa" stroke="#9a3412" stroke-width="2"/></g><line x1="500" y1="290" x2="624" y2="245" stroke="#475569" stroke-width="1.2"/><circle cx="500" cy="290" r="2.5" fill="#475569" stroke="#475569" stroke-width="1"/><text x="620" y="250" font-size="14" text-anchor="start" fill="#1f2937" font-weight="normal">phloem (outer side of bundle):</text><text x="620" y="267" font-size="14" text-anchor="start" fill="#1f2937" font-weight="normal">transports sugars and amino acids</text><line x1="464" y1="270" x2="624" y2="305" stroke="#475569" stroke-width="1.2"/><circle cx="464" cy="270" r="2.5" fill="#475569" stroke="#475569" stroke-width="1"/><text x="620" y="310" font-size="14" text-anchor="start" fill="#1f2937" font-weight="normal">cambium: dividing cells that make</text><text x="620" y="327" font-size="14" text-anchor="start" fill="#1f2937" font-weight="normal">new xylem and phloem</text><line x1="432" y1="290" x2="624" y2="365" stroke="#475569" stroke-width="1.2"/><circle cx="432" cy="290" r="2.5" fill="#475569" stroke="#475569" stroke-width="1"/><text x="620" y="370" font-size="14" text-anchor="start" fill="#1f2937" font-weight="normal">xylem (inner side of bundle):</text><text x="620" y="387" font-size="14" text-anchor="start" fill="#1f2937" font-weight="normal">water and mineral ions; support</text><line x1="516" y1="230" x2="624" y2="95" stroke="#475569" stroke-width="1.2"/><circle cx="516" cy="230" r="2.5" fill="#475569" stroke="#475569" stroke-width="1"/><text x="620" y="100" font-size="14" text-anchor="start" fill="#1f2937" font-weight="normal">epidermis: one cell layer; waterproof cuticle,</text><text x="620" y="117" font-size="14" text-anchor="start" fill="#1f2937" font-weight="normal">protects the stem</text><line x1="440" y1="150" x2="624" y2="160" stroke="#475569" stroke-width="1.2"/><circle cx="440" cy="150" r="2.5" fill="#475569" stroke="#475569" stroke-width="1"/><text x="620" y="165" font-size="14" text-anchor="start" fill="#1f2937" font-weight="normal">cortex: packing and storage tissue;</text><text x="620" y="182" font-size="14" text-anchor="start" fill="#1f2937" font-weight="normal">some photosynthesis and support</text><line x1="300" y1="290" x2="624" y2="445" stroke="#475569" stroke-width="1.2"/><circle cx="300" cy="290" r="2.5" fill="#475569" stroke="#475569" stroke-width="1"/><text x="620" y="450" font-size="14" text-anchor="start" fill="#1f2937" font-weight="normal">pith: central storage tissue</text><text x="450" y="545" font-size="13" text-anchor="middle" fill="#475569" font-weight="normal" font-style="italic">Vascular bundles form a ring near the outside of the stem, giving resistance to bending.</text></svg>