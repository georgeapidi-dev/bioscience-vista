<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="system-ui,Arial,sans-serif" role="img" aria-label="Plan diagram of a dicot root: epidermis with root hairs, wide cortex, endodermis, and a central vascular cylinder with star-shaped xylem and phloem between its arms"><rect width="960" height="560" fill="#fff"/><defs><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker></defs><text x="450" y="30" font-size="19" text-anchor="middle" fill="#1f2937" font-weight="bold">Plan diagram: transverse section of a dicotyledonous root</text><circle cx="300" cy="290" r="215" fill="#fff" stroke="#1f2937" stroke-width="2.5"/><line x1="515.0" y1="290.0" x2="549.6875650987415" y2="302.4947923176696" stroke="#1f2937" stroke-width="2"/><line x1="407.5" y1="476.19546181365433" x2="414.0229749872583" y2="512.4831705434258" stroke="#1f2937" stroke-width="2"/><line x1="192.50000000000006" y1="476.19546181365433" x2="164.3354098885168" y2="499.98837822575626" stroke="#1f2937" stroke-width="2"/><line x1="85.0" y1="290.0" x2="50.31243490125843" y2="277.5052076823305" stroke="#1f2937" stroke-width="2"/><line x1="192.4999999999999" y1="103.80453818634575" x2="185.9770250127416" y2="67.5168294565743" stroke="#1f2937" stroke-width="2"/><line x1="407.4999999999999" y1="103.80453818634561" x2="435.6645901114831" y2="80.01162177424371" stroke="#1f2937" stroke-width="2"/><circle cx="300" cy="290" r="206" fill="#fefce8" stroke="#d6d3d1" stroke-width="1"/><circle cx="300" cy="290" r="78" fill="#ecfeff" stroke="#0d9488" stroke-width="3"/><circle cx="300" cy="290" r="70" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/><path d="M 300 228 L 314 276 L 362 290 L 314 304 L 300 352 L 286 304 L 238 290 L 286 276 Z" stroke="#9a3412" stroke-width="2" fill="#fed7aa"/><ellipse cx="328.2842712474619" cy="318.2842712474619" rx="13" ry="13" fill="#d9f99d" stroke="#3f6212" stroke-width="2"/><ellipse cx="271.7157287525381" cy="318.2842712474619" rx="13" ry="13" fill="#d9f99d" stroke="#3f6212" stroke-width="2"/><ellipse cx="271.7157287525381" cy="261.7157287525381" rx="13" ry="13" fill="#d9f99d" stroke="#3f6212" stroke-width="2"/><ellipse cx="328.2842712474619" cy="261.7157287525381" rx="13" ry="13" fill="#d9f99d" stroke="#3f6212" stroke-width="2"/><line x1="358" y1="290" x2="624" y2="295" stroke="#475569" stroke-width="1.2"/><circle cx="358" cy="290" r="2.5" fill="#475569" stroke="#475569" stroke-width="1"/><text x="620" y="300" font-size="14" text-anchor="start" fill="#1f2937" font-weight="normal">xylem: central star (X) shape;</text><text x="620" y="317" font-size="14" text-anchor="start" fill="#1f2937" font-weight="normal">water and mineral ions up to the stem</text><line x1="330" y1="320" x2="624" y2="365" stroke="#475569" stroke-width="1.2"/><circle cx="330" cy="320" r="2.5" fill="#475569" stroke="#475569" stroke-width="1"/><text x="620" y="370" font-size="14" text-anchor="start" fill="#1f2937" font-weight="normal">phloem: between the arms of the xylem;</text><text x="620" y="387" font-size="14" text-anchor="start" fill="#1f2937" font-weight="normal">sugars to the root (a sink)</text><line x1="224" y1="304" x2="624" y2="425" stroke="#475569" stroke-width="1.2"/><circle cx="224" cy="304" r="2.5" fill="#475569" stroke="#475569" stroke-width="1"/><text x="620" y="430" font-size="14" text-anchor="start" fill="#1f2937" font-weight="normal">endodermis: ring around the vascular</text><text x="620" y="447" font-size="14" text-anchor="start" fill="#1f2937" font-weight="normal">cylinder; controls entry of water and ions</text><line x1="180" y1="170" x2="624" y2="160" stroke="#475569" stroke-width="1.2"/><circle cx="180" cy="170" r="2.5" fill="#475569" stroke="#475569" stroke-width="1"/><text x="620" y="165" font-size="14" text-anchor="start" fill="#1f2937" font-weight="normal">cortex: wide; water moves across it to the</text><text x="620" y="182" font-size="14" text-anchor="start" fill="#1f2937" font-weight="normal">centre; stores starch</text><line x1="532" y1="297" x2="624" y2="220" stroke="#475569" stroke-width="1.2"/><circle cx="532" cy="297" r="2.5" fill="#475569" stroke="#475569" stroke-width="1"/><text x="620" y="225" font-size="14" text-anchor="start" fill="#1f2937" font-weight="normal">epidermis with root hairs: large surface</text><text x="620" y="242" font-size="14" text-anchor="start" fill="#1f2937" font-weight="normal">area for absorbing water and minerals</text><text x="450" y="545" font-size="13" text-anchor="middle" fill="#475569" font-weight="normal" font-style="italic">In the root the vascular tissue is central (resists pulling forces); in the stem it is a ring of bundles (resists bending).</text></svg>