<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 495" font-family="system-ui,Arial,sans-serif" role="img" aria-label="Two vein segments: when leg muscles contract they squeeze the thin-walled vein, the upper pocket valve opens and blood moves towards the heart while the lower valve closes to stop backflow"><style>@media (prefers-reduced-motion: reduce){.anim{display:none}}</style><rect width="900" height="495" fill="#fff"/><defs><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker></defs><text x="450" y="30" font-size="19" text-anchor="middle" fill="#1f2937" font-weight="bold">How veins return blood to the heart</text><rect x="204.0" y="70" width="52" height="340" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/><path d="M 204.0 150 Q 212.0 126 214.0 116" stroke="#2563eb" stroke-width="3" fill="none"/><path d="M 256.0 150 Q 248.0 126 246.0 116" stroke="#2563eb" stroke-width="3" fill="none"/><path d="M 204.0 330 Q 212.0 306 214.0 296" stroke="#2563eb" stroke-width="3" fill="none"/><path d="M 256.0 330 Q 248.0 306 246.0 296" stroke="#2563eb" stroke-width="3" fill="none"/><ellipse cx="177.5" cy="240" rx="22.5" ry="110" fill="#fecaca" stroke="#dc2626" stroke-width="2"/><ellipse cx="282.5" cy="240" rx="22.5" ry="110" fill="#fecaca" stroke="#dc2626" stroke-width="2"/><text x="230" y="440" font-size="15" text-anchor="middle" fill="#1f2937" font-weight="normal">Muscles relaxed: vein fills from below</text><rect x="623.0" y="70" width="34" height="340" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/><path d="M 623.0 150 Q 631.0 126 633.0 116" stroke="#2563eb" stroke-width="3" fill="none"/><path d="M 657.0 150 Q 649.0 126 647.0 116" stroke="#2563eb" stroke-width="3" fill="none"/><path d="M 623.0 300 Q 636 326 640 330" stroke="#2563eb" stroke-width="3" fill="none"/><path d="M 657.0 300 Q 644 326 640 330" stroke="#2563eb" stroke-width="3" fill="none"/><ellipse cx="584.0" cy="240" rx="35.0" ry="110" fill="#fecaca" stroke="#dc2626" stroke-width="2"/><ellipse cx="696.0" cy="240" rx="35.0" ry="110" fill="#fecaca" stroke="#dc2626" stroke-width="2"/><text x="640" y="440" font-size="15" text-anchor="middle" fill="#1f2937" font-weight="normal">Muscles contract: vein squeezed</text><line x1="640" y1="120" x2="640" y2="64" stroke="#2563eb" stroke-width="4" marker-end="url(#ab)"/><text x="668" y="82" font-size="14" text-anchor="start" fill="#2563eb" font-weight="bold">blood pushed towards the heart</text><line x1="230" y1="400" x2="230" y2="352" stroke="#2563eb" stroke-width="3" marker-end="url(#ab)"/><line x1="640" y1="322" x2="764" y2="355" stroke="#475569" stroke-width="1.2"/><circle cx="640" cy="322" r="2.5" fill="#475569" stroke="#475569" stroke-width="1"/><text x="760" y="360" font-size="14" text-anchor="start" fill="#1f2937" font-weight="normal">lower valve closes:</text><text x="760" y="377" font-size="14" text-anchor="start" fill="#1f2937" font-weight="normal">no backflow</text><line x1="640" y1="146" x2="764" y2="145" stroke="#475569" stroke-width="1.2"/><circle cx="640" cy="146" r="2.5" fill="#475569" stroke="#475569" stroke-width="1"/><text x="760" y="150" font-size="14" text-anchor="start" fill="#1f2937" font-weight="normal">upper valve</text><text x="760" y="167" font-size="14" text-anchor="start" fill="#1f2937" font-weight="normal">pushed open</text><line x1="276" y1="240" x2="344" y2="295" stroke="#475569" stroke-width="1.2"/><circle cx="276" cy="240" r="2.5" fill="#475569" stroke="#475569" stroke-width="1"/><text x="340" y="300" font-size="14" text-anchor="start" fill="#1f2937" font-weight="normal">skeletal</text><text x="340" y="317" font-size="14" text-anchor="start" fill="#1f2937" font-weight="normal">muscle</text><line x1="248" y1="200" x2="340" y2="185" stroke="#475569" stroke-width="1.2"/><circle cx="248" cy="200" r="2.5" fill="#475569" stroke="#475569" stroke-width="1"/><text x="336" y="190" font-size="14" text-anchor="start" fill="#1f2937" font-weight="normal">thin, flexible</text><text x="336" y="207" font-size="14" text-anchor="start" fill="#1f2937" font-weight="normal">wall, wide lumen</text><text x="450" y="478" font-size="13" text-anchor="middle" fill="#475569" font-weight="normal" font-style="italic">Blood in veins is at low pressure. Pocket valves and the squeezing of thin-walled veins by skeletal muscles keep it moving one way.</text><g class="anim"><circle r="6" fill="#1d4ed8" stroke="#fff" stroke-width="1"><animateMotion path="M 640 400 L 640 80" dur="2.5s" begin="0.00s" repeatCount="indefinite"/></circle><circle r="6" fill="#1d4ed8" stroke="#fff" stroke-width="1"><animateMotion path="M 640 400 L 640 80" dur="2.5s" begin="-0.62s" repeatCount="indefinite"/></circle><circle r="6" fill="#1d4ed8" stroke="#fff" stroke-width="1"><animateMotion path="M 640 400 L 640 80" dur="2.5s" begin="-1.25s" repeatCount="indefinite"/></circle><circle r="6" fill="#1d4ed8" stroke="#fff" stroke-width="1"><animateMotion path="M 640 400 L 640 80" dur="2.5s" begin="-1.88s" repeatCount="indefinite"/></circle></g></svg>