<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 530" font-family="system-ui,Arial,sans-serif" role="img" aria-label="A sieve tube next to xylem: at the source a companion cell actively loads sucrose and water enters by osmosis, raising pressure; sap flows by mass flow to the sink where sucrose is unloaded and water leaves"><rect width="940" height="530" fill="#fff"/><defs><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker></defs><text x="470" y="30" font-size="19" text-anchor="middle" fill="#1f2937" font-weight="bold">Translocation in phloem: from source to sink</text><rect x="350" y="70" width="90" height="420" rx="6" fill="#ecfccb" stroke="#3f6212" stroke-width="2.5"/><text x="395" y="62" font-size="14" text-anchor="middle" fill="#3f6212" font-weight="bold">sieve tube</text><line x1="350" y1="190" x2="440" y2="190" stroke="#3f6212" stroke-width="4" stroke-dasharray="10 6"/><line x1="350" y1="330" x2="440" y2="330" stroke="#3f6212" stroke-width="4" stroke-dasharray="10 6"/><rect x="250" y="70" width="90" height="420" rx="6" fill="#ffedd5" stroke="#9a3412" stroke-width="2"/><text x="295" y="62" font-size="14" text-anchor="middle" fill="#9a3412" font-weight="bold">xylem</text><rect x="450" y="90" width="60" height="90" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="480" y="140" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="bold">CC</text><ellipse cx="462" cy="105" rx="8" ry="4" fill="#fde68a" stroke="#d97706" stroke-width="1.2"/><ellipse cx="494" cy="112" rx="8" ry="4" fill="#fde68a" stroke="#d97706" stroke-width="1.2"/><ellipse cx="470" cy="160" rx="8" ry="4" fill="#fde68a" stroke="#d97706" stroke-width="1.2"/><ellipse cx="496" cy="160" rx="8" ry="4" fill="#fde68a" stroke="#d97706" stroke-width="1.2"/><rect x="560" y="80" width="330" height="110" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="725.0" y="131.16666666666666" font-size="14" text-anchor="middle" fill="#1f2937" font-weight="bold">SOURCE e.g. photosynthesising leaf,</text><text x="725.0" y="148.16666666666666" font-size="14" text-anchor="middle" fill="#1f2937" font-weight="bold">storage organ in spring</text><line x1="556" y1="135" x2="514" y2="135" stroke="#16a34a" stroke-width="3" marker-end="url(#ag)"/><line x1="450" y1="135" x2="444" y2="135" stroke="#16a34a" stroke-width="3" marker-end="url(#ag)"/><text x="475" y="208" font-size="12" text-anchor="start" fill="#16a34a" font-weight="normal">active loading of sucrose by the</text><text x="475" y="223" font-size="12" text-anchor="start" fill="#16a34a" font-weight="normal">companion cell (ATP from many mitochondria),</text><text x="475" y="238" font-size="12" text-anchor="start" fill="#16a34a" font-weight="normal">through plasmodesmata</text><line x1="340" y1="120" x2="352" y2="120" stroke="#2563eb" stroke-width="3" marker-end="url(#ab)"/><text x="110" y="100" font-size="13" text-anchor="start" fill="#2563eb" font-weight="normal">water enters</text><text x="110" y="116" font-size="13" text-anchor="start" fill="#2563eb" font-weight="normal">the sieve tube</text><text x="110" y="132" font-size="13" text-anchor="start" fill="#2563eb" font-weight="normal">by osmosis:</text><text x="110" y="148" font-size="13" text-anchor="start" fill="#2563eb" font-weight="normal">HIGH pressure</text><line x1="395" y1="170" x2="395" y2="400" stroke="#7c3aed" stroke-width="6" marker-end="url(#ap)"/><text x="110" y="260" font-size="14" text-anchor="start" fill="#7c3aed" font-weight="bold">sap flows by</text><text x="110" y="277" font-size="14" text-anchor="start" fill="#7c3aed" font-weight="bold">mass flow,</text><text x="110" y="294" font-size="14" text-anchor="start" fill="#7c3aed" font-weight="bold">high → low</text><text x="110" y="311" font-size="14" text-anchor="start" fill="#7c3aed" font-weight="bold">pressure</text><rect x="560" y="380" width="330" height="100" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="725.0" y="426.1666666666667" font-size="14" text-anchor="middle" fill="#1f2937" font-weight="bold">SINK e.g. root, fruit, seed,</text><text x="725.0" y="443.1666666666667" font-size="14" text-anchor="middle" fill="#1f2937" font-weight="bold">growing tip, storage organ</text><line x1="444" y1="430" x2="556" y2="430" stroke="#d97706" stroke-width="3" marker-end="url(#aa)"/><text x="470" y="462" font-size="12" text-anchor="start" fill="#d97706" font-weight="normal">sucrose unloaded; used or stored as starch</text><line x1="352" y1="445" x2="340" y2="445" stroke="#2563eb" stroke-width="3" marker-end="url(#ab)"/><text x="110" y="420" font-size="13" text-anchor="start" fill="#2563eb" font-weight="normal">water leaves</text><text x="110" y="436" font-size="13" text-anchor="start" fill="#2563eb" font-weight="normal">by osmosis:</text><text x="110" y="452" font-size="13" text-anchor="start" fill="#2563eb" font-weight="normal">LOW pressure</text><text x="470" y="515" font-size="13" text-anchor="middle" fill="#475569" font-weight="normal" font-style="italic">Sources and sinks can change, so phloem transport is bidirectional (up or down), unlike xylem.</text></svg>