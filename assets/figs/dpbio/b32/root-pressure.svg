<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 515" font-family="system-ui,Arial,sans-serif" role="img" aria-label="Root cells use ATP to pump mineral ions into the xylem; water follows by osmosis and builds a positive pressure that pushes water up"><rect width="900" height="515" fill="#fff"/><defs><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker></defs><text x="450" y="30" font-size="19" text-anchor="middle" fill="#1f2937" font-weight="bold">Root pressure: active transport of mineral ions into the xylem</text><rect x="60" y="300" width="780" height="170" rx="10" fill="#fefce8" stroke="#a8a29e" stroke-width="1.5"/><text x="70" y="322" font-size="13" text-anchor="start" fill="#92400e" font-weight="normal">root (transverse view, simplified)</text><rect x="400" y="60" width="100" height="410" rx="6" fill="#ffedd5" stroke="#9a3412" stroke-width="2.5"/><text x="450" y="52" font-size="14" text-anchor="middle" fill="#9a3412" font-weight="bold">xylem vessel</text><ellipse cx="140" cy="395" rx="46" ry="36" fill="#fef9c3" stroke="#92400e" stroke-width="1.5"/><ellipse cx="250" cy="395" rx="46" ry="36" fill="#fef9c3" stroke="#92400e" stroke-width="1.5"/><ellipse cx="600" cy="395" rx="46" ry="36" fill="#fef9c3" stroke="#92400e" stroke-width="1.5"/><ellipse cx="720" cy="395" rx="46" ry="36" fill="#fef9c3" stroke="#92400e" stroke-width="1.5"/><text x="195" y="455" font-size="13" text-anchor="middle" fill="#92400e" font-weight="normal">root cells (cortex, endodermis)</text><line x1="292" y1="385" x2="396" y2="385" stroke="#16a34a" stroke-width="3" marker-end="url(#ag)"/><text x="344" y="372" font-size="14" text-anchor="middle" fill="#16a34a" font-weight="bold">ions</text><circle cx="344" cy="404" r="15" fill="#fde68a" stroke="#d97706" stroke-width="2"/><text x="344" y="409" font-size="11" text-anchor="middle" fill="#1f2937" font-weight="bold">ATP</text><text x="80" y="200" font-size="14" text-anchor="start" fill="#16a34a" font-weight="normal">1 Root cells actively pump</text><text x="80" y="217" font-size="14" text-anchor="start" fill="#16a34a" font-weight="normal">mineral ions (e.g. K⁺, NO₃⁻)</text><text x="80" y="234" font-size="14" text-anchor="start" fill="#16a34a" font-weight="normal">into the xylem, using</text><text x="80" y="251" font-size="14" text-anchor="start" fill="#16a34a" font-weight="normal">energy from ATP</text><line x1="560" y1="430" x2="504" y2="430" stroke="#2563eb" stroke-width="3" marker-end="url(#ab)"/><text x="540" y="246" font-size="14" text-anchor="start" fill="#2563eb" font-weight="normal">2 Water potential in the xylem falls;</text><text x="540" y="263" font-size="14" text-anchor="start" fill="#2563eb" font-weight="normal">water follows the ions into the</text><text x="540" y="280" font-size="14" text-anchor="start" fill="#2563eb" font-weight="normal">xylem by osmosis</text><line x1="450" y1="290" x2="450" y2="80" stroke="#2563eb" stroke-width="5" marker-end="url(#ab)"/><text x="520" y="150" font-size="14" text-anchor="start" fill="#9a3412" font-weight="bold">3 Water entering a closed tube</text><text x="520" y="167" font-size="14" text-anchor="start" fill="#9a3412" font-weight="bold">builds up a POSITIVE pressure</text><text x="520" y="184" font-size="14" text-anchor="start" fill="#9a3412" font-weight="bold">that pushes water up the stem</text><text x="450" y="500" font-size="13" text-anchor="middle" fill="#475569" font-weight="normal" font-style="italic">Root pressure matters most when transpiration is low: at night, in very humid air, or in spring before deciduous trees open their leaves.</text></svg>