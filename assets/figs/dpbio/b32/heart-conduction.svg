<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 555" font-family="system-ui,Arial,sans-serif" role="img" aria-label="Heart outline showing the SA node in the right atrium, the AV node, the bundle of His in the septum and Purkinje fibres in the ventricle walls, with the order in which the impulse spreads"><style>@media (prefers-reduced-motion: reduce){.anim{display:none}}</style><rect width="960" height="555" fill="#fff"/><defs><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker></defs><text x="450" y="30" font-size="19" text-anchor="middle" fill="#1f2937" font-weight="bold">How each heartbeat is triggered and spread</text><path d="M 250 120 C 200 60 320 50 350 100 C 380 50 520 50 520 120 C 620 160 600 330 470 440 L 400 500 L 330 440 C 200 330 170 170 250 120 Z" stroke="#7f1d1d" stroke-width="3" fill="#fee2e2"/><line x1="390" y1="230" x2="380" y2="470" stroke="#7f1d1d" stroke-width="3"/><path d="M 230 215 C 300 235 470 235 560 215" stroke="#7f1d1d" stroke-width="2" fill="none" stroke-dasharray="6 4"/><text x="290" y="160" font-size="13" text-anchor="middle" fill="#7f1d1d" font-weight="normal">right</text><text x="290" y="176" font-size="13" text-anchor="middle" fill="#7f1d1d" font-weight="normal">atrium</text><text x="480" y="160" font-size="13" text-anchor="middle" fill="#7f1d1d" font-weight="normal">left</text><text x="480" y="176" font-size="13" text-anchor="middle" fill="#7f1d1d" font-weight="normal">atrium</text><text x="300" y="320" font-size="13" text-anchor="middle" fill="#7f1d1d" font-weight="normal">right</text><text x="300" y="336" font-size="13" text-anchor="middle" fill="#7f1d1d" font-weight="normal">ventricle</text><text x="470" y="320" font-size="13" text-anchor="middle" fill="#7f1d1d" font-weight="normal">left</text><text x="470" y="336" font-size="13" text-anchor="middle" fill="#7f1d1d" font-weight="normal">ventricle</text><circle cx="255" cy="135" r="11" fill="#d97706" stroke="#92400e" stroke-width="2"/><circle cx="372" cy="235" r="9" fill="#d97706" stroke="#92400e" stroke-width="2"/><path d="M 372 244 L 380 300" stroke="#92400e" stroke-width="4" fill="none"/><path d="M 380 300 C 300 330 290 400 340 450" stroke="#92400e" stroke-width="4" fill="none"/><path d="M 380 300 C 450 330 480 400 420 460" stroke="#92400e" stroke-width="4" fill="none"/><line x1="300" y1="400" x2="255" y2="360" stroke="#92400e" stroke-width="2.5"/><line x1="310" y1="430" x2="270" y2="410" stroke="#92400e" stroke-width="2.5"/><line x1="460" y1="400" x2="515" y2="360" stroke="#92400e" stroke-width="2.5"/><line x1="450" y1="430" x2="495" y2="415" stroke="#92400e" stroke-width="2.5"/><line x1="275" y1="150" x2="350" y2="220" stroke="#d97706" stroke-width="2.5" marker-end="url(#aa)"/><line x1="275" y1="140" x2="430" y2="175" stroke="#d97706" stroke-width="2.5" marker-end="url(#aa)"/><line x1="255" y1="135" x2="624" y2="85" stroke="#475569" stroke-width="1.2"/><circle cx="255" cy="135" r="2.5" fill="#475569" stroke="#475569" stroke-width="1"/><text x="620" y="90" font-size="13" text-anchor="start" fill="#1f2937" font-weight="normal">1 SA node (pacemaker) in the right atrium</text><text x="620" y="106" font-size="13" text-anchor="start" fill="#1f2937" font-weight="normal">fires an impulse; it spreads through both</text><text x="620" y="122" font-size="13" text-anchor="start" fill="#1f2937" font-weight="normal">atria, which contract (atrial systole)</text><line x1="372" y1="235" x2="624" y2="180" stroke="#475569" stroke-width="1.2"/><circle cx="372" cy="235" r="2.5" fill="#475569" stroke="#475569" stroke-width="1"/><text x="620" y="185" font-size="13" text-anchor="start" fill="#1f2937" font-weight="normal">2 AV node delays the impulse about 0.1 s,</text><text x="620" y="201" font-size="13" text-anchor="start" fill="#1f2937" font-weight="normal">so the atria finish emptying before</text><text x="620" y="217" font-size="13" text-anchor="start" fill="#1f2937" font-weight="normal">the ventricles contract</text><line x1="380" y1="285" x2="624" y2="270" stroke="#475569" stroke-width="1.2"/><circle cx="380" cy="285" r="2.5" fill="#475569" stroke="#475569" stroke-width="1"/><text x="620" y="275" font-size="13" text-anchor="start" fill="#1f2937" font-weight="normal">3 bundle of His carries the impulse</text><text x="620" y="291" font-size="13" text-anchor="start" fill="#1f2937" font-weight="normal">down the septum to the apex</text><line x1="330" y1="430" x2="624" y2="340" stroke="#475569" stroke-width="1.2"/><circle cx="330" cy="430" r="2.5" fill="#475569" stroke="#475569" stroke-width="1"/><text x="620" y="345" font-size="13" text-anchor="start" fill="#1f2937" font-weight="normal">4 Purkinje fibres spread it through the</text><text x="620" y="361" font-size="13" text-anchor="start" fill="#1f2937" font-weight="normal">ventricle walls from the apex upwards:</text><text x="620" y="377" font-size="13" text-anchor="start" fill="#1f2937" font-weight="normal">ventricles contract (ventricular systole),</text><text x="620" y="393" font-size="13" text-anchor="start" fill="#1f2937" font-weight="normal">pushing blood up into the arteries</text><text x="450" y="535" font-size="13" text-anchor="middle" fill="#475569" font-weight="normal" font-style="italic">Cardiac muscle is myogenic: the beat starts in the heart itself, without nerve impulses. Nerves only change its rate.</text><g class="anim"><circle r="9" fill="#facc15" stroke="#92400e" stroke-width="1"><animateMotion path="M 255 135 L 372 235 L 380 300 C 300 330 290 400 340 450" dur="2s" begin="0.00s" repeatCount="indefinite"/></circle></g><g class="anim"><circle r="9" fill="#facc15" stroke="#92400e" stroke-width="1"><animateMotion path="M 255 135 L 372 235 L 380 300 C 450 330 480 400 420 460" dur="2s" begin="0.00s" repeatCount="indefinite"/></circle></g><g class="anim"><g opacity="0"><circle cx="255" cy="135" r="16" fill="none" stroke="#f59e0b" stroke-width="4"/><animate attributeName="opacity" values="0;1;0" dur="2s" begin="0s" repeatCount="indefinite"/></g></g></svg>