<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" font-family="system-ui,Arial,sans-serif" role="img" aria-label="Two xylem vessels drawn side by side, one with annular and one with spiral lignin thickening, showing absent end walls, pits and an empty lumen with water moving upwards"><rect width="900" height="540" fill="#fff"/><defs><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker></defs><text x="450" y="30" font-size="19" text-anchor="middle" fill="#1f2937" font-weight="bold">Structure of xylem vessels</text><rect x="155" y="60" width="90" height="380" rx="4" fill="#fef3c7" stroke="#92400e" stroke-width="3"/><path d="M 155 80 Q 200 89 245 80" stroke="#92400e" stroke-width="3" fill="none"/><path d="M 155 102 Q 200 111 245 102" stroke="#92400e" stroke-width="3" fill="none"/><path d="M 155 124 Q 200 133 245 124" stroke="#92400e" stroke-width="3" fill="none"/><path d="M 155 146 Q 200 155 245 146" stroke="#92400e" stroke-width="3" fill="none"/><path d="M 155 168 Q 200 177 245 168" stroke="#92400e" stroke-width="3" fill="none"/><path d="M 155 190 Q 200 199 245 190" stroke="#92400e" stroke-width="3" fill="none"/><path d="M 155 212 Q 200 221 245 212" stroke="#92400e" stroke-width="3" fill="none"/><path d="M 155 234 Q 200 243 245 234" stroke="#92400e" stroke-width="3" fill="none"/><path d="M 155 256 Q 200 265 245 256" stroke="#92400e" stroke-width="3" fill="none"/><path d="M 155 278 Q 200 287 245 278" stroke="#92400e" stroke-width="3" fill="none"/><path d="M 155 300 Q 200 309 245 300" stroke="#92400e" stroke-width="3" fill="none"/><path d="M 155 322 Q 200 331 245 322" stroke="#92400e" stroke-width="3" fill="none"/><path d="M 155 344 Q 200 353 245 344" stroke="#92400e" stroke-width="3" fill="none"/><path d="M 155 366 Q 200 375 245 366" stroke="#92400e" stroke-width="3" fill="none"/><path d="M 155 388 Q 200 397 245 388" stroke="#92400e" stroke-width="3" fill="none"/><path d="M 155 410 Q 200 419 245 410" stroke="#92400e" stroke-width="3" fill="none"/><path d="M 155 432 Q 200 441 245 432" stroke="#92400e" stroke-width="3" fill="none"/><line x1="155" y1="250" x2="172" y2="250" stroke="#92400e" stroke-width="3"/><line x1="228" y1="250" x2="245" y2="250" stroke="#92400e" stroke-width="3"/><rect x="285" y="60" width="90" height="380" rx="4" fill="#fef3c7" stroke="#92400e" stroke-width="3"/><path d="M 285 80 L 375 98" stroke="#92400e" stroke-width="3" fill="none"/><path d="M 285 102 L 375 120" stroke="#92400e" stroke-width="3" fill="none"/><path d="M 285 124 L 375 142" stroke="#92400e" stroke-width="3" fill="none"/><path d="M 285 146 L 375 164" stroke="#92400e" stroke-width="3" fill="none"/><path d="M 285 168 L 375 186" stroke="#92400e" stroke-width="3" fill="none"/><path d="M 285 190 L 375 208" stroke="#92400e" stroke-width="3" fill="none"/><path d="M 285 212 L 375 230" stroke="#92400e" stroke-width="3" fill="none"/><path d="M 285 234 L 375 252" stroke="#92400e" stroke-width="3" fill="none"/><path d="M 285 256 L 375 274" stroke="#92400e" stroke-width="3" fill="none"/><path d="M 285 278 L 375 296" stroke="#92400e" stroke-width="3" fill="none"/><path d="M 285 300 L 375 318" stroke="#92400e" stroke-width="3" fill="none"/><path d="M 285 322 L 375 340" stroke="#92400e" stroke-width="3" fill="none"/><path d="M 285 344 L 375 362" stroke="#92400e" stroke-width="3" fill="none"/><path d="M 285 366 L 375 384" stroke="#92400e" stroke-width="3" fill="none"/><path d="M 285 388 L 375 406" stroke="#92400e" stroke-width="3" fill="none"/><path d="M 285 410 L 375 428" stroke="#92400e" stroke-width="3" fill="none"/><path d="M 285 432 L 375 450" stroke="#92400e" stroke-width="3" fill="none"/><line x1="285" y1="250" x2="302" y2="250" stroke="#92400e" stroke-width="3"/><line x1="358" y1="250" x2="375" y2="250" stroke="#92400e" stroke-width="3"/><ellipse cx="375" cy="150" rx="4" ry="9" fill="#fff" stroke="#92400e" stroke-width="2"/><ellipse cx="375" cy="300" rx="4" ry="9" fill="#fff" stroke="#92400e" stroke-width="2"/><ellipse cx="375" cy="370" rx="4" ry="9" fill="#fff" stroke="#92400e" stroke-width="2"/><line x1="200" y1="430" x2="200" y2="70" stroke="#2563eb" stroke-width="3" marker-end="url(#ab)"/><line x1="330" y1="430" x2="330" y2="70" stroke="#2563eb" stroke-width="3" marker-end="url(#ab)"/><text x="200" y="465" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="normal">annular (ring)</text><text x="200" y="481" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="normal">thickening</text><text x="330" y="465" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="normal">spiral</text><text x="330" y="481" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="normal">thickening</text><line x1="372" y1="150" x2="474" y2="115" stroke="#475569" stroke-width="1.2"/><circle cx="372" cy="150" r="2.5" fill="#475569" stroke="#475569" stroke-width="1"/><text x="470" y="120" font-size="14" text-anchor="start" fill="#1f2937" font-weight="normal">pits: unlignified gaps where water</text><text x="470" y="137" font-size="14" text-anchor="start" fill="#1f2937" font-weight="normal">moves sideways into and out of vessels</text><line x1="373" y1="250" x2="474" y2="215" stroke="#475569" stroke-width="1.2"/><circle cx="373" cy="250" r="2.5" fill="#475569" stroke="#475569" stroke-width="1"/><text x="470" y="220" font-size="14" text-anchor="start" fill="#1f2937" font-weight="normal">end walls absent or reduced to a rim:</text><text x="470" y="237" font-size="14" text-anchor="start" fill="#1f2937" font-weight="normal">one continuous hollow tube</text><line x1="350" y1="292" x2="474" y2="295" stroke="#475569" stroke-width="1.2"/><circle cx="350" cy="292" r="2.5" fill="#475569" stroke="#475569" stroke-width="1"/><text x="470" y="300" font-size="14" text-anchor="start" fill="#1f2937" font-weight="normal">lignin thickenings: strong, rigid walls</text><text x="470" y="317" font-size="14" text-anchor="start" fill="#1f2937" font-weight="normal">that do not collapse under tension</text><line x1="330" y1="340" x2="474" y2="375" stroke="#475569" stroke-width="1.2"/><circle cx="330" cy="340" r="2.5" fill="#475569" stroke="#475569" stroke-width="1"/><text x="470" y="380" font-size="14" text-anchor="start" fill="#1f2937" font-weight="normal">no cell contents (dead cells):</text><text x="470" y="397" font-size="14" text-anchor="start" fill="#1f2937" font-weight="normal">nothing slows the flow of water</text><text x="450" y="520" font-size="13" text-anchor="middle" fill="#475569" font-weight="normal" font-style="italic">Water flows up under tension (negative pressure). Lignin rings or spirals resist inward collapse yet still allow growth and bending.</text></svg>