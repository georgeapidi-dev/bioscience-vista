<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="system-ui,Arial,sans-serif" role="img" aria-label="Oscilloscope trace of one action potential: resting at minus 70 millivolts, threshold at minus 50, rapid depolarisation to plus 30, repolarisation and a brief hyperpolarisation, with a dot tracing the curve"><style>@media (prefers-reduced-motion: reduce){.anim{display:none}}</style><rect width="900" height="470" fill="#fff"/><defs><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker></defs><text x="450" y="30" font-size="18" text-anchor="middle" fill="#1f2937" font-weight="bold">One action potential on an oscilloscope</text><rect x="80" y="50" width="760" height="360" rx="10" fill="#0f172a" stroke="#0f172a" stroke-width="0"/><line x1="80" y1="60.0" x2="840" y2="60.0" stroke="#1e293b" stroke-width="1"/><text x="72" y="65.0" font-size="12" text-anchor="end" fill="#1f2937" font-weight="normal">40</text><line x1="80" y1="116.66666666666666" x2="840" y2="116.66666666666666" stroke="#1e293b" stroke-width="1"/><text x="72" y="121.66666666666666" font-size="12" text-anchor="end" fill="#1f2937" font-weight="normal">20</text><line x1="80" y1="173.33333333333331" x2="840" y2="173.33333333333331" stroke="#1e293b" stroke-width="1"/><text x="72" y="178.33333333333331" font-size="12" text-anchor="end" fill="#1f2937" font-weight="normal">0</text><line x1="80" y1="230.0" x2="840" y2="230.0" stroke="#1e293b" stroke-width="1"/><text x="72" y="235.0" font-size="12" text-anchor="end" fill="#1f2937" font-weight="normal">-20</text><line x1="80" y1="286.66666666666663" x2="840" y2="286.66666666666663" stroke="#1e293b" stroke-width="1"/><text x="72" y="291.66666666666663" font-size="12" text-anchor="end" fill="#1f2937" font-weight="normal">-40</text><line x1="80" y1="343.3333333333333" x2="840" y2="343.3333333333333" stroke="#1e293b" stroke-width="1"/><text x="72" y="348.3333333333333" font-size="12" text-anchor="end" fill="#1f2937" font-weight="normal">-60</text><line x1="80" y1="400.0" x2="840" y2="400.0" stroke="#1e293b" stroke-width="1"/><text x="72" y="405.0" font-size="12" text-anchor="end" fill="#1f2937" font-weight="normal">-80</text><line x1="90" y1="50" x2="90" y2="410" stroke="#1e293b" stroke-width="1"/><text x="90" y="430" font-size="12" text-anchor="middle" fill="#1f2937" font-weight="normal">0</text><line x1="210" y1="50" x2="210" y2="410" stroke="#1e293b" stroke-width="1"/><text x="210" y="430" font-size="12" text-anchor="middle" fill="#1f2937" font-weight="normal">1</text><line x1="330" y1="50" x2="330" y2="410" stroke="#1e293b" stroke-width="1"/><text x="330" y="430" font-size="12" text-anchor="middle" fill="#1f2937" font-weight="normal">2</text><line x1="450" y1="50" x2="450" y2="410" stroke="#1e293b" stroke-width="1"/><text x="450" y="430" font-size="12" text-anchor="middle" fill="#1f2937" font-weight="normal">3</text><line x1="570" y1="50" x2="570" y2="410" stroke="#1e293b" stroke-width="1"/><text x="570" y="430" font-size="12" text-anchor="middle" fill="#1f2937" font-weight="normal">4</text><line x1="690" y1="50" x2="690" y2="410" stroke="#1e293b" stroke-width="1"/><text x="690" y="430" font-size="12" text-anchor="middle" fill="#1f2937" font-weight="normal">5</text><line x1="810" y1="50" x2="810" y2="410" stroke="#1e293b" stroke-width="1"/><text x="810" y="430" font-size="12" text-anchor="middle" fill="#1f2937" font-weight="normal">6</text><path d="M 90 372 L 150 372 L 186 329 L 210 315 L 240 173 L 270 88 L 300 159 L 342 329 L 390 394 L 474 377 L 750 372" stroke="#4ade80" stroke-width="3" fill="none"/><line x1="80" y1="315.0" x2="840" y2="315.0" stroke="#facc15" stroke-width="1.5" stroke-dasharray="6 4"/><text x="830" y="309.0" font-size="12" text-anchor="end" fill="#facc15" font-weight="normal">threshold</text><g class="anim"><circle r="7" fill="#fde047" stroke="#0f172a" stroke-width="1"><animateMotion path="M 90 372 L 150 372 L 186 329 L 210 315 L 240 173 L 270 88 L 300 159 L 342 329 L 390 394 L 474 377 L 750 372" dur="4s" begin="0.00s" repeatCount="indefinite"/></circle></g><text x="102.0" y="329.1666666666667" font-size="12" text-anchor="start" fill="#e2e8f0" font-weight="normal">resting −70 mV</text><text x="96.0" y="82.66666666666667" font-size="12" text-anchor="start" fill="#e2e8f0" font-weight="normal">depolarisation:</text><text x="96.0" y="97.66666666666667" font-size="12" text-anchor="start" fill="#e2e8f0" font-weight="normal">Na⁺ channels open,</text><text x="96.0" y="112.66666666666667" font-size="12" text-anchor="start" fill="#e2e8f0" font-weight="normal">Na⁺ in</text><text x="354.0" y="111.0" font-size="12" text-anchor="start" fill="#e2e8f0" font-weight="normal">repolarisation:</text><text x="354.0" y="126.0" font-size="12" text-anchor="start" fill="#e2e8f0" font-weight="normal">K⁺ channels open,</text><text x="354.0" y="141.0" font-size="12" text-anchor="start" fill="#e2e8f0" font-weight="normal">K⁺ out</text><text x="408.0" y="337.6666666666667" font-size="12" text-anchor="start" fill="#e2e8f0" font-weight="normal">hyperpolarisation</text><text x="460" y="455" font-size="14" text-anchor="middle" fill="#1f2937" font-weight="normal">Time / ms</text><text x="30" y="230" font-size="14" text-anchor="middle" transform="rotate(-90 30 230)">Membrane potential / mV</text></svg>