<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="system-ui,Arial,sans-serif" role="img" aria-label="Animation of a synapse: an impulse arrives, calcium ions enter, vesicles of acetylcholine fuse with the membrane, acetylcholine crosses the cleft and opens channels so sodium enters the postsynaptic neuron"><style>@media (prefers-reduced-motion: reduce){.anim{display:none}}</style><rect width="900" height="500" fill="#fff"/><defs><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker></defs><text x="450" y="30" font-size="18" text-anchor="middle" fill="#1f2937" font-weight="bold">Synaptic transmission at a cholinergic synapse</text><path d="M 60 80 L 520 80 Q 600 80 600 160 L 600 300 Q 600 380 520 380 L 60 380" stroke="#7c3aed" stroke-width="3" fill="#f5f3ff"/><path d="M 860 80 L 690 80 Q 660 80 660 120 L 660 340 Q 660 380 690 380 L 860 380" stroke="#0d9488" stroke-width="3" fill="#f0fdfa"/><text x="200" y="110" font-size="14" text-anchor="middle" fill="#7c3aed" font-weight="bold">presynaptic neuron</text><text x="780" y="110" font-size="14" text-anchor="middle" fill="#0d9488" font-weight="bold">postsynaptic neuron</text><text x="630" y="70" font-size="13" text-anchor="middle" fill="#475569" font-weight="normal">cleft</text><g class="anim"><circle r="7" fill="#facc15" stroke="#92400e" stroke-width="1"><animateMotion path="M 60 230 L 380 230" dur="2.5s" begin="0.00s" repeatCount="indefinite"/></circle><circle r="7" fill="#facc15" stroke="#92400e" stroke-width="1"><animateMotion path="M 60 230 L 380 230" dur="2.5s" begin="-1.25s" repeatCount="indefinite"/></circle></g><text x="150" y="215" font-size="12" text-anchor="middle" fill="#92400e" font-weight="bold">action potential arrives</text><g class="anim"><circle r="5" fill="#a3e635" stroke="#3f6212" stroke-width="1"><animateMotion path="M 630 370 L 585 330" dur="2.5s" begin="0.00s" repeatCount="indefinite"/></circle><circle r="5" fill="#a3e635" stroke="#3f6212" stroke-width="1"><animateMotion path="M 630 370 L 585 330" dur="2.5s" begin="-0.83s" repeatCount="indefinite"/></circle><circle r="5" fill="#a3e635" stroke="#3f6212" stroke-width="1"><animateMotion path="M 630 370 L 585 330" dur="2.5s" begin="-1.67s" repeatCount="indefinite"/></circle></g><text x="560" y="420" font-size="12" text-anchor="middle" fill="#3f6212" font-weight="bold">Ca²⁺ enter through voltage-gated channels</text><g class="anim"><circle cx="0" cy="0" r="16" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"><animateMotion path="M 440 170 L 585 170" dur="3s" begin="0.0s" repeatCount="indefinite"/></circle></g><g class="anim"><circle cx="0" cy="0" r="16" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"><animateMotion path="M 440 230 L 585 230" dur="3s" begin="0.5s" repeatCount="indefinite"/></circle></g><g class="anim"><circle cx="0" cy="0" r="16" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"><animateMotion path="M 440 290 L 585 290" dur="3s" begin="1.0s" repeatCount="indefinite"/></circle></g><g class="anim"><circle r="4" fill="#2563eb" stroke="#fff" stroke-width="1"><animateMotion path="M 600 150 L 660 150" dur="1.5s" begin="0.00s" repeatCount="indefinite"/></circle><circle r="4" fill="#2563eb" stroke="#fff" stroke-width="1"><animateMotion path="M 600 150 L 660 150" dur="1.5s" begin="-0.50s" repeatCount="indefinite"/></circle><circle r="4" fill="#2563eb" stroke="#fff" stroke-width="1"><animateMotion path="M 600 150 L 660 150" dur="1.5s" begin="-1.00s" repeatCount="indefinite"/></circle></g><g class="anim"><circle r="4" fill="#2563eb" stroke="#fff" stroke-width="1"><animateMotion path="M 600 230 L 660 230" dur="1.5s" begin="0.00s" repeatCount="indefinite"/></circle><circle r="4" fill="#2563eb" stroke="#fff" stroke-width="1"><animateMotion path="M 600 230 L 660 230" dur="1.5s" begin="-0.50s" repeatCount="indefinite"/></circle><circle r="4" fill="#2563eb" stroke="#fff" stroke-width="1"><animateMotion path="M 600 230 L 660 230" dur="1.5s" begin="-1.00s" repeatCount="indefinite"/></circle></g><g class="anim"><circle r="4" fill="#2563eb" stroke="#fff" stroke-width="1"><animateMotion path="M 600 310 L 660 310" dur="1.5s" begin="0.00s" repeatCount="indefinite"/></circle><circle r="4" fill="#2563eb" stroke="#fff" stroke-width="1"><animateMotion path="M 600 310 L 660 310" dur="1.5s" begin="-0.50s" repeatCount="indefinite"/></circle><circle r="4" fill="#2563eb" stroke="#fff" stroke-width="1"><animateMotion path="M 600 310 L 660 310" dur="1.5s" begin="-1.00s" repeatCount="indefinite"/></circle></g><rect x="660" y="136" width="16" height="28" rx="4" fill="#99f6e4" stroke="#0d9488" stroke-width="2"/><rect x="660" y="216" width="16" height="28" rx="4" fill="#99f6e4" stroke="#0d9488" stroke-width="2"/><rect x="660" y="296" width="16" height="28" rx="4" fill="#99f6e4" stroke="#0d9488" stroke-width="2"/><g class="anim"><circle r="5" fill="#f87171" stroke="#fff" stroke-width="1"><animateMotion path="M 676 230 L 840 230" dur="2s" begin="0.00s" repeatCount="indefinite"/></circle><circle r="5" fill="#f87171" stroke="#fff" stroke-width="1"><animateMotion path="M 676 230 L 840 230" dur="2s" begin="-0.67s" repeatCount="indefinite"/></circle><circle r="5" fill="#f87171" stroke="#fff" stroke-width="1"><animateMotion path="M 676 230 L 840 230" dur="2s" begin="-1.33s" repeatCount="indefinite"/></circle></g><text x="760" y="260" font-size="13" text-anchor="middle" fill="#dc2626" font-weight="bold">Na⁺ in: EPSP</text><text x="300" y="330" font-size="12" text-anchor="middle" fill="#7c3aed" font-weight="normal">vesicles of acetylcholine move to the membrane;</text><text x="300" y="345" font-size="12" text-anchor="middle" fill="#7c3aed" font-weight="normal">exocytosis releases ACh into the cleft</text><rect x="40" y="440" width="820" height="50" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="450" y="460" font-size="12" text-anchor="middle" fill="#1f2937" font-weight="normal">ACh diffuses across the cleft and binds receptors; channels open; Na⁺ enters. Acetylcholinesterase then breaks ACh down</text><text x="450" y="478" font-size="12" text-anchor="middle" fill="#1f2937" font-weight="normal">so the signal stops. Only the presynaptic side has vesicles, so the signal passes one way.</text></svg>