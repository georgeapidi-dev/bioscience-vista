<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="system-ui,Arial,sans-serif" role="img" aria-label="Chemiosmosis in the thylakoid: electrons pass along carriers, protons are pumped across the membrane, then flow back through ATP synthase to make ATP"><style>@media (prefers-reduced-motion: reduce){.anim{display:none}}</style><rect width="900" height="470" fill="#fff"/><defs><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker></defs><text x="450" y="30" font-size="18" text-anchor="middle" fill="#1f2937" font-weight="bold">Chemiosmosis in the thylakoid</text><rect x="40" y="60" width="820" height="110" rx="8" fill="#fef3c7" stroke="#fcd34d" stroke-width="1"/><text x="60" y="85" font-size="14" text-anchor="start" fill="#92400e" font-weight="bold">thylakoid space (lumen): high H⁺</text><rect x="40" y="250" width="820" height="130" rx="8" fill="#ecfeff" stroke="#67e8f9" stroke-width="1"/><text x="60" y="370" font-size="14" text-anchor="start" fill="#155e75" font-weight="bold">stroma: low H⁺</text><rect x="40" y="170" width="820" height="80" rx="0" fill="#fecaca" stroke="#dc2626" stroke-width="1.5"/><text x="860" y="215" font-size="12" text-anchor="end" fill="#7f1d1d" font-weight="normal">thylakoid membrane</text><rect x="120" y="160" width="60" height="100" rx="10" fill="#c4b5fd" stroke="#7c3aed" stroke-width="2"/><rect x="270" y="160" width="60" height="100" rx="10" fill="#c4b5fd" stroke="#7c3aed" stroke-width="2"/><rect x="420" y="160" width="60" height="100" rx="10" fill="#c4b5fd" stroke="#7c3aed" stroke-width="2"/><text x="300" y="285" font-size="13" text-anchor="middle" fill="#7c3aed" font-weight="bold">electron transport chain</text><rect x="660" y="150" width="80" height="120" rx="14" fill="#bbf7d0" stroke="#16a34a" stroke-width="2.5"/><text x="750" y="300" font-size="13" text-anchor="start" fill="#16a34a" font-weight="bold">ATP synthase</text><g class="anim"><circle r="6" fill="#facc15" stroke="#92400e" stroke-width="1"><animateMotion path="M 120 270 L 480 270" dur="3s" begin="0.00s" repeatCount="indefinite"/></circle><circle r="6" fill="#facc15" stroke="#92400e" stroke-width="1"><animateMotion path="M 120 270 L 480 270" dur="3s" begin="-1.00s" repeatCount="indefinite"/></circle><circle r="6" fill="#facc15" stroke="#92400e" stroke-width="1"><animateMotion path="M 120 270 L 480 270" dur="3s" begin="-2.00s" repeatCount="indefinite"/></circle></g><g class="anim"><circle r="6" fill="#dc2626" stroke="#fff" stroke-width="1"><animateMotion path="M 150 320 L 150 110" dur="2.6s" begin="0.00s" repeatCount="indefinite"/></circle><circle r="6" fill="#dc2626" stroke="#fff" stroke-width="1"><animateMotion path="M 150 320 L 150 110" dur="2.6s" begin="-1.30s" repeatCount="indefinite"/></circle></g><g class="anim"><circle r="6" fill="#dc2626" stroke="#fff" stroke-width="1"><animateMotion path="M 300 320 L 300 110" dur="2.6s" begin="0.00s" repeatCount="indefinite"/></circle><circle r="6" fill="#dc2626" stroke="#fff" stroke-width="1"><animateMotion path="M 300 320 L 300 110" dur="2.6s" begin="-1.30s" repeatCount="indefinite"/></circle></g><g class="anim"><circle r="6" fill="#dc2626" stroke="#fff" stroke-width="1"><animateMotion path="M 450 320 L 450 110" dur="2.6s" begin="0.00s" repeatCount="indefinite"/></circle><circle r="6" fill="#dc2626" stroke="#fff" stroke-width="1"><animateMotion path="M 450 320 L 450 110" dur="2.6s" begin="-1.30s" repeatCount="indefinite"/></circle></g><g class="anim"><circle r="6" fill="#dc2626" stroke="#fff" stroke-width="1"><animateMotion path="M 700 100 L 700 330" dur="2s" begin="0.00s" repeatCount="indefinite"/></circle><circle r="6" fill="#dc2626" stroke="#fff" stroke-width="1"><animateMotion path="M 700 100 L 700 330" dur="2s" begin="-0.67s" repeatCount="indefinite"/></circle><circle r="6" fill="#dc2626" stroke="#fff" stroke-width="1"><animateMotion path="M 700 100 L 700 330" dur="2s" begin="-1.33s" repeatCount="indefinite"/></circle></g><text x="470" y="120" font-size="13" text-anchor="start" fill="#dc2626" font-weight="bold">H⁺ build up: concentration gradient</text><text x="760" y="345" font-size="13" text-anchor="start" fill="#16a34a" font-weight="bold">ADP + Pi → ATP</text><rect x="40" y="395" width="820" height="60" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="450" y="420" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="normal">Energy from excited electrons (from photosystem II) pumps H⁺ into the thylakoid space; photolysis adds more H⁺.</text><text x="450" y="440" font-size="13" text-anchor="middle" fill="#475569" font-weight="normal" font-style="italic">H⁺ flow back down their gradient through ATP synthase, which uses the energy to phosphorylate ADP.</text></svg>