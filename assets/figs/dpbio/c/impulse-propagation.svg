<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 465" font-family="system-ui,Arial,sans-serif" role="img" aria-label="Animation: a region of depolarised membrane moves along an axon from left to right as sodium ions diffuse ahead and trigger the next region"><style>@media (prefers-reduced-motion: reduce){.anim{display:none}}</style><rect width="900" height="465" fill="#fff"/><defs><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker></defs><text x="450" y="30" font-size="18" text-anchor="middle" fill="#1f2937" font-weight="bold">An action potential travels along the axon by local currents</text><rect x="40" y="140" width="820" height="100" rx="50" fill="#fefce8" stroke="#a8a29e" stroke-width="2"/><text x="60" y="130" font-size="13" text-anchor="start" fill="#dc2626" font-weight="bold">outside: +</text><text x="60" y="270" font-size="13" text-anchor="start" fill="#57534e" font-weight="normal">axon membrane</text><g class="anim"><rect x="0" y="140" width="110" height="100" rx="40" fill="#fca5a5" opacity="0.8"><animate attributeName="x" values="40;750;40" keyTimes="0;0.95;1" dur="5s" repeatCount="indefinite"/></rect></g><g class="anim"><text y="195" font-size="15" font-weight="bold" fill="#7f1d1d" text-anchor="middle">+ + + inside<animate attributeName="x" values="95;805;95" keyTimes="0;0.95;1" dur="5s" repeatCount="indefinite"/></text></g><line x1="450" y1="300" x2="750" y2="300" stroke="#1f2937" stroke-width="3" marker-end="url(#ak)"/><text x="600" y="325" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="bold">direction of the impulse</text><rect x="40" y="350" width="820" height="100" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="450" y="375" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="normal">Na⁺ that entered at the depolarised region diffuses along inside the axon (local current) to the next region,</text><text x="450" y="395" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="normal">raising it to the threshold (about −50 mV) so voltage-gated Na⁺ channels open there: a new action potential.</text><text x="450" y="420" font-size="13" text-anchor="middle" fill="#475569" font-weight="normal" font-style="italic">The region behind is repolarising (K⁺ channels open) and briefly cannot fire, so the impulse moves one way.</text></svg>