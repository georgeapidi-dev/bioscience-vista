<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="system-ui,Arial,sans-serif" role="img" aria-label="Cycle diagram: ATP is hydrolysed to ADP and phosphate, releasing energy for cell processes; ADP is phosphorylated back to ATP using energy from respiration or photosynthesis"><style>@media (prefers-reduced-motion: reduce){.anim{display:none}}</style><rect width="900" height="460" fill="#fff"/><defs><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker></defs><text x="450" y="30" font-size="18" text-anchor="middle" fill="#1f2937" font-weight="bold">The ATP–ADP cycle: the cell’s energy currency</text><rect x="330" y="70" width="240" height="70" rx="8" fill="#fde68a" stroke="#d97706" stroke-width="2"/><text x="450.0" y="101.0" font-size="15" text-anchor="middle" fill="#1f2937" font-weight="bold">ATP</text><text x="450.0" y="119.0" font-size="15" text-anchor="middle" fill="#1f2937" font-weight="bold">adenosine triphosphate</text><rect x="330" y="330" width="240" height="70" rx="8" fill="#e0f2fe" stroke="#2563eb" stroke-width="2"/><text x="450.0" y="361.3333333333333" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="bold">ADP + Pi</text><text x="450.0" y="377.3333333333333" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="bold">adenosine diphosphate + phosphate</text><path d="M 330 105 C 180 120 180 350 330 365" stroke="#dc2626" stroke-width="4" fill="none" marker-end="url(#ar)"/><path d="M 570 365 C 720 350 720 120 570 105" stroke="#16a34a" stroke-width="4" fill="none" marker-end="url(#ag)"/><text x="115" y="175" font-size="13" text-anchor="middle" fill="#dc2626" font-weight="bold">HYDROLYSIS</text><text x="115" y="191" font-size="13" text-anchor="middle" fill="#dc2626" font-weight="bold">releases energy for:</text><text x="115" y="207" font-size="13" text-anchor="middle" fill="#dc2626" font-weight="bold">active transport,</text><text x="115" y="223" font-size="13" text-anchor="middle" fill="#dc2626" font-weight="bold">making macromolecules,</text><text x="115" y="239" font-size="13" text-anchor="middle" fill="#dc2626" font-weight="bold">movement (muscles,</text><text x="115" y="255" font-size="13" text-anchor="middle" fill="#dc2626" font-weight="bold">chromosomes)</text><text x="760" y="200" font-size="13" text-anchor="middle" fill="#16a34a" font-weight="bold">CONDENSATION</text><text x="760" y="216" font-size="13" text-anchor="middle" fill="#16a34a" font-weight="bold">(phosphorylation)</text><text x="760" y="232" font-size="13" text-anchor="middle" fill="#16a34a" font-weight="bold">needs energy from:</text><text x="760" y="248" font-size="13" text-anchor="middle" fill="#16a34a" font-weight="bold">cell respiration,</text><text x="760" y="264" font-size="13" text-anchor="middle" fill="#16a34a" font-weight="bold">photosynthesis</text><g class="anim"><circle r="7" fill="#ef4444" stroke="#fff" stroke-width="1"><animateMotion path="M 330 105 C 180 120 180 350 330 365" dur="3s" begin="0.00s" repeatCount="indefinite"/></circle><circle r="7" fill="#ef4444" stroke="#fff" stroke-width="1"><animateMotion path="M 330 105 C 180 120 180 350 330 365" dur="3s" begin="-1.00s" repeatCount="indefinite"/></circle><circle r="7" fill="#ef4444" stroke="#fff" stroke-width="1"><animateMotion path="M 330 105 C 180 120 180 350 330 365" dur="3s" begin="-2.00s" repeatCount="indefinite"/></circle></g><g class="anim"><circle r="7" fill="#22c55e" stroke="#fff" stroke-width="1"><animateMotion path="M 570 365 C 720 350 720 120 570 105" dur="3s" begin="0.00s" repeatCount="indefinite"/></circle><circle r="7" fill="#22c55e" stroke="#fff" stroke-width="1"><animateMotion path="M 570 365 C 720 350 720 120 570 105" dur="3s" begin="-1.00s" repeatCount="indefinite"/></circle><circle r="7" fill="#22c55e" stroke="#fff" stroke-width="1"><animateMotion path="M 570 365 C 720 350 720 120 570 105" dur="3s" begin="-2.00s" repeatCount="indefinite"/></circle></g><text x="450" y="440" font-size="13" text-anchor="middle" fill="#475569" font-weight="normal" font-style="italic">A human turns over roughly their own body mass of ATP each day; only a few grams exist at any moment.</text></svg>