<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="system-ui,Arial,sans-serif" role="img" aria-label="Log-scale graph: the approximate cost of sequencing a human genome fell from about 100 million US dollars in 2001 to about 600 in 2021"><rect width="900" height="470" fill="#fff"/><defs><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker></defs><text x="450" y="30" font-size="18" text-anchor="middle" fill="#1f2937" font-weight="bold">Cost of sequencing one human genome (approximate, US$)</text><line x1="110" y1="400" x2="860" y2="400" stroke="#1f2937" stroke-width="1.5"/><line x1="110" y1="400" x2="110" y2="50" stroke="#1f2937" stroke-width="1.5"/><text x="104" y="321.0" font-size="12" text-anchor="end" fill="#1f2937" font-weight="normal">100</text><line x1="110" y1="316.0" x2="860" y2="316.0" stroke="#e2e8f0" stroke-width="1"/><text x="104" y="279.0" font-size="12" text-anchor="end" fill="#1f2937" font-weight="normal">1,000</text><line x1="110" y1="274.0" x2="860" y2="274.0" stroke="#e2e8f0" stroke-width="1"/><text x="104" y="237.0" font-size="12" text-anchor="end" fill="#1f2937" font-weight="normal">10,000</text><line x1="110" y1="232.0" x2="860" y2="232.0" stroke="#e2e8f0" stroke-width="1"/><text x="104" y="195.0" font-size="12" text-anchor="end" fill="#1f2937" font-weight="normal">100,000</text><line x1="110" y1="190.0" x2="860" y2="190.0" stroke="#e2e8f0" stroke-width="1"/><text x="104" y="153.0" font-size="12" text-anchor="end" fill="#1f2937" font-weight="normal">1,000,000</text><line x1="110" y1="148.0" x2="860" y2="148.0" stroke="#e2e8f0" stroke-width="1"/><text x="104" y="111.0" font-size="12" text-anchor="end" fill="#1f2937" font-weight="normal">10,000,000</text><line x1="110" y1="106.0" x2="860" y2="106.0" stroke="#e2e8f0" stroke-width="1"/><text x="104" y="69.0" font-size="12" text-anchor="end" fill="#1f2937" font-weight="normal">100,000,000</text><line x1="110" y1="64.0" x2="860" y2="64.0" stroke="#e2e8f0" stroke-width="1"/><text x="110" y="422" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="normal">2000</text><text x="246" y="422" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="normal">2004</text><text x="382" y="422" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="normal">2008</text><text x="518" y="422" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="normal">2012</text><text x="654" y="422" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="normal">2016</text><text x="790" y="422" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="normal">2020</text><path d="M 144 64 L 246 89 L 348 108 L 416 190 L 484 232 L 620 267 L 824 283" stroke="#dc2626" stroke-width="3" fill="none"/><circle cx="144" cy="64.0" r="6" fill="#fecaca" stroke="#dc2626" stroke-width="2"/><circle cx="246" cy="89.28651963577443" r="6" fill="#fecaca" stroke="#dc2626" stroke-width="2"/><circle cx="348" cy="107.92181460354834" r="6" fill="#fecaca" stroke="#dc2626" stroke-width="2"/><circle cx="416" cy="190.0" r="6" fill="#fecaca" stroke="#dc2626" stroke-width="2"/><circle cx="484" cy="232.0" r="6" fill="#fecaca" stroke="#dc2626" stroke-width="2"/><circle cx="620" cy="266.6041671196614" r="6" fill="#fecaca" stroke="#dc2626" stroke-width="2"/><circle cx="824" cy="283.31764748388696" r="6" fill="#fecaca" stroke="#dc2626" stroke-width="2"/><text x="388" y="97.92181460354834" font-size="13" text-anchor="start" fill="#dc2626" font-weight="normal">faster “next-generation”</text><text x="388" y="113.92181460354834" font-size="13" text-anchor="start" fill="#dc2626" font-weight="normal">sequencing from about 2008</text><text x="450" y="450" font-size="14" text-anchor="middle" fill="#1f2937" font-weight="normal">Year</text><text x="470" y="175" font-size="13" text-anchor="start" fill="#475569" font-weight="normal" font-style="italic">Human Genome Project (1990–2003): about US$3 billion.</text><text x="470" y="191" font-size="13" text-anchor="start" fill="#475569" font-weight="normal" font-style="italic">Today: a few hundred dollars and about a day.</text></svg>