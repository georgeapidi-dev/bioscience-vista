<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" font-family="system-ui,Arial,sans-serif" role="img" aria-label="The binomial name Panthera leo: Panthera is the genus with a capital letter, leo the specific name in lower case, printed in italics"><rect width="800" height="340" fill="#fff"/><defs><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker></defs><text x="400" y="30" font-size="18" text-anchor="middle" fill="#1f2937" font-weight="bold">Reading a binomial name</text><text x="400" y="130" font-size="54" text-anchor="middle" font-style="italic" fill="#1f2937"><tspan fill="#2563eb">Panthera</tspan> <tspan fill="#16a34a">leo</tspan></text><line x1="270" y1="140" x2="154" y2="215" stroke="#475569" stroke-width="1.2"/><circle cx="270" cy="140" r="2.5" fill="#475569" stroke="#475569" stroke-width="1"/><text x="150" y="220" font-size="14" text-anchor="start" fill="#1f2937" font-weight="normal">GENUS: capital initial;</text><text x="150" y="237" font-size="14" text-anchor="start" fill="#1f2937" font-weight="normal">shared by close relatives</text><text x="150" y="254" font-size="14" text-anchor="start" fill="#1f2937" font-weight="normal">(Panthera pardus, P. tigris)</text><line x1="520" y1="140" x2="524" y2="215" stroke="#475569" stroke-width="1.2"/><circle cx="520" cy="140" r="2.5" fill="#475569" stroke="#475569" stroke-width="1"/><text x="520" y="220" font-size="14" text-anchor="start" fill="#1f2937" font-weight="normal">SPECIFIC NAME: all lower case;</text><text x="520" y="237" font-size="14" text-anchor="start" fill="#1f2937" font-weight="normal">identifies the species</text><text x="520" y="254" font-size="14" text-anchor="start" fill="#1f2937" font-weight="normal">within the genus</text><text x="400" y="320" font-size="14" text-anchor="middle" fill="#475569" font-weight="normal" font-style="italic">Printed in italics; underlined when handwritten. After first use: P. leo.</text></svg>