<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="system-ui,Arial,sans-serif" role="img" aria-label="An example dichotomous key to five trees in four numbered couplets of contrasting statements, each leading to another couplet or a name"><rect width="900" height="460" fill="#fff"/><defs><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker></defs><text x="450" y="30" font-size="18" text-anchor="middle" fill="#1f2937" font-weight="bold">A dichotomous key: pairs of contrasting statements</text><rect x="60" y="70" width="780" height="36" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="80" y="94" font-size="15" text-anchor="start" fill="#2563eb" font-weight="bold">1a</text><text x="130" y="94" font-size="15" text-anchor="start" fill="#1f2937" font-weight="normal">Leaves needle-shaped</text><text x="820" y="94" font-size="15" text-anchor="end" fill="#16a34a" font-weight="bold">→ 2</text><rect x="60" y="114" width="780" height="36" rx="4" fill="#fff" stroke="#cbd5e1" stroke-width="1"/><text x="80" y="138" font-size="15" text-anchor="start" fill="#2563eb" font-weight="bold">1b</text><text x="130" y="138" font-size="15" text-anchor="start" fill="#1f2937" font-weight="normal">Leaves broad and flat</text><text x="820" y="138" font-size="15" text-anchor="end" fill="#16a34a" font-weight="bold">→ 3</text><rect x="60" y="158" width="780" height="36" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="80" y="182" font-size="15" text-anchor="start" fill="#2563eb" font-weight="bold">2a</text><text x="130" y="182" font-size="15" text-anchor="start" fill="#1f2937" font-weight="normal">Needles in bundles of 2–5</text><text x="820" y="182" font-size="15" text-anchor="end" fill="#16a34a" font-weight="bold">→ Pine (Pinus)</text><rect x="60" y="202" width="780" height="36" rx="4" fill="#fff" stroke="#cbd5e1" stroke-width="1"/><text x="80" y="226" font-size="15" text-anchor="start" fill="#2563eb" font-weight="bold">2b</text><text x="130" y="226" font-size="15" text-anchor="start" fill="#1f2937" font-weight="normal">Needles single, flat</text><text x="820" y="226" font-size="15" text-anchor="end" fill="#16a34a" font-weight="bold">→ Podocarpus</text><rect x="60" y="246" width="780" height="36" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="80" y="270" font-size="15" text-anchor="start" fill="#2563eb" font-weight="bold">3a</text><text x="130" y="270" font-size="15" text-anchor="start" fill="#1f2937" font-weight="normal">Leaf compound (several leaflets)</text><text x="820" y="270" font-size="15" text-anchor="end" fill="#16a34a" font-weight="bold">→ 4</text><rect x="60" y="290" width="780" height="36" rx="4" fill="#fff" stroke="#cbd5e1" stroke-width="1"/><text x="80" y="314" font-size="15" text-anchor="start" fill="#2563eb" font-weight="bold">3b</text><text x="130" y="314" font-size="15" text-anchor="start" fill="#1f2937" font-weight="normal">Leaf simple (one blade)</text><text x="820" y="314" font-size="15" text-anchor="end" fill="#16a34a" font-weight="bold">→ Fig (Ficus)</text><rect x="60" y="334" width="780" height="36" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="80" y="358" font-size="15" text-anchor="start" fill="#2563eb" font-weight="bold">4a</text><text x="130" y="358" font-size="15" text-anchor="start" fill="#1f2937" font-weight="normal">Leaflets feathery, tree has thorns</text><text x="820" y="358" font-size="15" text-anchor="end" fill="#16a34a" font-weight="bold">→ Acacia (Vachellia)</text><rect x="60" y="378" width="780" height="36" rx="4" fill="#fff" stroke="#cbd5e1" stroke-width="1"/><text x="80" y="402" font-size="15" text-anchor="start" fill="#2563eb" font-weight="bold">4b</text><text x="130" y="402" font-size="15" text-anchor="start" fill="#1f2937" font-weight="normal">Leaflets large, no thorns</text><text x="820" y="402" font-size="15" text-anchor="end" fill="#16a34a" font-weight="bold">→ Jacaranda</text><text x="450" y="440" font-size="13" text-anchor="middle" fill="#475569" font-weight="normal" font-style="italic">Use features that are easy to see and do not change (not size, colour of flowers in season, or behaviour).</text></svg>