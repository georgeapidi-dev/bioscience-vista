<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 465" font-family="system-ui,Arial,sans-serif" role="img" aria-label="One population splits and the two branches become gradually more different over time; in an intermediate zone it is unclear whether they are one species or two"><style>@media (prefers-reduced-motion: reduce){.anim{display:none}}</style><rect width="900" height="465" fill="#fff"/><defs><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker></defs><text x="450" y="30" font-size="18" text-anchor="middle" fill="#1f2937" font-weight="bold">Speciation is usually gradual</text><path d="M 120 420 L 120 300" stroke="#1f2937" stroke-width="14" fill="none"/><path d="M 120 300 C 120 220 60 180 60 70" stroke="#2563eb" stroke-width="14" fill="none"/><path d="M 120 300 C 120 220 180 180 180 70" stroke="#16a34a" stroke-width="14" fill="none"/><line x1="240" y1="420" x2="240" y2="70" stroke="#94a3b8" stroke-width="2" marker-end="url(#ak)"/><text x="252" y="250" font-size="14" text-anchor="start" fill="#94a3b8" font-weight="normal">time</text><rect x="30" y="170" width="180" height="70" rx="6" fill="#fde68a" fill-opacity="0.25" stroke="#d97706" stroke-width="2"/><text x="220" y="210" font-size="30" text-anchor="start" fill="#d97706" font-weight="bold">?</text><text x="120" y="445" font-size="14" text-anchor="middle" fill="#1f2937" font-weight="bold">one species</text><text x="60" y="60" font-size="14" text-anchor="middle" fill="#2563eb" font-weight="bold">species A</text><text x="180" y="60" font-size="14" text-anchor="middle" fill="#16a34a" font-weight="bold">species B</text><text x="320" y="120" font-size="14" text-anchor="start" fill="#1f2937" font-weight="normal">Populations stop interbreeding (e.g. separated by a barrier)</text><text x="320" y="137" font-size="14" text-anchor="start" fill="#1f2937" font-weight="normal">and become more and more different in their traits.</text><text x="320" y="200" font-size="14" text-anchor="start" fill="#d97706" font-weight="bold">In the shaded zone they are partly different and may still</text><text x="320" y="217" font-size="14" text-anchor="start" fill="#d97706" font-weight="bold">interbreed a little: one species or two?</text><text x="320" y="280" font-size="14" text-anchor="start" fill="#1f2937" font-weight="normal">There is no single moment when one species becomes two,</text><text x="320" y="297" font-size="14" text-anchor="start" fill="#1f2937" font-weight="normal">so where we draw the line is an arbitrary decision.</text><text x="320" y="360" font-size="14" text-anchor="start" fill="#475569" font-weight="normal" font-style="italic">Example: ring species such as Ensatina salamanders.</text><g class="anim"><circle r="6" fill="#2563eb" stroke="#fff" stroke-width="1"><animateMotion path="M 120 420 L 120 300 C 120 220 60 180 60 70" dur="6s" begin="0.00s" repeatCount="indefinite"/></circle><circle r="6" fill="#2563eb" stroke="#fff" stroke-width="1"><animateMotion path="M 120 420 L 120 300 C 120 220 60 180 60 70" dur="6s" begin="-2.00s" repeatCount="indefinite"/></circle><circle r="6" fill="#2563eb" stroke="#fff" stroke-width="1"><animateMotion path="M 120 420 L 120 300 C 120 220 60 180 60 70" dur="6s" begin="-4.00s" repeatCount="indefinite"/></circle></g><g class="anim"><circle r="6" fill="#16a34a" stroke="#fff" stroke-width="1"><animateMotion path="M 120 420 L 120 300 C 120 220 180 180 180 70" dur="6s" begin="0.00s" repeatCount="indefinite"/></circle><circle r="6" fill="#16a34a" stroke="#fff" stroke-width="1"><animateMotion path="M 120 420 L 120 300 C 120 220 180 180 180 70" dur="6s" begin="-2.00s" repeatCount="indefinite"/></circle><circle r="6" fill="#16a34a" stroke="#fff" stroke-width="1"><animateMotion path="M 120 420 L 120 300 C 120 220 180 180 180 70" dur="6s" begin="-4.00s" repeatCount="indefinite"/></circle></g></svg>