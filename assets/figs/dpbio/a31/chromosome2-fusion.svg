<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="system-ui,Arial,sans-serif" role="img" aria-label="Two chimpanzee chromosomes joined end to end match human chromosome 2, which has telomere repeats in its middle, a second inactive centromere and the same banding pattern"><rect width="900" height="480" fill="#fff"/><defs><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker></defs><text x="450" y="30" font-size="18" text-anchor="middle" fill="#1f2937" font-weight="bold">Evidence that human chromosome 2 formed by fusion</text><rect x="134" y="80" width="32" height="160" rx="14" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><rect x="135" y="123.0" width="30" height="10" rx="0" fill="#5b21b6" stroke="#5b21b6" stroke-width="0"/><rect x="135" y="163.0" width="30" height="10" rx="0" fill="#5b21b6" stroke="#5b21b6" stroke-width="0"/><rect x="135" y="203.0" width="30" height="10" rx="0" fill="#5b21b6" stroke="#5b21b6" stroke-width="0"/><rect x="134" y="80" width="32" height="10" rx="4" fill="#fbbf24" stroke="#d97706" stroke-width="1"/><rect x="134" y="230" width="32" height="10" rx="4" fill="#fbbf24" stroke="#d97706" stroke-width="1"/><circle cx="150" cy="144.0" r="9" fill="#dc2626" stroke="#dc2626" stroke-width="1.5"/><rect x="214" y="80" width="32" height="190" rx="14" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><rect x="215" y="122.5" width="30" height="10" rx="0" fill="#5b21b6" stroke="#5b21b6" stroke-width="0"/><rect x="215" y="170.0" width="30" height="10" rx="0" fill="#5b21b6" stroke="#5b21b6" stroke-width="0"/><rect x="215" y="217.5" width="30" height="10" rx="0" fill="#5b21b6" stroke="#5b21b6" stroke-width="0"/><rect x="214" y="80" width="32" height="10" rx="4" fill="#fbbf24" stroke="#d97706" stroke-width="1"/><rect x="214" y="260" width="32" height="10" rx="4" fill="#fbbf24" stroke="#d97706" stroke-width="1"/><circle cx="230" cy="146.5" r="9" fill="#dc2626" stroke="#dc2626" stroke-width="1.5"/><text x="190" y="300" font-size="14" text-anchor="middle" fill="#1f2937" font-weight="bold">chimpanzee 2A and 2B</text><text x="190" y="317" font-size="14" text-anchor="middle" fill="#1f2937" font-weight="bold">(48 chromosomes)</text><line x1="290" y1="200" x2="400" y2="200" stroke="#16a34a" stroke-width="3" marker-end="url(#ag)"/><text x="345" y="186" font-size="14" text-anchor="middle" fill="#16a34a" font-weight="bold">fusion</text><rect x="464" y="60" width="32" height="160" rx="14" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><rect x="465" y="103.0" width="30" height="10" rx="0" fill="#5b21b6" stroke="#5b21b6" stroke-width="0"/><rect x="465" y="143.0" width="30" height="10" rx="0" fill="#5b21b6" stroke="#5b21b6" stroke-width="0"/><rect x="465" y="183.0" width="30" height="10" rx="0" fill="#5b21b6" stroke="#5b21b6" stroke-width="0"/><rect x="464" y="60" width="32" height="10" rx="4" fill="#fbbf24" stroke="#d97706" stroke-width="1"/><circle cx="480" cy="124.0" r="9" fill="#dc2626" stroke="#dc2626" stroke-width="1.5"/><rect x="464" y="220" width="32" height="190" rx="14" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><rect x="465" y="262.5" width="30" height="10" rx="0" fill="#5b21b6" stroke="#5b21b6" stroke-width="0"/><rect x="465" y="310.0" width="30" height="10" rx="0" fill="#5b21b6" stroke="#5b21b6" stroke-width="0"/><rect x="465" y="357.5" width="30" height="10" rx="0" fill="#5b21b6" stroke="#5b21b6" stroke-width="0"/><rect x="464" y="400" width="32" height="10" rx="4" fill="#fbbf24" stroke="#d97706" stroke-width="1"/><circle cx="480" cy="286.5" r="9" fill="#fff" stroke="#dc2626" stroke-width="1.5"/><rect x="464" y="212" width="32" height="14" rx="3" fill="#fde68a" stroke="#d97706" stroke-width="1.5"/><text x="480" y="440" font-size="14" text-anchor="middle" fill="#1f2937" font-weight="bold">human chromosome 2</text><text x="480" y="457" font-size="14" text-anchor="middle" fill="#1f2937" font-weight="bold">(46 chromosomes)</text><line x1="496" y1="219" x2="564" y2="145" stroke="#475569" stroke-width="1.2"/><circle cx="496" cy="219" r="2.5" fill="#475569" stroke="#475569" stroke-width="1"/><text x="560" y="150" font-size="13" text-anchor="start" fill="#1f2937" font-weight="normal">2 telomere-like repeats in the MIDDLE</text><text x="560" y="166" font-size="13" text-anchor="start" fill="#1f2937" font-weight="normal">(where two ends joined)</text><line x1="489" y1="286" x2="564" y2="255" stroke="#475569" stroke-width="1.2"/><circle cx="489" cy="286" r="2.5" fill="#475569" stroke="#475569" stroke-width="1"/><text x="560" y="260" font-size="13" text-anchor="start" fill="#1f2937" font-weight="normal">3 remains of a second, inactive</text><text x="560" y="276" font-size="13" text-anchor="start" fill="#1f2937" font-weight="normal">centromere</text><line x1="496" y1="140" x2="564" y2="75" stroke="#475569" stroke-width="1.2"/><circle cx="496" cy="140" r="2.5" fill="#475569" stroke="#475569" stroke-width="1"/><text x="560" y="80" font-size="13" text-anchor="start" fill="#1f2937" font-weight="normal">1 banding pattern matches the two chimp</text><text x="560" y="96" font-size="13" text-anchor="start" fill="#1f2937" font-weight="normal">chromosomes placed end to end</text><text x="560" y="350" font-size="13" text-anchor="start" fill="#475569" font-weight="normal" font-style="italic">A testable hypothesis: it predicts features we</text><text x="560" y="366" font-size="13" text-anchor="start" fill="#475569" font-weight="normal" font-style="italic">can look for, and they were found.</text></svg>