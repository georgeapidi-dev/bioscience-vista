<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="system-ui,Arial,sans-serif" role="img" aria-label="Flow chart: collect a water or soil sample, filter, extract DNA, copy a barcode region by PCR, sequence it, compare with a reference database, list the species present"><rect width="900" height="420" fill="#fff"/><defs><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker></defs><text x="450" y="30" font-size="18" text-anchor="middle" fill="#1f2937" font-weight="bold">Identifying species from environmental DNA (eDNA)</text><rect x="30" y="70" width="180" height="90" rx="8" fill="#ecfeff" stroke="#0d9488" stroke-width="2"/><text x="120.0" y="111.16666666666667" font-size="14" text-anchor="middle" fill="#1f2937" font-weight="bold">Collect water</text><text x="120.0" y="128.16666666666669" font-size="14" text-anchor="middle" fill="#1f2937" font-weight="bold">or soil sample</text><rect x="245" y="70" width="180" height="90" rx="8" fill="#ecfeff" stroke="#0d9488" stroke-width="2"/><text x="335.0" y="111.16666666666667" font-size="14" text-anchor="middle" fill="#1f2937" font-weight="bold">Filter: trap cells</text><text x="335.0" y="128.16666666666669" font-size="14" text-anchor="middle" fill="#1f2937" font-weight="bold">and DNA fragments</text><rect x="460" y="70" width="180" height="90" rx="8" fill="#ecfeff" stroke="#0d9488" stroke-width="2"/><text x="550.0" y="119.66666666666667" font-size="14" text-anchor="middle" fill="#1f2937" font-weight="bold">Extract DNA</text><rect x="675" y="70" width="180" height="90" rx="8" fill="#ecfeff" stroke="#0d9488" stroke-width="2"/><text x="765.0" y="111.16666666666667" font-size="14" text-anchor="middle" fill="#1f2937" font-weight="bold">PCR: copy a short</text><text x="765.0" y="128.16666666666669" font-size="14" text-anchor="middle" fill="#1f2937" font-weight="bold">barcode region</text><rect x="567" y="230" width="180" height="90" rx="8" fill="#ecfeff" stroke="#0d9488" stroke-width="2"/><text x="657.0" y="271.1666666666667" font-size="14" text-anchor="middle" fill="#1f2937" font-weight="bold">Sequence the</text><text x="657.0" y="288.1666666666667" font-size="14" text-anchor="middle" fill="#1f2937" font-weight="bold">barcodes</text><rect x="352" y="230" width="180" height="90" rx="8" fill="#ecfeff" stroke="#0d9488" stroke-width="2"/><text x="442.0" y="271.1666666666667" font-size="14" text-anchor="middle" fill="#1f2937" font-weight="bold">Compare with a</text><text x="442.0" y="288.1666666666667" font-size="14" text-anchor="middle" fill="#1f2937" font-weight="bold">reference database</text><rect x="137" y="230" width="180" height="90" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="227.0" y="271.1666666666667" font-size="14" text-anchor="middle" fill="#1f2937" font-weight="bold">List of species</text><text x="227.0" y="288.1666666666667" font-size="14" text-anchor="middle" fill="#1f2937" font-weight="bold">present</text><line x1="212" y1="115" x2="243" y2="115" stroke="#0d9488" stroke-width="2.5" marker-end="url(#at)"/><line x1="427" y1="115" x2="458" y2="115" stroke="#0d9488" stroke-width="2.5" marker-end="url(#at)"/><line x1="642" y1="115" x2="673" y2="115" stroke="#0d9488" stroke-width="2.5" marker-end="url(#at)"/><path d="M 785 162 L 785 200 L 750 220" stroke="#0d9488" stroke-width="2.5" fill="none" marker-end="url(#at)"/><line x1="565" y1="275" x2="534" y2="275" stroke="#0d9488" stroke-width="2.5" marker-end="url(#at)"/><line x1="350" y1="275" x2="319" y2="275" stroke="#0d9488" stroke-width="2.5" marker-end="url(#at)"/><text x="450" y="380" font-size="13" text-anchor="middle" fill="#475569" font-weight="normal" font-style="italic">Barcode: a short, standard gene region that differs between species (e.g. COI in animals, rbcL in plants).</text><text x="450" y="402" font-size="13" text-anchor="middle" fill="#475569" font-weight="normal" font-style="italic">Rapid, non-invasive, detects rare or hidden species; cannot count individuals and depends on the database.</text></svg>