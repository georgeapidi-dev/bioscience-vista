<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 505" font-family="system-ui,Arial,sans-serif" role="img" aria-label="A table of base differences between four organisms W, X, Y and Z, and the cladogram built from it: W and X are closest, then Y, with Z as the outgroup; root, nodes and terminal branches labelled"><style>@media (prefers-reduced-motion: reduce){.anim{display:none}}</style><rect width="900" height="505" fill="#fff"/><defs><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker></defs><text x="450" y="30" font-size="18" text-anchor="middle" fill="#1f2937" font-weight="bold">From sequence differences to a cladogram (sample data)</text><text x="110" y="80" font-size="16" text-anchor="middle" fill="#2563eb" font-weight="bold">W</text><text x="60" y="120" font-size="16" text-anchor="middle" fill="#2563eb" font-weight="bold">W</text><rect x="85" y="98" width="50" height="34" rx="4" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1"/><text x="110" y="121" font-size="15" text-anchor="middle" fill="#1f2937" font-weight="normal">–</text><rect x="145" y="98" width="50" height="34" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="170" y="121" font-size="15" text-anchor="middle" fill="#1f2937" font-weight="normal">2</text><rect x="205" y="98" width="50" height="34" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="230" y="121" font-size="15" text-anchor="middle" fill="#1f2937" font-weight="normal">6</text><rect x="265" y="98" width="50" height="34" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="290" y="121" font-size="15" text-anchor="middle" fill="#1f2937" font-weight="normal">9</text><text x="170" y="80" font-size="16" text-anchor="middle" fill="#2563eb" font-weight="bold">X</text><text x="60" y="160" font-size="16" text-anchor="middle" fill="#2563eb" font-weight="bold">X</text><rect x="85" y="138" width="50" height="34" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="110" y="161" font-size="15" text-anchor="middle" fill="#1f2937" font-weight="normal">2</text><rect x="145" y="138" width="50" height="34" rx="4" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1"/><text x="170" y="161" font-size="15" text-anchor="middle" fill="#1f2937" font-weight="normal">–</text><rect x="205" y="138" width="50" height="34" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="230" y="161" font-size="15" text-anchor="middle" fill="#1f2937" font-weight="normal">6</text><rect x="265" y="138" width="50" height="34" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="290" y="161" font-size="15" text-anchor="middle" fill="#1f2937" font-weight="normal">9</text><text x="230" y="80" font-size="16" text-anchor="middle" fill="#2563eb" font-weight="bold">Y</text><text x="60" y="200" font-size="16" text-anchor="middle" fill="#2563eb" font-weight="bold">Y</text><rect x="85" y="178" width="50" height="34" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="110" y="201" font-size="15" text-anchor="middle" fill="#1f2937" font-weight="normal">6</text><rect x="145" y="178" width="50" height="34" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="170" y="201" font-size="15" text-anchor="middle" fill="#1f2937" font-weight="normal">6</text><rect x="205" y="178" width="50" height="34" rx="4" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1"/><text x="230" y="201" font-size="15" text-anchor="middle" fill="#1f2937" font-weight="normal">–</text><rect x="265" y="178" width="50" height="34" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="290" y="201" font-size="15" text-anchor="middle" fill="#1f2937" font-weight="normal">9</text><text x="290" y="80" font-size="16" text-anchor="middle" fill="#2563eb" font-weight="bold">Z</text><text x="60" y="240" font-size="16" text-anchor="middle" fill="#2563eb" font-weight="bold">Z</text><rect x="85" y="218" width="50" height="34" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="110" y="241" font-size="15" text-anchor="middle" fill="#1f2937" font-weight="normal">9</text><rect x="145" y="218" width="50" height="34" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="170" y="241" font-size="15" text-anchor="middle" fill="#1f2937" font-weight="normal">9</text><rect x="205" y="218" width="50" height="34" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="230" y="241" font-size="15" text-anchor="middle" fill="#1f2937" font-weight="normal">9</text><rect x="265" y="218" width="50" height="34" rx="4" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1"/><text x="290" y="241" font-size="15" text-anchor="middle" fill="#1f2937" font-weight="normal">–</text><text x="200" y="290" font-size="13" text-anchor="middle" fill="#475569" font-weight="normal">Number of base differences</text><text x="200" y="306" font-size="13" text-anchor="middle" fill="#475569" font-weight="normal">in a gene of 50 bases</text><line x1="800" y1="100" x2="800" y2="360" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 4"/><path d="M 510 230 L 510 360 L 800 360" stroke="#1f2937" stroke-width="3" fill="none"/><path d="M 510 230 L 590 230" stroke="#1f2937" stroke-width="3" fill="none"/><path d="M 590 180 L 590 260 L 800 260" stroke="#1f2937" stroke-width="3" fill="none"/><path d="M 590 180 L 700 180" stroke="#1f2937" stroke-width="3" fill="none"/><path d="M 700 100 L 700 170" stroke="#1f2937" stroke-width="3" fill="none"/><path d="M 700 100 L 800 100" stroke="#1f2937" stroke-width="3" fill="none"/><path d="M 700 170 L 800 170" stroke="#1f2937" stroke-width="3" fill="none"/><text x="815" y="106" font-size="17" text-anchor="start" fill="#2563eb" font-weight="bold">W</text><text x="815" y="176" font-size="17" text-anchor="start" fill="#2563eb" font-weight="bold">X</text><text x="815" y="266" font-size="17" text-anchor="start" fill="#2563eb" font-weight="bold">Y</text><text x="815" y="366" font-size="17" text-anchor="start" fill="#2563eb" font-weight="bold">Z</text><circle cx="510" cy="230" r="7" fill="#d97706" stroke="#92400e" stroke-width="2"/><circle cx="590" cy="180" r="7" fill="#d97706" stroke="#92400e" stroke-width="2"/><circle cx="700" cy="135" r="7" fill="#d97706" stroke="#92400e" stroke-width="2"/><line x1="510" y1="300" x2="434" y2="415" stroke="#475569" stroke-width="1.2"/><circle cx="510" cy="300" r="2.5" fill="#475569" stroke="#475569" stroke-width="1"/><text x="430" y="420" font-size="13" text-anchor="start" fill="#1f2937" font-weight="normal">root</text><line x1="590" y1="180" x2="624" y2="75" stroke="#475569" stroke-width="1.2"/><circle cx="590" cy="180" r="2.5" fill="#475569" stroke="#475569" stroke-width="1"/><text x="620" y="80" font-size="13" text-anchor="start" fill="#1f2937" font-weight="normal">node = hypothetical</text><text x="620" y="96" font-size="13" text-anchor="start" fill="#1f2937" font-weight="normal">common ancestor</text><line x1="770" y1="360" x2="704" y2="415" stroke="#475569" stroke-width="1.2"/><circle cx="770" cy="360" r="2.5" fill="#475569" stroke="#475569" stroke-width="1"/><text x="700" y="420" font-size="13" text-anchor="start" fill="#1f2937" font-weight="normal">terminal branch</text><text x="450" y="470" font-size="13" text-anchor="middle" fill="#475569" font-weight="normal" font-style="italic">W and X differ least (2), so they share the most recent ancestor; Z differs most (9) and is the outgroup.</text><text x="450" y="490" font-size="13" text-anchor="middle" fill="#475569" font-weight="normal" font-style="italic">Parsimony: choose the tree that explains the differences with the fewest changes.</text><g class="anim"><circle r="5" fill="#16a34a" stroke="#fff" stroke-width="1"><animateMotion path="M 510 360 L 510 230 L 590 230 L 590 180 L 700 180 L 700 100 L 800 100" dur="6s" begin="0.00s" repeatCount="indefinite"/></circle><circle r="5" fill="#16a34a" stroke="#fff" stroke-width="1"><animateMotion path="M 510 360 L 510 230 L 590 230 L 590 180 L 700 180 L 700 100 L 800 100" dur="6s" begin="-2.00s" repeatCount="indefinite"/></circle><circle r="5" fill="#16a34a" stroke="#fff" stroke-width="1"><animateMotion path="M 510 360 L 510 230 L 590 230 L 590 180 L 700 180 L 700 100 L 800 100" dur="6s" begin="-4.00s" repeatCount="indefinite"/></circle></g></svg>