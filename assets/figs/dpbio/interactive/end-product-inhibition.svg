<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" class="vd-svg" role="img" aria-labelledby="ep-title ep-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="ep-play" data-vd-play-label="Play: feedback" data-vd-steps="[[0, &quot;End-product inhibition: a pathway controls itself.&quot;], [1, &quot;Threonine is converted step by step into isoleucine.&quot;], [6, &quot;Isoleucine builds up...&quot;], [8, &quot;...and binds the allosteric site of the FIRST enzyme, threonine deaminase.&quot;], [10.5, &quot;The pathway stops; when isoleucine is used up, it starts again. Negative feedback.&quot;]]" data-vd-dur="16">
<title id="ep-title">End-product inhibition</title><desc id="ep-desc">A five-step pathway from threonine to isoleucine; isoleucine accumulates and binds an allosteric site on the first enzyme, threonine deaminase, switching the pathway off by negative feedback.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="520" fill="#ffffff"/>
<g aria-hidden="true"><animate id="ep-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<defs><marker id="ep-475569" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="7.2" refY="8.0" orient="auto"><path d="M0,0 L16,8.0 L0,16 z" fill="#475569"/></marker><marker id="ep-dc2626" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="7.2" refY="8.0" orient="auto"><path d="M0,0 L16,8.0 L0,16 z" fill="#dc2626"/></marker></defs>
<text class="head" x="30" y="34">End-product inhibition: threonine → isoleucine</text><text class="note" x="30" y="56">The end product inhibits the first enzyme of its own pathway.</text>
<g class="part" data-part="path" data-name="A metabolic pathway" data-info="Threonine is converted to isoleucine in five steps, each catalysed by a different enzyme, through intermediates A–D." tabindex="0" role="button" aria-label="A metabolic pathway"><rect x="45" y="200" width="110" height="44" rx="22" fill="#dbeafe" stroke="#334155" stroke-width="2"/><text x="100" y="228" text-anchor="middle" font-size="14" font-weight="800" fill="#111827">threonine</text><path d="M 158 222 L 218 222" stroke="#475569" stroke-width="3" marker-end="url(#ep-475569)"/><text x="190.0" y="300" text-anchor="middle" font-size="11" font-weight="800" fill="#475569">enzyme 1</text><rect x="225" y="200" width="110" height="44" rx="22" fill="#f1f5f9" stroke="#334155" stroke-width="2"/><text x="280" y="228" text-anchor="middle" font-size="14" font-weight="800" fill="#111827">A</text><path d="M 338 222 L 398 222" stroke="#475569" stroke-width="3" marker-end="url(#ep-475569)"/><text x="370.0" y="300" text-anchor="middle" font-size="11" font-weight="800" fill="#475569">enzyme 2</text><rect x="405" y="200" width="110" height="44" rx="22" fill="#f1f5f9" stroke="#334155" stroke-width="2"/><text x="460" y="228" text-anchor="middle" font-size="14" font-weight="800" fill="#111827">B</text><path d="M 518 222 L 578 222" stroke="#475569" stroke-width="3" marker-end="url(#ep-475569)"/><text x="550.0" y="300" text-anchor="middle" font-size="11" font-weight="800" fill="#475569">enzyme 3</text><rect x="585" y="200" width="110" height="44" rx="22" fill="#f1f5f9" stroke="#334155" stroke-width="2"/><text x="640" y="228" text-anchor="middle" font-size="14" font-weight="800" fill="#111827">C</text><path d="M 698 222 L 758 222" stroke="#475569" stroke-width="3" marker-end="url(#ep-475569)"/><text x="730.0" y="300" text-anchor="middle" font-size="11" font-weight="800" fill="#475569">enzyme 4</text><rect x="765" y="200" width="110" height="44" rx="22" fill="#f1f5f9" stroke="#334155" stroke-width="2"/><text x="820" y="228" text-anchor="middle" font-size="14" font-weight="800" fill="#111827">D</text><path d="M 878 222 L 938 222" stroke="#475569" stroke-width="3" marker-end="url(#ep-475569)"/><text x="910.0" y="300" text-anchor="middle" font-size="11" font-weight="800" fill="#475569">enzyme 5</text><rect x="945" y="200" width="110" height="44" rx="22" fill="#dcfce7" stroke="#334155" stroke-width="2"/><text x="1000" y="228" text-anchor="middle" font-size="14" font-weight="800" fill="#111827">isoleucine</text></g>
<g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.0625;0.0750;1.0000;1.0000;1.0000" values="0;0;1;1;0;0" dur="16s" begin="ep-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.0625;0.1250;0.1875;0.2500;0.3125;0.3750;1.0000" values="100 180;100 180;280 180;460 180;640 180;820 180;982 160;982 160" dur="16s" begin="ep-play.begin+0s" fill="freeze"/><circle r="7" fill="#22c55e" stroke="#14532d"/></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.0906;0.1031;1.0000;1.0000;1.0000" values="0;0;1;1;0;0" dur="16s" begin="ep-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.0906;0.1531;0.2156;0.2781;0.3406;0.4031;1.0000" values="100 180;100 180;280 180;460 180;640 180;820 180;1000 160;1000 160" dur="16s" begin="ep-play.begin+0s" fill="freeze"/><circle r="7" fill="#22c55e" stroke="#14532d"/></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.1187;0.1313;1.0000;1.0000;1.0000" values="0;0;1;1;0;0" dur="16s" begin="ep-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.1187;0.1812;0.2437;0.3063;0.3688;0.4313;1.0000" values="100 180;100 180;280 180;460 180;640 180;820 180;1018 160;1018 160" dur="16s" begin="ep-play.begin+0s" fill="freeze"/><circle r="7" fill="#22c55e" stroke="#14532d"/></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.1469;0.1594;1.0000;1.0000;1.0000" values="0;0;1;1;0;0" dur="16s" begin="ep-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.1469;0.2094;0.2719;0.3344;0.3969;0.4594;1.0000" values="100 180;100 180;280 180;460 180;640 180;820 180;982 142;982 142" dur="16s" begin="ep-play.begin+0s" fill="freeze"/><circle r="7" fill="#22c55e" stroke="#14532d"/></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.1750;0.1875;1.0000;1.0000;1.0000" values="0;0;1;1;0;0" dur="16s" begin="ep-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.1750;0.2375;0.3000;0.3625;0.4250;0.4875;1.0000" values="100 180;100 180;280 180;460 180;640 180;820 180;1000 142;1000 142" dur="16s" begin="ep-play.begin+0s" fill="freeze"/><circle r="7" fill="#22c55e" stroke="#14532d"/></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.2031;0.2156;1.0000;1.0000;1.0000" values="0;0;1;1;0;0" dur="16s" begin="ep-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.2031;0.2656;0.3281;0.3906;0.4531;0.5156;1.0000" values="100 180;100 180;280 180;460 180;640 180;820 180;1018 142;1018 142" dur="16s" begin="ep-play.begin+0s" fill="freeze"/><circle r="7" fill="#22c55e" stroke="#14532d"/></g></g>
<g class="part" data-part="e1" data-name="Threonine deaminase" data-info="The first enzyme in the pathway. It has an allosteric site that fits isoleucine." tabindex="0" role="button" aria-label="Threonine deaminase"><g><animate attributeName="opacity" keyTimes="0.0000;0.5625;0.5813;1.0000" values="1;1;0;0" dur="16s" begin="ep-play.begin+0s" fill="freeze"/><g transform="translate(190.0 370) scale(0.8)"><path d="M -60 -40 L -20 -40 L 0 -14 L 20 -40 L 60 -40 C 80 -40 80 40 50 46 C 20 52 -20 52 -50 46 C -80 40 -80 -40 -60 -40 Z" fill="#93c5fd" stroke="#334155" stroke-width="2.5"/></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.5625;0.5813;1.0000" values="0;0;1;1" dur="16s" begin="ep-play.begin+0s" fill="freeze"/><g transform="translate(190.0 370) scale(0.8)"><path d="M -60 -40 L -18 -40 L -18 -18 L 18 -18 L 18 -40 L 60 -40 C 80 -40 80 40 50 46 C 20 52 -20 52 -50 46 C -80 40 -80 -40 -60 -40 Z" fill="#cbd5e1" stroke="#334155" stroke-width="2.5"/></g></g><line x1="190.0" y1="330" x2="190.0" y2="250" stroke="#475569" stroke-dasharray="4 3"/><text x="190.0" y="450" text-anchor="middle" font-size="13" font-weight="800" fill="#1d4ed8">threonine deaminase</text><circle cx="230.0" cy="400" r="9" fill="#fff" stroke="#334155" stroke-dasharray="3 3"/></g>
<g class="part" data-part="iso" data-name="End product: isoleucine" data-info="As isoleucine accumulates, it binds the allosteric site of threonine deaminase." tabindex="0" role="button" aria-label="End product: isoleucine"><g><animate attributeName="opacity" keyTimes="0.0000;0.4688;0.4875;1.0000" values="0;0;1;1" dur="16s" begin="ep-play.begin+0s" fill="freeze"/><path d="M 1000 270 C 1000 480 390.0 470 242.0 405" fill="none" stroke="#dc2626" stroke-width="3" stroke-dasharray="8 5" marker-end="url(#ep-dc2626)"/></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.5000;0.5125;1.0000;1.0000;1.0000" values="0;0;1;1;0;0" dur="16s" begin="ep-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.5000;0.5625;1.0000" values="1000 170;1000 170;230.0 400;230.0 400" dur="16s" begin="ep-play.begin+0s" fill="freeze"/><circle r="8" fill="#22c55e" stroke="#14532d"/></g></g></g>
<g class="part" data-part="off" data-name="Pathway switched off" data-info="The active site changes shape so threonine can no longer bind: no more isoleucine is made until levels fall and isoleucine leaves the allosteric site. Negative feedback." tabindex="0" role="button" aria-label="Pathway switched off"><g><animate attributeName="opacity" keyTimes="0.0000;0.6250;0.6438;1.0000" values="0;0;1;1" dur="16s" begin="ep-play.begin+0s" fill="freeze"/><line x1="140" y1="190" x2="240" y2="254" stroke="#dc2626" stroke-width="6"/><line x1="140" y1="254" x2="240" y2="190" stroke="#dc2626" stroke-width="6"/><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.6562;0.6750;1.0000" values="0;0;1;1" dur="16s" begin="ep-play.begin+0s" fill="freeze"/><rect x="470.0" y="418" width="460" height="24" rx="12" fill="#fee2e2" stroke="#1f2937" stroke-width="1"/><text x="700" y="435" text-anchor="middle" font-size="12" font-weight="700">pathway OFF until isoleucine is used up — negative feedback</text></g></g></g>
</svg>