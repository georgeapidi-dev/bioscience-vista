ame="opacity" keyTimes="0.0000;0.0714;0.0929;1.0000" values="0;0;1;1" dur="14s" begin="ha-play.begin+0s" fill="freeze"/><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.0714;0.0929;1.0000" values="0;0;1;1" dur="14s" begin="ha-play.begin+0s" fill="freeze"/><rect x="130.0" y="508" width="460" height="24" rx="12" fill="#fff" stroke="#1f2937" stroke-width="1"/><text x="360" y="525" text-anchor="middle" font-size="12" font-weight="700">habitat: Kenyan coast · intertidal mud · mangrove forest</text></g></g></g>
<g class="part" data-part="plant" data-name="Abiotic variables for plants" data-info="Light intensity, temperature, soil water, soil pH, mineral nutrients, salinity, wind exposure." tabindex="0" role="button" aria-label="Abiotic variables for plants"><g><animate attributeName="opacity" keyTimes="0.0000;0.2857;0.3071;1.0000" values="0;0;1;1" dur="14s" begin="ha-play.begin+0s" fill="freeze"/><rect x="480" y="124" width="160" height="30" rx="15" fill="#dcfce7" stroke="#16a34a"/><text x="560" y="144" text-anchor="middle" font-size="12" font-weight="800" fill="#14532d">light intensity</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.3214;0.3429;1.0000" values="0;0;1;1" dur="14s" begin="ha-play.begin+0s" fill="freeze"/><rect x="170" y="104" width="160" height="30" rx="15" fill="#dcfce7" stroke="#16a34a"/><text x="250" y="124" text-anchor="middle" font-size="12" font-weight="800" fill="#14532d">temperature</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.3571;0.3786;1.0000" values="0;0;1;1" dur="14s" begin="ha-play.begin+0s" fill="freeze"/><rect x="10" y="454" width="160" height="30" rx="15" fill="#dcfce7" stroke="#16a34a"/><text x="90" y="474" text-anchor="middle" font-size="12" font-weight="800" fill="#14532d">soil water, salinity</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.3929;0.4143;1.0000" values="0;0;1;1" dur="14s" begin="ha-play.begin+0s" fill="freeze"/><rect x="480" y="454" width="160" height="30" rx="15" fill="#dcfce7" stroke="#16a34a"/><text x="560" y="474" text-anchor="middle" font-size="12" font-weight="800" fill="#14532d">soil pH, minerals</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.4286;0.4500;1.0000" values="0;0;1;1" dur="14s" begin="ha-play.begin+0s" fill="freeze"/><rect x="30" y="214" width="160" height="30" rx="15" fill="#dcfce7" stroke="#16a34a"/><text x="110" y="234" text-anchor="middle" font-size="12" font-weight="800" fill="#14532d">wind exposure</text></g></g>
<g class="part" data-part="animal" data-name="Abiotic variables for animals" data-info="Temperature, water availability, oxygen concentration (in water), salinity, pH, light." tabindex="0" role="button" aria-label="Abiotic variables for animals"><g><animate attributeName="opacity" keyTimes="0.0000;0.5357;0.5571;1.0000" values="0;0;1;1" dur="14s" begin="ha-play.begin+0s" fill="freeze"/><rect x="310" y="384" width="180" height="30" rx="15" fill="#e0e7ff" stroke="#4f46e5"/><text x="400" y="404" text-anchor="middle" font-size="12" font-weight="800" fill="#312e81">O₂ in water, salinity</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.5714;0.5929;1.0000" values="0;0;1;1" dur="14s" begin="ha-play.begin+0s" fill="freeze"/><rect x="160" y="284" width="180" height="30" rx="15" fill="#e0e7ff" stroke="#4f46e5"/><text x="250" y="304" text-anchor="middle" font-size="12" font-weight="800" fill="#312e81">temperature, pH</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.5357;0.5571;1.0000" values="0;0;1;1" dur="14s" begin="ha-play.begin+0s" fill="freeze"/><g transform="translate(560 410)"><ellipse rx="28" ry="16" fill="#f97316"/><circle cx="-12" cy="-16" r="6" fill="#fff" stroke="#000"/><circle cx="12" cy="-16" r="6" fill="#fff" stroke="#000"/></g><text x="560" y="444" text-anchor="middle" font-size="11" font-weight="800" fill="#111827">mud crab</text></g></g>
<g class="part" data-part="range" data-name="Range of tolerance" data-info="Each species survives only within a range of each abiotic variable." tabindex="0" role="button" aria-label="Range of tolerance"><rect x="710" y="80" width="360" height="470" rx="16" fill="#f8fafc" stroke="#cbd5e1"/><text x="890" y="108" text-anchor="middle" font-size="14" font-weight="800" fill="#111827">range of tolerance</text><line x1="750" y1="440" x2="1050" y2="440" stroke="#111827" stroke-width="2"/><line x1="750" y1="440" x2="750" y2="220" stroke="#111827" stroke-width="2"/><text x="900.0" y="462" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">abiotic variable, e.g. salinity</text><text x="756" y="212" text-anchor="start" font-size="11" font-weight="700" fill="#111827">population</text><clipPath id="hac-c105220750"><rect x="750" y="220" width="300" height="220"><animate attributeName="width" keyTimes="0.0000;0.7500;0.8929;1.0000" values="0;0;300;300" dur="14s" begin="ha-play.begin+0s" fill="freeze"/></rect></clipPath><g clip-path="url(#hac-c105220750)"><path d="M 780 440 C 860 440 860 250 900 250 C 940 250 940 440 1020 440" fill="#bbf7d0" stroke="#16a34a" stroke-width="3"/></g><g><animate attributeName="opacity" keyTimes="0.0000;0.8929;0.9143;1.0000" values="0;0;1;1" dur="14s" begin="ha-play.begin+0s" fill="freeze"/><text x="900" y="244" text-anchor="middle" font-size="11" font-weight="800" fill="#15803d">optimum</text><text x="780" y="484" text-anchor="start" font-size="10" font-weight="800" fill="#b91c1c">too low: absent</text><text x="1050" y="484" text-anchor="end" font-size="10" font-weight="800" fill="#b91c1c">too high: absent</text></g></g>
