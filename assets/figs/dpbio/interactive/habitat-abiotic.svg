<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 580" class="vd-svg" role="img" aria-labelledby="ha-title ha-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="ha-play" data-vd-play-label="Play: read the habitat" data-vd-steps="[[0, &quot;Habitat and abiotic factors.&quot;], [1, &quot;A habitat: where an organism lives, described by location and ecosystem.&quot;], [4, &quot;Abiotic variables that affect plants...&quot;], [7.5, &quot;...and animals.&quot;], [10.5, &quot;Each species survives only within a range of each variable.&quot;]]" data-vd-dur="14">
<title id="ha-title">Habitats and abiotic variables</title><desc id="ha-desc">A mangrove habitat on the Kenyan coast with the abiotic variables affecting plants and animals labelled, and a tolerance curve showing that a species survives only within a range of each variable.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="580" fill="#ffffff"/>
<g aria-hidden="true"><animate id="ha-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<text class="head" x="30" y="34">Habitat and abiotic variables</text><text class="note" x="30" y="56">Example: a mangrove on the Kenyan coast.</text>
