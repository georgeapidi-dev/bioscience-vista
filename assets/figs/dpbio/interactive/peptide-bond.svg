<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" class="vd-svg" role="img" aria-labelledby="pb-title pb-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="pb-play" data-vd-play-label="Play: condensation" data-vd-steps="[[0, &quot;Two amino acids. Each has an amine group, a carboxyl group, a central carbon and an R group.&quot;], [1, &quot;The \u2013OH of one carboxyl group and an \u2013H of the other amine group are removed.&quot;], [3, &quot;They form a molecule of water: a condensation reaction.&quot;], [5, &quot;The carbon and nitrogen join: a peptide bond. The product is a dipeptide.&quot;], [9, &quot;Ribosomes repeat this to build polypeptides. Hydrolysis (adding water, by protease enzymes) breaks the bond again.&quot;]]" data-vd-dur="14">
<title id="pb-title">Forming a peptide bond</title><desc id="pb-desc">Two amino acids join by condensation: –OH from the carboxyl group and –H from the amine group form water, and a peptide bond (C–N) links them into a dipeptide.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1200" height="560" fill="#ffffff"/>
<g aria-hidden="true"><animate id="pb-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<text class="head" x="30" y="34">Condensation: forming a peptide bond</text><text class="note" x="30" y="56">Structural formulae of two amino acids (R₁ and R₂ are their side chains).</text>
<g class="part" data-part="am" data-name="Amine group (–NH₂)" data-info="Present in every amino acid. Loses an H atom when a peptide bond forms." tabindex="0" role="button" aria-label="Amine group (–NH₂)"><text x="160" y="310" text-anchor="middle" font-size="30" font-weight="700" fill="#1d4ed8">N</text><line x1="160" y1="318" x2="160" y2="344" stroke="#334155" stroke-width="3"/><text x="160" y="370" text-anchor="middle" font-size="30" font-weight="700" fill="#1d4ed8">H</text><text x="90" y="310" text-anchor="middle" font-size="30" font-weight="700" fill="#1d4ed8">H</text><line x1="106" y1="300" x2="142" y2="300" stroke="#334155" stroke-width="3"/></g>
<g class="part" data-part="ca" data-name="Central (alpha) carbon" data-info="Bonded to H, the amine group, the carboxyl group and the R group." tabindex="0" role="button" aria-label="Central (alpha) carbon"><text x="240" y="310" text-anchor="middle" font-size="30" font-weight="700" fill="#111827">C</text><line x1="178" y1="300" x2="224" y2="300" stroke="#334155" stroke-width="3"/><line x1="240" y1="282" x2="240" y2="256" stroke="#334155" stroke-width="3"/><text x="240" y="250" text-anchor="middle" font-size="30" font-weight="700" fill="#111827">H</text></g><g class="part" data-part="r" data-name="R group (side chain)" data-info="Different in each of the 20 amino acids. Determines the amino acid’s properties." tabindex="0" role="button" aria-label="R group (side chain)"><line x1="240" y1="318" x2="240" y2="346" stroke="#334155" stroke-width="3"/><circle cx="240" cy="374" r="26" fill="#fde68a" stroke="#1f2937" stroke-width="2"/><text x="240" y="378" text-anchor="middle" font-size="22" font-weight="700" fill="#111827">R₁</text></g><g class="part" data-part="cb" data-name="Carboxyl group (–COOH)" data-info="Present in every amino acid. Loses –OH when a peptide bond forms." tabindex="0" role="button" aria-label="Carboxyl group (–COOH)"><text x="320" y="310" text-anchor="middle" font-size="30" font-weight="700" fill="#b91c1c">C</text><line x1="256" y1="300" x2="304" y2="300" stroke="#334155" stroke-width="3"/><line x1="315" y1="282" x2="315" y2="254" stroke="#334155" stroke-width="3"/><line x1="325" y1="282" x2="325" y2="254" stroke="#334155" stroke-width="3"/><text x="320" y="246" text-anchor="middle" font-size="30" font-weight="700" fill="#b91c1c">O</text></g>
<g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.2143;0.3286;1.0000" values="0 0;0 0;152 -160;152 -160" dur="14s" begin="pb-play.begin+0s" fill="freeze"/><g><animate attributeName="opacity" keyTimes="0.0000;0.3286;0.3571;1.0000" values="1;1;0;0" dur="14s" begin="pb-play.begin+0s" fill="freeze"/><line x1="336" y1="300" x2="370" y2="300" stroke="#334155" stroke-width="3"/><text x="388" y="310" text-anchor="middle" font-size="30" font-weight="700" fill="#b91c1c">O</text><line x1="406" y1="300" x2="424" y2="300" stroke="#334155" stroke-width="3"/><text x="440" y="310" text-anchor="middle" font-size="30" font-weight="700" fill="#b91c1c">H</text><rect x="334" y="274" width="118" height="52" rx="14" fill="none" stroke="#dc2626" stroke-width="3" stroke-dasharray="6 4" opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.0714;0.0929;1.0000" values="0;0;1;1" dur="14s" begin="pb-play.begin+0s" fill="freeze"/></rect></g></g>
<g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.3571;0.5000;1.0000" values="0 0;0 0;-230 0;-230 0" dur="14s" begin="pb-play.begin+0s" fill="freeze"/><text x="660" y="310" text-anchor="middle" font-size="30" font-weight="700" fill="#1d4ed8">N</text><line x1="660" y1="318" x2="660" y2="344" stroke="#334155" stroke-width="3"/><text x="660" y="370" text-anchor="middle" font-size="30" font-weight="700" fill="#1d4ed8">H</text><text x="740" y="310" text-anchor="middle" font-size="30" font-weight="700" fill="#111827">C</text><line x1="678" y1="300" x2="724" y2="300" stroke="#334155" stroke-width="3"/><line x1="740" y1="282" x2="740" y2="256" stroke="#334155" stroke-width="3"/><text x="740" y="250" text-anchor="middle" font-size="30" font-weight="700" fill="#111827">H</text><line x1="740" y1="318" x2="740" y2="346" stroke="#334155" stroke-width="3"/><circle cx="740" cy="374" r="26" fill="#a7f3d0" stroke="#1f2937" stroke-width="2"/><text x="740" y="378" text-anchor="middle" font-size="22" font-weight="700" fill="#111827">R₂</text><text x="820" y="310" text-anchor="middle" font-size="30" font-weight="700" fill="#b91c1c">C</text><line x1="756" y1="300" x2="804" y2="300" stroke="#334155" stroke-width="3"/><line x1="815" y1="282" x2="815" y2="254" stroke="#334155" stroke-width="3"/><line x1="825" y1="282" x2="825" y2="254" stroke="#334155" stroke-width="3"/><text x="820" y="246" text-anchor="middle" font-size="30" font-weight="700" fill="#b91c1c">O</text><line x1="836" y1="300" x2="870" y2="300" stroke="#334155" stroke-width="3"/><text x="888" y="310" text-anchor="middle" font-size="30" font-weight="700" fill="#b91c1c">O</text><line x1="906" y1="300" x2="924" y2="300" stroke="#334155" stroke-width="3"/><text x="940" y="310" text-anchor="middle" font-size="30" font-weight="700" fill="#b91c1c">H</text></g>
<g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.2143;0.3286;1.0000" values="0 0;0 0;54 -160;54 -160" dur="14s" begin="pb-play.begin+0s" fill="freeze"/><g><animate attributeName="opacity" keyTimes="0.0000;0.3286;0.3571;1.0000" values="1;1;0;0" dur="14s" begin="pb-play.begin+0s" fill="freeze"/><text x="590" y="310" text-anchor="middle" font-size="30" font-weight="700" fill="#1d4ed8">H</text><line x1="606" y1="300" x2="642" y2="300" stroke="#334155" stroke-width="3"/><rect x="566" y="274" width="66" height="52" rx="14" fill="none" stroke="#dc2626" stroke-width="3" stroke-dasharray="6 4" opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.0714;0.0929;1.0000" values="0;0;1;1" dur="14s" begin="pb-play.begin+0s" fill="freeze"/></rect></g></g>
<g class="part" data-part="w" data-name="Water" data-info="Released: this is a condensation reaction. Adding water back (hydrolysis) breaks the peptide bond." tabindex="0" role="button" aria-label="Water"><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.3214;0.3429;1.0000" values="0;0;1;1" dur="14s" begin="pb-play.begin+0s" fill="freeze"/><g transform="translate(592 140)"><circle r="40" fill="#e0f2fe" stroke="#0284c7" stroke-width="3"/><text y="10" text-anchor="middle" font-size="26" font-weight="800" fill="#0369a1">H₂O</text></g><text x="644" y="146" font-size="14" font-weight="700" fill="#0369a1">water released</text></g></g>
<g class="part" data-part="pb" data-name="Peptide bond" data-info="The C–N bond between the carbon of the carboxyl group and the nitrogen of the amine group: –CO–NH–." tabindex="0" role="button" aria-label="Peptide bond"><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.5000;0.5214;1.0000" values="0;0;1;1" dur="14s" begin="pb-play.begin+0s" fill="freeze"/><line x1="338" y1="300" x2="412" y2="300" stroke="#334155" stroke-width="3"/><rect x="300" y="210" width="150" height="170" rx="14" fill="#fef9c3" fill-opacity=".35" stroke="#ca8a04" stroke-width="3"/><text x="375" y="422" text-anchor="middle" font-size="15" font-weight="800" fill="#a16207">peptide bond</text></g></g>
<g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.5714;0.5929;1.0000" values="0;0;1;1" dur="14s" begin="pb-play.begin+0s" fill="freeze"/><rect x="460.0" y="488" width="120" height="24" rx="12" fill="#fef3c7" stroke="#1f2937" stroke-width="1"/><text x="520" y="505" text-anchor="middle" font-size="12" font-weight="700">dipeptide</text></g>
<g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.6429;0.6643;1.0000" values="0;0;1;1" dur="14s" begin="pb-play.begin+0s" fill="freeze"/><rect x="840" y="400" width="340" height="130" rx="12" fill="#f8fafc" stroke="#cbd5e1"/><text x="856" y="428" font-size="14" font-weight="800">amino acid + amino acid</text><text x="856" y="452" font-size="14">→ dipeptide + water (condensation)</text><text x="856" y="484" font-size="14" fill="#475569">dipeptide + water → 2 amino acids</text><text x="856" y="506" font-size="13" fill="#475569">(hydrolysis, by protease enzymes)</text></g>
<g class="labels"><g class="lbl" data-for="am"><polyline points="120.0,450.0 160.0,340.0"/><circle cx="160.0" cy="340.0" r="2.6"/><text x="120" y="470" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="4">Amine group</text></g><g class="lbl" data-for="cb"><polyline points="360.0,106.0 320.0,250.0"/><circle cx="320.0" cy="250.0" r="2.6"/><text x="360" y="100" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="4">Carboxyl group</text></g><g class="lbl" data-for="r"><polyline points="240.0,450.0 240.0,400.0"/><circle cx="240.0" cy="400.0" r="2.6"/><text x="240" y="470" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="4">R group</text></g><g class="lbl" data-for="ca"><polyline points="200.0,126.0 240.0,282.0"/><circle cx="240.0" cy="282.0" r="2.6"/><text x="200" y="120" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="4">Central carbon</text></g></g>
</svg>