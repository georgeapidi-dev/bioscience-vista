<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 640" class="vd-svg" role="img" aria-labelledby="ca-title ca-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="ca-play" data-vd-play-label="Play: water rises" data-vd-steps="[[0, &quot;Capillary action: water rising in narrow spaces.&quot;], [1, &quot;Water climbs the walls of each tube by adhesion and pulls more water up by cohesion.&quot;], [5, &quot;The narrower the tube, the higher the water rises.&quot;], [8, &quot;In soil, water is drawn up through the narrow spaces between particles.&quot;]]" data-vd-dur="13">
<title id="ca-title">Capillary action</title><desc id="ca-desc">Water rising in three glass tubes of different widths, highest in the narrowest, with a curved meniscus; and water drawn upwards through the narrow spaces between soil particles.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="640" fill="#ffffff"/>
<g aria-hidden="true"><animate id="ca-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
