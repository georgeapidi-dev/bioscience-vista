<g class="part" data-part="why" data-name="Why narrower = higher" data-info="In a narrow tube a larger fraction of the water is in contact with the wall, so adhesion can lift the column further against gravity." tabindex="0" role="button" aria-label="Why narrower = higher"><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.3846;0.4077;1.0000" values="0;0;1;1" dur="13s" begin="ca-play.begin+0s" fill="freeze"/><rect x="95.0" y="598" width="410" height="24" rx="12" fill="#fde8e8" stroke="#1f2937" stroke-width="1"/><text x="300" y="615" text-anchor="middle" font-size="12" font-weight="700">narrower: more wall per volume → adhesion lifts it higher</text></g></g>
