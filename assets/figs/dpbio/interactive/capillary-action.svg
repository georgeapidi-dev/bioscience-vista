<text class="head" x="30" y="34">Capillary action</text><text class="note" x="30" y="56">After EduVista A1.1 task sheet.</text>
<rect x="80" y="430" width="440" height="110" fill="#c4def4" stroke="#4b5563" stroke-width="3"/>
<g class="part" data-part="tubes" data-name="Capillary action in a tube" data-info="Adhesion pulls water up the glass wall; cohesion pulls the rest of the water up behind. The narrower the tube, the higher the water rises." tabindex="0" role="button" aria-label="Capillary action in a tube"><rect x="140" y="360" width="60" height="170" fill="#c4def4"><animate attributeName="y" values="430;430;360;360" keyTimes="0;0.077;0.308;1" dur="13s" begin="ca-play.begin" fill="freeze"/><animate attributeName="height" values="100;100;170;170" keyTimes="0;0.077;0.308;1" dur="13s" begin="ca-play.begin" fill="freeze"/></rect><rect x="140" y="120" width="60" height="420" fill="none" stroke="#4b5563" stroke-width="3"/><line x1="170.0" y1="370" x2="170.0" y2="520" stroke="#c0392b" stroke-width="2" stroke-dasharray="4 4" opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.3077;0.3308;1.0000" values="0;0;1;1" dur="13s" begin="ca-play.begin+0s" fill="freeze"/></line><rect x="280" y="270" width="34" height="260" fill="#c4def4"><animate attributeName="y" values="430;430;270;270" keyTimes="0;0.077;0.385;1" dur="13s" begin="ca-play.begin" fill="freeze"/><animate attributeName="height" values="100;100;260;260" keyTimes="0;0.077;0.385;1" dur="13s" begin="ca-play.begin" fill="freeze"/></rect><rect x="280" y="120" width="34" height="420" fill="none" stroke="#4b5563" stroke-width="3"/><line x1="297.0" y1="280" x2="297.0" y2="520" stroke="#c0392b" stroke-width="2" stroke-dasharray="4 4" opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.3846;0.4077;1.0000" values="0;0;1;1" dur="13s" begin="ca-play.begin+0s" fill="freeze"/></line><rect x="410" y="180" width="18" height="350" fill="#c4def4"><animate attributeName="y" values="430;430;180;180" keyTimes="0;0.077;0.462;1" dur="13s" begin="ca-play.begin" fill="freeze"/><animate attributeName="height" values="100;100;350;350" keyTimes="0;0.077;0.462;1" dur="13s" begin="ca-play.begin" fill="freeze"/></rect><rect x="410" y="120" width="18" height="420" fill="none" stroke="#4b5563" stroke-width="3"/><line x1="419.0" y1="190" x2="419.0" y2="520" stroke="#c0392b" stroke-width="2" stroke-dasharray="4 4" opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.4615;0.4846;1.0000" values="0;0;1;1" dur="13s" begin="ca-play.begin+0s" fill="freeze"/></line><text x="300" y="100" text-anchor="middle" font-size="15" font-weight="800" fill="#111827">The narrower the tube, the higher the water rises</text></g>
<g class="part" data-part="men" data-name="Meniscus" data-info="The curved surface: water clings to the wall (adhesion), so the edges are higher than the middle." tabindex="0" role="button" aria-label="Meniscus"><g><animate attributeName="opacity" keyTimes="0.0000;0.4615;0.4846;1.0000" values="0;0;1;1" dur="13s" begin="ca-play.begin+0s" fill="freeze"/><path d="M 280 270 Q 297 286 314 270" fill="none" stroke="#2e6fb5" stroke-width="3"/><line x1="297" y1="280" x2="230" y2="210" stroke="#475569" stroke-width="1.5"/><circle cx="297" cy="280" r="3" fill="#475569"/><text x="226" y="204" text-anchor="end" font-size="12" font-weight="800" fill="#2e6fb5">meniscus</text></g></g>
<text x="300" y="570" text-anchor="middle" font-size="15" font-weight="800" fill="#1f3b5c">CAPILLARY ACTION IN A TUBE</text>
