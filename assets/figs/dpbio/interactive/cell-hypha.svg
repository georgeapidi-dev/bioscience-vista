<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" class="vd-svg" role="img" aria-labelledby="hy-title hy-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1">
<title id="hy-title">Part of an aseptate fungal hypha</title><desc id="hy-desc">A fungal hypha without cross-walls: chitin wall, membrane, continuous cytoplasm with many nuclei, mitochondria, vacuoles and a growing tip with vesicles.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="520" fill="#ffffff"/>
<text class="head" x="30" y="36">Atypical cell: aseptate fungal hypha</text><text class="note" x="30" y="58">No septa (cross-walls): one long tube of cytoplasm with many nuclei. Hyphae can be metres long.</text>
<g class="part" data-part="wall" data-name="Cell wall (chitin)" data-info="Tough wall around the whole hypha." tabindex="0" role="button" aria-label="Cell wall (chitin)"><path d="M 40 230 L 900 230 C 980 230 1040 260 1040 290 C 1040 320 980 350 900 350 L 40 350" fill="#fde68a" stroke="#854d0e" stroke-width="4"/></g>
<g class="part" data-part="mem" data-name="Cell membrane" data-info="Controls what enters and leaves; fungi absorb digested food through it." tabindex="0" role="button" aria-label="Cell membrane"><path d="M 40 242 L 900 242 C 970 242 1026 266 1026 290 C 1026 314 970 338 900 338 L 40 338" fill="#fffbeb" stroke="#be185d" stroke-width="2.5"/></g>
<g class="part" data-part="cyt" data-name="Continuous cytoplasm" data-info="No cross-walls (septa), so the cytoplasm streams along the whole hypha: one long tube, not separate cells." tabindex="0" role="button" aria-label="Continuous cytoplasm"><path d="M 120 290 L 860 290" stroke="#fcd34d" stroke-width="1.5" stroke-dasharray="10 8"/></g>
<g class="part" data-part="vac" data-name="Vacuoles" data-info="Older parts of the hypha have large vacuoles." tabindex="0" role="button" aria-label="Vacuoles"><ellipse cx="100" cy="290" rx="44" ry="30" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/><ellipse cx="240" cy="290" rx="44" ry="30" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/></g>
<g class="part" data-part="nuc" data-name="Many nuclei" data-info="Many nuclei share one cytoplasm (coenocytic): an atypical &quot;cell&quot;." tabindex="0" role="button" aria-label="Many nuclei"><circle cx="360" cy="270" r="13" fill="#ede9fe" stroke="#5b21b6" stroke-width="2.5"/><circle cx="480" cy="310" r="13" fill="#ede9fe" stroke="#5b21b6" stroke-width="2.5"/><circle cx="600" cy="268" r="13" fill="#ede9fe" stroke="#5b21b6" stroke-width="2.5"/><circle cx="720" cy="312" r="13" fill="#ede9fe" stroke="#5b21b6" stroke-width="2.5"/><circle cx="840" cy="280" r="13" fill="#ede9fe" stroke="#5b21b6" stroke-width="2.5"/></g>
<g class="part" data-part="mito" data-name="Mitochondria" data-info="Respiration to release energy for growth." tabindex="0" role="button" aria-label="Mitochondria"><ellipse cx="420" cy="316" rx="16" ry="6" fill="#fdba74" stroke="#9a3412" stroke-width="1.5"/><ellipse cx="540" cy="266" rx="16" ry="6" fill="#fdba74" stroke="#9a3412" stroke-width="1.5"/><ellipse cx="660" cy="314" rx="16" ry="6" fill="#fdba74" stroke="#9a3412" stroke-width="1.5"/><ellipse cx="780" cy="266" rx="16" ry="6" fill="#fdba74" stroke="#9a3412" stroke-width="1.5"/><ellipse cx="330" cy="312" rx="16" ry="6" fill="#fdba74" stroke="#9a3412" stroke-width="1.5"/></g>
<g class="part" data-part="tip" data-name="Growing tip" data-info="Hyphae grow at the tip; vesicles bring new wall and membrane material, and enzymes are secreted here to digest food outside the hypha." tabindex="0" role="button" aria-label="Growing tip"><circle cx="960" cy="276" r="4" fill="#fff" stroke="#be185d" stroke-width="1.5"/><circle cx="980" cy="292" r="4" fill="#fff" stroke="#be185d" stroke-width="1.5"/><circle cx="1000" cy="284" r="4" fill="#fff" stroke="#be185d" stroke-width="1.5"/><circle cx="970" cy="306" r="4" fill="#fff" stroke="#be185d" stroke-width="1.5"/><circle cx="995" cy="304" r="4" fill="#fff" stroke="#be185d" stroke-width="1.5"/><circle cx="950" cy="292" r="4" fill="#fff" stroke="#be185d" stroke-width="1.5"/></g>
<g class="labels"><g class="lbl" data-for="wall"><polyline points="600.0,156.0 600.0,230.0"/><circle cx="600.0" cy="230.0" r="2.6"/><text x="600" y="150" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="4">Cell wall (chitin)</text></g><g class="lbl" data-for="mem"><polyline points="300.0,176.0 300.0,242.0"/><circle cx="300.0" cy="242.0" r="2.6"/><text x="300" y="170" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="4">Cell membrane</text></g><g class="lbl" data-for="vac"><polyline points="100.0,420.0 100.0,290.0"/><circle cx="100.0" cy="290.0" r="2.6"/><text x="100" y="440" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="4">Vacuoles</text></g><g class="lbl" data-for="nuc"><polyline points="440.0,420.0 480.0,310.0"/><circle cx="480.0" cy="310.0" r="2.6"/><text x="440" y="440" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="4">Nuclei (many)</text></g><g class="lbl" data-for="mito"><polyline points="660.0,420.0 660.0,314.0"/><circle cx="660.0" cy="314.0" r="2.6"/><text x="660" y="440" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="4">Mitochondria</text></g><g class="lbl" data-for="cyt"><polyline points="830.0,186.0 760.0,290.0"/><circle cx="760.0" cy="290.0" r="2.6"/><text x="830" y="180" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="4">Continuous cytoplasm: no septa</text></g><g class="lbl" data-for="tip"><polyline points="1000.0,420.0 990.0,292.0"/><circle cx="990.0" cy="292.0" r="2.6"/><text x="1000" y="440" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="4">Growing tip</text></g></g>
</svg>