<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" class="vd-svg" role="img" aria-labelledby="cv-title cv-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="cv-play" data-vd-play-label="Play: one turn" data-vd-steps="[[0, &quot;The Calvin cycle, in the stroma: shown per 3 CO\u2082.&quot;], [1, &quot;Fixation: RuBisCO joins 3 CO\u2082 to 3 RuBP, making 6 GP.&quot;], [5, &quot;Reduction: 6 ATP and 6 NADPH turn 6 GP into 6 triose phosphate.&quot;], [9, &quot;One triose phosphate leaves to build glucose and other organic compounds.&quot;], [11.5, &quot;Regeneration: 5 TP and 3 ATP make 3 RuBP again.&quot;]]" data-vd-dur="16">
<title id="cv-title">The Calvin cycle</title><desc id="cv-desc">The Calvin cycle per three carbon dioxide molecules: fixation by RuBisCO to RuBP forming six GP, reduction by ATP and NADPH to six triose phosphate, one triose phosphate output and regeneration of RuBP using ATP.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="620" fill="#ffffff"/>
<g aria-hidden="true"><animate id="cv-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<defs><marker id="cv-475569" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="7.2" refY="8.0" orient="auto"><path d="M0,0 L16,8.0 L0,16 z" fill="#475569"/></marker></defs>
<text class="head" x="30" y="34">The Calvin cycle (light-independent reactions)</text><text class="note" x="30" y="56">Per 3 CO₂ fixed. Each circle = one carbon atom.</text>
<circle cx="470" cy="340" r="190" fill="none" stroke="#cbd5e1" stroke-width="22"/>
<path d="M 660 340 A 190 190 0 0 1 470 530" fill="none" stroke="#86efac" stroke-width="22" opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.3125;0.3312;1.0000" values="0;0;0.9;0.9" dur="16s" begin="cv-play.begin+0s" fill="freeze"/></path><path d="M 470 150 A 190 190 0 0 1 660 340" fill="none" stroke="#93c5fd" stroke-width="22" opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.0625;0.0813;1.0000" values="0;0;0.9;0.9" dur="16s" begin="cv-play.begin+0s" fill="freeze"/></path><path d="M 470 530 A 190 190 0 0 1 470 150" fill="none" stroke="#fcd34d" stroke-width="22" opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.7188;0.7375;1.0000" values="0;0;0.9;0.9" dur="16s" begin="cv-play.begin+0s" fill="freeze"/></path>
<circle cx="438" cy="150" r="7" fill="#fbbf24" stroke="#1f2937"/><circle cx="454" cy="150" r="7" fill="#fbbf24" stroke="#1f2937"/><circle cx="470" cy="150" r="7" fill="#fbbf24" stroke="#1f2937"/><circle cx="486" cy="150" r="7" fill="#fbbf24" stroke="#1f2937"/><circle cx="502" cy="150" r="7" fill="#fbbf24" stroke="#1f2937"/><text x="470" y="132" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">3 RuBP (5C)</text><g><animate attributeName="opacity" keyTimes="0.0000;0.1562;0.1750;1.0000" values="0;0;1;1" dur="16s" begin="cv-play.begin+0s" fill="freeze"/><circle cx="644" cy="340" r="7" fill="#60a5fa" stroke="#1f2937"/><circle cx="660" cy="340" r="7" fill="#60a5fa" stroke="#1f2937"/><circle cx="676" cy="340" r="7" fill="#60a5fa" stroke="#1f2937"/><text x="730" y="344" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">6 GP (3C)</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.4375;0.4562;1.0000" values="0;0;1;1" dur="16s" begin="cv-play.begin+0s" fill="freeze"/><circle cx="454" cy="530" r="7" fill="#4ade80" stroke="#1f2937"/><circle cx="470" cy="530" r="7" fill="#4ade80" stroke="#1f2937"/><circle cx="486" cy="530" r="7" fill="#4ade80" stroke="#1f2937"/><text x="470" y="562" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">6 triose phosphate (3C)</text></g>
<g class="part" data-part="fix" data-name="Carbon fixation" data-info="RuBisCO joins 3 CO₂ to 3 RuBP (5-carbon) → 6 molecules of GP (glycerate 3-phosphate, 3-carbon)." tabindex="0" role="button" aria-label="Carbon fixation"><g><animate attributeName="opacity" keyTimes="0.0000;0.0625;0.0813;1.0000" values="0;0;1;1" dur="16s" begin="cv-play.begin+0s" fill="freeze"/><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.0625;0.0750;0.1625;0.1750;1.0000" values="0;0;1;1;0;0" dur="16s" begin="cv-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.0625;0.1500;1.0000" values="770 80;770 80;550 160;550 160" dur="16s" begin="cv-play.begin+0s" fill="freeze"/><g><circle r="9" fill="#374151"/><text x="0" y="4" text-anchor="middle" font-size="9" font-weight="800" fill="#fff">C</text></g></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.0875;0.1000;0.1875;0.2000;1.0000" values="0;0;1;1;0;0" dur="16s" begin="cv-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.0875;0.1750;1.0000" values="770 80;770 80;550 160;550 160" dur="16s" begin="cv-play.begin+0s" fill="freeze"/><g><circle r="9" fill="#374151"/><text x="0" y="4" text-anchor="middle" font-size="9" font-weight="800" fill="#fff">C</text></g></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.1125;0.1250;0.2125;0.2250;1.0000" values="0;0;1;1;0;0" dur="16s" begin="cv-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.1125;0.2000;1.0000" values="770 80;770 80;550 160;550 160" dur="16s" begin="cv-play.begin+0s" fill="freeze"/><g><circle r="9" fill="#374151"/><text x="0" y="4" text-anchor="middle" font-size="9" font-weight="800" fill="#fff">C</text></g></g></g><text x="810" y="74" text-anchor="middle" font-size="14" font-weight="800" fill="#111827">3 CO₂ in</text><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.0625;0.0813;1.0000" values="0;0;1;1" dur="16s" begin="cv-play.begin+0s" fill="freeze"/><rect x="580.0" y="188" width="100" height="24" rx="12" fill="#dbeafe" stroke="#1f2937" stroke-width="1"/><text x="630" y="205" text-anchor="middle" font-size="12" font-weight="700">RuBisCO</text></g></g></g>
<g class="part" data-part="red" data-name="Reduction" data-info="6 ATP and 6 NADPH (from the light-dependent reactions) convert 6 GP into 6 triose phosphate (TP)." tabindex="0" role="button" aria-label="Reduction"><g><animate attributeName="opacity" keyTimes="0.0000;0.3125;0.3312;1.0000" values="0;0;1;1" dur="16s" begin="cv-play.begin+0s" fill="freeze"/><rect x="740" y="380" width="150" height="70" rx="12" fill="#fff" stroke="#16a34a"/><text x="815" y="408" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">6 ATP → 6 ADP</text><text x="815" y="432" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">6 NADPH → 6 NADP⁺</text><path d="M 740 420 L 616.8 473.0" stroke="#16a34a" stroke-width="3" marker-end="url(#cv-475569)"/></g></g>
<g class="part" data-part="out" data-name="Output" data-info="For every 3 CO₂ fixed, 1 triose phosphate leaves the cycle to make glucose, sucrose, starch and other compounds." tabindex="0" role="button" aria-label="Output"><g><animate attributeName="opacity" keyTimes="0.0000;0.5625;0.5813;1.0000" values="0;0;1;1" dur="16s" begin="cv-play.begin+0s" fill="freeze"/><path d="M 410 540 C 310 570 210 530 170 520" fill="none" stroke="#475569" stroke-width="4" marker-end="url(#cv-475569)"/><circle cx="124" cy="490" r="7" fill="#4ade80" stroke="#1f2937"/><circle cx="140" cy="490" r="7" fill="#4ade80" stroke="#1f2937"/><circle cx="156" cy="490" r="7" fill="#4ade80" stroke="#1f2937"/><text x="140" y="464" text-anchor="middle" font-size="12" font-weight="800" fill="#111827"></text><text x="140" y="556" text-anchor="middle" font-size="13" font-weight="800" fill="#166534">1 TP out → glucose, starch,</text><text x="140" y="574" text-anchor="middle" font-size="13" font-weight="800" fill="#166534">sucrose, amino acids…</text></g></g>
<g class="part" data-part="regen" data-name="Regeneration of RuBP" data-info="5 TP are rearranged, using 3 ATP, into 3 RuBP, so the cycle continues." tabindex="0" role="button" aria-label="Regeneration of RuBP"><g><animate attributeName="opacity" keyTimes="0.0000;0.7188;0.7375;1.0000" values="0;0;1;1" dur="16s" begin="cv-play.begin+0s" fill="freeze"/><rect x="80" y="240" width="160" height="64" rx="12" fill="#fff" stroke="#d97706"/><text x="160" y="266" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">5 TP + 3 ATP</text><text x="160" y="288" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">→ 3 RuBP</text><path d="M 240 272 L 286 310" stroke="#d97706" stroke-width="3" marker-end="url(#cv-475569)"/></g></g>
<g class="part" data-part="where" data-name="Where" data-info="In the stroma of the chloroplast; a cyclical pathway: RuBP is regenerated." tabindex="0" role="button" aria-label="Where"><rect x="900" y="100" width="180" height="200" rx="14" fill="#f0fdf4" stroke="#86efac"/><text x="990" y="126" text-anchor="middle" font-size="13" font-weight="800" fill="#166534">stroma of the</text><text x="990" y="144" text-anchor="middle" font-size="13" font-weight="800" fill="#166534">chloroplast</text><text x="990" y="180" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">ATP and NADPH</text><text x="990" y="198" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">come from the</text><text x="990" y="216" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">light-dependent</text><text x="990" y="234" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">reactions</text><text x="990" y="268" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">a CYCLE: RuBP</text><text x="990" y="286" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">is regenerated</text></g>
</svg>