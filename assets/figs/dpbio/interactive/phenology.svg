<g class="part" data-part="cue" data-name="Phenology" data-info="Research into the timing of biological events: flowering, budburst, bird migration, egg laying, insect emergence. Cues: photoperiod (fixed each year) and temperature (variable, rising with climate change)." tabindex="0" role="button" aria-label="Phenology"><rect x="780" y="110" width="290" height="300" rx="16" fill="#f8fafc" stroke="#cbd5e1"/><text x="925" y="138" text-anchor="middle" font-size="14" font-weight="800" fill="#111827">cues</text><text x="925" y="176" text-anchor="middle" font-size="13" font-weight="800" fill="#1d4ed8">photoperiod (day length)</text><text x="925" y="196" text-anchor="middle" font-size="12" font-weight="700" fill="#475569">fixed each year</text><text x="925" y="240" text-anchor="middle" font-size="13" font-weight="800" fill="#15803d">temperature</text><text x="925" y="260" text-anchor="middle" font-size="12" font-weight="700" fill="#475569">variable; rising with</text><text x="925" y="278" text-anchor="middle" font-size="12" font-weight="700" fill="#475569">climate change</text><text x="925" y="330" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">events: flowering, budburst,</text><text x="925" y="348" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">migration, egg laying,</text><text x="925" y="366" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">insect emergence</text></g>
