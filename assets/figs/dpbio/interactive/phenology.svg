<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" class="vd-svg" role="img" aria-labelledby="ph-title ph-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="ph-play" data-vd-play-label="Play: warm the spring" data-vd-steps="[[0, &quot;Phenology: the timing of life events.&quot;], [1, &quot;Historically, caterpillars (temperature cue) peaked when chicks hatched (day-length cue).&quot;], [6, &quot;With warming, the caterpillar peak shifts earlier; the birds do not.&quot;], [10, &quot;A mismatch: chicks hatch after the food peak.&quot;]]" data-vd-dur="14">
<title id="ph-title">Phenology and mismatch</title><desc id="ph-desc">Graph of caterpillar abundance and bird chick food demand over spring: in the past the peaks coincided; with warming the temperature-cued caterpillar peak moves earlier while the day-length-cued chick peak does not, creating a mismatch.</desc>
