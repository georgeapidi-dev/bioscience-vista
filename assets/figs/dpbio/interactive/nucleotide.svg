<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" class="vd-svg" role="img" aria-labelledby="nt-title nt-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="nt-play" data-vd-play-label="Play: build a strand" data-vd-steps="[[0, &quot;Nucleotides: the monomers of DNA and RNA.&quot;], [1, &quot;A base joined to carbon 1\u2032 of a pentose sugar is a nucleoside.&quot;], [3, &quot;Add a phosphate on carbon 5\u2032: a nucleotide.&quot;], [5.5, &quot;A second nucleotide comes close: the 3\u2032-OH of the first lines up with the phosphate of the second.&quot;], [8, &quot;Condensation: water is removed and a phosphodiester bond forms.&quot;], [11, &quot;The new strand has a 5\u2032 end and a 3\u2032 end.&quot;], [13, &quot;Bases are purines (two rings) or pyrimidines (one ring).&quot;]]" data-vd-dur="16">
<title id="nt-title">Nucleotides and the phosphodiester bond</title><desc id="nt-desc">A nucleotide drawn in Haworth projection (phosphate on carbon 5 prime, base on carbon 1 prime, OH on carbon 3 prime), two nucleotides joining by condensation into a phosphodiester bond, the 5 prime and 3 prime ends, and purines and pyrimidines.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1200" height="760" fill="#ffffff"/>
<g aria-hidden="true"><animate id="nt-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<text class="head" x="30" y="34">Nucleotides and the phosphodiester bond</text><text class="note" x="30" y="56">DNA nucleotides (deoxyribose). Hydrogen atoms on C1′, C3′ and C4′ are not shown.</text>
<g class="part" data-part="sug" data-name="Pentose sugar" data-info="Deoxyribose in DNA (shown), ribose in RNA. Carbons are numbered 1′ to 5′." tabindex="0" role="button" aria-label="Pentose sugar"><polygon points="420.0,157.3 485.1,197.6 460.3,256.5 379.7,256.5 354.9,197.6" fill="#fef3c7" stroke="#92400e" stroke-width="3.4" stroke-linejoin="round"/><line x1="379.7" y1="256.5" x2="460.3" y2="256.5" stroke="#92400e" stroke-width="9.3" stroke-linecap="round"/><circle cx="420.0" cy="157.3" r="14.0" fill="#fff"/><text x="420.0" y="165.1" text-anchor="middle" font-size="21.7" font-weight="800" fill="#dc2626">O</text><line x1="379.7" y1="259.6" x2="379.7" y2="296.8" stroke="#334155" stroke-width="2.2" stroke-linecap="round"/><text x="379.7" y="320.1" text-anchor="middle" font-size="20.2" font-weight="800" fill="#111827">OH</text><line x1="354.9" y1="194.5" x2="354.9" y2="160.4" stroke="#334155" stroke-width="2.2" stroke-linecap="round"/><text x="354.9" y="148.0" text-anchor="middle" font-size="20.2" font-weight="800" fill="#111827">CH₂</text><text x="503.7" y="188.3" text-anchor="middle" font-size="17.1" font-weight="800" fill="#2563eb">1′</text><text x="478.9" y="262.7" text-anchor="middle" font-size="17.1" font-weight="800" fill="#2563eb">2′</text><text x="361.1" y="262.7" text-anchor="middle" font-size="17.1" font-weight="800" fill="#2563eb">3′</text><text x="336.3" y="188.3" text-anchor="middle" font-size="17.1" font-weight="800" fill="#2563eb">4′</text><text x="354.9" y="120.1" text-anchor="middle" font-size="17.1" font-weight="800" fill="#2563eb">5′</text><line x1="460.3" y1="259.6" x2="460.3" y2="296.8" stroke="#334155" stroke-width="2.2" stroke-linecap="round"/><text x="460.3" y="320.1" text-anchor="middle" font-size="20.2" font-weight="800" fill="#111827">H</text></g>
<g class="part" data-part="base" data-name="Nitrogenous base" data-info="Joined to carbon 1′ of the sugar. Purines (A, G) have two rings; pyrimidines (C, T, U) have one." tabindex="0" role="button" aria-label="Nitrogenous base"><g><animate attributeName="opacity" keyTimes="0.0000;0.0625;0.0813;1.0000" values="0;0;1;1" dur="16s" begin="nt-play.begin+0s" fill="freeze"/><line x1="485.1" y1="194.5" x2="525.4" y2="144.9" stroke="#334155" stroke-width="2.2" stroke-linecap="round"/><rect x="519.2" y="98.4" width="99.2" height="49.6" rx="9.3" fill="#22c55e" stroke="#1f2937" stroke-width="1.2"/><text x="568.8" y="130.9" text-anchor="middle" font-size="18.6" font-weight="800" fill="#fff">A</text></g></g>
<g class="part" data-part="phos" data-name="Phosphate group" data-info="Joined to carbon 5′ (through the CH₂ group)." tabindex="0" role="button" aria-label="Phosphate group"><g><animate attributeName="opacity" keyTimes="0.0000;0.1875;0.2062;1.0000" values="0;0;1;1" dur="16s" begin="nt-play.begin+0s" fill="freeze"/><line x1="323.9" y1="141.8" x2="305.3" y2="141.8" stroke="#334155" stroke-width="2.2" stroke-linecap="round"/><text x="292.9" y="149.6" text-anchor="middle" font-size="18.6" font-weight="800" fill="#dc2626">O</text><line x1="280.5" y1="141.8" x2="263.4" y2="141.8" stroke="#334155" stroke-width="2.2" stroke-linecap="round"/><circle cx="240.2" cy="141.8" r="23.2" fill="#fbbf24" stroke="#92400e" stroke-width="2"/><text x="240.2" y="149.6" text-anchor="middle" font-size="21.7" font-weight="800" fill="#111827">P</text></g></g>
<g><animate attributeName="opacity" keyTimes="0.0000;0.0750;0.0938;0.1875;0.2062;1.0000" values="0;0;1;1;0;0" dur="16s" begin="nt-play.begin+0s" fill="freeze"/><text x="860" y="130" text-anchor="middle" font-size="13" font-weight="800" fill="#475569">nucleoside = base + sugar</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.2000;0.2188;1.0000" values="0;0;1;1" dur="16s" begin="nt-play.begin+0s" fill="freeze"/><text x="860" y="130" text-anchor="middle" font-size="14" font-weight="800" fill="#111827">nucleotide = phosphate + sugar + base</text></g>
<g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.3438;0.3625;1.0000" values="0;0;1;1" dur="16s" begin="nt-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.3438;0.4688;1.0000" values="220 60;220 60;0 0;0 0" dur="16s" begin="nt-play.begin+0s" fill="freeze"/><polygon points="559.5,375.6 624.6,415.9 599.8,474.8 519.2,474.8 494.4,415.9" fill="#fef3c7" stroke="#92400e" stroke-width="3.4" stroke-linejoin="round"/><line x1="519.2" y1="474.8" x2="599.8" y2="474.8" stroke="#92400e" stroke-width="9.3" stroke-linecap="round"/><circle cx="559.5" cy="375.6" r="14.0" fill="#fff"/><text x="559.5" y="383.3" text-anchor="middle" font-size="21.7" font-weight="800" fill="#dc2626">O</text><line x1="519.2" y1="477.9" x2="519.2" y2="515.0" stroke="#334155" stroke-width="2.2" stroke-linecap="round"/><text x="519.2" y="538.3" text-anchor="middle" font-size="20.2" font-weight="800" fill="#111827">OH</text><line x1="494.4" y1="412.8" x2="494.4" y2="378.6" stroke="#334155" stroke-width="2.2" stroke-linecap="round"/><text x="494.4" y="366.2" text-anchor="middle" font-size="20.2" font-weight="800" fill="#111827">CH₂</text><text x="643.2" y="406.6" text-anchor="middle" font-size="17.1" font-weight="800" fill="#2563eb">1′</text><text x="618.4" y="480.9" text-anchor="middle" font-size="17.1" font-weight="800" fill="#2563eb">2′</text><text x="500.6" y="480.9" text-anchor="middle" font-size="17.1" font-weight="800" fill="#2563eb">3′</text><text x="475.8" y="406.6" text-anchor="middle" font-size="17.1" font-weight="800" fill="#2563eb">4′</text><text x="494.4" y="338.4" text-anchor="middle" font-size="17.1" font-weight="800" fill="#2563eb">5′</text><line x1="599.8" y1="477.9" x2="599.8" y2="515.0" stroke="#334155" stroke-width="2.2" stroke-linecap="round"/><text x="599.8" y="538.3" text-anchor="middle" font-size="20.2" font-weight="800" fill="#111827">H</text><line x1="624.6" y1="412.8" x2="664.9" y2="363.2" stroke="#334155" stroke-width="2.2" stroke-linecap="round"/><rect x="658.7" y="316.7" width="99.2" height="49.6" rx="9.3" fill="#3b82f6" stroke="#1f2937" stroke-width="1.2"/><text x="708.3" y="349.2" text-anchor="middle" font-size="18.6" font-weight="800" fill="#fff">C</text><line x1="463.4" y1="360.1" x2="444.8" y2="360.1" stroke="#334155" stroke-width="2.2" stroke-linecap="round"/><text x="432.4" y="367.8" text-anchor="middle" font-size="18.6" font-weight="800" fill="#dc2626">O</text><line x1="420.0" y1="360.1" x2="402.9" y2="360.1" stroke="#334155" stroke-width="2.2" stroke-linecap="round"/><circle cx="379.7" cy="360.1" r="23.2" fill="#fbbf24" stroke="#92400e" stroke-width="2"/><text x="379.7" y="367.8" text-anchor="middle" font-size="21.7" font-weight="800" fill="#111827">P</text></g></g>
<rect x="351.7" y="298.35" width="56" height="30" fill="#fff" opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.5375;0.5500;1.0000" values="0;0;1;1" dur="16s" begin="nt-play.begin+0s" fill="freeze"/></rect><g class="part" data-part="pd" data-name="Phosphodiester bond" data-info="Formed by condensation between the 3′-OH of one nucleotide and the phosphate of the next, releasing water. It links the sugar–phosphate backbone." tabindex="0" role="button" aria-label="Phosphodiester bond"><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.5375;0.5563;1.0000" values="0;0;1;1" dur="16s" begin="nt-play.begin+0s" fill="freeze"/><line x1="379.7" y1="299.9" x2="379.7" y2="336.25" stroke="#334155" stroke-width="2.5"/><circle cx="379.7" cy="328.25" r="11" fill="#fff"/><text x="379.7" y="334.25" text-anchor="middle" font-size="18" font-weight="800" fill="#dc2626">O</text><line x1="379.7" y1="338.25" x2="379.7" y2="347.25" stroke="#334155" stroke-width="2.5"/><rect x="309.7" y="276.5" width="90.0" height="103.75" rx="14" fill="#fef08a" fill-opacity=".25" stroke="#ca8a04" stroke-width="2.5" stroke-dasharray="6 4"/></g><g><animate attributeName="opacity" keyTimes="0.0000;0.5625;0.5813;1.0000" values="0;0;1;1" dur="16s" begin="nt-play.begin+0s" fill="freeze"/><text x="299.7" y="322.25" text-anchor="end" font-size="13" font-weight="800" fill="#a16207">phosphodiester bond</text><text x="299.7" y="340.25" text-anchor="end" font-size="11" font-weight="700" fill="#a16207">(3′ carbon – O – P – O – 5′ carbon)</text></g></g>
<g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.5000;0.5125;1.0000" values="0;0;1;1" dur="16s" begin="nt-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.5000;0.6000;1.0000" values="419.7 322.25;419.7 322.25;619.7 242.25;619.7 242.25" dur="16s" begin="nt-play.begin+0s" fill="freeze"/><circle r="24" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/><text y="5" text-anchor="middle" font-size="13" font-weight="800" fill="#0369a1">H₂O</text></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.5250;0.5438;0.6875;0.7063;1.0000" values="0;0;1;1;0;0" dur="16s" begin="nt-play.begin+0s" fill="freeze"/><rect x="519.7" y="200.25" width="240" height="24" rx="12" fill="#e0f2fe" stroke="#1f2937" stroke-width="1"/><text x="639.7" y="217.25" text-anchor="middle" font-size="12" font-weight="700">condensation: water released</text></g>
<defs><marker id="nt-arr" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="7" refY="8" orient="auto"><path d="M0,0 L16,8 L0,16 z" fill="#7c3aed"/></marker></defs>
<g class="part" data-part="ends" data-name="5′ and 3′ ends" data-info="A strand has a free phosphate at the 5′ end and a free OH on carbon 3′ at the other: the strand has a direction." tabindex="0" role="button" aria-label="5′ and 3′ ends"><g><animate attributeName="opacity" keyTimes="0.0000;0.6875;0.7063;1.0000" values="0;0;1;1" dur="16s" begin="nt-play.begin+0s" fill="freeze"/><text x="244.89999999999998" y="118.0" font-size="18" font-weight="800" fill="#7c3aed">5′ end</text><text x="499.20000000000005" y="564.75" font-size="18" font-weight="800" fill="#7c3aed">3′ end (free OH)</text><path d="M 60 150 L 60 568.25" stroke="#7c3aed" stroke-width="4" marker-end="url(#nt-arr)"/><text x="48" y="319.125" font-size="13" font-weight="800" fill="#7c3aed" transform="rotate(-90 48 319.125)">5′ → 3′</text></g></g>
<g class="part" data-part="types" data-name="Purines and pyrimidines" data-info="A purine always pairs with a pyrimidine (A–T or A–U, G–C), so the double helix has a constant width." tabindex="0" role="button" aria-label="Purines and pyrimidines"><g><animate attributeName="opacity" keyTimes="0.0000;0.8125;0.8313;1.0000" values="0;0;1;1" dur="16s" begin="nt-play.begin+0s" fill="freeze"/><rect x="780" y="380" width="400" height="360" rx="16" fill="#f8fafc" stroke="#cbd5e1"/><text x="980" y="408" text-anchor="middle" font-size="15" font-weight="800" fill="#111827">The bases</text><text x="880" y="440" text-anchor="middle" font-size="13" font-weight="800" fill="#166534">Purines: two rings</text><text x="1080" y="440" text-anchor="middle" font-size="13" font-weight="800" fill="#1d4ed8">Pyrimidines: one ring</text><polygon points="892.5,513.0 870.0,526.0 847.5,513.0 847.5,487.0 870.0,474.0 892.5,487.0" fill="#22c55e" stroke="#1f2937" stroke-width="2"/><polygon points="830.0,521.0 810.0,506.5 817.7,483.0 842.3,483.0 850.0,506.5" fill="#22c55e" stroke="#1f2937" stroke-width="2"/><text x="880" y="550" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">adenine (A)</text><polygon points="892.5,623.0 870.0,636.0 847.5,623.0 847.5,597.0 870.0,584.0 892.5,597.0" fill="#eab308" stroke="#1f2937" stroke-width="2"/><polygon points="830.0,631.0 810.0,616.5 817.7,593.0 842.3,593.0 850.0,616.5" fill="#eab308" stroke="#1f2937" stroke-width="2"/><text x="880" y="660" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">guanine (G)</text><polygon points="1100.8,502.0 1080.0,514.0 1059.2,502.0 1059.2,478.0 1080.0,466.0 1100.8,478.0" fill="#3b82f6" stroke="#1f2937" stroke-width="2"/><text x="1080" y="532" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">cytosine (C)</text><polygon points="1100.8,584.0 1080.0,596.0 1059.2,584.0 1059.2,560.0 1080.0,548.0 1100.8,560.0" fill="#ef4444" stroke="#1f2937" stroke-width="2"/><text x="1080" y="614" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">thymine (T, DNA)</text><polygon points="1100.8,666.0 1080.0,678.0 1059.2,666.0 1059.2,642.0 1080.0,630.0 1100.8,642.0" fill="#f97316" stroke="#1f2937" stroke-width="2"/><text x="1080" y="696" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">uracil (U, RNA)</text><text x="980" y="728" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">a purine pairs with a pyrimidine: A–T (A–U), G–C</text></g></g>
</svg>