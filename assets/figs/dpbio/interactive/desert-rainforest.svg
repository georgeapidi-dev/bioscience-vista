<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 580" class="vd-svg" role="img" aria-labelledby="dr-title dr-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="dr-play" data-vd-play-label="Play: adapt" data-vd-steps="[[0, &quot;Adapted to desert or rainforest.&quot;], [1, &quot;Saguaro cactus: spines, water-storing stem, wide shallow roots, CAM.&quot;], [4.5, &quot;Fennec fox: big ears lose heat; active at night.&quot;], [7.5, &quot;Kapok tree: buttress roots and drip-tip leaves.&quot;], [10.5, &quot;Sloth: slow metabolism and hooked claws.&quot;]]" data-vd-dur="14">
<title id="dr-title">Desert and rainforest adaptations</title><desc id="dr-desc">A saguaro cactus with spines, water-storing stem and shallow wide roots and a fennec fox with large ears, compared with a kapok tree with buttress roots and drip-tip leaves and a sloth hanging by curved claws.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="580" fill="#ffffff"/>
<g aria-hidden="true"><animate id="dr-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<text class="head" x="30" y="34">Desert and rainforest adaptations</text><text class="note" x="30" y="56">Schematic.</text>
<g class="part" data-part="des" data-name="Hot desert: saguaro cactus" data-info="Leaves reduced to spines; stem stores water and photosynthesises; shallow, wide roots; CAM photosynthesis with stomata open only at night." tabindex="0" role="button" aria-label="Hot desert: saguaro cactus"><rect x="30" y="80" width="510" height="480" rx="16" fill="#fef3c7"/><rect x="30" y="440" width="510" height="120" fill="#fcd34d"/><rect x="160" y="200" width="44" height="240" rx="22" fill="#16a34a" stroke="#14532d" stroke-width="2"/><path d="M 160 320 q -40 0 -40 -50 l 0 -30" fill="none" stroke="#16a34a" stroke-width="26" stroke-linecap="round"/><line x1="164" y1="220" x2="174" y2="214" stroke="#fef9c3" stroke-width="2"/><line x1="164" y1="242" x2="174" y2="236" stroke="#fef9c3" stroke-width="2"/><line x1="164" y1="264" x2="174" y2="258" stroke="#fef9c3" stroke-width="2"/><line x1="164" y1="286" x2="174" y2="280" stroke="#fef9c3" stroke-width="2"/><line x1="164" y1="308" x2="174" y2="302" stroke="#fef9c3" stroke-width="2"/><line x1="164" y1="330" x2="174" y2="324" stroke="#fef9c3" stroke-width="2"/><line x1="164" y1="352" x2="174" y2="346" stroke="#fef9c3" stroke-width="2"/><line x1="164" y1="374" x2="174" y2="368" stroke="#fef9c3" stroke-width="2"/><line x1="164" y1="396" x2="174" y2="390" stroke="#fef9c3" stroke-width="2"/><line x1="164" y1="418" x2="174" y2="412" stroke="#fef9c3" stroke-width="2"/><line x1="196" y1="220" x2="206" y2="214" stroke="#fef9c3" stroke-width="2"/><line x1="196" y1="242" x2="206" y2="236" stroke="#fef9c3" stroke-width="2"/><line x1="196" y1="264" x2="206" y2="258" stroke="#fef9c3" stroke-width="2"/><line x1="196" y1="286" x2="206" y2="280" stroke="#fef9c3" stroke-width="2"/><line x1="196" y1="308" x2="206" y2="302" stroke="#fef9c3" stroke-width="2"/><line x1="196" y1="330" x2="206" y2="324" stroke="#fef9c3" stroke-width="2"/><line x1="196" y1="352" x2="206" y2="346" stroke="#fef9c3" stroke-width="2"/><line x1="196" y1="374" x2="206" y2="368" stroke="#fef9c3" stroke-width="2"/><line x1="196" y1="396" x2="206" y2="390" stroke="#fef9c3" stroke-width="2"/><line x1="196" y1="418" x2="206" y2="412" stroke="#fef9c3" stroke-width="2"/><g><animate attributeName="opacity" keyTimes="0.0000;0.0714;0.0929;1.0000" values="0;0;1;1" dur="14s" begin="dr-play.begin+0s" fill="freeze"/><path d="M 182 440 Q 112.0 460 42 470" fill="none" stroke="#92400e" stroke-width="3"/><path d="M 182 440 Q 137.0 460 92 470" fill="none" stroke="#92400e" stroke-width="3"/><path d="M 182 440 Q 162.0 460 142 470" fill="none" stroke="#92400e" stroke-width="3"/><path d="M 182 440 Q 202.0 460 222 470" fill="none" stroke="#92400e" stroke-width="3"/><path d="M 182 440 Q 227.0 460 272 470" fill="none" stroke="#92400e" stroke-width="3"/><path d="M 182 440 Q 252.0 460 322 470" fill="none" stroke="#92400e" stroke-width="3"/></g><g><animate attributeName="opacity" keyTimes="0.0000;0.1071;0.1286;1.0000" values="0;0;1;1" dur="14s" begin="dr-play.begin+0s" fill="freeze"/><line x1="200" y1="260" x2="300" y2="160" stroke="#475569" stroke-width="1.5"/><circle cx="200" cy="260" r="3" fill="#475569"/><text x="306" y="164" text-anchor="start" font-size="12" font-weight="800" fill="#14532d">spines (leaves)</text><line x1="204" y1="350" x2="300" y2="300" stroke="#475569" stroke-width="1.5"/><circle cx="204" cy="350" r="3" fill="#475569"/><text x="306" y="304" text-anchor="start" font-size="12" font-weight="800" fill="#14532d">stem stores water</text><text x="306" y="320" text-anchor="start" font-size="12" font-weight="800" fill="#14532d">and photosynthesises</text><text x="182" y="500" text-anchor="middle" font-size="12" font-weight="800" fill="#92400e">shallow, wide roots</text><text x="182" y="540" text-anchor="middle" font-size="12" font-weight="800" fill="#14532d">CAM: stomata open at night</text></g></g>
<g class="part" data-part="fox" data-name="Fennec fox" data-info="Large ears radiate heat; nocturnal; kidneys produce concentrated urine." tabindex="0" role="button" aria-label="Fennec fox"><g><animate attributeName="opacity" keyTimes="0.0000;0.3214;0.3429;1.0000" values="0;0;1;1" dur="14s" begin="dr-play.begin+0s" fill="freeze"/><g transform="translate(420 410)"><ellipse rx="44" ry="20" fill="#fde68a" stroke="#a16207" stroke-width="2"/><circle cx="44" cy="-18" r="16" fill="#fde68a" stroke="#a16207" stroke-width="2"/><path d="M 34 -30 L 26 -76 L 46 -34 Z M 52 -32 L 66 -76 L 60 -30 Z" fill="#fbcfe8" stroke="#a16207" stroke-width="2"/></g><text x="420" y="470" text-anchor="middle" font-size="11" font-weight="800" fill="#7c2d12">fennec fox: big ears radiate heat,</text><text x="420" y="486" text-anchor="middle" font-size="11" font-weight="800" fill="#7c2d12">nocturnal, concentrated urine</text></g></g>
<g class="part" data-part="rain" data-name="Rainforest: kapok tree" data-info="Buttress roots support a tall trunk in shallow soil; leaves with drip tips shed water; epiphytes grow high up to reach light." tabindex="0" role="button" aria-label="Rainforest: kapok tree"><rect x="560" y="80" width="510" height="480" rx="16" fill="#dcfce7"/><rect x="560" y="470" width="510" height="90" fill="#78350f" opacity=".5"/><rect x="780" y="150" width="40" height="320" fill="#a16207"/><path d="M 780 400 L 720 470 L 780 470 Z M 820 400 L 880 470 L 820 470 Z" fill="#a16207"/><ellipse cx="800" cy="140" rx="160" ry="50" fill="#15803d"/><g><animate attributeName="opacity" keyTimes="0.0000;0.5357;0.5571;1.0000" values="0;0;1;1" dur="14s" begin="dr-play.begin+0s" fill="freeze"/><line x1="860" y1="450" x2="940" y2="420" stroke="#475569" stroke-width="1.5"/><circle cx="860" cy="450" r="3" fill="#475569"/><text x="946" y="424" text-anchor="start" font-size="12" font-weight="800" fill="#14532d">buttress roots</text><path d="M 660 230 q 20 -40 40 0 q -14 10 -20 36 q -6 -26 -20 -36 Z" fill="#22c55e" stroke="#14532d"/><text x="640" y="300" text-anchor="middle" font-size="12" font-weight="800" fill="#14532d">drip-tip leaf</text><path d="M 680 266 L 680 286" stroke="#38bdf8" stroke-width="3" stroke-dasharray="3 3"/><path d="M 880 175 q 10 -20 20 0 q 10 -20 20 0" fill="#f472b6"/><text x="960" y="196" text-anchor="start" font-size="12" font-weight="800" fill="#14532d">epiphytes high up</text></g></g>
<g class="part" data-part="sloth" data-name="Three-toed sloth" data-info="Slow metabolism suited to a low-energy leaf diet; curved claws for hanging." tabindex="0" role="button" aria-label="Three-toed sloth"><g><animate attributeName="opacity" keyTimes="0.0000;0.7500;0.7714;1.0000" values="0;0;1;1" dur="14s" begin="dr-play.begin+0s" fill="freeze"/><g transform="translate(940 270)"><path d="M -40 -40 L 40 -40" stroke="#57534e" stroke-width="8"/><ellipse cx="0" cy="0" rx="34" ry="22" fill="#a8a29e" stroke="#57534e" stroke-width="2"/><path d="M -24 -16 L -30 -40 M 24 -16 L 30 -40" stroke="#57534e" stroke-width="5"/><circle cx="30" cy="12" r="12" fill="#d6d3d1" stroke="#57534e"/></g><text x="940" y="320" text-anchor="middle" font-size="11" font-weight="800" fill="#111827">sloth: hooked claws,</text><text x="940" y="336" text-anchor="middle" font-size="11" font-weight="800" fill="#111827">slow metabolism</text></g></g>
</svg>