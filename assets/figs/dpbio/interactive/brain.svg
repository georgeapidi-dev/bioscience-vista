<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 680" class="vd-svg" role="img" aria-labelledby="br-title br-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="br-play" data-vd-play-label="Play: tour the brain" data-vd-steps="[[0, &quot;The human brain, seen from the left side.&quot;], [1, &quot;Frontal lobe: planning, decisions and voluntary movement.&quot;], [3, &quot;Parietal lobe: touch and body sense.&quot;], [5, &quot;Temporal lobe: hearing, language and memory.&quot;], [7, &quot;Occipital lobe: vision.&quot;], [9, &quot;Cerebellum: balance and coordination.&quot;], [11, &quot;Brainstem: the medulla controls breathing and heart rate.&quot;]]" data-vd-dur="14">
<title id="br-title">The human brain</title><desc id="br-desc">A side view of the human brain showing the frontal, parietal, temporal and occipital lobes of the cerebrum, the central sulcus, the cerebellum and the brainstem with pons and medulla.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1220" height="680" fill="#ffffff"/>
<g aria-hidden="true"><animate id="br-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<text class="head" x="30" y="34">The human brain (left side)</text><text class="note" x="30" y="56">Front of the head to the left.</text>
