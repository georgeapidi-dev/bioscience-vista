<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" class="vd-svg" role="img" aria-labelledby="ea-title ea-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="ea-play" data-vd-play-label="Play: climb the hill" data-vd-steps="[[0, &quot;Enzymes lower the activation energy.&quot;], [1, &quot;Without an enzyme: a high energy hill to climb.&quot;], [4.5, &quot;With an enzyme: a much lower hill.&quot;], [8, &quot;The overall energy change is the same in both.&quot;]]" data-vd-dur="12">
<title id="ea-title">Enzymes and activation energy</title><desc id="ea-desc">Energy profile of a reaction without an enzyme, with a high activation energy, and with an enzyme, with a much lower activation energy; the overall energy change is the same.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
