<g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.0625;0.0750;0.9375;0.9500;1.0000" values="0;0;1;1;0;0" dur="16s" begin="em-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.0625;0.1375;0.2000;0.3125;0.3438;0.4625;0.5000;0.5500;0.6000;0.6500;0.6875;0.7625;0.8250;0.8750;1.0000" values="90 390;90 390;284.0 390;300 390;370 380;470 380;600 390;650 390;690 392;726 394;760 396;800 396;900 400;1000 410;1150 420;1150 420" dur="16s" begin="em-play.begin+0s" fill="freeze"/><circle r="9" fill="#f97316" stroke="#7c2d12" stroke-width="2"/></g></g>
<g><animate attributeName="opacity" keyTimes="0.0000;0.0625;0.0813;0.1875;0.2062;1.0000" values="0;0;1;1;0;0" dur="16s" begin="em-play.begin+0s" fill="freeze"/><path d="M 90 390 L 284 390" stroke="#7c3aed" stroke-width="3" stroke-dasharray="5 4"/><text x="190" y="375" text-anchor="middle" font-size="11" font-weight="800" fill="#6d28d9">mRNA</text></g>
<g class="part" data-part="tv" data-name="Transport vesicles" data-info="Bud off the rough ER and carry proteins to the Golgi apparatus." tabindex="0" role="button" aria-label="Transport vesicles"><g><animate attributeName="opacity" keyTimes="0.0000;0.3125;0.3312;0.4750;0.5000;1.0000" values="0;0;1;1;0;0" dur="16s" begin="em-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.3438;0.4625;1.0000" values="470 380;470 380;600 390;600 390" dur="16s" begin="em-play.begin+0s" fill="freeze"/><circle r="22" fill="#e0f2fe" stroke="#38bdf8" stroke-width="5"/></g></g><circle cx="560" cy="250" r="16" fill="#e0f2fe" stroke="#38bdf8" stroke-width="5"/><circle cx="590" cy="290" r="16" fill="#e0f2fe" stroke="#38bdf8" stroke-width="5"/><text x="560" y="336" text-anchor="middle" font-size="12" font-weight="800" fill="#0369a1">transport vesicles</text></g>
<g class="part" data-part="sv" data-name="Secretory vesicles" data-info="Carry proteins to the plasma membrane and release them by exocytosis, e.g. digestive enzymes, hormones such as insulin." tabindex="0" role="button" aria-label="Secretory vesicles"><g><animate attributeName="opacity" keyTimes="0.0000;0.6875;0.7063;0.8500;0.8750;1.0000" values="0;0;1;1;0;0" dur="16s" begin="em-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.6875;0.8250;1.0000" values="900 400;900 400;1120 415;1120 415" dur="16s" begin="em-play.begin+0s" fill="freeze"/><circle r="26" fill="#fae8ff" stroke="#d946ef" stroke-width="5"/></g></g><circle cx="960" cy="300" r="22" fill="#fae8ff" stroke="#d946ef" stroke-width="5"/><circle cx="1010" cy="520" r="22" fill="#fae8ff" stroke="#d946ef" stroke-width="5"/><text x="960" y="260" text-anchor="middle" font-size="12" font-weight="800" fill="#a21caf">secretory vesicles</text><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.8750;0.8875;1.0000;1.0000;1.0000" values="0;0;1;1;0;0" dur="16s" begin="em-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.8750;0.9500;1.0000" values="1170 420;1170 420;1215 380;1215 380" dur="16s" begin="em-play.begin+0s" fill="freeze"/><circle r="6" fill="#f97316"/></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.8750;0.8875;1.0000;1.0000;1.0000" values="0;0;1;1;0;0" dur="16s" begin="em-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.8812;0.9562;1.0000" values="1170 420;1170 420;1215 410;1215 410" dur="16s" begin="em-play.begin+0s" fill="freeze"/><circle r="6" fill="#f97316"/></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.8750;0.8875;1.0000;1.0000;1.0000" values="0;0;1;1;0;0" dur="16s" begin="em-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.8875;0.9625;1.0000" values="1170 420;1170 420;1215 440;1215 440" dur="16s" begin="em-play.begin+0s" fill="freeze"/><circle r="6" fill="#f97316"/></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.8750;0.8938;1.0000" values="0;0;1;1" dur="16s" begin="em-play.begin+0s" fill="freeze"/><rect x="915.0" y="670" width="230" height="24" rx="12" fill="#fff7ed" stroke="#1f2937" stroke-width="1"/><text x="1030" y="687" text-anchor="middle" font-size="12" font-weight="700">exocytosis: contents released</text></g></g>
<g class="part" data-part="lys" data-name="Lysosome" data-info="A vesicle of hydrolytic enzymes from the Golgi, for digesting worn-out organelles and engulfed material." tabindex="0" role="button" aria-label="Lysosome"><g><animate attributeName="opacity" keyTimes="0.0000;0.8750;0.8938;1.0000" values="0;0;1;1" dur="16s" begin="em-play.begin+0s" fill="freeze"/><circle cx="920" cy="590" r="30" fill="#fecaca" stroke="#b91c1c" stroke-width="5"/><circle cx="932.0" cy="590.0" r="4" fill="#b91c1c"/><circle cx="915.0062379614343" cy="600.9115691219082" r="4" fill="#b91c1c"/><circle cx="912.1562765496367" cy="580.9183700563049" r="4" fill="#b91c1c"/><text x="920" y="640" text-anchor="middle" font-size="12" font-weight="800" fill="#b91c1c">lysosome (hydrolases)</text></g></g>
</svg>