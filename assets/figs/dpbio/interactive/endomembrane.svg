<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 720" class="vd-svg" role="img" aria-labelledby="em-title em-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="em-play" data-vd-play-label="Play: a protein&#x27;s journey" data-vd-steps="[[0, &quot;The endomembrane system: how a cell makes and exports a protein.&quot;], [1, &quot;mRNA leaves the nucleus through a nuclear pore.&quot;], [3, &quot;Ribosomes on the rough ER make the protein, which enters the ER lumen.&quot;], [5.5, &quot;A transport vesicle buds off and carries the protein to the cis face of the Golgi.&quot;], [8, &quot;In the Golgi cisternae the protein is modified and packaged.&quot;], [11, &quot;A secretory vesicle leaves the trans face and fuses with the plasma membrane: exocytosis.&quot;], [14, &quot;Other Golgi vesicles become lysosomes.&quot;]]" data-vd-dur="16">
<title id="em-title">The endomembrane system</title><desc id="em-desc">The endomembrane system: mRNA leaves the nucleus, the protein is made on the rough ER, carried in a transport vesicle to the cis face of the Golgi apparatus, modified, and released from the trans face in a secretory vesicle by exocytosis; lysosomes also form.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1220" height="720" fill="#ffffff"/>
<g aria-hidden="true"><animate id="em-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<text class="head" x="30" y="34">The endomembrane system</text><text class="note" x="30" y="56">The orange dot follows one protein. Part of an animal cell, not to scale.</text>
<rect x="20" y="80" width="1180" height="620" rx="40" fill="#fefce8"/>
<g class="part" data-part="pm" data-name="Plasma membrane" data-info="Vesicle membrane joins it during exocytosis." tabindex="0" role="button" aria-label="Plasma membrane"><path d="M 1170 90 L 1170 690" stroke="#f97316" stroke-width="12"/><text x="1150" y="110" text-anchor="end" font-size="12" font-weight="800" fill="#c2410c">plasma membrane</text></g>
<g class="part" data-part="nuc" data-name="Nucleus" data-info="DNA is transcribed to mRNA, which leaves through a nuclear pore." tabindex="0" role="button" aria-label="Nucleus"><circle cx="90" cy="390" r="200" fill="#ede9fe" stroke="#6d28d9" stroke-width="5"/><circle cx="90" cy="390" r="188" fill="none" stroke="#6d28d9" stroke-width="3"/><circle cx="60" cy="380" r="50" fill="#c4b5fd"/><text x="60" y="386" text-anchor="middle" font-size="11" font-weight="800" fill="#5b21b6">nucleolus</text><rect x="234" y="260" width="10" height="10" fill="#fefce8"/><rect x="279" y="385" width="10" height="10" fill="#fefce8"/><rect x="234" y="510" width="10" height="10" fill="#fefce8"/><text x="80" y="560" text-anchor="middle" font-size="14" font-weight="800" fill="#5b21b6">nucleus</text></g>
<g class="part" data-part="rer" data-name="Rough endoplasmic reticulum" data-info="Ribosomes on its surface make proteins, which enter the ER lumen and fold. Continuous with the nuclear envelope." tabindex="0" role="button" aria-label="Rough endoplasmic reticulum"><path d="M 205 191 A 230 230 0 0 1 205 589" fill="none" stroke="#38bdf8" stroke-width="18" stroke-linecap="round"/><path d="M 205 191 A 230 230 0 0 1 205 589" fill="none" stroke="#e0f2fe" stroke-width="8" stroke-linecap="round"/><circle cx="225" cy="189" r="4" fill="#1e3a8a"/><circle cx="252" cy="210" r="4" fill="#1e3a8a"/><circle cx="275" cy="234" r="4" fill="#1e3a8a"/><circle cx="295" cy="262" r="4" fill="#1e3a8a"/><circle cx="311" cy="292" r="4" fill="#1e3a8a"/><circle cx="323" cy="323" r="4" fill="#1e3a8a"/><circle cx="330" cy="356" r="4" fill="#1e3a8a"/><circle cx="332" cy="390" r="4" fill="#1e3a8a"/><circle cx="330" cy="424" r="4" fill="#1e3a8a"/><circle cx="323" cy="457" r="4" fill="#1e3a8a"/><circle cx="311" cy="488" r="4" fill="#1e3a8a"/><circle cx="295" cy="518" r="4" fill="#1e3a8a"/><circle cx="275" cy="546" r="4" fill="#1e3a8a"/><circle cx="252" cy="570" r="4" fill="#1e3a8a"/><circle cx="225" cy="591" r="4" fill="#1e3a8a"/><path d="M 223 160 A 266 266 0 0 1 223 620" fill="none" stroke="#38bdf8" stroke-width="18" stroke-linecap="round"/><path d="M 223 160 A 266 266 0 0 1 223 620" fill="none" stroke="#e0f2fe" stroke-width="8" stroke-linecap="round"/><circle cx="245" cy="160" r="4" fill="#1e3a8a"/><circle cx="276" cy="183" r="4" fill="#1e3a8a"/><circle cx="303" cy="211" r="4" fill="#1e3a8a"/><circle cx="326" cy="243" r="4" fill="#1e3a8a"/><circle cx="344" cy="277" r="4" fill="#1e3a8a"/><circle cx="357" cy="313" r="4" fill="#1e3a8a"/><circle cx="365" cy="351" r="4" fill="#1e3a8a"/><circle cx="368" cy="390" r="4" fill="#1e3a8a"/><circle cx="365" cy="429" r="4" fill="#1e3a8a"/><circle cx="357" cy="467" r="4" fill="#1e3a8a"/><circle cx="344" cy="503" r="4" fill="#1e3a8a"/><circle cx="326" cy="537" r="4" fill="#1e3a8a"/><circle cx="303" cy="569" r="4" fill="#1e3a8a"/><circle cx="276" cy="597" r="4" fill="#1e3a8a"/><circle cx="245" cy="620" r="4" fill="#1e3a8a"/><path d="M 241 128 A 302 302 0 0 1 241 652" fill="none" stroke="#38bdf8" stroke-width="18" stroke-linecap="round"/><path d="M 241 128 A 302 302 0 0 1 241 652" fill="none" stroke="#e0f2fe" stroke-width="8" stroke-linecap="round"/><circle cx="266" cy="130" r="4" fill="#1e3a8a"/><circle cx="300" cy="157" r="4" fill="#1e3a8a"/><circle cx="331" cy="188" r="4" fill="#1e3a8a"/><circle cx="356" cy="224" r="4" fill="#1e3a8a"/><circle cx="377" cy="262" r="4" fill="#1e3a8a"/><circle cx="392" cy="303" r="4" fill="#1e3a8a"/><circle cx="401" cy="346" r="4" fill="#1e3a8a"/><circle cx="404" cy="390" r="4" fill="#1e3a8a"/><circle cx="401" cy="434" r="4" fill="#1e3a8a"/><circle cx="392" cy="477" r="4" fill="#1e3a8a"/><circle cx="377" cy="518" r="4" fill="#1e3a8a"/><circle cx="356" cy="556" r="4" fill="#1e3a8a"/><circle cx="331" cy="592" r="4" fill="#1e3a8a"/><circle cx="300" cy="623" r="4" fill="#1e3a8a"/><circle cx="266" cy="650" r="4" fill="#1e3a8a"/><path d="M 259 97 A 338 338 0 0 1 259 683" fill="none" stroke="#38bdf8" stroke-width="18" stroke-linecap="round"/><path d="M 259 97 A 338 338 0 0 1 259 683" fill="none" stroke="#e0f2fe" stroke-width="8" stroke-linecap="round"/><circle cx="286" cy="100" r="4" fill="#1e3a8a"/><circle cx="324" cy="130" r="4" fill="#1e3a8a"/><circle cx="358" cy="165" r="4" fill="#1e3a8a"/><circle cx="387" cy="205" r="4" fill="#1e3a8a"/><circle cx="410" cy="248" r="4" fill="#1e3a8a"/><circle cx="426" cy="294" r="4" fill="#1e3a8a"/><circle cx="437" cy="341" r="4" fill="#1e3a8a"/><circle cx="440" cy="390" r="4" fill="#1e3a8a"/><circle cx="437" cy="439" r="4" fill="#1e3a8a"/><circle cx="426" cy="486" r="4" fill="#1e3a8a"/><circle cx="410" cy="532" r="4" fill="#1e3a8a"/><circle cx="387" cy="575" r="4" fill="#1e3a8a"/><circle cx="358" cy="615" r="4" fill="#1e3a8a"/><circle cx="324" cy="650" r="4" fill="#1e3a8a"/><circle cx="286" cy="680" r="4" fill="#1e3a8a"/><text x="290" y="100" text-anchor="start" font-size="13" font-weight="800" fill="#0369a1">rough ER (ribosomes = dark dots)</text></g>
<g class="part" data-part="cis" data-name="Cis face of the Golgi" data-info="The receiving side, facing the ER: transport vesicles fuse here." tabindex="0" role="button" aria-label="Cis face of the Golgi"><path d="M 660 240 Q 620 390 660 540" fill="none" stroke="#a855f7" stroke-width="20" stroke-linecap="round"/><text x="650" y="218" text-anchor="middle" font-size="13" font-weight="800" fill="#7e22ce">cis face</text></g>
<g class="part" data-part="golgi" data-name="Golgi cisternae" data-info="Flattened membrane sacs where proteins are modified (e.g. carbohydrates added: glycoproteins), sorted and packaged." tabindex="0" role="button" aria-label="Golgi cisternae"><path d="M 696 246 Q 656 390 696 534" fill="none" stroke="#c084fc" stroke-width="20" stroke-linecap="round"/><path d="M 732 252 Q 692 390 732 528" fill="none" stroke="#c084fc" stroke-width="20" stroke-linecap="round"/><path d="M 768 258 Q 728 390 768 522" fill="none" stroke="#c084fc" stroke-width="20" stroke-linecap="round"/><text x="740" y="590" text-anchor="middle" font-size="14" font-weight="800" fill="#7e22ce">Golgi apparatus</text></g>
