<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" class="vd-svg" role="img" aria-labelledby="ca-title ca-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="ca-play" data-vd-play-label="Play: stick together" data-vd-steps="[[0, &quot;Holding cells together.&quot;], [1, &quot;Two cells move together...&quot;], [3, &quot;...and CAMs on their membranes bind each other.&quot;], [7, &quot;Other CAMs anchor cells to the extracellular matrix.&quot;]]" data-vd-dur="12">
<title id="ca-title">Cell-adhesion molecules</title><desc id="ca-desc">Two cells come together and cell-adhesion molecules in their plasma membranes bind each other; other adhesion molecules attach cells to the extracellular matrix below.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
