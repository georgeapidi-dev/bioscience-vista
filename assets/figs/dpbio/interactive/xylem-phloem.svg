egin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.4857;0.7000;1.0000" values="520 470;520 470;520 110;520 110" dur="14s" begin="xp-play.begin+0s" fill="freeze"/><rect x="-6" y="-5" width="12" height="10" fill="#f59e0b"/></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.5143;0.5286;0.7357;0.7500;1.0000" values="0;0;1;1;0;0" dur="14s" begin="xp-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.5143;0.7286;1.0000" values="520 110;520 110;520 470;520 470" dur="14s" begin="xp-play.begin+0s" fill="freeze"/><rect x="-6" y="-5" width="12" height="10" fill="#f59e0b"/></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.5429;0.5571;0.7643;0.7786;1.0000" values="0;0;1;1;0;0" dur="14s" begin="xp-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.5429;0.7571;1.0000" values="520 470;520 470;520 110;520 110" dur="14s" begin="xp-play.begin+0s" fill="freeze"/><rect x="-6" y="-5" width="12" height="10" fill="#f59e0b"/></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.5714;0.5857;0.7929;0.8071;1.0000" values="0;0;1;1;0;0" dur="14s" begin="xp-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.5714;0.7857;1.0000" values="520 110;520 110;520 470;520 470" dur="14s" begin="xp-play.begin+0s" fill="freeze"/><rect x="-6" y="-5" width="12" height="10" fill="#f59e0b"/></g></g><text x="540" y="520" text-anchor="middle" font-size="16" font-weight="800" fill="#15803d">PHLOEM</text><g><animate attributeName="opacity" keyTimes="0.0000;0.5000;0.5214;1.0000" values="0;0;1;1" dur="14s" begin="xp-play.begin+0s" fill="freeze"/><text x="620" y="160" text-anchor="start" font-size="12" font-weight="800" fill="#15803d">companion cell (mitochondria)</text><text x="620" y="200" text-anchor="start" fo