<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" class="vd-svg" role="img" aria-labelledby="xp-title xp-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="xp-play" data-vd-play-label="Play: transport" data-vd-steps="[[0, &quot;Two transport tissues in plants.&quot;], [1, &quot;Xylem: water and minerals, upwards, dead lignified tubes.&quot;], [6, &quot;Phloem: sucrose and amino acids, both directions, living cells.&quot;], [11, &quot;Arrangement in stem and root.&quot;]]" data-vd-dur="14">
<title id="xp-title">Xylem and phloem</title><desc id="xp-desc">A xylem vessel with lignified walls and no end walls carrying water upward, and a phloem sieve tube with sieve plates and a companion cell carrying sucrose in both directions; positions of vascular bundles in a stem and a root.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="560" fill="#ffffff"/>
