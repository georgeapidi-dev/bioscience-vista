LEM</text><g><animate attributeName="opacity" keyTimes="0.0000;0.1429;0.1643;1.0000" values="0;0;1;1" dur="14s" begin="xp-play.begin+0s" fill="freeze"/><text x="240" y="140" text-anchor="start" font-size="12" font-weight="800" fill="#1e3a8a">no end walls</text><text x="240" y="160" text-anchor="start" font-size="12" font-weight="800" fill="#92400e">lignin rings / spirals</text><text x="240" y="180" text-anchor="start" font-size="12" font-weight="800" fill="#1e3a8a">dead, hollow</text><text x="240" y="200" text-anchor="start" font-size="12" font-weight="800" fill="#1d4ed8">water + mineral ions ↑</text></g></g>
