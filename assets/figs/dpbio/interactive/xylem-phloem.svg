<g class="part" data-part="vb" data-name="Vascular bundles" data-info="In a dicot stem, bundles are arranged in a ring with phloem towards the outside and xylem towards the inside; in the root, xylem is at the centre." tabindex="0" role="button" aria-label="Vascular bundles"><g><animate attributeName="opacity" keyTimes="0.0000;0.7857;0.8071;1.0000" values="0;0;1;1" dur="14s" begin="xp-play.begin+0s" fill="freeze"/><circle cx="960" cy="200" r="80" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><g transform="rotate(0 960 200)"><path d="M 960 140 a 14 14 0 0 1 0 28" fill="#3b82f6"/><path d="M 960 128 a 18 10 0 0 1 0 12" fill="#f59e0b"/></g><g transform="rotate(60 960 200)"><path d="M 960 140 a 14 14 0 0 1 0 28" fill="#3b82f6"/><path d="M 960 128 a 18 10 0 0 1 0 12" fill="#f59e0b"/></g><g transform="rotate(120 960 200)"><path d="M 960 140 a 14 14 0 0 1 0 28" fill="#3b82f6"/><path d="M 960 128 a 18 10 0 0 1 0 12" fill="#f59e0b"/></g><g transform="rotate(180 960 200)"><path d="M 960 140 a 14 14 0 0 1 0 28" fill="#3b82f6"/><path d="M 960 128 a 18 10 0 0 1 0 12" fill="#f59e0b"/></g><g transform="rotate(240 960 200)"><path d="M 960 140 a 14 14 0 0 1 0 28" fill="#3b82f6"/><path d="M 960 128 a 18 10 0 0 1 0 12" fill="#f59e0b"/></g><g transform="rotate(300 960 200)"><path d="M 960 140 a 14 14 0 0 1 0 28" fill="#3b82f6"/><path d="M 960 128 a 18 10 0 0 1 0 12" fill="#f59e0b"/></g><text x="960" y="300" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">stem: ring of bundles</text><text x="960" y="318" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">xylem inside, phloem outside</text><circle cx="960" cy="420" r="60" fill="#fef9c3" stroke="#a16207" stroke-width="2"/><path d="M 960 395 L 975 420 L 960 445 L 945 420 Z" fill="#3b82f6"/><circle cx="976" cy="436" r="6" fill="#f59e0b"/><circle cx="944" cy="436" r="6" fill="#f59e0b"/><circle cx="944" cy="404" r="6" fill="#f59e0b"/><circle cx="976" cy="404" r="6" fill="#f59e0b"/><text x="960" y="500