<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 540" class="vd-svg" role="img" aria-labelledby="vb-title vb-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="vb-play" data-vd-play-label="Play: classify" data-vd-steps="[[0, &quot;Five classes of vertebrates.&quot;], [1, &quot;Each has distinctive visible features.&quot;], [9, &quot;Use the features, not habitat, to classify.&quot;]]" data-vd-dur="12">
<title id="vb-title">Classes of vertebrates</title><desc id="vb-desc">A table of the five vertebrate classes, mammals, birds, reptiles, amphibians and fish, with their identifying external features.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="540" fill="#ffffff"/>
<g aria-hidden="true"><animate id="vb-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<text class="head" x="30" y="34">The five classes of vertebrates</text><text class="note" x="30" y="56">All have a backbone (vertebral column).</text>
<g class="part" data-part="tab" data-name="Five classes" data-info="Vertebrates have a backbone. Classes are identified by external features: skin covering, how they breathe, and their eggs." tabindex="0" role="button" aria-label="Five classes"><g><animate attributeName="opacity" keyTimes="0.0000;0.0833;0.1083;1.0000" values="0;0;1;1" dur="12s" begin="vb-play.begin+0s" fill="freeze"/><rect x="40" y="90" width="1020" height="66" rx="14" fill="#fff" stroke="#b45309" stroke-width="2"/><rect x="40" y="90" width="200" height="66" rx="14" fill="#b45309"/><text x="140" y="130" text-anchor="middle" font-size="18" font-weight="800" fill="#fff">mammals</text><text x="270" y="130" text-anchor="start" font-size="15" font-weight="700" fill="#111827">fur or hair; external ears (pinnae); mammary glands</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.2000;0.2250;1.0000" values="0;0;1;1" dur="12s" begin="vb-play.begin+0s" fill="freeze"/><rect x="40" y="170" width="1020" height="66" rx="14" fill="#fff" stroke="#2563eb" stroke-width="2"/><rect x="40" y="170" width="200" height="66" rx="14" fill="#2563eb"/><text x="140" y="210" text-anchor="middle" font-size="18" font-weight="800" fill="#fff">birds</text><text x="270" y="210" text-anchor="start" font-size="15" font-weight="700" fill="#111827">feathers; beak; wings; hard-shelled eggs</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.3167;0.3417;1.0000" values="0;0;1;1" dur="12s" begin="vb-play.begin+0s" fill="freeze"/><rect x="40" y="250" width="1020" height="66" rx="14" fill="#fff" stroke="#15803d" stroke-width="2"/><rect x="40" y="250" width="200" height="66" rx="14" fill="#15803d"/><text x="140" y="290" text-anchor="middle" font-size="18" font-weight="800" fill="#fff">reptiles</text><text x="270" y="290" text-anchor="start" font-size="15" font-weight="700" fill="#111827">dry scales; leathery-shelled eggs laid on land</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.4333;0.4583;1.0000" values="0;0;1;1" dur="12s" begin="vb-play.begin+0s" fill="freeze"/><rect x="40" y="330" width="1020" height="66" rx="14" fill="#fff" stroke="#0d9488" stroke-width="2"/><rect x="40" y="330" width="200" height="66" rx="14" fill="#0d9488"/><text x="140" y="370" text-anchor="middle" font-size="18" font-weight="800" fill="#fff">amphibians</text><text x="270" y="370" text-anchor="start" font-size="15" font-weight="700" fill="#111827">moist, smooth skin; eggs laid in water</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.5500;0.5750;1.0000" values="0;0;1;1" dur="12s" begin="vb-play.begin+0s" fill="freeze"/><rect x="40" y="410" width="1020" height="66" rx="14" fill="#fff" stroke="#0369a1" stroke-width="2"/><rect x="40" y="410" width="200" height="66" rx="14" fill="#0369a1"/><text x="140" y="450" text-anchor="middle" font-size="18" font-weight="800" fill="#fff">fish</text><text x="270" y="450" text-anchor="start" font-size="15" font-weight="700" fill="#111827">wet scales; gills; fins</text></g></g>
<g class="part" data-part="tip" data-name="Using features" data-info="A whale has hair (a few bristles), mammary glands and lungs: a mammal, not a fish, despite its fins." tabindex="0" role="button" aria-label="Using features"><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.7500;0.7750;1.0000" values="0;0;1;1" dur="12s" begin="vb-play.begin+0s" fill="freeze"/><rect x="290.0" y="503" width="520" height="24" rx="12" fill="#fef3c7" stroke="#1f2937" stroke-width="1"/><text x="550" y="520" text-anchor="middle" font-size="12" font-weight="700">classify by features: a whale (lungs, mammary glands) is a mammal</text></g></g>
</svg>