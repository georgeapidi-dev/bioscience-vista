<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 540" class="vd-svg" role="img" aria-labelledby="vl-title vl-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="vl-play" data-vd-play-label="Play: absorb" data-vd-steps="[[0, &quot;A villus in the small intestine.&quot;], [1, &quot;Capillaries and a lacteal inside; microvilli outside.&quot;], [5, &quot;Glucose and amino acids to the blood; fats to the lacteal.&quot;], [10, &quot;Adaptations for fast absorption.&quot;]]" data-vd-dur="14">
<title id="vl-title">Villus</title><desc id="vl-desc">A villus with a one-cell-thick epithelium bearing microvilli, a network of blood capillaries and a central lacteal; glucose and amino acids move into the capillaries and fatty acids into the lacteal.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="540" fill="#ffffff"/>
<g aria-hidden="true"><animate id="vl-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<text class="head" x="30" y="34">A villus: absorbing digested food</text><text class="note" x="30" y="56">Small intestine (ileum).</text>
