<g class="part" data-part="abs" data-name="Absorption" data-info="Glucose and amino acids enter the blood capillaries (to the liver via the hepatic portal vein). Fatty acids and glycerol enter the lacteal (lymph)." tabindex="0" role="button" aria-label="Absorption"><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.3571;0.3714;0.4714;0.4857;1.0000" values="0;0;1;1;0;0" dur="14s" begin="vl-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.3571;0.4643;1.0000" values="150 220;150 220;265 240;265 240" dur="14s" begin="vl-play.begin+0s" fill="freeze"/><circle r="7" fill="#22c55e"/></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.3929;0.4071;0.5071;0.5214;1.0000" values="0;0;1;1;0;0" dur="14s" begin="vl-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.3929;0.5000;1.0000" values="150 260;150 260;265 280;265 280" dur="14s" begin="vl-play.begin+0s" fill="freeze"/><circle r="7" fill="#22c55e"/></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.4286;0.4429;0.5429;0.5571;1.0000" values="0;0;1;1;0;0" dur="14s" begin="vl-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.4286;0.5357;1.0000" values="150 300;150 300;265 320;265 320" dur="14s" begin="vl-play.begin+0s" fill="freeze"/><circle r="7" fill="#22c55e"/></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.4643;0.4786;0.5786;0.5929;1.0000" values="0;0;1;1;0;0" dur="14s" begin="vl-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.4643;0.5714;1.0000" values="150 340;150 340;265 360;265 360" dur="14s" begin="vl-play.begin+0s" fill="freeze"/><circle r="7" fill="#22c55e"/></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.4643;0.4786;0.5786;0.5929;1.0000" values="0;0;1;1;0;0" dur="14s" begin="vl-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.4643;0.5714;1.0000" values="150 260;150 260;300 280;300 280" dur="14s" begin="vl-play.begin+0s" fill="freeze"/><rect x="-7" y="-5" width="14" height="10" fill="#f59e0b"/></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.5000;0.5143;0.6143;0.6286;1.0000" values="0;0;1;1;0;0" dur="14s" begin="vl-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.5000;0.6071;1.0000" values="150 310;150 310;300 330;300 330" dur="14s" begin="vl-play.begin+0s" fill="freeze"/><rect x="-7" y="-5" width="14" height="10" fill="#f59e0b"/></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.5357;0.5500;0.6500;0.6643;1.0000" values="0;0;1;1;0;0" dur="14s" begin="vl-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.5357;0.6429;1.0000" values="150 360;150 360;300 380;300 380" dur="14s" begin="vl-play.begin+0s" fill="freeze"/><rect x="-7" y="-5" width="14" height="10" fill="#f59e0b"/></g></g><g><animate attributeName="opacity" keyTimes="0.0000;0.3571;0.3786;1.0000" values="0;0;1;1" dur="14s" begin="vl-play.begin+0s" fill="freeze"/><circle cx="482" cy="466" r="8" fill="#22c55e"/><text x="496" y="470" text-anchor="start" font-size="12" font-weight="800" fill="#15803d">glucose, amino acids → blood</text><rect x="475" y="486" width="14" height="10" fill="#f59e0b"/><text x="496" y="496" text-anchor="start" font-size="12" font-weight="800" fill="#a16207">fatty acids, glycerol → lacteal</text></g></g>
<g class="part" data-part="ad" data-name="Adaptations" data-info="Huge surface area (folds, villi, microvilli); epithelium one cell thick (short distance); good blood supply keeps the concentration gradient; many mitochondria for active transport." tabindex="0" role="button" aria-label="Adaptations"><g><animate attributeName="opacity" keyTimes="0.0000;0.7143;0.7357;1.0000" values="0;0;1;1" dur="14s" begin="vl-play.begin+0s" fill="freeze"/><rect x="720" y="100" width="350" height="300" rx="16" fill="#f0fdf4" stroke="#86efac"/><text x="895" y="128" text-anchor="middle" font-size="15" font-weight="800" fill="#15803d">adaptations</text><text x="740" y="168" text-anchor="start" font-size="13" font-weight="700" fill="#111827">large surface area: villi + microvilli</text><text x="740" y="212" text-anchor="start" font-size="13" font-weight="700" fill="#111827">thin wall: one cell thick</text><text x="740" y="256" text-anchor="start" font-size="13" font-weight="700" fill="#111827">rich blood supply: steep gradient</text><text x="740" y="300" text-anchor="start" font-size="13" font-weight="700" fill="#111827">lacteal for fats</text><text x="740" y="344" text-anchor="start" font-size="13" font-weight="700" fill="#111827">mitochondria for active transport</text></g></g>
</svg>