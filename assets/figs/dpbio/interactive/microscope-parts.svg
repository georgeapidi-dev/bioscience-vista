<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" class="vd-svg" role="img" aria-labelledby="mi-title mi-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="mi-play" data-vd-play-label="Play: the light path" data-vd-steps="[[0, &quot;The parts of a compound light microscope.&quot;], [1, &quot;Light from the lamp passes up through the condenser and the diaphragm.&quot;], [3, &quot;It passes through the specimen on the slide and into the objective lens.&quot;], [5, &quot;Up the body tube to the eyepiece and the eye. Two lenses magnify the image.&quot;], [7.5, &quot;Focus: turn the coarse knob, then the fine knob; the stage moves up and down.&quot;], [11, &quot;Total magnification = eyepiece \u00d7 objective, e.g. 10 \u00d7 40 = 400.&quot;]]" data-vd-dur="14">
<title id="mi-title">Parts of a light microscope</title><desc id="mi-desc">A compound light microscope with labelled eyepiece, body tube, nosepiece, objectives, stage and clips, condenser, iris diaphragm, lamp, coarse and fine focus knobs, arm and base, with the light path traced from lamp to eye.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1200" height="760" fill="#ffffff"/>
<g aria-hidden="true"><animate id="mi-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<text class="head" x="30" y="34">Parts of a light microscope</text><text class="note" x="30" y="56">Side view.</text>
<g class="part" data-part="arm" data-name="Arm and base" data-info="Carry the microscope by the arm, with a hand under the base." tabindex="0" role="button" aria-label="Arm and base"><path d="M 340 690 L 680 690 Q 700 690 700 670 L 700 640 Q 700 620 680 620 L 360 620 Q 340 620 340 640 Z" fill="#334155"/><path d="M 600 620 C 640 560 650 470 640 400 C 632 330 600 260 560 230 L 520 250 C 560 290 590 350 596 410 C 602 470 590 560 560 620 Z" fill="#475569" stroke="#1e293b" stroke-width="2"/></g>
<g class="part" data-part="tube" data-name="Body tube" data-info="Holds the eyepiece at the right distance from the objectives." tabindex="0" role="button" aria-label="Body tube"><path d="M 446 250 L 540 250 L 550 210 L 460 180 Z" fill="#64748b" stroke="#1e293b" stroke-width="2"/><path d="M 454 196 L 390 96 L 434 74 L 498 176 Z" fill="#94a3b8" stroke="#1e293b" stroke-width="2"/></g>
<g class="part" data-part="eye" data-name="Eyepiece (ocular lens)" data-info="The lens you look through; usually ×10." tabindex="0" role="button" aria-label="Eyepiece (ocular lens)"><path d="M 384 92 L 364 60 L 410 36 L 430 70 Z" fill="#1f2937"/><ellipse cx="387" cy="48" rx="26" ry="8" transform="rotate(-28 387 48)" fill="#93c5fd" stroke="#1e3a8a" stroke-width="2"/></g>
<g class="part" data-part="nose" data-name="Revolving nosepiece" data-info="Turns to change between objective lenses." tabindex="0" role="button" aria-label="Revolving nosepiece"><path d="M 430 250 L 530 250 L 516 276 L 444 276 Z" fill="#94a3b8" stroke="#1e293b" stroke-width="2"/></g>
<g class="part" data-part="obj" data-name="Objective lenses" data-info="Usually ×4, ×10 and ×40 (sometimes ×100 oil immersion). Start with the lowest power." tabindex="0" role="button" aria-label="Objective lenses"><rect x="468" y="276" width="24" height="70" rx="4" fill="#cbd5e1" stroke="#1e293b" stroke-width="2"/><rect x="468" y="318" width="24" height="5" fill="#dc2626"/><rect x="434" y="272" width="20" height="46" rx="4" fill="#cbd5e1" stroke="#1e293b" stroke-width="2" transform="rotate(20 444 272)"/><rect x="506" y="272" width="20" height="56" rx="4" fill="#cbd5e1" stroke="#1e293b" stroke-width="2" transform="rotate(-20 516 272)"/><text x="480" y="362" text-anchor="middle" font-size="10" font-weight="800" fill="#b91c1c">×40</text></g>
<g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.5357;0.6429;0.7143;0.7500;1.0000" values="0 0;0 0;0 -14;0 -14;0 -10;0 -10" dur="14s" begin="mi-play.begin+0s" fill="freeze"/><g class="part" data-part="stage" data-name="Stage and clips" data-info="Holds the slide over the hole (aperture) through which light passes." tabindex="0" role="button" aria-label="Stage and clips"><rect x="330" y="400" width="300" height="16" rx="3" fill="#1f2937"/><rect x="410" y="392" width="140" height="8" fill="#e0f2fe" stroke="#64748b"/><circle cx="480" cy="396" r="5" fill="#be185d"/><path d="M 370 392 L 420 392" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/><path d="M 540 392 L 590 392" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/><rect x="470" y="400" width="20" height="16" fill="#facc15" opacity=".5"/><rect x="630" y="404" width="60" height="22" fill="#334155"/></g><g class="part" data-part="cond" data-name="Condenser and iris diaphragm" data-info="The condenser focuses light onto the specimen; the diaphragm controls how much light (and the contrast)." tabindex="0" role="button" aria-label="Condenser and iris diaphragm"><rect x="454" y="426" width="52" height="30" rx="5" fill="#94a3b8" stroke="#1e293b" stroke-width="2"/><ellipse cx="480" cy="430" rx="20" ry="5" fill="#bae6fd" stroke="#0369a1"/><rect x="444" y="462" width="72" height="8" rx="3" fill="#475569"/><path d="M 444 466 L 410 470" stroke="#475569" stroke-width="4" stroke-linecap="round"/><rect x="446" y="456" width="68" height="20" fill="none"/></g></g>
<g class="part" data-part="lamp" data-name="Light source" data-info="A lamp (or mirror) under the stage." tabindex="0" role="button" aria-label="Light source"><rect x="450" y="600" width="60" height="22" rx="4" fill="#475569"/><circle cx="480" cy="596" r="16" fill="#fde047" stroke="#a16207" stroke-width="2"/></g>
<g class="part" data-part="coarse" data-name="Coarse focus knob" data-info="Large knob: moves the stage a long way. Use with low-power objectives only." tabindex="0" role="button" aria-label="Coarse focus knob"><g transform="translate(616 470)"><g><animateTransform attributeName="transform" type="rotate" keyTimes="0.0000;0.5357;0.6429;1.0000" values="0 0 0;0 0 0;240 0 0;240 0 0" dur="14s" begin="mi-play.begin+0s" fill="freeze"/><circle r="30" fill="#334155" stroke="#0f172a" stroke-width="3"/><line x1="0" y1="-30" x2="0" y2="-22" stroke="#cbd5e1" stroke-width="3" transform="rotate(0)"/><line x1="0" y1="-30" x2="0" y2="-22" stroke="#cbd5e1" stroke-width="3" transform="rotate(30)"/><line x1="0" y1="-30" x2="0" y2="-22" stroke="#cbd5e1" stroke-width="3" transform="rotate(60)"/><line x1="0" y1="-30" x2="0" y2="-22" stroke="#cbd5e1" stroke-width="3" transform="rotate(90)"/><line x1="0" y1="-30" x2="0" y2="-22" stroke="#cbd5e1" stroke-width="3" transform="rotate(120)"/><line x1="0" y1="-30" x2="0" y2="-22" stroke="#cbd5e1" stroke-width="3" transform="rotate(150)"/><line x1="0" y1="-30" x2="0" y2="-22" stroke="#cbd5e1" stroke-width="3" transform="rotate(180)"/><line x1="0" y1="-30" x2="0" y2="-22" stroke="#cbd5e1" stroke-width="3" transform="rotate(210)"/><line x1="0" y1="-30" x2="0" y2="-22" stroke="#cbd5e1" stroke-width="3" transform="rotate(240)"/><line x1="0" y1="-30" x2="0" y2="-22" stroke="#cbd5e1" stroke-width="3" transform="rotate(270)"/><line x1="0" y1="-30" x2="0" y2="-22" stroke="#cbd5e1" stroke-width="3" transform="rotate(300)"/><line x1="0" y1="-30" x2="0" y2="-22" stroke="#cbd5e1" stroke-width="3" transform="rotate(330)"/></g></g></g>
<g class="part" data-part="fine" data-name="Fine focus knob" data-info="Small knob: small movements to sharpen the image, especially at high power." tabindex="0" role="button" aria-label="Fine focus knob"><g transform="translate(616 470)"><g><animateTransform attributeName="transform" type="rotate" keyTimes="0.0000;0.6786;0.7500;1.0000" values="0 0 0;0 0 0;-120 0 0;-120 0 0" dur="14s" begin="mi-play.begin+0s" fill="freeze"/><circle r="14" fill="#64748b" stroke="#0f172a" stroke-width="2"/><line x1="0" y1="-14" x2="0" y2="-6" stroke="#fff" stroke-width="2"/></g></g></g>
<clipPath id="mi-c10380"><rect x="460" y="380" width="40" height="210"><animate attributeName="width" keyTimes="0.0000;0.0714;0.2143;1.0000" values="0;0;40;40" dur="14s" begin="mi-play.begin+0s" fill="freeze"/></rect></clipPath><g clip-path="url(#mi-c10380)"></g>
<g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.0714;0.0857;0.8929;0.9286;1.0000" values="0;0;1;1;0;0" dur="14s" begin="mi-play.begin+0s" fill="freeze"/><line x1="480" y1="580" x2="480" y2="580" stroke="#facc15" stroke-width="8" stroke-linecap="round" opacity=".85"><animate attributeName="y2" keyTimes="0.0000;0.0714;0.2143;1.0000" values="580;580;400;400" dur="14s" begin="mi-play.begin+0s" fill="freeze"/></line><line x1="480" y1="400" x2="480" y2="400" stroke="#facc15" stroke-width="7" stroke-linecap="round" opacity=".85"><animate attributeName="y2" keyTimes="0.0000;0.2143;0.3286;1.0000" values="400;400;214;214" dur="14s" begin="mi-play.begin+0s" fill="freeze"/></line><line x1="476" y1="200" x2="476" y2="200" stroke="#facc15" stroke-width="6" stroke-linecap="round" opacity=".85"><animate attributeName="x2" keyTimes="0.0000;0.3286;0.4286;1.0000" values="476;476;387;387" dur="14s" begin="mi-play.begin+0s" fill="freeze"/><animate attributeName="y2" keyTimes="0.0000;0.3286;0.4286;1.0000" values="200;200;48;48" dur="14s" begin="mi-play.begin+0s" fill="freeze"/></line></g>
<g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.4286;0.4500;0.9286;0.9500;1.0000" values="0;0;1;1;0;0" dur="14s" begin="mi-play.begin+0s" fill="freeze"/><g transform="translate(352 18)"><ellipse cx="0" cy="0" rx="26" ry="16" fill="#fff" stroke="#334155" stroke-width="2"/><circle cx="4" cy="0" r="8" fill="#1e3a8a"/></g></g>
<line x1="380" y1="60" x2="260" y2="60" stroke="#475569" stroke-width="1.5"/><circle cx="380" cy="60" r="3" fill="#475569"/><text x="252" y="64" text-anchor="end" font-size="13" font-weight="800" fill="#111827">eyepiece (×10)</text><line x1="430" y1="140" x2="260" y2="140" stroke="#475569" stroke-width="1.5"/><circle cx="430" cy="140" r="3" fill="#475569"/><text x="252" y="144" text-anchor="end" font-size="13" font-weight="800" fill="#111827">body tube</text><line x1="440" y1="262" x2="260" y2="250" stroke="#475569" stroke-width="1.5"/><circle cx="440" cy="262" r="3" fill="#475569"/><text x="252" y="254" text-anchor="end" font-size="13" font-weight="800" fill="#111827">revolving nosepiece</text><line x1="468" y1="330" x2="260" y2="320" stroke="#475569" stroke-width="1.5"/><circle cx="468" cy="330" r="3" fill="#475569"/><text x="252" y="324" text-anchor="end" font-size="13" font-weight="800" fill="#111827">objective lenses</text><line x1="370" y1="392" x2="260" y2="384" stroke="#475569" stroke-width="1.5"/><circle cx="370" cy="392" r="3" fill="#475569"/><text x="252" y="388" text-anchor="end" font-size="13" font-weight="800" fill="#111827">stage clips</text><line x1="330" y1="408" x2="260" y2="420" stroke="#475569" stroke-width="1.5"/><circle cx="330" cy="408" r="3" fill="#475569"/><text x="252" y="424" text-anchor="end" font-size="13" font-weight="800" fill="#111827">stage</text><line x1="454" y1="440" x2="260" y2="460" stroke="#475569" stroke-width="1.5"/><circle cx="454" cy="440" r="3" fill="#475569"/><text x="252" y="464" text-anchor="end" font-size="13" font-weight="800" fill="#111827">condenser</text><line x1="410" y1="470" x2="260" y2="500" stroke="#475569" stroke-width="1.5"/><circle cx="410" cy="470" r="3" fill="#475569"/><text x="252" y="504" text-anchor="end" font-size="13" font-weight="800" fill="#111827">iris diaphragm</text><line x1="464" y1="596" x2="260" y2="590" stroke="#475569" stroke-width="1.5"/><circle cx="464" cy="596" r="3" fill="#475569"/><text x="252" y="594" text-anchor="end" font-size="13" font-weight="800" fill="#111827">light source (lamp)</text><line x1="380" y1="670" x2="260" y2="680" stroke="#475569" stroke-width="1.5"/><circle cx="380" cy="670" r="3" fill="#475569"/><text x="252" y="684" text-anchor="end" font-size="13" font-weight="800" fill="#111827">base</text><line x1="490" y1="396" x2="760" y2="300" stroke="#475569" stroke-width="1.5"/><circle cx="490" cy="396" r="3" fill="#475569"/><text x="768" y="304" text-anchor="start" font-size="13" font-weight="800" fill="#111827">slide and specimen</text><line x1="580" y1="300" x2="760" y2="250" stroke="#475569" stroke-width="1.5"/><circle cx="580" cy="300" r="3" fill="#475569"/><text x="768" y="254" text-anchor="start" font-size="13" font-weight="800" fill="#111827">arm</text><line x1="646" y1="470" x2="760" y2="470" stroke="#475569" stroke-width="1.5"/><circle cx="646" cy="470" r="3" fill="#475569"/><text x="768" y="474" text-anchor="start" font-size="13" font-weight="800" fill="#111827">coarse focus knob</text><line x1="624" y1="476" x2="760" y2="520" stroke="#475569" stroke-width="1.5"/><circle cx="624" cy="476" r="3" fill="#475569"/><text x="768" y="524" text-anchor="start" font-size="13" font-weight="800" fill="#111827">fine focus knob</text>
<g class="part" data-part="mag" data-name="Magnification" data-info="Total magnification = eyepiece magnification × objective magnification, e.g. ×10 × ×40 = ×400." tabindex="0" role="button" aria-label="Magnification"><g><animate attributeName="opacity" keyTimes="0.0000;0.7857;0.8071;1.0000" values="0;0;1;1" dur="14s" begin="mi-play.begin+0s" fill="freeze"/><rect x="760" y="580" width="420" height="150" rx="16" fill="#eff6ff" stroke="#93c5fd"/><text x="970" y="610" text-anchor="middle" font-size="15" font-weight="800" fill="#1e3a8a">Total magnification</text><text x="970" y="646" text-anchor="middle" font-size="14" font-weight="700" fill="#111827">eyepiece × objective</text><text x="970" y="680" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">×10 × ×4 = ×40   ×10 × ×10 = ×100</text><text x="970" y="708" text-anchor="middle" font-size="15" font-weight="800" fill="#b91c1c">×10 × ×40 = ×400</text></g></g>
</svg>