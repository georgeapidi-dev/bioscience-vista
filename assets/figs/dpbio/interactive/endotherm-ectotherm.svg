<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" class="vd-svg" role="img" aria-labelledby="ee-title ee-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="ee-play" data-vd-play-label="Play: warm the surroundings" data-vd-steps="[[0, &quot;Metabolic rate and environmental temperature (illustrative data).&quot;], [1, &quot;Mouse (endotherm): high rate in the cold, falling as it gets warmer...&quot;], [4.5, &quot;...lowest around 30 \u00b0C, then rising a little.&quot;], [7, &quot;Lizard (ectotherm): rate rises as the environment warms.&quot;], [10, &quot;They cross: in hot conditions the lizard&#x27;s rate can match the mouse&#x27;s.&quot;]]" data-vd-dur="12">
<title id="ee-title">Endotherm and ectotherm metabolic rate</title><desc id="ee-desc">Metabolic rate against environmental temperature: a mouse (endotherm) has a high rate in the cold falling to a minimum near 30 °C; a lizard (ectotherm) of similar mass has a rate that rises with temperature.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="520" fill="#ffffff"/>
<g aria-hidden="true"><animate id="ee-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<text class="head" x="30" y="34">Metabolic rate: endotherm versus ectotherm</text><text class="note" x="30" y="56">Illustrative data, animals of similar mass.</text>
<g class="part" data-part="ax" data-name="Axes" data-info="Metabolic rate (illustrative units) of animals of similar mass against environmental temperature." tabindex="0" role="button" aria-label="Axes"><line x1="110" y1="450" x2="750" y2="450" stroke="#111827" stroke-width="2"/><line x1="110" y1="450" x2="110" y2="90" stroke="#111827" stroke-width="2"/><text x="430.0" y="484" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">environmental temperature / °C</text><text x="66" y="270.0" font-size="13" font-weight="700" text-anchor="middle" transform="rotate(-90 66 270.0)">metabolic rate (arbitrary units)</text><text x="110.0" y="468" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">0</text><text x="190.0" y="468" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">5</text><text x="270.0" y="468" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">10</text><text x="350.0" y="468" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">15</text><text x="430.0" y="468" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">20</text><text x="510.0" y="468" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">25</text><text x="590.0" y="468" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">30</text><text x="670.0" y="468" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">35</text><text x="750.0" y="468" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">40</text><text x="102" y="454.0" text-anchor="end" font-size="11" font-weight="700" fill="#475569">0</text><text x="102" y="397.75" text-anchor="end" font-size="11" font-weight="700" fill="#475569">5</text><text x="102" y="341.5" text-anchor="end" font-size="11" font-weight="700" fill="#475569">10</text><text x="102" y="285.25" text-anchor="end" font-size="11" font-weight="700" fill="#475569">15</text><text x="102" y="229.0" text-anchor="end" font-size="