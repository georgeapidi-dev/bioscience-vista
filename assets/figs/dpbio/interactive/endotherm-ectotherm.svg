<g class="part" data-part="tnz" data-name="Thermoneutral zone" data-info="Around 30 °C the mouse needs little extra heat, so its metabolic rate is lowest." tabindex="0" role="button" aria-label="Thermoneutral zone"><g><animate attributeName="opacity" keyTimes="0.0000;0.3750;0.4000;1.0000" values="0;0;1;1" dur="12s" begin="ee-play.begin+0s" fill="freeze"/><rect x="558.0" y="90" width="80.0" height="360" fill="#fde68a" opacity=".35"/><text x="598.0" y="106" text-anchor="middle" font-size="11" font-weight="800" fill="#92400e">thermoneutral</text></g></g>
<rect x="790" y="120" width="290" height="300" rx="14" fill="#f8fafc" stroke="#cbd5e1"/><text x="935" y="146" text-anchor="middle" font-size="15" font-weight="800" fill="#111827">Why?</text><text x="806" y="176" text-anchor="start" font-size="12" font-weight="800" fill="#b91c1c">Mouse — endotherm</text><text x="806" y="200" text-anchor="start" font-size="12" font-weight="600" fill="#111827">constant body temperature</text><text x="806" y="224" text-anchor="start" font-size="12" font-weight="600" fill="#111827">colder → more heat lost</text><text x="806" y="248" text-anchor="start" font-size="12" font-weight="600" fill="#111827">→ respires faster to replace it</text><text x="806" y="272" text-anchor="start" font-size="12" font-weight="400" fill="#000"></text><text x="806" y="296" text-anchor="start" font-size="12" font-weight="800" fill="#1d4ed8">Lizard — ectotherm</text><text x="806" y="320" text-anchor="start" font-size="12" font-weight="600" fill="#111827">body temperature = surroundings</text><text x="806" y="344" text-anchor="start" font-size="12" font-weight="600" fill="#111827">warmer → enzymes faster</text><text x="806" y="368" text-anchor="start" font-size="12" font-weight="600" fill="#111827">→ higher metabolic rate</text>
</svg>