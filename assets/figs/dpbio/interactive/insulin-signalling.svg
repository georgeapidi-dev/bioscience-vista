<g class="part" data-part="rec" data-name="Insulin receptor" data-info="A protein in the plasma membrane of target cells. Insulin cannot enter the cell; binding changes the receptor’s shape on the inside (it is a tyrosine kinase)." tabindex="0" role="button" aria-label="Insulin receptor"><path d="M 230 300 L 230 220 L 210 190 M 230 220 L 250 190 M 270 300 L 270 220 L 250 190 M 270 220 L 290 190" stroke="#7c3aed" stroke-width="12" fill="none" stroke-linecap="round"/><rect x="214" y="296" width="72" height="30" rx="8" fill="#c4b5fd" stroke="#5b21b6"/></g>
<g class="part" data-part="ins" data-name="Insulin" data-info="A peptide hormone made by beta cells in the islets of Langerhans in the pancreas when blood glucose is high." tabindex="0" role="button" aria-label="Insulin"><g transform="translate(400 120)"><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.0714;0.1857;1.0000" values="400 120;400 120;250 180;250 180" dur="14s" begin="in-play.begin+0s" fill="freeze"/><circle r="16" fill="#22c55e" stroke="#14532d" stroke-width="2"/><text y="4" text-anchor="middle" font-size="10" font-weight="800">insulin</text></g></g>
<g class="part" data-part="casc" data-name="Signalling cascade" data-info="A chain of reactions inside the cell that amplifies the signal." tabindex="0" role="button" aria-label="Signalling cascade"><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.2143;0.2357;1.0000" values="0;0;1;1" dur="14s" begin="in-play.begin+0s" fill="freeze"/><rect x="214" y="296" width="72" height="30" rx="8" fill="#a855f7"/><text x="250" y="316" text-anchor="middle" font-size="11" font-weight="800" fill="#fff">active</text><path d="M 290 330 C 360 380 420 380 480 380" fill="none" stroke="#7c3aed" stroke-width="4" stroke-dasharray="6 5" marker-end="url(#in-7c3aed)"/><circle cx="320" cy="360" r="12" fill="#ddd6fe" stroke="#7c3aed" stroke-width="2"/><circle cx="380" cy="384" r="12" fill="#ddd6fe" stroke="#7c3aed" stroke-width="2"/><circle cx="440" cy="384" r="12" fill="#ddd6fe" stroke="#7c3aed" stroke-width="2"/><text x="380" y="420" text-anchor="middle" font-size="13" font-weight="700" fill="#6d28d9">signalling cascade</text></g></g>
