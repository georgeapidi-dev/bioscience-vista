<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 600" class="vd-svg" role="img" aria-labelledby="in-title in-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="in-play" data-vd-play-label="Play: insulin signalling" data-vd-steps="[[0, &quot;A muscle or fat cell. Blood glucose is high after a meal.&quot;], [1, &quot;Insulin from the pancreas binds to insulin receptors on the cell\u2019s plasma membrane.&quot;], [3, &quot;Binding activates the receptor inside the cell and starts a signalling cascade.&quot;], [5.5, &quot;Vesicles containing GLUT4 transporters move to the membrane and fuse with it.&quot;], [8.5, &quot;Glucose enters the cell through GLUT4 by facilitated diffusion: blood glucose falls. The cell can store it as glycogen.&quot;]]" data-vd-dur="14">
<title id="in-title">Insulin: cell signalling</title><desc id="in-desc">Insulin binds to its receptor on a target cell, a signalling cascade makes GLUT4 vesicles fuse with the membrane, and glucose enters the cell by facilitated diffusion.</desc>
