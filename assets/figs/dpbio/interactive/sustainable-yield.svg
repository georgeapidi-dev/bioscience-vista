<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 540" class="vd-svg" role="img" aria-labelledby="sy-title sy-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="sy-play" data-vd-play-label="Play: go fishing" data-vd-steps="[[0, &quot;Calculating a sustainable yield.&quot;], [1, &quot;50 000 fish: 8 000 recruits in, 3 000 natural deaths out.&quot;], [5, &quot;Net increase = 5 000 per year.&quot;], [8.5, &quot;Harvest \u2264 5 000 a year keeps the population steady; more, and it declines.&quot;]]" data-vd-dur="14">
<title id="sy-title">Sustainable yield</title><desc id="sy-desc">A fish population of 50 000 gains 8 000 new adults and loses 3 000 to natural deaths each year, a net increase of 5 000; harvesting up to 5 000 a year keeps it stable, while larger catches make it decline.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="540" fill="#ffffff"/>
<g aria-hidden="true"><animate id="sy-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<defs><marker id="sy-16a34a" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="6.3" refY="7.0" orient="auto"><path d="M0,0 L14,7.0 L0,14 z" fill="#16a34a"/></marker><marker id="sy-dc2626" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="6.3" refY="7.0" orient="auto"><path d="M0,0 L14,7.0 L0,14 z" fill="#dc2626"/></marker><marker id="sy-475569" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="6.3" refY="7.0" orient="auto"><path d="M0,0 L14,7.0 L0,14 z" fill="#475569"/></marker></defs>
<text class="head" x="30" y="34">Calculate: a sustainable fish harvest</text><text class="note" x="30" y="56">Data from the lesson.</text>
<g class="part" data-part="pop" data-name="The population" data-info="50 000 fish; about 8 000 new adults a year from reproduction; about 3 000 natural deaths a year." tabindex="0" role="button" aria-label="The population"><ellipse cx="300" cy="260" rx="160" ry="110" fill="#bae6fd" stroke="#0369a1" stroke-width="3"/><text x="300" y="255" text-anchor="middle" font-size="20" font-weight="800" fill="#0c4a6e">50 000 fish</text><g><animate attributeName="opacity" keyTimes="0.0000;0.0714;0.0929;1.0000" values="0;0;1;1" dur="14s" begin="sy-play.begin+0s" fill="freeze"/><path d="M 60 170 L 160 210" stroke="#16a34a" stroke-width="6" marker-end="url(#sy-16a34a)"/><text x="80" y="150" text-anchor="middle" font-size="13" font-weight="800" fill="#15803d">+8 000 new adults</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.1429;0.1643;1.0000" values="0;0;1;1" dur="14s" begin="sy-play.begin+0s" fill="freeze"/><path d="M 440 330 L 540 380" stroke="#dc2626" stroke-width="6" marker-end="url(#sy-dc2626)"/><text x="560" y="400" text-anchor="start" font-size="13" font-weight="800" fill="#b91c1c">−3 000 natural deaths</text></g></g>
<g class="part" data-part="calc" data-name="Net increase" data-info="8 000 − 3 000 = 5 000 fish per year." tabindex="0" role="button" aria-label="Net increase"><g><animate attributeName="opacity" keyTimes="0.0000;0.3571;0.3786;1.0000" values="0;0;1;1" dur="14s" begin="sy-play.begin+0s" fill="freeze"/><rect x="620.0" y="110.0" width="360" height="60" rx="12" fill="#f8fafc" stroke="#111827" stroke-width="2"/><text x="800" y="144.66666666666666" text-anchor="middle" font-size="14" font-weight="800" fill="#111827">net increase = 8 000 − 3 000 = 5 000 / year</text></g></g>
<g class="part" data-part="yield" data-name="Sustainable harvest" data-info="Catching no more than about 5 000 a year keeps the population stable. Catching more makes it shrink." tabindex="0" role="button" aria-label="Sustainable harvest"><line x1="640" y1="470" x2="970" y2="470" stroke="#111827" stroke-width="2"/><line x1="640" y1="470" x2="640" y2="270" stroke="#111827" stroke-width="2"/><text x="805.0" y="492" text-anchor="middle" font-size="11" font-weight="800" fill="#111827">years</text><text x="646" y="262" text-anchor="start" font-size="11" font-weight="800" fill="#111827">population</text><clipPath id="syc0-c85270640"><rect x="640" y="270" width="330" height="200"><animate attributeName="width" keyTimes="0.0000;0.6071;0.7500;1.0000" values="0;0;330;330" dur="14s" begin="sy-play.begin+0s" fill="freeze"/></rect></clipPath><g clip-path="url(#syc0-c85270640)"><polyline points="640.0,303.3 673.0,303.3 706.0,303.3 739.0,303.3 772.0,303.3 805.0,303.3 838.0,303.3 871.0,303.3 904.0,303.3 937.0,303.3 970.0,303.3" fill="none" stroke="#16a34a" stroke-width="3.5"/></g><g><animate attributeName="opacity" keyTimes="0.0000;0.7500;0.7714;1.0000" values="0;0;1;1" dur="14s" begin="sy-play.begin+0s" fill="freeze"/><text x="966" y="295.3333333333333" text-anchor="end" font-size="12" font-weight="800" fill="#16a34a">catch 5,000/yr</text></g><clipPath id="syc1-c100270640"><rect x="640" y="270" width="330" height="200"><animate attributeName="width" keyTimes="0.0000;0.7143;0.8571;1.0000" values="0;0;330;330" dur="14s" begin="sy-play.begin+0s" fill="freeze"/></rect></clipPath><g clip-path="url(#syc1-c100270640)"><polyline points="640.0,303.3 673.0,316.7 706.0,330.0 739.0,343.3 772.0,356.7 805.0,370.0 838.0,383.3 871.0,396.7 904.0,410.0 937.0,423.3 970.0,436.7" fill="none" stroke="#dc2626" stroke-width="3.5"/></g><g><animate attributeName="opacity" keyTimes="0.0000;0.8571;0.8786;1.0000" values="0;0;1;1" dur="14s" begin="sy-play.begin+0s" fill="freeze"/><text x="966" y="428.6666666666667" text-anchor="end" font-size="12" font-weight="800" fill="#dc2626">catch 9,000/yr</text></g></g>
</svg>