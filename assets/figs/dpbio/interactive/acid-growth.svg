="8" font-weight="800" fill="#7f1d1d">H⁺</text></g></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.2357;0.2500;1.0000" values="0;0;1;1" dur="14s" begin="ag-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.2357;0.3429;1.0000" values="381 350;381 350;391 430;391 430" dur="14s" begin="ag-play.begin+0s" fill="freeze"/><g><circle r="8" fill="#fca5a5" stroke="#b91c1c"/><text x="0" y="3" text-anchor="middle" font-size="8" font-weight="800" fill="#7f1d1d">H⁺</text></g></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.2571;0.2714;1.0000" values="0;0;1;1" dur="14s" begin="ag-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.2571;0.3643;1.0000" values="451 350;451 350;461 430;461 430" dur="14s" begin="ag-play.begin+0s" fill="freeze"/><g><circle r="8" fill="#fca5a5" stroke="#b91c1c"/><text x="0" y="3" text-anchor="middle" font-size="8" font-weight="800" fill="#7f1d1d">H⁺</text></g></g></g><text x="130" y="120" text-anchor="middle" font-size="13" font-weight="800" fill="#a16207">auxin</text><circle cx="130" cy="140" r="9" fill="#fbbf24"/></g>
<g class="part" data-part="exp" data-name="Expansins" data-info="The acidified wall activates expansins, which loosen cross-links between cellulose microfibrils." tabindex="0" role="button" aria-label="Expansins"><rect x="640" y="120" width="420" height="240" rx="16" fill="#f8fafc" stroke="#cbd5e1"/><text x="850" y="146" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">inside the cell wall</text><line x1="670" y1="180" x2="1030" y2="180" stroke="#16a34a" stroke-width="6"/><line x1="670" y1="224" x2="1030" y2="224" stroke="#16a34a" stroke-width="6"/><line x1="670" y1="268" x2="1030" y2="268" stroke="#16a34a" stroke-width="6"/><line x1="670" y1="312" x2="1030" y2="312" stroke="#16a34a" stroke-width="6"/><line x1="720" y1="180" x2="720" y2="224" stroke="#a16207" stroke-width="4"><animate attributeName="opacity" keyTimes="0.0000;0.3929;0.4286;1.0000" values="1;1;0;0" dur="14s" begin="ag-play.begin+0s" fill="freeze"/></line><line x1="720" y1="224" x2="720" y2="268" stroke="#a16207" stroke-width="4"><animate attributeName="opacity" keyTimes="0.0000;0.3929;0.4286;1.0000" values="1;1;0;0" dur="14s" begin="ag-play.begin+0s" fill="freeze"/></line><line x1="720" y1="268" x2="720" y2="312" stroke="#a16207" stroke-width="4"><animate attributeName="opacity" keyTimes="0.0000;0.3929;0.4286;1.0000" values="1;1;0;0" dur="14s" begin="ag-play.begin+0s" fill="freeze"/></line><line x1="800" y1="180" x2="800" y2="224" stroke="#a16207" stroke-width="4"><animate attributeName="opacity" keyTimes="0.0000;0.4143;0.4500;1.0000" values="1;1;0;0" dur="14s" begin="ag-play.begin+0s" fill="freeze"/></line><line x1="800" y1="224" x2="800" y2="268" stroke="#a16207" stroke-width="4"><animate attributeName="opacity" keyTimes="0.0000;0.4143;0.4500;1.0000" values="1;1;0;0" dur="14s" begin="ag-play.begin+0s" fill="freeze"/></line><line x1="800" y1="268" x2="800" y2="312" stroke="#a16207" stroke-width="4"><animate attributeName="opacity" keyTimes="0.0000;0.4143;0.4500;1.0000" values="1;1;0;0" dur="14s" begin="ag-play.begin+0s" fill="freeze"/></line><line x1="880" y1="180" x2="880" y2="224" stroke="#a16207" stroke-width="4"><animate attributeName="opacity" keyTimes="0.0000;0.4357;0.4714;1.0000" values="1;1;0;0" dur="14s" begin="ag-play.begin+0s" fill="freeze"/></line><line x1="880" y1="224" x2="880" y2="268" stroke="#a16207" stroke-width="4"><animate attributeName="opacity" keyTimes="0.0000;0.4357;0.4714;1.0000" values="1;1;0;0" dur="14s" begin="ag-play.begin+0s" fill="freeze"/></line><line x1="880" y1="268" x2="880" y2="312" stroke="#a16207" stroke-width="4"><animate attributeName="opacity" keyTimes="0.0000;0.4357;0.4714;1.0000" values="1;1;0;0" dur="14s" begin="ag-play.begin+0s" fill="freeze"/></line><line x1="960" y1="180" x2="960" y2="224" stroke="#a16207" stroke-width="4"><animate attributeName="opacity" keyTimes="0.0000;0.4571;0.4929;1.0000" values="1;1;0;0" dur="14s" begin="ag-play.begin+0s" fill="freeze"/></line><line x1="960" y1="224" x2="960" y2="268" stroke="#a16207" stroke-width="4"><animate attributeName="opacity" keyTimes="0.0000;0.4571;0.4929;1.0000" values="1;1;0;0" dur="14s" begin="ag-play.begin+0s" fill="freeze"/></line><line x1="960" y1="268" x2="960" y2="312" stroke="#a16207" stroke-width="4"><animate attributeName="opacity" keyTimes="0.0000;0.4571;0.4929;1.0000" values="1;1;0;0" dur="14s" begin="ag-play.begin+0s" fill="freeze"/></line><g><animate attributeName="opacity" keyTimes="0.0000;0.3571;0.3786;1.0000" values="0;0;1;1" dur="14s" begin="ag-play.begin+0s" fill="freeze"/><text x="850" y="340" text-anchor="middle" font-size="12" font-weight="800" fill="#a16207">low pH → expansins loosen cross-links</text></g></g>
<g class="part" data-part="elong" data-name="Elongation" data-info="Water enters by osmosis and turgor stretches the loosened wall: the cell elongates. More auxin on one side → more elongation there → curvature." tabindex="0" role="button" aria-label="Elongation"><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.6071;0.6214;0.7143;0.7286;1.0000" values="0;0;1;1;0;0" dur="14s" begin="ag-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.6071;0.7000;1.0000" values="560 130;560 130;420 230;420 230" dur="14s" begin="ag-play.begin+0s" fill="freeze"/><g><circle r="7" fill="#38bdf8"/></g></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.6286;0.6429;0.7357;0.7500;1.0000" values="0;0;1;1;0;0" dur="14s" begin="ag-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.6286;0.7214;1.0000" values="580 130;580 130;450 230;450 230" dur="14s" begin="ag-play.begin+0s" fill="freeze"/><g><circle r="7" fill="#38bdf8"/></g></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.6500;0.6643;0.7571;0.7714;1.0000" values="0;0;1;1;0;0" dur="14s" begin="ag-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.6500;0.7429;1.0000" values="600 130;600 130;480 230;480 230" dur="14s" begin="ag-play.begin+0s" fill="freeze"/><g><circle r="7" fill="#38bdf8"/></g></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.6714;0.6857;0.7786;0.7929;1.0000" values="0;0;1;1;0;0" dur="14s" begin="ag-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.6714;0.7643;1.0000" values="620 130;620 130;510 230;510 230" dur="14s" begin="ag-play.begin+0s" fill="freeze"/><g><circle r="7" fill="#38bdf8"/></g></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.6429;0.6643;1.0000" values="0;0;1;1" dur="14s" begin="ag-play.begin+0s" fill="freeze"/><rect x="650.0" y="408" width="400" height="24" rx="12" fill="#dbeafe" stroke="#1f2937" stroke-width="1"/><text x="850" y="425" text-anchor="middle" font-size="12" font-weight="700">water in by osmosis → turgor → cell elongates</text></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.7857;0.8071;1.0000" values="0;0;1;1" dur="14s" begin="ag-play.begin+0s" fill="freeze"/><rect x="620.0" y="458" width="460" height="24" rx="12" fill="#fef3c7" stroke="#1f2937" stroke-width="1"/><text x="850" y="475" text-anchor="middle" font-size="12" font-weight="700">more auxin on one side → that side grows more → curvature</text></g></g>
