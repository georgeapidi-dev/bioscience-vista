<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" class="vd-svg" role="img" aria-labelledby="ag-title ag-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="ag-play" data-vd-play-label="Play: grow" data-vd-steps="[[0, &quot;The acid growth hypothesis.&quot;], [1, &quot;Auxin switches on proton pumps: H\u207a is pumped into the cell wall.&quot;], [5, &quot;Low pH activates expansins: cellulose cross-links loosen.&quot;], [8.5, &quot;Water enters by osmosis; turgor stretches the wall: the cell gets longer.&quot;]]" data-vd-dur="14">
<title id="ag-title">Auxin and acid growth</title><desc id="ag-desc">Auxin stimulates proton pumps that secrete hydrogen ions into the cell wall; the acidic wall activates expansins that loosen cellulose cross-links; water enters by osmosis and turgor pressure elongates the cell.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
