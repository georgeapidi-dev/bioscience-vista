<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" class="vd-svg" role="img" aria-labelledby="sc-title sc-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="sc-play" data-vd-play-label="Play: from stem cell to specialised cell" data-vd-steps="[[0, &quot;Stem cells are unspecialised cells that can divide and differentiate into specialised cells.&quot;], [1, &quot;The zygote divides by mitosis.&quot;], [3.5, &quot;By about day 5 a blastocyst forms. Its inner cell mass contains embryonic stem cells.&quot;], [6, &quot;Embryonic stem cells can differentiate into any type of body cell: nerve, muscle, blood, gut lining and more.&quot;], [10, &quot;Adult stem cells, for example in bone marrow, make a limited range of cells such as blood cells.&quot;], [13, &quot;Plants keep stem cells in meristems all their lives.&quot;]]" data-vd-dur="16">
<title id="sc-title">Stem cells and differentiation</title><desc id="sc-desc">A zygote divides to a blastocyst whose inner cell mass of embryonic stem cells differentiates into specialised cells; adult stem cells in bone marrow make blood cells; plant meristems.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1200" height="680" fill="#ffffff"/>
<g aria-hidden="true"><animate id="sc-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<defs><marker id="sc-475569" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="8.1" refY="9.0" orient="auto"><path d="M0,0 L18,9.0 L0,18 z" fill="#475569"/></marker></defs>
<defs><radialGradient id="sc-c" cx=".4" cy=".35"><stop offset="0" stop-color="#fef9c3"/><stop offset="1" stop-color="#fbbf24"/></radialGradient></defs>
<text class="head" x="30" y="34">Stem cells and differentiation</text><text class="note" x="30" y="56">Not to scale.</text>
<g class="part" data-part="zyg" data-name="Zygote" data-info="The fertilised egg. It is totipotent: it can form every cell of the body and the placenta." tabindex="0" role="button" aria-label="Zygote"><circle cx="110" cy="200" r="46" fill="url(#sc-c)" stroke="#a16207" stroke-width="3"/><circle cx="110" cy="200" r="14" fill="#a855f7"/><text x="110" y="270" text-anchor="middle" font-size="13" font-weight="700">zygote</text></g>
<g><animate attributeName="opacity" keyTimes="0.0000;0.0938;0.1125;1.0000" values="0;0;1;1" dur="16s" begin="sc-play.begin+0s" fill="freeze"/><circle cx="232" cy="182" r="20" fill="url(#sc-c)" stroke="#a16207" stroke-width="2"/><circle cx="268" cy="182" r="20" fill="url(#sc-c)" stroke="#a16207" stroke-width="2"/><circle cx="232" cy="218" r="20" fill="url(#sc-c)" stroke="#a16207" stroke-width="2"/><circle cx="268" cy="218" r="20" fill="url(#sc-c)" stroke="#a16207" stroke-width="2"/><text x="250" y="270" text-anchor="middle" font-size="13" font-weight="700">2 → 4 → 8 cells</text></g>
<line x1="160" y1="200" x2="208" y2="200" stroke="#475569" stroke-width="3" marker-end="url(#sc-475569)"/><line x1="292" y1="200" x2="350" y2="200" stroke="#475569" stroke-width="3" marker-end="url(#sc-475569)"/>
<g class="part" data-part="bl" data-name="Blastocyst" data-info="A hollow ball of cells formed about 5 days after fertilisation." tabindex="0" role="button" aria-label="Blastocyst"><g><animate attributeName="opacity" keyTimes="0.0000;0.2188;0.2375;1.0000" values="0;0;1;1" dur="16s" begin="sc-play.begin+0s" fill="freeze"/><circle cx="440" cy="200" r="72" fill="#fff7ed" stroke="#c2410c" stroke-width="3"/><circle cx="506.0" cy="200.0" r="9" fill="#fdba74" stroke="#c2410c"/><circle cx="502.01971297187" cy="222.57332945949415" r="9" fill="#fdba74" stroke="#c2410c"/><circle cx="490.55893324585253" cy="242.42398223931158" r="9" fill="#fdba74" stroke="#c2410c"/><circle cx="473.0" cy="257.15767664977295" r="9" fill="#fdba74" stroke="#c2410c"/><circle cx="451.4607797260174" cy="264.99731169880573" r="9" fill="#fdba74" stroke="#c2410c"/><circle cx="428.5392202739826" cy="264.99731169880573" r="9" fill="#fdba74" stroke="#c2410c"/><circle cx="407.0" cy="257.15767664977295" r="9" fill="#fdba74" stroke="#c2410c"/><circle cx="389.44106675414747" cy="242.4239822393116" r="9" fill="#fdba74" stroke="#c2410c"/><circle cx="377.9802870281301" cy="222.57332945949415" r="9" fill="#fdba74" stroke="#c2410c"/><circle cx="374.0" cy="200.0" r="9" fill="#fdba74" stroke="#c2410c"/><circle cx="377.98028702813" cy="177.42667054050588" r="9" fill="#fdba74" stroke="#c2410c"/><circle cx="389.44106675414747" cy="157.57601776068842" r="9" fill="#fdba74" stroke="#c2410c"/><circle cx="407.0" cy="142.84232335022708" r="9" fill="#fdba74" stroke="#c2410c"/><circle cx="428.5392202739826" cy="135.00268830119427" r="9" fill="#fdba74" stroke="#c2410c"/><circle cx="451.4607797260174" cy="135.00268830119427" r="9" fill="#fdba74" stroke="#c2410c"/><circle cx="473.0" cy="142.84232335022705" r="9" fill="#fdba74" stroke="#c2410c"/><circle cx="490.55893324585253" cy="157.5760177606884" r="9" fill="#fdba74" stroke="#c2410c"/><circle cx="502.01971297187" cy="177.42667054050588" r="9" fill="#fdba74" stroke="#c2410c"/><text x="440" y="300" text-anchor="middle" font-size="13" font-weight="700">blastocyst (day 5)</text></g></g>
<g class="part" data-part="icm" data-name="Inner cell mass: embryonic stem cells" data-info="Pluripotent: they can divide and differentiate into any type of body cell." tabindex="0" role="button" aria-label="Inner cell mass: embryonic stem cells"><g><animate attributeName="opacity" keyTimes="0.0000;0.2375;0.2562;1.0000" values="0;0;1;1" dur="16s" begin="sc-play.begin+0s" fill="freeze"/><circle cx="416" cy="168" r="11" fill="#c084fc" stroke="#7e22ce" stroke-width="2"/><circle cx="440" cy="162" r="11" fill="#c084fc" stroke="#7e22ce" stroke-width="2"/><circle cx="464" cy="168" r="11" fill="#c084fc" stroke="#7e22ce" stroke-width="2"/><circle cx="428" cy="184" r="11" fill="#c084fc" stroke="#7e22ce" stroke-width="2"/><circle cx="452" cy="184" r="11" fill="#c084fc" stroke="#7e22ce" stroke-width="2"/></g></g>
<g class="part" data-part="diff" data-name="Differentiation" data-info="A cell becomes specialised: some genes are switched on and others off, so it makes particular proteins and develops a particular structure." tabindex="0" role="button" aria-label="Differentiation"><g><animate attributeName="opacity" keyTimes="0.0000;0.3750;0.3937;1.0000" values="0;0;1;1" dur="16s" begin="sc-play.begin+0s" fill="freeze"/><path d="M 470 170 C 560 170 620 90 700 90" fill="none" stroke="#a855f7" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#sc-475569)"/><circle cx="760" cy="90" r="14" fill="#2563eb"/><path d="M 774 90 L 850 90 M 748 82 l -18 -14 M 748 98 l -18 14 M 760 76 l 0 -16" stroke="#2563eb" stroke-width="4" fill="none"/><text x="870" y="95" font-size="13" font-weight="700">neuron</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.4094;0.4281;1.0000" values="0;0;1;1" dur="16s" begin="sc-play.begin+0s" fill="freeze"/><path d="M 470 170 C 560 170 620 170 840 170" fill="none" stroke="#a855f7" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#sc-475569)"/><rect x="860" y="158" width="100" height="24" rx="12" fill="#dc2626"/><line x1="870" y1="160" x2="870" y2="180" stroke="#fecaca" stroke-width="2"/><line x1="882" y1="160" x2="882" y2="180" stroke="#fecaca" stroke-width="2"/><line x1="894" y1="160" x2="894" y2="180" stroke="#fecaca" stroke-width="2"/><line x1="906" y1="160" x2="906" y2="180" stroke="#fecaca" stroke-width="2"/><line x1="918" y1="160" x2="918" y2="180" stroke="#fecaca" stroke-width="2"/><line x1="930" y1="160" x2="930" y2="180" stroke="#fecaca" stroke-width="2"/><line x1="942" y1="160" x2="942" y2="180" stroke="#fecaca" stroke-width="2"/><line x1="954" y1="160" x2="954" y2="180" stroke="#fecaca" stroke-width="2"/><text x="1010" y="175" font-size="13" font-weight="700">muscle cell</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.4437;0.4625;1.0000" values="0;0;1;1" dur="16s" begin="sc-play.begin+0s" fill="freeze"/><path d="M 470 170 C 560 170 620 250 700 250" fill="none" stroke="#a855f7" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#sc-475569)"/><ellipse cx="760" cy="250" rx="26" ry="20" fill="#b91c1c"/><ellipse cx="760" cy="250" rx="12" ry="9" fill="#ef4444"/><text x="870" y="255" font-size="13" font-weight="700">red blood cell</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.4781;0.4969;1.0000" values="0;0;1;1" dur="16s" begin="sc-play.begin+0s" fill="freeze"/><path d="M 470 170 C 560 170 620 330 840 330" fill="none" stroke="#a855f7" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#sc-475569)"/><rect x="884" y="310" width="32" height="40" fill="#ca8a04"/><rect x="886" y="300" width="4" height="10" fill="#ca8a04"/><rect x="893" y="300" width="4" height="10" fill="#ca8a04"/><rect x="900" y="300" width="4" height="10" fill="#ca8a04"/><rect x="907" y="300" width="4" height="10" fill="#ca8a04"/><rect x="914" y="300" width="4" height="10" fill="#ca8a04"/><text x="1010" y="335" font-size="13" font-weight="700">gut lining cell</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.5125;0.5312;1.0000" values="0;0;1;1" dur="16s" begin="sc-play.begin+0s" fill="freeze"/><path d="M 470 170 C 560 170 620 410 700 410" fill="none" stroke="#a855f7" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#sc-475569)"/><polygon points="736,410 748,392 772,392 784,410 772,428 748,428" fill="#d97706"/><text x="870" y="415" font-size="13" font-weight="700">skin cell</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.5469;0.5656;1.0000" values="0;0;1;1" dur="16s" begin="sc-play.begin+0s" fill="freeze"/><path d="M 470 170 C 560 170 620 490 840 490" fill="none" stroke="#a855f7" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#sc-475569)"/><circle cx="900" cy="490" r="20" fill="#16a34a"/><circle cx="892" cy="484" r="3" fill="#bbf7d0"/><circle cx="906" cy="482" r="3" fill="#bbf7d0"/><circle cx="900" cy="496" r="3" fill="#bbf7d0"/><circle cx="909" cy="495" r="3" fill="#bbf7d0"/><text x="1010" y="495" font-size="13" font-weight="700">cell for insulin (β cell)</text></g></g>
<g class="part" data-part="adult" data-name="Adult stem cells (bone marrow)" data-info="Multipotent: they make a limited range of cells, e.g. red and white blood cells and platelets. Used in bone marrow transplants." tabindex="0" role="button" aria-label="Adult stem cells (bone marrow)"><g><animate attributeName="opacity" keyTimes="0.0000;0.6250;0.6438;1.0000" values="0;0;1;1" dur="16s" begin="sc-play.begin+0s" fill="freeze"/><rect x="40" y="470" width="560" height="190" rx="14" fill="#fef2f2" stroke="#fecaca"/><text x="58" y="496" font-size="14" font-weight="800" fill="#991b1b">Adult stem cells in bone marrow (multipotent)</text><circle cx="110" cy="570" r="30" fill="#fca5a5" stroke="#b91c1c" stroke-width="2"/><text x="110" y="618" text-anchor="middle" font-size="12">stem cell</text><line x1="142" y1="570" x2="268" y2="528" stroke="#475569" stroke-width="2.5" marker-end="url(#sc-475569)"/><ellipse cx="300" cy="528" rx="18" ry="13" fill="#dc2626"/><text x="330" y="533" font-size="13" font-weight="600">red blood cells</text><line x1="142" y1="570" x2="268" y2="574" stroke="#475569" stroke-width="2.5" marker-end="url(#sc-475569)"/><circle cx="300" cy="574" r="16" fill="#e9d5ff" stroke="#7e22ce"/><circle cx="300" cy="574" r="7" fill="#7e22ce"/><text x="330" y="579" font-size="13" font-weight="600">white blood cells</text><line x1="142" y1="570" x2="268" y2="620" stroke="#475569" stroke-width="2.5" marker-end="url(#sc-475569)"/><circle cx="292" cy="620" r="4" fill="#f59e0b"/><circle cx="304" cy="615" r="4" fill="#f59e0b"/><circle cx="306" cy="626" r="4" fill="#f59e0b"/><text x="330" y="625" font-size="13" font-weight="600">platelets</text><text x="470" y="600" font-size="11" fill="#7f1d1d">Used in bone</text><text x="470" y="616" font-size="11" fill="#7f1d1d">marrow transplants</text></g></g>
<g class="part" data-part="mer" data-name="Meristems (plants)" data-info="Plant stem cells at root and shoot tips; they can make any type of plant cell throughout the plant’s life." tabindex="0" role="button" aria-label="Meristems (plants)"><g><animate attributeName="opacity" keyTimes="0.0000;0.8125;0.8313;1.0000" values="0;0;1;1" dur="16s" begin="sc-play.begin+0s" fill="freeze"/><rect x="640" y="560" width="520" height="100" rx="14" fill="#f0fdf4" stroke="#86efac"/><text x="658" y="586" font-size="14" font-weight="800" fill="#166534">Plants: meristems</text><text x="658" y="608" font-size="12">Stem cells at shoot and root tips divide throughout life;</text><text x="658" y="626" font-size="12">they can form any plant cell, so cuttings can grow into</text><text x="658" y="644" font-size="12">whole new plants (clones).</text></g></g>
<g class="labels"><g class="lbl" data-for="zyg"><polyline points="110.0,106.0 110.0,154.0"/><circle cx="110.0" cy="154.0" r="2.6"/><text x="110" y="100" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="4">Zygote</text></g><g class="lbl" data-for="icm"><polyline points="440.0,106.0 440.0,160.0"/><circle cx="440.0" cy="160.0" r="2.6"/><text x="440" y="100" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="4">Inner cell mass (embryonic stem cells)</text></g><g class="lbl" data-for="diff"><polyline points="620.0,430.0 640.0,330.0"/><circle cx="640.0" cy="330.0" r="2.6"/><text x="620" y="450" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="4">Differentiation</text></g></g>
</svg>