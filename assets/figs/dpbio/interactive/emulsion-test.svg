<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 540" class="vd-svg" role="img" aria-labelledby="em-title em-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="em-play" data-vd-play-label="Play: test a peanut" data-vd-steps="[[0, &quot;The emulsion test for lipids.&quot;], [1, &quot;Crush the food with ethanol: lipids dissolve.&quot;], [4.5, &quot;Pour the ethanol into water.&quot;], [8, &quot;Cloudy white emulsion = lipid present. The control stays clear.&quot;]]" data-vd-dur="13">
<title id="em-title">The emulsion test for lipids</title><desc id="em-desc">Food crushed with ethanol, the ethanol decanted into water, and a cloudy white emulsion forming when lipid is present, compared with a clear control.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="540" fill="#ffffff"/>
<g aria-hidden="true"><animate id="em-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
