<text class="head" x="30" y="34">The emulsion test for lipids</text><text class="note" x="30" y="56">Ethanol is flammable: no flames.</text>
<g class="part" data-part="crush" data-name="Crush with ethanol" data-info="Crush the food (peanut, avocado) with ethanol: lipids dissolve in ethanol." tabindex="0" role="button" aria-label="Crush with ethanol"><path d="M 157.0 120 L 157.0 320 A 23.0 23.0 0 0 0 203.0 320 L 203.0 120" fill="#f8fafc" stroke="#334155" stroke-width="2.5"/><path d="M 159 230 L 159 320 A 21 21 0 0 0 201 320 L 201 230 Z" fill="#f1f5f9" opacity=".9"/><ellipse cx="170" cy="318" rx="8" ry="5" fill="#d6a76b" stroke="#92400e"/><ellipse cx="180" cy="312" rx="8" ry="5" fill="#d6a76b" stroke="#92400e"/><ellipse cx="190" cy="306" rx="8" ry="5" fill="#d6a76b" stroke="#92400e"/><text x="180" y="390" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">peanut + ethanol</text><g transform="translate(180 200)"><rect x="-4" y="-120" width="8" height="110" fill="#94a3b8"><animate attributeName="y" keyTimes="0.0000;0.0769;0.1154;0.1538;0.1923;0.2308;0.2692;1.0000" values="-120;-120;-90;-120;-90;-120;-90;-120" dur="13s" begin="em-play.begin+0s" fill="freeze"/></rect></g></g>
<g class="part" data-part="decant" data-name="Pour into water" data-info="Decant the ethanol into a tube of water." tabindex="0" role="button" aria-label="Pour into water"><path d="M 497.0 160 L 497.0 360 A 23.0 23.0 0 0 0 543.0 360 L 543.0 160" fill="#f8fafc" stroke="#334155" stroke-width="2.5"/><path d="M 499 260 L 499 360 A 21 21 0 0 0 541 360 L 541 260 Z" fill="#bfdbfe"/><text x="520" y="430" text-anchor="middle" font-size="13" font-weight="800" fill="#1d4ed8">water</text><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.3462;0.3692;0.5769;0.6000;1.0000" values="0;0;1;1;0;0" dur="13s" begin="em-play.begin+0s" fill="freeze"/><path d="M 360 150 Q 450 120 510 170" fill="none" stroke="#a5b4fc" stroke-width="6" marker-end="url(#em-475569)"/></g><path d="M 499 260 L 499 360 A 21 21 0 0 0 541 360 L 541 260 Z" fill="#f8fafc" opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.5769;0.6923;1.0000" values="0;0;0.95;0.95" dur="13s" begin="em-play.begin+0s" fill="freeze"/></path><g><animate attributeName="opacity" keyTimes="0.0000;0.6538;0.6769;1.0000" values="0;0;1;1" dur="13s" begin="em-play.begin+0s" fill="freeze"/><circle cx="505" cy="270" r="2.5" fill="#e2e8f0" stroke="#94a3b8" stroke-width=".5"/><circle cx="512" cy="283" r="2.5" fill="#e2e8f0" stroke="#94a3b8" stroke-width=".5"/><circle cx="519" cy="296" r="2.5" fill="#e2e8f0" stroke="#94a3b8" stroke-width=".5"/><circle cx="526" cy="309" r="2.5" fill="#e2e8f0" stroke="#94a3b8" stroke-width=".5"/><circle cx="533" cy="322" r="2.5" fill="#e2e8f0" stroke="#94a3b8" stroke-width=".5"/><circle cx="508" cy="335" r="2.5" fill="#e2e8f0" stroke="#94a3b8" stroke-width=".5"/><circle cx="515" cy="348" r="2.5" fill="#e2e8f0" stroke="#94a3b8" stroke-width=".5"/><circle cx="522" cy="361" r="2.5" fill="#e2e8f0" stroke="#94a3b8" stroke-width=".5"/><circle cx="529" cy="274" r="2.5" fill="#e2e8f0" stroke="#94a3b8" stroke-width=".5"/><circle cx="536" cy="287" r="2.5" fill="#e2e8f0" stroke="#94a3b8" stroke-width=