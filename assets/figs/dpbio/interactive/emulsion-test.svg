<g class="part" data-part="res" data-name="Result" data-info="Cloudy white emulsion = lipid present: the lipid comes out of solution as tiny droplets in water. Clear = no lipid (compare with a control)." tabindex="0" role="button" aria-label="Result"><path d="M 777.0 160 L 777.0 360 A 23.0 23.0 0 0 0 823.0 360 L 823.0 160" fill="#f8fafc" stroke="#334155" stroke-width="2.5"/><path d="M 779 260 L 779 360 A 21 21 0 0 0 821 360 L 821 260 Z" fill="#bfdbfe"/><text x="800" y="430" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">control: water only</text><text x="800" y="450" text-anchor="middle" font-size="12" font-weight="700" fill="#1d4ed8">stays clear</text><g><animate attributeName="opacity" keyTimes="0.0000;0.6923;0.7154;1.0000" values="0;0;1;1" dur="13s" begin="em-play.begin+0s" fill="freeze"/><text x="520" y="450" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">cloudy white emulsion</text><text x="520" y="470" text-anchor="middle" font-size="13" font-weight="800" fill="#15803d">= lipid present</text></g></g>
</svg>