<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 510" class="vd-svg" role="img" aria-labelledby="bt-title bt-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="bt-play" data-vd-play-label="Play: transfer and share" data-vd-steps="[[0, &quot;Two ways atoms can complete their outer shells.&quot;], [1, &quot;Ionic: sodium transfers one electron to chlorine...&quot;], [4, &quot;...giving Na\u207a and Cl\u207b ions, which attract.&quot;], [7, &quot;Covalent: in water, oxygen and each hydrogen share a pair of electrons.&quot;], [11, &quot;Oxygen now has 8 outer electrons; each hydrogen has 2.&quot;]]" data-vd-dur="14">
<title id="bt-title">Ionic and covalent bonding</title><desc id="bt-desc">Ionic bonding: sodium transfers an electron to chlorine, forming Na+ and Cl- ions that attract. Covalent bonding: in water each hydrogen shares a pair of electrons with oxygen.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="510" fill="#ffffff"/>
<g aria-hidden="true"><animate id="bt-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<text class="head" x="30" y="34">Two ways to complete an outer shell</text><text class="note" x="30" y="56">After EduVista A1.1 task sheet.</text>
<text x="270" y="100" text-anchor="middle" font-size="15" font-weight="800" fill="#1f3b5c">IONIC BOND — electrons transferred</text><text x="800" y="100" text-anchor="middle" font-size="15" font-weight="800" fill="#1f3b5c">COVALENT BOND — electrons shared</text><line x1="540" y1="90" x2="540" y2="480" stroke="#cbd5e1" stroke-dasharray="6 5"/>
<g class="part" data-part="ion" data-name="Ionic bond: electrons transferred" data-info="Sodium gives its one outer electron to chlorine." tabindex="0" role="button" aria-label="Ionic bond: electrons transferred"><circle cx="150" cy="200" r="40" fill="#f8fafc" stroke="#9ca3af" stroke-width="2"/><text x="150" y="206" text-anchor="middle" font-size="16" font-weight="800" fill="#111827">Na</text><circle cx="370" cy="200" r="52" fill="#f8fafc" stroke="#9ca3af" stroke-width="2"/><text x="370" y="206" text-anchor="middle" font-size="16" font-weight="800" fill="#111827">Cl</text><circle cx="418.9" cy="217.8" r="5" fill="#2e6fb5"/><circle cx="386.6" cy="249.3" r="5" fill="#2e6fb5"/><circle cx="341.8" cy="243.7" r="5" fill="#2e6fb5"/><circle cx="318.3" cy="205.2" r="5" fill="#2e6fb5"/><circle cx="333.7" cy="162.8" r="5" fill="#2e6fb5"/><circle cx="376.5" cy="148.4" r="5" fill="#2e6fb5"/><circle cx="414.4" cy="172.9" r="5" fill="#2e6fb5"/><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.0000;0.0143;1.0000;1.0000;1.0000" values="0;0;1;1;0;0" dur="14s" begin="bt-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.0000;0.1071;0.2286;1.0000;1.0000" values="190 200;190 200;190 200;318 200;318 200;318 200" dur="14s" begin="bt-play.begin+0s" fill="freeze"/><circle r="6" fill="#c0392b"/></g></g><g><animate attributeName="opacity" keyTimes="0.0000;0.1071;0.1286;1.0000" values="0;0;1;1" dur="14s" begin="bt-play.begin+0s" fill="freeze"/><path d="M 195 170 C 240 130 290 130 318 165" fill="none" stroke="#c0392b" stroke-width="2.5"/><text x="260" y="140" text-anchor="middle" font-size="12" font-weight="700" fill="#c0392b">one electron is transferred</text></g></g>
<defs><marker id="bt-7c3aed" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="5.4" refY="6.0" orient="auto"><path d="M0,0 L12,6.0 L0,12 z" fill="#7c3aed"/></marker></defs><g class="part" data-part="ions" data-name="Ions attract" data-info="Na⁺ is a cation and Cl⁻ is an anion; the attraction between them is the ionic bond." tabindex="0" role="button" aria-label="Ions attract"><g><animate attributeName="opacity" keyTimes="0.0000;0.2857;0.3071;1.0000" values="0;0;1;1" dur="14s" begin="bt-play.begin+0s" fill="freeze"/><circle cx="150" cy="360" r="40" fill="#dbe7f6" stroke="#9ca3af" stroke-width="2"/><text x="150" y="366" text-anchor="middle" font-size="16" font-weight="800" fill="#111827">Na</text><text x="205" y="330" text-anchor="middle" font-size="24" font-weight="800" fill="#2e6fb5">+</text><circle cx="370" cy="360" r="52" fill="#e3f1e1" stroke="#9ca3af" stroke-width="2"/><text x="370" y="366" text-anchor="middle" font-size="16" font-weight="800" fill="#111827">Cl</text><circle cx="418.9" cy="377.8" r="5" fill="#2e6fb5"/><circle cx="392.0" cy="407.1" r="5" fill="#2e6fb5"/><circle cx="352.2" cy="408.9" r="5" fill="#2e6fb5"/><circle cx="322.9" cy="382.0" r="5" fill="#2e6fb5"/><circle cx="321.1" cy="342.2" r="5" fill="#2e6fb5"/><circle cx="348.0" cy="312.9" r="5" fill="#2e6fb5"/><circle cx="387.8" cy="311.1" r="5" fill="#2e6fb5"/><circle cx="417.1" cy="338.0" r="5" fill="#2e6fb5"/><text x="440" y="320" text-anchor="middle" font-size="26" font-weight="800" fill="#166534">−</text><path d="M 200 360 L 310 360" stroke="#7c3aed" stroke-width="3" marker-start="url(#bt-7c3aed)" marker-end="url(#bt-7c3aed)"/><text x="260" y="440" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">Na⁺ is a cation, Cl⁻ is an anion.</text><text x="260" y="460" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">Their attraction is the ionic bond.</text></g></g>
<g class="part" data-part="cov" data-name="Covalent bond: electrons shared" data-info="In water each hydrogen shares its electron with oxygen, and oxygen shares one back: two shared pairs, two O–H covalent bonds." tabindex="0" role="button" aria-label="Covalent bond: electrons shared"><circle cx="800" cy="250" r="60" fill="#f8fafc" stroke="#9ca3af" stroke-width="2"/><text x="800" y="257" text-anchor="middle" font-size="22" font-weight="800" fill="#111827">O</text><circle cx="800.0" cy="310.0" r="5" fill="#2e6fb5"/><circle cx="748.0" cy="280.0" r="5" fill="#2e6fb5"/><circle cx="748.0" cy="220.0" r="5" fill="#2e6fb5"/><circle cx="800.0" cy="190.0" r="5" fill="#2e6fb5"/><circle cx="852.0" cy="220.0" r="5" fill="#2e6fb5"/><circle cx="852.0" cy="280.0" r="5" fill="#2e6fb5"/><circle cx="725" cy="175" r="30" fill="#f8fafc" stroke="#9ca3af" stroke-width="2"/><text x="725" y="181" text-anchor="middle" font-size="16" font-weight="800" fill="#111827">H</text><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.5000;0.6071;1.0000" values="0 -60;0 -60;0 0;0 0" dur="14s" begin="bt-play.begin+0s" fill="freeze"/><text x="750" y="210" text-anchor="middle" font-size="18" font-weight="800" fill="#c0392b">×</text></g></g>
<circle cx="875" cy="175" r="30" fill="#f8fafc" stroke="#9ca3af" stroke-width="2"/><text x="875" y="181" text-anchor="middle" font-size="16" font-weight="800" fill="#111827">H</text><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.5714;0.6786;1.0000" values="0 -60;0 -60;0 0;0 0" dur="14s" begin="bt-play.begin+0s" fill="freeze"/><text x="850" y="210" text-anchor="middle" font-size="18" font-weight="800" fill="#c0392b">×</text></g>
<g><animate attributeName="opacity" keyTimes="0.0000;0.6429;0.6643;1.0000" values="0;0;1;1" dur="14s" begin="bt-play.begin+0s" fill="freeze"/><text x="800" y="400" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">Each hydrogen shares its electron with the oxygen,</text><text x="800" y="420" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">and the oxygen shares one back: a covalent bond.</text></g>
<g class="part" data-part="key" data-name="Key" data-info="• electrons from oxygen; × electrons from hydrogen." tabindex="0" role="button" aria-label="Key"><text x="700" y="490" text-anchor="start" font-size="12" font-weight="800" fill="#2e6fb5">•  from oxygen</text><text x="840" y="490" text-anchor="start" font-size="12" font-weight="800" fill="#c0392b">×  from hydrogen</text></g>
<g><animate attributeName="opacity" keyTimes="0.0000;0.7857;0.8071;1.0000" values="0;0;1;1" dur="14s" begin="bt-play.begin+0s" fill="freeze"/><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.7857;0.8071;1.0000" values="0;0;1;1" dur="14s" begin="bt-play.begin+0s" fill="freeze"/><rect x="670.0" y="434" width="260" height="24" rx="12" fill="#e8f1fb" stroke="#1f2937" stroke-width="1"/><text x="800" y="451" text-anchor="middle" font-size="12" font-weight="700">O: 8 outer electrons · each H: 2</text></g></g>
</svg>