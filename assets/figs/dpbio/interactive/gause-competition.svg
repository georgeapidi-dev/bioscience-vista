<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" class="vd-svg" role="img" aria-labelledby="ga-title ga-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="ga-play" data-vd-play-label="Play: the experiment" data-vd-steps="[[0, &quot;Gause\u2019s experiments with two species of Paramecium (1934).&quot;], [1, &quot;Grown alone, each species shows S-shaped (logistic) growth to its carrying capacity.&quot;], [6, &quot;Grown together, with the same food\u2026&quot;], [8, &quot;\u2026P. aurelia grows well, but P. caudatum rises at first and then declines.&quot;], [12, &quot;Competitive exclusion: two species with the same niche cannot coexist indefinitely.&quot;]]" data-vd-dur="16">
<title id="ga-title">Gause: competitive exclusion</title><desc id="ga-desc">Population curves for Paramecium aurelia and P. caudatum grown separately (both logistic) and together (P. caudatum declines), illustrating the competitive exclusion principle.</desc>
