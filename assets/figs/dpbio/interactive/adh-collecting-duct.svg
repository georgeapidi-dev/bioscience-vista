<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 580" class="vd-svg" role="img" aria-labelledby="ad-title ad-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="ad-play" data-vd-play-label="Play: drink water" data-vd-steps="[[0, &quot;ADH and water balance.&quot;], [1, &quot;Urine colour shows water status.&quot;], [4, &quot;Dehydrated: more ADH \u2192 more aquaporins in the collecting duct \u2192 more water reabsorbed.&quot;], [10, &quot;After drinking water: ADH falls first, then urine flow rises.&quot;]]" data-vd-dur="16">
<title id="ad-title">ADH and the collecting duct</title><desc id="ad-desc">A urine colour chart, a collecting duct cell inserting aquaporins in response to ADH so water is reabsorbed, and graphs after drinking one litre of water: ADH falls to a minimum at 40 minutes and urine flow peaks at 12 cubic centimetres per minute at 60 minutes.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="580" fill="#ffffff"/>
<g aria-hidden="true"><animate id="ad-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<text class="head" x="30" y="34">ADH, aquaporins and urine</text><text class="note" x="30" y="56">Data from the lesson; curves smoothed.</text>
<g class="part" data-part="col" data-name="Urine colour" data-info="A rough guide to water status: dark urine is concentrated, pale urine is dilute." tabindex="0" role="button" aria-label="Urine colour"><g><animate attributeName="opacity" keyTimes="0.0000;0.0625;0.0813;1.0000" values="0;0;1;1" dur="16s" begin="ad-play.begin+0s" fill="freeze"/><rect x="50" y="100" width="42" height="70" rx="8" fill="#fefce8" stroke="#a16207"/><rect x="98" y="100" width="42" height="70" rx="8" fill="#fef9c3" stroke="#a16207"/><rect x="146" y="100" width="42" height="70" rx="8" fill="#fde68a" stroke="#a16207"/><rect x="194" y="100" width="42" height="70" rx="8" fill="#fcd34d" stroke="#a16207"/><rect x="242" y="100" width="42" height="70" rx="8" fill="#f59e0b" stroke="#a16207"/><rect x="290" y="100" width="42" height="70" rx="8" fill="#b45309" stroke="#a16207"/><text x="70" y="190" text-anchor="start" font-size="11" font-weight="800" fill="#475569">pale = dilute</text><text x="330" y="190" text-anchor="end" font-size="11" font-weight="800" fill="#92400e">dark = concentrated</text></g></g>
<g class="part" data-part="adh" data-name="ADH and aquaporins" data-info="Osmoreceptors in the hypothalamus detect blood solute concentration. Too concentrated → more ADH from the pituitary → collecting duct cells insert more aquaporins → more water reabsorbed → small volume of concentrated urine. Too dilute → less ADH → large volume of dilute urine." tabindex="0" role="button" aria-label="ADH and aquaporins"><rect x="40" y="220" width="320" height="320" rx="16" fill="#f8fafc" stroke="#cbd5e1"/><text x="200" y="244" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">collecting duct cell</text><rect x="80" y="270" width="240" height="200" rx="14" fill="#fef3c7" stroke="#a16207" stroke-width="3"/><text x="200" y="500" text-anchor="middle" font-size="11" font-weight="800" fill="#475569">urine side ← | → blood side</text><g transform="translate(140 320)"><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.3125;0.4062;1.0000" values="140 320;140 320;84 290;84 290" dur="16s" begin="ad-play.begin+0s" fill="freeze"/><circle r="12" fill="#e0e7ff" stroke="#4f46e5"/><rect x="-4" y="-8" width="8" height="16" fill="#4f46e5"/></g><g transform="translate(200 320)"><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.3312;0.4250;1.0000" values="200 320;200 320;84 330;84 330" dur="16s" begin="ad-play.begin+0s" fill="freeze"/><circle r="12" fill="#e0e7ff" stroke="#4f46e5"/><rect x="-4" y="-8" width="8" height="16" fill="#4f46e5"/></g><g transform="translate(140 370)"><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.3500;0.4437;1.0000" values="140 370;140 370;84 370;84 370" dur="16s" begin="ad-play.begin+0s" fill="freeze"/><circle r="12" fill="#e0e7ff" stroke="#4f46e5"/><rect x="-4" y="-8" width="8" height="16" fill="#4f46e5"/></g><g transform="translate(200 370)"><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.3688;0.4625;1.0000" values="200 370;200 