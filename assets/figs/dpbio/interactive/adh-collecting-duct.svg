;0.3312;1.0000" values="0;0;1;1" dur="16s" begin="ad-play.begin+0s" fill="freeze"/><rect x="50.0" y="518" width="300" height="24" rx="12" fill="#e0e7ff" stroke="#1f2937" stroke-width="1"/><text x="200" y="535" text-anchor="middle" font-size="12" font-weight="700">ADH → aquaporins inserted → water reabsorbed</text></g></g></g>
<g class="part" data-part="data" data-name="ADH data" data-info="After drinking 1 litre of water: blood ADH fell to its lowest at 40 minutes; urine flow rose from 1 to a peak of 12 cm³ min⁻¹ at 60 minutes, back to 1 by 150 minutes. Diabetes insipidus: no ADH (or no response) → very large volumes of dilute urine." tabindex="0" role="button" aria-label="ADH data"><line x1="450" y1="500" x2="1030" y2="500" stroke="#111827" stroke-width="2"/><line x1="450" y1="500" x2="450" y2="160" stroke="#111827" stroke-width="2"/><text x="450.0" y="518" text-anchor="middle" font-size="10" font-weight="700" fill="#475569">0</text><text x="578.8888888888889" y="518" text-anchor="middle" font-size="10" font-weight="700" fill="#475569">40</text><text x="643.3333333333333" y="518" text-anchor="middle" font-size="10" font-weight="700" fill="#475569">60</text><text x="772.2222222222222" y="518" text-anchor="middle" font-size="10" font-weight="700" fill="#475569">100</text><text x="933.3333333333334" y="518" text-anchor="middle" font-size="10" font-weight="700" fill="#475569">150</text><text x="1030.0" y="518" text-anchor="middle" font-size="10" font-weight="700" fill="#475569">180</text><text x="740.0" y="538" text-anchor="middle" font-size="11" font-weight="800" fill="#111827">time after drinking 1 litre / min</text><text x="442" y="190.15384615384613" text-anchor="end" font-size="10" font-weight="800" fill="#2563eb">12</text><text x="442" y="477.84615384615387" text-anchor="end" font-size="10" font-weight="800" fill="#2563eb">1</text><text x="456" y="152" text-anchor="start" font-size="11" font-weight="800" fill="#111827">urine flow / cm³ min⁻¹ (blue) · blood ADH, relative (purple)</text><clipPath id="ada-c100160450"><rect x="450" y="160" width="580" height="340"><animate attributeName="width" keyTimes="0.0000;0.6250;0.7812;1.0000" values="0;0;580;580" dur="16s" begin="ad-play.begin+0s" fill="freeze"/></rect></clipPath><g clip-path="url(#ada-c100160450)"><polyline points="450.0,264.8 456