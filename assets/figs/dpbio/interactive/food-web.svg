<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" class="vd-svg" role="img" aria-labelledby="fw-title fw-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="fw-play" data-vd-play-label="Play: follow the food chains" data-vd-steps="[[0, &quot;A woodland food web: many food chains linked together. Arrows show the direction energy flows: from food to feeder.&quot;], [1, &quot;Food chain 1: oak tree \u2192 caterpillar \u2192 blue tit \u2192 hawk. Energy enters through photosynthesis in the producer.&quot;], [5, &quot;Food chain 2: grass \u2192 mouse \u2192 owl. The mouse is eaten by three different predators.&quot;], [8.5, &quot;Food chain 3: grass \u2192 rabbit \u2192 fox.&quot;], [11.5, &quot;If the mice died out, owls would lose their only food and foxes and hawks would eat more of their other prey: everything in a web is connected.&quot;]]" data-vd-dur="14">
<title id="fw-title">A woodland food web</title><desc id="fw-desc">A food web: oak tree and grass are producers; caterpillar, mouse and rabbit are primary consumers; blue tit, owl and fox are secondary consumers; the hawk is the top predator. Arrows show energy flow.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1000" height="660" fill="#ffffff"/>
<g aria-hidden="true"><animate id="fw-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<defs><marker id="fw-475569" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#475569"/></marker><marker id="fw-dc2626" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#dc2626"/></marker></defs>
<text class="head" x="30" y="34">A woodland food web</text><text class="note" x="30" y="56">Arrows go from the food to the organism that eats it.</text>
<g class="part" data-part="lev" data-name="Trophic levels" data-info="Producer → primary consumer → secondary consumer → tertiary consumer." tabindex="0" role="button" aria-label="Trophic levels"><text x="990" y="115" text-anchor="end" font-size="13" fill="#64748b">tertiary consumer</text><line x1="40" y1="125" x2="990" y2="125" stroke="#e2e8f0"/><text x="990" y="255" text-anchor="end" font-size="13" fill="#64748b">secondary consumers</text><line x1="40" y1="265" x2="990" y2="265" stroke="#e2e8f0"/><text x="990" y="405" text-anchor="end" font-size="13" fill="#64748b">primary consumers</text><line x1="40" y1="415" x2="990" y2="415" stroke="#e2e8f0"/><text x="990" y="565" text-anchor="end" font-size="13" fill="#64748b">producers</text><line x1="40" y1="575" x2="990" y2="575" stroke="#e2e8f0"/></g>
<g class="part" data-part="arrow" data-name="Arrows" data-info="Point from the food to the feeder: the direction energy (and biomass) flows." tabindex="0" role="button" aria-label="Arrows"><line x1="203.0" y1="526.0" x2="158.8" y2="437.6" stroke="#475569" stroke-width="2.5" marker-end="url(#fw-475569)" /><line x1="248.4" y1="534.8" x2="368.6" y2="427.9" stroke="#475569" stroke-width="2.5" marker-end="url(#fw-475569)" /><line x1="624.7" y1="522.3" x2="634.8" y2="441.7" stroke="#475569" stroke-width="2.5" marker-end="url(#fw-475569)" /><line x1="589.3" y1="537.6" x2="434.0" y2="424.7" stroke="#475569" stroke-width="2.5" marker-end="url(#fw-475569)" /><line x1="145.0" y1="362.3" x2="154.4" y2="291.6" stroke="#475569" stroke-width="2.5" marker-end="url(#fw-475569)" /><line x1="640.0" y1="362.0" x2="640.0" y2="292.0" stroke="#475569" stroke-width="2.5" marker-end="url(#fw-475569)" /><line x1="432.2" y1="379.9" x2="604.4" y2="272.3" stroke="#475569" stroke-width="2.5" marker-end="url(#fw-475569)" /><line x1="402.5" y1="362.1" x2="407.2" y2="291.9" stroke="#475569" stroke-width="2.5" marker-end="url(#fw-475569)" /><line x1="186.9" y1="223.1" x2="270.3" y2="139.7" stroke="#475569" stroke-width="2.5" marker-end="url(#fw-475569)" /><line x1="387.6" y1="364.1" x2="313.7" y2="149.7" stroke="#475569" stroke-width="2.5" marker-end="url(#fw-475569)" /></g>
<g class="part" data-part="oak" data-name="Oak tree" data-info="Producer: makes its own food by photosynthesis. Energy enters the food web here." tabindex="0" role="button" aria-label="Oak tree"><circle cx="220" cy="560" r="36" fill="#16a34a" fill-opacity=".35" stroke="#16a34a" stroke-width="4"/><text x="220" y="573" text-anchor="middle" font-size="36">🌳</text><text x="264" y="565" font-size="14" font-weight="700" paint-order="stroke" stroke="#fff" stroke-width="4">Oak tree</text></g>
<g class="part" data-part="grass" data-name="Grass" data-info="Producer: photosynthesis." tabindex="0" role="button" aria-label="Grass"><circle cx="620" cy="560" r="36" fill="#22c55e" fill-opacity=".35" stroke="#22c55e" stroke-width="4"/><text x="620" y="573" text-anchor="middle" font-size="36">🌾</text><text x="664" y="565" font-size="14" font-weight="700" paint-order="stroke" stroke="#fff" stroke-width="4">Grass</text></g>
<g class="part" data-part="cat" data-name="Caterpillar" data-info="Primary consumer (herbivore): eats oak leaves." tabindex="0" role="button" aria-label="Caterpillar"><circle cx="140" cy="400" r="36" fill="#a3e635" fill-opacity=".35" stroke="#a3e635" stroke-width="4"/><text x="140" y="413" text-anchor="middle" font-size="36">🐛</text><text x="184" y="405" font-size="14" font-weight="700" paint-order="stroke" stroke="#fff" stroke-width="4">Caterpillar</text></g>
<g class="part" data-part="rab" data-name="Rabbit" data-info="Primary consumer (herbivore): eats grass." tabindex="0" role="button" aria-label="Rabbit"><circle cx="640" cy="400" r="36" fill="#d6d3d1" fill-opacity=".35" stroke="#d6d3d1" stroke-width="4"/><text x="640" y="413" text-anchor="middle" font-size="36">🐇</text><text x="684" y="405" font-size="14" font-weight="700" paint-order="stroke" stroke="#fff" stroke-width="4">Rabbit</text></g>
<g class="part" data-part="mou" data-name="Mouse" data-info="Primary consumer: eats grass seeds and acorns." tabindex="0" role="button" aria-label="Mouse"><circle cx="400" cy="400" r="36" fill="#a8a29e" fill-opacity=".35" stroke="#a8a29e" stroke-width="4"/><text x="400" y="413" text-anchor="middle" font-size="36">🐁</text><text x="444" y="405" font-size="14" font-weight="700" paint-order="stroke" stroke="#fff" stroke-width="4">Mouse</text></g>
<g class="part" data-part="tit" data-name="Blue tit" data-info="Secondary consumer: eats caterpillars." tabindex="0" role="button" aria-label="Blue tit"><circle cx="160" cy="250" r="36" fill="#60a5fa" fill-opacity=".35" stroke="#60a5fa" stroke-width="4"/><text x="160" y="263" text-anchor="middle" font-size="36">🐦</text><text x="204" y="255" font-size="14" font-weight="700" paint-order="stroke" stroke="#fff" stroke-width="4">Blue tit</text></g>
<g class="part" data-part="fox" data-name="Fox" data-info="Secondary consumer (carnivore): eats rabbits and mice." tabindex="0" role="button" aria-label="Fox"><circle cx="640" cy="250" r="36" fill="#fb923c" fill-opacity=".35" stroke="#fb923c" stroke-width="4"/><text x="640" y="263" text-anchor="middle" font-size="36">🦊</text><text x="684" y="255" font-size="14" font-weight="700" paint-order="stroke" stroke="#fff" stroke-width="4">Fox</text></g>
<g class="part" data-part="owl" data-name="Owl" data-info="Secondary consumer: eats mice." tabindex="0" role="button" aria-label="Owl"><circle cx="410" cy="250" r="36" fill="#a16207" fill-opacity=".35" stroke="#a16207" stroke-width="4"/><text x="410" y="263" text-anchor="middle" font-size="36">🦉</text><text x="454" y="255" font-size="14" font-weight="700" paint-order="stroke" stroke="#fff" stroke-width="4">Owl</text></g>
<g class="part" data-part="hawk" data-name="Hawk" data-info="Tertiary consumer (top predator): eats blue tits and mice." tabindex="0" role="button" aria-label="Hawk"><circle cx="300" cy="110" r="36" fill="#7c2d12" fill-opacity=".35" stroke="#7c2d12" stroke-width="4"/><text x="300" y="123" text-anchor="middle" font-size="36">🦅</text><text x="344" y="115" font-size="14" font-weight="700" paint-order="stroke" stroke="#fff" stroke-width="4">Hawk</text></g>
