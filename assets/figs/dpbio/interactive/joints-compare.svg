<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 575" class="vd-svg" role="img" aria-labelledby="jt-title jt-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="jt-play" data-vd-play-label="Play: move the joints" data-vd-steps="[[0, &quot;Comparing synovial joints.&quot;], [1, &quot;A hinge joint moves in one plane, like a door.&quot;], [6, &quot;A ball-and-socket joint moves in several planes and can rotate.&quot;], [11, &quot;More planes = greater range of motion.&quot;]]" data-vd-dur="14">
<title id="jt-title">Hinge and ball-and-socket joints</title><desc id="jt-desc">A hinge joint such as the elbow bending in one plane compared with a ball-and-socket joint such as the hip moving in several planes and rotating.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="575" fill="#ffffff"/>
<g aria-hidden="true"><animate id="jt-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<text class="head" x="30" y="34">Hinge versus ball-and-socket joints</text><text class="note" x="30" y="56">Schematic.</text>
<g class="part" data-part="hinge" data-name="Hinge joint (elbow, knee)" data-info="Allows movement in one plane only: flexion and extension." tabindex="0" role="button" aria-label="Hinge joint (elbow, knee)"><rect x="30" y="80" width="500" height="440" rx="16" fill="#f8fafc" stroke="#cbd5e1"/><text x="280" y="108" text-anchor="middle" font-size="15" font-weight="800" fill="#1d4ed8">HINGE (elbow, knee)</text><rect x="250" y="150" width="40" height="160" rx="18" fill="#f5f5f4" stroke="#57534e" stroke-width="3"/><circle cx="270" cy="320" r="26" fill="#e7e5e4" stroke="#57534e" stroke-width="3"/><g transform="rotate(0 270 320)"><animateTransform attributeName="transform" type="rotate" keyTimes="0.0000;0.0714;0.1786;0.2857;0.3929;1.0000" values="0 270 320;0 270 320;-110 270 320;0 270 320;-110 270 320;-60 270 320" dur="14s" begin="jt-play.begin+0s" fill="freeze"/><rect x="250" y="320" width="40" height="160" rx="18" fill="#f5f5f4" stroke="#57534e" stroke-width="3"/></g><text x="280" y="505" text-anchor="middle" font-size="13" font-weight="800" fill="#1d4ed8">one plane: flexion and extension</text></g>
<g class="part" data-part="ball" data-name="Ball-and-socket (hip, shoulder)" data-info="A rounded head in a cup-shaped socket: movement in several planes, including rotation." tabindex="0" role="button" aria-label="Ball-and-socket (hip, shoulder)"><rect x="570" y="80" width="500" height="440" rx="16" fill="#f8fafc" stroke="#cbd5e1"/><text x="820" y="108" text-anchor="middle" font-size="15" font-weight="800" fill="#15803d">BALL-AND-SOCKET (hip, shoulder)</text><path d="M 760 230 A 60 60 0 0 0 880 230" fill="#e7e5e4" stroke="#57534e" stroke-width="6"/><text x="940" y="214" text-anchor="start" font-size="12" font-weight="800" fill="#57534e">socket</text><g><animateTransform attributeName="transform" type="rotate" keyTimes="0.0000;0.4286;0.5143;0.6000;0.6857;0.7714;1.0000" values="0 820 240;0 820 240;40 820 240;-40 820 240;20 820 240;-20 820 240;0 820 240" dur="14s" begin="jt-play.begin+0s" fill="freeze"/><circle cx="820" cy="240" r="42" fill="#f5f5f4" stroke="#57534e" stroke-width="3"/><rect x="800" y="270" width="40" height="200" rx="18" fill="#f5f5f4" stroke="#57534e" stroke-width="3"/></g><g><animate attributeName="opacity" keyTimes="0.0000;0.6786;0.7000;1.0000" values="0;0;1;1" dur="14s" begin="jt-play.begin+0s" fill="freeze"/><ellipse cx="820" cy="470" rx="90" ry="22" fill="none" stroke="#16a34a" stroke-width="3" stroke-dasharray="8 5"/><text x="820" y="505" text-anchor="middle" font-size="13" font-weight="800" fill="#15803d">several planes + rotation</text></g></g>
<g class="part" data-part="rom" data-name="Range of motion" data-info="The ball-and-socket joint has a greater range of motion in more planes." tabindex="0" role="button" aria-label="Range of motion"><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.7857;0.8071;1.0000" values="0;0;1;1" dur="14s" begin="jt-play.begin+0s" fill="freeze"/><rect x="380.0" y="543" width="340" height="24" rx="12" fill="#dcfce7" stroke="#1f2937" stroke-width="1"/><text x="550" y="560" text-anchor="middle" font-size="12" font-weight="700">ball-and-socket: greater range of motion</text></g></g>
</svg>