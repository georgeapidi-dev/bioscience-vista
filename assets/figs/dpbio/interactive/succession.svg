<g class="part" data-part="soil" data-name="Soil depth" data-info="Increases as organic matter builds up and rock weathers." tabindex="0" role="button" aria-label="Soil depth"><g><animate attributeName="opacity" keyTimes="0.0000;0.2188;0.2375;1.0000" values="0;0;1;1" dur="16s" begin="su-play.begin+0s" fill="freeze"/><line x1="310" y1="524" x2="260" y2="450" stroke="#475569" stroke-width="1.5"/><circle cx="310" cy="524" r="3" fill="#475569"/><text x="260" y="442" text-anchor="middle" font-size="12" font-weight="800" fill="#78350f">first thin soil</text></g></g>
