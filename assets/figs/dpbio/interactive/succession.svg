<text class="head" x="30" y="34">Primary succession</text><text class="note" x="30" y="56">Stages blend into each other; times vary from about a century to over a thousand years.</text>
<g class="part" data-part="rock" data-name="Bare rock" data-info="New land with no soil: e.g. after a lava flow, a retreating glacier or a new volcanic island." tabindex="0" role="button" aria-label="Bare rock"><g><animate attributeName="opacity" keyTimes="0.0000;0.0000;0.0187;1.0000" values="0;0;1;1" dur="16s" begin="su-play.begin+0s" fill="freeze"/><rect x="30.0" y="520" width="180" height="120" fill="#94a3b8"/><path d="M 30.0 570 l 20 10 l 10 -12" stroke="#64748b" fill="none" stroke-width="2"/><path d="M 60.0 600 l 20 10 l 10 -12" stroke="#64748b" fill="none" stroke-width="2"/><path d="M 90.0 570 l 20 10 l 10 -12" stroke="#64748b" fill="none" stroke-width="2"/><path d="M 120.0 600 l 20 10 l 10 -12" stroke="#64748b" fill="none" stroke-width="2"/><path d="M 150.0 570 l 20 10 l 10 -12" stroke="#64748b" fill="none" stroke-width="2"/><path d="M 180.0 600 l 20 10 l 10 -12" stroke="#64748b" fill="none" stroke-width="2"/><text x="120" y="660" text-anchor="middle" font-size="14" font-weight="800" fill="#111827">bare rock</text></g></g>
<g><animate attributeName="opacity" keyTimes="0.0000;0.0625;0.0813;1.0000" values="0;0;1;1" dur="16s" begin="su-play.begin+0s" fill="freeze"/><path d="M 216 370 L 244 370" stroke="#475569" stroke-width="3" marker-end="url(#su-475569)"/></g>
<g class="part" data-part="pio" data-name="Pioneer species" data-info="Lichens and mosses: tolerate harsh conditions; they weather the rock and add dead organic matter, starting a thin soil." tabindex="0" role="button" aria-label="Pioneer species"><g><animate attributeName="opacity" keyTimes="0.0000;0.0625;0.0813;1.0000" values="0;0;1;1" dur="16s" begin="su-play.begin+0s" fill="freeze"/><rect x="220.0" y="520" width="180" height="120" fill="#94a3b8"/><path d="M 220.0 570 l 20 10 l 10 -12" stroke="#64748b" fill="none" stroke-width="2"/><path d="M 250.0 600 l 20 10 l 10 -12" stroke="#64748b" fill="none" stroke-width="2"/><path d="M 280.0 570 l 20 10 l 10 -12" stroke="#64748b" fill="none" stroke-width="2"/><path d="M 310.0 600 l 20 10 l 10 -12" stroke="#64748b" fill="none" stroke-width="2"/><path d="M 340.0 570 l 20 10 l 10 -12" stroke="#64748b" fill="none" stroke-width="2"/><path d="M 370.0 600 l 20 10 l 10 -12" stroke="#64748b" fill="none" stroke-width="2"/><rect x="220.0" y="520" width="180" height="8" fill="#78350f"/><rect x="220.0" y="520" width="180" height="8" fill="#3f2a14"/><ellipse cx="240" cy="516" rx="10" ry="5" fill="#facc15" stroke="#4d7c0f"/><ellipse cx="262" cy="516" rx="10" ry="5" fill="#a3e635" stroke="#4d7c0f"/><ellipse cx="284" cy="516" rx="10" ry="5" fill="#facc15" stroke="#4d7c0f"/><ellipse cx="306" cy="516" rx="10" ry="5" fill="#a3e635" stroke="#4d7c0f"/><ellipse cx="328" cy="516" rx="10" ry="5" fill="#facc15" stroke="#4d7c0f"/><ellipse cx="350" cy="516" rx="10" ry="5" fill="#a3e635" stroke="#4d7c0f"/><ellipse cx="372" cy="516" rx="10" ry="5" fill="#facc15" stroke="#4d7c0f"/><text x="310" y="660" text-anchor="middle" font-size="14" font-weight="800" fill="#111827">pioneers</text></g></g>
