<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 680" class="vd-svg" role="img" aria-labelledby="su-title su-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="su-play" data-vd-play-label="Play: hundreds of years" data-vd-steps="[[0, &quot;Primary succession: from bare rock to forest.&quot;], [1, &quot;Pioneer species such as lichens and mosses colonise bare rock.&quot;], [3.5, &quot;They weather the rock and add dead matter: the first thin soil.&quot;], [5.5, &quot;Grasses and herbs grow in the thin soil.&quot;], [8, &quot;Shrubs follow, then fast-growing trees.&quot;], [11, &quot;Finally a stable climax community, such as oak forest.&quot;], [13.5, &quot;Soil, biomass and biodiversity all increase. This takes hundreds of years or more.&quot;]]" data-vd-dur="16">
<title id="su-title">Primary succession</title><desc id="su-desc">Primary succession from bare rock: pioneer lichens and mosses, grasses and herbs, shrubs, young trees and a climax forest community, with soil depth, biomass and biodiversity increasing over time.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1220" height="680" fill="#ffffff"/>
<g aria-hidden="true"><animate id="su-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
