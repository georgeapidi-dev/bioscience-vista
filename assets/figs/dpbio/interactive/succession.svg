<g class="part" data-part="clim" data-name="Climax community" data-info="A stable community (e.g. oak forest) that changes little unless disturbed. Its type depends on the climate." tabindex="0" role="button" aria-label="Climax community"><g><animate attributeName="opacity" keyTimes="0.0000;0.6875;0.7063;1.0000" values="0;0;1;1" dur="16s" begin="su-play.begin+0s" fill="freeze"/><rect x="990.0" y="520" width="180" height="120" fill="#94a3b8"/><path d="M 990.0 570 l 20 10 l 10 -12" stroke="#64748b" fill="none" stroke-width="2"/><path d="M 1020.0 600 l 20 10 l 10 -12" stroke="#64748b" fill="none" stroke-width="2"/><path d="M 1050.0 570 l 20 10 l 10 -12" stroke="#64748b" fill="none" stroke-width="2"/><path d="M 1080.0 600 l 20 10 l 10 -12" stroke="#64748b" fill="none" stroke-width="2"/><path d="M 1110.0 570 l 20 10 l 10 -12" stroke="#64748b" fill="none" stroke-width="2"/><path d="M 1140.0 600 l 20 10 l 10 -12" stroke="#64748b" fill="none" stroke-width="2"/><rect x="990.0" y="520" width="180" height="100" fill="#78350f"/><rect x="990.0" y="520" width="180" height="8" fill="#3f2a14"/><path d="M 1000 520 l 0 -25" stroke="#65a30d" stroke-width="3"/><path d="M 1012 520 l 4 -14" stroke="#65a30d" stroke-width="3"/><path d="M 1024 520 l 3 -21" stroke="#65a30d" stroke-width="3"/><path d="M 1036 520 l -4 -19" stroke="#65a30d" stroke-width="3"/><path d="M 1048 520 l -3 -25" stroke="#65a30d" stroke-width="3"/><path d="M 1060 520 l 3 -21" stroke="#65a30d" stroke-width="3"/><path d="M 1072 520 l 2 -17" stroke="#65a30d" stroke-width="3"/><path d="M 1084 520 l -1 -14" stroke="#65a30d" stroke-width="3"/><path d="M 1096 520 l -1 -27" stroke="#65a30d" stroke-width="3"/><path d="M 1108 520 l 0 -19" stroke="#65a30d" stroke-width="3"/><path d="M 1120 520 l 2 -19" stroke="#65a30d" stroke-width="3"/><path d="M 1132 520 l -3 -18" stroke="#65a30d" stroke-width="3"/><path d="M 1144 520 l 3 -18" stroke="#65a30d" stroke-width="3"/><path d="M 1156 520 l -2 -14" stroke="#65a30d" stroke-width="3"/><el