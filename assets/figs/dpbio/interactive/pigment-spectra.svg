<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 600" class="vd-svg" role="img" aria-labelledby="cs-title cs-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="cs-play" data-vd-play-label="Play: draw the spectra" data-vd-steps="[[0, &quot;Absorption spectra: how much light of each wavelength each pigment absorbs.&quot;], [1, &quot;Chlorophyll a absorbs most strongly in the blue-violet and the red.&quot;], [3.5, &quot;Chlorophyll b absorbs at slightly different wavelengths, widening the range.&quot;], [5.5, &quot;Carotenoids absorb blue and blue-green light.&quot;], [7.5, &quot;Little green light is absorbed: it is reflected, so leaves look green.&quot;], [9.5, &quot;The action spectrum of photosynthesis follows the absorption spectra.&quot;]]" data-vd-dur="12">
<title id="cs-title">Absorption and action spectra</title><desc id="cs-desc">Absorption spectra of chlorophyll a, chlorophyll b and carotenoids from 400 to 700 nm, with the action spectrum of photosynthesis and a visible-light colour bar.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="600" fill="#ffffff"/>
<g aria-hidden="true"><animate id="cs-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
