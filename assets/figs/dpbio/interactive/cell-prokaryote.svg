<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" class="vd-svg" role="img" aria-labelledby="pk-title pk-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="pk-play" data-vd-play-label="Play: binary fission" data-vd-steps="[[0, &quot;The circular DNA is copied; each copy attaches to the membrane.&quot;], [3, &quot;The cell grows longer and the copies move apart.&quot;], [5.5, &quot;The membrane and wall grow inwards across the middle.&quot;], [8, &quot;Two identical daughter cells separate: binary fission. Plasmids are copied too.&quot;]]" data-vd-dur="11">
<title id="pk-title">A prokaryotic cell (bacterium)</title><desc id="pk-desc">A rod-shaped bacterium with capsule, peptidoglycan cell wall, plasma membrane, cytoplasm, 70S ribosomes, circular DNA in the nucleoid, plasmids, pili and a flagellum.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="620" fill="#ffffff"/>
<g aria-hidden="true"><animate id="pk-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<text class="head" x="30" y="36">Prokaryotic cell (bacterium)</text><text class="note" x="30" y="58">About 2 µm long. No nucleus and no membrane-bound organelles.</text>
<g transform="translate(550 320)"><g><animateTransform attributeName="transform" type="scale" values="1 1;1 1;1.12 1;1.12 1" keyTimes="0;0.27;0.5;1" dur="11s" begin="pk-play.begin+0s" additive="sum"/><g transform="translate(-550 -320)"><g class="part" data-part="cap" data-name="Capsule (slime layer)" data-info="Sticky outer layer of some bacteria: protects against drying out and against white blood cells, and helps them stick to surfaces." tabindex="0" role="button" aria-label="Capsule (slime layer)"><rect x="274" y="194" width="552" height="252" rx="126.0" fill="#fef9c3" stroke="#ca8a04" stroke-width="2" stroke-dasharray="6 4"/></g><g class="part" data-part="wall" data-name="Cell wall (peptidoglycan)" data-info="Rigid wall made of peptidoglycan (murein), not cellulose: keeps the shape and stops the cell bursting." tabindex="0" role="button" aria-label="Cell wall (peptidoglycan)"><rect x="286" y="206" width="528" height="228" rx="114.0" fill="#fcd34d" stroke="#92400e" stroke-width="3"/></g><g class="part" data-part="mem" data-name="Plasma membrane" data-info="Controls what enters and leaves; respiration enzymes are on it, because there are no mitochondria." tabindex="0" role="button" aria-label="Plasma membrane"><rect x="296" y="216" width="508" height="208" rx="104.0" fill="#fde68a" stroke="#be185d" stroke-width="3"/></g><g class="part" data-part="cyt" data-name="Cytoplasm" data-info="Where all the cell’s reactions happen: no membrane-bound organelles." tabindex="0" role="button" aria-label="Cytoplasm"><rect x="300" y="220" width="500" height="200" rx="100.0" fill="#fff7ed"/></g><g class="part" data-part="rib" data-name="70S ribosomes" data-info="Smaller than eukaryotic (80S) ribosomes; make proteins." tabindex="0" role="button" aria-label="70S ribosomes"><circle cx="761" cy="254" r="3" fill="#334155"/><circle cx="366" cy="261" r="3" fill="#334155"/><circle cx="504" cy="283" r="3" fill="#334155"/><circle cx="696" cy="318" r="3" fill="#334155"/><circle cx="448" cy="395" r="3" fill="#334155"/><circle cx="428" cy="395" r="3" fill="#334155"/><circle cx="338" cy="388" r="3" fill="#334155"/><circle cx="668" cy="280" r="3" fill="#334155"/><circle cx="540" cy="340" r="3" fill="#334155"/><circle cx="731" cy="370" r="3" fill="#334155"/><circle cx="510" cy="379" r="3" fill="#334155"/><circle cx="547" cy="368" r="3" fill="#334155"/><circle cx="457" cy="249" r="3" fill="#334155"/><circle cx="765" cy="247" r="3" fill="#334155"/><circle cx="506" cy="359" r="3" fill="#334155"/><circle cx="483" cy="337" r="3" fill="#334155"/><circle cx="536" cy="374" r="3" fill="#334155"/><circle cx="404" cy="383" r="3" fill="#334155"/><circle cx="410" cy="300" r="3" fill="#334155"/><circle cx="438" cy="246" r="3" fill="#334155"/><circle cx="410" cy="323" r="3" fill="#334155"/><circle cx="408" cy="274" r="3" fill="#334155"/><circle cx="581" cy="370" r="3" fill="#334155"/><circle cx="504" cy="371" r="3" fill="#334155"/><circle cx="665" cy="383" r="3" fill="#334155"/><circle cx="413" cy="354" r="3" fill="#334155"/><circle cx="727" cy="346" r="3" fill="#334155"/><circle cx="696" cy="374" r="3" fill="#334155"/><circle cx="710" cy="333" r="3" fill="#334155"/><circle cx="724" cy="391" r="3" fill="#334155"/><circle cx="501" cy="332" r="3" fill="#334155"/><circle cx="759" cy="354" r="3" fill="#334155"/><circle cx="402" cy="342" r="3" fill="#334155"/><circle cx="686" cy="358" r="3" fill="#334155"/><circle cx="655" cy="375" r="3" fill="#334155"/><circle cx="447" cy="365" r="3" fill="#334155"/><circle cx="462" cy="367" r="3" fill="#334155"/><circle cx="576" cy="371" r="3" fill="#334155"/><circle cx="745" cy="330" r="3" fill="#334155"/><circle cx="658" cy="356" r="3" fill="#334155"/><circle cx="780" cy="358" r="3" fill="#334155"/><circle cx="499" cy="385" r="3" fill="#334155"/><circle cx="691" cy="382" r="3" fill="#334155"/><circle cx="690" cy="356" r="3" fill="#334155"/><circle cx="569" cy="296" r="3" fill="#334155"/><circle cx="486" cy="282" r="3" fill="#334155"/><circle cx="768" cy="397" r="3" fill="#334155"/><circle cx="457" cy="362" r="3" fill="#334155"/><circle cx="478" cy="317" r="3" fill="#334155"/><circle cx="729" cy="369" r="3" fill="#334155"/><circle cx="607" cy="372" r="3" fill="#334155"/><circle cx="579" cy="397" r="3" fill="#334155"/><circle cx="621" cy="344" r="3" fill="#334155"/><circle cx="479" cy="293" r="3" fill="#334155"/><circle cx="570" cy="371" r="3" fill="#334155"/><circle cx="507" cy="399" r="3" fill="#334155"/><circle cx="771" cy="259" r="3" fill="#334155"/><circle cx="721" cy="327" r="3" fill="#334155"/><circle cx="691" cy="242" r="3" fill="#334155"/><circle cx="737" cy="288" r="3" fill="#334155"/><circle cx="701" cy="267" r="3" fill="#334155"/><circle cx="350" cy="387" r="3" fill="#334155"/><circle cx="654" cy="252" r="3" fill="#334155"/><circle cx="459" cy="391" r="3" fill="#334155"/><circle cx="436" cy="267" r="3" fill="#334155"/><circle cx="706" cy="373" r="3" fill="#334155"/><circle cx="389" cy="308" r="3" fill="#334155"/><circle cx="445" cy="293" r="3" fill="#334155"/><circle cx="770" cy="255" r="3" fill="#334155"/><circle cx="536" cy="248" r="3" fill="#334155"/></g><g class="part" data-part="nuc" data-name="Nucleoid (circular DNA)" data-info="One large circular chromosome of naked DNA (no histones), not inside a nucleus." tabindex="0" role="button" aria-label="Nucleoid (circular DNA)"><path d="M 470 300 C 500 260 540 340 570 300 C 600 260 640 340 660 310 C 680 280 640 260 600 280 C 560 300 520 360 480 340 C 450 325 450 315 470 300 Z" fill="none" stroke="#7c3aed" stroke-width="4"/></g><g class="part" data-part="pla" data-name="Plasmids" data-info="Small extra loops of DNA; may carry genes such as antibiotic resistance and can be passed to other bacteria." tabindex="0" role="button" aria-label="Plasmids"><circle cx="370" cy="270" r="16" fill="none" stroke="#db2777" stroke-width="3"/><circle cx="730" cy="370" r="13" fill="none" stroke="#db2777" stroke-width="3"/></g></g></g></g>
<g class="part" data-part="pil" data-name="Pili" data-info="Thin protein threads used to attach to surfaces and to other bacteria (to pass on plasmids)." tabindex="0" role="button" aria-label="Pili"><path d="M 420 196 l -10 -60" stroke="#78716c" stroke-width="2.5"/><path d="M 520 194 l 6 -62" stroke="#78716c" stroke-width="2.5"/><path d="M 640 196 l 14 -58" stroke="#78716c" stroke-width="2.5"/><path d="M 450 446 l -12 56" stroke="#78716c" stroke-width="2.5"/><path d="M 600 446 l 10 58" stroke="#78716c" stroke-width="2.5"/></g>
<g class="part" data-part="fla" data-name="Flagellum" data-info="Long whip-like tail that rotates to move the bacterium. Not all bacteria have one." tabindex="0" role="button" aria-label="Flagellum"><path d="M 826 320 C 880 280 900 360 950 320 C 1000 280 1020 360 1070 320" fill="none" stroke="#475569" stroke-width="4"/></g>
<g class="labels"><g class="lbl" data-for="cap"><polyline points="217.7,144.0 300.0,194.0"/><circle cx="300.0" cy="194.0" r="2.6"/><text x="30" y="150" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="4">Capsule (slime layer)</text></g><g class="lbl" data-for="wall"><polyline points="252.5,244.0 288.0,300.0"/><circle cx="288.0" cy="300.0" r="2.6"/><text x="30" y="250" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="4">Cell wall (peptidoglycan)</text></g><g class="lbl" data-for="mem"><polyline points="165.5,334.0 296.0,360.0"/><circle cx="296.0" cy="360.0" r="2.6"/><text x="30" y="340" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="4">Plasma membrane</text></g><g class="lbl" data-for="cyt"><polyline points="113.3,424.0 340.0,390.0"/><circle cx="340.0" cy="390.0" r="2.6"/><text x="30" y="430" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="4">Cytoplasm</text></g><g class="lbl" data-for="pil"><polyline points="69.8,104.0 420.0,160.0"/><circle cx="420.0" cy="160.0" r="2.6"/><text x="30" y="110" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="4">Pili</text></g><g class="lbl" data-for="nuc"><polyline points="873.6,224.0 660.0,310.0"/><circle cx="660.0" cy="310.0" r="2.6"/><text x="1070" y="230" text-anchor="end" paint-order="stroke" stroke="#fff" stroke-width="4">Nucleoid: circular DNA</text></g><g class="lbl" data-for="pla"><polyline points="1004.1,414.0 743.0,370.0"/><circle cx="743.0" cy="370.0" r="2.6"/><text x="1070" y="420" text-anchor="end" paint-order="stroke" stroke="#fff" stroke-width="4">Plasmid</text></g><g class="lbl" data-for="rib"><polyline points="951.9,174.0 700.0,260.0"/><circle cx="700.0" cy="260.0" r="2.6"/><text x="1070" y="180" text-anchor="end" paint-order="stroke" stroke="#fff" stroke-width="4">70S ribosomes</text></g><g class="lbl" data-for="fla"><polyline points="986.7,514.0 1000.0,520.0 950.0,320.0"/><circle cx="950.0" cy="320.0" r="2.6"/><text x="1070" y="520" text-anchor="end" paint-order="stroke" stroke="#fff" stroke-width="4">Flagellum</text></g></g>
<g aria-hidden="true" pointer-events="none" opacity="0"><set attributeName="opacity" to="1" begin="pk-play.begin+5.5s" dur="5.5s"/><path d="M 550 190 L 550 230 M 550 450 L 550 410" stroke="#92400e" stroke-width="8"><animate attributeName="d" values="M 550 190 L 550 230 M 550 450 L 550 410;M 550 190 L 550 320 M 550 450 L 550 320" dur="2.5s" begin="pk-play.begin+5.5s" fill="freeze"/></path></g><g aria-hidden="true" pointer-events="none" opacity="0"><set attributeName="opacity" to="1" begin="pk-play.begin+0.5s" dur="10.5s"/><path d="M 470 300 C 440 250 400 300 430 330" fill="none" stroke="#7c3aed" stroke-width="4"><animateTransform attributeName="transform" type="translate" values="0 0;0 0;-60 0" keyTimes="0;0.2;1" dur="5s" begin="pk-play.begin+0.5s" fill="freeze"/></path></g>
</svg>