<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" class="vd-svg" role="img" aria-labelledby="mt-title mt-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="mt-play" data-vd-play-label="Play: break down, build up" data-vd-steps="[[0, &quot;Metabolism = catabolism + anabolism.&quot;], [1, &quot;Catabolism: large molecules are broken down and energy is released.&quot;], [5, &quot;The released energy is stored in ATP.&quot;], [7.5, &quot;Anabolism: ATP supplies energy to build large molecules from small ones.&quot;], [11.5, &quot;Every step is catalysed by an enzyme.&quot;]]" data-vd-dur="14">
<title id="mt-title">Metabolism: catabolism and anabolism</title><desc id="mt-desc">Catabolism breaks large molecules into small ones and releases energy, which is captured in ATP; anabolism uses energy from ATP to assemble small molecules into large ones.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="560" fill="#ffffff"/>
<g aria-hidden="true"><animate id="mt-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
