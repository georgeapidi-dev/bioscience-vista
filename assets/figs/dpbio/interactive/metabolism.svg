<text class="head" x="30" y="34">Metabolism: catabolism and anabolism</text><text class="note" x="30" y="56">Each bead = a monomer (e.g. glucose or an amino acid).</text>
<rect x="30" y="90" width="1040" height="190" rx="16" fill="#fff7ed" stroke="#fdba74"/><text x="50" y="118" text-anchor="start" font-size="16" font-weight="800" fill="#c2410c">CATABOLISM — large → small, energy RELEASED</text>
