<g class="part" data-part="atp" data-name="ATP links them" data-info="Energy released by catabolism is used to make ATP; ATP supplies energy for anabolism." tabindex="0" role="button" aria-label="ATP links them"><g><animate attributeName="opacity" keyTimes="0.0000;0.3571;0.3786;1.0000" values="0;0;1;1" dur="14s" begin="mt-play.begin+0s" fill="freeze"/><rect x="380" y="300" width="340" height="56" rx="28" fill="#fef9c3" stroke="#eab308" stroke-width="3"/><text x="550" y="335" text-anchor="middle" font-size="17" font-weight="800" fill="#713f12">energy → ATP → energy</text><path d="M 520 286 L 520 298" stroke="#dc2626" stroke-width="4" marker-end="url(#mt-dc2626)"/><path d="M 580 358 L 580 384" stroke="#16a34a" stroke-width="4" marker-end="url(#mt-16a34a)"/></g></g>
<rect x="30" y="390" width="1040" height="150" rx="16" fill="#f0fdf4" stroke="#86efac"/><text x="50" y="418" text-anchor="start" font-size="16" font-weight="800" fill="#15803d">ANABOLISM — small → large, energy REQUIRED</text>
<g class="part" data-part="ana" data-name="Anabolism" data-info="Building large molecules from small ones; requires energy. e.g. protein synthesis, photosynthesis, glycogen formation (condensation)." tabindex="0" role="button" aria-label="Anabolism"><g transform="translate(640 470)"><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.5714;0.7500;1.0000" values="640 470;640 470;150 470;150 470" dur="14s" begin="mt-play.begin+0s" fill="freeze"/><circle cx="0" cy="0" r="17" fill="#93c5fd" stroke="#166534" stroke-width="2"/></g><g transform="translate(730 470)"><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.5714;0.7500;1.0000" values="730 470;730 470;190 470;190 470" dur="14s" begin="mt-play.begin+0s" fill="freeze"/><circle cx="0" cy="0" r="17" fill="#93c5fd" stroke="#166534" stroke-width="2"/></g><g transform="translate(820 470)"><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.5714;0.7500;1.0000" values="820 470;820 470;230 470;230 470" dur="14s" begin="mt-play.begin+0s" fill="freeze"/><circle cx="0" cy="0" r="17" fill="#93c5fd" stroke="#166534" stroke-width="2"/></g><g transform="translate(910 470)"><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.5714;0.7500;1.0000" values="910 470;910 470;270 470;270 470" dur="14s" begin="mt-play.begin+0s" fill="freeze"/><circle cx="0" cy="0" r="17" fill="#93c5fd" stroke="#166534" stroke-width="2"/></g><g><animate attributeName="opacity" keyTimes="0.0000;0.7500;0.7714;1.0000" values="0;0;1;1" dur="14s" begin="mt-play.begin+0s" fill="freeze"/><line x1="167" y1="470" x2="173" y2="470" stroke="#1d4ed8" stroke-width="4"/><line x1="207" y1="470" x2="213" y2="470" stroke="#1d4ed8" stroke-width="4"/><line x1="247" y1="470" x2="253" y2="470" stroke="#1d4ed8" stroke-width="4"/></g><path d="M 560 470 L 340 470" stroke="#475569" stroke-width="4" marker-end="url(#mt-475569)"/><text x="450" y="455" text-anchor="middle" font-size="12" font-weight="800" fill="#475569">enzymes + energy</text><text x="210" y="520" text-anchor="middle" font-size="12" font-weight="700" fill="#475569">e.g. protein, glycogen</text><text x="770" y="520" text-anchor="middle" font-size="12" font-weight="700" fill="#475569">e.g. amino acids, glucose</text></g>
<g class="part" data-part="met" data-name="Metabolism" data-info="The web of all the enzyme-catalysed reactions in a cell or organism: catabolism + anabolism." tabindex="0" role="button" aria-label="Metabolism"><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.8214;0.8429;1.0000" values="0;0;1;1" dur="14s" begin="mt-play.begin+0s" fill="freeze"/><rect x="750.0" y="323" width="300" height="24" rx="12" fill="#e0e7ff" stroke="#1f2937" stroke-width="1"/><text x="900" y="340" text-anchor="middle" font-size="12" font-weight="700">metabolism = catabolism + anabolism</text></g></g>
</svg>