<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" class="vd-svg" role="img" aria-labelledby="hp-title hp-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="hp-play" data-vd-play-label="Play: fill the grid" data-vd-steps="[[0, &quot;Haemophilia: an X-linked recessive condition.&quot;], [1, &quot;Carrier mother \u00d7 normal father.&quot;], [3.5, &quot;Fill the Punnett grid.&quot;], [8, &quot;Each son has a 1/2 chance of haemophilia; each daughter a 1/2 chance of being a carrier.&quot;]]" data-vd-dur="13">
<title id="hp-title">Haemophilia: sex linkage</title><desc id="hp-desc">A Punnett grid for a carrier mother and a normal father: daughters are normal or carriers, sons are normal or have haemophilia, each with probability one half.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="560" fill="#ffffff"/>
<g aria-hidden="true"><animate id="hp-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<text class="head" x="30" y="34">Haemophilia: an X-linked recessive allele</text><text class="note" x="30" y="56">Xᴴ = normal clotting factor allele; Xʰ = haemophilia allele.</text>
<g class="part" data-part="par" data-name="Parents" data-info="Carrier mother XᴴXʰ × normal father XᴴY." tabindex="0" role="button" aria-label="Parents"><rect x="110.0" y="85.0" width="300" height="50" rx="12" fill="#fce7f3" stroke="#9d174d" stroke-width="2"/><text x="260" y="114.66666666666667" text-anchor="middle" font-size="14" font-weight="800" fill="#111827">carrier mother XᴴXʰ</text><rect x="610.0" y="85.0" width="300" height="50" rx="12" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/><text x="760" y="114.66666666666667" text-anchor="middle" font-size="14" font-weight="800" fill="#111827">normal father XᴴY</text></g>
<g class="part" data-part="grid" data-name="Punnett grid" data-info="Gametes: mother Xᴴ or Xʰ; father Xᴴ or Y." tabindex="0" role="button" aria-label="Punnett grid"><text x="410.0" y="174" text-anchor="middle" font-size="16" font-weight="800" fill="#1d4ed8">Xᴴ</text><text x="570.0" y="174" text-anchor="middle" font-size="16" font-weight="800" fill="#1d4ed8">Y</text><text x="300" y="266.0" text-anchor="middle" font-size="16" font-weight="800" fill="#9d174d">Xᴴ</text><text x="300" y="426.0" text-anchor="middle" font-size="16" font-weight="800" fill="#9d174d">Xʰ</text><rect x="330" y="180" width="160" height="160" fill="#fff" stroke="#334155" stroke-width="2"/><g><animate attributeName="opacity" keyTimes="0.0000;0.2692;0.2923;1.0000" values="0;0;1;1" dur="13s" begin="hp-play.begin+0s" fill="freeze"/><rect x="334" y="184" width="152" height="152" fill="#fce7f3"/><text x="410.0" y="260.0" text-anchor="middle" font-size="20" font-weight="800" fill="#111827">XᴴXᴴ</text><text x="410.0" y="288.0" text-anchor="middle" font-size="12" font-weight="800" fill="#475569">normal girl</text></g><rect x="490" y="180" width="160" height="160" fill="#fff" stroke="#334155" stroke-width="2"/><g><animate attributeName="opacity" keyTimes="0.0000;0.3462;0.3692;1.0000" values="0;0;1;1" dur="13s" begin="hp-play.begin+0s" fill="freeze"/><rect x="494" y="184" width="152" height="152" fill="#dbeafe"/><text x="570.0" y="260.0" text-anchor="middle" font-size="20" font-weight="800" fill="#111827">XᴴY</text><text x="570.0" y="288.0" text-anchor="middle" font-size="12" font-weight="800" fill="#475569">normal boy</text></g><rect x="330" y="340" width="160" height="160" fill="#fff" stroke="#334155" stroke-width="2"/><g><animate attributeName="opacity" keyTimes="0.0000;0.4231;0.4462;1.0000" values="0;0;1;1" dur="13s" begin="hp-play.begin+0s" fill="freeze"/><rect x="334" y="344" width="152" height="152" fill="#fbcfe8"/><text x="410.0" y="420.0" text-anchor="middle" font-size="20" font-weight="800" fill="#111827">XᴴXʰ</text><text x="410.0" y="448.0" text-anchor="middle" font-size="12" font-weight="800" fill="#475569">carrier girl</text></g><rect x="490" y="340" width="160" height="160" fill="#fff" stroke="#334155" stroke-width="2"/><g><animate attributeName="opacity" keyTimes="0.0000;0.5000;0.5231;1.0000" values="0;0;1;1" dur="13s" begin="hp-play.begin+0s" fill="freeze"/><rect x="494" y="344" width="152" height="152" fill="#fecaca"/><text x="570.0" y="420.0" text-anchor="middle" font-size="20" font-weight="800" fill="#111827">XʰY</text><text x="570.0" y="448.0" text-anchor="middle" font-size="12" font-weight="800" fill="#475569">haemophilia boy</text></g></g>
<g class="part" data-part="res" data-name="Outcome" data-info="Daughters: 1/2 normal (XᴴXᴴ), 1/2 carriers (XᴴXʰ). Sons: 1/2 normal (XᴴY), 1/2 haemophilia (XʰY): one recessive allele is enough because there is no second X." tabindex="0" role="button" aria-label="Outcome"><g><animate attributeName="opacity" keyTimes="0.0000;0.6154;0.6385;1.0000" values="0;0;1;1" dur="13s" begin="hp-play.begin+0s" fill="freeze"/><rect x="700" y="180" width="370" height="250" rx="16" fill="#f8fafc" stroke="#cbd5e1"/><text x="885" y="210" text-anchor="middle" font-size="15" font-weight="800" fill="#111827">outcome</text><text x="885" y="250" text-anchor="middle" font-size="13" font-weight="800" fill="#b91c1c">sons: 1/2 normal, 1/2 haemophilia</text><text x="885" y="280" text-anchor="middle" font-size="13" font-weight="800" fill="#9d174d">daughters: 1/2 normal, 1/2 carriers</text><text x="885" y="330" text-anchor="middle" font-size="12" font-weight="700" fill="#475569">males have one X: a single</text><text x="885" y="350" text-anchor="middle" font-size="12" font-weight="700" fill="#475569">recessive allele is expressed</text></g></g>
</svg>