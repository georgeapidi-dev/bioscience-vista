<g class="part" data-part="hor" data-name="Hormones and hazards" data-info="The placenta secretes progesterone, oestradiol and hCG. Some harmful substances (alcohol, nicotine, some viruses and drugs) can cross." tabindex="0" role="button" aria-label="Hormones and hazards"><g><animate attributeName="opacity" keyTimes="0.0000;0.7500;0.7714;1.0000" values="0;0;1;1" dur="14s" begin="pc-play.begin+0s" fill="freeze"/><rect x="770" y="380" width="300" height="150" rx="14" fill="#fefce8" stroke="#fde047"/><text x="920" y="406" text-anchor="middle" font-size="13" font-weight="800" fill="#a16207">secretes</text><text x="920" y="428" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">progesterone, oestradiol, hCG</text><text x="920" y="466" text-anchor="middle" font-size="13" font-weight="800" fill="#b91c1c">can cross (harmful):</text><text x="920" y="488" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">alcohol, nicotine, some</text><text x="920" y="506" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">viruses and drugs</text></g></g>
