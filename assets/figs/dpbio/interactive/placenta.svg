<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" class="vd-svg" role="img" aria-labelledby="pc-title pc-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="pc-play" data-vd-play-label="Play: exchange" data-vd-steps="[[0, &quot;The placenta: exchange without mixing blood.&quot;], [1, &quot;Foetal blood vessels in villi, bathed in maternal blood.&quot;], [4, &quot;Oxygen and nutrients pass to the foetus...&quot;], [7.5, &quot;...CO\u2082 and urea pass to the mother.&quot;], [10.5, &quot;It also secretes hormones; some harmful substances cross.&quot;]]" data-vd-dur="14">
<title id="pc-title">The placenta</title><desc id="pc-desc">Foetal blood in capillaries inside placental villi bathed in maternal blood: oxygen, glucose, amino acids and antibodies diffuse to the foetus and carbon dioxide and urea to the mother; the placenta secretes hormones and some harmful substances can cross.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="560" fill="#ffffff"/>
<g aria-hidden="true"><animate id="pc-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<text class="head" x="30" y="34">The placenta</text><text class="note" x="30" y="56">Schematic: maternal blood space with villi.</text>
<g class="part" data-part="vil" data-name="Placental villi" data-info="Foetal blood flows through villi with a large surface area and thin walls, bathed in maternal blood. The two bloods do not mix." tabindex="0" role="button" aria-label="Placental villi"><rect x="40" y="90" width="700" height="380" rx="20" fill="#fecaca" stroke="#b91c1c" stroke-width="2"/><text x="80" y="120" text-anchor="start" font-size="13" font-weight="800" fill="#991b1b">maternal blood</text><path d="M 120 470 L 120 220 Q 150 160 180 220 L 180 470" fill="#fde68a" stroke="#a16207" stroke-width="3"/><path d="M 135 470 L 135 230 Q 150 200 165 230 L 165 470" fill="none" stroke="#7c3aed" stroke-width="5"/><path d="M 250 470 L 250 220 Q 280 160 310 220 L 310 470" fill="#fde68a" stroke="#a16207" stroke-width="3"/><path d="M 265 470 L 265 230 Q 280 200 295 230 L 295 470" fill="none" stroke="#7c3aed" stroke-width="5"/><path d="M 380 470 L 380 220 Q 410 160 440 220 L 440 470" fill="#fde68a" stroke="#a16207" stroke-width="3"/><path d="M 395 470 L 395 230 Q 410 200 425 230 L 425 470" fill="none" stroke="#7c3aed" stroke-width="5"/><path d="M 510 470 L 510 220 Q 540 160 570 220 L 570 470" fill="#fde68a" stroke="#a16207" stroke-width="3"/><path d="M 525 470 L 525 230 Q 540 200 555 230 L 555 470" fill="none" stroke="#7c3aed" stroke-width="5"/><path d="M 640 470 L 640 220 Q 670 160 700 220 L 700 470" fill="#fde68a" stroke="#a16207" stroke-width="3"/><path d="M 655 470 L 655 230 Q 670 200 685 230 L 685 470" fill="none" stroke="#7c3aed" stroke-width="5"/><text x="390" y="505" text-anchor="middle" font-size="12" font-weight="800" fill="#6d28d9">villi with foetal capillaries (purple) → umbilical cord</text></g>
