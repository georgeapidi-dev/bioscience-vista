<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 640" class="vd-svg" role="img" aria-labelledby="ab-title ab-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="ab-play" data-vd-play-label="Play: the cross" data-vd-steps="[[0, &quot;ABO blood groups are controlled by one gene with three alleles: I^A, I^B and i.&quot;], [1.5, &quot;Cross: a group A parent (I^A i) \u00d7 a group B parent (I^B i).&quot;], [3, &quot;Each parent makes two kinds of gamete in equal numbers.&quot;], [5, &quot;The Punnett square fills in: I^A I^B, I^A i, I^B i and i i.&quot;], [9, &quot;I^A and I^B are codominant, so I^A I^B is group AB. Ratio 1 AB : 1 A : 1 B : 1 O.&quot;]]" data-vd-dur="14">
<title id="ab-title">ABO blood groups: codominance</title><desc id="ab-desc">A Punnett square for a cross between I^A i and I^B i parents, giving groups AB, A, B and O in a 1:1:1:1 ratio, with the antigens on each red blood cell.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="640" fill="#ffffff"/>
<g aria-hidden="true"><animate id="ab-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<text class="head" x="30" y="34">ABO blood groups: multiple alleles and codominance</text><text class="note" x="30" y="56">Iᴬ and Iᴮ are codominant; i is recessive.</text>
<g class="part" data-part="alleles" data-name="Alleles I^A, I^B and i" data-info="I^A and I^B are codominant: both are expressed in a heterozygote. i is recessive to both." tabindex="0" role="button" aria-label="Alleles I^A, I^B and i"><g font-size="15"><text x="40" y="100" font-weight="800">Alleles:</text><text x="130" y="100">I<tspan baseline-shift="super" font-size="70%">A</tspan>, I<tspan baseline-shift="super" font-size="70%">B</tspan> (codominant), i (recessive)</text></g></g>
<g class="part" data-part="cross" data-name="The cross" data-info="A heterozygous group A parent (I^A i) and a heterozygous group B parent (I^B i)." tabindex="0" role="button" aria-label="The cross"><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.1071;0.1286;1.0000" values="0;0;1;1" dur="14s" begin="ab-play.begin+0s" fill="freeze"/><text x="40" y="150" font-size="18" font-weight="800">Parents:</text><text x="160" y="150" font-size="18">group A (I<tspan baseline-shift="super" font-size="70%">A</tspan> i)  ×  group B (I<tspan baseline-shift="super" font-size="70%">B</tspan> i)</text></g></g>
<rect x="260" y="280" width="240" height="240" fill="#fff" stroke="#1f2937" stroke-width="2"/><line x1="380" y1="280" x2="380" y2="520" stroke="#1f2937" stroke-width="2"/><line x1="260" y1="400" x2="500" y2="400" stroke="#1f2937" stroke-width="2"/>
<g class="part" data-part="gam" data-name="Gametes" data-info="Each parent passes on one of its two alleles, with equal probability." tabindex="0" role="button" aria-label="Gametes"><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.2143;0.2357;1.0000" values="0;0;1;1" dur="14s" begin="ab-play.begin+0s" fill="freeze"/><circle cx="320.0" cy="240" r="28" fill="#fde68a" stroke="#92400e" stroke-width="2"/><text x="320.0" y="247" text-anchor="middle" font-size="22" font-weight="800">I<tspan baseline-shift="super" font-size="70%">B</tspan></text><circle cx="440.0" cy="240" r="28" fill="#fde68a" stroke="#92400e" stroke-width="2"/><text x="440.0" y="247" text-anchor="middle" font-size="22" font-weight="800">i</text><circle cx="220" cy="340.0" r="28" fill="#fbcfe8" stroke="#9d174d" stroke-width="2"/><text x="220" y="347.0" text-anchor="middle" font-size="22" font-weight="800">I<tspan baseline-shift="super" font-size="70%">A</tspan></text><circle cx="220" cy="460.0" r="28" fill="#fbcfe8" stroke="#9d174d" stroke-width="2"/><text x="220" y="467.0" text-anchor="middle" font-size="22" font-weight="800">i</text><text x="380" y="200" text-anchor="middle" font-size="13">gametes from the group B parent</text><text x="180" y="400" text-anchor="middle" font-size="13" transform="rotate(-90 180 400)">gametes from the group A parent</text></g></g>
<g class="part" data-part="off" data-name="Offspring" data-info="1 AB : 1 A : 1 B : 1 O. All four blood groups are possible." tabindex="0" role="button" aria-label="Offspring"><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.3571;0.3786;1.0000" values="0;0;1;1" dur="14s" begin="ab-play.begin+0s" fill="freeze"/><rect x="264" y="284" width="112" height="112" rx="8" fill="#c4b5fd"/><text x="320.0" y="338" text-anchor="middle" font-size="24" font-weight="800">I<tspan baseline-shift="super" font-size="70%">A</tspan>I<tspan baseline-shift="super" font-size="70%">B</tspan></text><text x="320.0" y="372" text-anchor="middle" font-size="16" font-weight="700">group AB</text></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.4214;0.4429;1.0000" values="0;0;1;1" dur="14s" begin="ab-play.begin+0s" fill="freeze"/><rect x="384" y="284" width="112" height="112" rx="8" fill="#fca5a5"/><text x="440.0" y="338" text-anchor="middle" font-size="24" font-weight="800">I<tspan baseline-shift="super" font-size="70%">A</tspan> i</text><text x="440.0" y="372" text-anchor="middle" font-size="16" font-weight="700">group A</text></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.4857;0.5071;1.0000" values="0;0;1;1" dur="14s" begin="ab-play.begin+0s" fill="freeze"/><rect x="264" y="404" width="112" height="112" rx="8" fill="#93c5fd"/><text x="320.0" y="458" text-anchor="middle" font-size="24" font-weight="800">I<tspan baseline-shift="super" font-size="70%">B</tspan> i</text><text x="320.0" y="492" text-anchor="middle" font-size="16" font-weight="700">group B</text></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.5500;0.5714;1.0000" values="0;0;1;1" dur="14s" begin="ab-play.begin+0s" fill="freeze"/><rect x="384" y="404" width="112" height="112" rx="8" fill="#e5e7eb"/><text x="440.0" y="458" text-anchor="middle" font-size="24" font-weight="800">i i</text><text x="440.0" y="492" text-anchor="middle" font-size="16" font-weight="700">group O</text></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.6429;0.6643;1.0000" values="0;0;1;1" dur="14s" begin="ab-play.begin+0s" fill="freeze"/><text x="380" y="560" text-anchor="middle" font-size="18" font-weight="800">1 AB : 1 A : 1 B : 1 O</text></g></g>
<g class="part" data-part="cells" data-name="Antigens on red blood cells" data-info="Group A: antigen A; group B: antigen B; AB: both; O: neither. Plasma contains antibodies against the antigens the person does not have." tabindex="0" role="button" aria-label="Antigens on red blood cells"><text x="740" y="120" font-size="15" font-weight="800">Red blood cell antigens</text><ellipse cx="760" cy="160" rx="40" ry="26" fill="#ef4444" stroke="#7f1d1d" stroke-width="2"/><path d="M 800.0 160.0 l 8.0 0.0" stroke="#b91c1c" stroke-width="4"/><polygon points="806.0,156.0 814.0,156.0 810.0,164.0" fill="#b91c1c"/><path d="M 780.0 182.5 l 4.0 6.9" stroke="#b91c1c" stroke-width="4"/><polygon points="781.0,183.7 789.0,183.7 785.0,191.7" fill="#b91c1c"/><path d="M 740.0 182.5 l -4.0 6.9" stroke="#b91c1c" stroke-width="4"/><polygon points="731.0,183.7 739.0,183.7 735.0,191.7" fill="#b91c1c"/><path d="M 720.0 160.0 l -8.0 0.0" stroke="#b91c1c" stroke-width="4"/><polygon points="706.0,156.0 714.0,156.0 710.0,164.0" fill="#b91c1c"/><path d="M 740.0 137.5 l -4.0 -6.9" stroke="#b91c1c" stroke-width="4"/><polygon points="731.0,128.3 739.0,128.3 735.0,136.3" fill="#b91c1c"/><path d="M 780.0 137.5 l 4.0 -6.9" stroke="#b91c1c" stroke-width="4"/><polygon points="781.0,128.3 789.0,128.3 785.0,136.3" fill="#b91c1c"/><text x="830" y="154" font-size="15" font-weight="800">Group A</text><text x="830" y="174" font-size="12">antigens: A; antibodies: anti-B</text><ellipse cx="760" cy="270" rx="40" ry="26" fill="#ef4444" stroke="#7f1d1d" stroke-width="2"/><path d="M 795.1 282.5 l 7.0 3.8" stroke="#1d4ed8" stroke-width="4"/><rect x="799.9" y="281.3" width="8" height="8" fill="#1d4ed8"/><path d="M 760.9 296.0 l 0.2 8.0" stroke="#1d4ed8" stroke-width="4"/><rect x="757.2" y="298.0" width="8" height="8" fill="#1d4ed8"/><path d="M 725.8 283.5 l -6.8 4.2" stroke="#1d4ed8" stroke-width="4"/><rect x="713.3" y="282.6" width="8" height="8" fill="#1d4ed8"/><path d="M 724.9 257.5 l -7.0 -3.8" stroke="#1d4ed8" stroke-width="4"/><rect x="712.1" y="250.7" width="8" height="8" fill="#1d4ed8"/><path d="M 759.1 244.0 l -0.2 -8.0" stroke="#1d4ed8" stroke-width="4"/><rect x="754.8" y="234.0" width="8" height="8" fill="#1d4ed8"/><path d="M 794.2 256.5 l 6.8 -4.2" stroke="#1d4ed8" stroke-width="4"/><rect x="798.7" y="249.4" width="8" height="8" fill="#1d4ed8"/><text x="830" y="264" font-size="15" font-weight="800">Group B</text><text x="830" y="284" font-size="12">antigens: B; antibodies: anti-A</text><ellipse cx="760" cy="380" rx="40" ry="26" fill="#ef4444" stroke="#7f1d1d" stroke-width="2"/><path d="M 800.0 380.0 l 8.0 0.0" stroke="#b91c1c" stroke-width="4"/><polygon points="806.0,376.0 814.0,376.0 810.0,384.0" fill="#b91c1c"/><path d="M 780.0 402.5 l 4.0 6.9" stroke="#b91c1c" stroke-width="4"/><polygon points="781.0,403.7 789.0,403.7 785.0,411.7" fill="#b91c1c"/><path d="M 740.0 402.5 l -4.0 6.9" stroke="#b91c1c" stroke-width="4"/><polygon points="731.0,403.7 739.0,403.7 735.0,411.7" fill="#b91c1c"/><path d="M 720.0 380.0 l -8.0 0.0" stroke="#b91c1c" stroke-width="4"/><polygon points="706.0,376.0 714.0,376.0 710.0,384.0" fill="#b91c1c"/><path d="M 740.0 357.5 l -4.0 -6.9" stroke="#b91c1c" stroke-width="4"/><polygon points="731.0,348.3 739.0,348.3 735.0,356.3" fill="#b91c1c"/><path d="M 780.0 357.5 l 4.0 -6.9" stroke="#b91c1c" stroke-width="4"/><polygon points="781.0,348.3 789.0,348.3 785.0,356.3" fill="#b91c1c"/><path d="M 795.1 392.5 l 7.0 3.8" stroke="#1d4ed8" stroke-width="4"/><rect x="799.9" y="391.3" width="8" height="8" fill="#1d4ed8"/><path d="M 760.9 406.0 l 0.2 8.0" stroke="#1d4ed8" stroke-width="4"/><rect x="757.2" y="408.0" width="8" height="8" fill="#1d4ed8"/><path d="M 725.8 393.5 l -6.8 4.2" stroke="#1d4ed8" stroke-width="4"/><rect x="713.3" y="392.6" width="8" height="8" fill="#1d4ed8"/><path d="M 724.9 367.5 l -7.0 -3.8" stroke="#1d4ed8" stroke-width="4"/><rect x="712.1" y="360.7" width="8" height="8" fill="#1d4ed8"/><path d="M 759.1 354.0 l -0.2 -8.0" stroke="#1d4ed8" stroke-width="4"/><rect x="754.8" y="344.0" width="8" height="8" fill="#1d4ed8"/><path d="M 794.2 366.5 l 6.8 -4.2" stroke="#1d4ed8" stroke-width="4"/><rect x="798.7" y="359.4" width="8" height="8" fill="#1d4ed8"/><text x="830" y="374" font-size="15" font-weight="800">Group AB</text><text x="830" y="394" font-size="12">antigens: A and B; antibodies: none</text><ellipse cx="760" cy="490" rx="40" ry="26" fill="#ef4444" stroke="#7f1d1d" stroke-width="2"/><text x="830" y="484" font-size="15" font-weight="800">Group O</text><text x="830" y="504" font-size="12">antigens: none; antibodies: anti-A and anti-B</text></g>
</svg>