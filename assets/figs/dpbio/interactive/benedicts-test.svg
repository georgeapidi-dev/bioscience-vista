<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" class="vd-svg" role="img" aria-labelledby="bn-title bn-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="bn-play" data-vd-play-label="Play: heat the tubes" data-vd-steps="[[0, &quot;Benedict&#x27;s test for reducing sugars.&quot;], [1, &quot;Add Benedict&#x27;s reagent to each food solution: all turn blue.&quot;], [3.5, &quot;Heat in a boiling water bath for 5 minutes.&quot;], [6, &quot;The colour shows how much reducing sugar is present.&quot;], [11, &quot;Brick-red precipitate = lots of reducing sugar.&quot;]]" data-vd-dur="14">
<title id="bn-title">Benedict&#x27;s test for reducing sugars</title><desc id="bn-desc">Test tubes of food solution with blue Benedict&#x27;s reagent are heated in a boiling water bath and change to green, yellow, orange or brick red depending on the concentration of reducing sugar.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="520" fill="#ffffff"/>
<g aria-hidden="true"><animate id="bn-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<text class="head" x="30" y="34">Benedict's test for reducing sugars</text><text class="note" x="30" y="56">Colours after heating, from 0% to over 4% reducing sugar.</text>
<g class="part" data-part="heat" data-name="Heat" data-info="In a boiling water bath for about 5 minutes." tabindex="0" role="button" aria-label="Heat"><g><animate attributeName="opacity" keyTimes="0.0000;0.2500;0.2714;1.0000" values="0;0;1;1" dur="14s" begin="bn-play.begin+0s" fill="freeze"/><rect x="60" y="250" width="960" height="190" rx="12" fill="#bfdbfe" opacity=".6" stroke="#60a5fa" stroke-width="2"/><circle cx="100" cy="420" r="6" fill="#fff" opacity=".8"><animate attributeName="cy" values="430;270" dur="1.0s" repeatCount="indefinite"/></circle><circle cx="170" cy="420" r="6" fill="#fff" opacity=".8"><animate attributeName="cy" values="430;270" dur="1.3s" repeatCount="indefinite"/></circle><circle cx="240" cy="420" r="6" fill="#fff" opacity=".8"><animate attributeName="cy" values="430;270" dur="1.6s" repeatCount="indefinite"/></circle><circle cx="310" cy="420" r="6" fill="#fff" opacity=".8"><animate attributeName="cy" values="430;270" dur="1.0s" repeatCount="indefinite"/></circle><circle cx="380" cy="420" r="6" fill="#fff" opacity=".8"><animate attributeName="cy" values="430;270" dur="1.3s" repeatCount="indefinite"/></circle><circle cx="450" cy="420" r="6" fill="#fff" opacity=".8"><animate attributeName="cy" values="430;270" dur="1.6s" repeatCount="indefinite"/></circle><circle cx="520" cy="420" r="6" fill="#fff" opacity=".8"><animate attributeName="cy" values="430;270" dur="1.0s" repeatCount="indefinite"/></circle><circle cx="590" cy="420" r="6" fill="#fff" opacity=".8"><animate attributeName="cy" values="430;270" dur="1.3s" repeatCount="indefinite"/></circle><circle cx="660" cy="420" r="6" fill="#fff" opacity=".8"><animate attributeName="cy" values="430;270" dur="1.6s" repeatCount="indefinite"/></circle><circle cx="730" cy="420" r="6" fill="#fff" opacity=".8"><animate attributeName="cy" values="430;270" dur="1.0s" repeatCount="indefinite"/></circle><circle cx="800" cy="420" r="6" fill="#fff" opacity=".8"><animate attributeName="cy" values="430;270" dur="1.3s" repeatCount="indefinite"/></circle><circle cx="870" cy="420" r="6" fill="#fff" opacity=".8"><animate attributeName="cy" values="430;270" dur="1.6s" repeatCount="indefinite"/></circle><circle cx="940" cy="420" r="6" fill="#fff" opacity=".8"><animate attributeName="cy" values="430;270" dur="1.0s" repeatCount="indefinite"/></circle><text x="540" y="470" text-anchor="middle" font-size="14" font-weight="800" fill="#1d4ed8">boiling water bath, about 5 minutes</text></g></g>
<g class="part" data-part="col" data-name="Colour" data-info="Blue = no reducing sugar. Green → yellow → orange → brick-red precipitate = increasing amounts of reducing sugar (e.g. glucose). Semi-quantitative." tabindex="0" role="button" aria-label="Colour"><path d="M 98 120 L 98 380 A 22 22 0 0 0 142 380 L 142 120" fill="#f8fafc" stroke="#334155" stroke-width="2.5"/><path d="M 100 230 L 100 380 A 20 20 0 0 0 140 380 L 140 230 Z" fill="#60a5fa"><animate attributeName="fill" keyTimes="0;0.071;0.114;0.429;0.500;1" values="#e5e7eb;#e5e7eb;#60a5fa;#60a5fa;#60a5fa;#60a5fa" dur="14s" begin="bn-play.begin+0s" fill="freeze"/></path><text x="120" y="500" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">0%</text><path d="M 218 120 L 218 380 A 22 22 0 0 0 262 380 L 262 120" fill="#f8fafc" stroke="#334155" stroke-width="2.5"/><path d="M 220 230 L 220 380 A 20 20 0 0 0 260 380 L 260 230 Z" fill="#60a5fa"><animate attributeName="fill" keyTimes="0;0.071;0.114;0.464;0.536;1" values="#e5e7eb;#e5e7eb;#60a5fa;#60a5fa;#5eead4;#5eead4" dur="14s" begin="bn-play.begin+0s" fill="freeze"/></path><text x="240" y="500" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">0–0.5%</text><path d="M 338 120 L 338 380 A 22 22 0 0 0 382 380 L 382 120" fill="#f8fafc" stroke="#334155" stroke-width="2.5"/><path d="M 340 230 L 340 380 A 20 20 0 0 0 380 380 L 380 230 Z" fill="#60a5fa"><animate attributeName="fill" keyTimes="0;0.071;0.114;0.500;0.571;1" values="#e5e7eb;#e5e7eb;#60a5fa;#60a5fa;#4ade80;#4ade80" dur="14s" begin="bn-play.begin+0s" fill="freeze"/></path><text x="360" y="500" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">0.6–1.0%</text><path d="M 458 120 L 458 380 A 22 22 0 0 0 502 380 L 502 120" fill="#f8fafc" stroke="#334155" stroke-width="2.5"/><path d="M 460 230 L 460 380 A 20 20 0 0 0 500 380 L 500 230 Z" fill="#60a5fa"><animate attributeName="fill" keyTimes="0;0.071;0.114;0.536;0.607;1" values="#e5e7eb;#e5e7eb;#60a5fa;#60a5fa;#a3e635;#a3e635" dur="14s" begin="bn-play.begin+0s" fill="freeze"/></path><text x="480" y="500" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">1.1–1.5%</text><path d="M 578 120 L 578 380 A 22 22 0 0 0 622 380 L 622 120" fill="#f8fafc" stroke="#334155" stroke-width="2.5"/><path d="M 580 230 L 580 380 A 20 20 0 0 0 620 380 L 620 230 Z" fill="#60a5fa"><animate attributeName="fill" keyTimes="0;0.071;0.114;0.571;0.643;1" values="#e5e7eb;#e5e7eb;#60a5fa;#60a5fa;#facc15;#facc15" dur="14s" begin="bn-play.begin+0s" fill="freeze"/></path><text x="600" y="500" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">1.6–2.5%</text><path d="M 698 120 L 698 380 A 22 22 0 0 0 742 380 L 742 120" fill="#f8fafc" stroke="#334155" stroke-width="2.5"/><path d="M 700 230 L 700 380 A 20 20 0 0 0 740 380 L 740 230 Z" fill="#60a5fa"><animate attributeName="fill" keyTimes="0;0.071;0.114;0.607;0.679;1" values="#e5e7eb;#e5e7eb;#60a5fa;#60a5fa;#fb923c;#fb923c" dur="14s" begin="bn-play.begin+0s" fill="freeze"/></path><text x="720" y="500" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">2.6–3.5%</text><path d="M 818 120 L 818 380 A 22 22 0 0 0 862 380 L 862 120" fill="#f8fafc" stroke="#334155" stroke-width="2.5"/><path d="M 820 230 L 820 380 A 20 20 0 0 0 860 380 L 860 230 Z" fill="#60a5fa"><animate attributeName="fill" keyTimes="0;0.071;0.114;0.643;0.714;1" values="#e5e7eb;#e5e7eb;#60a5fa;#60a5fa;#dc2626;#dc2626" dur="14s" begin="bn-play.begin+0s" fill="freeze"/></path><text x="840" y="500" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">3.6–4.0%</text><path d="M 938 120 L 938 380 A 22 22 0 0 0 982 380 L 982 120" fill="#f8fafc" stroke="#334155" stroke-width="2.5"/><path d="M 940 230 L 940 380 A 20 20 0 0 0 980 380 L 980 230 Z" fill="#60a5fa"><animate attributeName="fill" keyTimes="0;0.071;0.114;0.679;0.750;1" values="#e5e7eb;#e5e7eb;#60a5fa;#60a5fa;#92400e;#92400e" dur="14s" begin="bn-play.begin+0s" fill="freeze"/></path><text x="960" y="500" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">>4.0%</text></g>
<g class="part" data-part="add" data-name="Add Benedict&#x27;s reagent" data-info="An equal volume of blue Benedict&#x27;s solution is added to the food solution." tabindex="0" role="button" aria-label="Add Benedict&#x27;s reagent"><g><animate attributeName="opacity" keyTimes="0.0000;0.0714;0.0929;1.0000" values="0;0;1;1" dur="14s" begin="bn-play.begin+0s" fill="freeze"/><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.0714;0.0929;0.2500;0.2714;1.0000" values="0;0;1;1;0;0" dur="14s" begin="bn-play.begin+0s" fill="freeze"/><rect x="400.0" y="84" width="280" height="24" rx="12" fill="#dbeafe" stroke="#1f2937" stroke-width="1"/><text x="540" y="101" text-anchor="middle" font-size="12" font-weight="700">Benedict's reagent added (blue)</text></g></g></g>
<g class="part" data-part="ex" data-name="Which sugars?" data-info="Reducing sugars (all monosaccharides, maltose, lactose) give a positive result. Sucrose does not unless first hydrolysed." tabindex="0" role="button" aria-label="Which sugars?"><g><animate attributeName="opacity" keyTimes="0.0000;0.7857;0.8071;1.0000" values="0;0;1;1" dur="14s" begin="bn-play.begin+0s" fill="freeze"/><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.7857;0.8071;1.0000" values="0;0;1;1" dur="14s" begin="bn-play.begin+0s" fill="freeze"/><rect x="260.0" y="84" width="560" height="24" rx="12" fill="#fef3c7" stroke="#1f2937" stroke-width="1"/><text x="540" y="101" text-anchor="middle" font-size="12" font-weight="700">blue = none · green → yellow → orange → brick red = more reducing sugar</text></g></g></g>
</svg>