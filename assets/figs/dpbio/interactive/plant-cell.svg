<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 760" class="vd-svg" role="img" aria-labelledby="pc-title pc-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="pc-play" data-vd-play-label="Play: turgid, flaccid and plasmolysed" data-vd-steps="[[0, &quot;In pure water the cell is turgid: water has entered the vacuole by osmosis, which pushes the cytoplasm and membrane firmly against the cellulose wall. The wall stops the cell from bursting.&quot;], [3.5, &quot;In a concentrated sugar or salt solution, water leaves the vacuole by osmosis (from a higher to a lower water potential). The vacuole shrinks and the cell becomes flaccid.&quot;], [7, &quot;More water leaves: the membrane pulls away from the cell wall. The cell is plasmolysed; the gap fills with the outside solution, because the wall is freely permeable.&quot;], [10.5, &quot;Put back in water, the cell takes water in by osmosis again, the vacuole swells and the cell becomes turgid.&quot;]]" data-vd-dur="14">
<title id="pc-title">Plant cell as seen with an electron microscope</title><desc id="pc-desc">A palisade-type plant cell with cellulose cell wall, cell membrane, cytoplasm, large permanent vacuole with tonoplast, chloroplasts, nucleus, mitochondria, endoplasmic reticulum, Golgi apparatus and plasmodesmata.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="760" fill="#ffffff"/>
<g aria-hidden="true"><animate id="pc-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<text class="head" x="30" y="36">Plant cell (electron microscope view)</text><text class="note" x="30" y="58">A leaf (palisade) cell, simplified. Not to scale.</text>
<g class="part" data-part="wall" data-name="Cell wall" data-info="Made of cellulose: strong and freely permeable. It supports the cell and stops it bursting when water enters." tabindex="0" role="button" aria-label="Cell wall"><rect x="300" y="110" width="500" height="580" rx="26" fill="#d9f99d" stroke="#3f6212" stroke-width="3"/><rect x="316" y="126" width="468" height="548" rx="18" fill="#f0fdf4" stroke="#65a30d" stroke-width="1.5"/></g>
<g class="part" data-part="pd" data-name="Plasmodesmata" data-info="Narrow channels of cytoplasm through the cell walls that link neighbouring cells." tabindex="0" role="button" aria-label="Plasmodesmata"><rect x="300" y="300" width="17" height="7" fill="#bbf7d0" stroke="#3f6212" stroke-width="1"/><rect x="300" y="480" width="17" height="7" fill="#bbf7d0" stroke="#3f6212" stroke-width="1"/><rect x="783" y="380" width="17" height="7" fill="#bbf7d0" stroke="#3f6212" stroke-width="1"/><rect x="540" y="110" width="7" height="17" fill="#bbf7d0" stroke="#3f6212" stroke-width="1"/></g>
<g transform="translate(550.0 400.0)"><g><animateTransform attributeName="transform" type="scale" values="1 1;1 1;0.97 0.97;0.74 0.8;0.74 0.8;1 1" keyTimes="0;0.25;0.5;0.75;0.85;1" dur="14s" begin="pc-play.begin+0s"/><g transform="translate(-550.0 -400.0)"><g class="part" data-part="cyt" data-name="Cytoplasm" data-info="Where many chemical reactions happen; in a mature plant cell it is a thin layer around the vacuole." tabindex="0" role="button" aria-label="Cytoplasm"><rect x="318" y="128" width="464" height="544" rx="16" fill="#ecfccb"/></g><g class="part" data-part="mem" data-name="Cell membrane" data-info="Partially permeable membrane inside the wall; controls what enters and leaves. Pulls away from the wall in plasmolysis." tabindex="0" role="button" aria-label="Cell membrane"><rect x="318" y="128" width="464" height="544" rx="16" fill="none" stroke="#be185d" stroke-width="3.5"/></g></g></g></g>
<g transform="translate(550.0 440.0)"><g><animateTransform attributeName="transform" type="scale" values="1 1;1 1;0.8 0.82;0.6 0.66;0.6 0.66;1 1" keyTimes="0;0.25;0.5;0.75;0.85;1" dur="14s" begin="pc-play.begin+0s"/><g transform="translate(-550.0 -440.0)"><g class="part" data-part="vac" data-name="Large permanent vacuole" data-info="Filled with cell sap (water, sugars, salts, pigments). When full it pushes the cytoplasm against the wall, making the cell turgid and supporting the plant." tabindex="0" role="button" aria-label="Large permanent vacuole"><rect x="380" y="260" width="340" height="350" rx="40" fill="#e0f2fe"/></g><g class="part" data-part="ton" data-name="Tonoplast" data-info="The partially permeable membrane around the vacuole." tabindex="0" role="button" aria-label="Tonoplast"><rect x="380" y="260" width="340" height="350" rx="40" fill="none" stroke="#0369a1" stroke-width="2.5"/></g></g></g></g>
<g transform="translate(550.0 400.0)"><g><animateTransform attributeName="transform" type="scale" values="1 1;1 1;0.97 0.97;0.74 0.8;0.74 0.8;1 1" keyTimes="0;0.25;0.5;0.75;0.85;1" dur="14s" begin="pc-play.begin+0s"/><g transform="translate(-550.0 -400.0)"><g class="part" data-part="chl" data-name="Chloroplasts" data-info="Contain chlorophyll in stacks of thylakoids (grana): the site of photosynthesis. Starch grains store the sugar made." tabindex="0" role="button" aria-label="Chloroplasts"><g transform="translate(360 170) rotate(0)"><ellipse rx="34" ry="15" fill="#86efac" stroke="#166534" stroke-width="2"/><rect x="-24" y="-6" width="8" height="12" rx="1.5" fill="#15803d"/><rect x="-12" y="-6" width="8" height="12" rx="1.5" fill="#15803d"/><rect x="0" y="-6" width="8" height="12" rx="1.5" fill="#15803d"/><rect x="12" y="-6" width="8" height="12" rx="1.5" fill="#15803d"/><ellipse cx="14" cy="5" rx="5" ry="3" fill="#fff"/></g><g transform="translate(470 160) rotate(0)"><ellipse rx="34" ry="15" fill="#86efac" stroke="#166534" stroke-width="2"/><rect x="-24" y="-6" width="8" height="12" rx="1.5" fill="#15803d"/><rect x="-12" y="-6" width="8" height="12" rx="1.5" fill="#15803d"/><rect x="0" y="-6" width="8" height="12" rx="1.5" fill="#15803d"/><rect x="12" y="-6" width="8" height="12" rx="1.5" fill="#15803d"/><ellipse cx="14" cy="5" rx="5" ry="3" fill="#fff"/></g><g transform="translate(600 165) rotate(0)"><ellipse rx="34" ry="15" fill="#86efac" stroke="#166534" stroke-width="2"/><rect x="-24" y="-6" width="8" height="12" rx="1.5" fill="#15803d"/><rect x="-12" y="-6" width="8" height="12" rx="1.5" fill="#15803d"/><rect x="0" y="-6" width="8" height="12" rx="1.5" fill="#15803d"/><rect x="12" y="-6" width="8" height="12" rx="1.5" fill="#15803d"/><ellipse cx="14" cy="5" rx="5" ry="3" fill="#fff"/></g><g transform="translate(720 175) rotate(0)"><ellipse rx="34" ry="15" fill="#86efac" stroke="#166534" stroke-width="2"/><rect x="-24" y="-6" width="8" height="12" rx="1.5" fill="#15803d"/><rect x="-12" y="-6" width="8" height="12" rx="1.5" fill="#15803d"/><rect x="0" y="-6" width="8" height="12" rx="1.5" fill="#15803d"/><rect x="12" y="-6" width="8" height="12" rx="1.5" fill="#15803d"/><ellipse cx="14" cy="5" rx="5" ry="3" fill="#fff"/></g><g transform="translate(340 300) rotate(90)"><ellipse rx="34" ry="15" fill="#86efac" stroke="#166534" stroke-width="2"/><rect x="-24" y="-6" width="8" height="12" rx="1.5" fill="#15803d"/><rect x="-12" y="-6" width="8" height="12" rx="1.5" fill="#15803d"/><rect x="0" y="-6" width="8" height="12" rx="1.5" fill="#15803d"/><rect x="12" y="-6" width="8" height="12" rx="1.5" fill="#15803d"/><ellipse cx="14" cy="5" rx="5" ry="3" fill="#fff"/></g><g transform="translate(340 440) rotate(90)"><ellipse rx="34" ry="15" fill="#86efac" stroke="#166534" stroke-width="2"/><rect x="-24" y="-6" width="8" height="12" rx="1.5" fill="#15803d"/><rect x="-12" y="-6" width="8" height="12" rx="1.5" fill="#15803d"/><rect x="0" y="-6" width="8" height="12" rx="1.5" fill="#15803d"/><rect x="12" y="-6" width="8" height="12" rx="1.5" fill="#15803d"/><ellipse cx="14" cy="5" rx="5" ry="3" fill="#fff"/></g><g transform="translate(760 320) rotate(90)"><ellipse rx="34" ry="15" fill="#86efac" stroke="#166534" stroke-width="2"/><rect x="-24" y="-6" width="8" height="12" rx="1.5" fill="#15803d"/><rect x="-12" y="-6" width="8" height="12" rx="1.5" fill="#15803d"/><rect x="0" y="-6" width="8" height="12" rx="1.5" fill="#15803d"/><rect x="12" y="-6" width="8" height="12" rx="1.5" fill="#15803d"/><ellipse cx="14" cy="5" rx="5" ry="3" fill="#fff"/></g><g transform="translate(760 460) rotate(90)"><ellipse rx="34" ry="15" fill="#86efac" stroke="#166534" stroke-width="2"/><rect x="-24" y="-6" width="8" height="12" rx="1.5" fill="#15803d"/><rect x="-12" y="-6" width="8" height="12" rx="1.5" fill="#15803d"/><rect x="0" y="-6" width="8" height="12" rx="1.5" fill="#15803d"/><rect x="12" y="-6" width="8" height="12" rx="1.5" fill="#15803d"/><ellipse cx="14" cy="5" rx="5" ry="3" fill="#fff"/></g><g transform="translate(400 630) rotate(0)"><ellipse rx="34" ry="15" fill="#86efac" stroke="#166534" stroke-width="2"/><rect x="-24" y="-6" width="8" height="12" rx="1.5" fill="#15803d"/><rect x="-12" y="-6" width="8" height="12" rx="1.5" fill="#15803d"/><rect x="0" y="-6" width="8" height="12" rx="1.5" fill="#15803d"/><rect x="12" y="-6" width="8" height="12" rx="1.5" fill="#15803d"/><ellipse cx="14" cy="5" rx="5" ry="3" fill="#fff"/></g><g transform="translate(680 630) rotate(0)"><ellipse rx="34" ry="15" fill="#86efac" stroke="#166534" stroke-width="2"/><rect x="-24" y="-6" width="8" height="12" rx="1.5" fill="#15803d"/><rect x="-12" y="-6" width="8" height="12" rx="1.5" fill="#15803d"/><rect x="0" y="-6" width="8" height="12" rx="1.5" fill="#15803d"/><rect x="12" y="-6" width="8" height="12" rx="1.5" fill="#15803d"/><ellipse cx="14" cy="5" rx="5" ry="3" fill="#fff"/></g></g><g class="part" data-part="nuc" data-name="Nucleus" data-info="Contains the chromosomes (DNA) that control the cell." tabindex="0" role="button" aria-label="Nucleus"><circle cx="560" cy="240" r="34" fill="#ede9fe" stroke="#5b21b6" stroke-width="3"/><circle cx="552" cy="244" r="11" fill="#6d28d9"/></g><g class="part" data-part="mito" data-name="Mitochondria" data-info="Site of aerobic respiration: plant cells respire all the time, day and night." tabindex="0" role="button" aria-label="Mitochondria"><g transform="translate(430 220) rotate(10)"><ellipse rx="20" ry="9" fill="#fdba74" stroke="#9a3412" stroke-width="2"/><path d="M -10 -6 L -8 6 M 0 -8 L 2 8 M 10 -6 L 11 6" stroke="#9a3412" stroke-width="1.5"/></g><g transform="translate(610 600) rotate(-10)"><ellipse rx="20" ry="9" fill="#fdba74" stroke="#9a3412" stroke-width="2"/><path d="M -10 -6 L -8 6 M 0 -8 L 2 8 M 10 -6 L 11 6" stroke="#9a3412" stroke-width="1.5"/></g><g transform="translate(530 650) rotate(0)"><ellipse rx="20" ry="9" fill="#fdba74" stroke="#9a3412" stroke-width="2"/><path d="M -10 -6 L -8 6 M 0 -8 L 2 8 M 10 -6 L 11 6" stroke="#9a3412" stroke-width="1.5"/></g></g><g class="part" data-part="er" data-name="Endoplasmic reticulum" data-info="Network of membranes: rough ER (with ribosomes) makes proteins; smooth ER makes lipids." tabindex="0" role="button" aria-label="Endoplasmic reticulum"><path d="M 610 220 C 640 210 660 230 690 222 M 612 232 C 640 224 660 244 690 236" fill="none" stroke="#b45309" stroke-width="3"/><circle cx="614" cy="214" r="1.8" fill="#1e3a8a"/><circle cx="623" cy="216" r="1.8" fill="#1e3a8a"/><circle cx="632" cy="214" r="1.8" fill="#1e3a8a"/><circle cx="641" cy="216" r="1.8" fill="#1e3a8a"/><circle cx="650" cy="214" r="1.8" fill="#1e3a8a"/><circle cx="659" cy="216" r="1.8" fill="#1e3a8a"/><circle cx="668" cy="214" r="1.8" fill="#1e3a8a"/><circle cx="677" cy="216" r="1.8" fill="#1e3a8a"/><circle cx="686" cy="214" r="1.8" fill="#1e3a8a"/></g><g class="part" data-part="golgi" data-name="Golgi apparatus" data-info="Packages substances, including materials for building the cell wall." tabindex="0" role="button" aria-label="Golgi apparatus"><path d="M 460 600 C 470 620 470 640 460 660" fill="none" stroke="#b91c1c" stroke-width="4"/><path d="M 469 600 C 479 620 479 640 469 660" fill="none" stroke="#b91c1c" stroke-width="4"/><path d="M 478 600 C 488 620 488 640 478 660" fill="none" stroke="#b91c1c" stroke-width="4"/><path d="M 487 600 C 497 620 497 640 487 660" fill="none" stroke="#b91c1c" stroke-width="4"/></g></g></g></g>
<g class="labels"><g class="lbl" data-for="wall"><polyline points="113.3,194.0 304.0,200.0"/><circle cx="304.0" cy="200.0" r="2.6"/><text x="30" y="200" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="4">Cell wall</text></g><g class="lbl" data-for="pd"><polyline points="148.1,294.0 308.0,303.0"/><circle cx="308.0" cy="303.0" r="2.6"/><text x="30" y="300" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="4">Plasmodesmata</text></g><g class="lbl" data-for="mem"><polyline points="148.1,374.0 318.0,380.0"/><circle cx="318.0" cy="380.0" r="2.6"/><text x="30" y="380" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="4">Cell membrane</text></g><g class="lbl" data-for="cyt"><polyline points="113.3,534.0 330.0,520.0"/><circle cx="330.0" cy="520.0" r="2.6"/><text x="30" y="540" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="4">Cytoplasm</text></g><g class="lbl" data-for="chl"><polyline points="139.4,454.0 340.0,440.0"/><circle cx="340.0" cy="440.0" r="2.6"/><text x="30" y="460" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="4">Chloroplasts</text></g><g class="lbl" data-for="mito"><polyline points="139.4,244.0 418.0,222.0"/><circle cx="418.0" cy="222.0" r="2.6"/><text x="30" y="250" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="4">Mitochondria</text></g><g class="lbl" data-for="nuc"><polyline points="1004.1,194.0 590.0,232.0"/><circle cx="590.0" cy="232.0" r="2.6"/><text x="1070" y="200" text-anchor="end" paint-order="stroke" stroke="#fff" stroke-width="4">Nucleus</text></g><g class="lbl" data-for="er"><polyline points="882.3,254.0 690.0,228.0"/><circle cx="690.0" cy="228.0" r="2.6"/><text x="1070" y="260" text-anchor="end" paint-order="stroke" stroke="#fff" stroke-width="4">Endoplasmic reticulum</text></g><g class="lbl" data-for="vac"><polyline points="864.9,414.0 640.0,420.0"/><circle cx="640.0" cy="420.0" r="2.6"/><text x="1070" y="420" text-anchor="end" paint-order="stroke" stroke="#fff" stroke-width="4">Large permanent vacuole</text></g><g class="lbl" data-for="ton"><polyline points="986.7,514.0 720.0,520.0"/><circle cx="720.0" cy="520.0" r="2.6"/><text x="1070" y="520" text-anchor="end" paint-order="stroke" stroke="#fff" stroke-width="4">Tonoplast</text></g><g class="lbl" data-for="golgi"><polyline points="934.5,634.0 800.0,720.0 486.0,630.0"/><circle cx="486.0" cy="630.0" r="2.6"/><text x="1070" y="640" text-anchor="end" paint-order="stroke" stroke="#fff" stroke-width="4">Golgi apparatus</text></g></g>
<g aria-hidden="true" pointer-events="none"><text x="820" y="140" font-size="16" font-weight="700" fill="#0369a1" opacity="0">in pure water: TURGID<set attributeName="opacity" to="1" begin="pc-play.begin+0s" dur="3.5s"/></text><text x="820" y="140" font-size="16" font-weight="700" fill="#b45309" opacity="0">in concentrated solution: FLACCID<set attributeName="opacity" to="1" begin="pc-play.begin+3.5s" dur="3.5s"/></text><text x="820" y="140" font-size="16" font-weight="700" fill="#b91c1c" opacity="0">PLASMOLYSED<set attributeName="opacity" to="1" begin="pc-play.begin+7s" dur="3.5s"/></text><text x="820" y="140" font-size="16" font-weight="700" fill="#0369a1" opacity="0">back in water: TURGID again<set attributeName="opacity" to="1" begin="pc-play.begin+10.5s" dur="3.5s"/></text><circle r="6" fill="#2563eb" opacity="0"><set attributeName="opacity" to="1" begin="pc-play.begin+3.6s" dur="2s"/><animateMotion path="M 420 420 L 320.0 720" dur="2s" begin="pc-play.begin+3.6s" fill="freeze"/></circle><circle r="6" fill="#2563eb" opacity="0"><set attributeName="opacity" to="1" begin="pc-play.begin+10.6s" dur="2s"/><animateMotion path="M 320.0 720 L 420 420" dur="2s" begin="pc-play.begin+10.6s" fill="freeze"/></circle><circle r="6" fill="#2563eb" opacity="0"><set attributeName="opacity" to="1" begin="pc-play.begin+4.0s" dur="2s"/><animateMotion path="M 470 420 L 410.0 120" dur="2s" begin="pc-play.begin+4.0s" fill="freeze"/></circle><circle r="6" fill="#2563eb" opacity="0"><set attributeName="opacity" to="1" begin="pc-play.begin+10.9s" dur="2s"/><animateMotion path="M 410.0 120 L 470 420" dur="2s" begin="pc-play.begin+10.9s" fill="freeze"/></circle><circle r="6" fill="#2563eb" opacity="0"><set attributeName="opacity" to="1" begin="pc-play.begin+4.4s" dur="2s"/><animateMotion path="M 520 420 L 500.0 720" dur="2s" begin="pc-play.begin+4.4s" fill="freeze"/></circle><circle r="6" fill="#2563eb" opacity="0"><set attributeName="opacity" to="1" begin="pc-play.begin+11.2s" dur="2s"/><animateMotion path="M 500.0 720 L 520 420" dur="2s" begin="pc-play.begin+11.2s" fill="freeze"/></circle><circle r="6" fill="#2563eb" opacity="0"><set attributeName="opacity" to="1" begin="pc-play.begin+4.8s" dur="2s"/><animateMotion path="M 570 420 L 590.0 120" dur="2s" begin="pc-play.begin+4.8s" fill="freeze"/></circle><circle r="6" fill="#2563eb" opacity="0"><set attributeName="opacity" to="1" begin="pc-play.begin+11.5s" dur="2s"/><animateMotion path="M 590.0 120 L 570 420" dur="2s" begin="pc-play.begin+11.5s" fill="freeze"/></circle><circle r="6" fill="#2563eb" opacity="0"><set attributeName="opacity" to="1" begin="pc-play.begin+5.2s" dur="2s"/><animateMotion path="M 620 420 L 680.0 720" dur="2s" begin="pc-play.begin+5.2s" fill="freeze"/></circle><circle r="6" fill="#2563eb" opacity="0"><set attributeName="opacity" to="1" begin="pc-play.begin+11.8s" dur="2s"/><animateMotion path="M 680.0 720 L 620 420" dur="2s" begin="pc-play.begin+11.8s" fill="freeze"/></circle><circle r="6" fill="#2563eb" opacity="0"><set attributeName="opacity" to="1" begin="pc-play.begin+5.6s" dur="2s"/><animateMotion path="M 670 420 L 770.0 120" dur="2s" begin="pc-play.begin+5.6s" fill="freeze"/></circle><circle r="6" fill="#2563eb" opacity="0"><set attributeName="opacity" to="1" begin="pc-play.begin+12.1s" dur="2s"/><animateMotion path="M 770.0 120 L 670 420" dur="2s" begin="pc-play.begin+12.1s" fill="freeze"/></circle><g opacity="0"><set attributeName="opacity" to="1" begin="pc-play.begin+7s" dur="3.5s"/><text x="320" y="736" font-size="14" font-weight="700" fill="#b91c1c">The gap between wall and membrane fills with the outside solution.</text></g></g>
</svg>