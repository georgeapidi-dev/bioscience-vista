<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" class="vd-svg" role="img" aria-labelledby="mf-title mf-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1">
<title id="mf-title">Part of a skeletal muscle fibre</title><desc id="mf-desc">A section of a striated skeletal muscle fibre with sarcolemma, many peripheral nuclei, myofibrils with bands, mitochondria and sarcoplasmic reticulum.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="560" fill="#ffffff"/>
<text class="head" x="30" y="36">Atypical cell: skeletal muscle fibre</text><text class="note" x="30" y="58">Only part of one fibre is shown: a fibre can be up to 300 mm long. It challenges the idea that one cell has one nucleus.</text>
<g class="part" data-part="sarco" data-name="Sarcoplasm" data-info="The cytoplasm of the muscle fibre, shared by all its nuclei." tabindex="0" role="button" aria-label="Sarcoplasm"><rect x="60" y="170" width="980" height="260" rx="30" fill="#ffe4e6"/></g>
