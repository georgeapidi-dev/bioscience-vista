<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" class="vd-svg" role="img" aria-labelledby="hb-title hb-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="hb-play" data-vd-play-label="Play: attack and defend" data-vd-steps="[[0, &quot;An arms race between plants and herbivores.&quot;], [1, &quot;Herbivores: piercing or chewing mouthparts, grinding teeth, gut microbes.&quot;], [5, &quot;Plants fight back: thorns, silica, toxins.&quot;], [8.5, &quot;Whistling-thorn acacias even recruit ant bodyguards.&quot;], [11, &quot;Some herbivores cope with toxins: detoxifying or storing them.&quot;]]" data-vd-dur="14">
<title id="hb-title">Plants versus herbivores</title><desc id="hb-desc">Herbivore adaptations such as aphid stylets, caterpillar mandibles and grinding molars, against plant defences such as thorns, silica and toxins, including whistling-thorn acacias defended by ants, and herbivores that detoxify plant chemicals.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="560" fill="#ffffff"/>
<g aria-hidden="true"><animate id="hb-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<text class="head" x="30" y="34">Plants versus herbivores</text><text class="note" x="30" y="56">From the lesson notes.</text>
<g class="part" data-part="herb" data-name="Herbivore adaptations" data-info="Piercing mouthparts (aphid stylets reach the phloem) or chewing mandibles (caterpillars, locusts); grazing mammals have grinding molars and gut microbes that digest cellulose." tabindex="0" role="button" aria-label="Herbivore adaptations"><rect x="30" y="80" width="500" height="320" rx="16" fill="#fff7ed" stroke="#fdba74"/><text x="280" y="106" text-anchor="middle" font-size="15" font-weight="800" fill="#c2410c">HERBIVORES attack</text><path d="M 60 220 L 230 220" stroke="#16a34a" stroke-width="18"/><path d="M 70 215 L 220 215" stroke="#86efac" stroke-width="4" stroke-dasharray="10 6"/><text x="145" y="252" text-anchor="middle" font-size="11" font-weight="800" fill="#14532d">stem: phloem</text><g transform="translate(140 180)"><ellipse rx="22" ry="13" fill="#84cc16" stroke="#3f6212" stroke-width="2"/><line x1="-6" y1="10" x2="-6" y2="30" stroke="#3f6212" stroke-width="2"><animate attributeName="y2" keyTimes="0.0000;0.0714;0.1786;1.0000" values="12;12;40;40" dur="14s" begin="hb-play.begin+0s" fill="freeze"/></line></g><text x="140" y="150" text-anchor="middle" font-size="11" font-weight="800" fill="#3f6212">aphid: stylet into phloem</text><g transform="translate(360 210)"><path d="M -60 0 q 10 -14 20 0 q 10 -14 20 0 q 10 -14 20 0 q 10 -14 20 0 q 10 -14 20 0" fill="none" stroke="#65a30d" stroke-width="14" stroke-linecap="round"/></g><text x="360" y="252" text-anchor="middle" font-size="11" font-weight="800" fill="#3f6212">caterpillar: chewing mandibles</text><g><animate attributeName="opacity" keyTimes="0.0000;0.1786;0.2000;1.0000" values="0;0;1;1" dur="14s" begin="hb-play.begin+0s" fill="freeze"/><path d="M 120 330 l 14 -26 l 14 26 l 14 -26 l 14 26 Z" fill="#f5f5f4" stroke="#57534e" stroke-width="2"/><path d="M 190 330 l 14 -26 l 14 26 l 14 -26 l 14 26 Z" fill="#f5f5f4" stroke="#57534e" stroke-width="2"/><path d="M 260 330 l 14 -26 l 14 26 l 14 -26 l 14 26 Z" fill="#f5f5f4" stroke="#57534e" stroke-width="2"/><path d="M 330 330 l 14 -26 l 14 26 l 14 -26 l 14 26 Z" fill="#f5f5f4" stroke="#57534e" stroke-width="2"/><text x="280" y="380" text-anchor="middle" font-size="11" font-weight="800" fill="#57534e">grazers: grinding molars + gut microbes digest cellulose</text></g></g>
<g class="part" data-part="def" data-name="Plant defences" data-info="Thorns, spines and hairs (acacias); tough silica-rich leaves (grasses); toxic secondary compounds (alkaloids, tannins, cyanogenic glycosides in cassava)." tabindex="0" role="button" aria-label="Plant defences"><rect x="560" y="80" width="510" height="320" rx="16" fill="#f0fdf4" stroke="#86efac"/><text x="815" y="106" text-anchor="middle" font-size="15" font-weight="800" fill="#15803d">PLANTS defend</text><g><animate attributeName="opacity" keyTimes="0.0000;0.3571;0.3786;1.0000" values="0;0;1;1" dur="14s" begin="hb-play.begin+0s" fill="freeze"/><path d="M 620 300 L 760 160" stroke="#a16207" stroke-width="10"/><path d="M 640 280 l 22 -4 l -22 -8" fill="#fef9c3" stroke="#a16207" stroke-width="2"/><path d="M 666 254 l 22 -4 l -22 -8" fill="#fef9c3" stroke="#a16207" stroke-width="2"/><path d="M 692 228 l 22 -4 l -22 -8" fill="#fef9c3" stroke="#a16207" stroke-width="2"/><path d="M 718 202 l 22 -4 l -22 -8" fill="#fef9c3" stroke="#a16207" stroke-width="2"/><path d="M 744 176 l 22 -4 l -22 -8" fill="#fef9c3" stroke="#a16207" stroke-width="2"/><text x="690" y="340" text-anchor="middle" font-size="12" font-weight="800" fill="#14532d">thorns, spines, hairs</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.4286;0.4500;1.0000" values="0;0;1;1" dur="14s" begin="hb-play.begin+0s" fill="freeze"/><path d="M 820 300 Q 840 200 860 140" stroke="#65a30d" stroke-width="8" fill="none"/><circle cx="836" cy="280" r="3" fill="#e5e7eb" stroke="#64748b"/><circle cx="841" cy="250" r="3" fill="#e5e7eb" stroke="#64748b"/><circle cx="846" cy="220" r="3" fill="#e5e7eb" stroke="#64748b"/><circle cx="851" cy="190" r="3" fill="#e5e7eb" stroke="#64748b"/><circle cx="856" cy="160" r="3" fill="#e5e7eb" stroke="#64748b"/><text x="860" y="340" text-anchor="middle" font-size="12" font-weight="800" fill="#14532d">silica in grass</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.5000;0.5214;1.0000" values="0;0;1;1" dur="14s" begin="hb-play.begin+0s" fill="freeze"/><g transform="translate(990 220)"><path d="M -30 0 Q 0 -60 30 0 Q 0 40 -30 0 Z" fill="#4ade80" stroke="#14532d"/><text x="0" y="6" text-anchor="middle" font-size="18">☠</text></g><text x="990" y="340" text-anchor="middle" font-size="11" font-weight="800" fill="#14532d">toxins (alkaloids, tannins,</text><text x="990" y="356" text-anchor="middle" font-size="11" font-weight="800" fill="#14532d">cyanogenic glycosides)</text></g></g>
<g class="part" data-part="ant" data-name="Whistling-thorn acacia" data-info="Ants live in swollen thorns and attack browsers; the tree feeds them nectar." tabindex="0" role="button" aria-label="Whistling-thorn acacia"><g><animate attributeName="opacity" keyTimes="0.0000;0.6071;0.6286;1.0000" values="0;0;1;1" dur="14s" begin="hb-play.begin+0s" fill="freeze"/><rect x="30" y="420" width="510" height="120" rx="16" fill="#fefce8" stroke="#fde047"/><ellipse cx="110" cy="480" rx="34" ry="26" fill="#a16207"/><ellipse cx="110" cy="480" rx="20" ry="14" fill="#fef3c7"/><text x="330" y="470" text-anchor="middle" font-size="12" font-weight="800" fill="#713f12">whistling-thorn acacia: ants in swollen</text><text x="330" y="488" text-anchor="middle" font-size="12" font-weight="800" fill="#713f12">thorns attack browsers; tree feeds them nectar</text><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.6071;0.6214;1.0000" values="0;0;1;1" dur="14s" begin="hb-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.6071;0.6786;0.7500;1.0000" values="110 480;110 480;170 450;190 510;190 510" dur="14s" begin="hb-play.begin+0s" fill="freeze"/><circle r="4" fill="#111827"/></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.6286;0.6429;1.0000" values="0;0;1;1" dur="14s" begin="hb-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.6286;0.7000;0.7714;1.0000" values="110 480;110 480;190 450;220 510;220 510" dur="14s" begin="hb-play.begin+0s" fill="freeze"/><circle r="4" fill="#111827"/></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.6500;0.6643;1.0000" values="0;0;1;1" dur="14s" begin="hb-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.6500;0.7214;0.7929;1.0000" values="110 480;110 480;210 450;250 510;250 510" dur="14s" begin="hb-play.begin+0s" fill="freeze"/><circle r="4" fill="#111827"/></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.6714;0.6857;1.0000" values="0;0;1;1" dur="14s" begin="hb-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.6714;0.7429;0.8143;1.0000" values="110 480;110 480;230 450;280 510;280 510" dur="14s" begin="hb-play.begin+0s" fill="freeze"/><circle r="4" fill="#111827"/></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.6929;0.7071;1.0000" values="0;0;1;1" dur="14s" begin="hb-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.6929;0.7643;0.8357;1.0000" values="110 480;110 480;250 450;310 510;310 510" dur="14s" begin="hb-play.begin+0s" fill="freeze"/><circle r="4" fill="#111827"/></g></g></g></g>
<g class="part" data-part="detox" data-name="Counter-adaptations" data-info="Some herbivores detoxify or store plant toxins: monarch caterpillars store milkweed toxins; koalas detoxify eucalyptus oils." tabindex="0" role="button" aria-label="Counter-adaptations"><g><animate attributeName="opacity" keyTimes="0.0000;0.7857;0.8071;1.0000" values="0;0;1;1" dur="14s" begin="hb-play.begin+0s" fill="freeze"/><rect x="560" y="420" width="510" height="120" rx="16" fill="#f5f3ff" stroke="#c4b5fd"/><text x="815" y="460" text-anchor="middle" font-size="13" font-weight="800" fill="#6d28d9">counter-adaptations:</text><text x="815" y="482" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">monarch caterpillars store milkweed toxins;</text><text x="815" y="500" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">koalas detoxify eucalyptus oils</text></g></g>
</svg>