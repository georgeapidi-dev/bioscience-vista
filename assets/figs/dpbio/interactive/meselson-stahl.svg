<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 580" class="vd-svg" role="img" aria-labelledby="msd-title msd-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="msd-play" data-vd-play-label="Play: spin the tubes" data-vd-steps="[[0, &quot;Meselson and Stahl (1958): how does DNA copy itself?&quot;], [1, &quot;Generation 0: all DNA heavy (\u00b9\u2075N/\u00b9\u2075N).&quot;], [4, &quot;Generation 1 in \u00b9\u2074N: one intermediate band.&quot;], [8, &quot;Generation 2: intermediate + light bands.&quot;], [11, &quot;Only semi-conservative replication predicts this.&quot;]]" data-vd-dur="14">
<title id="msd-title">Meselson and Stahl</title><desc id="msd-desc">Centrifuge tubes showing DNA bands: heavy at generation 0, one intermediate band at generation 1, and intermediate plus light bands at generation 2, matching semi-conservative replication with parental strands in blue and new strands in orange.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="580" fill="#ffffff"/>
<g aria-hidden="true"><animate id="msd-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<text class="head" x="30" y="34">Meselson and Stahl: semi-conservative replication</text><text class="note" x="30" y="56">Blue = ¹⁵N (heavy) strand; orange = ¹⁴N (light) strand.</text>
<g class="part" data-part="setup" data-name="The experiment" data-info="E. coli grown for many generations in ¹⁵N (heavy) were moved to ¹⁴N (light). DNA was extracted after each generation and centrifuged in a caesium chloride density gradient." tabindex="0" role="button" aria-label="The experiment"><path d="M 210 110 L 210 400 A 30 30 0 0 0 270 400 L 270 110" fill="#f8fafc" stroke="#334155" stroke-width="2.5"/><g><animate attributeName="opacity" keyTimes="0.0000;0.0714;0.0929;1.0000" values="0;0;1;1" dur="14s" begin="msd-play.begin+0s" fill="freeze"/><rect x="213" y="340" width="54" height="10" rx="4" fill="#7c3aed"/></g><text x="240" y="470" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">generation 0</text><text x="196" y="209" text-anchor="end" font-size="11" font-weight="800" fill="#475569">light</text><text x="196" y="279" text-anchor="end" font-size="11" font-weight="800" fill="#475569">intermediate</text><text x="196" y="349" text-anchor="end" font-size="11" font-weight="800" fill="#475569">heavy</text></g>
<g class="part" data-part="g1" data-name="After one generation" data-info="One band at intermediate density (¹⁵N/¹⁴N): rules out conservative replication." tabindex="0" role="button" aria-label="After one generation"><path d="M 360 110 L 360 400 A 30 30 0 0 0 420 400 L 420 110" fill="#f8fafc" stroke="#334155" stroke-width="2.5"/><g><animate attributeName="opacity" keyTimes="0.0000;0.2857;0.3071;1.0000" values="0;0;1;1" dur="14s" begin="msd-play.begin+0s" fill="freeze"/><rect x="363" y="270" width="54" height="10" rx="4" fill="#7c3aed"/></g><text x="390" y="470" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">generation 1</text></g>
<g class="part" data-part="g2" data-name="After two generations" data-info="Two bands: intermediate and light: rules out dispersive replication. Only semi-conservative replication fits." tabindex="0" role="button" aria-label="After two generations"><path d="M 510 110 L 510 400 A 30 30 0 0 0 570 400 L 570 110" fill="#f8fafc" stroke="#334155" stroke-width="2.5"/><g><animate attributeName="opacity" keyTimes="0.0000;0.5714;0.5929;1.0000" values="0;0;1;1" dur="14s" begin="msd-play.begin+0s" fill="freeze"/><rect x="513" y="270" width="54" height="10" rx="4" fill="#7c3aed"/></g><g><animate attributeName="opacity" keyTimes="0.0000;0.5714;0.5929;1.0000" values="0;0;1;1" dur="14s" begin="msd-play.begin+0s" fill="freeze"/><rect x="513" y="200" width="54" height="10" rx="4" fill="#7c3aed"/></g><text x="540" y="470" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">generation 2</text></g>
<rect x="620" y="90" width="450" height="440" rx="16" fill="#f8fafc" stroke="#cbd5e1"/><text x="845" y="116" text-anchor="middle" font-size="14" font-weight="800" fill="#111827">semi-conservative model</text><g><animate attributeName="opacity" keyTimes="0.0000;0.0714;0.0929;1.0000" values="0;0;1;1" dur="14s" begin="msd-play.begin+0s" fill="freeze"/><rect x="830" y="140" width="12" height="70" rx="6" fill="#3b82f6"/><rect x="846" y="140" width="12" height="70" rx="6" fill="#3b82f6"/></g><g><animate attributeName="opacity" keyTimes="0.0000;0.2857;0.3071;1.0000" values="0;0;1;1" dur="14s" begin="msd-play.begin+0s" fill="freeze"/><rect x="760" y="260" width="12" height="70" rx="6" fill="#3b82f6"/><rect x="776" y="260" width="12" height="70" rx="6" fill="#f97316"/><rect x="900" y="260" width="12" height="70" rx="6" fill="#f97316"/><rect x="916" y="260" width="12" height="70" rx="6" fill="#3b82f6"/></g><g><animate attributeName="opacity" keyTimes="0.0000;0.5714;0.5929;1.0000" values="0;0;1;1" dur="14s" begin="msd-play.begin+0s" fill="freeze"/><rect x="700" y="390" width="12" height="70" rx="6" fill="#3b82f6"/><rect x="716" y="390" width="12" height="70" rx="6" fill="#f97316"/><rect x="780" y="390" width="12" height="70" rx="6" fill="#f97316"/><rect x="796" y="390" width="12" height="70" rx="6" fill="#f97316"/><rect x="870" y="390" width="12" height="70" rx="6" fill="#f97316"/><rect x="886" y="390" width="12" height="70" rx="6" fill="#f97316"/><rect x="950" y="390" width="12" height="70" rx="6" fill="#f97316"/><rect x="966" y="390" width="12" height="70" rx="6" fill="#3b82f6"/></g><g><animate attributeName="opacity" keyTimes="0.0000;0.7857;0.8071;1.0000" values="0;0;1;1" dur="14s" begin="msd-play.begin+0s" fill="freeze"/><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.7857;0.8071;1.0000" values="0;0;1;1" dur="14s" begin="msd-play.begin+0s" fill="freeze"/><rect x="705.0" y="488" width="280" height="24" rx="12" fill="#dcfce7" stroke="#1f2937" stroke-width="1"/><text x="845" y="505" text-anchor="middle" font-size="12" font-weight="700">✓ matches: 1 band, then 2 bands</text></g></g>
</svg>