<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 800" class="vd-svg" role="img" aria-labelledby="ey-title ey-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="ey-play" data-vd-play-label="Play: focusing, the pupil reflex and vision" data-vd-steps="[[0, &quot;Distant object: light rays arrive almost parallel. The ciliary muscle relaxes, the suspensory ligaments are pulled tight and the lens is pulled thin, so it refracts light only a little: the image is focused on the fovea.&quot;], [4, &quot;Near object: light rays diverge. The ciliary muscle contracts, the suspensory ligaments slacken and the elastic lens becomes rounder (fatter), so it refracts light more and the image is still focused on the retina.&quot;], [8.5, &quot;Bright light: in the pupil reflex the circular muscles of the iris contract and the radial muscles relax, so the pupil gets smaller and less light enters, protecting the retina. In dim light the opposite happens.&quot;], [12.5, &quot;Rods and cones convert light into nerve impulses, which travel along the optic nerve to the brain. Where the optic nerve leaves there are no receptors: the blind spot.&quot;]]" data-vd-dur="16">
<title id="ey-title">The human eye in horizontal section</title><desc id="ey-desc">Horizontal section through the right eye seen from above, front to the left: cornea, conjunctiva, aqueous humour, iris, pupil, lens, suspensory ligaments, ciliary muscle, vitreous humour, sclera, choroid, retina, fovea, blind spot and optic nerve.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="800" fill="#ffffff"/>
<g aria-hidden="true"><animate id="ey-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<text class="head" x="30" y="36">The human eye (horizontal section)</text><text class="note" x="30" y="58">Right eye seen from above, front to the left: the nose side is at the bottom. Not to scale.</text>
<g class="part" data-part="opt" data-name="Optic nerve" data-info="Carries nerve impulses from the retina to the brain." tabindex="0" role="button" aria-label="Optic nerve"><path d="M 793 445 C 859 451 939 481 1029 541 L 1004 583 C 919 527 849 505 787 497 Z" fill="#fde68a" stroke="#a16207" stroke-width="3"/><path d="M 809 471 C 879 481 949 511 1015 561" fill="none" stroke="#a16207" stroke-width="1.5" stroke-dasharray="8 6"/></g>
<g class="part" data-part="scl" data-name="Sclera" data-info="Tough white outer coat that protects the eye and keeps its shape; the eye muscles attach to it." tabindex="0" role="button" aria-label="Sclera"><path d="M 380.8 285.0 A 230 230 0 1 1 380.8 515.0" fill="none" stroke="#f1f5f9" stroke-width="18"/><path d="M 373.0 280.5 A 239 239 0 1 1 373.0 519.5" fill="none" stroke="#64748b" stroke-width="2"/></g>
<g class="part" data-part="cho" data-name="Choroid" data-info="Layer full of blood vessels that supply the retina; its dark pigment absorbs stray light so it is not reflected inside the eye." tabindex="0" role="button" aria-label="Choroid"><path d="M 418.7 254.8 A 217 217 0 1 1 418.7 545.2" fill="none" stroke="#5b3a29" stroke-width="8"/></g>
<g class="part" data-part="vit" data-name="Vitreous humour" data-info="Clear jelly filling the eyeball behind the lens; keeps the eyeball’s shape and transmits light to the retina." tabindex="0" role="button" aria-label="Vitreous humour"><circle cx="580" cy="400" r="204" fill="#f0f9ff"/></g>
<g class="part" data-part="ret" data-name="Retina" data-info="Light-sensitive layer of receptor cells: rods (dim light, black and white) and cones (bright light, colour). They convert light into nerve impulses." tabindex="0" role="button" aria-label="Retina"><path d="M 431.5 251.5 A 210 210 0 1 1 431.5 548.5" fill="none" stroke="#e11d48" stroke-width="7"/></g>
<g class="part" data-part="fov" data-name="Fovea (yellow spot)" data-info="Small pit in the retina on the visual axis, packed with cones and no rods: the place of sharpest, colour vision." tabindex="0" role="button" aria-label="Fovea (yellow spot)"><path d="M 787 388 C 794 394 794 406 787 412" fill="none" stroke="#facc15" stroke-width="9"/></g>
<g class="part" data-part="blind" data-name="Blind spot (optic disc)" data-info="Where the optic nerve leaves the eye. It has no rods or cones, so no image is detected here." tabindex="0" role="button" aria-label="Blind spot (optic disc)"><circle cx="779.7" cy="464.9" r="11" fill="#fef3c7" stroke="#a16207" stroke-width="2.5"/></g>
<g class="part" data-part="aq" data-name="Aqueous humour" data-info="Clear watery fluid between the cornea and the lens; keeps the front of the eye in shape and nourishes the cornea and lens." tabindex="0" role="button" aria-label="Aqueous humour"><path d="M 380.8 285.0 C 270.8 280.0 270.8 520.0 380.8 515.0 Z" fill="#e0f2fe"/></g>
<g class="part" data-part="cor" data-name="Cornea" data-info="Transparent front part of the sclera. Refracts (bends) light: it does most of the focusing." tabindex="0" role="button" aria-label="Cornea"><path d="M 380.8 285.0 C 270.8 280.0 270.8 520.0 380.8 515.0" fill="none" stroke="#7dd3fc" stroke-width="12"/><path d="M 380.8 285.0 C 270.8 280.0 270.8 520.0 380.8 515.0" fill="none" stroke="#0369a1" stroke-width="1.6"/></g>
<g class="part" data-part="conj" data-name="Conjunctiva" data-info="Thin transparent membrane covering the front of the sclera; kept moist by tears." tabindex="0" role="button" aria-label="Conjunctiva"><path d="M 420.8 267.0 C 390.8 267.0 376.8 277.0 374.8 283.0" fill="none" stroke="#f472b6" stroke-width="3"/><path d="M 420.8 533.0 C 390.8 533.0 376.8 523.0 374.8 517.0" fill="none" stroke="#f472b6" stroke-width="3"/></g>
<g class="part" data-part="cil" data-name="Ciliary muscle (ciliary body)" data-info="Ring of muscle around the lens. Contracts for near objects (ligaments slacken, lens becomes rounder); relaxes for distant objects (ligaments pulled tight, lens thinner)." tabindex="0" role="button" aria-label="Ciliary muscle (ciliary body)"><g><path d="M 382.8 285.0 C 410.8 291.0 450.8 293.0 476.8 275.0 C 450.8 311.0 414.8 319.0 386.8 307.0 Z" fill="#b45309" stroke="#78350f" stroke-width="2"/><animateTransform attributeName="transform" type="translate" values="0 0;0 0;0 7;0 7;0 0;0 0" keyTimes="0;0.25;0.31;0.53;0.58;1" dur="16s" begin="ey-play.begin+0s"/></g><g><path d="M 382.8 515.0 C 410.8 509.0 450.8 507.0 476.8 525.0 C 450.8 489.0 414.8 481.0 386.8 493.0 Z" fill="#b45309" stroke="#78350f" stroke-width="2"/><animateTransform attributeName="transform" type="translate" values="0 0;0 0;0 -7;0 -7;0 0;0 0" keyTimes="0;0.25;0.31;0.53;0.58;1" dur="16s" begin="ey-play.begin+0s"/></g></g>
<g class="part" data-part="sus" data-name="Suspensory ligaments" data-info="Fibres that hold the lens and connect it to the ciliary muscle." tabindex="0" role="button" aria-label="Suspensory ligaments"><g stroke="#64748b" stroke-width="1.6" fill="none"><path d="M 420.8 315.0 L 438.8 332.0 M 442.8 311.0 L 444.8 334.0"/><path d="M 420.8 485.0 L 438.8 468.0 M 442.8 489.0 L 444.8 466.0"/><animate attributeName="opacity" values="1;1;0;0;1;1" keyTimes="0;0.25;0.31;0.53;0.58;1" dur="16s" begin="ey-play.begin+0s"/></g><g stroke="#64748b" stroke-width="1.6" fill="none" opacity="0"><path d="M 420.8 322.0 Q 432.8 296.0 438.8 336.0 M 442.8 318.0 Q 450.8 300.0 444.8 338.0"/><path d="M 420.8 478.0 Q 432.8 504.0 438.8 464.0 M 442.8 482.0 Q 450.8 500.0 444.8 462.0"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.25;0.31;0.53;0.58;1" dur="16s" begin="ey-play.begin+0s"/></g></g>
<g transform="translate(438.8 400)"><g><animateTransform attributeName="transform" type="scale" values="1 1;1 1;1.38 0.93;1.38 0.93;1 1;1 1" keyTimes="0;0.25;0.31;0.53;0.58;1" dur="16s" begin="ey-play.begin+0s"/><g class="part" data-part="lens" data-name="Lens" data-info="Transparent and elastic. Its shape can change to fine-focus light from near or distant objects onto the retina (accommodation)." tabindex="0" role="button" aria-label="Lens"><path d="M 0 -74 C 30 -51.8 30 51.8 0 74 C -26 51.8 -26 -51.8 0 -74 Z" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2.5"/></g></g></g>
<g class="part" data-part="iris" data-name="Iris" data-info="Coloured ring of muscle that controls the size of the pupil: circular muscles contract in bright light (pupil narrows); radial muscles contract in dim light (pupil widens)." tabindex="0" role="button" aria-label="Iris"><g><path d="M 384.8 293.0 L 368.8 370 L 376.8 370 L 394.8 293.0 Z" fill="#3b82f6" stroke="#1e3a8a" stroke-width="2"/><animateTransform attributeName="transform" type="translate" values="0 0;0 0;0 18;0 18;0 0;0 0" keyTimes="0;0.53;0.58;0.72;0.78;1" dur="16s" begin="ey-play.begin+0s"/></g><g><path d="M 384.8 507.0 L 368.8 430 L 376.8 430 L 394.8 507.0 Z" fill="#3b82f6" stroke="#1e3a8a" stroke-width="2"/><animateTransform attributeName="transform" type="translate" values="0 0;0 0;0 -18;0 -18;0 0;0 0" keyTimes="0;0.53;0.58;0.72;0.78;1" dur="16s" begin="ey-play.begin+0s"/></g></g>
<g class="part" data-part="pup" data-name="Pupil" data-info="The hole in the middle of the iris through which light enters the eye." tabindex="0" role="button" aria-label="Pupil"><rect x="366.8" y="374" width="14" height="52" fill="#0f172a" opacity=".08"/></g>
<g class="labels"><g class="lbl" data-for="conj"><polyline points="130.7,144.0 400.8,269.0"/><circle cx="400.8" cy="269.0" r="2.6"/><text x="30" y="150" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="4">Conjunctiva</text></g><g class="lbl" data-for="sus"><polyline points="209.0,214.0 432.8,325.0"/><circle cx="432.8" cy="325.0" r="2.6"/><text x="30" y="220" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="4">Suspensory ligaments</text></g><g class="lbl" data-for="cor"><polyline points="87.2,294.0 300.8,340.0"/><circle cx="300.8" cy="340.0" r="2.6"/><text x="30" y="300" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="4">Cornea</text></g><g class="lbl" data-for="pup"><polyline points="78.5,394.0 373.8,400.0"/><circle cx="373.8" cy="400.0" r="2.6"/><text x="30" y="400" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="4">Pupil</text></g><g class="lbl" data-for="aq"><polyline points="156.8,464.0 330.8,450.0"/><circle cx="330.8" cy="450.0" r="2.6"/><text x="30" y="470" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="4">Aqueous humour</text></g><g class="lbl" data-for="iris"><polyline points="69.8,534.0 372.8,460.0"/><circle cx="372.8" cy="460.0" r="2.6"/><text x="30" y="540" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="4">Iris</text></g><g class="lbl" data-for="cil"><polyline points="287.3,634.0 440.8,495.0"/><circle cx="440.8" cy="495.0" r="2.6"/><text x="30" y="640" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="4">Ciliary muscle (ciliary body)</text></g><g class="lbl" data-for="lens"><polyline points="447.6,104.0 438.8,330.0"/><circle cx="438.8" cy="330.0" r="2.6"/><text x="470" y="110" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="4">Lens</text></g><g class="lbl" data-for="scl"><polyline points="1012.8,134.0 640.0,166.0"/><circle cx="640.0" cy="166.0" r="2.6"/><text x="1070" y="140" text-anchor="end" paint-order="stroke" stroke="#fff" stroke-width="4">Sclera</text></g><g class="lbl" data-for="cho"><polyline points="1004.1,194.0 710.0,196.0"/><circle cx="710.0" cy="196.0" r="2.6"/><text x="1070" y="200" text-anchor="end" paint-order="stroke" stroke="#fff" stroke-width="4">Choroid</text></g><g class="lbl" data-for="ret"><polyline points="1012.8,254.0 750.0,240.0"/><circle cx="750.0" cy="240.0" r="2.6"/><text x="1070" y="260" text-anchor="end" paint-order="stroke" stroke="#fff" stroke-width="4">Retina</text></g><g class="lbl" data-for="vit"><polyline points="934.5,314.0 620.0,320.0"/><circle cx="620.0" cy="320.0" r="2.6"/><text x="1070" y="320" text-anchor="end" paint-order="stroke" stroke="#fff" stroke-width="4">Vitreous humour</text></g><g class="lbl" data-for="fov"><polyline points="899.7,394.0 792.0,400.0"/><circle cx="792.0" cy="400.0" r="2.6"/><text x="1070" y="400" text-anchor="end" paint-order="stroke" stroke="#fff" stroke-width="4">Fovea (yellow spot)</text></g><g class="lbl" data-for="blind"><polyline points="864.9,464.0 787.7,464.9"/><circle cx="787.7" cy="464.9" r="2.6"/><text x="1070" y="470" text-anchor="end" paint-order="stroke" stroke="#fff" stroke-width="4">Blind spot (optic disc)</text></g><g class="lbl" data-for="opt"><polyline points="969.3,614.0 948.7,531.1"/><circle cx="948.7" cy="531.1" r="2.6"/><text x="1070" y="620" text-anchor="end" paint-order="stroke" stroke="#fff" stroke-width="4">Optic nerve</text></g></g>
<g aria-hidden="true"><line x1="200" y1="400" x2="790" y2="400" stroke="#94a3b8" stroke-dasharray="3 6"/><text x="600" y="416" font-size="12" fill="#64748b">visual axis</text><text x="1000" y="70" font-size="13" fill="#64748b" text-anchor="end">temporal (towards the ear) ↑</text><text x="1000" y="770" font-size="13" fill="#64748b" text-anchor="end">nasal (towards the nose) ↓</text></g>
