et="1" opacity="0"><set attributeName="opacity" to="1" begin="ey-play.begin+4.2s" dur="4.3s"/><animate attributeName="stroke-dashoffset" from="1" to="0" dur="1.4s" begin="ey-play.begin+4.2s" fill="freeze"/></path><g opacity="0"><set attributeName="opacity" to="1" begin="ey-play.begin+0.2s" dur="3.8s"/><text x="560" y="96" font-size="15" font-weight="700" fill="#b45309">light from a distant object</text></g><g opacity="0"><set attributeName="opacity" to="1" begin="ey-play.begin+4.2s" dur="4.3s"/><circle cx="120" cy="400" r="7" fill="#b45309"/><text x="560" y="96" font-size="15" font-weight="700" fill="#b45309">light from a near object</text></g><g opacity="0"><set attributeName="opacity" to="1" begin="ey-play.begin+8.5s" dur="4s"/><path d="M 40 340 L 305 370" stroke="#facc15" stroke-width="7" opacity=".85"/><path d="M 40 370 L 305 385" stroke="#facc15" stroke-width="7" opacity=".85"/><path d="M 40 400 L 305 400" stroke="#facc15" stroke-width="7" opacity=".85"/><path d="M 40 430 L 305 415" stroke="#facc15" stroke-width="7" opacity=".85"/><path d="M 40 460 L 305 430" stroke="#facc15" stroke-width="7" opacity=".85"/><text x="560" y="96" font-size="15" font-weight="700" fill="#a16207">bright light: the pupil narrows</text></g><g opacity="0"><set attributeName="opacity" to="1" begin="ey-play.begin+12.5s" dur="3.5s"/><text x="859" y="611" font-size="14" font-weight="700" fill="#a16207">impulses to the brain</text></g><circle r="6" fill="#facc15" stroke="#92400e" stroke-width="1.5" opacity="0"><set attributeName="opacity" to="1" begin="ey-play.begin+12.6s" dur="2.4s"/><animateMotion path="M 790 400 L 790.0 400.0 A 210 210 0 0 1 779.7 464.9 L 839 483 L 1013 559" dur="2.4s" begin="ey-play.begin+12.6s" fill="freeze"/></circle><circle r="6" fill="#facc15" stroke="#92400e" stroke-width="1.5" opacity="0"><set attributeName="opacity" to="1" begin="ey-play.begin+13.1s" dur="2.4s"/><animateMotion path="M 790 400 L 790.0 400.0 A 210 210 0 0 1 779.7 464.9 L 839 483 L 1013 559" dur="2.4s" begin="ey-play.begin+13.1s" fill="freeze"/></circle><circle r="6" fill="#facc15" stroke="#92400e" stroke-width="1.5" opacity="0"><set attributeName="opacity" to="1" begin="ey-play.begin+13.6s" dur="2.4s"/><animateMotion path="M 790 400 L 790.0 400.0 A 210 210 0 0 1 779.7 464.9 L 839 483 L 1013 559" dur="2.4s" begin="ey-play.begin+13.6s" fill="freeze"/></circle><circle r="6" fill="#facc15" stroke="#92400e" stroke-width="1.5" opacity="0"><set attributeName="opacity" to="1" begin="ey-play.begin+14.1s" dur="2.4s"/><animateMotion path="M 790 400 L 790.0 400.0 A 210 210 0 0 1 779.7 464.9 L 839 483 L 1013 559" dur="2.4s" begin="ey-play.begin+14.1s" fill="freeze"/></circle><text x="550" y="740" text-anchor="middle" font-size="17" font-weight="700" fill="#1d4ed8" opacity="0">1  Distant object: ciliary muscle relaxed, lens thin<set attributeName="opacity" to="1" begin="ey-play.begin+0s" dur="4s"/></text><text x="550" y="740" text-anchor="middle" font-size="17" font-weight="700" fill="#1d4ed8" opacity="0">2  Near object: ciliary muscle contracts, lens rounder<set attributeName="opacity" to="1" begin="ey-play.begin+4s" dur="4.5s"/></text><text x="550" y="740" text-anchor="middle" font-size="17" font-weight="700" fill="#1d4ed8" opacity="0">3  Bright light: pupil reflex narrows the pupil<set attributeName="opacity" to="1" begin="ey-play.begin+8.5s" dur="4.0s"/></text><text x="550" y="740" text-anchor="middle" font-size="17" font-weight="700" fill="#1d4ed8" opacity="0">4  Impulses travel along the optic nerve to the brain<set attributeName="opacity" to="1" begin="ey-play.begin+12.5s" dur="3.5s"/></text></g>
</svg>