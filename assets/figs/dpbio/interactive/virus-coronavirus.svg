<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 680" class="vd-svg" role="img" aria-labelledby="co-title co-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="co-play" data-vd-play-label="Play: build the virus" data-vd-steps="[[0, &quot;Coronavirus (SARS-CoV-2): an enveloped RNA virus.&quot;], [1, &quot;Its genome: one long single-stranded RNA.&quot;], [3, &quot;Nucleocapsid (N) proteins coat the RNA.&quot;], [5.5, &quot;A lipid envelope from the host cell surrounds it.&quot;], [7.5, &quot;Spike glycoproteins, and M and E proteins, are set in the envelope.&quot;]]" data-vd-dur="14">
<title id="co-title">Coronavirus structure</title><desc id="co-desc">A coronavirus: single-stranded RNA bound by nucleocapsid protein inside a lipid envelope with spike glycoproteins and M and E proteins.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
