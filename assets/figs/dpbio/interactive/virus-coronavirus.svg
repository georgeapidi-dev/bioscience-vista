<g><animate attributeName="opacity" keyTimes="0.0000;0.0714;0.0929;1.0000" values="0;0;1;1" dur="14s" begin="co-play.begin+0s" fill="freeze"/><rect x="790" y="120" width="410" height="230" rx="16" fill="#eff6ff" stroke="#93c5fd"/><text x="995.0" y="150" text-anchor="middle" font-size="15" font-weight="800" fill="#1e3a8a">Key features</text><text x="810" y="182" text-anchor="start" font-size="13" font-weight="600" fill="#111827"><tspan font-weight="800">genome:</tspan> ssRNA (+), ~30 000 nucleotides</text><text x="810" y="212" text-anchor="start" font-size="13" font-weight="600" fill="#111827"><tspan font-weight="800">capsid:</tspan> helical nucleocapsid (N protein)</text><text x="810" y="242" text-anchor="start" font-size="13" font-weight="600" fill="#111827"><tspan font-weight="800">envelope:</tspan> yes: lipid, from host</text><text x="810" y="272" text-anchor="start" font-size="13" font-weight="600" fill="#111827"><tspan font-weight="800">attachment:</tspan> spike (S) binds ACE2</text><text x="810" y="302" text-anchor="start" font-size="13" font-weight="600" fill="#111827"><tspan font-weight="800">size:</tspan> about 100 nm</text><text x="810" y="332" text-anchor="start" font-size="13" font-weight="600" fill="#111827"><tspan font-weight="800">host:</tspan> mammals and birds</text></g>
