<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 480" class="vd-svg" role="img" aria-labelledby="or-title or-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="or-play" data-vd-play-label="Play: two collisions" data-vd-steps="[[0, &quot;Collision theory: orientation matters.&quot;], [1, &quot;Wrong way round: the oxygen atoms meet, nothing happens.&quot;], [5, &quot;Right way round, with enough energy: a reaction, forming CO\u2082.&quot;], [9, &quot;Enzymes hold substrates in the right orientation.&quot;]]" data-vd-dur="12">
<title id="or-title">Collision orientation</title><desc id="or-desc">Two collisions between CO and O2: with the wrong orientation the molecules bounce apart; with the correct orientation and enough energy they react to form CO2. Enzymes hold substrates in the right orientation.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="480" fill="#ffffff"/>
<g aria-hidden="true"><animate id="or-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<text class="head" x="30" y="34">Only collisions with the right orientation react</text><text class="note" x="30" y="56">CO + O₂: grey = carbon, red = oxygen.</text>
<g class="part" data-part="no" data-name="Wrong orientation" data-info="The molecules collide, but the atoms that need to bond are not facing each other: they bounce apart, no reaction." tabindex="0" role="button" aria-label="Wrong orientation"><text x="60" y="120" text-anchor="start" font-size="15" font-weight="800" fill="#b91c1c">Wrong orientation</text><g transform="translate(150 170)"><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.0833;0.2083;0.3333;1.0000" values="150 170;150 170;420 170;220 205;220 205" dur="12s" begin="or-play.begin+0s" fill="freeze"/><circle cx="-22" cy="0" r="20" fill="#374151" stroke="#111827" stroke-width="1.5"/><text x="-22" y="5" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">C</text><circle cx="22" cy="0" r="20" fill="#dc2626" stroke="#111827" stroke-width="1.5"/><text x="22" y="5" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">O</text></g><g transform="translate(760 170)"><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.0833;0.2083;0.3333;1.0000" values="760 170;760 170;510 170;700 135;700 135" dur="12s" begin="or-play.begin+0s" fill="freeze"/><circle cx="-22" cy="0" r="20" fill="#dc2626" stroke="#111827" stroke-width="1.5"/><text x="-22" y="5" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">O</text><circle cx="22" cy="0" r="20" fill="#dc2626" stroke="#111827" stroke-width="1.5"/><text x="22" y="5" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">O</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.2917;0.3167;1.0000" values="0;0;1;1" dur="12s" begin="or-play.begin+0s" fill="freeze"/><text x="870" y="175" text-anchor="start" font-size="16" font-weight="800" fill="#b91c1c">→ no reaction</text></g></g>
<g class="part" data-part="yes" data-name="Correct orientation" data-info="The C of CO meets an O of O₂ with enough energy (≥ Ea): bonds break and form, giving CO₂." tabindex="0" role="button" aria-label="Correct orientation"><text x="60" y="290" text-anchor="start" font-size="15" font-weight="800" fill="#15803d">Correct orientation + enough energy</text><g transform="translate(150 340)"><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.4167;0.5417;1.0000" values="150 340;150 340;420 340;420 340" dur="12s" begin="or-play.begin+0s" fill="freeze"/><g><animate attributeName="opacity" keyTimes="0.0000;0.5417;0.5667;1.0000" values="1;1;0;0" dur="12s" begin="or-play.begin+0s" fill="freeze"/><circle cx="-22" cy="0" r="20" fill="#dc2626" stroke="#111827" stroke-width="1.5"/><text x="-22" y="5" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">O</text><circle cx="22" cy="0" r="20" fill="#374151" stroke="#111827" stroke-width="1.5"/><text x="22" y="5" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">C</text></g></g><g transform="translate(760 340)"><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.4167;0.5417;1.0000" values="760 340;760 340;510 340;510 340" dur="12s" begin="or-play.begin+0s" fill="freeze"/><g><animate attributeName="opacity" keyTimes="0.0000;0.5417;0.5667;1.0000" values="1;1;0;0" dur="12s" begin="or-play.begin+0s" fill="freeze"/><circle cx="-22" cy="0" r="20" fill="#dc2626" stroke="#111827" stroke-width="1.5"/><text x="-22" y="5" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">O</text><circle cx="22" cy="0" r="20" fill="#dc2626" stroke="#111827" stroke-width="1.5"/><text x="22" y="5" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">O</text></g></g><g><animate attributeName="opacity" keyTimes="0.0000;0.5500;0.5750;1.0000" values="0;0;1;1" dur="12s" begin="or-play.begin+0s" fill="freeze"/><g transform="translate(400 340)"><circle cx="-44" cy="0" r="20" fill="#dc2626" stroke="#111827" stroke-width="1.5"/><text x="-44" y="5" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">O</text><circle cx="0" cy="0" r="20" fill="#374151" stroke="#111827" stroke-width="1.5"/><text x="0" y="5" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">C</text><circle cx="44" cy="0" r="20" fill="#dc2626" stroke="#111827" stroke-width="1.5"/><text x="44" y="5" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">O</text></g><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.5833;0.7083;1.0000" values="0 0;0 0;220 0;220 0" dur="12s" begin="or-play.begin+0s" fill="freeze"/><g transform="translate(560 340)"><circle cx="0" cy="0" r="20" fill="#dc2626" stroke="#111827" stroke-width="1.5"/><text x="0" y="5" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">O</text></g></g></g><g><animate attributeName="opacity" keyTimes="0.0000;0.5250;0.5500;0.5833;0.6083;1.0000" values="0;0;1;1;0;0" dur="12s" begin="or-play.begin+0s" fill="freeze"/><circle cx="465" cy="340" r="50" fill="#fde047" opacity=".5"/></g><g><animate attributeName="opacity" keyTimes="0.0000;0.6250;0.6500;1.0000" values="0;0;1;1" dur="12s" begin="or-play.begin+0s" fill="freeze"/><text x="870" y="345" text-anchor="start" font-size="16" font-weight="800" fill="#15803d">→ CO₂ formed</text></g></g>
<g class="part" data-part="enz" data-name="How enzymes help" data-info="An active site holds the substrate(s) in exactly the right orientation, so far more collisions are successful." tabindex="0" role="button" aria-label="How enzymes help"><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.7500;0.7750;1.0000" values="0;0;1;1" dur="12s" begin="or-play.begin+0s" fill="freeze"/><rect x="290.0" y="428" width="520" height="24" rx="12" fill="#dcfce7" stroke="#1f2937" stroke-width="1"/><text x="550" y="445" text-anchor="middle" font-size="12" font-weight="700">Enzymes hold substrates in the right orientation in the active site</text></g></g>
</svg>