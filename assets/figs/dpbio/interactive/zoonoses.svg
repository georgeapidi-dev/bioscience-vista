<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 580" class="vd-svg" role="img" aria-labelledby="zo-title zo-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="zo-play" data-vd-play-label="Play: spillover" data-vd-steps="[[0, &quot;Zoonoses: diseases that jump from animals to humans.&quot;], [1, &quot;Pathogens spill over from animal reservoirs, directly or via vectors.&quot;], [8, &quot;Rabies in Kenya: vaccinating dogs breaks the chain.&quot;]]" data-vd-dur="15">
<title id="zo-title">Zoonoses and rabies</title><desc id="zo-desc">Animal reservoirs, cattle, dogs and bats, pigs with mosquito vectors, transmitting tuberculosis, rabies, Japanese encephalitis and COVID-19 to humans; vaccinating dogs blocks rabies transmission in Kenya.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="580" fill="#ffffff"/>
<g aria-hidden="true"><animate id="zo-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<defs><marker id="zo-dc2626" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="6.3" refY="7.0" orient="auto"><path d="M0,0 L14,7.0 L0,14 z" fill="#dc2626"/></marker><marker id="zo-16a34a" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="6.3" refY="7.0" orient="auto"><path d="M0,0 L14,7.0 L0,14 z" fill="#16a34a"/></marker></defs>
<text class="head" x="30" y="34">Zoonoses: from animals to people</text><text class="note" x="30" y="56">Schematic.</text>
<g class="part" data-part="z" data-name="Zoonoses" data-info="Infectious diseases that can transfer from other species to humans: about 60% of human infectious diseases, and about three-quarters of newly emerging ones." tabindex="0" role="button" aria-label="Zoonoses"><circle cx="550" cy="270" r="70" fill="#fde68a" stroke="#a16207" stroke-width="3"/><text x="550" y="266" text-anchor="middle" font-size="16" font-weight="800" fill="#713f12">humans</text><text x="550" y="288" text-anchor="middle" font-size="11" font-weight="700" fill="#713f12">~60% of infections</text><text x="550" y="304" text-anchor="middle" font-size="11" font-weight="700" fill="#713f12">are zoonotic</text></g>
<g class="part" data-part="ex" data-name="Examples" data-info="Tuberculosis (Mycobacterium bovis) from cattle via unpasteurised milk or droplets; rabies via bites from infected dogs or bats; Japanese encephalitis from pigs and birds via Culex mosquitoes; COVID-19, probably originally from bats." tabindex="0" role="button" aria-label="Examples"><g><animate attributeName="opacity" keyTimes="0.0000;0.0667;0.0867;1.0000" values="0;0;1;1" dur="15s" begin="zo-play.begin+0s" fill="freeze"/><circle cx="170" cy="140" r="62" fill="#fff" stroke="#a16207" stroke-width="3"/><text x="170" y="144" text-anchor="middle" font-size="11" font-weight="800" fill="#a16207">cattle</text><text x="170" y="212" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">TB (M. bovis): milk, droplets</text><path d="M 222 160 L 472 240" stroke="#dc2626" stroke-width="3" marker-end="url(#zo-dc2626)"/></g><g><animate attributeName="opacity" keyTimes="0.0000;0.1667;0.1867;1.0000" values="0;0;1;1" dur="15s" begin="zo-play.begin+0s" fill="freeze"/><circle cx="930" cy="140" r="62" fill="#fff" stroke="#57534e" stroke-width="3"/><text x="930" y="144" text-anchor="middle" font-size="11" font-weight="800" fill="#57534e">dogs, bats</text><text x="930" y="212" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">rabies: bites, scratches</text><path d="M 878 160 L 628 240" stroke="#dc2626" stroke-width="3" marker-end="url(#zo-dc2626)"/></g><g><animate attributeName="opacity" keyTimes="0.0000;0.2667;0.2867;1.0000" values="0;0;1;1" dur="15s" begin="zo-play.begin+0s" fill="freeze"/><circle cx="170" cy="420" r="62" fill="#fff" stroke="#db2777" stroke-width="3"/><text x="170" y="424" text-anchor="middle" font-size="11" font-weight="800" fill="#db2777">pigs, birds + mosquito</text><text x="170" y="492" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">Japanese encephalitis</text><path d="M 222 400 L 472 300" stroke="#dc2626" stroke-width="3" marker-end="url(#zo-dc2626)"/></g><g><animate attributeName="opacity" keyTimes="0.0000;0.3667;0.3867;1.0000" values="0;0;1;1" dur="15s" begin="zo-play.begin+0s" fill="freeze"/><circle cx="930" cy="420" r="62" fill="#fff" stroke="#7c3aed" stroke-width="3"/><text x="930" y="424" text-anchor="middle" font-size="11" font-weight="800" fill="#7c3aed">bats (probable)</text><text x="930" y="492" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">COVID-19 → then person to person</text><path d="M 878 400 L 628 300" stroke="#dc2626" stroke-width="3" marker-end="url(#zo-dc2626)"/></g></g>
<g class="part" data-part="rab" data-name="Rabies in Kenya" data-info="Rabies kills about 59 000 people a year worldwide, nearly all from dog bites. Kenya aims to eliminate dog-mediated human rabies by 2030 by mass dog vaccination and post-exposure treatment." tabindex="0" role="button" aria-label="Rabies in Kenya"><g><animate attributeName="opacity" keyTimes="0.0000;0.5333;0.5533;1.0000" values="0;0;1;1" dur="15s" begin="zo-play.begin+0s" fill="freeze"/><rect x="380" y="400" width="340" height="160" rx="16" fill="#f0fdf4" stroke="#86efac"/><text x="550" y="426" text-anchor="middle" font-size="14" font-weight="800" fill="#15803d">Rabies in Kenya</text><text x="550" y="452" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">~59 000 deaths/yr worldwide</text><text x="550" y="470" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">(mostly dog bites)</text><text x="550" y="500" text-anchor="middle" font-size="12" font-weight="800" fill="#15803d">mass dog vaccination +</text><text x="550" y="518" text-anchor="middle" font-size="12" font-weight="800" fill="#15803d">post-exposure treatment</text><text x="550" y="540" text-anchor="middle" font-size="12" font-weight="800" fill="#15803d">goal: eliminate by 2030</text></g></g>
</svg>