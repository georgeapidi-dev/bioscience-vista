<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" class="vd-svg" role="img" aria-labelledby="si-title si-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="si-play" data-vd-play-label="Play: cross" data-vd-steps="[[0, &quot;Inheritance of sex.&quot;], [1, &quot;Eggs all carry X; sperm carry X or Y.&quot;], [6, &quot;Each child: 1 in 2 chance of each sex.&quot;]]" data-vd-dur="12">
<title id="si-title">Inheritance of sex</title><desc id="si-desc">A genetic diagram: mother XX produces eggs all carrying X, father XY produces sperm carrying X or Y; a Punnett square gives two XX daughters and two XY sons, a fifty percent chance of each.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="520" fill="#ffffff"/>
<g aria-hidden="true"><animate id="si-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<text class="head" x="30" y="34">How sex is inherited</text><text class="note" x="30" y="56">XX = female; XY = male.</text>
<g class="part" data-part="cross" data-name="X and Y" data-info="Females are XX, males XY. All eggs carry X; half the sperm carry X and half carry Y." tabindex="0" role="button" aria-label="X and Y"><g><animate attributeName="opacity" keyTimes="0.0000;0.0833;0.1083;1.0000" values="0;0;1;1" dur="12s" begin="si-play.begin+0s" fill="freeze"/><rect x="100.0" y="92.0" width="300" height="56" rx="12" fill="#fce7f3" stroke="#be185d" stroke-width="2"/><text x="250" y="126.0" text-anchor="middle" font-size="18" font-weight="800" fill="#111827">mother XX</text><rect x="100.0" y="187.0" width="300" height="46" rx="12" fill="#fff" stroke="#be185d" stroke-width="2"/><text x="250" y="215.0" text-anchor="middle" font-size="15" font-weight="800" fill="#111827">eggs: X  X</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.1667;0.1917;1.0000" values="0;0;1;1" dur="12s" begin="si-play.begin+0s" fill="freeze"/><rect x="100.0" y="272.0" width="300" height="56" rx="12" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/><text x="250" y="306.0" text-anchor="middle" font-size="18" font-weight="800" fill="#111827">father XY</text><rect x="100.0" y="367.0" width="300" height="46" rx="12" fill="#fff" stroke="#1d4ed8" stroke-width="2"/><text x="250" y="395.0" text-anchor="middle" font-size="15" font-weight="800" fill="#111827">sperm: X  Y</text></g></g>
<g class="part" data-part="grid" data-name="Punnett square" data-info="XX × XY gives 2 XX : 2 XY, so each child has a 50% (1 in 2) chance of being male or female. The sperm decides the sex." tabindex="0" role="button" aria-label="Punnett square"><rect x="600" y="130" width="420" height="300" fill="#fff" stroke="#334155" stroke-width="2"/><text x="810" y="170" text-anchor="middle" font-size="20" font-weight="800" fill="#1d4ed8">X</text><text x="950" y="170" text-anchor="middle" font-size="20" font-weight="800" fill="#1d4ed8">Y</text><text x="670" y="270" text-anchor="middle" font-size="20" font-weight="800" fill="#be185d">X</text><text x="670" y="370" text-anchor="middle" font-size="20" font-weight="800" fill="#be185d">X</text><line x1="740" y1="130" x2="740" y2="430" stroke="#334155"/><line x1="600" y1="200" x2="1020" y2="200" stroke="#334155"/><line x1="880" y1="130" x2="880" y2="430" stroke="#cbd5e1"/><line x1="600" y1="315" x2="1020" y2="315" stroke="#cbd5e1"/><g><animate attributeName="opacity" keyTimes="0.0000;0.5000;0.5250;1.0000" values="0;0;1;1" dur="12s" begin="si-play.begin+0s" fill="freeze"/><text x="810" y="270" text-anchor="middle" font-size="22" font-weight="800" fill="#be185d">XX</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.5417;0.5667;1.0000" values="0;0;1;1" dur="12s" begin="si-play.begin+0s" fill="freeze"/><text x="950" y="270" text-anchor="middle" font-size="22" font-weight="800" fill="#1d4ed8">XY</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.5833;0.6083;1.0000" values="0;0;1;1" dur="12s" begin="si-play.begin+0s" fill="freeze"/><text x="810" y="370" text-anchor="middle" font-size="22" font-weight="800" fill="#be185d">XX</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.6250;0.6500;1.0000" values="0;0;1;1" dur="12s" begin="si-play.begin+0s" fill="freeze"/><text x="950" y="370" text-anchor="middle" font-size="22" font-weight="800" fill="#1d4ed8">XY</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.7083;0.7333;1.0000" values="0;0;1;1" dur="12s" begin="si-play.begin+0s" fill="freeze"/><text x="810" y="470" text-anchor="middle" font-size="15" font-weight="800" fill="#111827">2 XX : 2 XY → 50% female, 50% male</text></g></g>
</svg>