<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" class="vd-svg" role="img" aria-labelledby="md-title md-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="md-play" data-vd-play-label="Play: compare" data-vd-steps="[[0, &quot;Two groups of flowering plants.&quot;], [1, &quot;Monocots: one cotyledon, parallel veins, parts in 3s.&quot;], [6, &quot;Dicots: two cotyledons, net veins, parts in 4s or 5s.&quot;]]" data-vd-dur="12">
<title id="md-title">Monocots and dicots</title><desc id="md-desc">A monocot with one cotyledon, a narrow leaf with parallel veins and a flower with three petals, beside a dicot with two cotyledons, a broad leaf with branching veins and a five-petalled flower.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="520" fill="#ffffff"/>
<g aria-hidden="true"><animate id="md-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<text class="head" x="30" y="34">Monocotyledons and dicotyledons</text><text class="note" x="30" y="56">Flowering plants.</text>
<g class="part" data-part="mono" data-name="Monocotyledons" data-info="One cotyledon in the seed; long narrow leaves with parallel veins; flower parts in threes (e.g. grasses, maize, lilies)." tabindex="0" role="button" aria-label="Monocotyledons"><g><animate attributeName="opacity" keyTimes="0.0000;0.0833;0.1083;1.0000" values="0;0;1;1" dur="12s" begin="md-play.begin+0s" fill="freeze"/><rect x="40" y="80" width="500" height="420" rx="16" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/><text x="290" y="108" text-anchor="middle" font-size="16" font-weight="800" fill="#15803d">MONOCOT</text><ellipse cx="130" cy="220" rx="40" ry="60" fill="#fde68a" stroke="#a16207"/><text x="130" y="300" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">1 cotyledon</text><path d="M 240 400 Q 260 250 290 140 Q 320 250 340 400 Z" fill="#86efac" stroke="#15803d" stroke-width="2"/><path d="M 262 395 Q 278 270 290 150" fill="none" stroke="#15803d"/><path d="M 275 395 Q 282 270 290 150" fill="none" stroke="#15803d"/><path d="M 288 395 Q 286 270 290 150" fill="none" stroke="#15803d"/><path d="M 301 395 Q 290 270 290 150" fill="none" stroke="#15803d"/><path d="M 314 395 Q 294 270 290 150" fill="none" stroke="#15803d"/><path d="M 327 395 Q 298 270 290 150" fill="none" stroke="#15803d"/><text x="290" y="430" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">parallel veins</text><ellipse cx="450" cy="190" rx="18" ry="11" transform="rotate(0 450 190)" fill="#f9a8d4" stroke="#334155"/><ellipse cx="476" cy="235" rx="18" ry="11" transform="rotate(120 476 235)" fill="#f9a8d4" stroke="#334155"/><ellipse cx="424" cy="235" rx="18" ry="11" transform="rotate(240 424 235)" fill="#f9a8d4" stroke="#334155"/><circle cx="450" cy="220" r="10" fill="#facc15"/><text x="450" y="300" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">parts in 3s</text></g></g>
<g class="part" data-part="di" data-name="Dicotyledons" data-info="Two cotyledons; broad leaves with a branching network of veins; flower parts in fours or fives (e.g. beans, roses)." tabindex="0" role="button" aria-label="Dicotyledons"><g><animate attributeName="opacity" keyTimes="0.0000;0.5000;0.5250;1.0000" values="0;0;1;1" dur="12s" begin="md-play.begin+0s" fill="freeze"/><rect x="560" y="80" width="500" height="420" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="810" y="108" text-anchor="middle" font-size="16" font-weight="800" fill="#1d4ed8">DICOT</text><ellipse cx="635" cy="220" rx="26" ry="60" fill="#fde68a" stroke="#a16207"/><ellipse cx="690" cy="220" rx="26" ry="60" fill="#fde68a" stroke="#a16207"/><text x="662" y="300" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">2 cotyledons</text><path d="M 810 400 Q 720 270 810 140 Q 900 270 810 400 Z" fill="#86efac" stroke="#15803d" stroke-width="2"/><path d="M 810 395 L 810 150" stroke="#15803d" stroke-width="2"/><path d="M 810 370 L 850 340" stroke="#15803d"/><path d="M 810 360 L 770 330" stroke="#15803d"/><path d="M 810 330 L 770 300" stroke="#15803d"/><path d="M 810 320 L 850 290" stroke="#15803d"/><path d="M 810 290 L 850 260" stroke="#15803d"/><path d="M 810 280 L 770 250" stroke="#15803d"/><path d="M 810 250 L 770 220" stroke="#15803d"/><path d="M 810 240 L 850 210" stroke="#15803d"/><path d="M 810 210 L 850 180" stroke="#15803d"/><path d="M 810 200 L 770 170" stroke="#15803d"/><text x="810" y="430" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">branching (net) veins</text><ellipse cx="970" cy="190" rx="18" ry="11" transform="rotate(0 970 190)" fill="#fca5a5" stroke="#334155"/><ellipse cx="999" cy="211" rx="18" ry="11" transform="rotate(72 999 211)" fill="#fca5a5" stroke="#334155"/><ellipse cx="988" cy="244" rx="18" ry="11" transform="rotate(144 988 244)" fill="#fca5a5" stroke="#334155"/><ellipse cx="952" cy="244" rx="18" ry="11" transform="rotate(216 952 244)" fill="#fca5a5" stroke="#334155"/><ellipse cx="941" cy="211" rx="18" ry="11" transform="rotate(288 941 211)" fill="#fca5a5" stroke="#334155"/><circle cx="970" cy="220" r="10" fill="#facc15"/><text x="970" y="300" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">parts in 4s or 5s</text></g></g>
</svg>