<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 640" class="vd-svg" role="img" aria-labelledby="pd-title pd-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="pd-play" data-vd-play-label="Play: reading the pedigree" data-vd-steps="[[0, &quot;A family pedigree for an inherited condition, for example cystic fibrosis.&quot;], [1, &quot;Generation I: two unaffected parents.&quot;], [3, &quot;Generation II: they have an affected son (II-3). So the allele is recessive, and both parents must be carriers.&quot;], [6.5, &quot;Generation III: an affected daughter (III-1) of two unaffected parents.&quot;], [9, &quot;Her father is unaffected, which rules out X-linked inheritance: the condition is autosomal recessive.&quot;], [11.5, &quot;Genotypes that can be deduced are shown.&quot;]]" data-vd-dur="15">
<title id="pd-title">Pedigree: autosomal recessive</title><desc id="pd-desc">A three-generation pedigree for an autosomal recessive condition, with deduced genotypes and the reasoning that shows the allele is recessive and autosomal.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1150" height="640" fill="#ffffff"/>
<g aria-hidden="true"><animate id="pd-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<text class="head" x="30" y="34">Reading a pedigree: an autosomal recessive condition</text><text class="note" x="30" y="56">A = normal allele (dominant), a = allele for the condition (recessive).</text>
<g class="part" data-part="g1" data-name="Generation I" data-info="Two unaffected parents with an affected son: the allele must be recessive, so both parents are carriers (Aa)." tabindex="0" role="button" aria-label="Generation I"><g><animate attributeName="opacity" keyTimes="0.0000;0.0667;0.0867;1.0000" values="0;0;1;1" dur="15s" begin="pd-play.begin+0s" fill="freeze"/><rect x="358" y="108" width="44" height="44" fill="#fff" stroke="#1e293b" stroke-width="3"/><text x="380" y="172" text-anchor="middle" font-size="12" fill="#475569">I-1</text><circle cx="520" cy="130" r="22" fill="#fff" stroke="#1e293b" stroke-width="3"/><text x="520" y="172" text-anchor="middle" font-size="12" fill="#475569">I-2</text><line x1="402" y1="130" x2="498" y2="130" stroke="#1e293b" stroke-width="2.5"/><line x1="450" y1="130" x2="450" y2="210" stroke="#1e293b" stroke-width="2.5"/><line x1="240" y1="210" x2="700" y2="210" stroke="#1e293b" stroke-width="2.5"/><line x1="240" y1="210" x2="240" y2="278" stroke="#1e293b" stroke-width="2.5"/><line x1="400" y1="210" x2="400" y2="278" stroke="#1e293b" stroke-width="2.5"/><line x1="550" y1="210" x2="550" y2="278" stroke="#1e293b" stroke-width="2.5"/><line x1="700" y1="210" x2="700" y2="278" stroke="#1e293b" stroke-width="2.5"/></g></g>
<g class="part" data-part="g2" data-name="Generation II" data-info="II-3 is affected (aa). His unaffected siblings are AA or Aa: we cannot tell which without more evidence." tabindex="0" role="button" aria-label="Generation II"><g><animate attributeName="opacity" keyTimes="0.0000;0.2000;0.2200;1.0000" values="0;0;1;1" dur="15s" begin="pd-play.begin+0s" fill="freeze"/><rect x="218" y="278" width="44" height="44" fill="#fff" stroke="#1e293b" stroke-width="3"/><text x="240" y="342" text-anchor="middle" font-size="12" fill="#475569">II-1</text><circle cx="400" cy="300" r="22" fill="#fff" stroke="#1e293b" stroke-width="3"/><text x="400" y="342" text-anchor="middle" font-size="12" fill="#475569">II-2</text><rect x="528" y="278" width="44" height="44" fill="#1e293b" stroke="#1e293b" stroke-width="3"/><text x="550" y="342" text-anchor="middle" font-size="12" fill="#475569">II-3</text><circle cx="700" cy="300" r="22" fill="#fff" stroke="#1e293b" stroke-width="3"/><text x="700" y="342" text-anchor="middle" font-size="12" fill="#475569">II-4</text><rect x="818" y="278" width="44" height="44" fill="#fff" stroke="#1e293b" stroke-width="3"/><text x="840" y="342" text-anchor="middle" font-size="12" fill="#475569">II-5</text><line x1="722" y1="300" x2="818" y2="300" stroke="#1e293b" stroke-width="2.5"/><line x1="770" y1="300" x2="770" y2="380" stroke="#1e293b" stroke-width="2.5"/><line x1="640" y1="380" x2="900" y2="380" stroke="#1e293b" stroke-width="2.5"/><line x1="640" y1="380" x2="640" y2="448" stroke="#1e293b" stroke-width="2.5"/><line x1="770" y1="380" x2="770" y2="448" stroke="#1e293b" stroke-width="2.5"/><line x1="900" y1="380" x2="900" y2="448" stroke="#1e293b" stroke-width="2.5"/></g></g>
<g class="part" data-part="g3" data-name="Generation III" data-info="III-1 is an affected daughter whose father (II-5) is unaffected. For an X-linked recessive condition her father would have to be affected, so the condition is autosomal." tabindex="0" role="button" aria-label="Generation III"><g><animate attributeName="opacity" keyTimes="0.0000;0.4333;0.4533;1.0000" values="0;0;1;1" dur="15s" begin="pd-play.begin+0s" fill="freeze"/><circle cx="640" cy="470" r="22" fill="#1e293b" stroke="#1e293b" stroke-width="3"/><text x="640" y="512" text-anchor="middle" font-size="12" fill="#475569">III-1</text><rect x="748" y="448" width="44" height="44" fill="#fff" stroke="#1e293b" stroke-width="3"/><text x="770" y="512" text-anchor="middle" font-size="12" fill="#475569">III-2</text><circle cx="900" cy="470" r="22" fill="#fff" stroke="#1e293b" stroke-width="3"/><text x="900" y="512" text-anchor="middle" font-size="12" fill="#475569">III-3</text></g></g>
<g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.7667;0.7867;1.0000" values="0;0;1;1" dur="15s" begin="pd-play.begin+0s" fill="freeze"/><rect x="344" y="72" width="72" height="22" rx="11" fill="#fef3c7" stroke="#d97706"/><text x="380" y="88" text-anchor="middle" font-size="12" font-weight="800">Aa</text><rect x="484" y="72" width="72" height="22" rx="11" fill="#fef3c7" stroke="#d97706"/><text x="520" y="88" text-anchor="middle" font-size="12" font-weight="800">Aa</text><rect x="204" y="242" width="72" height="22" rx="11" fill="#fef3c7" stroke="#d97706"/><text x="240" y="258" text-anchor="middle" font-size="12" font-weight="800">AA or Aa</text><rect x="364" y="242" width="72" height="22" rx="11" fill="#fef3c7" stroke="#d97706"/><text x="400" y="258" text-anchor="middle" font-size="12" font-weight="800">AA or Aa</text><rect x="514" y="242" width="72" height="22" rx="11" fill="#fef3c7" stroke="#d97706"/><text x="550" y="258" text-anchor="middle" font-size="12" font-weight="800">aa</text><rect x="664" y="242" width="72" height="22" rx="11" fill="#fef3c7" stroke="#d97706"/><text x="700" y="258" text-anchor="middle" font-size="12" font-weight="800">Aa</text><rect x="804" y="242" width="72" height="22" rx="11" fill="#fef3c7" stroke="#d97706"/><text x="840" y="258" text-anchor="middle" font-size="12" font-weight="800">Aa</text><rect x="604" y="412" width="72" height="22" rx="11" fill="#fef3c7" stroke="#d97706"/><text x="640" y="428" text-anchor="middle" font-size="12" font-weight="800">aa</text><rect x="734" y="412" width="72" height="22" rx="11" fill="#fef3c7" stroke="#d97706"/><text x="770" y="428" text-anchor="middle" font-size="12" font-weight="800">AA or Aa</text><rect x="864" y="412" width="72" height="22" rx="11" fill="#fef3c7" stroke="#d97706"/><text x="900" y="428" text-anchor="middle" font-size="12" font-weight="800">AA or Aa</text></g>
<g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.2333;0.2533;1.0000" values="0;0;1;1" dur="15s" begin="pd-play.begin+0s" fill="freeze"/><rect x="30" y="250" width="160" height="70" rx="10" fill="#ecfdf5" stroke="#16a34a"/><text x="40" y="272" font-size="12" font-weight="800" fill="#166534">Clue 1: recessive</text><text x="40" y="290" font-size="11">unaffected parents,</text><text x="40" y="306" font-size="11">affected child</text></g>
<g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.6000;0.6200;1.0000" values="0;0;1;1" dur="15s" begin="pd-play.begin+0s" fill="freeze"/><rect x="950" y="420" width="190" height="86" rx="10" fill="#eff6ff" stroke="#2563eb"/><text x="960" y="442" font-size="12" font-weight="800" fill="#1e40af">Clue 2: autosomal</text><text x="960" y="460" font-size="11">affected daughter, unaffected</text><text x="960" y="476" font-size="11">father: not X-linked</text><text x="960" y="494" font-size="11">recessive</text></g>
<g class="part" data-part="key" data-name="Key" data-info="Square: male. Circle: female. Shaded: affected. Horizontal line between partners; vertical line to their children." tabindex="0" role="button" aria-label="Key"><g transform="translate(860 90)"><rect x="-14" y="-24" width="270" height="140" rx="12" fill="#f8fafc" stroke="#cbd5e1"/><text y="0" font-size="13" font-weight="800">Key</text><rect x="0" y="12" width="22" height="22" fill="#fff" stroke="#1e293b" stroke-width="2"/><text x="30" y="28" font-size="12">unaffected male</text><circle cx="141" cy="23" r="11" fill="#fff" stroke="#1e293b" stroke-width="2"/><text x="156" y="28" font-size="12">unaffected female</text><rect x="0" y="46" width="22" height="22" fill="#1e293b"/><text x="30" y="62" font-size="12">affected male</text><circle cx="141" cy="57" r="11" fill="#1e293b"/><text x="156" y="62" font-size="12">affected female</text><line x1="0" y1="92" x2="40" y2="92" stroke="#1e293b" stroke-width="2.5"/><text x="48" y="96" font-size="12">partners (with children below)</text></g></g>
</svg>