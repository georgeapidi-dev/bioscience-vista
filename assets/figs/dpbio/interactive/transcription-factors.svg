<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 640" class="vd-svg" role="img" aria-labelledby="tf-title tf-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="tf-play" data-vd-play-label="Play: switching a gene on" data-vd-steps="[[0, &quot;Eukaryotic genes are switched on and off by transcription factors.&quot;], [1, &quot;General transcription factors bind the promoter (TATA box).&quot;], [3, &quot;RNA polymerase joins them at the start of the gene.&quot;], [5, &quot;An activator binds a distant enhancer; the DNA loops so it contacts the complex.&quot;], [8, &quot;Transcription starts: mRNA is made.&quot;], [12, &quot;If a repressor binds instead, the complex cannot form and the gene stays off.&quot;]]" data-vd-dur="18">
<title id="tf-title">Transcription factors</title><desc id="tf-desc">General transcription factors bind the promoter, RNA polymerase joins, an activator on a distant enhancer loops the DNA to contact the complex and transcription starts; a repressor blocks this.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1220" height="640" fill="#ffffff"/>
<g aria-hidden="true"><animate id="tf-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<text class="head" x="30" y="34">Transcription factors control gene expression</text><text class="note" x="30" y="56">Eukaryotic gene, simplified. Distances not to scale.</text>
<path d="M 40 380 L 100 380 C 180 380 340 380 420 380 L 440 380 L 1180 380" fill="none" stroke="#334155" stroke-width="12" stroke-linecap="round"><animate attributeName="d" keyTimes="0.0000;0.2778;0.3611;0.6389;0.6944;1.0000" values="M 40 380 L 100 380 C 180 380 340 380 420 380 L 440 380 L 1180 380;M 40 380 L 100 380 C 180 380 340 380 420 380 L 440 380 L 1180 380;M 40 380 L 100 380 C 100 80 430 80 420 320 L 440 380 L 1180 380;M 40 380 L 100 380 C 100 80 430 80 420 320 L 440 380 L 1180 380;M 40 380 L 100 380 C 180 380 340 380 420 380 L 440 380 L 1180 380;M 40 380 L 100 380 C 180 380 340 380 420 380 L 440 380 L 1180 380" dur="18s" begin="tf-play.begin+0s" fill="freeze"/></path>
<g class="part" data-part="enh" data-name="Enhancer and activator" data-info="Activator proteins bind enhancers, which can be thousands of bases away. The DNA loops so the activator contacts the transcription complex (through a mediator) and increases transcription." tabindex="0" role="button" aria-label="Enhancer and activator"><g transform="translate(357.28768 380)"><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.2778;0.3611;0.6389;0.6944;1.0000" values="357.28768 380;357.28768 380;384.36616000000004 197.08688;384.36616000000004 197.08688;357.28768 380;357.28768 380" dur="18s" begin="tf-play.begin+0s" fill="freeze"/><rect x="-40" y="-10" width="80" height="20" rx="4" fill="#a855f7"/><text x="0" y="40" text-anchor="middle" font-size="12" font-weight="800" fill="#6b21a8">enhancer</text><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.2500;0.2667;0.6389;0.6556;1.0000" values="0;0;1;1;0;0" dur="18s" begin="tf-play.begin+0s" fill="freeze"/><path d="M -28 -10 C -28 -58 28 -58 28 -10 Z" fill="#c084fc" stroke="#6b21a8" stroke-width="2"/><text x="0" y="-64" text-anchor="middle" font-size="12" font-weight="800" fill="#6b21a8">activator</text></g></g></g>
<g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.3667;0.3833;0.6389;0.6556;1.0000" values="0;0;1;1;0;0" dur="18s" begin="tf-play.begin+0s" fill="freeze"/><ellipse cx="487.18308" cy="248.54344000000003" rx="44" ry="26" fill="#fbcfe8" stroke="#be185d" stroke-width="2"/><text x="487.18308" y="252.54344000000003" text-anchor="middle" font-size="11" font-weight="800" fill="#9d174d">mediator</text></g>
<g class="part" data-part="prom" data-name="Promoter (TATA box)" data-info="A DNA sequence just upstream of the gene where general transcription factors and RNA polymerase bind." tabindex="0" role="button" aria-label="Promoter (TATA box)"><rect x="440" y="370" width="80" height="20" rx="4" fill="#f59e0b"/><text x="480" y="420" text-anchor="middle" font-size="12" font-weight="800" fill="#b45309">promoter</text><text x="480" y="436" text-anchor="middle" font-size="11" font-weight="600" fill="#b45309">(TATA box)</text></g>
<g class="part" data-part="gene" data-name="Gene" data-info="Coding sequence transcribed into mRNA." tabindex="0" role="button" aria-label="Gene"><rect x="560" y="370" width="460" height="20" rx="4" fill="#22c55e"/><text x="790" y="420" text-anchor="middle" font-size="12" font-weight="800" fill="#166534">gene (coding sequence)</text><path d="M 560 360 L 560 330 L 610 330" fill="none" stroke="#166534" stroke-width="3"/></g>
<g class="part" data-part="gtf" data-name="General transcription factors" data-info="Proteins that bind the promoter and position RNA polymerase II at the start of the gene." tabindex="0" role="button" aria-label="General transcription factors"><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.0556;0.0722;0.6667;0.6833;1.0000" values="0;0;1;1;0;0" dur="18s" begin="tf-play.begin+0s" fill="freeze"/><circle cx="450" cy="350" r="16" fill="#fdba74" stroke="#1f2937" stroke-width="1.5"/><circle cx="478" cy="350" r="16" fill="#fcd34d" stroke="#1f2937" stroke-width="1.5"/><circle cx="506" cy="350" r="16" fill="#fde68a" stroke="#1f2937" stroke-width="1.5"/><text x="480" y="322" text-anchor="middle" font-size="11" font-weight="800" fill="#92400e">general TFs</text></g></g>
<g class="part" data-part="pol" data-name="RNA polymerase" data-info="Moves along the template strand, joining RNA nucleotides into mRNA." tabindex="0" role="button" aria-label="RNA polymerase"><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.1667;0.1833;0.6667;0.6833;1.0000" values="0;0;1;1;0;0" dur="18s" begin="tf-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.1667;0.4444;0.6389;1.0000" values="0 0;0 0;0 0;360 0;360 0" dur="18s" begin="tf-play.begin+0s" fill="freeze"/><ellipse cx="580" cy="374" rx="60" ry="44" fill="#38bdf8" fill-opacity=".85" stroke="#0369a1" stroke-width="2.5"/><text x="580" y="380" text-anchor="middle" font-size="12" font-weight="800" fill="#0c4a6e">RNA pol</text></g></g></g>
<g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.4667;0.4833;0.6667;0.6833;1.0000" values="0;0;1;1;0;0" dur="18s" begin="tf-play.begin+0s" fill="freeze"/><clipPath id="tf-c85"><rect x="580" y="180" width="400" height="160"><animate attributeName="width" keyTimes="0.0000;0.4722;0.6389;1.0000" values="0;0;400;400" dur="18s" begin="tf-play.begin+0s" fill="freeze"/></rect></clipPath><g clip-path="url(#tf-c85)"><path d="M 600 330 C 620 280 700 270 760 250 C 820 230 880 240 940 220" fill="none" stroke="#f97316" stroke-width="7" stroke-linecap="round"/></g><text x="950" y="210" text-anchor="start" font-size="14" font-weight="800" fill="#c2410c">mRNA</text></g>
<g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.4444;0.4611;0.6667;0.6833;1.0000" values="0;0;1;1;0;0" dur="18s" begin="tf-play.begin+0s" fill="freeze"/><rect x="715.0" y="118" width="210" height="24" rx="12" fill="#dcfce7" stroke="#1f2937" stroke-width="1"/><text x="820" y="135" text-anchor="middle" font-size="13" font-weight="700">GENE ON: transcription</text></g>
<g class="part" data-part="rep" data-name="Repressor" data-info="Binds a silencer or near the promoter and blocks the transcription complex: the gene is switched off." tabindex="0" role="button" aria-label="Repressor"><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.6944;0.7111;1.0000" values="0;0;1;1" dur="18s" begin="tf-play.begin+0s" fill="freeze"/><path d="M 440 370 L 440 310 L 520 310 L 520 370 Z" fill="#f87171" stroke="#991b1b" stroke-width="2.5"/><text x="480" y="300" text-anchor="middle" font-size="12" font-weight="800" fill="#991b1b">repressor</text><g transform="translate(600 250)"><circle r="40" fill="none" stroke="#dc2626" stroke-width="6"/><line x1="-28" y1="-28" x2="28" y2="28" stroke="#dc2626" stroke-width="6"/></g><text x="600" y="190" text-anchor="middle" font-size="12" font-weight="800" fill="#991b1b">no RNA polymerase, no mRNA</text></g></g>
<g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.7222;0.7389;1.0000" values="0;0;1;1" dur="18s" begin="tf-play.begin+0s" fill="freeze"/><rect x="720.0" y="118" width="200" height="24" rx="12" fill="#fee2e2" stroke="#1f2937" stroke-width="1"/><text x="820" y="135" text-anchor="middle" font-size="13" font-weight="700">GENE OFF: repressed</text></g>
</svg>