<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 540" class="vd-svg" role="img" aria-labelledby="xh-title xh-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="xh-play" data-vd-play-label="Play: adapt" data-vd-steps="[[0, &quot;Adaptive features of plants.&quot;], [1, &quot;Xerophytes: reduce water loss.&quot;], [7, &quot;Hydrophytes: float and exchange gases.&quot;]]" data-vd-dur="13">
<title id="xh-title">Xerophytes and hydrophytes</title><desc id="xh-desc">A cactus and marram grass leaf with adaptations to reduce water loss, compared with a floating water lily with large air spaces and stomata on the upper surface.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="540" fill="#ffffff"/>
<g aria-hidden="true"><animate id="xh-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<text class="head" x="30" y="34">Adaptive features: dry and wet habitats</text><text class="note" x="30" y="56">Each feature is linked to a function.</text>
<g class="part" data-part="x" data-name="Xerophytes" data-info="Plants of dry habitats (cactus, marram grass) reduce water loss and store water." tabindex="0" role="button" aria-label="Xerophytes"><rect x="40" y="80" width="500" height="430" rx="16" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/><text x="290" y="108" text-anchor="middle" font-size="15" font-weight="800" fill="#a16207">XEROPHYTE (cactus, marram grass)</text><path d="M 130 420 L 130 200 Q 130 160 160 160 Q 190 160 190 200 L 190 420 Z" fill="#4ade80" stroke="#15803d" stroke-width="3"/><line x1="194" y1="200" x2="208" y2="195" stroke="#78350f" stroke-width="2"/><line x1="126" y1="225" x2="112" y2="220" stroke="#78350f" stroke-width="2"/><line x1="194" y1="250" x2="208" y2="245" stroke="#78350f" stroke-width="2"/><line x1="126" y1="275" x2="112" y2="270" stroke="#78350f" stroke-width="2"/><line x1="194" y1="300" x2="208" y2="295" stroke="#78350f" stroke-width="2"/><line x1="126" y1="325" x2="112" y2="320" stroke="#78350f" stroke-width="2"/><line x1="194" y1="350" x2="208" y2="345" stroke="#78350f" stroke-width="2"/><line x1="126" y1="375" x2="112" y2="370" stroke="#78350f" stroke-width="2"/><line x1="194" y1="400" x2="208" y2="395" stroke="#78350f" stroke-width="2"/><g><animate attributeName="opacity" keyTimes="0.0000;0.0769;0.1000;1.0000" values="0;0;1;1" dur="13s" begin="xh-play.begin+0s" fill="freeze"/><text x="240" y="170" text-anchor="start" font-size="13" font-weight="700" fill="#111827">• thick waxy cuticle</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.1385;0.1615;1.0000" values="0;0;1;1" dur="13s" begin="xh-play.begin+0s" fill="freeze"/><text x="240" y="216" text-anchor="start" font-size="13" font-weight="700" fill="#111827">• sunken stomata, hairs (trap moist air)</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.2000;0.2231;1.0000" values="0;0;1;1" dur="13s" begin="xh-play.begin+0s" fill="freeze"/><text x="240" y="262" text-anchor="start" font-size="13" font-weight="700" fill="#111827">• rolled leaves</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.2615;0.2846;1.0000" values="0;0;1;1" dur="13s" begin="xh-play.begin+0s" fill="freeze"/><text x="240" y="308" text-anchor="start" font-size="13" font-weight="700" fill="#111827">• small leaves or spines</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.3231;0.3462;1.0000" values="0;0;1;1" dur="13s" begin="xh-play.begin+0s" fill="freeze"/><text x="240" y="354" text-anchor="start" font-size="13" font-weight="700" fill="#111827">• deep or wide roots</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.3846;0.4077;1.0000" values="0;0;1;1" dur="13s" begin="xh-play.begin+0s" fill="freeze"/><text x="240" y="400" text-anchor="start" font-size="13" font-weight="700" fill="#111827">• water storage tissue</text></g></g>
<g class="part" data-part="h" data-name="Hydrophytes" data-info="Plants living in water (water lily) need buoyancy and gas exchange at the surface rather than water conservation." tabindex="0" role="button" aria-label="Hydrophytes"><rect x="560" y="80" width="500" height="430" rx="16" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/><text x="810" y="108" text-anchor="middle" font-size="15" font-weight="800" fill="#0369a1">HYDROPHYTE (water lily)</text><rect x="560" y="200" width="500" height="310" fill="#7dd3fc" opacity=".35"/><ellipse cx="680" cy="200" rx="90" ry="16" fill="#22c55e" stroke="#15803d" stroke-width="2"/><circle cx="620" cy="200" r="4" fill="#bbf7d0"/><circle cx="650" cy="200" r="4" fill="#bbf7d0"/><circle cx="680" cy="200" r="4" fill="#bbf7d0"/><circle cx="710" cy="200" r="4" fill="#bbf7d0"/><circle cx="740" cy="200" r="4" fill="#bbf7d0"/><path d="M 680 214 Q 690 350 680 490" stroke="#15803d" stroke-width="4" fill="none"/><text x="680" y="180" text-anchor="middle" font-size="11" font-weight="800" fill="#15803d">stomata on top</text><g><animate attributeName="opacity" keyTimes="0.0000;0.5385;0.5615;1.0000" values="0;0;1;1" dur="13s" begin="xh-play.begin+0s" fill="freeze"/><text x="790" y="260" text-anchor="start" font-size="13" font-weight="700" fill="#111827">• large air spaces (buoyancy, gas store)</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.6000;0.6231;1.0000" values="0;0;1;1" dur="13s" begin="xh-play.begin+0s" fill="freeze"/><text x="790" y="306" text-anchor="start" font-size="13" font-weight="700" fill="#111827">• stomata on the upper surface</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.6615;0.6846;1.0000" values="0;0;1;1" dur="13s" begin="xh-play.begin+0s" fill="freeze"/><text x="790" y="352" text-anchor="start" font-size="13" font-weight="700" fill="#111827">• little or no cuticle</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.7231;0.7462;1.0000" values="0;0;1;1" dur="13s" begin="xh-play.begin+0s" fill="freeze"/><text x="790" y="398" text-anchor="start" font-size="13" font-weight="700" fill="#111827">• little xylem / support tissue</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.7846;0.8077;1.0000" values="0;0;1;1" dur="13s" begin="xh-play.begin+0s" fill="freeze"/><text x="790" y="444" text-anchor="start" font-size="13" font-weight="700" fill="#111827">• small roots</text></g></g>
</svg>