<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 540" class="vd-svg" role="img" aria-labelledby="sb-title sb-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="sb-play" data-vd-play-label="Play: breed" data-vd-steps="[[0, &quot;Selective (artificial) breeding.&quot;], [1, &quot;Choose, cross, select, repeat.&quot;], [8, &quot;Milk yield rises over generations.&quot;], [12, &quot;Humans, not the environment, do the selecting.&quot;]]" data-vd-dur="15">
<title id="sb-title">Selective breeding</title><desc id="sb-desc">A cycle of choosing parents with a desired feature, crossing them, selecting the best offspring and breeding again, with a bar chart of milk yield rising over generations.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="540" fill="#ffffff"/>
<g aria-hidden="true"><animate id="sb-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<defs><marker id="sb-475569" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="5.4" refY="6.0" orient="auto"><path d="M0,0 L12,6.0 L0,12 z" fill="#475569"/></marker></defs>
<text class="head" x="30" y="34">Selective breeding</text><text class="note" x="30" y="56">Illustrative milk yields.</text>
<g class="part" data-part="steps" data-name="Method" data-info="1 Choose parents with the desired feature. 2 Cross them. 3 Select the offspring that show the feature best. 4 Breed these together. 5 Repeat over many generations." tabindex="0" role="button" aria-label="Method"><g><animate attributeName="opacity" keyTimes="0.0000;0.0667;0.0867;1.0000" values="0;0;1;1" dur="15s" begin="sb-play.begin+0s" fill="freeze"/><rect x="212.5" y="105.0" width="175" height="50" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="300.0" y="133.33333333333334" text-anchor="middle" font-size="10" font-weight="800" fill="#111827">1 choose parents with the feature</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.1067;0.1267;1.0000" values="0;0;1;1" dur="15s" begin="sb-play.begin+0s" fill="freeze"/><circle cx="388" cy="179" r="6" fill="#475569"/></g><g><animate attributeName="opacity" keyTimes="0.0000;0.1467;0.1667;1.0000" values="0;0;1;1" dur="15s" begin="sb-play.begin+0s" fill="freeze"/><rect x="374.17960777017606" y="222.46711095625895" width="175" height="50" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="461.67960777017606" y="250.8004442895923" text-anchor="middle" font-size="10" font-weight="800" fill="#111827">2 cross them</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.1867;0.2067;1.0000" values="0;0;1;1" dur="15s" begin="sb-play.begin+0s" fill="freeze"/><circle cx="443" cy="346" r="6" fill="#475569"/></g><g><animate attributeName="opacity" keyTimes="0.0000;0.2267;0.2467;1.0000" values="0;0;1;1" dur="15s" begin="sb-play.begin+0s" fill="freeze"/><rect x="312.4234928897204" y="412.5328890437411" width="175" height="50" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="399.9234928897204" y="440.8662223770744" text-anchor="middle" font-size="10" font-weight="800" fill="#111827">3 select the best offspring</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.2667;0.2867;1.0000" values="0;0;1;1" dur="15s" begin="sb-play.begin+0s" fill="freeze"/><circle cx="300" cy="450" r="6" fill="#475569"/></g><g><animate attributeName="opacity" keyTimes="0.0000;0.3067;0.3267;1.0000" values="0;0;1;1" dur="15s" begin="sb-play.begin+0s" fill="freeze"/><rect x="112.57650711027958" y="412.5328890437411" width="175" height="50" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="200.07650711027958" y="440.8662223770744" text-anchor="middle" font-size="10" font-weight="800" fill="#111827">4 breed these together</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.3467;0.3667;1.0000" values="0;0;1;1" dur="15s" begin="sb-play.begin+0s" fill="freeze"/><circle cx="157" cy="346" r="6" fill="#475569"/></g><g><animate attributeName="opacity" keyTimes="0.0000;0.3867;0.4067;1.0000" values="0;0;1;1" dur="15s" begin="sb-play.begin+0s" fill="freeze"/><rect x="50.82039222982388" y="222.46711095625898" width="175" height="50" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="138.32039222982388" y="250.80044428959232" text-anchor="middle" font-size="10" font-weight="800" fill="#111827">5 repeat for many generations</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.4267;0.4467;1.0000" values="0;0;1;1" dur="15s" begin="sb-play.begin+0s" fill="freeze"/><circle cx="212" cy="179" r="6" fill="#475569"/></g></g>
<g class="part" data-part="gen" data-name="Over generations" data-info="The desired feature becomes more pronounced and more common: e.g. cows with higher milk yield, wheat resistant to disease." tabindex="0" role="button" aria-label="Over generations"><line x1="600" y1="440" x2="1020" y2="440" stroke="#111827" stroke-width="2"/><text x="810" y="470" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">generation</text><text x="810" y="100" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">milk yield / litres per day (illustrative)</text><rect x="630" y="440" width="50" height="0" fill="#60a5fa"><animate attributeName="height" keyTimes="0.0000;0.5333;0.6000;1.0000" values="0;0;108;108" dur="15s" begin="sb-play.begin+0s" fill="freeze"/><animate attributeName="y" keyTimes="0.0000;0.5333;0.6000;1.0000" values="440;440;332;332" dur="15s" begin="sb-play.begin+0s" fill="freeze"/></rect><text x="655" y="456" text-anchor="middle" font-size="11" font-weight="800" fill="#475569">1</text><g><animate attributeName="opacity" keyTimes="0.0000;0.6000;0.6200;1.0000" values="0;0;1;1" dur="15s" begin="sb-play.begin+0s" fill="freeze"/><text x="655" y="324" text-anchor="middle" font-size="12" font-weight="800" fill="#1d4ed8">12</text></g><rect x="710" y="440" width="50" height="0" fill="#60a5fa"><animate attributeName="height" keyTimes="0.0000;0.5600;0.6267;1.0000" values="0;0;135;135" dur="15s" begin="sb-play.begin+0s" fill="freeze"/><animate attributeName="y" keyTimes="0.0000;0.5600;0.6267;1.0000" values="440;440;305;305" dur="15s" begin="sb-play.begin+0s" fill="freeze"/></rect><text x="735" y="456" text-anchor="middle" font-size="11" font-weight="800" fill="#475569">2</text><g><animate attributeName="opacity" keyTimes="0.0000;0.6267;0.6467;1.0000" values="0;0;1;1" dur="15s" begin="sb-play.begin+0s" fill="freeze"/><text x="735" y="297" text-anchor="middle" font-size="12" font-weight="800" fill="#1d4ed8">15</text></g><rect x="790" y="440" width="50" height="0" fill="#60a5fa"><animate attributeName="height" keyTimes="0.0000;0.5867;0.6533;1.0000" values="0;0;171;171" dur="15s" begin="sb-play.begin+0s" fill="freeze"/><animate attributeName="y" keyTimes="0.0000;0.5867;0.6533;1.0000" values="440;440;269;269" dur="15s" begin="sb-play.begin+0s" fill="freeze"/></rect><text x="815" y="456" text-anchor="middle" font-size="11" font-weight="800" fill="#475569">3</text><g><animate attributeName="opacity" keyTimes="0.0000;0.6533;0.6733;1.0000" values="0;0;1;1" dur="15s" begin="sb-play.begin+0s" fill="freeze"/><text x="815" y="261" text-anchor="middle" font-size="12" font-weight="800" fill="#1d4ed8">19</text></g><rect x="870" y="440" width="50" height="0" fill="#60a5fa"><animate attributeName="height" keyTimes="0.0000;0.6133;0.6800;1.0000" values="0;0;216;216" dur="15s" begin="sb-play.begin+0s" fill="freeze"/><animate attributeName="y" keyTimes="0.0000;0.6133;0.6800;1.0000" values="440;440;224;224" dur="15s" begin="sb-play.begin+0s" fill="freeze"/></rect><text x="895" y="456" text-anchor="middle" font-size="11" font-weight="800" fill="#475569">4</text><g><animate attributeName="opacity" keyTimes="0.0000;0.6800;0.7000;1.0000" values="0;0;1;1" dur="15s" begin="sb-play.begin+0s" fill="freeze"/><text x="895" y="216" text-anchor="middle" font-size="12" font-weight="800" fill="#1d4ed8">24</text></g><rect x="950" y="440" width="50" height="0" fill="#60a5fa"><animate attributeName="height" keyTimes="0.0000;0.6400;0.7067;1.0000" values="0;0;270;270" dur="15s" begin="sb-play.begin+0s" fill="freeze"/><animate attributeName="y" keyTimes="0.0000;0.6400;0.7067;1.0000" values="440;440;170;170" dur="15s" begin="sb-play.begin+0s" fill="freeze"/></rect><text x="975" y="456" text-anchor="middle" font-size="11" font-weight="800" fill="#475569">5</text><g><animate attributeName="opacity" keyTimes="0.0000;0.7067;0.7267;1.0000" values="0;0;1;1" dur="15s" begin="sb-play.begin+0s" fill="freeze"/><text x="975" y="162" text-anchor="middle" font-size="12" font-weight="800" fill="#1d4ed8">30</text></g></g>
<g class="part" data-part="cmp" data-name="Compared with natural selection" data-info="Humans choose the feature, not the environment; it is faster, but reduces genetic variation and can increase inherited disorders." tabindex="0" role="button" aria-label="Compared with natural selection"><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.8000;0.8200;1.0000" values="0;0;1;1" dur="15s" begin="sb-play.begin+0s" fill="freeze"/><rect x="290.0" y="503" width="520" height="24" rx="12" fill="#fef3c7" stroke="#1f2937" stroke-width="1"/><text x="550" y="520" text-anchor="middle" font-size="12" font-weight="700">humans choose the feature · faster · less genetic variation</text></g></g>
</svg>