<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" class="vd-svg" role="img" aria-labelledby="uq-title uq-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="uq-play" data-vd-play-label="Play: divide unequally" data-vd-steps="[[0, &quot;Cytokinesis is not always equal.&quot;], [1, &quot;Oogenesis: the egg keeps most of the cytoplasm; polar bodies are tiny.&quot;], [7, &quot;Yeast budding: a small daughter cell pinches off.&quot;], [11, &quot;Every daughter must get at least one mitochondrion.&quot;]]" data-vd-dur="14">
<title id="uq-title">Unequal cytokinesis</title><desc id="uq-desc">Oogenesis with two unequal divisions producing a large egg and small polar bodies, and budding yeast producing a small daughter cell; each daughter receives at least one mitochondrion.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="520" fill="#ffffff"/>
<g aria-hidden="true"><animate id="uq-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<text class="head" x="30" y="34">Equal and unequal cytokinesis</text><text class="note" x="30" y="56">Schematic.</text>
<g class="part" data-part="oo" data-name="Oogenesis" data-info="Both meiotic divisions are unequal: the egg keeps almost all the cytoplasm; tiny polar bodies get a nucleus and little cytoplasm, and degenerate." tabindex="0" role="button" aria-label="Oogenesis"><rect x="30" y="80" width="560" height="380" rx="16" fill="#fdf2f8" stroke="#fbcfe8"/><text x="310" y="106" text-anchor="middle" font-size="14" font-weight="800" fill="#9d174d">oogenesis: two unequal divisions</text><circle cx="110" cy="260" r="60" fill="#fce7f3" stroke="#9d174d" stroke-width="2"/><circle cx="110" cy="260" r="12" fill="#9d174d"/><g><animate attributeName="opacity" keyTimes="0.0000;0.1429;0.1643;1.0000" values="0;0;1;1" dur="14s" begin="uq-play.begin+0s" fill="freeze"/><circle cx="290" cy="260" r="58" fill="#fce7f3" stroke="#9d174d" stroke-width="2"/><circle cx="290" cy="260" r="10" fill="#9d174d"/><circle cx="290" cy="186" r="12" fill="#fce7f3" stroke="#9d174d"/><circle cx="290" cy="186" r="5" fill="#9d174d"/><text x="330" y="180" text-anchor="start" font-size="11" font-weight="800" fill="#9d174d">polar body</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.3214;0.3429;1.0000" values="0;0;1;1" dur="14s" begin="uq-play.begin+0s" fill="freeze"/><circle cx="470" cy="260" r="58" fill="#fce7f3" stroke="#9d174d" stroke-width="2"/><circle cx="470" cy="260" r="10" fill="#9d174d"/><circle cx="470" cy="186" r="11" fill="#fce7f3" stroke="#9d174d"/><circle cx="470" cy="186" r="4" fill="#9d174d"/><text x="470" y="350" text-anchor="middle" font-size="12" font-weight="800" fill="#9d174d">egg: almost all the cytoplasm</text><text x="470" y="370" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">polar bodies degenerate</text></g></g>
<g class="part" data-part="bud" data-name="Budding in yeast" data-info="A small bud grows out of the parent, receives a nucleus after mitosis, and pinches off as a smaller daughter cell." tabindex="0" role="button" aria-label="Budding in yeast"><rect x="610" y="80" width="460" height="380" rx="16" fill="#fefce8" stroke="#fde047"/><text x="840" y="106" text-anchor="middle" font-size="14" font-weight="800" fill="#a16207">yeast: budding</text><ellipse cx="800" cy="260" rx="70" ry="56" fill="#fef3c7" stroke="#a16207" stroke-width="2"/><ellipse cx="880" cy="250" rx="0" ry="0" fill="#fef3c7" stroke="#a16207" stroke-width="2"><animate attributeName="rx" keyTimes="0.0000;0.5000;0.6429;1.0000" values="0;0;34;34" dur="14s" begin="uq-play.begin+0s" fill="freeze"/><animate attributeName="ry" keyTimes="0.0000;0.5000;0.6429;1.0000" values="0;0;30;30" dur="14s" begin="uq-play.begin+0s" fill="freeze"/><animate attributeName="cx" keyTimes="0.0000;0.6429;0.7500;1.0000" values="880;880;920;920" dur="14s" begin="uq-play.begin+0s" fill="freeze"/></ellipse><g><animate attributeName="opacity" keyTimes="0.0000;0.7143;0.7357;1.0000" values="0;0;1;1" dur="14s" begin="uq-play.begin+0s" fill="freeze"/><text x="930" y="310" text-anchor="middle" font-size="12" font-weight="800" fill="#a16207">bud pinches off</text></g></g>
<g class="part" data-part="rule" data-name="Organelles" data-info="Each daughter needs at least one mitochondrion (and a plastid in plants): these organelles form only by division of existing ones." tabindex="0" role="button" aria-label="Organelles"><g><animate attributeName="opacity" keyTimes="0.0000;0.7857;0.8071;1.0000" values="0;0;1;1" dur="14s" begin="uq-play.begin+0s" fill="freeze"/><ellipse cx="470" cy="290" rx="9" ry="5" fill="#f97316" stroke="#9a3412"/><ellipse cx="500" cy="240" rx="9" ry="5" fill="#f97316" stroke="#9a3412"/><ellipse cx="466" cy="192" rx="9" ry="5" fill="#f97316" stroke="#9a3412"/><ellipse cx="780" cy="280" rx="9" ry="5" fill="#f97316" stroke="#9a3412"/><ellipse cx="920" cy="256" rx="9" ry="5" fill="#f97316" stroke="#9a3412"/><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.7857;0.8071;1.0000" values="0;0;1;1" dur="14s" begin="uq-play.begin+0s" fill="freeze"/><rect x="320.0" y="483" width="460" height="24" rx="12" fill="#ffedd5" stroke="#1f2937" stroke-width="1"/><text x="550" y="500" text-anchor="middle" font-size="12" font-weight="700">every daughter needs at least one mitochondrion (orange)</text></g></g></g>
</svg>