<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 540" class="vd-svg" role="img" aria-labelledby="lb-title lb-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="lb-play" data-vd-play-label="Play: six months later" data-vd-steps="[[0, &quot;Measuring decomposition with litter bags.&quot;], [1, &quot;Coarse mesh lets detritivores in; fine mesh lets only microorganisms in.&quot;], [5, &quot;After six months: 60% lost from coarse, 35% from fine.&quot;], [10, &quot;Warmth, moisture and oxygen speed decomposition.&quot;]]" data-vd-dur="13">
<title id="lb-title">Litter bags and decomposition</title><desc id="lb-desc">Leaf-litter bags with coarse and fine mesh on the forest floor; after six months coarse-mesh bags lost 60 percent of mass and fine-mesh bags 35 percent; decomposition is faster in warm, moist, aerobic conditions.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
