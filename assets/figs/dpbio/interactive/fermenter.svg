14s" begin="fm-play.begin+0s" fill="freeze"/><circle r="5" fill="#fff" stroke="#64748b"/></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.2714;0.2857;0.4929;0.5071;1.0000" values="0;0;1;1;0;0" dur="14s" begin="fm-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.2714;0.4857;1.0000" values="380 470;380 470;380 210;380 210" dur="14s" begin="fm-play.begin+0s" fill="freeze"/><circle r="5" fill="#fff" stroke="#64748b"/></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.3000;0.3143;0.5214;0.5357;1.0000" values="0;0;1;1;0;0" dur="14s" begin="fm-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.3000;0.5143;1.0000" values="260 470;260 470;260 210;260 210" dur="14s" begin="fm-play.begin+0s" fill="freeze"/><circle r="5" fill="#fff" stroke="#64748b"/></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.3286;0.3429;0.5500;0.5643;1.0000" values="0;0;1;1;0;0" dur="14s" begin="fm-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.3286;0.5429;1.0000" values="300 470;300 470;300 210;300 210" dur="14s" begin="fm-play.begin+0s" fill="freeze"/><circle r="5" fill="#fff" stroke="#64748b"/></g></g><path d="M 150 470 L 200 470" stroke="#0369a1" stroke-width="5"/><text x="140" y="474" text-anchor="end" font-size="12" font-weight="800" fill="#0369a1">sterile air in</text><path d="M 480 180 L 540 180" stroke="#1d4ed8" stroke-width="5"/><path d="M 480 440 L 540 440" stroke="#1d4ed8" stroke-width="5"/><text x="548" y="184" text-anchor="start" font-size="12" font-weight="800" fill="#1d4ed8">cooling water out</text><text x="548" y="444" text-anchor="start" font-size="12" font-weight="800" fill="#1d4ed8">cooling water in (jacket)</text><path d="M 420 120 L 420 90" stroke="#15803d" stroke-width="5"/><text x="430" y="96" text-anchor="start" font-size="12" font-weight="800" fill="#15803d">nutrients in</text><path d="M 330 500 L 330 530" stroke="#7c2d12" stroke-width="5"/><text x="345" y="530" text-anchor="start" font-size="12" font-weight="800" fill="#7c2d12">product out</text><line x1="240" y1="110" x2="240" y2="300" stroke="#dc2626" stroke-width="3"/><line x1="270" y1="110" x2="270" y2="300" stroke="#7c3aed" stroke-width="3"/><text x="240" y="104" text-anchor="middle" font-size="12" font-weight="800" fill="#dc2626">T</text><text x="270" y="104" text-anchor="middle" font-size="12" font-weight="800" fill="#7c3aed">pH</text></g>
<g class="part" data-part="why" data-name="Controlled conditions" data-info="Optimum temperature and pH for enzymes; oxygen for respiration; nutrients for growth; sterile conditions so contaminating microorganisms do not compete or spoil the product." tabindex="0" role="button" aria-label="Controlled conditions"><rect x="700" y="100" width="370" height="400" rx="16" fill="#f8fafc" stroke="#cbd5e1"/><text x="885" y="128" text-anchor="middle" font-size="15" font-weight="800" fill="#111827">controlled conditions</text><g><animate attributeName="opacity" keyTimes="0.0000;0.5714;0.5929;1.0000" values="0;0;1;1" dur="14s" begin="fm-play.begin+0s" fill="freeze"/><text x="720" y="170" text-anchor="start" font-size="13" font-weight="800" fill="#111827">temperature probe + water jacket</text><text x="720" y="190" text-anchor="start" font-size="11" font-weight="700" fill="#475569">optimum for enzymes; removes heat from respiration</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.6071;0.6286;1.0000" values="0;0;1;1" dur="14s" begin="fm-play.begin+0s" fill="freeze"/><text x="720" y="232" text-anchor="start" font-size="13" font-weight="800" fill="#111827">pH probe</text><text x="720" y="252" text-anchor="start" font-size="11" font-weight="700" fill="#475569">optimum pH for enzymes</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.6429;0.6643;1.0000" values="0;0;1;1" dur="14s" begin="fm-play.begin+0s" fill="freeze"/><text x="720" y="294" text-anchor="start" font-size="13" font-weight="800" fill="#111827">sterile air</text><text x="720" y="314" text-anchor="start" font-size="11" font-weight="700" fill="#475569">oxygen for aerobic respiration</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.6786;0.7000;1.0000" values="0;0;1;1" dur="14s" begin="fm-play.begin+0s" fill="freeze"/><text x="720" y="356" text-anchor="start" font-size="13" font-weight="800" fill="#111827">stirrer</text><text x="720" y="376" text-anchor="start" font-size="11" font-weight="700" fill="#475569">mixes nutrients, oxygen and heat evenly</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.7143;0.7357;1.0000" values="0;0;1;1" dur="14s" begin="fm-play.begin+0s" fill="freeze"/><text x="720" y="418" text-anchor="start" font-size="13" font-weight="800" fill="#111827">sterile conditions</text><text x="720" y="438" text-anchor="start" font-size="11" font-weight="700" fill="#475569">no competing microorganisms</text></g></g>
<g class="part" data-part="use" data-name="Products" data-info="Penicillin (from the fungus Penicillium), insulin (from genetically modified bacteria), mycoprotein." tabindex="0" role="button" aria-label="Products"><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.8571;0.8786;1.0000" values="0;0;1;1" dur="14s" begin="fm-play.begin+0s" fill="freeze"/><rect x="705.0" y="518" width="360" height="24" rx="12" fill="#dcfce7" stroke="#1f2937" stroke-width="1"/><text x="885" y="535" text-anchor="middle" font-size="12" font-weight="700">penicillin · insulin (GM bacteria) · mycoprotein</text></g></g>
</svg>