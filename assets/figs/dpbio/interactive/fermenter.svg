<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" class="vd-svg" role="img" aria-labelledby="fm-title fm-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="fm-play" data-vd-play-label="Play: run the fermenter" data-vd-steps="[[0, &quot;An industrial fermenter.&quot;], [1, &quot;Probes, water jacket, air supply and stirrer.&quot;], [8, &quot;Each controls a condition for the microorganisms.&quot;], [12, &quot;Products: penicillin, insulin.&quot;]]" data-vd-dur="14">
<title id="fm-title">Fermenter</title><desc id="fm-desc">A fermenter vessel with a cooling water jacket, temperature and pH probes, sterile air bubbling through, a motor-driven stirrer, a nutrient inlet and a product outlet, with microorganisms growing in the culture.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="560" fill="#ffffff"/>
<g aria-hidden="true"><animate id="fm-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<text class="head" x="30" y="34">Large-scale production in a fermenter</text><text class="note" x="30" y="56">Schematic.</text>
