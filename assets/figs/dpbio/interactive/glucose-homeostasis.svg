<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 700" class="vd-svg" role="img" aria-labelledby="gh-title gh-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="gh-play" data-vd-play-label="Play: two feedback loops" data-vd-steps="[[0, &quot;Blood glucose is kept close to 5 mmol/L by negative feedback.&quot;], [1, &quot;After a meal, blood glucose rises.&quot;], [2.5, &quot;\u03b2 cells in the pancreas detect the rise and secrete insulin.&quot;], [4.5, &quot;Cells take up glucose; the liver and muscles store it as glycogen. Blood glucose falls back.&quot;], [8, &quot;Between meals blood glucose falls; \u03b1 cells secrete glucagon.&quot;], [10.5, &quot;The liver breaks glycogen down and releases glucose. Blood glucose rises back.&quot;]]" data-vd-dur="16">
<title id="gh-title">Control of blood glucose</title><desc id="gh-desc">Negative feedback control of blood glucose: a rise detected by beta cells causes insulin secretion and glucose uptake and glycogen storage; a fall detected by alpha cells causes glucagon secretion and glycogen breakdown in the liver.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1220" height="700" fill="#ffffff"/>
<g aria-hidden="true"><animate id="gh-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<defs><marker id="gh-475569" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="7.2" refY="8.0" orient="auto"><path d="M0,0 L16,8.0 L0,16 z" fill="#475569"/></marker><marker id="gh-2563eb" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="7.2" refY="8.0" orient="auto"><path d="M0,0 L16,8.0 L0,16 z" fill="#2563eb"/></marker><marker id="gh-ea580c" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="7.2" refY="8.0" orient="auto"><path d="M0,0 L16,8.0 L0,16 z" fill="#ea580c"/></marker></defs>
<text class="head" x="30" y="34">Control of blood glucose</text><text class="note" x="30" y="56">Negative feedback; values for a healthy adult.</text>
<g class="part" data-part="norm" data-name="Normal blood glucose" data-info="About 4–6 mmol/L (roughly 5), kept within this range by negative feedback." tabindex="0" role="button" aria-label="Normal blood glucose"><rect x="460" y="290" width="300" height="80" rx="40" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="610" y="324" text-anchor="middle" font-size="14" font-weight="800" fill="#166534">normal blood glucose</text><text x="610" y="348" text-anchor="middle" font-size="13" font-weight="700" fill="#166534">≈ 4–6 mmol/L</text></g>
<g><animate attributeName="opacity" keyTimes="0.0000;0.0625;0.0813;1.0000" values="0;0;1;1" dur="16s" begin="gh-play.begin+0s" fill="freeze"/><rect x="470" y="90" width="280" height="66" rx="14" fill="#fee2e2" stroke="#ef4444" stroke-width="2.5"/><text x="610.0" y="116" text-anchor="middle" font-size="14" font-weight="800" fill="#111827">blood glucose rises</text><text x="610.0" y="138" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">e.g. after a meal</text></g>
<g class="part" data-part="beta" data-name="β cells (islets of Langerhans)" data-info="Detect a rise in blood glucose and secrete insulin." tabindex="0" role="button" aria-label="β cells (islets of Langerhans)"><g><animate attributeName="opacity" keyTimes="0.0000;0.1562;0.1750;1.0000" values="0;0;1;1" dur="16s" begin="gh-play.begin+0s" fill="freeze"/><rect x="830" y="90" width="330" height="90" rx="14" fill="#eff6ff" stroke="#3b82f6" stroke-width="2.5"/><text x="995.0" y="116" text-anchor="middle" font-size="14" font-weight="800" fill="#111827">pancreas: β cells</text><text x="995.0" y="138" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">detect the rise</text><text x="995.0" y="160" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">secrete insulin into the blood</text></g></g>
<g class="part" data-part="ins" data-name="Insulin effects" data-info="Body cells take up more glucose (especially muscle and fat cells, via GLUT4 channels); liver and muscle convert glucose to glycogen (glycogenesis). Blood glucose falls." tabindex="0" role="button" aria-label="Insulin effects"><g><animate attributeName="opacity" keyTimes="0.0000;0.2812;0.3000;1.0000" values="0;0;1;1" dur="16s" begin="gh-play.begin+0s" fill="freeze"/><rect x="830" y="230" width="330" height="110" rx="14" fill="#eff6ff" stroke="#3b82f6" stroke-width="2.5"/><text x="995.0" y="256" text-anchor="middle" font-size="14" font-weight="800" fill="#111827">insulin: target cells</text><text x="995.0" y="278" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">take up more glucose</text><text x="995.0" y="300" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">liver + muscle: glucose → glycogen</text><text x="995.0" y="322" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">(glycogenesis)</text></g></g>
<g><animate attributeName="opacity" keyTimes="0.0000;0.1562;0.1750;1.0000" values="0;0;1;1" dur="16s" begin="gh-play.begin+0s" fill="freeze"/><path d="M 750 123 L 822 123" stroke="#2563eb" stroke-width="4" marker-end="url(#gh-2563eb)"/><path d="M 995 180 L 995 222" stroke="#2563eb" stroke-width="4" marker-end="url(#gh-2563eb)"/><path d="M 830 300 C 800 320 790 330 768 330" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#gh-2563eb)"/><text x="800" y="356" text-anchor="middle" font-size="12" font-weight="800" fill="#1d4ed8">falls back</text></g>
<g><animate attributeName="opacity" keyTimes="0.0000;0.5000;0.5188;1.0000" values="0;0;1;1" dur="16s" begin="gh-play.begin+0s" fill="freeze"/><rect x="470" y="520" width="280" height="66" rx="14" fill="#fef9c3" stroke="#eab308" stroke-width="2.5"/><text x="610.0" y="546" text-anchor="middle" font-size="14" font-weight="800" fill="#111827">blood glucose falls</text><text x="610.0" y="568" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">e.g. between meals, exercise</text></g>
<g class="part" data-part="alpha" data-name="α cells (islets of Langerhans)" data-info="Detect a fall in blood glucose and secrete glucagon." tabindex="0" role="button" aria-label="α cells (islets of Langerhans)"><g><animate attributeName="opacity" keyTimes="0.0000;0.5312;0.5500;1.0000" values="0;0;1;1" dur="16s" begin="gh-play.begin+0s" fill="freeze"/><rect x="60" y="520" width="330" height="90" rx="14" fill="#fff7ed" stroke="#f97316" stroke-width="2.5"/><text x="225.0" y="546" text-anchor="middle" font-size="14" font-weight="800" fill="#111827">pancreas: α cells</text><text x="225.0" y="568" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">detect the fall</text><text x="225.0" y="590" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">secrete glucagon into the blood</text></g></g>
<g class="part" data-part="glu" data-name="Glucagon effects" data-info="The liver breaks glycogen down to glucose (glycogenolysis) and makes new glucose (gluconeogenesis). Blood glucose rises." tabindex="0" role="button" aria-label="Glucagon effects"><g><animate attributeName="opacity" keyTimes="0.0000;0.6562;0.6750;1.0000" values="0;0;1;1" dur="16s" begin="gh-play.begin+0s" fill="freeze"/><rect x="60" y="340" width="330" height="110" rx="14" fill="#fff7ed" stroke="#f97316" stroke-width="2.5"/><text x="225.0" y="366" text-anchor="middle" font-size="14" font-weight="800" fill="#111827">glucagon: liver cells</text><text x="225.0" y="388" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">glycogen → glucose (glycogenolysis)</text><text x="225.0" y="410" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">make new glucose (gluconeogenesis)</text><text x="225.0" y="432" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">glucose released</text></g></g>
<g><animate attributeName="opacity" keyTimes="0.0000;0.5312;0.5500;1.0000" values="0;0;1;1" dur="16s" begin="gh-play.begin+0s" fill="freeze"/><path d="M 470 553 L 398 553" stroke="#ea580c" stroke-width="4" marker-end="url(#gh-ea580c)"/><path d="M 225 520 L 225 458" stroke="#ea580c" stroke-width="4" marker-end="url(#gh-ea580c)"/><path d="M 390 380 C 420 360 430 345 452 340" fill="none" stroke="#ea580c" stroke-width="4" marker-end="url(#gh-ea580c)"/><text x="420" y="400" text-anchor="middle" font-size="12" font-weight="800" fill="#c2410c">rises back</text></g>
<g><animate attributeName="opacity" keyTimes="0.0000;0.0625;0.0813;1.0000" values="0;0;1;1" dur="16s" begin="gh-play.begin+0s" fill="freeze"/><path d="M 610 156 L 610 282" stroke="#475569" stroke-width="2" stroke-dasharray="5 4"/><path d="M 610 512 L 610 378" stroke="#475569" stroke-width="2" stroke-dasharray="5 4"/></g>
<g class="part" data-part="graph" data-name="Blood glucose through a day" data-info="Rises after meals, then insulin brings it back; between meals glucagon stops it falling too far." tabindex="0" role="button" aria-label="Blood glucose through a day"><g><animate attributeName="opacity" keyTimes="0.0000;0.8125;0.8313;1.0000" values="0;0;1;1" dur="16s" begin="gh-play.begin+0s" fill="freeze"/><rect x="60" y="90" width="360" height="200" fill="#fff" stroke="#cbd5e1"/><rect x="60" y="190.0" width="360" height="50.0" fill="#dcfce7"/><polyline points="60,225 62,225 63,225 64,225 66,225 68,225 69,225 70,225 72,225 74,225 75,225 76,225 78,225 80,225 81,225 82,225 84,225 86,225 87,225 88,225 90,225 92,225 93,225 94,225 96,225 98,225 99,225 100,225 102,225 104,225 105,225 106,225 108,225 110,225 111,225 112,225 114,225 116,225 117,225 118,225 120,225 122,225 123,225 124,225 126,225 128,225 129,225 130,225 132,225 134,225 135,225 136,225 138,225 140,225 141,225 142,225 144,225 146,225 147,225 148,225 150,225 152,225 153,225 154,225 156,225 158,225 159,225 160,225 162,225 164,225 165,225 166,219 168,215 170,211 171,208 172,206 174,204 176,203 177,202 178,202 180,202 182,202 183,202 184,203 186,203 188,204 189,205 190,205 192,206 194,207 195,208 196,209 198,210 200,210 201,211 202,212 204,213 205,214 207,214 208,215 210,216 212,216 213,217 214,217 216,218 218,218 219,219 220,219 222,220 224,220 225,220 226,221 228,221 230,221 231,222 232,222 234,222 236,222 237,223 238,223 240,223 242,223 243,223 245,223 246,223 248,224 249,224 250,224 252,224 254,224 255,224 256,218 258,214 260,210 261,207 262,205 264,204 266,203 267,202 268,202 270,201 272,202 273,202 274,202 276,203 278,204 279,204 280,205 282,206 284,207 285,208 286,209 288,210 290,210 291,211 292,212 294,213 296,213 297,214 298,215 300,216 302,216 303,217 304,217 306,218 308,218 309,219 310,219 312,220 314,220 315,220 316,221 318,221 320,221 321,222 322,222 324,222 326,222 327,222 328,223 330,223 332,223 333,223 334,223 336,223 338,224 339,224 340,224 342,224 344,224 345,224 346,218 348,214 350,210 351,207 352,205 354,204 356,203 357,202 358,202 360,201 362,202 363,202 364,202 366,203 368,204 369,204 370,205 372,206 373,207 375,208 377,209 378,210 380,210 381,211 382,212 384,213 386,213 387,214 388,215 390,216 392,216 393,217 394,217 396,218 398,218 399,219 400,219 402,220 404,220 405,220 406,221 408,221 410,221 411,222 412,222 414,222 416,222 417,222 418,223 420,223" fill="none" stroke="#dc2626" stroke-width="3"/><text x="60.0" y="306" text-anchor="middle" font-size="10" font-weight="700" fill="#475569">00:00</text><text x="150.0" y="306" text-anchor="middle" font-size="10" font-weight="700" fill="#475569">06:00</text><text x="240.0" y="306" text-anchor="middle" font-size="10" font-weight="700" fill="#475569">12:00</text><text x="330.0" y="306" text-anchor="middle" font-size="10" font-weight="700" fill="#475569">18:00</text><text x="420.0" y="306" text-anchor="middle" font-size="10" font-weight="700" fill="#475569">24:00</text><text x="165.0" y="104" text-anchor="middle" font-size="10" font-weight="800" fill="#92400e">meal</text><text x="255.0" y="104" text-anchor="middle" font-size="10" font-weight="800" fill="#92400e">meal</text><text x="345.0" y="104" text-anchor="middle" font-size="10" font-weight="800" fill="#92400e">meal</text><text x="64" y="236.0" text-anchor="start" font-size="10" font-weight="800" fill="#166534">4–6 mmol/L</text><text x="240.0" y="82" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">blood glucose over 24 hours</text></g></g>
<g><animate attributeName="opacity" keyTimes="0.0000;0.8125;0.8313;1.0000" values="0;0;1;1" dur="16s" begin="gh-play.begin+0s" fill="freeze"/><rect x="830" y="420" width="370" height="150" rx="14" fill="#f8fafc" stroke="#cbd5e1"/><text x="1015" y="446" text-anchor="middle" font-size="14" font-weight="800" fill="#111827">When control fails: diabetes</text><text x="1015" y="474" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">Type 1: β cells destroyed → no insulin</text><text x="1015" y="498" text-anchor="middle" font-size="11" font-weight="600" fill="#475569">(autoimmune; insulin injections)</text><text x="1015" y="526" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">Type 2: cells respond less to insulin</text><text x="1015" y="550" text-anchor="middle" font-size="11" font-weight="600" fill="#475569">(linked to obesity; diet, exercise, drugs)</text></g>
</svg>