<g class="part" data-part="allo" data-name="Allosteric regulation" data-info="Many enzymes are regulated through allosteric sites: inhibitors switch them off, activators can stabilise the active form." tabindex="0" role="button" aria-label="Allosteric regulation"><g><animate attributeName="opacity" keyTimes="0.0000;0.8125;0.8313;1.0000" values="0;0;1;1" dur="16s" begin="ei-play.begin+0s" fill="freeze"/><rect x="790" y="440" width="290" height="180" rx="14" fill="#f8fafc" stroke="#cbd5e1"/><text x="935" y="466" text-anchor="middle" font-size="14" font-weight="800" fill="#111827">Summary</text><text x="806" y="494" text-anchor="start" font-size="12" font-weight="700" fill="#b91c1c">Competitive: active site; more</text><text x="806" y="512" text-anchor="start" font-size="12" font-weight="700" fill="#b91c1c">substrate overcomes it; same Vmax</text><text x="806" y="546" text-anchor="start" font-size="12" font-weight="700" fill="#6d28d9">Non-competitive: allosteric site;</text><text x="806" y="564" text-anchor="start" font-size="12" font-weight="700" fill="#6d28d9">shape change; Vmax lowered</text><text x="806" y="598" text-anchor="start" font-size="12" font-weight="600" fill="#475569">e.g. statins (competitive)</text></g></g>
</svg>