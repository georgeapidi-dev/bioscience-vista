<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 640" class="vd-svg" role="img" aria-labelledby="ei-title ei-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="ei-play" data-vd-play-label="Play: inhibit" data-vd-steps="[[0, &quot;Enzyme inhibitors.&quot;], [1, &quot;Competitive: the inhibitor fits the active site and blocks the substrate.&quot;], [5, &quot;Non-competitive: the inhibitor binds an allosteric site; the active site changes shape.&quot;], [9.5, &quot;On a graph: a competitive inhibitor is overcome by more substrate; a non-competitive one lowers the maximum rate.&quot;]]" data-vd-dur="16">
<title id="ei-title">Competitive and non-competitive inhibition</title><desc id="ei-desc">A competitive inhibitor blocks the active site and competes with the substrate; a non-competitive inhibitor binds an allosteric site and changes the active site shape; graphs of rate against substrate concentration for no inhibitor, competitive and non-competitive inhibition.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="640" fill="#ffffff"/>
<g aria-hidden="true"><animate id="ei-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<text class="head" x="30" y="34">Enzyme inhibition</text><text class="note" x="30" y="56">Green wedge = substrate; red square = inhibitor.</text>
<g class="part" data-part="comp" data-name="Competitive inhibitor" data-info="Similar in shape to the substrate; binds the active site and blocks it. Substrate and inhibitor compete, so adding more substrate overcomes it." tabindex="0" role="button" aria-label="Competitive inhibitor"><text x="250" y="100" text-anchor="middle" font-size="16" font-weight="800" fill="#b91c1c">Competitive</text><g transform="translate(250 250) scale(1)"><path d="M -60 -40 L -20 -40 L 0 -14 L 20 -40 L 60 -40 C 80 -40 80 40 50 46 C 20 52 -20 52 -50 46 C -80 40 -80 -40 -60 -40 Z" fill="#cbd5e1" stroke="#334155" stroke-width="2.5"/></g><g transform="translate(250 196)"><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.0625;0.1562;1.0000" values="250 120;250 120;250 196;250 196" dur="16s" begin="ei-play.begin+0s" fill="freeze"/><rect x="-16" y="-2" width="32" height="26" fill="#fca5a5" stroke="#b91c1c" stroke-width="2"/></g><g transform="translate(330 150)"><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.1562;0.2188;0.2812;1.0000" values="330 150;330 150;270 180;340 140;340 140" dur="16s" begin="ei-play.begin+0s" fill="freeze"/><path d="M -20 0 L 0 26 L 20 0 Z" fill="#86efac" stroke="#15803d" stroke-width="2"/></g><g><animate attributeName="opacity" keyTimes="0.0000;0.1875;0.2062;1.0000" values="0;0;1;1" dur="16s" begin="ei-play.begin+0s" fill="freeze"/><text x="250" y="340" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">inhibitor blocks the active site</text><text x="250" y="360" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">substrate cannot bind</text></g></g>
<g class="part" data-part="non" data-name="Non-competitive inhibitor" data-info="Binds an allosteric site away from the active site, changing the active site&#x27;s shape so the substrate no longer fits. More substrate cannot overcome it." tabindex="0" role="button" aria-label="Non-competitive inhibitor"><text x="750" y="100" text-anchor="middle" font-size="16" font-weight="800" fill="#7c3aed">Non-competitive</text><g><animate attributeName="opacity" keyTimes="0.0000;0.4062;0.4250;1.0000" values="1;1;0;0" dur="16s" begin="ei-play.begin+0s" fill="freeze"/><g transform="translate(750 250) scale(1)"><path d="M -60 -40 L -20 -40 L 0 -14 L 20 -40 L 60 -40 C 80 -40 80 40 50 46 C 20 52 -20 52 -50 46 C -80 40 -80 -40 -60 -40 Z" fill="#cbd5e1" stroke="#334155" stroke-width="2.5"/></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.4062;0.4250;1.0000" values="0;0;1;1" dur="16s" begin="ei-play.begin+0s" fill="freeze"/><g transform="translate(750 250) scale(1)"><path d="M -60 -40 L -18 -40 L -18 -18 L 18 -18 L 18 -40 L 60 -40 C 80 -40 80 40 50 46 C 20 52 -20 52 -50 46 C -80 40 -80 -40 -60 -40 Z" fill="#cbd5e1" stroke="#334155" stroke-width="2.5"/></g></g><circle cx="810" cy="290" r="10" fill="#fff" stroke="#334155" stroke-dasharray="3 3"/><text x="870" y="330" text-anchor="middle" font-size="12" font-weight="800" fill="#475569">allosteric site</text><g transform="translate(860 330)"><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.3125;0.4062;1.0000" values="880 380;880 380;812 292;812 292" dur="16s" begin="ei-play.begin+0s" fill="freeze"/><rect x="-12" y="-12" width="24" height="24" fill="#fca5a5" stroke="#b91c1c" stroke-width="2"/></g><g transform="translate(830 140)"><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.4375;0.5000;0.5625;1.0000" values="830 140;830 140;765 185;840 140;840 140" dur="16s" begin="ei-play.begin+0s" fill="freeze"/><path d="M -20 0 L 0 26 L 20 0 Z" fill="#86efac" stroke="#15803d" stroke-width="2"/></g><g><animate attributeName="opacity" keyTimes="0.0000;0.4375;0.4562;1.0000" values="0;0;1;1" dur="16s" begin="ei-play.begin+0s" fill="freeze"/><text x="750" y="360" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">active site changes shape</text><text x="750" y="380" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">substrate no longer fits</text></g></g>
<g class="part" data-part="graph" data-name="Effect on rate" data-info="Competitive: slower at low substrate concentration but the same maximum rate is reached. Non-competitive: maximum rate is lowered." tabindex="0" role="button" aria-label="Effect on rate"><line x1="140" y1="600" x2="620" y2="600" stroke="#111827" stroke-width="2"/><line x1="140" y1="600" x2="140" y2="420" stroke="#111827" stroke-width="2"/><text x="380.0" y="634" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">substrate concentration →</text><text x="96" y="510.0" font-size="13" font-weight="700" text-anchor="middle" transform="rotate(-90 96 510.0)">rate</text><clipPath id="eig-c95420140"><rect x="140" y="420" width="484" height="184"><animate attributeName="width" keyTimes="0.0000;0.5938;0.8125;1.0000" values="0;0;484;484" dur="16s" begin="ei-play.begin+0s" fill="freeze"/></rect></clipPath><g clip-path="url(#eig-c95420140)"><polyline points="140.0,600.0 142.4,571.4 144.8,551.0 147.2,535.7 149.6,523.8 152.0,514.3 154.4,506.5 156.8,500.0 159.2,494.5 161.6,489.8 164.0,485.7 166.4,482.1 168.8,479.0 171.2,476.2 173.6,473.7 176.0,471.4 178.4,469.4 180.8,467.5 183.2,465.8 185.6,464.3 188.0,462.9 190.4,461.5 192.8,460.3 195.2,459.2 197.6,458.1 200.0,457.1 202.4,456.2 204.8,455.4 207.2,454.5 209.6,453.8 212.0,453.1 214.4,452.4 216.8,451.7 219.2,451.1 221.6,450.5 224.0,450.0 226.4,449.5 228.8,449.0 231.2,448.5 233.6,448.1 236.0,447.6 238.4,447.2 240.8,446.8 243.2,446.4 245.6,446.1 248.0,445.7 250.4,445.4 252.8,445.1 255.2,444.7 257.6,444.4 260.0,444.2 262.4,443.9 264.8,443.6 267.2,443.3 269.6,443.1 272.0,442.9 274.4,442.6 276.8,442.4 279.2,442.2 281.6,442.0 284.0,441.8 286.4,441.6 288.8,441.4 291.2,441.2 293.6,441.0 296.0,440.8 298.4,440.6 300.8,440.5 303.2,440.3 305.6,440.2 308.0,440.0 310.4,439.8 312.8,439.7 315.2,439.6 317.6,439.4 320.0,439.3 322.4,439.2 324.8,439.0 327.2,438.9 329.6,438.8 332.0,438.7 334.4,438.5 336.8,438.4 339.2,438.3 341.6,438.2 344.0,438.1 346.4,438.0 348.8,437