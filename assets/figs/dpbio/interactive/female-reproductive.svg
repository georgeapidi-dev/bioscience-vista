<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 660" class="vd-svg" role="img" aria-labelledby="fr-title fr-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="fr-play" data-vd-play-label="Play: from ovulation to implantation" data-vd-steps="[[0, &quot;The female reproductive system, front view.&quot;], [1, &quot;Ovulation: an egg is released from the ovary and swept into the oviduct by the fimbriae.&quot;], [4, &quot;Sperm swim through the cervix and uterus into the oviduct.&quot;], [7, &quot;Fertilisation in the oviduct: the egg and sperm nuclei fuse, forming a zygote.&quot;], [9, &quot;The zygote divides by mitosis into a ball of cells (embryo) as it moves down the oviduct.&quot;], [13.5, &quot;About a week after fertilisation the embryo implants in the endometrium.&quot;]]" data-vd-dur="18">
<title id="fr-title">Female reproductive system</title><desc id="fr-desc">Front view of the female reproductive system: ovaries, oviducts with fimbriae, uterus with endometrium and muscle wall, cervix and vagina; animation of ovulation, fertilisation in the oviduct and implantation.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="660" fill="#ffffff"/>
<g aria-hidden="true"><animate id="fr-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<defs><radialGradient id="fr-m" cx=".5" cy=".35"><stop offset="0" stop-color="#fecdd3"/><stop offset="1" stop-color="#fb7185"/></radialGradient><radialGradient id="fr-o" cx=".4" cy=".35"><stop offset="0" stop-color="#fff7ed"/><stop offset="1" stop-color="#fdba74"/></radialGradient></defs>
<text class="head" x="30" y="34">The female reproductive system</text><text class="note" x="30" y="56">Front view, simplified. One side of the uterus cut open to show the lining.</text>
<g class="part" data-part="od" data-name="Oviduct (fallopian tube)" data-info="Carries the egg towards the uterus, moved by cilia and muscle contractions. Fertilisation usually happens here." tabindex="0" role="button" aria-label="Oviduct (fallopian tube)"><path d="M 337 262 C 290 232 232 226 196 258" fill="none" stroke="#f472b6" stroke-width="18" stroke-linecap="round"/><path d="M 337 262 C 290 232 232 226 196 258" fill="none" stroke="#fce7f3" stroke-width="5"/><path d="M 503 262 C 550 232 608 226 644 258" fill="none" stroke="#f472b6" stroke-width="18" stroke-linecap="round"/><path d="M 503 262 C 550 232 608 226 644 258" fill="none" stroke="#fce7f3" stroke-width="5"/></g>
<g class="part" data-part="fim" data-name="Fimbriae" data-info="Finger-like ends of the oviduct that sweep the released egg into the tube." tabindex="0" role="button" aria-label="Fimbriae"><path d="M 196 258 q -10 14 -4 30" fill="none" stroke="#f472b6" stroke-width="6" stroke-linecap="round"/><path d="M 196 258 q -15 20 -10 34" fill="none" stroke="#f472b6" stroke-width="6" stroke-linecap="round"/><path d="M 196 258 q -20 26 -16 38" fill="none" stroke="#f472b6" stroke-width="6" stroke-linecap="round"/><path d="M 196 258 q -25 32 -22 42" fill="none" stroke="#f472b6" stroke-width="6" stroke-linecap="round"/><path d="M 196 258 q -30 38 -28 46" fill="none" stroke="#f472b6" stroke-width="6" stroke-linecap="round"/><path d="M 644 258 q 10 14 4 30" fill="none" stroke="#f472b6" stroke-width="6" stroke-linecap="round"/><path d="M 644 258 q 15 20 10 34" fill="none" stroke="#f472b6" stroke-width="6" stroke-linecap="round"/><path d="M 644 258 q 20 26 16 38" fill="none" stroke="#f472b6" stroke-width="6" stroke-linecap="round"/><path d="M 644 258 q 25 32 22 42" fill="none" stroke="#f472b6" stroke-width="6" stroke-linecap="round"/><path d="M 644 258 q 30 38 28 46" fill="none" stroke="#f472b6" stroke-width="6" stroke-linecap="round"/></g>
<g class="part" data-part="ov" data-name="Ovary" data-info="Contains follicles, each with an egg cell. Releases one egg a month (ovulation) and secretes oestrogen and progesterone." tabindex="0" role="button" aria-label="Ovary"><ellipse cx="214" cy="330" rx="44" ry="28" fill="url(#fr-o)" stroke="#c2410c" stroke-width="2.5"/><circle cx="194" cy="326" r="7" fill="#fff" stroke="#ea580c" stroke-width="1.5"/><circle cx="218" cy="338" r="5" fill="#fff" stroke="#ea580c" stroke-width="1.5"/><circle cx="232" cy="322" r="9" fill="#fff" stroke="#ea580c" stroke-width="1.5"/><circle cx="210" cy="318" r="4" fill="#fff" stroke="#ea580c" stroke-width="1.5"/><line x1="254" y1="330" x2="340" y2="300" stroke="#fda4af" stroke-width="4"/><ellipse cx="626" cy="330" rx="44" ry="28" fill="url(#fr-o)" stroke="#c2410c" stroke-width="2.5"/><circle cx="606" cy="326" r="7" fill="#fff" stroke="#ea580c" stroke-width="1.5"/><circle cx="630" cy="338" r="5" fill="#fff" stroke="#ea580c" stroke-width="1.5"/><circle cx="644" cy="322" r="9" fill="#fff" stroke="#ea580c" stroke-width="1.5"/><circle cx="622" cy="318" r="4" fill="#fff" stroke="#ea580c" stroke-width="1.5"/><line x1="586" y1="330" x2="500" y2="300" stroke="#fda4af" stroke-width="4"/></g>
<g class="part" data-part="my" data-name="Muscle wall (myometrium)" data-info="Thick smooth muscle that contracts during birth." tabindex="0" role="button" aria-label="Muscle wall (myometrium)"><path d="M 330 270 C 330 222 510 222 510 270 C 510 345 472 400 454 432 L 388 432 C 370 400 330 345 330 270 Z" fill="url(#fr-m)" stroke="#be123c" stroke-width="3"/></g>
<g class="part" data-part="en" data-name="Endometrium" data-info="The lining of the uterus, rich in blood vessels. The embryo implants here." tabindex="0" role="button" aria-label="Endometrium"><path d="M 356 268 Q 420 250 484 268 Q 462 330 420 412 Q 378 330 356 268 Z" fill="#fda4af" stroke="#be123c" stroke-width="2"/><path d="M 372 274 Q 420 262 468 274 Q 450 322 420 384 Q 390 322 372 274 Z" fill="#fff1f2"/><path d="M 362 280 q 4 -6 8 0" stroke="#be123c" fill="none" stroke-width="1.4"/><path d="M 474 280 q 4 -6 8 0" stroke="#be123c" fill="none" stroke-width="1.4"/><path d="M 380 320 q 4 -6 8 0" stroke="#be123c" fill="none" stroke-width="1.4"/><path d="M 456 320 q 4 -6 8 0" stroke="#be123c" fill="none" stroke-width="1.4"/><path d="M 398 360 q 4 -6 8 0" stroke="#be123c" fill="none" stroke-width="1.4"/><path d="M 436 360 q 4 -6 8 0" stroke="#be123c" fill="none" stroke-width="1.4"/></g>
<g class="part" data-part="ut" data-name="Uterus (womb)" data-info="A muscular organ where the embryo implants and the fetus develops." tabindex="0" role="button" aria-label="Uterus (womb)"><path d="M 330 270 C 330 222 510 222 510 270" fill="none" stroke="#9f1239" stroke-width="5" opacity=".001"/></g>
<g class="part" data-part="cx" data-name="Cervix" data-info="The narrow neck of the uterus; a ring of muscle that holds the fetus in place until birth." tabindex="0" role="button" aria-label="Cervix"><path d="M 388 432 L 452 432 L 448 470 L 392 470 Z" fill="#fb7185" stroke="#be123c" stroke-width="2.5"/><line x1="420" y1="412" x2="420" y2="470" stroke="#fff1f2" stroke-width="5"/></g>
<g class="part" data-part="va" data-name="Vagina" data-info="A muscular tube that receives sperm during intercourse; the birth canal." tabindex="0" role="button" aria-label="Vagina"><path d="M 392 470 L 382 610 L 458 610 L 448 470 Z" fill="#fecdd3" stroke="#be123c" stroke-width="2.5"/><path d="M 420 470 L 420 610" stroke="#fff1f2" stroke-width="10"/></g>
