<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 500" class="vd-svg" role="img" aria-labelledby="rx-title rx-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="rx-play" data-vd-play-label="Play: pass the hydrogen" data-vd-steps="[[0, &quot;Oxidation by hydrogen removal.&quot;], [1, &quot;A dehydrogenase removes two hydrogen atoms from the substrate: the substrate is oxidised.&quot;], [4.5, &quot;NAD accepts them and is reduced.&quot;], [8, &quot;Reduced NAD carries the hydrogen (and its electrons) to the electron transport chain.&quot;]]" data-vd-dur="12">
<title id="rx-title">Oxidation by dehydrogenation</title><desc id="rx-desc">A substrate loses two hydrogen atoms to a dehydrogenase and is oxidised; NAD accepts them and becomes reduced NAD, which carries them to the electron transport chain.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="500" fill="#ffffff"/>
<g aria-hidden="true"><animate id="rx-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<defs><marker id="rx-475569" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="6.3" refY="7.0" orient="auto"><path d="M0,0 L14,7.0 L0,14 z" fill="#475569"/></marker></defs>
<text class="head" x="30" y="34">Oxidation by removing hydrogen</text><text class="note" x="30" y="56">OIL RIG: Oxidation Is Loss, Reduction Is Gain (of electrons).</text>
<g class="part" data-part="dh" data-name="Dehydrogenation" data-info="In respiration, substrates are oxidised by removing hydrogen atoms (each with an electron) using dehydrogenase enzymes." tabindex="0" role="button" aria-label="Dehydrogenation"><rect x="100.0" y="180.0" width="200" height="80" rx="12" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/><text x="200" y="225.0" text-anchor="middle" font-size="15" font-weight="800" fill="#111827">substrate</text><g><animate attributeName="opacity" keyTimes="0.0000;0.2500;0.2750;1.0000" values="0;0;1;1" dur="12s" begin="rx-play.begin+0s" fill="freeze"/><text x="200" y="300" text-anchor="middle" font-size="13" font-weight="800" fill="#1d4ed8">OXIDISED (lost H)</text></g><ellipse cx="480" cy="220" rx="80" ry="40" fill="#e5e7eb" stroke="#475569" stroke-width="2"/><text x="480" y="226" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">dehydrogenase</text><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.0000;0.0167;1.0000" values="0;0;1;1" dur="12s" begin="rx-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.0833;0.2500;0.5000;1.0000" values="250 190;250 190;480 180;770 160;770 160" dur="12s" begin="rx-play.begin+0s" fill="freeze"/><g><circle r="13" fill="#fde047" stroke="#a16207" stroke-width="2"/><text x="0" y="5" text-anchor="middle" font-size="13" font-weight="800" fill="#713f12">H</text></g></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.0000;0.0167;1.0000" values="0;0;1;1" dur="12s" begin="rx-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.1083;0.2750;0.5250;1.0000" values="280 190;280 190;480 180;810 160;810 160" dur="12s" begin="rx-play.begin+0s" fill="freeze"/><g><circle r="13" fill="#fde047" stroke="#a16207" stroke-width="2"/><text x="0" y="5" text-anchor="middle" font-size="13" font-weight="800" fill="#713f12">H</text></g></g></g></g>
<g class="part" data-part="nad" data-name="NAD as carrier" data-info="NAD accepts the hydrogen and is reduced: NAD + 2H → reduced NAD (NADH + H⁺). Reduced NAD carries the hydrogen to the electron transport chain." tabindex="0" role="button" aria-label="NAD as carrier"><rect x="700.0" y="180.0" width="200" height="80" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="800" y="225.33333333333334" text-anchor="middle" font-size="16" font-weight="800" fill="#111827">NAD</text><g><animate attributeName="opacity" keyTimes="0.0000;0.5417;0.5667;1.0000" values="0;0;1;1" dur="12s" begin="rx-play.begin+0s" fill="freeze"/><text x="800" y="300" text-anchor="middle" font-size="13" font-weight="800" fill="#15803d">REDUCED NAD (gained H)</text></g></g>
<g class="part" data-part="def" data-name="Oxidation and reduction" data-info="Oxidation is loss of electrons; reduction is gain of electrons. Redox reactions involve both." tabindex="0" role="button" aria-label="Oxidation and reduction"><g><animate attributeName="opacity" keyTimes="0.0000;0.6667;0.6917;1.0000" values="0;0;1;1" dur="12s" begin="rx-play.begin+0s" fill="freeze"/><path d="M 800 320 L 800 380" stroke="#475569" stroke-width="3" marker-end="url(#rx-475569)"/><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.6667;0.6917;1.0000" values="0;0;1;1" dur="12s" begin="rx-play.begin+0s" fill="freeze"/><rect x="670.0" y="398" width="260" height="24" rx="12" fill="#dcfce7" stroke="#1f2937" stroke-width="1"/><text x="800" y="415" text-anchor="middle" font-size="12" font-weight="700">to the electron transport chain</text></g></g></g>
</svg>