<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 700" class="vd-svg" role="img" aria-labelledby="st-title st-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="st-play" data-vd-play-label="Play: one skeleton, many steroids" data-vd-steps="[[0, &quot;Steroids: a family built on one ring skeleton.&quot;], [1, &quot;Four fused rings: three of six carbons and one of five.&quot;], [3.5, &quot;Cholesterol: \u2013OH on ring A and a side chain on ring D.&quot;], [6, &quot;From cholesterol the body makes the sex hormones: testosterone,&quot;], [8, &quot;oestradiol,&quot;], [10, &quot;and progesterone. Small changes to the groups give very different effects.&quot;]]" data-vd-dur="14">
<title id="st-title">Steroids</title><desc id="st-desc">The steroid nucleus of four fused rings and four steroids built on it: cholesterol, testosterone, oestradiol and progesterone, with their differing functional groups highlighted.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1220" height="700" fill="#ffffff"/>
<g aria-hidden="true"><animate id="st-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<defs><marker id="st-475569" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="6.3" refY="7.0" orient="auto"><path d="M0,0 L14,7.0 L0,14 z" fill="#475569"/></marker></defs>
<text class="head" x="30" y="34">Steroids: one skeleton, many molecules</text><text class="note" x="30" y="56">Skeletal formulas: each corner is a carbon; hydrogens not shown. Differences highlighted.</text>
<g class="part" data-part="core" data-name="Steroid nucleus" data-info="Four fused rings, A, B, C (six carbons each) and D (five carbons): all steroids share it." tabindex="0" role="button" aria-label="Steroid nucleus"><polygon points="150.0,305.0 111.0,282.5 111.0,237.5 150.0,215.0 189.0,237.5 189.0,282.5" fill="none" stroke="#111827" stroke-width="3" stroke-linejoin="round"/><polygon points="227.9,305.0 189.0,282.5 189.0,237.5 227.9,215.0 266.9,237.5 266.9,282.5" fill="none" stroke="#111827" stroke-width="3" stroke-linejoin="round"/><polygon points="266.9,237.5 227.9,215.0 227.9,170.0 266.9,147.5 305.9,170.0 305.9,215.0" fill="none" stroke="#111827" stroke-width="3" stroke-linejoin="round"/><polygon points="305.9,215.0 305.9,170.0 346.4,154.2 371.1,192.5 346.4,230.8" fill="none" stroke="#111827" stroke-width="3" stroke-linejoin="round"/><line x1="189.0" y1="237.5" x2="189.0" y2="201.5" stroke="#111827" stroke-width="3"/><line x1="305.9" y1="170.0" x2="305.9" y2="134.0" stroke="#111827" stroke-width="3"/><text x="150.0" y="265.0" text-anchor="middle" font-size="18.0" font-weight="800" fill="#94a3b8">A</text><text x="227.94228634059948" y="265.0" text-anchor="middle" font-size="18.0" font-weight="800" fill="#94a3b8">B</text><text x="266.9134295108992" y="197.5" text-anchor="middle" font-size="18.0" font-weight="800" fill="#94a3b8">C</text><text x="335.13457268119896" y="197.5" text-anchor="middle" font-size="18.0" font-weight="800" fill="#94a3b8">D</text><text x="240" y="360" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">the steroid nucleus: rings A, B, C (6 C) and D (5 C)</text></g>
<g class="part" data-part="chol" data-name="Cholesterol" data-info="An –OH on ring A, a C=C in ring B and a hydrocarbon side chain on ring D. Found in animal cell membranes; steroid hormones are made from it." tabindex="0" role="button" aria-label="Cholesterol"><g><animate attributeName="opacity" keyTimes="0.0000;0.2500;0.2714;1.0000" values="0;0;1;1" dur="14s" begin="st-play.begin+0s" fill="freeze"/><polygon points="640.0,260.0 614.0,245.0 614.0,215.0 640.0,200.0 666.0,215.0 666.0,245.0" fill="none" stroke="#111827" stroke-width="3" stroke-linejoin="round"/><polygon points="692.0,260.0 666.0,245.0 666.0,215.0 692.0,200.0 717.9,215.0 717.9,245.0" fill="none" stroke="#111827" stroke-width="3" stroke-linejoin="round"/><polygon points="717.9,215.0 692.0,200.0 692.0,170.0 717.9,155.0 743.9,170.0 743.9,200.0" fill="none" stroke="#111827" stroke-width="3" stroke-linejoin="round"/><polygon points="743.9,200.0 743.9,170.0 770.9,159.5 787.4,185.0 770.9,210.5" fill="none" stroke="#111827" stroke-width="3" stroke-linejoin="round"/><line x1="694.8" y1="255.1" x2="668.8" y2="240.1" stroke="#dc2626" stroke-width="3"/><line x1="666.0" y1="215.0" x2="666.0" y2="191.0" stroke="#111827" stroke-width="3"/><line x1="743.9" y1="170.0" x2="743.9" y2="146.0" stroke="#111827" stroke-width="3"/><line x1="614.0" y1="245.0" x2="590.0" y2="257.0" stroke="#111827" stroke-width="3"/><rect x="560.0" y="246.5" width="31.5" height="24.0" rx="6" fill="#fee2e2"/><text x="575.6192378864669" y="263.6" text-anchor="middle" font-size="15" font-weight="800" fill="#dc2626">HO</text><polyline points="770.9,159.5 796.4,144.5 821.9,159.5 847.4,144.5 872.9,159.5 898.4,144.5 923.9,159.5" fill="none" stroke="#2563eb" stroke-width="3"/><line x1="796.4" y1="144.5" x2="796.4" y2="123.5" stroke="#2563eb" stroke-width="3"/><line x1="898.4" y1="144.5" x2="898.4" y2="165.5" stroke="#2563eb" stroke-width="3"/><text x="640.0" y="235.0" text-anchor="middle" font-size="12" font-weight="800" fill="#94a3b8">A</text><text x="691.9615242270662" y="235.0" text-anchor="middle" font-size="12" font-weight="800" fill="#94a3b8">B</text><text x="717.9422863405995" y="190.0" text-anchor="middle" font-size="12" font-weight="800" fill="#94a3b8">C</text><text x="763.4230484541326" y="190.0" text-anchor="middle" font-size="12" font-weight="800" fill="#94a3b8">D</text><text x="700" y="138" text-anchor="middle" font-size="15" font-weight="800" fill="#111827">Cholesterol</text><text x="700" y="310" text-anchor="middle" font-size="12" font-weight="700" fill="#475569">membranes; raw material for hormones</text></g></g>
<g class="part" data-part="test" data-name="Testosterone" data-info="A ketone (C=O) on ring A with a C=C, and –OH on ring D. A male sex hormone." tabindex="0" role="button" aria-label="Testosterone"><g><animate attributeName="opacity" keyTimes="0.0000;0.4286;0.4500;1.0000" values="0;0;1;1" dur="14s" begin="st-play.begin+0s" fill="freeze"/><polygon points="140.0,590.0 114.0,575.0 114.0,545.0 140.0,530.0 166.0,545.0 166.0,575.0" fill="none" stroke="#111827" stroke-width="3" stroke-linejoin="round"/><polygon points="192.0,590.0 166.0,575.0 166.0,545.0 192.0,530.0 217.9,545.0 217.9,575.0" fill="none" stroke="#111827" stroke-width="3" stroke-linejoin="round"/><polygon points="217.9,545.0 192.0,530.0 192.0,500.0 217.9,485.0 243.9,500.0 243.9,530.0" fill="none" stroke="#111827" stroke-width="3" stroke-linejoin="round"/><polygon points="243.9,530.0 243.9,500.0 270.9,489.5 287.4,515.0 270.9,540.5" fill="none" stroke="#111827" stroke-width="3" stroke-linejoin="round"/><line x1="137.1" y1="585.0" x2="163.1" y2="570.0" stroke="#dc2626" stroke-width="3"/><line x1="166.0" y1="545.0" x2="166.0" y2="521.0" stroke="#111827" stroke-width="3"/><line x1="243.9" y1="500.0" x2="243.9" y2="476.0" stroke="#111827" stroke-width="3"/><line x1="114.0" y1="575.0" x2="90.0" y2="587.0" stroke="#111827" stroke-width="3"/><line x1="117.0" y1="581.0" x2="93.0" y2="593.0" stroke="#111827" stroke-width="3"/><rect x="70.5" y="576.5" width="21.0" height="24.0" rx="6" fill="#fee2e2"/><text x="81.01923788646684" y="593.6" text-anchor="middle" font-size="15" font-weight="800" fill="#dc2626">O</text><line x1="270.9" y1="489.5" x2="291.9" y2="474.5" stroke="#111827" stroke-width="3"/><rect x="290.4" y="455.0" width="31.5" height="24.0" rx="6" fill="#fee2e2"/><text x="306.02304845413266" y="472.1" text-anchor="middle" font-size="15" font-weight="800" fill="#dc2626">OH</text><text x="140.0" y="565.0" text-anchor="middle" font-size="12" font-weight="800" fill="#94a3b8">A</text><text x="191.96152422706632" y="565.0" text-anchor="middle" font-size="12" font-weight="800" fill="#94a3b8">B</text><text x="217.94228634059948" y="520.0" text-anchor="middle" font-size="12" font-weight="800" fill="#94a3b8">C</text><text x="263.42304845413264" y="520.0" text-anchor="middle" font-size="12" font-weight="800" fill="#94a3b8">D</text><text x="200" y="468" text-anchor="middle" font-size="15" font-weight="800" fill="#111827">Testosterone</text><text x="200" y="640" text-anchor="middle" font-size="12" font-weight="700" fill="#475569">male sex hormone</text></g></g>
<g class="part" data-part="oest" data-name="Oestradiol" data-info="Ring A is aromatic (benzene-like), with –OH on rings A and D. A female sex hormone." tabindex="0" role="button" aria-label="Oestradiol"><g><animate attributeName="opacity" keyTimes="0.0000;0.5714;0.5929;1.0000" values="0;0;1;1" dur="14s" begin="st-play.begin+0s" fill="freeze"/><polygon points="520.0,590.0 494.0,575.0 494.0,545.0 520.0,530.0 546.0,545.0 546.0,575.0" fill="none" stroke="#111827" stroke-width="3" stroke-linejoin="round"/><polygon points="572.0,590.0 546.0,575.0 546.0,545.0 572.0,530.0 597.9,545.0 597.9,575.0" fill="none" stroke="#111827" stroke-width="3" stroke-linejoin="round"/><polygon points="597.9,545.0 572.0,530.0 572.0,500.0 597.9,485.0 623.9,500.0 623.9,530.0" fill="none" stroke="#111827" stroke-width="3" stroke-linejoin="round"/><polygon points="623.9,530.0 623.9,500.0 650.9,489.5 667.4,515.0 650.9,540.5" fill="none" stroke="#111827" stroke-width="3" stroke-linejoin="round"/><circle cx="520" cy="560" r="16.5" fill="none" stroke="#dc2626" stroke-width="3"/><line x1="623.9" y1="500.0" x2="623.9" y2="476.0" stroke="#111827" stroke-width="3"/><line x1="494.0" y1="575.0" x2="470.0" y2="587.0" stroke="#111827" stroke-width="3"/><rect x="440.0" y="576.5" width="31.5" height="24.0" rx="6" fill="#fee2e2"/><text x="455.61923788646686" y="593.6" text-anchor="middle" font-size="15" font-weight="800" fill="#dc2626">HO</text><line x1="650.9" y1="489.5" x2="671.9" y2="474.5" stroke="#111827" stroke-width="3"/><rect x="670.4" y="455.0" width="31.5" height="24.0" rx="6" fill="#fee2e2"/><text x="686.0230484541327" y="472.1" text-anchor="middle" font-size="15" font-weight="800" fill="#dc2626">OH</text><text x="520.0" y="565.0" text-anchor="middle" font-size="12" font-weight="800" fill="#94a3b8"></text><text x="571.9615242270663" y="565.0" text-anchor="middle" font-size="12" font-weight="800" fill="#94a3b8">B</text><text x="597.9422863405995" y="520.0" text-anchor="middle" font-size="12" font-weight="800" fill="#94a3b8">C</text><text x="643.4230484541326" y="520.0" text-anchor="middle" font-size="12" font-weight="800" fill="#94a3b8">D</text><text x="580" y="468" text-anchor="middle" font-size="15" font-weight="800" fill="#111827">Oestradiol</text><text x="580" y="640" text-anchor="middle" font-size="12" font-weight="700" fill="#475569">female sex hormone (oestrogen)</text></g></g>
<g class="part" data-part="prog" data-name="Progesterone" data-info="Like testosterone on ring A, but an acetyl group (–COCH₃) on ring D. Maintains the uterus lining." tabindex="0" role="button" aria-label="Progesterone"><g><animate attributeName="opacity" keyTimes="0.0000;0.7143;0.7357;1.0000" values="0;0;1;1" dur="14s" begin="st-play.begin+0s" fill="freeze"/><polygon points="900.0,590.0 874.0,575.0 874.0,545.0 900.0,530.0 926.0,545.0 926.0,575.0" fill="none" stroke="#111827" stroke-width="3" stroke-linejoin="round"/><polygon points="952.0,590.0 926.0,575.0 926.0,545.0 952.0,530.0 977.9,545.0 977.9,575.0" fill="none" stroke="#111827" stroke-width="3" stroke-linejoin="round"/><polygon points="977.9,545.0 952.0,530.0 952.0,500.0 977.9,485.0 1003.9,500.0 1003.9,530.0" fill="none" stroke="#111827" stroke-width="3" stroke-linejoin="round"/><polygon points="1003.9,530.0 1003.9,500.0 1030.9,489.5 1047.4,515.0 1030.9,540.5" fill="none" stroke="#111827" stroke-width="3" stroke-linejoin="round"/><line x1="897.1" y1="585.0" x2="923.1" y2="570.0" stroke="#dc2626" stroke-width="3"/><line x1="926.0" y1="545.0" x2="926.0" y2="521.0" stroke="#111827" stroke-width="3"/><line x1="1003.9" y1="500.0" x2="1003.9" y2="476.0" stroke="#111827" stroke-width="3"/><line x1="874.0" y1="575.0" x2="850.0" y2="587.0" stroke="#111827" stroke-width="3"/><line x1="877.0" y1="581.0" x2="853.0" y2="593.0" stroke="#111827" stroke-width="3"/><rect x="830.5" y="576.5" width="21.0" height="24.0" rx="6" fill="#fee2e2"/><text x="841.0192378864668" y="593.6" text-anchor="middle" font-size="15" font-weight="800" fill="#dc2626">O</text><line x1="1030.9" y1="489.5" x2="1054.9" y2="476.0" stroke="#111827" stroke-width="3"/><line x1="1054.9" y1="476.0" x2="1078.9" y2="489.5" stroke="#111827" stroke-width="3"/><line x1="1051.9" y1="476.0" x2="1051.9" y2="455.0" stroke="#111827" stroke-width="3"/><line x1="1057.9" y1="476.0" x2="1057.9" y2="455.0" stroke="#111827" stroke-width="3"/><rect x="1042.9" y="432.5" width="24.0" height="22.5" rx="6" fill="#fee2e2"/><text x="1054.9230484541326" y="450.2" text-anchor="middle" font-size="15" font-weight="800" fill="#dc2626">O</text><text x="900.0" y="565.0" text-anchor="middle" font-size="12" font-weight="800" fill="#94a3b8">A</text><text x="951.9615242270662" y="565.0" text-anchor="middle" font-size="12" font-weight="800" fill="#94a3b8">B</text><text x="977.9422863405995" y="520.0" text-anchor="middle" font-size="12" font-weight="800" fill="#94a3b8">C</text><text x="1023.4230484541328" y="520.0" text-anchor="middle" font-size="12" font-weight="800" fill="#94a3b8">D</text><text x="960" y="468" text-anchor="middle" font-size="15" font-weight="800" fill="#111827">Progesterone</text><text x="960" y="640" text-anchor="middle" font-size="12" font-weight="700" fill="#475569">pregnancy hormone</text></g></g>
<g><animate attributeName="opacity" keyTimes="0.0000;0.4286;0.4500;1.0000" values="0;0;1;1" dur="14s" begin="st-play.begin+0s" fill="freeze"/><path d="M 640 330 C 640 380 400 400 260 450" fill="none" stroke="#475569" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#st-475569)"/><path d="M 700 330 L 620 450" stroke="#475569" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#st-475569)"/><path d="M 760 330 C 820 380 900 400 960 450" fill="none" stroke="#475569" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#st-475569)"/><text x="820" y="400" text-anchor="start" font-size="12" font-weight="800" fill="#475569">made from cholesterol</text></g>
<g><animate attributeName="opacity" keyTimes="0.0000;0.2500;0.2714;1.0000" values="0;0;1;1" dur="14s" begin="st-play.begin+0s" fill="freeze"/><text x="1080" y="130" text-anchor="middle" font-size="12" font-weight="800" fill="#dc2626">red = functional groups</text><text x="1080" y="150" text-anchor="middle" font-size="12" font-weight="800" fill="#dc2626">that differ</text></g>
