<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" class="vd-svg" role="img" aria-labelledby="tl-title tl-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="tl-play" data-vd-play-label="Play: the tree of life" data-vd-steps="[[0, &quot;All living things share one common ancestor, LUCA.&quot;], [1.5, &quot;Life split into three domains: Bacteria, Archaea and Eukarya (Woese, 1977, using ribosomal RNA).&quot;], [5, &quot;Archaea and Eukarya share a more recent common ancestor with each other than either does with Bacteria.&quot;], [8, &quot;Eukarya includes protists, plants, fungi and animals.&quot;], [11, &quot;Bacteria were taken in by early eukaryotic cells and became mitochondria and chloroplasts (endosymbiosis).&quot;]]" data-vd-dur="14">
<title id="tl-title">The three domains of life</title><desc id="tl-desc">A phylogenetic tree from LUCA to the three domains Bacteria, Archaea and Eukarya, with Archaea and Eukarya sharing a more recent common ancestor, and endosymbiosis arrows from bacteria to eukaryotes.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="620" fill="#ffffff"/>
<g aria-hidden="true"><animate id="tl-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<defs><marker id="tl-16a34a" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#16a34a"/></marker><marker id="tl-2563eb" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#2563eb"/></marker></defs>
<text class="head" x="30" y="34">The three domains of life</text><text class="note" x="30" y="56">Branch lengths are not to scale.</text>
<g class="part" data-part="luca" data-name="LUCA" data-info="The last universal common ancestor of all life, about 3.5–4 billion years ago." tabindex="0" role="button" aria-label="LUCA"><path d="M 550 560 L 550 470" stroke="#475569" stroke-width="10" stroke-linecap="round"/><circle cx="550" cy="560" r="12" fill="#475569"/><text x="570" y="574" font-size="15" font-weight="800">LUCA</text></g>
<g class="part" data-part="bac" data-name="Bacteria" data-info="Prokaryotes: no nucleus; peptidoglycan cell walls; 70S ribosomes. Includes the ancestors of mitochondria and chloroplasts." tabindex="0" role="button" aria-label="Bacteria"><path d="M 550 470 C 450 450 250 420 220 200" fill="none" stroke="#2563eb" stroke-width="8" stroke-linecap="round" stroke-dasharray="1500" stroke-dashoffset="0"><animate attributeName="stroke-dashoffset" keyTimes="0.0000;0.1071;0.2143;1.0000" values="1500;1500;0;0" dur="14s" begin="tl-play.begin+0s" fill="freeze"/></path><text x="220" y="186" text-anchor="middle" font-size="20" font-weight="800" fill="#1d4ed8">Bacteria</text></g>
<path d="M 550 470 C 600 440 680 420 700 360" fill="none" stroke="#475569" stroke-width="8" stroke-linecap="round" stroke-dasharray="1500" stroke-dashoffset="0"><animate attributeName="stroke-dashoffset" keyTimes="0.0000;0.1071;0.2143;1.0000" values="1500;1500;0;0" dur="14s" begin="tl-play.begin+0s" fill="freeze"/></path>
<g class="part" data-part="arc" data-name="Archaea" data-info="Prokaryotes, but with membranes, ribosomes and enzymes that differ from bacteria; many live in extreme places (hot springs, salt lakes)." tabindex="0" role="button" aria-label="Archaea"><path d="M 700 360 C 640 300 560 250 540 200" fill="none" stroke="#b45309" stroke-width="8" stroke-linecap="round" stroke-dasharray="1500" stroke-dashoffset="0"><animate attributeName="stroke-dashoffset" keyTimes="0.0000;0.2857;0.3929;1.0000" values="1500;1500;0;0" dur="14s" begin="tl-play.begin+0s" fill="freeze"/></path><text x="540" y="186" text-anchor="middle" font-size="20" font-weight="800" fill="#b45309">Archaea</text></g>
<g class="part" data-part="euk" data-name="Eukarya" data-info="Organisms whose cells have a nucleus and membrane-bound organelles: protists, plants, fungi and animals." tabindex="0" role="button" aria-label="Eukarya"><path d="M 700 360 C 760 300 860 250 880 200" fill="none" stroke="#16a34a" stroke-width="8" stroke-linecap="round" stroke-dasharray="1500" stroke-dashoffset="0"><animate attributeName="stroke-dashoffset" keyTimes="0.0000;0.2857;0.3929;1.0000" values="1500;1500;0;0" dur="14s" begin="tl-play.begin+0s" fill="freeze"/></path><text x="830" y="196" text-anchor="end" text-anchor="middle" font-size="20" font-weight="800" fill="#15803d">Eukarya</text></g>
<g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.3571;0.3786;1.0000" values="0;0;1;1" dur="14s" begin="tl-play.begin+0s" fill="freeze"/><circle cx="700" cy="360" r="11" fill="#fff" stroke="#475569" stroke-width="4"/><text x="716" y="390" font-size="13" font-weight="700" fill="#475569">common ancestor of Archaea and Eukarya</text></g>
<g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.5714;0.5929;1.0000" values="0;0;1;1" dur="14s" begin="tl-play.begin+0s" fill="freeze"/><path d="M 880 200 L 760 130" stroke="#16a34a" stroke-width="3"/><text x="760" y="116" text-anchor="middle" font-size="24">🦠</text><text x="760" y="88" text-anchor="middle" font-size="12" font-weight="700">protists</text></g>
<g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.5929;0.6143;1.0000" values="0;0;1;1" dur="14s" begin="tl-play.begin+0s" fill="freeze"/><path d="M 880 200 L 840 130" stroke="#16a34a" stroke-width="3"/><text x="840" y="116" text-anchor="middle" font-size="24">🌿</text><text x="840" y="88" text-anchor="middle" font-size="12" font-weight="700">plants</text></g>
<g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.6143;0.6357;1.0000" values="0;0;1;1" dur="14s" begin="tl-play.begin+0s" fill="freeze"/><path d="M 880 200 L 920 130" stroke="#16a34a" stroke-width="3"/><text x="920" y="116" text-anchor="middle" font-size="24">🍄</text><text x="920" y="88" text-anchor="middle" font-size="12" font-weight="700">fungi</text></g>
<g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.6357;0.6571;1.0000" values="0;0;1;1" dur="14s" begin="tl-play.begin+0s" fill="freeze"/><path d="M 880 200 L 1000 130" stroke="#16a34a" stroke-width="3"/><text x="1000" y="116" text-anchor="middle" font-size="24">🐘</text><text x="1000" y="88" text-anchor="middle" font-size="12" font-weight="700">animals</text></g>
<g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.2143;0.2357;1.0000" values="0;0;1;1" dur="14s" begin="tl-play.begin+0s" fill="freeze"/><text x="160" y="236" text-anchor="middle" font-size="22">🦠</text><text x="220" y="256" text-anchor="middle" font-size="12">e.g. E. coli, cyanobacteria</text><text x="610" y="256" text-anchor="middle" font-size="12">e.g. methanogens, halophiles</text></g>
<g class="part" data-part="endo" data-name="Endosymbiosis" data-info="Mitochondria (from aerobic bacteria) and chloroplasts (from cyanobacteria) were once free-living bacteria." tabindex="0" role="button" aria-label="Endosymbiosis"><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.7857;0.8071;1.0000" values="0;0;1;1" dur="14s" begin="tl-play.begin+0s" fill="freeze"/><path d="M 300 330 C 500 300 700 260 840 230" fill="none" stroke="#7c3aed" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#tl-2563eb)"/><text x="380" y="350" font-size="13" font-weight="700" fill="#6d28d9">endosymbiosis: mitochondria and chloroplasts</text></g></g>
<g font-size="13"><rect x="40" y="440" width="300" height="120" rx="10" fill="#f8fafc" stroke="#cbd5e1"/><text x="54" y="464" font-weight="700">Prokaryotes: Bacteria, Archaea</text><text x="54" y="488">no nucleus, 70S ribosomes, circular DNA</text><text x="54" y="520" font-weight="700">Eukaryotes: Eukarya</text><text x="54" y="544">nucleus, membrane-bound organelles, 80S</text></g>
</svg>