<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" class="vd-svg" role="img" aria-labelledby="sc-title sc-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="sc-play" data-vd-play-label="Play: race the impulses" data-vd-steps="[[0, &quot;Myelinated and unmyelinated axons compared.&quot;], [1, &quot;In a myelinated axon, depolarisation happens only at the nodes of Ranvier\u2026&quot;], [3, &quot;\u2026so the action potential \&quot;jumps\&quot; from node to node: saltatory conduction.&quot;], [7, &quot;In an unmyelinated axon the wave of depolarisation must travel along the whole membrane: much slower.&quot;], [11, &quot;Myelinated: up to about 100 m/s. Unmyelinated: about 1 m/s.&quot;]]" data-vd-dur="14">
<title id="sc-title">Saltatory conduction</title><desc id="sc-desc">A myelinated axon with Schwann cells and nodes of Ranvier where the action potential jumps from node to node, compared with continuous slow conduction along an unmyelinated axon.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1200" height="620" fill="#ffffff"/>
<g aria-hidden="true"><animate id="sc-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<text class="head" x="30" y="34">Saltatory conduction in a myelinated axon</text><text class="note" x="30" y="56">Pink: depolarised membrane (Na⁺ entering). Not to scale.</text>
<text x="100" y="120" text-anchor="start" font-size="15" font-weight="800" fill="#1d4ed8">Myelinated axon</text><text x="100" y="380" text-anchor="start" font-size="15" font-weight="800" fill="#b45309">Unmyelinated axon</text>
<g class="part" data-part="ax" data-name="Axon" data-info="Carries the impulse away from the cell body." tabindex="0" role="button" aria-label="Axon"><rect x="100" y="186" width="1000" height="28" fill="#fde68a" stroke="#a16207" stroke-width="2"/></g>
<g class="part" data-part="my" data-name="Myelin sheath" data-info="Layers of Schwann cell membrane wrapped round the axon: an electrical insulator. Ions cannot cross the membrane here." tabindex="0" role="button" aria-label="Myelin sheath"><rect x="152" y="160" width="166" height="80" rx="38" fill="#e0e7ff" stroke="#4338ca" stroke-width="2"/><rect x="158" y="166" width="154" height="68" rx="30" fill="none" stroke="#a5b4fc" stroke-width="1.2"/><rect x="162" y="169" width="146" height="62" rx="30" fill="none" stroke="#a5b4fc" stroke-width="1.2"/><rect x="166" y="172" width="138" height="56" rx="30" fill="none" stroke="#a5b4fc" stroke-width="1.2"/><rect x="342" y="160" width="166" height="80" rx="38" fill="#e0e7ff" stroke="#4338ca" stroke-width="2"/><rect x="348" y="166" width="154" height="68" rx="30" fill="none" stroke="#a5b4fc" stroke-width="1.2"/><rect x="352" y="169" width="146" height="62" rx="30" fill="none" stroke="#a5b4fc" stroke-width="1.2"/><rect x="356" y="172" width="138" height="56" rx="30" fill="none" stroke="#a5b4fc" stroke-width="1.2"/><rect x="532" y="160" width="166" height="80" rx="38" fill="#e0e7ff" stroke="#4338ca" stroke-width="2"/><rect x="538" y="166" width="154" height="68" rx="30" fill="none" stroke="#a5b4fc" stroke-width="1.2"/><rect x="542" y="169" width="146" height="62" rx="30" fill="none" stroke="#a5b4fc" stroke-width="1.2"/><rect x="546" y="172" width="138" height="56" rx="30" fill="none" stroke="#a5b4fc" stroke-width="1.2"/><rect x="722" y="160" width="166" height="80" rx="38" fill="#e0e7ff" stroke="#4338ca" stroke-width="2"/><rect x="728" y="166" width="154" height="68" rx="30" fill="none" stroke="#a5b4fc" stroke-width="1.2"/><rect x="732" y="169" width="146" height="62" rx="30" fill="none" stroke="#a5b4fc" stroke-width="1.2"/><rect x="736" y="172" width="138" height="56" rx="30" fill="none" stroke="#a5b4fc" stroke-width="1.2"/><rect x="912" y="160" width="166" height="80" rx="38" fill="#e0e7ff" stroke="#4338ca" stroke-width="2"/><rect x="918" y="166" width="154" height="68" rx="30" fill="none" stroke="#a5b4fc" stroke-width="1.2"/><rect x="922" y="169" width="146" height="62" rx="30" fill="none" stroke="#a5b4fc" stroke-width="1.2"/><rect x="926" y="172" width="138" height="56" rx="30" fill="none" stroke="#a5b4fc" stroke-width="1.2"/></g>
<g class="part" data-part="sw" data-name="Schwann cell" data-info="Makes the myelin sheath in the peripheral nervous system; its nucleus lies in the outer layer." tabindex="0" role="button" aria-label="Schwann cell"><ellipse cx="425.0" cy="166" rx="20" ry="8" fill="#6366f1"/></g>
<g class="part" data-part="nod" data-name="Node of Ranvier" data-info="A short gap in the myelin (about 1 µm) where voltage-gated Na⁺ and K⁺ channels are concentrated." tabindex="0" role="button" aria-label="Node of Ranvier"><rect x="130" y="184" width="20" height="32" fill="#fde68a"/><rect x="130" y="184" width="20" height="32" fill="#f43f5e" opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.0857;0.0929;0.1357;0.1571;1.0000" values="0;0;0.9;0.9;0;0" dur="14s" begin="sc-play.begin+0s" fill="freeze"/></rect><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.0857;0.1000;0.1286;0.1429;1.0000" values="0;0;1;1;0;0" dur="14s" begin="sc-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.0857;0.1143;1.0000" values="140 150;140 150;140 192;140 192" dur="14s" begin="sc-play.begin+0s" fill="freeze"/><circle r="5" fill="#2563eb"/><text x="0" y="-8" text-anchor="middle" font-size="9" font-weight="800" fill="#1d4ed8">Na⁺</text></g></g><path d="M 146 144 Q 235.0 80 324 144" fill="none" stroke="#f43f5e" stroke-width="3" stroke-dasharray="6 4" opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.1000;0.1071;0.1357;0.1500;1.0000" values="0;0;1;1;0;0" dur="14s" begin="sc-play.begin+0s" fill="freeze"/></path><rect x="320" y="184" width="20" height="32" fill="#fde68a"/><rect x="320" y="184" width="20" height="32" fill="#f43f5e" opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.1250;0.1321;0.1750;0.1964;1.0000" values="0;0;0.9;0.9;0;0" dur="14s" begin="sc-play.begin+0s" fill="freeze"/></rect><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.1250;0.1393;0.1679;0.1821;1.0000" values="0;0;1;1;0;0" dur="14s" begin="sc-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.1250;0.1536;1.0000" values="330 150;330 150;330 192;330 192" dur="14s" begin="sc-play.begin+0s" fill="freeze"/><circle r="5" fill="#2563eb"/><text x="0" y="-8" text-anchor="middle" font-size="9" font-weight="800" fill="#1d4ed8">Na⁺</text></g></g><path d="M 336 144 Q 425.0 80 514 144" fill="none" stroke="#f43f5e" stroke-width="3" stroke-dasharray="6 4" opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.1393;0.1464;0.1750;0.1893;1.0000" values="0;0;1;1;0;0" dur="14s" begin="sc-play.begin+0s" fill="freeze"/></path><rect x="510" y="184" width="20" height="32" fill="#fde68a"/><rect x="510" y="184" width="20" height="32" fill="#f43f5e" opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.1643;0.1714;0.2143;0.2357;1.0000" values="0;0;0.9;0.9;0;0" dur="14s" begin="sc-play.begin+0s" fill="freeze"/></rect><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.1643;0.1786;0.2071;0.2214;1.0000" values="0;0;1;1;0;0" dur="14s" begin="sc-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.1643;0.1929;1.0000" values="520 150;520 150;520 192;520 192" dur="14s" begin="sc-play.begin+0s" fill="freeze"/><circle r="5" fill="#2563eb"/><text x="0" y="-8" text-anchor="middle" font-size="9" font-weight="800" fill="#1d4ed8">Na⁺</text></g></g><path d="M 526 144 Q 615.0 80 704 144" fill="none" stroke="#f43f5e" stroke-width="3" stroke-dasharray="6 4" opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.1786;0.1857;0.2143;0.2286;1.0000" values="0;0;1;1;0;0" dur="14s" begin="sc-play.begin+0s" fill="freeze"/></path><rect x="700" y="184" width="20" height="32" fill="#fde68a"/><rect x="700" y="184" width="20" height="32" fill="#f43f5e" opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.2036;0.2107;0.2536;0.2750;1.0000" values="0;0;0.9;0.9;0;0" dur="14s" begin="sc-play.begin+0s" fill="freeze"/></rect><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.2036;0.2179;0.2464;0.2607;1.0000" values="0;0;1;1;0;0" dur="14s" begin="sc-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.2036;0.2321;1.0000" values="710 150;710 150;710 192;710 192" dur="14s" begin="sc-play.begin+0s" fill="freeze"/><circle r="5" fill="#2563eb"/><text x="0" y="-8" text-anchor="middle" font-size="9" font-weight="800" fill="#1d4ed8">Na⁺</text></g></g><path d="M 716 144 Q 805.0 80 894 144" fill="none" stroke="#f43f5e" stroke-width="3" stroke-dasharray="6 4" opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.2179;0.2250;0.2536;0.2679;1.0000" values="0;0;1;1;0;0" dur="14s" begin="sc-play.begin+0s" fill="freeze"/></path><rect x="890" y="184" width="20" height="32" fill="#fde68a"/><rect x="890" y="184" width="20" height="32" fill="#f43f5e" opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.2429;0.2500;0.2929;0.3143;1.0000" values="0;0;0.9;0.9;0;0" dur="14s" begin="sc-play.begin+0s" fill="freeze"/></rect><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.2429;0.2571;0.2857;0.3000;1.0000" values="0;0;1;1;0;0" dur="14s" begin="sc-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.2429;0.2714;1.0000" values="900 150;900 150;900 192;900 192" dur="14s" begin="sc-play.begin+0s" fill="freeze"/><circle r="5" fill="#2563eb"/><text x="0" y="-8" text-anchor="middle" font-size="9" font-weight="800" fill="#1d4ed8">Na⁺</text></g></g><path d="M 906 144 Q 995.0 80 1084 144" fill="none" stroke="#f43f5e" stroke-width="3" stroke-dasharray="6 4" opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.2571;0.2643;0.2929;0.3071;1.0000" values="0;0;1;1;0;0" dur="14s" begin="sc-play.begin+0s" fill="freeze"/></path><rect x="1080" y="184" width="20" height="32" fill="#fde68a"/><rect x="1080" y="184" width="20" height="32" fill="#f43f5e" opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.2821;0.2893;0.3321;0.3536;1.0000" values="0;0;0.9;0.9;0;0" dur="14s" begin="sc-play.begin+0s" fill="freeze"/></rect><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.2821;0.2964;0.3250;0.3393;1.0000" values="0;0;1;1;0;0" dur="14s" begin="sc-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.2821;0.3107;1.0000" values="1090 150;1090 150;1090 192;1090 192" dur="14s" begin="sc-play.begin+0s" fill="freeze"/><circle r="5" fill="#2563eb"/><text x="0" y="-8" text-anchor="middle" font-size="9" font-weight="800" fill="#1d4ed8">Na⁺</text></g></g></g>
<g class="part" data-part="un" data-name="Unmyelinated axon" data-info="The impulse travels as a continuous wave of depolarisation along every part of the membrane: much slower." tabindex="0" role="button" aria-label="Unmyelinated axon"><rect x="100" y="436" width="1000" height="28" fill="#fde68a" stroke="#a16207" stroke-width="2"/><rect x="100" y="436" width="60" height="28" fill="#f43f5e" opacity=".9"><animate attributeName="x" keyTimes="0.0000;0.0714;0.9286;1.0000" values="100;100;1040;1040" dur="14s" begin="sc-play.begin+0s" fill="freeze"/></rect></g>
<g><animate attributeName="opacity" keyTimes="0.0000;0.3000;0.3214;1.0000" values="0;0;1;1" dur="14s" begin="sc-play.begin+0s" fill="freeze"/><text x="1100" y="270" text-anchor="end" font-size="13" font-weight="800" fill="#1d4ed8">arrives after ~3 s</text></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.3571;0.3786;0.8929;0.9143;1.0000" values="0;0;1;1;0;0" dur="14s" begin="sc-play.begin+0s" fill="freeze"/><text x="1100" y="506" text-anchor="end" font-size="13" font-weight="800" fill="#b45309">still travelling…</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.9286;0.9500;1.0000" values="0;0;1;1" dur="14s" begin="sc-play.begin+0s" fill="freeze"/><text x="1100" y="506" text-anchor="end" font-size="13" font-weight="800" fill="#b45309">arrives last</text></g>
<g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.7857;0.8071;1.0000" values="0;0;1;1" dur="14s" begin="sc-play.begin+0s" fill="freeze"/><rect x="300" y="530" width="600" height="70" rx="14" fill="#f8fafc" stroke="#cbd5e1"/><text x="600" y="558" text-anchor="middle" font-size="14" font-weight="800" fill="#111827">myelinated: up to ~100 m/s · unmyelinated: ~0.5–2 m/s</text><text x="600" y="582" text-anchor="middle" font-size="12" font-weight="600" fill="#475569">Saltatory conduction is faster and uses less ATP (fewer ions to pump back).</text></g>
<g class="labels"><g class="lbl" data-for="my"><polyline points="240.0,270.0 240.0,240.0"/><circle cx="240.0" cy="240.0" r="2.6"/><text x="240" y="290" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="4">Myelin sheath</text></g><g class="lbl" data-for="nod"><polyline points="520.0,300.0 520.0,216.0"/><circle cx="520.0" cy="216.0" r="2.6"/><text x="520" y="320" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="4">Node of Ranvier</text></g><g class="lbl" data-for="sw"><polyline points="540.0,84.0 425.0,160.0"/><circle cx="425.0" cy="160.0" r="2.6"/><text x="545.0" y="90" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="4">Schwann cell nucleus</text></g></g>
</svg>