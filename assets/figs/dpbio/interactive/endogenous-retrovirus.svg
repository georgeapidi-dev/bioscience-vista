<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 700" class="vd-svg" role="img" aria-labelledby="er-title er-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="er-play" data-vd-play-label="Play: virus to genome" data-vd-steps="[[0, &quot;Endogenous retroviruses: viral DNA in our own genome.&quot;], [1, &quot;A retrovirus infects a germ-line cell (one that will make eggs or sperm).&quot;], [3.5, &quot;Reverse transcriptase copies the viral RNA into DNA.&quot;], [5.5, &quot;Integrase inserts it into a host chromosome: a provirus.&quot;], [8, &quot;The egg or sperm passes the provirus to the next generation, into every cell.&quot;], [11, &quot;Over many generations mutations inactivate it; it stays as an ERV.&quot;], [13.5, &quot;Shared ERVs at the same place in two species point to a common ancestor.&quot;]]" data-vd-dur="16">
<title id="er-title">Endogenous retroviruses</title><desc id="er-desc">A retrovirus infects a germ-line cell, its RNA is reverse-transcribed to DNA and integrated into a chromosome; the provirus is inherited, gradually inactivated by mutation, and shared ERVs are evidence of common ancestry.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1220" height="700" fill="#ffffff"/>
<g aria-hidden="true"><animate id="er-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<defs><marker id="er-475569" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="7.2" refY="8.0" orient="auto"><path d="M0,0 L16,8.0 L0,16 z" fill="#475569"/></marker></defs>
<text class="head" x="30" y="34">How endogenous retroviruses (ERVs) entered our genome</text><text class="note" x="30" y="56">Simplified.</text>
<circle cx="200" cy="270" r="150" fill="#fdf2f8" stroke="#be185d" stroke-width="4"/><text x="200" y="446" text-anchor="middle" font-size="13" font-weight="800" fill="#9d174d">germ-line cell</text><circle cx="180" cy="300" r="60" fill="#e9d5ff" stroke="#7e22ce" stroke-width="3"/><text x="180" y="380" text-anchor="middle" font-size="11" font-weight="800" fill="#6b21a8">nucleus</text>
<g class="part" data-part="rv" data-name="Retrovirus" data-info="An RNA virus with reverse transcriptase and integrase." tabindex="0" role="button" aria-label="Retrovirus"><g transform="translate(330 110)"><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.0625;0.1875;1.0000" values="330 110;330 110;250 200;250 200" dur="16s" begin="er-play.begin+0s" fill="freeze"/><g><animate attributeName="opacity" keyTimes="0.0000;0.1875;0.2125;1.0000" values="1;1;0;0" dur="16s" begin="er-play.begin+0s" fill="freeze"/><circle r="26" fill="#ccfbf1" stroke="#0f766e" stroke-width="4"/><line x1="26" y1="0" x2="36" y2="0" stroke="#0f766e" stroke-width="4"/><line x1="18" y1="18" x2="25" y2="25" stroke="#0f766e" stroke-width="4"/><line x1="0" y1="26" x2="0" y2="36" stroke="#0f766e" stroke-width="4"/><line x1="-18" y1="18" x2="-25" y2="25" stroke="#0f766e" stroke-width="4"/><line x1="-26" y1="0" x2="-36" y2="0" stroke="#0f766e" stroke-width="4"/><line x1="-18" y1="-18" x2="-25" y2="-25" stroke="#0f766e" stroke-width="4"/><line x1="-0" y1="-26" x2="-0" y2="-36" stroke="#0f766e" stroke-width="4"/><line x1="18" y1="-18" x2="25" y2="-25" stroke="#0f766e" stroke-width="4"/><polyline points="-12.0,-10.0 -12.3,-8.3 -12.3,-6.9 -11.9,-6.0 -11.0,-5.8 -9.6,-6.1 -8.0,-6.7 -6.4,-7.3 -5.0,-7.6 -4.1,-7.3 -3.7,-6.4 -3.7,-5.0 -4.0,-3.3 -4.3,-1.6 -4.3,-0.2 -3.9,0.6 -3.0,0.9 -1.6,0.6 -0.0,0.0 1.6,-0.6 3.0,-0.9 3.9,-0.6 4.3,0.2 4.3,1.6 4.0,3.3 3.7,5.0 3.7,6.4 4.1,7.3 5.0,7.6 6.4,7.3 8.0,6.7 9.6,6.1 11.0,5.8 11.9,6.0 12.3,6.9 12.3,8.3 12.0,10.0" fill="none" stroke="#dc2626" stroke-width="2.5" stroke-linecap="round"/></g></g><text x="360" y="84" text-anchor="middle" font-size="12" font-weight="800" fill="#0f766e">retrovirus</text></g>
<g class="part" data-part="rt" data-name="Reverse transcription" data-info="Viral RNA is copied into double-stranded DNA." tabindex="0" role="button" aria-label="Reverse transcription"><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.2125;0.2312;0.3125;0.3312;1.0000" values="0;0;1;1;0;0" dur="16s" begin="er-play.begin+0s" fill="freeze"/><polyline points="220.0,200.0 221.2,202.4 222.5,204.2 224.0,205.1 225.8,205.0 227.8,204.0 230.0,202.5 232.2,201.0 234.2,200.0 236.0,199.9 237.5,200.8 238.8,202.6 240.0,205.0 241.2,207.4 242.5,209.2 244.0,210.1 245.8,210.0 247.8,209.0 250.0,207.5 252.2,206.0 254.2,205.0 256.0,204.9 257.5,205.8 258.8,207.6 260.0,210.0 261.2,212.4 262.5,214.2 264.0,215.1 265.8,215.0 267.8,214.0 270.0,212.5 272.2,211.0 274.2,210.0 276.0,209.9 277.5,210.8 278.8,212.6 280.0,215.0 281.2,217.4 282.5,219.2 284.0,220.1 285.8,220.0 287.8,219.0 290.0,217.5 292.2,216.0 294.2,215.0 296.0,214.9 297.5,215.8 298.8,217.6 300.0,220.0" fill="none" stroke="#dc2626" stroke-width="3" stroke-linecap="round"/><text x="270" y="182" text-anchor="middle" font-size="10" font-weight="800" fill="#b91c1c">RNA</text></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.2625;0.2812;0.3750;0.3937;1.0000" values="0;0;1;1;0;0" dur="16s" begin="er-play.begin+0s" fill="freeze"/><path d="M 220 210 L 300 230" stroke="#2563eb" stroke-width="5"/><path d="M 220 216 L 300 236" stroke="#60a5fa" stroke-width="5"/><text x="270" y="256" text-anchor="middle" font-size="10" font-weight="800" fill="#1d4ed8">viral DNA</text></g></g>
<g class="part" data-part="int" data-name="Integration (provirus)" data-info="Integrase inserts the viral DNA into a host chromosome." tabindex="0" role="button" aria-label="Integration (provirus)"><rect x="130" y="290" width="100" height="18" rx="9" fill="#a78bfa"/><rect x="170" y="290" width="0" height="18" fill="#2563eb"><animate attributeName="width" keyTimes="0.0000;0.3438;0.4062;1.0000" values="0;0;22;22" dur="16s" begin="er-play.begin+0s" fill="freeze"/></rect><g><animate attributeName="opacity" keyTimes="0.0000;0.4062;0.4250;1.0000" values="0;0;1;1" dur="16s" begin="er-play.begin+0s" fill="freeze"/><line x1="181" y1="299" x2="330" y2="440" stroke="#475569" stroke-width="1.5"/><circle cx="181" cy="299" r="3" fill="#475569"/><text x="336" y="444" text-anchor="middle" font-size="12" font-weight="800" fill="#1d4ed8">provirus in a chromosome</text></g></g>
<g class="part" data-part="germ" data-name="Germ line" data-info="If the infected cell makes eggs or sperm, the provirus can be passed to offspring, in every cell of their body." tabindex="0" role="button" aria-label="Germ line"><g><animate attributeName="opacity" keyTimes="0.0000;0.5000;0.5188;1.0000" values="0;0;1;1" dur="16s" begin="er-play.begin+0s" fill="freeze"/><path d="M 360 270 L 440 270" stroke="#475569" stroke-width="4" marker-end="url(#er-475569)"/><text x="400" y="256" text-anchor="middle" font-size="11" font-weight="800" fill="#475569">egg/sperm</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.5000;0.5188;1.0000" values="0;0;1;1" dur="16s" begin="er-play.begin+0s" fill="freeze"/><g transform="translate(500 280) scale(1.3)"><circle cy="-34" r="14" fill="#fcd34d" stroke="#92400e" stroke-width="2"/><path d="M -18 0 Q -18 -20 0 -20 Q 18 -20 18 0 L 18 30 L -18 30 Z" fill="#93c5fd" stroke="#1d4ed8" stroke-width="2"/></g><rect x="460" y="330" width="80" height="14" rx="7" fill="#a78bfa"/><rect x="494" y="330" width="16" height="14" fill="#2563eb"/><text x="500" y="366" text-anchor="middle" font-size="11" font-weight="800" fill="#334155">generation 1</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.5250;0.5438;1.0000" values="0;0;1;1" dur="16s" begin="er-play.begin+0s" fill="freeze"/><path d="M 540 270 L 588 270" stroke="#475569" stroke-width="3" marker-end="url(#er-475569)"/></g><g><animate attributeName="opacity" keyTimes="0.0000;0.5500;0.5688;1.0000" values="0;0;1;1" dur="16s" begin="er-play.begin+0s" fill="freeze"/><g transform="translate(630 280) scale(1.3)"><circle cy="-34" r="14" fill="#fcd34d" stroke="#92400e" stroke-width="2"/><path d="M -18 0 Q -18 -20 0 -20 Q 18 -20 18 0 L 18 30 L -18 30 Z" fill="#93c5fd" stroke="#1d4ed8" stroke-width="2"/></g><rect x="590" y="330" width="80" height="14" rx="7" fill="#a78bfa"/><rect x="624" y="330" width="16" height="14" fill="#3b82f6"/><line x1="626" y1="330" x2="626" y2="344" stroke="#dc2626" stroke-width="2"/><text x="630" y="366" text-anchor="middle" font-size="11" font-weight="800" fill="#334155">generation 2</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.5750;0.5938;1.0000" values="0;0;1;1" dur="16s" begin="er-play.begin+0s" fill="freeze"/><path d="M 670 270 L 718 270" stroke="#475569" stroke-width="3" marker-end="url(#er-475569)"/></g><g><animate attributeName="opacity" keyTimes="0.0000;0.6000;0.6188;1.0000" values="0;0;1;1" dur="16s" begin="er-play.begin+0s" fill="freeze"/><g transform="translate(760 280) scale(1.3)"><circle cy="-34" r="14" fill="#fcd34d" stroke="#92400e" stroke-width="2"/><path d="M -18 0 Q -18 -20 0 -20 Q 18 -20 18 0 L 18 30 L -18 30 Z" fill="#93c5fd" stroke="#1d4ed8" stroke-width="2"/></g><rect x="720" y="330" width="80" height="14" rx="7" fill="#a78bfa"/><rect x="754" y="330" width="16" height="14" fill="#93c5fd"/><line x1="756" y1="330" x2="756" y2="344" stroke="#dc2626" stroke-width="2"/><line x1="760" y1="330" x2="760" y2="344" stroke="#dc2626" stroke-width="2"/><text x="760" y="366" text-anchor="middle" font-size="11" font-weight="800" fill="#334155">generation …</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.6250;0.6438;1.0000" values="0;0;1;1" dur="16s" begin="er-play.begin+0s" fill="freeze"/><path d="M 800 270 L 848 270" stroke="#475569" stroke-width="3" marker-end="url(#er-475569)"/></g><g><animate attributeName="opacity" keyTimes="0.0000;0.6500;0.6688;1.0000" values="0;0;1;1" dur="16s" begin="er-play.begin+0s" fill="freeze"/><g transform="translate(890 280) scale(1.3)"><circle cy="-34" r="14" fill="#fcd34d" stroke="#92400e" stroke-width="2"/><path d="M -18 0 Q -18 -20 0 -20 Q 18 -20 18 0 L 18 30 L -18 30 Z" fill="#93c5fd" stroke="#1d4ed8" stroke-width="2"/></g><rect x="850" y="330" width="80" height="14" rx="7" fill="#a78bfa"/><rect x="884" y="330" width="16" height="14" fill="#cbd5e1"/><line x1="886" y1="330" x2="886" y2="344" stroke="#dc2626" stroke-width="2"/><line x1="890" y1="330" x2="890" y2="344" stroke="#dc2626" stroke-width="2"/><line x1="894" y1="330" x2="894" y2="344" stroke="#dc2626" stroke-width="2"/><text x="890" y="366" text-anchor="middle" font-size="11" font-weight="800" fill="#334155">generation many</text></g></g>
<g class="part" data-part="inact" data-name="Inactivation over generations" data-info="Mutations accumulate and most ERVs can no longer make viruses. About 8% of the human genome is ERV sequence." tabindex="0" role="button" aria-label="Inactivation over generations"><g><animate attributeName="opacity" keyTimes="0.0000;0.6875;0.7063;1.0000" values="0;0;1;1" dur="16s" begin="er-play.begin+0s" fill="freeze"/><rect x="460" y="390" width="500" height="64" rx="12" fill="#f1f5f9" stroke="#cbd5e1"/><text x="710" y="416" text-anchor="middle" font-size="13" font-weight="800" fill="#334155">mutations (red lines) inactivate the provirus</text><text x="710" y="438" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">about 8% of the human genome is ERV sequence</text></g></g>
<g class="part" data-part="evid" data-name="Evidence of common ancestry" data-info="Humans and chimpanzees share many ERVs at exactly the same positions: best explained by a common ancestor that was infected." tabindex="0" role="button" aria-label="Evidence of common ancestry"><g><animate attributeName="opacity" keyTimes="0.0000;0.8438;0.8625;1.0000" values="0;0;1;1" dur="16s" begin="er-play.begin+0s" fill="freeze"/><rect x="40" y="480" width="1140" height="190" rx="16" fill="#fff7ed" stroke="#fdba74"/><text x="610" y="508" text-anchor="middle" font-size="15" font-weight="800" fill="#9a3412">Evidence for evolution: the same ERV at the same place</text><text x="200" y="552" text-anchor="end" font-size="13" font-weight="800" fill="#111827">human</text><rect x="220" y="540" width="700" height="16" rx="8" fill="#ddd6fe"/><rect x="560" y="540" width="30" height="16" fill="#2563eb"/><text x="200" y="582" text-anchor="end" font-size="13" font-weight="800" fill="#111827">chimpanzee</text><rect x="220" y="570" width="700" height="16" rx="8" fill="#ddd6fe"/><rect x="560" y="570" width="30" height="16" fill="#2563eb"/><text x="200" y="612" text-anchor="end" font-size="13" font-weight="800" fill="#111827">gorilla</text><rect x="220" y="600" width="700" height="16" rx="8" fill="#ddd6fe"/><rect x="560" y="600" width="30" height="16" fill="#2563eb"/><text x="200" y="642" text-anchor="end" font-size="13" font-weight="800" fill="#111827">orang-utan</text><rect x="220" y="630" width="700" height="16" rx="8" fill="#ddd6fe"/><text x="940" y="556" text-anchor="start" font-size="12" font-weight="700" fill="#7c2d12">Insertion sites are effectively random,</text><text x="940" y="576" text-anchor="start" font-size="12" font-weight="700" fill="#7c2d12">so the same ERV in the same place</text><text x="940" y="596" text-anchor="start" font-size="12" font-weight="700" fill="#7c2d12">in several species means they</text><text x="940" y="616" text-anchor="start" font-size="12" font-weight="700" fill="#7c2d12">inherited it from a common ancestor.</text><text x="940" y="646" text-anchor="start" font-size="11" font-weight="600" fill="#9a3412">(illustrative pattern)</text></g></g>
</svg>