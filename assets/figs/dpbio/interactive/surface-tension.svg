<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" class="vd-svg" role="img" aria-labelledby="st-title st-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="st-play" data-vd-play-label="Play: forces on molecules" data-vd-steps="[[0, &quot;Why the surface of water behaves like a skin.&quot;], [1, &quot;Inside the liquid a molecule is pulled equally in every direction.&quot;], [4, &quot;At the surface there is no water above, so the pull is sideways and downwards only.&quot;], [7.5, &quot;Surface tension: the surface acts like an elastic skin that supports a pond skater.&quot;]]" data-vd-dur="13">
<title id="st-title">Surface tension</title><desc id="st-desc">Water molecules inside the liquid are pulled equally in all directions while those at the surface are pulled only sideways and downwards, giving surface tension that supports a pond skater.</desc>
