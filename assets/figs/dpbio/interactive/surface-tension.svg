<g class="part" data-part="inside" data-name="A molecule inside the liquid" data-info="Pulled equally in every direction by hydrogen bonds to its neighbours: no overall force." tabindex="0" role="button" aria-label="A molecule inside the liquid"><circle cx="370" cy="308" r="13" fill="#374151"/><g><animate attributeName="opacity" keyTimes="0.0000;0.0769;0.1000;1.0000" values="0;0;1;1" dur="13s" begin="st-play.begin+0s" fill="freeze"/><line x1="370" y1="308" x2="404.0" y2="308.0" stroke="#374151" stroke-width="3" marker-end="url(#st-374151)"/><line x1="370" y1="308" x2="394.0" y2="332.0" stroke="#374151" stroke-width="3" marker-end="url(#st-374151)"/><line x1="370" y1="308" x2="370.0" y2="342.0" stroke="#374151" stroke-width="3" marker-end="url(#st-374151)"/><line x1="370" y1="308" x2="346.0" y2="332.0" stroke="#374151" stroke-width="3" marker-end="url(#st-374151)"/><line x1="370" y1="308" x2="336.0" y2="308.0" stroke="#374151" stroke-width="3" marker-end="url(#st-374151)"/><line x1="370" y1="308" x2="346.0" y2="284.0" stroke="#374151" stroke-width="3" marker-end="url(#st-374151)"/><line x1="370" y1="308" x2="370.0" y2="274.0" stroke="#374151" stroke-width="3" marker-end="url(#st-374151)"/><line x1="370" y1="308" x2="394.0" y2="284.0" stroke="#374151" stroke-width="3" marker-end="url(#st-374151)"/></g><g><animate attributeName="opacity" keyTimes="0.0000;0.0769;0.1000;1.0000" values="0;0;1;1" dur="13s" begin="st-play.begin+0s" fill="freeze"/><text x="290" y="455" text-anchor="middle" font-size="14" font-weight="700" fill="#111827">inside the liquid a molecule is pulled</text><text x="290" y="475" text-anchor="middle" font-size="14" font-weight="700" fill="#111827">equally in every direction</text></g></g>
<g class="part" data-part="surf" data-name="A molecule at the surface" data-info="No water above it, so it is pulled only sideways and downwards: the surface molecules are held tightly together." tabindex="0" role="button" aria-label="A molecule at the surface"><circle cx="170" cy="182" r="13" fill="#c0392b"/><g><animate attributeName="opacity" keyTimes="0.0000;0.3077;0.3308;1.0000" values="0;0;1;1" dur="13s" begin="st-play.begin+0s" fill="freeze"/><line x1="170" y1="182" x2="204.0" y2="182.0" stroke="#c0392b" stroke-width="3" marker-end="url(#st-c0392b)"/><line x1="170" y1="182" x2="136.0" y2="182.0" stroke="#c0392b" stroke-width="3" marker-end="url(#st-c0392b)"/><line x1="170" y1="182" x2="194.0" y2="206.0" stroke="#c0392b" stroke-width="3" marker-end="url(#st-c0392b)"/><line x1="170" y1="182" x2="170.0" y2="216.0" stroke="#c0392b" stroke-width="3" marker-end="url(#st-c0392b)"/><line x1="170" y1="182" x2="146.0" y2="206.0" stroke="#c0392b" stroke-width="3" marker-end="url(#st-c0392b)"/></g><g><animate attributeName="opacity" keyTimes="0.0000;0.3077;0.3308;1.0000" values="0;0;1;1" dur="13s" begin="st-play.begin+0s" fill="freeze"/><text x="290" y="110" text-anchor="middle" font-size="14" font-weight="800" fill="#c0392b">at the surface there is no water above,</text><text x="290" y="130" text-anchor="middle" font-size="14" font-weight="800" fill="#c0392b">so the pull is sideways and downwards only</text></g></g>
