<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 580" class="vd-svg" role="img" aria-labelledby="bt-title bt-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="bt-play" data-vd-play-label="Play: trace the causes" data-vd-steps="[[0, &quot;Why is biodiversity being lost?&quot;], [1, &quot;The overarching cause: human population growth.&quot;], [3, &quot;It drives six specific causes...&quot;], [10, &quot;...and together they shrink populations and cause extinctions.&quot;]]" data-vd-dur="14">
<title id="bt-title">Causes of the biodiversity crisis</title><desc id="bt-desc">Human population growth at the centre drives over-exploitation, urbanisation, habitat loss, pollution, invasive species and climate change, which together cause biodiversity loss.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="580" fill="#ffffff"/>
<g aria-hidden="true"><animate id="bt-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<defs><marker id="bt-b91c1c" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="6.3" refY="7.0" orient="auto"><path d="M0,0 L14,7.0 L0,14 z" fill="#b91c1c"/></marker></defs>
<text class="head" x="30" y="34">Causes of the biodiversity crisis</text><text class="note" x="30" y="56">From the lesson notes.</text>
<g class="part" data-part="pop" data-name="Human population growth" data-info="The overarching cause: more demand for land, food, water and resources." tabindex="0" role="button" aria-label="Human population growth"><g><animate attributeName="opacity" keyTimes="0.0000;0.0714;0.0929;1.0000" values="0;0;1;1" dur="14s" begin="bt-play.begin+0s" fill="freeze"/><circle cx="360" cy="320" r="80" fill="#fde68a" stroke="#a16207" stroke-width="3"/><g transform="translate(324 350) scale(0.6 0.36)"><circle cx="0" cy="-58" r="11" fill="#f59e0b" stroke="#7c2d12" stroke-width="1.5"/><path d="M -13 -44 L 13 -44 L 16 -6 L 8 -6 L 6 24 L -6 24 L -8 -6 L -16 -6 Z" fill="#f59e0b" stroke="#7c2d12" stroke-width="1.5"/></g><g transform="translate(348 350) scale(0.6 0.42)"><circle cx="0" cy="-58" r="11" fill="#f59e0b" stroke="#7c2d12" stroke-width="1.5"/><path d="M -13 -44 L 13 -44 L 16 -6 L 8 -6 L 6 24 L -6 24 L -8 -6 L -16 -6 Z" fill="#f59e0b" stroke="#7c2d12" stroke-width="1.5"/></g><g transform="translate(372 350) scale(0.6 0.36)"><circle cx="0" cy="-58" r="11" fill="#f59e0b" stroke="#7c2d12" stroke-width="1.5"/><path d="M -13 -44 L 13 -44 L 16 -6 L 8 -6 L 6 24 L -6 24 L -8 -6 L -16 -6 Z" fill="#f59e0b" stroke="#7c2d12" stroke-width="1.5"/></g><g transform="translate(396 350) scale(0.6 0.42)"><circle cx="0" cy="-58" r="11" fill="#f59e0b" stroke="#7c2d12" stroke-width="1.5"/><path d="M -13 -44 L 13 -44 L 16 -6 L 8 -6 L 6 24 L -6 24 L -8 -6 L -16 -6 Z" fill="#f59e0b" stroke="#7c2d12" stroke-width="1.5"/></g><text x="360" y="290" text-anchor="middle" font-size="14" font-weight="800" fill="#713f12">human</text><text x="360" y="308" text-anchor="middle" font-size="14" font-weight="800" fill="#713f12">population</text></g></g>
<g class="part" data-part="causes" data-name="Specific causes" data-info="Over-exploitation (bushmeat, overfishing, ivory poaching); urbanisation; deforestation and land clearance for farming; pollution (pesticides, plastics, eutrophication); invasive species, pests and diseases spread by global transport; climate change." tabindex="0" role="button" aria-label="Specific causes"><g><animate attributeName="opacity" keyTimes="0.0000;0.2143;0.2357;1.0000" values="0;0;1;1" dur="14s" begin="bt-play.begin+0s" fill="freeze"/><line x1="360" y1="236" x2="360" y2="164" stroke="#b91c1c" stroke-width="2.5" marker-end="url(#bt-b91c1c)"/><rect x="270" y="100" width="180" height="60" rx="12" fill="#fff" stroke="#b91c1c" stroke-width="2"/><text x="360.0" y="124.0" text-anchor="middle" font-size="13" font-weight="800" fill="#991b1b">over-exploitation</text><text x="360.0" y="144.0" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">bushmeat, overfishing, ivory</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.2857;0.3071;1.0000" values="0;0;1;1" dur="14s" begin="bt-play.begin+0s" fill="freeze"/><line x1="433" y1="278" x2="481" y2="242" stroke="#b91c1c" stroke-width="2.5" marker-end="url(#bt-b91c1c)"/><rect x="452" y="195" width="180" height="60" rx="12" fill="#fff" stroke="#b91c1c" stroke-width="2"/><text x="541.8653347947321" y="219.0" text-anchor="middle" font-size="13" font-weight="800" fill="#991b1b">urbanisation</text><text x="541.8653347947321" y="239.0" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">towns and roads</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.3571;0.3786;1.0000" values="0;0;1;1" dur="14s" begin="bt-play.begin+0s" fill="freeze"/><line x1="433" y1="362" x2="481" y2="398" stroke="#b91c1c" stroke-width="2.5" marker-end="url(#bt-b91c1c)"/><rect x="452" y="385" width="180" height="60" rx="12" fill="#fff" stroke="#b91c1c" stroke-width="2"/><text x="541.8653347947321" y="409.0" text-anchor="middle" font-size="13" font-weight="800" fill="#991b1b">habitat loss</text><text x="541.8653347947321" y="429.0" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">deforestation, farmland</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.4286;0.4500;1.0000" values="0;0;1;1" dur="14s" begin="bt-play.begin+0s" fill="freeze"/><line x1="360" y1="404" x2="360" y2="476" stroke="#b91c1c" stroke-width="2.5" marker-end="url(#bt-b91c1c)"/><rect x="270" y="480" width="180" height="60" rx="12" fill="#fff" stroke="#b91c1c" stroke-width="2"/><text x="360.0" y="504.0" text-anchor="middle" font-size="13" font-weight="800" fill="#991b1b">pollution</text><text x="360.0" y="524.0" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">pesticides, plastics</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.5000;0.5214;1.0000" values="0;0;1;1" dur="14s" begin="bt-play.begin+0s" fill="freeze"/><line x1="287" y1="362" x2="239" y2="398" stroke="#b91c1c" stroke-width="2.5" marker-end="url(#bt-b91c1c)"/><rect x="88" y="385" width="180" height="60" rx="12" fill="#fff" stroke="#b91c1c" stroke-width="2"/><text x="178.13466520526788" y="409.0" text-anchor="middle" font-size="13" font-weight="800" fill="#991b1b">invasive species</text><text x="178.13466520526788" y="429.0" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">pests and diseases</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.5714;0.5929;1.0000" values="0;0;1;1" dur="14s" begin="bt-play.begin+0s" fill="freeze"/><line x1="287" y1="278" x2="239" y2="242" stroke="#b91c1c" stroke-width="2.5" marker-end="url(#bt-b91c1c)"/><rect x="88" y="195" width="180" height="60" rx="12" fill="#fff" stroke="#b91c1c" stroke-width="2"/><text x="178.1346652052679" y="219.0" text-anchor="middle" font-size="13" font-weight="800" fill="#991b1b">climate change</text><text x="178.1346652052679" y="239.0" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">warming, drought</text></g></g>
<g class="part" data-part="loss" data-name="Biodiversity loss" data-info="Populations shrink and species become extinct faster than at any time in human history." tabindex="0" role="button" aria-label="Biodiversity loss"><rect x="740" y="230" width="330" height="300" rx="16" fill="#f8fafc" stroke="#cbd5e1"/><text x="905" y="256" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">populations of wild species</text><rect x="760" y="270" width="28" height="200" fill="#4ade80" stroke="#166534"><animate attributeName="height" keyTimes="0.0000;0.7143;0.9286;1.0000" values="200.0;200.0;170.0;170.0" dur="14s" begin="bt-play.begin+0s" fill="freeze"/><animate attributeName="y" keyTimes="0.0000;0.7143;0.9286;1.0000" values="270.0;270.0;300.0;300.0" dur="14s" begin="bt-play.begin+0s" fill="freeze"/></rect><rect x="796" y="290" width="28" height="180" fill="#4ade80" stroke="#166534"><animate attributeName="height" keyTimes="0.0000;0.7143;0.9286;1.0000" values="180.0;180.0;136.8;136.8" dur="14s" begin="bt-play.begin+0s" fill="freeze"/><animate attributeName="y" keyTimes="0.0000;0.7143;0.9286;1.0000" values="290.0;290.0;333.2;333.2" dur="14s" begin="bt-play.begin+0s" fill="freeze"/></rect><rect x="832" y="310" width="28" height="160" fill="#4ade80" stroke="#166534"><animate attributeName="height" keyTimes="0.0000;0.7143;0.9286;1.0000" values="160.0;160.0;107.19999999999999;107.19999999999999" dur="14s" begin="bt-play.begin+0s" fill="freeze"/><animate attributeName="y" keyTimes="0.0000;0.7143;0.9286;1.0000" values="310.0;310.0;362.8;362.8" dur="14s" begin="bt-play.begin+0s" fill="freeze"/></rect><rect x="868" y="330" width="28" height="140" fill="#4ade80" stroke="#166534"><animate attributeName="height" keyTimes="0.0000;0.7143;0.9286;1.0000" values="140.0;140.0;81.19999999999999;81.19999999999999" dur="14s" begin="bt-play.begin+0s" fill="freeze"/><animate attributeName="y" keyTimes="0.0000;0.7143;0.9286;1.0000" values="330.0;330.0;388.8;388.8" dur="14s" begin="bt-p