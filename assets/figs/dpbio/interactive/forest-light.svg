<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 600" class="vd-svg" role="img" aria-labelledby="fl-title fl-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="fl-play" data-vd-play-label="Play: reach the light" data-vd-steps="[[0, &quot;Racing for light in a rainforest.&quot;], [1, &quot;Light: bright above the canopy, dim on the floor.&quot;], [3, &quot;Canopy trees grow tall trunks.&quot;], [5, &quot;Lianas climb other trees.&quot;], [7, &quot;Epiphytes perch on branches.&quot;], [9, &quot;Strangler figs start high, then root and strangle.&quot;], [11.5, &quot;Shade-tolerant plants have large, thin leaves.&quot;]]" data-vd-dur="15">
<title id="fl-title">Racing for light</title><desc id="fl-desc">A rainforest cross-section with a light gradient, a tall canopy tree, a liana climbing to the canopy, epiphytes on branches, a strangler fig sending roots down, and shade-tolerant plants with large leaves on the forest floor.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="600" fill="#ffffff"/>
<g aria-hidden="true"><animate id="fl-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<text class="head" x="30" y="34">Racing for light in a forest</text><text class="note" x="30" y="56">Schematic cross-section.</text>
<g class="part" data-part="light" data-name="Light gradient" data-info="Light is the key limiting resource: bright at the canopy, dim on the forest floor." tabindex="0" role="button" aria-label="Light gradient"><g><animate attributeName="opacity" keyTimes="0.0000;0.0667;0.0867;1.0000" values="0;0;1;1" dur="15s" begin="fl-play.begin+0s" fill="freeze"/><rect x="30" y="80" width="40" height="490" fill="url(#flg)"/><defs><linearGradient id="flg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fde047"/><stop offset="1" stop-color="#1e293b"/></linearGradient></defs><text x="80" y="100" text-anchor="start" font-size="11" font-weight="800" fill="#a16207">100% light</text><text x="80" y="560" text-anchor="start" font-size="11" font-weight="800" fill="#334155">~1–2% light</text></g></g>
<rect x="160" y="540" width="920" height="40" fill="#78350f" opacity=".6"/>
<g class="part" data-part="canopy" data-name="Canopy trees" data-info="Grow tall trunks to reach full sunlight (kapok, mahogany)." tabindex="0" role="button" aria-label="Canopy trees"><g><animate attributeName="opacity" keyTimes="0.0000;0.2000;0.2200;1.0000" values="0;0;1;1" dur="15s" begin="fl-play.begin+0s" fill="freeze"/><rect x="300" y="160" width="36" height="380" fill="#92400e"/><ellipse cx="318" cy="150" rx="150" ry="55" fill="#15803d"/><text x="318" y="110" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">canopy tree</text></g></g>
<g class="part" data-part="liana" data-name="Lianas" data-info="Woody climbers rooted in the ground that climb trees to the canopy without building thick trunks." tabindex="0" role="button" aria-label="Lianas"><g><animate attributeName="opacity" keyTimes="0.0000;0.3333;0.3533;1.0000" values="0;0;1;1" dur="15s" begin="fl-play.begin+0s" fill="freeze"/><path d="M 420 540 C 380 480 450 420 400 360 C 360 300 440 260 400 200" fill="none" stroke="#65a30d" stroke-width="7"/><text x="470" y="420" text-anchor="start" font-size="13" font-weight="800" fill="#3f6212">liana</text></g></g>
<g class="part" data-part="epi" data-name="Epiphytes" data-info="Orchids, ferns and bromeliads grow on branches to reach light, absorbing water from rain and humid air." tabindex="0" role="button" aria-label="Epiphytes"><g><animate attributeName="opacity" keyTimes="0.0000;0.4667;0.4867;1.0000" values="0;0;1;1" dur="15s" begin="fl-play.begin+0s" fill="freeze"/><path d="M 336 230 L 420 210" stroke="#92400e" stroke-width="10"/><g transform="translate(410 200)"><path d="M -14 0 q 14 -30 28 0 Z" fill="#f472b6"/><path d="M -10 0 q -10 -16 -16 -4 M 10 0 q 10 -16 16 -4" stroke="#16a34a" stroke-width="3" fill="none"/></g><text x="470" y="196" text-anchor="start" font-size="13" font-weight="800" fill="#9d174d">epiphyte (orchid)</text></g></g>
<g class="part" data-part="fig" data-name="Strangler figs" data-info="Start as epiphytes, send roots to the ground, then envelop and kill the host tree." tabindex="0" role="button" aria-label="Strangler figs"><g><animate attributeName="opacity" keyTimes="0.0000;0.6000;0.6200;1.0000" values="0;0;1;1" dur="15s" begin="fl-play.begin+0s" fill="freeze"/><rect x="720" y="220" width="40" height="320" fill="#a16207"/><ellipse cx="740" cy="210" rx="110" ry="40" fill="#166534"/><clipPath id="flf-c90220700"><rect x="700" y="220" width="80" height="330"><animate attributeName="width" keyTimes="0.0000;0.6000;0.7333;1.0000" values="0;0;80;80" dur="15s" begin="fl-play.begin+0s" fill="freeze"/></rect></clipPath><g clip-path="url(#flf-c90220700)"></g><g><animate attributeName="opacity" keyTimes="0.0000;0.6000;0.7000;1.0000" values="0;0;1;1" dur="15s" begin="fl-play.begin+0s" fill="freeze"/><path d="M 728 240 C 700 330 760 430 722 540" fill="none" stroke="#e7e5e4" stroke-width="4"/><path d="M 736 240 C 720 330 750 430 734 540" fill="none" stroke="#e7e5e4" stroke-width="4"/><path d="M 744 240 C 740 330 740 430 746 540" fill="none" stroke="#e7e5e4" stroke-width="4"/><path d="M 752 240 C 760 330 730 430 758 540" fill="none" stroke="#e7e5e4" stroke-width="4"/></g><text x="800" y="280" text-anchor="start" font-size="12" font-weight="800" fill="#111827">strangler fig: roots grow</text><text x="800" y="296" text-anchor="start" font-size="12" font-weight="800" fill="#111827">down round the host</text></g></g>
<g class="part" data-part="shade" data-name="Shade-tolerant plants" data-info="Shrubs and herbs on the forest floor have large, thin leaves with more chlorophyll, photosynthesising in dim light." tabindex="0" role="button" aria-label="Shade-tolerant plants"><g><animate attributeName="opacity" keyTimes="0.0000;0.7667;0.7867;1.0000" values="0;0;1;1" dur="15s" begin="fl-play.begin+0s" fill="freeze"/><path d="M 560 540 L 560 500 M 560 500 q -40 -10 -50 -40 q 40 0 50 40 q 40 -10 50 -40 q -40 0 -50 40" fill="#22c55e" stroke="#14532d" stroke-width="2"/><path d="M 640 540 L 640 500 M 640 500 q -40 -10 -50 -40 q 40 0 50 40 q 40 -10 50 -40 q -40 0 -50 40" fill="#22c55e" stroke="#14532d" stroke-width="2"/><path d="M 960 540 L 960 500 M 960 500 q -40 -10 -50 -40 q 40 0 50 40 q 40 -10 50 -40 q -40 0 -50 40" fill="#22c55e" stroke="#14532d" stroke-width="2"/><text x="760" y="440" text-anchor="middle" font-size="12" font-weight="800" fill="#14532d">shade-tolerant: large, thin leaves, more chlorophyll</text></g></g>
</svg>