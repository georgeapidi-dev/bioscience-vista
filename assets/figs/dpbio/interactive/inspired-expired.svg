<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" class="vd-svg" role="img" aria-labelledby="lw-title lw-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="lw-play" data-vd-play-label="Play: breathe out" data-vd-steps="[[0, &quot;Comparing inspired and expired air.&quot;], [1, &quot;Expired air turns limewater milky.&quot;], [8, &quot;Less oxygen, more carbon dioxide and water vapour.&quot;]]" data-vd-dur="14">
<title id="lw-title">Inspired and expired air</title><desc id="lw-desc">Two tubes of limewater: air breathed out bubbles through one and turns it milky; a table comparing oxygen, carbon dioxide, water vapour and nitrogen in inspired and expired air.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="520" fill="#ffffff"/>
<g aria-hidden="true"><animate id="lw-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<text class="head" x="30" y="34">Inspired and expired air</text><text class="note" x="30" y="56">Limewater turns milky with carbon dioxide.</text>
<g class="part" data-part="test" data-name="Limewater test" data-info="Breathe in through one tube and out through the other: expired air turns limewater milky (cloudy) much faster, showing it contains more carbon dioxide." tabindex="0" role="button" aria-label="Limewater test"><path d="M 137.0 140 L 137.0 360 A 23.0 23.0 0 0 0 183.0 360 L 183.0 140" fill="#f8fafc" stroke="#334155" stroke-width="2.5"/><rect x="139.0" y="230" width="42" height="130" fill="#e0f2fe"><animate attributeName="fill" keyTimes="0.0000;0.2143;0.4286;1.0000" values="#e0f2fe;#e0f2fe;#e0f2fe;#e0f2fe" dur="14s" begin="lw-play.begin+0s" fill="freeze"/></rect><path d="M 160 100 L 160 330" stroke="#334155" stroke-width="5"/><text x="160" y="400" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">inspired air in</text><g><animate attributeName="opacity" keyTimes="0.0000;0.4286;0.4500;1.0000" values="0;0;1;1" dur="14s" begin="lw-play.begin+0s" fill="freeze"/><text x="160" y="424" text-anchor="middle" font-size="13" font-weight="800" fill="#475569">stays clear</text></g><path d="M 357.0 140 L 357.0 360 A 23.0 23.0 0 0 0 403.0 360 L 403.0 140" fill="#f8fafc" stroke="#334155" stroke-width="2.5"/><rect x="359.0" y="230" width="42" height="130" fill="#e0f2fe"><animate attributeName="fill" keyTimes="0.0000;0.2143;0.4286;1.0000" values="#e0f2fe;#e0f2fe;#cbd5e1;#cbd5e1" dur="14s" begin="lw-play.begin+0s" fill="freeze"/></rect><path d="M 380 100 L 380 330" stroke="#334155" stroke-width="5"/><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.0714;0.0857;0.1857;0.2000;1.0000" values="0;0;1;1;0;0" dur="14s" begin="lw-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.0714;0.1786;1.0000" values="380 330;380 330;388 235;388 235" dur="14s" begin="lw-play.begin+0s" fill="freeze"/><circle r="5" fill="#fff" stroke="#64748b"/></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.1071;0.1214;0.2214;0.2357;1.0000" values="0;0;1;1;0;0" dur="14s" begin="lw-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.1071;0.2143;1.0000" values="380 330;380 330;388 235;388 235" dur="14s" begin="lw-play.begin+0s" fill="freeze"/><circle r="5" fill="#fff" stroke="#64748b"/></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.1429;0.1571;0.2571;0.2714;1.0000" values="0;0;1;1;0;0" dur="14s" begin="lw-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.1429;0.2500;1.0000" values="380 330;380 330;388 235;388 235" dur="14s" begin="lw-play.begin+0s" fill="freeze"/><circle r="5" fill="#fff" stroke="#64748b"/></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.1786;0.1929;0.2929;0.3071;1.0000" values="0;0;1;1;0;0" dur="14s" begin="lw-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.1786;0.2857;1.0000" values="380 330;380 330;388 235;388 235" dur="14s" begin="lw-play.begin+0s" fill="freeze"/><circle r="5" fill="#fff" stroke="#64748b"/></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.2143;0.2286;0.3286;0.3429;1.0000" values="0;0;1;1;0;0" dur="14s" begin="lw-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.2143;0.3214;1.0000" values="380 330;380 330;388 235;388 235" dur="14s" begin="lw-play.begin+0s" fill="freeze"/><circle r="5" fill="#fff" stroke="#64748b"/></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.2500;0.2643;0.3643;0.3786;1.0000" values="0;0;1;1;0;0" dur="14s" begin="lw-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.2500;0.3571;1.0000" values="380 330;380 330;388 235;388 235" dur="14s" begin="lw-play.begin+0s" fill="freeze"/><circle r="5" fill="#fff" stroke="#64748b"/></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.2857;0.3000;0.4000;0.4143;1.0000" values="0;0;1;1;0;0" dur="14s" begin="lw-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.2857;0.3929;1.0000" values="380 330;380 330;388 235;388 235" dur="14s" begin="lw-play.begin+0s" fill="freeze"/><circle r="5" fill="#fff" stroke="#64748b"/></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.3214;0.3357;0.4357;0.4500;1.0000" values="0;0;1;1;0;0" dur="14s" begin="lw-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.3214;0.4286;1.0000" values="380 330;380 330;388 235;388 235" dur="14s" begin="lw-play.begin+0s" fill="freeze"/><circle r="5" fill="#fff" stroke="#64748b"/></g></g><text x="380" y="400" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">expired air out</text><g><animate attributeName="opacity" keyTimes="0.0000;0.4286;0.4500;1.0000" values="0;0;1;1" dur="14s" begin="lw-play.begin+0s" fill="freeze"/><text x="380" y="424" text-anchor="middle" font-size="13" font-weight="800" fill="#b91c1c">milky</text></g></g>
<g class="part" data-part="tab" data-name="Composition" data-info="Expired air has less oxygen (used in respiration), more carbon dioxide (produced in respiration) and more water vapour; nitrogen is unchanged." tabindex="0" role="button" aria-label="Composition"><rect x="560" y="100" width="500" height="300" rx="16" fill="#f8fafc" stroke="#cbd5e1"/><text x="700" y="130" text-anchor="middle" font-size="14" font-weight="800" fill="#111827">gas</text><text x="870" y="130" text-anchor="middle" font-size="14" font-weight="800" fill="#1d4ed8">inspired</text><text x="990" y="130" text-anchor="middle" font-size="14" font-weight="800" fill="#b91c1c">expired</text><g><animate attributeName="opacity" keyTimes="0.0000;0.5714;0.5929;1.0000" values="0;0;1;1" dur="14s" begin="lw-play.begin+0s" fill="freeze"/><text x="700" y="180" text-anchor="middle" font-size="14" font-weight="800" fill="#111827">oxygen</text><text x="870" y="180" text-anchor="middle" font-size="14" font-weight="800" fill="#1d4ed8">21%</text><text x="990" y="180" text-anchor="middle" font-size="14" font-weight="800" fill="#b91c1c">16%</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.6071;0.6286;1.0000" values="0;0;1;1" dur="14s" begin="lw-play.begin+0s" fill="freeze"/><text x="700" y="232" text-anchor="middle" font-size="14" font-weight="800" fill="#111827">carbon dioxide</text><text x="870" y="232" text-anchor="middle" font-size="14" font-weight="800" fill="#1d4ed8">0.04%</text><text x="990" y="232" text-anchor="middle" font-size="14" font-weight="800" fill="#b91c1c">4%</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.6429;0.6643;1.0000" values="0;0;1;1" dur="14s" begin="lw-play.begin+0s" fill="freeze"/><text x="700" y="284" text-anchor="middle" font-size="14" font-weight="800" fill="#111827">water vapour</text><text x="870" y="284" text-anchor="middle" font-size="14" font-weight="800" fill="#1d4ed8">variable</text><text x="990" y="284" text-anchor="middle" font-size="14" font-weight="800" fill="#b91c1c">saturated</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.6786;0.7000;1.0000" values="0;0;1;1" dur="14s" begin="lw-play.begin+0s" fill="freeze"/><text x="700" y="336" text-anchor="middle" font-size="14" font-weight="800" fill="#111827">nitrogen</text><text x="870" y="336" text-anchor="middle" font-size="14" font-weight="800" fill="#1d4ed8">78%</text><text x="990" y="336" text-anchor="middle" font-size="14" font-weight="800" fill="#b91c1c">78%</text></g></g>
</svg>