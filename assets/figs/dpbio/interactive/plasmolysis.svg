<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 480" class="vd-svg" role="img" aria-labelledby="pl-title pl-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="pl-play" data-vd-play-label="Play: add salt" data-vd-steps="[[0, &quot;Red onion epidermis under the microscope.&quot;], [1, &quot;In water: turgid cells full of red sap.&quot;], [4.5, &quot;In concentrated salt solution: water leaves; protoplasts shrink from the walls: plasmolysis.&quot;]]" data-vd-dur="12">
<title id="pl-title">Plasmolysis in onion cells</title><desc id="pl-desc">Red onion epidermal cells in water are turgid with the protoplast filling each cell; in strong salt solution water leaves by osmosis and protoplasts shrink away from the cell walls.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="480" fill="#ffffff"/>
<g aria-hidden="true"><animate id="pl-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
