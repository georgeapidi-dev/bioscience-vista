<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" class="vd-svg" role="img" aria-labelledby="wg-title wg-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="wg-play" data-vd-play-label="Play: flow downhill" data-vd-steps="[[0, &quot;Water moves down a water potential gradient.&quot;], [1, &quot;From soil, to root, to xylem, to leaf, to air: ever more negative.&quot;]]" data-vd-dur="12">
<title id="wg-title">Water potential gradient through a plant</title><desc id="wg-desc">Water moving from soil at minus 100 kilopascals through root cells at minus 400, xylem sap, leaf cells at minus 1000 and into the air at very negative water potential.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="520" fill="#ffffff"/>
<g aria-hidden="true"><animate id="wg-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<text class="head" x="30" y="34">Downhill flow: water potential through a plant</text><text class="note" x="30" y="56">Values from the lesson (xylem sap and air approximate).</text>
<g class="part" data-part="grad" data-name="Downhill flow" data-info="Water moves from higher (less negative) to lower (more negative) water potential: soil −100 kPa → root cell −400 kPa → xylem sap → leaf cell −1 000 kPa → air (very negative)." tabindex="0" role="button" aria-label="Downhill flow"><g><animate attributeName="opacity" keyTimes="0.0000;0.0833;0.1083;1.0000" values="0;0;1;1" dur="12s" begin="wg-play.begin+0s" fill="freeze"/><rect x="20" y="360" width="180" height="80" rx="16" fill="#fff" stroke="#a16207" stroke-width="3"/><text x="110" y="394" text-anchor="middle" font-size="14" font-weight="800" fill="#a16207">soil</text><text x="110" y="418" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">ψw −100 kPa</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.2000;0.2250;1.0000" values="0;0;1;1" dur="12s" begin="wg-play.begin+0s" fill="freeze"/><rect x="240" y="300" width="180" height="80" rx="16" fill="#fff" stroke="#16a34a" stroke-width="3"/><text x="330" y="334" text-anchor="middle" font-size="14" font-weight="800" fill="#16a34a">root cell</text><text x="330" y="358" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">ψw −400 kPa</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.3167;0.3417;1.0000" values="0;0;1;1" dur="12s" begin="wg-play.begin+0s" fill="freeze"/><rect x="460" y="240" width="180" height="80" rx="16" fill="#fff" stroke="#0ea5e9" stroke-width="3"/><text x="550" y="274" text-anchor="middle" font-size="14" font-weight="800" fill="#0ea5e9">xylem sap</text><text x="550" y="298" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">ψw ≈ −600 kPa</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.4333;0.4583;1.0000" values="0;0;1;1" dur="12s" begin="wg-play.begin+0s" fill="freeze"/><rect x="680" y="180" width="180" height="80" rx="16" fill="#fff" stroke="#15803d" stroke-width="3"/><text x="770" y="214" text-anchor="middle" font-size="14" font-weight="800" fill="#15803d">leaf cell</text><text x="770" y="238" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">ψw −1 000 kPa</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.5500;0.5750;1.0000" values="0;0;1;1" dur="12s" begin="wg-play.begin+0s" fill="freeze"/><rect x="900" y="120" width="180" height="80" rx="16" fill="#fff" stroke="#64748b" stroke-width="3"/><text x="990" y="154" text-anchor="middle" font-size="14" font-weight="800" fill="#64748b">air</text><text x="990" y="178" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">ψw very negative</text></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.0833;0.1000;0.7833;0.8000;1.0000" values="0;0;1;1;0;0" dur="12s" begin="wg-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.0833;0.2500;0.4167;0.5833;0.7500;1.0000" values="110 360;110 360;330 300;550 240;770 180;990 120;990 120" dur="12s" begin="wg-play.begin+0s" fill="freeze"/><circle r="7" fill="#38bdf8" stroke="#0369a1"/></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.1250;0.1417;0.8250;0.8417;1.0000" values="0;0;1;1;0;0" dur="12s" begin="wg-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.1250;0.2917;0.4583;0.6250;0.7917;1.0000" values="110 360;110 360;330 300;550 240;770 180;990 120;990 120" dur="12s" begin="wg-play.begin+0s" fill="freeze"/><circle r="7" fill="#38bdf8" stroke="#0369a1"/></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.1667;0.1833;0.8667;0.8833;1.0000" values="0;0;1;1;0;0" dur="12s" begin="wg-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.1667;0.3333;0.5000;0.6667;0.8333;1.0000" values="110 360;110 360;330 300;550 240;770 180;990 120;990 120" dur="12s" begin="wg-play.begin+0s" fill="freeze"/><circle r="7" fill="#38bdf8" stroke="#0369a1"/></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.2083;0.2250;0.9083;0.9250;1.0000" values="0;0;1;1;0;0" dur="12s" begin="wg-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.2083;0.3750;0.5417;0.7083;0.8750;1.0000" values="110 360;110 360;330 300;550 240;770 180;990 120;990 120" dur="12s" begin="wg-play.begin+0s" fill="freeze"/><circle r="7" fill="#38bdf8" stroke="#0369a1"/></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.2500;0.2667;0.9500;0.9667;1.0000" values="0;0;1;1;0;0" dur="12s" begin="wg-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.2500;0.4167;0.5833;0.7500;0.9167;1.0000" values="110 360;110 360;330 300;550 240;770 180;990 120;990 120" dur="12s" begin="wg-play.begin+0s" fill="freeze"/><circle r="7" fill="#38bdf8" stroke="#0369a1"/></g></g><path d="M 60 470 L 1040 470" stroke="#475569" stroke-width="3"/><text x="550" y="500" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">higher ψw (less negative) → lower ψw (more negative)</text></g>
</svg>