<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 540" class="vd-svg" role="img" aria-labelledby="gm-title gm-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="gm-play" data-vd-play-label="Play: wait a week" data-vd-steps="[[0, &quot;Conditions needed for germination.&quot;], [1, &quot;Remove one condition in each tube.&quot;], [7, &quot;Only the control germinates.&quot;], [11, &quot;Water, oxygen and warmth are needed.&quot;]]" data-vd-dur="14">
<title id="gm-title">Conditions for germination</title><desc id="gm-desc">Four tubes of seeds: with water, air and warmth they germinate; with no water, no oxygen (boiled water under oil) or at 4 degrees Celsius they do not.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="540" fill="#ffffff"/>
<g aria-hidden="true"><animate id="gm-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<text class="head" x="30" y="34">What do seeds need to germinate?</text><text class="note" x="30" y="56">One variable removed in each tube.</text>
<g class="part" data-part="set" data-name="The investigation" data-info="Seeds on cotton wool in four tubes; only one condition is removed in each, with tube A as the control." tabindex="0" role="button" aria-label="The investigation"><path d="M 115.0 120 L 115.0 340 A 35.0 35.0 0 0 0 185.0 340 L 185.0 120" fill="#f8fafc" stroke="#334155" stroke-width="2.5"/><rect x="117" y="300" width="66" height="40" fill="#f1f5f9" stroke="#cbd5e1"/><rect x="117" y="280" width="66" height="60" fill="#bfdbfe" opacity=".6"/><ellipse cx="132" cy="296" rx="8" ry="6" fill="#d4a373" stroke="#7c2d12"/><ellipse cx="150" cy="296" rx="8" ry="6" fill="#d4a373" stroke="#7c2d12"/><ellipse cx="168" cy="296" rx="8" ry="6" fill="#d4a373" stroke="#7c2d12"/><path d="M 132 292 Q 128 260 136 230" fill="none" stroke="#16a34a" stroke-width="3" stroke-dasharray="80" stroke-dashoffset="80"><animate attributeName="stroke-dashoffset" keyTimes="0.0000;0.5000;0.6429;1.0000" values="80;80;0;0" dur="14s" begin="gm-play.begin+0s" fill="freeze"/></path><path d="M 150 292 Q 146 260 154 230" fill="none" stroke="#16a34a" stroke-width="3" stroke-dasharray="80" stroke-dashoffset="80"><animate attributeName="stroke-dashoffset" keyTimes="0.0000;0.5000;0.6429;1.0000" values="80;80;0;0" dur="14s" begin="gm-play.begin+0s" fill="freeze"/></path><path d="M 168 292 Q 164 260 172 230" fill="none" stroke="#16a34a" stroke-width="3" stroke-dasharray="80" stroke-dashoffset="80"><animate attributeName="stroke-dashoffset" keyTimes="0.0000;0.5000;0.6429;1.0000" values="80;80;0;0" dur="14s" begin="gm-play.begin+0s" fill="freeze"/></path><text x="150" y="110" text-anchor="middle" font-size="18" font-weight="800" fill="#111827">A</text><text x="150" y="390" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">water, air, 20 °C</text><g><animate attributeName="opacity" keyTimes="0.0000;0.5714;0.5929;1.0000" values="0;0;1;1" dur="14s" begin="gm-play.begin+0s" fill="freeze"/><text x="150" y="416" text-anchor="middle" font-size="14" font-weight="800" fill="#15803d">germinates</text></g><path d="M 375.0 120 L 375.0 340 A 35.0 35.0 0 0 0 445.0 340 L 445.0 120" fill="#f8fafc" stroke="#334155" stroke-width="2.5"/><rect x="377" y="300" width="66" height="40" fill="#f1f5f9" stroke="#cbd5e1"/><ellipse cx="392" cy="296" rx="8" ry="6" fill="#d4a373" stroke="#7c2d12"/><ellipse cx="410" cy="296" rx="8" ry="6" fill="#d4a373" stroke="#7c2d12"/><ellipse cx="428" cy="296" rx="8" ry="6" fill="#d4a373" stroke="#7c2d12"/><text x="410" y="110" text-anchor="middle" font-size="18" font-weight="800" fill="#111827">B</text><text x="410" y="390" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">dry, air, 20 °C</text><g><animate attributeName="opacity" keyTimes="0.0000;0.5714;0.5929;1.0000" values="0;0;1;1" dur="14s" begin="gm-play.begin+0s" fill="freeze"/><text x="410" y="416" text-anchor="middle" font-size="14" font-weight="800" fill="#b91c1c">no water</text></g><path d="M 635.0 120 L 635.0 340 A 35.0 35.0 0 0 0 705.0 340 L 705.0 120" fill="#f8fafc" stroke="#334155" stroke-width="2.5"/><rect x="637" y="300" width="66" height="40" fill="#f1f5f9" stroke="#cbd5e1"/><rect x="637" y="280" width="66" height="60" fill="#bfdbfe" opacity=".6"/><rect x="637" y="270" width="66" height="10" fill="#fde047"/><ellipse cx="652" cy="296" rx="8" ry="6" fill="#d4a373" stroke="#7c2d12"/><ellipse cx="670" cy="296" rx="8" ry="6" fill="#d4a373" stroke="#7c2d12"/><ellipse cx="688" cy="296" rx="8" ry="6" fill="#d4a373" stroke="#7c2d12"/><text x="670" y="110" text-anchor="middle" font-size="18" font-weight="800" fill="#111827">C</text><text x="670" y="390" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">boiled water + oil layer, 20 °C</text><g><animate attributeName="opacity" keyTimes="0.0000;0.5714;0.5929;1.0000" values="0;0;1;1" dur="14s" begin="gm-play.begin+0s" fill="freeze"/><text x="670" y="416" text-anchor="middle" font-size="14" font-weight="800" fill="#b91c1c">no oxygen</text></g><path d="M 895.0 120 L 895.0 340 A 35.0 35.0 0 0 0 965.0 340 L 965.0 120" fill="#f8fafc" stroke="#334155" stroke-width="2.5"/><rect x="897" y="300" width="66" height="40" fill="#f1f5f9" stroke="#cbd5e1"/><rect x="897" y="280" width="66" height="60" fill="#bfdbfe" opacity=".6"/><ellipse cx="912" cy="296" rx="8" ry="6" fill="#d4a373" stroke="#7c2d12"/><ellipse cx="930" cy="296" rx="8" ry="6" fill="#d4a373" stroke="#7c2d12"/><ellipse cx="948" cy="296" rx="8" ry="6" fill="#d4a373" stroke="#7c2d12"/><text x="930" y="110" text-anchor="middle" font-size="18" font-weight="800" fill="#111827">D</text><text x="930" y="390" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">water, air, 4 °C (fridge)</text><g><animate attributeName="opacity" keyTimes="0.0000;0.5714;0.5929;1.0000" values="0;0;1;1" dur="14s" begin="gm-play.begin+0s" fill="freeze"/><text x="930" y="416" text-anchor="middle" font-size="14" font-weight="800" fill="#b91c1c">too cold</text></g></g>
<g class="part" data-part="res" data-name="Results" data-info="Only A germinates: seeds need water, oxygen and a suitable temperature. Light is not needed for germination." tabindex="0" role="button" aria-label="Results"></g>
<g class="part" data-part="why" data-name="Why" data-info="Water activates enzymes and swells the seed; oxygen is needed for aerobic respiration to release energy; temperature affects enzyme activity." tabindex="0" role="button" aria-label="Why"><g><animate attributeName="opacity" keyTimes="0.0000;0.7857;0.8071;1.0000" values="0;0;1;1" dur="14s" begin="gm-play.begin+0s" fill="freeze"/><rect x="60" y="440" width="980" height="80" rx="14" fill="#f0fdf4" stroke="#86efac"/><text x="550" y="470" text-anchor="middle" font-size="13" font-weight="800" fill="#15803d">needed: water (activates enzymes), oxygen (aerobic respiration), suitable temperature (enzymes)</text><text x="550" y="498" text-anchor="middle" font-size="12" font-weight="700" fill="#475569">light is not needed for germination</text></g></g>
</svg>