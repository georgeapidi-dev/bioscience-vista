<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 600" class="vd-svg" role="img" aria-labelledby="pn-title pn-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="pn-play" data-vd-play-label="Play: penicillin attacks" data-vd-steps="[[0, &quot;How penicillin kills bacteria.&quot;], [1, &quot;Peptidoglycan: sugar chains (NAG and NAM) cross-linked by peptides.&quot;], [3.5, &quot;Transpeptidase enzymes make new cross-links as the wall grows.&quot;], [7, &quot;Penicillin&#x27;s \u03b2-lactam ring binds transpeptidase irreversibly: no new cross-links.&quot;], [11, &quot;The weak wall cannot resist osmosis: the growing cell bursts.&quot;]]" data-vd-dur="16">
<title id="pn-title">How penicillin works</title><desc id="pn-desc">Peptidoglycan of sugar chains cross-linked by peptides; transpeptidase forms cross-links; penicillin with its beta-lactam ring binds transpeptidase irreversibly; the weakened wall of a growing bacterium bursts by osmosis.</desc>
<style>
