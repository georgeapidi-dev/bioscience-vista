oke="#334155"/><text x="320" y="325" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">M</text><rect x="352" y="306" width="36" height="28" rx="8" fill="#93c5fd" stroke="#334155"/><text x="370" y="325" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">G</text><rect x="402" y="306" width="36" height="28" rx="8" fill="#fcd34d" stroke="#334155"/><text x="420" y="325" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">M</text><rect x="452" y="306" width="36" height="28" rx="8" fill="#93c5fd" stroke="#334155"/><text x="470" y="325" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">G</text><rect x="502" y="306" width="36" height="28" rx="8" fill="#fcd34d" stroke="#334155"/><text x="520" y="325" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">M</text></g>
<g class="part" data-part="tp" data-name="Transpeptidase" data-info="The enzyme that forms the peptide cross-links as the wall grows." tabindex="0" role="button" aria-label="Transpeptidase"><g transform="translate(470 320)"><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.2188;0.3125;0.4375;1.0000" values="600 420;600 420;450 300;520 420;520 420" dur="16s" begin="pn-play.begin+0s" fill="freeze"/><g transform="translate(0 0) scale(0.6)"><path d="M -60 -40 L -18 -40 L -18 -18 L 18 -18 L 18 -40 L 60 -40 C 80 -40 80 40 50 46 C 20 52 -20 52 -50 46 C -80 40 -80 -40 -60 -40 Z" fill="#c4b5fd" stroke="#334155" stroke-width="2.5"/></g><text x="0" y="46" text-anchor="middle" font-size="12" font-weight="800" fill="#5b21b6">transpeptidase</text></g></g>
<g class="part" data-part="lac" data-name="β-lactam ring" data-info="The reactive four-membered ring in penicillins (and cephalosporins, carbapenems). It binds the transpeptidase active site irreversibly." tabindex="0" role="button" aria-label="β-lactam ring"><g transform="translate(900 200)"><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.4375;0.5312;1.0000" values="900 200;900 200;520 386;520 386" dur="16s" begin="pn-play.begin+0s" fill="freeze"/><rect x="-14" y="-14" width="28" height="28" fill="#fca5a5" stroke="#b91c1c" stroke-width="3"/><text x="0" y="5" text-anchor="middle" font-size="13" font-weight="800" fill="#7f1d1d">β</text></g><text x="900" y="160" text-anchor="middle" font-size="14" font-weight="800" fill="#b91c1c">penicillin</text><text x="900" y="250" text-anchor="middle" font-size="12" font-weight="700" fill="#b91c1c">(β-lactam ring)</text><g><animate attributeName="opacity" keyTimes="0.0000;0.5312;0.5500;1.0000" values="0;0;1;1" dur="16s" begin="pn-play.begin+0s" fill="freeze"/><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.5312;0.5500;1.0000" values="0;0;1;1" dur="16s" begin="pn-play.begin+0s" fill="freeze"/><rect x="690.0" y="318" width="260" height="24" rx="12" fill="#fee2e2" stroke="#1f2937" stroke-width="1"/><text x="820" y="335" text-anchor="middle" font-size="12" font-weight="700">bound irreversibly: no cross-links</text></g></g></g>
