<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" class="vd-svg" role="img" aria-labelledby="wv-title wv-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="wv-play" data-vd-play-label="Play: swim" data-vd-steps="[[0, &quot;Living in water versus air: two Arctic animals.&quot;], [1, &quot;Water is denser and more viscous than air: more buoyancy, but more drag.&quot;], [4, &quot;Ringed seal: streamlined, flippers, thick blubber to insulate against cold water.&quot;], [8, &quot;Black-throated loon: air trapped in its feathers insulates and adds buoyancy; it dives after fish and also flies.&quot;], [12, &quot;Water conducts heat away fast and has a high specific heat capacity, so its temperature is stable.&quot;]]" data-vd-dur="15">
<title id="wv-title">Water versus air: the ringed seal and the black-throated loon</title><desc id="wv-desc">A ringed seal with blubber and flippers and a black-throated loon with air trapped in its feathers, swimming in cold water, with a comparison of the buoyancy, viscosity, thermal conductivity and specific heat capacity of water and air.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="620" fill="#ffffff"/>
<g aria-hidden="true"><animate id="wv-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<text class="head" x="30" y="34">Water versus air: two Arctic animals</text><text class="note" x="30" y="56">After EduVista A1.1 task sheet.</text>
<rect x="20" y="150" width="1060" height="260" fill="#cfe5f5"/><path d="M 20 150 q 40 -10 80 0 t 80 0 t 80 0 t 80 0 t 80 0 t 80 0 t 80 0 t 80 0 t 80 0 t 80 0 t 80 0 t 80 0 t 80 0 t 60 0" fill="none" stroke="#2e6fb5" stroke-width="3"/>
<g class="part" data-part="seal" data-name="Ringed seal" data-info="A streamlined mammal, a strong swimmer but awkward on land. Lives in Arctic water near 0 °C." tabindex="0" role="button" aria-label="Ringed seal"><g transform="translate(260 280)"><g><animateTransform attributeName="transform" type="translate" values="0 0;-20 6;0 0" dur="3s" repeatCount="indefinite"/><g><ellipse cx="0" cy="0" rx="120" ry="40" fill="#a9b4c2" stroke="#4b5563" stroke-width="2.5"/><ellipse cx="0" cy="0" rx="96" ry="24" fill="#eef1f5" stroke="#6b7280" stroke-dasharray="5 4" stroke-width="2"/><ellipse cx="-122" cy="-6" rx="26" ry="20" fill="#a9b4c2" stroke="#4b5563" stroke-width="2.5"/><circle cx="-130" cy="-12" r="3" fill="#111827"/><path d="M 110 -10 L 170 -40 L 160 0 L 170 40 L 110 10 Z" fill="#8b97a6" stroke="#4b5563" stroke-width="2"/><path d="M -40 30 L -60 70 L -20 40 Z" fill="#8b97a6" stroke="#4b5563" stroke-width="2"/></g></g></g><text x="260" y="120" text-anchor="middle" font-size="15" font-weight="800" fill="#1f3b5c">RINGED SEAL</text><text x="260" y="440" text-anchor="middle" font-size="13" font-weight="600" fill="#475569">Streamlined; strong swimmer, awkward on land.</text></g>
<g class="part" data-part="blub" data-name="Thick blubber under the skin" data-info="Water conducts heat about 25 times faster than air, so insulation is vital. Blubber also stores energy and adds buoyancy." tabindex="0" role="button" aria-label="Thick blubber under the skin"><g><animate attributeName="opacity" keyTimes="0.0000;0.2667;0.2867;1.0000" values="0;0;1;1" dur="15s" begin="wv-play.begin+0s" fill="freeze"/><g><animate attributeName="opacity" keyTimes="0.0000;0.2667;0.2867;1.0000" values="0;0;1;1" dur="15s" begin="wv-play.begin+0s" fill="freeze"/><line x1="250" y1="278" x2="250" y2="200" stroke="#475569" stroke-width="1.5"/><circle cx="250" cy="278" r="3" fill="#475569"/><text x="250" y="192" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">thick blubber layer under the skin</text></g></g></g>
<g class="part" data-part="flip" data-name="Limbs modified as flippers" data-info="Water is about 800 times denser and much more viscous than air: flippers push against it; a streamlined body reduces drag." tabindex="0" role="button" aria-label="Limbs modified as flippers"><g><animate attributeName="opacity" keyTimes="0.0000;0.3667;0.3867;1.0000" values="0;0;1;1" dur="15s" begin="wv-play.begin+0s" fill="freeze"/><line x1="420" y1="260" x2="450" y2="200" stroke="#475569" stroke-width="1.5"/><circle cx="420" cy="260" r="3" fill="#475569"/><text x="450" y="192" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">limbs modified as flippers</text></g></g>
<g class="part" data-part="loon" data-name="Black-throated loon" data-info="A diving bird: dives and swims after fish, and also flies." tabindex="0" role="button" aria-label="Black-throated loon"><g transform="translate(820 230)"><g><animateTransform attributeName="transform" type="translate" values="0 0;0 0;30 100;60 100;60 0;0 0" keyTimes="0;.15;.4;.6;.85;1" dur="6s" repeatCount="indefinite"/><g><ellipse cx="0" cy="0" rx="90" ry="30" fill="#d1d7df" stroke="#374151" stroke-width="2.5"/><circle cx="-50" cy="-24" r="5" fill="#fff" stroke="#94a3b8"/><circle cx="-36" cy="-24" r="5" fill="#fff" stroke="#94a3b8"/><circle cx="-22" cy="-24" r="5" fill="#fff" stroke="#94a3b8"/><circle cx="-8" cy="-24" r="5" fill="#fff" stroke="#94a3b8"/><circle cx="6" cy="-24" r="5" fill="#fff" stroke="#94a3b8"/><circle cx="20" cy="-24" r="5" fill="#fff" stroke="#94a3b8"/><circle cx="34" cy="-24" r="5" fill="#fff" stroke="#94a3b8"/><circle cx="48" cy="-24" r="5" fill="#fff" stroke="#94a3b8"/><path d="M -70 -10 C -100 -40 -110 -80 -90 -95" fill="none" stroke="#374151" stroke-width="10"/><ellipse cx="-88" cy="-100" rx="18" ry="12" fill="#9aa5b1" stroke="#374151" stroke-width="2"/><path d="M -104 -100 L -140 -96 L -104 -94 Z" fill="#374151"/><circle cx="-90" cy="-104" r="2.5" fill="#111"/><path d="M 80 -10 L 120 -30 L 110 10 Z" fill="#8b97a6" stroke="#374151"/><path d="M 30 26 L 40 60 L 60 30 Z" fill="#8b97a6" stroke="#374151"/></g></g></g><text x="820" y="120" text-anchor="middle" font-size="15" font-weight="800" fill="#1f3b5c">BLACK-THROATED LOON</text><text x="820" y="440" text-anchor="middle" font-size="13" font-weight="600" fill="#475569">Dives and swims after fish, and also flies.</text></g>
<g class="part" data-part="air" data-name="Air trapped in the feathers" data-info="Insulates (air conducts heat poorly) and adds buoyancy; loons can press air out to dive." tabindex="0" role="button" aria-label="Air trapped in the feathers"><g><animate attributeName="opacity" keyTimes="0.0000;0.5333;0.5533;1.0000" values="0;0;1;1" dur="15s" begin="wv-play.begin+0s" fill="freeze"/><text x="960" y="186" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">layer of air trapped</text><text x="960" y="204" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">in the feathers</text></g></g>
<g class="part" data-part="props" data-name="Water versus air" data-info="Buoyancy, viscosity, thermal conductivity and specific heat capacity are all much higher in water." tabindex="0" role="button" aria-label="Water versus air"><rect x="40" y="470" width="1020" height="140" rx="14" fill="#f5f8fc" stroke="#cbd5e1"/><text x="550" y="494" text-anchor="middle" font-size="15" font-weight="800" fill="#1f3b5c">Water compared with air</text><g><animate attributeName="opacity" keyTimes="0.0000;0.0667;0.0867;1.0000" values="0;0;1;1" dur="15s" begin="wv-play.begin+0s" fill="freeze"/><text x="60" y="526" text-anchor="start" font-size="13" font-weight="800" fill="#111827">density (buoyancy)</text><text x="60" y="550" text-anchor="start" font-size="13" font-weight="800" fill="#2e6fb5">about 800× air</text><text x="60" y="574" text-anchor="start" font-size="12" font-weight="600" fill="#475569">more support, more drag</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.3000;0.3200;1.0000" values="0;0;1;1" dur="15s" begin="wv-play.begin+0s" fill="freeze"/><text x="315" y="526" text-anchor="start" font-size="13" font-weight="800" fill="#111827">viscosity</text><text x="315" y="550" text-anchor="start" font-size="13" font-weight="800" fill="#2e6fb5">about 55× air</text><text x="315" y="574" text-anchor="start" font-size="12" font-weight="600" fill="#475569">harder to move through</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.8000;0.8200;1.0000" values="0;0;1;1" dur="15s" begin="wv-play.begin+0s" fill="freeze"/><text x="570" y="526" text-anchor="start" font-size="13" font-weight="800" fill="#111827">thermal conductivity</text><text x="570" y="550" text-anchor="start" font-size="13" font-weight="800" fill="#2e6fb5">about 25× air</text><text x="570" y="574" text-anchor="start" font-size="12" font-weight="600" fill="#475569">loses body heat fast</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.8400;0.8600;1.0000" values="0;0;1;1" dur="15s" begin="wv-play.begin+0s" fill="freeze"/><text x="825" y="526" text-anchor="start" font-size="13" font-weight="800" fill="#111827">specific heat capacity</text><text x="825" y="550" text-anchor="start" font-size="13" font-weight="800" fill="#2e6fb5">4.18 J g⁻¹ K⁻¹ (air ≈1.0)</text><text x="825" y="574" text-anchor="start" font-size="12" font-weight="600" fill="#475569">temperature very stable</text></g></g>
</svg>