<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 540" class="vd-svg" role="img" aria-labelledby="mg-title mg-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="mg-play" data-vd-play-label="Play: calculate" data-vd-steps="[[0, &quot;Calculating magnification.&quot;], [1, &quot;magnification = image \u00f7 actual.&quot;], [5, &quot;Convert so units match: 1 mm = 1000 \u00b5m.&quot;], [9, &quot;Worked example: actual size of a cell.&quot;]]" data-vd-dur="13">
<title id="mg-title">Magnification</title><desc id="mg-desc">The magnification formula triangle with image size, magnification and actual size; unit conversions between millimetres and micrometres; a worked example finding the actual size of a cell as 30 micrometres.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="540" fill="#ffffff"/>
<g aria-hidden="true"><animate id="mg-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<text class="head" x="30" y="34">Magnification = image size ÷ actual size</text><text class="note" x="30" y="56">I = image, A = actual, M = magnification.</text>
<g class="part" data-part="tri" data-name="The formula" data-info="magnification = image size ÷ actual size. Rearranged: actual size = image size ÷ magnification; image size = actual size × magnification." tabindex="0" role="button" aria-label="The formula"><g><animate attributeName="opacity" keyTimes="0.0000;0.0769;0.1000;1.0000" values="0;0;1;1" dur="13s" begin="mg-play.begin+0s" fill="freeze"/><path d="M 230 110 L 400 400 L 60 400 Z" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/><line x1="135" y1="270" x2="325" y2="270" stroke="#7c3aed" stroke-width="3"/><line x1="230" y1="270" x2="230" y2="400" stroke="#7c3aed" stroke-width="3"/><text x="230" y="230" text-anchor="middle" font-size="40" font-weight="800" fill="#4c1d95">I</text><text x="170" y="355" text-anchor="middle" font-size="36" font-weight="800" fill="#4c1d95">A</text><text x="290" y="355" text-anchor="middle" font-size="36" font-weight="800" fill="#4c1d95">M</text><g><animate attributeName="opacity" keyTimes="0.0000;0.1538;0.1769;1.0000" values="0;0;1;1" dur="13s" begin="mg-play.begin+0s" fill="freeze"/><text x="230" y="450" text-anchor="middle" font-size="13" font-weight="800" fill="#4c1d95">cover what you want: M = I ÷ A · A = I ÷ M · I = A × M</text></g></g></g>
<g class="part" data-part="units" data-name="Units" data-info="Use the same units for image and actual size. 1 mm = 1000 µm; 1 cm = 10 mm." tabindex="0" role="button" aria-label="Units"><g><animate attributeName="opacity" keyTimes="0.0000;0.3846;0.4077;1.0000" values="0;0;1;1" dur="13s" begin="mg-play.begin+0s" fill="freeze"/><rect x="480" y="100" width="580" height="150" rx="16" fill="#f0f9ff" stroke="#7dd3fc"/><text x="770" y="130" text-anchor="middle" font-size="15" font-weight="800" fill="#0369a1">make the units match</text><text x="770" y="170" text-anchor="middle" font-size="17" font-weight="800" fill="#111827">1 cm = 10 mm     1 mm = 1000 µm</text><text x="770" y="206" text-anchor="middle" font-size="13" font-weight="700" fill="#475569">mm → µm: × 1000          µm → mm: ÷ 1000</text><text x="770" y="232" text-anchor="middle" font-size="12" font-weight="700" fill="#475569">magnification has no units (×1500)</text></g></g>
<g class="part" data-part="ex" data-name="Worked example" data-info="A cell drawing is 45 mm long; magnification ×1500. Actual size = 45 ÷ 1500 = 0.03 mm = 30 µm." tabindex="0" role="button" aria-label="Worked example"><g><animate attributeName="opacity" keyTimes="0.0000;0.6923;0.7154;1.0000" values="0;0;1;1" dur="13s" begin="mg-play.begin+0s" fill="freeze"/><rect x="480" y="270" width="580" height="240" rx="16" fill="#fef9c3" stroke="#eab308"/><text x="770" y="300" text-anchor="middle" font-size="15" font-weight="800" fill="#713f12">drawing 45 mm long, magnification ×1500</text><g><animate attributeName="opacity" keyTimes="0.0000;0.7308;0.7538;1.0000" values="0;0;1;1" dur="13s" begin="mg-play.begin+0s" fill="freeze"/><text x="770" y="350" text-anchor="middle" font-size="16" font-weight="800" fill="#111827">actual = image ÷ magnification</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.8077;0.8308;1.0000" values="0;0;1;1" dur="13s" begin="mg-play.begin+0s" fill="freeze"/><text x="770" y="394" text-anchor="middle" font-size="16" font-weight="800" fill="#111827">= 45 mm ÷ 1500 = 0.03 mm</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.8846;0.9077;1.0000" values="0;0;1;1" dur="13s" begin="mg-play.begin+0s" fill="freeze"/><text x="770" y="438" text-anchor="middle" font-size="18" font-weight="800" fill="#15803d">0.03 mm × 1000 = 30 µm</text></g></g></g>
</svg>