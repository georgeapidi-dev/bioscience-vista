<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 540" class="vd-svg" role="img" aria-labelledby="hr-title hr-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="hr-play" data-vd-play-label="Play: test the claim" data-vd-steps="[[0, &quot;HRT: correlation or cause?&quot;], [1, &quot;Observational studies: HRT users had less heart disease.&quot;], [5, &quot;But HRT users differed: wealthier and healthier.&quot;], [9, &quot;A randomised trial found a small increase in risk.&quot;]]" data-vd-dur="14">
<title id="hr-title">HRT and heart disease</title><desc id="hr-desc">Observational studies showed less coronary heart disease in women taking HRT, explained by the confounding variable of wealth and health; a randomised controlled trial found a small increase in risk.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="540" fill="#ffffff"/>
<g aria-hidden="true"><animate id="hr-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<text class="head" x="30" y="34">HRT: correlation or cause?</text><text class="note" x="30" y="56">Bar heights illustrative (direction of the findings only).</text>
<g class="part" data-part="obs" data-name="Observational studies" data-info="Women taking HRT had lower rates of coronary heart disease (CHD): the correlation was taken as cause and effect." tabindex="0" role="button" aria-label="Observational studies"><rect x="30" y="80" width="330" height="400" rx="16" fill="#f8fafc" stroke="#cbd5e1"/><text x="195" y="106" text-anchor="middle" font-size="14" font-weight="800" fill="#111827">observational study</text><text x="195" y="126" text-anchor="middle" font-size="12" font-weight="700" fill="#475569">CHD rate</text><rect x="100" y="180" width="80" height="240" fill="#94a3b8" stroke="#334155"><animate attributeName="height" keyTimes="0.0000;0.0714;0.1429;1.0000" values="0;0;240.0;240.0" dur="14s" begin="hr-play.begin+0s" fill="freeze"/><animate attributeName="y" keyTimes="0.0000;0.0714;0.1429;1.0000" values="420;420;180.0;180.0" dur="14s" begin="hr-play.begin+0s" fill="freeze"/></rect><text x="140" y="442" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">no HRT</text><rect x="210" y="276" width="80" height="144" fill="#db2777" stroke="#334155"><animate attributeName="height" keyTimes="0.0000;0.0714;0.1429;1.0000" values="0;0;144.0;144.0" dur="14s" begin="hr-play.begin+0s" fill="freeze"/><animate attributeName="y" keyTimes="0.0000;0.0714;0.1429;1.0000" values="420;420;276.0;276.0" dur="14s" begin="hr-play.begin+0s" fill="freeze"/></rect><text x="250" y="442" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">HRT</text><line x1="80" y1="420" x2="310" y2="420" stroke="#111827" stroke-width="2"/><g><animate attributeName="opacity" keyTimes="0.0000;0.1429;0.1643;1.0000" values="0;0;1;1" dur="14s" begin="hr-play.begin+0s" fill="freeze"/><text x="195" y="470" text-anchor="middle" font-size="12" font-weight="800" fill="#475569">looks protective…</text></g></g>
<g class="part" data-part="conf" data-name="Confounding variable" data-info="Women who chose HRT were, on average, wealthier and healthier (diet, exercise, healthcare)." tabindex="0" role="button" aria-label="Confounding variable"><g><animate attributeName="opacity" keyTimes="0.0000;0.3571;0.3786;1.0000" values="0;0;1;1" dur="14s" begin="hr-play.begin+0s" fill="freeze"/><rect x="385" y="80" width="330" height="400" rx="16" fill="#fef3c7" stroke="#fcd34d"/><text x="550" y="106" text-anchor="middle" font-size="14" font-weight="800" fill="#a16207">confounding variable</text><text x="550" y="170" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">HRT users were on average</text><text x="550" y="194" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">wealthier and healthier:</text><text x="550" y="230" text-anchor="middle" font-size="13" font-weight="800" fill="#a16207">better diet · more exercise</text><text x="550" y="254" text-anchor="middle" font-size="13" font-weight="800" fill="#a16207">better healthcare</text><text x="550" y="330" text-anchor="middle" font-size="12" font-weight="700" fill="#475569">wealth/health → less CHD</text><text x="550" y="352" text-anchor="middle" font-size="12" font-weight="700" fill="#475569">wealth/health → more HRT use</text></g></g>
<g class="part" data-part="rct" data-name="Randomised controlled trial" data-info="The Women&#x27;s Health Initiative (2002) assigned HRT at random and found a small INCREASE in CHD risk. Correlation does not prove causation." tabindex="0" role="button" aria-label="Randomised controlled trial"><rect x="740" y="80" width="330" height="400" rx="16" fill="#fdf2f8" stroke="#fbcfe8"/><text x="905" y="106" text-anchor="middle" font-size="14" font-weight="800" fill="#9d174d">randomised trial (WHI, 2002)</text><text x="905" y="126" text-anchor="middle" font-size="12" font-weight="700" fill="#475569">CHD rate</text><rect x="810" y="276" width="80" height="144" fill="#94a3b8" stroke="#334155"><animate attributeName="height" keyTimes="0.0000;0.6429;0.7143;1.0000" values="0;0;144.0;144.0" dur="14s" begin="hr-play.begin+0s" fill="freeze"/><animate attributeName="y" keyTimes="0.0000;0.6429;0.7143;1.0000" values="420;420;276.0;276.0" dur="14s" begin="hr-play.begin+0s" fill="freeze"/></rect><text x="850" y="442" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">placebo</text><rect x="920" y="257" width="80" height="163" fill="#db2777" stroke="#334155"><animate attributeName="height" keyTimes="0.0000;0.6429;0.7143;1.0000" values="0;0;163.2;163.2" dur="14s" begin="hr-play.begin+0s" fill="freeze"/><animate attributeName="y" keyTimes="0.0000;0.6429;0.7143;1.0000" values="420;420;256.8;256.8" dur="14s" begin="hr-play.begin+0s" fill="freeze"/></rect><text x="960" y="442" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">HRT</text><line x1="790" y1="420" x2="1020" y2="420" stroke="#111827" stroke-width="2"/><g><animate attributeName="opacity" keyTimes="0.0000;0.7143;0.7357;1.0000" values="0;0;1;1" dur="14s" begin="hr-play.begin+0s" fill="freeze"/><text x="905" y="470" text-anchor="middle" font-size="12" font-weight="800" fill="#9d174d">small INCREASE in risk</text></g></g>
<g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.7857;0.8071;1.0000" values="0;0;1;1" dur="14s" begin="hr-play.begin+0s" fill="freeze"/><rect x="300.0" y="503" width="500" height="24" rx="12" fill="#e0e7ff" stroke="#1f2937" stroke-width="1"/><text x="550" y="520" text-anchor="middle" font-size="12" font-weight="700">correlation does not prove causation: controlled trials are needed</text></g>
</svg>