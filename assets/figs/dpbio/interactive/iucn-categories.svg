<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 640" class="vd-svg" role="img" aria-labelledby="iu-title iu-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="iu-play" data-vd-play-label="Play: the risk scale" data-vd-steps="[[0, &quot;The IUCN Red List: categories of extinction risk.&quot;], [1, &quot;From least to most risk: Least Concern, Near Threatened, then the three threatened categories.&quot;], [4.5, &quot;Then Extinct in the Wild and Extinct.&quot;], [6.5, &quot;Data Deficient and Not Evaluated are outside the scale.&quot;], [8.5, &quot;Categories are set by criteria such as how fast the population is falling.&quot;], [11, &quot;Conservation can move species to a lower-risk category.&quot;]]" data-vd-dur="14">
<title id="iu-title">IUCN Red List categories</title><desc id="iu-desc">The IUCN Red List categories from Least Concern through Near Threatened, Vulnerable, Endangered and Critically Endangered to Extinct in the Wild and Extinct, plus Data Deficient and Not Evaluated, with decline thresholds and examples.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1220" height="640" fill="#ffffff"/>
<g aria-hidden="true"><animate id="iu-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<defs><marker id="iu-475569" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="7.2" refY="8.0" orient="auto"><path d="M0,0 L16,8.0 L0,16 z" fill="#475569"/></marker><marker id="iu-16a34a" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="7.2" refY="8.0" orient="auto"><path d="M0,0 L16,8.0 L0,16 z" fill="#16a34a"/></marker></defs>
<text class="head" x="30" y="34">IUCN Red List categories</text><text class="note" x="30" y="56">International Union for Conservation of Nature.</text>
<g class="part" data-part="low" data-name="Near Threatened (NT), Least Concern (LC)" data-info="Evaluated and not currently threatened; NT is close to qualifying." tabindex="0" role="button" aria-label="Near Threatened (NT), Least Concern (LC)"><g><animate attributeName="opacity" keyTimes="0.0000;0.0714;0.0929;1.0000" values="0;0;1;1" dur="14s" begin="iu-play.begin+0s" fill="freeze"/><circle cx="140" cy="230" r="46" fill="#16a34a" stroke="#fff" stroke-width="4"/><text x="140" y="240" text-anchor="middle" font-size="24" font-weight="800" fill="#fff">LC</text><text x="140" y="300" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">Least Concern</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.1429;0.1643;1.0000" values="0;0;1;1" dur="14s" begin="iu-play.begin+0s" fill="freeze"/><circle cx="280" cy="230" r="46" fill="#84cc16" stroke="#fff" stroke-width="4"/><text x="280" y="240" text-anchor="middle" font-size="24" font-weight="800" fill="#111827">NT</text><text x="280" y="300" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">Near Threatened</text></g></g>
<g class="part" data-part="thr" data-name="Threatened: CR, EN, VU" data-info="Critically Endangered, Endangered and Vulnerable: high, very high or extremely high risk of extinction in the wild." tabindex="0" role="button" aria-label="Threatened: CR, EN, VU"><g><animate attributeName="opacity" keyTimes="0.0000;0.2143;0.2357;1.0000" values="0;0;1;1" dur="14s" begin="iu-play.begin+0s" fill="freeze"/><circle cx="420" cy="230" r="46" fill="#facc15" stroke="#fff" stroke-width="4"/><text x="420" y="240" text-anchor="middle" font-size="24" font-weight="800" fill="#111827">VU</text><text x="420" y="300" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">Vulnerable</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.2500;0.2714;1.0000" values="0;0;1;1" dur="14s" begin="iu-play.begin+0s" fill="freeze"/><circle cx="560" cy="230" r="46" fill="#f97316" stroke="#fff" stroke-width="4"/><text x="560" y="240" text-anchor="middle" font-size="24" font-weight="800" fill="#fff">EN</text><text x="560" y="300" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">Endangered</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.2857;0.3071;1.0000" values="0;0;1;1" dur="14s" begin="iu-play.begin+0s" fill="freeze"/><circle cx="700" cy="230" r="46" fill="#dc2626" stroke="#fff" stroke-width="4"/><text x="700" y="240" text-anchor="middle" font-size="24" font-weight="800" fill="#fff">CR</text><text x="700" y="300" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">Critically Endangered</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.3000;0.3214;1.0000" values="0;0;1;1" dur="14s" begin="iu-play.begin+0s" fill="freeze"/><path d="M 370 160 L 370 148 L 750 148 L 750 160" fill="none" stroke="#b91c1c" stroke-width="3"/><text x="560" y="138" text-anchor="middle" font-size="14" font-weight="800" fill="#b91c1c">THREATENED</text></g></g>
<g class="part" data-part="ex" data-name="Extinct (EX), Extinct in the Wild (EW)" data-info="EX: no individuals left. EW: survives only in captivity or cultivation, e.g. the Socorro dove." tabindex="0" role="button" aria-label="Extinct (EX), Extinct in the Wild (EW)"><g><animate attributeName="opacity" keyTimes="0.0000;0.3571;0.3786;1.0000" values="0;0;1;1" dur="14s" begin="iu-play.begin+0s" fill="freeze"/><circle cx="840" cy="230" r="46" fill="#7e22ce" stroke="#fff" stroke-width="4"/><text x="840" y="240" text-anchor="middle" font-size="24" font-weight="800" fill="#fff">EW</text><text x="840" y="300" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">Extinct in the Wild</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.3929;0.4143;1.0000" values="0;0;1;1" dur="14s" begin="iu-play.begin+0s" fill="freeze"/><circle cx="980" cy="230" r="46" fill="#111827" stroke="#fff" stroke-width="4"/><text x="980" y="240" text-anchor="middle" font-size="24" font-weight="800" fill="#fff">EX</text><text x="980" y="300" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">Extinct</text></g></g>
<g><animate attributeName="opacity" keyTimes="0.0000;0.0714;0.0929;1.0000" values="0;0;1;1" dur="14s" begin="iu-play.begin+0s" fill="freeze"/><path d="M 100 340 L 1020 340" stroke="#475569" stroke-width="4" marker-end="url(#iu-475569)"/><text x="560.0" y="364" text-anchor="middle" font-size="13" font-weight="800" fill="#334155">increasing risk of extinction</text></g>
<g class="part" data-part="dd" data-name="Data Deficient (DD), Not Evaluated (NE)" data-info="DD: not enough information to judge the risk. NE: not yet assessed." tabindex="0" role="button" aria-label="Data Deficient (DD), Not Evaluated (NE)"><g><animate attributeName="opacity" keyTimes="0.0000;0.4643;0.4857;1.0000" values="0;0;1;1" dur="14s" begin="iu-play.begin+0s" fill="freeze"/><g transform="translate(1110 170)"><circle cx="0" cy="0" r="34" fill="#fff" stroke="#94a3b8" stroke-width="3"/><text x="0" y="7" text-anchor="middle" font-size="18" font-weight="800" fill="#64748b">DD</text><text x="0" y="50" text-anchor="middle" font-size="11" font-weight="800" fill="#475569">Data Deficient</text><circle cx="0" cy="110" r="34" fill="#fff" stroke="#cbd5e1" stroke-width="3" stroke-dasharray="5 4"/><text x="0" y="117" text-anchor="middle" font-size="18" font-weight="800" fill="#94a3b8">NE</text><text x="0" y="160" text-anchor="middle" font-size="11" font-weight="800" fill="#475569">Not Evaluated</text></g></g></g>
<g class="part" data-part="crit" data-name="Criterion A: population decline" data-info="Decline over 10 years or 3 generations (whichever is longer), where the causes have not stopped: CR ≥ 80%, EN ≥ 50%, VU ≥ 30%. Other criteria use range size and numbers of mature individuals." tabindex="0" role="button" aria-label="Criterion A: population decline"><g><animate attributeName="opacity" keyTimes="0.0000;0.6071;0.6286;1.0000" values="0;0;1;1" dur="14s" begin="iu-play.begin+0s" fill="freeze"/><rect x="40" y="400" width="560" height="210" rx="16" fill="#fef2f2" stroke="#fca5a5"/><text x="320" y="428" text-anchor="middle" font-size="15" font-weight="800" fill="#991b1b">Criterion A: population decline</text><text x="320" y="450" text-anchor="middle" font-size="12" font-weight="700" fill="#475569">over 10 years or 3 generations, causes not stopped</text><text x="70" y="498" text-anchor="start" font-size="15" font-weight="800" fill="#111827">VU</text><rect x="110" y="478" width="400" height="28" rx="6" fill="#fff" stroke="#e5e7eb"/><rect x="110" y="478" width="0" height="28" rx="6" fill="#facc15"><animate attributeName="width" keyTimes="0.0000;0.6071;0.6786;1.0000" values="0;0;120;120" dur="14s" begin="iu-play.begin+0s" fill="freeze"/></rect><text x="522" y="498" text-anchor="start" font-size="14" font-weight="800" fill="#111827">≥ 30%</text><text x="70" y="540" text-anchor="start" font-size="15" font-weight="800" fill="#111827">EN</text><rect x="110" y="520" width="400" height="28" rx="6" fill="#fff" stroke="#e5e7eb"/><rect x="110" y="520" width="0" height="28" rx="6" fill="#f97316"><animate attributeName="width" keyTimes="0.0000;0.6357;0.7071;1.0000" values="0;0;200;200" dur="14s" begin="iu-play.begin+0s" fill="freeze"/></rect><text x="522" y="540" text-anchor="start" font-size="14" font-weight="800" fill="#111827">≥ 50%</text><text x="70" y="582" text-anchor="start" font-size="15" font-weight="800" fill="#111827">CR</text><rect x="110" y="562" width="400" height="28" rx="6" fill="#fff" stroke="#e5e7eb"/><rect x="110" y="562" width="0" height="28" rx="6" fill="#dc2626"><animate attributeName="width" keyTimes="0.0000;0.6643;0.7357;1.0000" values="0;0;320;320" dur="14s" begin="iu-play.begin+0s" fill="freeze"/></rect><text x="522" y="582" text-anchor="start" font-size="14" font-weight="800" fill="#111827">≥ 80%</text></g></g>
<g class="part" data-part="eg" data-name="Real changes" data-info="Conservation can move species down the list: giant panda Endangered → Vulnerable (2016); mountain gorilla Critically Endangered → Endangered (2018)." tabindex="0" role="button" aria-label="Real changes"><g><animate attributeName="opacity" keyTimes="0.0000;0.7857;0.8071;1.0000" values="0;0;1;1" dur="14s" begin="iu-play.begin+0s" fill="freeze"/><rect x="630" y="400" width="560" height="210" rx="16" fill="#f0fdf4" stroke="#86efac"/><text x="910" y="428" text-anchor="middle" font-size="15" font-weight="800" fill="#166534">Conservation success: moving down the list</text><circle cx="720" cy="490" r="24" fill="#f97316"/><text x="720" y="497" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">EN</text><path d="M 752 490 L 818 490" stroke="#16a34a" stroke-width="4" marker-end="url(#iu-16a34a)"/><circle cx="850" cy="490" r="24" fill="#facc15"/><text x="850" y="497" text-anchor="middle" font-size="14" font-weight="800" fill="#111827">VU</text><text x="890" y="486" text-anchor="start" font-size="13" font-weight="800" fill="#111827">giant panda (2016)</text><text x="890" y="504" text-anchor="start" font-size="11" font-weight="700" fill="#475569">habitat protection, reserves</text><circle cx="720" cy="560" r="24" fill="#dc2626"/><text x="720" y="567" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">CR</text><path d="M 752 560 L 818 560" stroke="#16a34a" stroke-width="4" marker-end="url(#iu-16a34a)"/><circle cx="850" cy="560" r="24" fill="#f97316"/><text x="850" y="567" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">EN</text><text x="890" y="556" text-anchor="start" font-size="13" font-weight="800" fill="#111827">mountain gorilla (2018)</text><text x="890" y="574" text-anchor="start" font-size="11" font-weight="700" fill="#475569">anti-poaching, ecotourism</text></g></g>
</svg>