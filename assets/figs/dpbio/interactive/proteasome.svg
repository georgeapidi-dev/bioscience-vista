<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" class="vd-svg" role="img" aria-labelledby="pt-title pt-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="pt-play" data-vd-play-label="Play: recycle" data-vd-steps="[[0, &quot;Proteasomes: the cell&#x27;s recycling machines.&quot;], [1, &quot;A faulty protein is tagged with ubiquitin.&quot;], [4, &quot;The proteasome unfolds it and chops it into short peptides.&quot;], [8.5, &quot;Peptides are hydrolysed to amino acids and reused.&quot;]]" data-vd-dur="13">
<title id="pt-title">Proteasomes</title><desc id="pt-desc">A misfolded protein is tagged with ubiquitin, enters the barrel-shaped proteasome and leaves as short peptides that are hydrolysed into amino acids for reuse.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="520" fill="#ffffff"/>
<g aria-hidden="true"><animate id="pt-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<text class="head" x="30" y="34">Proteasomes: breaking down proteins</text><text class="note" x="30" y="56">Schematic.</text>
<g class="part" data-part="tag" data-name="Ubiquitin tags" data-info="Damaged, misfolded or unneeded proteins are tagged with chains of ubiquitin." tabindex="0" role="button" aria-label="Ubiquitin tags"><g transform="translate(180 260)"><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.3077;0.4615;1.0000" values="180 260;180 260;520 260;520 260" dur="13s" begin="pt-play.begin+0s" fill="freeze"/><g><animate attributeName="opacity" keyTimes="0.0000;0.4615;0.4846;1.0000" values="1;1;0;0" dur="13s" begin="pt-play.begin+0s" fill="freeze"/><path d="M -60 0 C -40 -50 0 40 20 -20 C 40 -60 60 30 80 -10" fill="none" stroke="#f97316" stroke-width="10" stroke-linecap="round"/></g></g><g><animate attributeName="opacity" keyTimes="0.0000;0.0769;0.1000;0.3308;0.3538;1.0000" values="0;0;1;1;0;0" dur="13s" begin="pt-play.begin+0s" fill="freeze"/><circle cx="110" cy="230" r="9" fill="#a78bfa" stroke="#5b21b6"/><circle cx="90" cy="218" r="9" fill="#a78bfa" stroke="#5b21b6"/><circle cx="70" cy="206" r="9" fill="#a78bfa" stroke="#5b21b6"/><circle cx="50" cy="194" r="9" fill="#a78bfa" stroke="#5b21b6"/><text x="90" y="170" text-anchor="middle" font-size="12" font-weight="800" fill="#6d28d9">ubiquitin chain</text></g><text x="180" y="330" text-anchor="middle" font-size="12" font-weight="800" fill="#c2410c">misfolded protein</text></g>
<g class="part" data-part="prot" data-name="Proteasome" data-info="A large barrel-shaped protein complex that unfolds tagged proteins and breaks them into short peptides." tabindex="0" role="button" aria-label="Proteasome"><rect x="470" y="180" width="140" height="160" rx="30" fill="#cbd5e1" stroke="#334155" stroke-width="3"/><line x1="470" y1="200" x2="610" y2="200" stroke="#94a3b8" stroke-width="2"/><line x1="470" y1="228" x2="610" y2="228" stroke="#94a3b8" stroke-width="2"/><line x1="470" y1="256" x2="610" y2="256" stroke="#94a3b8" stroke-width="2"/><line x1="470" y1="284" x2="610" y2="284" stroke="#94a3b8" stroke-width="2"/><line x1="470" y1="312" x2="610" y2="312" stroke="#94a3b8" stroke-width="2"/><text x="540" y="370" text-anchor="middle" font-size="14" font-weight="800" fill="#111827">proteasome</text></g>
<g class="part" data-part="rec" data-name="Recycling" data-info="Peptides are hydrolysed to amino acids, reused for new protein synthesis. The proteome is maintained by constant synthesis and breakdown." tabindex="0" role="button" aria-label="Recycling"><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.5000;0.5154;0.6923;0.7077;1.0000" values="0;0;1;1;0;0" dur="13s" begin="pt-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.5000;0.6154;1.0000" values="610 260;610 260;700 200;700 200" dur="13s" begin="pt-play.begin+0s" fill="freeze"/><circle cx="-14.7" cy="0" r="7" fill="#fdba74" stroke="#c2410c" stroke-width="1.5"/><circle cx="0.0" cy="0" r="7" fill="#fdba74" stroke="#c2410c" stroke-width="1.5"/><circle cx="14.7" cy="0" r="7" fill="#fdba74" stroke="#c2410c" stroke-width="1.5"/></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.5231;0.5385;0.7154;0.7308;1.0000" values="0;0;1;1;0;0" dur="13s" begin="pt-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.5231;0.6385;1.0000" values="610 260;610 260;770 200;770 200" dur="13s" begin="pt-play.begin+0s" fill="freeze"/><circle cx="-14.7" cy="0" r="7" fill="#fdba74" stroke="#c2410c" stroke-width="1.5"/><circle cx="0.0" cy="0" r="7" fill="#fdba74" stroke="#c2410c" stroke-width="1.5"/><circle cx="14.7" cy="0" r="7" fill="#fdba74" stroke="#c2410c" stroke-width="1.5"/></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.5462;0.5615;0.7385;0.7538;1.0000" values="0;0;1;1;0;0" dur="13s" begin="pt-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.5462;0.6615;1.0000" values="610 260;610 260;840 200;840 200" dur="13s" begin="pt-play.begin+0s" fill="freeze"/><circle cx="-14.7" cy="0" r="7" fill="#fdba74" stroke="#c2410c" stroke-width="1.5"/><circle cx="0.0" cy="0" r="7" fill="#fdba74" strok