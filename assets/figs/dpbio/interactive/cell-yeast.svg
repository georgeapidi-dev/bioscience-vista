<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 600" class="vd-svg" role="img" aria-labelledby="ye-title ye-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1">
<title id="ye-title">A yeast cell (fungus)</title><desc id="ye-desc">A yeast cell with a chitin cell wall, membrane, nucleus and nucleolus, vacuole, mitochondria, endoplasmic reticulum, glycogen granules and a bud.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="600" fill="#ffffff"/>
<text class="head" x="30" y="36">Fungal cell: yeast</text><text class="note" x="30" y="58">About 5 µm across. Eukaryotic: has a nucleus and membrane-bound organelles; no chloroplasts.</text>
<g class="part" data-part="wall" data-name="Cell wall (chitin)" data-info="Fungal cell walls are made of chitin, not cellulose." tabindex="0" role="button" aria-label="Cell wall (chitin)"><ellipse cx="500" cy="320" rx="220" ry="180" fill="#fde68a" stroke="#854d0e" stroke-width="3"/><ellipse cx="772" cy="230" rx="78" ry="62" fill="#fde68a" stroke="#854d0e" stroke-width="3"/></g>
<g class="part" data-part="mem" data-name="Cell membrane" data-info="Controls what enters and leaves the cell." tabindex="0" role="button" aria-label="Cell membrane"><ellipse cx="500" cy="320" rx="206" ry="166" fill="#fffbeb" stroke="#be185d" stroke-width="3"/><ellipse cx="772" cy="230" rx="66" ry="50" fill="#fffbeb" stroke="#be185d" stroke-width="3"/></g>
<g class="part" data-part="cyt" data-name="Cytoplasm" data-info="Site of anaerobic respiration (fermentation) and many other reactions." tabindex="0" role="button" aria-label="Cytoplasm"><rect x="690" y="236" width="40" height="40" fill="#fffbeb"/></g>
<g class="part" data-part="bud" data-name="Bud" data-info="Yeast reproduces asexually by budding: a small new cell grows out and separates." tabindex="0" role="button" aria-label="Bud"><circle cx="780" cy="226" r="16" fill="#ede9fe" stroke="#5b21b6" stroke-width="2"/></g>
<g class="part" data-part="vac" data-name="Vacuole" data-info="Stores substances; fungal cells often have a large vacuole." tabindex="0" role="button" aria-label="Vacuole"><ellipse cx="580" cy="370" rx="80" ry="60" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2.5"/></g>
<g class="part" data-part="nuc" data-name="Nucleus" data-info="Contains linear chromosomes with histones." tabindex="0" role="button" aria-label="Nucleus"><circle cx="430" cy="280" r="58" fill="#ede9fe" stroke="#5b21b6" stroke-width="3"/></g>
<g class="part" data-part="nucl" data-name="Nucleolus" data-info="Makes ribosomes." tabindex="0" role="button" aria-label="Nucleolus"><circle cx="415" cy="290" r="18" fill="#6d28d9"/></g>
<g class="part" data-part="mito" data-name="Mitochondria" data-info="Aerobic respiration when oxygen is available." tabindex="0" role="button" aria-label="Mitochondria"><g transform="translate(360 400) rotate(20)"><ellipse rx="30" ry="13" fill="#fdba74" stroke="#9a3412" stroke-width="2"/><path d="M -16 -8 L -14 8 M -2 -10 L 0 10 M 12 -8 L 14 8" stroke="#9a3412" stroke-width="1.6"/></g><g transform="translate(620 240) rotate(-15)"><ellipse rx="30" ry="13" fill="#fdba74" stroke="#9a3412" stroke-width="2"/><path d="M -16 -8 L -14 8 M -2 -10 L 0 10 M 12 -8 L 14 8" stroke="#9a3412" stroke-width="1.6"/></g><g transform="translate(470 440) rotate(0)"><ellipse rx="30" ry="13" fill="#fdba74" stroke="#9a3412" stroke-width="2"/><path d="M -16 -8 L -14 8 M -2 -10 L 0 10 M 12 -8 L 14 8" stroke="#9a3412" stroke-width="1.6"/></g></g>
<g class="part" data-part="er" data-name="Endoplasmic reticulum" data-info="Membranes that make and transport proteins and lipids." tabindex="0" role="button" aria-label="Endoplasmic reticulum"><path d="M 510 220 C 540 210 560 230 590 222 M 512 234 C 540 226 560 246 590 238" fill="none" stroke="#b45309" stroke-width="3"/></g>
<g class="part" data-part="gly" data-name="Glycogen granules" data-info="Fungi store carbohydrate as glycogen (like animals), not starch." tabindex="0" role="button" aria-label="Glycogen granules"><circle cx="380" cy="200" r="5" fill="#a8a29e"/><circle cx="520" cy="300" r="5" fill="#a8a29e"/><circle cx="660" cy="300" r="5" fill="#a8a29e"/><circle cx="420" cy="360" r="5" fill="#a8a29e"/><circle cx="540" cy="450" r="5" fill="#a8a29e"/><circle cx="300" cy="330" r="5" fill="#a8a29e"/></g>
<g class="labels"><g class="lbl" data-for="wall"><polyline points="191.6,314.0 290.0,320.0"/><circle cx="290.0" cy="320.0" r="2.6"/><text x="30" y="320" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="4">Cell wall (chitin)</text></g><g class="lbl" data-for="mem"><polyline points="148.1,244.0 300.0,250.0"/><circle cx="300.0" cy="250.0" r="2.6"/><text x="30" y="250" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="4">Cell membrane</text></g><g class="lbl" data-for="cyt"><polyline points="113.3,434.0 330.0,440.0"/><circle cx="330.0" cy="440.0" r="2.6"/><text x="30" y="440" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="4">Cytoplasm</text></g><g class="lbl" data-for="nuc"><polyline points="95.9,164.0 400.0,236.0"/><circle cx="400.0" cy="236.0" r="2.6"/><text x="30" y="170" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="4">Nucleus</text></g><g class="lbl" data-for="nucl"><polyline points="113.3,374.0 250.0,380.0 415.0,290.0"/><circle cx="415.0" cy="290.0" r="2.6"/><text x="30" y="380" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="4">Nucleolus</text></g><g class="lbl" data-for="gly"><polyline points="182.9,504.0 240.0,510.0 300.0,330.0"/><circle cx="300.0" cy="330.0" r="2.6"/><text x="30" y="510" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="4">Glycogen granules</text></g><g class="lbl" data-for="bud"><polyline points="1038.9,164.0 820.0,226.0"/><circle cx="820.0" cy="226.0" r="2.6"/><text x="1070" y="170" text-anchor="end" paint-order="stroke" stroke="#fff" stroke-width="4">Bud</text></g><g class="lbl" data-for="er"><polyline points="882.3,254.0 590.0,230.0"/><circle cx="590.0" cy="230.0" r="2.6"/><text x="1070" y="260" text-anchor="end" paint-order="stroke" stroke="#fff" stroke-width="4">Endoplasmic reticulum</text></g><g class="lbl" data-for="mito"><polyline points="960.6,314.0 640.0,236.0"/><circle cx="640.0" cy="236.0" r="2.6"/><text x="1070" y="320" text-anchor="end" paint-order="stroke" stroke="#fff" stroke-width="4">Mitochondria</text></g><g class="lbl" data-for="vac"><polyline points="1004.1,394.0 650.0,380.0"/><circle cx="650.0" cy="380.0" r="2.6"/><text x="1070" y="400" text-anchor="end" paint-order="stroke" stroke="#fff" stroke-width="4">Vacuole</text></g><g class="lbl" data-for="mito"><polyline points="951.9,474.0 470.0,452.0"/><circle cx="470.0" cy="452.0" r="2.6"/><text x="1070" y="480" text-anchor="end" paint-order="stroke" stroke="#fff" stroke-width="4">Mitochondrion</text></g></g>
</svg>