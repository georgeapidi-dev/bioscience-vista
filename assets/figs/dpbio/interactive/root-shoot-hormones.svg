<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 580" class="vd-svg" role="img" aria-labelledby="rs-title rs-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="rs-play" data-vd-play-label="Play: send signals" data-vd-steps="[[0, &quot;Keeping roots and shoots in balance.&quot;], [1, &quot;Root tips make cytokinin: it travels up in the xylem to the shoot.&quot;], [5, &quot;Shoot tips make auxin: it travels down to the roots.&quot;], [9, &quot;Each part stimulates the other, so growth stays integrated.&quot;]]" data-vd-dur="13">
<title id="rs-title">Auxin and cytokinin</title><desc id="rs-desc">Cytokinin made in root tips moves up in the xylem to stimulate shoot growth, and auxin made in shoot tips moves down to stimulate root growth, keeping root and shoot growth balanced.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="580" fill="#ffffff"/>
<g aria-hidden="true"><animate id="rs-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<text class="head" x="30" y="34">Balancing roots and shoots: auxin and cytokinin</text><text class="note" x="30" y="56">Schematic.</text>
<rect x="40" y="330" width="680" height="240" fill="#a16207" opacity=".25"/><path d="M 380 330 L 380 110" stroke="#16a34a" stroke-width="12"/><path d="M 380 200 q 80 -30 120 10 q --60 10 --120 -10" fill="#4ade80" stroke="#15803d" stroke-width="2"/><path d="M 380 250 q -80 -30 -120 10 q -60 10 -120 -10" fill="#4ade80" stroke="#15803d" stroke-width="2"/><path d="M 380 300 q 80 -30 120 10 q --60 10 --120 -10" fill="#4ade80" stroke="#15803d" stroke-width="2"/><path d="M 380 330 Q 284.0 400 220 540" fill="none" stroke="#92400e" stroke-width="5"/><path d="M 380 330 Q 332.0 400 300 540" fill="none" stroke="#92400e" stroke-width="5"/><path d="M 380 330 Q 380.0 400 380 540" fill="none" stroke="#92400e" stroke-width="5"/><path d="M 380 330 Q 428.0 400 460 540" fill="none" stroke="#92400e" stroke-width="5"/><path d="M 380 330 Q 476.0 400 540 540" fill="none" stroke="#92400e" stroke-width="5"/>
<g class="part" data-part="ck" data-name="Cytokinin" data-info="Made in root tips, carried in the xylem to the shoots: stimulates shoot growth." tabindex="0" role="button" aria-label="Cytokinin"><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.0769;0.0923;0.3308;0.3462;1.0000" values="0;0;1;1;0;0" dur="13s" begin="rs-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.0769;0.3077;1.0000" values="300 530;300 530;380 130;380 130" dur="13s" begin="rs-play.begin+0s" fill="freeze"/><circle r="7" fill="#3b82f6" stroke="#1e3a8a"/></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.1077;0.1231;0.3615;0.3769;1.0000" values="0;0;1;1;0;0" dur="13s" begin="rs-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.1077;0.3385;1.0000" values="340 530;340 530;380 130;380 130" dur="13s" begin="rs-play.begin+0s" fill="freeze"/><circle r="7" fill="#3b82f6" stroke="#1e3a8a"/></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.1385;0.1538;0.3923;0.4077;1.0000" values="0;0;1;1;0;0" dur="13s" begin="rs-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.1385;0.3692;1.0000" values="380 530;380 530;380 130;380 130" dur="13s" begin="rs-play.begin+0s" fill="freeze"/><circle r="7" fill="#3b82f6" stroke="#1e3a8a"/></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.1692;0.1846;0.4231;0.4385;1.0000" values="0;0;1;1;0;0" dur="13s" begin="rs-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.1692;0.4000;1.0000" values="420 530;420 530;380 130;380 130" dur="13s" begin="rs-play.begin+0s" fill="freeze"/><circle r="7" fill="#3b82f6" stroke="#1e3a8a"/></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.2000;0.2154;0.4538;0.4692;1.0000" values="0;0;1;1;0;0" dur="13s" begin="rs-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.2000;0.4308;1.0000" values="460 530;460 530;380 130;380 130" dur="13s" begin="rs-play.begin+0s" fill="freeze"/><circle r="7" fill="#3b82f6" stroke="#1e3a8a"/></g></g><g><animate attributeName="opacity" keyTimes="0.0000;0.0769;0.1000;1.0000" values="0;0;1;1" dur="13s" begin="rs-play.begin+0s" fill="freeze"/><text x="470" y="470" text-anchor="start" font-size="12" font-weight="800" fill="#1d4ed8">cytokinin (made in root tips) → up in xylem</text></g></g>
<g class="part" data-part="aux" data-name="Auxin" data-info="Made in shoot tips, carried down to the roots: stimulates root growth." tabindex="0" role="button" aria-label="Auxin"><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.3846;0.4000;0.6385;0.6538;1.0000" values="0;0;1;1;0;0" dur="13s" begin="rs-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.3846;0.6154;1.0000" values="380 120;380 120;300 530;300 530" dur="13s" begin="rs-play.begin+0s" fill="freeze"/><circle r="7" fill="#f59e0b" stroke="#92400e"/></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.4154;0.4308;0.6692;0.6846;1.0000" values="0;0;1;1;0;0" dur="13s" begin="rs-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.4154;0.6462;1.0000" values="380 120;380 120;340 530;340 530" dur="13s" begin="rs-play.begin+0s" fill="freeze"/><circle r="7" fill="#f59e0b" stroke="#92400e"/></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.4462;0.4615;0.7000;0.7154;1.0000" values="0;0;1;1;0;0" dur="13s" begin="rs-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.4462;0.6769;1.0000" values="380 120;380 120;380 530;380 530" dur="13s" begin="rs-play.begin+0s" fill="freeze"/><circle r="7" fill="#f59e0b" stroke="#92400e"/></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.4769;0.4923;0.7308;0.7462;1.0000" values="0;0;1;1;0;0" dur="13s" begin="rs-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.4769;0.7077;1.0000" values="380 120;380 120;420 530;420 530" dur="13s" begin="rs-play.begin+0s" fill="freeze"/><circle r="7" fill="#f59e0b" stroke="#92400e"/></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.5077;0.5231;0.7615;0.7769;1.0000" values="0;0;1;1;0;0" dur="13s" begin="rs-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.5077;0.7385;1.0000" values="380 120;380 120;460 530;460 530" dur="13s" begin="rs-play.begin+0s" fill="freeze"/><circle r="7" fill="#f59e0b" stroke="#92400e"/></g></g><g><animate attributeName="opacity" keyTimes="0.0000;0.3846;0.4077;1.0000" values="0;0;1;1" dur="13s" begin="rs-play.begin+0s" fill="freeze"/><text x="420" y="110" text-anchor="start" font-size="12" font-weight="800" fill="#b45309">auxin (made in shoot tip) → down to roots</text></g></g>
<g class="part" data-part="bal" data-name="A balance" data-info="A large root system sends more cytokinin, stimulating the shoot; a large shoot sends more auxin, stimulating roots. High auxin:cytokinin favours roots; high cytokinin:auxin favours shoots (used in tissue culture)." tabindex="0" role="button" aria-label="A balance"><g><animate attributeName="opacity" keyTimes="0.0000;0.6923;0.7154;1.0000" values="0;0;1;1" dur="13s" begin="rs-play.begin+0s" fill="freeze"/><rect x="760" y="140" width="310" height="270" rx="16" fill="#f8fafc" stroke="#cbd5e1"/><text x="915" y="168" text-anchor="middle" font-size="14" font-weight="800" fill="#111827">the balance</text><text x="915" y="204" text-anchor="middle" font-size="12" font-weight="800" fill="#1d4ed8">big roots → more cytokinin</text><text x="915" y="222" text-anchor="middle" font-size="12" font-weight="800" fill="#1d4ed8">→ shoot grows</text><text x="915" y="260" text-anchor="middle" font-size="12" font-weight="800" fill="#b45309">big shoot → more auxin</text><text x="915" y="278" text-anchor="middle" font-size="12" font-weight="800" fill="#b45309">→ roots grow</text><text x="915" y="320" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">tissue culture:</text><text x="915" y="340" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">high auxin : cytokinin → roots</text><text x="915" y="358" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">high cytokinin : auxin → shoots</text></g></g>
</svg>