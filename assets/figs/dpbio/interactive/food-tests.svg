<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" class="vd-svg" role="img" aria-labelledby="ft-title ft-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="ft-play" data-vd-play-label="Play: run the tests" data-vd-steps="[[0, &quot;The food tests.&quot;], [1, &quot;Each reagent changes colour if the nutrient is present.&quot;], [12, &quot;Always compare with a water control.&quot;]]" data-vd-dur="15">
<title id="ft-title">Food tests</title><desc id="ft-desc">Five test tubes showing positive results: iodine turns blue-black with starch, Benedict&#x27;s turns brick-red with reducing sugar on heating, biuret turns purple with protein, ethanol gives a cloudy white emulsion with fat, and DCPIP is decolourised by vitamin C.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="520" fill="#ffffff"/>
<g aria-hidden="true"><animate id="ft-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<text class="head" x="30" y="34">Food tests</text><text class="note" x="30" y="56">Positive results shown.</text>
<g class="part" data-part="t" data-name="Five food tests" data-info="Starch: iodine (blue-black). Reducing sugar: Benedict&#x27;s + heat in a water bath (green/yellow/brick-red). Protein: biuret (purple). Fat: ethanol emulsion (cloudy white). Vitamin C: DCPIP decolourised." tabindex="0" role="button" aria-label="Five food tests"><path d="M 107.0 100 L 107.0 320 A 23.0 23.0 0 0 0 153.0 320 L 153.0 100" fill="#f8fafc" stroke="#334155" stroke-width="2.5"/><rect x="109.0" y="200" width="42" height="140" fill="#c2410c"><animate attributeName="fill" keyTimes="0.0000;0.1000;0.1800;1.0000" values="#c2410c;#c2410c;#1e1b4b;#1e1b4b" dur="15s" begin="ft-play.begin+0s" fill="freeze"/></rect><text x="130" y="380" text-anchor="middle" font-size="15" font-weight="800" fill="#111827">starch</text><text x="130" y="402" text-anchor="middle" font-size="12" font-weight="700" fill="#475569">iodine solution</text><g><animate attributeName="opacity" keyTimes="0.0000;0.1800;0.2000;1.0000" values="0;0;1;1" dur="15s" begin="ft-play.begin+0s" fill="freeze"/><text x="130" y="430" text-anchor="middle" font-size="12" font-weight="800" fill="#15803d">orange-brown → blue-black</text></g><path d="M 317.0 100 L 317.0 320 A 23.0 23.0 0 0 0 363.0 320 L 363.0 100" fill="#f8fafc" stroke="#334155" stroke-width="2.5"/><rect x="319.0" y="200" width="42" height="140" fill="#2563eb"><animate attributeName="fill" keyTimes="0.0000;0.2333;0.3133;1.0000" values="#2563eb;#2563eb;#c2410c;#c2410c" dur="15s" begin="ft-play.begin+0s" fill="freeze"/></rect><text x="340" y="380" text-anchor="middle" font-size="15" font-weight="800" fill="#111827">reducing sugar</text><text x="340" y="402" text-anchor="middle" font-size="12" font-weight="700" fill="#475569">Benedict's, heat</text><g><animate attributeName="opacity" keyTimes="0.0000;0.3133;0.3333;1.0000" values="0;0;1;1" dur="15s" begin="ft-play.begin+0s" fill="freeze"/><text x="340" y="430" text-anchor="middle" font-size="12" font-weight="800" fill="#15803d">blue → brick-red</text></g><path d="M 527.0 100 L 527.0 320 A 23.0 23.0 0 0 0 573.0 320 L 573.0 100" fill="#f8fafc" stroke="#334155" stroke-width="2.5"/><rect x="529.0" y="200" width="42" height="140" fill="#60a5fa"><animate attributeName="fill" keyTimes="0.0000;0.3667;0.4467;1.0000" values="#60a5fa;#60a5fa;#7e22ce;#7e22ce" dur="15s" begin="ft-play.begin+0s" fill="freeze"/></rect><text x="550" y="380" text-anchor="middle" font-size="15" font-weight="800" fill="#111827">protein</text><text x="550" y="402" text-anchor="middle" font-size="12" font-weight="700" fill="#475569">biuret solution</text><g><animate attributeName="opacity" keyTimes="0.0000;0.4467;0.4667;1.0000" values="0;0;1;1" dur="15s" begin="ft-play.begin+0s" fill="freeze"/><text x="550" y="430" text-anchor="middle" font-size="12" font-weight="800" fill="#15803d">blue → purple</text></g><path d="M 737.0 100 L 737.0 320 A 23.0 23.0 0 0 0 783.0 320 L 783.0 100" fill="#f8fafc" stroke="#334155" stroke-width="2.5"/><rect x="739.0" y="200" width="42" height="140" fill="#e0f2fe"><animate attributeName="fill" keyTimes="0.0000;0.5000;0.5800;1.0000" values="#e0f2fe;#e0f2fe;#cbd5e1;#cbd5e1" dur="15s" begin="ft-play.begin+0s" fill="freeze"/></rect><text x="760" y="380" text-anchor="middle" font-size="15" font-weight="800" fill="#111827">fat</text><text x="760" y="402" text-anchor="middle" font-size="12" font-weight="700" fill="#475569">ethanol, then water</text><g><animate attributeName="opacity" keyTimes="0.0000;0.5800;0.6000;1.0000" values="0;0;1;1" dur="15s" begin="ft-play.begin+0s" fill="freeze"/><text x="760" y="430" text-anchor="middle" font-size="12" font-weight="800" fill="#15803d">clear → cloudy white</text></g><path d="M 947.0 100 L 947.0 320 A 23.0 23.0 0 0 0 993.0 320 L 993.0 100" fill="#f8fafc" stroke="#334155" stroke-width="2.5"/><rect x="949.0" y="200" width="42" height="140" fill="#1d4ed8"><animate attributeName="fill" keyTimes="0.0000;0.6333;0.7133;1.0000" values="#1d4ed8;#1d4ed8;#f8fafc;#f8fafc" dur="15s" begin="ft-play.begin+0s" fill="freeze"/></rect><text x="970" y="380" text-anchor="middle" font-size="15" font-weight="800" fill="#111827">vitamin C</text><text x="970" y="402" text-anchor="middle" font-size="12" font-weight="700" fill="#475569">DCPIP</text><g><animate attributeName="opacity" keyTimes="0.0000;0.7133;0.7333;1.0000" values="0;0;1;1" dur="15s" begin="ft-play.begin+0s" fill="freeze"/><text x="970" y="430" text-anchor="middle" font-size="12" font-weight="800" fill="#15803d">blue → colourless</text></g></g>
<g class="part" data-part="ctrl" data-name="Controls" data-info="Test water alone as a control to compare colours; use the same volumes; never heat with a flame directly if ethanol is near." tabindex="0" role="button" aria-label="Controls"><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.8000;0.8200;1.0000" values="0;0;1;1" dur="15s" begin="ft-play.begin+0s" fill="freeze"/><rect x="380.0" y="478" width="340" height="24" rx="12" fill="#fef3c7" stroke="#1f2937" stroke-width="1"/><text x="550" y="495" text-anchor="middle" font-size="12" font-weight="700">compare each with a water control</text></g></g>
</svg>