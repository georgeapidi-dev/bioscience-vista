<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 640" class="vd-svg" role="img" aria-labelledby="ez-title ez-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="ez-play" data-vd-play-label="Play: lock and key, induced fit and denaturation" data-vd-steps="[[0, &quot;The enzyme\u2019s active site has a shape complementary to its substrate. Molecules move about randomly and collide.&quot;], [2.5, &quot;The substrate collides with and fits into the active site, forming an enzyme\u2013substrate complex (the lock and key model).&quot;], [5, &quot;The enzyme lowers the activation energy, so the reaction happens quickly: here the substrate is split into two products.&quot;], [7.5, &quot;The products no longer fit and are released. The enzyme is unchanged and its active site is free for another substrate molecule.&quot;], [10, &quot;Induced fit: a better model. As the substrate binds, the active site changes shape slightly and moulds round it, holding it tightly and straining its bonds.&quot;], [13, &quot;Denaturation: at a high temperature (or extreme pH) the bonds that hold the enzyme\u2019s shape break. The active site changes shape permanently, the substrate no longer fits, and the reaction stops.&quot;]]" data-vd-dur="17">
<title id="ez-title">How enzymes work</title><desc id="ez-desc">An enzyme with an active site, a complementary substrate forming an enzyme-substrate complex, the products released, the induced fit model and a denatured enzyme whose active site has lost its shape.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="640" fill="#ffffff"/>
<g aria-hidden="true"><animate id="ez-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<text class="head" x="30" y="36">How enzymes work</text><text class="note" x="30" y="58">Shapes are simplified; real enzymes are folded protein chains thousands of times bigger than this drawing suggests.</text>
<g><g transform="translate(500 380)"><g><animateTransform attributeName="transform" type="scale" values="1 1;1 1;0.95 1;0.95 1;1 1;1 1" keyTimes="0;0.6353;0.6647;0.7176;0.7412;1" dur="17s" begin="ez-play.begin+0s"/><g transform="translate(-500 -380)"><g class="part" data-part="enz" data-name="Enzyme" data-info="A biological catalyst: a protein that speeds up a reaction without being used up. Its chain is folded into a specific 3D shape." tabindex="0" role="button" aria-label="Enzyme"><path d="M 300 330 C 300 270 360 250 450 250 L 465 300 L 485 300 A 15 15 0 0 0 515 300 L 535 300 L 550 250 C 640 250 700 270 700 330 C 700 440 640 500 500 500 C 360 500 300 440 300 330 Z" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="4"/><path d="M 340 360 C 380 330 420 420 470 380 C 520 340 560 440 620 400 C 650 380 660 340 640 320" fill="none" stroke="#60a5fa" stroke-width="3" opacity=".6"/></g><g class="part" data-part="site" data-name="Active site" data-info="The region of the enzyme where the substrate binds. Its shape is complementary to the substrate, so each enzyme is specific to one substrate (or a few)." tabindex="0" role="button" aria-label="Active site"><path d="M 450 250 L 465 300 L 485 300 A 15 15 0 0 0 515 300 L 535 300 L 550 250" fill="none" stroke="#dc2626" stroke-width="5"/></g></g></g></g><animate attributeName="opacity" keyTimes="0.0000;0.7647;0.8000;1.0000" values="1;1;0;0" dur="17s" begin="ez-play.begin+0s" fill="freeze"/></g>
<g class="part" data-part="den" data-name="Denatured enzyme" data-info="High temperature or extreme pH breaks the bonds holding the enzyme in shape. The active site changes shape permanently and the substrate can no longer fit." tabindex="0" role="button" aria-label="Denatured enzyme"><g opacity="0"><path d="M 300 330 C 300 270 360 250 440 260 C 470 300 470 320 500 300 C 520 280 540 320 560 260 C 640 250 700 270 700 330 C 700 440 640 500 500 500 C 360 500 300 440 300 330 Z" fill="#cbd5e1" stroke="#475569" stroke-width="4"/><path d="M 340 360 C 380 380 400 330 450 400 C 520 450 560 330 640 420" fill="none" stroke="#94a3b8" stroke-width="3"/><animate attributeName="opacity" keyTimes="0.0000;0.7647;0.8000;1.0000" values="0;0;1;1" dur="17s" begin="ez-play.begin+0s" fill="freeze"/></g></g>
<g class="part" data-part="sub" data-name="Substrate" data-info="The molecule the enzyme acts on. It fits the active site like a key in a lock." tabindex="0" role="button" aria-label="Substrate"><g transform="translate(180 150)"><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.1471;0.2235;1.0000" values="180 150;180 150;500 255;500 255" dur="17s" begin="ez-play.begin+0s" fill="freeze"/><animate attributeName="opacity" keyTimes="0.0000;0.3059;0.3176;1.0000" values="1;1;0;0" dur="17s" begin="ez-play.begin+0s" fill="freeze"/><path d="M -50 -45 L 50 -45 L 50 -5 L 35 45 L 15 45 A 15 15 0 0 1 -15 45 L -35 45 L -50 -5 Z" fill="#fde047" stroke="#a16207" stroke-width="3"/></g></g>
<g class="part" data-part="prod" data-name="Products" data-info="The molecules formed. They no longer fit the active site, so they are released." tabindex="0" role="button" aria-label="Products"><g opacity="0"><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.3118;0.4412;0.5588;1.0000" values="500 255;500 255;500 255;760 130;760 130" dur="17s" begin="ez-play.begin+0s" fill="freeze"/><animate attributeName="opacity" keyTimes="0.0000;0.3059;0.3176;0.5647;0.5882;1.0000" values="0;0;1;1;0;0" dur="17s" begin="ez-play.begin+0s" fill="freeze"/><path d="M -50 -45 L -2 -45 L -2 59 A 15 15 0 0 1 -15 45 L -35 45 L -50 -5 Z" fill="#fb923c" stroke="#9a3412" stroke-width="3"/></g><g opacity="0"><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.3118;0.4412;0.5588;1.0000" values="500 255;500 255;500 255;900 250;900 250" dur="17s" begin="ez-play.begin+0s" fill="freeze"/><animate attributeName="opacity" keyTimes="0.0000;0.3059;0.3176;0.5647;0.5882;1.0000" values="0;0;1;1;0;0" dur="17s" begin="ez-play.begin+0s" fill="freeze"/><path d="M 2 -45 L 50 -45 L 50 -5 L 35 45 L 15 45 A 15 15 0 0 1 2 59 Z" fill="#fb923c" stroke="#9a3412" stroke-width="3"/></g></g>
<g aria-hidden="true" pointer-events="none"><g opacity="0"><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.5882;0.6412;0.7294;0.7588;1.0000" values="180 150;180 150;500 255;500 255;180 120;180 120" dur="17s" begin="ez-play.begin+0s" fill="freeze"/><animate attributeName="opacity" keyTimes="0.0000;0.5882;0.5941;0.7529;0.7647;1.0000" values="0;0;1;1;0;0" dur="17s" begin="ez-play.begin+0s" fill="freeze"/><path d="M -50 -45 L 50 -45 L 50 -5 L 35 45 L 15 45 A 15 15 0 0 1 -15 45 L -35 45 L -50 -5 Z" fill="#fde047" stroke="#a16207" stroke-width="3"/></g><g opacity="0"><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.8000;0.8588;0.8941;0.9647;1.0000" values="180 150;180 150;500 190;500 190;220 110;220 110" dur="17s" begin="ez-play.begin+0s" fill="freeze"/><animate attributeName="opacity" keyTimes="0.0000;0.8000;0.8059;1.0000" values="0;0;1;1" dur="17s" begin="ez-play.begin+0s" fill="freeze"/><path d="M -50 -45 L 50 -45 L 50 -5 L 35 45 L 15 45 A 15 15 0 0 1 -15 45 L -35 45 L -50 -5 Z" fill="#fde047" stroke="#a16207" stroke-width="3"/></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.7765;0.8000;1.0000" values="0;0;1;1" dur="17s" begin="ez-play.begin+0s" fill="freeze"/><path d="M 380 600 q 10 -16 0 -32 t 0 -32" fill="none" stroke="#ef4444" stroke-width="4"/><path d="M 460 600 q 10 -16 0 -32 t 0 -32" fill="none" stroke="#ef4444" stroke-width="4"/><path d="M 540 600 q 10 -16 0 -32 t 0 -32" fill="none" stroke="#ef4444" stroke-width="4"/><path d="M 620 600 q 10 -16 0 -32 t 0 -32" fill="none" stroke="#ef4444" stroke-width="4"/><text x="500" y="540" text-anchor="middle" font-size="16" font-weight="700" fill="#b91c1c">high temperature: the enzyme is denatured</text></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.1471;0.2235;0.3059;0.3176;1.0000" values="0;0;1;1;0;0" dur="17s" begin="ez-play.begin+0s" fill="freeze"/><text x="760" y="300" font-size="16" font-weight="700" fill="#1d4ed8">enzyme–substrate complex</text></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.4471;0.4706;0.5647;0.5882;1.0000" values="0;0;1;1;0;0" dur="17s" begin="ez-play.begin+0s" fill="freeze"/><text x="560" y="300" font-size="15" font-weight="700" fill="#1d4ed8">enzyme unchanged: used again</text></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.6412;0.6588;0.7294;0.7471;1.0000" values="0;0;1;1;0;0" dur="17s" begin="ez-play.begin+0s" fill="freeze"/><text x="740" y="300" font-size="16" font-weight="700" fill="#7c3aed">induced fit: the site moulds round it</text></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.8588;0.8706;0.9176;0.9412;1.0000" values="0;0;1;1;0;0" dur="17s" begin="ez-play.begin+0s" fill="freeze"/><text x="620" y="190" font-size="16" font-weight="700" fill="#b91c1c">does not fit</text></g></g>
<g class="labels"><g class="lbl" data-for="enz"><polyline points="87.2,434.0 330.0,420.0"/><circle cx="330.0" cy="420.0" r="2.6"/><text x="30" y="440" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="4">Enzyme</text></g><g class="lbl" data-for="site"><polyline points="969.3,374.0 800.0,380.0 535.0,290.0"/><circle cx="535.0" cy="290.0" r="2.6"/><text x="1070" y="380" text-anchor="end" paint-order="stroke" stroke="#fff" stroke-width="4">Active site</text></g><g class="lbl" data-for="sub"><polyline points="113.3,134.0 130.0,140.0"/><circle cx="130.0" cy="140.0" r="2.6"/><text x="30" y="140" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="4">Substrate</text></g><g class="lbl" data-for="prod"><polyline points="995.4,194.0 900.0,230.0"/><circle cx="900.0" cy="230.0" r="2.6"/><text x="1070" y="200" text-anchor="end" paint-order="stroke" stroke="#fff" stroke-width="4">Products</text></g></g>
<g aria-hidden="true"><text x="550" y="626" text-anchor="middle" font-size="17" font-weight="700" fill="#1d4ed8" opacity="0">1  Complementary shapes<set attributeName="opacity" to="1" begin="ez-play.begin+0s" dur="2.5s"/></text><text x="550" y="626" text-anchor="middle" font-size="17" font-weight="700" fill="#1d4ed8" opacity="0">2  Enzyme–substrate complex<set attributeName="opacity" to="1" begin="ez-play.begin+2.5s" dur="2.5s"/></text><text x="550" y="626" text-anchor="middle" font-size="17" font-weight="700" fill="#1d4ed8" opacity="0">3  The reaction happens<set attributeName="opacity" to="1" begin="ez-play.begin+5s" dur="2.5s"/></text><text x="550" y="626" text-anchor="middle" font-size="17" font-weight="700" fill="#1d4ed8" opacity="0">4  Products released; enzyme reused<set attributeName="opacity" to="1" begin="ez-play.begin+7.5s" dur="2.5s"/></text><text x="550" y="626" text-anchor="middle" font-size="17" font-weight="700" fill="#1d4ed8" opacity="0">5  Induced fit<set attributeName="opacity" to="1" begin="ez-play.begin+10s" dur="3s"/></text><text x="550" y="626" text-anchor="middle" font-size="17" font-weight="700" fill="#1d4ed8" opacity="0">6  Denaturation: the active site loses its shape<set attributeName="opacity" to="1" begin="ez-play.begin+13s" dur="4s"/></text></g>
</svg>