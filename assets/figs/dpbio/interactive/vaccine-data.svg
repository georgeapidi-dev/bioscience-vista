<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 580" class="vd-svg" role="img" aria-labelledby="vd-title vd-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="vd-play" data-vd-play-label="Play: crunch the numbers" data-vd-steps="[[0, &quot;Calculating with COVID-19 data (illustrative, rounded).&quot;], [1, &quot;Percentage change: cases rose from 12 000 to 30 000 per week: +150%.&quot;], [6, &quot;Deaths per 100 000: 180 unvaccinated versus 20 vaccinated: 9 times higher.&quot;], [11, &quot;But check for confounding variables before concluding cause.&quot;]]" data-vd-dur="15">
<title id="vd-title">Working with vaccine data</title><desc id="vd-desc">Weekly cases rising from 12 000 to 30 000, a 150 percent increase, and deaths per 100 000 of 180 in unvaccinated and 20 in vaccinated adults, nine times higher, with confounding variables to consider.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="580" fill="#ffffff"/>
<g aria-hidden="true"><animate id="vd-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<text class="head" x="30" y="34">Calculating with COVID-19 data</text><text class="note" x="30" y="56">Illustrative data from the lesson.</text>
<g class="part" data-part="pc" data-name="Percentage change" data-info="(new − original) ÷ original × 100. Weekly cases rising from 12 000 to 30 000: (30 000 − 12 000) ÷ 12 000 × 100 = +150%." tabindex="0" role="button" aria-label="Percentage change"><line x1="90" y1="440" x2="490" y2="440" stroke="#111827" stroke-width="2"/><line x1="90" y1="440" x2="90" y2="140" stroke="#111827" stroke-width="2"/><text x="290.0" y="464" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">week</text><text x="90" y="130" text-anchor="start" font-size="12" font-weight="800" fill="#111827">weekly new cases</text><g><animate attributeName="opacity" keyTimes="0.0000;0.0667;0.0867;1.0000" values="0;0;1;1" dur="15s" begin="vd-play.begin+0s" fill="freeze"/><rect x="120" y="328" width="50" height="112" fill="#93c5fd" stroke="#1e3a8a"/><text x="145" y="454" text-anchor="middle" font-size="10" font-weight="700" fill="#475569">0</text><text x="145" y="319.5" text-anchor="middle" font-size="11" font-weight="800" fill="#111827">12,000</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.1000;0.1200;1.0000" values="0;0;1;1" dur="15s" begin="vd-play.begin+0s" fill="freeze"/><rect x="200" y="299" width="50" height="141" fill="#93c5fd" stroke="#1e3a8a"/><text x="225" y="454" text-anchor="middle" font-size="10" font-weight="700" fill="#475569">1</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.1333;0.1533;1.0000" values="0;0;1;1" dur="15s" begin="vd-play.begin+0s" fill="freeze"/><rect x="280" y="262" width="50" height="178" fill="#93c5fd" stroke="#1e3a8a"/><text x="305" y="454" text-anchor="middle" font-size="10" font-weight="700" fill="#475569">2</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.1667;0.1867;1.0000" values="0;0;1;1" dur="15s" begin="vd-play.begin+0s" fill="freeze"/><rect x="360" y="215" width="50" height="225" fill="#93c5fd" stroke="#1e3a8a"/><text x="385" y="454" text-anchor="middle" font-size="10" font-weight="700" fill="#475569">3</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.2000;0.2200;1.0000" values="0;0;1;1" dur="15s" begin="vd-play.begin+0s" fill="freeze"/><rect x="440" y="159" width="50" height="281" fill="#93c5fd" stroke="#1e3a8a"/><text x="465" y="454" text-anchor="middle" font-size="10" font-weight="700" fill="#475569">4</text><text x="465" y="150.75" text-anchor="middle" font-size="11" font-weight="800" fill="#111827">30,000</text></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.2667;0.2867;1.0000" values="0;0;1;1" dur="15s" begin="vd-play.begin+0s" fill="freeze"/><rect x="110.0" y="488" width="360" height="24" rx="12" fill="#dbeafe" stroke="#1f2937" stroke-width="1"/><text x="290" y="505" text-anchor="middle" font-size="12" font-weight="700">(30 000 − 12 000) ÷ 12 000 × 100 = +150%</text></g></g>
<g class="part" data-part="pd" data-name="Percentage difference" data-info="|A − B| ÷ ((A + B) ÷ 2) × 100. Deaths per 100 000: 180 unvaccinated vs 20 vaccinated: 160 ÷ 100 × 100 = 160%. The ratio is 9 times." tabindex="0" role="button" aria-label="Percentage difference"><line x1="640" y1="440" x2="1000" y2="440" stroke="#111827" stroke-width="2"/><text x="820" y="130" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">deaths per 100 000 adults</text><rect x="690" y="170" width="100" height="270" fill="#f87171" stroke="#334155"><animate attributeName="height" keyTimes="0.0000;0.4000;0.4667;1.0000" values="0;0;270.0;270.0" dur="15s" begin="vd-play.begin+0s" fill="freeze"/><animate attributeName="y" keyTimes="0.0000;0.4000;0.4667;1.0000" values="440;440;170.0;170.0" dur="15s" begin="vd-play.begin+0s" fill="freeze"/></rect><g><animate attributeName="opacity" keyTimes="0.0000;0.4667;0.4867;1.0000" values="0;0;1;1" dur="15s" begin="vd-play.begin+0s" fill="freeze"/><text x="740" y="162.0" text-anchor="middle" font-size="15" font-weight="800" fill="#111827">180</text></g><text x="740" y="460" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">unvaccinated</text><rect x="860" y="410" width="100" height="30" fill="#4ade80" stroke="#334155"><animate attributeName="height" keyTimes="0.0000;0.4667;0.5333;1.0000" values="0;0;30.0;30.0" dur="15s" begin="vd-play.begin+0s" fill="freeze"/><animate attributeName="y" keyTimes="0.0000;0.4667;0.5333;1.0000" values="440;440;410.0;410.0" dur="15s" begin="vd-play.begin+0s" fill="freeze"/></rect><g><animate attributeName="opacity" keyTimes="0.0000;0.5333;0.5533;1.0000" values="0;0;1;1" dur="15s" begin="vd-play.begin+0s" fill="freeze"/><text x="910" y="402.0" text-anchor="middle" font-size="15" font-weight="800" fill="#111827">20</text></g><text x="910" y="460" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">vaccinated</text><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.5333;0.5533;1.0000" values="0;0;1;1" dur="15s" begin="vd-play.begin+0s" fill="freeze"/><rect x="700.0" y="488" width="240" height="24" rx="12" fill="#fee2e2" stroke="#1f2937" stroke-width="1"/><text x="820" y="505" text-anchor="middle" font-size="12" font-weight="700">180 ÷ 20 = 9 times higher</text></g></g>
<g class="part" data-part="conf" data-name="Evaluate the evidence" data-info="Groups may differ in age, health or behaviour (confounding variables); testing rates and how cases were counted can change; correlation does not prove causation." tabindex="0" role="button" aria-label="Evaluate the evidence"><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.7333;0.7533;1.0000" values="0;0;1;1" dur="15s" begin="vd-play.begin+0s" fill="freeze"/><rect x="270.0" y="538" width="560" height="24" rx="12" fill="#fef3c7" stroke="#1f2937" stroke-width="1"/><text x="550" y="555" text-anchor="middle" font-size="12" font-weight="700">check: age, health, behaviour, testing rates — correlation ≠ causation</text></g></g>
</svg>