<g class="part" data-part="why" data-name="Two selection pressures" data-info="Predators favour drab, camouflaged males (natural selection); females prefer colourful males (sexual selection)." tabindex="0" role="button" aria-label="Two selection pressures"><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.8333;0.8533;1.0000" values="0;0;1;1" dur="15s" begin="gp2-play.begin+0s" fill="freeze"/><rect x="340.0" y="308" width="420" height="24" rx="12" fill="#fef3c7" stroke="#1f2937" stroke-width="1"/><text x="550" y="325" text-anchor="middle" font-size="12" font-weight="700">predators favour drab males · females favour bright males</text></g></g>
