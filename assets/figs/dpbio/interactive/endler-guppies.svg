<text class="head" x="30" y="34">Endler's guppies: natural and sexual selection</text><text class="note" x="30" y="56">Schematic.</text>
<g class="part" data-part="wild" data-name="Wild streams" data-info="With dangerous predators (pike cichlids), males have few, small spots; with only weak predators (Rivulus), males have many large bright spots." tabindex="0" role="button" aria-label="Wild streams"><rect x="30" y="80" width="500" height="230" rx="16" fill="#e0f2fe" stroke="#7dd3fc"/><text x="280" y="106" text-anchor="middle" font-size="14" font-weight="800" fill="#b91c1c">HIGH predation (pike cichlid)</text><g transform="translate(110 200) scale(1)"><ellipse rx="34" ry="13" fill="#d6d3d1" stroke="#57534e" stroke-width="1.5"/><path d="M 30 0 L 58 -16 L 58 16 Z" fill="#a8a29e" stroke="#57534e"/><circle cx="-22" cy="-3" r="3" fill="#111827"/><circle cx="-10" cy="-4" r="2.5" fill="#78716c"/><circle cx="-1" cy="-4" r="2.5" fill="#78716c"/></g><g transform="translate(220 240) scale(1)"><ellipse rx="34" ry="13" fill="#d6d3d1" stroke="#57534e" stroke-width="1.5"/><path d="M 30 0 L 58 -16 L 58 16 Z" fill="#a8a29e" stroke="#57534e"/><circle cx="-22" cy="-3" r="3" fill="#111827"/><circle cx="-10" cy="-4" r="2.5" fill="#78716c"/><circle cx="-1" cy="-4" r="2.5" fill="#78716c"/></g><g transform="translate(330 200) scale(1)"><ellipse rx="34" ry="13" fill="#d6d3d1" stroke="#57534e" stroke-width="1.5"/><path d="M 30 0 L 58 -16 L 58 16 Z" fill="#a8a29e" stroke="#57534e"/><circle cx="-22" cy="-3" r="3" fill="#111827"/><circle cx="-10" cy="-4" r="2.5" fill="#78716c"/><circle cx="-1" cy="-4" r="2.5" fill="#78716c"/></g><g transform="translate(440 240) scale(1)"><ellipse rx="34" ry="13" fill="#d6d3d1" stroke="#57534e" stroke-width="1.5"/><path d="M 30 0 L 58 -16 L 58 16 Z" fill="#a8a29e" stroke="#57534e"/><circle cx="-22" cy="-3" r="3" fill="#111827"/><circle cx="-10" cy="-4" r="2.5" fill="#78716c"/><circle cx="-1" cy="-4" r="2.5" fill="#78716c"/></g><ellipse cx="420" cy="140" rx="50" ry="16" fill="#57534e"/><text x="420" y="172" text-anchor="middle" font-size="11" font-weight="800" fill="#57534e">predator</text><rect x=