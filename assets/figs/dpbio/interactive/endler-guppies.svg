<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 540" class="vd-svg" role="img" aria-labelledby="gp2-title gp2-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="gp2-play" data-vd-play-label="Play: evolve" data-vd-steps="[[0, &quot;Endler&#x27;s guppies (Trinidad).&quot;], [1, &quot;High predation: drab males survive.&quot;], [4.5, &quot;Low predation: colourful males win mates.&quot;], [8, &quot;Move drab guppies to a safe stream: in ~15 generations, males become colourful.&quot;]]" data-vd-dur="15">
<title id="gp2-title">Endler&#x27;s guppies</title><desc id="gp2-desc">Male guppies with few small spots in streams with dangerous pike cichlids and many bright spots where only weak predators live; transplanted guppies evolved more and brighter spots within about 15 generations.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
