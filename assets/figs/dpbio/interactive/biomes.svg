<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" class="vd-svg" role="img" aria-labelledby="bi-title bi-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="bi-play" data-vd-play-label="Play: map the biomes" data-vd-steps="[[0, &quot;Biomes: groups of ecosystems with similar climates.&quot;], [1, &quot;Temperature and rainfall decide which biome forms.&quot;], [8, &quot;Similar biomes on different continents show convergent evolution.&quot;]]" data-vd-dur="14">
<title id="bi-title">Biomes and convergent evolution</title><desc id="bi-desc">A simplified chart placing tundra, taiga, temperate forest, grassland, hot desert and tropical forest by mean temperature and rainfall, and examples of convergent evolution: cacti and euphorbias, kangaroo rats and jerboas.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="560" fill="#ffffff"/>
<g aria-hidden="true"><animate id="bi-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<text class="head" x="30" y="34">Biomes and convergent evolution</text><text class="note" x="30" y="56">Simplified climate chart.</text>
<g class="part" data-part="chart" data-name="Biomes and climate" data-info="Biomes depend mainly on temperature and rainfall: tropical forest (hot, wet all year), temperate forest, taiga (long cold winters), grassland (seasonal rain, fires), tundra (very cold, permafrost), hot desert (very low rainfall)." tabindex="0" role="button" aria-label="Biomes and climate"><line x1="110" y1="480" x2="630" y2="480" stroke="#111827" stroke-width="2"/><line x1="110" y1="480" x2="110" y2="100" stroke="#111827" stroke-width="2"/><text x="370.0" y="510" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">mean annual temperature → (cold to hot)</text><text x="80" y="290.0" font-size="12" font-weight="800" text-anchor="middle" transform="rotate(-90 80 290.0)">annual rainfall → (dry to wet)</text><g><animate attributeName="opacity" keyTimes="0.0000;0.0714;0.0929;1.0000" values="0;0;1;1" dur="14s" begin="bi-play.begin+0s" fill="freeze"/><rect x="130" y="400" width="90" height="70" rx="14" fill="#e0f2fe" stroke="#334155" stroke-width="1.5" opacity=".9"/><text x="175.0" y="439.0" text-anchor="middle" font-size="12" font-weight="800" fill="#0f172a">tundra</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.1429;0.1643;1.0000" values="0;0;1;1" dur="14s" begin="bi-play.begin+0s" fill="freeze"/><rect x="220" y="330" width="110" height="140" rx="14" fill="#a7f3d0" stroke="#334155" stroke-width="1.5" opacity=".9"/><text x="275.0" y="404.0" text-anchor="middle" font-size="12" font-weight="800" fill="#0f172a">taiga</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.2143;0.2357;1.0000" values="0;0;1;1" dur="14s" begin="bi-play.begin+0s" fill="freeze"/><rect x="340" y="220" width="130" height="200" rx="14" fill="#4ade80" stroke="#334155" stroke-width="1.5" opacity=".9"/><text x="405.0" y="324.0" text-anchor="middle" font-size="12" font-weight="800" fill="#0f172a">temperate forest</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.2857;0.3071;1.0000" values="0;0;1;1" dur="14s" begin="bi-play.begin+0s" fill="freeze"/><rect x="350" y="426" width="130" height="50" rx="14" fill="#fde68a" stroke="#334155" stroke-width="1.5" opacity=".9"/><text x="415.0" y="455.0" text-anchor="middle" font-size="12" font-weight="800" fill="#0f172a">grassland</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.3571;0.3786;1.0000" values="0;0;1;1" dur="14s" begin="bi-play.begin+0s" fill="freeze"/><rect x="490" y="410" width="130" height="60" rx="14" fill="#fdba74" stroke="#334155" stroke-width="1.5" opacity=".9"/><text x="555.0" y="444.0" text-anchor="middle" font-size="12" font-weight="800" fill="#0f172a">hot desert</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.4286;0.4500;1.0000" values="0;0;1;1" dur="14s" begin="bi-play.begin+0s" fill="freeze"/><rect x="490" y="120" width="130" height="260" rx="14" fill="#16a34a" stroke="#334155" stroke-width="1.5" opacity=".9"/><text x="555.0" y="254.0" text-anchor="middle" font-size="12" font-weight="800" fill="#0f172a">tropical forest</text></g></g>
<g class="part" data-part="conv" data-name="Convergent evolution" data-info="Unrelated organisms in similar environments evolve similar adaptations: American cacti and African euphorbias (succulent, spiny, photosynthetic stems); kangaroo rats and jerboas (hopping desert rodents)." tabindex="0" role="button" aria-label="Convergent evolution"><rect x="680" y="80" width="390" height="460" rx="16" fill="#fff7ed" stroke="#fdba74"/><text x="875" y="106" text-anchor="middle" font-size="15" font-weight="800" fill="#c2410c">Convergent evolution</text><g><animate attributeName="opacity" keyTimes="0.0000;0.5714;0.5929;1.0000" values="0;0;1;1" dur="14s" begin="bi-play.begin+0s" fill="freeze"/><rect x="768" y="190" width="24" height="90" rx="12" fill="#22c55e" stroke="#166534" stroke-width="2"/><path d="M 768 230 q -24 0 -24 -26 l 0 -14" fill="none" stroke="#22c55e" stroke-width="14" stroke-linecap="round"/><path d="M 792 240 q 24 0 24 -26" fill="none" stroke="#22c55e" stroke-width="14" stroke-linecap="round"/><rect x="958" y="190" width="24" height="90" rx="12" fill="#4ade80" stroke="#166534" stroke-width="2"/><path d="M 958 230 q -24 0 -24 -26 l 0 -14" fill="none" stroke="#4ade80" stroke-width="14" stroke-linecap="round"/><path d="M 982 240 q 24 0 24 -26" fill="none" stroke="#4ade80" stroke-width="14" stroke-linecap="round"/><text x="780" y="300" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">cactus (Americas)</text><text x="970" y="300" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">euphorbia (Africa)</text><text x="875" y="322" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">unrelated, but both succulent and spiny</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.7143;0.7357;1.0000" values="0;0;1;1" dur="14s" begin="bi-play.begin+0s" fill="freeze"/><g transform="translate(800 420)"><ellipse rx="26" ry="16" fill="#d6a76b" stroke="#92400e" stroke-width="2"/><circle cx="24" cy="-10" r="10" fill="#d6a76b" stroke="#92400e" stroke-width="2"/><path d="M -10 12 L -24 36 L -6 36" fill="none" stroke="#92400e" stroke-width="5"/><path d="M -26 0 q -40 6 -56 -16" fill="none" stroke="#92400e" stroke-width="3"/></g><g transform="translate(990 420)"><ellipse rx="26" ry="16" fill="#d6a76b" stroke="#92400e" stroke-width="2"/><circle cx="24" cy="-10" r="10" fill="#d6a76b" stroke="#92400e" stroke-width="2"/><path d="M -10 12 L -24 36 L -6 36" fill="none" stroke="#92400e" stroke-width="5"/><path d="M -26 0 q -40 6 -56 -16" fill="none" stroke="#92400e" stroke-width="3"/></g><text x="780" y="480" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">kangaroo rat (America)</text><text x="980" y="480" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">jerboa (Africa/Asia)</text><text x="875" y="506" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">hopping, long hind legs, concentrated urine</text></g></g>
</svg>