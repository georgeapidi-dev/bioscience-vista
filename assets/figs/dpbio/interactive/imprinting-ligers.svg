<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" class="vd-svg" role="img" aria-labelledby="ig-title ig-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="ig-play" data-vd-play-label="Play: cross the cats" data-vd-steps="[[0, &quot;Ligers and tigons: imprinting in action.&quot;], [1, &quot;In lions, fathers&#x27; genes promote growth and mothers&#x27; genes restrain it.&quot;], [5, &quot;Liger: lion father, tigress mother: growth unopposed: huge.&quot;], [9, &quot;Tigon: tiger father, lioness mother: growth restrained: smaller.&quot;]]" data-vd-dur="13">
<title id="ig-title">Genomic imprinting: ligers and tigons</title><desc id="ig-desc">A liger from a lion father and tigress mother grows very large because paternal growth-promoting genes are unopposed, while a tigon from a tiger father and lioness mother is smaller because of growth-restraining maternal genes.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="520" fill="#ffffff"/>
<g aria-hidden="true"><animate id="ig-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<text class="head" x="30" y="34">Ligers and tigons: genomic imprinting</text><text class="note" x="30" y="56">Arrow sizes show the strength of growth signals.</text>
<g class="part" data-part="imp" data-name="Genomic imprinting" data-info="Some genes keep a parent-specific epigenetic tag, so only the copy from one parent is expressed." tabindex="0" role="button" aria-label="Genomic imprinting"><g><animate attributeName="opacity" keyTimes="0.0000;0.0769;0.1000;1.0000" values="0;0;1;1" dur="13s" begin="ig-play.begin+0s" fill="freeze"/><rect x="250.0" y="87.0" width="600" height="46" rx="12" fill="#fef3c7" stroke="#a16207" stroke-width="2"/><text x="550" y="114.0" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">lion fathers: genes PROMOTE growth · lion mothers: genes RESTRAIN growth</text></g></g>
<g class="part" data-part="liger" data-name="Liger (lion father × tigress)" data-info="Growth-promoting genes from the lion father are not opposed by restraining genes from the tigress: very large offspring." tabindex="0" role="button" aria-label="Liger (lion father × tigress)"><rect x="30" y="150" width="510" height="350" rx="16" fill="#fff7ed" stroke="#fdba74"/><text x="285" y="176" text-anchor="middle" font-size="14" font-weight="800" fill="#c2410c">LIGER: lion ♂ × tigress ♀</text><path d="M 90 220 L 90 280" stroke="#16a34a" stroke-width="14"/><text x="90" y="300" text-anchor="middle" font-size="11" font-weight="800" fill="#15803d">+ growth</text><path d="M 160 280 L 160 268" stroke="#dc2626" stroke-width="4"/><text x="160" y="300" text-anchor="middle" font-size="11" font-weight="800" fill="#b91c1c">weak brake</text><g><animate attributeName="opacity" keyTimes="0.0000;0.3846;0.4077;1.0000" values="0;0;1;1" dur="13s" begin="ig-play.begin+0s" fill="freeze"/><g transform="translate(330 380) scale(1.5)"><ellipse rx="60" ry="26" fill="#f59e0b" stroke="#7c2d12" stroke-width="2"/><circle cx="64" cy="-20" r="20" fill="#f59e0b" stroke="#7c2d12" stroke-width="2"/><rect x="-46" y="18" width="10" height="34" fill="#f59e0b" stroke="#7c2d12"/><rect x="-28" y="18" width="10" height="34" fill="#f59e0b" stroke="#7c2d12"/><rect x="22" y="18" width="10" height="34" fill="#f59e0b" stroke="#7c2d12"/><rect x="38" y="18" width="10" height="34" fill="#f59e0b" stroke="#7c2d12"/><line x1="-36" y1="-24" x2="-30" y2="20" stroke="#1f2937" stroke-width="4"/><line x1="-18" y1="-24" x2="-12" y2="20" stroke="#1f2937" stroke-width="4"/><line x1="0" y1="-24" x2="6" y2="20" stroke="#1f2937" stroke-width="4"/><line x1="18" y1="-24" x2="24" y2="20" stroke="#1f2937" stroke-width="4"/><line x1="36" y1="-24" x2="42" y2="20" stroke="#1f2937" stroke-width="4"/></g></g><g><animate attributeName="opacity" keyTimes="0.0000;0.4615;0.4846;1.0000" values="0;0;1;1" dur="13s" begin="ig-play.begin+0s" fill="freeze"/><text x="330" y="480" text-anchor="middle" font-size="13" font-weight="800" fill="#c2410c">very large</text></g></g>
<g class="part" data-part="tigon" data-name="Tigon (tiger father × lioness)" data-info="Growth-restraining maternal genes from the lioness: smaller offspring." tabindex="0" role="button" aria-label="Tigon (tiger father × lioness)"><rect x="560" y="150" width="510" height="350" rx="16" fill="#f0fdf4" stroke="#86efac"/><text x="815" y="176" text-anchor="middle" font-size="14" font-weight="800" fill="#15803d">TIGON: tiger ♂ × lioness ♀</text><path d="M 620 240 L 620 280" stroke="#16a34a" stroke-width="7"/><text x="620" y="300" text-anchor="middle" font-size="11" font-weight="800" fill="#15803d">+ growth</text><path d="M 690 220 L 690 280" stroke="#dc2626" stroke-width="12"/><text x="690" y="300" text-anchor="middle" font-size="11" font-weight="800" fill="#b91c1c">strong brake</text><g><animate attributeName="opacity" keyTimes="0.0000;0.6923;0.7154;1.0000" values="0;0;1;1" dur="13s" begin="ig-play.begin+0s" fill="freeze"/><g transform="translate(880 400) scale(0.85)"><ellipse rx="60" ry="26" fill="#fbbf24" stroke="#7c2d12" stroke-width="2"/><circle cx="64" cy="-20" r="20" fill="#fbbf24" stroke="#7c2d12" stroke-width="2"/><rect x="-46" y="18" width="10" height="34" fill="#fbbf24" stroke="#7c2d12"/><rect x="-28" y="18" width="10" height="34" fill="#fbbf24" stroke="#7c2d12"/><rect x="22" y="18" width="10" height="34" fill="#fbbf24" stroke="#7c2d12"/><rect x="38" y="18" width="10" height="34" fill="#fbbf24" stroke="#7c2d12"/><line x1="-36" y1="-24" x2="-30" y2="20" stroke="#1f2937" stroke-width="4"/><line x1="-18" y1="-24" x2="-12" y2="20" stroke="#1f2937" stroke-width="4"/><line x1="0" y1="-24" x2="6" y2="20" stroke="#1f2937" stroke-width="4"/><line x1="18" y1="-24" x2="24" y2="20" stroke="#1f2937" stroke-width="4"/><line x1="36" y1="-24" x2="42" y2="20" stroke="#1f2937" stroke-width="4"/></g></g><g><animate attributeName="opacity" keyTimes="0.0000;0.7692;0.7923;1.0000" values="0;0;1;1" dur="13s" begin="ig-play.begin+0s" fill="freeze"/><text x="880" y="480" text-anchor="middle" font-size="13" font-weight="800" fill="#15803d">smaller</text></g></g>
</svg>