<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 600" class="vd-svg" role="img" aria-labelledby="pr-title pr-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="pr-play" data-vd-play-label="Play: make biomass" data-vd-steps="[[0, &quot;Autotrophs, primary and secondary production.&quot;], [1, &quot;Autotrophs need an external energy source: light, or oxidation of inorganic chemicals.&quot;], [5, &quot;Primary production differs greatly between biomes.&quot;], [10.5, &quot;Secondary production is always lower: a cow keeps only 4\u201310%.&quot;]]" data-vd-dur="15">
<title id="pr-title">Primary and secondary production</title><desc id="pr-desc">Photoautotrophs using light and chemoautotrophs oxidising iron, a bar chart of primary production in tropical rainforest, temperate forest, savanna, tundra and desert, and a cow converting only 4 to 10 percent of plant biomass eaten into new tissue.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="600" fill="#ffffff"/>
<g aria-hidden="true"><animate id="pr-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<text class="head" x="30" y="34">Autotrophs and production</text><text class="note" x="30" y="56">Approximate dry biomass values from the lesson.</text>
<g class="part" data-part="auto" data-name="Autotrophs need energy" data-info="For carbon fixation (CO₂ → organic compounds) and anabolic reactions building starch, cellulose, proteins and nucleic acids. Photoautotrophs use light; chemoautotrophs use energy from oxidising inorganic chemicals (e.g. Acidithiobacillus: Fe²⁺ → Fe³⁺)." tabindex="0" role="button" aria-label="Autotrophs need energy"><rect x="30" y="80" width="330" height="490" rx="16" fill="#f0fdf4" stroke="#86efac"/><text x="195" y="106" text-anchor="middle" font-size="13" font-weight="800" fill="#15803d">energy sources for autotrophs</text><g><animate attributeName="opacity" keyTimes="0.0000;0.0667;0.0867;1.0000" values="0;0;1;1" dur="15s" begin="pr-play.begin+0s" fill="freeze"/><circle cx="110" cy="180" r="30" fill="#facc15"/><path d="M 140 200 L 220 240" stroke="#f59e0b" stroke-width="4"/><path d="M 240 300 L 240 230 M 240 260 q -30 -20 -40 -50 q 30 10 40 50 q 30 -20 40 -50 q -30 10 -40 50" fill="#4ade80" stroke="#15803d" stroke-width="2"/><text x="195" y="340" text-anchor="middle" font-size="12" font-weight="800" fill="#14532d">photoautotrophs: light</text><text x="195" y="356" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">(plants, algae, cyanobacteria)</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.2000;0.2200;1.0000" values="0;0;1;1" dur="15s" begin="pr-play.begin+0s" fill="freeze"/><ellipse cx="195" cy="440" rx="40" ry="22" fill="#fb923c" stroke="#9a3412" stroke-width="2"/><text x="195" y="445" text-anchor="middle" font-size="12" font-weight="800" fill="#7c2d12">Fe²⁺ → Fe³⁺</text><text x="195" y="490" text-anchor="middle" font-size="12" font-weight="800" fill="#7c2d12">chemoautotrophs: energy from</text><text x="195" y="506" text-anchor="middle" font-size="12" font-weight="800" fill="#7c2d12">oxidising inorganic chemicals</text><text x="195" y="540" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">energy → carbon fixation + anabolism</text></g></g>
<g class="part" data-part="pp" data-name="Primary production" data-info="Accumulation of carbon compounds in biomass by autotrophs, g m⁻² yr⁻¹: tropical rainforest ≈ 2 000, temperate forest ≈ 1 200, savanna ≈ 900, tundra ≈ 140, desert ≈ 90." tabindex="0" role="button" aria-label="Primary production"><text x="700" y="100" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">primary production / g m⁻² yr⁻¹</text><text x="552" y="142" text-anchor="end" font-size="12" font-weight="800" fill="#111827">tropical rainforest</text><clipPath id="prb0-c50120560"><rect x="560" y="120" width="302.0" height="34"><animate attributeName="width" keyTimes="0.0000;0.3333;0.4000;1.0000" values="0;0;302.0;302.0" dur="15s" begin="pr-play.begin+0s" fill="freeze"/></rect></clipPath><g clip-path="url(#prb0-c50120560)"><rect x="560" y="120" width="300" height="32" rx="6" fill="#15803d" stroke="#334155"/></g><g><animate attributeName="opacity" keyTimes="0.0000;0.4000;0.4200;1.0000" values="0;0;1;1" dur="15s" begin="pr-play.begin+0s" fill="freeze"/><text x="868.0" y="142" text-anchor="start" font-size="12" font-weight="800" fill="#111827">≈ 2,000</text></g><text x="552" y="186" text-anchor="end" font-size="12" font-weight="800" fill="#111827">temperate forest</text><clipPath id="prb1-c57164560"><rect x="560" y="164" width="182.0" height="34"><animate attributeName="width" keyTimes="0.0000;0.3800;0.4467;1.0000" values="0;0;182.0;182.0" dur="15s" begin="pr-play.begin+0s" fill="freeze"/></rect></clipPath><g clip-path="url(#prb1-c57164560)"><rect x="560" y="164" width="180" height="32" rx="6" fill="#22c55e" stroke="#334155"/></g><g><animate attributeName="opacity" keyTimes="0.0000;0.4467;0.4667;1.0000" values="0;0;1;1" dur="15s" begin="pr-play.begin+0s" fill="freeze"/><text x="748.0" y="186" text-anchor="start" font-size="12" font-weight="800" fill="#111827">≈ 1,200</text></g><text x="552" y="230" text-anchor="end" font-size="12" font-weight="800" fill="#111827">savanna</text><clipPath id="prb2-c64208560"><rect x="560" y="208" width="137.0" height="34"><animate attributeName="width" keyTimes="0.0000;0.4267;0.4933;1.0000" values="0;0;137.0;137.0" dur="15s" begin="pr-play.begin+0s" fill="freeze"/></rect></clipPath><g clip-path="url(#prb2-c64208560)"><rect x="560" y="208" width="135" height="32" rx="6" fill="#facc15" stroke="#334155"/></g><g><animate attributeName="opacity" keyTimes="0.0000;0.4933;0.5133;1.0000" values="0;0;1;1" dur="15s" begin="pr-play.begin+0s" fill="freeze"/><text x="703.0" y="230" text-anchor="start" font-size="12" font-weight="800" fill="#111827">≈ 900</text></g><text x="552" y="274" text-anchor="end" font-size="12" font-weight="800" fill="#111827">tundra</text><clipPath id="prb3-c71252560"><rect x="560" y="252" width="23.000000000000004" height="34"><animate attributeName="width" keyTimes="0.0000;0.4733;0.5400;1.0000" values="0;0;23.000000000000004;23.000000000000004" dur="15s" begin="pr-play.begin+0s" fill="freeze"/></rect></clipPath><g clip-path="url(#prb3-c71252560)"><rect x="560" y="252" width="21" height="32" rx="6" fill="#bae6fd" stroke="#334155"/></g><g><animate attributeName="opacity" keyTimes="0.0000;0.5400;0.5600;1.0000" values="0;0;1;1" dur="15s" begin="pr-play.begin+0s" fill="freeze"/><text x="589.0" y="274" text-anchor="start" font-size="12" font-weight="800" fill="#111827">≈ 140</text></g><text x="552" y="318" text-anchor="end" font-size="12" font-weight="800" fill="#111827">desert</text><clipPath id="prb4-c78296560"><rect x="560" y="296" width="15.5" height="34"><animate attributeName="width" keyTimes="0.0000;0.5200;0.5867;1.0000" values="0;0;15.5;15.5" dur="15s" begin="pr-play.begin+0s" fill="freeze"/></rect></clipPath><g clip-path="url(#prb4-c78296560)"><rect x="560" y="296" width="14" height="32" rx="6" fill="#fdba74" stroke="#334155"/></g><g><animate attributeName="opacity" keyTimes="0.0000;0.5867;0.6067;1.0000" values="0;0;1;1" dur="15s" begin="pr-play.begin+0s" fill="freeze"/><text x="581.5" y="318" text-anchor="start" font-size="12" font-weight="800" fill="#111827">≈ 90</text></g></g>
<g class="part" data-part="sp" data-name="Secondary production" data-info="Accumulation of biomass by heterotrophs: always lower. Much plant biomass is never eaten, and much eaten food is respired. A beef cow converts only about 4–10% of plant biomass eaten into new tissue." tabindex="0" role="button" aria-label="Secondary production"><rect x="400" y="360" width="670" height="210" rx="16" fill="#fff7ed" stroke="#fdba74"/><text x="735" y="386" text-anchor="middle" font-size="14" font-weight="800" fill="#c2410c">secondary production: a beef cow</text><g transform="translate(520 480)"><ellipse rx="70" ry="36" fill="#f5f5f4" stroke="#57534e" stroke-width="2"/><circle cx="72" cy="-20" r="22" fill="#f5f5f4" stroke="#57534e" stroke-width="2"/><rect x="-56" y="28" width="10" height="34" fill="#f5f5f4" stroke="#57534e"/><rect x="-36" y="28" width="10" height="34" fill="#f5f5f4" stroke="#57534e"/><rect x="30" y="28" width="10" height="34" fill="#f5f5f4" stroke="#57534e"/><rect x="48" y="28" width="10" height="34" fill="#f5f5f4" stroke="#57534e"/><ellipse cx="-30" cy="-10" rx="14" ry="9" fill="#44403c"/><ellipse cx="10" cy="8" rx="14" ry="9" fill="#44403c"/></g><g><animate attributeName="opacity" keyTimes="0.0000;0.7000;0.7200;1.0000" values="0;0;1;1" dur="15s" begin="pr-play.begin+0s" fill="freeze"/><rect x="680" y="440" width="26" height="40" fill="#16a34a" stroke="#334155"/><text x="692.95" y="520" text-anchor="middle" font-size="11" font-weight="800" fill="#111827">new tissue 4–10%</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.7400;0.7600;1.0000" values="0;0;1;1" dur="15s" begin="pr-play.begin+0s" fill="freeze"/><rect x="706" y="440" width="222" height="40" fill="#f87171" stroke="#334155"/><text x="816.9" y="500" text-anchor="middle" font-size="11" font-weight="800" fill="#111827">respired (CO₂, heat)</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.7800;0.8000;1.0000" values="0;0;1;1" dur="15s" begin="pr-play.begin+0s" fill="freeze"/><rect x="928" y="440" width="122" height="40" fill="#a8a29e" stroke="#334155"/><text x="988.9499999999999" y="500" text-anchor="middle" font-size="11" font-weight="800" fill="#111827">egested</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.7000;0.7200;1.0000" values="0;0;1;1" dur="15s" begin="pr-play.begin+0s" fill="freeze"/><text x="865" y="430" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">100% of plant biomass eaten (illustrative split)</text></g></g>
</svg>