<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 580" class="vd-svg" role="img" aria-labelledby="bc-title bc-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="bc-play" data-vd-play-label="Play: burn the food" data-vd-steps="[[0, &quot;Measuring the energy in food: the bomb calorimeter.&quot;], [1, &quot;A weighed food sample sits in a steel bomb full of oxygen.&quot;], [4, &quot;It is ignited electrically and burns completely.&quot;], [6.5, &quot;The heat passes into the surrounding water; the stirrer mixes it.&quot;], [9, &quot;The temperature rise gives the energy: E = m \u00d7 4.18 \u00d7 \u0394T.&quot;]]" data-vd-dur="14">
<title id="bc-title">The bomb calorimeter</title><desc id="bc-desc">A bomb calorimeter: a food sample in a sealed steel bomb full of oxygen is ignited electrically; heat released raises the temperature of a known mass of stirred water in an insulated container, measured by a thermometer.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="580" fill="#ffffff"/>
<g aria-hidden="true"><animate id="bc-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<text class="head" x="30" y="34">The bomb calorimeter</text><text class="note" x="30" y="56">Measures the energy content of food accurately.</text>
<g class="part" data-part="ins" data-name="Insulated jacket" data-info="Reduces heat loss to the surroundings, so almost all the energy goes into the water." tabindex="0" role="button" aria-label="Insulated jacket"><rect x="120" y="150" width="560" height="380" rx="20" fill="#e5e7eb" stroke="#475569" stroke-width="4"/><text x="140" y="520" text-anchor="start" font-size="12" font-weight="800" fill="#334155">insulated jacket</text></g>
<g class="part" data-part="water" data-name="Water bath" data-info="A known mass of water around the bomb absorbs the heat released." tabindex="0" role="button" aria-label="Water bath"><rect x="150" y="180" width="500" height="320" rx="10" fill="#93c5fd"><animate attributeName="fill" keyTimes="0;0.464;0.679;1" values="#93c5fd;#93c5fd;#fca5a5;#fca5a5" dur="14s" begin="bc-play.begin+0s" fill="freeze"/></rect><text x="270" y="470" text-anchor="middle" font-size="14" font-weight="800" fill="#1e3a8a">water</text></g>
<g class="part" data-part="bomb" data-name="Steel bomb" data-info="A sealed, strong steel container filled with pure oxygen under pressure, so the food burns completely." tabindex="0" role="button" aria-label="Steel bomb"><rect x="300" y="260" width="200" height="210" rx="24" fill="#cbd5e1" stroke="#334155" stroke-width="5"/><text x="400" y="456" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">steel bomb + O₂</text></g>
<g class="part" data-part="sample" data-name="Food sample" data-info="A known mass of dried food, ignited electrically through fuse wires." tabindex="0" role="button" aria-label="Food sample"><rect x="370" y="370" width="60" height="30" rx="6" fill="#a16207"/><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.2857;0.3071;0.4643;0.5000;1.0000" values="0;0;1;1;0;0" dur="14s" begin="bc-play.begin+0s" fill="freeze"/><path d="M 380 370 Q 390 320 400 340 Q 410 300 420 370 Z" fill="#f97316"/><path d="M 390 370 Q 400 340 410 370 Z" fill="#fde047"/></g><path d="M 380 372 L 360 290 L 360 150 M 420 372 L 440 290 L 440 150" fill="none" stroke="#dc2626" stroke-width="3"/><text x="530" y="140" text-anchor="start" font-size="12" font-weight="800" fill="#b91c1c">fuse wires to ignition box</text></g>
<g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.4643;0.4786;0.5929;0.6071;1.0000" values="0;0;1;1;0;0" dur="14s" begin="bc-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.4643;0.5714;1.0000" values="400 330;400 330;250 200;250 200" dur="14s" begin="bc-play.begin+0s" fill="freeze"/><path d="M 0 0 q 5 -6 10 0 q 5 6 10 0" fill="none" stroke="#dc2626" stroke-width="3"/></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.4857;0.5000;0.6143;0.6286;1.0000" values="0;0;1;1;0;0" dur="14s" begin="bc-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.4857;0.5929;1.0000" values="400 330;400 330;310 260;310 260" dur="14s" begin="bc-play.begin+0s" fill="freeze"/><path d="M 0 0 q 5 -6 10 0 q 5 6 10 0" fill="none" stroke="#dc2626" stroke-width="3"/></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.5071;0.5214;0.6357;0.6500;1.0000" values="0;0;1;1;0;0" dur="14s" begin="bc-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.5071;0.6143;1.0000" values="400 330;400 330;370 200;370 200" dur="14s" begin="bc-play.begin+0s" fill="freeze"/><path d="M 0 0 q 5 -6 10 0 q 5 6 10 0" fill="none" stroke="#dc2626" stroke-width="3"/></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.5286;0.5429;0.6571;0.6714;1.0000" values="0;0;1;1;0;0" dur="14s" begin="bc-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.5286;0.6357;1.0000" values="400 330;400 330;430 260;430 260" dur="14s" begin="bc-play.begin+0s" fill="freeze"/><path d="M 0 0 q 5 -6 10 0 q 5 6 10 0" fill="none" stroke="#dc2626" stroke-width="3"/></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.5500;0.5643;0.6786;0.6929;1.0000" values="0;0;1;1;0;0" dur="14s" begin="bc-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.5500;0.6571;1.0000" values="400 330;400 330;490 200;490 200" dur="14s" begin="bc-play.begin+0s" fill="freeze"/><path d="M 0 0 q 5 -6 10 0 q 5 6 10 0" fill="none" stroke="#dc2626" stroke-width="3"/></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.5714;0.5857;0.7000;0.7143;1.0000" values="0;0;1;1;0;0" dur="14s" begin="bc-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.5714;0.6786;1.0000" values="400 330;400 330;550 260;550 260" dur="14s" begin="bc-play.begin+0s" fill="freeze"/><path d="M 0 0 q 5 -6 10 0 q 5 6 10 0" fill="none" stroke="#dc2626" stroke-width="3"/></g></g>
<g class="part" data-part="stir" data-name="Stirrer" data-info="Mixes the water so its temperature is even." tabindex="0" role="button" aria-label="Stirrer"><line x1="600" y1="120" x2="600" y2="440" stroke="#334155" stroke-width="5"/><g transform="translate(600 440)"><g><animateTransform attributeName="transform" type="scale" values="1 1;-1 1;1 1" dur="1s" repeatCount="indefinite"/><rect x="-30" y="-6" width="60" height="12" fill="#334155"/></g></g><text x="620" y="110" text-anchor="start" font-size="12" font-weight="800" fill="#334155">stirrer</text></g>
<g class="part" data-part="therm" data-name="Thermometer" data-info="Measures the temperature rise accurately." tabindex="0" role="button" aria-label="Thermometer"><rect x="220" y="80" width="14" height="300" rx="7" fill="#fff" stroke="#334155" stroke-width="2"/><rect x="223" y="300" width="8" height="76" fill="#dc2626"><animate attributeName="y" keyTimes="0;0.464;0.714;1" values="300;300;220;220" dur="14s" begin="bc-play.begin+0s" fill="freeze"/><animate attributeName="height" keyTimes="0;0.464;0.714;1" values="76;76;156;156" dur="14s" begin="bc-play.begin+0s" fill="freeze"/></rect><text x="240" y="74" text-anchor="start" font-size="12" font-weight="800" fill="#334155">thermometer</text></g>
<g class="part" data-part="calc" data-name="Calculation" data-info="Energy (J) = mass of water (g) × 4.18 × temperature rise (°C); divide by mass of food for energy per gram." tabindex="0" role="button" aria-label="Calculation"><g><animate attributeName="opacity" keyTimes="0.0000;0.6429;0.6643;1.0000" values="0;0;1;1" dur="14s" begin="bc-play.begin+0s" fill="freeze"/><rect x="720" y="200" width="360" height="200" rx="16" fill="#fef9c3" stroke="#eab308"/><text x="900" y="228" text-anchor="middle" font-size="15" font-weight="800" fill="#713f12">Calculation</text><text x="900" y="262" text-anchor="middle" font-size="18" font-weight="800" fill="#111827">E = m × c × ΔT</text><text x="900" y="292" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">m = mass of water (g)</text><text x="900" y="312" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">c = 4.18 J g⁻¹ °C⁻¹</text><text x="900" y="332" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">ΔT = temperature rise (°C)</text><text x="900" y="370" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">÷ mass of food → J per gram</text></g></g>
</svg>