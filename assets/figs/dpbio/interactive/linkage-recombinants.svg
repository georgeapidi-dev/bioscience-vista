<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 600" class="vd-svg" role="img" aria-labelledby="lk-title lk-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="lk-play" data-vd-play-label="Play: cross over" data-vd-steps="[[0, &quot;Linked genes and recombinants.&quot;], [1, &quot;A and B sit on the same chromosome: AB | ab.&quot;], [4, &quot;Crossing over between them makes recombinant chromosomes.&quot;], [8, &quot;Test cross: mostly parental types, some recombinants (17.5%).&quot;], [12.5, &quot;\u03c7\u00b2 \u2248 423 &gt; 7.815: the genes are not assorting independently.&quot;]]" data-vd-dur="17">
<title id="lk-title">Linked genes and recombinants</title><desc id="lk-desc">Homologous chromosomes carrying AB and ab cross over between the loci to give recombinant Ab and aB chromosomes; a test cross gives 420 and 405 parental and 85 and 90 recombinant offspring, and a chi-squared value of about 423 rejects independent assortment.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="600" fill="#ffffff"/>
<g aria-hidden="true"><animate id="lk-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<text class="head" x="30" y="34">Linked genes, recombinants and χ²</text><text class="note" x="30" y="56">Data from the lesson.</text>
<g class="part" data-part="lk" data-name="Linked genes" data-info="Genes on the same chromosome tend to be inherited together. Notation AB|ab: A and B on one chromosome, a and b on its homologue." tabindex="0" role="button" aria-label="Linked genes"><rect x="80" y="120" width="300" height="24" rx="12" fill="#2563eb" stroke="#334155"/><text x="150" y="137" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">A</text><text x="310" y="137" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">B</text><rect x="80" y="160" width="300" height="24" rx="12" fill="#f97316" stroke="#334155"/><text x="150" y="177" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">a</text><text x="310" y="177" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">b</text><text x="400" y="156" text-anchor="start" font-size="16" font-weight="800" fill="#111827">AB | ab</text></g>
<g class="part" data-part="co" data-name="Crossing over" data-info="In prophase I, crossing over between the loci produces recombinant chromosomes Ab and aB." tabindex="0" role="button" aria-label="Crossing over"><g><animate attributeName="opacity" keyTimes="0.0000;0.2353;0.2529;1.0000" values="0;0;1;1" dur="17s" begin="lk-play.begin+0s" fill="freeze"/><path d="M 230 110 C 240 150 220 150 230 190" stroke="#111827" stroke-width="3" fill="none"/><text x="230" y="220" text-anchor="middle" font-size="11" font-weight="800" fill="#111827">chiasma</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.3235;0.3412;1.0000" values="0;0;1;1" dur="17s" begin="lk-play.begin+0s" fill="freeze"/><rect x="80" y="250" width="300" height="24" rx="12" fill="#2563eb" stroke="#334155"/><rect x="230" y="250" width="150" height="24" rx="0" fill="#f97316"/><text x="150" y="267" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">A</text><text x="310" y="267" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">b</text><rect x="80" y="290" width="300" height="24" rx="12" fill="#f97316" stroke="#334155"/><rect x="230" y="290" width="150" height="24" rx="0" fill="#2563eb"/><text x="150" y="307" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">a</text><text x="310" y="307" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">B</text><text x="400" y="286" text-anchor="start" font-size="13" font-weight="800" fill="#b91c1c">recombinant chromosomes</text></g></g>
<g class="part" data-part="data" data-name="Test cross results" data-info="AB|ab × ab|ab: 420 AaBb and 405 aabb (parental), 85 Aabb and 90 aaBb (recombinant): 175 of 1000 = 17.5% recombinants. Closer loci → fewer recombinants." tabindex="0" role="button" aria-label="Test cross results"><line x1="640" y1="360" x2="1060" y2="360" stroke="#111827" stroke-width="2"/><text x="850" y="86" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">test cross offspring (n = 1000)</text><line x1="640" y1="216" x2="1060" y2="216" stroke="#16a34a" stroke-dasharray="7 5"/><text x="1060" y="209.55555555555554" text-anchor="end" font-size="11" font-weight="800" fill="#15803d">expected if unlinked: 250</text><rect x="660" y="117" width="70" height="243" fill="#2563eb" stroke="#334155"><animate attributeName="height" keyTimes="0.0000;0.4706;0.5294;1.0000" values="0;0;242.66666666666666;242.66666666666666" dur="17s" begin="lk-play.begin+0s" fill="freeze"/><animate attributeName="y" keyTimes="0.0000;0.4706;0.5294;1.0000" values="360;360;117.33333333333334;117.33333333333334" dur="17s" begin="lk-play.begin+0s" fill="freeze"/></rect><g><animate attributeName="opacity" keyTimes="0.0000;0.5294;0.5471;1.0000" values="0;0;1;1" dur="17s" begin="lk-play.begin+0s" fill="freeze"/><text x="695" y="109.33333333333334" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">420</text></g><text x="695" y="378" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">AaBb</text><text x="695" y="394" text-anchor="middle" font-size="10" font-weight="700" fill="#475569">parental</text><rect x="760" y="126" width="70" height="234" fill="#f97316" stroke="#334155"><animate attributeName="height" keyTimes="0.0000;0.5000;0.5588;1.0000" values="0;0;234.0;234.0" dur="17s" begin="lk-play.begin+0s" fill="freeze"/><animate attributeName="y" keyTimes="0.0000;0.5000;0.5588;1.0000" values="360;360;126.0;126.0" dur="17s" begin="lk-play.begin+0s" fill="freeze"/></rect><g><animate attributeName="opacity" keyTimes="0.0000;0.5588;0.5765;1.0000" values="0;0;1;1" dur="17s" begin="lk-play.begin+0s" fill="freeze"/><text x="795" y="118.0" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">405</text></g><text x="795" y="378" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">aabb</text><text x="795" y="394" text-anchor="middle" font-size="10" font-weight="700" fill="#475569">parental</text><rect x="860" y="311" width="70" height="49" fill="#7c3aed" stroke="#334155"><animate attributeName="height" keyTimes="0.0000;0.5294;0.5882;1.0000" values="0;0;49.11111111111111;49.11111111111111" dur="17s" begin="lk-play.begin+0s" fill="freeze"/><animate attributeName="y" keyTimes="0.0000;0.5294;0.5882;1.0000" values="360;360;310.8888888888889;310.8888888888889" dur="17s" begin="lk-play.begin+0s" fill="freeze"/></rect><g><animate attributeName="opacity" keyTimes="0.0000;0.5882;0.6059;1.0000" values="0;0;1;1" dur="17s" begin="lk-play.begin+0s" fill="freeze"/><text x="895" y="302.8888888888889" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">85</text></g><text x="895" y="378" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">Aabb</text><text x="895" y="394" text-anchor="middle" font-size="10" font-weight="700" fill="#475569">recombinant</text><rect x="960" y="308" width="70" height="52" fill="#7c3aed" stroke="#334155"><animate attributeName="height" keyTimes="0.0000;0.5588;0.6176;1.0000" values="0;0;52.0;52.0" dur="17s" begin="lk-play.begin+0s" fill="freeze"/><animate attributeName="y" keyTimes="0.0000;0.5588;0.6176;1.0000" values="360;360;308.0;308.0" dur="17s" begin="lk-play.begin+0s" fill="freeze"/></rect><g><animate attributeName="opacity" keyTimes="0.0000;0.6176;0.6353;1.0000" values="0;0;1;1" dur="17s" begin="lk-play.begin+0s" fill="freeze"/><text x="995" y="300.0" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">90</text></g><text x="995" y="378" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">aaBb</text><text x="995" y="394" text-anchor="middle" font-size="10" font-weight="700" fill="#475569">recombinant</text><g><animate attributeName="opacity" keyTimes="0.0000;0.6471;0.6647;1.0000" values="0;0;1;1" dur="17s" begin="lk-play.begin+0s" fill="freeze"/><text x="850" y="420" text-anchor="middle" font-size="13" font-weight="800" fill="#6d28d9">recombinants: 175 / 1000 = 17.5%</text></g></g>
<g class="part" data-part="chi" data-name="Chi-squared" data-info="Expected 1:1:1:1 = 250 each if unlinked. χ² ≈ 423, far above 7.815 (df 3, p = 0.05): reject independent assortment: the genes are linked. A test gives probability, not certainty." tabindex="0" role="button" aria-label="Chi-squared"><g><animate attributeName="opacity" keyTimes="0.0000;0.7353;0.7529;1.0000" values="0;0;1;1" dur="17s" begin="lk-play.begin+0s" fill="freeze"/><rect x="60" y="430" width="1000" height="150" rx="16" fill="#fef2f2" stroke="#fca5a5"/><text x="560" y="460" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">χ² = (420−250)²/250 + (405−250)²/250 + (85−250)²/250 + (90−250)²/250</text><text x="560" y="490" text-anchor="middle" font-size="14" font-weight="800" fill="#111827">= 115.6 + 96.1 + 108.9 + 102.4 ≈ 423</text><text x="560" y="520" text-anchor="middle" font-size="13" font-weight="800" fill="#b91c1c">423 > 7.815 (df = 3, p = 0.05): reject H₀ of independent assortment — the genes are linked</text><text x="560" y="548" text-anchor="middle" font-size="12" font-weight="700" fill="#475569">statistics give a probability (< 5% by chance), not certainty</text></g></g>
</svg>