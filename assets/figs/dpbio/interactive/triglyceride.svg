<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 700" class="vd-svg" role="img" aria-labelledby="tg-title tg-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="tg-play" data-vd-play-label="Play: condensation" data-vd-steps="[[0, &quot;Making a triglyceride.&quot;], [1, &quot;Glycerol has three \u2013OH groups.&quot;], [2.5, &quot;Three fatty acids, each with a \u2013COOH group.&quot;], [4.5, &quot;Condensation: each \u2013OH and \u2013COOH lose a water molecule.&quot;], [8, &quot;Three ester bonds join the fatty acids to glycerol: a triglyceride.&quot;], [11, &quot;Saturated chains are straight; a cis double bond puts a kink in an unsaturated chain.&quot;]]" data-vd-dur="15">
<title id="tg-title">Triglyceride formation</title><desc id="tg-desc">Glycerol and three fatty acids join by condensation, releasing three water molecules and forming three ester bonds; saturated and unsaturated fatty acid chains compared.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1220" height="700" fill="#ffffff"/>
<g aria-hidden="true"><animate id="tg-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<defs><marker id="tg-2563eb" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="6.3" refY="7.0" orient="auto"><path d="M0,0 L14,7.0 L0,14 z" fill="#2563eb"/></marker></defs>
<text class="head" x="30" y="34">Triglyceride: glycerol + 3 fatty acids</text><text class="note" x="30" y="56">Fatty acid chains shortened; real chains are usually 14–20 carbons.</text>
<g class="part" data-part="gly" data-name="Glycerol" data-info="Propane-1,2,3-triol: three carbons, each with an –OH group." tabindex="0" role="button" aria-label="Glycerol"><text x="160" y="176" text-anchor="middle" font-size="18" font-weight="800">H₂C</text><line x1="160" y1="184" x2="160" y2="280" stroke="#111827" stroke-width="3"/><text x="160" y="306" text-anchor="middle" font-size="18" font-weight="800">HC</text><line x1="160" y1="314" x2="160" y2="410" stroke="#111827" stroke-width="3"/><text x="160" y="436" text-anchor="middle" font-size="18" font-weight="800">H₂C</text><g><animate attributeName="opacity" keyTimes="0.0000;0.3333;0.3733;1.0000" values="1;1;0;0" dur="15s" begin="tg-play.begin+0s" fill="freeze"/><line x1="184" y1="170" x2="210" y2="170" stroke="#111827" stroke-width="3"/><text x="212" y="176" font-size="18" font-weight="800" fill="#dc2626">O<tspan fill="#2563eb">H</tspan></text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.3667;0.4067;1.0000" values="1;1;0;0" dur="15s" begin="tg-play.begin+0s" fill="freeze"/><line x1="184" y1="300" x2="210" y2="300" stroke="#111827" stroke-width="3"/><text x="212" y="306" font-size="18" font-weight="800" fill="#dc2626">O<tspan fill="#2563eb">H</tspan></text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.4000;0.4400;1.0000" values="1;1;0;0" dur="15s" begin="tg-play.begin+0s" fill="freeze"/><line x1="184" y1="430" x2="210" y2="430" stroke="#111827" stroke-width="3"/><text x="212" y="436" font-size="18" font-weight="800" fill="#dc2626">O<tspan fill="#2563eb">H</tspan></text></g><text x="160" y="500" text-anchor="middle" font-size="14" font-weight="800" fill="#111827">glycerol</text></g>
<g class="part" data-part="fa" data-name="Fatty acids" data-info="A hydrocarbon chain with a carboxyl group (–COOH) at one end." tabindex="0" role="button" aria-label="Fatty acids"><g><animate attributeName="opacity" keyTimes="0.0000;0.1667;0.1867;1.0000" values="0;0;1;1" dur="15s" begin="tg-play.begin+0s" fill="freeze"/><g transform="translate(-120 0)"><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.1667;0.2667;0.4000;0.5333;1.0000" values="100 0;100 0;0 0;0 0;-120 0;-120 0" dur="15s" begin="tg-play.begin+0s" fill="freeze"/><g><animate attributeName="opacity" keyTimes="0.0000;0.3333;0.3733;1.0000" values="1;1;0;0" dur="15s" begin="tg-play.begin+0s" fill="freeze"/><text x="356" y="176" font-size="18" font-weight="800"><tspan fill="#2563eb">H</tspan><tspan fill="#dc2626">O</tspan></text><line x1="390" y1="170" x2="412" y2="170" stroke="#111827" stroke-width="3"/></g><text x="420" y="176" font-size="18" font-weight="800">C</text><line x1="426" y1="158" x2="426" y2="138" stroke="#111827" stroke-width="3"/><line x1="432" y1="158" x2="432" y2="138" stroke="#111827" stroke-width="3"/><text x="420" y="132" font-size="18" font-weight="800" fill="#dc2626">O</text><polyline points="436,170 482,152 528,170 574,152 620,170 666,152 712,170 758,152 804,170" fill="none" stroke="#111827" stroke-width="3"/><text x="824" y="175" text-anchor="start" font-size="14" font-weight="800" fill="#111827">CH₃</text></g><g transform="translate(-120 0)"><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.1667;0.2667;0.4000;0.5333;1.0000" values="100 0;100 0;0 0;0 0;-120 0;-120 0" dur="15s" begin="tg-play.begin+0s" fill="freeze"/><g><animate attributeName="opacity" keyTimes="0.0000;0.3667;0.4067;1.0000" values="1;1;0;0" dur="15s" begin="tg-play.begin+0s" fill="freeze"/><text x="356" y="306" font-size="18" font-weight="800"><tspan fill="#2563eb">H</tspan><tspan fill="#dc2626">O</tspan></text><line x1="390" y1="300" x2="412" y2="300" stroke="#111827" stroke-width="3"/></g><text x="420" y="306" font-size="18" font-weight="800">C</text><line x1="426" y1="288" x2="426" y2="268" stroke="#111827" stroke-width="3"/><line x1="432" y1="288" x2="432" y2="268" stroke="#111827" stroke-width="3"/><text x="420" y="262" font-size="18" font-weight="800" fill="#dc2626">O</text><polyline points="436,300 482,282 528,300 574,282 620,300 666,282 712,300 758,282 804,300" fill="none" stroke="#111827" stroke-width="3"/><text x="824" y="305" text-anchor="start" font-size="14" font-weight="800" fill="#111827">CH₃</text></g><g transform="translate(-120 0)"><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.1667;0.2667;0.4000;0.5333;1.0000" values="100 0;100 0;0 0;0 0;-120 0;-120 0" dur="15s" begin="tg-play.begin+0s" fill="freeze"/><g><animate attributeName="opacity" keyTimes="0.0000;0.4000;0.4400;1.0000" values="1;1;0;0" dur="15s" begin="tg-play.begin+0s" fill="freeze"/><text x="356" y="436" font-size="18" font-weight="800"><tspan fill="#2563eb">H</tspan><tspan fill="#dc2626">O</tspan></text><line x1="390" y1="430" x2="412" y2="430" stroke="#111827" stroke-width="3"/></g><text x="420" y="436" font-size="18" font-weight="800">C</text><line x1="426" y1="418" x2="426" y2="398" stroke="#111827" stroke-width="3"/><line x1="432" y1="418" x2="432" y2="398" stroke="#111827" stroke-width="3"/><text x="420" y="392" font-size="18" font-weight="800" fill="#dc2626">O</text><polyline points="436,430 482,412 528,430 574,412 620,430 650,464 680,478 710,532 740,525" fill="none" stroke="#111827" stroke-width="3"/><line x1="617.0" y1="432.6" x2="647.0" y2="466.6" stroke="#16a34a" stroke-width="3"/><line x1="623.0" y1="427.4" x2="653.0" y2="461.4" stroke="#16a34a" stroke-width="3"/><text x="760" y="530.2" text-anchor="start" font-size="14" font-weight="800" fill="#111827">CH₃</text></g></g></g>
<g><animate attributeName="opacity" keyTimes="0.0000;0.1667;0.1867;1.0000" values="0;0;1;1" dur="15s" begin="tg-play.begin+0s" fill="freeze"/><text x="700" y="100" text-anchor="middle" font-size="14" font-weight="800" fill="#111827">fatty acids</text></g>
<g class="part" data-part="cond" data-name="Condensation" data-info="Each –OH of glycerol reacts with the –COOH of a fatty acid, releasing one water molecule: three in total." tabindex="0" role="button" aria-label="Condensation"><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.3333;0.3467;0.5333;0.5467;1.0000" values="0;0;1;1;0;0" dur="15s" begin="tg-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.3333;0.4333;1.0000" values="300 170;300 170;360 100;360 100" dur="15s" begin="tg-play.begin+0s" fill="freeze"/><g><circle r="16" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="0" y="5" text-anchor="middle" font-size="11" font-weight="800" fill="#1d4ed8">H₂O</text></g></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.3667;0.3800;0.5333;0.5467;1.0000" values="0;0;1;1;0;0" dur="15s" begin="tg-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.3667;0.4667;1.0000" values="300 300;300 300;360 230;360 230" dur="15s" begin="tg-play.begin+0s" fill="freeze"/><g><circle r="16" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="0" y="5" text-anchor="middle" font-size="11" font-weight="800" fill="#1d4ed8">H₂O</text></g></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.4000;0.4133;0.5333;0.5467;1.0000" values="0;0;1;1;0;0" dur="15s" begin="tg-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.4000;0.5000;1.0000" values="300 430;300 430;360 360;360 360" dur="15s" begin="tg-play.begin+0s" fill="freeze"/><g><circle r="16" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="0" y="5" text-anchor="middle" font-size="11" font-weight="800" fill="#1d4ed8">H₂O</text></g></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.3333;0.3533;0.5667;0.5867;1.0000" values="0;0;1;1;0;0" dur="15s" begin="tg-play.begin+0s" fill="freeze"/><rect x="190.0" y="548" width="280" height="24" rx="12" fill="#dbeafe" stroke="#1f2937" stroke-width="1"/><text x="330" y="565" text-anchor="middle" font-size="12" font-weight="700">3 × condensation → 3 H₂O released</text></g></g>
<g class="part" data-part="ester" data-name="Ester bonds" data-info="The –O–C(=O)– links between glycerol and each fatty acid." tabindex="0" role="button" aria-label="Ester bonds"><g><animate attributeName="opacity" keyTimes="0.0000;0.5333;0.5533;1.0000" values="0;0;1;1" dur="15s" begin="tg-play.begin+0s" fill="freeze"/><rect x="190" y="118" width="170" height="72" rx="12" fill="#fef08a" fill-opacity=".35" stroke="#ca8a04" stroke-width="2" stroke-dasharray="6 4"/><rect x="190" y="248" width="170" height="72" rx="12" fill="#fef08a" fill-opacity=".35" stroke="#ca8a04" stroke-width="2" stroke-dasharray="6 4"/><rect x="190" y="378" width="170" height="72" rx="12" fill="#fef08a" fill-opacity=".35" stroke="#ca8a04" stroke-width="2" stroke-dasharray="6 4"/><line x1="184" y1="170" x2="210" y2="170" stroke="#111827" stroke-width="3"/><text x="212" y="176" font-size="18" font-weight="800" fill="#dc2626">O</text><line x1="232" y1="170" x2="292" y2="170" stroke="#111827" stroke-width="3"/><line x1="184" y1="300" x2="210" y2="300" stroke="#111827" stroke-width="3"/><text x="212" y="306" font-size="18" font-weight="800" fill="#dc2626">O</text><line x1="232" y1="300" x2="292" y2="300" stroke="#111827" stroke-width="3"/><line x1="184" y1="430" x2="210" y2="430" stroke="#111827" stroke-width="3"/><text x="212" y="436" font-size="18" font-weight="800" fill="#dc2626">O</text><line x1="232" y1="430" x2="292" y2="430" stroke="#111827" stroke-width="3"/><text x="290" y="140" text-anchor="middle" font-size="13" font-weight="800" fill="#a16207">ester bond</text></g></g>
<g class="part" data-part="sat" data-name="Saturated" data-info="No C=C double bonds: straight chains that pack closely, so solid at room temperature (most animal fats)." tabindex="0" role="button" aria-label="Saturated"><g><animate attributeName="opacity" keyTimes="0.0000;0.7333;0.7533;1.0000" values="0;0;1;1" dur="15s" begin="tg-play.begin+0s" fill="freeze"/><line x1="600" y1="160" x2="780" y2="140" stroke="#475569" stroke-width="1.5"/><circle cx="600" cy="160" r="3" fill="#475569"/><text x="784" y="144" text-anchor="start" font-size="13" font-weight="800" fill="#111827">saturated: straight chain</text><line x1="600" y1="290" x2="780" y2="250" stroke="#475569" stroke-width="1.5"/><circle cx="600" cy="290" r="3" fill="#475569"/><text x="784" y="246" text-anchor="start" font-size="13" font-weight="800" fill="#111827">saturated</text></g></g>
<g class="part" data-part="unsat" data-name="Unsaturated (cis)" data-info="One or more C=C double bonds; a cis double bond kinks the chain, so they pack loosely: liquid oils." tabindex="0" role="button" aria-label="Unsaturated (cis)"><g><animate attributeName="opacity" keyTimes="0.0000;0.7333;0.7533;1.0000" values="0;0;1;1" dur="15s" begin="tg-play.begin+0s" fill="freeze"/><line x1="540" y1="446" x2="780" y2="530" stroke="#475569" stroke-width="1.5"/><circle cx="540" cy="446" r="3" fill="#475569"/><text x="784" y="534" text-anchor="start" font-size="13" font-weight="800" fill="#15803d">unsaturated: cis C=C → kink</text></g></g>
<g><animate attributeName="opacity" keyTimes="0.0000;0.8000;0.8200;1.0000" values="0;0;1;1" dur="15s" begin="tg-play.begin+0s" fill="freeze"/><rect x="760" y="580" width="440" height="100" rx="14" fill="#f8fafc" stroke="#cbd5e1"/><text x="980" y="606" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">Saturated fats pack tightly → solid (e.g. butter)</text><text x="980" y="630" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">Unsaturated oils: kinks keep them apart → liquid</text><text x="980" y="654" text-anchor="middle" font-size="12" font-weight="700" fill="#475569">Triglycerides store energy and insulate</text></g>
</svg>