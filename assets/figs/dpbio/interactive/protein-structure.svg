<g class="part" data-part="ter" data-name="Tertiary structure" data-info="The whole polypeptide folds into a precise 3D shape, held by bonds between R groups: hydrogen bonds, ionic bonds, disulfide bridges and hydrophobic interactions." tabindex="0" role="button" aria-label="Tertiary structure"><rect x="630" y="80" width="280" height="500" rx="14" fill="#f8fafc" stroke="#cbd5e1"/><text x="770" y="108" text-anchor="middle" font-size="15" font-weight="800" fill="#111827">3 Tertiary</text><clipPath id="pr-c80"><rect x="660" y="120" width="240" height="400"><animate attributeName="width" keyTimes="0.0000;0.5000;0.6562;1.0000" values="0;0;240;240" dur="16s" begin="pr-play.begin+0s" fill="freeze"/></rect></clipPath><g clip-path="url(#pr-c80)"><path d="M 680 180 C 760 130 850 170 840 230 C 830 290 700 250 700 320 C 700 390 840 340 860 410 C 880 480 740 500 700 450" fill="none" stroke="#f97316" stroke-width="10" stroke-linecap="round"/><path d="M 730 160 C 740 200 760 210 780 190" fill="none" stroke="#7c3aed" stroke-width="10"/></g><g><animate attributeName="opacity" keyTimes="0.0000;0.6562;0.6750;1.0000" values="0;0;1;1" dur="16s" begin="pr-play.begin+0s" fill="freeze"/><line x1="770" y1="230" x2="760" y2="290" stroke="#eab308" stroke-width="4"/><text x="796" y="268" text-anchor="middle" font-size="11" font-weight="800" fill="#a16207">S–S</text><line x1="710" y1="330" x2="780" y2="380" stroke="#0ea5e9" stroke-width="2" stroke-dasharray="3 3"/><text x="760" y="344" text-anchor="middle" font-size="10" font-weight="800" fill="#0369a1">H bond</text><text x="840" y="300" font-size="12" font-weight="800" fill="#dc2626">+</text><text x="850" y="312" font-size="12" font-weight="800" fill="#2563eb">−</text><text x="850" y="330" text-anchor="middle" font-size="10" font-weight="800" fill="#334155">ionic</text><circle cx="760" cy="440" r="18" fill="#fde68a" opacity=".7"/><text x="760" y="476" text-anchor="middle" font-size="10" font-weight="800" fill="#92400e">hydrophobic core</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.6562;0.6750;1.0000" values="0;0;1;1" dur="16s" begin="pr-play.begin+0s" fill="freeze"/><text x="770" y="540" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">bonds between R groups</text><text x="770" y="556" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">set the precise 3D shape</text></g></g>
