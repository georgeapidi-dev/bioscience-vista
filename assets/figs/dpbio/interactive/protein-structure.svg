<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 600" class="vd-svg" role="img" aria-labelledby="pr-title pr-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="pr-play" data-vd-play-label="Play: folding a protein" data-vd-steps="[[0, &quot;Four levels of protein structure.&quot;], [1, &quot;Primary: a chain of amino acids in a particular order, joined by peptide bonds.&quot;], [4, &quot;Secondary: hydrogen bonds fold parts of the chain into alpha helices and beta pleated sheets.&quot;], [8, &quot;Tertiary: the chain folds into a 3D shape held by bonds between R groups.&quot;], [12, &quot;Quaternary: several polypeptides join, e.g. haemoglobin.&quot;]]" data-vd-dur="16">
<title id="pr-title">Levels of protein structure</title><desc id="pr-desc">Primary structure as a chain of amino acids, secondary structure as an alpha helix and beta pleated sheet with hydrogen bonds, tertiary structure as a folded polypeptide with bonds between R groups, and quaternary structure of four chains.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1220" height="600" fill="#ffffff"/>
<g aria-hidden="true"><animate id="pr-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<text class="head" x="30" y="34">The four levels of protein structure</text><text class="note" x="30" y="56">Each bead is one amino acid; colours show different R groups.</text>
<g class="part" data-part="pri" data-name="Primary structure" data-info="The sequence of amino acids in the polypeptide, joined by peptide bonds. It is set by the gene and determines all the other levels." tabindex="0" role="button" aria-label="Primary structure"><rect x="20" y="80" width="280" height="500" rx="14" fill="#f8fafc" stroke="#cbd5e1"/><text x="160" y="108" text-anchor="middle" font-size="15" font-weight="800" fill="#111827">1 Primary</text><g><animate attributeName="opacity" keyTimes="0.0000;0.0625;0.0813;1.0000" values="0;0;1;1" dur="16s" begin="pr-play.begin+0s" fill="freeze"/><circle cx="140" cy="140" r="15" fill="#ef4444" stroke="#1f2937"/><text x="140" y="144" text-anchor="middle" font-size="9" font-weight="800" fill="#fff">Gly</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.0750;0.0938;1.0000" values="0;0;1;1" dur="16s" begin="pr-play.begin+0s" fill="freeze"/><line x1="140" y1="140" x2="180" y2="180" stroke="#64748b" stroke-width="3"/><circle cx="180" cy="180" r="15" fill="#3b82f6" stroke="#1f2937"/><text x="180" y="184" text-anchor="middle" font-size="9" font-weight="800" fill="#fff">Ala</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.0875;0.1062;1.0000" values="0;0;1;1" dur="16s" begin="pr-play.begin+0s" fill="freeze"/><line x1="180" y1="180" x2="140" y2="220" stroke="#64748b" stroke-width="3"/><circle cx="140" cy="220" r="15" fill="#22c55e" stroke="#1f2937"/><text x="140" y="224" text-anchor="middle" font-size="9" font-weight="800" fill="#fff">Ser</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.1000;0.1188;1.0000" values="0;0;1;1" dur="16s" begin="pr-play.begin+0s" fill="freeze"/><line x1="140" y1="220" x2="180" y2="260" stroke="#64748b" stroke-width="3"/><circle cx="180" cy="260" r="15" fill="#eab308" stroke="#1f2937"/><text x="180" y="264" text-anchor="middle" font-size="9" font-weight="800" fill="#fff">Leu</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.1125;0.1313;1.0000" v