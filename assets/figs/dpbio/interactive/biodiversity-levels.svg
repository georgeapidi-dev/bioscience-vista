<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" class="vd-svg" role="img" aria-labelledby="bl-title bl-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="bl-play" data-vd-play-label="Play: zoom in" data-vd-steps="[[0, &quot;Biodiversity at three levels.&quot;], [1, &quot;Ecosystem diversity: many kinds of habitat.&quot;], [5, &quot;Species diversity: many species in each.&quot;], [9, &quot;Genetic diversity: variation within each species.&quot;]]" data-vd-dur="13">
<title id="bl-title">Three levels of biodiversity</title><desc id="bl-desc">Zooming in from a range of ecosystems, to the species in one ecosystem, to genetic variation between individuals of one species.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="560" fill="#ffffff"/>
<g aria-hidden="true"><animate id="bl-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<text class="head" x="30" y="34">Biodiversity at three levels</text><text class="note" x="30" y="56">Zooming in from ecosystems to genes.</text>
<g class="part" data-part="eco" data-name="Ecosystem diversity" data-info="The range of habitats and ecosystems: in Kenya, coral reefs, mangroves, savanna, montane forest, alpine moorland..." tabindex="0" role="button" aria-label="Ecosystem diversity"><rect x="30" y="80" width="330" height="460" rx="16" fill="#ecfeff" stroke="#67e8f9"/><text x="195" y="108" text-anchor="middle" font-size="15" font-weight="800" fill="#0e7490">ECOSYSTEMS</text><g><animate attributeName="opacity" keyTimes="0.0000;0.0769;0.1000;1.0000" values="0;0;1;1" dur="13s" begin="bl-play.begin+0s" fill="freeze"/><rect x="60" y="130" width="270" height="62" rx="10" fill="#38bdf8" opacity=".85"/><text x="195" y="167" text-anchor="middle" font-size="14" font-weight="800" fill="#0f172a">coral reef</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.1231;0.1462;1.0000" values="0;0;1;1" dur="13s" begin="bl-play.begin+0s" fill="freeze"/><rect x="60" y="208" width="270" height="62" rx="10" fill="#14b8a6" opacity=".85"/><text x="195" y="245" text-anchor="middle" font-size="14" font-weight="800" fill="#0f172a">mangrove</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.1692;0.1923;1.0000" values="0;0;1;1" dur="13s" begin="bl-play.begin+0s" fill="freeze"/><rect x="60" y="286" width="270" height="62" rx="10" fill="#facc15" opacity=".85"/><text x="195" y="323" text-anchor="middle" font-size="14" font-weight="800" fill="#0f172a">savanna</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.2154;0.2385;1.0000" values="0;0;1;1" dur="13s" begin="bl-play.begin+0s" fill="freeze"/><rect x="60" y="364" width="270" height="62" rx="10" fill="#16a34a" opacity=".85"/><text x="195" y="401" text-anchor="middle" font-size="14" font-weight="800" fill="#0f172a">montane forest</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.2615;0.2846;1.0000" values="0;0;1;1" dur="13s" begin="bl-play.begin+0s" fill="freeze"/><rect x="60" y="442" width="270" height="62" rx="10" fill="#a8a29e" opacity=".85"/><text x="195" y="479" text-anchor="middle" font-size="14" font-weight="800" fill="#0f172a">alpine moorland</text></g></g>
<g class="part" data-part="sp" data-name="Species diversity" data-info="The number of species (richness) and how evenly individuals are spread among them." tabindex="0" role="button" aria-label="Species diversity"><rect x="385" y="80" width="330" height="460" rx="16" fill="#fefce8" stroke="#fde047"/><text x="550" y="108" text-anchor="middle" font-size="15" font-weight="800" fill="#a16207">SPECIES (in the savanna)</text><g><animate attributeName="opacity" keyTimes="0.0000;0.3846;0.4077;1.0000" values="0;0;1;1" dur="13s" begin="bl-play.begin+0s" fill="freeze"/><circle cx="470" cy="180" r="38" fill="#f59e0b" opacity=".85"/><text x="470" y="238" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">giraffe</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.4154;0.4385;1.0000" values="0;0;1;1" dur="13s" begin="bl-play.begin+0s" fill="freeze"/><circle cx="630" cy="180" r="38" fill="#64748b" opacity=".85"/><text x="630" y="238" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">zebra</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.4462;0.4692;1.0000" values="0;0;1;1" dur="13s" begin="bl-play.begin+0s" fill="freeze"/><circle cx="470" cy="300" r="38" fill="#d97706" opacity=".85"/><text x="470" y="358" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">lion</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.4769;0.5000;1.0000" values="0;0;1;1" dur="13s" begin="bl-play.begin+0s" fill="freeze"/><circle cx="630" cy="300" r="38" fill="#16a34a" opacity=".85"/><text x="630" y="358" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">acacia</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.5077;0.5308;1.0000" values="0;0;1;1" dur="13s" begin="bl-play.begin+0s" fill="freeze"/><circle cx="470" cy="420" r="38" fill="#78716c" opacity=".85"/><text x="470" y="478" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">wildebeest</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.5385;0.5615;1.0000" values="0;0;1;1" dur="13s" begin="bl-play.begin+0s" fill="freeze"/><circle cx="630" cy="420" r="38" fill="#9ca3af" opacity=".85"/><text x="630" y="478" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">elephant</text></g></g>
