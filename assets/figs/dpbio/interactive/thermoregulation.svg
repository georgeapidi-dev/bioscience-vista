<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" class="vd-svg" role="img" aria-labelledby="th-title th-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="th-play" data-vd-play-label="Play: too hot, then too cold" data-vd-steps="[[0, &quot;Body temperature is kept close to 37 \u00b0C by negative feedback.&quot;], [1, &quot;Too hot (e.g. exercise): thermoreceptors detect the rise; the hypothalamus is the coordinator.&quot;], [3, &quot;Effectors respond: sweating, vasodilation and hairs lying flat increase heat loss. Temperature falls back to normal.&quot;], [8, &quot;Too cold: receptors detect the fall; the hypothalamus sends impulses to different effectors.&quot;], [10, &quot;Shivering, vasoconstriction and raised hairs reduce heat loss and increase heat production. Temperature rises back to normal.&quot;]]" data-vd-dur="16">
<title id="th-title">Thermoregulation: negative feedback</title><desc id="th-desc">A negative feedback loop for body temperature: a rise or fall from 37 °C is detected by receptors, the hypothalamus coordinates, and effectors return the temperature to normal; a temperature graph oscillates around the set point.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1200" height="640" fill="#ffffff"/>
<g aria-hidden="true"><animate id="th-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<defs><marker id="th-475569" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#475569"/></marker><marker id="th-dc2626" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#dc2626"/></marker><marker id="th-2563eb" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#2563eb"/></marker></defs>
<text class="head" x="30" y="34">Thermoregulation: a negative feedback loop</text><text class="note" x="30" y="56">Stimulus → receptor → coordinator → effector → response.</text>
<g class="part" data-part="set" data-name="Set point: about 37 °C" data-info="The normal core body temperature. Negative feedback keeps the temperature close to it." tabindex="0" role="button" aria-label="Set point: about 37 °C"><rect x="450" y="270" width="220" height="70" rx="12" fill="#dcfce7" stroke="#1f2937" stroke-width="2"/><text x="560.0" y="299.0" text-anchor="middle" font-size="15" font-weight="800">Normal: 37 °C</text><text x="560.0" y="319.0" text-anchor="middle" font-size="12">set point</text></g>
<rect x="450" y="100" width="220" height="60" rx="12" fill="#fee2e2" stroke="#1f2937" stroke-width="2"/><text x="560.0" y="130.0" text-anchor="middle" font-size="15" font-weight="800">Temperature rises</text><rect x="450" y="450" width="220" height="60" rx="12" fill="#dbeafe" stroke="#1f2937" stroke-width="2"/><text x="560.0" y="480.0" text-anchor="middle" font-size="15" font-weight="800">Temperature falls</text>
<g class="part" data-part="rec" data-name="Receptors" data-info="Thermoreceptors in the skin and in the hypothalamus detect changes in temperature." tabindex="0" role="button" aria-label="Receptors"><rect x="760" y="100" width="200" height="60" rx="12" fill="#fef3c7" stroke="#1f2937" stroke-width="2"/><text x="860.0" y="124.0" text-anchor="middle" font-size="15" font-weight="800">Thermoreceptors</text><text x="860.0" y="144.0" text-anchor="middle" font-size="12">skin, hypothalamus</text><rect x="160" y="470" width="200" height="60" rx="12" fill="#fef3c7" stroke="#1f2937" stroke-width="2"/><text x="260.0" y="494.0" text-anchor="middle" font-size="15" font-weight="800">Thermoreceptors</text><text x="260.0" y="514.0" text-anchor="middle" font-size="12">skin, hypothalamus</text></g>
<g class="part" data-part="hyp" data-name="Hypothalamus (coordinator)" data-info="In the brain: compares the blood temperature with the set point and sends nerve impulses to effectors." tabindex="0" role="button" aria-label="Hypothalamus (coordinator)"><rect x="760" y="190" width="200" height="60" rx="12" fill="#ede9fe" stroke="#1f2937" stroke-width="2"/><text x="860.0" y="214.0" text-anchor="middle" font-size="15" font-weight="800">Hypothalamus</text><text x="860.0" y="234.0" text-anchor="middle" font-size="12">coordinator</text><rect x="160" y="380" width="200" height="60" rx="12" fill="#ede9fe" stroke="#1f2937" stroke-width="2"/><text x="260.0" y="404.0" text-anchor="middle" font-size="15" font-weight="800">Hypothalamus</text><text x="260.0" y="424.0" text-anchor="middle" font-size="12">coordinator</text></g>
<g class="part" data-part="hot" data-name="Responses when too hot" data-info="Sweat glands secrete sweat (evaporation cools the skin); arterioles to the skin dilate (vasodilation) so more heat is lost; hairs lie flat." tabindex="0" role="button" aria-label="Responses when too hot"><rect x="760" y="280" width="300" height="110" rx="12" fill="#fecaca" stroke="#1f2937" stroke-width="2"/><text x="910.0" y="304" text-anchor="middle" font-size="15" font-weight="800">Effectors: cool down</text><text x="776" y="330" font-size="12">• sweat glands: sweating</text><text x="776" y="350" font-size="12">• skin arterioles dilate (vasodilation)</text><text x="776" y="370" font-size="12">• hair erector muscles relax</text></g>
<g class="part" data-part="cold" data-name="Responses when too cold" data-info="Muscles shiver (respiration releases heat); skin arterioles constrict (vasoconstriction); hairs stand up and trap air; metabolic rate rises." tabindex="0" role="button" aria-label="Responses when too cold"><rect x="40" y="240" width="340" height="110" rx="12" fill="#bfdbfe" stroke="#1f2937" stroke-width="2"/><text x="210.0" y="264" text-anchor="middle" font-size="15" font-weight="800">Effectors: warm up</text><text x="56" y="290" font-size="12">• muscles shiver</text><text x="56" y="310" font-size="12">• skin arterioles constrict (vasoconstriction)</text><text x="56" y="330" font-size="12">• hairs raised; metabolic rate increases</text></g>
<g class="part" data-part="nf" data-name="Negative feedback" data-info="A change away from the set point causes responses that reverse the change, returning conditions to normal." tabindex="0" role="button" aria-label="Negative feedback"><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.0625;0.0813;0.4688;0.4875;1.0000" values="0;0;1;1;0;0" dur="16s" begin="th-play.begin+0s" fill="freeze"/><path d="M 560 268 L 560 166" fill="none" stroke="#dc2626" stroke-width="4" marker-end="url(#th-dc2626)"/></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.0938;0.1125;0.4688;0.4875;1.0000" values="0;0;1;1;0;0" dur="16s" begin="th-play.begin+0s" fill="freeze"/><path d="M 672 130 L 754 130" fill="none" stroke="#dc2626" stroke-width="4" marker-end="url(#th-dc2626)"/></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.1250;0.1437;0.4688;0.4875;1.0000" values="0;0;1;1;0;0" dur="16s" begin="th-play.begin+0s" fill="freeze"/><path d="M 860 162 L 860 186" fill="none" stroke="#dc2626" stroke-width="4" marker-end="url(#th-dc2626)"/></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.1562;0.1750;0.4688;0.4875;1.0000" values="0;0;1;1;0;0" dur="16s" begin="th-play.begin+0s" fill="freeze"/><path d="M 860 252 L 860 276" fill="none" stroke="#dc2626" stroke-width="4" marker-end="url(#th-dc2626)"/></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.2500;0.2687;0.4688;0.4875;1.0000" values="0;0;1;1;0;0" dur="16s" begin="th-play.begin+0s" fill="freeze"/><path d="M 756 335 L 676 315" fill="none" stroke="#dc2626" stroke-width="4" marker-end="url(#th-dc2626)"/></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.5000;0.5188;1.0000;1.0000;1.0000" values="0;0;1;1;0;0" dur="16s" begin="th-play.begin+0s" fill="freeze"/><path d="M 560 342 L 560 444" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#th-2563eb)"/></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.5312;0.5500;1.0000;1.0000;1.0000" values="0;0;1;1;0;0" dur="16s" begin="th-play.begin+0s" fill="freeze"/><path d="M 448 492 L 366 496" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#th-2563eb)"/></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.5625;0.5813;1.0000;1.0000;1.0000" values="0;0;1;1;0;0" dur="16s" begin="th-play.begin+0s" fill="freeze"/><path d="M 260 468 L 260 446" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#th-2563eb)"/></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.5938;0.6125;1.0000;1.0000;1.0000" values="0;0;1;1;0;0" dur="16s" begin="th-play.begin+0s" fill="freeze"/><path d="M 260 378 L 260 356" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#th-2563eb)"/></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.6875;0.7063;1.0000;1.0000;1.0000" values="0;0;1;1;0;0" dur="16s" begin="th-play.begin+0s" fill="freeze"/><path d="M 382 300 L 446 302" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#th-2563eb)"/></g></g>
