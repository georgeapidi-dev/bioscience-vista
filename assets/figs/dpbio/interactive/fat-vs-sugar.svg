<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" class="vd-svg" role="img" aria-labelledby="fs-title fs-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="fs-play" data-vd-play-label="Play: two fuels" data-vd-steps="[[0, &quot;Respiring fat or sugar?&quot;], [1, &quot;Glucose: glycolysis \u2192 pyruvate \u2192 acetyl CoA.&quot;], [5, &quot;Fatty acids: cut into 2-carbon pieces that become acetyl CoA directly.&quot;], [9.5, &quot;Both feed the Krebs cycle; fat yields far more reduced NAD and FAD.&quot;]]" data-vd-dur="14">
<title id="fs-title">Respiring carbohydrate and lipid</title><desc id="fs-desc">Glucose passes through glycolysis and the link reaction to acetyl CoA, whereas a fatty acid is cut into two-carbon acetyl groups that enter the Krebs cycle directly as acetyl CoA, supplying more reduced NAD and FAD.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="560" fill="#ffffff"/>
<g aria-hidden="true"><animate id="fs-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<defs><marker id="fs-475569" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="6.3" refY="7.0" orient="auto"><path d="M0,0 L14,7.0 L0,14 z" fill="#475569"/></marker></defs>
<text class="head" x="30" y="34">Fat or sugar? Two routes into the Krebs cycle</text><text class="note" x="30" y="56">Circles = carbon atoms.</text>
<g class="part" data-part="glu" data-name="Carbohydrate route" data-info="Glucose goes through glycolysis (in the cytoplasm), the link reaction and the Krebs cycle. Only carbohydrate can be respired anaerobically." tabindex="0" role="button" aria-label="Carbohydrate route"><circle cx="147.5" cy="120" r="10" fill="#fbbf24" stroke="#a16207" stroke-width="1.5"/><circle cx="168.5" cy="120" r="10" fill="#fbbf24" stroke="#a16207" stroke-width="1.5"/><circle cx="189.5" cy="120" r="10" fill="#fbbf24" stroke="#a16207" stroke-width="1.5"/><circle cx="210.5" cy="120" r="10" fill="#fbbf24" stroke="#a16207" stroke-width="1.5"/><circle cx="231.5" cy="120" r="10" fill="#fbbf24" stroke="#a16207" stroke-width="1.5"/><circle cx="252.5" cy="120" r="10" fill="#fbbf24" stroke="#a16207" stroke-width="1.5"/><text x="200" y="96" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">glucose (6C)</text><g><animate attributeName="opacity" keyTimes="0.0000;0.0714;0.0929;1.0000" values="0;0;1;1" dur="14s" begin="fs-play.begin+0s" fill="freeze"/><path d="M 200 140 L 200 200" stroke="#475569" stroke-width="3" marker-end="url(#fs-475569)"/><text x="210" y="176" text-anchor="start" font-size="12" font-weight="800" fill="#475569">glycolysis (cytoplasm)</text><circle cx="179.0" cy="230" r="10" fill="#fbbf24" stroke="#a16207" stroke-width="1.5"/><circle cx="200.0" cy="230" r="10" fill="#fbbf24" stroke="#a16207" stroke-width="1.5"/><circle cx="221.0" cy="230" r="10" fill="#fbbf24" stroke="#a16207" stroke-width="1.5"/><text x="260" y="236" text-anchor="start" font-size="12" font-weight="800" fill="#111827">pyruvate ×2</text><path d="M 200 250 L 360 330" stroke="#475569" stroke-width="3" marker-end="url(#fs-475569)"/><text x="240" y="310" text-anchor="end" font-size="12" font-weight="800" fill="#475569">link reaction</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.2857;0.3071;1.0000" values="0;0;1;1" dur="14s" begin="fs-play.begin+0s" fill="freeze"/><text x="140" y="400" text-anchor="middle" font-size="12" font-weight="800" fill="#a16207">also anaerobic (glycolysis)</text></g></g>
<g class="part" data-part="fat" data-name="Lipid route" data-info="Fatty acids are broken into 2C acetyl groups that enter the Krebs cycle directly as acetyl CoA, bypassing glycolysis. Lipids can only be respired aerobically." tabindex="0" role="button" aria-label="Lipid route"><path d="M 720 120 L 744 130 L 768 110 L 792 130 L 816 110 L 840 130 L 864 110 L 888 130 L 912 110 L 936 130 L 960 110 L 984 130 L 1008 110 L 1032 130 L 1056 110 L 1080 130" fill="none" stroke="#f97316" stroke-width="6"/><text x="900" y="96" text-anchor="middle" font-size="13" font-weight="800" fill="#c2410c">fatty acid (16C)</text><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.3571;0.3714;0.6429;0.6571;1.0000" values="0;0;1;1;0;0" dur="14s" begin="fs-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.3571;0.4643;0.6071;1.0000" values="735 120;735 120;735 200;560 330;560 330" dur="14s" begin="fs-play.begin+0s" fill="freeze"/><circle cx="-8.4" cy="0" r="8" fill="#fdba74" stroke="#c2410c" stroke-width="1.5"/><circle cx="8.4" cy="0" r="8" fill="#fdba74" stroke="#c2410c" stroke-width="1.5"/></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.3821;0.3964;0.6500;0.6643;1.0000" values="0;0;1;1;0;0" dur="14s" begin="fs-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.3821;0.4893;0.6143;1.0000" values="783 120;783 120;783 200;570 330;570 330" dur="14s" begin="fs-play.begin+0s" fill="freeze"/><circle cx="-8.4" cy="0" r="8" fill="#fdba74" stroke="#c2410c" stroke-width="1.5"/><circle cx="8.4" cy="0" r="8" fill="#fdba74" stroke="#c2410c" stroke-width="1.5"/></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.4071;0.4214;0.6571;0.6714;1.0000" values="0;0;1;1;0;0" dur="14s" begin="fs-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.4071;0.5143;0.6214;1.0000" values="831 120;831 120;831 200;580 330;580 330" dur="14s" begin="fs-play.begin+0s" fill="freeze"/><circle cx="-8.4" cy="0" r="8" fill="#fdba74" stroke="#c2410c" stroke-width="1.5"/><circle cx="8.4" cy="0" r="8" fill="#fdba74" stroke="#c2410c" stroke-width="1.5"/></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.4321;0.4464;0.6643;0.6786;1.0000" values="0;0;1;1;0;0" dur="14s" begin="fs-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.4321;0.5393;0.6286;1.0000" values="879 120;879 120;879 200;590 330;590 330" dur="14s" begin="fs-play.begin+0s" fill="freeze"/><circle cx="-8.4" cy="0" r="8" fill="#fdba74" stroke="#c2410c" stroke-width="1.5"/><circle cx="8.4" cy="0" r="8" fill="#fdba74" stroke="#c2410c" stroke-width="1.5"/></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.4571;0.4714;0.6714;0.6857;1.0000" values="0;0;1;1;0;0" dur="14s" begin="fs-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.4571;0.5643;0.6357;1.0000" values="927 120;927 120;927 200;560 340;560 340" dur="14s" begin="fs-play.begin+0s" fill="freeze"/><circle cx="-8.4" cy="0" r="8" fill="#fdba74" stroke="#c2410c" stroke-width="1.5"/><circle cx="8.4" cy="0" r="8" fill="#fdba74" stroke="#c2410c" stroke-width="1.5"/></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.4821;0.4964;0.6786;0.6929;1.0000" values="0;0;1;1;0;0" dur="14s" begin="fs-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.4821;0.5893;0.6429;1.0000" values="975 120;975 120;975 200;570 340;570 340" dur="14s" begin="fs-play.begin+0s" fill="freeze"/><circle cx="-8.4" cy="0" r="8" fill="#fdba74" stroke="#c2410c" stroke-width="1.5"/><circle cx="8.4" cy="0" r="8" fill="#fdba74" stroke="#c2410c" stroke-width="1.5"/></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.5071;0.5214;0.6857;0.7000;1.0000" values="0;0;1;1;0;0" dur="14s" begin="fs-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.5071;0.6143;0.6500;1.0000" values="1023 120;1023 120;1023 200;580 340;580 340" dur="14s" begin="fs-play.begin+0s" fill="freeze"/><circle cx="-8.4" cy="0" r="8" fill="#fdba74" stroke="#c2410c" stroke-width="1.5"/><circle cx="8.4" cy="0" r="8" fill="#fdba74" stroke="#c2410c" stroke-width="1.5"/></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.5321;0.5464;0.6929;0.7071;1.0000" values="0;0;1;1;0;0" dur="14s" begin="fs-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.5321;0.6393;0.6571;1.0000" values="1071 120;1071 120;1071 200;590 340;590 340" dur="14s" begin="fs-play.begin+0s" fill="freeze"/><circle cx="-8.4" cy="0" r="8" fill="#fdba74" stroke="#c2410c" stroke-width="1.5"/><circle cx="8.4" cy="0" r="8" fill="#fdba74" stroke="#c2410c" stroke-width="1.5"/></g></g><g><animate attributeName="opacity" keyTimes="0.0000;0.4286;0.4500;1.0000" values="0;0;1;1" dur="14s" begin="fs-play.begin+0s" fill="freeze"/><text x="910" y="230" text-anchor="middle" font-size="12" font-weight="800" fill="#c2410c">cut into 2C acetyl groups</text><text x="910" y="250" text-anchor="middle" font-size="11" font-weight="700" fill="#c2410c">(aerobic only; bypasses glycolysis)</text></g></g>
<g class="part" data-part="why" data-name="More energy per gram" data-info="Lipids contain less oxygen and more oxidisable hydrogen and carbon, so they supply more reduced NAD and FAD: about twice the energy per gram." tabindex="0" role="button" aria-label="More energy per gram"><circle cx="520" cy="420" r="80" fill="#fef3c7" stroke="#d97706" stroke-width="4"/><text x="520" y="416" text-anchor="middle" font-size="15" font-weight="800" fill="#92400e">Krebs</text><text x="520" y="436" text-anchor="middle" font-size="15" font-weight="800" fill="#92400e">cycle</text><rect x="460" y="300" width="120" height="34" rx="10" fill="#dbeafe" stroke="#1d4ed8"/><text x="520" y="322" text-anchor="middle" font-size="13" font-weight="800" fill="#1d4ed8">acetyl CoA</text><g><animate attributeName="opacity" keyTimes="0.0000;0.6786;0.7000;1.0000" values="0;0;1;1" dur="14s" begin="fs-play.begin+0s" fill="freeze"/><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.6786;0.7000;1.0000" values="0;0;1;1" dur="14s" begin="fs-play.begin+0s" fill="freeze"/><rect x="710.0" y="408" width="300" height="24" rx="12" fill="#dcfce7" stroke="#1f2937" stroke-width="1"/><text x="860" y="425" text-anchor="middle" font-size="12" font-weight="700">fat → many more reduced NAD + FAD</text></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.7500;0.7714;1.0000" values="0;0;1;1" dur="14s" begin="fs-play.begin+0s" fill="freeze"/><rect x="730.0" y="458" width="260" height="24" rx="12" fill="#fef9c3" stroke="#1f2937" stroke-width="1"/><text x="860" y="475" text-anchor="middle" font-size="12" font-weight="700">≈ 37 kJ g⁻¹ versus ≈ 17 kJ g⁻¹</text></g></g></g>
</svg>