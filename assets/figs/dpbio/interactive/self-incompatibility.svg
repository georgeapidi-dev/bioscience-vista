<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" class="vd-svg" role="img" aria-labelledby="si-title si-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="si-play" data-vd-play-label="Play: pollinate" data-vd-steps="[[0, &quot;Self-incompatibility: plants that refuse their own pollen.&quot;], [1, &quot;Stigma genotype S1S2.&quot;], [3, &quot;Pollen carrying S1 matches: recognised as self; the tube stops.&quot;], [7.5, &quot;Pollen carrying S3 is foreign: the tube grows to the ovule.&quot;]]" data-vd-dur="14">
<title id="si-title">Self-incompatibility</title><desc id="si-desc">A stigma with S-alleles S1 and S2: pollen with matching S1 is recognised as self and its pollen tube stops, while pollen with S3 from another plant grows a tube down the style to fertilise the ovule.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="560" fill="#ffffff"/>
<g aria-hidden="true"><animate id="si-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<text class="head" x="30" y="34">Self-incompatibility: the S-locus</text><text class="note" x="30" y="56">Schematic carpel.</text>
<g class="part" data-part="cost" data-name="Self- vs cross-pollination" data-info="Self-pollination transfers pollen to a stigma of the same plant; cross-pollination to another plant of the same species. Selfing reduces genetic variation." tabindex="0" role="button" aria-label="Self- vs cross-pollination"><path d="M 500 120 L 600 120 L 580 160 L 565 400 Q 620 420 620 470 Q 620 520 550 520 Q 480 520 480 470 Q 480 420 535 400 L 520 160 Z" fill="#dcfce7" stroke="#15803d" stroke-width="3"/><circle cx="550" cy="470" r="18" fill="#fef3c7" stroke="#a16207" stroke-width="2"/><text x="550" y="108" text-anchor="middle" font-size="14" font-weight="800" fill="#15803d">stigma S1S2</text><text x="660" y="476" text-anchor="start" font-size="12" font-weight="800" fill="#a16207">ovule</text></g>
<g class="part" data-part="match" data-name="Matching S-allele" data-info="If pollen carries an S-allele matching one in the stigma, it is recognised as &quot;self&quot;: the pollen tube stops growing (or the pollen fails to germinate)." tabindex="0" role="button" aria-label="Matching S-allele"><g><animate attributeName="opacity" keyTimes="0.0000;0.1786;0.2000;1.0000" values="0;0;1;1" dur="14s" begin="si-play.begin+0s" fill="freeze"/><circle cx="520" cy="130" r="12" fill="#fde047" stroke="#a16207" stroke-width="2"/><text x="380" y="132" text-anchor="middle" font-size="13" font-weight="800" fill="#b91c1c">own pollen: S1</text><clipPath id="sim-c30130500"><rect x="500" y="130" width="40" height="100"><animate attributeName="width" keyTimes="0.0000;0.2143;0.3571;1.0000" values="0;0;40;40" dur="14s" begin="si-play.begin+0s" fill="freeze"/></rect></clipPath><g clip-path="url(#sim-c30130500)"><path d="M 520 140 L 532 210" stroke="#a16207" stroke-width="4"/></g><g><animate attributeName="opacity" keyTimes="0.0000;0.3571;0.3786;1.0000" values="0;0;1;1" dur="14s" begin="si-play.begin+0s" fill="freeze"/><text x="380" y="220" text-anchor="middle" font-size="13" font-weight="800" fill="#b91c1c">✗ tube stops: "self"</text></g></g></g>
<g class="part" data-part="diff" data-name="Different S-allele" data-info="Pollen from another plant with a different S-allele grows normally: outcrossing is guaranteed, increasing genetic variation." tabindex="0" role="button" aria-label="Different S-allele"><g><animate attributeName="opacity" keyTimes="0.0000;0.5000;0.5214;1.0000" values="0;0;1;1" dur="14s" begin="si-play.begin+0s" fill="freeze"/><circle cx="582" cy="130" r="12" fill="#c4b5fd" stroke="#5b21b6" stroke-width="2"/><text x="720" y="132" text-anchor="middle" font-size="13" font-weight="800" fill="#5b21b6">other plant: S3</text><clipPath id="sid-c75130540"><rect x="540" y="130" width="60" height="340"><animate attributeName="width" keyTimes="0.0000;0.5357;0.7857;1.0000" values="0;0;60;60" dur="14s" begin="si-play.begin+0s" fill="freeze"/></rect></clipPath><g clip-path="url(#sid-c75130540)"><path d="M 580 140 L 566 200 L 556 300 L 552 452" stroke="#7c3aed" stroke-width="4" fill="none"/></g><g><animate attributeName="opacity" keyTimes="0.0000;0.7857;0.8071;1.0000" values="0;0;1;1" dur="14s" begin="si-play.begin+0s" fill="freeze"/><text x="720" y="330" text-anchor="middle" font-size="13" font-weight="800" fill="#5b21b6">✓ tube grows: fertilisation</text></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.8571;0.8786;1.0000" values="0;0;1;1" dur="14s" begin="si-play.begin+0s" fill="freeze"/><rect x="650.0" y="508" width="380" height="24" rx="12" fill="#ede9fe" stroke="#1f2937" stroke-width="1"/><text x="840" y="525" text-anchor="middle" font-size="12" font-weight="700">guarantees outcrossing → more genetic variation</text></g></g>
</svg>