<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" class="vd-svg" role="img" aria-labelledby="mf-title mf-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="mf-play" data-vd-play-label="Play: pack the tails" data-vd-steps="[[0, &quot;Fatty acids and membrane fluidity.&quot;], [1, &quot;Saturated tails are straight and pack tightly.&quot;], [4, &quot;Unsaturated tails are kinked and cannot pack closely: more fluid.&quot;], [8, &quot;E. coli grown in the cold makes more unsaturated fatty acids.&quot;]]" data-vd-dur="13">
<title id="mf-title">Membrane fluidity</title><desc id="mf-desc">Phospholipids with straight saturated tails packed tightly compared with kinked unsaturated tails packed loosely, and a bar chart of the percentage of unsaturated fatty acids in E. coli membranes grown at 10 and 43 degrees Celsius.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="560" fill="#ffffff"/>
<g aria-hidden="true"><animate id="mf-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<text class="head" x="30" y="34">Saturated, unsaturated and membrane fluidity</text><text class="note" x="30" y="56">Half of a bilayer shown.</text>
<g class="part" data-part="sat" data-name="Saturated fatty acids" data-info="Straight chains pack tightly: higher melting point, less fluid membrane." tabindex="0" role="button" aria-label="Saturated fatty acids"><rect x="30" y="80" width="330" height="300" rx="16" fill="#f8fafc" stroke="#cbd5e1"/><text x="195" y="108" text-anchor="middle" font-size="14" font-weight="800" fill="#111827">saturated: tightly packed</text><g><animate attributeName="opacity" keyTimes="0.0000;0.0769;0.1000;1.0000" values="0;0;1;1" dur="13s" begin="mf-play.begin+0s" fill="freeze"/><circle cx="70" cy="150" r="11" fill="#fbbf24" stroke="#334155"/><path d="M 75 160 L 75 240" stroke="#334155" stroke-width="3"/><path d="M 65 160 L 65 240" stroke="#334155" stroke-width="3" fill="none"/><circle cx="96" cy="150" r="11" fill="#fbbf24" stroke="#334155"/><path d="M 101 160 L 101 240" stroke="#334155" stroke-width="3"/><path d="M 91 160 L 91 240" stroke="#334155" stroke-width="3" fill="none"/><circle cx="122" cy="150" r="11" fill="#fbbf24" stroke="#334155"/><path d="M 127 160 L 127 240" stroke="#334155" stroke-width="3"/><path d="M 117 160 L 117 240" stroke="#334155" stroke-width="3" fill="none"/><circle cx="148" cy="150" r="11" fill="#fbbf24" stroke="#334155"/><path d="M 153 160 L 153 240" stroke="#334155" stroke-width="3"/><path d="M 143 160 L 143 240" stroke="#334155" stroke-width="3" fill="none"/><circle cx="174" cy="150" r="11" fill="#fbbf24" stroke="#334155"/><path d="M 179 160 L 179 240" stroke="#334155" stroke-width="3"/><path d="M 169 160 L 169 240" stroke="#334155" stroke-width="3" fill="none"/><circle cx="200" cy="150" r="11" fill="#fbbf24" stroke="#334155"/><path d="M 205 160 L 205 240" stroke="#334155" stroke-width="3"/><path d="M 195 160 L 195 240" stroke="#334155" stroke-width="3" fill="none"/><circle cx="226" cy="150" r="11" fill="#fbbf24" stroke="#334155"/><path d="M 231 160 L 231 240" stroke="#334155" stroke-width="3"/><path d="M 221 160 L 221 240" stroke="#334155" stroke-width="3" fill="none"/><circle cx="252" cy="150" r="11" fill="#fbbf24" stroke="#334155"/><path d="M 257 160 L 257 240" stroke="#334155" stroke-width="3"/><path d="M 247 160 L 247 240" stroke="#334155" stroke-width="3" fill="none"/><circle cx="278" cy="150" r="11" fill="#fbbf24" stroke="#334155"/><path d="M 283 160 L 283 240" stroke="#334155" stroke-width="3"/><path d="M 273 160 L 273 240" stroke="#334155" stroke-width="3" fill="none"/><circle cx="304" cy="150" r="11" fill="#fbbf24" stroke="#334155"/><path d="M 309 160 L 309 240" stroke="#334155" stroke-width="3"/><path d="M 299 160 L 299 240" stroke="#334155" stroke-width="3" fill="none"/><circle cx="330" cy="150" r="11" fill="#fbbf24" stroke="#334155"/><path d="M 335 160 L 335 240" stroke="#334155" stroke-width="3"/><path d="M 325 160 L 325 240" stroke="#334155" stroke-width="3" fill="none"/></g><text x="195" y="280" text-anchor="middle" font-size="13" font-weight="800" fill="#475569">less fluid</text></g>
<g class="part" data-part="unsat" data-name="Unsaturated fatty acids" data-info="A C=C double bond puts a kink in the chain, so they cannot pack tightly: lower melting point, membrane stays fluid at low temperature." tabindex="0" role="button" aria-label="Unsaturated fatty acids"><rect x="380" y="80" width="330" height="300" rx="16" fill="#fef2f2" stroke="#fecaca"/><text x="545" y="108" text-anchor="middle" font-size="14" font-weight="800" fill="#b91c1c">unsaturated: kinked, loose</text><g><animate attributeName="opacity" keyTimes="0.0000;0.3077;0.3308;1.0000" values="0;0;1;1" dur="13s" begin="mf-play.begin+0s" fill="freeze"/><circle cx="420" cy="150" r="11" fill="#fbbf24" stroke="#334155"/><path d="M 425 160 L 425 240" stroke="#334155" stroke-width="3"/><path d="M 415 160 L 415 194 L 429 214 L 429 240" stroke="#dc2626" stroke-width="3" fill="none"/><circle cx="456" cy="150" r="11" fill="#fbbf24" stroke="#334155"/><path d="M 461 160 L 461 240" stroke="#334155" stroke-width="3"/><path d="M 451 160 L 451 240" stroke="#334155" stroke-width="3" fill="none"/><circle cx="492" cy="150" r="11" fill="#fbbf24" stroke="#334155"/><path d="M 497 160 L 497 240" stroke="#334155" stroke-width="3"/><path d="M 487 160 L 487 194 L 501 214 L 501 240" stroke="#dc2626" stroke-width="3" fill="none"/><circle cx="528" cy="150" r="11" fill="#fbbf24" stroke="#334155"/><path d="M 533 160 L 533 240" stroke="#334155" stroke-width="3"/><path d="M 523 160 L 523 240" stroke="#334155" stroke-width="3" fill="none"/><circle cx="564" cy="150" r="11" fill="#fbbf24" stroke="#334155"/><path d="M 569 160 L 569 240" stroke="#334155" stroke-width="3"/><path d="M 559 160 L 559 194 L 573 214 L 573 240" stroke="#dc2626" stroke-width="3" fill="none"/><circle cx="600" cy="150" r="11" fill="#fbbf24" stroke="#334155"/><path d="M 605 160 L 605 240" stroke="#334155" stroke-width="3"/><path d="M 595 160 L 595 194 L 609 214 L 609 240" stroke="#dc2626" stroke-width="3" fill="none"/><circle cx="636" cy="150" r="11" fill="#fbbf24" stroke="#334155"/><path d="M 641 160 L 641 240" stroke="#334155" stroke-width="3"/><path d="M 631 160 L 631 194 L 645 214 L 645 240" stroke="#dc2626" stroke-width="3" fill="none"/><circle cx="672" cy="150" r="11" fill="#fbbf24" stroke="#334155"/><path d="M 677 160 L 677 240" stroke="#334155" stroke-width="3"/><path d="M 667 160 L 667 240" stroke="#334155" stroke-width="3" fill="none"/></g><g><animate attributeName="opacity" keyTimes="0.0000;0.3846;0.4077;1.0000" values="0;0;1;1" dur="13s" begin="mf-play.begin+0s" fill="freeze"/><text x="545" y="280" text-anchor="middle" font-size="12" font-weight="800" fill="#b91c1c">C=C kinks → more fluid at low temperature</text></g></g>
<g class="part" data-part="data" data-name="Data: E. coli" data-info="Grown at 10 °C, about 60% of membrane fatty acids were unsaturated; at 43 °C, about 25%. Bacteria adjust membrane composition to keep fluidity right." tabindex="0" role="button" aria-label="Data: E. coli"><rect x="730" y="80" width="340" height="460" rx="16" fill="#f0f9ff" stroke="#7dd3fc"/><text x="900" y="108" text-anchor="middle" font-size="14" font-weight="800" fill="#0369a1">E. coli membranes</text><line x1="800" y1="470" x2="1040" y2="470" stroke="#111827" stroke-width="2"/><line x1="800" y1="470" x2="800" y2="170" stroke="#111827" stroke-width="2"/><text x="794" y="474.0" text-anchor="end" font-size="11" font-weight="700" fill="#475569">0</text><text x="794" y="399.0" text-anchor="end" font-size="11" font-weight="700" fill="#475569">20</text><text x="794" y="324.0" text-anchor="end" font-size="11" font-weight="700" fill="#475569">40</text><text x="794" y="249.0" text-anchor="end" font-size="11" font-weight="700" fill="#475569">60</text><text x="794" y="174.0" text-anchor="end" font-size="11" font-weight="700" fill="#475569">80</text><text x="920" y="160" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">% unsaturated fatty acids</text><rect x="830" y="245" width="70" height="225" fill="#60a5fa" stroke="#334155"><animate attributeName="height" keyTimes="0.0000;0.6154;0.6923;1.0000" values="0;0;225.0;225.0" dur="13s" begin="mf-play.begin+0s" fill="freeze"/><animate attributeName="y" keyTimes="0.0000;0.6154;0.6923;1.0000" values="470;470;245.0;245.0" dur="13s" begin="mf-play.begin+0s" fill="freeze"/></rect><g><animate attributeName="opacity" keyTimes="0.0000;0.6923;0.7154;1.0000" values="0;0;1;1" dur="13s" begin="mf-play.begin+0s" fill="freeze"/><text x="865" y="237.0" text-anchor="middle" font-size="14" font-weight="800" fill="#111827">≈ 60%</text></g><text x="865" y="490" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">10 °C</text><rect x="940" y="376" width="70" height="94" fill="#f87171" stroke="#334155"><animate attributeName="height" keyTimes="0.0000;0.6923;0.7692;1.0000" values="0;0;93.75;93.75" dur="13s" begin="mf-play.begin+0s" fill="freeze"/><animate attributeName="y" keyTimes="0.0000;0.6923;0.7692;1.0000" values="470;470;376.25;376.25" dur="13s" begin="mf-play.begin+0s" fill="freeze"/></rect><g><animate attributeName="opacity" keyTimes="0.0000;0.7692;0.7923;1.0000" values="0;0;1;1" dur="13s" begin="mf-play.begin+0s" fill="freeze"/><text x="975" y="368.25" text-anchor="middle" font-size="14" font-weight="800" fill="#111827">≈ 25%</text></g><text x="975" y="490" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">43 °C</text></g>
</svg>