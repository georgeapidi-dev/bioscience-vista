<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" class="vd-svg" role="img" aria-labelledby="tc-title tc-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="tc-play" data-vd-play-label="Play: test it" data-vd-steps="[[0, &quot;Is a black-coated animal BB or Bb?&quot;], [1, &quot;Cross it with a homozygous recessive (bb).&quot;], [6, &quot;If BB: all offspring black.&quot;], [9, &quot;If Bb: half black, half brown.&quot;]]" data-vd-dur="14">
<title id="tc-title">The test cross</title><desc id="tc-desc">Two Punnett squares: an unknown dominant parent crossed with a homozygous recessive; if BB all offspring Bb show the dominant phenotype, if Bb half the offspring are bb and show the recessive phenotype.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="520" fill="#ffffff"/>
<g aria-hidden="true"><animate id="tc-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<text class="head" x="30" y="34">The test cross</text><text class="note" x="30" y="56">B = black (dominant), b = brown (recessive).</text>
<g class="part" data-part="why" data-name="The problem" data-info="An organism showing the dominant phenotype could be homozygous (BB) or heterozygous (Bb)." tabindex="0" role="button" aria-label="The problem"><g><animate attributeName="opacity" keyTimes="0.0000;0.0714;0.0929;1.0000" values="0;0;1;1" dur="14s" begin="tc-play.begin+0s" fill="freeze"/><rect x="250.0" y="75.0" width="600" height="50" rx="12" fill="#f1f5f9" stroke="#334155" stroke-width="2"/><text x="550" y="105.33333333333333" text-anchor="middle" font-size="16" font-weight="800" fill="#111827">unknown: black (BB or Bb?)  ×  brown bb</text></g></g>
<g class="part" data-part="cross" data-name="The test cross" data-info="Cross it with a homozygous recessive (bb). If any offspring show the recessive phenotype, the unknown parent must be Bb." tabindex="0" role="button" aria-label="The test cross"></g>
<g class="part" data-part="res" data-name="Results" data-info="BB × bb → all Bb (all dominant phenotype). Bb × bb → 1 Bb : 1 bb (half dominant, half recessive)." tabindex="0" role="button" aria-label="Results"><g><animate attributeName="opacity" keyTimes="0.0000;0.3929;0.4143;1.0000" values="0;0;1;1" dur="14s" begin="tc-play.begin+0s" fill="freeze"/><rect x="80" y="170" width="380" height="260" fill="#fff" stroke="#334155" stroke-width="2"/><text x="270" y="160" text-anchor="middle" font-size="15" font-weight="800" fill="#111827">if BB × bb</text><text x="260" y="205" text-anchor="middle" font-size="18" font-weight="800" fill="#1d4ed8">B</text><text x="380" y="205" text-anchor="middle" font-size="18" font-weight="800" fill="#1d4ed8">B</text><text x="140" y="290" text-anchor="middle" font-size="18" font-weight="800" fill="#7c2d12">b</text><text x="140" y="380" text-anchor="middle" font-size="18" font-weight="800" fill="#7c2d12">b</text><line x1="200" y1="170" x2="200" y2="430" stroke="#334155"/><line x1="80" y1="225" x2="460" y2="225" stroke="#334155"/><g><animate attributeName="opacity" keyTimes="0.0000;0.4286;0.4500;1.0000" values="0;0;1;1" dur="14s" begin="tc-play.begin+0s" fill="freeze"/><circle cx="260" cy="280" r="26" fill="#1f2937" opacity=".85"/><text x="260" y="286" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">Bb</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.4571;0.4786;1.0000" values="0;0;1;1" dur="14s" begin="tc-play.begin+0s" fill="freeze"/><circle cx="380" cy="280" r="26" fill="#1f2937" opacity=".85"/><text x="380" y="286" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">Bb</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.4857;0.5071;1.0000" values="0;0;1;1" dur="14s" begin="tc-play.begin+0s" fill="freeze"/><circle cx="260" cy="370" r="26" fill="#1f2937" opacity=".85"/><text x="260" y="376" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">Bb</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.5143;0.5357;1.0000" values="0;0;1;1" dur="14s" begin="tc-play.begin+0s" fill="freeze"/><circle cx="380" cy="370" r="26" fill="#1f2937" opacity=".85"/><text x="380" y="376" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">Bb</text></g><text x="270" y="470" text-anchor="middle" font-size="15" font-weight="800" fill="#111827">all black (Bb)</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.6071;0.6286;1.0000" values="0;0;1;1" dur="14s" begin="tc-play.begin+0s" fill="freeze"/><rect x="640" y="170" width="380" height="260" fill="#fff" stroke="#334155" stroke-width="2"/><text x="830" y="160" text-anchor="middle" font-size="15" font-weight="800" fill="#111827">if Bb × bb</text><text x="820" y="205" text-anchor="middle" font-size="18" font-weight="800" fill="#1d4ed8">B</text><text x="940" y="205" text-anchor="middle" font-size="18" font-weight="800" fill="#1d4ed8">b</text><text x="700" y="290" text-anchor="middle" font-size="18" font-weight="800" fill="#7c2d12">b</text><text x="700" y="380" text-anchor="middle" font-size="18" font-weight="800" fill="#7c2d12">b</text><line x1="760" y1="170" x2="760" y2="430" stroke="#334155"/><line x1="640" y1="225" x2="1020" y2="225" stroke="#334155"/><g><animate attributeName="opacity" keyTimes="0.0000;0.6429;0.6643;1.0000" values="0;0;1;1" dur="14s" begin="tc-play.begin+0s" fill="freeze"/><circle cx="820" cy="280" r="26" fill="#1f2937" opacity=".85"/><text x="820" y="286" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">Bb</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.6714;0.6929;1.0000" values="0;0;1;1" dur="14s" begin="tc-play.begin+0s" fill="freeze"/><circle cx="940" cy="280" r="26" fill="#b45309" opacity=".85"/><text x="940" y="286" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">bb</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.7000;0.7214;1.0000" values="0;0;1;1" dur="14s" begin="tc-play.begin+0s" fill="freeze"/><circle cx="820" cy="370" r="26" fill="#1f2937" opacity=".85"/><text x="820" y="376" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">Bb</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.7286;0.7500;1.0000" values="0;0;1;1" dur="14s" begin="tc-play.begin+0s" fill="freeze"/><circle cx="940" cy="370" r="26" fill="#b45309" opacity=".85"/><text x="940" y="376" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">bb</text></g><text x="830" y="470" text-anchor="middle" font-size="15" font-weight="800" fill="#b45309">1 black : 1 brown</text></g></g>
</svg>