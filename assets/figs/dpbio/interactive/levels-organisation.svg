<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 500" class="vd-svg" role="img" aria-labelledby="lo-title lo-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="lo-play" data-vd-play-label="Play: build up" data-vd-steps="[[0, &quot;Levels of organisation.&quot;], [1, &quot;Cells form tissues, tissues form organs...&quot;], [5, &quot;...organs form systems, systems form an organism.&quot;], [8.5, &quot;Integration gives emergent properties: the whole can do more than its parts.&quot;]]" data-vd-dur="13">
<title id="lo-title">Levels of organisation and integration</title><desc id="lo-desc">A hierarchy from a cardiac muscle cell to cardiac muscle tissue, the heart, the circulatory system and the whole organism, with integration producing emergent properties.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="500" fill="#ffffff"/>
<g aria-hidden="true"><animate id="lo-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<defs><marker id="lo-475569" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="6.3" refY="7.0" orient="auto"><path d="M0,0 L14,7.0 L0,14 z" fill="#475569"/></marker></defs>
<text class="head" x="30" y="34">Levels of organisation</text><text class="note" x="30" y="56">Example: the heart.</text>
<g class="part" data-part="h" data-name="A hierarchy" data-info="Cells → tissues → organs → organ systems → organism. Each level is a subsystem integrated with the others." tabindex="0" role="button" aria-label="A hierarchy"><g><animate attributeName="opacity" keyTimes="0.0000;0.0769;0.1000;1.0000" values="0;0;1;1" dur="13s" begin="lo-play.begin+0s" fill="freeze"/><circle cx="120" cy="240" r="30" fill="#fecaca" stroke="#7f1d1d" stroke-width="2"/><text x="120" y="244" text-anchor="middle" font-size="13" font-weight="800" fill="#7f1d1d">cell</text><text x="120" y="350" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">cardiac muscle cell</text><path d="M 156 240 L 285 240" stroke="#475569" stroke-width="3" marker-end="url(#lo-475569)"/></g><g><animate attributeName="opacity" keyTimes="0.0000;0.1769;0.2000;1.0000" values="0;0;1;1" dur="13s" begin="lo-play.begin+0s" fill="freeze"/><circle cx="335" cy="240" r="42" fill="#fca5a5" stroke="#7f1d1d" stroke-width="2"/><text x="335" y="244" text-anchor="middle" font-size="13" font-weight="800" fill="#7f1d1d">tissue</text><text x="335" y="350" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">cardiac muscle</text><path d="M 383 240 L 488 240" stroke="#475569" stroke-width="3" marker-end="url(#lo-475569)"/></g><g><animate attributeName="opacity" keyTimes="0.0000;0.2769;0.3000;1.0000" values="0;0;1;1" dur="13s" begin="lo-play.begin+0s" fill="freeze"/><circle cx="550" cy="240" r="54" fill="#f87171" stroke="#7f1d1d" stroke-width="2"/><text x="550" y="244" text-anchor="middle" font-size="13" font-weight="800" fill="#7f1d1d">organ</text><text x="550" y="350" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">heart</text><path d="M 610 240 L 691 240" stroke="#475569" stroke-width="3" marker-end="url(#lo-475569)"/></g><g><animate attributeName="opacity" keyTimes="0.0000;0.3769;0.4000;1.0000" values="0;0;1;1" dur="13s" begin="lo-play.begin+0s" fill="freeze"/><circle cx="765" cy="240" r="66" fill="#ef4444" stroke="#7f1d1d" stroke-width="2"/><text x="765" y="244" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">organ system</text><text x="765" y="350" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">circulatory system</text><path d="M 837 240 L 894 240" stroke="#475569" stroke-width="3" marker-end="url(#lo-475569)"/></g><g><animate attributeName="opacity" keyTimes="0.0000;0.4769;0.5000;1.0000" values="0;0;1;1" dur="13s" begin="lo-play.begin+0s" fill="freeze"/><circle cx="980" cy="240" r="78" fill="#dc2626" stroke="#7f1d1d" stroke-width="2"/><text x="980" y="244" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">organism</text><text x="980" y="350" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">human</text></g></g>
<g class="part" data-part="em" data-name="Emergent properties" data-info="Integration produces properties that the parts do not have alone: a heart pumps; a single muscle cell does not." tabindex="0" role="button" aria-label="Emergent properties"><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.6538;0.6769;1.0000" values="0;0;1;1" dur="13s" begin="lo-play.begin+0s" fill="freeze"/><rect x="310.0" y="408" width="480" height="24" rx="12" fill="#fee2e2" stroke="#1f2937" stroke-width="1"/><text x="550" y="425" text-anchor="middle" font-size="12" font-weight="700">emergent property: the heart pumps blood; one cell cannot</text></g></g>
<g class="part" data-part="int" data-name="Why integrate?" data-info="Coordination by nerves and hormones makes parts work together: the heart speeds up when muscles need more oxygen." tabindex="0" role="button" aria-label="Why integrate?"><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.7692;0.7923;1.0000" values="0;0;1;1" dur="13s" begin="lo-play.begin+0s" fill="freeze"/><rect x="310.0" y="448" width="480" height="24" rx="12" fill="#e0e7ff" stroke="#1f2937" stroke-width="1"/><text x="550" y="465" text-anchor="middle" font-size="12" font-weight="700">integration by nerves and hormones: parts work together</text></g></g>
</svg>