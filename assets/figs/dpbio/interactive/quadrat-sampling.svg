<g class="part" data-part="rand" data-name="Random samples" data-info="Every position has an equal chance of being chosen (random coordinates), so the sample is not biased towards crowded spots." tabindex="0" role="button" aria-label="Random samples"><g><animate attributeName="opacity" keyTimes="0.0000;0.2143;0.2357;1.0000" values="0;0;1;1" dur="14s" begin="sp-play.begin+0s" fill="freeze"/><rect x="120" y="160" width="49" height="49" fill="none" stroke="#dc2626" stroke-width="3"/></g><g><animate attributeName="opacity" keyTimes="0.0000;0.2357;0.2571;1.0000" values="0;0;1;1" dur="14s" begin="sp-play.begin+0s" fill="freeze"/><text x="145" y="154" text-anchor="middle" font-size="12" font-weight="800" fill="#b91c1c">3</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.2571;0.2786;1.0000" values="0;0;1;1" dur="14s" begin="sp-play.begin+0s" fill="freeze"/><rect x="380" y="140" width="49" height="49" fill="none" stroke="#dc2626" stroke-width="3"/></g><g><animate attributeName="opacity" keyTimes="0.0000;0.2786;0.3000;1.0000" values="0;0;1;1" dur="14s" begin="sp-play.begin+0s" fill="freeze"/><text x="405" y="134" text-anchor="middle" font-size="12" font-weight="800" fill="#b91c1c">2</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.3000;0.3214;1.0000" values="0;0;1;1" dur="14s" begin="sp-play.begin+0s" fill="freeze"/><rect x="260" y="300" width="49" height="49" fill="none" stroke="#dc2626" stroke-width="3"/></g><g><animate attributeName="opacity" keyTimes="0.0000;0.3214;0.3429;1.0000" values="0;0;1;1" dur="14s" begin="sp-play.begin+0s" fill="freeze"/><text x="285" y="294" text-anchor="middle" font-size="12" font-weight="800" fill="#b91c1c">0</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.3429;0.3643;1.0000" values="0;0;1;1" dur="14s" begin="sp-play.begin+0s" fill="freeze"/><rect x="440" y="430" width="49" height="49" fill="none" stroke="#dc2626" stroke-width="3"/></g><g><animate attributeName="opacity" keyTimes="0.0000;0.3643;0.3857;1.0000" values="0;0;1;1" dur="14s" begin="sp-play.begin+0s" fill="freeze"/><text x="465" y="424" text-anchor="middle" font-size="12" font-weight="800" fill="#b91c1c">1</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.3857;0.4071;1.0000" values="0;0;1;1" dur="14s" begin="sp-play.begin+0s" fill="freeze"/><rect x="140" y="470" width="49" height="49" fill="none" stroke="#dc2626" stroke-width="3"/></g><g><animate attributeName="opacity" keyTimes="0.0000;0.4071;0.4286;1.0000" values="0;0;1;1" dur="14s" begin="sp-play.begin+0s" fill="freeze"/><text x="165" y="464" text-anchor="middle" font-size="12" font-weight="800" fill="#b91c1c">2</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.4286;0.4500;1.0000" values="0;0;1;1" dur="14s" begin="sp-play.begin+0s" fill="freeze"/><rect x="330" y="520" width="49" height="49" fill="none" stroke="#dc2626" stroke-width="3"/></g><g><animate attributeName="opacity" keyTimes="0.0000;0.4500;0.4714;1.0000" values="0;0;1;1" dur="14s" begin="sp-play.begin+0s" fill="freeze"/><text x="355" y="514" text-anchor="middle" font-size="12" font-weight="800" fill="#b91c1c">1</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.2143;0.2357;1.0000" values="0;0;1;1" dur="14s" begin="sp-play.begin+0s" fill="freeze"/><text x="300" y="596" text-anchor="middle" font-size="11" font-weight="800" fill="#b91c1c">random coordinates, e.g. from a random number table</text></g></g>
<g class="part" data-part="err" data-name="Sampling error" data-info="The difference between the estimate and the true size. More and larger random samples reduce it." tabindex="0" role="button" aria-label="Sampling error"><g><animate attributeName="opacity" keyTimes="0.0000;0.5714;0.5929;1.0000" values="0;0;1;1" dur="14s" begin="sp-play.begin+0s" fill="freeze"/><rect x="600" y="100" width="470" height="300" rx="16" fill="#f8fafc" stroke="#cbd5e1"/><text x="835" y="128" text-anchor="middle" font-size="14" font-weight="800" fill="#111827">the estimate</text><text x="835" y="166" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">mean per quadrat = 1.5</text><text x="835" y="194" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">estimate = 1.5 × 100 m² ÷ 1 m²</text><text x="835" y="222" text-anchor="middle" font-size="16" font-weight="800" fill="#b91c1c">≈ 150 plants</text><text x="835" y="256" text-anchor="middle" font-size="12" font-weight="700" fill="#475569">(true number here: 160)</text><text x="835" y="300" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">difference = sampling error</text><text x="835" y="330" text-anchor="middle" font-size="13" font-weight="800" fill="#15803d">more random quadrats → smaller error</text><text x="835" y="356" text-anchor="middle" font-size="12" font-weight="700" fill="#b91c1c">never choose "typical" or crowded spots</text></g></g>
