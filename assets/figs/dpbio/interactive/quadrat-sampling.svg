<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 610" class="vd-svg" role="img" aria-labelledby="sp-title sp-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="sp-play" data-vd-play-label="Play: throw quadrats" data-vd-steps="[[0, &quot;Estimating a population by sampling.&quot;], [1, &quot;Too many plants to count them all.&quot;], [3, &quot;Random coordinates place quadrats without bias.&quot;], [8, &quot;Mean per quadrat \u00d7 total area \u00f7 quadrat area = estimate.&quot;], [11, &quot;More quadrats \u2192 smaller sampling error.&quot;]]" data-vd-dur="14">
<title id="sp-title">Random sampling with quadrats</title><desc id="sp-desc">A field of plants sampled with randomly placed quadrats, the counts used to estimate the population, and the effect of more samples on sampling error.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="610" fill="#ffffff"/>
