<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 600" class="vd-svg" role="img" aria-labelledby="at-title at-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="at-play" data-vd-play-label="Play: the ATP cycle" data-vd-steps="[[0, &quot;ATP (adenosine triphosphate): adenine + ribose + three phosphate groups. The cell\u2019s energy currency.&quot;], [1.5, &quot;Hydrolysis: water removes the third phosphate, giving ADP + phosphate and releasing energy for cell work.&quot;], [5, &quot;Energy is used for muscle contraction, active transport and making molecules.&quot;], [7, &quot;In respiration, energy is used to join ADP and phosphate back into ATP (condensation, by ATP synthase).&quot;], [10, &quot;ATP is recycled constantly: you make and break about your own body mass of ATP each day.&quot;]]" data-vd-dur="12">
<title id="at-title">ATP and the ATP cycle</title><desc id="at-desc">The structure of ATP (adenine, ribose and three phosphates) and the ATP–ADP cycle: hydrolysis releases energy for cell work; respiration provides energy to remake ATP.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="600" fill="#ffffff"/>
<g aria-hidden="true"><animate id="at-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<defs><marker id="at-dc2626" markerUnits="userSpaceOnUse" markerWidth="26" markerHeight="26" refX="12" refY="13" orient="auto"><path d="M0,0 L26,13 L0,26 z" fill="#dc2626"/></marker><marker id="at-16a34a" markerUnits="userSpaceOnUse" markerWidth="26" markerHeight="26" refX="12" refY="13" orient="auto"><path d="M0,0 L26,13 L0,26 z" fill="#16a34a"/></marker></defs>
<text class="head" x="30" y="34">ATP: structure and the ATP–ADP cycle</text><text class="note" x="30" y="56">Ribose in Haworth projection; blue numbers are carbon atoms 1′–5′.</text>
<g class="part" data-part="aden" data-name="Adenine" data-info="A nitrogenous base (also found in DNA and RNA)." tabindex="0" role="button" aria-label="Adenine"><line x1="518.3" y1="240.8" x2="554.3" y2="202.8" stroke="#334155" stroke-width="2.5"/><polygon points="626.4,200.8 588.3,222.8 550.2,200.8 550.2,156.8 588.3,134.8 626.4,156.8" fill="#93c5fd" stroke="#1e3a8a" stroke-width="2"/><text x="588.3" y="183.8" text-anchor="middle" font-size="14" font-weight="800">adenine</text></g>
<g class="part" data-part="rib" data-name="Ribose" data-info="A pentose (5-carbon) sugar." tabindex="0" role="button" aria-label="Ribose"><polygon points="470.0,210.9 518.3,240.8 499.9,284.5 440.1,284.5 421.7,240.8" fill="#fef3c7" stroke="#92400e" stroke-width="2.5" stroke-linejoin="round"/><line x1="440.1" y1="284.5" x2="499.9" y2="284.5" stroke="#92400e" stroke-width="6.8999999999999995" stroke-linecap="round"/><circle cx="470.0" cy="210.9" r="10.3" fill="#fff"/><text x="470.0" y="216.7" text-anchor="middle" font-size="16.1" font-weight="800" fill="#dc2626">O</text><line x1="440.1" y1="286.8" x2="440.1" y2="314.4" stroke="#334155" stroke-width="2.2" stroke-linecap="round"/><text x="440.1" y="331.6" text-anchor="middle" font-size="14.9" font-weight="800" fill="#111827">OH</text><line x1="421.7" y1="238.5" x2="421.7" y2="213.2" stroke="#334155" stroke-width="2.2" stroke-linecap="round"/><text x="421.7" y="204.0" text-anchor="middle" font-size="14.9" font-weight="800" fill="#111827">CH₂</text><text x="532.1" y="233.9" text-anchor="middle" font-size="12.6" font-weight="800" fill="#2563eb">1′</text><text x="513.7" y="289.1" text-anchor="middle" font-size="12.6" font-weight="800" fill="#2563eb">2′</text><text x="426.3" y="289.1" text-anchor="middle" font-size="12.6" font-weight="800" fill="#2563eb">3′</text><text x="407.9" y="233.9" text-anchor="middle" font-size="12.6" font-weight="800" fill="#2563eb">4′</text><text x="421.7" y="183.3" text-anchor="middle" font-size="12.6" font-weight="800" fill="#2563eb">5′</text><line x1="499.9" y1="286.8" x2="499.9" y2="314.4" stroke="#334155" stroke-width="2.2" stroke-linecap="round"/><text x="499.9" y="331.6" text-anchor="middle" font-size="14.9" font-weight="800" fill="#dc2626">OH</text><text x="540" y="300" text-anchor="start" font-size="13" font-weight="800" fill="#92400e">ribose</text></g>
<g class="part" data-part="phos" data-name="Three phosphate groups" data-info="Bonds between the phosphate groups release energy when ATP is hydrolysed." tabindex="0" role="button" aria-label="Three phosphate groups"><line x1="399.7" y1="200.0" x2="383.7" y2="200.0" stroke="#334155" stroke-width="2.5"/><text x="375.7" y="205.0" text-anchor="middle" font-size="13" font-weight="800" fill="#dc2626">O</text><line x1="367.7" y1="200.0" x2="351.7" y2="200.0" stroke="#334155" stroke-width="2.5"/><circle cx="331.7" cy="200.0" r="20" fill="#fca5a5" stroke="#991b1b" stroke-width="2"/><text x="331.7" y="205.0" text-anchor="middle" font-size="15" font-weight="800">P</text><text x="331.7" y="172.0" text-anchor="middle" font-size="12" font-weight="700" fill="#991b1b">α</text><line x1="311.7" y1="200.0" x2="289.7" y2="200.0" stroke="#334155" stroke-width="2.5"/><text x="281.7" y="205.0" text-anchor="middle" font-size="13" font-weight="800" fill="#dc2626">O</text><line x1="273.7" y1="200.0" x2="251.7" y2="200.0" stroke="#334155" stroke-width="2.5"/><circle cx="231.7" cy="200.0" r="20" fill="#fca5a5" stroke="#991b1b" stroke-width="2"/><text x="231.7" y="205.0" text-anchor="middle" font-size="15" font-weight="800">P</text><text x="231.7" y="172.0" text-anchor="middle" font-size="12" font-weight="700" fill="#991b1b">β</text><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.1250;0.2500;0.5833;0.7083;1.0000" values="0 0;0 0;-40 110;-40 110;0 0;0 0" dur="12s" begin="at-play.begin+0s" fill="freeze"/><line x1="211.7" y1="200.0" x2="189.7" y2="200.0" stroke="#334155" stroke-width="2.5"/><text x="181.7" y="205.0" text-anchor="middle" font-size="13" font-weight="800" fill="#dc2626">O</text><line x1="173.7" y1="200.0" x2="151.7" y2="200.0" stroke="#334155" stroke-width="2.5"/><circle cx="131.7" cy="200.0" r="20" fill="#fca5a5" stroke="#991b1b" stroke-width="2"/><text x="131.7" y="205.0" text-anchor="middle" font-size="15" font-weight="800">P</text><text x="131.7" y="172.0" text-anchor="middle" font-size="12" font-weight="700" fill="#991b1b">γ</text></g></g>
<g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.1250;0.1500;0.5667;0.5917;1.0000" values="0;0;1;1;0;0" dur="12s" begin="at-play.begin+0s" fill="freeze"/><text x="101.69999999999999" y="370.0" font-size="14" font-weight="700" fill="#b91c1c">+ H₂O → ADP + Pi + energy</text></g>
<g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.0000;0.0250;0.1250;0.1500;1.0000" values="0;0;1;1;0;0" dur="12s" begin="at-play.begin+0s" fill="freeze"/><rect x="435.0" y="388" width="70" height="24" rx="12" fill="#fde68a" stroke="#1f2937" stroke-width="1"/><text x="470" y="405" text-anchor="middle" font-size="12" font-weight="700">ATP</text></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.2500;0.2750;0.5833;0.6083;1.0000" values="0;0;1;1;0;0" dur="12s" begin="at-play.begin+0s" fill="freeze"/><rect x="420.0" y="388" width="100" height="24" rx="12" fill="#e5e7eb" stroke="#1f2937" stroke-width="1"/><text x="470" y="405" text-anchor="middle" font-size="12" font-weight="700">ADP + Pi</text></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.7083;0.7333;1.0000" values="0;0;1;1" dur="12s" begin="at-play.begin+0s" fill="freeze"/><rect x="435.0" y="388" width="70" height="24" rx="12" fill="#fde68a" stroke="#1f2937" stroke-width="1"/><text x="470" y="405" text-anchor="middle" font-size="12" font-weight="700">ATP</text></g>
<text x="820" y="372" text-anchor="middle" font-size="22" font-weight="800">ATP</text><text x="820" y="402" text-anchor="middle" font-size="13">⇅</text><text x="820" y="426" text-anchor="middle" font-size="18" font-weight="800">ADP + Pi</text>
<g class="part" data-part="hyd" data-name="Hydrolysis: ATP → ADP + Pi" data-info="Water is used to remove the last phosphate. About 30 kJ per mole is released for muscle contraction, active transport, protein synthesis and nerve impulses." tabindex="0" role="button" aria-label="Hydrolysis: ATP → ADP + Pi"><path d="M 950 340 A 130 130 0 0 1 860 504" fill="none" stroke="#dc2626" stroke-width="7" marker-end="url(#at-dc2626)"/><text x="960" y="420" font-size="13" font-weight="700" fill="#b91c1c">hydrolysis</text><text x="960" y="438" font-size="12" fill="#b91c1c">energy for cell work</text></g>
<g class="part" data-part="syn" data-name="Synthesis: ADP + Pi → ATP" data-info="A condensation reaction catalysed by ATP synthase, using energy from respiration (or light in photosynthesis)." tabindex="0" role="button" aria-label="Synthesis: ADP + Pi → ATP"><path d="M 690 420 A 130 130 0 0 1 780 256" fill="none" stroke="#16a34a" stroke-width="7" marker-end="url(#at-16a34a)"/><text x="680" y="340" text-anchor="end" font-size="13" font-weight="700" fill="#15803d">condensation</text><text x="680" y="358" text-anchor="end" font-size="12" fill="#15803d">energy from respiration</text></g>
<g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.4167;0.4417;1.0000" values="0;0;1;1" dur="12s" begin="at-play.begin+0s" fill="freeze"/><g font-size="12"><text x="970" y="470">• muscle contraction</text><text x="970" y="488">• active transport</text><text x="970" y="506">• protein synthesis</text><text x="970" y="524">• nerve impulses</text></g></g>
</svg>