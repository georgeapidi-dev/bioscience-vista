<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 600" class="vd-svg" role="img" aria-labelledby="at-title at-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="at-play" data-vd-play-label="Play: the ATP cycle" data-vd-steps="[[0, &quot;ATP (adenosine triphosphate): adenine + ribose + three phosphate groups. The cell\u2019s energy currency.&quot;], [1.5, &quot;Hydrolysis: water removes the third phosphate, giving ADP + phosphate and releasing energy for cell work.&quot;], [5, &quot;Energy is used for muscle contraction, active transport and making molecules.&quot;], [7, &quot;In respiration, energy is used to join ADP and phosphate back into ATP (condensation, by ATP synthase).&quot;], [10, &quot;ATP is recycled constantly: you make and break about your own body mass of ATP each day.&quot;]]" data-vd-dur="12">
<title id="at-title">ATP and the ATP cycle</title><desc id="at-desc">The structure of ATP (adenine, ribose and three phosphates) and the ATP–ADP cycle: hydrolysis releases energy for cell work; respiration provides energy to remake ATP.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="600" fill="#ffffff"/>
<g aria-hidden="true"><animate id="at-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<defs><marker id="at-dc2626" markerUnits="userSpaceOnUse" markerWidth="26" markerHeight="26" refX="12" refY="13" orient="auto"><path d="M0,0 L26,13 L0,26 z" fill="#dc2626"/></marker><marker id="at-16a34a" markerUnits="userSpaceOnUse" markerWidth="26" markerHeight="26" refX="12" refY="13" orient="auto"><path d="M0,0 L26,13 L0,26 z" fill="#16a34a"/></marker></defs>
<text class="head" x="30" y="34">ATP: structure and the ATP–ADP cycle</text><text class="note" x="30" y="56">Simplified structure.</text>
<g class="part" data-part="aden" data-name="Adenine" data-info="A nitrogenous base (also found in DNA and RNA)." tabindex="0" role="button" aria-label="Adenine"><polygon points="120,150 170,122 220,150 220,200 170,228 120,200" fill="#93c5fd" stroke="#1e3a8a" stroke-width="2"/><text x="170" y="180" text-anchor="middle" font-size="14" font-weight="800">adenine</text></g>
<line x1="220" y1="190" x2="250" y2="210" stroke="#334155" stroke-width="4"/>
<g class="part" data-part="rib" data-name="Ribose" data-info="A pentose (5-carbon) sugar." tabindex="0" role="button" aria-label="Ribose"><polygon points="270,190 320,170 360,200 345,250 290,250" fill="#fde68a" stroke="#92400e" stroke-width="2"/><text x="315" y="222" text-anchor="middle" font-size="14" font-weight="800">ribose</text></g>
<g class="part" data-part="phos" data-name="Three phosphate groups" data-info="Bonds between the phosphate groups release energy when ATP is hydrolysed." tabindex="0" role="button" aria-label="Three phosphate groups"><line x1="360" y1="212" x2="384" y2="212" stroke="#334155" stroke-width="4"/><circle cx="410" cy="212" r="26" fill="#fca5a5" stroke="#991b1b" stroke-width="2"/><text x="410" y="218" text-anchor="middle" font-size="16" font-weight="800">P</text><line x1="450" y1="212" x2="474" y2="212" stroke="#334155" stroke-width="4"/><circle cx="500" cy="212" r="26" fill="#fca5a5" stroke="#991b1b" stroke-width="2"/><text x="500" y="218" text-anchor="middle" font-size="16" font-weight="800">P</text><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.1250;0.2500;0.5833;0.7083;1.0000" values="0 0;0 0;110 -90;110 -90;0 0;0 0" dur="12s" begin="at-play.begin+0s" fill="freeze"/><line x1="540" y1="212" x2="564" y2="212" stroke="#334155" stroke-width="4"/><circle cx="590" cy="212" r="26" fill="#fca5a5" stroke="#991b1b" stroke-width="2"/><text x="590" y="218" text-anchor="middle" font-size="16" font-weight="800">P</text></g></g>
<g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.1250;0.1500;0.5667;0.5917;1.0000" values="0;0;1;1;0;0" dur="12s" begin="at-play.begin+0s" fill="freeze"/><text x="640" y="126" text-anchor="end" font-size="14" font-weight="700" fill="#b91c1c">+ H₂O → energy released</text></g>
<g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.0000;0.0250;0.1250;0.1500;1.0000" values="0;0;1;1;0;0" dur="12s" begin="at-play.begin+0s" fill="freeze"/><rect x="265.0" y="288" width="70" height="24" rx="12" fill="#fde68a" stroke="#1f2937" stroke-width="1"/><text x="300" y="305" text-anchor="middle" font-size="12" font-weight="700">ATP</text></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.2500;0.2750;0.5833;0.6083;1.0000" values="0;0;1;1;0;0" dur="12s" begin="at-play.begin+0s" fill="freeze"/><rect x="250.0" y="288" width="100" height="24" rx="12" fill="#e5e7eb" stroke="#1f2937" stroke-width="1"/><text x="300" y="305" text-anchor="middle" font-size="12" font-weight="700">ADP + Pi</text></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.7083;0.7333;1.0000" values="0;0;1;1" dur="12s" begin="at-play.begin+0s" fill="freeze"/><rect x="265.0" y="288" width="70" height="24" rx="12" fill="#fde68a" stroke="#1f2937" stroke-width="1"/><text x="300" y="305" text-anchor="middle" font-size="12" font-weight="700">ATP</text></g>
<text x="820" y="372" text-anchor="middle" font-size="22" font-weight="800">ATP</text><text x="820" y="402" text-anchor="middle" font-size="13">⇅</text><text x="820" y="426" text-anchor="middle" font-size="18" font-weight="800">ADP + Pi</text>
<g class="part" data-part="hyd" data-name="Hydrolysis: ATP → ADP + Pi" data-info="Water is used to remove the last phosphate. About 30 kJ per mole is released for muscle contraction, active transport, protein synthesis and nerve impulses." tabindex="0" role="button" aria-label="Hydrolysis: ATP → ADP + Pi"><path d="M 950 340 A 130 130 0 0 1 860 504" fill="none" stroke="#dc2626" stroke-width="7" marker-end="url(#at-dc2626)"/><text x="960" y="420" font-size="13" font-weight="700" fill="#b91c1c">hydrolysis</text><text x="960" y="438" font-size="12" fill="#b91c1c">energy for cell work</text></g>
<g class="part" data-part="syn" data-name="Synthesis: ADP + Pi → ATP" data-info="A condensation reaction catalysed by ATP synthase, using energy from respiration (or light in photosynthesis)." tabindex="0" role="button" aria-label="Synthesis: ADP + Pi → ATP"><path d="M 690 420 A 130 130 0 0 1 780 256" fill="none" stroke="#16a34a" stroke-width="7" marker-end="url(#at-16a34a)"/><text x="680" y="340" text-anchor="end" font-size="13" font-weight="700" fill="#15803d">condensation</text><text x="680" y="358" text-anchor="end" font-size="12" fill="#15803d">energy from respiration</text></g>
<g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.4167;0.4417;1.0000" values="0;0;1;1" dur="12s" begin="at-play.begin+0s" fill="freeze"/><g font-size="12"><text x="970" y="470">• muscle contraction</text><text x="970" y="488">• active transport</text><text x="970" y="506">• protein synthesis</text><text x="970" y="524">• nerve impulses</text></g></g>
</svg>