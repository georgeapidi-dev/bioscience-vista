<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" class="vd-svg" role="img" aria-labelledby="sv-title sv-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="sv-play" data-vd-play-label="Play: size and SA:V" data-vd-steps="[[0, &quot;Surface area to volume ratio (SA:V) of cubes.&quot;], [1, &quot;Each cube is bigger: surface area grows with side\u00b2, volume with side\u00b3.&quot;], [4.5, &quot;So SA:V falls as size increases: 6, 3, 2, 1.5.&quot;], [8, &quot;Agar cubes in acid: the smallest changes colour completely first.&quot;], [12.5, &quot;Large organisms need exchange surfaces and transport systems.&quot;]]" data-vd-dur="16">
<title id="sv-title">Surface area to volume ratio</title><desc id="sv-desc">Cubes of side 1 to 4 cm with their surface areas, volumes and SA:V ratios, a falling bar chart, and agar cubes changing colour as acid diffuses in.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1200" height="720" fill="#ffffff"/>
<g aria-hidden="true"><animate id="sv-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<text class="head" x="30" y="34">Surface area to volume ratio</text><text class="note" x="30" y="56">Cubes drawn to scale with each other: 1 cm = 30 px.</text>
<g class="part" data-part="cubes" data-name="Cubes of side 1, 2, 3 and 4 cm" data-info="As the side doubles, surface area increases 4 times but volume increases 8 times." tabindex="0" role="button" aria-label="Cubes of side 1, 2, 3 and 4 cm"><g><animate attributeName="opacity" keyTimes="0.0000;0.0625;0.0813;1.0000" values="0;0;1;1" dur="16s" begin="sv-play.begin+0s" fill="freeze"/><polygon points="60,270 90,270 90,300 60,300" fill="#93c5fd" stroke="#1e3a8a" stroke-width="1.5"/><polygon points="60,270 73.5,256.5 103.5,256.5 90,270" fill="#bfdbfe" stroke="#1e3a8a" stroke-width="1.5"/><polygon points="90,270 103.5,256.5 103.5,286.5 90,300" fill="#60a5fa" stroke="#1e3a8a" stroke-width="1.5"/><text x="75.0" y="330" text-anchor="middle" font-size="13" font-weight="700">1 cm</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.1125;0.1313;1.0000" values="0;0;1;1" dur="16s" begin="sv-play.begin+0s" fill="freeze"/><polygon points="143.5,240 203.5,240 203.5,300 143.5,300" fill="#93c5fd" stroke="#1e3a8a" stroke-width="1.5"/><polygon points="143.5,240 170.5,213.0 230.5,213.0 203.5,240" fill="#bfdbfe" stroke="#1e3a8a" stroke-width="1.5"/><polygon points="203.5,240 230.5,213.0 230.5,273.0 203.5,300" fill="#60a5fa" stroke="#1e3a8a" stroke-width="1.5"/><line x1="173.5" y1="240" x2="173.5" y2="300" stroke="#1e3a8a" stroke-width=".6" opacity=".5"/><line x1="143.5" y1="270" x2="203.5" y2="270" stroke="#1e3a8a" stroke-width=".6" opacity=".5"/><text x="173.5" y="330" text-anchor="middle" font-size="13" font-weight="700">2 cm</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.1625;0.1812;1.0000" values="0;0;1;1" dur="16s" begin="sv-play.begin+0s" fill="freeze"/><polygon points="270.5,210 360.5,210 360.5,300 270.5,300" fill="#93c5fd" stroke="#1e3a8a" stroke-width="1.5"/><polygon points="270.5,210 311.0,169.5 401.0,169.5 360.5,210" fill="#bfdbfe" stroke="#1e3a8a" stroke-width="1.5"/><polygon points="360.5,210 401.0,169.5 401.0,259.5 360.5,300" fill="#60a5fa" stroke="#1e3a8a" stroke-width="1.5"/><line x1="300.5" y1="210" x2="300.5" y2="300" stroke="#1e3a8a" stroke-width=".6" opacity=".5"/><line x1="270.5" y1="240" x2="360.5" y2="240" stroke="#1e3a8a" stroke-width=".6" opacity=".5"/><line x1="330.5" y1="210" x2="330.5" y2="300" stroke="#1e3a8a" stroke-width=".6" opacity=".5"/><line x1="270.5" y1="270" x2="360.5" y2="270" stroke="#1e3a8a" stroke-width=".6" opacity=".5"/><text x="315.5" y="330" text-anchor="middle" font-size="13" font-weight="700">3 cm</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.2125;0.2313;1.0000" values="0;0;1;1" dur="16s" begin="sv-play.begin+0s" fill="freeze"/><polygon points="441.0,180 561.0,180 561.0,300 441.0,300" fill="#93c5fd" stroke="#1e3a8a" stroke-width="1.5"/><polygon points="441.0,180 495.0,126.0 615.0,126.0 561.0,180" fill="#bfdbfe" stroke="#1e3a8a" stroke-width="1.5"/><polygon points="561.0,180 615.0,126.0 615.0,246.0 561.0,300" fill="#60a5fa" stroke="#1e3a8a" stroke-width="1.5"/><line x1="471.0" y1="180" x2="471.0" y2="300" stroke="#1e3a8a" stroke-width=".6" opacity=".5"/><line x1="441.0" y1="210" x2="561.0" y2="210" stroke="#1e3a8a" stroke-width=".6" opacity=".5"/><line x1="501.0" y1="180" x2="501.0" y2="300" stroke="#1e3a8a" stroke-width=".6" opacity=".5"/><line x1="441.0" y1="240" x2="561.0" y2="240" stroke="#1e3a8a" stroke-width=".6" opacity=".5"/><line x1="531.0" y1="180" x2="531.0" y2="300" stroke="#1e3a8a" stroke-width=".6" opacity=".5"/><line x1="441.0" y1="270" x2="561.0" y2="270" stroke="#1e3a8a" stroke-width=".6" opacity=".5"/><text x="501.0" y="330" text-anchor="middle" font-size="13" font-weight="700">4 cm</text></g></g>
<g class="part" data-part="tab" data-name="Calculations" data-info="Surface area = 6 × side². Volume = side³. SA:V = surface area ÷ volume." tabindex="0" role="button" aria-label="Calculations"><rect x="620" y="90" width="560" height="220" rx="14" fill="#f8fafc" stroke="#cbd5e1"/><text x="650" y="120" font-size="13" font-weight="800">side / cm</text><text x="785" y="120" font-size="13" font-weight="800">surface area / cm²</text><text x="920" y="120" font-size="13" font-weight="800">volume / cm³</text><text x="1055" y="120" font-size="13" font-weight="800">SA : V</text><g><animate attributeName="opacity" keyTimes="0.0000;0.0938;0.1125;1.0000" values="0;0;1;1" dur="16s" begin="sv-play.begin+0s" fill="freeze"/><text x="680" y="156" font-size="15" text-anchor="middle">1</text><text x="830" y="156" font-size="15" text-anchor="middle">6 × 1² = 6</text><text x="955" y="156" font-size="15" text-anchor="middle">1³ = 1</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.2812;0.3000;1.0000" values="0;0;1;1" dur="16s" begin="sv-play.begin+0s" fill="freeze"/><text x="1110" y="156" font-size="16" font-weight="800" text-anchor="middle" fill="#dc2626">6 : 1</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.1437;0.1625;1.0000" values="0;0;1;1" dur="16s" begin="sv-play.begin+0s" fill="freeze"/><text x="680" y="194" font-size="15" text-anchor="middle">2</text><text x="830" y="194" font-size="15" text-anchor="middle">6 × 2² = 24</text><text x="955" y="194" font-size="15" text-anchor="middle">2³ = 8</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.3063;0.3250;1.0000" values="0;0;1;1" dur="16s" begin="sv-play.begin+0s" fill="freeze"/><text x="1110" y="194" font-size="16" font-weight="800" text-anchor="middle" fill="#dc2626">3 : 1</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.1938;0.2125;1.0000" values="0;0;1;1" dur="16s" begin="sv-play.begin+0s" fill="freeze"/><text x="680" y="232" font-size="15" text-anchor="middle">3</text><text x="830" y="232" font-size="15" text-anchor="middle">6 × 3² = 54</text><text x="955" y="232" font-size="15" text-anchor="middle">3³ = 27</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.3312;0.3500;1.0000" values="0;0;1;1" dur="16s" begin="sv-play.begin+0s" fill="freeze"/><text x="1110" y="232" font-size="16" font-weight="800" text-anchor="middle" fill="#dc2626">2 : 1</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.2438;0.2625;1.0000" values="0;0;1;1" dur="16s" begin="sv-play.begin+0s" fill="freeze"/><text x="680" y="270" font-size="15" text-anchor="middle">4</text><text x="830" y="270" font-size="15" text-anchor="middle">6 × 4² = 96</text><text x="955" y="270" font-size="15" text-anchor="middle">4³ = 64</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.3563;0.3750;1.0000" values="0;0;1;1" dur="16s" begin="sv-play.begin+0s" fill="freeze"/><text x="1110" y="270" font-size="16" font-weight="800" text-anchor="middle" fill="#dc2626">1.5 : 1</text></g></g>
<line x1="660" y1="560" x2="1150" y2="560" stroke="#334155" stroke-width="2"/><line x1="660" y1="560" x2="660" y2="350" stroke="#334155" stroke-width="2"/><text x="640" y="455" font-size="12" text-anchor="middle" transform="rotate(-90 640 455)">SA : V</text><rect x="700" y="380.0" width="70" height="180.0" rx="5" fill="#ef4444"><animate attributeName="height" keyTimes="0.0000;0.2812;0.3187;1.0000" values="180.0;0;180.0;180.0" dur="16s" begin="sv-play.begin+0s" fill="freeze"/><animate attributeName="y" keyTimes="0.0000;0.2812;0.3187;1.0000" values="380.0;560;380.0;380.0" dur="16s" begin="sv-play.begin+0s" fill="freeze"/></rect><text x="735" y="580" text-anchor="middle" font-size="12">1 cm</text><rect x="810" y="470.0" width="70" height="90.0" rx="5" fill="#ef4444"><animate attributeName="height" keyTimes="0.0000;0.3063;0.3438;1.0000" values="90.0;0;90.0;90.0" dur="16s" begin="sv-play.begin+0s" fill="freeze"/><animate attributeName="y" keyTimes="0.0000;0.3063;0.3438;1.0000" values="470.0;560;470.0;470.0" dur="16s" begin="sv-play.begin+0s" fill="freeze"/></rect><text x="845" y="580" text-anchor="middle" font-size="12">2 cm</text><rect x="920" y="500.0" width="70" height="60.0" rx="5" fill="#ef4444"><animate attributeName="height" keyTimes="0.0000;0.3312;0.3687;1.0000" values="60.0;0;60.0;60.0" dur="16s" begin="sv-play.begin+0s" fill="freeze"/><animate attributeName="y" keyTimes="0.0000;0.3312;0.3687;1.0000" values="500.0;560;500.0;500.0" dur="16s" begin="sv-play.begin+0s" fill="freeze"/></rect><text x="955" y="580" text-anchor="middle" font-size="12">3 cm</text><rect x="1030" y="515.0" width="70" height="45.0" rx="5" fill="#ef4444"><animate attributeName="height" keyTimes="0.0000;0.3563;0.3937;1.0000" values="45.0;0;45.0;45.0" dur="16s" begin="sv-play.begin+0s" fill="freeze"/><animate attributeName="y" keyTimes="0.0000;0.3563;0.3937;1.0000" values="515.0;560;515.0;515.0" dur="16s" begin="sv-play.begin+0s" fill="freeze"/></rect><text x="1065" y="580" text-anchor="middle" font-size="12">4 cm</text><text x="905" y="600" text-anchor="middle" font-size="12">cube side</text>
<g class="part" data-part="agar" data-name="Agar cube practical" data-info="Cubes of agar with indicator are put in acid. Acid diffuses in at the same rate in each, so the smallest cube changes colour completely first: it has the largest SA:V and the shortest distance to its centre." tabindex="0" role="button" aria-label="Agar cube practical"><rect x="40" y="380" width="560" height="320" rx="16" fill="#fdf2f8" stroke="#f9a8d4"/><text x="60" y="408" font-size="14" font-weight="800" fill="#9d174d">Agar cubes with indicator in acid</text><polygon points="80,500.0 120,500.0 120,540.0 80,540.0" fill="#ec4899" stroke="#1e3a8a" stroke-width="1.5"/><polygon points="80,500.0 98.0,482.0 138.0,482.0 120,500.0" fill="#f472b6" stroke="#1e3a8a" stroke-width="1.5"/><polygon points="120,500.0 138.0,482.0 138.0,522.0 120,540.0" fill="#db2777" stroke="#1e3a8a" stroke-width="1.5"/><rect x="80" y="500.0" width="40" height="40" fill="#fef9c3"><animate attributeName="opacity" keyTimes="0.0000;0.5000;0.7500;1.0000" values="0;0;1;1" dur="16s" begin="sv-play.begin+0s" fill="freeze"/></rect><text x="100.0" y="566.0" text-anchor="middle" font-size="12" font-weight="700">1 cm</text><polygon points="198.0,480.0 278.0,480.0 278.0,560.0 198.0,560.0" fill="#ec4899" stroke="#1e3a8a" stroke-width="1.5"/><polygon points="198.0,480.0 234.0,444.0 314.0,444.0 278.0,480.0" fill="#f472b6" stroke="#1e3a8a" stroke-width="1.5"/><polygon points="278.0,480.0 314.0,444.0 314.0,524.0 278.0,560.0" fill="#db2777" stroke="#1e3a8a" stroke-width="1.5"/><rect x="198.0" y="480.0" width="80" height="80" fill="#fef9c3"><animate attributeName="opacity" keyTimes="0.0000;0.5000;0.7500;1.0000" values="0;0;1;1" dur="16s" begin="sv-play.begin+0s" fill="freeze"/></rect><text x="238.0" y="586.0" text-anchor="middle" font-size="12" font-weight="700">2 cm</text><polygon points="374.0,460.0 494.0,460.0 494.0,580.0 374.0,580.0" fill="#ec4899" stroke="#1e3a8a" stroke-width="1.5"/><polygon points="374.0,460.0 428.0,406.0 548.0,406.0 494.0,460.0" fill="#f472b6" stroke="#1e3a8a" stroke-width="1.5"/><polygon points="494.0,460.0 548.0,406.0 548.0,526.0 494.0,580.0" fill="#db2777" stroke="#1e3a8a" stroke-width="1.5"/><rect x="374.0" y="460.0" width="120" height="120" fill="#fef9c3"><animate attributeName="opacity" keyTimes="0.0000;0.5000;0.7500;1.0000" values="0;0;1;1" dur="16s" begin="sv-play.begin+0s" fill="freeze"/></rect><rect x="418.0" y="504.0" width="32" height="32" fill="#ec4899" opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.7188;0.7500;1.0000" values="0;0;1;1" dur="16s" begin="sv-play.begin+0s" fill="freeze"/></rect><text x="434.0" y="606.0" text-anchor="middle" font-size="12" font-weight="700">3 cm</text><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.7500;0.7688;1.0000" values="0;0;1;1" dur="16s" begin="sv-play.begin+0s" fill="freeze"/><text x="60" y="650" font-size="12" font-weight="700">The 1 cm cube is completely decolourised; the 3 cm cube still has a pink centre.</text><text x="60" y="670" font-size="12">Pink → pale yellow: acid has diffused in (the same distance in each cube).</text></g></g>
<g class="part" data-part="why" data-name="Why it matters" data-info="Large organisms have a small SA:V, so diffusion across their surface is too slow. They need specialised exchange surfaces (lungs, gills, villi, leaves) and transport systems. Cells stay small." tabindex="0" role="button" aria-label="Why it matters"><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.7812;0.8000;1.0000" values="0;0;1;1" dur="16s" begin="sv-play.begin+0s" fill="freeze"/><rect x="620" y="610" width="560" height="90" rx="14" fill="#ecfdf5" stroke="#6ee7b7"/><text x="640" y="636" font-size="13" font-weight="800" fill="#065f46">Bigger organism → smaller SA:V</text><text x="640" y="656" font-size="12">Diffusion alone is too slow: large organisms need exchange surfaces</text><text x="640" y="674" font-size="12">(alveoli, villi, gills, leaves) and transport systems (blood, xylem, phloem).</text></g></g>
</svg>