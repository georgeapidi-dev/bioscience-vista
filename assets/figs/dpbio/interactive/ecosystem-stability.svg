<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 540" class="vd-svg" role="img" aria-labelledby="st-title st-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="st-play" data-vd-play-label="Play: sustain" data-vd-steps="[[0, &quot;What keeps an ecosystem stable?&quot;], [1, &quot;Energy flows in from the Sun.&quot;], [4, &quot;Nutrients cycle through decomposers.&quot;], [7, &quot;Genetic diversity lets populations survive change and disease.&quot;], [10, &quot;Climate must stay within tolerance limits.&quot;]]" data-vd-dur="13">
<title id="st-title">Ecosystem stability</title><desc id="st-desc">A stable ecosystem needs energy input from sunlight, nutrient recycling by decomposers, genetic diversity within populations, and climate within tolerance limits; examples include the Daintree rainforest and Namib Desert.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="540" fill="#ffffff"/>
