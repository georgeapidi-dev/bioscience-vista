<text class="head" x="30" y="34">Requirements for ecosystem stability</text><text class="note" x="30" y="56">Examples: Daintree rainforest (&gt;100 million years), Namib Desert.</text>
<g class="part" data-part="req" data-name="Requirements for stability" data-info="A supply of energy (usually sunlight); recycling of nutrients by decomposers; genetic diversity within populations; climate within the tolerance limits of the species." tabindex="0" role="button" aria-label="Requirements for stability"><g><animate attributeName="opacity" keyTimes="0.0000;0.0769;0.1000;1.0000" values="0;0;1;1" dur="13s" begin="st-play.begin+0s" fill="freeze"/><circle cx="140" cy="140" r="44" fill="#facc15"/><path d="M 190 160 L 340 230" stroke="#f59e0b" stroke-width="5" marker-end="url(#st-f59e0b)"/><text x="140" y="210" text-anchor="middle" font-size="13" font-weight="800" fill="#a16207">1 energy (sunlight)</text></g><ellipse cx="450" cy="300" rx="150" ry="110" fill="#dcfce7" stroke="#15803d" stroke-width="3"/><text x="450" y="290" text-anchor="middle" font-size="16" font-weight="800" fill="#14532d">ecosystem</text><g><animate attributeName="opacity" keyTimes="0.0000;0.3077;0.3308;1.0000" values="0;0;1;1" dur="13s" begin="st-play.begin+0s" fill="freeze"/><path d="M 510 420 A 110 60 0 1 1 390 420" fill="none" stroke="#a16207" stroke-width="4" marker-end="url(#st-475569)"/><text x="450" y="510" text-anchor="middle" font-size="13" font-weight="800" fill="#a16207">2 nutrients recycled by decomposers</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.5385;0.5615;1.0000" values="0;0;1;1" dur="13s" begin="st-play.begin+0s" fill="freeze"/><circle cx="390" cy="330" r="10" fill="#a78bfa"/><circle cx="420" cy="330" r="10" fill="#f472b6"/><circle cx="450" cy="330" r="10" fill="#60a5fa"/><circle cx="480" cy="330" r="10" fill="#34d399"/><circle cx="510" cy="330" r="10" fill="#fbbf24"/><text x="450" y="366" text-anchor="middle" font-size="13" font-weight="800" fill="#6d28d9">3 genetic diversity</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.7692;0.7923;1.0000" values="0;0;1;1" dur="13s" begin="st-play.begin+0s" fill="freeze"/><rect x="700" y="160" width="360" height="200" rx="16" fill="#f8fafc" stroke="#cbd5e1"/><text x="880" y="188" text-anchor="middle" font-size="14" font-weight="800" fill="#111827">4 climate within tolerance</text><path d="M 730 320 C 800 320 820 220 880 220 C 940 220 960 320 1030 320" fill="#bbf7d0" stroke="#16a34a" stroke-width="3"/><line x1="860" y1="210" x2="860" y2="330" stroke="#dc2626" stroke-width="3"/><text x="880" y="348" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">temperature, rainfall stay in range</text></g></g>
<g class="part" data-part="stable" data-name="Stable ecosystems" data-info="Many persist with similar communities for very long periods: the Daintree rainforest for over 100 million years; the Namib Desert for tens of millions; fossil pollen shows forests persisting for thousands of years." tabindex="0" role="button" aria-label="Stable ecosystems"><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.8462;0.8692;1.0000" values="0;0;1;1" dur="13s" begin="st-play.begin+0s" fill="freeze"/><rect x="720.0" y="408" width="320" height="24" rx="12" fill="#dcfce7" stroke="#1f2937" stroke-width="1"/><text x="880" y="425" text-anchor="middle" font-size="12" font-weight="700">stable for thousands to millions of years</text></g></g>
</svg>