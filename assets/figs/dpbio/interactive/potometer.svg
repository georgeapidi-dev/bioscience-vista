<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 540" class="vd-svg" role="img" aria-labelledby="pt-title pt-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="pt-play" data-vd-play-label="Play: measure" data-vd-steps="[[0, &quot;A potometer measures water uptake.&quot;], [1, &quot;Shoot sealed in, air bubble in the capillary.&quot;], [5, &quot;Bubble moves as water is taken up.&quot;], [11, &quot;Change one factor at a time.&quot;]]" data-vd-dur="15">
<title id="pt-title">Potometer</title><desc id="pt-desc">A leafy shoot sealed into a potometer with a reservoir, a capillary tube and a scale; an air bubble moves along the scale as the shoot takes up water, and is faster with a fan blowing.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="540" fill="#ffffff"/>
<g aria-hidden="true"><animate id="pt-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<text class="head" x="30" y="34">The potometer</text><text class="note" x="30" y="56">Measures the rate of water uptake (≈ transpiration).</text>
<g class="part" data-part="set" data-name="Set-up" data-info="A leafy shoot is cut under water and fitted into the potometer so that no air enters. A bubble is introduced into the capillary tube." tabindex="0" role="button" aria-label="Set-up"><path d="M 200 220 L 200 380 L 900 380" fill="none" stroke="#bfdbfe" stroke-width="18"/><path d="M 200 220 L 200 380 L 900 380" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="0"/><rect x="150" y="190" width="100" height="40" rx="8" fill="#94a3b8"/><path d="M 200 190 L 200 150" stroke="#15803d" stroke-width="6"/><ellipse cx="240" cy="150" rx="40" ry="14" fill="#4ade80" stroke="#15803d" transform="rotate(25 240 150)"/><ellipse cx="160" cy="138" rx="40" ry="14" fill="#4ade80" stroke="#15803d" transform="rotate(-25 160 138)"/><ellipse cx="240" cy="126" rx="40" ry="14" fill="#4ade80" stroke="#15803d" transform="rotate(25 240 126)"/><ellipse cx="160" cy="114" rx="40" ry="14" fill="#4ade80" stroke="#15803d" transform="rotate(-25 160 114)"/><text x="120" y="214" text-anchor="end" font-size="11" font-weight="800" fill="#475569">seal</text><rect x="400" y="200" width="70" height="120" rx="8" fill="#dbeafe" stroke="#334155"/><path d="M 435 320 L 435 380" stroke="#334155" stroke-width="3"/><text x="435" y="190" text-anchor="middle" font-size="11" font-weight="800" fill="#475569">reservoir + tap</text><line x1="560" y1="392" x2="560" y2="404" stroke="#111827"/><text x="560" y="420" text-anchor="middle" font-size="10" font-weight="700" fill="#475569">0</text><line x1="590" y1="392" x2="590" y2="404" stroke="#111827"/><text x="590" y="420" text-anchor="middle" font-size="10" font-weight="700" fill="#475569">1</text><line x1="620" y1="392" x2="620" y2="404" stroke="#111827"/><text x="620" y="420" text-anchor="middle" font-size="10" font-weight="700" fill="#475569">2</text><line x1="650" y1="392" x2="650" y2="404" stroke="#111827"/><text x="650" y="420" text-anchor="middle" font-size="10" font-weight="700" fill="#475569">3</text><line x1="680" y1="392" x2="680" y2="404" stroke="#111827"/><text x="680" y="420" text-anchor="middle" font-size="10" font-weight="700" fill="#475569">4</text><line x1="710" y1="392" x2="710" y2="404" stroke="#111827"/><text x="710" y="420" text-anchor="middle" font-size="10" font-weight="700" fill="#475569">5</text><line x1="740" y1="392" x2="740" y2="404" stroke="#111827"/><text x="740" y="420" text-anchor="middle" font-size="10" font-weight="700" fill="#475569">6</text><line x1="770" y1="392" x2="770" y2="404" stroke="#111827"/><text x="770" y="420" text-anchor="middle" font-size="10" font-weight="700" fill="#475569">7</text><line x1="800" y1="392" x2="800" y2="404" stroke="#111827"/><text x="800" y="420" text-anchor="middle" font-size="10" font-weight="700" fill="#475569">8</text><line x1="830" y1="392" x2="830" y2="404" stroke="#111827"/><text x="830" y="420" text-anchor="middle" font-size="10" font-weight="700" fill="#475569">9</text><line x1="860" y1="392" x2="860" y2="404" stroke="#111827"/><text x="860" y="420" text-anchor="middle" font-size="10" font-weight="700" fill="#475569">10</text><text x="710" y="440" text-anchor="middle" font-size="11" font-weight="800" fill="#475569">scale / mm</text></g>
<g class="part" data-part="run" data-name="Measuring" data-info="As the shoot takes up water, the bubble moves along the scale. Rate = distance moved ÷ time (or volume, from the tube&#x27;s cross-section). The reservoir resets the bubble." tabindex="0" role="button" aria-label="Measuring"><circle cx="860" cy="380" r="8" fill="#fff" stroke="#334155" stroke-width="2"><animate attributeName="cx" keyTimes="0.0000;0.3333;0.7000;0.7333;0.9667;1.0000" values="860;860;680;860;560;560" dur="15s" begin="pt-play.begin+0s" fill="freeze"/></circle><g><animate attributeName="opacity" keyTimes="0.0000;0.4000;0.4200;1.0000" values="0;0;1;1" dur="15s" begin="pt-play.begin+0s" fill="freeze"/><text x="710" y="470" text-anchor="middle" font-size="14" font-weight="800" fill="#1d4ed8">rate = distance ÷ time</text></g></g>
<g class="part" data-part="var" data-name="Investigating factors" data-info="Change one factor at a time: wind (fan), temperature, humidity (plastic bag), light intensity. Water uptake ≈ transpiration (a little is used in photosynthesis)." tabindex="0" role="button" aria-label="Investigating factors"><g><animate attributeName="opacity" keyTimes="0.0000;0.7333;0.7533;1.0000" values="0;0;1;1" dur="15s" begin="pt-play.begin+0s" fill="freeze"/><g transform="translate(330 150)"><circle r="30" fill="#e2e8f0" stroke="#334155"/><ellipse rx="26" ry="8" transform="rotate(0)" fill="#94a3b8"/><ellipse rx="26" ry="8" transform="rotate(120)" fill="#94a3b8"/><ellipse rx="26" ry="8" transform="rotate(240)" fill="#94a3b8"/></g><text x="330" y="200" text-anchor="middle" font-size="12" font-weight="800" fill="#b91c1c">fan: faster</text><rect x="720" y="100" width="340" height="150" rx="14" fill="#fef3c7" stroke="#fcd34d"/><text x="890" y="128" text-anchor="middle" font-size="13" font-weight="800" fill="#a16207">faster transpiration with:</text><text x="890" y="160" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">higher temperature · wind</text><text x="890" y="186" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">lower humidity · more light</text><text x="890" y="222" text-anchor="middle" font-size="12" font-weight="700" fill="#475569">change one factor at a time</text></g></g>
</svg>