<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" class="vd-svg" role="img" aria-labelledby="an-title an-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="an-play" data-vd-play-label="Play: no oxygen" data-vd-steps="[[0, &quot;Anaerobic respiration: keeping glycolysis going.&quot;], [1, &quot;Glycolysis: glucose \u2192 2 pyruvate, 2 ATP, and reduced NAD.&quot;], [4.5, &quot;With no oxygen, NAD would run out...&quot;], [7, &quot;...so pyruvate takes the hydrogen: lactate forms and NAD is regenerated.&quot;], [11, &quot;In yeast: ethanol and CO\u2082 instead.&quot;]]" data-vd-dur="14">
<title id="an-title">Anaerobic respiration</title><desc id="an-desc">Glycolysis converts glucose to pyruvate, producing ATP and reduced NAD; without oxygen, pyruvate accepts hydrogen from reduced NAD forming lactate in muscle, or ethanol and carbon dioxide in yeast, regenerating NAD for glycolysis.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="560" fill="#ffffff"/>
<g aria-hidden="true"><animate id="an-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<defs><marker id="an-475569" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="6.3" refY="7.0" orient="auto"><path d="M0,0 L14,7.0 L0,14 z" fill="#475569"/></marker><marker id="an-15803d" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="6.3" refY="7.0" orient="auto"><path d="M0,0 L14,7.0 L0,14 z" fill="#15803d"/></marker><marker id="an-dc2626" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="6.3" refY="7.0" orient="auto"><path d="M0,0 L14,7.0 L0,14 z" fill="#dc2626"/></marker></defs>
<text class="head" x="30" y="34">Anaerobic respiration: regenerating NAD</text><text class="note" x="30" y="56">Per glucose; circles = carbon atoms.</text>
<g class="part" data-part="gly" data-name="Glycolysis" data-info="Glucose → 2 pyruvate, with a net yield of 2 ATP. NAD is reduced in the process." tabindex="0" role="button" aria-label="Glycolysis"><circle cx="147.5" cy="150" r="10" fill="#fbbf24" stroke="#a16207" stroke-width="1.5"/><circle cx="168.5" cy="150" r="10" fill="#fbbf24" stroke="#a16207" stroke-width="1.5"/><circle cx="189.5" cy="150" r="10" fill="#fbbf24" stroke="#a16207" stroke-width="1.5"/><circle cx="210.5" cy="150" r="10" fill="#fbbf24" stroke="#a16207" stroke-width="1.5"/><circle cx="231.5" cy="150" r="10" fill="#fbbf24" stroke="#a16207" stroke-width="1.5"/><circle cx="252.5" cy="150" r="10" fill="#fbbf24" stroke="#a16207" stroke-width="1.5"/><text x="200" y="120" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">glucose (6C)</text><path d="M 200 172 L 200 260" stroke="#475569" stroke-width="3" marker-end="url(#an-475569)"/><text x="220" y="220" text-anchor="start" font-size="13" font-weight="800" fill="#475569">glycolysis</text><g><animate attributeName="opacity" keyTimes="0.0000;0.1429;0.1643;1.0000" values="0;0;1;1" dur="14s" begin="an-play.begin+0s" fill="freeze"/><circle cx="129.0" cy="290" r="10" fill="#fbbf24" stroke="#a16207" stroke-width="1.5"/><circle cx="150.0" cy="290" r="10" fill="#fbbf24" stroke="#a16207" stroke-width="1.5"/><circle cx="171.0" cy="290" r="10" fill="#fbbf24" stroke="#a16207" stroke-width="1.5"/><circle cx="239.0" cy="290" r="10" fill="#fbbf24" stroke="#a16207" stroke-width="1.5"/><circle cx="260.0" cy="290" r="10" fill="#fbbf24" stroke="#a16207" stroke-width="1.5"/><circle cx="281.0" cy="290" r="10" fill="#fbbf24" stroke="#a16207" stroke-width="1.5"/><text x="200" y="330" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">2 pyruvate (3C)</text><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.1429;0.1643;1.0000" values="0;0;1;1" dur="14s" begin="an-play.begin+0s" fill="freeze"/><rect x="325.0" y="188" width="110" height="24" rx="12" fill="#fef9c3" stroke="#1f2937" stroke-width="1"/><text x="380" y="205" text-anchor="middle" font-size="12" font-weight="700">net 2 ATP</text></g></g></g>
<g class="part" data-part="prob" data-name="The problem" data-info="Without oxygen, reduced NAD cannot pass its hydrogen to the electron transport chain, so NAD would run out and glycolysis would stop." tabindex="0" role="button" aria-label="The problem"><path d="M 420 290 C 520 250 620 250 700 290" fill="none" stroke="#dc2626" stroke-width="3" marker-end="url(#an-dc2626)"/><text x="560" y="245" text-anchor="middle" font-size="13" font-weight="800" fill="#b91c1c">NAD → reduced NAD</text><g><animate attributeName="opacity" keyTimes="0.0000;0.5000;0.5214;1.0000" values="0;0;1;1" dur="14s" begin="an-play.begin+0s" fill="freeze"/><path d="M 700 330 C 620 380 520 380 420 330" fill="none" stroke="#15803d" stroke-width="3" marker-end="url(#an-15803d)"/><text x="560" y="400" text-anchor="middle" font-size="13" font-weight="800" fill="#15803d">reduced NAD → NAD (regenerated)</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.3214;0.3429;1.0000" values="0;0;1;1" dur="14s" begin="an-play.begin+0s" fill="freeze"/><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.3214;0.3429;0.5000;0.5214;1.0000" values="0;0;1;1;0;0" dur="14s" begin="an-play.begin+0s" fill="freeze"/><rect x="330.0" y="458" width="460" height="24" rx="12" fill="#fee2e2" stroke="#1f2937" stroke-width="1"/><text x="560" y="475" text-anchor="middle" font-size="12" font-weight="700">no O₂: reduced NAD cannot go to the electron transport chain</text></g></g></g>
<g class="part" data-part="lac" data-name="Lactate (human muscle)" data-info="Pyruvate accepts hydrogen from reduced NAD, becoming lactate and regenerating NAD, so glycolysis can continue." tabindex="0" role="button" aria-label="Lactate (human muscle)"><g><animate attributeName="opacity" keyTimes="0.0000;0.5000;0.5214;1.0000" values="0;0;1;1" dur="14s" begin="an-play.begin+0s" fill="freeze"/><rect x="760" y="90" width="310" height="170" rx="16" fill="#fff1f2" stroke="#fda4af"/><text x="915" y="116" text-anchor="middle" font-size="14" font-weight="800" fill="#be123c">human muscle</text><text x="915" y="150" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">pyruvate + reduced NAD</text><text x="915" y="174" text-anchor="middle" font-size="15" font-weight="800" fill="#111827">↓</text><text x="915" y="198" text-anchor="middle" font-size="15" font-weight="800" fill="#be123c">lactate + NAD</text><circle cx="896.1" cy="232" r="9" fill="#fda4af" stroke="#be123c" stroke-width="1.5"/><circle cx="915.0" cy="232" r="9" fill="#fda4af" stroke="#be123c" stroke-width="1.5"/><circle cx="933.9" cy="232" r="9" fill="#fda4af" stroke="#be123c" stroke-width="1.5"/></g></g>
<g class="part" data-part="yeast" data-name="Yeast" data-info="Pyruvate is converted to ethanol and carbon dioxide, also regenerating NAD." tabindex="0" role="button" aria-label="Yeast"><g><animate attributeName="opacity" keyTimes="0.0000;0.7857;0.8071;1.0000" values="0;0;1;1" dur="14s" begin="an-play.begin+0s" fill="freeze"/><rect x="760" y="300" width="310" height="170" rx="16" fill="#fefce8" stroke="#fde047"/><text x="915" y="326" text-anchor="middle" font-size="14" font-weight="800" fill="#a16207">yeast</text><text x="915" y="360" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">pyruvate + reduced NAD</text><text x="915" y="384" text-anchor="middle" font-size="15" font-weight="800" fill="#111827">↓</text><text x="915" y="408" text-anchor="middle" font-size="15" font-weight="800" fill="#a16207">ethanol + CO₂ + NAD</text><circle cx="880.5" cy="442" r="9" fill="#fde68a" stroke="#a16207" stroke-width="1.5"/><circle cx="899.5" cy="442" r="9" fill="#fde68a" stroke="#a16207" stroke-width="1.5"/><circle cx="960" cy="442" r="9" fill="#e5e7eb" stroke="#475569"/></g></g>
</svg>