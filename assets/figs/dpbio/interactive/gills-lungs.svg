<text class="head" x="30" y="34">Gills and lungs: two ways to ventilate</text><text class="note" x="30" y="56">Schematic.</text>
<g class="part" data-part="gill" data-name="Gills: one-way flow" data-info="Water flows in through the mouth, over the gill filaments and out under the operculum: a continuous one-way flow." tabindex="0" role="button" aria-label="Gills: one-way flow"><path d="M 60 230 Q 150 130 330 160 L 380 230 L 330 300 Q 150 330 60 230 Z" fill="#bae6fd" stroke="#0369a1" stroke-width="3"/><path d="M 380 230 L 430 180 L 430 280 Z" fill="#bae6fd" stroke="#0369a1" stroke-width="3"/><circle cx="110" cy="210" r="6" fill="#0f172a"/><path d="M 190 190 q 8 40 0 80" fill="none" stroke="#dc2626" stroke-width="4"/><path d="M 204 190 q 8 40 0 80" fill="none" stroke="#dc2626" stroke-width="4"/><path d="M 218 190 q 8 40 0 80" fill="none" stroke="#dc2626" stroke-width="4"/><path d="M 232 190 q 8 40 0 80" fill="none" stroke="#dc2626" stroke-width="4"/><text x="220" y="350" text-anchor="middle" font-size="12" font-weight="800" fill="#b91c1c">gill filaments</text><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.0714;0.0857;0.2571;0.2714;1.0000" values="0;0;1;1;0;0" dur="14s" begin="gl-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.0714;0.1571;0.2429;1.0000" values="40 232;40 232;200 232;270 290;270 290" dur="14s" begin="gl-play.begin+0s" fill="freeze"/><circle r="5" fill="#0284c7"/></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.0964;0.1107;0.2821;0.2964;1.0000" values="0;0;1;1;0;0" dur="14s" begin="gl-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.0964;0.1821;0.2679;1.0000" values="40 232;40 232;200 232;270 290;270 290" dur="14s" begin="gl-play.begin+0s" fill="freeze"/><circle r="5" fill="#0284c7"/></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.1214;0.1357;0.3071;0.3214;1.0000" values="0;0;1;1;0;0" dur="14s" begin="gl-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.1214;0.2071;0.2929;1.0000" values="40 232;40 232;200 232;270 290;270 290" dur="14s" begin="gl-play.begin+0s" fill="freeze"/><circle r="5" fill="#0284c7"/></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.1464;0.1607;0.3321;0.3464;1.0000" values="0;0;1;1;0;0" dur="14s" begin="gl-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.1464;0.2321;0.3179;1.0000" values="40 232;40 232;200 232;270 290;270 290" dur="14s" begin="gl-play.begin+0s" fill="freeze"/><circle r="5" fill="#0284c7"/></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.1714;0.1857;0.3571;0.3714;1.0000" values="0;0;1;1;0;0" dur="14s" begin="gl-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.1714;0.2571;0.3429;1.0000" values="40 232;40 232;200 232;270 290;270 290" dur="14s" begin="gl-play.begin+0s" fill="freeze"/><circle r="5" fill="#0284c7"/></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.1964;0.2107;0.3821;0.3964;1.0000" values="0;0;1;1;0;0" dur="14s" begin="gl-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.1964;0.2821;0.3679;1.0000" values="40 232;40 232;200 232;270 290;270 290" dur="14s" begin="gl-play.begin+0s" fill="freeze"/><circle r="5" fill="#0284c7"/></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.2214;0.2357;0.4071;0.4214;1.0000" values="0;0;1;1;0;0" dur="14s" begin="gl-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.2214;0.3071;0.3929;1.0000" values="40 232;40 232;200 232;270 290;270 290" dur="14s" begin="gl-play.begin+0s" fill="freeze"/><circle r="5" fill="#0284c7"/></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.2464;0.2607;0.4321;0.4464;1.0000" values="0;0;1;1;0;0" dur="14s" begin="gl-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.2464;0.3321;0.4179;1.0000" values="40 232;40 232;200 232;270 290;270 290" dur="14s" begin="gl-play.begin+0s" fill="freeze"/><circle r="5" fill="#0284c7"/></g></g><text x="70" y="380" text-anchor="start" font-size="12" font-weight="800" fill="#0369a1">one-way: in at mouth → out at gills</text></g>
<g class="part" data-part="cc" data-name="Countercurrent" data-info="Blood in the gill lamellae flows the opposite way to the water, so there is always a concentration gradient for oxygen along the whole length." tabindex="0" role="button" aria-label="Countercurrent"><rect x="470" y="100" width="300" height="220" rx="14" fill="#f8fafc" stroke="#cbd5e1"/><text x="620" y="124" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">countercurrent in a lamella</text><rect x="500" y="150" width="240" height="40" fill="#bfdbfe"/><rect x="500" y="200" width="240" height="40" fill="#fecaca"/><text x="620" y="176" text-anchor="middle" font-size="13" font-weight="800" fill="#0369a1">water →</text><text x="620" y="226" text-anchor="middle" font-size="13" font-weight="800" fill="#b91c1c">← blood</text><g><animate attributeName="opacity" keyTimes="0.0000;0.3571;0.3786;1.0000" values="0;0;1;1" dur="14s" begin="gl-play.begin+0s" fill="freeze"/><text x="520" y="146" text-anchor="middle" font-size="10" font-weight="800" fill="#0369a1">100%</text><text x="520" y="258" text-anchor="middle" font-size="10" font-weight="800" fill="#b91c1c">90%</text><path d="M 520 186 L 520 206" stroke="#475569" stroke-width="2" marker-end="url(#gl-475569)"/></g><g><animate attributeName="opacity" keyTimes="0.0000;0.3857;0.4071;1.0000" values="0;0;1;1" dur="14s" begin="gl-play.begin+0s" fill="freeze"/><text x="570" y="146" text-anchor="middle" font-size="10" font-weight="800" fill="#0369a1">80%</text><text x="570" y="258" text-anchor="middle" font-size="10" font-weight="800" fill="#b91c1c">70%</text><path d="M 570 186 L 570 206" stroke="#475569" stroke-width="2" marker-end="url(#gl-475569)"/></g><g><animate attributeName="opacity" keyTimes="0.0000;0.4143;0.4357;1.0000" values="0;0;1;1" dur="14s" begin="gl-play.begin+0s" fill="freeze"/><text x="620" y="146" text-anchor="middle" font-size="10" font-weight="800" fill="#0369a1">60%</text><text x="620" y="258" text-anchor="middle" font-size="10" font-weight="800" fill="#b91c1c">50%</text><path d="M 620 186 L 620 206" stroke="#475569" stroke-width="2" marker-end="url(#gl-475569)"/></g><g><animate attributeName="opacity" keyTimes="0.0000;0.4429;0.4643;1.0000" values="0;0;1;1" dur="14s" begin="gl-play.begin+0s" fill="freeze"/><text x="670" y="146" text-anchor="middle" font-size="10" font-weight="800" fill="#0369a1">40%</text><text x="670" y="258" text-anchor="middle" font-size="10" font-weight="800" fill="#b91c1c">30%</text><path d="M 670 186 L 670 206" stroke="#475569" stroke-width="2" marker-end="url(#gl-475569)"/></g><g><animate attributeName="opacity" keyTimes="0.0000;0.4714;0.4929;1.0000" values="0;0;1;1" dur="14s" begin="gl-play.begin+0s" fill="freeze"/><text x="720" y="146" text-anchor="middle" font-size="10" font-weight="800" fill="#0369a1">20%</text><text x="720" y="258" text-anchor="middle" font-size="10" font-weight="800" fill="#b91c1c">10%</text><path d="M 720 186 L 720 206" stroke="#475569" stroke-width="2" marker-end="url(#gl-475569)"/></g><g><animate attributeName="opacity" keyTimes="0.0000;0.5000;0.5214;1.0000" values="0;0;1;1" dur="14s" begin="gl-play.begin+0s" fill="freeze"/><text x="620" y="290" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">water always richer in O₂ than the blood</text><text x="620" y="306" text-anchor="middle" font-size="10" font-weight="700" fill="#475569">(O₂ saturation, illustrative)</text></g></g>
<g class="part" data-part="lung" data-name="Lungs: tidal flow" data-info="Air moves in and out by the same route; some stale air always remains." tabindex="0" role="button" aria-label="Lungs: tidal flow"><rect x="800" y="100" width="270" height="420" rx="14" fill="#fef2f2" stroke="#fecaca"/><text x="935" y="124" text-anchor="middle" font-size="14" font-weight="800" fill="#b91c1c">lungs: tidal flow</text><path d="M 935 150 L 935 260 M 935 260 L 880 320 M 935 260 L 990 320" stroke="#475569" stroke-width="10" fill="none" stroke-linecap="round"/><ellipse cx="870" cy="380" rx="55" ry="90" fill="#fda4af" stroke="#be123c" stroke-width="2"/><ellipse cx="1000" cy="380" rx="55" ry="90" fill="#fda4af" stroke="#be123c" stroke-width="2"/><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.6786;0.6929;0.9214;0.9357;1.0000" values="0;0;1;1;0;0" dur="14s" begin="gl-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.6786;0.7500;0.8214;0.8929;1.0000" values="935 150;935 150;895 330;895 330;935 150;935 150" dur="14s" begin="gl-play.begin+0s" fill="freeze"/><circle r="5" fill="#0284c7"/></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.6929;0.7071;0.9357;0.9500;1.0000" values="0;0;1;1;0;0" dur="14s" begin="gl-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.6929;0.7643;0.8357;0.9071;1.0000" values="935 150;935 150;915 330;915 330;935 150;935 150" dur="14s" begin="gl-play.begin+0s" fill="freeze"/><circle r="5" fill="#0284c7"/></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.7071;0.7214;0.9500;0.9643;1.0000" values="0;0;1;1;0;0" dur="14s" begin="gl-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.7071;0.7786;0.8500;0.9214;1.0000" values="935 150;935 150;935 330;935 330;935 150;935 150" dur="14s" begin="gl-play.begin+0s" fill="freeze"/><circle r="5" fill="#0284c7"/></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.7214;0.7357;0.9643;0.9786;1.0000" values="0;0;1;1;0;0" dur="14s" begin="gl-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.7214;0.7929;0.8643;0.9357;1.0000" values="935 150;935 150;955 330;955 330;935 150;935 150" dur="14s" begin="gl-play.begin+0s" fill="freeze"/><circle r="5" fill="#0284c7"/></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.7357;0.7500;0.9786;0.9929;1.0000" values="0;0;1;1;0;0" dur="14s" begin="gl-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.7357;0.8071;0.8786;0.9500;1.0000" values="935 150;935 150;975 330;975 330;935 150;935 150" dur="14s" begin="gl-play.begin+0s" fill="freeze"/><circle r="5" fill="#0284c7"/></g></g><g><animate attributeName="opacity" keyTimes="0.0000;0.7143;0.7357;1.0000" values="0;0;1;1" dur="14s" begin="gl-play.begin+0s" fill="freeze"/><text x="935" y="500" text-anchor="middle" font-size="12" font-weight="800" fill="#b91c1c">in and out the same way</text></g></g>
</svg>