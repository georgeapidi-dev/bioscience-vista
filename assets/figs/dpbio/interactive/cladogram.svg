<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 680" class="vd-svg" role="img" aria-labelledby="cl-title cl-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="cl-play" data-vd-play-label="Play: clade by clade" data-vd-steps="[[0, &quot;A cladogram of seven vertebrates. Each branching point (node) is a common ancestor.&quot;], [1, &quot;Vertebral column: shared by all seven, from their common ancestor at the root.&quot;], [3.5, &quot;Jaws: all except the lamprey. Shark, frog, lizard, bird, mouse and human form the jawed vertebrates clade.&quot;], [6, &quot;Four limbs: the tetrapods (frog, lizard, bird, mouse, human).&quot;], [8.5, &quot;Amniotic egg: the amniotes (lizard, bird, mouse, human). Lizards and birds share a more recent common ancestor with each other than with mammals.&quot;], [11, &quot;Hair and mammary glands: the mammals (mouse, human).&quot;], [13.5, &quot;The most recent common ancestor of humans and birds is the amniote node: humans are more closely related to birds than to frogs.&quot;]]" data-vd-dur="16">
<title id="cl-title">A cladogram of vertebrates</title><desc id="cl-desc">A cladogram of lamprey, shark, frog, lizard, bird, mouse and human with shared derived characters: vertebrae, jaws, four limbs, amniotic egg, hair; nodes are common ancestors.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="680" fill="#ffffff"/>
<g aria-hidden="true"><animate id="cl-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<text class="head" x="30" y="34">A cladogram of vertebrates</text><text class="note" x="30" y="56">Branch lengths are not to scale. Marks on branches: shared derived characters.</text>
<g class="part" data-part="clade" data-name="Clade" data-info="A common ancestor and all of its descendants. Clades are nested inside each other." tabindex="0" role="button" aria-label="Clade"><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.0625;0.0813;0.2125;0.2312;1.0000" values="0;0;1;1;0;0" dur="16s" begin="cl-play.begin+0s" fill="freeze"/><rect x="85" y="90" width="950" height="484" rx="16" fill="#fef3c7" opacity=".7" stroke="#94a3b8"/><text x="93" y="568" font-size="13" font-weight="700" fill="#334155">vertebrates</text></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.2188;0.2375;0.3688;0.3875;1.0000" values="0;0;1;1;0;0" dur="16s" begin="cl-play.begin+0s" fill="freeze"/><rect x="225" y="84" width="810" height="420" rx="16" fill="#dcfce7" opacity=".7" stroke="#94a3b8"/><text x="233" y="498" font-size="13" font-weight="700" fill="#334155">jawed vertebrates</text></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.3750;0.3937;0.5250;0.5438;1.0000" values="0;0;1;1;0;0" dur="16s" begin="cl-play.begin+0s" fill="freeze"/><rect x="365" y="78" width="670" height="356" rx="16" fill="#dbeafe" opacity=".7" stroke="#94a3b8"/><text x="373" y="428" font-size="13" font-weight="700" fill="#334155">tetrapods</text></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.5312;0.5500;0.6813;0.7000;1.0000" values="0;0;1;1;0;0" dur="16s" begin="cl-play.begin+0s" fill="freeze"/><rect x="505" y="72" width="530" height="292" rx="16" fill="#ede9fe" opacity=".7" stroke="#94a3b8"/><text x="513" y="358" font-size="13" font-weight="700" fill="#334155">amniotes</text></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.6875;0.7063;0.8313;0.8500;1.0000" values="0;0;1;1;0;0" dur="16s" begin="cl-play.begin+0s" fill="freeze"/><rect x="785" y="66" width="250" height="218" rx="16" fill="#fce7f3" opacity=".7" stroke="#94a3b8"/><text x="793" y="278" font-size="13" font-weight="700" fill="#334155">mammals</text></g></g>
<line x1="560" y1="270" x2="700" y2="270" stroke="#1f2937" stroke-width="5" stroke-linecap="round"/><line x1="560" y1="140" x2="560" y2="270" stroke="#1f2937" stroke-width="5" stroke-linecap="round"/><line x1="700" y1="140" x2="700" y2="270" stroke="#1f2937" stroke-width="5" stroke-linecap="round"/><line x1="840" y1="270" x2="980" y2="270" stroke="#1f2937" stroke-width="5" stroke-linecap="round"/><line x1="840" y1="140" x2="840" y2="270" stroke="#1f2937" stroke-width="5" stroke-linecap="round"/><line x1="980" y1="140" x2="980" y2="270" stroke="#1f2937" stroke-width="5" stroke-linecap="round"/><line x1="630" y1="350" x2="910" y2="350" stroke="#1f2937" stroke-width="5" stroke-linecap="round"/><line x1="630" y1="270" x2="630" y2="350" stroke="#1f2937" stroke-width="5" stroke-linecap="round"/><line x1="910" y1="270" x2="910" y2="350" stroke="#1f2937" stroke-width="5" stroke-linecap="round"/><line x1="420" y1="420" x2="770" y2="420" stroke="#1f2937" stroke-width="5" stroke-linecap="round"/><line x1="420" y1="140" x2="420" y2="420" stroke="#1f2937" stroke-width="5" stroke-linecap="round"/><line x1="770" y1="350" x2="770" y2="420" stroke="#1f2937" stroke-width="5" stroke-linecap="round"/><line x1="280" y1="490" x2="595" y2="490" stroke="#1f2937" stroke-width="5" stroke-linecap="round"/><line x1="280" y1="140" x2="280" y2="490" stroke="#1f2937" stroke-width="5" stroke-linecap="round"/><line x1="595" y1="420" x2="595" y2="490" stroke="#1f2937" stroke-width="5" stroke-linecap="round"/><line x1="140" y1="560" x2="437" y2="560" stroke="#1f2937" stroke-width="5" stroke-linecap="round"/><line x1="140" y1="140" x2="140" y2="560" stroke="#1f2937" stroke-width="5" stroke-linecap="round"/><line x1="437" y1="490" x2="437" y2="560" stroke="#1f2937" stroke-width="5" stroke-linecap="round"/><line x1="288" y1="560" x2="288" y2="620" stroke="#1f2937" stroke-width="5" stroke-linecap="round"/>
<g class="part" data-part="root" data-name="Root" data-info="The common ancestor of all the organisms in the cladogram." tabindex="0" role="button" aria-label="Root"><circle cx="288" cy="620" r="6" fill="#1f2937"/></g>
<g class="part" data-part="node" data-name="Node: common ancestor" data-info="Each branching point represents the most recent common ancestor of everything above it." tabindex="0" role="button" aria-label="Node: common ancestor"><circle cx="630" cy="270" r="9" fill="#fff" stroke="#1f2937" stroke-width="3"/><circle cx="910" cy="270" r="9" fill="#fff" stroke="#1f2937" stroke-width="3"/><circle cx="770" cy="350" r="9" fill="#fff" stroke="#1f2937" stroke-width="3"/><circle cx="595" cy="420" r="9" fill="#fff" stroke="#1f2937" stroke-width="3"/><circle cx="437" cy="490" r="9" fill="#fff" stroke="#1f2937" stroke-width="3"/><circle cx="288" cy="560" r="9" fill="#fff" stroke="#1f2937" stroke-width="3"/></g>
<g class="part" data-part="lam" data-name="Lamprey" data-info="Jawless fish: has a backbone but no jaws. The outgroup: the earliest branch here." tabindex="0" role="button" aria-label="Lamprey"><text x="140" y="112" text-anchor="middle" font-size="30">🐟</text><text x="140" y="134" text-anchor="middle" font-size="14" font-weight="700">Lamprey</text></g>
<g class="part" data-part="sha" data-name="Shark" data-info="Cartilaginous fish with jaws." tabindex="0" role="button" aria-label="Shark"><text x="280" y="112" text-anchor="middle" font-size="30">🦈</text><text x="280" y="134" text-anchor="middle" font-size="14" font-weight="700">Shark</text></g>
<g class="part" data-part="fro" data-name="Frog" data-info="Amphibian: four limbs, but lays eggs in water (no amniotic egg)." tabindex="0" role="button" aria-label="Frog"><text x="420" y="112" text-anchor="middle" font-size="30">🐸</text><text x="420" y="134" text-anchor="middle" font-size="14" font-weight="700">Frog</text></g>
<g class="part" data-part="liz" data-name="Lizard" data-info="Reptile: amniotic egg." tabindex="0" role="button" aria-label="Lizard"><text x="560" y="112" text-anchor="middle" font-size="30">🦎</text><text x="560" y="134" text-anchor="middle" font-size="14" font-weight="700">Lizard</text></g>
<g class="part" data-part="bir" data-name="Bird" data-info="Shares a more recent common ancestor with lizards than with mammals: birds are reptiles in a clade sense. Feathers." tabindex="0" role="button" aria-label="Bird"><text x="700" y="112" text-anchor="middle" font-size="30">🐦</text><text x="700" y="134" text-anchor="middle" font-size="14" font-weight="700">Bird</text></g>
<g class="part" data-part="mou" data-name="Mouse" data-info="Mammal: hair and mammary glands." tabindex="0" role="button" aria-label="Mouse"><text x="840" y="112" text-anchor="middle" font-size="30">🐁</text><text x="840" y="134" text-anchor="middle" font-size="14" font-weight="700">Mouse</text></g>
<g class="part" data-part="hum" data-name="Human" data-info="Mammal: hair and mammary glands." tabindex="0" role="button" aria-label="Human"><text x="980" y="112" text-anchor="middle" font-size="30">🧍</text><text x="980" y="134" text-anchor="middle" font-size="14" font-weight="700">Human</text></g>
<g class="part" data-part="char" data-name="Shared derived characters" data-info="Features that first appeared in the common ancestor of a clade and are shared by all its members." tabindex="0" role="button" aria-label="Shared derived characters"><line x1="276" y1="595" x2="300" y2="595" stroke="#dc2626" stroke-width="5"/><text x="306" y="600" font-size="13" font-weight="700" fill="#b91c1c" paint-order="stroke" stroke="#fff" stroke-width="4">vertebral column</text><line x1="425" y1="525" x2="449" y2="525" stroke="#dc2626" stroke-width="5"/><text x="455" y="530" font-size="13" font-weight="700" fill="#b91c1c" paint-order="stroke" stroke="#fff" stroke-width="4">jaws</text><line x1="583" y1="455" x2="607" y2="455" stroke="#dc2626" stroke-width="5"/><text x="613" y="460" font-size="13" font-weight="700" fill="#b91c1c" paint-order="stroke" stroke="#fff" stroke-width="4">four limbs</text><line x1="758" y1="385" x2="782" y2="385" stroke="#dc2626" stroke-width="5"/><text x="788" y="390" font-size="13" font-weight="700" fill="#b91c1c" paint-order="stroke" stroke="#fff" stroke-width="4">amniotic egg</text><line x1="898" y1="305" x2="922" y2="305" stroke="#dc2626" stroke-width="5"/><text x="928" y="310" font-size="13" font-weight="700" fill="#b91c1c" paint-order="stroke" stroke="#fff" stroke-width="4">hair, mammary glands</text><line x1="688" y1="210" x2="712" y2="210" stroke="#dc2626" stroke-width="5"/><text x="718" y="215" font-size="13" font-weight="700" fill="#b91c1c" paint-order="stroke" stroke="#fff" stroke-width="4">feathers</text></g>
<g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.8438;0.8625;1.0000" values="0;0;1;1" dur="16s" begin="cl-play.begin+0s" fill="freeze"/><circle cx="770" cy="350" r="22" fill="none" stroke="#7c3aed" stroke-width="4"/><text x="740" y="384" text-anchor="end" font-size="13" font-weight="700" fill="#6d28d9" paint-order="stroke" stroke="#fff" stroke-width="4">most recent common ancestor of humans and birds</text><path d="M 980 144 L 980 270 L 910 270 L 910 350 L 770 350" fill="none" stroke="#7c3aed" stroke-width="6" opacity=".7"/><path d="M 700 144 L 700 270 L 630 270 L 630 350 L 770 350" fill="none" stroke="#7c3aed" stroke-width="6" opacity=".7"/></g>
</svg>