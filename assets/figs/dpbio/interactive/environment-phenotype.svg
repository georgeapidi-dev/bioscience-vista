<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" class="vd-svg" role="img" aria-labelledby="ep2-title ep2-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="ep2-play" data-vd-play-label="Play: change the environment" data-vd-steps="[[0, &quot;Same genes, different phenotypes.&quot;], [1, &quot;Identical twins share a genotype; differences come from the environment.&quot;], [4.5, &quot;Hydrangea: soil pH changes flower colour.&quot;], [8, &quot;Himalayan rabbit: cold extremities turn dark.&quot;], [11.5, &quot;Phenotypic plasticity: e.g. more red blood cells at high altitude.&quot;]]" data-vd-dur="15">
<title id="ep2-title">Environment and phenotype</title><desc id="ep2-desc">Identical twins with the same genotype, hydrangeas that are blue in acidic soil and pink in alkaline soil, a Himalayan rabbit with dark ears, nose and feet, and athletes making more red blood cells at altitude.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="560" fill="#ffffff"/>
<g aria-hidden="true"><animate id="ep2-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<text class="head" x="30" y="34">Same genotype, different phenotype</text><text class="note" x="30" y="56">Phenotype = genotype + environment.</text>
<g class="part" data-part="twins" data-name="Identical twins" data-info="Monozygotic twins come from one zygote and have the same genotype; differences between them are caused by the environment." tabindex="0" role="button" aria-label="Identical twins"><rect x="30" y="80" width="250" height="440" rx="16" fill="#fff7ed" stroke="#fdba74"/><text x="155" y="106" text-anchor="middle" font-size="14" font-weight="800" fill="#c2410c">identical twins</text><g transform="translate(110 300) scale(1.4)"><circle cy="-60" r="14" fill="#fbbf24" stroke="#7c2d12"/><path d="M -16 -44 L 16 -44 L 18 0 L 8 0 L 6 40 L -6 40 L -8 0 L -18 0 Z" fill="#fbbf24" stroke="#7c2d12"/></g><g><animate attributeName="opacity" keyTimes="0.0000;0.1333;0.2000;1.0000" values="1;1;1;1" dur="15s" begin="ep2-play.begin+0s" fill="freeze"/><g transform="translate(200 300) scale(1.4)"><circle cy="-60" r="14" fill="#fbbf24" stroke="#7c2d12"/><path d="M -16 -44 L 16 -44 L 18 0 L 8 0 L 6 40 L -6 40 L -8 0 L -18 0 Z" fill="#fbbf24" stroke="#7c2d12"/></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.1333;0.2000;1.0000" values="0;0;1;1" dur="15s" begin="ep2-play.begin+0s" fill="freeze"/><g transform="translate(200 300) scale(1.55)"><circle cy="-60" r="14" fill="#d97706" stroke="#7c2d12"/><path d="M -16 -44 L 16 -44 L 18 0 L 8 0 L 6 40 L -6 40 L -8 0 L -18 0 Z" fill="#d97706" stroke="#7c2d12"/></g></g><text x="155" y="400" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">same genotype</text><g><animate attributeName="opacity" keyTimes="0.0000;0.1667;0.1867;1.0000" values="0;0;1;1" dur="15s" begin="ep2-play.begin+0s" fill="freeze"/><text x="155" y="420" text-anchor="middle" font-size="12" font-weight="800" fill="#c2410c">diet, sun, exercise differ</text></g></g>
<g class="part" data-part="hyd" data-name="Hydrangea" data-info="Blue flowers in acidic soil, pink in alkaline soil, with the same genotype." tabindex="0" role="button" aria-label="Hydrangea"><rect x="300" y="80" width="250" height="440" rx="16" fill="#f8fafc" stroke="#cbd5e1"/><text x="425" y="106" text-anchor="middle" font-size="14" font-weight="800" fill="#111827">hydrangea</text><path d="M 370 400 L 370 260" stroke="#15803d" stroke-width="5"/><circle cx="356" cy="230" r="12" fill="#e5e7eb" stroke="#64748b"><animate attributeName="fill" keyTimes="0.0000;0.3000;0.4000;1.0000" values="#e5e7eb;#e5e7eb;#60a5fa;#60a5fa" dur="15s" begin="ep2-play.begin+0s" fill="freeze"/></circle><circle cx="384" cy="230" r="12" fill="#e5e7eb" stroke="#64748b"><animate attributeName="fill" keyTimes="0.0000;0.3000;0.4000;1.0000" values="#e5e7eb;#e5e7eb;#60a5fa;#60a5fa" dur="15s" begin="ep2-play.begin+0s" fill="freeze"/></circle><circle cx="370" cy="212" r="12" fill="#e5e7eb" stroke="#64748b"><animate attributeName="fill" keyTimes="0.0000;0.3000;0.4000;1.0000" values="#e5e7eb;#e5e7eb;#60a5fa;#60a5fa" dur="15s" begin="ep2-play.begin+0s" fill="freeze"/></circle><circle cx="370" cy="248" r="12" fill="#e5e7eb" stroke="#64748b"><animate attributeName="fill" keyTimes="0.0000;0.3000;0.4000;1.0000" values="#e5e7eb;#e5e7eb;#60a5fa;#60a5fa" dur="15s" begin="ep2-play.begin+0s" fill="freeze"/></circle><circle cx="352" cy="214" r="12" fill="#e5e7eb" stroke="#64748b"><animate attributeName="fill" keyTimes="0.0000;0.3000;0.4000;1.0000" values="#e5e7eb;#e5e7eb;#60a5fa;#60a5fa" dur="15s" begin="ep2-play.begin+0s" fill="freeze"/></circle><circle cx="388" cy="246" r="12" fill="#e5e7eb" stroke="#64748b"><animate attributeName="fill" keyTimes="0.0000;0.3000;0.4000;1.0000" values="#e5e7eb;#e5e7eb;#60a5fa;#60a5fa" dur="15s" begin="ep2-play.begin+0s" fill="freeze"/></circle><rect x="330" y="400" width="80" height="40" fill="#a16207"/><text x="370" y="466" text-anchor="middle" font-size="11" font-weight="800" fill="#111827">acidic soil</text><path d="M 480 400 L 480 260" stroke="#15803d" stroke-width="5"/><circle cx="466" cy="230" r="12" fill="#e5e7eb" stroke="#64748b"><animate attributeName="fill" keyTimes="0.0000;0.3000;0.4000;1.0000" values="#e5e7eb;#e5e7eb;#f472b6;#f472b6" dur="15s" begin="ep2-play.begin+0s" fill="freeze"/></circle><circle cx="494" cy="230" r="12" fill="#e5e7eb" stroke="#64748b"><animate attributeName="fill" keyTimes="0.0000;0.3000;0.4000;1.0000" values="#e5e7eb;#e5e7eb;#f472b6;#f472b6" dur="15s" begin="ep2-play.begin+0s" fill="freeze"/></circle><circle cx="480" cy="212" r="12" fill="#e5e7eb" stroke="#64748b"><animate attributeName="fill" keyTimes="0.0000;0.3000;0.4000;1.0000" values="#e5e7eb;#e5e7eb;#f472b6;#f472b6" dur="15s" begin="ep2-play.begin+0s" fill="freeze"/></circle><circle cx="480" cy="248" r="12" fill="#e5e7eb" stroke="#64748b"><animate attributeName="fill" keyTimes="0.0000;0.3000;0.4000;1.0000" values="#e5e7eb;#e5e7eb;#f472b6;#f472b6" dur="15s" begin="ep2-play.begin+0s" fill="freeze"/></circle><circle cx="462" cy="214" r="12" fill="#e5e7eb" stroke="#64748b"><animate attributeName="fill" keyTimes="0.0000;0.3000;0.4000;1.0000" values="#e5e7eb;#e5e7eb;#f472b6;#f472b6" dur="15s" begin="ep2-play.begin+0s" fill="freeze"/></circle><circle cx="498" cy="246" r="12" fill="#e5e7eb" stroke="#64748b"><animate attributeName="fill" keyTimes="0.0000;0.3000;0.4000;1.0000" values="#e5e7eb;#e5e7eb;#f472b6;#f472b6" dur="15s" begin="ep2-play.begin+0s" fill="freeze"/></circle><rect x="440" y="400" width="80" height="40" fill="#d6d3d1"/><text x="480" y="466" text-anchor="middle" font-size="11" font-weight="800" fill="#111827">alkaline soil</text></g>
<g class="part" data-part="rab" data-name="Himalayan rabbit" data-info="Dark fur only on the cold ears, nose and feet: the enzyme for dark pigment works only at low temperature." tabindex="0" role="button" aria-label="Himalayan rabbit"><rect x="570" y="80" width="250" height="440" rx="16" fill="#f0f9ff" stroke="#bae6fd"/><text x="695" y="106" text-anchor="middle" font-size="14" font-weight="800" fill="#0369a1">Himalayan rabbit</text><ellipse cx="695" cy="320" rx="80" ry="50" fill="#fff" stroke="#94a3b8" stroke-width="2"/><circle cx="770" cy="270" r="30" fill="#fff" stroke="#94a3b8" stroke-width="2"/><ellipse cx="760" cy="215" rx="9" ry="32" fill="#fff" stroke="#94a3b8"><animate attributeName="fill" keyTimes="0.0000;0.5333;0.6333;1.0000" values="#fff;#fff;#334155;#334155" dur="15s" begin="ep2-play.begin+0s" fill="freeze"/></ellipse><ellipse cx="782" cy="215" rx="9" ry="32" fill="#fff" stroke="#94a3b8"><animate attributeName="fill" keyTimes="0.0000;0.5333;0.6333;1.0000" values="#fff;#fff;#334155;#334155" dur="15s" begin="ep2-play.begin+0s" fill="freeze"/></ellipse><circle cx="798" cy="276" r="8" fill="#fff"><animate attributeName="fill" keyTimes="0.0000;0.5333;0.6333;1.0000" values="#fff;#fff;#334155;#334155" dur="15s" begin="ep2-play.begin+0s" fill="freeze"/></circle><ellipse cx="640" cy="372" rx="16" ry="8" fill="#fff" stroke="#94a3b8"><animate attributeName="fill" keyTimes="0.0000;0.5333;0.6333;1.0000" values="#fff;#fff;#334155;#334155" dur="15s" begin="ep2-play.begin+0s" fill="freeze"/></ellipse><ellipse cx="740" cy="372" rx="16" ry="8" fill="#fff" stroke="#94a3b8"><animate attributeName="fill" keyTimes="0.0000;0.5333;0.6333;1.0000" values="#fff;#fff;#334155;#334155" dur="15s" begin="ep2-play.begin+0s" fill="freeze"/></ellipse><g><animate attributeName="opacity" keyTimes="0.0000;0.6000;0.6200;1.0000" values="0;0;1;1" dur="15s" begin="ep2-play.begin+0s" fill="freeze"/><text x="695" y="430" text-anchor="middle" font-size="12" font-weight="800" fill="#0369a1">pigment enzyme works only</text><text x="695" y="448" text-anchor="middle" font-size="12" font-weight="800" fill="#0369a1">where the body is cold</text></g></g>
<g class="part" data-part="plas" data-name="Phenotypic plasticity" data-info="Developing traits suited to the environment by changing gene expression, not genotype; often reversible: tanning, muscle growth with training, more red blood cells at altitude (athletes in Iten)." tabindex="0" role="button" aria-label="Phenotypic plasticity"><rect x="840" y="80" width="230" height="440" rx="16" fill="#fef2f2" stroke="#fecaca"/><text x="955" y="106" text-anchor="middle" font-size="14" font-weight="800" fill="#b91c1c">plasticity</text><path d="M 860 400 L 930 250 L 980 320 L 1050 180 L 1050 400 Z" fill="#a8a29e"/><text x="980" y="196" text-anchor="middle" font-size="11" font-weight="800" fill="#111827">Iten (high altitude)</text><g><animate attributeName="opacity" keyTimes="0.0000;0.7667;0.7867;1.0000" values="0;0;1;1" dur="15s" begin="ep2-play.begin+0s" fill="freeze"/><ellipse cx="880" cy="440" rx="14" ry="8" fill="#ef4444" stroke="#7f1d1d"/></g><g><animate attributeName="opacity" keyTimes="0.0000;0.7733;0.7933;1.0000" values="0;0;1;1" dur="15s" begin="ep2-play.begin+0s" fill="freeze"/><ellipse cx="916" cy="440" rx="14" ry="8" fill="#ef4444" stroke="#7f1d1d"/></g><g><animate attributeName="opacity" keyTimes="0.0000;0.7800;0.8000;1.0000" values="0;0;1;1" dur="15s" begin="ep2-play.begin+0s" fill="freeze"/><ellipse cx="952" cy="440" rx="14" ry="8" fill="#ef4444" stroke="#7f1d1d"/></g><g><animate attributeName="opacity" keyTimes="0.0000;0.7867;0.8067;1.0000" values="0;0;1;1" dur="15s" begin="ep2-play.begin+0s" fill="freeze"/><ellipse cx="988" cy="440" rx="14" ry="8" fill="#ef4444" stroke="#7f1d1d"/></g><g><animate attributeName="opacity" keyTimes="0.0000;0.7933;0.8133;1.0000" values="0;0;1;1" dur="15s" begin="ep2-play.begin+0s" fill="freeze"/><ellipse cx="1024" cy="440" rx="14" ry="8" fill="#ef4444" stroke="#7f1d1d"/></g><g><animate attributeName="opacity" keyTimes="0.0000;0.8000;0.8200;1.0000" values="0;0;1;1" dur="15s" begin="ep2-play.begin+0s" fill="freeze"/><ellipse cx="880" cy="466" rx="14" ry="8" fill="#ef4444" stroke="#7f1d1d"/></g><g><animate attributeName="opacity" keyTimes="0.0000;0.8067;0.8267;1.0000" values="0;0;1;1" dur="15s" begin="ep2-play.begin+0s" fill="freeze"/><ellipse cx="916" cy="466" rx="14" ry="8" fill="#ef4444" stroke="#7f1d1d"/></g><g><animate attributeName="opacity" keyTimes="0.0000;0.8133;0.8333;1.0000" values="0;0;1;1" dur="15s" begin="ep2-play.begin+0s" fill="freeze"/><ellipse cx="952" cy="466" rx="14" ry="8" fill="#ef4444" stroke="#7f1d1d"/></g><g><animate attributeName="opacity" keyTimes="0.0000;0.8200;0.8400;1.0000" values="0;0;1;1" dur="15s" begin="ep2-play.begin+0s" fill="freeze"/><ellipse cx="988" cy="466" rx="14" ry="8" fill="#ef4444" stroke="#7f1d1d"/></g><g><animate attributeName="opacity" keyTimes="0.0000;0.8267;0.8467;1.0000" values="0;0;1;1" dur="15s" begin="ep2-play.begin+0s" fill="freeze"/><ellipse cx="1024" cy="466" rx="14" ry="8" fill="#ef4444" stroke="#7f1d1d"/></g><g><animate attributeName="opacity" keyTimes="0.0000;0.8000;0.8200;1.0000" values="0;0;1;1" dur="15s" begin="ep2-play.begin+0s" fill="freeze"/><text x="955" y="505" text-anchor="middle" font-size="12" font-weight="800" fill="#b91c1c">more red blood cells</text></g></g>
</svg>