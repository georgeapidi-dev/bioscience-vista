<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" class="vd-svg" role="img" aria-labelledby="sp2-title sp2-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="sp2-play" data-vd-play-label="Play: splicing" data-vd-steps="[[0, &quot;In eukaryotes, transcription makes pre-mRNA containing exons and introns.&quot;], [1.5, &quot;Spliceosomes bind to the ends of each intron.&quot;], [3.5, &quot;Introns are cut out as loops (lariats) and broken down; the exons are joined.&quot;], [7, &quot;A 5\u2032 cap and a poly-A tail are added: mature mRNA.&quot;], [9.5, &quot;The mature mRNA leaves the nucleus through a nuclear pore to be translated.&quot;], [11.5, &quot;Alternative splicing: the same pre-mRNA can be spliced differently, so one gene can make several proteins.&quot;]]" data-vd-dur="16">
<title id="sp2-title">Pre-mRNA splicing</title><desc id="sp2-desc">Pre-mRNA with four exons and three introns: spliceosomes remove the introns as lariats, exons are joined, a 5-prime cap and poly-A tail are added, the mRNA leaves the nucleus; alternative splicing gives a different mRNA.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1200" height="640" fill="#ffffff"/>
<g aria-hidden="true"><animate id="sp2-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<text class="head" x="30" y="34">Splicing: from pre-mRNA to mature mRNA</text><text class="note" x="30" y="56">Inside the nucleus. Lengths not to scale.</text><rect x="20" y="70" width="960" height="400" rx="20" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="8 5"/><text x="36" y="96" font-size="13" font-weight="800" fill="#6d28d9">NUCLEUS</text><rect x="960" y="250" width="40" height="60" fill="#fff"/><rect x="956" y="238" width="48" height="12" rx="4" fill="#8b5cf6"/><rect x="956" y="310" width="48" height="12" rx="4" fill="#8b5cf6"/><text x="1040" y="236" font-size="12" fill="#6d28d9">nuclear pore</text><text x="1010" y="350" font-size="12" font-weight="700" fill="#334155">CYTOPLASM</text>
<text x="110" y="140" font-size="13" font-weight="700">pre-mRNA</text><text x="96" y="176" text-anchor="end" font-size="13">5′</text><text x="874" y="176" font-size="13">3′</text>
<g class="part" data-part="ex" data-name="Exons" data-info="The parts of the pre-mRNA that are kept and translated (expressed)." tabindex="0" role="button" aria-label="Exons"><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.2812;0.4062;1.0000" values="0 0;0 0;80 170;80 170" dur="16s" begin="sp2-play.begin+0s" fill="freeze"/><rect x="110" y="152" width="110" height="36" rx="6" fill="#3b82f6" stroke="#1f2937" stroke-width="2"/><text x="165.0" y="176" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">exon 1</text></g></g>
<g class="part" data-part="ex" data-name="Exons" data-info="The parts of the pre-mRNA that are kept and translated (expressed)." tabindex="0" role="button" aria-label="Exons"><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.2812;0.4062;1.0000" values="0 0;0 0;-30 170;-30 170" dur="16s" begin="sp2-play.begin+0s" fill="freeze"/><rect x="330" y="152" width="110" height="36" rx="6" fill="#22c55e" stroke="#1f2937" stroke-width="2"/><text x="385.0" y="176" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">exon 2</text></g></g>
<g class="part" data-part="ex" data-name="Exons" data-info="The parts of the pre-mRNA that are kept and translated (expressed)." tabindex="0" role="button" aria-label="Exons"><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.2812;0.4062;1.0000" values="0 0;0 0;-130 170;-130 170" dur="16s" begin="sp2-play.begin+0s" fill="freeze"/><rect x="540" y="152" width="110" height="36" rx="6" fill="#f59e0b" stroke="#1f2937" stroke-width="2"/><text x="595.0" y="176" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">exon 3</text></g></g>
<g class="part" data-part="ex" data-name="Exons" data-info="The parts of the pre-mRNA that are kept and translated (expressed)." tabindex="0" role="button" aria-label="Exons"><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.2812;0.4062;1.0000" values="0 0;0 0;-230 170;-230 170" dur="16s" begin="sp2-play.begin+0s" fill="freeze"/><rect x="750" y="152" width="110" height="36" rx="6" fill="#ec4899" stroke="#1f2937" stroke-width="2"/><text x="805.0" y="176" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">exon 4</text></g></g>
<g class="part" data-part="in" data-name="Introns" data-info="Non-coding sequences between exons; cut out by spliceosomes and broken down." tabindex="0" role="button" aria-label="Introns"><g><animate attributeName="opacity" keyTimes="0.0000;0.2750;0.3250;1.0000" values="1;1;0;0" dur="16s" begin="sp2-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.2750;0.3250;1.0000" values="0 0;0 0;0 -40;0 -40" dur="16s" begin="sp2-play.begin+0s" fill="freeze"/><path d="M 220 170 C 250 170 300 170 330 170" fill="none" stroke="#94a3b8" stroke-width="10" stroke-dasharray="3 3"><animate attributeName="d" keyTimes="0.0000;0.1562;0.2375;1.0000" values="M 220 170 C 250 170 300 170 330 170;M 220 170 C 250 170 300 170 330 170;M 220 170 C 210 60 340 60 330 170;M 220 170 C 210 60 340 60 330 170" dur="16s" begin="sp2-play.begin+0s" fill="freeze"/></path><text x="275.0" y="208" text-anchor="middle" font-size="12" fill="#64748b">intron</text></g></g></g>
<g class="part" data-part="spl" data-name="Spliceosome" data-info="A complex of proteins and small RNAs that recognises the ends of each intron, cuts it out as a loop (lariat) and joins the exons." tabindex="0" role="button" aria-label="Spliceosome"><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.0938;0.1125;0.2750;0.2938;1.0000" values="0;0;1;1;0;0" dur="16s" begin="sp2-play.begin+0s" fill="freeze"/><ellipse cx="226" cy="170" rx="22" ry="26" fill="#a78bfa" opacity=".85"/><ellipse cx="324" cy="170" rx="22" ry="26" fill="#a78bfa" opacity=".85"/></g></g>
