<g class="part" data-part="spl" data-name="Spliceosome" data-info="A complex of proteins and small RNAs that recognises the ends of each intron, cuts it out as a loop (lariat) and joins the exons." tabindex="0" role="button" aria-label="Spliceosome"><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.0938;0.1125;0.2750;0.2938;1.0000" values="0;0;1;1;0;0" dur="16s" begin="sp2-play.begin+0s" fill="freeze"/><ellipse cx="446" cy="170" rx="22" ry="26" fill="#a78bfa" opacity=".85"/><ellipse cx="534" cy="170" rx="22" ry="26" fill="#a78bfa" opacity=".85"/></g></g>
<g class="part" data-part="in" data-name="Introns" data-info="Non-coding sequences between exons; cut out by spliceosomes and broken down." tabindex="0" role="button" aria-label="Introns"><g><animate attributeName="opacity" keyTimes="0.0000;0.2750;0.3250;1.0000" values="1;1;0;0" dur="16s" begin="sp2-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.2750;0.3250;1.0000" values="0 0;0 0;0 -40;0 -40" dur="16s" begin="sp2-play.begin+0s" fill="freeze"/><path d="M 650 170 C 680 170 720 170 750 170" fill="none" stroke="#94a3b8" stroke-width="10" stroke-dasharray="3 3"><animate attributeName="d" keyTimes="0.0000;0.1562;0.2375;1.0000" values="M 650 170 C 680 170 720 170 750 170;M 650 170 C 680 170 720 170 750 170;M 650 170 C 640 60 760 60 750 170;M 650 170 C 640 60 760 60 750 170" dur="16s" begin="sp2-play.begin+0s" fill="freeze"/></path><text x="700.0" y="208" text-anchor="middle" font-size="12" fill="#64748b">intron</text></g></g></g>
<g class="part" data-part="spl" data-name="Spliceosome" data-info="A complex of proteins and small RNAs that recognises the ends of each intron, cuts it out as a loop (lariat) and joins the exons." tabindex="0" role="button" aria-label="Spliceosome"><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.0938;0.1125;0.2750;0.2938;1.0000" values="0;0;1;1;0;0" dur="16s" begin="sp2-play.begin+0s" fill="freeze"/><ellipse cx="656" cy="170" rx="22" ry="26" fill="#a78bfa" opacity=".85"/><ellipse cx="744" cy="170" rx="22" ry="26" fill="#a78bfa" opacity=".85"/></g></g>
<g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.2250;0.2437;0.3750;0.3937;1.0000" values="0;0;1;1;0;0" dur="16s" begin="sp2-play.begin+0s" fill="freeze"/><text x="560" y="60" text-anchor="middle" font-size="13" font-weight="700" fill="#64748b"> </text><text x="500" y="110" text-anchor="middle" font-size="13" font-weight="700" fill="#7c3aed">introns removed as lariats and broken down</text></g>
<g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.4062;0.4250;1.0000" values="0;0;1;1" dur="16s" begin="sp2-play.begin+0s" fill="freeze"/><text x="190" y="306" font-size="13" font-weight="700">mature mRNA</text></g>
<g class="part" data-part="cap" data-name="5′ cap" data-info="A modified guanine added to the 5′ end: protects the mRNA and helps the ribosome attach." tabindex="0" role="button" aria-label="5′ cap"><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.4375;0.4562;1.0000" values="0;0;1;1" dur="16s" begin="sp2-play.begin+0s" fill="freeze"/><circle cx="172" cy="340" r="16" fill="#0f172a"/><text x="172" y="345" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">G</text><text x="150" y="380" font-size="12" font-weight="700">5′ cap</text></g></g>
<g class="part" data-part="tail" data-name="Poly-A tail" data-info="A chain of adenine nucleotides added to the 3′ end: protects the mRNA from breakdown." tabindex="0" role="button" aria-label="Poly-A tail"><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.4688;0.4875;1.0000" values="0;0;1;1" dur="16s" begin="sp2-play.begin+0s" fill="freeze"/><text x="636" y="346" font-size="16" font-weight="800" fill="#0f766e" letter-spacing="1">AAAAAAAA</text><text x="636" y="380" font-size="12" font-weight="700">poly-A tail</text></g></g>
<g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.5938;0.6062;0.7188;0.7312;1.0000" values="0;0;1;1;0;0" dur="16s" begin="sp2-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.5938;0.7188;1.0000" values="0 0;0 0;700 -60;700 -60" dur="16s" begin="sp2-play.begin+0s" fill="freeze"/><g transform="scale(.6) translate(140 224.4)"><rect x="190" y="322" width="110" height="36" rx="6" fill="#3b82f6" stroke="#1f2937" stroke-width="2"/><rect x="300" y="322" width="110" height="36" rx="6" fill="#22c55e" stroke="#1f2937" stroke-width="2"/><rect x="410" y="322" width="110" height="36" rx="6" fill="#f59e0b" stroke="#1f2937" stroke-width="2"/><rect x="520" y="322" width="110" height="36" rx="6" fill="#ec4899" stroke="#1f2937" stroke-width="2"/></g></g></g>
<g class="part" data-part="alt" data-name="Alternative splicing" data-info="Exons can be joined in different combinations, so one gene can code for several different proteins." tabindex="0" role="button" aria-label="Alternative splicing"><g><animate attributeName="opacity" keyTimes="0.0000;0.7188;0.7375;1.0000" values="0;0;1;1" dur="16s" begin="sp2-play.begin+0s" fill="freeze"/><rect x="20" y="490" width="1160" height="130" rx="14" fill="#fdf2f8" stroke="#db2777"/><text x="36" y="516" font-size="14" font-weight="800" fill="#9d174d">Alternative splicing: the same pre-mRNA, different mRNAs</text><text x="60" y="548" font-size="13" font-weight="700">mRNA A: exons 1-2-3-4</text><rect x="60" y="562" width="99.0" height="30" rx="5" fill="#3b82f6" stroke="#1f2937"/><text x="109.5" y="582" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">1</text><rect x="159.0" y="562" width="99.0" height="30" rx="5" fill="#22c55e" stroke="#1f2937"/><text x="208.5" y="582" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">2</text><rect x="258.0" y="562" width="99.0" height="30" rx="5" fill="#f59e0b" stroke="#1f2937"/><text x="307.5" y="582" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">3</text><rect x="357.0" y="562" width="99.0" height="30" rx="5" fill="#ec4899" stroke="#1f2937"/><text x="406.5" y="582" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">4</text><text x="466.0" y="584" font-size="13">→ protein A</text><text x="640" y="548" font-size="13" font-weight="700">mRNA B: exon 3 skipped</text><rect x="640" y="562" width="99.0" height="30" rx="5" fill="#3b82f6" stroke="#1f2937"/><text x="689.5" y="582" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">1</text><rect x="739.0" y="562" width="99.0" height="30" rx="5" fill="#22c55e" stroke="#1f2937"/><text x="788.5" y="582" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">2</text><rect x="838.0" y="562" width="99.0" height="30" rx="5" fill="#ec4899" stroke="#1f2937"/><text x="887.5" y="582" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">4</text><text x="947.0" y="584" font-size="13">→ protein B</text></g></g>
</svg>