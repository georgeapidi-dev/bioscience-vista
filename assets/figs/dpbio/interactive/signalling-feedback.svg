<g class="part" data-part="glu" data-name="Example: blood glucose" data-info="High blood glucose → insulin released → cells take up glucose → glucose falls → insulin secretion falls." tabindex="0" role="button" aria-label="Example: blood glucose"><g><animate attributeName="opacity" keyTimes="0.0000;0.3333;0.3500;1.0000" values="0;0;1;1" dur="18s" begin="cs10-play.begin+0s" fill="freeze"/><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.3333;0.3500;1.0000" values="0;0;1;1" dur="18s" begin="cs10-play.begin+0s" fill="freeze"/><rect x="175.0" y="383" width="220" height="24" rx="12" fill="#dcfce7" stroke="#1f2937" stroke-width="1"/><text x="285" y="400" text-anchor="middle" font-size="12" font-weight="700">returns to the set point</text></g></g></g>
<g class="part" data-part="pos" data-name="Positive feedback" data-info="The response INCREASES the original stimulus, amplifying change towards an end point." tabindex="0" role="button" aria-label="Positive feedback"><rect x="560" y="76" width="510" height="500" rx="16" fill="#fef2f2" stroke="#fca5a5"/><text x="815" y="104" text-anchor="middle" font-size="16" font-weight="800" fill="#b91c1c">POSITIVE feedback — amplifies</text><g><animate attributeName="opacity" keyTimes="0.0000;0.5000;0.5167;1.0000" values="0;0;1;1" dur="18s" begin="cs10-play.begin+0s" fill="freeze"/><rect x="720.0" y="136" width="190" height="28" rx="12" fill="#fff" stroke="#dc2626" stroke-width="2"/><text x="815" y="155" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">oestradiol RISES</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.5667;0.5833;1.0000" values="0;0;1;1" dur="18s" begin="cs10-play.begin+0s" fill="freeze"/><rect x="890.0" y="227" width="180" height="46" rx="12" fill="#fff" stroke="#dc2626" stroke-width="2"/><text x="980" y="246" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">hypothalamus + pituitary</text><text x="980" y="264" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">more GnRH → more LH</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.6333;0.6500;1.0000" values="0;0;1;1" dur="18s" begin="cs10-play.begin+0s" fill="freeze"/><rect x="720.0" y="317" width="190" height="46" rx="12" fill="#fff" stroke="#dc2626" stroke-width="2"/><text x="815" y="336" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">follicle cells</text><text x="815" y="354" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">make MORE oestradiol</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.5333;0.5500;1.0000" values="0;0;1;1" dur="18s" begin="cs10-play.begin+0s" fill="freeze"/><path d="M 860 168 L 940 222" stroke="#dc2626" stroke-width="3" marker-end="url(#cs10-dc