<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 600" class="vd-svg" role="img" aria-labelledby="cs10-title cs10-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="cs10-play" data-vd-play-label="Play: two loops" data-vd-steps="[[0, &quot;Feedback regulates signalling pathways.&quot;], [1, &quot;Negative feedback: high blood glucose triggers insulin release...&quot;], [3.5, &quot;...glucose is taken up, the level falls, and insulin secretion falls: back to the set point.&quot;], [9, &quot;Positive feedback: rising oestradiol stimulates more LH...&quot;], [11.5, &quot;...LH stimulates more oestradiol: each loop amplifies the change.&quot;], [15, &quot;The LH surge triggers ovulation: the end point.&quot;]]" data-vd-dur="18">
<title id="cs10-title">Negative and positive feedback</title><desc id="cs10-desc">Negative feedback: high blood glucose causes insulin release, glucose uptake lowers glucose back to the set point and insulin secretion falls. Positive feedback: rising oestradiol increases LH, which increases oestradiol further, building to the LH surge that triggers ovulation.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="600" fill="#ffffff"/>
