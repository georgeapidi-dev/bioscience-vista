<text class="head" x="30" y="34">Negative and positive feedback</text><text class="note" x="30" y="56">Graphs are illustrative.</text>
<g class="part" data-part="neg" data-name="Negative feedback" data-info="The response REDUCES the original stimulus, so the system returns to its set point: stabilising." tabindex="0" role="button" aria-label="Negative feedback"><rect x="30" y="76" width="510" height="500" rx="16" fill="#f0fdf4" stroke="#86efac"/><text x="285" y="104" text-anchor="middle" font-size="16" font-weight="800" fill="#15803d">NEGATIVE feedback — stabilises</text><g><animate attributeName="opacity" keyTimes="0.0000;0.0556;0.0722;1.0000" values="0;0;1;1" dur="18s" begin="cs10-play.begin+0s" fill="freeze"/><rect x="200.0" y="136" width="170" height="28" rx="12" fill="#fff" stroke="#16a34a" stroke-width="2"/><text x="285" y="155" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">blood glucose RISES</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.1222;0.1389;1.0000" values="0;0;1;1" dur="18s" begin="cs10-play.begin+0s" fill="freeze"/><rect x="365.0" y="217" width="170" height="46" rx="12" fill="#fff" stroke="#16a34a" stroke-width="2"/><text x="450" y="236" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">pancreas</text><text x="450" y="254" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">releases insulin</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.1889;0.2056;1.0000" values="0;0;1;1" dur="18s" begin="cs10-play.begin+0s" fill="freeze"/><rect x="200.0" y="307" width="170" height="46" rx="12" fill="#fff" stroke="#16a34a" stroke-width="2"/><text x="285" y="326" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">cells take up</text><text x="285" y="344" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">glucose</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.2556;0.2722;1.0000" values="0;0;1;1" dur="18s" begin="cs10-play.begin+0s" fill="freeze"/><rect x="35.0" y="217" width="170" height="46" rx="12" fill="#fff" stroke="#16a34a" stroke-width="2"/><text x="120" y="236" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">blood glucose FALLS</text><text x="120" y="254" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">→ less insulin</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.0889;0.1056;1.0000" values="0;0;1;1" dur="18s" begin="cs10-play.begin+0s" fill="freeze"/><path d="M 325 168 L 420 218" stroke="#16a34a" stroke-width="3" marker-end="url(#cs10-16a34a)"/></g><g><animate attributeName="opacity" keyTimes="0.0000;0.1556;0.1722;1.0000" values="0;0;1;1" dur="18s" begin="cs10-play.begin+0s" fill="freeze"/><path d="M 410 258 L 315 308" stroke="#16a34a" stroke-width="3" marker-end="url(#cs10-16a34a)"/></g><g><animate attributeName="opacity" keyTimes="0.0000;0.2222;0.2389;1.0000" values="0;0;1;1" dur="18s" begin="cs10-play.begin+0s" fill="freeze"/><path d="M 245 348 L 150 218" stroke="#16a34a" stroke-width="3" marker-end="url(#cs10-16a34a)"/></g><g><animate attributeName="opacity" keyTimes="0.0000;0.2778;0.2944;1.0000" values="0;0;1;1" dur="18s" begin="cs10-play.begin+0s" fill="freeze"/><path d="M 120 212 Q 120 150 190 150" fill="none" stroke="#dc2626" stroke-width="3" stroke-dasharray="7 4" marker-end="url(#cs10-dc2626)"/><text x="110" y="170" text-anchor="middle" font-size="26" font-weight="800" fill="#dc2626">−</text></g><line x1="90" y1="540" x2="490" y2="540" stroke="#111827" stroke-width="2"/><line x1="90" y1="540" x2="90" y2="410" stroke="#111827" stroke-width="2"/><text x="290.0" y="558" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">time</text><text x="82" y="475.0" text-anchor="end" font-size="11" font-weight="700" fill="#111827">glucose</text><line x1="90" y1="488" x2="490" y2="488" stroke="#94a3b8" stroke-dasharray="5 4"/><text x="490" y="482.0" text-anchor="end" font-size="11" font-weight="800" fill="#64748b">set point</text><clipPath id="cs10n-c1041090"><rect x="90" y="410" width="400" height="132"><animate attributeName="width" k