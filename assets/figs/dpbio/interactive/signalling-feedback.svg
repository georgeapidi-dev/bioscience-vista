<g class="part" data-part="lh" data-name="Example: the LH surge" data-info="Rising oestradiol stimulates more GnRH and LH; LH stimulates follicle cells to make more oestradiol... giving the LH surge that triggers ovulation." tabindex="0" role="button" aria-label="Example: the LH surge"><g><animate attributeName="opacity" keyTimes="0.0000;0.8333;0.8500;1.0000" values="0;0;1;1" dur="18s" begin="cs10-play.begin+0s" fill="freeze"/><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.8333;0.8500;1.0000" values="0;0;1;1" dur="18s" begin="cs10-play.begin+0s" fill="freeze"/><rect x="685.0" y="383" width="260" height="24" rx="12" fill="#fee2e2" stroke="#1f2937" stroke-width="1"/><text x="815" y="400" text-anchor="middle" font-size="12" font-weight="700">LH SURGE → ovulation (end point)</text></g></g></g>
