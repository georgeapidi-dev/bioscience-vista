<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" class="vd-svg" role="img" aria-labelledby="iv-title iv-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="iv-play" data-vd-play-label="Play: invade" data-vd-steps="[[0, &quot;Invasive species: water hyacinth on Lake Victoria.&quot;], [1, &quot;A few plants arrive...&quot;], [3, &quot;...and spread fast by runners into dense mats.&quot;], [7, &quot;Below the mat: darkness and low oxygen; native plants and fish suffer.&quot;], [10.5, &quot;Invaders grow fast and escape their natural enemies.&quot;]]" data-vd-dur="14">
<title id="iv-title">Invasive species</title><desc id="iv-desc">Water hyacinth spreading by runners across the surface of Lake Victoria into a dense mat that shades out submerged plants and lowers oxygen; invaders grow fast and have left their natural enemies behind.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
