<g class="part" data-part="harm" data-name="Harm" data-info="Mats shade out submerged native plants and algae and lower oxygen in the water." tabindex="0" role="button" aria-label="Harm"><rect x="40" y="210" width="1020" height="320" fill="#0f172a" opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.5000;0.6429;1.0000" values="0;0;0.35;0.35" dur="14s" begin="iv-play.begin+0s" fill="freeze"/></rect><g><animate attributeName="opacity" keyTimes="0.0000;0.5357;0.5571;1.0000" values="0;0;1;1" dur="14s" begin="iv-play.begin+0s" fill="freeze"/><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.5357;0.5571;1.0000" values="0;0;1;1" dur="14s" begin="iv-play.begin+0s" fill="freeze"/><rect x="400.0" y="288" width="300" height="24" rx="12" fill="#fee2e2" stroke="#1f2937" stroke-width="1"/><text x="550" y="305" text-anchor="middle" font-size="12" font-weight="700">shade + low oxygen beneath the mat</text></g></g></g>
<g class="part" data-part="why" data-name="Why invaders win" data-info="Faster growth and more efficient uptake of light or nutrients; their natural predators, herbivores and pathogens were left behind. Also: Prosopis juliflora (mathenge) in Baringo; Lantana camara in parks." tabindex="0" role="button" aria-label="Why invaders win"><g><animate attributeName="opacity" keyTimes="0.0000;0.7500;0.7714;1.0000" values="0;0;1;1" dur="14s" begin="iv-play.begin+0s" fill="freeze"/><rect x="300" y="400" width="500" height="100" rx="14" fill="#fff" stroke="#334155"/><text x="550" y="428" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">why invaders win</text><text x="550" y="452" text-anchor="middle" font-size="12" font-weight="700" fill="#475569">fast growth, efficient uptake of light and nutrients</text><text x="550" y="472" text-anchor="middle" font-size="12" font-weight="700" fill="#475569">natural predators and pathogens left behind</text><text x="550" y="490" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">also: mathenge (Baringo), Lantana camara</text></g></g>
