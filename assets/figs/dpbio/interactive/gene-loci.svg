<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" class="vd-svg" role="img" aria-labelledby="gl2-title gl2-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="gl2-play" data-vd-play-label="Play: find the genes" data-vd-steps="[[0, &quot;Gene loci: a gene&#x27;s address on a chromosome.&quot;], [1, &quot;Read 7q31.2: chromosome 7, long arm, band 31.2.&quot;], [5, &quot;Look up loci in NCBI Gene, Ensembl or OMIM.&quot;], [10, &quot;Same chromosome, close together \u2192 likely linked.&quot;]]" data-vd-dur="14">
<title id="gl2-title">Gene loci</title><desc id="gl2-desc">Chromosomes 7, 11, 12 and X with the loci of CFTR at 7q31.2, HBB at 11p15.4, INS at 11p15.5, PAH at 12q23.2 and F8 at Xq28, showing HBB and INS close together and therefore likely linked.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="560" fill="#ffffff"/>
<g aria-hidden="true"><animate id="gl2-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<text class="head" x="30" y="34">Gene loci: where genes are on chromosomes</text><text class="note" x="30" y="56">Positions approximate; p = short arm, q = long arm.</text>
<g class="part" data-part="loc" data-name="Gene locus" data-info="The position of a gene on a chromosome: 7q31.2 = chromosome 7, long arm (q), band 31.2. Short arm = p." tabindex="0" role="button" aria-label="Gene locus"><rect x="162" y="110" width="36" height="110" rx="18" fill="#e5e7eb" stroke="#334155" stroke-width="2"/><rect x="162" y="226" width="36" height="230" rx="18" fill="#e5e7eb" stroke="#334155" stroke-width="2"/><circle cx="180" cy="223" r="6" fill="#64748b"/><text x="180" y="480" text-anchor="middle" font-size="14" font-weight="800" fill="#111827">chr 7</text><text x="150" y="165.0" text-anchor="middle" font-size="11" font-weight="800" fill="#475569">p</text><text x="150" y="335.0" text-anchor="middle" font-size="11" font-weight="800" fill="#475569">q</text><rect x="402" y="110" width="36" height="90" rx="18" fill="#e5e7eb" stroke="#334155" stroke-width="2"/><rect x="402" y="206" width="36" height="200" rx="18" fill="#e5e7eb" stroke="#334155" stroke-width="2"/><circle cx="420" cy="203" r="6" fill="#64748b"/><text x="420" y="430" text-anchor="middle" font-size="14" font-weight="800" fill="#111827">chr 11</text><text x="390" y="155.0" text-anchor="middle" font-size="11" font-weight="800" fill="#475569">p</text><text x="390" y="300.0" text-anchor="middle" font-size="11" font-weight="800" fill="#475569">q</text><rect x="642" y="110" width="36" height="60" rx="18" fill="#e5e7eb" stroke="#334155" stroke-width="2"/><rect x="642" y="176" width="36" height="190" rx="18" fill="#e5e7eb" stroke="#334155" stroke-width="2"/><circle cx="660" cy="173" r="6" fill="#64748b"/><text x="660" y="390" text-anchor="middle" font-size="14" font-weight="800" fill="#111827">chr 12</text><text x="630" y="140.0" text-anchor="middle" font-size="11" font-weight="800" fill="#475569">p</text><text x="630" y="265.0" text-anchor="middle" font-size="11" font-weight="800" fill="#475569">q</text><rect x="882" y="110" width="36" height="110" rx="18" fill="#e5e7eb" stroke="#334155" stroke-width="2"/><rect x="882" y="226" width="36" height="190" rx="18" fill="#e5e7eb" stroke="#334155" stroke-width="2"/><circle cx="900" cy="223" r="6" fill="#64748b"/><text x="900" y="440" text-anchor="middle" font-size="14" font-weight="800" fill="#111827">X</text><text x="870" y="165.0" text-anchor="middle" font-size="11" font-weight="800" fill="#475569">p</text><text x="870" y="315.0" text-anchor="middle" font-size="11" font-weight="800" fill="#475569">q</text></g>
<g class="part" data-part="ex" data-name="Examples from databases" data-info="HBB (β-globin) 11p15.4; INS (insulin) 11p15.5; CFTR 7q31.2; F8 (clotting factor VIII) Xq28; PAH 12q23.2." tabindex="0" role="button" aria-label="Examples from databases"><g><animate attributeName="opacity" keyTimes="0.0000;0.1429;0.1643;1.0000" values="0;0;1;1" dur="14s" begin="gl2-play.begin+0s" fill="freeze"/><rect x="162" y="383" width="36" height="7" fill="#2563eb"/><line x1="198" y1="386" x2="250" y2="386" stroke="#2563eb" stroke-width="2"/><text x="256" y="390" text-anchor="start" font-size="12" font-weight="800" fill="#2563eb">CFTR 7q31.2</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.3929;0.4143;1.0000" values="0;0;1;1" dur="14s" begin="gl2-play.begin+0s" fill="freeze"/><rect x="402" y="115" width="36" height="7" fill="#16a34a"/><line x1="438" y1="118" x2="490" y2="118" stroke="#16a34a" stroke-width="2"/><text x="496" y="122" text-anchor="start" font-size="12" font-weight="800" fill="#16a34a">INS 11p15.5</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.4286;0.4500;1.0000" values="0;0;1;1" dur="14s" begin="gl2-play.begin+0s" fill="freeze"/><rect x="402" y="131" width="36" height="7" fill="#dc2626"/><line x1="438" y1="134" x2="490" y2="134" stroke="#dc2626" stroke-width="2"/><text x="496" y="138" text-anchor="start" font-size="12" font-weight="800" fill="#dc2626">HBB 11p15.4</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.5000;0.5214;1.0000" values="0;0;1;1" dur="14s" begin="gl2-play.begin+0s" fill="freeze"/><rect x="642" y="293" width="36" height="7" fill="#7c3aed"/><line x1="678" y1="296" x2="730" y2="296" stroke="#7c3aed" stroke-width="2"/><text x="736" y="300" text-anchor="start" font-size="12" font-weight="800" fill="#7c3aed">PAH 12q23.2</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.5714;0.5929;1.0000" values="0;0;1;1" dur="14s" begin="gl2-play.begin+0s" fill="freeze"/><rect x="882" y="398" width="36" height="7" fill="#ea580c"/><line x1="918" y1="401" x2="970" y2="401" stroke="#ea580c" stroke-width="2"/><text x="976" y="405" text-anchor="start" font-size="12" font-weight="800" fill="#ea580c">F8 Xq28</text></g></g>
<g class="part" data-part="link" data-name="Linked or unlinked?" data-info="HBB and INS are close together on chromosome 11: likely linked. HBB and CFTR are on different chromosomes: unlinked." tabindex="0" role="button" aria-label="Linked or unlinked?"><g><animate attributeName="opacity" keyTimes="0.0000;0.7143;0.7357;1.0000" values="0;0;1;1" dur="14s" begin="gl2-play.begin+0s" fill="freeze"/><rect x="395" y="106" width="50" height="40" rx="8" fill="none" stroke="#111827" stroke-width="2" stroke-dasharray="5 3"/><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.7143;0.7357;1.0000" values="0;0;1;1" dur="14s" begin="gl2-play.begin+0s" fill="freeze"/><rect x="250.0" y="508" width="600" height="24" rx="12" fill="#fef3c7" stroke="#1f2937" stroke-width="1"/><text x="550" y="525" text-anchor="middle" font-size="12" font-weight="700">HBB + INS: same chromosome, close → likely linked · HBB + CFTR: unlinked</text></g></g></g>
</svg>