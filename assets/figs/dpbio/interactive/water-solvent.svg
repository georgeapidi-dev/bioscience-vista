<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 600" class="vd-svg" role="img" aria-labelledby="sv-title sv-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="sv-play" data-vd-play-label="Play: dissolve" data-vd-steps="[[0, &quot;Water as a solvent.&quot;], [1, &quot;Water molecules pull ions out of a salt crystal.&quot;], [4, &quot;The \u03b4\u2212 oxygen turns towards Na\u207a; the \u03b4+ hydrogens turn towards Cl\u207b.&quot;], [8, &quot;Each ion gains a hydration shell and stays in solution: hydrophilic.&quot;], [11, &quot;A non-polar lipid cannot hydrogen bond with water, so it is excluded: hydrophobic.&quot;]]" data-vd-dur="15">
<title id="sv-title">Water as a solvent</title><desc id="sv-desc">Water molecules pulling sodium and chloride ions from a crystal and surrounding them with hydration shells, oxygen towards Na+ and hydrogens towards Cl-, while a non-polar lipid is excluded.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
