<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" class="vd-svg" role="img" aria-labelledby="mm-title mm-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="mm-play" data-vd-play-label="Play: enzyme kinetics" data-vd-steps="[[0, &quot;How the rate of an enzyme reaction depends on substrate concentration.&quot;], [1, &quot;At low [S], rate increases almost in proportion: many active sites are free.&quot;], [4, &quot;At high [S] the rate levels off at Vmax: all active sites are occupied.&quot;], [6.5, &quot;Km is the substrate concentration that gives half of Vmax.&quot;], [9, &quot;A competitive inhibitor: Vmax unchanged, Km higher.&quot;], [12, &quot;A non-competitive inhibitor: Vmax lower, Km unchanged.&quot;]]" data-vd-dur="16">
<title id="mm-title">Enzyme kinetics: Michaelis–Menten</title><desc id="mm-desc">A Michaelis–Menten graph of reaction rate against substrate concentration with Vmax and Km marked, compared with competitive and non-competitive inhibition, and active-site occupancy at low and high substrate concentration.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
