<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" class="vd-svg" role="img" aria-labelledby="dc-title dc-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="dc-play" data-vd-play-label="Play: one complete circuit" data-vd-steps="[[0, &quot;Mammals have a double circulation: two circuits, both through the heart.&quot;], [1, &quot;Pulmonary circuit: the right ventricle pumps deoxygenated blood to the lungs, where it picks up oxygen.&quot;], [4.5, &quot;Oxygenated blood returns to the left atrium in the pulmonary vein.&quot;], [6, &quot;Systemic circuit: the left ventricle pumps oxygenated blood through the aorta to the body.&quot;], [9.5, &quot;Deoxygenated blood returns through the vena cava to the right atrium. Blood passes through the heart twice per circuit.&quot;]]" data-vd-dur="14">
<title id="dc-title">Double circulation</title><desc id="dc-desc">A diagram of the double circulation: the pulmonary circuit from the right side of the heart to the lungs and back, and the systemic circuit from the left side to the body and back, with blood colour showing oxygenation.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1000" height="680" fill="#ffffff"/>
<g aria-hidden="true"><animate id="dc-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<defs><marker id="dc-dc2626" markerUnits="userSpaceOnUse" markerWidth="30" markerHeight="30" refX="14" refY="15" orient="auto"><path d="M0,0 L30,15 L0,30 z" fill="#dc2626"/></marker><marker id="dc-2563eb" markerUnits="userSpaceOnUse" markerWidth="30" markerHeight="30" refX="14" refY="15" orient="auto"><path d="M0,0 L30,15 L0,30 z" fill="#2563eb"/></marker></defs>
<text class="head" x="30" y="34">Double circulation</text><text class="note" x="30" y="56">Red: oxygenated blood. Blue: deoxygenated blood. The heart is drawn as if facing you (its right side on your left).</text>
<g class="part" data-part="lungs" data-name="Lungs" data-info="Gas exchange: blood becomes oxygenated." tabindex="0" role="button" aria-label="Lungs"><rect x="330" y="80" width="340" height="90" rx="40" fill="#fecdd3" stroke="#be123c" stroke-width="2"/><text x="500" y="132" text-anchor="middle" font-size="18" font-weight="800">LUNGS</text></g>
<g class="part" data-part="body" data-name="Body organs" data-info="Oxygen and glucose are delivered to cells; carbon dioxide is removed." tabindex="0" role="button" aria-label="Body organs"><rect x="330" y="560" width="340" height="90" rx="40" fill="#fde68a" stroke="#a16207" stroke-width="2"/><text x="500" y="612" text-anchor="middle" font-size="18" font-weight="800">BODY ORGANS</text></g>
<g class="part" data-part="heart" data-name="Heart" data-info="Two pumps side by side: the right side pumps blood to the lungs, the left side to the rest of the body." tabindex="0" role="button" aria-label="Heart"><rect x="400" y="300" width="200" height="150" rx="16" fill="#fff" stroke="#1f2937" stroke-width="3"/><line x1="500" y1="300" x2="500" y2="450" stroke="#1f2937" stroke-width="3"/><line x1="400" y1="360" x2="600" y2="360" stroke="#1f2937" stroke-width="2"/><rect x="402" y="302" width="96" height="56" fill="#bfdbfe"/><rect x="402" y="362" width="96" height="86" fill="#93c5fd"/><rect x="502" y="302" width="96" height="56" fill="#fecaca"/><rect x="502" y="362" width="96" height="86" fill="#fca5a5"/><text x="450" y="336" text-anchor="middle" font-size="12" font-weight="700">right atrium</text><text x="450" y="410" text-anchor="middle" font-size="12" font-weight="700">right ventricle</text><text x="550" y="336" text-anchor="middle" font-size="12" font-weight="700">left atrium</text><text x="550" y="410" text-anchor="middle" font-size="12" font-weight="700">left ventricle</text></g>
<g class="part" data-part="pul" data-name="Pulmonary circuit" data-info="Right ventricle → pulmonary artery → lungs (blood picks up oxygen, loses CO₂) → pulmonary vein → left atrium." tabindex="0" role="button" aria-label="Pulmonary circuit"><path d="M 440 440 C 300 440 260 260 330 140" fill="none" stroke="#2563eb" stroke-width="12" marker-end="url(#dc-2563eb)"/><path d="M 670 130 C 760 220 720 320 612 330" fill="none" stroke="#dc2626" stroke-width="12" marker-end="url(#dc-dc2626)"/><text x="180" y="290" font-size="13" font-weight="700" fill="#1d4ed8">pulmonary artery</text><text x="720" y="250" font-size="13" font-weight="700" fill="#b91c1c">pulmonary vein</text></g>
<g class="part" data-part="sys" data-name="Systemic circuit" data-info="Left ventricle → aorta → body organs (cells take oxygen) → vena cava → right atrium." tabindex="0" role="button" aria-label="Systemic circuit"><path d="M 560 440 C 720 460 740 560 670 610" fill="none" stroke="#dc2626" stroke-width="12" marker-end="url(#dc-dc2626)"/><path d="M 330 610 C 250 540 260 340 388 330" fill="none" stroke="#2563eb" stroke-width="12" marker-end="url(#dc-2563eb)"/><text x="740" y="520" font-size="13" font-weight="700" fill="#b91c1c">aorta</text><text x="170" y="470" font-size="13" font-weight="700" fill="#1d4ed8">vena cava</text></g>
