<g class="part" data-part="why" data-name="Why double?" data-info="Blood returns to the heart after the lungs to be pumped again at high pressure, so it reaches all the body quickly. Blood passes through the heart twice per complete circuit." tabindex="0" role="button" aria-label="Why double?"><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.7857;0.8071;1.0000" values="0;0;1;1" dur="14s" begin="dc-play.begin+0s" fill="freeze"/><rect x="700" y="300" width="280" height="130" rx="12" fill="#f8fafc" stroke="#cbd5e1"/><text x="716" y="326" font-size="14" font-weight="800">Twice through the heart</text><text x="716" y="350" font-size="12">The lungs lower the pressure, so the</text><text x="716" y="368" font-size="12">heart pumps the blood again: high</text><text x="716" y="386" font-size="12">pressure delivers oxygen quickly.</text><text x="716" y="410" font-size="12" fill="#475569">Fish have a single circulation.</text></g></g>
</svg>