99999999997s"/></rect><text x="552" y="622" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2937">Relay neuron</text><path d="M 620 617 L 636 617" stroke="#334155" stroke-width="2.5" marker-end="url(#rx-ar)"/><rect x="638" y="590" width="132" height="54" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><rect x="638" y="590" width="132" height="54" rx="10" fill="#facc15" stroke="#a16207" stroke-width="2" opacity="0"><set attributeName="opacity" to="1" begin="rx-play.begin+4.8s" dur="2.8s"/></rect><text x="704" y="622" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2937">Motor neuron</text><path d="M 772 617 L 788 617" stroke="#334155" stroke-width="2.5" marker-end="url(#rx-ar)"/><rect x="790" y="590" width="132" height="54" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><rect x="790" y="590" width="132" height="54" rx="10" fill="#facc15" stroke="#a16207" stroke-width="2" opacity="0"><set attributeName="opacity" to="1" begin="rx-play.begin+7.6s" dur="1.0s"/></rect><text x="856" y="622" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2937">Effector</text><path d="M 924 617 L 940 617" stroke="#334155" stroke-width="2.5" marker-end="url(#rx-ar)"/><rect x="942" y="590" width="132" height="54" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><rect x="942" y="590" width="132" height="54" rx="10" fill="#facc15" stroke="#a16207" stroke-width="2" opacity="0"><set attributeName="opacity" to="1" begin="rx-play.begin+8.6s" dur="1.4000000000000004s"/></rect><text x="1008" y="622" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2937">Response</text><text x="30" y="672" font-size="13" fill="#475569">Each arrow between neurons is a synapse. Coordinator: the spinal cord (central nervous system).</text></g>
