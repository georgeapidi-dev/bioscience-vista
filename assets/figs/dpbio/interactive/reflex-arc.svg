<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 760" class="vd-svg" role="img" aria-labelledby="rx-title rx-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="rx-play" data-vd-play-label="Play: an impulse round the reflex arc" data-vd-steps="[[0, &quot;A stimulus, for example touching something very hot, is detected by pain receptors in the skin.&quot;], [0.6, &quot;The receptor starts impulses in a sensory neuron, which carries them to the spinal cord through the dorsal root. Its cell body is in the dorsal root ganglion.&quot;], [3.6, &quot;In the grey matter the impulse crosses a synapse to a relay neuron, then a second synapse to a motor neuron.&quot;], [4.8, &quot;The motor neuron carries impulses out through the ventral root to the effector, the biceps muscle.&quot;], [7.6, &quot;The muscle contracts and the hand is pulled away: the response. The whole reflex is fast and automatic because it does not need the brain (which is told afterwards).&quot;]]" data-vd-dur="10">
<title id="rx-title">The reflex arc</title><desc id="rx-desc">A withdrawal reflex: receptor in the skin, sensory neuron with its cell body in the dorsal root ganglion, relay neuron in the grey matter of the spinal cord, motor neuron and the biceps muscle, with a flowchart of the pathway.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="760" fill="#ffffff"/>
<g aria-hidden="true"><animate id="rx-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<text class="head" x="30" y="36">The reflex arc (withdrawal reflex)</text><text class="note" x="30" y="58">Spinal cord in cross-section, dorsal (back) side at the top. Not to scale.</text>
<g aria-hidden="true"><path d="M 40 150 L 180 150 L 180 236 L 40 236 Z" fill="#fde7d4" stroke="#b07350" stroke-width="2"/><text x="48" y="230" font-size="13" fill="#7c4a2d">skin of the finger</text><path d="M 60 120 C 90 128 120 140 150 148" stroke="#dc2626" stroke-width="3"/><text x="40" y="112" font-size="14" font-weight="700" fill="#dc2626">stimulus: heat</text></g>
<g class="part" data-part="rec" data-name="Receptor (pain receptor in the skin)" data-info="Detects the stimulus (heat, a sharp point) and starts nerve impulses in the sensory neuron." tabindex="0" role="button" aria-label="Receptor (pain receptor in the skin)"><path d="M 150 178 C 156 168 162 170 166 180 C 170 188 164 196 168 196" fill="none" stroke="#7c3aed" stroke-width="3"/><circle cx="152" cy="176" r="6" fill="#c4b5fd" stroke="#5b21b6" stroke-width="2"/></g>
<g transform="translate(230 420)"><g><animateTransform attributeName="transform" type="scale" values="1 1;1 1;0.86 1.25;0.86 1.25;1 1" keyTimes="0;0.76;0.84;0.96;1" dur="10s" begin="rx-play.begin+0s"/><g transform="translate(-230 -420)"><g class="part" data-part="eff" data-name="Effector (biceps muscle)" data-info="Contracts when impulses arrive, pulling the hand away from the stimulus: the response." tabindex="0" role="button" aria-label="Effector (biceps muscle)"><path d="M 130 420 C 160 372 300 370 330 420 C 300 470 160 468 130 420 Z" fill="#f87171" stroke="#991b1b" stroke-width="2.5"/><path d="M 150 408 L 170 430" stroke="#991b1b" stroke-width="1.2" opacity=".6"/><path d="M 172 414 L 192 424" stroke="#991b1b" stroke-width="1.2" opacity=".6"/><path d="M 194 408 L 214 430" stroke="#991b1b" stroke-width="1.2" opacity=".6"/><path d="M 216 414 L 236 424" stroke="#991b1b" stroke-width="1.2" opacity=".6"/><path d="M 238 408 L 258 430" stroke="#991b1b" stroke-width="1.2" opacity=".6"/><path d="M 260 414 L 280 424" stroke="#991b1b" stroke-width="1.2" opacity=".6"/><path d="M 282 408 L 302 430" stroke="#991b1b" stroke-width="1.2" opacity=".6"/><path d="M 130 420 L 70 420 M 330 420 L 380 420" stroke="#e5e7eb" stroke-width="8" stroke-linecap="round"/></g></g></g></g>
<text x="150" y="490" font-size="13" fill="#7f1d1d" aria-hidden="true">biceps muscle (effector)</text>
<g class="part" data-part="white" data-name="White matter" data-info="Outer region of the spinal cord: myelinated axons carrying impulses up to and down from the brain." tabindex="0" role="button" aria-label="White matter"><path d="M 780 160 C 880 160 930 220 930 300 C 930 380 880 440 780 440 C 680 440 630 380 630 300 C 630 220 680 160 780 160 Z" fill="#f8fafc" stroke="#64748b" stroke-width="3"/></g>
<g class="part" data-part="grey" data-name="Grey matter" data-info="H-shaped central region of the spinal cord containing cell bodies, relay neurons and synapses." tabindex="0" role="button" aria-label="Grey matter"><path d="M 780 250 C 800 250 812 230 820 200 C 826 186 842 186 840 204 C 834 240 830 270 846 300 C 864 330 870 370 856 392 C 844 404 826 398 822 380 C 816 350 804 336 780 336 C 756 336 744 350 738 380 C 734 398 716 404 704 392 C 690 370 696 330 714 300 C 730 270 726 240 720 204 C 718 186 734 186 740 200 C 748 230 760 250 780 250 Z" fill="#d1d5db" stroke="#6b7280" stroke-width="2"/></g>
<g class="part" data-part="cc" data-name="Central canal" data-info="Narrow canal in the middle of the spinal cord containing cerebrospinal fluid." tabindex="0" role="button" aria-label="Central canal"><circle cx="780" cy="294" r="8" fill="#bae6fd" stroke="#0369a1" stroke-width="2"/></g>
<g class="part" data-part="dr" data-name="Dorsal root" data-info="Carries sensory neurons into the spinal cord." tabindex="0" role="button" aria-label="Dorsal root"><path d="M 560 188 C 600 184 626 176 690 172" fill="none" stroke="#fde68a" stroke-width="30" stroke-linecap="round" opacity=".7"/></g>
<g class="part" data-part="vr" data-name="Ventral root" data-info="Carries motor neurons out of the spinal cord." tabindex="0" role="button" aria-label="Ventral root"><path d="M 640 404 C 690 392 720 372 740 360" fill="none" stroke="#bbf7d0" stroke-width="30" stroke-linecap="round" opacity=".8"/></g>
<g class="part" data-part="drg" data-name="Dorsal root ganglion" data-info="A swelling on the dorsal root containing the cell bodies of sensory neurons." tabindex="0" role="button" aria-label="Dorsal root ganglion"><ellipse cx="610" cy="182" rx="34" ry="24" fill="#fde68a" stroke="#a16207" stroke-width="2"/></g>
<g class="part" data-part="sen" data-name="Sensory neuron" data-info="Carries impulses from the receptor to the spinal cord. Its cell body is in the dorsal root ganglion." tabindex="0" role="button" aria-label="Sensory neuron"><path d="M 168 196 C 300 196 460 196 560 188 C 600 184 626 176 650 168 C 690 160 712 178 730 196 L 760 222" fill="none" stroke="#1f2937" stroke-width="8" stroke-linecap="round"/><path d="M 168 196 C 300 196 460 196 560 188 C 600 184 626 176 650 168 C 690 160 712 178 730 196 L 760 222" fill="none" stroke="#a78bfa" stroke-width="5" stroke-linecap="round"/><path d="M 610 184 L 610 166" stroke="#1f2937" stroke-width="5"/><circle cx="610" cy="160" r="11" fill="#a78bfa" stroke="#1f2937" stroke-width="2.5"/><circle cx="610" cy="160" r="4" fill="#4c1d95"/></g>
<g class="part" data-part="rel" data-name="Relay neuron" data-info="Short neuron inside the grey matter of the spinal cord that passes impulses from the sensory neuron to the motor neuron." tabindex="0" role="button" aria-label="Relay neuron"><path d="M 768 230 C 744 258 744 304 766 332" fill="none" stroke="#1f2937" stroke-width="7" stroke-linecap="round"/><path d="M 768 230 C 744 258 744 304 766 332" fill="none" stroke="#fbbf24" stroke-width="4" stroke-linecap="round"/><circle cx="750" cy="281" r="7" fill="#fbbf24" stroke="#1f2937" stroke-width="2"/></g>
<g class="part" data-part="mot" data-name="Motor neuron" data-info="Carries impulses from the spinal cord to the effector. Its cell body is in the ventral horn of the grey matter; its axon leaves in the ventral root." tabindex="0" role="button" aria-label="Motor neuron"><path d="M 760 340 C 730 360 690 392 640 404 C 560 420 420 420 330 420" fill="none" stroke="#1f2937" stroke-width="8" stroke-linecap="round"/><path d="M 760 340 C 730 360 690 392 640 404 C 560 420 420 420 330 420" fill="none" stroke="#34d399" stroke-width="5" stroke-linecap="round"/><circle cx="762" cy="346" r="13" fill="#34d399" stroke="#1f2937" stroke-width="2.5"/><circle cx="762" cy="346" r="5" fill="#065f46"/><path d="M 330 420 l -10 -10" stroke="#1f2937" stroke-width="2"/><path d="M 330 420 l -12 0" stroke="#1f2937" stroke-width="2"/><path d="M 330 420 l -10 10" stroke="#1f2937" stroke-width="2"/></g>
<g class="part" data-part="syn" data-name="Synapses" data-info="Junctions between neurons where a neurotransmitter carries the signal across: they make sure the impulse travels in one direction only." tabindex="0" role="button" aria-label="Synapses"><circle cx="764" cy="226" r="9" fill="none" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="3 2"/><circle cx="766" cy="334" r="9" fill="none" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="3 2"/></g>
<g class="labels"><g class="lbl" data-for="rec"><polyline points="186.6,280.0 120.0,300.0 152.0,176.0"/><circle cx="152.0" cy="176.0" r="2.6"/><text x="30" y="300" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="4">Receptor (pain receptor in the skin)</text></g><g class="lbl" data-for="sen"><polyline points="400.0,126.0 400.0,194.0"/><circle cx="400.0" cy="194.0" r="2.6"/><text x="400" y="120" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="4">Sensory neuron</text></g><g class="lbl" data-for="drg"><polyline points="590.0,106.0 620.0,162.0"/><circle cx="620.0" cy="162.0" r="2.6"/><text x="590" y="100" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="4">Dorsal root ganglion</text></g><g class="lbl" data-for="dr"><polyline points="502.8,254.0 540.0,190.0"/><circle cx="540.0" cy="190.0" r="2.6"/><text x="450" y="260" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="4">Dorsal root</text></g><g class="lbl" data-for="vr"><polyline points="657.2,464.0 690.0,392.0"/><circle cx="690.0" cy="392.0" r="2.6"/><text x="600" y="470" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="4">Ventral root</text></g><g class="lbl" data-for="mot"><polyline points="450.0,500.0 480.0,418.0"/><circle cx="480.0" cy="418.0" r="2.6"/><text x="450" y="520" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="4">Motor neuron</text></g><g class="lbl" data-for="eff"><polyline points="134.4,386.0 160.0,420.0"/><circle cx="160.0" cy="420.0" r="2.6"/><text x="30" y="380" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="4">Effector (biceps muscle)</text></g><g class="lbl" data-for="white"><polyline points="960.6,174.0 900.0,230.0"/><circle cx="900.0" cy="230.0" r="2.6"/><text x="1070" y="180" text-anchor="end" paint-order="stroke" stroke="#fff" stroke-width="4">White matter</text></g><g class="lbl" data-for="grey"><polyline points="969.3,254.0 840.0,300.0"/><circle cx="840.0" cy="300.0" r="2.6"/><text x="1070" y="260" text-anchor="end" paint-order="stroke" stroke="#fff" stroke-width="4">Grey matter</text></g><g class="lbl" data-for="cc"><polyline points="951.9,314.0 788.0,294.0"/><circle cx="788.0" cy="294.0" r="2.6"/><text x="1070" y="320" text-anchor="end" paint-order="stroke" stroke="#fff" stroke-width="4">Central canal</text></g><g class="lbl" data-for="rel"><polyline points="960.6,364.0 960.0,370.0 750.0,281.0"/><circle cx="750.0" cy="281.0" r="2.6"/><text x="1070" y="370" text-anchor="end" paint-order="stroke" stroke="#fff" stroke-width="4">Relay neuron</text></g><g class="lbl" data-for="syn"><polyline points="1004.1,414.0 772.0,334.0"/><circle cx="772.0" cy="334.0" r="2.6"/><text x="1070" y="420" text-anchor="end" paint-order="stroke" stroke="#fff" stroke-width="4">Synapse</text></g></g>
