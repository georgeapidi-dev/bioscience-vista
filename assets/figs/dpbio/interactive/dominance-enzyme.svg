<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" class="vd-svg" role="img" aria-labelledby="dm-title dm-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="dm-play" data-vd-play-label="Play: make pigment" data-vd-steps="[[0, &quot;Why are some alleles dominant?&quot;], [1, &quot;AA: two functional alleles make plenty of enzyme.&quot;], [4.5, &quot;Aa: one functional allele still makes enough enzyme.&quot;], [8.5, &quot;aa: no functional enzyme: no pigment (albinism).&quot;]]" data-vd-dur="13">
<title id="dm-title">Dominance and enzymes</title><desc id="dm-desc">A pigment enzyme example: AA makes plenty of enzyme and pigment, Aa makes enough enzyme for normal pigment so A is dominant, and aa makes no functional enzyme causing albinism.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="520" fill="#ffffff"/>
<g aria-hidden="true"><animate id="dm-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<text class="head" x="30" y="34">Why some alleles are dominant</text><text class="note" x="30" y="56">Example: an enzyme for pigment (melanin).</text>
<g class="part" data-part="aa" data-name="Two functional alleles (AA)" data-info="Plenty of enzyme: normal pigmentation." tabindex="0" role="button" aria-label="Two functional alleles (AA)"><rect x="30" y="80" width="320" height="400" rx="16" fill="#f8fafc" stroke="#cbd5e1"/><text x="190" y="110" text-anchor="middle" font-size="22" font-weight="800" fill="#111827">AA</text><rect x="120" y="130" width="60" height="22" rx="6" fill="#16a34a" stroke="#334155"/><text x="150" y="146" text-anchor="middle" font-size="9" font-weight="800" fill="#fff">functional</text><rect x="200" y="130" width="60" height="22" rx="6" fill="#16a34a" stroke="#334155"/><text x="230" y="146" text-anchor="middle" font-size="9" font-weight="800" fill="#fff">functional</text><g><animate attributeName="opacity" keyTimes="0.0000;0.0769;0.1000;1.0000" values="0;0;1;1" dur="13s" begin="dm-play.begin+0s" fill="freeze"/><circle cx="130" cy="210" r="14" fill="#86efac" stroke="#15803d"/><circle cx="190" cy="210" r="14" fill="#86efac" stroke="#15803d"/><circle cx="250" cy="210" r="14" fill="#86efac" stroke="#15803d"/><circle cx="130" cy="250" r="14" fill="#86efac" stroke="#15803d"/><circle cx="190" cy="250" r="14" fill="#86efac" stroke="#15803d"/><circle cx="250" cy="250" r="14" fill="#86efac" stroke="#15803d"/><text x="190" y="300" text-anchor="middle" font-size="13" font-weight="800" fill="#15803d">plenty of enzyme</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.1923;0.2154;1.0000" values="0;0;1;1" dur="13s" begin="dm-play.begin+0s" fill="freeze"/><circle cx="190" cy="380" r="46" fill="#78350f" stroke="#334155" stroke-width="2"/><text x="190" y="450" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">normal pigment</text></g></g>
<g class="part" data-part="ab" data-name="Heterozygote (Aa)" data-info="One functional allele usually makes enough enzyme for the normal phenotype, so the recessive allele has no visible effect: A is dominant." tabindex="0" role="button" aria-label="Heterozygote (Aa)"><rect x="390" y="80" width="320" height="400" rx="16" fill="#f8fafc" stroke="#cbd5e1"/><text x="550" y="110" text-anchor="middle" font-size="22" font-weight="800" fill="#111827">Aa</text><rect x="480" y="130" width="60" height="22" rx="6" fill="#16a34a" stroke="#334155"/><text x="510" y="146" text-anchor="middle" font-size="9" font-weight="800" fill="#fff">functional</text><rect x="560" y="130" width="60" height="22" rx="6" fill="#d6d3d1" stroke="#334155"/><text x="590" y="146" text-anchor="middle" font-size="9" font-weight="800" fill="#111827">faulty</text><g><animate attributeName="opacity" keyTimes="0.0000;0.3615;0.3846;1.0000" values="0;0;1;1" dur="13s" begin="dm-play.begin+0s" fill="freeze"/><circle cx="490" cy="210" r="14" fill="#86efac" stroke="#15803d"/><circle cx="550" cy="210" r="14" fill="#86efac" stroke="#15803d"/><circle cx="610" cy="210" r="14" fill="#86efac" stroke="#15803d"/><text x="550" y="300" text-anchor="middle" font-size="13" font-weight="800" fill="#15803d">enough enzyme</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.4769;0.5000;1.0000" values="0;0;1;1" dur="13s" begin="dm-play.begin+0s" fill="freeze"/><circle cx="550" cy="380" r="46" fill="#78350f" stroke="#334155" stroke-width="2"/><text x="550" y="450" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">normal pigment</text></g></g>
<g class="part" data-part="bb" data-name="Two recessive alleles (aa)" data-info="No functional enzyme: no pigment (albinism)." tabindex="0" role="button" aria-label="Two recessive alleles (aa)"><rect x="750" y="80" width="320" height="400" rx="16" fill="#f8fafc" stroke="#cbd5e1"/><text x="910" y="110" text-anchor="middle" font-size="22" font-weight="800" fill="#111827">aa</text><rect x="840" y="130" width="60" height="22" rx="6" fill="#d6d3d1" stroke="#334155"/><text x="870" y="146" text-anchor="middle" font-size="9" font-weight="800" fill="#111827">faulty</text><rect x="920" y="130" width="60" height="22" rx="6" fill="#d6d3d1" stroke="#334155"/><text x="950" y="146" text-anchor="middle" font-size="9" font-weight="800" fill="#111827">faulty</text><g><animate attributeName="opacity" keyTimes="0.0000;0.6462;0.6692;1.0000" values="0;0;1;1" dur="13s" begin="dm-play.begin+0s" fill="freeze"/><text x="910" y="230" text-anchor="middle" font-size="13" font-weight="800" fill="#b91c1c">no working enzyme</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.7615;0.7846;1.0000" values="0;0;1;1" dur="13s" begin="dm-play.begin+0s" fill="freeze"/><circle cx="910" cy="380" r="46" fill="#fef3c7" stroke="#334155" stroke-width="2"/><text x="910" y="450" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">no pigment: albino</text></g></g>
</svg>