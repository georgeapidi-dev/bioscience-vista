<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 680" class="vd-svg" role="img" aria-labelledby="hj-title hj-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="hj-play" data-vd-play-label="Play: movement at the hip" data-vd-steps="[[0, &quot;The hip: a synovial, ball-and-socket joint.&quot;], [1, &quot;The head of the femur (ball) fits into the acetabulum of the pelvis (socket).&quot;], [3, &quot;Ball and socket allows movement in all directions: forwards and back (flexion and extension)\u2026&quot;], [6.5, &quot;\u2026sideways (abduction) and rotation.&quot;], [10, &quot;Smooth cartilage and synovial fluid reduce friction; the capsule and ligaments hold the bones together.&quot;]]" data-vd-dur="14">
<title id="hj-title">The hip joint</title><desc id="hj-desc">A section through the hip, a synovial ball-and-socket joint: pelvis with acetabulum, femur head, articular cartilage, synovial fluid and membrane, capsule, ligaments and a muscle with tendon; the femur moves in several planes.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1150" height="680" fill="#ffffff"/>
<g aria-hidden="true"><animate id="hj-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<defs><linearGradient id="hj-b" x1="0" x2="1"><stop offset="0" stop-color="#fef3c7"/><stop offset="1" stop-color="#e7d7a8"/></linearGradient></defs>
<text class="head" x="30" y="34">The hip joint: a synovial ball-and-socket joint</text><text class="note" x="30" y="56">Simplified section through the joint, front view.</text>
<g class="part" data-part="pel" data-name="Pelvis (hip bone)" data-info="Contains the acetabulum, the cup-shaped socket of the joint." tabindex="0" role="button" aria-label="Pelvis (hip bone)"><path d="M 230 90 C 330 70 470 80 560 120 C 610 150 600 200 560 210 C 548 175 520 160 470 160 C 410 160 380 200 380 250 C 380 290 400 320 430 336 C 380 380 330 380 280 360 C 220 330 190 230 230 90 Z" fill="url(#hj-b)" stroke="#92400e" stroke-width="3"/><text x="300" y="200" font-size="14" font-weight="800" fill="#78350f">pelvis</text></g>
<g><animateTransform attributeName="transform" type="rotate" keyTimes="0.0000;0.2143;0.3214;0.4286;0.5357;0.6429;0.7143;1.0000" values="0 470 250;0 470 250;-28 470 250;18 470 250;0 470 250;-10 470 250;0 470 250;0 470 250" dur="14s" begin="hj-play.begin+0s" fill="freeze"/><g class="part" data-part="fem" data-name="Femur" data-info="The thigh bone. Its rounded head fits into the socket." tabindex="0" role="button" aria-label="Femur"><path d="M 500 300 C 540 330 560 360 580 400 L 620 650 L 680 650 L 660 400 C 670 360 690 340 710 330 L 670 280 C 630 300 580 300 540 260 Z" fill="url(#hj-b)" stroke="#92400e" stroke-width="3"/><circle cx="470" cy="250" r="74" fill="url(#hj-b)" stroke="#92400e" stroke-width="3"/><text x="620" y="550" font-size="14" font-weight="800" fill="#78350f" transform="rotate(80 620 550)">femur</text></g><g class="part" data-part="cart" data-name="Articular cartilage" data-info="Smooth, slightly flexible tissue covering the ends of the bones: reduces friction and absorbs shock." tabindex="0" role="button" aria-label="Articular cartilage"><circle cx="470" cy="250" r="70" fill="none" stroke="#bae6fd" stroke-width="10"/></g></g>
<path d="M 378 200 A 100 100 0 0 1 534 164" fill="none" stroke="#bae6fd" stroke-width="10"/>
<g class="part" data-part="syn" data-name="Synovial fluid" data-info="Lubricates the joint, reducing friction; it also nourishes the cartilage." tabindex="0" role="button" aria-label="Synovial fluid"><path d="M 382 210 A 90 90 0 0 1 526 174" fill="none" stroke="#38bdf8" stroke-width="7" opacity=".8"/></g>
<g class="part" data-part="mem" data-name="Synovial membrane" data-info="Lines the joint capsule and secretes synovial fluid." tabindex="0" role="button" aria-label="Synovial membrane"><path d="M 360 230 C 340 310 410 360 480 350" fill="none" stroke="#a855f7" stroke-width="4" stroke-dasharray="7 4"/><path d="M 560 160 C 610 210 610 290 580 320" fill="none" stroke="#a855f7" stroke-width="4" stroke-dasharray="7 4"/></g>
<g class="part" data-part="cap" data-name="Joint capsule and ligaments" data-info="Tough fibrous tissue; ligaments join bone to bone and stop the joint dislocating. Ligaments are slightly elastic." tabindex="0" role="button" aria-label="Joint capsule and ligaments"><path d="M 346 220 C 320 320 400 380 490 370" fill="none" stroke="#475569" stroke-width="8"/><path d="M 570 146 C 630 200 630 290 596 334" fill="none" stroke="#475569" stroke-width="8"/></g>
<g class="part" data-part="mus" data-name="Muscle and tendon" data-info="Muscles move the femur; tendons (inelastic) attach muscle to bone. Muscles work in antagonistic pairs." tabindex="0" role="button" aria-label="Muscle and tendon"><path d="M 590 150 C 680 220 700 320 690 420 L 672 430 C 660 330 640 240 575 175 Z" fill="#f87171" stroke="#991b1b" stroke-width="2" opacity=".9"/><path d="M 690 420 L 666 470" stroke="#e5e7eb" stroke-width="6"/></g>
<g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.2143;0.2357;0.4643;0.4857;1.0000" values="0;0;1;1;0;0" dur="14s" begin="hj-play.begin+0s" fill="freeze"/><rect x="775.0" y="188" width="170" height="24" rx="12" fill="#e0f2fe" stroke="#1f2937" stroke-width="1"/><text x="860" y="205" text-anchor="middle" font-size="12" font-weight="700">flexion / extension</text></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.4643;0.4857;0.7143;0.7357;1.0000" values="0;0;1;1;0;0" dur="14s" begin="hj-play.begin+0s" fill="freeze"/><rect x="765.0" y="228" width="190" height="24" rx="12" fill="#ede9fe" stroke="#1f2937" stroke-width="1"/><text x="860" y="245" text-anchor="middle" font-size="12" font-weight="700">abduction and rotation</text></g>
<g><animate attributeName="opacity" keyTimes="0.0000;0.7143;0.7357;1.0000" values="0;0;1;1" dur="14s" begin="hj-play.begin+0s" fill="freeze"/><rect x="820" y="440" width="300" height="150" rx="14" fill="#f8fafc" stroke="#cbd5e1"/><text x="836" y="466" font-size="14" font-weight="800">Types of synovial joint</text><text x="836" y="492" font-size="13">Ball and socket (hip, shoulder):</text><text x="836" y="510" font-size="13">movement in all directions</text><text x="836" y="536" font-size="13">Hinge (knee, elbow):</text><text x="836" y="554" font-size="13">movement in one plane</text></g>
<g class="labels"><g class="lbl" data-for="cart"><polyline points="287.6,414.0 430.0,200.0"/><circle cx="430.0" cy="200.0" r="2.6"/><text x="200" y="420" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="4">Articular cartilage</text></g><g class="lbl" data-for="syn"><polyline points="265.9,454.0 410.0,184.0"/><circle cx="410.0" cy="184.0" r="2.6"/><text x="200" y="460" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="4">Synovial fluid</text></g><g class="lbl" data-for="mem"><polyline points="278.9,494.0 346.0,290.0"/><circle cx="346.0" cy="290.0" r="2.6"/><text x="200" y="500" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="4">Synovial membrane</text></g><g class="lbl" data-for="cap"><polyline points="296.4,534.0 330.0,310.0"/><circle cx="330.0" cy="310.0" r="2.6"/><text x="200" y="540" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="4">Capsule and ligaments</text></g><g class="lbl" data-for="mus"><polyline points="815.0,324.0 680.0,300.0"/><circle cx="680.0" cy="300.0" r="2.6"/><text x="820" y="330" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="4">Muscle</text></g><g class="lbl" data-for="fem"><polyline points="815.0,394.0 650.0,580.0"/><circle cx="650.0" cy="580.0" r="2.6"/><text x="820" y="400" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="4">Femur</text></g><g class="lbl" data-for="pel"><polyline points="205.0,84.0 300.0,110.0"/><circle cx="300.0" cy="110.0" r="2.6"/><text x="200" y="90" text-anchor="end" paint-order="stroke" stroke="#fff" stroke-width="4">Pelvis (socket)</text></g></g>
</svg>