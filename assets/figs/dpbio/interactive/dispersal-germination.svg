e r="5" fill="#78350f"/></g></g></g>
<g class="part" data-part="germ" data-name="Germination" data-info="Needs water, oxygen and a suitable temperature. Water uptake activates enzymes (amylase, stimulated by gibberellin) that turn stored starch into sugars for the embryo; the radicle emerges, then the shoot." tabindex="0" role="button" aria-label="Germination"><rect x="610" y="80" width="460" height="460" rx="16" fill="#fefce8" stroke="#fde047"/><rect x="610" y="380" width="460" height="160" fill="#a16207" opacity=".3"/><ellipse cx="840" cy="330" rx="70" ry="44" fill="#fde68a" stroke="#a16207" stroke-width="3"/><g><animate attributeName="opacity" keyTimes="0.0000;0.4667;0.4867;1.0000" values="0;0;1;1" dur="15s" begin="dg-play.begin+0s" fill="freeze"/><circle cx="800" cy="318" r="7" fill="#e2e8f0" stroke="#64748b"/><circle cx="824" cy="318" r="7" fill="#e2e8f0" stroke="#64748b"/><circle cx="848" cy="318" r="7" fill="#e2e8f0" stroke="#64748b"/><circle cx="872" cy="318" r="7" fill="#e2e8f0" stroke="#64748b"/><circle cx="800" cy="340" r="7" fill="#e2e8f0" stroke="#64748b"/><circle cx="824" cy="340" r="7" fill="#e2e8f0" stroke="#64748b"/><circle cx="848" cy="340" r="7" fill="#e2e8f0" stroke="#64748b"/><circle cx="872" cy="340" r="7" fill="#e2e8f0" stroke="#64748b"/><text x="840" y="260" text-anchor="middle" font-size="12" font-weight="800" fill="#a16207">starch → sugars (amylase)</text><text x="840" y="240" text-anchor="middle" font-size="12" font-weight="800" fill="#0369a1">water in → gibberellin</text></g><clipPath id="dgr-c110360820"><rect x="820" y="360" width="40" height="160"><animate attributeName="width" keyTimes="0.0000;0.7333;0.8667;1.0000" values="0;0;40;40" dur="15s" begin="dg-play.begin+0s" fill="freeze"/></rect></clipPath><g clip-path="url(#dgr-c110360820)"><path d="M 840 370 Q 836 440 846 510" stroke="#f5f5f4" stroke-width="7" fill="none"/></g><clipPath id="dgs-c125150830"><rect x="830" y="150" width="80" height="140"><animate attributeName="width" keyTimes="0.0000;0.8333;0.9667;1.0000" values="0;0;80;80" dur="15s" begin="dg-play.begin+0s" fill="freeze"/></rect></clipPath><g clip-path="url(#dgs-c125150830)"><path d="M 860 290 Q 870 220 880 170 M 880 170 q -24 -6 -30 -20 q 22 0 30 20 q 14 -16 30 -18 q -10 18 -30 18" fill="#4ade80" stroke="#15803d" stroke-width="4"/></g><g><animate attributeName="opacity" keyTimes="0.0000;0.8667;0.8867;1.0000" values="0;0;1;1" dur="15s" begin="dg-play.begin+0s" fill="freeze"/><text x="930" y="480" text-anchor="start" font-size="12" font-weight="800" fill="#57534e">radicle first</text><text x="940" y="190" text-anchor="start" font-size="12" font-weight="800" fill="#15803d">then shoot</text></g><text x="840" y="106" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">needs water, O₂, suitable temperature</text></g>
