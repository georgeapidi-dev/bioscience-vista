<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" class="vd-svg" role="img" aria-labelledby="dg-title dg-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="dg-play" data-vd-play-label="Play: spread and sprout" data-vd-steps="[[0, &quot;Seed dispersal and germination.&quot;], [1, &quot;Seeds travel by wind, animals, water or explosion.&quot;], [7, &quot;Germination: water in, gibberellin, amylase, starch \u2192 sugars...&quot;], [11, &quot;...the radicle emerges first, then the shoot.&quot;]]" data-vd-dur="15">
<title id="dg-title">Seed dispersal and germination</title><desc id="dg-desc">Four ways seeds are dispersed, by wind, animals, water and explosive pods, and germination: water uptake triggers gibberellin and amylase to convert starch into sugars, then the radicle and shoot emerge.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="560" fill="#ffffff"/>
