<g class="part" data-part="disp" data-name="Seed dispersal" data-info="Moves seeds away from the parent plant, reducing competition and colonising new areas: wind (dandelion), animals (eaten fruits, hooks), water (coconut), explosive pods." tabindex="0" role="button" aria-label="Seed dispersal"><rect x="30" y="80" width="560" height="460" rx="16" fill="#f0fdf4" stroke="#86efac"/><text x="170" y="270" text-anchor="middle" font-size="12" font-weight="800" fill="#14532d">wind: dandelion</text><text x="450" y="270" text-anchor="middle" font-size="12" font-weight="800" fill="#14532d">animals: fruits, hooks</text><text x="170" y="490" text-anchor="middle" font-size="12" font-weight="800" fill="#14532d">water: coconut</text><text x="450" y="490" text-anchor="middle" font-size="12" font-weight="800" fill="#14532d">explosive pods</text><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.0000;0.0133;1.0000" values="0;0;1;1" dur="15s" begin="dg-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.0667;0.2000;1.0000" values="110 200;110 200;250 140;250 140" dur="15s" begin="dg-play.begin+0s" fill="freeze"/><g><line x1="0" y1="0" x2="0" y2="16" stroke="#57534e"/><line x1="0" y1="0" x2="10.0" y2="-0.0" stroke="#94a3b8"/><line x1="0" y1="0" x2="8.678191796776499" y2="-4.968801378437368" stroke="#94a3b8"/><line x1="0" y1="0" x2="5.062202572327784" y2="-8.624042272433384" stroke="#94a3b8"/><line x1="0" y1="0" x2="0.10796117058267392" y2="-9.999417202299663" stroke="#94a3b8"/><line x1="0" y1="0" x2="-4.8748210233435945" y2="-8.731329795075165" stroke="#94a3b8"/><line x1="0" y1="0" x2="-8.568887533689473" y2="-5.155013718214642" stroke="#94a3b8"/><line x1="0" y1="0" x2="-9.997668877129284" y2="-0.2159097572609596" stroke="#94a3b8"/></g></g></g><circle cx="420" cy="190" r="16" fill="#dc2626"/><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.0000;0.0133;1.0000" values="0;0;1;1" dur="15s" begin="