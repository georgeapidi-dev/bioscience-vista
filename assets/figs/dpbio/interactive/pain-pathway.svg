<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 540" class="vd-svg" role="img" aria-labelledby="pn2-title pn2-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="pn2-play" data-vd-play-label="Play: ouch" data-vd-steps="[[0, &quot;From skin to brain: detecting pain.&quot;], [1, &quot;Heat or a chemical opens channels in a free nerve ending.&quot;], [3.5, &quot;Na\u207a and Ca\u00b2\u207a rush in: depolarisation.&quot;], [6, &quot;Action potentials travel to the spinal cord and up to the brain.&quot;]]" data-vd-dur="13">
<title id="pn2-title">The pain pathway</title><desc id="pn2-desc">A free nerve ending in the skin opens ion channels in response to a harmful stimulus, positive ions enter and depolarise it, and action potentials travel along a sensory neuron to the spinal cord and up to the brain.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="540" fill="#ffffff"/>
<g aria-hidden="true"><animate id="pn2-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<text class="head" x="30" y="34">From skin to brain: the pain pathway</text><text class="note" x="30" y="56">Schematic.</text>
<rect x="40" y="380" width="320" height="140" fill="#fecdd3" stroke="#be123c"/><text x="200" y="506" text-anchor="middle" font-size="13" font-weight="800" fill="#9f1239">skin</text>
<g class="part" data-part="end" data-name="Free nerve endings" data-info="Pain neurons have free nerve endings in the skin with channel proteins that open in response to harmful stimuli (heat, acid, damage; capsaicin opens the heat channels too)." tabindex="0" role="button" aria-label="Free nerve endings"><path d="M 200 470 L 200 400 L 330 300" fill="none" stroke="#7c3aed" stroke-width="5"/><path d="M 200 470 l -30 30" stroke="#7c3aed" stroke-width="3"/><path d="M 200 470 l -10 30" stroke="#7c3aed" stroke-width="3"/><path d="M 200 470 l 10 30" stroke="#7c3aed" stroke-width="3"/><path d="M 200 470 l 30 30" stroke="#7c3aed" stroke-width="3"/><g><animate attributeName="opacity" keyTimes="0.0000;0.0769;0.1000;1.0000" values="0;0;1;1" dur="13s" begin="pn2-play.begin+0s" fill="freeze"/><rect x="164" y="490" width="12" height="18" fill="#22c55e" stroke="#14532d"/><rect x="184" y="490" width="12" height="18" fill="#22c55e" stroke="#14532d"/><rect x="204" y="490" width="12" height="18" fill="#22c55e" stroke="#14532d"/><rect x="224" y="490" width="12" height="18" fill="#22c55e" stroke="#14532d"/></g><g><animate attributeName="opacity" keyTimes="0.0000;0.0769;0.1000;1.0000" values="0;0;1;1" dur="13s" begin="pn2-play.begin+0s" fill="freeze"/><path d="M 60 372 q 20 -30 40 0 q 20 -30 40 0" fill="none" stroke="#f97316" stroke-width="5"/></g><text x="100" y="340" text-anchor="middle" font-size="12" font-weight="800" fill="#c2410c">heat / chemical</text></g>
<g class="part" data-part="dep" data-name="Depolarisation" data-info="Positive ions (Na⁺, Ca²⁺) enter, depolarising the nerve ending. If threshold is reached, action potentials start." tabindex="0" role="button" aria-label="Depolarisation"><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.2692;0.2846;0.4615;0.4769;1.0000" values="0;0;1;1;0;0" dur="13s" begin="pn2-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.2692;0.3692;1.0000" values="160 540;160 540;170 495;170 495" dur="13s" begin="pn2-play.begin+0s" fill="freeze"/><g><circle r="8" fill="#38bdf8" stroke="#0369a1"/><text x="0" y="3" text-anchor="middle" font-size="11" font-weight="800" fill="#fff">+</text></g></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.2923;0.3077;0.4615;0.4769;1.0000" values="0;0;1;1;0;0" dur="13s" begin="pn2-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.2923;0.3923;1.0000" values="185 540;185 540;190 495;190 495" dur="13s" begin="pn2-play.begin+0s" fill="freeze"/><g><circle r="8" fill="#38bdf8" stroke="#0369a1"/><text x="0" y="3" text-anchor="middle" font-size="11" font-weight="800" fill="#fff">+</text></g></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.3154;0.3308;0.4615;0.4769;1.0000" values="0;0;1;1;0;0" dur="13s" begin="pn2-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.3154;0.4154;1.0000" values="210 540;210 540;210 495;210 495" dur="13s" begin="pn2-play.begin+0s" fill="freeze"/><g><circle r="8" fill="#38bdf8" stroke="#0369a1"/><text x="0" y="3" text-anchor="middle" font-size="11" font-weight="800" fill="#fff">+</text></g></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.3385;0.3538;0.4615;0.4769;1.0000" values="0;0;1;1;0;0" dur="13s" begin="pn2-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.3385;0.4385;1.0000" values="235 540;235 540;230 495;230 495" dur="13s" begin="pn2-play.begin+0s" fill="freeze"/><g><circle r="8" fill="#38bdf8" stroke="#0369a1"/><text x="0" y="3" text-anchor="middle" font-size="11" font-weight="800" fill="#fff">+</text></g></g></g><g><animate attributeName="opacity" keyTimes="0.0000;0.3077;0.3308;1.0000" values="0;0;1;1" dur="13s" begin="pn2-play.begin+0s" fill="freeze"/><text x="260" y="440" text-anchor="start" font-size="12" font-weight="800" fill="#0369a1">Na⁺, Ca²⁺ in → depolarised</text></g></g>
<g class="part" data-part="path" data-name="To the brain" data-info="Impulses travel along sensory neurons to the spinal cord, then to the brain, where pain is perceived." tabindex="0" role="button" aria-label="To the brain"><path d="M 330 300 C 450 260 520 300 600 330" fill="none" stroke="#7c3aed" stroke-width="5"/><ellipse cx="640" cy="350" rx="50" ry="70" fill="#e5e7eb" stroke="#475569" stroke-width="2"/><text x="640" y="446" text-anchor="middle" font-size="12" font-weight="800" fill="#334155">spinal cord</text><path d="M 650 290 C 680 220 760 170 830 160" fill="none" stroke="#7c3aed" stroke-width="5"/><path d="M 820 110 Q 940 40 1040 120 Q 1080 200 1000 240 Q 900 260 820 220 Q 790 170 820 110 Z" fill="#fbcfe8" stroke="#9d174d" stroke-width="3"/><text x="940" y="186" text-anchor="middle" font-size="13" font-weight="800" fill="#9d174d">brain: pain felt</text><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.4615;0.4769;0.8308;0.8462;1.0000" values="0;0;1;1;0;0" dur="13s" begin="pn2-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.4615;0.5769;0.6923;0.8077;1.0000" values="330 300;330 300;600 330;700 210;860 165;860 165" dur="13s" begin="pn2-play.begin+0s" fill="freeze"/><polygon points="0,-10 12,0 0,10" fill="#facc15" stroke="#a16207"/></g></g></g>
