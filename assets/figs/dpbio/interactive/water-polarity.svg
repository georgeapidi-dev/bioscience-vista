<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" class="vd-svg" role="img" aria-labelledby="wp-title wp-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="wp-play" data-vd-play-label="Play: hydrogen bonds" data-vd-steps="[[0, &quot;Why water is polar.&quot;], [1, &quot;In each O\u2013H bond, oxygen pulls the shared pair of electrons closer.&quot;], [3.5, &quot;So oxygen is slightly negative (\u03b4\u2212) and hydrogen slightly positive (\u03b4+).&quot;], [6, &quot;Water molecules attract each other: hydrogen bonds between \u03b4+ H and \u03b4\u2212 O.&quot;], [9.5, &quot;In liquid water hydrogen bonds constantly break and re-form.&quot;]]" data-vd-dur="14">
<title id="wp-title">Polarity and hydrogen bonding</title><desc id="wp-desc">A polar O–H bond with the shared pair nearer oxygen, a water molecule with delta-negative oxygen and delta-positive hydrogens, and hydrogen bonds forming, breaking and re-forming between water molecules.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="560" fill="#ffffff"/>
<g aria-hidden="true"><animate id="wp-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<text class="head" x="30" y="34">Polarity and hydrogen bonding in water</text><text class="note" x="30" y="56">After EduVista A1.1 task sheet.</text>
<g class="part" data-part="pol" data-name="A polar covalent bond" data-info="Oxygen is more electronegative than hydrogen, so it pulls the shared pair closer: oxygen δ−, hydrogen δ+." tabindex="0" role="button" aria-label="A polar covalent bond"><circle cx="150" cy="190" r="38" fill="#c0392b"/><text x="150" y="198" text-anchor="middle" font-size="24" font-weight="800" fill="#fff">O</text><line x1="188" y1="190" x2="300" y2="190" stroke="#6b7280" stroke-width="4"/><circle cx="320" cy="190" r="22" fill="#fff" stroke="#6b7280" stroke-width="2"/><text x="320" y="196" text-anchor="middle" font-size="15" font-weight="800" fill="#111827">H</text><circle r="6" fill="#2e6fb5" cy="190"><animate attributeName="cx" values="245;245;205;205" keyTimes="0;0.071;0.214;1" dur="14s" begin="wp-play.begin" fill="freeze"/><set attributeName="cx" to="205" begin="0s"/></circle><circle r="6" fill="#2e6fb5" cy="190"><animate attributeName="cx" values="259;259;219;219" keyTimes="0;0.071;0.214;1" dur="14s" begin="wp-play.begin" fill="freeze"/><set attributeName="cx" to="219" begin="0s"/></circle><g><animate attributeName="opacity" keyTimes="0.0000;0.2500;0.2714;1.0000" values="0;0;1;1" dur="14s" begin="wp-play.begin+0s" fill="freeze"/><text x="150" y="260" text-anchor="middle" font-size="24" font-weight="800" fill="#c0392b">δ−</text><text x="320" y="240" text-anchor="middle" font-size="22" font-weight="800" fill="#2e6fb5">δ+</text></g><text x="235" y="300" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">oxygen pulls the shared pair closer</text></g>
<g class="part" data-part="mol" data-name="One water molecule" data-info="Bent shape (104.5°): δ− oxygen on one side, two δ+ hydrogens on the other, so the whole molecule is polar." tabindex="0" role="button" aria-label="One water molecule"><g><animate attributeName="opacity" keyTimes="0.0000;0.2500;0.2714;1.0000" values="0;0;1;1" dur="14s" begin="wp-play.begin+0s" fill="freeze"/><g transform="translate(130.0 450.0) rotate(0) scale(2.2)" opacity="1"><circle cx="-19.0" cy="-14.7" r="9" fill="#fff" stroke="#6b7280" stroke-width="1.5"/><circle cx="19.0" cy="-14.7" r="9" fill="#fff" stroke="#6b7280" stroke-width="1.5"/><circle r="14" fill="#c0392b" stroke="#7f1d1d" stroke-width="1.5"/><text x="0" y="5" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">O</text></g><text x="70" y="380" text-anchor="middle" font-size="18" font-weight="800" fill="#2e6fb5">δ+</text><text x="190" y="380" text-anchor="middle" font-size="18" font-weight="800" fill="#2e6fb5">δ+</text><text x="130" y="520" text-anchor="middle" font-size="20" font-weight="800" fill="#c0392b">δ−</text></g></g>
<g class="part" data-part="hb" data-name="Hydrogen bonding" data-info="A δ+ hydrogen of one molecule is attracted to the δ− oxygen of a neighbour. Each bond is weak, but there are vast numbers." tabindex="0" role="button" aria-label="Hydrogen bonding"><line x1="545" y1="207" x2="563" y2="267" stroke="#2e6fb5" stroke-width="3" stroke-dasharray="5 4" opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.4286;0.4500;1.0000" values="0;0;1;1" dur="14s" begin="wp-play.begin+0s" fill="freeze"/><animate attributeName="opacity" values="1;.15;1" dur="1.55s" begin="wp-play.begin+9.5s" repeatCount="indefinite"/></line><line x1="685" y1="207" x2="703" y2="267" stroke="#2e6fb5" stroke-width="3" stroke-dasharray="5 4" opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.4571;0.4786;1.0000" values="0;0;1;1" dur="14s" begin="wp-play.begin+0s" fill="freeze"/><animate attributeName="opacity" values="1;.15;1" dur="1.90s" begin="wp-play.begin+9.5s" repeatCount="indefinite"/></line><line x1="711" y1="430" x2="776" y2="423" stroke="#2e6fb5" stroke-width="3" stroke-dasharray="5 4" opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.4857;0.5071;1.0000" values="0;0;1;1" dur="14s" begin="wp-play.begin+0s" fill="freeze"/><animate attributeName="opacity" values="1;.15;1" dur="2.25s" begin="wp-play.begin+9.5s" repeatCount="indefinite"/></line><line x1="853" y1="156" x2="916" y2="159" stroke="#2e6fb5" stroke-width="3" stroke-dasharray="5 4" opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.5143;0.5357;1.0000" values="0;0;1;1" dur="14s" begin="wp-play.begin+0s" fill="freeze"/><animate attributeName="opacity" values="1;.15;1" dur="1.20s" begin="wp-play.begin+9.5s" repeatCount="indefinite"/></line><line x1="853" y1="416" x2="916" y2="419" stroke="#2e6fb5" stroke-width="3" stroke-dasharray="5 4" opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.5429;0.5643;1.0000" values="0;0;1;1" dur="14s" begin="wp-play.begin+0s" fill="freeze"/><animate attributeName="opacity" values="1;.15;1" dur="1.55s" begin="wp-play.begin+9.5s" repeatCount="indefinite"/></line><g transform="translate(520.0 160.0) rotate(200) scale(1.6)" opacity="1"><circle cx="-19.0" cy="-14.7" r="9" fill="#fff" stroke="#6b7280" stroke-width="1.5"/><circle cx="19.0" cy="-14.7" r="9" fill="#fff" stroke="#6b7280" stroke-width="1.5"/><circle r="14" fill="#c0392b" stroke="#7f1d1d" stroke-width="1.5"/></g><g transform="translate(570.0 290.0) rotate(-40) scale(1.6)" opacity="1"><circle cx="-19.0" cy="-14.7" r="9" fill="#fff" stroke="#6b7280" stroke-width="1.5"/><circle cx="19.0" cy="-14.7" r="9" fill="#fff" stroke="#6b7280" stroke-width="1.5"/><circle r="14" fill="#c0392b" stroke="#7f1d1d" stroke-width="1.5"/></g><g transform="translate(520.0 420.0) rotate(-40) scale(1.6)" opacity="1"><circle cx="-19.0" cy="-14.7" r="9" fill="#fff" stroke="#6b7280" stroke-width="1.5"/><circle cx="19.0" cy="-14.7" r="9" fill="#fff" stroke="#6b7280" stroke-width="1.5"/><circle r="14" fill="#c0392b" stroke="#7f1d1d" stroke-width="1.5"/></g><g transform="translate(660.0 160.0) rotate(200) scale(1.6)" opacity="1"><circle cx="-19.0" cy="-14.7" r="9" fill="#fff" stroke="#6b7280" stroke-width="1.5"/><circle cx="19.0" cy="-14.7" r="9" fill="#fff" stroke="#6b7280" stroke-width="1.5"/><circle r="14" fill="#c0392b" stroke="#7f1d1d" stroke-width="1.5"/></g><g transform="translate(710.0 290.0) rotate(0) scale(1.6)" opacity="1"><circle cx="-19.0" cy="-14.7" r="9" fill="#fff" stroke="#6b7280" stroke-width="1.5"/><circle cx="19.0" cy="-14.7" r="9" fill="#fff" stroke="#6b7280" stroke-width="1.5"/><circle r="14" fill="#c0392b" stroke="#7f1d1d" stroke-width="1.5"/></g><g transform="translate(660.0 420.0) rotate(160) scale(1.6)" opacity="1"><circle cx="-19.0" cy="-14.7" r="9" fill="#fff" stroke="#6b7280" stroke-width="1.5"/><circle cx="19.0" cy="-14.7" r="9" fill="#fff" stroke="#6b7280" stroke-width="1.5"/><circle r="14" fill="#c0392b" stroke="#7f1d1d" stroke-width="1.5"/></g><g transform="translate(800.0 160.0) rotate(30) scale(1.6)" opacity="1"><circle cx="-19.0" cy="-14.7" r="9" fill="#fff" stroke="#6b7280" stroke-width="1.5"/><circle cx="19.0" cy="-14.7" r="9" fill="#fff" stroke="#6b7280" stroke-width="1.5"/><circle r="14" fill="#c0392b" stroke="#7f1d1d" stroke-width="1.5"/></g><g transform="translate(850.0 290.0) rotate(0) scale(1.6)" opacity="1"><circle cx="-19.0" cy="-14.7" r="9" fill="#fff" stroke="#6b7280" stroke-width="1.5"/><circle cx="19.0" cy="-14.7" r="9" fill="#fff" stroke="#6b7280" stroke-width="1.5"/><circle r="14" fill="#c0392b" stroke="#7f1d1d" stroke-width="1.5"/></g><g transform="translate(800.0 420.0) rotate(30) scale(1.6)" opacity="1"><circle cx="-19.0" cy="-14.7" r="9" fill="#fff" stroke="#6b7280" stroke-width="1.5"/><circle cx="19.0" cy="-14.7" r="9" fill="#fff" stroke="#6b7280" stroke-width="1.5"/><circle r="14" fill="#c0392b" stroke="#7f1d1d" stroke-width="1.5"/></g><g transform="translate(940.0 160.0) rotate(0) scale(1.6)" opacity="1"><circle cx="-19.0" cy="-14.7" r="9" fill="#fff" stroke="#6b7280" stroke-width="1.5"/><circle cx="19.0" cy="-14.7" r="9" fill="#fff" stroke="#6b7280" stroke-width="1.5"/><circle r="14" fill="#c0392b" stroke="#7f1d1d" stroke-width="1.5"/></g><g transform="translate(990.0 290.0) rotate(-40) scale(1.6)" opacity="1"><circle cx="-19.0" cy="-14.7" r="9" fill="#fff" stroke="#6b7280" stroke-width="1.5"/><circle cx="19.0" cy="-14.7" r="9" fill="#fff" stroke="#6b7280" stroke-width="1.5"/><circle r="14" fill="#c0392b" stroke="#7f1d1d" stroke-width="1.5"/></g><g transform="translate(940.0 420.0) rotate(160) scale(1.6)" opacity="1"><circle cx="-19.0" cy="-14.7" r="9" fill="#fff" stroke="#6b7280" stroke-width="1.5"/><circle cx="19.0" cy="-14.7" r="9" fill="#fff" stroke="#6b7280" stroke-width="1.5"/><circle r="14" fill="#c0392b" stroke="#7f1d1d" stroke-width="1.5"/></g><g><animate attributeName="opacity" keyTimes="0.0000;0.4286;0.4500;1.0000" values="0;0;1;1" dur="14s" begin="wp-play.begin+0s" fill="freeze"/><text x="780" y="520" text-anchor="middle" font-size="13" font-weight="800" fill="#2e6fb5">hydrogen bonds (dashed): δ+ H attracted to δ− O of a neighbour</text></g></g>
<g class="part" data-part="dyn" data-name="Constantly breaking and re-forming" data-info="In liquid water hydrogen bonds last only a tiny fraction of a second before breaking and forming again with other molecules." tabindex="0" role="button" aria-label="Constantly breaking and re-forming"><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.6786;0.7000;1.0000" values="0;0;1;1" dur="14s" begin="wp-play.begin+0s" fill="freeze"/><rect x="630.0" y="88" width="300" height="24" rx="12" fill="#e8f1fb" stroke="#1f2937" stroke-width="1"/><text x="780" y="105" text-anchor="middle" font-size="12" font-weight="700">bonds break and re-form all the time</text></g></g>
</svg>