<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" class="vd-svg" role="img" aria-labelledby="vr-title vr-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="vr-play" data-vd-play-label="Play: spot the differences" data-vd-steps="[[0, &quot;Variation is a defining feature of life.&quot;], [1, &quot;Within a species: every individual is different, but the differences are small and continuous.&quot;], [5, &quot;Measure them and a continuous range appears.&quot;], [9, &quot;Between species the differences are larger and discontinuous.&quot;]]" data-vd-dur="14">
<title id="vr-title">Variation within and between species</title><desc id="vr-desc">Individuals of one species differ slightly and continuously, giving a bell-shaped range of heights; different species differ by much larger, discontinuous amounts.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="560" fill="#ffffff"/>
<g aria-hidden="true"><animate id="vr-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<text class="head" x="30" y="34">Variation within and between species</text><text class="note" x="30" y="56">Schematic.</text>
