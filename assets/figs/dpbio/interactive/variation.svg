" cy="-58" r="11" fill="#fbbf24" stroke="#7c2d12" stroke-width="1.5"/><path d="M -13 -44 L 13 -44 L 16 -6 L 8 -6 L 6 24 L -6 24 L -8 -6 L -16 -6 Z" fill="#fbbf24" stroke="#7c2d12" stroke-width="1.5"/></g></g><g><animate attributeName="opacity" keyTimes="0.0000;0.3571;0.3786;1.0000" values="0;0;1;1" dur="14s" begin="vr-play.begin+0s" fill="freeze"/><rect x="84" y="491" width="40" height="9" fill="#fbbf24" stroke="#b45309"/></g><g><animate attributeName="opacity" keyTimes="0.0000;0.3786;0.4000;1.0000" values="0;0;1;1" dur="14s" begin="vr-play.begin+0s" fill="freeze"/><rect x="130" y="473" width="40" height="27" fill="#fbbf24" stroke="#b45309"/></g><g><animate attributeName="opacity" keyTimes="0.0000;0.4000;0.4214;1.0000" values="0;0;1;1" dur="14s" begin="vr-play.begin+0s" fill="freeze"/><rect x="176" y="437" width="40" height="63" fill="#fbbf24" stroke="#b45309"/></g><g><animate attributeName="opacity" keyTimes="0.0000;0.4214;0.4429;1.0000" values="0;0;1;1" dur="14s" begin="vr-play.begin+0s" fill="freeze"/><rect x="222" y="392" width="40" height="108" fill="#fbbf24" stroke="#b45309"/></g><g><animate attributeName="opacity" keyTimes="0.0000;0.4429;0.4643;1.0000" values="0;0;1;1" dur="14s" begin="vr-play.begin+0s" fill="freeze"/><rect x="268" y="365" width="40" height="135" fill="#fbbf24" stroke="#b45309"/></g><g><animate attributeName="opacity" keyTimes="0.0000;0.4643;0.4857;1.0000" values="0;0;1;1" dur="14s" begin="vr-play.begin+0s" fill="freeze"/><rect x="314" y="392" width="40" height="108" fill="#fbbf24" stroke="#b45309"/></g><g><animate attributeName="opacity" keyTimes="0.0000;0.4857;0.5071;1.0000" values="0;0;1;1" dur="14s" begin="vr-play.begin+0s" fill="freeze"/><rect x="360" y="437" width="40" height="63" fill="#fbbf24" stroke="#b45309"/></g><g><animate attributeName="opacity" keyTimes="0.0000;0.5071;0.5286;1.0000" values="0;0;1;1" dur="14s" begin="vr-play.begin+0s" fill="freeze"/><rect x="406" y="473" width="40" height="27" fill="#fbbf24" stroke="#b45309"/></g><g><animate attributeName="opacity" keyTimes="0.0000;0.5286;0.5500;1.0000" values="0;0;1;1" dur="14s" begin="vr-play.begin+0s" fill="freeze"/><rect x="452" y="491" width="40" height="9" fill="#fbbf24" stroke="#b45309"/></g><line x1="80" y1="500" x2="500" y2="500" stroke="#111827" stroke-width="2"/><text x="290.0" y="522" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">height →</text><text x="290.0" y="340" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">number of individuals</text></g>
<g class="part" data-part="curve" data-name="Continuous variation" data-info="Measured traits such as height form a range with most individuals near the middle." tabindex="0" role="button" aria-label="Continuous variation"><g><animate attributeName="opacity" keyTimes="0.0000;0.5714;0.5929;1.0000" values="0;0;1;1" dur="14s" begin="vr-play.begin+0s" fill="freeze"/><path d="M 100 491 C 230 480 240 360 290 360 C 340 360 350 480 480 491" fill="none" stroke="#b45309" stroke-width="3"/></g></g>
<g class="part" data-part="between" data-name="Variation between species" data-info="Usually larger and discontinuous: a lion never looks like a leopard." tabindex="0" role="button" aria-label="Variation between species"><rect x="570" y="80" width="500" height="460" rx="16" fill="#eff6ff" stroke="#93c5fd"/><text x="820" y="108" text-anchor="middle" font-size="15" font-weight="800" fill="#1d4ed8">BETWEEN species: large, discontinuous</text><g><animate attributeName="opacity" keyTimes="0.0000;0.6429;0.6643;1.0000" values="0;0;1;1" dur="14s" begin="vr-play.begin+0s" fill="freeze"/><ellipse cx="660" cy="280" rx="60" ry="30" fill="#f59e0b" stroke="#334155" stroke-width="2"/><circle cx="722" cy="256" r="20" fill="#f59e0b" stroke="#334155" stroke-width="2"/><rect x="616" y="302" width="9" height="40" fill="#f59e0b" stroke="#334155"/><rect x="636" y="302" width="9" height="40" fill="#f59e0b" stroke="#334155"/><rect x="680" y="302" width="9" height="40" fill="#f59e0b" stroke="#334155"/><rect x="698" y="302" width="9" height="40" fill="#f59e0b" stroke="#334155"/><circle cx="718" cy="256" r="30" fill="#b45309" opacity=".7"/><circle cx="722" cy="256" r="18" fill="#f59e0b" stroke="#334155"/><text x="670" y="380" text-anchor="middle" font-size="14" font-weight="800" fill="#111827">lion</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.7000;0.7214;1.0000" values="0;0;1;1" dur="14s" begin="vr-play.begin+0s" fill="freeze"/><ellipse cx="820" cy="280" rx="60" ry="30" fill="#fde68a" stroke="#334155" stroke-width="2"/><circle cx="882" cy="256" r="20" fill="#fde68a" stroke="#334155" stroke-width="2"/><rect x="776" y="302" width="9" height="40" fill="#fde68a" stroke="#334155"/><rect x="796" y="302" width="9" height="40" fill="#fde68a" stroke="#334155"/><rect x="840" y="302" width="9" height="40" fill="#fde68a" stroke="#334155"/><rect x="858" y="302" width="9" height="40" fill="#fde68a" stroke="#334155"/><circle cx="790" cy="272" r="5" fill="#78350f"/><circle cx="810" cy="28