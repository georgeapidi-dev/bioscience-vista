<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" class="vd-svg" role="img" aria-labelledby="dk-title dk-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="dk-play" data-vd-play-label="Play: key it out" data-vd-steps="[[0, &quot;A dichotomous key: two choices at each step.&quot;], [1, &quot;Question 1: wings or no wings?&quot;], [5, &quot;Each question divides the group into two.&quot;], [10, &quot;Follow the branches to a name.&quot;]]" data-vd-dur="14">
<title id="dk-title">Dichotomous key</title><desc id="dk-desc">A dichotomous key for four invertebrates: first question wings or not, then number of legs or body shape, each splitting the group in two until each animal is named.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="560" fill="#ffffff"/>
<g aria-hidden="true"><animate id="dk-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<defs><marker id="dk-475569" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="5.4" refY="6.0" orient="auto"><path d="M0,0 L12,6.0 L0,12 z" fill="#475569"/></marker></defs>
<text class="head" x="30" y="34">Using a dichotomous key</text><text class="note" x="30" y="56">Four invertebrates.</text>
<g class="part" data-part="q1" data-name="Question 1" data-info="Each step asks one question with two answers about a visible feature." tabindex="0" role="button" aria-label="Question 1"><g><animate attributeName="opacity" keyTimes="0.0000;0.0714;0.0929;1.0000" values="0;0;1;1" dur="14s" begin="dk-play.begin+0s" fill="freeze"/><rect x="400.0" y="85.0" width="300" height="50" rx="12" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/><text x="550" y="114.66666666666667" text-anchor="middle" font-size="14" font-weight="800" fill="#111827">1  Has wings?</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.2857;0.3071;1.0000" values="0;0;1;1" dur="14s" begin="dk-play.begin+0s" fill="freeze"/><rect x="130.0" y="225.0" width="300" height="50" rx="12" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/><text x="280" y="254.66666666666666" text-anchor="middle" font-size="14" font-weight="800" fill="#111827">2  Two pairs of wings?</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.2857;0.3071;1.0000" values="0;0;1;1" dur="14s" begin="dk-play.begin+0s" fill="freeze"/><rect x="670.0" y="225.0" width="300" height="50" rx="12" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/><text x="820" y="254.66666666666666" text-anchor="middle" font-size="14" font-weight="800" fill="#111827">3  Eight legs?</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.2143;0.2357;1.0000" values="0;0;1;1" dur="14s" begin="dk-play.begin+0s" fill="freeze"/><path d="M 450 130 L 330 222" stroke="#475569" stroke-width="3" marker-end="url(#dk-475569)"/><text x="370" y="168" text-anchor="middle" font-size="13" font-weight="800" fill="#15803d">yes</text><path d="M 650 130 L 770 222" stroke="#475569" stroke-width="3" marker-end="url(#dk-475569)"/><text x="730" y="168" text-anchor="middle" font-size="13" font-weight="800" fill="#b91c1c">no</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.5000;0.5214;1.0000" values="0;0;1;1" dur="14s" begin="dk-play.begin+0s" fill="freeze"/><path d="M 280 278 L 150 380" stroke="#475569" stroke-width="3" marker-end="url(#dk-475569)"/><text x="201.0" y="329.0" text-anchor="middle" font-size="12" font-weight="800" fill="#15803d">yes</text><rect x="60" y="384" width="180" height="60" rx="14" fill="#fff" stroke="#f59e0b" stroke-width="3"/><text x="150" y="420" text-anchor="middle" font-size="15" font-weight="800" fill="#111827">butterfly</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.5429;0.5643;1.0000" values="0;0;1;1" dur="14s" begin="dk-play.begin+0s" fill="freeze"/><path d="M 280 278 L 410 380" stroke="#475569" stroke-width="3" marker-end="url(#dk-475569)"/><text x="359.0" y="329.0" text-anchor="middle" font-size="12" font-weight="800" fill="#b91c1c">no</text><rect x="320" y="384" width="180" height="60" rx="14" fill="#fff" stroke="#64748b" stroke-width="3"/><text x="410" y="420" text-anchor="middle" font-size="15" font-weight="800" fill="#111827">housefly</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.5857;0.6071;1.0000" values="0;0;1;1" dur="14s" begin="dk-play.begin+0s" fill="freeze"/><path d="M 820 278 L 690 380" stroke="#475569" stroke-width="3" marker-end="url(#dk-475569)"/><text x="741.0" y="329.0" text-anchor="middle" font-size="12" font-weight="800" fill="#15803d">yes</text><rect x="600" y="384" width="180" height="60" rx="14" fill="#fff" stroke="#7c3aed" stroke-width="3"/><text x="690" y="420" text-anchor="middle" font-size="15" font-weight="800" fill="#111827">spider</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.6286;0.6500;1.0000" values="0;0;1;1" dur="14s" begin="dk-play.begin+0s" fill="freeze"/><path d="M 820 278 L 950 380" stroke="#475569" stroke-width="3" marker-end="url(#dk-475569)"/><text x="899.0" y="329.0" text-anchor="middle" font-size="12" font-weight="800" fill="#b91c1c">no</text><rect x="860" y="384" width="180" height="60" rx="14" fill="#fff" stroke="#94a3b8" stroke-width="3"/><text x="950" y="420" text-anchor="middle" font-size="15" font-weight="800" fill="#111827">woodlouse</text></g></g>
<g class="part" data-part="q2" data-name="Following the branches" data-info="Follow the answer that fits until you reach a name." tabindex="0" role="button" aria-label="Following the branches"></g>
<g class="part" data-part="use" data-name="Writing a good key" data-info="Use features you can see or measure (number of legs, wings present), never size alone or behaviour; each question splits the group in two." tabindex="0" role="button" aria-label="Writing a good key"><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.7143;0.7357;1.0000" values="0;0;1;1" dur="14s" begin="dk-play.begin+0s" fill="freeze"/><rect x="270.0" y="518" width="560" height="24" rx="12" fill="#fef3c7" stroke="#1f2937" stroke-width="1"/><text x="550" y="535" text-anchor="middle" font-size="12" font-weight="700">good questions: visible features with two clear answers (not "big or small")</text></g></g>
</svg>