<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 590" class="vd-svg" role="img" aria-labelledby="cs4-title cs4-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="cs4-play" data-vd-play-label="Play: near and far" data-vd-steps="[[0, &quot;Local or distant signalling?&quot;], [1, &quot;Neurotransmitters cross a 20 nm gap to the next cell: milliseconds.&quot;], [5, &quot;Hormones are released into the blood and carried around the body...&quot;], [9.5, &quot;...to target cells far away, with the right receptors.&quot;]]" data-vd-dur="15">
<title id="cs4-title">Localized and distant signals</title><desc id="cs4-desc">A neurotransmitter crossing a 20 nanometre synaptic gap to the adjacent cell compared with a hormone carried by the blood from an endocrine gland to distant target cells with matching receptors.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="590" fill="#ffffff"/>
<g aria-hidden="true"><animate id="cs4-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<text class="head" x="30" y="34">Localized and distant signals</text><text class="note" x="30" y="56">Not to scale.</text>
<g class="part" data-part="loc" data-name="Localized: neurotransmitters" data-info="Diffuse across a synaptic gap of about 20 nm to the adjacent cell: very fast, very local effects." tabindex="0" role="button" aria-label="Localized: neurotransmitters"><rect x="30" y="80" width="400" height="460" rx="16" fill="#f5f3ff" stroke="#c4b5fd"/><text x="230" y="108" text-anchor="middle" font-size="15" font-weight="800" fill="#6d28d9">LOCALIZED — neurotransmitter</text><path d="M 120 130 L 340 130 L 340 260 Q 340 300 300 300 L 160 300 Q 120 300 120 260 Z" fill="#ede9fe" stroke="#6d28d9" stroke-width="3"/><text x="230" y="160" text-anchor="middle" font-size="13" font-weight="800" fill="#5b21b6">neuron ending</text><rect x="110" y="340" width="240" height="120" rx="10" fill="#fff7ed" stroke="#334155" stroke-width="3"/><text x="230" y="420" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">next cell</text><path d="M 160 340 L 160 328 L 166 328 L 170 334 L 174 328 L 180 328 L 180 340 Z" fill="#60a5fa"/><path d="M 220 340 L 220 328 L 226 328 L 230 334 L 234 328 L 240 328 L 240 340 Z" fill="#60a5fa"/><path d="M 280 340 L 280 328 L 286 328 L 290 334 L 294 328 L 300 328 L 300 340 Z" fill="#60a5fa"/><line x1="370" y1="300" x2="370" y2="340" stroke="#111827" stroke-width="2"/><text x="376" y="325" text-anchor="start" font-size="12" font-weight="800" fill="#111827">≈ 20 nm</text><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.0800;0.0933;1.0000" values="0;0;1;1" dur="15s" begin="cs4-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.0800;0.1333;1.0000" values="200 280;200 280;170 326;170 326" dur="15s" begin="cs4-play.begin+0s" fill="freeze"/><circle r="5" fill="#8b5cf6"/></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.0800;0.0933;1.0000" values="0;0;1;1" dur="15s" begin="cs4-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="tran