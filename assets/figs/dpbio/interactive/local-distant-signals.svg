0;260 280;170 326;170 326" dur="15s" begin="cs4-play.begin+0s" fill="freeze"/><circle r="5" fill="#8b5cf6"/></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.0800;0.0933;1.0000" values="0;0;1;1" dur="15s" begin="cs4-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.1173;0.1707;1.0000" values="270 280;270 280;230 326;230 326" dur="15s" begin="cs4-play.begin+0s" fill="freeze"/><circle r="5" fill="#8b5cf6"/></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.0800;0.0933;1.0000" values="0;0;1;1" dur="15s" begin="cs4-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.1227;0.1760;1.0000" values="280 280;280 280;290 326;290 326" dur="15s" begin="cs4-play.begin+0s" fill="freeze"/><circle r="5" fill="#8b5cf6"/></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.1333;0.1533;1.0000" values="0;0;1;1" dur="15s" begin="cs4-play.begin+0s" fill="freeze"/><rect x="150.0" y="488" width="160" height="24" rx="12" fill="#ede9fe" stroke="#1f2937" stroke-width="1"/><text x="230" y="505" text-anchor="middle" font-size="12" font-weight="700">⏱ milliseconds</text></g></g>
<g class="part" data-part="dist" data-name="Distant: hormones" data-info="Carried by the blood throughout the body; act on any cell with the right receptors, but take longer to arrive." tabindex="0" role="button" aria-label="Distant: hormones"><rect x="460" y="80" width="610" height="460" rx="16" fill="#fef2f2" stroke="#fecaca"/><text x="765" y="108" text-anchor="middle" font-size="15" font-weight="800" fill="#b91c1c">DISTANT — hormone</text><path d="M 560 200 C 560 130 980 130 980 220 C 980 330 980 420 880 440 C 760 460 600 450 560 380 C 530 330 560 260 560 200 Z" fill="none" stroke="#fca5a5" stroke-width="26"/><path d="M 560 200 C 560 130 980 130 980 220 C 980 330 980 420 880 440 C 760 460 600 450 560 380 C 530 330 560 260 560 200 Z" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 6"/><text x="765" y="165" text-anchor="middle" font-size="13" font-weight="800" fill="#b91c1c">bloodstream</text><ellipse cx="530" cy="290" rx="40" ry="30" fill="#fecaca" stroke="#991b1b" stroke-width="2"/><text x="530" y="294" text-anchor="middle" font-size="12" font-weight="800" fill="#7f1d1d">gland</text><circle cx="1030" cy="300" r="28" fill="#fff7ed" stroke="#334155" stroke-width="2"><animate attributeName="fill" keyTimes="0.0000;0.7333;0.7667;1.0000" values="#fff7ed;#fff7ed;#fde047;#fde047" dur="15s" begin="cs4-play.begin+0s" fill="freeze"/></circle><text x="1030" y="346" text-anchor="middle" font-size="11" font-weight="800" fill="#111827">target</text><circle cx="820" cy="500" r="28" fill="#fff7ed" stroke="#334155" stroke-width="2"><animate attributeName="fill" keyTimes="0.0000;0.7333;0.7667;1.0000" values="#fff7ed;#fff7ed;#fde047;#fde047" dur="15s" begin="cs4-play.begin+0s" fill="freeze"/></circle><text x="820" y="546" text-anchor="middle" font-size="11" font-weight="800" fill="#111827">target</text><circle cx="700" cy="300" r="28" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/><text x="700" y="345" text-anchor="middle" font-size="11" font-weight="800" fill="#64748b">no receptor</text><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.3333;0.3467;1.0000" values="0;0;1;1" dur="15s" begin="cs4-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.3333;0.4133;0.4933;0.5733;0.6533;0.7333;1.0000" values="568 300;568 300;560 200;700 150;900 160;980 230;1002 300;1002 300" dur="15s" begin="cs4-play.begin+0s" fill="freeze"/><circle r="7" fill="#ef4444" stroke="#7f1d1d"/></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.3600;0.3733;1.0000" values="0;0;1;1" dur="15s" begin="cs4-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.3600;0.4400;0.5200;0.6000;0.6800;0.7600;1.0000" values="568 300;568 300;560 200;700 150;900 160;980 230;1002 300;1002 300" dur="15s" begin="cs4-play.begin+0s" fill="freeze"/><circle r="7" fill="#ef4444" stroke="#7f1d1d"/></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.3867;0.4000;1.0000" values="0;0;1;1" dur="15s" begin="cs4-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.3867;0.4667;0.5467;0.6267;0.7067;0.7867;1.0000" values="568 300;568 300;560 200;700 150;900 160;980 230;1002 300;1002 300" dur="15s" begin="cs4-play.begin+0s" fill="freeze"/><circle r="7" fill="#ef4444" stroke="#7f1d1d"/></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.3667;0.3800;1.0000" values="0;0;1;1" dur="15s" begin="cs4-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.3667;0.4733;0.5800;0.6867;1.0000" values="568 300;568 300;550 380;650 440;800 456;800 456" dur="15s" begin="cs4-play.begin+0s" fill="freeze"/><circle r="7" fill="#ef4444" stroke="#7f1d1d"/></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.3933;0.4067;1.0000" values="0;0;1;1" dur="15s" begin="cs4-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.3933;0.5000;0.6067;0.7133;1.0000" values="568 300;568 300;550 380;650 440;800 456;800 456" dur="15s" begin="cs4-play.begin+0s" fill="freeze"/><circle r="7" fill="#ef4444" stroke="#7f1d1d"/></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.4200;0.4333;1.0000" values="0;0;1;1" dur="15s" begin="cs4-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.4200;0.5267;0.6333;0.7400;1.0000" values="568 300;568 300;550 380;650 440;800 456;800 456" dur="15s" begin="cs4-play.begin+0s" fill="freeze"/><circle r="7" fill="#ef4444" stroke="#7f1d1d"/></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.6000;0.6200;1.0000" values="0;0;1;1" dur="15s" begin="cs4-play.begin+0s" fill="freeze"/><rect x="790.0" y="368" width="180" height="24" rx="12" fill="#fee2e2" stroke="#1f2937" stroke-width="1"/><text x="880" y="385" text-anchor="middle" font-size="12" font-weight="700">⏱ seconds to hours</text></g></g>
<g class="part" data-part="time" data-name="Time scale" data-info="Neurotransmitters act within milliseconds; hormones take seconds to hours to arrive, and their effects last longer." tabindex="0" role="button" aria-label="Time scale"><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.8000;0.8200;1.0000" values="0;0;1;1" dur="15s" begin="cs4-play.begin+0s" fill="freeze"/><rect x="270.0" y="556" width="560" height="24" rx="12" fill="#f1f5f9" stroke="#1f2937" stroke-width="1"/><text x="550" y="573" text-anchor="middle" font-size="12" font-weight="700">local = fast and brief · distant = slower but widespread and longer-lasting</text></g></g>
</svg>