<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" class="vd-svg" role="img" aria-labelledby="rb-title rb-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1">
<title id="rb-title">Mammalian red blood cell</title><desc id="rb-desc">A mammalian red blood cell in face view and in section, showing the biconcave shape, haemoglobin, flexible membrane, and no nucleus or mitochondria.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="560" fill="#ffffff"/>
<text class="head" x="30" y="36">Atypical cell: mammalian red blood cell</text><text class="note" x="30" y="58">Mature red blood cells have no nucleus and no mitochondria.</text>
<g class="part" data-part="face" data-name="Face view" data-info="Seen from above it is round, about 7–8 µm across, paler in the middle where it is thinnest." tabindex="0" role="button" aria-label="Face view"><circle cx="300" cy="300" r="170" fill="#ef4444"/><circle cx="300" cy="300" r="80" fill="#f87171"/><circle cx="300" cy="300" r="40" fill="#fca5a5"/></g>
<g class="part" data-part="mem" data-name="Flexible membrane" data-info="Lets the cell fold to squeeze through capillaries narrower than itself." tabindex="0" role="button" aria-label="Flexible membrane"><circle cx="300" cy="300" r="170" fill="none" stroke="#7f1d1d" stroke-width="4"/></g>
<g class="part" data-part="sect" data-name="Section: biconcave disc" data-info="Thinner in the middle (about 1 µm) than at the edge (about 2.5 µm): a large surface area to volume ratio and a short diffusion distance for oxygen." tabindex="0" role="button" aria-label="Section: biconcave disc"><path d="M 590.0 300.0 L 594.8 279.3 L 599.5 272.9 L 604.2 269.3 L 609.0 267.1 L 613.8 265.9 L 618.5 265.4 L 623.2 265.3 L 628.0 265.6 L 632.8 266.0 L 637.5 266.7 L 642.2 267.4 L 647.0 268.3 L 651.8 269.2 L 656.5 270.1 L 661.2 271.1 L 666.0 272.0 L 670.8 272.9 L 675.5 273.8 L 680.2 274.7 L 685.0 275.5 L 689.8 276.4 L 694.5 277.1 L 699.2 277.9 L 704.0 278.6 L 708.8 279.2 L 713.5 279.8 L 718.2 280.4 L 723.0 280.9 L 727.8 281.4 L 732.5 281.9 L 737.2 282.3 L 742.0 282.6 L 746.8 283.0 L 751.5 283.2 L 756.2 283.5 L 761.0 283.7 L 765.8 283.8 L 770.5 283.9 L 775.2 284.0 L 780.0 284.0 L 784.8 284.0 L 789.5 283.9 L 794.2 283.8 L 799.0 283.7 L 803.8 283.5 L 808.5 283.2 L 813.2 283.0 L 818.0 282.6 L 822.8 282.3 L 827.5 281.9 L 832.2 281.4 L 837.0 280.9 L 841.8 280.4 L 846.5 279.8 L 851.2 279.2 L 856.0 278.6 L 860.8 277.9 L 865.5 277.1 L 870.2 276.4 L 875.0 275.5 L 879.8 274.7 L 884.5 273.8 L 889.2 272.9 L 894.0 272.0 L 898.8 271.1 L 903.5 270.1 L 908.2 269.2 L 913.0 268.3 L 917.8 267.4 L 922.5 266.7 L 927.2 266.0 L 932.0 265.6 L 936.8 265.3 L 941.5 265.4 L 946.2 265.9 L 951.0 267.1 L 955.8 269.3 L 960.5 272.9 L 965.2 279.3 L 970.0 300.0 L 970.0 300.0 L 965.2 320.7 L 960.5 327.1 L 955.8 330.7 L 951.0 332.9 L 946.2 334.1 L 941.5 334.6 L 936.8 334.7 L 932.0 334.4 L 927.2 334.0 L 922.5 333.3 L 917.8 332.6 L 913.0 331.7 L 908.2 330.8 L 903.5 329.9 L 898.8 328.9 L 894.0 328.0 L 889.2 327.1 L 884.5 326.2 L 879.8 325.3 L 875.0 324.5 L 870.2 323.6 L 865.5 322.9 L 860.8 322.1 L 856.0 321.4 L 851.2 320.8 L 846.5 320.2 L 841.8 319.6 L 837.0 319.1 L 832.2 318.6 L 827.5 318.1 L 822.8 317.7 L 818.0 317.4 L 813.2 317.0 L 808.5 316.8 L 803.8 316.5 L 799.0 316.3 L 794.2 316.2 L 789.5 316.1 L 784.8 316.0 L 780.0 316.0 L 775.2 316.0 L 770.5 316.1 L 765.8 316.2 L 761.0 316.3 L 756.2 316.5 L 751.5 316.8 L 746.8 317.0 L 742.0 317.4 L 737.2 317.7 L 732.5 318.1 L 727.8 318.6 L 723.0 319.1 L 718.2 319.6 L 713.5 320.2 L 708.8 320.8 L 704.0 321.4 L 699.2 322.1 L 694.5 322.9 L 689.8 323.6 L 685.0 324.5 L 680.2 325.3 L 675.5 326.2 L 670.8 327.1 L 666.0 328.0 L 661.2 328.9 L 656.5 329.9 L 651.8 330.8 L 647.0 331.7 L 642.2 332.6 L 637.5 333.3 L 632.8 334.0 L 628.0 334.4 L 623.2 334.7 L 618.5 334.6 L 613.8 334.1 L 609.0 332.9 L 604.2 330.7 L 599.5 327.1 L 594.8 320.7 L 590.0 300.0 Z" fill="#ef4444" stroke="#7f1d1d" stroke-width="4"/></g>
<g class="part" data-part="hb" data-name="Haemoglobin" data-info="The cytoplasm is packed with haemoglobin, which carries oxygen as oxyhaemoglobin." tabindex="0" role="button" aria-label="Haemoglobin"><circle cx="250" cy="240" r="4" fill="#991b1b"/><circle cx="360" cy="260" r="4" fill="#991b1b"/><circle cx="230" cy="350" r="4" fill="#991b1b"/><circle cx="350" cy="360" r="4" fill="#991b1b"/><circle cx="300" cy="200" r="4" fill="#991b1b"/><circle cx="300" cy="410" r="4" fill="#991b1b"/><circle cx="620" cy="300" r="4" fill="#991b1b"/><circle cx="940" cy="300" r="4" fill="#991b1b"/><circle cx="700" cy="290" r="4" fill="#991b1b"/><circle cx="860" cy="310" r="4" fill="#991b1b"/></g>
<g class="part" data-part="non" data-name="No nucleus, no mitochondria" data-info="Lost as the cell matures: more room for haemoglobin, and it does not use the oxygen it carries. But it cannot divide or repair itself, so it lasts about 120 days." tabindex="0" role="button" aria-label="No nucleus, no mitochondria"><text x="300" y="520" text-anchor="middle" font-size="16" font-weight="700" fill="#7f1d1d">no nucleus · no mitochondria</text></g>
<g aria-hidden="true" font-size="14" fill="#334155"><path d="M 130 500 L 470 500" stroke="#334155" stroke-width="1.5"/><text x="300" y="492" text-anchor="middle">7–8 µm</text><path d="M 990 255 L 990 345" stroke="#334155" stroke-width="1.5"/><text x="998" y="304">about 2.5 µm</text><path d="M 800 286 L 800 314" stroke="#334155" stroke-width="1.5"/><text x="808" y="276">about 1 µm</text></g>
<g class="labels"><g class="lbl" data-for="face"><polyline points="300.0,106.0 300.0,140.0"/><circle cx="300.0" cy="140.0" r="2.6"/><text x="300" y="100" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="4">Face view</text></g><g class="lbl" data-for="sect"><polyline points="780.0,156.0 780.0,250.0"/><circle cx="780.0" cy="250.0" r="2.6"/><text x="780" y="150" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="4">Section: biconcave disc</text></g><g class="lbl" data-for="hb"><polyline points="555.0,194.0 360.0,260.0"/><circle cx="360.0" cy="260.0" r="2.6"/><text x="560" y="200" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="4">Haemoglobin</text></g><g class="lbl" data-for="mem"><polyline points="555.0,444.0 430.0,410.0"/><circle cx="430.0" cy="410.0" r="2.6"/><text x="560" y="450" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="4">Flexible membrane</text></g></g>
</svg>