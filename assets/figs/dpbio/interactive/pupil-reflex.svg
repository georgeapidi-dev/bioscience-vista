<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" class="vd-svg" role="img" aria-labelledby="pu-title pu-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="pu-play" data-vd-play-label="Play: change the light" data-vd-steps="[[0, &quot;The pupil reflex.&quot;], [1, &quot;Bright light: circular muscles contract, pupil narrows.&quot;], [6, &quot;Dim light: radial muscles contract, pupil widens.&quot;], [10, &quot;An automatic, protective reflex.&quot;]]" data-vd-dur="13">
<title id="pu-title">The pupil reflex</title><desc id="pu-desc">An iris with circular and radial muscles; in bright light the circular muscles contract and the pupil becomes small, in dim light the radial muscles contract and the pupil widens.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="520" fill="#ffffff"/>
<g aria-hidden="true"><animate id="pu-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<text class="head" x="30" y="34">The pupil reflex</text><text class="note" x="30" y="56">Iris muscles are antagonistic.</text>
<g class="part" data-part="bright" data-name="Bright light" data-info="Circular muscles of the iris contract and radial muscles relax: the pupil gets smaller, letting in less light and protecting the retina." tabindex="0" role="button" aria-label="Bright light"><rect x="40" y="80" width="600" height="400" rx="20" fill="#fef9c3"><animate attributeName="fill" keyTimes="0.0000;0.0769;0.1538;0.4615;0.5385;1.0000" values="#f1f5f9;#f1f5f9;#fef08a;#fef08a;#334155;#334155" dur="13s" begin="pu-play.begin+0s" fill="freeze"/></rect><circle cx="340" cy="280" r="160" fill="#fff" stroke="#334155" stroke-width="3"/><circle cx="340" cy="280" r="120" fill="#60a5fa" stroke="#1d4ed8" stroke-width="3"/><line x1="400" y1="280" x2="458" y2="280" stroke="#1e3a8a" stroke-width="1.5"/><line x1="398" y1="296" x2="454" y2="311" stroke="#1e3a8a" stroke-width="1.5"/><line x1="392" y1="310" x2="442" y2="339" stroke="#1e3a8a" stroke-width="1.5"/><line x1="382" y1="322" x2="423" y2="363" stroke="#1e3a8a" stroke-width="1.5"/><line x1="370" y1="332" x2="399" y2="382" stroke="#1e3a8a" stroke-width="1.5"/><line x1="356" y1="338" x2="371" y2="394" stroke="#1e3a8a" stroke-width="1.5"/><line x1="340" y1="340" x2="340" y2="398" stroke="#1e3a8a" stroke-width="1.5"/><line x1="324" y1="338" x2="309" y2="394" stroke="#1e3a8a" stroke-width="1.5"/><line x1="310" y1="332" x2="281" y2="382" stroke="#1e3a8a" stroke-width="1.5"/><line x1="298" y1="322" x2="257" y2="363" stroke="#1e3a8a" stroke-width="1.5"/><line x1="288" y1="310" x2="238" y2="339" stroke="#1e3a8a" stroke-width="1.5"/><line x1="282" y1="296" x2="226" y2="311" stroke="#1e3a8a" stroke-width="1.5"/><line x1="280" y1="280" x2="222" y2="280" stroke="#1e3a8a" stroke-width="1.5"/><line x1="282" y1="264" x2="226" y2="249" stroke="#1e3a8a" stroke-width="1.5"/><line x1="288" y1="250" x2="238" y2="221" stroke="#1e3a8a" stroke-width="1.5"/><line x1="298" y1="238" x2="257" y2="197" stroke="#1e3a8a" stroke-width="1.5"/><line x1="310" y1="228" x2="281" y2="178" stroke="#1e3a8a" stroke-width="1.5"/><line x1="324" y1="222" x2="309" y2="166" stroke="#1e3a8a" stroke-width="1.5"/><line x1="340" y1="220" x2="340" y2="162" stroke="#1e3a8a" stroke-width="1.5"/><line x1="356" y1="222" x2="371" y2="166" stroke="#1e3a8a" stroke-width="1.5"/><line x1="370" y1="228" x2="399" y2="178" stroke="#1e3a8a" stroke-width="1.5"/><line x1="382" y1="238" x2="423" y2="197" stroke="#1e3a8a" stroke-width="1.5"/><line x1="392" y1="250" x2="442" y2="221" stroke="#1e3a8a" stroke-width="1.5"/><line x1="398" y1="264" x2="454" y2="249" stroke="#1e3a8a" stroke-width="1.5"/><circle cx="340" cy="280" r="50" fill="#111827"><animate attributeName="r" keyTimes="0.0000;0.0769;0.1923;0.4615;0.5769;1.0000" values="50;50;22;22;85;85" dur="13s" begin="pu-play.begin+0s" fill="freeze"/></circle><g><animate attributeName="opacity" keyTimes="0.0000;0.1538;0.1769;0.4615;0.4846;1.0000" values="0;0;1;1;0;0" dur="13s" begin="pu-play.begin+0s" fill="freeze"/><text x="340" y="120" text-anchor="middle" font-size="15" font-weight="800" fill="#a16207">bright light → pupil constricts</text></g></g>
<g class="part" data-part="dim" data-name="Dim light" data-info="Radial muscles contract and circular muscles relax: the pupil widens, letting in more light." tabindex="0" role="button" aria-label="Dim light"><g><animate attributeName="opacity" keyTimes="0.0000;0.5769;0.6000;1.0000" values="0;0;1;1" dur="13s" begin="pu-play.begin+0s" fill="freeze"/><text x="340" y="120" text-anchor="middle" font-size="15" font-weight="800" fill="#f8fafc">dim light → pupil dilates</text></g></g>
<g class="part" data-part="reflex" data-name="A reflex" data-info="Automatic, fast and protective: receptor (retina) → sensory neurone → brain → motor neurone → effector (iris muscles)." tabindex="0" role="button" aria-label="A reflex"><rect x="680" y="80" width="380" height="400" rx="16" fill="#f8fafc" stroke="#cbd5e1"/><text x="870" y="110" text-anchor="middle" font-size="15" font-weight="800" fill="#111827">iris muscles</text><text x="870" y="150" text-anchor="middle" font-size="14" font-weight="800" fill="#a16207">bright light</text><text x="870" y="176" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">circular contract · radial relax</text><text x="870" y="198" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">pupil smaller</text><text x="870" y="240" text-anchor="middle" font-size="14" font-weight="800" fill="#1e3a8a">dim light</text><text x="870" y="266" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">radial contract · circular relax</text><text x="870" y="288" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">pupil wider</text><g><animate attributeName="opacity" keyTimes="0.0000;0.7692;0.7923;1.0000" values="0;0;1;1" dur="13s" begin="pu-play.begin+0s" fill="freeze"/><text x="870" y="340" text-anchor="middle" font-size="13" font-weight="800" fill="#15803d">reflex arc:</text><text x="870" y="364" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">retina → sensory neurone →</text><text x="870" y="384" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">brain → motor neurone →</text><text x="870" y="404" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">iris muscles</text><text x="870" y="438" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">protects the retina from damage</text></g></g>
</svg>