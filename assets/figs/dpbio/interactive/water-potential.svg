<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 600" class="vd-svg" role="img" aria-labelledby="wp-title wp-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="wp-play" data-vd-play-label="Play: ψ" data-vd-steps="[[0, &quot;Water potential.&quot;], [1, &quot;Pure water: \u03c8w = 0. Add solutes: \u03c8s becomes negative.&quot;], [5, &quot;In a cell: \u03c8w = \u03c8s + \u03c8p.&quot;], [9.5, &quot;Potato in sucrose solutions: mass change shows where \u03c8w of tissue equals the solution.&quot;]]" data-vd-dur="16">
<title id="wp-title">Water potential</title><desc id="wp-desc">Pure water has water potential zero and solutions are negative; in a plant cell water potential equals solute potential plus pressure potential; a graph of percentage mass change of potato tissue in sucrose solutions crosses zero where tissue and solution water potentials are equal.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="600" fill="#ffffff"/>
<g aria-hidden="true"><animate id="wp-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<text class="head" x="30" y="34">Water potential: ψw = ψs + ψp</text><text class="note" x="30" y="56">Units: kPa. Values illustrative.</text>
<g class="part" data-part="mean" data-name="Water potential (ψw)" data-info="Potential energy of water per unit volume, relative to pure water at atmospheric pressure (0 kPa). Most biological values are negative." tabindex="0" role="button" aria-label="Water potential (ψw)"><g><animate attributeName="opacity" keyTimes="0.0000;0.0625;0.0813;1.0000" values="0;0;1;1" dur="16s" begin="wp-play.begin+0s" fill="freeze"/><rect x="50" y="110" width="100" height="120" rx="10" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="2"/><text x="100" y="252" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">pure water</text><text x="100" y="272" text-anchor="middle" font-size="12" font-weight="800" fill="#1d4ed8">ψs = 0 kPa</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.1375;0.1562;1.0000" values="0;0;1;1" dur="16s" begin="wp-play.begin+0s" fill="freeze"/><rect x="200" y="110" width="100" height="120" rx="10" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="2"/><circle cx="214" cy="130" r="7" fill="#f59e0b"/><circle cx="238" cy="130" r="7" fill="#f59e0b"/><circle cx="262" cy="130" r="7" fill="#f59e0b"/><circle cx="286" cy="130" r="7" fill="#f59e0b"/><text x="250" y="252" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">dilute solution</text><text x="250" y="272" text-anchor="middle" font-size="12" font-weight="800" fill="#1d4ed8">ψs = −200 kPa</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.2125;0.2312;1.0000" values="0;0;1;1" dur="16s" begin="wp-play.begin+0s" fill="freeze"/><rect x="350" y="110" width="100" height="120" rx="10" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="2"/><circle cx="364" cy="130" r="7" fill="#f59e0b"/><circle cx="388" cy="130" r="7" fill="#f59e0b"/><circle cx="412" cy="130" r="7" fill="#f59e0b"/><circle cx="436" cy="130" r="7" fill="#f59e0b"/><circle cx="364" cy="160" r="7" fill="#f59e0b"/><circle cx="388" cy="160" r="7" fill="#f59e0b"/><circle cx="412" cy="160" r="7" fill="#f59e0b"/><circle cx="436" cy="160" r="7" fill="#f59e0b"/><circle cx="364" cy="190" r="7" fill="#f59e0b"/><circle cx="388" cy="190" r="7" fill="#f59e0b"/><text x="400" y="252" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">concentrated</text><text x="400" y="272" text-anchor="middle" font-size="12" font-weight="800" fill="#1d4ed8">ψs = −800 kPa</text></g></g>
<g class="part" data-part="eq" data-name="ψw = ψs + ψp" data-info="Solute potential ψs is zero for pure water and negative for solutions. Pressure potential ψp is positive in turgid cells (the wall pushes back), negative in xylem under tension." tabindex="0" role="button" aria-label="ψw = ψs + ψp"><rect x="580" y="90" width="490" height="220" rx="16" fill="#f8fafc" stroke="#cbd5e1"/><rect x="620" y="120" width="170" height="160" fill="#fff" stroke="#16a34a" stroke-width="6"/><rect x="630" y="130" width="150" height="140" rx="10" fill="#bbf7d0"/><text x="705" y="205" text-anchor="middle" font-size="12" font-weight="800" fill="#14532d">turgid cell</text><g><animate attributeName="opacity" keyTimes="0.0000;0.3125;0.3312;1.0000" values="0;0;1;1" dur="16s" begin="wp-play.begin+0s" fill="freeze"/><text x="940" y="140" text-anchor="middle" font-size="14" font-weight="800" fill="#1d4ed8">ψs = −700 kPa</text><text x="940" y="170" text-anchor="middle" font-size="14" font-weight="800" fill="#15803d">ψp = +300 kPa</text><line x1="840" y1="186" x2="1040" y2="186" stroke="#111827"/><text x="940" y="212" text-anchor="middle" font-size="16" font-weight="800" fill="#111827">ψw = −400 kPa</text><text x="940" y="250" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">wall pushes back → ψp positive</text><text x="940" y="268" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">xylem under tension → ψp negative</text></g></g>
<g class="part" data-part="tis" data-name="Tissue in solutions" data-info="In a solution with higher ψw, water enters, ψp rises and tissue gains mass. In lower ψw, water leaves, ψp falls to zero (flaccid), then plasmolysis. Where % mass change = 0, tissue ψw equals the solution&#x27;s." tabindex="0" role="button" aria-label="Tissue in solutions"><line x1="140" y1="440" x2="900" y2="440" stroke="#111827" stroke-width="2"/><line x1="140" y1="540" x2="140" y2="340" stroke="#111827" stroke-width="2"/><text x="900" y="458.0" text-anchor="end" font-size="11" font-weight="800" fill="#111827">sucrose / mol dm⁻³</text><text x="132" y="334" text-anchor="start" font-size="11" font-weight="800" fill="#111827">% mass change</text><text x="140" y="432.0" text-anchor="middle" font-size="10" font-weight="700" fill="#475569">0.0</text><text x="292.0" y="432.0" text-anchor="middle" font-size="10" font-weight="700" fill="#475569">0.2</text><text x="444.0" y="432.0" text-anchor="middle" font-size="10" font-weight="700" fill="#475569">0.4</text><text x="596.0" y="432.0" text-anchor="middle" font-size="10" font-weight="700" fill="#475569">0.6</text><text x="748.0" y="432.0" text-anchor="middle" font-size="10" font-weight="700" fill="#475569">0.8</text><text x="900.0" y="432.0" text-anchor="middle" font-size="10" font-weight="700" fill="#475569">1.0</text><text x="134" y="544.0" text-anchor="end" font-size="10" font-weight="700" fill="#475569">-20</text><text x="134" y="494.0" text-anchor="end" font-size="10" font-weight="700" fill="#475569">-10</text><text x="134" y="394.0" text-anchor="end" font-size="10" font-weight="700" fill="#475569">+10</text><text x="134" y="344.0" text-anchor="end" font-size="10" font-weight="700" fill="#475569">+20</text><clipPath id="wpc-c95336140"><rect x="140" y="336" width="760" height="208"><animate attributeName="width" keyTimes="0.0000;0.5938;0.7812;1.0000" values="0;0;760;760" dur="16s" begin="wp-play.begin+0s" fill="freeze"/></rect></clipPath><g clip-path="url(#wpc-c95336140)"><polyline points="140,350 292,395 444,435 596,475 748,510 900,535" fill="none" stroke="#2563eb" stroke-width="3.5"/><circle cx="140" cy="350" r="5" fill="#2563eb"/><circle cx="292" cy="395" r="5" fill="#2563eb"/><circle cx="444" cy="435" r="5" fill="#2563eb"/><circle cx="596" cy="475" r="5" fill="#2563eb"/><circle cx="748" cy="510" r="5" fill="#2563eb"/><circle cx="900" cy="535" r="5" fill="#2563eb"/></g><g><animate attributeName="opacity" keyTimes="0.0000;0.7812;0.8000;1.0000" values="0;0;1;1" dur="16s" begin="wp-play.begin+0s" fill="freeze"/><circle cx="463" cy="440" r="9" fill="none" stroke="#dc2626" stroke-width="3"/><text x="474.4" y="474.0" text-anchor="start" font-size="12" font-weight="800" fill="#b91c1c">0% change: ψw tissue = ψw solution</text><text x="216.0" y="365.0" text-anchor="start" font-size="12" font-weight="800" fill="#15803d">gains water: turgid</text><text x="672.0" y="545.0" text-anchor="start" font-size="12" font-weight="800" fill="#b91c1c">loses water: flaccid, plasmolysed</text></g></g>
</svg>