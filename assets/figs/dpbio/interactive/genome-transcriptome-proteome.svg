<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 540" class="vd-svg" role="img" aria-labelledby="om-title om-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="om-play" data-vd-play-label="Play: express genes" data-vd-steps="[[0, &quot;Genome, transcriptome and proteome.&quot;], [1, &quot;Two cells, the same genome.&quot;], [4.5, &quot;Different genes are transcribed: different transcriptomes.&quot;], [9, &quot;So they make different proteins: different proteomes and cell types.&quot;]]" data-vd-dur="14">
<title id="om-title">Genome, transcriptome and proteome</title><desc id="om-desc">A liver cell and a beta cell share the same genome but transcribe different genes, giving different transcriptomes and proteomes, such as albumin and insulin.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="540" fill="#ffffff"/>
<g aria-hidden="true"><animate id="om-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<text class="head" x="30" y="34">Genome → transcriptome → proteome</text><text class="note" x="30" y="56">Two cells from one person.</text>
<g class="part" data-part="gen" data-name="Genome" data-info="All the genetic information (DNA) of a cell: the same in almost every cell of the body." tabindex="0" role="button" aria-label="Genome"><text x="110" y="160" text-anchor="middle" font-size="14" font-weight="800" fill="#111827">liver cell</text><rect x="200" y="140" width="36" height="34" rx="6" fill="#93c5fd" stroke="#334155"/><rect x="240" y="140" width="36" height="34" rx="6" fill="#fca5a5" stroke="#334155"/><rect x="280" y="140" width="36" height="34" rx="6" fill="#86efac" stroke="#334155"/><rect x="320" y="140" width="36" height="34" rx="6" fill="#fde68a" stroke="#334155"/><rect x="360" y="140" width="36" height="34" rx="6" fill="#c4b5fd" stroke="#334155"/><rect x="400" y="140" width="36" height="34" rx="6" fill="#fdba74" stroke="#334155"/><rect x="440" y="140" width="36" height="34" rx="6" fill="#67e8f9" stroke="#334155"/><rect x="480" y="140" width="36" height="34" rx="6" fill="#f9a8d4" stroke="#334155"/><text x="360" y="124" text-anchor="middle" font-size="12" font-weight="800" fill="#475569">genome (same in both)</text></g>
<g class="part" data-part="tr" data-name="Transcriptome" data-info="All the RNA molecules transcribed in a cell at a given time." tabindex="0" role="button" aria-label="Transcriptome"><g><animate attributeName="opacity" keyTimes="0.0000;0.3214;0.3429;1.0000" values="0;0;1;1" dur="14s" begin="om-play.begin+0s" fill="freeze"/><path d="M 580 142 q 6 -6 12 0 q 6 6 12 0" fill="none" stroke="#93c5fd" stroke-width="5"/><path d="M 606 142 q 6 -6 12 0 q 6 6 12 0" fill="none" stroke="#93c5fd" stroke-width="5"/><path d="M 204 180 L 224 200" stroke="#16a34a" stroke-width="3"/></g><g><animate attributeName="opacity" keyTimes="0.0000;0.3571;0.3786;1.0000" values="0;0;1;1" dur="14s" begin="om-play.begin+0s" fill="freeze"/><path d="M 580 156 q 6 -6 12 0 q 6 6 12 0" fill="none" stroke="#86efac" stroke-width="5"/><path d="M 606 156 q 6 -6 12 0 q 6 6 12 0" fill="none" stroke="#86efac" stroke-width="5"/><path d="M 284 180 L 304 200" stroke="#16a34a" stroke-width="3"/></g><g><animate attributeName="opacity" keyTimes="0.0000;0.3929;0.4143;1.0000" values="0;0;1;1" dur="14s" begin="om-play.begin+0s" fill="freeze"/><path d="M 580 170 q 6 -6 12 0 q 6 6 12 0" fill="none" stroke="#fdba74" stroke-width="5"/><path d="M 606 170 q 6 -6 12 0 q 6 6 12 0" fill="none" stroke="#fdba74" stroke-width="5"/><path d="M 404 180 L 424 200" stroke="#16a34a" stroke-width="3"/></g><text x="620" y="124" text-anchor="middle" font-size="12" font-weight="800" fill="#475569">transcriptome</text></g>
<g class="part" data-part="pro" data-name="Proteome" data-info="All the proteins produced by a cell at a given time. No cell expresses all its genes; the pattern of expression determines how it differentiates." tabindex="0" role="button" aria-label="Proteome"><g><animate attributeName="opacity" keyTimes="0.0000;0.6429;0.6643;1.0000" values="0;0;1;1" dur="14s" begin="om-play.begin+0s" fill="freeze"/><circle cx="800" cy="158" r="16" fill="#93c5fd" stroke="#334155"/><circle cx="840" cy="158" r="16" fill="#86efac" stroke="#334155"/><circle cx="880" cy="158" r="16" fill="#fdba74" stroke="#334155"/><text x="880" y="204" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">albumin, liver enzymes</text></g><text x="880" y="124" text-anchor="middle" font-size="12" font-weight="800" fill="#475569">proteome</text></g>
<text x="110" y="360" text-anchor="middle" font-size="14" font-weight="800" fill="#111827">pancreatic β cell</text><rect x="200" y="340" width="36" height="34" rx="6" fill="#93c5fd" stroke="#334155"/><rect x="240" y="340" width="36" height="34" rx="6" fill="#fca5a5" stroke="#334155"/><rect x="280" y="340" width="36" height="34" rx="6" fill="#86efac" stroke="#334155"/><rect x="320" y="340" width="36" height="34" rx="6" fill="#fde68a" stroke="#334155"/><rect x="360" y="340" width="36" height="34" rx="6" fill="#c4b5fd" stroke="#334155"/><rect x="400" y="340" width="36" height="34" rx="6" fill="#fdba74" stroke="#334155"/><rect x="440" y="340" width="36" height="34" rx="6" fill="#67e8f9" stroke="#334155"/><rect x="480" y="340" width="36" height="34" rx="6" fill="#f9a8d4" stroke="#334155"/>
<g><animate attributeName="opacity" keyTimes="0.0000;0.3214;0.3429;1.0000" values="0;0;1;1" dur="14s" begin="om-play.begin+0s" fill="freeze"/><path d="M 580 342 q 6 -6 12 0 q 6 6 12 0" fill="none" stroke="#fca5a5" stroke-width="5"/><path d="M 606 342 q 6 -6 12 0 q 6 6 12 0" fill="none" stroke="#fca5a5" stroke-width="5"/><path d="M 244 380 L 264 400" stroke="#16a34a" stroke-width="3"/></g><g><animate attributeName="opacity" keyTimes="0.0000;0.3571;0.3786;1.0000" values="0;0;1;1" dur="14s" begin="om-play.begin+0s" fill="freeze"/><path d="M 580 356 q 6 -6 12 0 q 6 6 12 0" fill="none" stroke="#86efac" stroke-width="5"/><path d="M 606 356 q 6 -6 12 0 q 6 6 12 0" fill="none" stroke="#86efac" stroke-width="5"/><path d="M 284 380 L 304 400" stroke="#16a34a" stroke-width="3"/></g><g><animate attributeName="opacity" keyTimes="0.0000;0.3929;0.4143;1.0000" values="0;0;1;1" dur="14s" begin="om-play.begin+0s" fill="freeze"/><path d="M 580 370 q 6 -6 12 0 q 6 6 12 0" fill="none" stroke="#67e8f9" stroke-width="5"/><path d="M 606 370 q 6 -6 12 0 q 6 6 12 0" fill="none" stroke="#67e8f9" stroke-width="5"/><path d="M 444 380 L 464 400" stroke="#16a34a" stroke-width="3"/></g>
<g><animate attributeName="opacity" keyTimes="0.0000;0.7143;0.7357;1.0000" values="0;0;1;1" dur="14s" begin="om-play.begin+0s" fill="freeze"/><circle cx="800" cy="358" r="16" fill="#fca5a5" stroke="#334155"/><circle cx="840" cy="358" r="16" fill="#86efac" stroke="#334155"/><circle cx="880" cy="358" r="16" fill="#67e8f9" stroke="#334155"/><text x="880" y="404" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">insulin</text></g>
<g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.7857;0.8071;1.0000" values="0;0;1;1" dur="14s" begin="om-play.begin+0s" fill="freeze"/><rect x="330.0" y="498" width="440" height="24" rx="12" fill="#e0e7ff" stroke="#1f2937" stroke-width="1"/><text x="550" y="515" text-anchor="middle" font-size="12" font-weight="700">same genome, different gene expression → different cells</text></g>
</svg>