<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 700" class="vd-svg" role="img" aria-labelledby="es-title es-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="es-play" data-vd-play-label="Play: endosymbiosis" data-vd-steps="[[0, &quot;The endosymbiotic theory: where mitochondria and chloroplasts came from.&quot;], [1, &quot;A large host cell engulfs an aerobic bacterium by endocytosis.&quot;], [4, &quot;The bacterium is not digested: it lives inside, with two membranes (its own and one from the vesicle), and becomes a mitochondrion.&quot;], [7.5, &quot;Later, a cell with mitochondria engulfs a photosynthetic cyanobacterium.&quot;], [10.5, &quot;It becomes a chloroplast: the ancestor of plant and algal cells.&quot;], [13, &quot;The evidence: they are like bacteria in many ways.&quot;]]" data-vd-dur="16">
<title id="es-title">Endosymbiosis</title><desc id="es-desc">A host cell engulfs an aerobic bacterium, which becomes a mitochondrion, and later a cyanobacterium, which becomes a chloroplast; with the evidence for the endosymbiotic theory.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1220" height="700" fill="#ffffff"/>
<g aria-hidden="true"><animate id="es-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<defs><marker id="es-475569" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="7.2" refY="8.0" orient="auto"><path d="M0,0 L16,8.0 L0,16 z" fill="#475569"/></marker></defs>
<text class="head" x="30" y="34">The endosymbiotic theory</text><text class="note" x="30" y="56">Simplified; events about 2 billion (mitochondria) and 1.5 billion (chloroplasts) years ago.</text>
<g class="part" data-part="host" data-name="Host cell" data-info="A large cell with a nucleus, able to take in other cells by endocytosis." tabindex="0" role="button" aria-label="Host cell"><path d="M 70 300 C 70 146.0 310.0 146.0 370 272.0 C 385.0 412.0 250.0 454.0 160.0 440 C 85.0 426.0 70 370.0 70 300 Z" fill="#e0e7ff" stroke="#4338ca" stroke-width="4"/><circle cx="175.0" cy="300" r="44.800000000000004" fill="#c4b5fd" stroke="#6d28d9" stroke-width="3"/><circle cx="175.0" cy="300" r="14.0" fill="#7c3aed"/><text x="220" y="470" text-anchor="middle" font-size="13" font-weight="800" fill="#3730a3">host cell (with nucleus)</text></g>
<g class="part" data-part="aero" data-name="Aerobic bacterium" data-info="A prokaryote able to respire aerobically (related to today&#x27;s alpha-proteobacteria)." tabindex="0" role="button" aria-label="Aerobic bacterium"><g transform="translate(420 170)"><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.0625;0.1875;0.2500;0.3125;1.0000" values="420 170;420 170;300 250;300 250;300 250;300 250" dur="16s" begin="es-play.begin+0s" fill="freeze"/><g><animate attributeName="opacity" keyTimes="0.0000;0.2500;0.2812;1.0000" values="1;1;0;0" dur="16s" begin="es-play.begin+0s" fill="freeze"/><rect x="-35.0" y="-16.0" width="70" height="32" rx="16.0" fill="#fca5a5" stroke="#a16207" stroke-width="3"/><path d="M -23.333333333333332 0 C -11.666666666666666 -14 0 14 17.5 -4" fill="none" stroke="#a16207" stroke-width="2" opacity=".6"/></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.2500;0.2812;1.0000" values="0;0;1;1" dur="16s" begin="es-play.begin+0s" fill="freeze"/><g transform="translate(0 0) rotate(0) scale(1.05)"><ellipse rx="34" ry="17" fill="#fdba74" stroke="#9a3412" stroke-width="2.5"/><ellipse rx="28" ry="12" fill="#fed7aa" stroke="#c2410c" stroke-width="1.5"/><path d="M -20 -10 L -20 4 M -10 10 L -10 -4 M 0 -10 L 0 4 M 10 10 L 10 -4 M 20 -10 L 20 4" stroke="#c2410c" stroke-width="2"/><circle cx="14" cy="0" r="4" fill="none" stroke="#7c3aed" stroke-width="1.5"/></g></g></g><g><animate attributeName="opacity" keyTimes="0.0000;0.0625;0.0813;0.1875;0.2062;1.0000" values="0;0;1;1;0;0" dur="16s" begin="es-play.begin+0s" fill="freeze"/><text x="420" y="140" text-anchor="middle" font-size="12" font-weight="800" fill="#b91c1c">aerobic bacterium</text></g></g>
<g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.1875;0.2062;0.2812;0.3000;1.0000" values="0;0;1;1;0;0" dur="16s" begin="es-play.begin+0s" fill="freeze"/><circle cx="300" cy="250" r="46" fill="none" stroke="#4338ca" stroke-width="3" stroke-dasharray="6 4"/><text x="300" y="196" text-anchor="middle" font-size="11" font-weight="800" fill="#3730a3">engulfed in a vesicle</text></g>
<g class="part" data-part="mito" data-name="Mitochondrion" data-info="The engulfed aerobic bacterium was not digested; it became a mitochondrion. All eukaryotes have (or had) mitochondria." tabindex="0" role="button" aria-label="Mitochondrion"><g><animate attributeName="opacity" keyTimes="0.0000;0.3125;0.3312;1.0000" values="0;0;1;1" dur="16s" begin="es-play.begin+0s" fill="freeze"/><g transform="translate(190 380) rotate(-20) scale(0.9)"><ellipse rx="34" ry="17" fill="#fdba74" stroke="#9a3412" stroke-width="2.5"/><ellipse rx="28" ry="12" fill="#fed7aa" stroke="#c2410c" stroke-width="1.5"/><path d="M -20 -10 L -20 4 M -10 10 L -10 -4 M 0 -10 L 0 4 M 10 10 L 10 -4 M 20 -10 L 20 4" stroke="#c2410c" stroke-width="2"/><circle cx="14" cy="0" r="4" fill="none" stroke="#7c3aed" stroke-width="1.5"/></g><g transform="translate(300 360) rotate(15) scale(0.9)"><ellipse rx="34" ry="17" fill="#fdba74" stroke="#9a3412" stroke-width="2.5"/><ellipse rx="28" ry="12" fill="#fed7aa" stroke="#c2410c" stroke-width="1.5"/><path d="M -20 -10 L -20 4 M -10 10 L -10 -4 M 0 -10 L 0 4 M 10 10 L 10 -4 M 20 -10 L 20 4" stroke="#c2410c" stroke-width="2"/><circle cx="14" cy="0" r="4" fill="none" stroke="#7c3aed" stroke-width="1.5"/></g><line x1="300" y1="250" x2="470" y2="330" stroke="#475569" stroke-width="1.5"/><circle cx="300" cy="250" r="3" fill="#475569"/><text x="476" y="334" text-anchor="start" font-size="13" font-weight="800" fill="#9a3412">mitochondrion</text><text x="476" y="352" text-anchor="start" font-size="11" font-weight="700" fill="#9a3412">(double membrane)</text></g></g>
<g><animate attributeName="opacity" keyTimes="0.0000;0.4375;0.4562;1.0000" values="0;0;1;1" dur="16s" begin="es-play.begin+0s" fill="freeze"/><path d="M 540 300 L 610 300" stroke="#475569" stroke-width="4" marker-end="url(#es-475569)"/><text x="575" y="285" text-anchor="middle" font-size="12" font-weight="800" fill="#475569">later</text></g>
<g><animate attributeName="opacity" keyTimes="0.0000;0.4375;0.4562;1.0000" values="0;0;1;1" dur="16s" begin="es-play.begin+0s" fill="freeze"/><path d="M 640 300 C 640 135.0 896.0 135.0 960 270.0 C 976.0 420.0 832.0 465.0 736.0 450 C 656.0 435.0 640 375.0 640 300 Z" fill="#e0e7ff" stroke="#4338ca" stroke-width="4"/><circle cx="752.0" cy="300" r="48.0" fill="#c4b5fd" stroke="#6d28d9" stroke-width="3"/><circle cx="752.0" cy="300" r="15.0" fill="#7c3aed"/><g transform="translate(700 390) rotate(30) scale(0.9)"><ellipse rx="34" ry="17" fill="#fdba74" stroke="#9a3412" stroke-width="2.5"/><ellipse rx="28" ry="12" fill="#fed7aa" stroke="#c2410c" stroke-width="1.5"/><path d="M -20 -10 L -20 4 M -10 10 L -10 -4 M 0 -10 L 0 4 M 10 10 L 10 -4 M 20 -10 L 20 4" stroke="#c2410c" stroke-width="2"/><circle cx="14" cy="0" r="4" fill="none" stroke="#7c3aed" stroke-width="1.5"/></g><g transform="translate(860 400) rotate(-10) scale(0.9)"><ellipse rx="34" ry="17" fill="#fdba74" stroke="#9a3412" stroke-width="2.5"/><ellipse rx="28" ry="12" fill="#fed7aa" stroke="#c2410c" stroke-width="1.5"/><path d="M -20 -10 L -20 4 M -10 10 L -10 -4 M 0 -10 L 0 4 M 10 10 L 10 -4 M 20 -10 L 20 4" stroke="#c2410c" stroke-width="2"/><circle cx="14" cy="0" r="4" fill="none" stroke="#7c3aed" stroke-width="1.5"/></g><g transform="translate(900 220) rotate(60) scale(0.9)"><ellipse rx="34" ry="17" fill="#fdba74" stroke="#9a3412" stroke-width="2.5"/><ellipse rx="28" ry="12" fill="#fed7aa" stroke="#c2410c" stroke-width="1.5"/><path d="M -20 -10 L -20 4 M -10 10 L -10 -4 M 0 -10 L 0 4 M 10 10 L 10 -4 M 20 -10 L 20 4" stroke="#c2410c" stroke-width="2"/><circle cx="14" cy="0" r="4" fill="none" stroke="#7c3aed" stroke-width="1.5"/></g><text x="800" y="480" text-anchor="middle" font-size="13" font-weight="800" fill="#3730a3">cell with mitochondria</text></g>
<g class="part" data-part="cyano" data-name="Cyanobacterium" data-info="A photosynthetic prokaryote." tabindex="0" role="button" aria-label="Cyanobacterium"><g><animate attributeName="opacity" keyTimes="0.0000;0.4688;0.4875;1.0000" values="0;0;1;1" dur="16s" begin="es-play.begin+0s" fill="freeze"/><g transform="translate(1060 150)"><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.4688;0.5938;0.6562;1.0000" values="1060 150;1060 150;860 280;860 280;860 280" dur="16s" begin="es-play.begin+0s" fill="freeze"/><g><animate attributeName="opacity" keyTimes="0.0000;0.6562;0.6875;1.0000" values="1;1;0;0" dur="16s" begin="es-play.begin+0s" fill="freeze"/><rect x="-40.0" y="-18.0" width="80" height="36" rx="18.0" fill="#4ade80" stroke="#a16207" stroke-width="3"/><path d="M -26.666666666666668 0 C -13.333333333333334 -14 0 14 20.0 -4" fill="none" stroke="#a16207" stroke-width="2" opacity=".6"/><line x1="-26" y1="-8" x2="-26" y2="8" stroke="#166534" stroke-width="3"/><line x1="-13" y1="-8" x2="-13" y2="8" stroke="#166534" stroke-width="3"/><line x1="0" y1="-8" x2="0" y2="8" stroke="#166534" stroke-width="3"/><line x1="13" y1="-8" x2="13" y2="8" stroke="#166534" stroke-width="3"/><line x1="26" y1="-8" x2="26" y2="8" stroke="#166534" stroke-width="3"/></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.6562;0.6875;1.0000" values="0;0;1;1" dur="16s" begin="es-play.begin+0s" fill="freeze"/><g transform="translate(0 0) rotate(0) scale(1.1)"><ellipse rx="40" ry="20" fill="#86efac" stroke="#166534" stroke-width="2.5"/><ellipse rx="34" ry="15" fill="#bbf7d0" stroke="#15803d" stroke-width="1.5"/><rect x="-24" y="-8" width="9" height="16" rx="2" fill="#16a34a"/><rect x="-12" y="-8" width="9" height="16" rx="2" fill="#16a34a"/><rect x="0" y="-8" width="9" height="16" rx="2" fill="#16a34a"/><rect x="12" y="-8" width="9" height="16" rx="2" fill="#16a34a"/><rect x="24" y="-8" width="9" height="16" rx="2" fill="#16a34a"/><circle cx="-30" cy="0" r="4" fill="none" stroke="#7c3aed" stroke-width="1.5"/></g></g></g><g><animate attributeName="opacity" keyTimes="0.0000;0.4688;0.4875;0.5938;0.6125;1.0000" values="0;0;1;1;0;0" dur="16s" begin="es-play.begin+0s" fill="freeze"/><text x="1060" y="118" text-anchor="middle" font-size="12" font-weight="800" fill="#166534">cyanobacterium</text></g></g></g>
<g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.5938;0.6125;0.6875;0.7063;1.0000" values="0;0;1;1;0;0" dur="16s" begin="es-play.begin+0s" fill="freeze"/><circle cx="860" cy="280" r="54" fill="none" stroke="#4338ca" stroke-width="3" stroke-dasharray="6 4"/></g>
<g class="part" data-part="chl" data-name="Chloroplast" data-info="A cyanobacterium engulfed by a cell that already had mitochondria became the chloroplast. So plants and algae have both." tabindex="0" role="button" aria-label="Chloroplast"><g><animate attributeName="opacity" keyTimes="0.0000;0.6875;0.7063;1.0000" values="0;0;1;1" dur="16s" begin="es-play.begin+0s" fill="freeze"/><line x1="890" y1="290" x2="1010" y2="360" stroke="#475569" stroke-width="1.5"/><circle cx="890" cy="290" r="3" fill="#475569"/><text x="1016" y="364" text-anchor="start" font-size="13" font-weight="800" fill="#166534">chloroplast</text><text x="1016" y="382" text-anchor="start" font-size="11" font-weight="700" fill="#166534">(double membrane)</text><text x="1016" y="400" text-anchor="start" font-size="11" font-weight="700" fill="#166534">→ plant & algal cells</text></g></g>
<g class="part" data-part="ev" data-name="Evidence" data-info="Mitochondria and chloroplasts: two membranes; their own naked, circular DNA; 70S ribosomes; divide by binary fission; bacterial size; DNA sequences closest to bacteria." tabindex="0" role="button" aria-label="Evidence"><g><animate attributeName="opacity" keyTimes="0.0000;0.8125;0.8313;1.0000" values="0;0;1;1" dur="16s" begin="es-play.begin+0s" fill="freeze"/><rect x="30" y="510" width="1160" height="170" rx="16" fill="#fff7ed" stroke="#fdba74"/><text x="610" y="538" text-anchor="middle" font-size="15" font-weight="800" fill="#9a3412">Evidence: mitochondria and chloroplasts are like bacteria</text><text x="60" y="574" text-anchor="start" font-size="13" font-weight="600" fill="#111827">• two membranes (inner one is the bacterium's)</text><text x="440" y="574" text-anchor="start" font-size="13" font-weight="600" fill="#111827">• own DNA: naked and circular, like bacteria</text><text x="820" y="574" text-anchor="start" font-size="13" font-weight="600" fill="#111827">• 70S ribosomes (cytoplasm has 80S)</text><text x="60" y="608" text-anchor="start" font-size="13" font-weight="600" fill="#111827">• divide by binary fission, not made by the cell</text><text x="440" y="608" text-anchor="start" font-size="13" font-weight="600" fill="#111827">• about the size of bacteria (1–10 µm)</text><text x="820" y="608" text-anchor="start" font-size="13" font-weight="600" fill="#111827">• their DNA sequences group with bacteria</text><text x="610" y="660" text-anchor="middle" font-size="12" font-weight="700" fill="#7c2d12">The circle in each organelle shows its own DNA.</text></g></g>
</svg>