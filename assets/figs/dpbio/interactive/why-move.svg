<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" class="vd-svg" role="img" aria-labelledby="wm-title wm-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="wm-play" data-vd-play-label="Play: get moving" data-vd-steps="[[0, &quot;Movement is a universal feature of life.&quot;], [1, &quot;Motile organisms move from place to place.&quot;], [4.5, &quot;Sessile organisms stay put but still move parts.&quot;], [8, &quot;Why move? Food, safety, mates, migration and dispersal.&quot;]]" data-vd-dur="14">
<title id="wm-title">Why organisms move</title><desc id="wm-desc">A cheetah and a paramecium moving from place to place, a sea anemone moving its tentacles while fixed, and five reasons for movement: foraging, escaping danger, finding a mate, migration and dispersal.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="560" fill="#ffffff"/>
<g aria-hidden="true"><animate id="wm-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<text class="head" x="30" y="34">Everything moves</text><text class="note" x="30" y="56">Schematic.</text>
<g class="part" data-part="motile" data-name="Motile organisms" data-info="Move from place to place: a cheetah running, a paramecium beating its cilia." tabindex="0" role="button" aria-label="Motile organisms"><rect x="30" y="80" width="520" height="220" rx="16" fill="#fffbeb" stroke="#fcd34d"/><text x="290" y="106" text-anchor="middle" font-size="14" font-weight="800" fill="#b45309">MOTILE: move from place to place</text><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.0000;0.0143;1.0000" values="0;0;1;1" dur="14s" begin="wm-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.0714;0.2857;1.0000" values="120 190;120 190;440 190;440 190" dur="14s" begin="wm-play.begin+0s" fill="freeze"/><g><ellipse rx="50" ry="18" fill="#fbbf24" stroke="#92400e" stroke-width="2"/><circle cx="50" cy="-12" r="13" fill="#fbbf24" stroke="#92400e" stroke-width="2"/><circle cx="-30" cy="-4" r="3" fill="#78350f"/><circle cx="-10" cy="6" r="3" fill="#78350f"/><circle cx="10" cy="-6" r="3" fill="#78350f"/><circle cx="28" cy="4" r="3" fill="#78350f"/><path d="M -50 0 q -30 -10 -40 10" stroke="#92400e" stroke-width="4" fill="none"/></g></g></g><text x="140" y="240" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">cheetah</text><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.0000;0.0143;1.0000" values="0;0;1;1" dur="14s" begin="wm-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.0714;0.2857;1.0000" values="120 270;120 270;300 270;300 270" dur="14s" begin="wm-play.begin+0s" fill="freeze"/><g><ellipse rx="30" ry="12" fill="#bbf7d0" stroke="#166534" stroke-width="2"/><line x1="-28" y1="-11" x2="-30" y2="-17" stroke="#166534"/><line x1="-20" y1="-11" x2="-22" y2="-17" stroke="#166534"/><line x1="-12" y1="-11" x2="-14" y2="-17" stroke="#166534"/><line x1="-4" y1="-11" x2="-6" y2="-17" stroke="#166534"/><line x1="4" y1="-11" x2="2" y2="-17" stroke="#166534"/><line x1="12" y1="-11" x2="10" y2="-17" stroke="#166534"/><line x1="20" y1="-11" x2="18" y2="-17" stroke="#166534"/><line x1="28" y1="-11" x2="26" y2="-17" stroke="#166534"/></g></g></g><text x="400" y="276" text-anchor="start" font-size="12" font-weight="800" fill="#111827">paramecium (cilia)</text></g>
<g class="part" data-part="sessile" data-name="Sessile organisms" data-info="Stay fixed in one place but still move parts: a sea anemone moves its tentacles." tabindex="0" role="button" aria-label="Sessile organisms"><rect x="570" y="80" width="500" height="220" rx="16" fill="#f0f9ff" stroke="#7dd3fc"/><text x="820" y="106" text-anchor="middle" font-size="14" font-weight="800" fill="#0369a1">SESSILE: fixed, but moves parts</text><rect x="790" y="230" width="60" height="50" rx="10" fill="#f472b6" stroke="#9d174d" stroke-width="2"/><g transform="translate(800 232)"><path d="M 0 0 q -6 -30 -26 -70" stroke="#ec4899" stroke-width="5" fill="none"><animateTransform attributeName="transform" type="rotate" keyTimes="0.0000;0.3214;0.3929;0.4643;0.5357;1.0000" values="0;0;12;-12;8;0" dur="14s" begin="wm-play.begin+0s" fill="freeze"/></path></g><g transform="translate(808 232)"><path d="M 0 0 q -6 -30 -18 -70" stroke="#ec4899" stroke-width="5" fill="none"><animateTransform attributeName="transform" type="rotate" keyTimes="0.0000;0.3214;0.3929;0.4643;0.5357;1.0000" values="0;0;12;-12;8;0" dur="14s" begin="wm-play.begin+0s" fill="freeze"/></path></g><g transform="translate(816 232)"><path d="M 0 0 q -6 -30 -6 -70" stroke="#ec4899" stroke-width="5" fill="none"><animateTransform attributeName="transform" type="rotate" keyTimes="0.0000;0.3214;0.3929;0.4643;0.5357;1.0000" values="0;0;12;-12;8;0" dur="14s" begin="wm-play.begin+0s" fill="freeze"/></path></g><g transform="translate(824 232)"><path d="M 0 0 q -6 -30 6 -70" stroke="#ec4899" stroke-width="5" fill="none"><animateTransform attributeName="transform" type="rotate" keyTimes="0.0000;0.3214;0.3929;0.4643;0.5357;1.0000" values="0;0;12;-12;8;0" dur="14s" begin="wm-play.begin+0s" fill="freeze"/></path></g><g transform="translate(832 232)"><path d="M 0 0 q -6 -30 18 -70" stroke="#ec4899" stroke-width="5" fill="none"><animateTransform attributeName="transform" type="rotate" keyTimes="0.0000;0.3214;0.3929;0.4643;0.5357;1.0000" values="0;0;12;-12;8;0" dur="14s" begin="wm-play.begin+0s" fill="freeze"/></path></g><g transform="translate(840 232)"><path d="M 0 0 q -6 -30 26 -70" stroke="#ec4899" stroke-width="5" fill="none"><animateTransform attributeName="transform" type="rotate" keyTimes="0.0000;0.3214;0.3929;0.4643;0.5357;1.0000" values="0;0;12;-12;8;0" dur="14s" begin="wm-play.begin+0s" fill="freeze"/></path></g><text x="820" y="296" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">sea anemone</text></g>
<g class="part" data-part="why" data-name="Reasons for movement" data-info="Foraging for food, escaping danger, searching for a mate, migrating, and dispersing to new areas." tabindex="0" role="button" aria-label="Reasons for movement"><g><animate attributeName="opacity" keyTimes="0.0000;0.5714;0.5929;1.0000" values="0;0;1;1" dur="14s" begin="wm-play.begin+0s" fill="freeze"/><rect x="25" y="340" width="190" height="110" rx="14" fill="#fff" stroke="#16a34a" stroke-width="2"/><text x="120" y="372" text-anchor="middle" font-size="14" font-weight="800" fill="#15803d">foraging</text><text x="120" y="400" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">cheetahs chase gazelles;</text><text x="120" y="418" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">bees visit flowers</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.6143;0.6357;1.0000" values="0;0;1;1" dur="14s" begin="wm-play.begin+0s" fill="freeze"/><rect x="240" y="340" width="190" height="110" rx="14" fill="#fff" stroke="#16a34a" stroke-width="2"/><text x="335" y="372" text-anchor="middle" font-size="14" font-weight="800" fill="#15803d">escaping danger</text><text x="335" y="400" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">impala leap from lions;</text><text x="335" y="418" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">squid jet away</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.6571;0.6786;1.0000" values="0;0;1;1" dur="14s" begin="wm-play.begin+0s" fill="freeze"/><rect x="455" y="340" width="190" height="110" rx="14" fill="#fff" stroke="#16a34a" stroke-width="2"/><text x="550" y="372" text-anchor="middle" font-size="14" font-weight="800" fill="#15803d">finding a mate</text><text x="550" y="400" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">elephants travel</text><text x="550" y="418" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">in musth</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.7000;0.7214;1.0000" values="0;0;1;1" dur="14s" begin="wm-play.begin+0s" fill="freeze"/><rect x="670" y="340" width="190" height="110" rx="14" fill="#fff" stroke="#16a34a" stroke-width="2"/><text x="765" y="372" text-anchor="middle" font-size="14" font-weight="800" fill="#15803d">migration</text><text x="765" y="400" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">wildebeest follow</text><text x="765" y="418" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">the rains</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.7429;0.7643;1.0000" values="0;0;1;1" dur="14s" begin="wm-play.begin+0s" fill="freeze"/><rect x="885" y="340" width="190" height="110" rx="14" fill="#fff" stroke="#16a34a" stroke-width="2"/><text x="980" y="372" text-anchor="middle" font-size="14" font-weight="800" fill="#15803d">dispersal</text><text x="980" y="400" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">young spread to</text><text x="980" y="418" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">new areas</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.5714;0.5929;1.0000" values="0;0;1;1" dur="14s" begin="wm-play.begin+0s" fill="freeze"/><text x="550" y="490" text-anchor="middle" font-size="16" font-weight="800" fill="#15803d">Why move?</text></g></g>
</svg>