<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" class="vd-svg" role="img" aria-labelledby="pg-title pg-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="pg-play" data-vd-play-label="Play: add genes" data-vd-steps="[[0, &quot;Steps or a slope? Polygenic inheritance.&quot;], [1, &quot;One gene: a few distinct classes.&quot;], [4.5, &quot;Three genes: seven classes, 1:6:15:20:15:6:1.&quot;], [10, &quot;Add environmental effects and the classes merge into a continuous range.&quot;]]" data-vd-dur="15">
<title id="pg-title">Polygenic inheritance</title><desc id="pg-desc">One gene gives three discrete classes, three genes give seven classes in the ratio 1 to 6 to 15 to 20 to 15 to 6 to 1, and environmental effects blur them into a continuous bell-shaped distribution.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="560" fill="#ffffff"/>
<g aria-hidden="true"><animate id="pg-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<text class="head" x="30" y="34">Steps or a slope? Polygenic inheritance</text><text class="note" x="30" y="56">Number of offspring per 64 in each class.</text>
<g class="part" data-part="one" data-name="One gene" data-info="With one gene and two alleles there are only a few phenotypes: discrete (steps)." tabindex="0" role="button" aria-label="One gene"><rect x="30" y="80" width="300" height="440" rx="16" fill="#f8fafc" stroke="#cbd5e1"/><text x="180" y="106" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">one gene (Aa × Aa)</text><g><animate attributeName="opacity" keyTimes="0.0000;0.0667;0.0867;1.0000" values="0;0;1;1" dur="15s" begin="pg-play.begin+0s" fill="freeze"/><rect x="80" y="332" width="56" height="128" fill="#fef3c7" stroke="#334155"/><text x="108" y="486" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">aa</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.1000;0.1200;1.0000" values="0;0;1;1" dur="15s" begin="pg-play.begin+0s" fill="freeze"/><rect x="150" y="204" width="56" height="256" fill="#d6a76b" stroke="#334155"/><text x="178" y="486" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">Aa</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.1333;0.1533;1.0000" values="0;0;1;1" dur="15s" begin="pg-play.begin+0s" fill="freeze"/><rect x="220" y="332" width="56" height="128" fill="#78350f" stroke="#334155"/><text x="248" y="486" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">AA</text></g></g>
<g class="part" data-part="many" data-name="Three genes (AaBbCc × AaBbCc)" data-info="Each capital allele adds one unit of pigment: offspring with 0 to 6 pigment alleles in the ratio 1 : 6 : 15 : 20 : 15 : 6 : 1, a bell shape." tabindex="0" role="button" aria-label="Three genes (AaBbCc × AaBbCc)"><rect x="360" y="80" width="710" height="440" rx="16" fill="#f8fafc" stroke="#cbd5e1"/><text x="715" y="106" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">three genes (AaBbCc × AaBbCc)</text><g><animate attributeName="opacity" keyTimes="0.0000;0.3000;0.3200;1.0000" values="0;0;1;1" dur="15s" begin="pg-play.begin+0s" fill="freeze"/><rect x="420" y="444" width="74" height="16" fill="#fef3c7" stroke="#334155"/><text x="457" y="436" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">1</text><text x="457" y="486" text-anchor="middle" font-size="10" font-weight="800" fill="#475569">0 pigment</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.3400;0.3600;1.0000" values="0;0;1;1" dur="15s" begin="pg-play.begin+0s" fill="freeze"/><rect x="510" y="364" width="74" height="96" fill="#f5deb3" stroke="#334155"/><text x="547" y="356" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">6</text><text x="547" y="486" text-anchor="middle" font-size="10" font-weight="800" fill="#475569">1 pigment</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.3800;0.4000;1.0000" values="0;0;1;1" dur="15s" begin="pg-play.begin+0s" fill="freeze"/><rect x="600" y="220" width="74" height="240" fill="#e0b98a" stroke="#334155"/><text x="637" y="212" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">15</text><text x="637" y="486" text-anchor="middle" font-size="10" font-weight="800" fill="#475569">2 pigment</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.4200;0.4400;1.0000" values="0;0;1;1" dur="15s" begin="pg-play.begin+0s" fill="freeze"/><rect x="690" y="140" width="74" height="320" fill="#c69463" stroke="#334155"/><text x="727" y="132" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">20</text><text x="727" y="486" text-anchor="middle" font-size="10" font-weight="800" fill="#475569">3 pigment</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.4600;0.4800;1.0000" values="0;0;1;1" dur="15s" begin="pg-play.begin+0s" fill="freeze"/><rect x="780" y="220" width="74" height="240" fill="#a87244" stroke="#334155"/><text x="817" y="212" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">15</text><text x="817" y="486" text-anchor="middle" font-size="10" font-weight="800" fill="#475569">4 pigment</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.5000;0.5200;1.0000" values="0;0;1;1" dur="15s" begin="pg-play.begin+0s" fill="freeze"/><rect x="870" y="364" width="74" height="96" fill="#7a4a26" stroke="#334155"/><text x="907" y="356" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">6</text><text x="907" y="486" text-anchor="middle" font-size="10" font-weight="800" fill="#475569">5 pigment</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.5400;0.5600;1.0000" values="0;0;1;1" dur="15s" begin="pg-play.begin+0s" fill="freeze"/><rect x="960" y="444" width="74" height="16" fill="#4a2c14" stroke="#334155"/><text x="997" y="436" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">1</text><text x="997" y="486" text-anchor="middle" font-size="10" font-weight="800" fill="#475569">6 pigment</text></g></g>
<g class="part" data-part="env" data-name="Add the environment" data-info="Sunlight increases melanin, so the classes blur into continuous variation (a slope), as in skin colour and height." tabindex="0" role="button" aria-label="Add the environment"><clipPath id="pgc-c100120400"><rect x="400" y="120" width="680" height="360"><animate attributeName="width" keyTimes="0.0000;0.6667;0.8667;1.0000" values="0;0;680;680" dur="15s" begin="pg-play.begin+0s" fill="freeze"/></rect></clipPath><g clip-path="url(#pgc-c100120400)"><path d="M 420 458 C 600 456 660 140 735 140 C 810 140 870 456 1050 458" fill="none" stroke="#dc2626" stroke-width="4"/></g><g><animate attributeName="opacity" keyTimes="0.0000;0.8000;0.8200;1.0000" values="0;0;1;1" dur="15s" begin="pg-play.begin+0s" fill="freeze"/><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.8000;0.8200;1.0000" values="0;0;1;1" dur="15s" begin="pg-play.begin+0s" fill="freeze"/><rect x="505.0" y="498" width="420" height="24" rx="12" fill="#fee2e2" stroke="#1f2937" stroke-width="1"/><text x="715" y="515" text-anchor="middle" font-size="12" font-weight="700">+ environment (e.g. sunlight) → continuous variation</text></g></g></g>
</svg>