<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 580" class="vd-svg" role="img" aria-labelledby="al-title al-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="al-play" data-vd-play-label="Play: chemical warfare" data-vd-steps="[[0, &quot;Chemical warfare between competitors.&quot;], [1, &quot;A black walnut releases juglone into the soil: few plants grow beneath it.&quot;], [5, &quot;Microbes do it too: Penicillium kills nearby bacteria.&quot;], [9, &quot;Investigate: seeds with increasing concentrations of leaf extract.&quot;]]" data-vd-dur="15">
<title id="al-title">Allelopathy and antibiotics</title><desc id="al-desc">A black walnut tree releasing juglone that inhibits plants beneath it, a Penicillium colony with a clear zone where bacteria are killed, and an investigation of seed germination with increasing concentrations of leaf extract.</desc>
