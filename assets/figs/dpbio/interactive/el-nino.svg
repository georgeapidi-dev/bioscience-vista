<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 700" class="vd-svg" role="img" aria-labelledby="en-title en-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="en-play" data-vd-play-label="Play: normal → El Niño" data-vd-steps="[[0, &quot;The El Ni\u00f1o\u2013Southern Oscillation (ENSO) in the tropical Pacific.&quot;], [1, &quot;Normally, trade winds push warm surface water west towards Indonesia and Australia.&quot;], [3, &quot;Air rises and it rains in the west; off Peru, cold nutrient-rich water upwells.&quot;], [7, &quot;In an El Ni\u00f1o year the trade winds weaken...&quot;], [9, &quot;...warm water spreads east, upwelling stops and the rain moves east.&quot;], [12.5, &quot;Floods in Peru, drought in Australia and Indonesia, and effects worldwide.&quot;]]" data-vd-dur="16">
<title id="en-title">El Niño</title><desc id="en-desc">Cross-sections of the tropical Pacific: in normal conditions trade winds push warm water west with rising air and rain over Indonesia and upwelling off Peru; during El Niño the trade winds weaken, warm water spreads east, upwelling weakens and rainfall shifts east.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1220" height="700" fill="#ffffff"/>
<g aria-hidden="true"><animate id="en-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<defs><marker id="en-475569" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="6.3" refY="7.0" orient="auto"><path d="M0,0 L14,7.0 L0,14 z" fill="#475569"/></marker><marker id="en-0ea5e9" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="6.3" refY="7.0" orient="auto"><path d="M0,0 L14,7.0 L0,14 z" fill="#0ea5e9"/></marker></defs>
<text class="head" x="30" y="34">El Niño and the tropical Pacific</text><text class="note" x="30" y="56">Cross-section along the equator; west (Asia–Australia) on the left, east (South America) on the right.</text>
<g class="part" data-part="normal" data-name="Normal conditions" data-info="Trade winds blow from east to west across the tropical Pacific, piling up warm surface water in the west." tabindex="0" role="button" aria-label="Normal conditions"><g><animate attributeName="opacity" keyTimes="0.0000;0.4250;0.4500;1.0000" values="1;1;0;0" dur="16s" begin="en-play.begin+0s" fill="freeze"/><rect x="80" y="260" width="1060" height="200" fill="#1e3a8a"/><path d="M 80 260 L 1140 260 L 1140 290 L 80 380 Z" fill="#0ea5e9"/><path d="M 80 260 L 500 260 L 500 300 C 300 340 180 360 80 370 Z" fill="#f97316" opacity=".85"/><polyline points="80,380 100,378 120,377 140,375 160,373 180,372 200,370 220,368 240,366 260,365 280,363 300,361 320,360 340,358 360,356 380,355 400,353 420,351 440,349 460,348 480,346 500,344 520,343 540,341 560,339 580,338 600,336 620,334 640,332 660,331 680,329 700,327 720,326 740,324 760,322 780,321 800,319 820,317 840,315 860,314 880,312 900,310 920,309 940,307 960,305 980,304 1000,302 1020,300 1040,298 1060,297 1080,295 1100,293 1120,292 1140,290" fill="none" stroke="#fde047" stroke-width="3" stroke-dasharray="8 5"/><text x="600" y="353.8490566037736" text-anchor="middle" font-size="12" font-weight="800" fill="#fde047">thermocline</text><path d="M 60 460 L 60 230 L 110 250 L 140 260 L 80 460 Z" fill="#a16207"/><text x="86" y="220" text-anchor="start" font-size="12" font-weight="800" fill="#111827">Indonesia / Australia</text><path d="M 1160 460 L 1160 200 L 1110 240 L 1090 260 L 1140 460 Z" fill="#a16207"/><text x="1136" y="190" text-anchor="end" font-size="12" font-weight="800" fill="#111827">Peru (South America)</text><ellipse cx="260" cy="170" rx="90" ry="30" fill="#64748b"/><ellipse cx="300" cy="152" rx="60" ry="26" fill="#94a3b8"/><line x1="200" y1="198" x2="192" y2="242" stroke="#38bdf8" stroke-width="3"><animate attributeName="stroke-dashoffset" values="0;-20" dur=".6s" repeatCount="indefinite"/></line><line x1="220" y1="198" x2="212" y2="242" stroke="#38bdf8" stroke-width="3"><animate attributeName="stroke-dashoffset" values="0;-20" dur=".6s" repeatCount="indefinite"/></line><line x1="240" y1="198" x2="232" y2="242" stroke="#38bdf8" stroke-width="3"><animate attributeName="stroke-dashoffset" values="0;-20" dur=".6s" repeatCount="indefinite"/></line><line x1="260" y1="198" x2="252" y2="242" stroke="#38bdf8" stroke-width="3"><animate attributeName="stroke-dashoffset" values="0;-20" dur=".6s" repeatCount="indefinite"/></line><line x1="280" y1="198" x2="272" y2="242" stroke="#38bdf8" stroke-width="3"><animate attributeName="stroke-dashoffset" values="0;-20" dur=".6s" repeatCount="indefinite"/></line><line x1="300" y1="198" x2="292" y2="242" stroke="#38bdf8" stroke-width="3"><animate attributeName="stroke-dashoffset" values="0;-20" dur=".6s" repeatCount="indefinite"/></line><line x1="320" y1="198" x2="312" y2="242" stroke="#38bdf8" stroke-width="3"><animate attributeName="stroke-dashoffset" values="0;-20" dur=".6s" repeatCount="indefinite"/></line><path d="M 1020 240 L 400 240" stroke="#e2e8f0" stroke-width="0"/><path d="M 1040 236 L 410 236" stroke="#475569" stroke-width="6" marker-end="url(#en-475569)"/><text x="720" y="226" text-anchor="middle" font-size="13" font-weight="800" fill="#334155">strong trade winds</text><path d="M 260 130 C 380 70 890 70 990 200" fill="none" stroke="#475569" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#en-475569)"/><text x="940" y="120" text-anchor="middle" font-size="11" font-weight="800" fill="#475569">dry sinking air</text><path d="M 1070 450 C 1060 380 1080 320 1090 270" fill="none" stroke="#bae6fd" stroke-width="4" marker-end="url(#en-0ea5e9)"/><path d="M 1040 450 C 1030 380 1050 320 1060 270" fill="none" stroke="#bae6fd" stroke-width="4" marker-end="url(#en-0ea5e9)"/><path d="M 1010 450 C 1000 380 1020 320 1030 270" fill="none" stroke="#bae6fd" stroke-width="4" marker-end="url(#en-0ea5e9)"/><text x="1000" y="400" text-anchor="end" font-size="12" font-weight="800" fill="#e0f2fe">cold upwelling</text><circle cx="1020" cy="280" r="4" fill="#4ade80"/><circle cx="1040" cy="280" r="4" fill="#4ade80"/><circle cx="1060" cy="280" r="4" fill="#4ade80"/><circle cx="1080" cy="280" r="4" fill="#4ade80"/><circle cx="1020" cy="294" r="4" fill="#4ade80"/><circle cx="1040" cy="294" r="4" fill="#4ade80"/><circle cx="1060" cy="294" r="4" fill="#4ade80"/><circle cx="1080" cy="294" r="4" fill="#4ade80"/><text x="1080" y="320" text-anchor="end" font-size="11" font-weight="800" fill="#bbf7d0">plankton,</text><text x="1080" y="334" text-anchor="end" font-size="11" font-weight="800" fill="#bbf7d0">fish</text><text x="1120" y="450" text-anchor="middle" font-size="13" font-weight="700" fill="#fff"></text><text x="610" y="500" text-anchor="middle" font-size="16" font-weight="800" fill="#1d4ed8">NORMAL YEAR</text></g></g>
<g class="part" data-part="nino" data-name="El Niño" data-info="Every 2–7 years the trade winds weaken; warm water spreads east, upwelling weakens, fish stocks fall and seabirds starve." tabindex="0" role="button" aria-label="El Niño"><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.4375;0.4688;1.0000" values="0;0;1;1" dur="16s" begin="en-play.begin+0s" fill="freeze"/><rect x="80" y="260" width="1060" height="200" fill="#1e3a8a"/><path d="M 80 260 L 1140 260 L 1140 340 L 80 370 Z" fill="#0ea5e9"/><path d="M 80 260 L 980 260 L 980 300 C 780 340 180 330 80 340 Z" fill="#f97316" opacity=".85"/><polyline points="80,370 100,369 120,369 140,368 160,368 180,367 200,367 220,366 240,365 260,365 280,364 300,364 320,363 340,363 360,362 380,362 400,361 420,360 440,360 460,359 480,359 500,358 520,358 540,357 560,356 580,356 600,355 620,355 640,354 660,354 680,353 700,352 720,352 740,351 760,351 780,350 800,350 820,349 840,348 860,348 880,347 900,347 920,346 940,346 960,345 980,345 1000,344 1020,343 1040,343 1060,342 1080,342 1100,341 1120,341 1140,340" fill="none" stroke="#fde047" stroke-width="3" stroke-dasharray="8 5"/><text x="600" y="373.2830188679245" text-anchor="middle" font-size="12" font-weight="800" fill="#fde047">thermocline</text><path d="M 60 460 L 60 230 L 110 250 L 140 260 L 80 460 Z" fill="#a16207"/><text x="86" y="220" text-anchor="start" font-size="12" font-weight="800" fill="#111827">Indonesia / Australia</text><path d="M 1160 460 L 1160 200 L 1110 240 L 1090 260 L 1140 460 Z" fill="#a16207"/><text x="1136" y="190" text-anchor="end" font-size="12" font-weight="800" fill="#111827">Peru (South America)</text><ellipse cx="930" cy="170" rx="90" ry="30" fill="#64748b"/><ellipse cx="970" cy="152" rx="60" ry="26" fill="#94a3b8"/><line x1="870" y1="198" x2="862" y2="242" stroke="#38bdf8" stroke-width="3"><animate attributeName="stroke-dashoffset" values="0;-20" dur=".6s" repeatCount="indefinite"/></line><line x1="890" y1="198" x2="882" y2="242" stroke="#38bdf8" stroke-width="3"><animate attributeName="stroke-dashoffset" values="0;-20" dur=".6s" repeatCount="indefinite"/></line><line x1="910" y1="198" x2="902" y2="242" stroke="#38bdf8" stroke-width="3"><animate attributeName="stroke-dashoffset" values="0;-20" dur=".6s" repeatCount="indefinite"/></line><line x1="930" y1="198" x2="922" y2="242" stroke="#38bdf8" stroke-width="3"><animate attributeName="stroke-dashoffset" values="0;-20" dur=".6s" repeatCount="indefinite"/></line><line x1="950" y1="198" x2="942" y2="242" stroke="#38bdf8" stroke-width="3"><animate attributeName="stroke-dashoffset" values="0;-20" dur=".6s" repeatCount="indefinite"/></line><line x1="970" y1="198" x2="962" y2="242" stroke="#38bdf8" stroke-width="3"><animate attributeName="stroke-dashoffset" values="0;-20" dur=".6s" repeatCount="indefinite"/></line><line x1="990" y1="198" x2="982" y2="242" stroke="#38bdf8" stroke-width="3"><animate attributeName="stroke-dashoffset" values="0;-20" dur=".6s" repeatCount="indefinite"/></line><path d="M 840 236 L 780 236" stroke="#94a3b8" stroke-width="3" stroke-dasharray="6 5" marker-end="url(#en-475569)"/><text x="880" y="226" text-anchor="middle" font-size="13" font-weight="800" fill="#475569">weak trade winds</text><path d="M 380 290 L 780 290" stroke="#fde68a" stroke-width="5" marker-end="url(#en-475569)"/><text x="580" y="282" text-anchor="middle" font-size="12" font-weight="800" fill="#fff7ed">warm water spreads east</text><text x="1070" y="400" text-anchor="end" font-size="12" font-weight="800" fill="#e0f2fe">little upwelling</text><text x="230" y="190" text-anchor="middle" font-size="14" font-weight="800" fill="#b45309">drought</text><text x="1120" y="450" text-anchor="middle" font-size="13" font-weight="700" fill="#fff"></text><text x="610" y="500" text-anchor="middle" font-size="16" font-weight="800" fill="#c2410c">EL NIÑO YEAR</text></g></g>
<g class="part" data-part="walker" data-name="Walker circulation" data-info="Air rises over the warm west Pacific (clouds, heavy rain) and sinks over the cool east Pacific (dry)." tabindex="0" role="button" aria-label="Walker circulation"><g><animate attributeName="opacity" keyTimes="0.0000;0.1875;0.2062;1.0000" values="0;0;1;1" dur="16s" begin="en-play.begin+0s" fill="freeze"/><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.1875;0.2062;0.4250;0.4437;1.0000" values="0;0;1;1;0;0" dur="16s" begin="en-play.begin+0s" fill="freeze"/><rect x="120.0" y="98" width="280" height="24" rx="12" fill="#e0f2fe" stroke="#1f2937" stroke-width="1"/><text x="260" y="115" text-anchor="middle" font-size="12" font-weight="700">rising air → clouds and rain (west)</text></g></g></g>
<g class="part" data-part="up" data-name="Upwelling" data-info="Off Peru, cold, nutrient-rich deep water rises to replace surface water blown west: plankton thrive, so fisheries are rich." tabindex="0" role="button" aria-label="Upwelling"><g><animate attributeName="opacity" keyTimes="0.0000;0.1875;0.2062;1.0000" values="0;0;1;1" dur="16s" begin="en-play.begin+0s" fill="freeze"/><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.1875;0.2062;0.4250;0.4437;1.0000" values="0;0;1;1;0;0" dur="16s" begin="en-play.begin+0s" fill="freeze"/><rect x="820.0" y="98" width="280" height="24" rx="12" fill="#ecfeff" stroke="#1f2937" stroke-width="1"/><text x="960" y="115" text-anchor="middle" font-size="12" font-weight="700">cold, nutrient-rich water upwells</text></g></g></g>
<g class="part" data-part="therm" data-name="Thermocline" data-info="The boundary between warm surface water and cold deep water; shallow in the east normally, deeper during El Niño." tabindex="0" role="button" aria-label="Thermocline"><text x="610" y="530" text-anchor="middle" font-size="12" font-weight="700" fill="#475569">dashed yellow line: thermocline (warm water above, cold below)</text></g>
<g class="part" data-part="impact" data-name="Impacts" data-info="Rain shifts east: floods in Peru and Ecuador; drought and fires in Indonesia and Australia; changes worldwide, e.g. often wetter short rains in East Africa." tabindex="0" role="button" aria-label="Impacts"><g><animate attributeName="opacity" keyTimes="0.0000;0.7812;0.8000;1.0000" values="0;0;1;1" dur="16s" begin="en-play.begin+0s" fill="freeze"/><rect x="80" y="560" width="1060" height="120" rx="16" fill="#fff7ed" stroke="#fdba74"/><text x="610" y="588" text-anchor="middle" font-size="15" font-weight="800" fill="#9a3412">El Niño impacts</text><text x="320" y="618" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">Peru, Ecuador: heavy rain, floods</text><text x="320" y="644" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">fish stocks (anchovy) collapse; seabirds starve</text><text x="880" y="618" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">Indonesia, Australia: drought, bushfires</text><text x="880" y="644" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">worldwide: e.g. often wetter short rains in East Africa</text><text x="610" y="670" text-anchor="middle" font-size="12" font-weight="600" fill="#475569">coral bleaching where seas warm</text></g></g>
</svg>