<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 540" class="vd-svg" role="img" aria-labelledby="ni-title ni-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="ni-play" data-vd-play-label="Play: build the niche" data-vd-steps="[[0, &quot;The ecological niche: a species&#x27; whole way of life.&quot;], [1, &quot;It combines where, what, tolerances and interactions.&quot;], [8, &quot;No two species can share exactly the same niche for long.&quot;]]" data-vd-dur="12">
<title id="ni-title">The ecological niche</title><desc id="ni-desc">A species at the centre with five aspects of its niche: habitat, food and feeding method, abiotic tolerances, biotic interactions and time of activity, plus competitive exclusion.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="540" fill="#ffffff"/>
<g aria-hidden="true"><animate id="ni-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<text class="head" x="30" y="34">The ecological niche</text><text class="note" x="30" y="56">Example: a leopard.</text>
<g class="part" data-part="n" data-name="Ecological niche" data-info="The role of a species in an ecosystem: where it lives (habitat), what it eats and how it obtains food, its tolerances of abiotic factors, and its interactions with other species." tabindex="0" role="button" aria-label="Ecological niche"><circle cx="420" cy="300" r="70" fill="#fef3c7" stroke="#a16207" stroke-width="3"/><text x="420" y="305" text-anchor="middle" font-size="16" font-weight="800" fill="#713f12">leopard</text><g><animate attributeName="opacity" keyTimes="0.0000;0.0833;0.1083;1.0000" values="0;0;1;1" dur="12s" begin="ni-play.begin+0s" fill="freeze"/><line x1="420" y1="228" x2="420" y2="110" stroke="#94a3b8" stroke-width="2"/><rect x="325" y="80" width="190" height="60" rx="14" fill="#bae6fd" stroke="#334155"/><text x="420.0" y="106.0" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">habitat</text><text x="420.0" y="126.0" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">where it lives</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.1833;0.2083;1.0000" values="0;0;1;1" dur="12s" begin="ni-play.begin+0s" fill="freeze"/><line x1="488" y1="278" x2="639" y2="241" stroke="#94a3b8" stroke-width="2"/><rect x="544" y="211" width="190" height="60" rx="14" fill="#fde68a" stroke="#334155"/><text x="638.7429987478853" y="237.28677106876" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">food</text><text x="638.7429987478853" y="257.28677106876" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">what it eats and how</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.2833;0.3083;1.0000" values="0;0;1;1" dur="12s" begin="ni-play.begin+0s" fill="freeze"/><line x1="462" y1="358" x2="555" y2="454" stroke="#94a3b8" stroke-width="2"/><rect x="460" y="424" width="190" height="60" rx="14" fill="#fecaca" stroke="#334155"/><text x="555.1906080272688" y="449.71322893124" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">abiotic tolerances</text><text x="555.1906080272688" y="469.71322893124" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">temperature, water...</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.3833;0.4083;1.0000" values="0;0;1;1" dur="12s" begin="ni-play.begin+0s" fill="freeze"/><line x1="378" y1="358" x2="285" y2="454" stroke="#94a3b8" stroke-width="2"/><rect x="190" y="424" width="190" height="60" rx="14" fill="#ddd6fe" stroke="#334155"/><text x="284.8093919727312" y="449.71322893124" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">biotic interactions</text><text x="284.8093919727312" y="469.71322893124" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">predators, competitors</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.4833;0.5083;1.0000" values="0;0;1;1" dur="12s" begin="ni-play.begin+0s" fill="freeze"/><line x1="352" y1="278" x2="201" y2="241" stroke="#94a3b8" stroke-width="2"/><rect x="106" y="211" width="190" height="60" rx="14" fill="#bbf7d0" stroke="#334155"/><text x="201.25700125211466" y="237.28677106876" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">time of activity</text><text x="201.25700125211466" y="257.28677106876" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">day or night</text></g></g>
<g class="part" data-part="comp" data-name="Competitive exclusion" data-info="Two species cannot share exactly the same niche indefinitely: one out-competes the other." tabindex="0" role="button" aria-label="Competitive exclusion"><rect x="760" y="120" width="310" height="300" rx="16" fill="#f8fafc" stroke="#cbd5e1"/><text x="915" y="146" text-anchor="middle" font-size="14" font-weight="800" fill="#111827">same niche?</text><circle cx="860" cy="270" r="80" fill="#93c5fd" opacity=".6"/><circle cx="960" cy="270" r="80" fill="#fca5a5" opacity=".6"><animate attributeName="r" keyTimes="0.0000;0.7083;0.9167;1.0000" values="80;80;20;20" dur="12s" begin="ni-play.begin+0s" fill="freeze"/></circle><g><animate attributeName="opacity" keyTimes="0.0000;0.8333;0.8583;1.0000" values="0;0;1;1" dur="12s" begin="ni-play.begin+0s" fill="freeze"/><text x="915" y="400" text-anchor="middle" font-size="12" font-weight="800" fill="#b91c1c">one species out-competes the other</text></g></g>
</svg>