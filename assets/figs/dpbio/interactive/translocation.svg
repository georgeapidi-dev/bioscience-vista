<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" class="vd-svg" role="img" aria-labelledby="tl2-title tl2-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="tl2-play" data-vd-play-label="Play: translocate" data-vd-steps="[[0, &quot;Translocation: moving sucrose and amino acids in phloem.&quot;], [1, &quot;Leaves are sources.&quot;], [5, &quot;Roots, fruits and growing tips are sinks.&quot;], [10, &quot;A storage organ can be a sink or a source.&quot;]]" data-vd-dur="15">
<title id="tl2-title">Translocation: sources and sinks</title><desc id="tl2-desc">A plant with phloem carrying sucrose from photosynthesising leaves (source) down to the roots and a potato tuber and up to fruits and a growing shoot (sinks); in spring the tuber becomes a source.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="560" fill="#ffffff"/>
<g aria-hidden="true"><animate id="tl2-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<text class="head" x="30" y="34">Translocation in the phloem</text><text class="note" x="30" y="56">Sucrose and amino acids move from source to sink.</text>
<rect x="0" y="380" width="1100" height="180" fill="#d6c5a8"/><path d="M 450 380 L 450 130" stroke="#15803d" stroke-width="12"/><ellipse cx="530" cy="200" rx="70" ry="20" fill="#4ade80" stroke="#15803d" transform="rotate(-20 530 200)"/><ellipse cx="370" cy="270" rx="70" ry="20" fill="#4ade80" stroke="#15803d" transform="rotate(20 370 270)"/><ellipse cx="530" cy="340" rx="70" ry="20" fill="#4ade80" stroke="#15803d" transform="rotate(-20 530 340)"/><path d="M 450 380 L 380 470 M 450 380 L 520 480 M 450 380 L 450 500" stroke="#a16207" stroke-width="6"/><ellipse cx="560" cy="440" rx="50" ry="30" fill="#d4a373" stroke="#7c2d12" stroke-width="2"/><circle cx="450" cy="110" r="22" fill="#f87171" stroke="#991b1b"/>
<g class="part" data-part="src" data-name="Sources" data-info="A source releases sucrose and amino acids into the phloem: photosynthesising leaves, or a storage organ when its reserves are being used (e.g. a potato tuber in spring)." tabindex="0" role="button" aria-label="Sources"><g><animate attributeName="opacity" keyTimes="0.0000;0.0667;0.0867;1.0000" values="0;0;1;1" dur="15s" begin="tl2-play.begin+0s" fill="freeze"/><text x="640" y="220" text-anchor="start" font-size="14" font-weight="800" fill="#15803d">SOURCE: leaves (photosynthesis)</text></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.1000;0.1133;0.3067;0.3200;1.0000" values="0;0;1;1;0;0" dur="15s" begin="tl2-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.1000;0.3000;1.0000" values="450 200;450 200;450 380;540 430;540 430" dur="15s" begin="tl2-play.begin+0s" fill="freeze"/><rect x="-6" y="-5" width="12" height="10" fill="#f59e0b"/></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.1400;0.1533;0.3467;0.3600;1.0000" values="0;0;1;1;0;0" dur="15s" begin="tl2-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.1400;0.3400;1.0000" values="450 200;450 200;450 380;540 430;540 430" dur="15s" begin="tl2-play.begin+0s" fill="freeze"/><rect x="-6" y="-5" width="12" height="10" fill="#f59e0b"/></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.1800;0.1933;0.3867;0.4000;1.0000" values="0;0;1;1;0;0" dur="15s" begin="tl2-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.1800;0.3800;1.0000" values="450 200;450 200;450 380;540 430;540 430" dur="15s" begin="tl2-play.begin+0s" fill="freeze"/><rect x="-6" y="-5" width="12" height="10" fill="#f59e0b"/></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.2200;0.2333;0.4267;0.4400;1.0000" values="0;0;1;1;0;0" dur="15s" begin="tl2-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.2200;0.4200;1.0000" values="450 200;450 200;450 380;540 430;540 430" dur="15s" begin="tl2-play.begin+0s" fill="freeze"/><rect x="-6" y="-5" width="12" height="10" fill="#f59e0b"/></g></g></g>
<g class="part" data-part="sink" data-name="Sinks" data-info="A sink takes them out of the phloem to use or store: roots, growing shoots, flowers, fruits, seeds, and storage organs while they are filling." tabindex="0" role="button" aria-label="Sinks"><g><animate attributeName="opacity" keyTimes="0.0000;0.3333;0.3533;1.0000" values="0;0;1;1" dur="15s" begin="tl2-play.begin+0s" fill="freeze"/><text x="620" y="470" text-anchor="start" font-size="14" font-weight="800" fill="#7c2d12">SINK: tuber filling, roots</text><text x="480" y="100" text-anchor="start" font-size="14" font-weight="800" fill="#991b1b">SINK: fruit, growing tip</text></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.3333;0.3467;0.4733;0.4867;1.0000" values="0;0;1;1;0;0" dur="15s" begin="tl2-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.3333;0.4667;1.0000" values="450 230;450 230;450 125;450 125" dur="15s" begin="tl2-play.begin+0s" fill="freeze"/><rect x="-6" y="-5" width="12" height="10" fill="#f59e0b"/></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.3733;0.3867;0.5133;0.5267;1.0000" values="0;0;1;1;0;0" dur="15s" begin="tl2-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.3733;0.5067;1.0000" values="450 230;450 230;450 125;450 125" dur="15s" begin="tl2-play.begin+0s" fill="freeze"/><rect x="-6" y="-5" width="12" height="10" fill="#f59e0b"/></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.4133;0.4267;0.5533;0.5667;1.0000" values="0;0;1;1;0;0" dur="15s" begin="tl2-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.4133;0.5467;1.0000" values="450 230;450 230;450 125;450 125" dur="15s" begin="tl2-play.begin+0s" fill="freeze"/><rect x="-6" y="-5" width="12" height="10" fill="#f59e0b"/></g></g></g>
<g class="part" data-part="season" data-name="Changing roles" data-info="In summer the tuber is a sink; in spring, before leaves have grown, it becomes a source for new shoots. Phloem carries materials both up and down." tabindex="0" role="button" aria-label="Changing roles"><g><animate attributeName="opacity" keyTimes="0.0000;0.6667;0.6867;1.0000" values="0;0;1;1" dur="15s" begin="tl2-play.begin+0s" fill="freeze"/><rect x="760" y="260" width="310" height="170" rx="16" fill="#fef3c7" stroke="#fcd34d"/><text x="915" y="288" text-anchor="middle" font-size="15" font-weight="800" fill="#a16207">changing roles</text><text x="915" y="318" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">summer: tuber = sink</text><text x="915" y="342" text-anchor="middle" font-size="12" font-weight="700" fill="#475569">(stores starch)</text><text x="915" y="374" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">spring: tuber = source</text><text x="915" y="398" text-anchor="middle" font-size="12" font-weight="700" fill="#475569">(feeds new shoots)</text></g></g>
</svg>