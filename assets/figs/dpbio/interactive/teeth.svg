<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 540" class="vd-svg" role="img" aria-labelledby="th-title th-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="th-play" data-vd-play-label="Play: chew" data-vd-steps="[[0, &quot;Human teeth.&quot;], [1, &quot;Four types with different jobs.&quot;], [7, &quot;Inside a tooth: enamel, dentine, pulp.&quot;]]" data-vd-dur="13">
<title id="th-title">Teeth</title><desc id="th-desc">Four types of human teeth, incisors, canines, premolars and molars, with their functions, and a section through a molar showing enamel, dentine, pulp cavity with nerves and blood vessels, gum, cement and jaw bone.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="540" fill="#ffffff"/>
<g aria-hidden="true"><animate id="th-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<text class="head" x="30" y="34">Teeth: types and structure</text><text class="note" x="30" y="56">Physical digestion: breaking food into smaller pieces.</text>
<g class="part" data-part="types" data-name="Types of teeth" data-info="Incisors cut, canines tear, premolars and molars grind food, increasing its surface area for enzymes (physical digestion)." tabindex="0" role="button" aria-label="Types of teeth"><g><animate attributeName="opacity" keyTimes="0.0000;0.0769;0.1000;1.0000" values="0;0;1;1" dur="13s" begin="th-play.begin+0s" fill="freeze"/><g transform="translate(90 220)"><path d="M -18 0 L -18 -60 L 18 -60 L 18 0 Z" fill="#f8fafc" stroke="#60a5fa" stroke-width="3"/><path d="M -12 0 L -8 60 L 8 60 L 12 0" fill="#fde68a" stroke="#a16207"/></g><text x="90" y="320" text-anchor="middle" font-size="14" font-weight="800" fill="#60a5fa">incisors</text><text x="90" y="342" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">chisel-shaped</text><text x="90" y="358" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">biting and cutting</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.1769;0.2000;1.0000" values="0;0;1;1" dur="13s" begin="th-play.begin+0s" fill="freeze"/><g transform="translate(220 220)"><path d="M -18 0 L -14 -50 L 0 -78 L 14 -50 L 18 0 Z" fill="#f8fafc" stroke="#f59e0b" stroke-width="3"/><path d="M -12 0 L -8 60 L 8 60 L 12 0" fill="#fde68a" stroke="#a16207"/></g><text x="220" y="320" text-anchor="middle" font-size="14" font-weight="800" fill="#f59e0b">canines</text><text x="220" y="342" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">pointed</text><text x="220" y="358" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">tearing and gripping</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.2769;0.3000;1.0000" values="0;0;1;1" dur="13s" begin="th-play.begin+0s" fill="freeze"/><g transform="translate(350 220)"><path d="M -24 0 L -24 -50 Q -12 -66 0 -52 Q 12 -66 24 -50 L 24 0 Z" fill="#f8fafc" stroke="#16a34a" stroke-width="3"/><path d="M -12 0 L -8 60 L 8 60 L 12 0" fill="#fde68a" stroke="#a16207"/></g><text x="350" y="320" text-anchor="middle" font-size="14" font-weight="800" fill="#16a34a">premolars</text><text x="350" y="342" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">broad with cusps</text><text x="350" y="358" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">grinding and crushing</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.3769;0.4000;1.0000" values="0;0;1;1" dur="13s" begin="th-play.begin+0s" fill="freeze"/><g transform="translate(480 220)"><path d="M -32 0 L -32 -50 Q -20 -68 -8 -52 Q 4 -68 16 -52 Q 28 -66 32 -50 L 32 0 Z" fill="#f8fafc" stroke="#7c3aed" stroke-width="3"/><path d="M -12 0 L -8 60 L 8 60 L 12 0" fill="#fde68a" stroke="#a16207"/></g><text x="480" y="320" text-anchor="middle" font-size="14" font-weight="800" fill="#7c3aed">molars</text><text x="480" y="342" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">large, broad with cusps</text><text x="480" y="358" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">grinding</text></g></g>
<g class="part" data-part="tooth" data-name="Inside a tooth" data-info="Enamel (hardest substance in the body) covers the crown; dentine below; pulp cavity with nerves and blood vessels; cement and fibres anchor the root in the jaw bone." tabindex="0" role="button" aria-label="Inside a tooth"><g><animate attributeName="opacity" keyTimes="0.0000;0.5385;0.5615;1.0000" values="0;0;1;1" dur="13s" begin="th-play.begin+0s" fill="freeze"/><g transform="translate(830 300)"><path d="M -90 -60 L -90 -160 Q -60 -200 -30 -170 Q 0 -200 30 -170 Q 60 -200 90 -160 L 90 -60 L 70 140 L 20 140 L 0 60 L -20 140 L -70 140 Z" fill="#fef3c7" stroke="#a16207" stroke-width="3"/><path d="M -90 -60 L -90 -160 Q -60 -200 -30 -170 Q 0 -200 30 -170 Q 60 -200 90 -160 L 90 -60 Q 0 -80 -90 -60 Z" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><path d="M -40 -120 L -40 40 Q -30 80 -15 120 M 40 -120 L 40 40 Q 30 80 15 120" fill="none" stroke="#dc2626" stroke-width="3"/><path d="M -45 -130 Q 0 -150 45 -130 L 45 40 L -45 40 Z" fill="#fecaca" opacity=".7"/><rect x="-150" y="-60" width="300" height="30" fill="#f9a8d4" opacity=".6"/><rect x="-150" y="-30" width="300" height="170" fill="#e7e5e4" opacity=".45"/></g><line x1="770" y1="125" x2="660" y2="110" stroke="#475569" stroke-width="1.5"/><circle cx="770" cy="125" r="3" fill="#475569"/><text x="655" y="114" text-anchor="end" font-size="12" font-weight="800" fill="#111827">enamel</text><line x1="760" y1="200" x2="660" y2="190" stroke="#475569" stroke-width="1.5"/><circle cx="760" cy="200" r="3" fill="#475569"/><text x="655" y="194" text-anchor="end" font-size="12" font-weight="800" fill="#111827">dentine</text><line x1="830" y1="230" x2="960" y2="150" stroke="#475569" stroke-width="1.5"/><circle cx="830" cy="230" r="3" fill="#475569"/><text x="965" y="146" text-anchor="start" font-size="12" font-weight="800" fill="#b91c1c">pulp: nerves,</text><text x="965" y="162" text-anchor="start" font-size="12" font-weight="800" fill="#b91c1c">blood vessels</text><line x1="950" y1="255" x2="1000" y2="250" stroke="#475569" stroke-width="1.5"/><circle cx="950" cy="255" r="3" fill="#475569"/><text x="1005" y="254" text-anchor="start" font-size="12" font-weight="800" fill="#9d174d">gum</text><line x1="960" y1="360" x2="1000" y2="350" stroke="#475569" stroke-width="1.5"/><circle cx="960" cy="360" r="3" fill="#475569"/><text x="1005" y="354" text-anchor="start" font-size="12" font-weight="800" fill="#57534e">jaw bone</text><line x1="895" y1="420" x2="1000" y2="430" stroke="#475569" stroke-width="1.5"/><circle cx="895" cy="420" r="3" fill="#475569"/><text x="1005" y="434" text-anchor="start" font-size="12" font-weight="800" fill="#a16207">cement</text></g></g>
