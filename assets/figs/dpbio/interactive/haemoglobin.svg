<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" class="vd-svg" role="img" aria-labelledby="hb-title hb-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="hb-play" data-vd-play-label="Play: loading oxygen" data-vd-steps="[[0, &quot;Haemoglobin: four polypeptide chains, each with a haem group containing iron.&quot;], [1, &quot;The first oxygen binds with difficulty\u2026&quot;], [3, &quot;\u2026then the shape changes and the next three bind more easily: cooperative binding.&quot;], [6.5, &quot;This gives the S-shaped oxygen dissociation curve.&quot;], [10, &quot;Lungs: high pO\u2082, haemoglobin is almost fully saturated. Tissues: low pO\u2082, oxygen is released.&quot;], [13.5, &quot;Bohr shift: high CO\u2082 moves the curve right, so more oxygen is released in active muscles.&quot;]]" data-vd-dur="18">
<title id="hb-title">Haemoglobin and oxygen</title><desc id="hb-desc">Haemoglobin with two alpha and two beta chains and four haem groups binding oxygen one by one, the sigmoid oxygen dissociation curve with loading in the lungs and unloading in tissues, and the Bohr shift.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1200" height="680" fill="#ffffff"/>
<g aria-hidden="true"><animate id="hb-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<text class="head" x="30" y="34">Haemoglobin and the oxygen dissociation curve</text><text class="note" x="30" y="56">Structure simplified.</text>
<g class="part" data-part="hb" data-name="Haemoglobin" data-info="A globular protein with quaternary structure: four polypeptide chains (two alpha, two beta)." tabindex="0" role="button" aria-label="Haemoglobin"><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.1667;0.2000;1.0000" values="0 0;0 0;5.6000000000000005 5.6000000000000005;5.6000000000000005 5.6000000000000005" dur="18s" begin="hb-play.begin+0s" fill="freeze"/><path d="M 118 260 C 118 190 242 190 242 260 C 242 330 118 330 118 260 Z" fill="#ef4444" fill-opacity=".35" stroke="#ef4444" stroke-width="3"/><text x="144" y="224" text-anchor="middle" font-size="20" font-weight="800" fill="#ef4444">α</text></g><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.1667;0.2000;1.0000" values="0 0;0 0;-5.6000000000000005 5.6000000000000005;-5.6000000000000005 5.6000000000000005" dur="18s" begin="hb-play.begin+0s" fill="freeze"/><path d="M 258 260 C 258 190 382 190 382 260 C 382 330 258 330 258 260 Z" fill="#3b82f6" fill-opacity=".35" stroke="#3b82f6" stroke-width="3"/><text x="356" y="224" text-anchor="middle" font-size="20" font-weight="800" fill="#3b82f6">β</text></g><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.1667;0.2000;1.0000" values="0 0;0 0;5.6000000000000005 -5.6000000000000005;5.6000000000000005 -5.6000000000000005" dur="18s" begin="hb-play.begin+0s" fill="freeze"/><path d="M 118 400 C 118 330 242 330 242 400 C 242 470 118 470 118 400 Z" fill="#3b82f6" fill-opacity=".35" stroke="#3b82f6" stroke-width="3"/><text x="144" y="444" text-anchor="middle" font-size="20" font-weight="800" fill="#3b82f6">β</text></g><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.1667;0.2000;1.0000" values="0 0;0 0;-5.6000000000000005 -5.6000000000000005;-5.6000000000000005 -5.6000000000000005" dur="18s" begin="hb-play.begin+0s" fill="freeze"/><path d="M 258 400 C 258 330 382 330 382 400 C 382 470 258 470 258 400 Z" fill="#ef4444" fill-opacity=".35" stroke="#ef4444" stroke-width="3"/><text x="356" y="444" text-anchor="middle" font-size="20" font-weight="800" fill="#ef4444">α</text></g></g>
<g class="part" data-part="haem" data-name="Haem group" data-info="A prosthetic group in each chain with an iron ion (Fe²⁺) that binds one oxygen molecule. So one haemoglobin carries up to four O₂." tabindex="0" role="button" aria-label="Haem group"><rect x="181.5" y="261.5" width="32" height="32" rx="4" fill="#7f1d1d" transform="rotate(45 197.5 277.5)"/><text x="197.5" y="282.5" text-anchor="middle" font-size="12" font-weight="800" fill="#fde68a">Fe</text><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.0556;0.0667;1.0000" values="0;0;1;1" dur="18s" begin="hb-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.0556;0.1556;1.0000" values="97.5 117.5;97.5 117.5;197.5 255.5;197.5 255.5" dur="18s" begin="hb-play.begin+0s" fill="freeze"/><g><circle cx="-7" r="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/><circle cx="7" r="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/></g></g></g><rect x="286.5" y="261.5" width="32" height="32" rx="4" fill="#7f1d1d" transform="rotate(45 302.5 277.5)"/><text x="302.5" y="282.5" text-anchor="middle" font-size="12" font-weight="800" fill="#fde68a">Fe</text><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.1667;0.1778;1.0000" values="0;0;1;1" dur="18s" begin="hb-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.1667;0.2111;1.0000" values="402.5 117.5;402.5 117.5;302.5 255.5;302.5 255.5" dur="18s" begin="hb-play.begin+0s" fill="freeze"/><g><circle cx="-7" r="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/><circle cx="7" r="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/></g></g></g><rect x="181.5" y="366.5" width="32" height="32" rx="4" fill="#7f1d1d" transform="rotate(45 197.5 382.5)"/><text x="197.5" y="387.5" text-anchor="middle" font-size="12" font-weight="800" fill="#fde68a">Fe</text><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.2000;0.2111;1.0000" values="0;0;1;1" dur="18s" begin="hb-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.2000;0.2444;1.0000" values="97.5 222.5;97.5 222.5;197.5 360.5;197.5 360.5" dur="18s" begin="hb-play.begin+0s" fill="freeze"/><g><circle cx="-7" r="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/><circle cx="7" r="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/></g></g></g><rect x="286.5" y="366.5" width="32" height="32" rx="4" fill="#7f1d1d" transform="rotate(45 302.5 382.5)"/><text x="302.5" y="387.5" text-anchor="middle" font-size="12" font-weight="800" fill="#fde68a">Fe</text><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.2333;0.2444;1.0000" values="0;0;1;1" dur="18s" begin="hb-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.2333;0.2778;1.0000" values="402.5 222.5;402.5 222.5;302.5 360.5;302.5 360.5" dur="18s" begin="hb-play.begin+0s" fill="freeze"/><g><circle cx="-7" r="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/><circle cx="7" r="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/></g></g></g></g>
<g class="part" data-part="coop" data-name="Cooperative binding" data-info="When the first O₂ binds, the shape of haemoglobin changes, making it easier for the next O₂ to bind: this gives the S-shaped (sigmoid) curve." tabindex="0" role="button" aria-label="Cooperative binding"><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.1667;0.1833;1.0000" values="0;0;1;1" dur="18s" begin="hb-play.begin+0s" fill="freeze"/><rect x="60" y="540" width="390" height="110" rx="14" fill="#f0f9ff" stroke="#7dd3fc"/><text x="80" y="566" text-anchor="start" font-size="14" font-weight="800" fill="#075985">Cooperative binding</text><text x="80" y="590" text-anchor="start" font-size="12" font-weight="600" fill="#334155">binding of each O₂ changes the shape of the</text><text x="80" y="608" text-anchor="start" font-size="12" font-weight="600" fill="#334155">protein, so the next O₂ binds more easily.</text><text x="80" y="632" text-anchor="start" font-size="12" font-weight="800" fill="#0369a1">Hb + 4 O₂ ⇌ Hb(O₂)₄ (oxyhaemoglobin)</text></g></g>
<line x1="560" y1="560" x2="1120" y2="560" stroke="#111827" stroke-width="2"/><line x1="560" y1="560" x2="560" y2="120" stroke="#111827" stroke-width="2"/><text x="560.0" y="580" text-anchor="middle" font-size="12">0</text><text x="640.0" y="580" text-anchor="middle" font-size="12">2</text><text x="720.0" y="580" text-anchor="middle" font-size="12">4</text><text x="800.0" y="580" text-anchor="middle" font-size="12">6</text><text x="880.0" y="580" text-anchor="middle" font-size="12">8</text><text x="960.0" y="580" text-anchor="middle" font-size="12">10</text><text x="1040.0" y="580" text-anchor="middle" font-size="12">12</text><text x="1120.0" y="580" text-anchor="middle" font-size="12">14</text><text x="552" y="564.0" text-anchor="end" font-size="12">0</text><text x="552" y="476.0" text-anchor="end" font-size="12">20</text><text x="552" y="388.0" text-anchor="end" font-size="12">40</text><text x="552" y="300.0" text-anchor="end" font-size="12">60</text><text x="552" y="212.0" text-anchor="end" font-size="12">80</text><text x="552" y="124.0" text-anchor="end" font-size="12">100</text><text x="840.0" y="604" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">partial pressure of oxygen / kPa</text><text x="516" y="340.0" text-anchor="middle" font-size="13" transform="rotate(-90 516 340.0)">% saturation of haemoglobin</text>
