<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 540" class="vd-svg" role="img" aria-labelledby="sd2-title sd2-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="sd2-play" data-vd-play-label="Play: fertilise" data-vd-steps="[[0, &quot;Boy or girl?&quot;], [1, &quot;Every egg carries an X; half the sperm carry X, half carry Y.&quot;], [5, &quot;XX \u2192 female-typical; XY \u2192 male-typical (SRY on Y). A 1:1 ratio.&quot;], [9.5, &quot;X carries far more genes than Y: sex linkage.&quot;]]" data-vd-dur="13">
<title id="sd2-title">Sex determination</title><desc id="sd2-desc">Eggs all carry an X chromosome; sperm carry either X or Y; fertilisation gives XX or XY zygotes in a one to one ratio, with SRY on the Y triggering testis development; the X carries about 800 genes and the Y about 70.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="540" fill="#ffffff"/>
<g aria-hidden="true"><animate id="sd2-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<text class="head" x="30" y="34">Boy or girl? Sex determination</text><text class="note" x="30" y="56">Schematic.</text>
<g class="part" data-part="gam" data-name="Gametes" data-info="Every egg carries an X; a sperm carries either X or Y." tabindex="0" role="button" aria-label="Gametes"><g><animate attributeName="opacity" keyTimes="0.0000;0.0769;0.1000;1.0000" values="0;0;1;1" dur="13s" begin="sd2-play.begin+0s" fill="freeze"/><circle cx="160" cy="200" r="60" fill="#fce7f3" stroke="#9d174d" stroke-width="2"/><path d="M 148 182 L 172 218 M 172 182 L 148 218" stroke="#ec4899" stroke-width="8" stroke-linecap="round"/><text x="160" y="290" text-anchor="middle" font-size="13" font-weight="800" fill="#9d174d">egg: always X</text><ellipse cx="420" cy="150" rx="32" ry="22" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/><path d="M 452 150 q 30 -10 60 0" stroke="#0369a1" stroke-width="3" fill="none"/><path d="M 408 132 L 432 168 M 432 132 L 408 168" stroke="#ec4899" stroke-width="8" stroke-linecap="round"/><ellipse cx="420" cy="250" rx="32" ry="22" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/><path d="M 452 250 q 30 -10 60 0" stroke="#0369a1" stroke-width="3" fill="none"/><path d="M 408 232 L 420 250 L 432 232 M 420 250 L 420 268" stroke="#3b82f6" stroke-width="8" stroke-linecap="round" fill="none"/><text x="440" y="310" text-anchor="middle" font-size="13" font-weight="800" fill="#0369a1">sperm: X or Y (50 : 50)</text></g></g>
<g class="part" data-part="zyg" data-name="Zygotes" data-info="XX develops female-typical characteristics; XY male-typical: the SRY gene on the Y triggers testis development. So the sperm decides." tabindex="0" role="button" aria-label="Zygotes"><g><animate attributeName="opacity" keyTimes="0.0000;0.3846;0.4077;1.0000" values="0;0;1;1" dur="13s" begin="sd2-play.begin+0s" fill="freeze"/><circle cx="680" cy="180" r="46" fill="#fce7f3" stroke="#9d174d" stroke-width="2"/><path d="M 652 162 L 676 198 M 676 162 L 652 198" stroke="#ec4899" stroke-width="8" stroke-linecap="round"/><path d="M 684 162 L 708 198 M 708 162 L 684 198" stroke="#ec4899" stroke-width="8" stroke-linecap="round"/><text x="680" y="250" text-anchor="middle" font-size="13" font-weight="800" fill="#9d174d">XX → female-typical</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.4615;0.4846;1.0000" values="0;0;1;1" dur="13s" begin="sd2-play.begin+0s" fill="freeze"/><circle cx="900" cy="180" r="46" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/><path d="M 872 162 L 896 198 M 896 162 L 872 198" stroke="#ec4899" stroke-width="8" stroke-linecap="round"/><path d="M 904 162 L 916 180 L 928 162 M 916 180 L 916 198" stroke="#3b82f6" stroke-width="8" stroke-linecap="round" fill="none"/><text x="900" y="250" text-anchor="middle" font-size="13" font-weight="800" fill="#0369a1">XY → male-typical</text><text x="900" y="268" text-anchor="middle" font-size="11" font-weight="700" fill="#0369a1">(SRY gene on Y)</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.5385;0.5615;1.0000" values="0;0;1;1" dur="13s" begin="sd2-play.begin+0s" fill="freeze"/><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.5385;0.5615;1.0000" values="0;0;1;1" dur="13s" begin="sd2-play.begin+0s" fill="freeze"/><rect x="670.0" y="288" width="240" height="24" rx="12" fill="#f1f5f9" stroke="#1f2937" stroke-width="1"/><text x="790" y="305" text-anchor="middle" font-size="12" font-weight="700">the sperm decides · 1 : 1</text></g></g></g>
<g class="part" data-part="xy" data-name="X and Y" data-info="The X carries about 800 protein-coding genes; the Y about 70. Genes on the X but not the Y are sex-linked: males have only one copy." tabindex="0" role="button" aria-label="X and Y"><rect x="120" y="360" width="860" height="150" rx="16" fill="#f8fafc" stroke="#cbd5e1"/><g><animate attributeName="opacity" keyTimes="0.0000;0.7308;0.7538;1.0000" values="0;0;1;1" dur="13s" begin="sd2-play.begin+0s" fill="freeze"/><rect x="200" y="390" width="40" height="100" rx="18" fill="#f9a8d4" stroke="#9d174d" stroke-width="2"/><text x="220" y="384" text-anchor="middle" font-size="14" font-weight="800" fill="#9d174d">X</text><rect x="290" y="440" width="34" height="50" rx="16" fill="#93c5fd" stroke="#1d4ed8" stroke-width="2"/><text x="307" y="434" text-anchor="middle" font-size="14" font-weight="800" fill="#1d4ed8">Y</text><text x="600" y="420" text-anchor="middle" font-size="14" font-weight="800" fill="#111827">X: ~800 protein-coding genes · Y: ~70</text><text x="600" y="450" text-anchor="middle" font-size="12" font-weight="700" fill="#475569">genes on X but not Y are sex-linked:</text><text x="600" y="470" text-anchor="middle" font-size="12" font-weight="700" fill="#475569">males have only one copy</text></g></g>
</svg>