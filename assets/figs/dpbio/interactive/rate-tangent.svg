<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 540" class="vd-svg" role="img" aria-labelledby="tg-title tg-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="tg-play" data-vd-play-label="Play: draw tangents" data-vd-steps="[[0, &quot;Finding a rate from a curve.&quot;], [1, &quot;Hydrogen peroxide is used up quickly at first, then more slowly.&quot;], [4.5, &quot;A tangent at t = 0: its gradient is the initial rate.&quot;], [8.5, &quot;A tangent later on is less steep: the rate is lower.&quot;], [11.5, &quot;Gradient = \u0394y \u00f7 \u0394x.&quot;]]" data-vd-dur="14">
<title id="tg-title">Rate from the gradient of a tangent</title><desc id="tg-desc">A curve of hydrogen peroxide concentration falling over time, with a steep tangent at time zero giving the initial rate and a shallower tangent later, and the gradient calculated as change in y over change in x.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="540" fill="#ffffff"/>
<g aria-hidden="true"><animate id="tg-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<text class="head" x="30" y="34">Finding a rate: the gradient of a tangent</text><text class="note" x="30" y="56">Catalase breaking down hydrogen peroxide (illustrative).</text>
<line x1="110" y1="470" x2="770" y2="470" stroke="#111827" stroke-width="2"/><line x1="110" y1="470" x2="110" y2="90" stroke="#111827" stroke-width="2"/><text x="440.0" y="504" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">time / minutes</text><text x="66" y="280.0" font-size="13" font-weight="700" text-anchor="middle" transform="rotate(-90 66 280.0)">[H₂O₂] / mol dm⁻³</text><text x="110.0" y="486" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">0</text><text x="220.0" y="486" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">4</text><text x="330.0" y="486" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">8</text><text x="440.0" y="486" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">12</text><text x="550.0" y="486" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">16</text><text x="660.0" y="486" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">20</text><text x="770.0" y="486" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">24</text><text x="102" y="474.0" text-anchor="end" font-size="11" font-weight="700" fill="#475569">0.0</text><text x="102" y="401.6190476190476" text-anchor="end" font-size="11" font-weight="700" fill="#475569">0.2</text><text x="102" y="329.23809523809524" text-anchor="end" font-size="11" font-weight="700" fill="#475569">0.4</text><text x="102" y="256.8571428571429" text-anchor="end" font-size="11" font-weight="700" fill="#475569">0.6</text><text x="102" y="184.47619047619048" text-anchor="end" font-size="11" font-weight="700" fill="#475569">0.8</text><text x="102" y="112.09523809523813" text-anchor="end" font-size="11" font-weight="700" fill="#475569">1.0</text>
<g class="part" data-part="curve" data-name="Product or substrate against time" data-info="Example: concentration of hydrogen peroxide falling as catalase breaks it down. The curve gets less steep as substrate is used up." tabindex="0" role="button" aria-label="Product or substrate against time"><clipPath id="tgc-c1090110"><rect x="110" y="90" width="664" height="384"><animate attributeName="width" keyTimes="0.0000;0.0714;0.2857;1.0000" values="0;0;664;664" dur="14s" begin="tg-play.begin+0s" fill="freeze"/></rect></clipPath><g clip-path="url(#tgc-c1090110)"><polyline points="110.0,108.1 113.3,114.2 116.6,120.3 119.9,126.2 123.2,132.1 126.5,137.8 129.8,143.5 133.1,149.0 136.4,154.5 139.7,159.8 143.0,165.1 146.3,170.3 149.6,175.4 152.9,180.4 156.2,185.3 159.5,190.2 162.8,194.9 166.1,199.6 169.4,204.2 172.7,208.7 176.0,213.1 179.3,217.5 182.6,221.8 185.9,226.0 189.2,230.2 192.5,234.2 195.8,238.2 199.1,242.2 202.4,246.1 205.7,249.9 209.0,253.6 212.3,257.3 215.6,260.9 218.9,264.5 222.2,267.9 225.5,271.4 228.8,274.8 232.1,278.1 235.4,281.3 238.7,284.5 242.0,287.7 245.3,290.8 248.6,293.8 251.9,296.8 255.2,299.8 258.5,302.7 261.8,305.5 265.1,308.3 268.4,311.1 271.7,313.8 275.0,316.4 278.3,319.0 281.6,321.6 284.9,324.1 288.2,326.6 291.5,329.0 294.8,331.4 298.1,333.8 301.4,336.1 304.7,338.4 308.0,340.6 311.3,342.8 314.6,345.0 317.9,347.1 321.2,349.2 324.5,351.2 327.8,353.3 331.1,355.2 334.4,357.2 337.7,359.1 341.0,361.0 344.3,362.8 347.6,364.7 350.9,366.5 354.2,368.2 357.5,370.0 360.8,371.7 364.1,373.3 367.4,375.0 370.7,376.6 374.0,378.2 377.3,379.7 380.6,381.3 383.9,382.8 387.2,384.3 390.5,385.7 393.8,387.1 397.1,388.6 400.4,389.9 403.7,391.3 407.0,392.6 410.3,394.0 413.6,395.2 416.9,396.5 420.2,397.8 423.5,399.0 426.8,400.2 430.1,401.4 433.4,402.6 436.7,403.7 440.0,404.8 443.3,405.9 446.6,407.0 449.9,408.1 453.2,409.1 456.5,410.2 459.8,411.2 463.1,412.2 466.4,413.2 469.7,414.1 473.0,415.1 476.3,416.0 479.6,416.9 482.9,417.8 486.2,418.7 489.5,419.6 492.8,420.5 496.1,421.3 49