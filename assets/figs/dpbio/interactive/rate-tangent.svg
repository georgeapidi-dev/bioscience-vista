<g class="part" data-part="init" data-name="Initial rate" data-info="Draw a tangent touching the curve at t = 0; its gradient (change in y ÷ change in x) is the initial rate." tabindex="0" role="button" aria-label="Initial rate"><g><animate attributeName="opacity" keyTimes="0.0000;0.3214;0.3429;1.0000" values="0;0;1;1" dur="14s" begin="tg-play.begin+0s" fill="freeze"/><line x1="110.0" y1="108.09523809523813" x2="302.5" y2="470.0" stroke="#dc2626" stroke-width="3"/><path d="M 110.0 108.09523809523813 L 110.0 470.0 L 302.5 470.0" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="5 4"/><text x="118.0" y="289.04761904761904" text-anchor="start" font-size="12" font-weight="800" fill="#b91c1c">Δy = 1.0</text><text x="206.25" y="462" text-anchor="middle" font-size="12" font-weight="800" fill="#b91c1c">Δx = 7 min</text><text x="312.5" y="173.2380952380953" text-anchor="start" font-size="14" font-weight="800" fill="#b91c1c">initial rate = 1.0 ÷ 7</text><text x="312.5" y="194.95238095238096" text-anchor="start" font-size="14" font-weight="800" fill="#b91c1c">≈ 0.14 mol dm⁻³ min⁻¹</text></g></g>
<g class="part" data-part="later" data-name="Rate at a later time" data-info="The tangent at a later time is less steep: the rate has fallen because there is less substrate." tabindex="0" role="button" aria-label="Rate at a later time"><g><animate attributeName="opacity" keyTimes="0.0000;0.6071;0.6286;1.0000" values="0;0;1;1" dur="14s" begin="tg-play.begin+0s" fill="freeze"/><line x1="220.0" y1="330.33657425260833" x2="660.0" y2="479.3108950498261" stroke="#2563eb" stroke-width="3"/><circle cx="440.0" cy="404.82373465121725" r="6" fill="#2563eb"/><text x="495.0" y="374.82373465121725" text-anchor="start" font-size="13" font-weight="800" fill="#1d4ed8">tangent at 12 min: less steep</text><text x="495.0" y="392.82373465121725" text-anchor="start" font-size="13" font-weight="800" fill="#1d4ed8">rate ≈ 0.026 mol dm⁻³ min⁻¹</text></g></g>
<g class="part" data-part="calc" data-name="Gradient" data-info="Rate = Δy ÷ Δx from a large triangle drawn on the tangent. Units: concentration per unit time." tabindex="0" role="button" aria-label="Gradient"><rect x="820" y="120" width="260" height="200" rx="14" fill="#f8fafc" stroke="#cbd5e1"/><text x="950" y="148" text-anchor="middle" font-size="15" font-weight="800" fill="#111827">Method</text><text x="836" y="178" text-anchor="start" font-size="12" font-weight="600" fill="#111827">1 draw a tangent at the time</text><text x="836" y="202" text-anchor="start" font-size="12" font-weight="600" fill="#111827">2 make a large triangle on it</text><text x="836" y="226" text-anchor="start" font-size="12" font-weight="600" fill="#111827">3 gradient = Δy ÷ Δx</text><text x="836" y="250" text-anchor="start" font-size="12" font-weight="600" fill="#111827">4 ignore the minus sign for</text><text x="836" y="274" text-anchor="start" font-size="12" font-weight="600" fill="#111827">   the rate of loss</text><text x="836" y="298" text-anchor="start" font-size="12" font-weight="600" fill="#111827">5 include units</text></g>
</svg>