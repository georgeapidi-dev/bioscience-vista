<g><animate attributeName="opacity" keyTimes="0.0000;0.6250;0.6438;1.0000" values="0;0;1;1" dur="16s" begin="hp-play.begin+0s" fill="freeze"/><rect x="830" y="580" width="370" height="110" rx="14" fill="#fef2f2" stroke="#fca5a5"/><text x="1015" y="604" text-anchor="middle" font-size="12" font-weight="800" fill="#991b1b">Anterior lobe makes and secretes:</text><text x="1015" y="630" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">FSH, LH (gonads) · TSH (thyroid) · ACTH (adrenal)</text><text x="1015" y="656" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">growth hormone · prolactin</text><text x="1015" y="680" text-anchor="middle" font-size="11" font-weight="600" fill="#475569">controlled by hypothalamic releasing hormones</text></g>
