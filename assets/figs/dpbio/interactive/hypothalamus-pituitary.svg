<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 700" class="vd-svg" role="img" aria-labelledby="hp-title hp-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="hp-play" data-vd-play-label="Play: two routes" data-vd-steps="[[0, &quot;The hypothalamus controls the pituitary gland in two ways.&quot;], [1, &quot;Posterior lobe: neurosecretory cells make ADH and oxytocin, which travel down their axons...&quot;], [4, &quot;...and are released from the posterior pituitary into the blood.&quot;], [7, &quot;Anterior lobe: other cells release releasing hormones into portal blood vessels.&quot;], [10, &quot;These reach the anterior pituitary, which secretes its own hormones such as FSH, LH and TSH.&quot;]]" data-vd-dur="16">
<title id="hp-title">The hypothalamus and pituitary gland</title><desc id="hp-desc">The hypothalamus and pituitary: neurosecretory cells carry ADH and oxytocin down axons to the posterior pituitary for release, while releasing hormones travel in portal vessels to the anterior pituitary, which secretes FSH, LH, TSH, ACTH, growth hormone and prolactin.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1220" height="700" fill="#ffffff"/>
<g aria-hidden="true"><animate id="hp-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<defs><marker id="hp-475569" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="6.3" refY="7.0" orient="auto"><path d="M0,0 L14,7.0 L0,14 z" fill="#475569"/></marker></defs>
<text class="head" x="30" y="34">The hypothalamus–pituitary complex</text><text class="note" x="30" y="56">Front of the head to the left.</text>
<g class="part" data-part="hyp" data-name="Hypothalamus" data-info="Part of the brain that links the nervous and endocrine systems. It monitors the blood (e.g. water potential, temperature) and controls the pituitary." tabindex="0" role="button" aria-label="Hypothalamus"><path d="M 140 120 C 300 90 560 90 720 130 L 720 280 C 640 300 520 300 470 300 C 420 300 300 300 140 280 Z" fill="#fce7f3" stroke="#be185d" stroke-width="3"/><text x="430" y="150" text-anchor="middle" font-size="18" font-weight="800" fill="#9d174d">hypothalamus</text></g>
<path d="M 370 300 C 390 350 410 380 420 415 L 540 415 C 545 380 550 350 560 300 Z" fill="#fbcfe8" stroke="#be185d" stroke-width="2"/><text x="580" y="360" text-anchor="start" font-size="12" font-weight="800" fill="#9d174d">pituitary stalk</text>
<g class="part" data-part="ant" data-name="Anterior pituitary" data-info="Glandular tissue that makes and secretes its own hormones: FSH, LH, TSH, ACTH, growth hormone and prolactin." tabindex="0" role="button" aria-label="Anterior pituitary"><path d="M 260 420 C 260 380 420 400 450 420 C 470 470 460 560 380 580 C 300 595 250 540 260 420 Z" fill="#fca5a5" stroke="#b91c1c" stroke-width="3"/><text x="340" y="610" text-anchor="middle" font-size="14" font-weight="800" fill="#991b1b">anterior pituitary</text></g>
<g class="part" data-part="post" data-name="Posterior pituitary" data-info="Stores ADH and oxytocin and releases them into the blood when impulses arrive. Nervous tissue." tabindex="0" role="button" aria-label="Posterior pituitary"><path d="M 470 420 C 520 400 600 410 610 460 C 620 520 580 570 520 570 C 480 570 465 520 470 420 Z" fill="#c7d2fe" stroke="#4338ca" stroke-width="3"/><text x="560" y="610" text-anchor="middle" font-size="14" font-weight="800" fill="#3730a3">posterior pituitary</text></g>
<g class="part" data-part="ns1" data-name="Neurosecretory cells (to the posterior lobe)" data-info="Make ADH and oxytocin in the hypothalamus and carry them down their axons." tabindex="0" role="button" aria-label="Neurosecretory cells (to the posterior lobe)"><circle cx="500" cy="200" r="16" fill="#818cf8" stroke="#3730a3" stroke-width="2"/><path d="M 500 216 C 480 300 505 380 520 480" fill="none" stroke="#4338ca" stroke-width="4"/><circle cx="520" cy="480" r="7" fill="#4338ca"/><circle cx="545" cy="230" r="16" fill="#818cf8" stroke="#3730a3" stroke-width="2"/><path d="M 545 246 C 525 300 525 380 540 480" fill="none" stroke="#4338ca" stroke-width="4"/><circle cx="540" cy="480" r="7" fill="#4338ca"/><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.0625;0.0750;0.3937;0.4062;1.0000" values="0;0;1;1;0;0" dur="16s" begin="hp-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.0625;0.1875;0.2812;0.3750;1.0000" values="500 216;500 216;515 380;520 478;680 500;680 500" dur="16s" begin="hp-play.begin+0s" fill="freeze"/><circle r="6" fill="#facc15" stroke="#a16207"/></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.0938;0.1062;0.4250;0.4375;1.0000" values="0;0;1;1;0;0" dur="16s" begin="hp-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.0938;0.2188;0.3125;0.4062;1.0000" values="545 246;545 246;535 380;540 478;690 512;690 512" dur="16s" begin="hp-play.begin+0s" fill="freeze"/><circle r="6" fill="#facc15" stroke="#a16207"/></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.1250;0.1375;0.4562;0.4688;1.0000" values="0;0;1;1;0;0" dur="16s" begin="hp-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.1250;0.2500;0.3438;0.4375;1.0000" values="500 216;500 216;515 380;520 478;700 524;700 524" dur="16s" begin="hp-play.begin+0s" fill="freeze"/><circle r="6" fill="#facc15" stroke="#a16207"/></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.1562;0.1688;0.4875;0.5000;1.0000" values="0;0;1;1;0;0" dur="16s" begin="hp-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.1562;0.2812;0.3750;0.4688;1.0000" values="545 246;545 246;535 380;540 478;710 536;710 536" dur="16s" begin="hp-play.begin+0s" fill="freeze"/><circle r="6" fill="#facc15" stroke="#a16207"/></g></g></g>
<path d="M 620 520 L 800 520" stroke="#dc2626" stroke-width="12" stroke-linecap="round"/><path d="M 400 560 L 400 660 L 800 660" fill="none" stroke="#dc2626" stroke-width="12" stroke-linecap="round"/>
<g class="part" data-part="out" data-name="Hormones to the body" data-info="Carried in the general circulation to their target organs." tabindex="0" role="button" aria-label="Hormones to the body"><text x="630" y="506" text-anchor="start" font-size="12" font-weight="800" fill="#b91c1c">to the general circulation</text><text x="810" y="664" text-anchor="middle" font-size="13" font-weight="700" fill="#b91c1c"></text></g>
<g><animate attributeName="opacity" keyTimes="0.0000;0.2500;0.2687;1.0000" values="0;0;1;1" dur="16s" begin="hp-play.begin+0s" fill="freeze"/><rect x="830" y="420" width="370" height="140" rx="14" fill="#eef2ff" stroke="#a5b4fc"/><text x="1015" y="446" text-anchor="middle" font-size="12" font-weight="800" fill="#3730a3">Posterior lobe releases (made in hypothalamus):</text><text x="1015" y="474" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">ADH → kidney collecting ducts: reabsorb water</text><text x="1015" y="500" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">oxytocin → uterus contractions, milk release</text></g>
<g class="part" data-part="ns2" data-name="Neurosecretory cells (releasing hormones)" data-info="Release releasing hormones into a capillary bed in the hypothalamus." tabindex="0" role="button" aria-label="Neurosecretory cells (releasing hormones)"><circle cx="300" cy="210" r="14" fill="#f472b6" stroke="#9d174d" stroke-width="2"/><path d="M 300 224 L 310 300" stroke="#9d174d" stroke-width="3"/><circle cx="360" cy="240" r="14" fill="#f472b6" stroke="#9d174d" stroke-width="2"/><path d="M 360 254 L 370 300" stroke="#9d174d" stroke-width="3"/></g>
<g class="part" data-part="portal" data-name="Portal blood vessels" data-info="Carry the releasing hormones straight to the anterior pituitary." tabindex="0" role="button" aria-label="Portal blood vessels"><path d="M 300 300 C 330 320 380 310 400 330 C 420 360 360 380 350 430" fill="none" stroke="#dc2626" stroke-width="7"/><path d="M 260 300 C 280 340 330 340 340 360" fill="none" stroke="#dc2626" stroke-width="5"/><circle cx="300" cy="300" r="5" fill="none" stroke="#dc2626" stroke-width="2"/><circle cx="318" cy="306" r="5" fill="none" stroke="#dc2626" stroke-width="2"/><circle cx="336" cy="300" r="5" fill="none" stroke="#dc2626" stroke-width="2"/><circle cx="354" cy="306" r="5" fill="none" stroke="#dc2626" stroke-width="2"/><circle cx="372" cy="300" r="5" fill="none" stroke="#dc2626" stroke-width="2"/><line x1="395" y1="340" x2="160" y2="380" stroke="#475569" stroke-width="1.5"/><circle cx="395" cy="340" r="3" fill="#475569"/><text x="150" y="384" text-anchor="end" font-size="12" font-weight="800" fill="#b91c1c">portal vessels</text></g>
