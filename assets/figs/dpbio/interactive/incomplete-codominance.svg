<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 580" class="vd-svg" role="img" aria-labelledby="id-title id-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="id-play" data-vd-play-label="Play: cross" data-vd-steps="[[0, &quot;When neither allele is dominant.&quot;], [1, &quot;Incomplete dominance: red \u00d7 white \u2192 pink.&quot;], [4, &quot;Pink \u00d7 pink \u2192 1 red : 2 pink : 1 white.&quot;], [9, &quot;Codominance: red \u00d7 white cattle \u2192 roan, with red AND white hairs.&quot;]]" data-vd-dur="15">
<title id="id-title">Incomplete dominance and codominance</title><desc id="id-desc">Four-o&#x27;clock flowers: red crossed with white gives pink, and pink crossed with pink gives one red, two pink, one white; shorthorn cattle: red crossed with white gives roan calves with both red and white hairs.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="580" fill="#ffffff"/>
<g aria-hidden="true"><animate id="id-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
