<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 580" class="vd-svg" role="img" aria-labelledby="cs-title cs-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="cs-play" data-vd-play-label="Play: run the test" data-vd-steps="[[0, &quot;Chi-squared test for association.&quot;], [1, &quot;Record observed presence and absence in 100 quadrats.&quot;], [4, &quot;Expected = row total \u00d7 column total \u00f7 grand total.&quot;], [8, &quot;\u03c7\u00b2 = \u03a3(O \u2212 E)\u00b2/E = 16.7.&quot;], [12, &quot;Bigger than 3.84: a significant negative association.&quot;]]" data-vd-dur="16">
<title id="cs-title">Chi-squared test for association</title><desc id="cs-desc">A two by two contingency table for species A and B in 100 quadrats with observed values 10, 40, 30 and 20, expected values 20, 30, 20 and 30, a chi-squared value of 16.7 compared with the critical value 3.84.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="580" fill="#ffffff"/>
<g aria-hidden="true"><animate id="cs-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<text class="head" x="30" y="34">Chi-squared test for association</text><text class="note" x="30" y="56">H₀: species A and B are distributed independently.</text>
<g class="part" data-part="tab" data-name="Observed frequencies" data-info="100 random quadrats: both species 10; A only 40; B only 30; neither 20." tabindex="0" role="button" aria-label="Observed frequencies"><text x="155.0" y="110" text-anchor="middle" font-size="13" font-weight="800" fill="#111827"></text><text x="305.0" y="110" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">B present</text><text x="455.0" y="110" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">B absent</text><text x="605.0" y="110" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">total</text><text x="155.0" y="172" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">A present</text><rect x="236" y="130" width="138" height="60" rx="10" fill="#fff" stroke="#94a3b8"/><text x="305.0" y="160" text-anchor="middle" font-size="18" font-weight="800" fill="#111827">10</text><g><animate attributeName="opacity" keyTimes="0.0000;0.2500;0.2687;1.0000" values="0;0;1;1" dur="16s" begin="cs-play.begin+0s" fill="freeze"/><text x="305.0" y="182" text-anchor="middle" font-size="12" font-weight="800" fill="#2563eb">E = 20</text></g><rect x="386" y="130" width="138" height="60" rx="10" fill="#fff" stroke="#94a3b8"/><text x="455.0" y="160" text-anchor="middle" font-size="18" font-weight="800" fill="#111827">40</text><g><animate attributeName="opacity" keyTimes="0.0000;0.2812;0.3000;1.0000" values="0;0;1;1" dur="16s" begin="cs-play.begin+0s" fill="freeze"/><text x="455.0" y="182" text-anchor="middle" font-size="12" font-weight="800" fill="#2563eb">E = 30</text></g><rect x="536" y="130" width="138" height="60" rx="10" fill="#f1f5f9" stroke="#94a3b8"/><text x="605.0" y="168" text-anchor="middle" font-size="16" font-weight="800" fill="#475569">50</text><text x="155.0" y="242" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">A absent</text><rect x="236" y="200" width="138" height="60" rx="10" fill="#fff" stroke="#94a3b8"/><text x="305.0" y="230" text-anchor="middle" font-size="18" font-weight="800" fill="#111827">30</text><g><animate attributeName="opacity" keyTimes="0.0000;0.3125;0.3312;1.0000" values="0;0;1;1" dur="16s" begin="cs-play.begin+0s" fill="freeze"/><text x="305.0" y="252" text-anchor="middle" font-size="12" font-weight="800" fill="#2563eb">E = 20</text></g><rect x="386" y="200" width="138" height="60" rx="10" fill="#fff" stroke="#94a3b8"/><text x="455.0" y="230" text-anchor="middle" font-size="18" font-weight="800" fill="#111827">20</text><g><animate attributeName="opacity" keyTimes="0.0000;0.3438;0.3625;1.0000" values="0;0;1;1" dur="16s" begin="cs-play.begin+0s" fill="freeze"/><text x="455.0" y="252" text-anchor="middle" font-size="12" font-weight="800" fill="#2563eb">E = 30</text></g><rect x="536" y="200" width="138" height="60" rx="10" fill="#f1f5f9" stroke="#94a3b8"/><text x="605.0" y="238" text-anchor="middle" font-size="16" font-weight="800" fill="#475569">50</text><text x="155.0" y="312" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">total</text><rect x="236" y="270" width="138" height="60" rx="10" fill="#f1f5f9" stroke="#94a3b8"/><text x="305.0" y="308" text-anchor="middle" font-size="16" font-weight="800" fill="#475569">40</text><rect x="386" y="270" width="138" height="60" rx="10" fill="#f1f5f9" stroke="#94a3b8"/><text x="455.0" y="308" text-anchor="middle" font-size="16" font-weight="800" fill="#475569">60</text><rect x="536" y="270" width="138" height="60" rx="10" fill="#f1f5f9" stroke="#94a3b8"/><text x="605.0" y="308" text-anchor="middle" font-size="16" font-weight="800" fill="#475569">100</text></g>
<g class="part" data-part="exp" data-name="Expected frequencies" data-info="Expected = row total × column total ÷ grand total: both 20, A only 30, B only 20, neither 30." tabindex="0" role="button" aria-label="Expected frequencies"><g><animate attributeName="opacity" keyTimes="0.0000;0.2500;0.2687;1.0000" values="0;0;1;1" dur="16s" begin="cs-play.begin+0s" fill="freeze"/><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.2500;0.2687;1.0000" values="0;0;1;1" dur="16s" begin="cs-play.begin+0s" fill="freeze"/><rect x="140.0" y="360" width="400" height="24" rx="12" fill="#dbeafe" stroke="#1f2937" stroke-width="1"/><text x="340" y="377" text-anchor="middle" font-size="12" font-weight="700">expected = row total × column total ÷ grand total</text></g></g></g>
<g class="part" data-part="chi" data-name="χ² value" data-info="χ² = Σ (O − E)² ÷ E = 5 + 3.33 + 5 + 3.33 = 16.7. Degrees of freedom = 1; critical value at p = 0.05 is 3.84." tabindex="0" role="button" aria-label="χ² value"><rect x="720" y="90" width="350" height="320" rx="16" fill="#f8fafc" stroke="#cbd5e1"/><text x="895" y="118" text-anchor="middle" font-size="15" font-weight="800" fill="#111827">χ² = Σ (O − E)² ÷ E</text><g><animate attributeName="opacity" keyTimes="0.0000;0.5000;0.5188;1.0000" values="0;0;1;1" dur="16s" begin="cs-play.begin+0s" fill="freeze"/><text x="760" y="160" text-anchor="start" font-size="13" font-weight="700" fill="#111827">(10 − 20)² ÷ 20</text><text x="1040" y="160" text-anchor="end" font-size="13" font-weight="800" fill="#111827">5.00</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.5312;0.5500;1.0000" values="0;0;1;1" dur="16s" begin="cs-play.begin+0s" fill="freeze"/><text x="760" y="194" text-anchor="start" font-size="13" font-weight="700" fill="#111827">(40 − 30)² ÷ 30</text><text x="1040" y="194" text-anchor="end" font-size="13" font-weight="800" fill="#111827">3.33</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.5625;0.5813;1.0000" values="0;0;1;1" dur="16s" begin="cs-play.begin+0s" fill="freeze"/><text x="760" y="228" text-anchor="start" font-size="13" font-weight="700" fill="#111827">(30 − 20)² ÷ 20</text><text x="1040" y="228" text-anchor="end" font-size="13" font-weight="800" fill="#111827">5.00</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.5938;0.6125;1.0000" values="0;0;1;1" dur="16s" begin="cs-play.begin+0s" fill="freeze"/><text x="760" y="262" text-anchor="start" font-size="13" font-weight="700" fill="#111827">(20 − 30)² ÷ 30</text><text x="1040" y="262" text-anchor="end" font-size="13" font-weight="800" fill="#111827">3.33</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.6562;0.6750;1.0000" values="0;0;1;1" dur="16s" begin="cs-play.begin+0s" fill="freeze"/><line x1="760" y1="292" x2="1040" y2="292" stroke="#111827"/><text x="760" y="320" text-anchor="start" font-size="15" font-weight="800" fill="#111827">χ² =</text><text x="1040" y="320" text-anchor="end" font-size="18" font-weight="800" fill="#b91c1c">16.7</text><text x="895" y="360" text-anchor="middle" font-size="12" font-weight="800" fill="#475569">df = 1 · critical value (p = 0.05) = 3.84</text></g></g>
<g class="part" data-part="conc" data-name="Conclusion" data-info="16.7 &gt; 3.84: reject H₀. A and B occur together less than expected: a significant negative association, consistent with competition (or different habitat needs) but not proof of it." tabindex="0" role="button" aria-label="Conclusion"><g><animate attributeName="opacity" keyTimes="0.0000;0.7500;0.7688;1.0000" values="0;0;1;1" dur="16s" begin="cs-play.begin+0s" fill="freeze"/><rect x="80" y="400" width="990" height="150" rx="16" fill="#fef2f2" stroke="#fca5a5"/><text x="575" y="432" text-anchor="middle" font-size="15" font-weight="800" fill="#b91c1c">16.7 > 3.84 → reject H₀: significant association</text><text x="575" y="462" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">Observed "both present" (10) < expected (20): a NEGATIVE association</text><text x="575" y="490" text-anchor="middle" font-size="12" font-weight="700" fill="#475569">Consistent with competition, but they may simply prefer different conditions (e.g. wet vs dry soil).</text><text x="575" y="514" text-anchor="middle" font-size="12" font-weight="700" fill="#475569">Association does not prove interaction.</text></g></g>
</svg>