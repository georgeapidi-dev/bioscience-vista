<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 580" class="vd-svg" role="img" aria-labelledby="cn-title cn-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="cn-play" data-vd-play-label="Play: count them" data-vd-steps="[[0, &quot;Chromosome numbers differ between species.&quot;], [1, &quot;Numbers vary widely, and do not show how complex an organism is.&quot;], [6, &quot;Great apes have 48; humans have 46.&quot;], [9.5, &quot;Human chromosome 2 formed when two ancestral chromosomes fused.&quot;]]" data-vd-dur="14">
<title id="cn-title">Chromosome numbers</title><desc id="cn-desc">Bar chart of diploid chromosome numbers in several species, the great apes with 48 and humans with 46, and the fusion of two ape chromosomes into human chromosome 2.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="580" fill="#ffffff"/>
<g aria-hidden="true"><animate id="cn-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<text class="head" x="30" y="34">Chromosome numbers in different species</text><text class="note" x="30" y="56">Diploid number (2n). Logarithmic scale on the left chart.</text>
<g class="part" data-part="bar" data-name="Chromosome numbers vary" data-info="Diploid numbers: human 46, chimpanzee 48, dog 78, maize 20, fern Ophioglossum about 1 260, the ant Myrmecia pilosula (males) just 1. Number does not indicate complexity." tabindex="0" role="button" aria-label="Chromosome numbers vary"><line x1="60" y1="470" x2="530" y2="470" stroke="#111827" stroke-width="2"/><line x1="60" y1="470" x2="530" y2="470" stroke="#e5e7eb"/><text x="54" y="474.0" text-anchor="end" font-size="11" font-weight="700" fill="#475569">1</text><line x1="60" y1="361" x2="530" y2="361" stroke="#e5e7eb"/><text x="54" y="364.9431297283355" text-anchor="end" font-size="11" font-weight="700" fill="#475569">10</text><line x1="60" y1="252" x2="530" y2="252" stroke="#e5e7eb"/><text x="54" y="255.886259456671" text-anchor="end" font-size="11" font-weight="700" fill="#475569">100</text><line x1="60" y1="143" x2="530" y2="143" stroke="#e5e7eb"/><text x="54" y="146.82938918500656" text-anchor="end" font-size="11" font-weight="700" fill="#475569">1000</text><g><animate attributeName="opacity" keyTimes="0.0000;0.0714;0.0929;1.0000" values="0;0;1;1" dur="14s" begin="cn-play.begin+0s" fill="freeze"/><rect x="74" y="466" width="66" height="4" fill="#93c5fd" stroke="#1e3a8a"/><text x="107.0" y="458" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">1</text><text x="107.0" y="488" text-anchor="middle" font-size="11" font-weight="800" fill="#111827">ant (male)</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.1214;0.1429;1.0000" values="0;0;1;1" dur="14s" begin="cn-play.begin+0s" fill="freeze"/><rect x="150" y="328" width="66" height="142" fill="#93c5fd" stroke="#1e3a8a"/><text x="183.0" y="320.11374054332896" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">20</text><text x="183.0" y="488" text-anchor="middle" font-size="11" font-weight="800" fill="#111827">maize</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.1714;0.1929;1.0000" values="0;0;1;1" dur="14s" begin="cn-play.begin+0s" fill="freeze"/><rect x="226" y="289" width="66" height="181" fill="#f59e0b" stroke="#1e3a8a"/><text x="259.0" y="280.6648348571084" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">46</text><text x="259.0" y="488" text-anchor="middle" font-size="11" font-weight="800" fill="#111827">human</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.2214;0.2429;1.0000" values="0;0;1;1" dur="14s" begin="cn-play.begin+0s" fill="freeze"/><rect x="302" y="287" width="66" height="183" fill="#93c5fd" stroke="#1e3a8a"/><text x="335.0" y="278.64909248015795" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">48</text><text x="335.0" y="488" text-anchor="middle" font-size="11" font-weight="800" fill="#111827">chimpanzee</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.2714;0.2929;1.0000" values="0;0;1;1" dur="14s" begin="cn-play.begin+0s" fill="freeze"/><rect x="378" y="264" width="66" height="206" fill="#93c5fd" stroke="#1e3a8a"/><text x="411.0" y="255.65408437266774" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">78</text><text x="411.0" y="488" text-anchor="middle" font-size="11" font-weight="800" fill="#111827">dog</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.3214;0.3429;1.0000" values="0;0;1;1" dur="14s" begin="cn-play.begin+0s" fill="freeze"/><rect x="454" y="132" width="66" height="338" fill="#93c5fd" stroke="#1e3a8a"/><text x="487.0" y="123.8832916670242" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">1260</text><text x="487.0" y="488" text-anchor="middle" font-size="11" font-weight="800" fill="#111827">fern</text></g></g>
<g class="part" data-part="apes" data-name="Great apes" data-info="Chimpanzee, bonobo, gorilla and orang-utan all have 48; humans have 46." tabindex="0" role="button" aria-label="Great apes"><rect x="580" y="80" width="490" height="220" rx="16" fill="#fffbeb" stroke="#fcd34d"/><text x="825" y="106" text-anchor="middle" font-size="15" font-weight="800" fill="#b45309">Great apes</text><g><animate attributeName="opacity" keyTimes="0.0000;0.4286;0.4500;1.0000" values="0;0;1;1" dur="14s" begin="cn-play.begin+0s" fill="freeze"/><circle cx="630" cy="180" r="32" fill="#fde68a" stroke="#334155" stroke-width="2"/><text x="630" y="187" text-anchor="middle" font-size="18" font-weight="800" fill="#111827">46</text><text x="630" y="240" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">human</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.4571;0.4786;1.0000" values="0;0;1;1" dur="14s" begin="cn-play.begin+0s" fill="freeze"/><circle cx="722" cy="180" r="32" fill="#e5e7eb" stroke="#334155" stroke-width="2"/><text x="722" y="187" text-anchor="middle" font-size="18" font-weight="800" fill="#111827">48</text><text x="722" y="240" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">chimpanzee</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.4857;0.5071;1.0000" values="0;0;1;1" dur="14s" begin="cn-play.begin+0s" fill="freeze"/><circle cx="814" cy="180" r="32" fill="#e5e7eb" stroke="#334155" stroke-width="2"/><text x="814" y="187" text-anchor="middle" font-size="18" font-weight="800" fill="#111827">48</text><text x="814" y="240" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">bonobo</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.5143;0.5357;1.0000" values="0;0;1;1" dur="14s" begin="cn-play.begin+0s" fill="freeze"/><circle cx="906" cy="180" r="32" fill="#e5e7eb" stroke="#334155" stroke-width="2"/><text x="906" y="187" text-anchor="middle" font-size="18" font-weight="800" fill="#111827">48</text><text x="906" y="240" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">gorilla</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.5429;0.5643;1.0000" values="0;0;1;1" dur="14s" begin="cn-play.begin+0s" fill="freeze"/><circle cx="998" cy="180" r="32" fill="#e5e7eb" stroke="#334155" stroke-width="2"/><text x="998" y="187" text-anchor="middle" font-size="18" font-weight="800" fill="#111827">48</text><text x="998" y="240" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">orang-utan</text></g></g>
<g class="part" data-part="fusion" data-name="Human chromosome 2" data-info="Formed by the fusion of two chromosomes that remain separate in the other great apes, which explains 46 versus 48." tabindex="0" role="button" aria-label="Human chromosome 2"><rect x="580" y="320" width="490" height="230" rx="16" fill="#f5f3ff" stroke="#c4b5fd"/><text x="825" y="346" text-anchor="middle" font-size="15" font-weight="800" fill="#6d28d9">Human chromosome 2: a fusion</text><g transform="translate(700 450)"><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.6786;0.8214;1.0000" values="700 450;700 450;790 450;790 450" dur="14s" begin="cn-play.begin+0s" fill="freeze"/><rect x="-12" y="-70" width="24" height="90" rx="12" fill="#a78bfa" stroke="#5b21b6" stroke-width="2"/></g><g transform="translate(940 450)"><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.6786;0.8214;1.0000" values="940 450;940 450;790 360;790 360" dur="14s" begin="cn-play.begin+0s" fill="freeze"/><rect x="-12" y="20" width="24" height="70" rx="12" fill="#c4b5fd" stroke="#5b21b6" stroke-width="2"/></g><text x="700" y="535" text-anchor="middle" font-size="12" font-weight="800" fill="#5b21b6">ape 2A</text><text x="940" y="535" text-anchor="middle" font-size="12" font-weight="800" fill="#5b21b6">ape 2B</text><g><animate attributeName="opacity" keyTimes="0.0000;0.8214;0.8429;1.0000" values="0;0;1;1" dur="14s" begin="cn-play.begin+0s" fill="freeze"/><text x="900" y="420" text-anchor="start" font-size="14" font-weight="800" fill="#5b21b6">→ human 2</text><text x="900" y="440" text-anchor="start" font-size="11" font-weight="700" fill="#475569">two ape chromosomes → one</text><text x="900" y="456" text-anchor="start" font-size="11" font-weight="700" fill="#475569">24 pairs → 23 pairs (48 → 46)</text></g></g>
</svg>