<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 540" class="vd-svg" role="img" aria-labelledby="ex-title ex-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="ex-play" data-vd-play-label="Play: start cycling" data-vd-steps="[[0, &quot;Reading exercise data (a student cycling).&quot;], [1, &quot;Heart rate climbs from 70 to 160 beats per minute.&quot;], [3, &quot;Ventilation rate from 12 to 35 breaths per minute.&quot;], [5, &quot;Blood pH dips from 7.40 to 7.32 as CO\u2082 builds up.&quot;], [9.5, &quot;Afterwards, rates fall gradually as CO\u2082 is removed.&quot;]]" data-vd-dur="15">
<title id="ex-title">Heart rate, ventilation and blood pH during exercise</title><desc id="ex-desc">Graphs of heart rate rising from 70 to 160 beats per minute, ventilation rate from 12 to 35 breaths per minute and blood pH falling from 7.40 to 7.32 during hard exercise, then recovering gradually afterwards.</desc>
