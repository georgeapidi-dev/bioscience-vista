<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" class="vd-svg" role="img" aria-labelledby="ec-title ec-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="ec-play" data-vd-play-label="Play: fuel the bird" data-vd-steps="[[0, &quot;Energy content of food molecules.&quot;], [1, &quot;Lipid releases about twice as much energy per gram.&quot;], [6, &quot;So for a 740 kJ flight, a bird needs 20 g of fat but 44 g of carbohydrate.&quot;]]" data-vd-dur="12">
<title id="ec-title">Energy content of carbohydrate, protein and lipid</title><desc id="ec-desc">Bar chart: carbohydrate and protein about 17 kilojoules per gram, lipid about 37; a migrating bird needing 740 kilojoules would carry 20 grams of lipid or about 44 grams of carbohydrate.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="520" fill="#ffffff"/>
<g aria-hidden="true"><animate id="ec-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<text class="head" x="30" y="34">Energy content: why fat is a good store</text><text class="note" x="30" y="56">Energy released on complete oxidation.</text>
<g class="part" data-part="bars" data-name="Energy per gram" data-info="Complete oxidation releases about 17 kJ g⁻¹ from carbohydrate, 17 kJ g⁻¹ from protein and 37 kJ g⁻¹ from lipid." tabindex="0" role="button" aria-label="Energy per gram"><line x1="120" y1="450" x2="540" y2="450" stroke="#111827" stroke-width="2"/><line x1="120" y1="450" x2="120" y2="120" stroke="#111827" stroke-width="2"/><text x="112" y="454.0" text-anchor="end" font-size="11" font-weight="700" fill="#475569">0</text><text x="112" y="371.5" text-anchor="end" font-size="11" font-weight="700" fill="#475569">10</text><text x="112" y="289.0" text-anchor="end" font-size="11" font-weight="700" fill="#475569">20</text><text x="112" y="206.5" text-anchor="end" font-size="11" font-weight="700" fill="#475569">30</text><text x="112" y="124.0" text-anchor="end" font-size="11" font-weight="700" fill="#475569">40</text><text x="76" y="285.0" font-size="13" font-weight="700" text-anchor="middle" transform="rotate(-90 76 285.0)">energy / kJ g⁻¹</text><rect x="160" y="310" width="90" height="140" fill="#fbbf24" stroke="#334155"><animate attributeName="height" keyTimes="0.0000;0.0833;0.1667;1.0000" values="0;0;140.25;140.25" dur="12s" begin="ec-play.begin+0s" fill="freeze"/><animate attributeName="y" keyTimes="0.0000;0.0833;0.1667;1.0000" values="450;450;309.75;309.75" dur="12s" begin="ec-play.begin+0s" fill="freeze"/></rect><g><animate attributeName="opacity" keyTimes="0.0000;0.1667;0.1917;1.0000" values="0;0;1;1" dur="12s" begin="ec-play.begin+0s" fill="freeze"/><text x="205" y="301.75" text-anchor="middle" font-size="15" font-weight="800" fill="#111827">≈ 17</text></g><text x="205" y="470" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">carbohydrate</text><rect x="290" y="310" width="90" height="140" fill="#a78bfa" stroke="#334155"><animate attributeName="height" keyTimes="0.0000;0.1667;0.2500;1.0000" values="0;0;140.25;140.25" dur="12s" begin="ec-play.begin+0s" fill="freeze"/><animate attributeName="y" keyTimes="0.0000;0.1667;0.2500;1.0000" values="450;450;309.75;309.75" dur="12s" begin="ec-play.begin+0s" fill="freeze"/></rect><g><animate attributeName="opacity" keyTimes="0.0000;0.2500;0.2750;1.0000" values="0;0;1;1" dur="12s" begin="ec-play.begin+0s" fill="freeze"/><text x="335" y="301.75" text-anchor="middle" font-size="15" font-weight="800" fill="#111827">≈ 17</text></g><text x="335" y="470" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">protein</text><rect x="420" y="145" width="90" height="305" fill="#f97316" stroke="#334155"><animate attributeName="height" keyTimes="0.0000;0.2500;0.3333;1.0000" values="0;0;305.25;305.25" dur="12s" begin="ec-play.begin+0s" fill="freeze"/><animate attributeName="y" keyTimes="0.0000;0.2500;0.3333;1.0000" values="450;450;144.75;144.75" dur="12s" begin="ec-play.begin+0s" fill="freeze"/></rect><g><animate attributeName="opacity" keyTimes="0.0000;0.3333;0.3583;1.0000" values="0;0;1;1" dur="12s" begin="ec-play.begin+0s" fill="freeze"/><text x="465" y="136.75" text-anchor="middle" font-size="15" font-weight="800" fill="#111827">≈ 37</text></g><text x="465" y="470" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">lipid</text></g>
<g class="part" data-part="bird" data-name="A migrating bird" data-info="For a 740 kJ flight it needs 740 ÷ 37 = 20 g of lipid, but 740 ÷ 17 ≈ 44 g of carbohydrate: lipid is the lighter store." tabindex="0" role="button" aria-label="A migrating bird"><rect x="620" y="90" width="450" height="400" rx="16" fill="#f0f9ff" stroke="#7dd3fc"/><text x="845" y="118" text-anchor="middle" font-size="15" font-weight="800" fill="#0369a1">A 740 kJ migration flight</text><path d="M 760 200 q 40 -40 85 -5 q 45 -35 85 5 q -45 -10 -85 25 q -40 -35 -85 -25 Z" fill="#475569"/><g><animate attributeName="opacity" keyTimes="0.0000;0.5000;0.5250;1.0000" values="0;0;1;1" dur="12s" begin="ec-play.begin+0s" fill="freeze"/><rect x="660" y="270" width="170" height="60" rx="12" fill="#fed7aa" stroke="#c2410c" stroke-width="2"/><text x="745" y="296" text-anchor="middle" font-size="16" font-weight="800" fill="#7c2d12">20 g lipid</text><text x="745" y="318" text-anchor="middle" font-size="12" font-weight="700" fill="#7c2d12">740 ÷ 37</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.6250;0.6500;1.0000" values="0;0;1;1" dur="12s" begin="ec-play.begin+0s" fill="freeze"/><rect x="860" y="270" width="190" height="110" rx="12" fill="#fef3c7" stroke="#a16207" stroke-width="2"/><text x="955" y="312" text-anchor="middle" font-size="15" font-weight="800" fill="#713f12">≈ 44 g carbohydrate</text><text x="955" y="334" text-anchor="middle" font-size="12" font-weight="700" fill="#713f12">740 ÷ 17</text></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.7500;0.7750;1.0000" values="0;0;1;1" dur="12s" begin="ec-play.begin+0s" fill="freeze"/><rect x="680.0" y="428" width="330" height="24" rx="12" fill="#dcfce7" stroke="#1f2937" stroke-width="1"/><text x="845" y="445" text-anchor="middle" font-size="12" font-weight="700">lipid: lighter store for the same energy</text></g></g>
</svg>