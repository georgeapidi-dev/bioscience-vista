<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" class="vd-svg" role="img" aria-labelledby="lv-title lv-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="lv-play" data-vd-play-label="Play: draw the trace" data-vd-steps="[[0, &quot;A spirometer trace: lung volume against time for an adult.&quot;], [1, &quot;Normal breathing at rest: each breath moves the tidal volume, about 0.5 dm\u00b3.&quot;], [6, &quot;The deepest possible breath in adds the inspiratory reserve volume.&quot;], [8, &quot;Then the hardest possible breath out: this whole volume is the vital capacity.&quot;], [11, &quot;Some air, the residual volume, always stays in the lungs.&quot;]]" data-vd-dur="14">
<title id="lv-title">Lung volumes</title><desc id="lv-desc">A spirometer trace of lung volume against time: tidal breaths, a maximum breath in and out; tidal volume, inspiratory and expiratory reserve volumes, vital capacity, residual volume and total lung capacity.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
