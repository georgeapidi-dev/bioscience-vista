<g class="part" data-part="irv" data-name="Inspiratory reserve volume" data-info="Extra volume that can be breathed in after a normal breath in: about 3.0 dm³." tabindex="0" role="button" aria-label="Inspiratory reserve volume"><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.5000;0.5214;1.0000" values="0;0;1;1" dur="14s" begin="lv-play.begin+0s" fill="freeze"/><line x1="550" y1="331.8" x2="550" y2="105.79999999999995" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#lv-7c3aed)" marker-start="url(#lv-7c3aed)"/><text x="542" y="221.79999999999998" text-anchor="end" font-size="13" font-weight="700" fill="#7c3aed">IRV 3.0</text></g></g>
<g class="part" data-part="erv" data-name="Expiratory reserve volume" data-info="Extra volume that can be forced out after a normal breath out: about 1.2 dm³." tabindex="0" role="button" aria-label="Expiratory reserve volume"><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.7143;0.7357;1.0000" values="0;0;1;1" dur="14s" begin="lv-play.begin+0s" fill="freeze"/><line x1="550" y1="464.4" x2="550" y2="378.8" stroke="#16a34a" stroke-width="2.5" marker-end="url(#lv-16a34a)" marker-start="url(#lv-16a34a)"/><text x="542" y="424.6" text-anchor="end" font-size="13" font-weight="700" fill="#16a34a">ERV 1.2</text></g></g>
<g class="part" data-part="vc" data-name="Vital capacity" data-info="The largest volume that can be breathed out after the deepest breath in: TV + IRV + ERV ≈ 4.7 dm³." tabindex="0" role="button" aria-label="Vital capacity"><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.7500;0.7714;1.0000" values="0;0;1;1" dur="14s" begin="lv-play.begin+0s" fill="freeze"/><line x1="750" y1="464.4" x2="750" y2="105.79999999999995" stroke="#dc2626" stroke-width="2.5" marker-end="url(#lv-dc2626)" marker-start="url(#lv-dc2626)"/><text x="758" y="288.09999999999997" text-anchor="start" font-size="13" font-weight="700" fill="#dc2626">vital capacity 4.7</text></g></g>
<g class="part" data-part="rv" data-name="Residual volume" data-info="Air that always stays in the lungs and airways: about 1.2 dm³. It cannot be measured with a simple spirometer." tabindex="0" role="button" aria-label="Residual volume"><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.7857;0.8071;1.0000" values="0;0;1;1" dur="14s" begin="lv-play.begin+0s" fill="freeze"/><line x1="410" y1="558" x2="410" y2="472.4" stroke="#0f766e" stroke-width="2.5" marker-end="url(#lv-0f766e)" marker-start="url(#lv-0f766e)"/><text x="418" y="518.2" text-anchor="start" font-size="13" font-weight="700" fill="#0f766e">residual volume 1.2</text></g></g>
<g class="part" data-part="tlc" data-name="Total lung capacity" data-info="Vital capacity + residual volume ≈ 5.9 dm³." tabindex="0" role="button" aria-label="Total lung capacity"><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.8571;0.8786;1.0000" values="0;0;1;1" dur="14s" begin="lv-play.begin+0s" fill="freeze"/><line x1="950" y1="558" x2="950" y2="105.79999999999995" stroke="#111827" stroke-width="2.5" marker-end="url(#lv-111827)" marker-start="url(#lv-111827)"/><text x="958" y="334.9" text-anchor="start" font-size="13" font-weight="700" fill="#111827">TLC 5.9</text></g></g>
</svg>