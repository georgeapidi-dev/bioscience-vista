<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" class="vd-svg" role="img" aria-labelledby="gs2-title gs2-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="gs2-play" data-vd-play-label="Play: follow the mutation" data-vd-steps="[[0, &quot;Where does the mutation happen?&quot;], [1, &quot;In a germ cell: passed on through a gamete to every cell of the child.&quot;], [6.5, &quot;In a somatic cell: only that cell&#x27;s descendants carry it; not inherited.&quot;]]" data-vd-dur="12">
<title id="gs2-title">Germ-line and somatic mutations</title><desc id="gs2-desc">A mutation in a germ cell is passed through a gamete to every cell of the offspring, whereas a mutation in a somatic cell affects only that cell and its descendants, forming a patch or possibly a tumour.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="520" fill="#ffffff"/>
<g aria-hidden="true"><animate id="gs2-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<text class="head" x="30" y="34">Germ cell versus somatic cell mutations</text><text class="note" x="30" y="56">Red = cells carrying the mutation.</text>
<g class="part" data-part="germ" data-name="Germ cell mutation" data-info="In cells that produce gametes: can be inherited, appearing in every cell of the child." tabindex="0" role="button" aria-label="Germ cell mutation"><rect x="30" y="80" width="510" height="420" rx="16" fill="#fef2f2" stroke="#fecaca"/><text x="285" y="106" text-anchor="middle" font-size="15" font-weight="800" fill="#b91c1c">GERM CELL</text><circle cx="110" cy="200" r="40" fill="#fecaca" stroke="#b91c1c" stroke-width="2"/><text x="110" y="260" text-anchor="middle" font-size="11" font-weight="800" fill="#111827">cell making gametes</text><g><animate attributeName="opacity" keyTimes="0.0000;0.1667;0.1917;1.0000" values="0;0;1;1" dur="12s" begin="gs2-play.begin+0s" fill="freeze"/><circle cx="250" cy="200" r="18" fill="#ef4444" stroke="#7f1d1d"/><text x="250" y="240" text-anchor="middle" font-size="11" font-weight="800" fill="#111827">gamete</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.2917;0.3167;1.0000" values="0;0;1;1" dur="12s" begin="gs2-play.begin+0s" fill="freeze"/><circle cx="380" cy="200" r="28" fill="#ef4444" stroke="#7f1d1d"/><text x="380" y="250" text-anchor="middle" font-size="11" font-weight="800" fill="#111827">zygote</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.4167;0.4417;1.0000" values="0;0;1;1" dur="12s" begin="gs2-play.begin+0s" fill="freeze"/><circle cx="180" cy="330" r="11" fill="#ef4444" stroke="#7f1d1d"/><circle cx="206" cy="330" r="11" fill="#ef4444" stroke="#7f1d1d"/><circle cx="232" cy="330" r="11" fill="#ef4444" stroke="#7f1d1d"/><circle cx="258" cy="330" r="11" fill="#ef4444" stroke="#7f1d1d"/><circle cx="284" cy="330" r="11" fill="#ef4444" stroke="#7f1d1d"/><circle cx="310" cy="330" r="11" fill="#ef4444" stroke="#7f1d1d"/><circle cx="336" cy="330" r="11" fill="#ef4444" stroke="#7f1d1d"/><circle cx="362" cy="330" r="11" fill="#ef4444" stroke="#7f1d1d"/><circle cx="180" cy="356" r="11" fill="#ef4444" stroke="#7f1d1d"/><circle cx="206" cy="356" r="11" fill="#ef4444" stroke="#7f1d1d"/><circle cx="232" cy="356" r="11" fill="#ef4444" stroke="#7f1d1d"/><circle cx="258" cy="356" r="11" fill="#ef4444" stroke="#7f1d1d"/><circle cx="284" cy="356" r="11" fill="#ef4444" stroke="#7f1d1d"/><circle cx="310" cy="356" r="11" fill="#ef4444" stroke="#7f1d1d"/><circle cx="336" cy="356" r="11" fill="#ef4444" stroke="#7f1d1d"/><circle cx="362" cy="356" r="11" fill="#ef4444" stroke="#7f1d1d"/><circle cx="180" cy="382" r="11" fill="#ef4444" stroke="#7f1d1d"/><circle cx="206" cy="382" r="11" fill="#ef4444" stroke="#7f1d1d"/><circle cx="232" cy="382" r="11" fill="#ef4444" stroke="#7f1d1d"/><circle cx="258" cy="382" r="11" fill="#ef4444" stroke="#7f1d1d"/><circle cx="284" cy="382" r="11" fill="#ef4444" stroke="#7f1d1d"/><circle cx="310" cy="382" r="11" fill="#ef4444" stroke="#7f1d1d"/><circle cx="336" cy="382" r="11" fill="#ef4444" stroke="#7f1d1d"/><circle cx="362" cy="382" r="11" fill="#ef4444" stroke="#7f1d1d"/><circle cx="180" cy="408" r="11" fill="#ef4444" stroke="#7f1d1d"/><circle cx="206" cy="408" r="11" fill="#ef4444" stroke="#7f1d1d"/><circle cx="232" cy="408" r="11" fill="#ef4444" stroke="#7f1d1d"/><circle cx="258" cy="408" r="11" fill="#ef4444" stroke="#7f1d1d"/><circle cx="284" cy="408" r="11" fill="#ef4444" stroke="#7f1d1d"/><circle cx="310" cy="408" r="11" fill="#ef4444" stroke="#7f1d1d"/><circle cx="336" cy="408" r="11" fill="#ef4444" stroke="#7f1d1d"/><circle cx="362" cy="408" r="11" fill="#ef4444" stroke="#7f1d1d"/><text x="285" y="460" text-anchor="middle" font-size="13" font-weight="800" fill="#b91c1c">every cell of the child carries it: inherited</text></g></g>
<g class="part" data-part="som" data-name="Somatic cell mutation" data-info="Affects only that cell and its descendants in the individual; not inherited, but can lead to cancer if it affects genes controlling the cell cycle." tabindex="0" role="button" aria-label="Somatic cell mutation"><rect x="560" y="80" width="510" height="420" rx="16" fill="#f0f9ff" stroke="#bae6fd"/><text x="815" y="106" text-anchor="middle" font-size="15" font-weight="800" fill="#0369a1">SOMATIC CELL</text><circle cx="640" cy="170" r="12" fill="#bae6fd" stroke="#0369a1"></circle><circle cx="670" cy="170" r="12" fill="#bae6fd" stroke="#0369a1"></circle><circle cx="700" cy="170" r="12" fill="#bae6fd" stroke="#0369a1"></circle><circle cx="730" cy="170" r="12" fill="#bae6fd" stroke="#0369a1"></circle><circle cx="760" cy="170" r="12" fill="#bae6fd" stroke="#0369a1"></circle><circle cx="790" cy="170" r="12" fill="#bae6fd" stroke="#0369a1"></circle><circle cx="820" cy="170" r="12" fill="#bae6fd" stroke="#0369a1"></circle><circle cx="850" cy="170" r="12" fill="#bae6fd" stroke="#0369a1"></circle><circle cx="880" cy="170" r="12" fill="#bae6fd" stroke="#0369a1"></circle><circle cx="910" cy="170" r="12" fill="#bae6fd" stroke="#0369a1"></circle><circle cx="940" cy="170" r="12" fill="#bae6fd" stroke="#0369a1"></circle><circle cx="970" cy="170" r="12" fill="#bae6fd" stroke="#0369a1"></circle><circle cx="640" cy="200" r="12" fill="#bae6fd" stroke="#0369a1"></circle><circle cx="670" cy="200" r="12" fill="#bae6fd" stroke="#0369a1"></circle><circle cx="700" cy="200" r="12" fill="#bae6fd" stroke="#0369a1"></circle><circle cx="730" cy="200" r="12" fill="#bae6fd" stroke="#0369a1"></circle><circle cx="760" cy="200" r="12" fill="#bae6fd" stroke="#0369a1"></circle><circle cx="790" cy="200" r="12" fill="#bae6fd" stroke="#0369a1"><animate attributeName="fill" keyTimes="0.0000;0.6667;0.7083;1.0000" values="#bae6fd;#bae6fd;#ef4444;#ef4444" dur="12s" begin="gs2-play.begin+0s" fill="freeze"/></circle><circle cx="820" cy="2