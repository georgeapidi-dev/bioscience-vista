" stroke="#0369a1"></circle><circle cx="670" cy="260" r="12" fill="#bae6fd" stroke="#0369a1"></circle><circle cx="700" cy="260" r="12" fill="#bae6fd" stroke="#0369a1"></circle><circle cx="730" cy="260" r="12" fill="#bae6fd" stroke="#0369a1"></circle><circle cx="760" cy="260" r="12" fill="#bae6fd" stroke="#0369a1"></circle><circle cx="790" cy="260" r="12" fill="#bae6fd" stroke="#0369a1"><animate attributeName="fill" keyTimes="0.0000;0.6667;0.7083;1.0000" values="#bae6fd;#bae6fd;#ef4444;#ef4444" dur="12s" begin="gs2-play.begin+0s" fill="freeze"/></circle><circle cx="820" cy="260" r="12" fill="#bae6fd" stroke="#0369a1"></circle><circle cx="850" cy="260" r="12" fill="#bae6fd" stroke="#0369a1"></circle><circle cx="880" cy="260" r="12" fill="#bae6fd" stroke="#0369a1"></circle><circle cx="910" cy="260" r="12" fill="#bae6fd" stroke="#0369a1"></circle><circle cx="940" cy="260" r="12" fill="#bae6fd" stroke="#0369a1"></circle><circle cx="970" cy="260" r="12" fill="#bae6fd" stroke="#0369a1"></circle><g><animate attributeName="opacity" keyTimes="0.0000;0.7083;0.7333;1.0000" values="0;0;1;1" dur="12s" begin="gs2-play.begin+0s" fill="freeze"/><text x="815" y="340" text-anchor="middle" font-size="13" font-weight="800" fill="#0369a1">only the descendants of that cell</text><text x="815" y="364" text-anchor="middle" font-size="13" font-weight="800" fill="#0369a1">not inherited by offspring</text><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.7917;0.8167;1.0000" values="0;0;1;1" dur="12s" begin="gs2-play.begin+0s" fill="freeze"/><rect x="635.0" y="408" width="360" height="24" rx="12" fill="#fee2e2" stroke="#1f2937" stroke-width="1"/><text x="815" y="425" text-anchor="middle" font-size="12" font-weight="700">may cause cancer if cell-cycle genes are hit</text></g></g></g>
</svg>