<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 700" class="vd-svg" role="img" aria-labelledby="cf-title cf-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="cf-play" data-vd-play-label="Play: feedback loops" data-vd-steps="[[0, &quot;Climate feedbacks: changes that speed up or slow down warming.&quot;], [1, &quot;Ice\u2013albedo: less ice means a darker surface that absorbs more sunlight.&quot;], [3.5, &quot;Permafrost thaw releases CO\u2082 and methane.&quot;], [6, &quot;Warmer air holds more water vapour, a greenhouse gas.&quot;], [8.5, &quot;Drought and fires release CO\u2082 from forests.&quot;], [11, &quot;Negative feedbacks slow warming, but they are weaker.&quot;], [13.5, &quot;Positive feedbacks can tip systems into new states.&quot;]]" data-vd-dur="16">
<title id="cf-title">Climate feedback loops</title><desc id="cf-desc">Climate feedback loops around global warming: ice–albedo, permafrost thaw, water vapour and forest dieback as positive feedbacks, and increased outgoing radiation and plant growth as negative feedbacks.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1220" height="700" fill="#ffffff"/>
<g aria-hidden="true"><animate id="cf-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<defs><marker id="cf-dc2626" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="6.3" refY="7.0" orient="auto"><path d="M0,0 L14,7.0 L0,14 z" fill="#dc2626"/></marker><marker id="cf-2563eb" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="6.3" refY="7.0" orient="auto"><path d="M0,0 L14,7.0 L0,14 z" fill="#2563eb"/></marker></defs>
<text class="head" x="30" y="34">Climate feedback loops</text><text class="note" x="30" y="56">Red loops amplify warming (positive feedback); blue loops reduce it (negative feedback).</text>
<g class="part" data-part="warm" data-name="Global warming" data-info="Rising average temperature caused mainly by increased CO₂ and methane from human activity." tabindex="0" role="button" aria-label="Global warming"><circle cx="610" cy="380" r="78" fill="#fecaca" stroke="#dc2626" stroke-width="4"><animate attributeName="r" values="78;84;78" dur="2s" repeatCount="indefinite"/></circle><text x="610" y="376" text-anchor="middle" font-size="17" font-weight="800" fill="#991b1b">global</text><text x="610" y="398" text-anchor="middle" font-size="17" font-weight="800" fill="#991b1b">warming</text></g>
<g class="part" data-part="ice" data-name="Ice–albedo feedback (positive)" data-info="Warming melts sea ice and snow; darker ocean and land absorb more sunlight; more warming." tabindex="0" role="button" aria-label="Ice–albedo feedback (positive)"><g><animate attributeName="opacity" keyTimes="0.0000;0.0625;0.0813;1.0000" values="0;0;1;1" dur="16s" begin="cf-play.begin+0s" fill="freeze"/><rect x="219.54488933954747" y="475.41327413103863" width="260" height="92" rx="16" fill="#fff1f2" stroke="#dc2626" stroke-width="2.5"/><text x="349.54488933954747" y="503.41327413103863" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">sea ice and snow melt</text><text x="349.54488933954747" y="525.4132741310386" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">darker surface</text><text x="349.54488933954747" y="547.4132741310386" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">absorbs more sunlight</text><path d="M 563 452 Q 521 487 440 475" fill="none" stroke="#dc2626" stroke-width="3.5" marker-end="url(#cf-dc2626)"/><path d="M 480 511 Q 486 439 531 413" fill="none" stroke="#dc2626" stroke-width="3.5" marker-end="url(#cf-dc2626)"/><circle cx="501" cy="464" r="13" fill="#dc2626"/><text x="501.47188496314305" y="468.8464200941671" text-anchor="middle" font-size="16" font-weight="800" fill="#fff">+</text><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.0625;0.0750;0.1938;0.2063;1.0000" values="0;0;1;1;0;0" dur="16s" begin="cf-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.0625;0.1250;0.1875;1.0000" values="563.3988805867386 452.2795660572956;563.3988805867386 452.2795660572956;349.54488933954747 521.4132741310386;530.7263234990654 413.34192876882156;530.7263234990654 413.34192876882156" dur="16s" begin="cf-play.begin+0s" fill="freeze"/><circle r="8" fill="#f97316"/></g></g></g></g>
<g class="part" data-part="perm" data-name="Permafrost feedback (positive)" data-info="Thawing frozen soils let microbes decompose old organic matter, releasing CO₂ and methane; more warming." tabindex="0" role="button" aria-label="Permafrost feedback (positive)"><g><animate attributeName="opacity" keyTimes="0.0000;0.2188;0.2375;1.0000" values="0;0;1;1" dur="16s" begin="cf-play.begin+0s" fill="freeze"/><rect x="219.54488933954752" y="192.5867258689613" width="260" height="92" rx="16" fill="#fff1f2" stroke="#dc2626" stroke-width="2.5"/><text x="349.5448893395475" y="220.5867258689613" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">permafrost thaws</text><text x="349.5448893395475" y="242.5867258689613" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">microbes decompose</text><text x="349.5448893395475" y="264.5867258689613" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">release CO₂ + methane</text><path d="M 531 347 Q 486 321 480 249" fill="none" stroke="#dc2626" stroke-width="3.5" marker-end="url(#cf-dc2626)"/><path d="M 440 285 Q 521 273 563 308" fill="none" stroke="#dc2626" stroke-width="3.5" marker-end="url(#cf-dc2626)"/><circle cx="505" cy="298" r="13" fill="#dc2626"/><text x="505.13560641930644" y="302.6223985500699" text-anchor="middle" font-size="16" font-weight="800" fill="#fff">+</text><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.2188;0.2313;0.3500;0.3625;1.0000" values="0;0;1;1;0;0" dur="16s" begin="cf-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.2188;0.2812;0.3438;1.0000" values="530.7263234990654 346.65807123117844;530.7263234990654 346.65807123117844;349.5448893395475 238.5867258689613;563.3988805867388 307.7204339427044;563.3988805867388 307.7204339427044" dur="16s" begin="cf-play.begin+0s" fill="freeze"/><circle r="8" fill="#f97316"/></g></g></g></g>
<g class="part" data-part="vap" data-name="Water vapour feedback (positive)" data-info="Warmer air holds more water vapour, itself a greenhouse gas; more warming." tabindex="0" role="button" aria-label="Water vapour feedback (positive)"><g><animate attributeName="opacity" keyTimes="0.0000;0.3750;0.3937;1.0000" values="0;0;1;1" dur="16s" begin="cf-play.begin+0s" fill="freeze"/><rect x="740.4551106604525" y="192.58672586896137" width="260" height="92" rx="16" fill="#fff1f2" stroke="#dc2626" stroke-width="2.5"/><text x="870.4551106604525" y="220.58672586896137" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">more evaporation</text><text x="870.4551106604525" y="242.58672586896137" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">more water vapour</text><text x="870.4551106604525" y="264.58672586896137" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">(a greenhouse gas)</text><path d="M 657 308 Q 699 273 780 285" fill="none" stroke="#dc2626" stroke-width="3.5" marker-end="url(#cf-dc2626)"/><path d="M 740 249 Q 734 321 689 347" fill="none" stroke="#dc2626" stroke-width="3.5" marker-end="url(#cf-dc2626)"/><circle cx="719" cy="296" r="13" fill="#dc2626"/><text x="718.5281150368569" y="301.1535799058329" text-anchor="middle" font-size="16" font-weight="800" fill="#fff">+</text><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.3750;0.3875;0.5062;0.5187;1.0000" values="0;0;1;1;0;0" dur="16s" begin="cf-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.3750;0.4375;0.5000;1.0000" values="656.6011194132612 307.7204339427044;656.6011194132612 307.7204339427044;870.4551106604525 238.58672586896137;689.2736765009346 346.65807123117844;689.2736765009346 346.65807123117844" dur="16s" begin="cf-play.begin+0s" fill="freeze"/><circle r="8" fill="#f97316"/></g></g></g></g>
<g class="part" data-part="fire" data-name="Forest dieback and fires (positive)" data-info="Drought and heat kill trees and cause more fires, releasing CO₂ and reducing uptake." tabindex="0" role="button" aria-label="Forest dieback and fires (positive)"><g><animate attributeName="opacity" keyTimes="0.0000;0.5312;0.5500;1.0000" values="0;0;1;1" dur="16s" begin="cf-play.begin+0s" fill="freeze"/><rect x="740.4551106604525" y="475.41327413103863" width="260" height="92" rx="16" fill="#fff1f2" stroke="#dc2626" stroke-width="2.5"/><text x="870.4551106604525" y="503.41327413103863" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">drought and heat</text><text x="870.4551106604525" y="525.4132741310386" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">forest dieback, fires</text><text x="870.4551106604525" y="547.4132741310386" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">release CO₂</text><path d="M 689 413 Q 734 439 740 511" fill="none" stroke="#dc2626" stroke-width="3.5" marker-end="url(#cf-dc2626)"/><path d="M 780 475 Q 699 487 657 452" fill="none" stroke="#dc2626" stroke-width="3.5" marker-end="url(#cf-dc2626)"/><circle cx="715" cy="462" r="13" fill="#dc2626"/><text x="714.8643935806936" y="467.3776014499301" text-anchor="middle" font-size="16" font-weight="800" fill="#fff">+</text><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.5312;0.5437;0.6625;0.6750;1.0000" values="0;0;1;1;0;0" dur="16s" begin="cf-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.5312;0.5938;0.6562;1.0000" values="689.2736765009346 413.34192876882156;689.2736765009346 413.34192876882156;870.4551106604525 521.4132741310386;656.6011194132612 452.2795660572956;656.6011194132612 452.2795660572956" dur="16s" begin="cf-play.begin+0s" fill="freeze"/><circle r="8" fill="#f97316"/></g></g></g></g>
<g class="part" data-part="neg" data-name="Negative feedbacks" data-info="A warmer Earth radiates more heat to space; higher CO₂ can increase plant growth and CO₂ uptake (limited by water and nutrients). These reduce warming but are outweighed." tabindex="0" role="button" aria-label="Negative feedbacks"><g><animate attributeName="opacity" keyTimes="0.0000;0.6875;0.7063;1.0000" values="0;0;1;1" dur="16s" begin="cf-play.begin+0s" fill="freeze"/><rect x="40" y="590" width="560" height="96" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/><text x="320" y="616" text-anchor="middle" font-size="14" font-weight="800" fill="#1d4ed8">Negative feedbacks (−) reduce warming</text><text x="320" y="642" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">a warmer Earth radiates more heat to space</text><text x="320" y="664" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">more CO₂ → more plant growth → more CO₂ absorbed (limited)</text><path d="M 470 590 C 520 520 540 480 560 440" fill="none" stroke="#2563eb" stroke-width="3.5" marker-end="url(#cf-2563eb)"/><circle cx="520" cy="520" r="13" fill="#2563eb"/><text x="520" y="526" text-anchor="middle" font-size="18" font-weight="800" fill="#fff">−</text></g></g>
<g class="part" data-part="tip" data-name="Tipping points" data-info="Positive feedbacks can push a system past a threshold into a new state that is hard to reverse, e.g. loss of Arctic summer sea ice." tabindex="0" role="button" aria-label="Tipping points"><g><animate attributeName="opacity" keyTimes="0.0000;0.8438;0.8625;1.0000" values="0;0;1;1" dur="16s" begin="cf-play.begin+0s" fill="freeze"/><rect x="640" y="590" width="540" height="96" rx="16" fill="#fef9c3" stroke="#eab308" stroke-width="2.5"/><text x="910" y="616" text-anchor="middle" font-size="14" font-weight="800" fill="#713f12">Tipping points</text><text x="910" y="642" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">positive feedbacks can push a system into a new state</text><text x="910" y="664" text-anchor="middle" font-size="12" font-weight="600" fill="#111827">that is hard to reverse, e.g. loss of Arctic summer sea ice</text></g></g>
</svg>