<g class="part" data-part="data" data-name="Results" data-info="Where Balanus was removed, about 90% of young Chthamalus survived the year; where Balanus was left, fewer than 20% survived." tabindex="0" role="button" aria-label="Results"><rect x="600" y="160" width="470" height="360" rx="16" fill="#f8fafc" stroke="#cbd5e1"/><text x="835" y="186" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">survival of young Chthamalus (lower shore)</text><line x1="660" y1="470" x2="1040" y2="470" stroke="#111827" stroke-width="2"/><rect x="710" y="236" width="100" height="234" fill="#4ade80" stroke="#334155"><animate attributeName="height" keyTimes="0.0000;0.5357;0.6071;1.0000" values="0;0;234.0;234.0" dur="14s" begin="cn2-play.begin+0s" fill="freeze"/><animate attributeName="y" keyTimes="0.0000;0.5357;0.6071;1.0000" values="470;470;236.0;236.0" dur="14s" begin="cn2-play.begin+0s" fill="freeze"/></rect><g><animate attributeName="opacity" keyTimes="0.0000;0.6071;0.6286;1.0000" values="0;0;1;1" dur="14s" begin="cn2-play.begin+0s" fill="freeze"/><text x="760" y="228.0" text-anchor="middle" font-size="14" font-weight="800" fill="#111827">≈ 90%</text></g><text x="760" y="490" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">Balanus removed</text><rect x="890" y="423" width="100" height="47" fill="#f87171" stroke="#334155"><animate attributeName="height" keyTimes="0.0000;0.6071;0.6786;1.0000" values="0;0;46.8;46.8" dur="14s" begin="cn2-play.begin+0s" fill="freeze"/><animate attributeName="y" keyTimes="0.0000;0.6071;0.6786;1.0000" values="470;470;423.2;423.2" dur="14s" begin="cn2-play.begin+0s" fill="freeze"/></rect><g><animate attributeName="opacity" keyTimes="0.0000;0.6786;0.7000;1.0000" values="0;0;1;1" dur="14s" begin="cn2-play.begin+0s" fill="freeze"/><text x="940" y="415.2" text-anchor="middle" font-size="14" font-weight="800" fill="#111827">< 20%</text></g><text x="940" y="490" text-anchor="middle" font-size="12" font-weight="800" fill="#1