<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 580" class="vd-svg" role="img" aria-labelledby="cn2-title cn2-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="cn2-play" data-vd-play-label="Play: remove Balanus" data-vd-steps="[[0, &quot;Connell&#x27;s barnacles: competition limits where a species lives.&quot;], [1, &quot;Chthamalus lives high on the shore; Balanus lower down.&quot;], [4, &quot;Connell removed Balanus from some lower-shore rocks.&quot;], [7.5, &quot;Without Balanus, ~90% of young Chthamalus survived; with it, under 20%.&quot;], [11, &quot;Higher up, Balanus dries out, so Chthamalus has no competitor there.&quot;]]" data-vd-dur="14">
<title id="cn2-title">Connell&#x27;s barnacle experiment</title><desc id="cn2-desc">Upper and lower rocky shore zones with Chthamalus and Balanus barnacles; when Balanus was removed from the lower shore about 90 percent of young Chthamalus survived, compared with under 20 percent where Balanus remained.</desc>
