<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" class="vd-svg" role="img" aria-labelledby="iv2-title iv2-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="iv2-play" data-vd-play-label="Play: IVF step by step" data-vd-steps="[[0, &quot;In vitro fertilisation (IVF).&quot;], [1.0, &quot;1 Down-regulation: a drug suspends the woman&#x27;s own FSH and LH.&quot;], [3.3, &quot;2 Superovulation: high doses of FSH (and LH): many follicles.&quot;], [5.6, &quot;3 hCG injection: acts like LH: eggs mature; eggs collected.&quot;], [7.8999999999999995, &quot;4 Fertilisation: eggs mixed with sperm (or a sperm injected).&quot;], [10.2, &quot;5 Embryos grow: 2\u20135 days in culture.&quot;], [12.5, &quot;6 Transfer: 1\u20132 embryos into the uterus; progesterone given.&quot;]]" data-vd-dur="16">
<title id="iv2-title">IVF</title><desc id="iv2-desc">The six stages of IVF: down-regulation of natural hormones, superovulation with FSH, an hCG injection to mature the eggs before collection, fertilisation in the laboratory, embryo culture for two to five days, and transfer to the uterus with progesterone.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="520" fill="#ffffff"/>
<g aria-hidden="true"><animate id="iv2-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<defs><marker id="iv2-475569" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="6.3" refY="7.0" orient="auto"><path d="M0,0 L14,7.0 L0,14 z" fill="#475569"/></marker></defs>
<text class="head" x="30" y="34">In vitro fertilisation (IVF)</text><text class="note" x="30" y="56">From the lesson notes.</text>
<g class="part" data-part="s0" data-name="1 Down-regulation" data-info="a drug suspends the woman&#x27;s own FSH and LH" tabindex="0" role="button" aria-label="1 Down-regulation"><g><animate attributeName="opacity" keyTimes="0.0000;0.0625;0.0813;1.0000" values="0;0;1;1" dur="16s" begin="iv2-play.begin+0s" fill="freeze"/><rect x="20" y="100" width="300" height="150" rx="16" fill="#fff" stroke="#9d174d" stroke-width="2"/><g transform="translate(80 170)"><circle r="22" fill="#e5e7eb" stroke="#475569"/><line x1="-14" y1="-14" x2="14" y2="14" stroke="#dc2626" stroke-width="4"/></g><text x="210" y="150" text-anchor="middle" font-size="14" font-weight="800" fill="#9d174d">1 Down-regulation</text><text x="210" y="176" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">a drug suspends the</text><text x="210" y="194" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">woman's own FSH and LH</text></g></g>
<g class="part" data-part="s1" data-name="2 Superovulation" data-info="high doses of FSH (and LH): many follicles" tabindex="0" role="button" aria-label="2 Superovulation"><g><animate attributeName="opacity" keyTimes="0.0000;0.2062;0.2250;1.0000" values="0;0;1;1" dur="16s" begin="iv2-play.begin+0s" fill="freeze"/><rect x="360" y="100" width="300" height="150" rx="16" fill="#fff" stroke="#9d174d" stroke-width="2"/><g transform="translate(420 170)"><circle cx="-14" cy="-8" r="10" fill="#fde68a" stroke="#a16207"/><circle cx="10" cy="-12" r="10" fill="#fde68a" stroke="#a16207"/><circle cx="0" cy="10" r="10" fill="#fde68a" stroke="#a16207"/><circle cx="16" cy="10" r="10" fill="#fde68a" stroke="#a16207"/></g><text x="550" y="150" text-anchor="middle" font-size="14" font-weight="800" fill="#9d174d">2 Superovulation</text><text x="550" y="176" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">high doses of FSH (and</text><text x="550" y="194" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">LH): many follicles</text></g></g>
<g class="part" data-part="s2" data-name="3 hCG injection" data-info="acts like LH: eggs mature; eggs collected" tabindex="0" role="button" aria-label="3 hCG injection"><g><animate attributeName="opacity" keyTimes="0.0000;0.3500;0.3687;1.0000" values="0;0;1;1" dur="16s" begin="iv2-play.begin+0s" fill="freeze"/><rect x="700" y="100" width="300" height="150" rx="16" fill="#fff" stroke="#9d174d" stroke-width="2"/><g transform="translate(760 170)"><rect x="-6" y="-26" width="12" height="40" fill="#bae6fd" stroke="#0369a1"/><line x1="0" y1="14" x2="0" y2="30" stroke="#0369a1" stroke-width="3"/></g><text x="890" y="150" text-anchor="middle" font-size="14" font-weight="800" fill="#9d174d">3 hCG injection</text><text x="890" y="176" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">acts like LH: eggs mature;</text><text x="890" y="194" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">eggs collected</text></g></g>
<g class="part" data-part="s3" data-name="4 Fertilisation" data-info="eggs mixed with sperm (or a sperm injected)" tabindex="0" role="button" aria-label="4 Fertilisation"><g><animate attributeName="opacity" keyTimes="0.0000;0.4937;0.5125;1.0000" values="0;0;1;1" dur="16s" begin="iv2-play.begin+0s" fill="freeze"/><rect x="20" y="290" width="300" height="150" rx="16" fill="#fff" stroke="#9d174d" stroke-width="2"/><g transform="translate(80 360)"><circle r="20" fill="#fce7f3" stroke="#9d174d" stroke-width="2"/><ellipse cx="-30" cy="0" rx="8" ry="5" fill="#93c5fd"/><path d="M -38 0 q -10 -4 -16 2" stroke="#1d4ed8" fill="none"/></g><text x="210" y="340" text-anchor="middle" font-size="14" font-weight="800" fill="#9d174d">4 Fertilisation</text><text x="210" y="366" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">eggs mixed with sperm (or</text><text x="210" y="384" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">a sperm injected)</text></g></g>
<g class="part" data-part="s4" data-name="5 Embryos grow" data-info="2–5 days in culture" tabindex="0" role="button" aria-label="5 Embryos grow"><g><animate attributeName="opacity" keyTimes="0.0000;0.6375;0.6562;1.0000" values="0;0;1;1" dur="16s" begin="iv2-play.begin+0s" fill="freeze"/><rect x="360" y="290" width="300" height="150" rx="16" fill="#fff" stroke="#9d174d" stroke-width="2"/><g transform="translate(420 360)"><circle cx="-8" cy="-8" r="9" fill="#fbcfe8" stroke="#9d174d"/><circle cx="8" cy="-8" r="9" fill="#fbcfe8" stroke="#9d174d"/><circle cx="-8" cy="8" r="9" fill="#fbcfe8" stroke="#9d174d"/><circle cx="8" cy="8" r="9" fill="#fbcfe8" stroke="#9d174d"/></g><text x="550" y="340" text-anchor="middle" font-size="14" font-weight="800" fill="#9d174d">5 Embryos grow</text><text x="550" y="366" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">2–5 days in culture</text></g></g>
<g class="part" data-part="s5" data-name="6 Transfer" data-info="1–2 embryos into the uterus; progesterone given" tabindex="0" role="button" aria-label="6 Transfer"><g><animate attributeName="opacity" keyTimes="0.0000;0.7812;0.8000;1.0000" values="0;0;1;1" dur="16s" begin="iv2-play.begin+0s" fill="freeze"/><rect x="700" y="290" width="300" height="150" rx="16" fill="#fff" stroke="#9d174d" stroke-width="2"/><g transform="translate(760 360)"><path d="M -26 -20 Q 0 40 26 -20" fill="#fecdd3" stroke="#be123c" stroke-width="3"/><circle cx="0" cy="6" r="7" fill="#fbcfe8" stroke="#9d174d"/></g><text x="890" y="340" text-anchor="middle" font-size="14" font-weight="800" fill="#9d174d">6 Transfer</text><text x="890" y="366" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">1–2 embryos into the</text><text x="890" y="384" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">uterus; progesterone given</text></g></g>
</svg>