<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 540" class="vd-svg" role="img" aria-labelledby="ac2-title ac2-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="ac2-play" data-vd-play-label="Play: focus" data-vd-steps="[[0, &quot;Accommodation: changing lens shape.&quot;], [1, &quot;Distant object: thin lens.&quot;], [7, &quot;Near object: fat lens.&quot;], [12, &quot;Light focused on the retina.&quot;]]" data-vd-dur="14">
<title id="ac2-title">Accommodation</title><desc id="ac2-desc">An eye focusing on a distant object with relaxed ciliary muscles, tight suspensory ligaments and a thin lens, then on a near object with contracted ciliary muscles, slack ligaments and a fatter lens, light focused on the retina.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="540" fill="#ffffff"/>
<g aria-hidden="true"><animate id="ac2-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<text class="head" x="30" y="34">Accommodation: focusing near and far</text><text class="note" x="30" y="56">Schematic eye.</text>
<g class="part" data-part="far" data-name="Distant object" data-info="Ciliary muscles relax; suspensory ligaments are pulled tight; the lens is pulled thinner and refracts light less." tabindex="0" role="button" aria-label="Distant object"><ellipse cx="560" cy="290" rx="220" ry="170" fill="#f8fafc" stroke="#334155" stroke-width="4"/><path d="M 760 200 Q 790 290 760 380" fill="none" stroke="#dc2626" stroke-width="8"/><text x="800" y="294" text-anchor="start" font-size="13" font-weight="800" fill="#b91c1c">retina</text><ellipse cx="400" cy="290" rx="22" ry="70" fill="#bae6fd" stroke="#0369a1" stroke-width="3"><animate attributeName="rx" keyTimes="0.0000;0.5000;0.6071;1.0000" values="18;18;36;36" dur="14s" begin="ac2-play.begin+0s" fill="freeze"/></ellipse><line x1="400" y1="220" x2="400" y2="150" stroke="#a16207" stroke-width="3"/><line x1="400" y1="360" x2="400" y2="430" stroke="#a16207" stroke-width="3"/><ellipse cx="400" cy="140" rx="30" ry="14" fill="#f9a8d4" stroke="#9d174d"><animate attributeName="rx" keyTimes="0.0000;0.5000;0.6071;1.0000" values="30;30;22;22" dur="14s" begin="ac2-play.begin+0s" fill="freeze"/></ellipse><ellipse cx="400" cy="440" rx="30" ry="14" fill="#f9a8d4" stroke="#9d174d"><animate attributeName="rx" keyTimes="0.0000;0.5000;0.6071;1.0000" values="30;30;22;22" dur="14s" begin="ac2-play.begin+0s" fill="freeze"/></ellipse><text x="440" y="124" text-anchor="start" font-size="12" font-weight="800" fill="#9d174d">ciliary muscle</text><text x="420" y="190" text-anchor="start" font-size="12" font-weight="800" fill="#a16207">suspensory ligament</text><g><animate attributeName="opacity" keyTimes="0.0000;0.0714;0.0929;0.5000;0.5214;1.0000" values="0;0;1;1;0;0" dur="14s" begin="ac2-play.begin+0s" fill="freeze"/><path d="M 60 260 L 400 260 L 770 290" fill="none" stroke="#f59e0b" stroke-width="2.5"/><path d="M 60 290 L 400 290 L 770 290" fill="none" stroke="#f59e0b" stroke-width="2.5"/><path d="M 60 320 L 400 320 L 770 290" fill="none" stroke="#f59e0b" stroke-width="2.5"/></g><g><animate attributeName="opacity" keyTimes="0.0000;0.0714;0.0929;0.5000;0.5214;1.0000" values="0;0;1;1;0;0" dur="14s" begin="ac2-play.begin+0s" fill="freeze"/><text x="150" y="230" text-anchor="middle" font-size="13" font-weight="800" fill="#a16207">distant object: parallel rays</text></g></g>
<g class="part" data-part="near" data-name="Near object" data-info="Ciliary muscles contract; suspensory ligaments slacken; the lens becomes fatter (more convex) and refracts light more strongly." tabindex="0" role="button" aria-label="Near object"><g><animate attributeName="opacity" keyTimes="0.0000;0.6071;0.6286;1.0000" values="0;0;1;1" dur="14s" begin="ac2-play.begin+0s" fill="freeze"/><circle cx="180" cy="290" r="10" fill="#f59e0b"/><path d="M 180 290 L 400 230 L 770 290" fill="none" stroke="#f59e0b" stroke-width="2.5"/><path d="M 180 290 L 400 290 L 770 290" fill="none" stroke="#f59e0b" stroke-width="2.5"/><path d="M 180 290 L 400 350 L 770 290" fill="none" stroke="#f59e0b" stroke-width="2.5"/><text x="180" y="330" text-anchor="middle" font-size="13" font-weight="800" fill="#a16207">near object: diverging rays</text></g></g>
<g class="part" data-part="focus" data-name="Focusing" data-info="In both cases the light is focused on the retina." tabindex="0" role="button" aria-label="Focusing"><g><animate attributeName="opacity" keyTimes="0.0000;0.8571;0.8786;1.0000" values="0;0;1;1" dur="14s" begin="ac2-play.begin+0s" fill="freeze"/><rect x="830" y="380" width="240" height="140" rx="14" fill="#f0fdf4" stroke="#86efac"/><text x="950" y="406" text-anchor="middle" font-size="13" font-weight="800" fill="#15803d">near:</text><text x="950" y="428" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">muscles contract · ligaments slack</text><text x="950" y="448" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">lens fatter</text><text x="950" y="476" text-anchor="middle" font-size="13" font-weight="800" fill="#1d4ed8">far:</text><text x="950" y="498" text-anchor="middle" font-size="10" font-weight="700" fill="#111827">muscles relax · ligaments tight · lens thin</text></g></g>
</svg>