<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 720" class="vd-svg" role="img" aria-labelledby="hw-title hw-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="hw-play" data-vd-play-label="Play: allele to genotype frequencies" data-vd-steps="[[0, &quot;The Hardy\u2013Weinberg principle predicts genotype frequencies from allele frequencies.&quot;], [1, &quot;The gene pool: alleles A and a. Their frequencies are p and q: p + q = 1.&quot;], [4, &quot;With random mating, the chance of AA is p \u00d7 p, of aa is q \u00d7 q, and of Aa is 2pq.&quot;], [8, &quot;So p\u00b2 + 2pq + q\u00b2 = 1.&quot;], [10.5, &quot;Example: cystic fibrosis. q\u00b2 = 1/2500, so q = 0.02 and 1 in 25 people are carriers.&quot;], [13.5, &quot;This holds only under the five conditions.&quot;]]" data-vd-dur="16">
<title id="hw-title">Hardy–Weinberg</title><desc id="hw-desc">A gene pool of A and a alleles, the equations p + q = 1 and p squared + 2pq + q squared = 1 shown as an area square, a worked cystic fibrosis example and the conditions for equilibrium.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1220" height="720" fill="#ffffff"/>
<g aria-hidden="true"><animate id="hw-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<text class="head" x="30" y="34">The Hardy–Weinberg principle</text><text class="note" x="30" y="56">Square drawn for p = 0.7, q = 0.3; the example uses real cystic fibrosis figures.</text>
<g class="part" data-part="pool" data-name="Gene pool" data-info="All the alleles of a gene in a population. Here A (dominant) and a (recessive)." tabindex="0" role="button" aria-label="Gene pool"><ellipse cx="190" cy="230" rx="160" ry="120" fill="#f1f5f9" stroke="#64748b" stroke-width="2" stroke-dasharray="6 4"/><text x="190" y="98" text-anchor="middle" font-size="13" font-weight="800" fill="#334155">gene pool (70 A, 30 a)</text><circle cx="321" cy="203" r="7" fill="#2563eb" stroke="#fff"/><circle cx="228" cy="240" r="7" fill="#2563eb" stroke="#fff"/><circle cx="251" cy="156" r="7" fill="#2563eb" stroke="#fff"/><circle cx="152" cy="181" r="7" fill="#2563eb" stroke="#fff"/><circle cx="104" cy="182" r="7" fill="#2563eb" stroke="#fff"/><circle cx="141" cy="211" r="7" fill="#2563eb" stroke="#fff"/><circle cx="110" cy="256" r="7" fill="#2563eb" stroke="#fff"/><circle cx="166" cy="132" r="7" fill="#2563eb" stroke="#fff"/><circle cx="288" cy="207" r="7" fill="#2563eb" stroke="#fff"/><circle cx="122" cy="248" r="7" fill="#2563eb" stroke="#fff"/><circle cx="213" cy="234" r="7" fill="#2563eb" stroke="#fff"/><circle cx="113" cy="242" r="7" fill="#2563eb" stroke="#fff"/><circle cx="94" cy="295" r="7" fill="#2563eb" stroke="#fff"/><circle cx="87" cy="218" r="7" fill="#2563eb" stroke="#fff"/><circle cx="192" cy="245" r="7" fill="#2563eb" stroke="#fff"/><circle cx="166" cy="263" r="7" fill="#2563eb" stroke="#fff"/><circle cx="50" cy="224" r="7" fill="#2563eb" stroke="#fff"/><circle cx="163" cy="192" r="7" fill="#2563eb" stroke="#fff"/><circle cx="288" cy="175" r="7" fill="#2563eb" stroke="#fff"/><circle cx="177" cy="135" r="7" fill="#2563eb" stroke="#fff"/><circle cx="200" cy="141" r="7" fill="#2563eb" stroke="#fff"/><circle cx="106" cy="309" r="7" fill="#2563eb" stroke="#fff"/><circle cx="245" cy="220" r="7" fill="#2563eb" stroke="#fff"/><circle cx="193" cy="145" r="7" fill="#2563eb" stroke="#fff"/><circle cx="91" cy="247" r="7" fill="#2563eb" stroke="#fff"/><circle cx="56" cy="236" r="7" fill="#2563eb" stroke="#fff"/><circle cx="62" cy="230" r="7" fill="#2563eb" stroke="#fff"/><circle cx="110" cy="305" r="7" fill="#2563eb" stroke="#fff"/><circle cx="267" cy="190" r="7" fill="#2563eb" stroke="#fff"/><circle cx="68" cy="190" r="7" fill="#2563eb" stroke="#fff"/><circle cx="174" cy="161" r="7" fill="#2563eb" stroke="#fff"/><circle cx="204" cy="286" r="7" fill="#2563eb" stroke="#fff"/><circle cx="172" cy="191" r="7" fill="#2563eb" stroke="#fff"/><circle cx="251" cy="202" r="7" fill="#2563eb" stroke="#fff"/><circle cx="256" cy="201" r="7" fill="#2563eb" stroke="#fff"/><circle cx="303" cy="208" r="7" fill="#2563eb" stroke="#fff"/><circle cx="89" cy="228" r="7" fill="#2563eb" stroke="#fff"/><circle cx="128" cy="168" r="7" fill="#2563eb" stroke="#fff"/><circle cx="166" cy="272" r="7" fill="#2563eb" stroke="#fff"/><circle cx="55" cy="223" r="7" fill="#2563eb" stroke="#fff"/><circle cx="163" cy="211" r="7" fill="#2563eb" stroke="#fff"/><circle cx="241" cy="153" r="7" fill="#2563eb" stroke="#fff"/><circle cx="241" cy="206" r="7" fill="#2563eb" stroke="#fff"/><circle cx="189" cy="206" r="7" fill="#2563eb" stroke="#fff"/><circle cx="148" cy="187" r="7" fill="#2563eb" stroke="#fff"/><circle cx="209" cy="323" r="7" fill="#2563eb" stroke="#fff"/><circle cx="269" cy="275" r="7" fill="#2563eb" stroke="#fff"/><circle cx="232" cy="191" r="7" fill="#2563eb" stroke="#fff"/><circle cx="222" cy="321" r="7" fill="#2563eb" stroke="#fff"/><circle cx="85" cy="269" r="7" fill="#2563eb" stroke="#fff"/><circle cx="273" cy="242" r="7" fill="#2563eb" stroke="#fff"/><circle cx="244" cy="302" r="7" fill="#2563eb" stroke="#fff"/><circle cx="309" cy="279" r="7" fill="#2563eb" stroke="#fff"/><circle cx="308" cy="244" r="7" fill="#2563eb" stroke="#fff"/><circle cx="260" cy="237" r="7" fill="#2563eb" stroke="#fff"/><circle cx="212" cy="193" r="7" fill="#2563eb" stroke="#fff"/><circle cx="237" cy="306" r="7" fill="#2563eb" stroke="#fff"/><circle cx="168" cy="244" r="7" fill="#2563eb" stroke="#fff"/><circle cx="244" cy="228" r="7" fill="#2563eb" stroke="#fff"/><circle cx="270" cy="243" r="7" fill="#2563eb" stroke="#fff"/><circle cx="100" cy="173" r="7" fill="#2563eb" stroke="#fff"/><circle cx="252" cy="268" r="7" fill="#2563eb" stroke="#fff"/><circle cx="282" cy="243" r="7" fill="#2563eb" stroke="#fff"/><circle cx="202" cy="144" r="7" fill="#2563eb" stroke="#fff"/><circle cx="289" cy="180" r="7" fill="#2563eb" stroke="#fff"/><circle cx="266" cy="166" r="7" fill="#2563eb" stroke="#fff"/><circle cx="124" cy="238" r="7" fill="#2563eb" stroke="#fff"/><circle cx="148" cy="182" r="7" fill="#2563eb" stroke="#fff"/><circle cx="265" cy="270" r="7" fill="#2563eb" stroke="#fff"/><circle cx="225" cy="205" r="7" fill="#2563eb" stroke="#fff"/><circle cx="114" cy="198" r="7" fill="#f97316" stroke="#fff"/><circle cx="137" cy="226" r="7" fill="#f97316" stroke="#fff"/><circle cx="259" cy="217" r="7" fill="#f97316" stroke="#fff"/><circle cx="119" cy="190" r="7" fill="#f97316" stroke="#fff"/><circle cx="294" cy="238" r="7" fill="#f97316" stroke="#fff"/><circle cx="211" cy="248" r="7" fill="#f97316" stroke="#fff"/><circle cx="245" cy="238" r="7" fill="#f97316" stroke="#fff"/><circle cx="282" cy="275" r="7" fill="#f97316" stroke="#fff"/><circle cx="51" cy="225" r="7" fill="#f97316" stroke="#fff"/><circle cx="318" cy="190" r="7" fill="#f97316" stroke="#fff"/><circle cx="200" cy="296" r="7" fill="#f97316" stroke="#fff"/><circle cx="189" cy="307" r="7" fill="#f97316" stroke="#fff"/><circle cx="101" cy="167" r="7" fill="#f97316" stroke="#fff"/><circle cx="172" cy="181" r="7" fill="#f97316" stroke="#fff"/><circle cx="100" cy="264" r="7" fill="#f97316" stroke="#fff"/><circle cx="216" cy="231" r="7" fill="#f97316" stroke="#fff"/><circle cx="151" cy="248" r="7" fill="#f97316" stroke="#fff"/><circle cx="179" cy="182" r="7" fill="#f97316" stroke="#fff"/><circle cx="238" cy="255" r="7" fill="#f97316" stroke="#fff"/><circle cx="198" cy="276" r="7" fill="#f97316" stroke="#fff"/><circle cx="95" cy="221" r="7" fill="#f97316" stroke="#fff"/><circle cx="149" cy="305" r="7" fill="#f97316" stroke="#fff"/><circle cx="221" cy="323" r="7" fill="#f97316" stroke="#fff"/><circle cx="306" cy="210" r="7" fill="#f97316" stroke="#fff"/><circle cx="98" cy="259" r="7" fill="#f97316" stroke="#fff"/><circle cx="162" cy="219" r="7" fill="#f97316" stroke="#fff"/><circle cx="102" cy="266" r="7" fill="#f97316" stroke="#fff"/><circle cx="208" cy="258" r="7" fill="#f97316" stroke="#fff"/><circle cx="218" cy="173" r="7" fill="#f97316" stroke="#fff"/><circle cx="57" cy="218" r="7" fill="#f97316" stroke="#fff"/></g>
<g class="part" data-part="eq1" data-name="p + q = 1" data-info="p is the frequency of allele A, q the frequency of allele a. Together they make up all the alleles of the gene." tabindex="0" role="button" aria-label="p + q = 1"><g><animate attributeName="opacity" keyTimes="0.0000;0.0938;0.1125;1.0000" values="0;0;1;1" dur="16s" begin="hw-play.begin+0s" fill="freeze"/><rect x="40" y="380" width="300" height="80" rx="14" fill="#eff6ff" stroke="#93c5fd"/><text x="190" y="412" text-anchor="middle" font-size="22" font-weight="800" fill="#1e3a8a">p + q = 1</text><text x="190" y="440" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">p = 0.7 (A)   q = 0.3 (a)</text></g></g>
<g class="part" data-part="sq" data-name="p² + 2pq + q² = 1" data-info="With random mating, genotype frequencies are AA = p², Aa = 2pq and aa = q². The square shows this: each side is split p : q." tabindex="0" role="button" aria-label="p² + 2pq + q² = 1"><g><animate attributeName="opacity" keyTimes="0.0000;0.2500;0.2687;1.0000" values="0;0;1;1" dur="16s" begin="hw-play.begin+0s" fill="freeze"/><rect x="440" y="110" width="280.0" height="280.0" fill="#93c5fd"/><rect x="720.0" y="110" width="120.00000000000001" height="280.0" fill="#c4b5fd"/><rect x="440" y="390.0" width="280.0" height="120.00000000000001" fill="#c4b5fd"/><rect x="720.0" y="390.0" width="120.00000000000001" height="120.00000000000001" fill="#fdba74"/><rect x="440" y="110" width="400" height="400" fill="none" stroke="#1f2937" stroke-width="2"/><text x="580.0" y="100" text-anchor="middle" font-size="13" font-weight="800" fill="#1d4ed8">A (p = 0.7)</text><text x="780.0" y="100" text-anchor="middle" font-size="13" font-weight="800" fill="#c2410c">a (q = 0.3)</text><text x="428" y="250.0" text-anchor="end" font-size="13" font-weight="800" fill="#1d4ed8">A</text><text x="428" y="450.0" text-anchor="end" font-size="13" font-weight="800" fill="#c2410c">a</text><g><animate attributeName="opacity" keyTimes="0.0000;0.2625;0.2812;1.0000" values="0;0;1;1" dur="16s" begin="hw-play.begin+0s" fill="freeze"/><text x="580.0" y="255.0" text-anchor="middle" font-size="14" font-weight="800" fill="#111827">AA = p² = 0.49</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.3125;0.3312;1.0000" values="0;0;1;1" dur="16s" begin="hw-play.begin+0s" fill="freeze"/><text x="780.0" y="255.0" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">Aa = pq</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.3375;0.3563;1.0000" values="0;0;1;1" dur="16s" begin="hw-play.begin+0s" fill="freeze"/><text x="580.0" y="455.0" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">Aa = pq</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.3625;0.3812;1.0000" values="0;0;1;1" dur="16s" begin="hw-play.begin+0s" fill="freeze"/><text x="780.0" y="455.0" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">aa = q²</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.5000;0.5188;1.0000" values="0;0;1;1" dur="16s" begin="hw-play.begin+0s" fill="freeze"/><text x="640.0" y="544" text-anchor="middle" font-size="15" font-weight="800" fill="#111827">AA 0.49  +  Aa 2 × 0.21 = 0.42  +  aa 0.09  =  1</text><text x="640.0" y="574" text-anchor="middle" font-size="24" font-weight="800" fill="#7c3aed">p² + 2pq + q² = 1</text></g></g></g>
<g class="part" data-part="ex" data-name="Worked example: cystic fibrosis" data-info="About 1 in 2500 newborns (northern European descent) have CF (aa): q² = 0.0004, so q = 0.02 and p = 0.98. Carriers: 2pq = 0.039, about 1 in 25." tabindex="0" role="button" aria-label="Worked example: cystic fibrosis"><g><animate attributeName="opacity" keyTimes="0.0000;0.6562;0.6750;1.0000" values="0;0;1;1" dur="16s" begin="hw-play.begin+0s" fill="freeze"/><rect x="900" y="100" width="300" height="300" rx="16" fill="#fef2f2" stroke="#fca5a5"/><text x="1050" y="128" text-anchor="middle" font-size="14" font-weight="800" fill="#991b1b">Example: cystic fibrosis</text><text x="916" y="160" text-anchor="start" font-size="13" font-weight="600" fill="#111827">affected (aa): 1 in 2500</text><text x="916" y="190" text-anchor="start" font-size="13" font-weight="700" fill="#111827">q² = 1/2500 = 0.0004</text><text x="916" y="220" text-anchor="start" font-size="13" font-weight="600" fill="#111827">q = √0.0004 = 0.02</text><text x="916" y="250" text-anchor="start" font-size="13" font-weight="700" fill="#111827">p = 1 − 0.02 = 0.98</text><text x="916" y="280" text-anchor="start" font-size="13" font-weight="600" fill="#111827">carriers 2pq = 2 × 0.98 × 0.02</text><text x="916" y="310" text-anchor="start" font-size="13" font-weight="700" fill="#111827">= 0.039 ≈ 1 in 25</text><text x="916" y="340" text-anchor="start" font-size="13" font-weight="600" fill="#111827">Most a alleles are in carriers,</text><text x="916" y="370" text-anchor="start" font-size="13" font-weight="700" fill="#111827">hidden from selection.</text></g></g>
<g class="part" data-part="cond" data-name="Conditions" data-info="Allele frequencies stay the same from generation to generation only if the population is large, mating is random, and there is no mutation, migration or natural selection." tabindex="0" role="button" aria-label="Conditions"><g><animate attributeName="opacity" keyTimes="0.0000;0.8438;0.8625;1.0000" values="0;0;1;1" dur="16s" begin="hw-play.begin+0s" fill="freeze"/><rect x="900" y="420" width="300" height="270" rx="16" fill="#f0fdf4" stroke="#86efac"/><text x="1050" y="448" text-anchor="middle" font-size="14" font-weight="800" fill="#166534">Conditions for equilibrium</text><text x="916" y="480" text-anchor="start" font-size="13" font-weight="600" fill="#111827">1. a large population</text><text x="916" y="510" text-anchor="start" font-size="13" font-weight="600" fill="#111827">2. random mating</text><text x="916" y="540" text-anchor="start" font-size="13" font-weight="600" fill="#111827">3. no mutation</text><text x="916" y="570" text-anchor="start" font-size="13" font-weight="600" fill="#111827">4. no migration (gene flow)</text><text x="916" y="600" text-anchor="start" font-size="13" font-weight="600" fill="#111827">5. no natural selection</text><text x="1050" y="650" text-anchor="middle" font-size="12" font-weight="700" fill="#475569">If frequencies change,</text><text x="1050" y="668" text-anchor="middle" font-size="12" font-weight="700" fill="#475569">evolution is happening.</text></g></g>
</svg>