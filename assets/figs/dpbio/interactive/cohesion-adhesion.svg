<g class="part" data-part="xy" data-name="Xylem vessel" data-info="A continuous hollow tube of dead cells from root to leaf." tabindex="0" role="button" aria-label="Xylem vessel"><rect x="360" y="160" width="60" height="380" fill="#f3f6fa" stroke="#4b5563" stroke-width="4"/><text x="434" y="360" text-anchor="start" font-size="14" font-weight="800" fill="#111827">xylem vessel</text></g>
