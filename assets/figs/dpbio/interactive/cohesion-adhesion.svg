<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" class="vd-svg" role="img" aria-labelledby="co-title co-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="co-play" data-vd-play-label="Play: pull the water up" data-vd-steps="[[0, &quot;The transpiration stream: how water climbs a plant.&quot;], [1, &quot;Water evaporates from the leaves: transpiration.&quot;], [3.5, &quot;This pulls the water column up the xylem.&quot;], [6, &quot;Cohesion: hydrogen bonds hold the water molecules together in a continuous column.&quot;], [9, &quot;Adhesion: water molecules also stick to the xylem wall.&quot;], [11.5, &quot;Water enters from the soil through root hairs to replace what is lost.&quot;]]" data-vd-dur="15">
<title id="co-title">Cohesion and adhesion in the xylem</title><desc id="co-desc">A plant with water entering the roots, rising in a column up a xylem vessel held together by cohesion and stuck to the wall by adhesion, and evaporating from the leaves in transpiration.</desc>
<style>
