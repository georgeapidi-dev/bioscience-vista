.0000" values="0;0;1;1;0;0" dur="15s" begin="co-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.2000;0.3333;1.0000" values="500 150;500 150;520 80;520 80" dur="15s" begin="co-play.begin+0s" fill="freeze"/><g><circle r="6" fill="#bcdcf5" stroke="#2e6fb5"/></g></g></g><g><animate attributeName="opacity" keyTimes="0.0000;0.0667;0.0867;1.0000" values="0;0;1;1" dur="15s" begin="co-play.begin+0s" fill="freeze"/><path d="M 300 110 L 310 70" stroke="#2e6fb5" stroke-width="3" marker-end="url(#co-2e6fb5)"/><path d="M 360 110 L 370 70" stroke="#2e6fb5" stroke-width="3" marker-end="url(#co-2e6fb5)"/><path d="M 420 110 L 430 70" stroke="#2e6fb5" stroke-width="3" marker-end="url(#co-2e6fb5)"/><text x="520" y="84" text-anchor="start" font-size="14" font-weight="800" fill="#2e6fb5">water vapour lost — TRANSPIRATION</text></g></g>
<g class="part" data-part="root" data-name="Water enters at the roots" data-info="Absorbed by root hair cells from the soil." tabindex="0" role="button" aria-label="Water enters at the roots"><path d="M 360 540 L 300 590 M 420 540 L 480 590 M 375 540 L 360 600" stroke="#4b5563" stroke-width="3" fill="none"/><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.7667;0.7800;0.8800;0.8933;1.0000" values="0;0;1;1;0;0" dur="15s" begin="co-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.7667;0.8667;1.0000" values="200 580;200 580;380 550;380 550" dur="15s" begin="co-play.begin+0s" fill="freeze"/><circle r="7" fill="#bcdcf5" stroke="#2e6fb5"/></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.7933;0.8067;0.9067;0.9200;1.0000" values="0;0;1;1;0;0" dur="15s" begin="co-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.7933;0.8933;1.0000" values="220 580;220 580;380 550;380 550" dur="15s" begin="co-play.begin+0s" fill="freeze"/><circle r="7" fill="#bcdcf5" stroke="#2e6fb5"/></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.8200;0.8333;0.9333;0.9467;1.0000" values="0;0;1;1;0;0" dur="15s" begin="co-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.8200;0.9200;1.0000" values="240 580;240 580;380 550;380 550" dur="15s" begin="co-play.begin+0s" fill="freeze"/><circle r="7" fill="#bcdcf5" stroke="#2e6fb5"/></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.8467;0.8600;0.9600;0.9733;1.0000" values="0;0;1;1;0;0" dur="15s" begin="co-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.8467;0.9467;1.0000" values="260 580;260 580;380 550;380 550" dur="15s" begin="co-play.begin+0s" fill="freeze"/><circle r="7" fill="#bcdcf5" stroke="#2e6fb5"/></g></g><line x1="300" y1="575" x2="150" y2="560" stroke="#475569" stroke-width="1.5"/><circle cx="300" cy="575" r="3" fill="#475569"/><text x="144" y="552" text-anchor="end" font-size="13" font-weight="700" fill="#111827">water enters</text><text x="144" y="570" text-anchor="end" font-size="13" font-weight="700" fill="#111827">through root hairs</text></g>
<g><animate attributeName="opacity" keyTimes="0.0000;0.7667;0.7867;1.0000" values="0;0;1;1" dur="15s" begin="co-play.begin+0s" fill="freeze"/><rect x="700" y="380" width="380" height="170" rx="14" fill="#f5f8fc" stroke="#cbd5e1"/><text x="890" y="408" text-anchor="middle" font-size="15" font-weight="800" fill="#1f3b5c">Why it works</text><text x="890" y="436" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">pull at the top (transpiration)</text><text x="890" y="460" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">+ cohesion: an unbroken chain</text><text x="890" y="484" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">+ adhesion: grip on the wall</text><text x="890" y="516" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">= water rises tens of metres</text></g>
