<g class="part" data-part="coh" data-name="Cohesion" data-info="Hydrogen bonds between water molecules hold the column together, so it can be pulled up without breaking." tabindex="0" role="button" aria-label="Cohesion"><g><animate attributeName="opacity" keyTimes="0.0000;0.4000;0.4200;1.0000" values="0;0;1;1" dur="15s" begin="co-play.begin+0s" fill="freeze"/><line x1="402.0" y1="514" x2="402.0" y2="494" stroke="#2e6fb5" stroke-width="3" stroke-dasharray="3 3"/><line x1="402.0" y1="474" x2="402.0" y2="454" stroke="#2e6fb5" stroke-width="3" stroke-dasharray="3 3"/><line x1="402.0" y1="434" x2="402.0" y2="414" stroke="#2e6fb5" stroke-width="3" stroke-dasharray="3 3"/><line x1="402.0" y1="394" x2="402.0" y2="374" stroke="#2e6fb5" stroke-width="3" stroke-dasharray="3 3"/><line x1="402.0" y1="354" x2="402.0" y2="334" stroke="#2e6fb5" stroke-width="3" stroke-dasharray="3 3"/><line x1="402.0" y1="314" x2="402.0" y2="294" stroke="#2e6fb5" stroke-width="3" stroke-dasharray="3 3"/><line x1="402.0" y1="274" x2="402.0" y2="254" stroke="#2e6fb5" stroke-width="3" stroke-dasharray="3 3"/><line x1="402.0" y1="234" x2="402.0" y2="214" stroke="#2e6fb5" stroke-width="3" stroke-dasharray="3 3"/><line x1="402.0" y1="194" x2="402.0" y2="174" stroke="#2e6fb5" stroke-width="3" stroke-dasharray="3 3"/><line x1="412" y1="320" x2="620" y2="280" stroke="#475569" stroke-width="1.5"/><circle cx="412" cy="320" r="3" fill="#475569"/><text x="626" y="270" text-anchor="start" font-size="14" font-weight="800" fill="#2e6fb5">COHESION — hydrogen bonds</text><text x="626" y="290" text-anchor="start" font-size="13" font-weight="700" fill="#2e6fb5">hold the column together</text></g></g>
<g class="part" data-part="adh" data-name="Adhesion" data-info="Water molecules form hydrogen bonds with the hydrophilic cellulose of the xylem wall, helping the water to climb and resist gravity." tabindex="0" role="button" aria-label="Adhesion"><g><animate attributeName="opacity" keyTimes="0.0000;0.6000;0.6200;1.0000" values="0;0;1;1" dur="15s" begin="co-play.begin+0s" fill="freeze"/><line x1="362" y1="510" x2="374" y2="510" stroke="#7b3fa0" stroke-width="3" stroke-dasharray="3 3"/><line x1="362" y1="470" x2="374" y2="470" stroke="#7b3fa0" stroke-width="3" stroke-dasharray="3 3"/><line x1="362" y1="430" x2="374" y2="430" stroke="#7b3fa0" stroke-width="3" stroke-dasharray="3 3"/><line x1="362" y1="390" x2="374" y2="390" stroke="#7b3fa0" stroke-width="3" stroke-dasharray="3 3"/><line x1="362" y1="350" x2="374" y2="350" stroke="#7b3fa0" stroke-width="3" stroke-dasharray="3 3"/><line x1="362" y1="310" x2="374" y2="310" stroke="#7b3fa0" stroke-width="3" stroke-dasharray="3 3"/><line x1="362" y1="270" x2="374" y2="270" stroke="#7b3fa0" stroke-width="3" stroke-dasharray="3 3"/><line x1="362" y1="230" x2="374" y2="230" stroke="#7b3fa0" stroke-width="3" stroke-dasharray="3 3"/><line x1="362" y1="190" x2="374" y2="190" stroke="#7b3fa0" stroke-width="3" stroke-dasharray="3 3"/><line x1="364" y1="420" x2="300" y2="440" stroke="#475569" stroke-width="1.5"/><circle cx="364" cy="420" r="3" fill="#475569"/><text x="294" y="436" text-anchor="end" font-size="14" font-weight="800" fill="#7b3fa0">ADHESION — water sticks</text><text x="294" y="456" text-anchor="end" font-size="13" font-weight="700" fill="#7b3fa0">to the xylem wall</text></g></g>
<g class="part" data-part="pull" data-name="Tension pulls water up" data-info="Loss of water at the top pulls the water column up the xylem." tabindex="0" role="button" aria-label="Tension pulls water up"><g><animate attributeName="opacity" keyTimes="0.0000;0.2333;0.2533;1.0000" values="0;0;1;1" dur="15s" begin="co-play.begin+0s" fill="freeze"/><path d="M 320 500 L 320 240" stroke="#c0392b" stroke-width="4" marker-end="url(#co-c0392b)"/><text x="306" y="380" font-size="14" font-weight="800" fill="#c0392b" text-anchor="middle" transform="rotate(-90 306 380)">water is PULLED up</text></g></g>
