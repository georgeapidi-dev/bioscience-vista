<text class="head" x="30" y="34">The transpiration stream: cohesion and adhesion</text><text class="note" x="30" y="56">After EduVista A1.1 task sheet. Xylem greatly widened.</text>
<rect x="120" y="520" width="520" height="80" fill="#e8dcc8" stroke="#bfa77a"/><text x="610" y="590" text-anchor="end" font-size="12" font-weight="700" fill="#8a7650">soil</text>
