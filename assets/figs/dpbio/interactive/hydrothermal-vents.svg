="freeze"/><circle r="14" fill="#1c1917" opacity=".85"/></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.1857;0.2000;1.0000" values="0;0;1;1" dur="14s" begin="hv-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.1857;0.3286;1.0000" values="420 320;420 320;382 120;382 120" dur="14s" begin="hv-play.begin+0s" fill="freeze"/><circle r="18" fill="#1c1917" opacity=".85"/></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.2143;0.2286;1.0000" values="0;0;1;1" dur="14s" begin="hv-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.2143;0.3571;1.0000" values="420 320;420 320;390 120;390 120" dur="14s" begin="hv-play.begin+0s" fill="freeze"/><circle r="22" fill="#1c1917" opacity=".85"/></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.2429;0.2571;1.0000" values="0;0;1;1" dur="14s" begin="hv-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.2429;0.3857;1.0000" values="420 320;420 320;398 120;398 120" dur="14s" begin="hv-play.begin+0s" fill="freeze"/><circle r="14" fill="#1c1917" opacity=".85"/></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.2714;0.2857;1.0000" values="0;0;1;1" dur="14s" begin="hv-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.2714;0.4143;1.0000" values="420 320;420 320;406 120;406 120" dur="14s" begin="hv-play.begin+0s" fill="freeze"/><circle r="18" fill="#1c1917" opacity=".85"/></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.3000;0.3143;1.0000" values="0;0;1;1" dur="14s" begin="hv-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.3000;0.4429;1.0000" values="420 320;420 320;414 120;414 120" dur="14s" begin="hv-play.begin+0s" fill="freeze"/><circle r="22" fill="#1c1917" opacity=".85"/></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.3286;0.3429;1.0000" values="0;0;1;1" dur="14s" begin="hv-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.3286;0.4714;1.0000" values="420 320;420 320;422 120;422 120" dur="14s" begin="hv-play.begin+0s" fill="freeze"/><circle r="14" fill="#1c1917" opacity=".85"/></g></g><text x="420" y="560" text-anchor="middle" font-size="13" font-weight="800" fill="#e7e5e4">black smoker</text></g>
<g class="part" data-part="grad" data-name="Gradients and minerals" data-info="Steep gradients of temperature and pH, and iron–sulfur minerals that can act as catalysts: a possible place for the first carbon compounds and cells." tabindex="0" role="button" aria-label="Gradients and minerals"><g><animate attributeName="opacity" keyTimes="0.0000;0.3214;0.3429;1.0000" values="0;0;1;1" dur="14s" begin="hv-play.begin+0s" fill="freeze"/><rect x="60" y="120" width="26" height="300" fill="url(#hvgrad)"/><defs><linearGradient id="hvgrad" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#ef4444"/><stop offset="1" stop-color="#3b82f6"/></linearGradient></defs><text x="100" y="140" text-anchor="start" font-size="12" font-weight="800" fill="#93c5fd">2 °C</text><text x="100" y="420" text-anchor="start" font-size="12" font-weight="800" fill="#fca5a5">up to ~400 °C at the vent</text><text x="100" y="280" text-anchor="start" font-size="12" font-weight="700" fill="#e2e8f0">steep temperature</text><text x="100" y="296" text-anchor="start" font-size="12" font-weight="700" fill="#e2e8f0">and pH gradients</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.3929;0.4143;1.0000" values="0;0;1;1" dur="14s" begin="hv-play.begin+0s" fill="freeze"/><polygon points="470,470 480,462 490,470 480,478" fill="#a3a3a3" stroke="#facc15"/><polygon points="490,490 500,482 510,490 500,498" fill="#a3a3a3" stroke="#facc15"/><polygon points="450,495 460,487 470,495 460,503" fill="#a3a3a3" stroke="#facc15"/><text x="620" y="470" text-anchor="start" font-size="12" font-weight="800" fill="#fde68a">iron–sulfur minerals: catalysts?</text></g></g>
