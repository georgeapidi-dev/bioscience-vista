<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 580" class="vd-svg" role="img" aria-labelledby="hv-title hv-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="hv-play" data-vd-play-label="Play: dive down" data-vd-steps="[[0, &quot;Deep-sea hydrothermal vents.&quot;], [1, &quot;Hot, mineral-rich water gushes out: black smokers.&quot;], [4.5, &quot;Steep gradients and iron\u2013sulfur minerals: a possible cradle of life.&quot;], [8, &quot;Chemoautotrophic bacteria use chemical energy, not light.&quot;], [11, &quot;They support whole communities in the dark.&quot;]]" data-vd-dur="14">
<title id="hv-title">Hydrothermal vents</title><desc id="hv-desc">A black smoker vent releasing hot mineral-rich water on the dark ocean floor, with temperature and pH gradients, iron sulfur minerals, chemoautotrophic bacteria oxidising hydrogen sulfide, and tube worms and clams.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="580" fill="#ffffff"/>
<g aria-hidden="true"><animate id="hv-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<rect x="0" y="70" width="1100" height="510" fill="#0f172a"/><text class="head" x="30" y="34">Deep-sea hydrothermal vents</text><text class="note" x="30" y="56">About 2–3 km deep: no sunlight.</text>
