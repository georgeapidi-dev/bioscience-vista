<g class="part" data-part="end" data-name="Near term" data-info="Progesterone falls; oestradiol rises, increasing oxytocin receptors in the uterus." tabindex="0" role="button" aria-label="Near term"><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.4000;0.4200;1.0000" values="0;0;1;1" dur="15s" begin="br-play.begin+0s" fill="freeze"/><rect x="120.0" y="358" width="380" height="24" rx="12" fill="#fce7f3" stroke="#1f2937" stroke-width="1"/><text x="310" y="375" text-anchor="middle" font-size="12" font-weight="700">near term: more oxytocin receptors in the uterus</text></g></g>
<g class="part" data-part="pf" data-name="Positive feedback" data-info="The foetus pushes on the cervix → oxytocin from the pituitary → contractions → more stretching → more oxytocin: stronger, more frequent contractions until birth." tabindex="0" role="button" aria-label="Positive feedback"><circle cx="820" cy="300" r="150" fill="none" stroke="#fecaca" stroke-width="16"/><g><animate attributeName="opacity" keyTimes="0.0000;0.5667;0.5867;1.0000" values="0;0;1;1" dur="15s" begin="br-play.begin+0s" fill="freeze"/><rect x="720" y="126" width="200" height="48" rx="14" fill="#fff" stroke="#dc2626" stroke-width="2"/><text x="820" y="155" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">foetus presses on cervix</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.6200;0.6400;1.0000" values="0;0;1;1" dur="15s" begin="br-play.begin+0s" fill="freeze"/><rect x="870" y="276" width="200" height="48" rx="14" fill="#fff" stroke="#dc2626" stroke-width="2"/><text x="970" y="305" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">pituitary releases oxytocin</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.6733;0.6933;1.0000" values="0;0;1;1" dur="15s" begin="br-play.begin+0s" fill="freeze"/><rect x="720" y="426" width="200" height="48" rx="14" fill="#fff" stroke="#dc2626" stroke-width="2"/><text x="820" y="455" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">uterus contracts</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.7267;0.7467;1.0000" values="0;0;1;1" dur="15s" begin="br-play.begin+0s" fill="freeze"/><rect x="570" y="276" width="200" height="48" rx="14" fill="#fff" stroke="#dc2626" stroke-width="2"/><text x="670" y="305" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">more stretching</text></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.7667;0.7800;0.9867;1.0000;1.0000" values="0;0;1;1;0;0" dur="15s" begin="br-play.begin+0s" fill="