<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" class="vd-svg" role="img" aria-labelledby="br-title br-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="br-play" data-vd-play-label="Play: labour" data-vd-steps="[[0, &quot;Hormones of pregnancy and birth.&quot;], [1, &quot;Progesterone keeps the uterus quiet: from the corpus luteum, then the placenta.&quot;], [5, &quot;Near term: progesterone falls, oestradiol rises.&quot;], [8.5, &quot;Birth: oxytocin and stretching drive each other: positive feedback.&quot;]]" data-vd-dur="15">
<title id="br-title">Pregnancy and birth</title><desc id="br-desc">Progesterone from the corpus luteum then the placenta keeps the uterus relaxed; near term progesterone falls and oestradiol rises; at birth, stretching of the cervix releases oxytocin which causes contractions that cause more stretching, a positive feedback loop.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
