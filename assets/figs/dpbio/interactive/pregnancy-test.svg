<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" class="vd-svg" role="img" aria-labelledby="pt2-title pt2-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="pt2-play" data-vd-play-label="Play: run the test" data-vd-steps="[[0, &quot;How a pregnancy test works.&quot;], [1, &quot;Urine containing hCG soaks into the strip.&quot;], [3.5, &quot;Coloured anti-hCG antibodies bind the hCG and flow along.&quot;], [7, &quot;At the test line, fixed antibodies trap the complexes: a coloured line.&quot;], [10, &quot;The control line catches spare antibodies: the test worked.&quot;]]" data-vd-dur="14">
<title id="pt2-title">Pregnancy test</title><desc id="pt2-desc">A pregnancy test strip: hCG in urine binds coloured monoclonal antibodies, the complexes move along the strip and are trapped by fixed anti-hCG antibodies at the test line, and spare coloured antibodies are trapped at the control line.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="520" fill="#ffffff"/>
<g aria-hidden="true"><animate id="pt2-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<text class="head" x="30" y="34">Pregnancy tests: monoclonal antibodies against hCG</text><text class="note" x="30" y="56">Schematic strip.</text>
<rect x="60" y="200" width="980" height="90" rx="14" fill="#f8fafc" stroke="#334155" stroke-width="2"/><text x="120" y="320" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">urine applied</text><text x="640" y="320" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">test line</text><text x="880" y="320" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">control line</text>
<g class="part" data-part="hcg" data-name="hCG" data-info="The embryo, then the placenta, secretes human chorionic gonadotropin (hCG), which appears in urine. hCG keeps the corpus luteum alive so progesterone continues." tabindex="0" role="button" aria-label="hCG"><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.0714;0.0857;0.2571;0.2714;1.0000" values="0;0;1;1;0;0" dur="14s" begin="pt2-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.0714;0.2143;1.0000" values="90 150;90 150;140 240;140 240" dur="14s" begin="pt2-play.begin+0s" fill="freeze"/><g><polygon points="0,-9 9,6 -9,6" fill="#f59e0b" stroke="#92400e"/></g></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.0929;0.1071;0.2786;0.2929;1.0000" values="0;0;1;1;0;0" dur="14s" begin="pt2-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.0929;0.2357;1.0000" values="100 150;100 150;160 240;160 240" dur="14s" begin="pt2-play.begin+0s" fill="freeze"/><g><polygon points="0,-9 9,6 -9,6" fill="#f59e0b" stroke="#92400e"/></g></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.1143;0.1286;0.3000;0.3143;1.0000" values="0;0;1;1;0;0" dur="14s" begin="pt2-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.1143;0.2571;1.0000" values="110 150;110 150;180 240;180 240" dur="14s" begin="pt2-play.begin+0s" fill="freeze"/><g><polygon points="0,-9 9,6 -9,6" fill="#f59e0b" stroke="#92400e"/></g></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.1357;0.1500;0.3214;0.3357;1.0000" values="0;0;1;1;0;0" dur="14s" begin="pt2-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.1357;0.2786;1.0000" values="120 150;120 150;200 240;200 240" dur="14s" begin="pt2-play.begin+0s" fill="freeze"/><g><polygon points="0,-9 9,6 -9,6" fill="#f59e0b" stroke="#92400e"/></g></g></g><text x="110" y="140" text-anchor="middle" font-size="13" font-weight="800" fill="#92400e">hCG</text></g>
<g class="part" data-part="mob" data-name="Coloured antibodies" data-info="Monoclonal antibodies against hCG, linked to coloured particles, bind any hCG in the urine and move along the strip." tabindex="0" role="button" aria-label="Coloured antibodies"><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.2500;0.2643;1.0000" values="0;0;1;1" dur="14s" begin="pt2-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.2500;0.5000;1.0000" values="300 250;300 250;640 250;640 250" dur="14s" begin="pt2-play.begin+0s" fill="freeze"/><g><g><path d="M 0 0 L 0 -12 M 0 -12 L -8 -20 M 0 -12 L 8 -20" stroke="#7c3aed" stroke-width="3" fill="none"/><circle cy="4" r="5" fill="#db2777"/></g><g transform="translate(0 -26)"><g><polygon points="0,-9 9,6 -9,6" fill="#f59e0b" stroke="#92400e"/></g></g></g></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.2643;0.2786;1.0000" values="0;0;1;1" dur="14s" begin="pt2-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.2643;0.5143;1.0000" values="318 250;318 250;640 250;640 250" dur="14s" begin="pt2-play.begin+0s" fill="freeze"/><g><g><path d="M 0 0 L 0 -12 M 0 -12 L -8 -20 M 0 -12 L 8 -20" stroke="#7c3aed" stroke-width="3" fill="none"/><circle cy="4" r="5" fill="#db2777"/></g><g transform="translate(0 -26)"><g><polygon points="0,-9 9,6 -9,6" fill="#f59e0b" stroke="#92400e"/></g></g></g></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.2786;0.2929;1.0000" values="0;0;1;1" dur="14s" begin="pt2-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.2786;0.5286;1.0000" values="336 250;336 250;640 250;640 250" dur="14s" begin="pt2-play.begin+0s" fill="freeze"/><g><g><path d="M 0 0 L 0 -12 M 0 -12 L -8 -20 M 0 -12 L 8 -20" stroke="#7c3aed" stroke-width="3" fill="none"/><circle cy="4" r="5" fill="#db2777"/></g><g transform="translate(0 -26)"><g><polygon points="0,-9 9,6 -9,6" fill="#f59e0b" stroke="#92400e"/></g></g></g></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.2929;0.3071;1.0000" values="0;0;1;1" dur="14s" begin="pt2-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.2929;0.5429;1.0000" values="354 250;354 250;640 250;640 250" dur="14s" begin="pt2-play.begin+0s" fill="freeze"/><g><g><path d="M 0 0 L 0 -12 M 0 -12 L -8 -20 M 0 -12 L 8 -20" stroke="#7c3aed" stroke-width="3" fill="none"/><circle cy="4" r="5" fill="#db2777"/></g><g transform="translate(0 -26)"><g><polygon points="0,-9 9,6 -9,6" fill="#f59e0b" stroke="#92400e"/></g></g></g></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.2500;0.2643;1.0000" values="0;0;1;1" dur="14s" begin="pt2-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.2500;0.7143;1.0000" values="300 262;300 262;880 262;880 262" dur="14s" begin="pt2-play.begin+0s" fill="freeze"/><g><path d="M 0 0 L 0 -12 M 0 -12 L -8 -20 M 0 -12 L 8 -20" stroke="#7c3aed" stroke-width="3" fill="none"/><circle cy="4" r="5" fill="#db2777"/></g></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.2643;0.2786;1.0000" values="0;0;1;1" dur="14s" begin="pt2-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.2643;0.7286;1.0000" values="318 262;318 262;880 262;880 262" dur="14s" begin="pt2-play.begin+0s" fill="freeze"/><g><path d="M 0 0 L 0 -12 M 0 -12 L -8 -20 M 0 -12 L 8 -20" stroke="#7c3aed" stroke-width="3" fill="none"/><circle cy="4" r="5" fill="#db2777"/></g></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.2786;0.2929;1.0000" values="0;0;1;1" dur="14s" begin="pt2-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.2786;0.7429;1.0000" values="336 262;336 262;880 262;880 262" dur="14s" begin="pt2-play.begin+0s" fill="freeze"/><g><path d="M 0 0 L 0 -12 M 0 -12 L -8 -20 M 0 -12 L 8 -20" stroke="#7c3aed" stroke-width="3" fill="none"/><circle cy="4" r="5" fill="#db2777"/></g></g></g><text x="330" y="190" text-anchor="middle" font-size="12" font-weight="800" fill="#7c3aed">coloured antibodies</text></g>
<g class="part" data-part="test" data-name="Test line" data-info="Immobilised anti-hCG antibodies trap the hCG–antibody complexes: a coloured line = pregnant." tabindex="0" role="button" aria-label="Test line"><rect x="630" y="200" width="20" height="90" fill="#db2777" opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.5000;0.5714;1.0000" values="0;0;0.85;0.85" dur="14s" begin="pt2-play.begin+0s" fill="freeze"/></rect><g><animate attributeName="opacity" keyTimes="0.0000;0.5714;0.5929;1.0000" values="0;0;1;1" dur="14s" begin="pt2-play.begin+0s" fill="freeze"/><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.5714;0.5929;1.0000" values="0;0;1;1" dur="14s" begin="pt2-play.begin+0s" fill="freeze"/><rect x="510.0" y="388" width="260" height="24" rx="12" fill="#fce7f3" stroke="#1f2937" stroke-width="1"/><text x="640" y="405" text-anchor="middle" font-size="12" font-weight="700">line = hCG present = pregnant</text></g></g></g>
<g class="part" data-part="ctrl" data-name="Control line" data-info="Traps unbound coloured antibodies: confirms the test worked." tabindex="0" role="button" aria-label="Control line"><rect x="870" y="200" width="20" height="90" fill="#db2777" opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.7143;0.7857;1.0000" values="0;0;0.85;0.85" dur="14s" begin="pt2-play.begin+0s" fill="freeze"/></rect><g><animate attributeName="opacity" keyTimes="0.0000;0.7857;0.8071;1.0000" values="0;0;1;1" dur="14s" begin="pt2-play.begin+0s" fill="freeze"/><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.7857;0.8071;1.0000" values="0;0;1;1" dur="14s" begin="pt2-play.begin+0s" fill="freeze"/><rect x="770.0" y="428" width="220" height="24" rx="12" fill="#f1f5f9" stroke="#1f2937" stroke-width="1"/><text x="880" y="445" text-anchor="middle" font-size="12" font-weight="700">control: the test worked</text></g></g></g>
</svg>