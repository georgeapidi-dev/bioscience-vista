<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 460" class="vd-svg" role="img" aria-labelledby="hz-title hz-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="hz-play" data-vd-play-label="Play: move out from the star" data-vd-steps="[[0, &quot;The habitable zone of a star.&quot;], [1, &quot;Close to the star it is too hot: water boils away, as on Venus.&quot;], [4, &quot;Further out is the habitable zone, where liquid water is possible: Earth.&quot;], [7, &quot;Further still it is too cold: water stays frozen, as on Mars.&quot;], [10, &quot;Distance from the star increases, temperature falls.&quot;]]" data-vd-dur="13">
<title id="hz-title">The habitable zone</title><desc id="hz-desc">The habitable zone of a star, with a too-hot zone near the star (Venus), the habitable zone where liquid water is possible (Earth) and a too-cold zone further out (Mars).</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="460" fill="#ffffff"/>
<g aria-hidden="true"><animate id="hz-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<defs><marker id="hz-475569" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="6.3" refY="7.0" orient="auto"><path d="M0,0 L14,7.0 L0,14 z" fill="#475569"/></marker></defs>
<text class="head" x="30" y="34">The habitable zone</text><text class="note" x="30" y="56">After EduVista A1.1 task sheet. Distances not to scale.</text>
<g class="part" data-part="star" data-name="The star" data-info="The Sun, for our solar system. A hotter star has its habitable zone further out; a cooler one, closer in." tabindex="0" role="button" aria-label="The star"><circle cx="130" cy="250" r="62" fill="#f5c542" stroke="#d4a017" stroke-width="3"><animate attributeName="r" values="62;66;62" dur="2s" repeatCount="indefinite"/></circle><line x1="202" y1="250" x2="220" y2="250" stroke="#e0a800" stroke-width="3"/><line x1="192" y1="286" x2="208" y2="295" stroke="#e0a800" stroke-width="3"/><line x1="166" y1="312" x2="175" y2="328" stroke="#e0a800" stroke-width="3"/><line x1="130" y1="322" x2="130" y2="340" stroke="#e0a800" stroke-width="3"/><line x1="94" y1="312" x2="85" y2="328" stroke="#e0a800" stroke-width="3"/><line x1="68" y1="286" x2="52" y2="295" stroke="#e0a800" stroke-width="3"/><line x1="58" y1="250" x2="40" y2="250" stroke="#e0a800" stroke-width="3"/><line x1="68" y1="214" x2="52" y2="205" stroke="#e0a800" stroke-width="3"/><line x1="94" y1="188" x2="85" y2="172" stroke="#e0a800" stroke-width="3"/><line x1="130" y1="178" x2="130" y2="160" stroke="#e0a800" stroke-width="3"/><line x1="166" y1="188" x2="175" y2="172" stroke="#e0a800" stroke-width="3"/><line x1="192" y1="214" x2="208" y2="205" stroke="#e0a800" stroke-width="3"/><text x="130" y="360" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">the star</text></g>
<g class="part" data-part="hot" data-name="Too hot" data-info="Too close to the star: water boils away (e.g. Venus)." tabindex="0" role="button" aria-label="Too hot"><g><animate attributeName="opacity" keyTimes="0.0000;0.0769;0.1000;1.0000" values="0;0;1;1" dur="13s" begin="hz-play.begin+0s" fill="freeze"/><rect x="240" y="250" width="210" height="50" fill="#e8a594"/><text x="345.0" y="336" text-anchor="middle" font-size="16" font-weight="800" fill="#111827">TOO HOT</text><text x="345.0" y="358" text-anchor="middle" font-size="14" font-weight="600" fill="#475569">water boils away</text></g></g>
<g class="part" data-part="hz" data-name="Habitable zone" data-info="The range of distances where a planet&#x27;s surface temperature allows liquid water. Earth is in it." tabindex="0" role="button" aria-label="Habitable zone"><g><animate attributeName="opacity" keyTimes="0.0000;0.3077;0.3308;1.0000" values="0;0;1;1" dur="13s" begin="hz-play.begin+0s" fill="freeze"/><rect x="450" y="250" width="270" height="50" fill="#a8d5a0"/><text x="585.0" y="336" text-anchor="middle" font-size="16" font-weight="800" fill="#111827">HABITABLE ZONE</text><text x="585.0" y="358" text-anchor="middle" font-size="14" font-weight="600" fill="#475569">liquid water possible</text></g></g>
<g class="part" data-part="cold" data-name="Too cold" data-info="Too far from the star: water stays frozen (e.g. Mars today, at the outer edge)." tabindex="0" role="button" aria-label="Too cold"><g><animate attributeName="opacity" keyTimes="0.0000;0.5385;0.5615;1.0000" values="0;0;1;1" dur="13s" begin="hz-play.begin+0s" fill="freeze"/><rect x="720" y="250" width="330" height="50" fill="#a9c8e6"/><text x="885.0" y="336" text-anchor="middle" font-size="16" font-weight="800" fill="#111827">TOO COLD</text><text x="885.0" y="358" text-anchor="middle" font-size="14" font-weight="600" fill="#475569">water stays frozen</text></g></g>
<g class="part" data-part="pl" data-name="Planets" data-info="Venus, Earth and Mars, for comparison." tabindex="0" role="button" aria-label="Planets"><g><animate attributeName="opacity" keyTimes="0.0000;0.1154;0.1385;1.0000" values="0;0;1;1" dur="13s" begin="hz-play.begin+0s" fill="freeze"/><line x1="345" y1="250" x2="345" y2="200" stroke="#6b7280" stroke-width="2"/><circle cx="345" cy="185" r="20" fill="#d9956b" stroke="#374151" stroke-width="2"/><text x="345" y="150" text-anchor="middle" font-size="15" font-weight="800" fill="#111827">Venus</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.3462;0.3692;1.0000" values="0;0;1;1" dur="13s" begin="hz-play.begin+0s" fill="freeze"/><line x1="580" y1="250" x2="580" y2="200" stroke="#6b7280" stroke-width="2"/><circle cx="580" cy="185" r="20" fill="#3f7fc4" stroke="#374151" stroke-width="2"/><text x="580" y="150" text-anchor="middle" font-size="15" font-weight="800" fill="#111827">Earth</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.5769;0.6000;1.0000" values="0;0;1;1" dur="13s" begin="hz-play.begin+0s" fill="freeze"/><line x1="735" y1="250" x2="735" y2="200" stroke="#6b7280" stroke-width="2"/><circle cx="735" cy="185" r="20" fill="#c0563a" stroke="#374151" stroke-width="2"/><text x="735" y="150" text-anchor="middle" font-size="15" font-weight="800" fill="#111827">Mars</text></g></g>
<g><animate attributeName="opacity" keyTimes="0.0000;0.7692;0.7923;1.0000" values="0;0;1;1" dur="13s" begin="hz-play.begin+0s" fill="freeze"/><path d="M 240 410 L 1050 410" stroke="#475569" stroke-width="3" marker-end="url(#hz-475569)"/><text x="640" y="400" text-anchor="middle" font-size="14" font-weight="600" fill="#475569">distance from the star increases → temperature falls</text></g>
</svg>