<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 540" class="vd-svg" role="img" aria-labelledby="as-title as-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="as-play" data-vd-play-label="Play: reproduce" data-vd-steps="[[0, &quot;Two reproductive strategies.&quot;], [1, &quot;Asexual: one parent, identical clones.&quot;], [5, &quot;Sexual: two parents, gametes fuse: varied offspring.&quot;], [10, &quot;Asexual species never interbreed: the biological species concept breaks down.&quot;]]" data-vd-dur="14">
<title id="as-title">Asexual and sexual reproduction</title><desc id="as-desc">One parent producing identical clones by asexual reproduction compared with two parents whose gametes fuse to produce genetically varied offspring; asexual organisms cannot be defined by the biological species concept.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="540" fill="#ffffff"/>
<g aria-hidden="true"><animate id="as-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<defs><marker id="as-475569" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="6.3" refY="7.0" orient="auto"><path d="M0,0 L14,7.0 L0,14 z" fill="#475569"/></marker></defs>
<text class="head" x="30" y="34">Asexual versus sexual reproduction</text><text class="note" x="30" y="56">Colours represent genotypes.</text>
<g class="part" data-part="asex" data-name="Asexual reproduction" data-info="One parent; offspring genetically identical (clones). Fast, no mate needed; offspring as well adapted as the parent to an unchanging environment." tabindex="0" role="button" aria-label="Asexual reproduction"><rect x="30" y="80" width="510" height="380" rx="16" fill="#f0f9ff" stroke="#bae6fd"/><text x="285" y="106" text-anchor="middle" font-size="15" font-weight="800" fill="#0369a1">ASEXUAL: one parent</text><circle cx="285" cy="170" r="36" fill="#60a5fa" stroke="#1e3a8a" stroke-width="2"/><g><animate attributeName="opacity" keyTimes="0.0000;0.0714;0.0929;1.0000" values="0;0;1;1" dur="14s" begin="as-play.begin+0s" fill="freeze"/><path d="M 285 208 L 120 290" stroke="#475569" stroke-width="2" marker-end="url(#as-475569)"/><circle cx="120" cy="330" r="30" fill="#60a5fa" stroke="#1e3a8a" stroke-width="2"/></g><g><animate attributeName="opacity" keyTimes="0.0000;0.1143;0.1357;1.0000" values="0;0;1;1" dur="14s" begin="as-play.begin+0s" fill="freeze"/><path d="M 285 208 L 230 290" stroke="#475569" stroke-width="2" marker-end="url(#as-475569)"/><circle cx="230" cy="330" r="30" fill="#60a5fa" stroke="#1e3a8a" stroke-width="2"/></g><g><animate attributeName="opacity" keyTimes="0.0000;0.1571;0.1786;1.0000" values="0;0;1;1" dur="14s" begin="as-play.begin+0s" fill="freeze"/><path d="M 285 208 L 340 290" stroke="#475569" stroke-width="2" marker-end="url(#as-475569)"/><circle cx="340" cy="330" r="30" fill="#60a5fa" stroke="#1e3a8a" stroke-width="2"/></g><g><animate attributeName="opacity" keyTimes="0.0000;0.2000;0.2214;1.0000" values="0;0;1;1" dur="14s" begin="as-play.begin+0s" fill="freeze"/><path d="M 285 208 L 450 290" stroke="#475569" stroke-width="2" marker-end="url(#as-475569)"/><circle cx="450" cy="330" r="30" fill="#60a5fa" stroke="#1e3a8a" stroke-width="2"/></g><g><animate attributeName="opacity" keyTimes="0.0000;0.2500;0.2714;1.0000" values="0;0;1;1" dur="14s" begin="as-play.begin+0s" fill="freeze"/><text x="285" y="400" text-anchor="middle" font-size="13" font-weight="800" fill="#0369a1">identical clones</text><text x="285" y="420" text-anchor="middle" font-size="12" font-weight="700" fill="#475569">fast · no mate needed</text></g></g>
<g class="part" data-part="sex" data-name="Sexual reproduction" data-info="Two parents; gametes fuse; offspring genetically varied, so some may suit a changed environment (new diseases, climate change)." tabindex="0" role="button" aria-label="Sexual reproduction"><rect x="560" y="80" width="510" height="380" rx="16" fill="#fdf2f8" stroke="#fbcfe8"/><text x="815" y="106" text-anchor="middle" font-size="15" font-weight="800" fill="#9d174d">SEXUAL: two parents</text><circle cx="740" cy="170" r="36" fill="#f472b6" stroke="#9d174d" stroke-width="2"/><circle cx="890" cy="170" r="36" fill="#facc15" stroke="#a16207" stroke-width="2"/><g><animate attributeName="opacity" keyTimes="0.0000;0.3571;0.3786;1.0000" values="0;0;1;1" dur="14s" begin="as-play.begin+0s" fill="freeze"/><circle cx="815" cy="240" r="14" fill="url(#mix)"/><defs><linearGradient id="mix"><stop offset=".5" stop-color="#f472b6"/><stop offset=".5" stop-color="#facc15"/></linearGradient></defs><text x="855" y="244" text-anchor="start" font-size="11" font-weight="800" fill="#475569">gametes fuse</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.4286;0.4500;1.0000" values="0;0;1;1" dur="14s" begin="as-play.begin+0s" fill="freeze"/><circle cx="650" cy="330" r="30" fill="#f472b6" stroke="#334155" stroke-width="2"/><path d="M 650 300 A 30 30 0 0 1 650 360 Z" fill="#facc15"/></g><g><animate attributeName="opacity" keyTimes="0.0000;0.4714;0.4929;1.0000" values="0;0;1;1" dur="14s" begin="as-play.begin+0s" fill="freeze"/><circle cx="760" cy="330" r="30" fill="#fb923c" stroke="#334155" stroke-width="2"/><path d="M 760 300 A 30 30 0 0 1 760 360 Z" fill="#a78bfa"/></g><g><animate attributeName="opacity" keyTimes="0.0000;0.5143;0.5357;1.0000" values="0;0;1;1" dur="14s" begin="as-play.begin+0s" fill="freeze"/><circle cx="870" cy="330" r="30" fill="#f9a8d4" stroke="#334155" stroke-width="2"/><path d="M 870 300 A 30 30 0 0 1 870 360 Z" fill="#fde047"/></g><g><animate attributeName="opacity" keyTimes="0.0000;0.5571;0.5786;1.0000" values="0;0;1;1" dur="14s" begin="as-play.begin+0s" fill="freeze"/><circle cx="980" cy="330" r="30" fill="#c084fc" stroke="#334155" stroke-width="2"/><path d="M 980 300 A 30 30 0 0 1 980 360 Z" fill="#fdba74"/></g><g><animate attributeName="opacity" keyTimes="0.0000;0.5714;0.5929;1.0000" values="0;0;1;1" dur="14s" begin="as-play.begin+0s" fill="freeze"/><text x="815" y="400" text-anchor="middle" font-size="13" font-weight="800" fill="#9d174d">genetically varied offspring</text><text x="815" y="420" text-anchor="middle" font-size="12" font-weight="700" fill="#475569">some may suit a changing environment</text></g></g>
<g class="part" data-part="bsc" data-name="Species concept" data-info="Asexual organisms (bdelloid rotifers, many dandelions, bacteria) never interbreed, so the biological species concept cannot define their species." tabindex="0" role="button" aria-label="Species concept"><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.7143;0.7357;1.0000" values="0;0;1;1" dur="14s" begin="as-play.begin+0s" fill="freeze"/><rect x="190.0" y="488" width="720" height="24" rx="12" fill="#fef3c7" stroke="#1f2937" stroke-width="1"/><text x="550" y="505" text-anchor="middle" font-size="12" font-weight="700">bdelloid rotifers, many dandelions, bacteria: never interbreed → biological species concept fails</text></g></g>
</svg>