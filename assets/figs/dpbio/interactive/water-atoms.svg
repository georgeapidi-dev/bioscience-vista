<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" class="vd-svg" role="img" aria-labelledby="wa-title wa-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="wa-play" data-vd-play-label="Play: electrons in shells" data-vd-steps="[[0, &quot;The atoms in water: oxygen and hydrogen.&quot;], [1, &quot;The nucleus holds protons and neutrons; electrons move in shells around it.&quot;], [3.5, &quot;Oxygen: 2 electrons in the inner shell and 6 in the outer shell, which has room for 8.&quot;], [6.5, &quot;Hydrogen: one proton and one electron; its shell has room for 2.&quot;], [9, &quot;So oxygen needs two more electrons and each hydrogen needs one.&quot;]]" data-vd-dur="12">
<title id="wa-title">Oxygen and hydrogen atoms</title><desc id="wa-desc">An oxygen atom with 8 protons and 8 neutrons in the nucleus, 2 electrons in the inner shell and 6 in the outer shell with room for 8, and a hydrogen atom with one proton and one electron.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="560" fill="#ffffff"/>
<g aria-hidden="true"><animate id="wa-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<text class="head" x="30" y="34">The atoms in water</text><text class="note" x="30" y="56">After EduVista A1.1 task sheet. Not to scale: the nucleus is far smaller.</text>
<g class="part" data-part="nuc" data-name="Nucleus" data-info="Protons (+1 each) and neutrons (no charge). Oxygen-16: 8 protons and 8 neutrons." tabindex="0" role="button" aria-label="Nucleus"><circle cx="450.0" cy="290.0" r="8" fill="#c0392b" stroke="#374151" stroke-width="1"/><circle cx="445.9" cy="293.7" r="8" fill="#7b8794" stroke="#374151" stroke-width="1"/><circle cx="450.7" cy="282.3" r="8" fill="#c0392b" stroke="#374151" stroke-width="1"/><circle cx="455.8" cy="297.6" r="8" fill="#7b8794" stroke="#374151" stroke-width="1"/><circle cx="439.2" cy="288.1" r="8" fill="#c0392b" stroke="#374151" stroke-width="1"/><circle cx="460.4" cy="283.4" r="8" fill="#7b8794" stroke="#374151" stroke-width="1"/><circle cx="446.5" cy="303.0" r="8" fill="#c0392b" stroke="#374151" stroke-width="1"/><circle cx="443.3" cy="277.1" r="8" fill="#7b8794" stroke="#374151" stroke-width="1"/><circle cx="464.6" cy="295.3" r="8" fill="#c0392b" stroke="#374151" stroke-width="1"/><circle cx="434.7" cy="296.3" r="8" fill="#7b8794" stroke="#374151" stroke-width="1"/><circle cx="457.4" cy="274.2" r="8" fill="#c0392b" stroke="#374151" stroke-width="1"/><circle cx="455.5" cy="307.4" r="8" fill="#7b8794" stroke="#374151" stroke-width="1"/><circle cx="433.5" cy="280.4" r="8" fill="#c0392b" stroke="#374151" stroke-width="1"/><circle cx="469.4" cy="285.8" r="8" fill="#7b8794" stroke="#374151" stroke-width="1"/><circle cx="438.2" cy="306.8" r="8" fill="#c0392b" stroke="#374151" stroke-width="1"/><circle cx="447.3" cy="268.9" r="8" fill="#7b8794" stroke="#374151" stroke-width="1"/><line x1="456" y1="278" x2="240" y2="110" stroke="#475569" stroke-width="1.5"/><circle cx="456" cy="278" r="3" fill="#475569"/><text x="230" y="92" text-anchor="end" font-size="13" font-weight="700" fill="#111827">nucleus: 8 protons (+1 each, red)</text><text x="230" y="110" text-anchor="end" font-size="13" font-weight="700" fill="#111827">and 8 neutrons (no charge, grey)</text></g>
<g class="part" data-part="inner" data-name="Inner shell" data-info="Holds up to 2 electrons; full in oxygen." tabindex="0" role="button" aria-label="Inner shell"><circle cx="450" cy="290" r="70" fill="none" stroke="#b0b7c3" stroke-width="2"/><circle cx="450.0" cy="360.0" r="9" fill="#2e6fb5"><animateTransform attributeName="transform" type="rotate" from="0 450 290" to="360 450 290" dur="5s" repeatCount="indefinite"/></circle><circle cx="450.0" cy="220.0" r="9" fill="#2e6fb5"><animateTransform attributeName="transform" type="rotate" from="0 450 290" to="360 450 290" dur="5s" repeatCount="indefinite"/></circle></g>
<g class="part" data-part="outer" data-name="Outer shell of oxygen" data-info="6 electrons, with room for 8: oxygen needs two more electrons." tabindex="0" role="button" aria-label="Outer shell of oxygen"><g><animate attributeName="opacity" keyTimes="0.0000;0.2917;0.3167;1.0000" values="0;0;1;1" dur="12s" begin="wa-play.begin+0s" fill="freeze"/><circle cx="450" cy="290" r="140" fill="none" stroke="#b0b7c3" stroke-width="2"/><circle cx="579.3" cy="343.6" r="9" fill="#2e6fb5"><animateTransform attributeName="transform" type="rotate" from="0 450 290" to="360 450 290" dur="9s" repeatCount="indefinite"/></circle><circle cx="503.6" cy="419.3" r="9" fill="#2e6fb5"><animateTransform attributeName="transform" type="rotate" from="0 450 290" to="360 450 290" dur="9s" repeatCount="indefinite"/></circle><circle cx="396.4" cy="419.3" r="9" fill="#2e6fb5"><animateTransform attributeName="transform" type="rotate" from="0 450 290" to="360 450 290" dur="9s" repeatCount="indefinite"/></circle><circle cx="320.7" cy="343.6" r="9" fill="#2e6fb5"><animateTransform attributeName="transform" type="rotate" from="0 450 290" to="360 450 290" dur="9s" repeatCount="indefinite"/></circle><circle cx="320.7" cy="236.4" r="9" fill="#2e6fb5"><animateTransform attributeName="transform" type="rotate" from="0 450 290" to="360 450 290" dur="9s" repeatCount="indefinite"/></circle><circle cx="396.4" cy="160.7" r="9" fill="#2e6fb5"><animateTransform attributeName="transform" type="rotate" from="0 450 290" to="360 450 290" dur="9s" repeatCount="indefinite"/></circle><g><animate attributeName="opacity" keyTimes="0.0000;0.7500;0.7750;1.0000" values="0;0;1;1" dur="12s" begin="wa-play.begin+0s" fill="freeze"/><circle cx="503.6" cy="160.7" r="9" fill="none" stroke="#c0392b" stroke-width="2.5" stroke-dasharray="3 3"/></g><g><animate attributeName="opacity" keyTimes="0.0000;0.7500;0.7750;1.0000" values="0;0;1;1" dur="12s" begin="wa-play.begin+0s" fill="freeze"/><circle cx="579.3" cy="236.4" r="9" fill="none" stroke="#c0392b" stroke-width="2.5" stroke-dasharray="3 3"/></g><line x1="570" y1="370" x2="640" y2="420" stroke="#475569" stroke-width="1.5"/><circle cx="570" cy="370" r="3" fill="#475569"/><text x="646" y="424" text-anchor="start" font-size="13" font-weight="700" fill="#111827">outer shell: 6 electrons, room for 8</text></g></g>
<line x1="310" y1="290" x2="240" y2="290" stroke="#475569" stroke-width="1.5"/><circle cx="310" cy="290" r="3" fill="#475569"/><text x="234" y="284" text-anchor="end" font-size="13" font-weight="700" fill="#111827">electrons (−1 each)</text><text x="234" y="302" text-anchor="end" font-size="13" font-weight="700" fill="#111827">in shells</text>
<text x="450" y="480" text-anchor="middle" font-size="15" font-weight="800" fill="#111827">an oxygen atom: 8 protons, 8 neutrons, 8 electrons (2,6)</text>
<g class="part" data-part="h" data-name="Hydrogen atom" data-info="1 proton and 1 electron; its shell holds 2, so it needs one more." tabindex="0" role="button" aria-label="Hydrogen atom"><g><animate attributeName="opacity" keyTimes="0.0000;0.5417;0.5667;1.0000" values="0;0;1;1" dur="12s" begin="wa-play.begin+0s" fill="freeze"/><circle cx="900" cy="290" r="60" fill="none" stroke="#b0b7c3" stroke-width="2"/><circle cx="900" cy="290" r="10" fill="#c0392b"/><circle cx="900" cy="230" r="9" fill="#2e6fb5"><animateTransform attributeName="transform" type="rotate" from="0 900 290" to="360 900 290" dur="4s" repeatCount="indefinite"/></circle><g><animate attributeName="opacity" keyTimes="0.0000;0.7500;0.7750;1.0000" values="0;0;1;1" dur="12s" begin="wa-play.begin+0s" fill="freeze"/><circle cx="900" cy="350" r="9" fill="none" stroke="#c0392b" stroke-width="2.5" stroke-dasharray="3 3"/></g><text x="900" y="400" text-anchor="middle" font-size="15" font-weight="800" fill="#111827">a hydrogen atom: 1 proton, 1 electron</text></g></g>
<g class="part" data-part="need" data-name="Needing electrons" data-info="Atoms are most stable with a full outer shell. Oxygen and hydrogen can complete their shells by sharing electrons: a covalent bond." tabindex="0" role="button" aria-label="Needing electrons"><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.7500;0.7750;1.0000" values="0;0;1;1" dur="12s" begin="wa-play.begin+0s" fill="freeze"/><rect x="300.0" y="518" width="520" height="24" rx="12" fill="#fde8e8" stroke="#1f2937" stroke-width="1"/><text x="560" y="535" text-anchor="middle" font-size="13" font-weight="700">dashed circles: oxygen needs 2 more electrons, hydrogen needs 1</text></g></g>
</svg>