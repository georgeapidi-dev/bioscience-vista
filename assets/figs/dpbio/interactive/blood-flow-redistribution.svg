<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 540" class="vd-svg" role="img" aria-labelledby="bf-title bf-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="bf-play" data-vd-play-label="Play: start exercising" data-vd-steps="[[0, &quot;Where does the blood go?&quot;], [1, &quot;At rest: lots to the gut and kidneys.&quot;], [5, &quot;During vigorous exercise: most to the skeletal muscles; brain flow kept constant.&quot;], [9.5, &quot;Arterioles dilate or constrict to redirect blood.&quot;]]" data-vd-dur="13">
<title id="bf-title">Redistribution of blood flow</title><desc id="bf-desc">Share of cardiac output to brain, skeletal muscle, gut, kidneys and skin at rest compared with vigorous exercise, when far more goes to skeletal muscle and less to the gut and kidneys while brain flow stays constant in absolute terms.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="540" fill="#ffffff"/>
<g aria-hidden="true"><animate id="bf-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<text class="head" x="30" y="34">Blood flow: rest versus exercise</text><text class="note" x="30" y="56">Approximate % of cardiac output (output rises ~4× in exercise, so brain flow is constant in absolute terms).</text>
<g class="part" data-part="ex" data-name="Vigorous exercise" data-info="Much more blood to skeletal muscles (and skin for cooling); less to the gut and kidneys; brain roughly constant." tabindex="0" role="button" aria-label="Vigorous exercise"><text x="208" y="140" text-anchor="end" font-size="14" font-weight="800" fill="#111827">brain</text><rect x="220" y="110" width="84" height="26" rx="6" fill="#93c5fd" stroke="#1e3a8a"><animate attributeName="width" keyTimes="0.0000;0.0769;0.1538;1.0000" values="0;0;84;84" dur="13s" begin="bf-play.begin+0s" fill="freeze"/></rect><g><animate attributeName="opacity" keyTimes="0.0000;0.1538;0.1769;1.0000" values="0;0;1;1" dur="13s" begin="bf-play.begin+0s" fill="freeze"/><text x="312" y="129" text-anchor="start" font-size="11" font-weight="800" fill="#1d4ed8">rest 14%</text></g><rect x="220" y="142" width="24" height="26" rx="6" fill="#f87171" stroke="#7f1d1d"><animate attributeName="width" keyTimes="0.0000;0.3846;0.4615;1.0000" values="0;0;24;24" dur="13s" begin="bf-play.begin+0s" fill="freeze"/></rect><g><animate attributeName="opacity" keyTimes="0.0000;0.4615;0.4846;1.0000" values="0;0;1;1" dur="13s" begin="bf-play.begin+0s" fill="freeze"/><text x="252" y="161" text-anchor="start" font-size="11" font-weight="800" fill="#b91c1c">exercise 4%</text></g><text x="208" y="218" text-anchor="end" font-size="14" font-weight="800" fill="#111827">skeletal muscle</text><rect x="220" y="188" width="120" height="26" rx="6" fill="#93c5fd" stroke="#1e3a8a"><animate attributeName="width" keyTimes="0.0000;0.0769;0.1538;1.0000" values="0;0;120;120" dur="13s" begin="bf-play.begin+0s" fill="freeze"/></rect><g><animate attributeName="opacity" keyTimes="0.0000;0.1538;0.1769;1.0000" values="0;0;1;1" dur="13s" begin="bf-play.begin+0s" fill="freeze"/><text x="348" y="207" text-anchor="start" font-size="11" font-weight="800" fill="#1d4ed8">rest 20%</text></g><rect x="220" y="220" width="450" height="26" rx="6" fill="#f87171" stroke="#7f1d1d"><animate attributeName="width" keyTimes="0.0000;0.4077;0.4846;1.0000" values="0;0;450;450" dur="13s" begin="bf-play.begin+0s" fill="freeze"/></rect><g><animate attributeName="opacity" keyTimes="0.0000;0.4846;0.5077;1.0000" values="0;0;1;1" dur="13s" begin="bf-play.begin+0s" fill="freeze"/><text x="678" y="239" text-anchor="start" font-size="11" font-weight="800" fill="#b91c1c">exercise 75%</text></g><text x="208" y="296" text-anchor="end" font-size="14" font-weight="800" fill="#111827">gut</text><rect x="220" y="266" width="150" height="26" rx="6" fill="#93c5fd" stroke="#1e3a8a"><animate attributeName="width" keyTimes="0.0000;0.0769;0.1538;1.0000" values="0;0;150;150" dur="13s" begin="bf-play.begin+0s" fill="freeze"/></rect><g><animate attributeName="opacity" keyTimes="0.0000;0.1538;0.1769;1.0000" values="0;0;1;1" dur="13s" begin="bf-play.begin+0s" fill="freeze"/><text x="378" y="285" text-anchor="start" font-size="11" font-weight="800" fill="#1d4ed8">rest 25%</text></g><rect x="220" y="298" width="24" height="26" rx="6" fill="#f87171" stroke="#7f1d1d"><animate attributeName="width" keyTimes="0.0000;0.4308;0.5077;1.0000" values="0;0;24;24" dur="13s" begin="bf-play.begin+0s" fill="freeze"/></rect><g><animate attributeName="opacity" keyTimes="0.0000;0.5077;0.5308;1.0000" values="0;0;1;1" dur="13s" begin="bf-play.begin+0s" fill="freeze"/><text x="252" y="317" text-anchor="start" font-size="11" font-weight="800" fill="#b91c1c">exercise 4%</text></g><text x="208" y="374" text-anchor="end" font-size="14" font-weight="800" fill="#111827">kidneys</text><rect x="220" y="344" width="120" height="26" rx="6" fill="#93c5fd" stroke="#1e3a8a"><animate attributeName="width" keyTimes="0.0000;0.0769;0.1538;1.0000" values="0;0;120;120" dur="13s" begin="bf-play.begin+0s" fill="freeze"/></rect><g><animate attributeName="opacity" keyTimes="0.0000;0.1538;0.1769;1.0000" values="0;0;1;1" dur="13s" begin="bf-play.begin+0s" fill="freeze"/><text x="348" y="363" text-anchor="start" font-size="11" font-weight="800" fill="#1d4ed8">rest 20%</text></g><rect x="220" y="376" width="18" height="26" rx="6" fill="#f87171" stroke="#7f1d1d"><animate attributeName="width" keyTimes="0.0000;0.4538;0.5308;1.0000" values="0;0;18;18" dur="13s" begin="bf-play.begin+0s" fill="freeze"/></rect><g><animate attributeName="opacity" keyTimes="0.0000;0.5308;0.5538;1.0000" values="0;0;1;1" dur="13s" begin="bf-play.begin+0s" fill="freeze"/><text x="246" y="395" text-anchor="start" font-size="11" font-weight="800" fill="#b91c1c">exercise 3%</text></g><text x="208" y="452" text-anchor="end" font-size="14" font-weight="800" fill="#111827">skin</text><rect x="220" y="422" width="48" height="26" rx="6" fill="#93c5fd" stroke="#1e3a8a"><animate attributeName="width" keyTimes="0.0000;0.0769;0.1538;1.0000" values="0;0;48;48" dur="13s" begin="bf-play.begin+0s" fill="freeze"/></rect><g><animate attributeName="opacity" keyTimes="0.0000;0.1538;0.1769;1.0000" values="0;0;1;1" dur="13s" begin="bf-play.begin+0s" fill="freeze"/><text x="276" y="441" text-anchor="start" font-size="11" font-weight="800" fill="#1d4ed8">rest 8%</text></g><rect x="220" y="454" width="60" height="26" rx="6" fill="#f87171" stroke="#7f1d1d"><animate attributeName="width" keyTimes="0.0000;0.4769;0.5538;1.0000" values="0;0;60;60" dur="13s" begin="bf-play.begin+0s" fill="freeze"/></rect><g><animate attributeName="opacity" keyTimes="0.0000;0.5538;0.5769;1.0000" values="0;0;1;1" dur="13s" begin="bf-play.begin+0s" fill="freeze"/><text x="288" y="473" text-anchor="start" font-size="11" font-weight="800" fill="#b91c1c">exercise 10%</text></g></g>
<g class="part" data-part="rest" data-name="Sleep or wakeful rest" data-info="Less to skeletal muscles; more to the gut (especially after meals) and kidneys; brain constant." tabindex="0" role="button" aria-label="Sleep or wakeful rest"></g>
<g class="part" data-part="how" data-name="How" data-info="Vasodilation and vasoconstriction of arterioles redirect blood. The brain&#x27;s supply is kept nearly constant at all times." tabindex="0" role="button" aria-label="How"><g><animate attributeName="opacity" keyTimes="0.0000;0.7308;0.7538;1.0000" values="0;0;1;1" dur="13s" begin="bf-play.begin+0s" fill="freeze"/><rect x="860" y="120" width="210" height="300" rx="16" fill="#f8fafc" stroke="#cbd5e1"/><text x="965" y="148" text-anchor="middle" font-size="14" font-weight="800" fill="#111827">arterioles</text><path d="M 900 200 L 1030 200" stroke="#dc2626" stroke-width="24"/><text x="965" y="236" text-anchor="middle" font-size="11" font-weight="800" fill="#b91c1c">vasodilation → more flow</text><path d="M 900 290 L 1030 290" stroke="#dc2626" stroke-width="8"/><text x="965" y="322" text-anchor="middle" font-size="11" font-weight="800" fill="#b91c1c">vasoconstriction → less</text><text x="965" y="380" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">brain: kept constant</text></g></g>
</svg>