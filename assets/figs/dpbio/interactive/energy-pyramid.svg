<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 600" class="vd-svg" role="img" aria-labelledby="ep2-title ep2-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="ep2-play" data-vd-play-label="Play: energy flow" data-vd-steps="[[0, &quot;A pyramid of energy: the energy flowing through each trophic level (kJ per m\u00b2 per year; values illustrative).&quot;], [1, &quot;Producers capture 10 000 kJ. Only about 10% is passed on when herbivores eat them.&quot;], [4, &quot;The other 90% is lost: respiration (heat), parts not eaten, faeces and urine.&quot;], [7, &quot;Each level gets about one tenth of the one below: 10 000 \u2192 1 000 \u2192 100 \u2192 10 kJ.&quot;], [10, &quot;A pyramid of energy is never inverted, which is why food chains are short.&quot;]]" data-vd-dur="12">
<title id="ep2-title">Pyramid of energy</title><desc id="ep2-desc">A pyramid of energy with producers 10 000 kJ, primary consumers 1 000 kJ, secondary 100 kJ and tertiary 10 kJ; arrows show about 90% lost at each step.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="600" fill="#ffffff"/>
<g aria-hidden="true"><animate id="ep2-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<defs><marker id="ep2-dc2626" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#dc2626"/></marker><marker id="ep2-16a34a" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#16a34a"/></marker></defs>
<text class="head" x="30" y="34">Pyramid of energy</text><text class="note" x="30" y="56">Bar widths are not to scale (the real differences are ten-fold).</text>
<g class="part" data-part="prod" data-name="Producers" data-info="Capture light energy by photosynthesis: about 1–3% of the sunlight reaching them." tabindex="0" role="button" aria-label="Producers"><rect x="70.0" y="470" width="700" height="80" fill="#86efac" stroke="#1f2937" stroke-width="2"/><text x="420" y="516" text-anchor="middle" font-size="16" font-weight="700">Producers: 10 000 kJ</text></g>
<g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.0833;0.1083;1.0000" values="0;0;1;1" dur="12s" begin="ep2-play.begin+0s" fill="freeze"/><path d="M 420 468 L 420 452" stroke="#16a34a" stroke-width="3" marker-end="url(#ep2-16a34a)"/><text x="432" y="464" font-size="12" font-weight="700" fill="#15803d">≈10%</text></g>
<g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.1667;0.1917;1.0000" values="0;0;1;1" dur="12s" begin="ep2-play.begin+0s" fill="freeze"/><path d="M 774.0 510 L 860.0 510" stroke="#dc2626" stroke-width="3" marker-end="url(#ep2-dc2626)"/><text x="868.0" y="515" font-size="13" font-weight="700" fill="#b91c1c">≈90% lost</text></g>
<g class="part" data-part="pc" data-name="Primary consumers" data-info="Herbivores: get about 10% of the energy in the producers." tabindex="0" role="button" aria-label="Primary consumers"><rect x="150.0" y="370" width="540" height="80" fill="#fde047" stroke="#1f2937" stroke-width="2"/><text x="420" y="416" text-anchor="middle" font-size="16" font-weight="700">Primary consumers: 1 000 kJ</text></g>
<g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.2667;0.2917;1.0000" values="0;0;1;1" dur="12s" begin="ep2-play.begin+0s" fill="freeze"/><path d="M 420 368 L 420 352" stroke="#16a34a" stroke-width="3" marker-end="url(#ep2-16a34a)"/><text x="432" y="364" font-size="12" font-weight="700" fill="#15803d">≈10%</text></g>
<g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.3500;0.3750;1.0000" values="0;0;1;1" dur="12s" begin="ep2-play.begin+0s" fill="freeze"/><path d="M 694.0 410 L 780.0 410" stroke="#dc2626" stroke-width="3" marker-end="url(#ep2-dc2626)"/><text x="788.0" y="415" font-size="13" font-weight="700" fill="#b91c1c">≈90% lost</text></g>
<g class="part" data-part="sc" data-name="Secondary consumers" data-info="Carnivores: about 10% of the energy in the level below." tabindex="0" role="button" aria-label="Secondary consumers"><rect x="220.0" y="270" width="400" height="80" fill="#fdba74" stroke="#1f2937" stroke-width="2"/><text x="420" y="316" text-anchor="middle" font-size="16" font-weight="700">Secondary consumers: 100 kJ</text></g>
<g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.4500;0.4750;1.0000" values="0;0;1;1" dur="12s" begin="ep2-play.begin+0s" fill="freeze"/><path d="M 420 268 L 420 252" stroke="#16a34a" stroke-width="3" marker-end="url(#ep2-16a34a)"/><text x="432" y="264" font-size="12" font-weight="700" fill="#15803d">≈10%</text></g>
<g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.5333;0.5583;1.0000" values="0;0;1;1" dur="12s" begin="ep2-play.begin+0s" fill="freeze"/><path d="M 624.0 310 L 710.0 310" stroke="#dc2626" stroke-width="3" marker-end="url(#ep2-dc2626)"/><text x="718.0" y="315" font-size="13" font-weight="700" fill="#b91c1c">≈90% lost</text></g>
<g class="part" data-part="tc" data-name="Tertiary consumers" data-info="Very little energy is left, so there are few top predators and food chains are short (rarely more than 4–5 levels)." tabindex="0" role="button" aria-label="Tertiary consumers"><rect x="280.0" y="170" width="280" height="80" fill="#fca5a5" stroke="#1f2937" stroke-width="2"/><text x="420" y="216" text-anchor="middle" font-size="16" font-weight="700">Tertiary consumers: 10 kJ</text></g>
<g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.0417;0.0583;1.0000" values="0;0;1;1" dur="12s" begin="ep2-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.0417;0.1000;1.0000" values="160 150;160 150;120 470;120 470" dur="12s" begin="ep2-play.begin+0s" fill="freeze"/><circle r="20" fill="#facc15"/><text y="5" text-anchor="middle" font-size="11" font-weight="800">Sun</text></g></g>
<g class="part" data-part="loss" data-name="Energy losses" data-info="At each level most energy is lost: respiration (released as heat), parts not eaten (roots, bones), egestion (faeces) and excretion." tabindex="0" role="button" aria-label="Energy losses"><rect x="820" y="130" width="260" height="190" rx="12" fill="#fef2f2" stroke="#fca5a5"/><text x="836" y="156" font-size="14" font-weight="700">Where the energy goes</text><text x="836" y="184" font-size="13">• respiration: lost as heat</text><text x="836" y="210" font-size="13">• parts not eaten (roots, bones)</text><text x="836" y="236" font-size="13">• egested in faeces</text><text x="836" y="262" font-size="13">• excreted (urea in urine)</text><text x="836" y="288" font-size="13">• stays in dead organisms</text></g>
</svg>