ty" keyTimes="0.0000;0.6786;0.7000;1.0000" values="0;0;1;1" dur="14s" begin="ab-play.begin+0s" fill="freeze"/><g transform="translate(925 300) rotate(0)"><path d="M 0 10 L 0 -4 M 0 -4 L -10 -16 M 0 -4 L 10 -16" stroke="#2563eb" stroke-width="5" stroke-linecap="round" fill="none"/></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.6786;0.7000;1.0000" values="0;0;1;1" dur="14s" begin="ab-play.begin+0s" fill="freeze"/><g transform="translate(850 360) rotate(90)"><path d="M 0 10 L 0 -4 M 0 -4 L -10 -16 M 0 -4 L 10 -16" stroke="#2563eb" stroke-width="5" stroke-linecap="round" fill="none"/></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.6786;0.7000;1.0000" values="0;0;1;1" dur="14s" begin="ab-play.begin+0s" fill="freeze"/><g transform="translate(1000 360) rotate(-90)"><path d="M 0 10 L 0 -4 M 0 -4 L -10 -16 M 0 -4 L 10 -16" stroke="#2563eb" stroke-width="5" stroke-linecap="round" fill="none"/></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.6786;0.7000;1.0000" values="0;0;1;1" dur="14s" begin="ab-play.begin+0s" fill="freeze"/><g transform="translate(925 420) rotate(180)"><path d="M 0 10 L 0 -4 M 0 -4 L -10 -16 M 0 -4 L 10 -16" stroke="#2563eb" stroke-width="5" stroke-linecap="round" fill="none"/></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.6786;0.7000;1.0000" values="0;0;1;1" dur="14s" begin="ab-play.begin+0s" fill="freeze"/><g transform="translate(880 330) rotate(45)"><path d="M 0 10 L 0 -4 M 0 -4 L -10 -16 M 0 -4 L 10 -16" stroke="#2563eb" stroke-width="5" stroke-linecap="round" fill="none"/></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.6786;0.7000;1.0000" values="0;0;1;1" dur="14s" begin="ab-play.begin+0s" fill="freeze"/><g transform="translate(970 390) rotate(-135)"><path d="M 0 10 L 0 -4 M 0 -4 L -10 -16 M 0 -4 L 10 -16" stroke="#2563eb" stroke-width="5" stroke-linecap="round" fill="none"/></g></g><g opacity="0"><animate attributeNam