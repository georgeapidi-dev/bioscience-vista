<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 680" class="vd-svg" role="img" aria-labelledby="ab-title ab-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="ab-play" data-vd-play-label="Play: antibodies in action" data-vd-steps="[[0, &quot;An antibody (IgG): four polypeptide chains, two heavy and two light, in a Y shape.&quot;], [1.5, &quot;The tips of the arms are variable regions: two identical antigen-binding sites.&quot;], [3, &quot;Antigens with a complementary shape bind to the binding sites: antibodies are specific.&quot;], [7, &quot;Each antibody can bind two pathogens at once, linking them into clumps: agglutination.&quot;], [11, &quot;A phagocyte then engulfs the clump. Antibodies also neutralise toxins and mark pathogens for destruction.&quot;]]" data-vd-dur="14">
<title id="ab-title">Antibody structure and action</title><desc id="ab-desc">A labelled IgG antibody with two heavy and two light chains, disulfide bonds, hinge, constant region and two variable antigen-binding sites; antigens bind and antibodies clump bacteria by agglutination.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1220" height="680" fill="#ffffff"/>
<g aria-hidden="true"><animate id="ab-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<text class="head" x="30" y="34">Antibody (immunoglobulin G): structure and action</text><text class="note" x="30" y="56">Simplified: each rounded block is one protein domain.</text>
<g class="part" data-part="hin" data-name="Hinge region" data-info="Flexible, so the two arms can bind antigens at different distances apart." tabindex="0" role="button" aria-label="Hinge region"><path d="M 302 390 L 300 354 M 338 390 L 340 354" stroke="#3b82f6" stroke-width="16" stroke-linecap="round"/></g>
<g class="part" data-part="con" data-name="Constant region" data-info="The same in all antibodies of a class. Binds to receptors on phagocytes and other cells." tabindex="0" role="button" aria-label="Constant region"><rect x="286" y="386" width="32" height="84" rx="16" fill="#3b82f6" stroke="#1e3a8a" stroke-width="2.5"/><rect x="322" y="386" width="32" height="84" rx="16" fill="#3b82f6" stroke="#1e3a8a" stroke-width="2.5"/><rect x="286" y="476" width="32" height="84" rx="16" fill="#3b82f6" stroke="#1e3a8a" stroke-width="2.5"/><rect x="322" y="476" width="32" height="84" rx="16" fill="#3b82f6" stroke="#1e3a8a" stroke-width="2.5"/></g>
<g class="part" data-part="hc" data-name="Heavy chains" data-info="Two identical long polypeptide chains, forming the stem and the inner part of each arm." tabindex="0" role="button" aria-label="Heavy chains"><g transform="translate(298 346) rotate(-35)"><rect x="2" y="-92" width="32" height="84" rx="16" fill="#3b82f6" stroke="#1e3a8a" stroke-width="2.5"/></g><g transform="translate(342 346) rotate(35)"><rect x="-34" y="-92" width="32" height="84" rx="16" fill="#3b82f6" stroke="#1e3a8a" stroke-width="2.5"/></g></g>
<g class="part" data-part="lc" data-name="Light chains" data-info="Two identical shorter polypeptide chains on the outside of each arm." tabindex="0" role="button" aria-label="Light chains"><g transform="translate(298 346) rotate(-35)"><rect x="-34" y="-92" width="32" height="84" rx="16" fill="#93c5fd" stroke="#1d4ed8" stroke-width="2.5"/></g><g transform="translate(342 346) rotate(35)"><rect x="2" y="-92" width="32" height="84" rx="16" fill="#93c5fd" stroke="#1d4ed8" stroke-width="2.5"/></g></g>
<g class="part" data-part="var" data-name="Variable region: antigen-binding site" data-info="Different in each type of antibody. Its shape is complementary to one specific antigen. Each antibody has two identical binding sites." tabindex="0" role="button" aria-label="Variable region: antigen-binding site"><g transform="translate(298 346) rotate(-35)"><rect x="2" y="-182" width="32" height="80" rx="16" fill="#f472b6" stroke="#9d174d" stroke-width="2.5"/><rect x="-34" y="-182" width="32" height="80" rx="16" fill="#f9a8d4" stroke="#9d174d" stroke-width="2.5"/><path d="M -26 -184 L -12 -202 L 0 -188 L 12 -202 L 26 -184" fill="#fff" stroke="#9d174d" stroke-width="2.5"/></g><g transform="translate(342 346) rotate(35)"><rect x="-34" y="-182" width="32" height="80" rx="16" fill="#f472b6" stroke="#9d174d" stroke-width="2.5"/><rect x="2" y="-182" width="32" height="80" rx="16" fill="#f9a8d4" stroke="#9d174d" stroke-width="2.5"/><path d="M -26 -184 L -12 -202 L 0 -188 L 12 -202 L 26 -184" fill="#fff" stroke="#9d174d" stroke-width="2.5"/></g></g>
<g class="part" data-part="ss" data-name="Disulfide bonds" data-info="Covalent bonds (–S–S–) between cysteines that hold the four chains together." tabindex="0" role="button" aria-label="Disulfide bonds"><g transform="translate(298 346) rotate(-35)"><line x1="-7" y1="-30" x2="7" y2="-30" stroke="#facc15" stroke-width="5"/></g><g transform="translate(342 346) rotate(35)"><line x1="-7" y1="-30" x2="7" y2="-30" stroke="#facc15" stroke-width="5"/></g><line x1="311" y1="366" x2="329" y2="366" stroke="#facc15" stroke-width="5"/><line x1="311" y1="376" x2="329" y2="376" stroke="#facc15" stroke-width="5"/></g>
<path d="M 276 426 C 244 426 244 520 276 520" fill="none" stroke="#94a3b8" stroke-width="2"/>
<g class="part" data-part="ag" data-name="Antigen" data-info="A molecule (often on a pathogen’s surface) recognised as foreign. Only antibodies with a complementary binding site bind it." tabindex="0" role="button" aria-label="Antigen"><g transform="translate(298 346) rotate(-35)"><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.2143;0.2286;1.0000" values="0;0;1;1" dur="14s" begin="ab-play.begin+0s" fill="freeze"/><g transform="translate(-70 -330)"><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.2143;0.3571;1.0000" values="-70 -330;-70 -330;0 -202;0 -202" dur="14s" begin="ab-play.begin+0s" fill="freeze"/><g transform="rotate(180)"><path d="M -12 2 L 0 -12 L 12 2 Z" fill="#f97316" stroke="#9a3412" stroke-width="2"/><rect x="-14" y="2" width="28" height="18" rx="5" fill="#fdba74" stroke="#9a3412" stroke-width="2"/></g></g></g></g><g transform="translate(342 346) rotate(35)"><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.2143;0.2286;1.0000" values="0;0;1;1" dur="14s" begin="ab-play.begin+0s" fill="freeze"/><g transform="translate(70 -330)"><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.2143;0.3571;1.0000" values="70 -330;70 -330;0 -202;0 -202" dur="14s" begin="ab-play.begin+0s" fill="freeze"/><g transform="rotate(180)"><path d="M -12 2 L 0 -12 L 12 2 Z" fill="#f97316" stroke="#9a3412" stroke-width="2"/><rect x="-14" y="2" width="28" height="18" rx="5" fill="#fdba74" stroke="#9a3412" stroke-width="2"/></g></g></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.2286;0.2429;1.0000" values="0;0;1;1" dur="14s" begin="ab-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.2286;0.3857;1.0000" values="620 100;620 100;540 120;540 120" dur="14s" begin="ab-play.begin+0s" fill="freeze"/><g transform="rotate(180)"><path d="M -12 2 L 0 14 L 12 2 Z" fill="#a3e635" stroke="#3f6212" stroke-width="2"/><rect x="-14" y="2" width="28" height="18" rx="5" fill="#d9f99d" stroke="#3f6212" stroke-width="2"/></g></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.3857;0.4071;1.0000" values="0;0;1;1" dur="14s" begin="ab-play.begin+0s" fill="freeze"/><text x="540" y="160" text-anchor="middle" font-size="12" font-weight="700" fill="#3f6212">wrong shape: does not bind</text></g></g>
<rect x="640" y="80" width="560" height="560" rx="14" fill="#f8fafc" stroke="#94a3b8"/><text x="660" y="106" font-size="13" font-weight="800">Agglutination</text>
<g class="part" data-part="agg" data-name="Agglutination" data-info="With two binding sites, each antibody can link two pathogens, making clumps that phagocytes engulf more easily." tabindex="0" role="button" aria-label="Agglutination"><g transform="translate(760 200)"><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.5000;0.7143;1.0000" values="760 200;760 200;850 300;850 300" dur="14s" begin="ab-play.begin+0s" fill="freeze"/><rect x="-46" y="-22" width="92" height="44" rx="22" fill="#86efac" stroke="#15803d" stroke-width="2.5"/><path d="M -26 -22 l -6 -9 l 12 0 z" fill="#f97316" stroke="#9a3412"/><path d="M 0 -22 l -6 -9 l 12 0 z" fill="#f97316" stroke="#9a3412"/><path d="M 26 -22 l -6 -9 l 12 0 z" fill="#f97316" stroke="#9a3412"/><path d="M -26 22 l -6 9 l 12 0 z" fill="#f97316" stroke="#9a3412"/><path d="M 0 22 l -6 9 l 12 0 z" fill="#f97316" stroke="#9a3412"/><path d="M 26 22 l -6 9 l 12 0 z" fill="#f97316" stroke="#9a3412"/></g><g transform="translate(1080 220)"><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.5000;0.7143;1.0000" values="1080 220;1080 220;1000 300;1000 300" dur="14s" begin="ab-play.begin+0s" fill="freeze"/><rect x="-46" y="-22" width="92" height="44" rx="22" fill="#86efac" stroke="#15803d" stroke-width="2.5"/><path d="M -26 -22 l -6 -9 l 12 0 z" fill="#f97316" stroke="#9a3412"/><path d="M 0 -22 l -6 -9 l 12 0 z" fill="#f97316" stroke="#9a3412"/><path d="M 26 -22 l -6 -9 l 12 0 z" fill="#f97316" stroke="#9a3412"/><path d="M -26 22 l -6 9 l 12 0 z" fill="#f97316" stroke="#9a3412"/><path d="M 0 22 l -6 9 l 12 0 z" fill="#f97316" stroke="#9a3412"/><path d="M 26 22 l -6 9 l 12 0 z" fill="#f97316" stroke="#9a3412"/></g><g transform="translate(780 520)"><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.5000;0.7143;1.0000" values="780 520;780 520;850 420;850 420" dur="14s" begin="ab-play.begin+0s" fill="freeze"/><rect x="-46" y="-22" width="92" height="44" rx="2