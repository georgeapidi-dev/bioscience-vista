<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" class="vd-svg" role="img" aria-labelledby="or-title or-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="or-play" data-vd-play-label="Play: deliver and keep" data-vd-steps="[[0, &quot;Where did Earth&#x27;s water come from, and why did it stay?&quot;], [1, &quot;1 Delivery: water-rich asteroids struck the young Earth.&quot;], [5, &quot;2 Gravity: Earth was massive enough to pull the water vapour back.&quot;], [9, &quot;3 Temperature: it became cool enough for the vapour to condense into liquid water.&quot;]]" data-vd-dur="14">
<title id="or-title">The origin of water on Earth</title><desc id="or-desc">Water-rich asteroids striking the young Earth, Earth&#x27;s gravity pulling water vapour back so it could not escape, and cooling allowing the vapour to condense into liquid water.</desc>
