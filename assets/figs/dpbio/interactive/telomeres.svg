<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" class="vd-svg" role="img" aria-labelledby="te-title te-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="te-play" data-vd-play-label="Play: divisions and telomeres" data-vd-steps="[[0, &quot;Telomeres: protective repeats at the ends of chromosomes.&quot;], [1, &quot;Each telomere is thousands of TTAGGG repeats with no genes.&quot;], [3.5, &quot;At each division, the very end of the lagging strand cannot be copied: telomeres get shorter.&quot;], [9, &quot;After about 50 divisions the telomeres are too short: the cell stops dividing (senescence).&quot;], [12, &quot;Telomerase adds repeats back, using its own RNA as a template: in stem cells, germ cells and most cancer cells.&quot;]]" data-vd-dur="16">
<title id="te-title">Telomeres and telomerase</title><desc id="te-desc">A chromosome with telomere caps that shorten with each cell division because of the end-replication problem, leading to senescence, and telomerase adding TTAGGG repeats back using an RNA template.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1200" height="660" fill="#ffffff"/>
<g aria-hidden="true"><animate id="te-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<text class="head" x="30" y="34">Telomeres and telomerase</text><text class="note" x="30" y="56">Telomere lengths exaggerated for clarity.</text>
<g class="part" data-part="chr" data-name="Chromosome" data-info="A linear chromosome has a telomere at each end of each chromatid." tabindex="0" role="button" aria-label="Chromosome"><path d="M 150 238 L 450 238 L 450 282 L 150 282 Z" fill="#a78bfa" stroke="#5b21b6" stroke-width="2"/><circle cx="280" cy="260" r="10" fill="#fde047"/><text x="300" y="320" text-anchor="middle" font-size="12" font-weight="800" fill="#5b21b6">chromosome (one chromatid)</text></g>
<g class="part" data-part="tel" data-name="Telomere" data-info="Thousands of repeats of the sequence TTAGGG at the ends of chromosomes. They contain no genes and protect genes from being lost." tabindex="0" role="button" aria-label="Telomere"><rect x="40" y="242" width="110" height="36" rx="10" fill="#f97316"><animate attributeName="width" keyTimes="0.0000;0.2188;0.5625;0.7500;0.8750;1.0000" values="110;110;14;14;110;110" dur="16s" begin="te-play.begin+0s" fill="freeze"/><animate attributeName="x" keyTimes="0.0000;0.2188;0.5625;0.7500;0.8750;1.0000" values="40;40;136;136;40;40" dur="16s" begin="te-play.begin+0s" fill="freeze"/></rect><rect x="450" y="242" width="110" height="36" rx="10" fill="#f97316"><animate attributeName="width" keyTimes="0.0000;0.2188;0.5625;0.7500;0.8750;1.0000" values="110;110;14;14;110;110" dur="16s" begin="te-play.begin+0s" fill="freeze"/></rect><text x="505" y="228" text-anchor="middle" font-size="13" font-weight="800" fill="#c2410c">telomere</text><text x="95" y="228" text-anchor="middle" font-size="13" font-weight="800" fill="#c2410c">telomere</text></g>
<g><animate attributeName="opacity" keyTimes="0.0000;0.0625;0.0813;1.0000" values="0;0;1;1" dur="16s" begin="te-play.begin+0s" fill="freeze"/><rect x="560" y="110" width="620" height="70" rx="12" fill="#fff7ed" stroke="#fdba74"/><text x="870" y="136" text-anchor="middle" font-size="14" font-weight="800" fill="#9a3412">…TTAGGG TTAGGG TTAGGG TTAGGG TTAGGG… (thousands of repeats)</text><text x="870" y="162" text-anchor="middle" font-size="12" font-weight="600" fill="#9a3412">3′ end: a single-stranded overhang</text></g>
<text x="300" y="360" text-anchor="middle" font-size="16" font-weight="800" fill="#334155" opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.2188;0.2250;0.2531;0.2562;1.0000" values="0;0;1;1;0;0" dur="16s" begin="te-play.begin+0s" fill="freeze"/>division 1</text><text x="300" y="360" text-anchor="middle" font-size="16" font-weight="800" fill="#334155" opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.2531;0.2594;0.2875;0.2906;1.0000" values="0;0;1;1;0;0" dur="16s" begin="te-play.begin+0s" fill="freeze"/>division 5</text><text x="300" y="360" text-anchor="middle" font-size="16" font-weight="800" fill="#334155" opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.2875;0.2938;0.3219;0.3250;1.0000" values="0;0;1;1;0;0" dur="16s" begin="te-play.begin+0s" fill="freeze"/>division 10</text><text x="300" y="360" text-anchor="middle" font-size="16" font-weight="800" fill="#334155" opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.3219;0.3281;0.3563;0.3594;1.0000" values="0;0;1;1;0;0" dur="16s" begin="te-play.begin+0s" fill="freeze"/>division 15</text><text x="300" y="360" text-anchor="middle" font-size="16" font-weight="800" fill="#334155" opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.3563;0.3625;0.3906;0.3937;1.0000" values="0;0;1;1;0;0" dur="16s" begin="te-play.begin+0s" fill="freeze"/>division 20</text><text x="300" y="360" text-anchor="middle" font-size="16" font-weight="800" fill="#334155" opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.3906;0.3969;0.4250;0.4281;1.0000" values="0;0;1;1;0;0" dur="16s" begin="te-play.begin+0s" fill="freeze"/>division 25</text><text x="300" y="360" text-anchor="middle" font-size="16" font-weight="800" fill="#334155" opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.4250;0.4313;0.4594;0.4625;1.0000" values="0;0;1;1;0;0" dur="16s" begin="te-play.begin+0s" fill="freeze"/>division 30</text><text x="300" y="360" text-anchor="middle" font-size="16" font-weight="800" fill="#334155" opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.4594;0.4656;0.4938;0.4969;1.0000" values="0;0;1;1;0;0" dur="16s" begin="te-play.begin+0s" fill="freeze"/>division 35</text><text x="300" y="360" text-anchor="middle" font-size="16" font-weight="800" fill="#334155" opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.4938;0.5000;0.5281;0.5312;1.0000" values="0;0;1;1;0;0" dur="16s" begin="te-play.begin+0s" fill="freeze"/>division 40</text><text x="300" y="360" text-anchor="middle" font-size="16" font-weight="800" fill="#334155" opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.5281;0.5344;0.5625;0.5656;1.0000" values="0;0;1;1;0;0" dur="16s" begin="te-play.begin+0s" fill="freeze"/>division 45</text><text x="300" y="360" text-anchor="middle" font-size="16" font-weight="800" fill="#334155" opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.5625;0.5687;0.7500;0.7562;1.0000" values="0;0;1;1;0;0" dur="16s" begin="te-play.begin+0s" fill="freeze"/>division 50</text>
<g class="part" data-part="endp" data-name="End-replication problem" data-info="DNA polymerase needs a primer and adds nucleotides only 5′→3′; when the last primer at the end of the lagging strand is removed, the gap cannot be filled. So a little DNA is lost at each division." tabindex="0" role="button" aria-label="End-replication problem"><g><animate attributeName="opacity" keyTimes="0.0000;0.2188;0.2375;1.0000" values="0;0;1;1" dur="16s" begin="te-play.begin+0s" fill="freeze"/><rect x="560" y="210" width="620" height="210" rx="12" fill="#f8fafc" stroke="#cbd5e1"/><text x="870" y="236" text-anchor="middle" font-size="14" font-weight="800" fill="#111827">Why telomeres shorten: the end-replication problem</text><rect x="600" y="270" width="540" height="14" rx="3" fill="#475569"/><text x="590" y="282" text-anchor="end" font-size="11" font-weight="800" fill="#475569">3′</text><text x="1150" y="282" text-anchor="start" font-size="11" font-weight="800" fill="#475569">5′</text><rect x="622" y="300" width="120" height="14" rx="3" fill="#60a5fa"/><rect x="752" y="300" width="120" height="14" rx="3" fill="#60a5fa"/><rect x="752" y="300" width="20" height="14" fill="#f43f5e"/><rect x="882" y="300" width="120" height="14" rx="3" fill="#60a5fa"/><rect x="882" y="300" width="20" height="14" fill="#f43f5e"/><rect x="1012" y="300" width="120" height="14" rx="3" fill="#60a5fa"/><rect x="1012" y="300" width="20" height="14" fill="#f43f5e"/><rect x="600" y="300" width="20" height="14" fill="#fff" stroke="#dc2626" stroke-width="2" stroke-dasharray="3 2"/><text x="590" y="312" text-anchor="end" font-size="11" font-weight="800" fill="#2563eb">5′</text><text x="870" y="340" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">lagging strand: Okazaki fragments, each started by an RNA primer (red)</text><rect x="600" y="360" width="22" height="14" fill="#fff" stroke="#dc2626" stroke-width="2" stroke-dasharray="3 2"/><text x="632" y="372" text-anchor="start" font-size="12" font-weight="800" fill="#b91c1c">the last primer at the end is removed and cannot be replaced → gap → shorter DNA</text><text x="870" y="404" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">so ~50–200 bases are lost at each division</text></g></g>
<g class="part" data-part="sen" data-name="Senescence" data-info="When telomeres become very short, the cell stops dividing (or dies). Human body cells divide about 50 times in culture (the Hayflick limit)." tabindex="0" role="button" aria-label="Senescence"><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.5625;0.5813;0.7500;0.7688;1.0000" values="0;0;1;1;0;0" dur="16s" begin="te-play.begin+0s" fill="freeze"/><rect x="90" y="400" width="420" height="70" rx="14" fill="#fee2e2" stroke="#fca5a5"/><text x="300" y="430" text-anchor="middle" font-size="14" font-weight="800" fill="#991b1b">too short → cell stops dividing (senescence)</text><text x="300" y="452" text-anchor="middle" font-size="12" font-weight="700" fill="#991b1b">Hayflick limit: about 50 divisions</text></g></g>
<g class="part" data-part="tase" data-name="Telomerase" data-info="An enzyme made of protein and RNA. It uses its own RNA as a template to add TTAGGG repeats back on. Active in germ cells, stem cells and most cancer cells." tabindex="0" role="button" aria-label="Telomerase"><g><animate attributeName="opacity" keyTimes="0.0000;0.7500;0.7688;1.0000" values="0;0;1;1" dur="16s" begin="te-play.begin+0s" fill="freeze"/><rect x="560" y="440" width="620" height="200" rx="12" fill="#ecfdf5" stroke="#6ee7b7"/><text x="870" y="466" text-anchor="middle" font-size="14" font-weight="800" fill="#065f46">Telomerase: protein + RNA template</text><rect x="610" y="500" width="300" height="16" rx="3" fill="#475569"/><text x="600" y="513" text-anchor="end" font-size="11" font-weight="800" fill="#475569">5′</text><rect x="910" y="500" width="0" height="16" fill="#f97316"><animate attributeName="width" keyTimes="0.0000;0.7812;0.9062;1.0000" values="0;0;150;150" dur="16s" begin="te-play.begin+0s" fill="freeze"/></rect><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.7500;0.9062;1.0000" values="880 0;880 0;1030 0;1030 0" dur="16s" begin="te-play.begin+0s" fill="freeze"/><ellipse cx="0" cy="510" rx="70" ry="34" fill="#a7f3d0" fill-opacity=".8" stroke="#047857" stroke-width="2"/><rect x="-40" y="522" width="80" height="12" rx="3" fill="#ec4899"/><text x="0" y="552" text-anchor="middle" font-size="10" font-weight="800" fill="#9d174d">AAUCCC (RNA)</text></g><text x="870" y="590" text-anchor="middle" font-size="12" font-weight="700" fill="#065f46">adds TTAGGG repeats using its RNA as a template (reverse transcription)</text><text x="870" y="612" text-anchor="middle" font-size="12" font-weight="700" fill="#065f46">active in stem cells, germ cells and most cancer cells</text></g></g>
</svg>