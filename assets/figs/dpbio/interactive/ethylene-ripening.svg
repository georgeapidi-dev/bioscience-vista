<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 580" class="vd-svg" role="img" aria-labelledby="et-title et-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="et-play" data-vd-play-label="Play: ripen" data-vd-steps="[[0, &quot;Ethylene and fruit ripening.&quot;], [1, &quot;A ripening fruit releases ethylene gas...&quot;], [4, &quot;...which triggers ripening in itself and its neighbours: positive feedback.&quot;], [9, &quot;Test it: bananas sealed with and without a ripe apple.&quot;]]" data-vd-dur="15">
<title id="et-title">Ethylene and ripening</title><desc id="et-desc">A ripe apple releases ethylene gas that diffuses to green bananas, triggering ripening which releases more ethylene in positive feedback, and an investigation comparing sealed bags of bananas with and without a ripe apple scored on a colour chart.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="580" fill="#ffffff"/>
<g aria-hidden="true"><animate id="et-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<text class="head" x="30" y="34">Ethylene: the ripening gas</text><text class="note" x="30" y="56">Colour chart 1 (green) to 7 (brown flecks).</text>
