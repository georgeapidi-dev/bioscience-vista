5"/><text x="0" y="3" text-anchor="middle" font-size="6" font-weight="800" fill="#312e81">C₂H₄</text></g></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.1833;0.1967;0.3833;0.3967;1.0000" values="0;0;1;1;0;0" dur="15s" begin="et-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.1833;0.3500;1.0000" values="180 230;180 230;420 250;420 250" dur="15s" begin="et-play.begin+0s" fill="freeze"/><g><circle r="9" fill="#e0e7ff" stroke="#4f46e5"/><text x="0" y="3" text-anchor="middle" font-size="6" font-weight="800" fill="#312e81">C₂H₄</text></g></g></g><path d="M 300 200 Q 340 240 380 200 Q 340 222 300 200 Z" fill="#84cc16" stroke="#713f12" stroke-width="2"><animate attributeName="fill" keyTimes="0.0000;0.2667;0.4000;1.0000" values="#84cc16;#84cc16;#facc15;#facc15" dur="15s" begin="et-play.begin+0s" fill="freeze"/></path><path d="M 400 200 Q 440 240 480 200 Q 440 222 400 200 Z" fill="#84cc16" stroke="#713f12" stroke-width="2"><animate attributeName="fill" keyTimes="0.0000;0.3000;0.4333;1.0000" values="#84cc16;#84cc16;#facc15;#facc15" dur="15s" begin="et-play.begin+0s" fill="freeze"/></path><path d="M 500 200 Q 540 240 580 200 Q 540 222 500 200 Z" fill="#84cc16" stroke="#713f12" stroke-width="2"><animate attributeName="fill" keyTimes="0.0000;0.3333;0.4667;1.0000" values="#84cc16;#84cc16;#facc15;#facc15" dur="15s" begin="et-play.begin+0s" fill="freeze"/></path><path d="M 300 270 Q 340 310 380 270 Q 340 292 300 270 Z" fill="#84cc16" stroke="#713f12" stroke-width="2"><animate attributeName="fill" keyTimes="0.0000;0.3667;0.5000;1.0000" values="#84cc16;#84cc16;#facc15;#facc15" dur="15s" begin="et-play.begin+0s" fill="freeze"/></path><path d="M 400 270 Q 440 310 480 270 Q 440 292 400 270 Z" fill="#84cc16" stroke="#713f12" stroke-width="2"><animate attributeName="fill" keyTimes="0.0000;0.4000;0.5333;1.0000" values="#84cc16;#84cc16;#facc15;#facc15" dur="15s" begin="et-play.begin+0s" fill="freeze"/></path><path d="M 500 270 Q 540 310 580 270 Q 540 292 500 270 Z" fill="#84cc16" stroke="#713f12" stroke-width="2"><animate attributeName="fill" keyTimes="0.0000;0.4333;0.5667;1.0000" values="#84cc16;#84cc16;#facc15;#facc15" dur="15s" begin="et-play.begin+0s" fill="freeze"/></path></g>
<g class="part" data-part="pf" data-name="Positive feedback" data-info="Ripening stimulates more ethylene production, so ripening is rapid and synchronised; ethylene diffuses to nearby fruits too." tabindex="0" role="button" aria-label="Positive feedback"><g><animate attributeName="opacity" keyTimes="0.0000;0.2667;0.2867;1.0000" values="0;0;1;1" dur="15s" begin="et-play.begin+0s" fill="freeze"/><rect x="660" y="100" width="410" height="200" rx="16" fill="#fefce8" stroke="#fde047"/><text x="865" y="128" text-anchor="middle" font-size="14" font-weight="800" fill="#a16207">positive feedback</text><text x="865" y="168" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">ethylene → ripening</text><text x="865" y="196" text-anchor="middle" font-size="22" font-weight="800" fill="#a16207">↻</text><text x="865" y="226" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">ripening → more ethylene</text><text x="865" y="266" text-anchor="middle" font-size="12" font-weight="700" fill="#475569">rapid, synchronised ripening</text><text x="865" y="284" text-anchor="middle" font-size="12" font-weight="700" fill="#475569">attracts seed-dispersing animals</text></g></g>
<g class="part" data-part="exp" data-name="Investigate" data-info="Green bananas in sealed bags with and without a ripe apple (an ethylene source); score colour daily on a 1–7 chart." tabindex="0" role="button" aria-label="Investigate"><g><animate attributeName="opacity" keyTimes="0.0000;0.6000;0.6200;1.0000" values="0;0;1;1" dur="15s" begin="et-play.begin+0s" fill="freeze"/><rect x="40" y="360" width="1030" height="200" rx="16" fill="#f8fafc" stroke="#cbd5e1"/><text x="555" y="386" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">Investigation: score colour daily (1 green → 7 flecked)</text><rect x="80" y="400" width="300" height="130" rx="20" fill="none" stroke="#94a3b8" stroke-width="3" stroke-dasharray="8 5"/><path d="M 130 460 Q 170 500 210 460 Q 170 482 130 460 Z" fill="#84cc16" stroke="#713f12" stroke-width="2"/><path d="M 230 460 Q 270 500 310 460 Q 270 482 230 460 Z" fill="#84cc16" stroke="#713f12" stroke-width="2"/><text x="230" y="548" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">bananas only (control)</text><rect x="420" y="400" width="300" height="130" rx="20" fill="none" stroke="#94a3b8" stroke-width="3" stroke-dasharray="8 5"/><path d="M 470 460 Q 510 500 550 460 Q 510 482 470 460 Z" fill="#84cc16" stroke="#713f12" stroke-width="2"><animate attributeName="fill" keyTimes="0.0000;0.7000;0.8333;1.0000" values="#84cc16;#84cc16;#facc15;#facc15" dur="15s" begin="et-play.begin+0s" fill="freeze"/></path><path d="M 560 460 Q 600 500 640 460 Q 600 482 560 460 Z" fill="#84cc16" stroke="#713f12" stroke-width="2"><animate attributeName="fill" keyTimes="0.0000;0.7200;0.8533;1.0000" values="#84cc16;#84cc16;#facc15;#facc15" dur="15s" begin="et-play.begin+0s" fill="freeze"/></path><circle cx="680" cy="470" r="22" fill="#dc2626"/><text x="570" y="548" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">bananas + ripe apple</text><rect x="780" y="430" width="34" height="34" rx="6" fill="#65a30d" stroke="#334155"/><text x="797" y="482" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">1</text><rect x="818" y="430" width="34" height="34" rx="6" fill="#84cc16" stroke="#334155"/><text x="835" y="482" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">2</text><rect x="856" y="430" width="34" height="34" rx="6" fill="#a3e635" stroke="#334155"/><text x="873" y="482" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">3</text><rect x="894" y="430" width="34" height="34" rx="6" fill="#d9f99d" stroke="#334155"/><text x="911" y="482" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">4</text><rect x="932" y="430" width="34" height="34" rx="6" fill="#fde047" stroke="#334155"/><text x="949" y="482" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">5</text><rect x="970" y="430" width="34" height="34" rx="6" fill="#facc15" stroke="#334155"/><text x="987" y="482" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">6</text><rect x="1008" y="430" width="34" height="34" rx="6" fill="#a16207" stroke="#334155"/><text x="1025" y="482" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">7</text></g></g>
