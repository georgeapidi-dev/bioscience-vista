<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" class="vd-svg" role="img" aria-labelledby="cc-title cc-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="cc-play" data-vd-play-label="Play: one cycle" data-vd-steps="[[0, &quot;The cell cycle: interphase (G1, S, G2) followed by mitosis and cytokinesis. Watch the pointer go round.&quot;], [1, &quot;G1 phase: First growth phase: the cell grows, makes proteins and copies its organelles. Usually the longest phase.&quot;], [6.6, &quot;S phase (synthesis): DNA is replicated: each chromosome becomes two identical sister chromatids.&quot;], [10.52, &quot;G2 phase: Second growth phase: more growth, energy stores built up, and the cell prepares to divide.&quot;], [13.32, &quot;Mitosis: Nuclear division: prophase, metaphase, anaphase, telophase. Produces two genetically identical nuclei.&quot;], [14.44, &quot;Cytokinesis: The cytoplasm divides, forming two daughter cells.&quot;]]" data-vd-dur="16">
<title id="cc-title">The cell cycle</title><desc id="cc-desc">The cell cycle as a circle: G1, S and G2 make up interphase, then mitosis and cytokinesis; a cell in the centre grows, copies its chromosomes and divides.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1200" height="640" fill="#ffffff"/>
<g aria-hidden="true"><animate id="cc-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<text class="head" x="30" y="34">The cell cycle</text><text class="note" x="30" y="56">Proportions of time are typical, not fixed. Cell drawings show two pairs of chromosomes (2n = 4).</text>
<g class="part" data-part="g1" data-name="G1 phase" data-info="First growth phase: the cell grows, makes proteins and copies its organelles. Usually the longest phase." tabindex="0" role="button" aria-label="G1 phase"><path d="M 380.0 110.0 A 230 230 0 0 1 515.2 526.1 L 468.2 461.4 A 150 150 0 0 0 380.0 190.0 Z" fill="#86efac" stroke="#fff" stroke-width="3"/><text x="560.7" y="287.3" text-anchor="middle" font-size="18" font-weight="800">G1</text></g>
<g class="part" data-part="s" data-name="S phase (synthesis)" data-info="DNA is replicated: each chromosome becomes two identical sister chromatids." tabindex="0" role="button" aria-label="S phase (synthesis)"><path d="M 515.2 526.1 A 230 230 0 0 1 171.9 437.9 L 244.3 403.9 A 150 150 0 0 0 468.2 461.4 Z" fill="#fde68a" stroke="#fff" stroke-width="3"/><text x="332.7" y="530.0" text-anchor="middle" font-size="18" font-weight="800">S</text></g>
<g class="part" data-part="g2" data-name="G2 phase" data-info="Second growth phase: more growth, energy stores built up, and the cell prepares to divide." tabindex="0" role="button" aria-label="G2 phase"><path d="M 171.9 437.9 A 230 230 0 0 1 222.6 172.3 L 277.3 230.7 A 150 150 0 0 0 244.3 403.9 Z" fill="#93c5fd" stroke="#fff" stroke-width="3"/><text x="193.4" y="310.4" text-anchor="middle" font-size="18" font-weight="800">G2</text></g>
<g class="part" data-part="m" data-name="Mitosis" data-info="Nuclear division: prophase, metaphase, anaphase, telophase. Produces two genetically identical nuclei." tabindex="0" role="button" aria-label="Mitosis"><path d="M 222.6 172.3 A 230 230 0 0 1 322.8 117.2 L 342.7 194.7 A 150 150 0 0 0 277.3 230.7 Z" fill="#fca5a5" stroke="#fff" stroke-width="3"/><text x="288.5" y="179.5" text-anchor="middle" font-size="18" font-weight="800">M</text></g>
<g class="part" data-part="c" data-name="Cytokinesis" data-info="The cytoplasm divides, forming two daughter cells." tabindex="0" role="button" aria-label="Cytokinesis"><path d="M 322.8 117.2 A 230 230 0 0 1 380.0 110.0 L 380.0 190.0 A 150 150 0 0 0 342.7 194.7 Z" fill="#f9a8d4" stroke="#fff" stroke-width="3"/><text x="356.2" y="157.5" text-anchor="middle" font-size="14" font-weight="800">C</text></g>
<g class="part" data-part="int" data-name="Interphase" data-info="G1 + S + G2: most of the cycle. The cell is active, not resting." tabindex="0" role="button" aria-label="Interphase"><path d="M 380.0 92.0 A 248 248 0 1 1 210.2 159.2" fill="none" stroke="#15803d" stroke-width="4"/><text x="630" y="540" font-size="16" font-weight="800" fill="#15803d">INTERPHASE</text><text x="340" y="80" font-size="14" font-weight="800" fill="#b91c1c">MITOTIC PHASE</text></g>
<g class="part" data-part="g0" data-name="G0" data-info="Cells that stop dividing leave the cycle, e.g. most nerve and muscle cells." tabindex="0" role="button" aria-label="G0"><path d="M 530 160 q 60 -40 110 -20" fill="none" stroke="#64748b" stroke-width="2.5" stroke-dasharray="5 4"/><circle cx="670" cy="140" r="26" fill="#e2e8f0" stroke="#64748b"/><text x="670" y="146" text-anchor="middle" font-size="15" font-weight="700">G0</text></g>
<g transform="rotate(-90 380 340)"><animateTransform attributeName="transform" type="rotate" keyTimes="0.0000;0.0625;0.9375;1.0000" values="-90 380 340;-90 380 340;270 380 340;270 380 340" dur="16s" begin="cc-play.begin+0s" fill="freeze"/><line x1="380" y1="340" x2="516" y2="340" stroke="#111827" stroke-width="5"/><circle cx="380" cy="340" r="8" fill="#111827"/></g>
<g opacity="1"><animate attributeName="opacity" keyTimes="0.0000;0.4125;0.4131;1.0000" values="1;1;0;0" dur="16s" begin="cc-play.begin+0s" fill="freeze"/><circle cx="900" cy="330" r="90" fill="#fef3c7" stroke="#92400e" stroke-width="3"/><circle cx="900" cy="330" r="50" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/><path d="M 876 302 L 876 334" stroke="#dc2626" stroke-width="6" stroke-linecap="round"/><path d="M 894 328 L 894 360" stroke="#2563eb" stroke-width="6" stroke-linecap="round"/><path d="M 914 300 L 914 332" stroke="#f87171" stroke-width="6" stroke-linecap="round"/><path d="M 926 326 L 926 358" stroke="#60a5fa" stroke-width="6" stroke-linecap="round"/><text x="900" y="490" text-anchor="middle" font-size="14" font-weight="700">G1: one copy of each chromosome; the cell grows</text></g>
<g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.4125;0.4131;0.6575;0.6581;1.0000" values="0;0;1;1;0;0" dur="16s" begin="cc-play.begin+0s" fill="freeze"/><circle cx="900" cy="330" r="105" fill="#fef3c7" stroke="#92400e" stroke-width="3"/><circle cx="900" cy="330" r="50" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/><path d="M 872 302 L 872 334 M 880 302 L 880 334" stroke="#dc2626" stroke-width="6" stroke-linecap="round"/><path d="M 890 328 L 890 360 M 898 328 L 898 360" stroke="#2563eb" stroke-width="6" stroke-linecap="round"/><path d="M 910 300 L 910 332 M 918 300 L 918 332" stroke="#f87171" stroke-width="6" stroke-linecap="round"/><path d="M 922 326 L 922 358 M 930 326 L 930 358" stroke="#60a5fa" stroke-width="6" stroke-linecap="round"/><text x="900" y="490" text-anchor="middle" font-size="14" font-weight="700">S: DNA replicated: two sister chromatids each</text></g>
<g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.6575;0.6581;0.8325;0.8331;1.0000" values="0;0;1;1;0;0" dur="16s" begin="cc-play.begin+0s" fill="freeze"/><circle cx="900" cy="330" r="115" fill="#fef3c7" stroke="#92400e" stroke-width="3"/><circle cx="900" cy="330" r="50" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/><path d="M 872 302 L 872 334 M 880 302 L 880 334" stroke="#dc2626" stroke-width="6" stroke-linecap="round"/><path d="M 890 328 L 890 360 M 898 328 L 898 360" stroke="#2563eb" stroke-width="6" stroke-linecap="round"/><path d="M 910 300 L 910 332 M 918 300 L 918 332" stroke="#f87171" stroke-width="6" stroke-linecap="round"/><path d="M 922 326 L 922 358 M 930 326 L 930 358" stroke="#60a5fa" stroke-width="6" stroke-linecap="round"/><text x="900" y="490" text-anchor="middle" font-size="14" font-weight="700">G2: more growth; ready to divide</text></g>
<g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.8325;0.8331;0.9025;0.9031;1.0000" values="0;0;1;1;0;0" dur="16s" begin="cc-play.begin+0s" fill="freeze"/><circle cx="900" cy="330" r="115" fill="#fef3c7" stroke="#92400e" stroke-width="3"/><path d="M 896 271 L 896 299 M 904 271 L 904 299" stroke="#dc2626" stroke-width="6" stroke-linecap="round" transform="rotate(90 900 285)"/><path d="M 896 301 L 896 329 M 904 301 L 904 329" stroke="#2563eb" stroke-width="6" stroke-linecap="round" transform="rotate(90 900 315)"/><path d="M 896 331 L 896 359 M 904 331 L 904 359" stroke="#f87171" stroke-width="6" stroke-linecap="round" transform="rotate(90 900 345)"/><path d="M 896 361 L 896 389 M 904 361 L 904 389" stroke="#60a5fa" stroke-width="6" stroke-linecap="round" transform="rotate(90 900 375)"/><text x="900" y="490" text-anchor="middle" font-size="14" font-weight="700">Mitosis (metaphase shown): chromosomes line up</text></g>
<g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.9025;0.9031;1.0000" values="0;0;1;1" dur="16s" begin="cc-play.begin+0s" fill="freeze"/><circle cx="830" cy="330" r="70" fill="#fef3c7" stroke="#92400e" stroke-width="3"/><circle cx="970" cy="330" r="70" fill="#fef3c7" stroke="#92400e" stroke-width="3"/><circle cx="830" cy="330" r="34" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/><path d="M 816 312 L 816 332" stroke="#dc2626" stroke-width="5" stroke-linecap="round"/><path d="M 826 330 L 826 350" stroke="#2563eb" stroke-width="5" stroke-linecap="round"/><path d="M 838 310 L 838 330" stroke="#f87171" stroke-width="5" stroke-linecap="round"/><path d="M 846 328 L 846 348" stroke="#60a5fa" stroke-width="5" stroke-linecap="round"/><circle cx="970" cy="330" r="34" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/><path d="M 956 312 L 956 332" stroke="#dc2626" stroke-width="5" stroke-linecap="round"/><path d="M 966 330 L 966 350" stroke="#2563eb" stroke-width="5" stroke-linecap="round"/><path d="M 978 310 L 978 330" stroke="#f87171" stroke-width="5" stroke-linecap="round"/><path d="M 986 328 L 986 348" stroke="#60a5fa" stroke-width="5" stroke-linecap="round"/><text x="900" y="490" text-anchor="middle" font-size="14" font-weight="700">Cytokinesis: two identical daughter cells</text></g>
</svg>