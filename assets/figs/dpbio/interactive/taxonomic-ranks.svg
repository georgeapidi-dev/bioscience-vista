<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 580" class="vd-svg" role="img" aria-labelledby="tr-title tr-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="tr-play" data-vd-play-label="Play: classify a lion" data-vd-steps="[[0, &quot;Classifying the lion.&quot;], [1, &quot;Seven ranks, from kingdom down to species.&quot;], [8, &quot;The binomial name: genus + species, in italics.&quot;], [11, &quot;But fixed ranks do not always fit evolution: birds evolved from reptiles.&quot;]]" data-vd-dur="15">
<title id="tr-title">Taxonomic ranks and binomial names</title><desc id="tr-desc">The seven ranks from kingdom Animalia to species leo for the lion, the binomial name Panthera leo with its rules, and a small cladogram showing birds nested within reptiles.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="580" fill="#ffffff"/>
<g aria-hidden="true"><animate id="tr-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<text class="head" x="30" y="34">Taxonomic ranks and binomial names</text><text class="note" x="30" y="56">Example: the lion.</text>
<g class="part" data-part="ranks" data-name="The hierarchy of ranks" data-info="Kingdom, phylum, class, order, family, genus, species: each rank contains fewer, more closely related organisms." tabindex="0" role="button" aria-label="The hierarchy of ranks"><g><animate attributeName="opacity" keyTimes="0.0000;0.0667;0.0867;1.0000" values="0;0;1;1" dur="15s" begin="tr-play.begin+0s" fill="freeze"/><rect x="40.0" y="80" width="560" height="50" rx="10" fill="#fee2e2" stroke="#475569" stroke-width="1.5"/><text x="54.0" y="111" text-anchor="start" font-size="14" font-weight="800" fill="#111827">Kingdom</text><text x="586.0" y="111" text-anchor="end" font-size="14" font-weight="700" fill="#1f2937">Animalia</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.1267;0.1467;1.0000" values="0;0;1;1" dur="15s" begin="tr-play.begin+0s" fill="freeze"/><rect x="71.0" y="138" width="498" height="50" rx="10" fill="#ffedd5" stroke="#475569" stroke-width="1.5"/><text x="85.0" y="169" text-anchor="start" font-size="14" font-weight="800" fill="#111827">Phylum</text><text x="555.0" y="169" text-anchor="end" font-size="14" font-weight="700" fill="#1f2937">Chordata</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.1867;0.2067;1.0000" values="0;0;1;1" dur="15s" begin="tr-play.begin+0s" fill="freeze"/><rect x="102.0" y="196" width="436" height="50" rx="10" fill="#fef9c3" stroke="#475569" stroke-width="1.5"/><text x="116.0" y="227" text-anchor="start" font-size="14" font-weight="800" fill="#111827">Class</text><text x="524.0" y="227" text-anchor="end" font-size="14" font-weight="700" fill="#1f2937">Mammalia</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.2467;0.2667;1.0000" values="0;0;1;1" dur="15s" begin="tr-play.begin+0s" fill="freeze"/><rect x="133.0" y="254" width="374" height="50" rx="10" fill="#dcfce7" stroke="#475569" stroke-width="1.5"/><text x="147.0" y="285" text-anchor="start" font-size="14" font-weight="800" fill="#111827">Order</text><text x="493.0" y="285" text-anchor="end" font-size="14" font-weight="700" fill="#1f2937">Carnivora</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.3067;0.3267;1.0000" values="0;0;1;1" dur="15s" begin="tr-play.begin+0s" fill="freeze"/><rect x="164.0" y="312" width="312" height="50" rx="10" fill="#cffafe" stroke="#475569" stroke-width="1.5"/><text x="178.0" y="343" text-anchor="start" font-size="14" font-weight="800" fill="#111827">Family</text><text x="462.0" y="343" text-anchor="end" font-size="14" font-weight="700" fill="#1f2937">Felidae</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.3667;0.3867;1.0000" values="0;0;1;1" dur="15s" begin="tr-play.begin+0s" fill="freeze"/><rect x="195.0" y="370" width="250" height="50" rx="10" fill="#dbeafe" stroke="#475569" stroke-width="1.5"/><text x="209.0" y="401" text-anchor="start" font-size="14" font-weight="800" fill="#111827">Genus</text><text font-style="italic" x="431.0" y="401" text-anchor="end" font-size="14" font-weight="700" fill="#1f2937">Panthera</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.4267;0.4467;1.0000" values="0;0;1;1" dur="15s" begin="tr-play.begin+0s" fill="freeze"/><rect x="226.0" y="428" width="188" height="50" rx="10" fill="#ede9fe" stroke="#475569" stroke-width="1.5"/><text x="240.0" y="459" text-anchor="start" font-size="14" font-weight="800" fill="#111827">Species</text><text font-style="italic" x="400.0" y="459" text-anchor="end" font-size="14" font-weight="700" fill="#1f2937">leo</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.5000;0.5200;1.0000" values="0;0;1;1" dur="15s" begin="tr-play.begin+0s" fill="freeze"/><text x="320" y="498" text-anchor="middle" font-size="12" font-weight="700" fill="#475569">each rank: fewer organisms, more closely related</text></g></g>
<g class="part" data-part="bin" data-name="Binomial name" data-info="Genus with a capital initial, species name all lower case, both in italics (underlined when handwritten): Panthera leo. After first use: P. leo." tabindex="0" role="button" aria-label="Binomial name"><g><animate attributeName="opacity" keyTimes="0.0000;0.5333;0.5533;1.0000" values="0;0;1;1" dur="15s" begin="tr-play.begin+0s" fill="freeze"/><rect x="620" y="90" width="450" height="190" rx="16" fill="#f5f3ff" stroke="#a78bfa"/><text x="845" y="150" text-anchor="middle" font-size="34" font-weight="700" font-style="italic" fill="#5b21b6">Panthera leo</text><text x="735" y="180" text-anchor="middle" font-size="12" font-weight="800" fill="#5b21b6">genus: capital initial</text><text x="930" y="180" text-anchor="middle" font-size="12" font-weight="800" fill="#5b21b6">species: lower case</text><text x="845" y="214" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">both in italics; underline when handwritten</text><text x="845" y="240" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">shortened after first use: P. leo</text></g></g>
<g class="part" data-part="trouble" data-name="Trouble with ranks" data-info="Fixed ranks do not always match evolution: birds evolved from reptiles, so the traditional class &quot;Reptilia&quot; does not include all descendants of their common ancestor." tabindex="0" role="button" aria-label="Trouble with ranks"><g><animate attributeName="opacity" keyTimes="0.0000;0.7333;0.7533;1.0000" values="0;0;1;1" dur="15s" begin="tr-play.begin+0s" fill="freeze"/><rect x="620" y="300" width="450" height="250" rx="16" fill="#fff7ed" stroke="#fdba74"/><text x="845" y="326" text-anchor="middle" font-size="14" font-weight="800" fill="#c2410c">Trouble with ranks</text><text x="700" y="410" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">lizards</text><text x="780" y="410" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">snakes</text><text x="860" y="410" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">crocodiles</text><text x="940" y="410" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">birds</text><path d="M 700 420 L 740 460 L 780 420 M 860 420 L 900 460 L 940 420 M 740 460 L 820 510 L 900 460" fill="none" stroke="#475569" stroke-width="3"/><rect x="668" y="392" width="230" height="36" rx="10" fill="#fde68a" opacity=".35" stroke="#d97706" stroke-dasharray="6 4"/><text x="700" y="540" text-anchor="start" font-size="12" font-weight="800" fill="#b45309">traditional "Reptilia" leaves out birds</text></g></g>
</svg>