<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 600" class="vd-svg" role="img" aria-labelledby="mu-title mu-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="mu-play" data-vd-play-label="Play: make a mule" data-vd-steps="[[0, &quot;Can they breed? Horse \u00d7 donkey.&quot;], [1, &quot;Horse: 64 chromosomes; donkey: 62.&quot;], [3, &quot;Their gametes carry 32 and 31.&quot;], [5.5, &quot;Fertilisation gives a mule with 63 chromosomes.&quot;], [8.5, &quot;In meiosis the chromosomes cannot all pair up: no viable gametes.&quot;], [12, &quot;Infertile hybrids: horses and donkeys are separate species.&quot;]]" data-vd-dur="15">
<title id="mu-title">Hybrids and chromosome number</title><desc id="mu-desc">A horse with 64 chromosomes and a donkey with 62 produce gametes with 32 and 31; the mule has 63 chromosomes that cannot all pair as homologues in meiosis, so it is infertile, showing horses and donkeys are separate species.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="600" fill="#ffffff"/>
<g aria-hidden="true"><animate id="mu-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<defs><marker id="mu-475569" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="6.3" refY="7.0" orient="auto"><path d="M0,0 L14,7.0 L0,14 z" fill="#475569"/></marker></defs>
<text class="head" x="30" y="34">Hybrids: why a mule is infertile</text><text class="note" x="30" y="56">Chromosome numbers in body cells (2n).</text>
<g class="part" data-part="par" data-name="Two species" data-info="Horse (64 chromosomes in body cells) and donkey (62)." tabindex="0" role="button" aria-label="Two species"><g><animate attributeName="opacity" keyTimes="0.0000;0.0667;0.0867;1.0000" values="0;0;1;1" dur="15s" begin="mu-play.begin+0s" fill="freeze"/><ellipse cx="170" cy="170" rx="70" ry="32" fill="#a16207" stroke="#334155" stroke-width="2"/><path d="M 220 152 L 252 108 L 274 118 L 246 164 Z" fill="#a16207" stroke="#334155" stroke-width="2"/><path d="M 252 108 l -2 -12 8 8" fill="#a16207" stroke="#334155" stroke-width="2"/><rect x="114" y="194" width="10" height="46" fill="#a16207" stroke="#334155"/><rect x="134" y="194" width="10" height="46" fill="#a16207" stroke="#334155"/><rect x="200" y="194" width="10" height="46" fill="#a16207" stroke="#334155"/><rect x="218" y="194" width="10" height="46" fill="#a16207" stroke="#334155"/><text x="180" y="266" text-anchor="middle" font-size="14" font-weight="800" fill="#111827">horse</text><text x="180" y="286" text-anchor="middle" font-size="13" font-weight="800" fill="#1d4ed8">2n = 64</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.1000;0.1200;1.0000" values="0;0;1;1" dur="15s" begin="mu-play.begin+0s" fill="freeze"/><ellipse cx="820" cy="170" rx="70" ry="32" fill="#9ca3af" stroke="#334155" stroke-width="2"/><path d="M 870 152 L 902 108 L 924 118 L 896 164 Z" fill="#9ca3af" stroke="#334155" stroke-width="2"/><path d="M 902 108 l -4 -30 10 24" fill="#9ca3af" stroke="#334155" stroke-width="2"/><rect x="764" y="194" width="10" height="46" fill="#9ca3af" stroke="#334155"/><rect x="784" y="194" width="10" height="46" fill="#9ca3af" stroke="#334155"/><rect x="850" y="194" width="10" height="46" fill="#9ca3af" stroke="#334155"/><rect x="868" y="194" width="10" height="46" fill="#9ca3af" stroke="#334155"/><text x="830" y="266" text-anchor="middle" font-size="14" font-weight="800" fill="#111827">donkey</text><text x="830" y="286" text-anchor="middle" font-size="13" font-weight="800" fill="#1d4ed8">2n = 62</text></g></g>
<g class="part" data-part="gam" data-name="Gametes" data-info="Horse gametes carry 32 chromosomes; donkey gametes carry 31." tabindex="0" role="button" aria-label="Gametes"><g><animate attributeName="opacity" keyTimes="0.0000;0.2000;0.2200;1.0000" values="0;0;1;1" dur="15s" begin="mu-play.begin+0s" fill="freeze"/><circle cx="340" cy="320" r="34" fill="#fef3c7" stroke="#a16207" stroke-width="2"/><text x="340" y="325" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">n = 32</text><circle cx="760" cy="320" r="34" fill="#f1f5f9" stroke="#475569" stroke-width="2"/><text x="760" y="325" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">n = 31</text><path d="M 230 250 L 310 305" stroke="#475569" stroke-width="2.5" marker-end="url(#mu-475569)"/><path d="M 880 250 L 795 305" stroke="#475569" stroke-width="2.5" marker-end="url(#mu-475569)"/><text x="550" y="280" text-anchor="middle" font-size="13" font-weight="800" fill="#475569">gametes</text></g></g>
<g class="part" data-part="mule" data-name="Mule: a hybrid" data-info="32 + 31 = 63 chromosomes. A healthy animal, but infertile." tabindex="0" role="button" aria-label="Mule: a hybrid"><g><animate attributeName="opacity" keyTimes="0.0000;0.3667;0.3867;1.0000" values="0;0;1;1" dur="15s" begin="mu-play.begin+0s" fill="freeze"/><path d="M 375 310 L 500 380 M 725 310 L 600 380" stroke="#475569" stroke-width="2.5" marker-end="url(#mu-475569)"/><ellipse cx="500" cy="420" rx="70" ry="32" fill="#78716c" stroke="#334155" stroke-width="2"/><path d="M 550 402 L 582 358 L 604 368 L 576 414 Z" fill="#78716c" stroke="#334155" stroke-width="2"/><path d="M 582 358 l -4 -30 10 24" fill="#78716c" stroke="#334155" stroke-width="2"/><rect x="444" y="444" width="10" height="46" fill="#78716c" stroke="#334155"/><rect x="464" y="444" width="10" height="46" fill="#78716c" stroke="#334155"/><rect x="530" y="444" width="10" height="46" fill="#78716c" stroke="#334155"/><rect x="548" y="444" width="10" height="46" fill="#78716c" stroke="#334155"/><text x="510" y="516" text-anchor="middle" font-size="14" font-weight="800" fill="#111827">mule</text><text x="510" y="536" text-anchor="middle" font-size="13" font-weight="800" fill="#1d4ed8">2n = 63</text></g></g>
<g class="part" data-part="mei" data-name="Why infertile?" data-info="In meiosis, chromosomes must pair as homologues. With an odd set of unmatched chromosomes, many cannot pair, so viable gametes are not made." tabindex="0" role="button" aria-label="Why infertile?"><g><animate attributeName="opacity" keyTimes="0.0000;0.5667;0.5867;1.0000" values="0;0;1;1" dur="15s" begin="mu-play.begin+0s" fill="freeze"/><rect x="740" y="370" width="330" height="210" rx="16" fill="#f8fafc" stroke="#cbd5e1"/><text x="905" y="396" text-anchor="middle" font-size="14" font-weight="800" fill="#111827">meiosis in the mule</text><rect x="780" y="420" width="10" height="56" rx="5" fill="#a16207"/><rect x="794" y="420" width="10" height="56" rx="5" fill="#9ca3af"/><text x="792" y="492" text-anchor="middle" font-size="14" font-weight="800" fill="#15803d">✓</text><rect x="836" y="420" width="10" height="56" rx="5" fill="#a16207"/><rect x="850" y="420" width="10" height="56" rx="5" fill="#9ca3af"/><text x="848" y="492" text-anchor="middle" font-size="14" font-weight="800" fill="#15803d">✓</text><rect x="892" y="420" width="10" height="56" rx="5" fill="#a16207"/><rect x="906" y="420" width="10" height="56" rx="5" fill="#9ca3af"/><text x="904" y="492" text-anchor="middle" font-size="14" font-weight="800" fill="#15803d">✓</text><rect x="954" y="420" width="10" height="56" rx="5" fill="#a16207"/><text x="960" y="492" text-anchor="middle" font-size="14" font-weight="800" fill="#b91c1c">✗</text><rect x="1010" y="420" width="10" height="40" rx="5" fill="#9ca3af"/><text x="1016" y="492" text-anchor="middle" font-size="14" font-weight="800" fill="#b91c1c">✗</text><text x="905" y="520" text-anchor="middle" font-size="12" font-weight="800" fill="#b91c1c">unmatched chromosomes cannot pair</text><text x="905" y="540" text-anchor="middle" font-size="12" font-weight="800" fill="#b91c1c">→ no viable gametes → infertile</text></g></g>
<g class="part" data-part="conc" data-name="Species concept" data-info="If two groups only produce infertile hybrids, they are separate species." tabindex="0" role="button" aria-label="Species concept"><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.8000;0.8200;1.0000" values="0;0;1;1" dur="15s" begin="mu-play.begin+0s" fill="freeze"/><rect x="90.0" y="558" width="340" height="24" rx="12" fill="#dcfce7" stroke="#1f2937" stroke-width="1"/><text x="260" y="575" text-anchor="middle" font-size="12" font-weight="700">only infertile hybrids → separate species</text></g></g>
</svg>