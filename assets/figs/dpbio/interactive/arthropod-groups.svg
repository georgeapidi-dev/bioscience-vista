<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" class="vd-svg" role="img" aria-labelledby="ar-title ar-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="ar-play" data-vd-play-label="Play: count the legs" data-vd-steps="[[0, &quot;Arthropods: jointed legs and an exoskeleton.&quot;], [1, &quot;Count legs, body parts and antennae.&quot;]]" data-vd-dur="12">
<title id="ar-title">Groups of arthropods</title><desc id="ar-desc">Insects with three pairs of legs and three body parts, arachnids with four pairs of legs and two body parts, crustaceans with more than four pairs of legs and two pairs of antennae, and myriapods with many segments and legs on every segment.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="560" fill="#ffffff"/>
<g aria-hidden="true"><animate id="ar-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<text class="head" x="30" y="34">Four groups of arthropods</text><text class="note" x="30" y="56">Schematic body plans (not to scale).</text>
<g class="part" data-part="tab" data-name="Four groups" data-info="All arthropods have jointed legs, a segmented body and an exoskeleton. Count legs, body parts and antennae to place them." tabindex="0" role="button" aria-label="Four groups"><g><animate attributeName="opacity" keyTimes="0.0000;0.0833;0.1083;1.0000" values="0;0;1;1" dur="12s" begin="ar-play.begin+0s" fill="freeze"/><rect x="40" y="90" width="1020" height="100" rx="14" fill="#fff" stroke="#f59e0b" stroke-width="2"/><ellipse cx="120" cy="140" rx="20" ry="16" fill="#f59e0b" stroke="#334155"/><ellipse cx="154" cy="140" rx="20" ry="16" fill="#f59e0b" stroke="#334155"/><ellipse cx="188" cy="140" rx="20" ry="16" fill="#f59e0b" stroke="#334155"/><line x1="120" y1="140" x2="112" y2="172" stroke="#334155" stroke-width="2"/><line x1="120" y1="140" x2="112" y2="108" stroke="#334155" stroke-width="2"/><line x1="150" y1="140" x2="142" y2="172" stroke="#334155" stroke-width="2"/><line x1="150" y1="140" x2="142" y2="108" stroke="#334155" stroke-width="2"/><line x1="180" y1="140" x2="172" y2="172" stroke="#334155" stroke-width="2"/><line x1="180" y1="140" x2="172" y2="108" stroke="#334155" stroke-width="2"/><path d="M 100 134 q -20 -20 -36 -10" fill="none" stroke="#334155" stroke-width="2"/><text x="330" y="132" text-anchor="start" font-size="18" font-weight="800" fill="#f59e0b">insects</text><text x="330" y="162" text-anchor="start" font-size="13" font-weight="700" fill="#111827">3 pairs of legs; 3 body parts (head, thorax, abdomen); 1 pair of antennae; usually wings</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.2500;0.2750;1.0000" values="0;0;1;1" dur="12s" begin="ar-play.begin+0s" fill="freeze"/><rect x="40" y="205" width="1020" height="100" rx="14" fill="#fff" stroke="#7c3aed" stroke-width="2"/><ellipse cx="120" cy="255" rx="20" ry="16" fill="#7c3aed" stroke="#334155"/><ellipse cx="154" cy="255" rx="20" ry="16" fill="#7c3aed" stroke="#334155"/><line x1="120" y1="255" x2="112" y2="287" stroke="#334155" stroke-width="2"/><line x1="120" y1="255" x2="112" y2="223" stroke="#334155" stroke-width="2"/><line x1="140" y1="255" x2="132" y2="287" stroke="#334155" stroke-width="2"/><line x1="140" y1="255" x2="132" y2="223" stroke="#334155" stroke-width="2"/><line x1="160" y1="255" x2="152" y2="287" stroke="#334155" stroke-width="2"/><line x1="160" y1="255" x2="152" y2="223" stroke="#334155" stroke-width="2"/><line x1="180" y1="255" x2="172" y2="287" stroke="#334155" stroke-width="2"/><line x1="180" y1="255" x2="172" y2="223" stroke="#334155" stroke-width="2"/><text x="330" y="247" text-anchor="start" font-size="18" font-weight="800" fill="#7c3aed">arachnids</text><text x="330" y="277" text-anchor="start" font-size="13" font-weight="700" fill="#111827">4 pairs of legs; 2 body parts; no antennae</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.4167;0.4417;1.0000" values="0;0;1;1" dur="12s" begin="ar-play.begin+0s" fill="freeze"/><rect x="40" y="320" width="1020" height="100" rx="14" fill="#fff" stroke="#dc2626" stroke-width="2"/><ellipse cx="120" cy="370" rx="20" ry="16" fill="#dc2626" stroke="#334155"/><ellipse cx="154" cy="370" rx="20" ry="16" fill="#dc2626" stroke="#334155"/><line x1="120" y1="370" x2="112" y2="402" stroke="#334155" stroke-width="2"/><line x1="120" y1="370" x2="112" y2="338" stroke="#334155" stroke-width="2"/><line x1="135" y1="370" x2="127" y2="402" stroke="#334155" stroke-width="2"/><line x1="135" y1="370" x2="127" y2="338" stroke="#334155" stroke-width="2"/><line x1="150" y1="370" x2="142" y2="402" stroke="#334155" stroke-width="2"/><line x1="150" y1="370" x2="142" y2="338" stroke="#334155" stroke-width="2"/><line x1="165" y1="370" x2="157" y2="402" stroke="#334155" stroke-width="2"/><line x1="165" y1="370" x2="157" y2="338" stroke="#334155" stroke-width="2"/><line x1="180" y1="370" x2="172" y2="402" stroke="#334155" stroke-width="2"/><line x1="180" y1="370" x2="172" y2="338" stroke="#334155" stroke-width="2"/><path d="M 100 364 q -20 -20 -36 -10" fill="none" stroke="#334155" stroke-width="2"/><path d="M 100 364 q -20 -20 -36 -20" fill="none" stroke="#334155" stroke-width="2"/><text x="330" y="362" text-anchor="start" font-size="18" font-weight="800" fill="#dc2626">crustaceans</text><text x="330" y="392" text-anchor="start" font-size="13" font-weight="700" fill="#111827">more than 4 pairs of jointed legs; 2 pairs of antennae; exoskeleton often hardened with calcium</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.5833;0.6083;1.0000" values="0;0;1;1" dur="12s" begin="ar-play.begin+0s" fill="freeze"/><rect x="40" y="435" width="1020" height="100" rx="14" fill="#fff" stroke="#65a30d" stroke-width="2"/><ellipse cx="120" cy="485" rx="9" ry="16" fill="#65a30d" stroke="#334155"/><ellipse cx="136" cy="485" rx="9" ry="16" fill="#65a30d" stroke="#334155"/><ellipse cx="152" cy="485" rx="9" ry="16" fill="#65a30d" stroke="#334155"/><ellipse cx="168" cy="485" rx="9" ry="16" fill="#65a30d" stroke="#334155"/><ellipse cx="184" cy="485" rx="9" ry="16" fill="#65a30d" stroke="#334155"/><ellipse cx="200" cy="485" rx="9" ry="16" fill="#65a30d" stroke="#334155"/><ellipse cx="216" cy="485" rx="9" ry="16" fill="#65a30d" stroke="#334155"/><ellipse cx="232" cy="485" rx="9" ry="16" fill="#65a30d" stroke="#334155"/><line x1="120" y1="485" x2="112" y2="517" stroke="#334155" stroke-width="2"/><line x1="120" y1="485" x2="112" y2="453" stroke="#334155" stroke-width="2"/><line x1="133" y1="485" x2="125" y2="517" stroke="#334155" stroke-width="2"/><line x1="133" y1="485" x2="125" y2="453" stroke="#334155" stroke-width="2"/><line x1="146" y1="485" x2="138" y2="517" stroke="#334155" stroke-width="2"/><line x1="146" y1="485" x2="138" y2="453" stroke="#334155" stroke-width="2"/><line x1="158" y1="485" x2="150" y2="517" stroke="#334155" stroke-width="2"/><line x1="158" y1="485" x2="150" y2="453" stroke="#334155" stroke-width="2"/><line x1="171" y1="485" x2="163" y2="517" stroke="#334155" stroke-width="2"/><line x1=