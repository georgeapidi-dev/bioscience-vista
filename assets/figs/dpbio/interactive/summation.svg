<g class="part" data-part="epsp" data-name="EPSPs" data-info="Excitatory neurotransmitters depolarise the postsynaptic membrane by a few mV each." tabindex="0" role="button" aria-label="EPSPs"><g><animate attributeName="opacity" keyTimes="0.0000;0.1429;0.1643;1.0000" values="0;0;1;1" dur="14s" begin="sm-play.begin+0s" fill="freeze"/><text x="233.0" y="406.6666666666667" text-anchor="middle" font-size="12" font-weight="800" fill="#1d4ed8">one EPSP: below threshold</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.3571;0.3786;1.0000" values="0;0;1;1" dur="14s" begin="sm-play.begin+0s" fill="freeze"/><text x="530.0" y="121.66666666666669" text-anchor="start" font-size="12" font-weight="800" fill="#1d4ed8">several EPSPs summate →</text><text x="530.0" y="153.33333333333331" text-anchor="start" font-size="12" font-weight="800" fill="#1d4ed8">action potential</text></g></g>
