<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 540" class="vd-svg" role="img" aria-labelledby="sm-title sm-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="sm-play" data-vd-play-label="Play: add up inputs" data-vd-steps="[[0, &quot;One neuron, many inputs: summation.&quot;], [1, &quot;One EPSP alone: a small depolarisation, below threshold.&quot;], [4, &quot;Several EPSPs together add up and reach threshold: action potential!&quot;], [8.5, &quot;An IPSP hyperpolarises, cancelling out EPSPs.&quot;]]" data-vd-dur="14">
<title id="sm-title">Summation of postsynaptic potentials</title><desc id="sm-desc">Membrane potential of a postsynaptic neuron: a single EPSP stays below the threshold of about minus 55 millivolts, several EPSPs together summate to threshold and trigger an action potential, and an IPSP hyperpolarises the membrane.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="540" fill="#ffffff"/>
<g aria-hidden="true"><animate id="sm-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<text class="head" x="30" y="34">Adding up the inputs: summation</text><text class="note" x="30" y="56">Illustrative trace.</text>
