<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 680" class="vd-svg" role="img" aria-labelledby="aa-title aa-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="aa-play" data-vd-play-label="Play: change the R group" data-vd-steps="[[0, &quot;Amino acids: the building blocks of proteins.&quot;], [1, &quot;Every amino acid has the same backbone: amine group, alpha carbon, carboxyl group and a hydrogen.&quot;], [3.5, &quot;Only the R group differs.&quot;], [5, &quot;Watch the R group change: glycine, alanine, serine, aspartic acid, lysine, phenylalanine.&quot;], [12, &quot;R groups can be non-polar, polar, acidic or basic: this decides how the protein folds.&quot;]]" data-vd-dur="15">
<title id="aa-title">Amino acid structure</title><desc id="aa-desc">The general structure of an amino acid with amine group, alpha carbon, hydrogen, carboxyl group and R group, and six examples with different R groups grouped by their properties.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1220" height="680" fill="#ffffff"/>
<g aria-hidden="true"><animate id="aa-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<text class="head" x="30" y="34">Amino acids: same backbone, different R groups</text><text class="note" x="30" y="56">Shown un-ionised in the general formula; in cells the groups are –NH₃⁺ and –COO⁻.</text>
<g class="part" data-part="gen" data-name="General structure" data-info="A central (alpha) carbon bonded to an amine group, a carboxyl group, a hydrogen atom and a variable R group." tabindex="0" role="button" aria-label="General structure"><line x1="240.0" y1="300.0" x2="330.0" y2="300.0" stroke="#111827" stroke-width="3"/><line x1="330.0" y1="300.0" x2="420.0" y2="300.0" stroke="#111827" stroke-width="3"/><line x1="330.0" y1="300.0" x2="330.0" y2="380.0" stroke="#111827" stroke-width="3"/><line x1="330.0" y1="300.0" x2="330.0" y2="220.0" stroke="#111827" stroke-width="3"/><circle cx="330.0" cy="300.0" r="24" fill="#374151" stroke="#111827" stroke-width="1.5"/><text x="330" y="305" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">Cα</text><circle cx="330.0" cy="380.0" r="15" fill="#f3f4f6" stroke="#111827" stroke-width="1.5"/><text x="330" y="385" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">H</text></g>
<g class="part" data-part="amine" data-name="Amine group (–NH₂)" data-info="Basic; becomes –NH₃⁺ at the pH in cells." tabindex="0" role="button" aria-label="Amine group (–NH₂)"><g><animate attributeName="opacity" keyTimes="0.0000;0.0667;0.0867;1.0000" values="0;0;1;1" dur="15s" begin="aa-play.begin+0s" fill="freeze"/><rect x="130" y="250" width="120" height="100" rx="14" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/><line x1="180.0" y1="300.0" x2="180.0" y2="266.0" stroke="#111827" stroke-width="3"/><line x1="180.0" y1="300.0" x2="180.0" y2="334.0" stroke="#111827" stroke-width="3"/><circle cx="180.0" cy="300.0" r="18" fill="#3b82f6" stroke="#111827" stroke-width="1.5"/><text x="180" y="305" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">N</text><circle cx="180.0" cy="266.0" r="12" fill="#f3f4f6" stroke="#111827" stroke-width="1.5"/><text x="180" y="271" text-anchor="middle" font-size="11" font-weight="800" fill="#111827">H</text><circle cx="180.0" cy="334.0" r="12" fill="#f3f4f6" stroke="#111827" stroke-width="1.5"/><text x="180" y="339" text-anchor="middle" font-size="11" font-weight="800" fill="#111827">H</text><text x="190" y="240" text-anchor="middle" font-size="13" font-weight="800" fill="#1d4ed8">amine group</text></g></g>
<g class="part" data-part="carb" data-name="Carboxyl group (–COOH)" data-info="Acidic; becomes –COO⁻ in cells." tabindex="0" role="button" aria-label="Carboxyl group (–COOH)"><g><animate attributeName="opacity" keyTimes="0.0000;0.0667;0.0867;1.0000" values="0;0;1;1" dur="15s" begin="aa-play.begin+0s" fill="freeze"/><rect x="400" y="210" width="150" height="150" rx="14" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/><line x1="444.0" y1="300.0" x2="444.0" y2="240.0" stroke="#111827" stroke-width="3"/><line x1="436.0" y1="300.0" x2="436.0" y2="240.0" stroke="#111827" stroke-width="3"/><line x1="440.0" y1="300.0" x2="510.0" y2="300.0" stroke="#111827" stroke-width="3"/><line x1="510.0" y1="300.0" x2="510.0" y2="336.0" stroke="#111827" stroke-width="3"/><circle cx="440.0" cy="300.0" r="18" fill="#374151" stroke="#111827" stroke-width="1.5"/><text x="440" y="305" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">C</text><circle cx="440.0" cy="240.0" r="18" fill="#ef4444" stroke="#111827" stroke-width="1.5"/><text x="440" y="245" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">O</text><circle cx="510.0" cy="300.0" r="18" fill="#ef4444" stroke="#111827" stroke-width="1.5"/><text x="510" y="305" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">O</text><circle cx="510.0" cy="336.0" r="12" fill="#f3f4f6" stroke="#111827" stroke-width="1.5"/><text x="510" y="341" text-anchor="middle" font-size="11" font-weight="800" fill="#111827">H</text><text x="475" y="384" text-anchor="middle" font-size="13" font-weight="800" fill="#b91c1c">carboxyl group</text></g></g>
<g class="part" data-part="r" data-name="R group" data-info="The only part that differs. 20 different R groups in the amino acids coded for by DNA." tabindex="0" role="button" aria-label="R group"><g><animate attributeName="opacity" keyTimes="0.0000;0.2333;0.2533;1.0000" values="0;0;1;1" dur="15s" begin="aa-play.begin+0s" fill="freeze"/><rect x="260" y="150" width="140" height="56" rx="14" fill="#fef9c3" stroke="#ca8a04" stroke-width="3"/><g><animate attributeName="opacity" keyTimes="0.0000;0.3333;0.3467;1.0000" values="1;1;0;0" dur="15s" begin="aa-play.begin+0s" fill="freeze"/><text x="330" y="186" text-anchor="middle" font-size="22" font-weight="800" fill="#111827">R</text></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.3333;0.3467;0.4000;0.4067;1.0000" values="0;0;1;1;0;0" dur="15s" begin="aa-play.begin+0s" fill="freeze"/><text x="330" y="186" text-anchor="middle" font-size="18" font-weight="800" fill="#111827">H</text><text x="330" y="134" text-anchor="middle" font-size="14" font-weight="800" fill="#92400e">glycine (simplest)</text></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.4067;0.4200;0.4733;0.4800;1.0000" values="0;0;1;1;0;0" dur="15s" begin="aa-play.begin+0s" fill="freeze"/><text x="330" y="186" text-anchor="middle" font-size="18" font-weight="800" fill="#111827">CH₃</text><text x="330" y="134" text-anchor="middle" font-size="14" font-weight="800" fill="#92400e">alanine (non-polar)</text></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.4800;0.4933;0.5467;0.5533;1.0000" values="0;0;1;1;0;0" dur="15s" begin="aa-play.begin+0s" fill="freeze"/><text x="330" y="186" text-anchor="middle" font-size="18" font-weight="800" fill="#111827">CH₂OH</text><text x="330" y="134" text-anchor="middle" font-size="14" font-weight="800" fill="#92400e">serine (polar)</text></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.5533;0.5667;0.6200;0.6267;1.0000" values="0;0;1;1;0;0" dur="15s" begin="aa-play.begin+0s" fill="freeze"/><text x="330" y="186" text-anchor="middle" font-size="18" font-weight="800" fill="#111827">CH₂COO⁻</text><text x="330" y="134" text-anchor="middle" font-size="14" font-weight="800" fill="#92400e">aspartic acid (acidic (−))</text></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.6267;0.6400;0.6933;0.7000;1.0000" values="0;0;1;1;0;0" dur="15s" begin="aa-play.begin+0s" fill="freeze"/><text x="330" y="186" text-anchor="middle" font-size="18" font-weight="800" fill="#111827">(CH₂)₄NH₃⁺</text><text x="330" y="134" text-anchor="middle" font-size="14" font-weight="800" fill="#92400e">lysine (basic (+))</text></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.7000;0.7133;1.0000" values="0;0;1;1" dur="15s" begin="aa-play.begin+0s" fill="freeze"/><text x="330" y="186" text-anchor="middle" font-size="18" font-weight="800" fill="#111827">CH₂–⬡</text><text x="330" y="134" text-anchor="middle" font-size="14" font-weight="800" fill="#92400e">phenylalanine (non-polar, ring)</text></g></g></g>
<rect x="660" y="90" width="540" height="420" rx="16" fill="#f8fafc" stroke="#cbd5e1"/><text x="930" y="118" text-anchor="middle" font-size="15" font-weight="800" fill="#111827">Examples of R groups</text>
<g class="part" data-part="np" data-name="Non-polar R groups" data-info="Hydrocarbon R groups: hydrophobic (e.g. alanine, phenylalanine)." tabindex="0" role="button" aria-label="Non-polar R groups"><g><animate attributeName="opacity" keyTimes="0.0000;0.3333;0.3533;1.0000" values="0;0;1;1" dur="15s" begin="aa-play.begin+0s" fill="freeze"/><rect x="680" y="150" width="500" height="48" rx="10" fill="#e5e7eb"/><text x="700" y="180" text-anchor="start" font-size="14" font-weight="800" fill="#111827">glycine</text><text x="880" y="180" text-anchor="start" font-size="15" font-weight="800" fill="#111827">H</text><text x="1170" y="180" text-anchor="end" font-size="12" font-weight="700" fill="#475569">simplest</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.4067;0.4267;1.0000" values="0;0;1;1" dur="15s" begin="aa-play.begin+0s" fill="freeze"/><rect x="680" y="208" width="500" height="48" rx="10" fill="#e5e7eb"/><text x="700" y="238" text-anchor="start" font-size="14" font-weight="800" fill="#111827">alanine</text><text x="880" y="238" text-anchor="start" font-size="15" font-weight="800" fill="#111827">CH₃</text><text x="1170" y="238" text-anchor="end" font-size="12" font-weight="700" fill="#475569">non-polar</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.7000;0.7200;1.0000" values="0;0;1;1" dur="15s" begin="aa-play.begin+0s" fill="freeze"/><rect x="680" y="440" width="500" height="48" rx="10" fill="#e5e7eb"/><text x="700" y="470" text-anchor="start" font-size="14" font-weight="800" fill="#111827">phenylalanine</text><text x="880" y="470" text-anchor="start" font-size="15" font-weight="800" fill="#111827">CH₂–⬡</text><text x="1170" y="470" text-anchor="end" font-size="12" font-weight="700" fill="#475569">non-polar, ring</text></g></g>
<g class="part" data-part="pol" data-name="Polar and charged R groups" data-info="Hydrophilic: polar (e.g. serine), acidic (aspartic acid) or basic (lysine)." tabindex="0" role="button" aria-label="Polar and charged R groups"><g><animate attributeName="opacity" keyTimes="0.0000;0.4800;0.5000;1.0000" values="0;0;1;1" dur="15s" begin="aa-play.begin+0s" fill="freeze"/><rect x="680" y="266" width="500" height="48" rx="10" fill="#ccfbf1"/><text x="700" y="296" text-anchor="start" font-size="14" font-weight="800" fill="#111827">serine</text><text x="880" y="296" text-anchor="start" font-size="15" font-weight="800" fill="#111827">CH₂OH</text><text x="1170" y="296" text-anchor="end" font-size="12" font-weight="700" fill="#475569">polar</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.5533;0.5733;1.0000" values="0;0;1;1" dur="15s" begin="aa-play.begin+0s" fill="freeze"/><rect x="680" y="324" width="500" height="48" rx="10" fill="#fecdd3"/><text x="700" y="354" text-anchor="start" font-size="14" font-weight="800" fill="#111827">aspartic acid</text><text x="880" y="354" text-anchor="start" font-size="15" font-weight="800" fill="#111827">CH₂COO⁻</text><text x="1170" y="354" text-anchor="end" font-size="12" font-weight="700" fill="#475569">acidic (−)</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.6267;0.6467;1.0000" values="0;0;1;1" dur="15s" begin="aa-play.begin+0s" fill="freeze"/><rect x="680" y="382" width="500" height="48" rx="10" fill="#dbeafe"/><text x="700" y="412" text-anchor="start" font-size="14" font-weight="800" fill="#111827">lysine</text><text x="880" y="412" text-anchor="start" font-size="15" font-weight="800" fill="#111827">(CH₂)₄NH₃⁺</text><text x="1170" y="412" text-anchor="end" font-size="12" font-weight="700" fill="#475569">basic (+)</text></g></g>
<g><animate attributeName="opacity" keyTimes="0.0000;0.8000;0.8200;1.0000" values="0;0;1;1" dur="15s" begin="aa-play.begin+0s" fill="freeze"/><rect x="40" y="540" width="1160" height="110" rx="14" fill="#fff7ed" stroke="#fdba74"/><text x="620" y="570" text-anchor="middle" font-size="15" font-weight="800" fill="#9a3412">R groups decide how a protein folds</text><text x="620" y="598" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">non-polar R groups cluster inside, away from water; polar and charged R groups face the water outside</text><text x="620" y="624" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">charged R groups (+ and −) can form ionic bonds; two cysteines form a disulfide bridge</text></g>
</svg>