<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" class="vd-svg" role="img" aria-labelledby="gp-title gp-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="gp-play" data-vd-play-label="Play: fold and dissolve" data-vd-steps="[[0, &quot;A soluble globular protein in water.&quot;], [1, &quot;The chain folds so non-polar (hydrophobic) R groups are buried in the core...&quot;], [4.5, &quot;...and polar (hydrophilic) R groups face outwards.&quot;], [8, &quot;Water molecules hydrogen bond to the surface: the protein dissolves.&quot;]]" data-vd-dur="12">
<title id="gp-title">A globular protein in water</title><desc id="gp-desc">A soluble globular protein with hydrophobic amino acids buried in the core and hydrophilic amino acids on the surface hydrogen bonding with surrounding water molecules.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
