<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 680" class="vd-svg" role="img" aria-labelledby="hv-title hv-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="hv-play" data-vd-play-label="Play: build the virus" data-vd-steps="[[0, &quot;HIV: a retrovirus that infects helper T cells.&quot;], [1, &quot;Two copies of its RNA genome, with the enzymes reverse transcriptase and integrase.&quot;], [3.5, &quot;A cone-shaped capsid of p24 protein.&quot;], [5.5, &quot;A matrix protein layer and a lipid envelope taken from the host cell.&quot;], [8, &quot;Glycoproteins gp120 and gp41 stick out; gp120 binds CD4 on T cells.&quot;]]" data-vd-dur="14">
<title id="hv-title">HIV structure</title><desc id="hv-desc">HIV: two RNA strands with reverse transcriptase and integrase inside a cone-shaped capsid, a matrix layer and a lipid envelope with gp120 and gp41 glycoproteins.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
