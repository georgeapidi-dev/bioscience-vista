/><line x1="510" y1="240" x2="537" y2="213" stroke="#0f766e" stroke-width="6"/><circle cx="543" cy="207" r="14" fill="#2dd4bf" stroke="#0f766e" stroke-width="2"/><line x1="558" y1="322" x2="594" y2="313" stroke="#0f766e" stroke-width="6"/><circle cx="602" cy="310" r="14" fill="#2dd4bf" stroke="#0f766e" stroke-width="2"/></g></g>
<line x1="402" y1="330" x2="640" y2="330" stroke="#475569" stroke-width="1.5"/><circle cx="402" cy="330" r="3" fill="#475569"/><text x="646" y="334" text-anchor="start" font-size="13" font-weight="800" fill="#b91c1c">RNA (×2)</text><line x1="440" y1="450" x2="640" y2="420" stroke="#475569" stroke-width="1.5"/><circle cx="440" cy="450" r="3" fill="#475569"/><text x="646" y="424" text-anchor="start" font-size="13" font-weight="800" fill="#1d4ed8">capsid (p24)</text><line x1="375" y1="310" x2="120" y2="110" stroke="#475569" stroke-width="1.5"/><circle cx="375" cy="310" r="3" fill="#475569"/><text x="120" y="100" text-anchor="middle" font-size="12" font-weight="800" fill="#15803d">reverse transcriptase</text><line x1="370" y1="430" x2="100" y2="520" stroke="#475569" stroke-width="1.5"/><circle cx="370" cy="430" r="3" fill="#475569"/><text x="100" y="540" text-anchor="middle" font-size="12" font-weight="800" fill="#a16207">integrase</text><line x1="208" y1="400" x2="60" y2="470" stroke="#475569" stroke-width="1.5"/><circle cx="208" cy="400" r="3" fill="#475569"/><text x="60" y="460" text-anchor="middle" font-size="12" font-weight="800" fill="#5b21b6">matrix</text><line x1="513.0" y1="503.0" x2="620" y2="600" stroke="#475569" stroke-width="1.5"/><circle cx="513.0" cy="503.0" r="3" fill="#475569"/><text x="626" y="604" text-anchor="start" font-size="13" font-weight="800" fill="#c2410c">envelope</text><line x1="542.6345596729059" y1="207.36544032709403" x2="640" y2="140" stroke="#475569" stroke-width="1.5"/><circle cx="542.6345596729059" cy="207.36544032709403" r="3" fill="#475569"/><text x="646" y="136" text-anchor="start" font-size="13" font-weight="800" fill="#0f766e">gp120 / gp41</text>
<g><animate attributeName="opacity" keyTimes="0.0000;0.7143;0.7357;1.0000" values="0;0;1;1" dur="14s" begin="hv-play.begin+0s" fill="freeze"/><rect x="40" y="600" width="300" height="56" rx="12" fill="#f0fdfa" stroke="#5eead4"/><text x="190" y="624" text-anchor="middle" font-size="12" font-weight="800" fill="#0f766e">gp120 binds CD4 on helper T cells</text><text x="190" y="644" text-anchor="middle" font-size="12" font-weight="700" fill="#0f766e">→ HIV destroys these cells → AIDS</text></g>
<g><animate attributeName="opacity" keyTimes="0.0000;0.0714;0.0929;1.0000" values="0;0;1;1" dur="14s" begin="hv-play.begin+0s" fill="freeze"/><rect x="790" y="120" width="410" height="260" rx="16" fill="#eff6ff" stroke="#93c5fd"/><text x="995.0" y="150" text-anchor="middle" font-size="15" font-weight="800" fill="#1e3a8a">Key features</text><text x="810" y="182" text-anchor="start" font-size="13" font-weight="600" fill="#111827"><tspan font-weight="800">genome:</tspan> ssRNA (+) × 2 (retrovirus)</text><text x="810" y="212" text-anchor="start" font-size="13" font-weight="600" fill="#111827"><tspan font-weight="800">enzymes:</tspan> reverse transcriptase, integrase</text><text x="810" y="242" text-anchor="start" font-size="13" font-weight="600" fill="#111827"><tspan font-weight="800">capsid:</tspan> cone-shaped (p24)</text><text x="810" y="272" text-anchor="start" font-size="13" font-weight="600" fill="#111827"><tspan font-weight="800">envelope:</tspan> yes: lipid, from host</text><text x="810" y="302" text-anchor="start" font-size="13" font-weight="600" fill="#111827"><tspan font-weight="800">attachment:</tspan> gp120 binds CD4</text><text x="810" y="332" text-anchor="start" font-size="13" font-weight="600" fill="#111827"><tspan font-weight="800">size:</tspan> about 120 nm</text><text x="810" y="362" text-anchor="start" font-size="13" font-weight="600" fill="#111827"><tspan font-weight="800">host:</tspan> helper T cells</text></g>
</svg>