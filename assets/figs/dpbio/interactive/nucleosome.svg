<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" class="vd-svg" role="img" aria-labelledby="nu-title nu-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="nu-play" data-vd-play-label="Play: packing DNA" data-vd-steps="[[0, &quot;How about 2 metres of DNA fit into a nucleus a few micrometres across.&quot;], [1, &quot;DNA (2 nm) wraps around histone proteins.&quot;], [4, &quot;Each unit is a nucleosome: DNA wrapped about 1.7 times round eight histones.&quot;], [7, &quot;Nucleosomes are joined by linker DNA, like beads on a string, and coil into a 30 nm fibre.&quot;], [10, &quot;The fibre forms loops, which condense into a chromosome before cell division.&quot;]]" data-vd-dur="16">
<title id="nu-title">DNA packing: nucleosomes to chromosomes</title><desc id="nu-desc">Levels of DNA packing: the double helix wraps round histone octamers to form nucleosomes, beads on a string with linker DNA and H1, a 30 nm fibre, looped domains and a condensed chromosome.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1200" height="640" fill="#ffffff"/>
<g aria-hidden="true"><animate id="nu-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<defs><marker id="nu-475569" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="7.2" refY="8.0" orient="auto"><path d="M0,0 L16,8.0 L0,16 z" fill="#475569"/></marker></defs>
<text class="head" x="30" y="34">Packing DNA: nucleosomes and chromosomes</text><text class="note" x="30" y="56">Eukaryotic chromosome. Each stage is magnified differently.</text>
<g class="part" data-part="dna" data-name="DNA double helix" data-info="About 2 nm wide. The DNA in one human cell is about 2 metres long, so it must be packed." tabindex="0" role="button" aria-label="DNA double helix"><path d="M 40 150 q 5 -16 10 0 t 10 0" fill="none" stroke="#ef4444" stroke-width="4"/><path d="M 60 150 q 5 -16 10 0 t 10 0" fill="none" stroke="#2563eb" stroke-width="4"/><path d="M 80 150 q 5 -16 10 0 t 10 0" fill="none" stroke="#ef4444" stroke-width="4"/><path d="M 100 150 q 5 -16 10 0 t 10 0" fill="none" stroke="#2563eb" stroke-width="4"/><path d="M 120 150 q 5 -16 10 0 t 10 0" fill="none" stroke="#ef4444" stroke-width="4"/><path d="M 140 150 q 5 -16 10 0 t 10 0" fill="none" stroke="#2563eb" stroke-width="4"/><path d="M 160 150 q 5 -16 10 0 t 10 0" fill="none" stroke="#ef4444" stroke-width="4"/><path d="M 180 150 q 5 -16 10 0 t 10 0" fill="none" stroke="#2563eb" stroke-width="4"/><path d="M 200 150 q 5 -16 10 0 t 10 0" fill="none" stroke="#ef4444" stroke-width="4"/><text x="130" y="196" text-anchor="middle" font-size="12" font-weight="800" fill="#1e3a8a">DNA double helix (2 nm)</text></g>
<g class="part" data-part="his" data-name="Histone octamer" data-info="Eight histone proteins (two each of H2A, H2B, H3 and H4). They are positively charged and attract the negatively charged phosphate groups of DNA." tabindex="0" role="button" aria-label="Histone octamer"><circle cx="398" cy="138" r="26" fill="#fde68a" stroke="#78350f" stroke-width="1.5"/><text x="398" y="142" text-anchor="middle" font-size="10" font-weight="800" fill="#78350f">H3</text><circle cx="442" cy="138" r="26" fill="#fcd34d" stroke="#78350f" stroke-width="1.5"/><text x="442" y="142" text-anchor="middle" font-size="10" font-weight="800" fill="#78350f">H4</text><circle cx="398" cy="182" r="26" fill="#fdba74" stroke="#78350f" stroke-width="1.5"/><text x="398" y="186" text-anchor="middle" font-size="10" font-weight="800" fill="#78350f">H2A</text><circle cx="442" cy="182" r="26" fill="#fca5a5" stroke="#78350f" stroke-width="1.5"/><text x="442" y="186" text-anchor="middle" font-size="10" font-weight="800" fill="#78350f">H2B</text></g>
<g class="part" data-part="nuc" data-name="Nucleosome" data-info="About 147 base pairs of DNA wrapped about 1.7 times round a histone octamer: &quot;beads on a string&quot;." tabindex="0" role="button" aria-label="Nucleosome"><clipPath id="nu-c15"><rect x="290" y="60" width="270" height="200"><animate attributeName="width" keyTimes="0.0000;0.0938;0.2500;1.0000" values="0;0;270;270" dur="16s" begin="nu-play.begin+0s" fill="freeze"/></rect></clipPath><g clip-path="url(#nu-c15)"><path d="M 300 200 C 360 240 480 240 490 160 C 490 80 350 80 350 160 C 350 230 480 250 550 220" fill="none" stroke="#2563eb" stroke-width="8" stroke-linecap="round"/></g><text x="420" y="280" text-anchor="middle" font-size="12" font-weight="800" fill="#1e3a8a">nucleosome (11 nm)</text></g>
<line x1="230" y1="150" x2="290" y2="150" stroke="#475569" stroke-width="3" marker-end="url(#nu-475569)"/><line x1="580" y1="160" x2="640" y2="160" stroke="#475569" stroke-width="3" marker-end="url(#nu-475569)"/>
<g class="part" data-part="link" data-name="Linker DNA and H1" data-info="DNA between nucleosomes; histone H1 binds it and helps pack nucleosomes together." tabindex="0" role="button" aria-label="Linker DNA and H1"><g><animate attributeName="opacity" keyTimes="0.0000;0.3125;0.3312;1.0000" values="0;0;1;1" dur="16s" begin="nu-play.begin+0s" fill="freeze"/><circle cx="690" cy="160" r="22" fill="#fcd34d" stroke="#78350f" stroke-width="1.5"/><ellipse cx="690" cy="160" rx="26" ry="12" fill="none" stroke="#2563eb" stroke-width="4"/><path d="M 716 160 C 730 140 740 180 744 160" fill="none" stroke="#2563eb" stroke-width="4"/><circle cx="730" cy="152" r="7" fill="#a855f7"/><circle cx="770" cy="160" r="22" fill="#fcd34d" stroke="#78350f" stroke-width="1.5"/><ellipse cx="770" cy="160" rx="26" ry="12" fill="none" stroke="#2563eb" stroke-width="4"/><path d="M 796 160 C 810 140 820 180 824 160" fill="none" stroke="#2563eb" stroke-width="4"/><circle cx="810" cy="152" r="7" fill="#a855f7"/><circle cx="850" cy="160" r="22" fill="#fcd34d" stroke="#78350f" stroke-width="1.5"/><ellipse cx="850" cy="160" rx="26" ry="12" fill="none" stroke="#2563eb" stroke-width="4"/><path d="M 876 160 C 890 140 900 180 904 160" fill="none" stroke="#2563eb" stroke-width="4"/><circle cx="890" cy="152" r="7" fill="#a855f7"/><circle cx="930" cy="160" r="22" fill="#fcd34d" stroke="#78350f" stroke-width="1.5"/><ellipse cx="930" cy="160" rx="26" ry="12" fill="none" stroke="#2563eb" stroke-width="4"/><path d="M 956 160 C 970 140 980 180 984 160" fill="none" stroke="#2563eb" stroke-width="4"/><circle cx="970" cy="152" r="7" fill="#a855f7"/><circle cx="1010" cy="160" r="22" fill="#fcd34d" stroke="#78350f" stroke-width="1.5"/><ellipse cx="1010" cy="160" rx="26" ry="12" fill="none" stroke="#2563eb" stroke-width="4"/><path d="M 1036 160 C 1050 140 1060 180 1064 160" fill="none" stroke="#2563eb" stroke-width="4"/><circle cx="1050" cy="152" r="7" fill="#a855f7"/><circle cx="1090" cy="160" r="22" fill="#fcd34d" stroke="#78350f" stroke-width="1.5"/><ellipse cx="1090" cy="160" rx="26" ry="12" fill="none" stroke="#2563eb" stroke-width="4"/><text x="890" y="214" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">“beads on a string”: linker DNA with histone H1 (purple)</text></g></g>
<g class="part" data-part="fib" data-name="30 nm fibre and loops" data-info="Nucleosomes coil into a thicker fibre, which forms loops attached to a protein scaffold." tabindex="0" role="button" aria-label="30 nm fibre and loops"><g><animate attributeName="opacity" keyTimes="0.0000;0.4688;0.4875;1.0000" values="0;0;1;1" dur="16s" begin="nu-play.begin+0s" fill="freeze"/><circle cx="120" cy="380" r="16.0" fill="#fcd34d" stroke="#78350f" stroke-width="1.2" opacity="1.00"/><circle cx="136" cy="407" r="14.5" fill="#fcd34d" stroke="#78350f" stroke-width="1.2" opacity="0.85"/><circle cx="152" cy="413" r="11.1" fill="#fcd34d" stroke="#78350f" stroke-width="1.2" opacity="0.51"/><circle cx="168" cy="395" r="8.4" fill="#fcd34d" stroke="#78350f" stroke-width="1.2" opacity="0.24"/><circle cx="184" cy="365" r="8.4" fill="#fcd34d" stroke="#78350f" stroke-width="1.2" opacity="0.24"/><circle cx="200" cy="347" r="11.2" fill="#fcd34d" stroke="#78350f" stroke-width="1.2" opacity="0.52"/><circle cx="216" cy="354" r="14.5" fill="#fcd34d" stroke="#78350f" stroke-width="1.2" opacity="0.85"/><circle cx="232" cy="381" r="16.0" fill="#fcd34d" stroke="#78350f" stroke-width="1.2" opacity="1.00"/><circle cx="248" cy="407" r="14.4" fill="#fcd34d" stroke="#78350f" stroke-width="1.2" opacity="0.84"/><circle cx="264" cy="413" r="11.0" fill="#fcd34d" stroke="#78350f" stroke-width="1.2" opacity="0.50"/><circle cx="280" cy="394" r="8.4" fill="#fcd34d" stroke="#78350f" stroke-width="1.2" opacity="0.24"/><circle cx="296" cy="364" r="8.4" fill="#fcd34d" stroke="#78350f" stroke-width="1.2" opacity="0.24"/><circle cx="312" cy="347" r="11.2" fill="#fcd34d" stroke="#78350f" stroke-width="1.2" opacity="0.52"/><circle cx="328" cy="354" r="14.6" fill="#fcd34d" stroke="#78350f" stroke-width="1.2" opacity="0.86"/><circle cx="344" cy="381" r="16.0" fill="#fcd34d" stroke="#78350f" stroke-width="1.2" opacity="1.00"/><circle cx="360" cy="407" r="14.4" fill="#fcd34d" stroke="#78350f" stroke-width="1.2" opacity="0.84"/><circle cx="376" cy="413" r="11.0" fill="#fcd34d" stroke="#78350f" stroke-width="1.2" opacity="0.50"/><circle cx="392" cy="393" r="8.3" fill="#fcd34d" stroke="#78350f" stroke-width="1.2" opacity="0.23"/><circle cx="408" cy="364" r="8.5" fill="#fcd34d" stroke="#78350f" stroke-width="1.2" opacity="0.25"/><circle cx="424" cy="347" r="11.3" fill="#fcd34d" stroke="#78350f" stroke-width="1.2" opacity="0.53"/><circle cx="440" cy="354" r="14.6" fill="#fcd34d" stroke="#78350f" stroke-width="1.2" opacity="0.86"/><circle cx="456" cy="382" r="16.0" fill="#fcd34d" stroke="#78350f" stroke-width="1.2" opacity="1.00"/><circle cx="472" cy="408" r="14.3" fill="#fcd34d" stroke="#78350f" stroke-width="1.2" opacity="0.83"/><circle cx="488" cy="413" r="10.9" fill="#fcd34d" stroke="#78350f" stroke-width="1.2" opacity="0.49"/><circle cx="504" cy="393" r="8.3" fill="#fcd34d" stroke="#78350f" stroke-width="1.2" opacity="0.23"/><circle cx="520" cy="363" r="8.5" fill="#fcd34d" stroke="#78350f" stroke-width="1.2" opacity="0.25"/><text x="330" y="450" text-anchor="middle" font-size="12" font-weight="800" fill="#78350f">30 nm fibre</text></g></g>
<g><animate attributeName="opacity" keyTimes="0.0000;0.5312;0.5500;1.0000" values="0;0;1;1" dur="16s" begin="nu-play.begin+0s" fill="freeze"/><path d="M 560 380 L 620 380" stroke="#475569" stroke-width="3" marker-end="url(#nu-475569)"/></g>
<g><animate attributeName="opacity" keyTimes="0.0000;0.6250;0.6438;1.0000" values="0;0;1;1" dur="16s" begin="nu-play.begin+0s" fill="freeze"/><line x1="720" y1="300" x2="720" y2="480" stroke="#94a3b8" stroke-width="6"/><path d="M 720 310 C 650 300 650 340 720 330 M 720 310 C 790 300 790 340 720 330" fill="none" stroke="#f59e0b" stroke-width="5"/><path d="M 720 340 C 630 330 630 370 720 360 M 720 340 C 810 330 810 370 720 360" fill="none" stroke="#f59e0b" stroke-width="5"/><path d="M 720 370 C 650 360 650 400 720 390 M 720 370 C 790 360 790 400 720 390" fill="none" stroke="#f59e0b" stroke-width="5"/><path d="M 720 400 C 630 390 630 430 720 420 M 720 400 C 810 390 810 430 720 420" fill="none" stroke="#f59e0b" stroke-width="5"/><path d="M 720 430 C 650 420 650 460 720 450 M 720 430 C 790 420 790 460 720 450" fill="none" stroke="#f59e0b" stroke-width="5"/><path d="M 720 460 C 630 450 630 490 720 480 M 720 460 C 810 450 810 490 720 480" fill="none" stroke="#f59e0b" stroke-width="5"/><text x="720" y="510" text-anchor="middle" font-size="12" font-weight="800" fill="#92400e">loops on a protein scaffold</text></g>
<g><animate attributeName="opacity" keyTimes="0.0000;0.6875;0.7063;1.0000" values="0;0;1;1" dur="16s" begin="nu-play.begin+0s" fill="freeze"/><path d="M 830 380 L 890 380" stroke="#475569" stroke-width="3" marker-end="url(#nu-475569)"/></g>
<g class="part" data-part="chr" data-name="Chromosome" data-info="In mitosis and meiosis the loops condense further into a visible chromosome made of two sister chromatids." tabindex="0" role="button" aria-label="Chromosome"><g><animate attributeName="opacity" keyTimes="0.0000;0.7188;0.7375;1.0000" values="0;0;1;1" dur="16s" begin="nu-play.begin+0s" fill="freeze"/><g transform="translate(1010 380)"><path d="M -40 -150 C -10 -150 -14 -60 -10 -10 C -14 40 -10 140 -40 150 C -70 140 -60 40 -30 -10 C -60 -60 -70 -150 -40 -150 Z" fill="#7c3aed"/><path d="M 40 -150 C 70 -150 60 -60 30 -10 C 60 40 70 140 40 150 C 10 140 14 40 10 -10 C 14 -60 10 -150 40 -150 Z" fill="#7c3aed"/><circle r="14" fill="#c4b5fd"/></g><text x="1010" y="560" text-anchor="middle" font-size="12" font-weight="800" fill="#5b21b6">chromosome: two sister chromatids</text><text x="1010" y="578" text-anchor="middle" font-size="11" font-weight="600" fill="#5b21b6">(condensed before division)</text></g></g>
</svg>