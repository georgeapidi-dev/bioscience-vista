<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" class="vd-svg" role="img" aria-labelledby="st2-title st2-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1">
<title id="st2-title">Phloem sieve tube element and companion cell</title><desc id="st2-desc">Longitudinal section of phloem: sieve tube elements joined by sieve plates, thin peripheral cytoplasm and no nucleus, with a companion cell that has a nucleus, dense cytoplasm and many mitochondria, linked by plasmodesmata.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="620" fill="#ffffff"/>
<text class="head" x="30" y="36">Atypical cell: phloem sieve tube element</text><text class="note" x="30" y="58">Longitudinal section. The sieve tube element is alive but has no nucleus: it depends on its companion cell.</text>
<g class="part" data-part="wall" data-name="Cellulose cell wall" data-info="Thin wall around each cell." tabindex="0" role="button" aria-label="Cellulose cell wall"><rect x="380" y="80" width="200" height="500" fill="#ecfccb" stroke="#3f6212" stroke-width="5"/><rect x="580" y="140" width="110" height="380" fill="#dcfce7" stroke="#3f6212" stroke-width="4"/></g>
<g class="part" data-part="ste" data-name="Sieve tube element" data-info="Long cell joined end to end with others to form a sieve tube that carries sucrose and amino acids (translocation). Mature: no nucleus, few organelles, a thin layer of cytoplasm." tabindex="0" role="button" aria-label="Sieve tube element"><rect x="390" y="90" width="180" height="480" fill="#f7fee7"/></g>
<g class="part" data-part="cyt" data-name="Thin cytoplasm" data-info="Pressed against the wall, leaving the middle open for sap to flow." tabindex="0" role="button" aria-label="Thin cytoplasm"><path d="M 392 96 L 392 564 M 568 96 L 568 564" stroke="#a3e635" stroke-width="7"/></g>
<g class="part" data-part="plate" data-name="Sieve plate" data-info="End wall perforated by pores, so phloem sap flows from one element to the next." tabindex="0" role="button" aria-label="Sieve plate"><rect x="380" y="80" width="200" height="10" fill="#3f6212"/><rect x="396" y="80" width="12" height="10" fill="#f7fee7"/><rect x="420" y="80" width="12" height="10" fill="#f7fee7"/><rect x="444" y="80" width="12" height="10" fill="#f7fee7"/><rect x="468" y="80" width="12" height="10" fill="#f7fee7"/><rect x="492" y="80" width="12" height="10" fill="#f7fee7"/><rect x="516" y="80" width="12" height="10" fill="#f7fee7"/><rect x="540" y="80" width="12" height="10" fill="#f7fee7"/><rect x="564" y="80" width="12" height="10" fill="#f7fee7"/><rect x="380" y="330" width="200" height="10" fill="#3f6212"/><rect x="396" y="330" width="12" height="10" fill="#f7fee7"/><rect x="420" y="330" width="12" height="10" fill="#f7fee7"/><rect x="444" y="330" width="12" height="10" fill="#f7fee7"/><rect x="468" y="330" width="12" height="10" fill="#f7fee7"/><rect x="492" y="330" width="12" height="10" fill="#f7fee7"/><rect x="516" y="330" width="12" height="10" fill="#f7fee7"/><rect x="540" y="330" width="12" height="10" fill="#f7fee7"/><rect x="564" y="330" width="12" height="10" fill="#f7fee7"/><rect x="380" y="572" width="200" height="10" fill="#3f6212"/><rect x="396" y="572" width="12" height="10" fill="#f7fee7"/><rect x="420" y="572" width="12" height="10" fill="#f7fee7"/><rect x="444" y="572" width="12" height="10" fill="#f7fee7"/><rect x="468" y="572" width="12" height="10" fill="#f7fee7"/><rect x="492" y="572" width="12" height="10" fill="#f7fee7"/><rect x="516" y="572" width="12" height="10" fill="#f7fee7"/><rect x="540" y="572" width="12" height="10" fill="#f7fee7"/><rect x="564" y="572" width="12" height="10" fill="#f7fee7"/></g>
<g class="part" data-part="cc" data-name="Companion cell" data-info="Small cell beside each sieve tube element with a nucleus, dense cytoplasm and many mitochondria: it keeps the sieve tube element alive and actively loads sucrose into it." tabindex="0" role="button" aria-label="Companion cell"><rect x="586" y="146" width="98" height="368" fill="#bbf7d0"/></g>
<g class="part" data-part="nuc" data-name="Nucleus of the companion cell" data-info="Controls both cells: the sieve tube element has no nucleus of its own." tabindex="0" role="button" aria-label="Nucleus of the companion cell"><ellipse cx="636" cy="300" rx="26" ry="40" fill="#ede9fe" stroke="#5b21b6" stroke-width="3"/><circle cx="632" cy="306" r="8" fill="#6d28d9"/></g>
<g class="part" data-part="mito" data-name="Mitochondria" data-info="Many in the companion cell, releasing ATP for active loading of sucrose." tabindex="0" role="button" aria-label="Mitochondria"><ellipse cx="612" cy="190" rx="14" ry="6" fill="#fdba74" stroke="#9a3412" stroke-width="1.5"/><ellipse cx="660" cy="220" rx="14" ry="6" fill="#fdba74" stroke="#9a3412" stroke-width="1.5"/><ellipse cx="614" cy="400" rx="14" ry="6" fill="#fdba74" stroke="#9a3412" stroke-width="1.5"/><ellipse cx="660" cy="440" rx="14" ry="6" fill="#fdba74" stroke="#9a3412" stroke-width="1.5"/><ellipse cx="630" cy="480" rx="14" ry="6" fill="#fdba74" stroke="#9a3412" stroke-width="1.5"/><ellipse cx="656" cy="360" rx="14" ry="6" fill="#fdba74" stroke="#9a3412" stroke-width="1.5"/></g>
<g class="part" data-part="pd" data-name="Plasmodesmata" data-info="Channels through the walls linking the cytoplasm of the companion cell and the sieve tube element." tabindex="0" role="button" aria-label="Plasmodesmata"><rect x="574" y="200" width="14" height="5" fill="#fff" stroke="#3f6212" stroke-width="1"/><rect x="574" y="260" width="14" height="5" fill="#fff" stroke="#3f6212" stroke-width="1"/><rect x="574" y="420" width="14" height="5" fill="#fff" stroke="#3f6212" stroke-width="1"/><rect x="574" y="470" width="14" height="5" fill="#fff" stroke="#3f6212" stroke-width="1"/></g>
<g class="labels"><g class="lbl" data-for="ste"><polyline points="191.6,194.0 480.0,200.0"/><circle cx="480.0" cy="200.0" r="2.6"/><text x="30" y="200" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="4">Sieve tube element</text></g><g class="lbl" data-for="plate"><polyline points="130.7,328.0 380.0,334.0"/><circle cx="380.0" cy="334.0" r="2.6"/><text x="30" y="334" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="4">Sieve plate</text></g><g class="lbl" data-for="cyt"><polyline points="156.8,474.0 392.0,480.0"/><circle cx="392.0" cy="480.0" r="2.6"/><text x="30" y="480" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="4">Thin cytoplasm</text></g><g class="lbl" data-for="wall"><polyline points="200.3,554.0 380.0,560.0"/><circle cx="380.0" cy="560.0" r="2.6"/><text x="30" y="560" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="4">Cellulose cell wall</text></g><g class="lbl" data-for="cc"><polyline points="943.2,194.0 684.0,250.0"/><circle cx="684.0" cy="250.0" r="2.6"/><text x="1070" y="200" text-anchor="end" paint-order="stroke" stroke="#fff" stroke-width="4">Companion cell</text></g><g class="lbl" data-for="nuc"><polyline points="812.7,294.0 662.0,300.0"/><circle cx="662.0" cy="300.0" r="2.6"/><text x="1070" y="300" text-anchor="end" paint-order="stroke" stroke="#fff" stroke-width="4">Nucleus of the companion cell</text></g><g class="lbl" data-for="mito"><polyline points="960.6,414.0 674.0,440.0"/><circle cx="674.0" cy="440.0" r="2.6"/><text x="1070" y="420" text-anchor="end" paint-order="stroke" stroke="#fff" stroke-width="4">Mitochondria</text></g><g class="lbl" data-for="pd"><polyline points="951.9,514.0 588.0,470.0"/><circle cx="588.0" cy="470.0" r="2.6"/><text x="1070" y="520" text-anchor="end" paint-order="stroke" stroke="#fff" stroke-width="4">Plasmodesmata</text></g></g>
</svg>