<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" class="vd-svg" role="img" aria-labelledby="cj-title cj-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="cj-play" data-vd-play-label="Play: load oxygen" data-vd-steps="[[0, &quot;Proteins with quaternary structure: conjugated or not.&quot;], [1, &quot;Haemoglobin: four polypeptides, each with a haem group containing iron.&quot;], [4, &quot;Each haem binds one oxygen molecule.&quot;], [7, &quot;Insulin: two chains joined by disulfide bridges, and no prosthetic group.&quot;]]" data-vd-dur="12">
<title id="cj-title">Conjugated and non-conjugated proteins</title><desc id="cj-desc">Haemoglobin, a conjugated protein of four polypeptides each with an iron-containing haem group that binds oxygen, compared with insulin, two polypeptide chains linked by disulfide bridges with no prosthetic group.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="560" fill="#ffffff"/>
<g aria-hidden="true"><animate id="cj-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<text class="head" x="30" y="34">Conjugated and non-conjugated proteins</text><text class="note" x="30" y="56">Schematic; not to scale.</text>
<line x1="560" y1="90" x2="560" y2="540" stroke="#cbd5e1" stroke-dasharray="6 5"/><text x="280" y="100" text-anchor="middle" font-size="16" font-weight="800" fill="#b91c1c">HAEMOGLOBIN — conjugated</text><text x="830" y="100" text-anchor="middle" font-size="16" font-weight="800" fill="#15803d">INSULIN — non-conjugated</text>
<g class="part" data-part="hb" data-name="Haemoglobin: conjugated" data-info="Four polypeptide chains (2 α, 2 β) plus four haem prosthetic groups, each with an Fe²⁺ ion that binds one O₂." tabindex="0" role="button" aria-label="Haemoglobin: conjugated"><ellipse cx="200" cy="230" rx="75" ry="62" fill="#93c5fd" stroke="#334155" stroke-width="2.5"/><text x="160" y="206" text-anchor="middle" font-size="20" font-weight="800" fill="#111827">α</text><ellipse cx="360" cy="230" rx="75" ry="62" fill="#93c5fd" stroke="#334155" stroke-width="2.5"/><text x="320" y="206" text-anchor="middle" font-size="20" font-weight="800" fill="#111827">α</text><ellipse cx="200" cy="370" rx="75" ry="62" fill="#c4b5fd" stroke="#334155" stroke-width="2.5"/><text x="160" y="346" text-anchor="middle" font-size="20" font-weight="800" fill="#111827">β</text><ellipse cx="360" cy="370" rx="75" ry="62" fill="#c4b5fd" stroke="#334155" stroke-width="2.5"/><text x="320" y="346" text-anchor="middle" font-size="20" font-weight="800" fill="#111827">β</text><text x="280" y="470" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">2 α + 2 β polypeptide chains</text></g>
<g class="part" data-part="haem" data-name="Haem (prosthetic group)" data-info="A non-protein part attached to the polypeptide; essential for function (binds oxygen)." tabindex="0" role="button" aria-label="Haem (prosthetic group)"><g><animate attributeName="opacity" keyTimes="0.0000;0.0833;0.1083;1.0000" values="0;0;1;1" dur="12s" begin="cj-play.begin+0s" fill="freeze"/><g transform="translate(210 238)"><rect x="-22" y="-14" width="44" height="28" rx="6" fill="#dc2626"/><text x="0" y="5" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">Fe²⁺</text></g><g transform="translate(370 238)"><rect x="-22" y="-14" width="44" height="28" rx="6" fill="#dc2626"/><text x="0" y="5" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">Fe²⁺</text></g><g transform="translate(210 378)"><rect x="-22" y="-14" width="44" height="28" rx="6" fill="#dc2626"/><text x="0" y="5" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">Fe²⁺</text></g><g transform="translate(370 378)"><rect x="-22" y="-14" width="44" height="28" rx="6" fill="#dc2626"/><text x="0" y="5" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">Fe²⁺</text></g><text x="280" y="492" text-anchor="middle" font-size="13" font-weight="800" fill="#b91c1c">+ 4 haem groups (prosthetic groups)</text></g></g>
<g class="part" data-part="o2" data-name="Oxygen binding" data-info="Each haemoglobin carries up to four O₂ molecules." tabindex="0" role="button" aria-label="Oxygen binding"><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.3333;0.3500;1.0000;1.0000;1.0000" values="0;0;1;1;0;0" dur="12s" begin="cj-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.3333;0.4583;1.0000" values="20 230;20 230;210 208;210 208" dur="12s" begin="cj-play.begin+0s" fill="freeze"/><g><circle cx="-7" r="8" fill="#ef4444" stroke="#7f1d1d"/><circle cx="7" r="8" fill="#ef4444" stroke="#7f1d1d"/></g></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.3750;0.3917;1.0000;1.0000;1.0000" values="0;0;1;1;0;0" dur="12s" begin="cj-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.3750;0.5000;1.0000" values="540 230;540 230;370 208;370 208" dur="12s" begin="cj-play.begin+0s" fill="freeze"/><g><circle cx="-7" r="8" fill="#ef4444" stroke="#7f1d1d"/><circle cx="7" r="8" fill="#ef4444" stroke="#7f1d1d"/></g></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.4167;0.4333;1.0000;1.0000;1.0000" values="0;0;1;1;0;0" dur="12s" begin="cj-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.4167;0.5417;1.0000" values="20 370;20 370;210 348;210 348" dur="12s" begin="cj-play.begin+0s" fill="freeze"/><g><circle cx="-7" r="8" fill="#ef4444" stroke="#7f1d1d"/><circle cx="7" r="8" fill="#ef4444" stroke="#7f1d1d"/></g></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.4583;0.4750;1.0000;1.0000;1.0000" values="0;0;1;1;0;0" dur="12s" begin="cj-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.4583;0.5833;1.0000" values="540 370;540 370;370 348;370 348" dur="12s" begin="cj-play.begin+0s" fill="freeze"/><g><circle cx="-7" r="8" fill="#ef4444" stroke="#7f1d1d"/><circle cx="7" r="8" fill="#ef4444" stroke="#7f1d1d"/></g></g></g><g><animate attributeName="opacity" keyTimes="0.0000;0.4167;0.4417;1.0000" values="0;0;1;1" dur="12s" begin="cj-play.begin+0s" fill="freeze"/><text x="280" y="514" text-anchor="middle" font-size="13" font-weight="700" fill="#b91c1c">each Fe²⁺ binds one O₂</text></g></g>
