<g class="part" data-part="cyt" data-name="Cytokines" data-info="Small proteins released by cells (especially immune cells) that affect the growth, division or immune activity of nearby cells. e.g. interleukins, interferons." tabindex="0" role="button" aria-label="Cytokines"><rect x="30" y="350" width="510" height="250" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="30" y="350" width="510" height="250" rx="16" fill="none" stroke="#0369a1" stroke-width="5" opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.5312;0.5500;0.7500;0.7688;1.0000" values="0;0;1;1;0;0" dur="16s" begin="cs2-play.begin+0s" fill="freeze"/></rect><text x="48" y="378" text-anchor="start" font-size="16" font-weight="800" fill="#0369a1">Cytokines → nearby cells</text><text x="48" y="586" text-anchor="start" font-size="12" font-weight="700" fill="#475569">interleukins, interferons · growth, division, immune activity</text><circle cx="285" cy="475" r="42" fill="#bae6fd" stroke="#0369a1" stroke-width="2.5"/><text x="285" y="479" text-anchor="middle" font-size="11" font-weight="800" fill="#0c4a6e">immune cell</text><circle cx="120" cy="440" r="30" fill="#fff7ed" stroke="#334155" stroke-width="2"/><circle cx="450" cy="440" r="30" fill="#fff7ed" stroke="#334155" stroke-width="2"/><circle cx="140" cy="540" r="30" fill="#fff7ed" stroke="#334155" stroke-width="2"/><circle cx="430" cy="540" r="30" fill="#fff7ed" stroke="#334155" stroke-width="2"/><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.5375;0.5500;0.7500;0.7625;1.0000" values="0;0;1;1;0;0" dur="16s" begin="cs2-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.5375;0.6625;1.0000" values="285 475;285 475;150 440;150 440" dur="16s" begin="cs2-play.begin+0s" fill="freeze"/><rect x="-5" y="-5" width="10" height="10" rx="2" fill="#0ea5e9" stroke="#075985"/></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.5450;0.5575;