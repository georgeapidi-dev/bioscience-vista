es="0.0000;0.5750;0.7000;1.0000" values="285 475;285 475;420 440;420 440" dur="16s" begin="cs2-play.begin+0s" fill="freeze"/><rect x="-5" y="-5" width="10" height="10" rx="2" fill="#0ea5e9" stroke="#075985"/></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.5825;0.5950;0.7500;0.7625;1.0000" values="0;0;1;1;0;0" dur="16s" begin="cs2-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.5825;0.7075;1.0000" values="285 475;285 475;170 540;170 540" dur="16s" begin="cs2-play.begin+0s" fill="freeze"/><rect x="-5" y="-5" width="10" height="10" rx="2" fill="#0ea5e9" stroke="#075985"/></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.5900;0.6025;0.7500;0.7625;1.0000" values="0;0;1;1;0;0" dur="16s" begin="cs2-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.5900;0.7150;1.0000" values="285 475;285 475;400 540;400 540" dur="16s" begin="cs2-play.begin+0s" fill="freeze"/><rect x="-5" y="-5" width="10" height="10" rx="2" fill="#0ea5e9" stroke="#075985"/></g></g></g>
<g class="part" data-part="ca" data-name="Calcium ions" data-info="Act as signals inside cells or nearby, e.g. triggering vesicle release at synapses or muscle contraction." tabindex="0" role="button" aria-label="Calcium ions"><rect x="560" y="350" width="510" height="250" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="560" y="350" width="510" height="250" rx="16" fill="none" stroke="#15803d" stroke-width="5" opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.7656;0.7844;0.9844;1.0000;1.0000" values="0;0;1;1;0;0" dur="16s" begin="cs2-play.begin+0s" fill="freeze"/></rect><text x="578" y="378" text-anchor="start" font-size="16" font-weight="800" fill="#15803d">Calcium ions → signals inside cells</text><text x="578" y="586" text-anchor="start" font-size="12" font-weight="700" fill="#475569">e.g. trigger vesicle release at synapses, muscle contraction</text><rect x="600" y="420" width="430" height="30" fill="#fef3c7" stroke="#d97706"/><rect x="700" y="414" width="30" height="42" rx="6" fill="#86efac" stroke="#15803d" stroke-width="2"/><text x="742" y="410" text-anchor="start" font-size="11" font-weight="800" fill="#15803d">Ca²⁺ channel</text><text x="610" y="412" text-anchor="start" font-size="11" font-weight="700" fill="#475569">outside</text><text x="610" y="480" text-anchor="start" font-size="11" font-weight="700" fill="#475569">inside</text><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.7688;0.7812;1.0000" values="0;0;1;1" dur="16s" begin="cs2-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.7688;0.8313;1.0000" values="715 394;715 394;715 480;715 480" dur="16s" begin="cs2-play.begin+0s" fill="freeze"/><g><circle r="8" fill="#22c55e" stroke="#14532d"/><text x="0" y="3" text-anchor="middle" font-size="8" font-weight="800" fill="#fff">²⁺</text></g></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.7875;0.8000;1.0000" values="0;0