<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" class="vd-svg" role="img" aria-labelledby="cs2-title cs2-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="cs2-play" data-vd-play-label="Play: four signals" data-vd-steps="[[0, &quot;Four functional kinds of signalling chemical.&quot;], [1, &quot;Hormones travel in the blood to distant target cells.&quot;], [4.75, &quot;Neurotransmitters cross a synapse to the next cell: fast and brief.&quot;], [8.5, &quot;Cytokines: small proteins that act on nearby cells.&quot;], [12.25, &quot;Calcium ions: signals inside cells, e.g. triggering vesicle release.&quot;]]" data-vd-dur="16">
<title id="cs2-title">Four kinds of signalling chemical</title><desc id="cs2-desc">Hormones carried in the blood from an endocrine gland to distant target cells; neurotransmitters crossing a synapse; cytokines released by an immune cell acting on nearby cells; calcium ions entering a cell and triggering vesicle release.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1100" height="620" fill="#ffffff"/>
<g aria-hidden="true"><animate id="cs2-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<text class="head" x="30" y="34">Four kinds of signalling chemical</text><text class="note" x="30" y="56">Grouped by what they do, not by their chemistry.</text>
<g class="part" data-part="hor" data-name="Hormones" data-info="Secreted by endocrine glands into the blood; act on distant target cells; slower, longer-lasting effects. e.g. insulin, adrenaline, oestradiol." tabindex="0" role="button" aria-label="Hormones"><rect x="30" y="80" width="510" height="250" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="30" y="80" width="510" height="250" rx="16" fill="none" stroke="#b91c1c" stroke-width="5" opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.0625;0.0813;0.2812;0.3000;1.0000" values="0;0;1;1;0;0" dur="16s" begin="cs2-play.begin+0s" fill="freeze"/></rect><text x="48" y="108" text-anchor="start" font-size="16" font-weight="800" fill="#b91c1c">Hormones → distant targets</text><text x="48" y="316" text-anchor="start" font-size="12" font-weight="700" fill="#475569">insulin, adrenaline, oestradiol · slower, longer-lasting</text><ellipse cx="100" cy="200" rx="44" ry="36" fill="#fecaca" stroke="#991b1b" stroke-width="2"/><text x="100" y="204" text-anchor="middle" font-size="12" font-weight="800" fill="#7f1d1d">gland</text><path d="M 144 190 L 430 190 L 430 240 L 144 240" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/><text x="290" y="182" text-anchor="middle" font-size="12" font-weight="800" fill="#b91c1c">blood</text><circle cx="485" cy="215" r="38" fill="#fff7ed" stroke="#334155" stroke-width="2"/><text x="485" y="266" text-anchor="middle" font-size="11" font-weight="800" fill="#111827">distant target</text><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.0625;0.0750;0.2812;0.2938;1.0000" values="0;0;1;1;0;0" dur="16s" begin="cs2-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.0625;0.2500;1.0000" values="140 205;140 205;448 208;448 208" dur="16s" begin="cs2-play.begin+0s" fill="freeze"/><circle r="6" fill="#ef4444" stroke="#1f2937" stroke-width="1"/></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.0844;0.0969;0.3031;0.3156;1.0000" values="0;0;1;1;0;0" dur="16s" begin="cs2-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.0844;0.2719;1.0000" values="140 210;140 210;448 211;448 211" dur="16s" begin="cs2-play.begin+0s" fill="freeze"/><circle r="6" fill="#ef4444" stroke="#1f2937" stroke-width="1"/></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.1062;0.1187;0.3250;0.3375;1.0000" values="0;0;1;1;0;0" dur="16s" begin="cs2-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.1062;0.2938;1.0000" values="140 215;140 215;448 214;448 214" dur="16s" begin="cs2-play.begin+0s" fill="freeze"/><circle r="6" fill="#ef4444" stroke="#1f2937" stroke-width="1"/></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.1281;0.1406;0.3469;0.3594;1.0000" values="0;0;1;1;0;0" dur="16s" begin="cs2-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.1281;0.3156;1.0000" values="140 220;140 220;448 217;448 217" dur="16s" begin="cs2-play.begin+0s" fill="freeze"/><circle r="6" fill="#ef4444" stroke="#1f2937" stroke-width="1"/></g></g></g>
<g class="part" data-part="nt" data-name="Neurotransmitters" data-info="Released by a neuron into a synapse; act on the adjacent cell very quickly and briefly. e.g. acetylcholine, dopamine." tabindex="0" role="button" aria-label="Neurotransmitters"><rect x="560" y="80" width="510" height="250" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="560" y="80" width="510" height="250" rx="16" fill="none" stroke="#7c3aed" stroke-width="5" opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.2969;0.3156;0.5156;0.5344;1.0000" values="0;0;1;1;0;0" dur="16s" begin="cs2-play.begin+0s" fill="freeze"/></rect><text x="578" y="108" text-anchor="start" font-size="16" font-weight="800" fill="#7c3aed">Neurotransmitters → adjacent cell</text><text x="578" y="316" text-anchor="start" font-size="12" font-weight="700" fill="#475569">acetylcholine, dopamine · very fast, brief</text><path d="M 620 140 L 820 140 Q 860 140 860 200 Q 860 240 820 240 L 620 240" fill="#ede9fe" stroke="#6d28d9" stroke-width="3"/><text x="710" y="196" text-anchor="middle" font-size="12" font-weight="800" fill="#5b21b6">neuron ending</text><rect x="890" y="130" width="150" height="120" rx="14" fill="#fff7ed" stroke="#334155" stroke-width="2"/><text x="965" y="196" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">next cell</text><text x="875" y="272" text-anchor="middle" font-size="11" font-weight="800" fill="#6d28d9">synapse ≈ 20 nm</text><circle cx="810" cy="190" r="16" fill="#c4b5fd" stroke="#6d28d9" stroke-width="2"><animate attributeName="cx" keyTimes="0.0000;0.2969;0.3500;1.0000" values="810;810;846;846" dur="16s" begin="cs2-play.begin+0s" fill="freeze"/></circle><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.3563;0.3688;0.5312;0.5437;1.0000" values="0;0;1;1;0;0" dur="16s" begin="cs2-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.3563;0.3937;1.0000" values="856 184;856 184;888