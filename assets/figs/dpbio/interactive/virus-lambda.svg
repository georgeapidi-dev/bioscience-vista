<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 680" class="vd-svg" role="img" aria-labelledby="la-title la-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="la-play" data-vd-play-label="Play: build the virus" data-vd-steps="[[0, &quot;Bacteriophage lambda: a virus that infects E. coli.&quot;], [1, &quot;Double-stranded DNA is packed in an icosahedral head.&quot;], [4, &quot;A long, flexible tail is attached.&quot;], [7, &quot;The tail fibre attaches to the bacterium.&quot;], [9.5, &quot;The DNA is injected through the tail; the empty capsid stays outside.&quot;]]" data-vd-dur="14">
<title id="la-title">Bacteriophage lambda</title><desc id="la-desc">Bacteriophage lambda: an icosahedral head containing linear double-stranded DNA, a long flexible non-contractile tail and a tail fibre that attaches to E. coli.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1220" height="680" fill="#ffffff"/>
<g aria-hidden="true"><animate id="la-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<defs><marker id="la-475569" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="6.3" refY="7.0" orient="auto"><path d="M0,0 L14,7.0 L0,14 z" fill="#475569"/></marker></defs>
<text class="head" x="30" y="34">Bacteriophage lambda</text><text class="note" x="30" y="56">Compare T2/T4 phages, whose tails contract.</text>
<g class="part" data-part="head" data-name="Icosahedral head (capsid)" data-info="A protein shell about 60 nm across." tabindex="0" role="button" aria-label="Icosahedral head (capsid)"><polygon points="483.9,280.0 380.0,340.0 276.1,280.0 276.1,160.0 380.0,100.0 483.9,160.0" fill="#c7d2fe" stroke="#3730a3" stroke-width="4"/><polygon points="380.0,280.0 328.0,190.0 432.0,190.0" fill="none" stroke="#3730a3" stroke-width="2"/></g>
<g class="part" data-part="dna" data-name="Double-stranded DNA" data-info="Linear dsDNA, 48 500 base pairs, packed tightly in the head. Its sticky ends (cos sites) join to make a circle inside the host." tabindex="0" role="button" aria-label="Double-stranded DNA"><g><animate attributeName="opacity" keyTimes="0.0000;0.0714;0.0929;1.0000" values="0;0;1;1" dur="14s" begin="la-play.begin+0s" fill="freeze"/><g><animate attributeName="opacity" keyTimes="0.0000;0.6786;0.8214;1.0000" values="1;1;0;0" dur="14s" begin="la-play.begin+0s" fill="freeze"/><ellipse cx="380" cy="220" rx="90" ry="80" fill="none" stroke="#dc2626" stroke-width="3" transform="rotate(0 380 220)"/><ellipse cx="380" cy="220" rx="78" ry="69" fill="none" stroke="#dc2626" stroke-width="3" transform="rotate(23 380 220)"/><ellipse cx="380" cy="220" rx="66" ry="58" fill="none" stroke="#dc2626" stroke-width="3" transform="rotate(46 380 220)"/><ellipse cx="380" cy="220" rx="54" ry="47" fill="none" stroke="#dc2626" stroke-width="3" transform="rotate(69 380 220)"/><ellipse cx="380" cy="220" rx="42" ry="36" fill="none" stroke="#dc2626" stroke-width="3" transform="rotate(92 380 220)"/><ellipse cx="380" cy="220" rx="30" ry="25" fill="none" stroke="#dc2626" stroke-width="3" transform="rotate(115 380 220)"/></g></g></g>
<g class="part" data-part="tail" data-name="Long flexible tail" data-info="About 150 nm, made of stacked protein rings; not contractile." tabindex="0" role="button" aria-label="Long flexible tail"><g><animate attributeName="opacity" keyTimes="0.0000;0.2857;0.3071;1.0000" values="0;0;1;1" dur="14s" begin="la-play.begin+0s" fill="freeze"/><rect x="366" y="324" width="28" height="12" rx="3" fill="#a5b4fc" stroke="#3730a3" stroke-width="1.5"/><rect x="366" y="340" width="28" height="12" rx="3" fill="#a5b4fc" stroke="#3730a3" stroke-width="1.5"/><rect x="366" y="356" width="28" height="12" rx="3" fill="#a5b4fc" stroke="#3730a3" stroke-width="1.5"/><rect x="366" y="372" width="28" height="12" rx="3" fill="#a5b4fc" stroke="#3730a3" stroke-width="1.5"/><rect x="366" y="388" width="28" height="12" rx="3" fill="#a5b4fc" stroke="#3730a3" stroke-width="1.5"/><rect x="366" y="404" width="28" height="12" rx="3" fill="#a5b4fc" stroke="#3730a3" stroke-width="1.5"/><rect x="366" y="420" width="28" height="12" rx="3" fill="#a5b4fc" stroke="#3730a3" stroke-width="1.5"/><rect x="366" y="436" width="28" height="12" rx="3" fill="#a5b4fc" stroke="#3730a3" stroke-width="1.5"/><rect x="366" y="452" width="28" height="12" rx="3" fill="#a5b4fc" stroke="#3730a3" stroke-width="1.5"/><rect x="366" y="468" width="28" height="12" rx="3" fill="#a5b4fc" stroke="#3730a3" stroke-width="1.5"/><rect x="366" y="484" width="28" height="12" rx="3" fill="#a5b4fc" stroke="#3730a3" stroke-width="1.5"/><rect x="366" y="500" width="28" height="12" rx="3" fill="#a5b4fc" stroke="#3730a3" stroke-width="1.5"/><rect x="366" y="516" width="28" height="12" rx="3" fill="#a5b4fc" stroke="#3730a3" stroke-width="1.5"/><rect x="366" y="532" width="28" height="12" rx="3" fill="#a5b4fc" stroke="#3730a3" stroke-width="1.5"/><rect x="366" y="548" width="28" height="12" rx="3" fill="#a5b4fc" stroke="#3730a3" stroke-width="1.5"/><rect x="366" y="564" width="28" height="12" rx="3" fill="#a5b4fc" stroke="#3730a3" stroke-width="1.5"/><path d="M 380 580 L 374 592 L 380 604" fill="none" stroke="#3730a3" stroke-width="3"/></g></g>
<g class="part" data-part="fib" data-name="Tail fibre" data-info="A single fibre at the tip binds a receptor (LamB) on E. coli; the DNA is injected through the tail." tabindex="0" role="button" aria-label="Tail fibre"><g><animate attributeName="opacity" keyTimes="0.0000;0.4286;0.4500;1.0000" values="0;0;1;1" dur="14s" begin="la-play.begin+0s" fill="freeze"/><path d="M 380 604 C 390 620 370 630 380 644" fill="none" stroke="#16a34a" stroke-width="4"/></g></g>
<g><animate attributeName="opacity" keyTimes="0.0000;0.5000;0.5214;1.0000" values="0;0;1;1" dur="14s" begin="la-play.begin+0s" fill="freeze"/><rect x="60" y="640" width="640" height="40" rx="20" fill="#fde68a" stroke="#a16207" stroke-width="3"/><text x="380" y="676" text-anchor="middle" font-size="11" font-weight="800" fill="#92400e">E. coli cell wall and membrane</text></g>
<path d="M 380 320 L 380 690 C 420 700 460 680 540 690" fill="none" stroke="#dc2626" stroke-width="4" stroke-dasharray="560" stroke-dashoffset="560"><animate attributeName="stroke-dashoffset" keyTimes="0.0000;0.6786;0.8571;1.0000" values="560;560;0;0" dur="14s" begin="la-play.begin+0s" fill="freeze"/></path><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.7143;0.7357;1.0000" values="0;0;1;1" dur="14s" begin="la-play.begin+0s" fill="freeze"/><rect x="455.0" y="728" width="210" height="24" rx="12" fill="#fee2e2" stroke="#1f2937" stroke-width="1"/><text x="560" y="745" text-anchor="middle" font-size="12" font-weight="700">DNA injected into the host</text></g>
<line x1="420" y1="190" x2="620" y2="120" stroke="#475569" stroke-width="1.5"/><circle cx="420" cy="190" r="3" fill="#475569"/><text x="626" y="116" text-anchor="start" font-size="13" font-weight="800" fill="#b91c1c">dsDNA (48.5 kb)</text><line x1="480" y1="160" x2="620" y2="80" stroke="#475569" stroke-width="1.5"/><circle cx="480" cy="160" r="3" fill="#475569"/><text x="626" y="76" text-anchor="start" font-size="13" font-weight="800" fill="#3730a3">head (capsid)</text><line x1="394" y1="440" x2="520" y2="440" stroke="#475569" stroke-width="1.5"/><circle cx="394" cy="440" r="3" fill="#475569"/><text x="526" y="444" text-anchor="start" font-size="13" font-weight="800" fill="#3730a3">flexible tail</text><line x1="386" y1="624" x2="520" y2="600" stroke="#475569" stroke-width="1.5"/><circle cx="386" cy="624" r="3" fill="#475569"/><text x="526" y="604" text-anchor="start" font-size="13" font-weight="800" fill="#15803d">tail fibre</text>
<g><animate attributeName="opacity" keyTimes="0.0000;0.0714;0.0929;1.0000" values="0;0;1;1" dur="14s" begin="la-play.begin+0s" fill="freeze"/><rect x="790" y="120" width="410" height="260" rx="16" fill="#eff6ff" stroke="#93c5fd"/><text x="995.0" y="150" text-anchor="middle" font-size="15" font-weight="800" fill="#1e3a8a">Key features</text><text x="810" y="182" text-anchor="start" font-size="13" font-weight="600" fill="#111827"><tspan font-weight="800">genome:</tspan> linear dsDNA (48.5 kb)</text><text x="810" y="212" text-anchor="start" font-size="13" font-weight="600" fill="#111827"><tspan font-weight="800">capsid:</tspan> icosahedral head + tail</text><text x="810" y="242" text-anchor="start" font-size="13" font-weight="600" fill="#111827"><tspan font-weight="800">envelope:</tspan> none</text><text x="810" y="272" text-anchor="start" font-size="13" font-weight="600" fill="#111827"><tspan font-weight="800">tail:</tspan> long, flexible, not contractile</text><text x="810" y="302" text-anchor="start" font-size="13" font-weight="600" fill="#111827"><tspan font-weight="800">size:</tspan> head ~60 nm, tail ~150 nm</text><text x="810" y="332" text-anchor="start" font-size="13" font-weight="600" fill="#111827"><tspan font-weight="800">host:</tspan> Escherichia coli</text><text x="810" y="362" text-anchor="start" font-size="13" font-weight="600" fill="#111827"><tspan font-weight="800">cycles:</tspan> lytic or lysogenic</text></g>
</svg>