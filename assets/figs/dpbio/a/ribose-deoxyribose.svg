<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="system-ui,Arial,sans-serif" role="img" aria-label="Sketch of ribose with an OH group on carbon 2 and deoxyribose with only H on carbon 2"><rect width="800" height="400" fill="#fff"/><defs><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker></defs><text x="400" y="30" font-size="18" text-anchor="middle" fill="#1f2937" font-weight="bold">Ribose and deoxyribose</text><polygon points="220.0,110.0 277.1,151.5 255.3,218.5 184.7,218.5 162.9,151.5" fill="#fef3c7" stroke="#92400e" stroke-width="2"/><text x="220" y="128" font-size="16" text-anchor="middle" fill="#1f2937" font-weight="bold">O</text><text x="290" y="160" font-size="13" text-anchor="start" fill="#1f2937" font-weight="normal">C1&#x27;</text><text x="260" y="252" font-size="13" text-anchor="start" fill="#1f2937" font-weight="normal">C2&#x27;</text><text x="180" y="252" font-size="13" text-anchor="end" fill="#1f2937" font-weight="normal">C3&#x27;</text><text x="146" y="160" font-size="13" text-anchor="end" fill="#1f2937" font-weight="normal">C4&#x27;</text><text x="146" y="105" font-size="13" text-anchor="end" fill="#1f2937" font-weight="normal">C5&#x27;</text><line x1="256" y1="220" x2="270" y2="270" stroke="#1f2937" stroke-width="2"/><text x="274" y="292" font-size="18" text-anchor="middle" fill="#dc2626" font-weight="bold">OH</text><line x1="184" y1="220" x2="170" y2="270" stroke="#1f2937" stroke-width="2"/><text x="166" y="292" font-size="18" text-anchor="middle" fill="#1f2937" font-weight="bold">OH</text><text x="220" y="340" font-size="17" text-anchor="middle" fill="#92400e" font-weight="bold">ribose (RNA)</text><polygon points="580.0,110.0 637.1,151.5 615.3,218.5 544.7,218.5 522.9,151.5" fill="#fef3c7" stroke="#7c3aed" stroke-width="2"/><text x="580" y="128" font-size="16" text-anchor="middle" fill="#1f2937" font-weight="bold">O</text><text x="650" y="160" font-size="13" text-anchor="start" fill="#1f2937" font-weight="normal">C1&#x27;</text><text x="620" y="252" font-size="13" text-anchor="start" fill="#1f2937" font-weight="normal">C2&#x27;</text><text x="540" y="252" font-size="13" text-anchor="end" fill="#1f2937" font-weight="normal">C3&#x27;</text><text x="506" y="160" font-size="13" text-anchor="end" fill="#1f2937" font-weight="normal">C4&#x27;</text><text x="506" y="105" font-size="13" text-anchor="end" fill="#1f2937" font-weight="normal">C5&#x27;</text><line x1="616" y1="220" x2="630" y2="270" stroke="#1f2937" stroke-width="2"/><text x="634" y="292" font-size="18" text-anchor="middle" fill="#1f2937" font-weight="bold">H</text><line x1="544" y1="220" x2="530" y2="270" stroke="#1f2937" stroke-width="2"/><text x="526" y="292" font-size="18" text-anchor="middle" fill="#1f2937" font-weight="bold">OH</text><text x="580" y="340" font-size="17" text-anchor="middle" fill="#7c3aed" font-weight="bold">deoxyribose (DNA)</text><text x="400" y="380" font-size="14" text-anchor="middle" fill="#475569" font-weight="normal" font-style="italic">“Deoxy” = one oxygen less: carbon 2 carries –H instead of –OH.</text></svg>