<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 465" font-family="system-ui,Arial,sans-serif" role="img" aria-label="Early Earth: an atmosphere with no oxygen or ozone but high carbon dioxide and methane, intense UV, lightning and volcanoes above a warm ocean where carbon compounds formed"><rect width="900" height="465" fill="#fff"/><defs><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker></defs><text x="450" y="30" font-size="18" text-anchor="middle" fill="#1f2937" font-weight="bold">Conditions on early Earth, about 4 billion years ago</text><rect x="40" y="50" width="820" height="210" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="60" y="76" font-size="14" text-anchor="start" fill="#92400e" font-weight="bold">ATMOSPHERE: no free O₂, so no ozone layer; high CO₂ and CH₄ (greenhouse: hot); also N₂, H₂O, NH₃, H₂</text><line x1="120" y1="90" x2="150" y2="240" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#ap)"/><line x1="200" y1="90" x2="230" y2="240" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#ap)"/><line x1="280" y1="90" x2="310" y2="240" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#ap)"/><text x="200" y="120" font-size="13" text-anchor="middle" fill="#7c3aed" font-weight="normal">intense UV reaches</text><text x="200" y="136" font-size="13" text-anchor="middle" fill="#7c3aed" font-weight="normal">the surface</text><path d="M 520 90 L 500 150 L 525 150 L 500 230" stroke="#d97706" stroke-width="4" fill="none"/><text x="560" y="130" font-size="13" text-anchor="start" fill="#92400e" font-weight="normal">frequent</text><text x="560" y="146" font-size="13" text-anchor="start" fill="#92400e" font-weight="normal">lightning</text><path d="M 700 258 L 750 180 L 800 258 Z" stroke="#7c2d12" stroke-width="2" fill="#fed7aa"/><path d="M 750 180 C 740 150 770 130 750 100" stroke="#94a3b8" stroke-width="6" fill="none"/><text x="690" y="150" font-size="13" text-anchor="end" fill="#7c2d12" font-weight="normal">volcanoes:</text><text x="690" y="166" font-size="13" text-anchor="end" fill="#7c2d12" font-weight="normal">heat, gases</text><rect x="40" y="330" width="820" height="120" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="60" y="356" font-size="14" text-anchor="start" fill="#1e40af" font-weight="bold">OCEAN: warm, mineral-rich; hydrothermal vents</text><text x="450" y="400" font-size="14" text-anchor="middle" fill="#16a34a" font-weight="bold">Energy (UV, lightning, heat) + simple molecules → amino acids, sugars, nucleotide bases, fatty acids</text><text x="450" y="425" font-size="13" text-anchor="middle" fill="#475569" font-weight="normal" font-style="italic">With no O₂ to oxidise them, these carbon compounds could build up: chemistry that does not happen now.</text></svg>