<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 490" font-family="system-ui,Arial,sans-serif" role="img" aria-label="RNA in the centre both stores information and catalyses reactions as ribozymes; later DNA took over storage and proteins took over catalysis"><rect width="900" height="490" fill="#fff"/><defs><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker></defs><text x="450" y="30" font-size="18" text-anchor="middle" fill="#1f2937" font-weight="bold">The RNA world hypothesis</text><rect x="330" y="70" width="240" height="80" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="450.0" y="106.0" font-size="15" text-anchor="middle" fill="#1f2937" font-weight="bold">RNA</text><text x="450.0" y="124.0" font-size="15" text-anchor="middle" fill="#1f2937" font-weight="bold">stores AND catalyses</text><rect x="60" y="210" width="250" height="90" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="185.0" y="243.33333333333334" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="bold">Stores information</text><text x="185.0" y="259.33333333333337" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="bold">in its base sequence;</text><text x="185.0" y="275.33333333333337" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="bold">copied by base pairing</text><rect x="590" y="210" width="250" height="90" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="715.0" y="243.33333333333334" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="bold">Catalyses reactions:</text><text x="715.0" y="259.33333333333337" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="bold">ribozymes (e.g. peptide</text><text x="715.0" y="275.33333333333337" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="bold">bond formation in ribosomes)</text><line x1="380" y1="152" x2="230" y2="206" stroke="#2563eb" stroke-width="3" marker-end="url(#ab)"/><line x1="520" y1="152" x2="680" y2="206" stroke="#16a34a" stroke-width="3" marker-end="url(#ag)"/><rect x="60" y="370" width="250" height="70" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/><text x="185.0" y="401.3333333333333" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="bold">Later: DNA takes over</text><text x="185.0" y="417.3333333333333" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="bold">storage (more stable)</text><rect x="590" y="370" width="250" height="70" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/><text x="715.0" y="401.3333333333333" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="bold">Later: proteins take over</text><text x="715.0" y="417.3333333333333" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="bold">most catalysis</text><line x1="185" y1="302" x2="185" y2="366" stroke="#1f2937" stroke-width="2" marker-end="url(#ak)"/><line x1="715" y1="302" x2="715" y2="366" stroke="#1f2937" stroke-width="2" marker-end="url(#ak)"/><text x="450" y="470" font-size="13" text-anchor="middle" fill="#475569" font-weight="normal" font-style="italic">Solves the chicken-and-egg problem: today DNA is needed to make proteins, and proteins are needed to copy DNA.</text></svg>