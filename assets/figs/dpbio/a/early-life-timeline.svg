<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="system-ui,Arial,sans-serif" role="img" aria-label="Timeline from 4.5 billion years ago to today: Earth forms, isotope evidence at 4.1, vent microfossils about 3.8 to 4.3, stromatolites 3.5, oxygen 2.4, Cambrian 0.54; molecular clock puts LUCA at about 4.2 to 4.0 billion years ago"><rect width="900" height="420" fill="#fff"/><defs><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker></defs><text x="450" y="30" font-size="18" text-anchor="middle" fill="#1f2937" font-weight="bold">How long has life been evolving? (billions of years ago)</text><line x1="84.0" y1="200" x2="820" y2="200" stroke="#1f2937" stroke-width="4"/><line x1="100.0" y1="192" x2="100.0" y2="208" stroke="#1f2937" stroke-width="2"/><text x="100.0" y="232" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="normal">4.5</text><line x1="180" y1="192" x2="180" y2="208" stroke="#1f2937" stroke-width="2"/><text x="180" y="232" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="normal">4</text><line x1="260.0" y1="192" x2="260.0" y2="208" stroke="#1f2937" stroke-width="2"/><text x="260.0" y="232" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="normal">3.5</text><line x1="340" y1="192" x2="340" y2="208" stroke="#1f2937" stroke-width="2"/><text x="340" y="232" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="normal">3</text><line x1="420.0" y1="192" x2="420.0" y2="208" stroke="#1f2937" stroke-width="2"/><text x="420.0" y="232" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="normal">2.5</text><line x1="500" y1="192" x2="500" y2="208" stroke="#1f2937" stroke-width="2"/><text x="500" y="232" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="normal">2</text><line x1="580.0" y1="192" x2="580.0" y2="208" stroke="#1f2937" stroke-width="2"/><text x="580.0" y="232" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="normal">1.5</text><line x1="660" y1="192" x2="660" y2="208" stroke="#1f2937" stroke-width="2"/><text x="660" y="232" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="normal">1</text><line x1="740.0" y1="192" x2="740.0" y2="208" stroke="#1f2937" stroke-width="2"/><text x="740.0" y="232" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="normal">0.5</text><line x1="820" y1="192" x2="820" y2="208" stroke="#1f2937" stroke-width="2"/><text x="820" y="232" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="normal">0</text><line x1="93.60000000000002" y1="200" x2="93.60000000000002" y2="150" stroke="#dc2626" stroke-width="2"/><circle cx="93.60000000000002" cy="200" r="6" fill="#dc2626" stroke="#dc2626" stroke-width="1.5"/><text x="93.60000000000002" y="128" font-size="12" text-anchor="middle" fill="#dc2626" font-weight="bold">Earth forms</text><line x1="164.0" y1="200" x2="164.0" y2="250" stroke="#7c3aed" stroke-width="2"/><circle cx="164.0" cy="200" r="6" fill="#7c3aed" stroke="#7c3aed" stroke-width="1.5"/><text x="164.0" y="266" font-size="12" text-anchor="middle" fill="#7c3aed" font-weight="bold">¹²C-enriched carbon:</text><text x="164.0" y="281" font-size="12" text-anchor="middle" fill="#7c3aed" font-weight="bold">possible life (isotopes)</text><line x1="196.0" y1="200" x2="196.0" y2="100" stroke="#0d9488" stroke-width="2"/><circle cx="196.0" cy="200" r="6" fill="#0d9488" stroke="#0d9488" stroke-width="1.5"/><text x="196.0" y="78" font-size="12" text-anchor="middle" fill="#0d9488" font-weight="bold">vent precipitate</text><text x="196.0" y="93" font-size="12" text-anchor="middle" fill="#0d9488" font-weight="bold">microfossils (3.8–4.3?)</text><line x1="260.0" y1="200" x2="260.0" y2="300" stroke="#16a34a" stroke-width="2"/><circle cx="260.0" cy="200" r="6" fill="#16a34a" stroke="#16a34a" stroke-width="1.5"/><text x="260.0" y="316" font-size="12" text-anchor="middle" fill="#16a34a" font-weight="bold">stromatolite fossils</text><text x="260.0" y="331" font-size="12" text-anchor="middle" fill="#16a34a" font-weight="bold">(radiometric dating)</text><line x1="436.0" y1="200" x2="436.0" y2="150" stroke="#2563eb" stroke-width="2"/><circle cx="436.0" cy="200" r="6" fill="#2563eb" stroke="#2563eb" stroke-width="1.5"/><text x="436.0" y="128" font-size="12" text-anchor="middle" fill="#2563eb" font-weight="bold">oxygen builds up</text><text x="436.0" y="143" font-size="12" text-anchor="middle" fill="#2563eb" font-weight="bold">in the atmosphere</text><line x1="733.6" y1="200" x2="733.6" y2="250" stroke="#d97706" stroke-width="2"/><circle cx="733.6" cy="200" r="6" fill="#d97706" stroke="#d97706" stroke-width="1.5"/><text x="733.6" y="266" font-size="12" text-anchor="middle" fill="#d97706" font-weight="bold">Cambrian:</text><text x="733.6" y="281" font-size="12" text-anchor="middle" fill="#d97706" font-weight="bold">animals diversify</text><rect x="100" y="345" width="700" height="60" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="450" y="370" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="bold">Molecular clock (genomic analysis) estimates LUCA lived about 4.2–4.0 billion years ago.</text><text x="450" y="392" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="normal" font-style="italic">Life has evolved for about 4 billion years: almost 90% of Earth’s history.</text></svg>