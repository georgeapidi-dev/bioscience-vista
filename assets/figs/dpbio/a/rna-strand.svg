<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 490" font-family="system-ui,Arial,sans-serif" role="img" aria-label="Three RNA nucleotides with bases A, U and G joined into a strand by covalent bonds between phosphate and sugar; a free nucleotide joins by condensation releasing water"><style>@media (prefers-reduced-motion: reduce){.anim{display:none}}</style><rect width="900" height="490" fill="#fff"/><defs><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker></defs><text x="450" y="30" font-size="18" text-anchor="middle" fill="#1f2937" font-weight="bold">Building an RNA strand by condensation</text><polygon points="220.0,84.0 244.7,102.0 235.3,131.0 204.7,131.0 195.3,102.0" fill="#fde68a" stroke="#92400e" stroke-width="2"/><line x1="196" y1="104" x2="172" y2="92" stroke="#1f2937" stroke-width="2"/><circle cx="162" cy="88" r="13" fill="#fecaca" stroke="#dc2626" stroke-width="2"/><text x="162" y="93" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="bold">P</text><line x1="245" y1="110" x2="270" y2="110" stroke="#1f2937" stroke-width="2"/><rect x="270" y="94" width="70" height="32" rx="4" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/><text x="305" y="116" font-size="15" text-anchor="middle" fill="#1f2937" font-weight="bold">A</text><line x1="205" y1="132" x2="175" y2="186" stroke="#1f2937" stroke-width="3"/><polygon points="220.0,204.0 244.7,222.0 235.3,251.0 204.7,251.0 195.3,222.0" fill="#fde68a" stroke="#92400e" stroke-width="2"/><line x1="196" y1="224" x2="172" y2="212" stroke="#1f2937" stroke-width="2"/><circle cx="162" cy="208" r="13" fill="#fecaca" stroke="#dc2626" stroke-width="2"/><text x="162" y="213" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="bold">P</text><line x1="245" y1="230" x2="270" y2="230" stroke="#1f2937" stroke-width="2"/><rect x="270" y="214" width="70" height="32" rx="4" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/><text x="305" y="236" font-size="15" text-anchor="middle" fill="#1f2937" font-weight="bold">U</text><line x1="205" y1="252" x2="175" y2="306" stroke="#1f2937" stroke-width="3"/><polygon points="220.0,324.0 244.7,342.0 235.3,371.0 204.7,371.0 195.3,342.0" fill="#fde68a" stroke="#92400e" stroke-width="2"/><line x1="196" y1="344" x2="172" y2="332" stroke="#1f2937" stroke-width="2"/><circle cx="162" cy="328" r="13" fill="#fecaca" stroke="#dc2626" stroke-width="2"/><text x="162" y="333" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="bold">P</text><line x1="245" y1="350" x2="270" y2="350" stroke="#1f2937" stroke-width="2"/><rect x="270" y="334" width="70" height="32" rx="4" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/><text x="305" y="356" font-size="15" text-anchor="middle" fill="#1f2937" font-weight="bold">G</text><text x="120" y="155" font-size="13" text-anchor="end" fill="#1f2937" font-weight="normal">covalent</text><text x="120" y="171" font-size="13" text-anchor="end" fill="#1f2937" font-weight="normal">bond</text><text x="120" y="275" font-size="13" text-anchor="end" fill="#1f2937" font-weight="normal">covalent</text><text x="120" y="291" font-size="13" text-anchor="end" fill="#1f2937" font-weight="normal">bond</text><path d="M 380 300 L 640 300" stroke="#16a34a" stroke-width="3" fill="none" marker-end="url(#ag)"/><text x="510" y="290" font-size="14" text-anchor="middle" fill="#16a34a" font-weight="bold">condensation</text><text x="510" y="330" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="normal">phosphate of the new nucleotide bonds</text><text x="510" y="346" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="normal">to the sugar of the last one;</text><text x="510" y="362" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="normal">H₂O is released each time</text><polygon points="720.0,208.0 740.9,223.2 732.9,247.8 707.1,247.8 699.1,223.2" fill="#fde68a" stroke="#92400e" stroke-width="2"/><circle cx="670" cy="210" r="11" fill="#fecaca" stroke="#dc2626" stroke-width="1.5"/><rect x="756" y="216" width="50" height="28" rx="4" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/><text x="781" y="236" font-size="14" text-anchor="middle" fill="#1f2937" font-weight="bold">C</text><text x="720" y="190" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="normal">free nucleotide</text><circle cx="720" cy="420" r="24" fill="#e0f2fe" stroke="#2563eb" stroke-width="2"/><text x="720" y="425" font-size="13" text-anchor="middle" fill="#2563eb" font-weight="bold">H₂O</text><text x="450" y="470" font-size="13" text-anchor="middle" fill="#475569" font-weight="normal" font-style="italic">The chain of sugar–phosphate–sugar–phosphate is the backbone. n nucleotides need n − 1 condensation reactions.</text><g class="anim"><g><polygon points="720.0,208.0 740.9,223.2 732.9,247.8 707.1,247.8 699.1,223.2" fill="#fde68a" stroke="#92400e" stroke-width="2"/><circle cx="670" cy="210" r="11" fill="#fecaca" stroke="#dc2626" stroke-width="1.5"/><rect x="756" y="216" width="50" height="28" rx="4" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/><animateTransform attributeName="transform" type="translate" values="0 0;-460 210;-460 210" keyTimes="0;0.7;1" dur="5s" repeatCount="indefinite"/></g></g></svg>