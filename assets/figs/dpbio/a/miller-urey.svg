<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" font-family="system-ui,Arial,sans-serif" role="img" aria-label="Miller–Urey apparatus: boiling water as the ocean, a flask of methane, ammonia and hydrogen with sparking electrodes as lightning, a condenser as rain, and a trap where amino acids collected"><rect width="900" height="540" fill="#fff"/><defs><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker></defs><text x="450" y="30" font-size="18" text-anchor="middle" fill="#1f2937" font-weight="bold">The Miller–Urey experiment (1952)</text><circle cx="620" cy="170" r="90" fill="#fef9c3" stroke="#d97706" stroke-width="2.5"/><text x="620" y="205" font-size="14" text-anchor="middle" fill="#1f2937" font-weight="bold">“atmosphere”</text><text x="620" y="225" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="normal">CH₄, NH₃, H₂, H₂O</text><line x1="570" y1="140" x2="600" y2="165" stroke="#1f2937" stroke-width="3"/><line x1="670" y1="140" x2="640" y2="165" stroke="#1f2937" stroke-width="3"/><path d="M 600 165 L 612 158 L 620 172 L 632 160 L 640 165" stroke="#d97706" stroke-width="3" fill="none"/><text x="620" y="70" font-size="13" text-anchor="middle" fill="#92400e" font-weight="bold">electrodes: sparks = lightning</text><ellipse cx="240" cy="380" rx="80" ry="60" fill="#bfdbfe" stroke="#2563eb" stroke-width="2.5"/><text x="240" y="385" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="bold">boiling water</text><text x="240" y="401" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="bold">= ocean</text><path d="M 200 450 Q 240 470 280 450" stroke="#dc2626" stroke-width="3" fill="none"/><text x="240" y="488" font-size="13" text-anchor="middle" fill="#dc2626" font-weight="normal">heat</text><path d="M 240 320 L 240 120 L 540 120" stroke="#2563eb" stroke-width="6" fill="none"/><line x1="240" y1="240" x2="240" y2="180" stroke="#2563eb" stroke-width="2" marker-end="url(#ab)"/><text x="250" y="210" font-size="13" text-anchor="start" fill="#1f2937" font-weight="normal">water vapour rises</text><path d="M 680 245 L 680 380" stroke="#94a3b8" stroke-width="6" fill="none"/><rect x="658" y="270" width="44" height="100" rx="18" fill="#e0f2fe" stroke="#2563eb" stroke-width="2"/><text x="712" y="320" font-size="13" text-anchor="start" fill="#2563eb" font-weight="bold">condenser: cooling</text><text x="712" y="336" font-size="13" text-anchor="start" fill="#2563eb" font-weight="bold">= rain</text><path d="M 680 380 L 680 420 L 480 420 L 330 400" stroke="#94a3b8" stroke-width="6" fill="none"/><ellipse cx="480" cy="425" rx="26" ry="18" fill="#fde68a" stroke="#92400e" stroke-width="2"/><text x="480" y="465" font-size="13" text-anchor="middle" fill="#92400e" font-weight="normal">trap: samples taken;</text><text x="480" y="481" font-size="13" text-anchor="middle" fill="#92400e" font-weight="normal">liquid turns brown</text><text x="450" y="520" font-size="13" text-anchor="middle" fill="#16a34a" font-weight="bold">After a week: amino acids (e.g. glycine, alanine) and other carbon compounds had formed from inorganic molecules.</text></svg>