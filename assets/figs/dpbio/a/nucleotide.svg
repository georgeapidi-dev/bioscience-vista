<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" font-family="system-ui,Arial,sans-serif" role="img" aria-label="A nucleotide drawn as a circle (phosphate) joined to a pentagon (pentose sugar) joined to a rectangle (base), with carbons 1 to 5 of the sugar numbered"><rect width="760" height="380" fill="#fff"/><defs><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker></defs><text x="380" y="30" font-size="18" text-anchor="middle" fill="#1f2937" font-weight="bold">A nucleotide: phosphate, pentose sugar and base</text><polygon points="330.0,140.0 387.1,181.5 365.3,248.5 294.7,248.5 272.9,181.5" fill="#fde68a" stroke="#92400e" stroke-width="2"/><circle cx="190" cy="150" r="34" fill="#fecaca" stroke="#dc2626" stroke-width="2.5"/><line x1="222" y1="162" x2="278" y2="182" stroke="#1f2937" stroke-width="3"/><line x1="390" y1="200" x2="450" y2="200" stroke="#1f2937" stroke-width="3"/><rect x="450" y="160" width="150" height="80" rx="6" fill="#bfdbfe" stroke="#2563eb" stroke-width="2.5"/><text x="190" y="156" font-size="22" text-anchor="middle" fill="#1f2937" font-weight="bold">P</text><text x="525" y="206" font-size="20" text-anchor="middle" fill="#1f2937" font-weight="bold">base</text><text x="330" y="164" font-size="14" text-anchor="middle" fill="#78350f" font-weight="bold">O</text><text x="404" y="180" font-size="14" text-anchor="middle" fill="#78350f" font-weight="bold">1&#x27;</text><text x="378" y="270" font-size="14" text-anchor="middle" fill="#78350f" font-weight="bold">2&#x27;</text><text x="282" y="270" font-size="14" text-anchor="middle" fill="#78350f" font-weight="bold">3&#x27;</text><text x="254" y="180" font-size="14" text-anchor="middle" fill="#78350f" font-weight="bold">4&#x27;</text><text x="250" y="148" font-size="14" text-anchor="middle" fill="#78350f" font-weight="bold">5&#x27;</text><text x="330" y="205" font-size="16" text-anchor="middle" fill="#1f2937" font-weight="bold">sugar</text><text x="190" y="214" font-size="14" text-anchor="middle" fill="#dc2626" font-weight="normal">phosphate</text><text x="190" y="231" font-size="14" text-anchor="middle" fill="#dc2626" font-weight="normal">(circle)</text><text x="330" y="300" font-size="14" text-anchor="middle" fill="#92400e" font-weight="normal">pentose sugar (pentagon):</text><text x="330" y="317" font-size="14" text-anchor="middle" fill="#92400e" font-weight="normal">deoxyribose in DNA, ribose in RNA</text><text x="525" y="270" font-size="14" text-anchor="middle" fill="#2563eb" font-weight="normal">nitrogenous base (rectangle):</text><text x="525" y="287" font-size="14" text-anchor="middle" fill="#2563eb" font-weight="normal">A, C, G, T in DNA; A, C, G, U in RNA</text><text x="380" y="360" font-size="13" text-anchor="middle" fill="#475569" font-weight="normal" font-style="italic">Phosphate and base are both attached to the sugar, on opposite sides (C5&#x27; and C1&#x27;).</text></svg>