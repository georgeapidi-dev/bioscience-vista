" y1="283" x2="494" y2="293" stroke="#dc2626" stroke-width="2"/><line x1="526" y1="267" x2="518" y2="257" stroke="#dc2626" stroke-width="2"/><line x1="526" y1="283" x2="518" y2="293" stroke="#dc2626" stroke-width="2"/><line x1="550" y1="267" x2="542" y2="257" stroke="#dc2626" stroke-width="2"/><line x1="550" y1="283" x2="542" y2="293" stroke="#dc2626" stroke-width="2"/><line x1="574" y1="267" x2="566" y2="257" stroke="#dc2626" stroke-width="2"/><line x1="574" y1="283" x2="566" y2="293" stroke="#dc2626" stroke-width="2"/><line x1="598" y1="267" x2="590" y2="257" stroke="#dc2626" stroke-width="2"/><line x1="598" y1="283" x2="590" y2="293" stroke="#dc2626" stroke-width="2"/><text x="125" y="350" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="bold">Z line</text><text x="450" y="350" font-size="13" text-anchor="middle" fill="#dc2626" font-weight="bold">thick myosin filaments with heads</text><text x="260" y="90" font-size="13" text-anchor="middle" fill="#2563eb" font-weight="bold">thin actin filaments</text><rect x="40" y="380" width="820" height="85" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="450" y="402" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="normal">Ca²⁺ exposes binding sites on actin → myosin heads attach (cross-bridges) → power stroke pulls actin towards the centre</text><text x="450" y="424" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="normal">→ ATP binds and the head detaches → ATP hydrolysis re-cocks the head. Z lines move closer; filaments do not shorten.</text><text x="450" y="450" font-size="13" text-anchor="middle" fill="#475569" font-weight="normal" font-style="italic">Titin acts like a spring: it recoils the sarcomere after stretching and prevents overstretching.</text></svg>