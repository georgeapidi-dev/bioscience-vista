 330" dur="5s" begin="0.4s" keyTimes="0;0.3;0.75;1" keyPoints="0;0;1;1" calcMode="linear" repeatCount="indefinite"/></circle><circle r="6" fill="#2563eb"><animateMotion path="M 450 70 L 450 330" dur="5s" begin="0.8s" keyTimes="0;0.3;0.75;1" keyPoints="0;0;1;1" calcMode="linear" repeatCount="indefinite"/></circle></g><text x="200" y="60" font-size="13" text-anchor="start" fill="#b45309" font-weight="bold">acetylcholine (ligand)</text><text x="560" y="330" font-size="13" text-anchor="start" fill="#2563eb" font-weight="bold">Na⁺ flows in when the gate opens</text><rect x="40" y="370" width="820" height="60" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="450" y="395" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="normal">Ligand-gated: opens when acetylcholine binds. Voltage-gated Na⁺ and K⁺ channels open when the membrane potential changes.</text><text x="450" y="415" font-size="13" text-anchor="middle" fill="#475569" font-weight="normal" font-style="italic">Gates make the membrane selectively permeable: ions pass only when, and only where, the channel is open.</text></svg>