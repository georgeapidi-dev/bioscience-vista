<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 490" font-family="system-ui,Arial,sans-serif" role="img" aria-label="Animation of breathing: the diaphragm flattens, ribs rise, the lungs expand and air flows in, then the reverse"><style>@media (prefers-reduced-motion: reduce){.anim{display:none}}</style><rect width="900" height="490" fill="#fff"/><defs><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker></defs><text x="450" y="30" font-size="18" text-anchor="middle" fill="#1f2937" font-weight="bold">Inspiration: the thorax gets bigger, pressure falls, air flows in</text><g class="anim"><g transform="translate(450 260)"><g><g transform="translate(-450 -260)"><path d="M 300 150 C 220 200 220 320 280 350 L 440 350 L 440 150 Z M 600 150 C 680 200 680 320 620 350 L 460 350 L 460 150 Z" fill="#fecdd3" stroke="#be123c" stroke-width="2"/></g><animateTransform attributeName="transform" type="scale" values="1 1;1.07 1.1;1 1" dur="5s" repeatCount="indefinite"/></g></g><path d="M 230 380 Q 450 300 670 380" stroke="#7c2d12" stroke-width="9" fill="none"><animate attributeName="d" values="M 230 380 Q 450 300 670 380;M 230 395 Q 450 385 670 395;M 230 380 Q 450 300 670 380" dur="5s" repeatCount="indefinite"/></path><line x1="200" y1="170" x2="300" y2="188" stroke="#78716c" stroke-width="5"><animate attributeName="y1" values="170;156;170" dur="5s" repeatCount="indefinite"/></line><line x1="700" y1="170" x2="600" y2="188" stroke="#78716c" stroke-width="5"><animate attributeName="y1" values="170;156;170" dur="5s" repeatCount="indefinite"/></line><line x1="200" y1="212" x2="300" y2="230" stroke="#78716c" stroke-width="5"><animate attributeName="y1" values="212;198;212" dur="5s" repeatCount="indefinite"/></line><line x1="700" y1="212" x2="600" y2="230" stroke="#78716c" stroke-width="5"><animate attributeName="y1" values="212;198;212" dur="5s" repeatCount="indefinite"/></line><line x1="200" y1="254" x2="300" y2="272" stroke="#78716c" stroke-width="5"><animate attributeName="y1" values="254;240;254" dur="5s" repeatCount="indefinite"/></line><line x1="700" y1="254" x2="600" y2="272" stroke="#78716c" stroke-width="5"><animate attributeName="y1" values="254;240;254" dur="5s" repeatCount="indefinite"/></line><line x1="200" y1="296" x2="300" y2="314" stroke="#78716c" stroke-width="5"><animate attributeName="y1" values="296;282;296" dur="5s" repeatCount="indefinite"/></line><line x1="700" y1="296" x2="600" y2="314" stroke="#78716c" stroke-width="5"><animate attributeName="y1" values="296;282;296" dur="5s" repeatCount="indefinite"/></line><line x1="200" y1="338" x2="300" y2="356" stroke="#78716c" stroke-width="5"><animate attributeName="y1" values="338;324;338" dur="5s" repeatCount="indefinite"/></line><line x1="700" y1="338" x2="600" y2="356" stroke="#78716c" stroke-width="5"><animate attributeName="y1" values="338;324;338" dur="5s" repeatCount="indefinite"/></line><circle r="6" fill="#2563eb"><animateMotion path="M 450 60 L 450 200" dur="5s" keyTimes="0;0.5;1" keyPoints="0;1;0" calcMode="linear" repeatCount="indefinite"/></circle></g><path d="M 450 60 L 450 150" stroke="#64748b" stroke-width="10" fill="none"/><text x="120" y="160" font-size="13" text-anchor="middle" fill="#57534e" font-weight="bold">external intercostal</text><text x="120" y="176" font-size="13" text-anchor="middle" fill="#57534e" font-weight="bold">muscles contract:</text><text x="120" y="192" font-size="13" text-anchor="middle" fill="#57534e" font-weight="bold">ribs up and out</text><text x="780" y="160" font-size="13" text-anchor="middle" fill="#57534e" font-weight="bold">internal intercostals</text><text x="780" y="176" font-size="13" text-anchor="middle" fill="#57534e" font-weight="bold">contract in forced</text><text x="780" y="192" font-size="13" text-anchor="middle" fill="#57534e" font-weight="bold">expiration: ribs down</text><text x="450" y="440" font-size="13" text-anchor="middle" fill="#7c2d12" font-weight="bold">diaphragm contracts and flattens (inspiration); relaxes and domes (expiration)</text><text x="450" y="470" font-size="13" text-anchor="middle" fill="#475569" font-weight="normal" font-style="italic">Volume of thorax ↑ → pressure inside lungs ↓ below atmospheric → air flows in. Forced expiration also uses abdominal muscles.</text></svg>