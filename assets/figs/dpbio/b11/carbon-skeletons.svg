<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 370" font-family="system-ui,Arial,sans-serif" role="img" aria-label="A carbon atom with four single bonds to hydrogen, then carbon skeletons as an unbranched chain, a branched chain and a six-membered ring with a double bond"><rect width="900" height="370" fill="#fff"/><defs><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker></defs><text x="450" y="30" font-size="18" text-anchor="middle" fill="#1f2937" font-weight="bold">Carbon forms four covalent bonds: chains, branches and rings</text><line x1="130" y1="170" x2="130.0" y2="115.0" stroke="#1f2937" stroke-width="3"/><circle cx="130.0" cy="100.0" r="11" fill="#fff" stroke="#1f2937" stroke-width="2"/><text x="130.0" y="104.0" font-size="11" text-anchor="middle" fill="#1f2937" font-weight="normal">H</text><line x1="130" y1="170" x2="82.36860279185588" y