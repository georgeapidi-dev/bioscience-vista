/><text x="370" y="175" font-size="13" text-anchor="middle" fill="#fff" font-weight="bold">C</text><circle cx="420" cy="140" r="15" fill="#1f2937" stroke="#1f2937" stroke-width="1"/><text x="420" y="145" font-size="13" text-anchor="middle" fill="#fff" font-weight="bold">C</text><text x="345" y="290" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="normal">unbranched chain</text><line x1="490" y1="170" x2="540" y2="140" stroke="#1f2937" stroke-width="3"/><line x1="540" y1="140" x2="590" y2="170" stroke="#1f2937" stroke-width="3"/><line x1="540" y1="140" x2="540" y2="90" stroke="#1f2937" stroke-width="3"/><circle cx="490" cy="170" r="15" fill="#1f2937" stroke="#1f2937" stroke-width="1"/><text x="490" y="175" font-size="13" text-anchor="middle" fill="#fff" font-weight="bold">C</text><circle cx="540" cy="140" r="15" fill="#1f2937" stroke="#1f2937" stroke-width="1"/><text x="540" y="145" font-size="13" text-anchor="middle" fill="#fff" font-weight="bold">C</text><circle cx="590" cy="170" r="15" fill="#1f2937" stroke="#1f2937" stroke-width="1"/><text x="590" y="175" font-size="13" text-anchor="middle" fill="#fff" font-weight="bold">C</text><circle cx="540" cy="90" r="15" fill="#1f2937" stroke="#1f2937" stroke-width="1"/><text x="540" y="95" font-size="13" text-anchor="middle" fill="#fff" font-weight="bold">C</text><text x="540" y="290" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="normal">branched chain</text><line x1="743.3012701892219" y1="185.0" x2="700.0" y2="210.0" stroke="#1f2937" stroke-width="3"/><line x1="700.0" y1="210.0" x2="656.6987298107781" y2="185.0" stroke="#1f2937" stroke-width="3"/><line x1="656.6987298107781" y1="185.0" x2="656.6987298107781" y2="135.0" stroke="#1f2937" stroke-width="3"/><line x1="656.6987298107781" y1="135.0" x2="700.0" y2="110.0" stroke="#1f2937" stroke-width="3"/><line x1="700.0" y1="110.0" x2="743.3012701892219" y2="134.99999999999997" stroke="#1f2937" stroke-width="3"/><line x1="743.3012701892219" y1="134.99999999999997" x2="743.3012701892219" y2="185.0" stroke="#1f2937" stroke-width="3"/><line x1="737.3012701892219" y1="189.0" x2="698.0" y2="204.0" stroke="#1f2937" stroke-width="2"/><circle cx="743.3012701892219" cy="185.0" r="15" fill="#1f2937" stroke="#1f2937" stroke-width="1"/><text x="743.3012701892219" y="190.0" font-size="13" text-anchor="middle" fill="#fff" font-weight="bold">C</text><circle cx="700.0" cy="210.0" r="15" fill="#1f2937" stroke="#1f2937" stroke-width="1"/><text x="700.0" y="215.0" font-size="13" text-anchor="middle" fill="#fff" font-weight="bold">C</text><circle cx="656.6987298107781" cy="185.0" r="15" fill="#1f2937" stroke="#1f2937" stroke-width="1"/><text x="656.6987298107781" y="190.0" font-size="13" text-anchor="middle" fill="#fff" font-weight="bold">C</text><circle cx="656.6987298107781" cy="135.0" r="15" fill="#1f2937" stroke="#1f2937" stroke-width="1"/><text x="656.6987298107781" y="140.0" font-size="13" text-anchor="middle" fill="#fff" font-weight="bold">C</text><circle cx="700.0" cy="110.0" r="15" fill="#1f2937" stroke="#1f2937" stroke-width="1"/><text x="700.0" y="115.0" font-size="13" text-anchor="middle" fill="#fff" font-weight="bold">C</text><circle cx="743.3012701892219" cy="134.99999999999997" r="15" fill="#1f2937" stroke="#1f2937" stroke-width="1"/><text x="743.3012701892219" y="139.99999999999997" font-size="13" text-anchor="middle" fill="#fff" font-weight="bold">C</text><text x="700" y="290" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="normal">ring (and a C=C</text><text x="700" y="306" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="normal">double bond)</text><text x="450" y="350" font-size="13" text-anchor="middle" fill="#475569" font-weight="normal" font-style="italic">Covalent bond: a shared pair of electrons. Carbon can bond to C, H, O, N, S and P, giving almost limitless diversity.</text></svg>