<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550" font-family="system-ui,Arial,sans-serif" role="img" aria-label="Fatty acid chains: saturated straight, monounsaturated with one kink, polyunsaturated with two kinks; straight chains pack tightly as solid fats, kinked chains pack loosely as liquid oils"><rect width="900" height="550" fill="#fff"/><defs><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker></defs><text x="450" y="30" font-size="18" text-anchor="middle" fill="#1f2937" font-weight="bold">Saturated and unsaturated fatty acids</text><rect x="50" y="84" width="60" height="32" rx="8" fill="#fecaca" stroke="#dc2626" stroke-width="2"/><text x="80" y="105" font-size="11" text-anchor="middle" fill="#1f2937" font-weight="bold">COOH</text><path d="M 110.0 100.0 L 130.0 106.0 L 150.0 100.0 L 170.0 106.0 L 190.0 100.0 L 210.0 106.0 L 230.0 100.0 L 250.0 106.0 L 270.0 100.0 L 290.0 106.0 L 310.0 100.0 L 330.0 106.0 L 350.0 100.0 L 370.0 106.0 L 390.0 100.0" stroke="#92400e" stroke-width="3" fill="none"/><text x="470" y="105" font-size="14" text-anchor="start" fill="#1f2937" font-weight="bold">SATURATED: no C=C double bonds; straight chain</text><rect x="50" y="184" width="60" height="32" rx="8" fill="#fecaca" stroke="#dc2626" stroke-width="2"/><text x="80" y="205" font-size="11" text-anchor="middle" fill="#1f2937" font-weight="bold">COOH</text><path d="M 110.0 200.0 L 130.0 206.0 L 150.0 200.0 L 170.0 206.0 L 190.0 200.0 L 210.0 206.0 L 230.0 200.0 L 250.0 206.0 L 270.0 200.0 L 288.8 212.5 L 307.6 213.7 L 326.4 226.2 L 345.1 227.4 L 363.9 239.9 L 382.7 241.1" stroke="#92400e" stroke-width="3" fill="none"/><line x1="273.0" y1="205.0" x2="291.78745425694757" y2="217.4941924261933" stroke="#92400e" stroke-width="2"/><text x="470" y="205" font-size="14" text-anchor="start" fill="#1f2937" font-weight="bold">MONOUNSATURATED: one C=C (cis): one kink</text><rect x="50" y="284" width="60" height="32" rx="8" fill="#fecaca" stroke="#dc2626" stroke-width="2"/><text x="80" y="305" font-size="11" text-anchor="middle" fill="#1f2937" font-weight="bold">COOH</text><path d="M 110.0 300.0 L 130.0 306.0 L 150.0 300.0 L 170.0 306.0 L 190.0 300.0 L 210.0 306.0 L 228.8 307.2 L 247.6 319.7 L 266.4 320.9 L 285.1 333.4 L 303.9 334.7 L 319.2 352.1 L 334.5 360.4 L 349.8 377.9 L 365.1 386.2" stroke="#92400e" stroke-width="3" fill="none"/><line x1="213.0" y1="311.0" x2="231.78745425694757" y2="312.2217198720248" stroke="#92400e" stroke-width="2"/><line x1="306.93727128473785" y1="339.65354446846095" x2="322.23411503042763" y2="357.1269513369217" stroke="#92400e" stroke-width="2"/><text x="470" y="305" font-size="14" text-anchor="start" fill="#1f2937" font-weight="bold">POLYUNSATURATED: two or more C=C: more kinks</text><line x1="110" y1="410" x2="300" y2="410" stroke="#92400e" stroke-width="4"/><line x1="110" y1="422" x2="300" y2="422" stroke="#92400e" stroke-width="4"/><line x1="110" y1="434" x2="300" y2="434" stroke="#92400e" stroke-width="4"/><line x1="110" y1="446" x2="300" y2="446" stroke="#92400e" stroke-width="4"/><line x1="110" y1="458" x2="300" y2="458" stroke="#92400e" stroke-width="4"/><text x="205" y="490" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="normal">straight chains pack tightly:</text><text x="205" y="506" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="normal">higher melting point, solid fats</text><text x="205" y="522" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="normal">(endotherms, e.g. butter, lard)</text><path d="M 560 412 l 50 0 l 25 -10 l 60 0" stroke="#92400e" stroke-width="4" fill="none"/><path d="M 560 424 l 50 0 l 25 14 l 60 0" stroke="#92400e" stroke-width="4" fill="none"/><path d="M 560 436 l 50 0 l 25 -10 l 60 0" stroke="#92400e" stroke-width="4" fill="none"/><path d="M 560 448 l 50 0 l 25 14 l 60 0" stroke="#92400e" stroke-width="4" fill="none"/><path d="M 560 460 l 50 0 l 25 -10 l 60 0" stroke="#92400e" stroke-width="4" fill="none"/><text x="640" y="490" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="normal">kinked chains pack loosely:</text><text x="640" y="506" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="normal">lower melting point, liquid oils</text><text x="640" y="522" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="normal">(plants, e.g. olive, sunflower)</text></svg>