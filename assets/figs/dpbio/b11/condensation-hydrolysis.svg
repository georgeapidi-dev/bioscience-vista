<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" font-family="system-ui,Arial,sans-serif" role="img" aria-label="Two monomers joined by condensation, forming a covalent bond and releasing water; a dimer split by hydrolysis, using water to restore the H and OH groups"><style>@media (prefers-reduced-motion: reduce){.anim{display:none}}</style><rect width="900" height="440" fill="#fff"/><defs><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker></defs><text x="450" y="30" font-size="18" text-anchor="middle" fill="#1f2937" font-weight="bold">Condensation builds polymers; hydrolysis breaks them</text><rect x="80" y="90" width="70" height="46" rx="10" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/><text x="115" y="118" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="normal">OH</text><rect x="220" y="90" width="70" height="46" rx="10" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/><text x="255" y="118" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="normal">H</text><line x1="320" y1="113" x2="470" y2="113" stroke="#16a34a" stroke-width="3" marker-end="url(#ag)"/><text x="395" y="100" font-size="14" text-anchor="middle" fill="#16a34a" font-weight="bold">condensation</text><text x="395" y="140" font-size="12" text-anchor="middle" fill="#16a34a" font-weight="normal">enzyme; water released</text><rect x="500" y="90" width="70" height="46" rx="10" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/><rect x="574" y="90" width="70" height="46" rx="10" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/><rect x="566" y="104" width="12" height="18" rx="3" fill="#a7f3d0" stroke="#16a34a" stroke-width="1.5"/><text x="612" y="160" font-size="12" text-anchor="middle" fill="#16a34a" font-weight="normal">covalent bond (e.g. glycosidic, peptide, ester)</text><circle cx="760" cy="113" r="24" fill="#e0f2fe" stroke="#2563eb" stroke-width="2"/><text x="760" y="118" font-size="13" text-anchor="middle" fill="#2563eb" font-weight="bold">H₂O</text><rect x="500" y="260" width="70" height="46" rx="10" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/><rect x="574" y="260" width="70" height="46" rx="10" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/><rect x="566" y="274" width="12" height="18" rx="3" fill="#a7f3d0" stroke="#16a34a" stroke-width="1.5"/><circle cx="440" cy="283" r="24" fill="#e0f2fe" stroke="#2563eb" stroke-width="2"/><text x="440" y="288" font-size="13" text-anchor="middle" fill="#2563eb" font-weight="bold">H₂O</text><line x1="470" y1="330" x2="320" y2="330" stroke="#dc2626" stroke-width="3" marker-end="url(#ar)"/><text x="395" y="318" font-size="14" text-anchor="middle" fill="#dc2626" font-weight="bold">hydrolysis</text><text x="395" y="357" font-size="12" text-anchor="middle" fill="#dc2626" font-weight="normal">water split into –H and –OH</text><rect x="80" y="300" width="70" height="46" rx="10" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/><text x="115" y="328" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="normal">OH</text><rect x="220" y="300" width="70" height="46" rx="10" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/><text x="255" y="328" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="normal">H</text><text x="450" y="420" font-size="13" text-anchor="middle" fill="#475569" font-weight="normal" font-style="italic">Digestion: large, insoluble polymers → small, soluble monomers that can be absorbed (hydrolysis).</text><g class="anim"><g><rect x="150" y="190" width="70" height="46" rx="10" fill="#fde68a" stroke="#d97706" stroke-width="2"/><animateTransform attributeName="transform" type="translate" values="0 0;270 -100;270 -100;0 0" keyTimes="0;0.45;0.55;1" dur="6s" repeatCount="indefinite"/></g><g><circle cx="760" cy="200" r="14" fill="#bae6fd" stroke="#2563eb" stroke-width="2"/><animate attributeName="opacity" values="0;0;1;0" keyTimes="0;0.45;0.6;1" dur="6s" repeatCount="indefinite"/></g></g></svg>