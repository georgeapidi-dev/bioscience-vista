<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 720" class="vd-svg" role="img" aria-labelledby="ch-title ch-desc" font-family="system-ui,Segoe UI,Arial,sans-serif" data-interactive="1" data-vd-play="ch-play" data-vd-play-label="Play: join, then split" data-vd-steps="[[0, &quot;Condensation joins monomers; hydrolysis splits them. Both involve water.&quot;], [1, &quot;CONDENSATION. Two monomers, each with an \u2013OH group.&quot;], [3, &quot;The \u2013OH of the left monomer and the \u2013H of the right monomer\u2019s \u2013OH are removed...&quot;], [5, &quot;...and leave together as one molecule of water.&quot;], [7, &quot;The monomers are now joined through the remaining oxygen by a covalent bond: a dimer.&quot;], [10, &quot;HYDROLYSIS: the reverse. A water molecule arrives at the bond...&quot;], [12, &quot;...and splits into \u2013H and \u2013OH.&quot;], [13.5, &quot;The bond breaks: one monomer gets the H, the other gets the OH.&quot;], [16, &quot;The two separate monomers are back. Digestion is hydrolysis.&quot;]]" data-vd-dur="20">
<title id="ch-title">Condensation and hydrolysis</title><desc id="ch-desc">Step by step: in condensation an OH from one monomer and an H from another are removed as water and the monomers join by a covalent bond; in hydrolysis water is split into H and OH, which are added back as the bond breaks.</desc>
<style>
.vd-svg .part{cursor:pointer;transition:filter .15s}
.vd-svg .part:hover,.vd-svg .part:focus{filter:brightness(1.06) drop-shadow(0 0 3px #2563eb)}
.vd-svg .part.on{filter:drop-shadow(0 0 5px #2563eb) brightness(1.04)}
.vd-svg .lbl text{font-size:17px;fill:#1f2937}
.vd-svg .lbl line,.vd-svg .lbl polyline{stroke:#334155;stroke-width:1.3;fill:none}
.vd-svg .lbl circle{fill:#334155}
.vd-svg.hide-labels .lbl{opacity:0}
.vd-svg.hide-labels .lbl.shown{opacity:1}
.vd-svg .lbl.on text{fill:#1d4ed8;font-weight:600}
.vd-svg .note{font-size:14px;fill:#475569;font-style:italic}
.vd-svg .head{font-size:18px;font-weight:700;fill:#111827}
@media (prefers-reduced-motion: reduce){.vd-svg .anim{display:none}}
</style>
<rect width="1220" height="720" fill="#ffffff"/>
<g aria-hidden="true"><animate id="ch-play" attributeName="opacity" from="1" to="1" dur="0.01s" begin="indefinite"/></g>
<text class="head" x="30" y="34">Condensation and hydrolysis</text><text class="note" x="30" y="56">Each hexagon is one monomer, e.g. a glucose. Watch the coloured groups.</text>
<g class="part" data-part="ex" data-name="Examples" data-info="Glucose + glucose → maltose + water (glycosidic bond). Amino acid + amino acid → dipeptide + water (peptide bond). Glycerol + fatty acid → ester bond + water. Digestion is hydrolysis." tabindex="0" role="button" aria-label="Examples"><rect x="900" y="80" width="300" height="620" rx="16" fill="#f8fafc" stroke="#cbd5e1"/><text x="1050" y="108" text-anchor="middle" font-size="16" font-weight="800" fill="#111827">Remember</text><text x="916" y="140" text-anchor="start" font-size="13" font-weight="800" fill="#2563eb">CONDENSATION</text><text x="916" y="164" text-anchor="start" font-size="13" font-weight="600" fill="#111827">monomer + monomer</text><text x="916" y="188" text-anchor="start" font-size="13" font-weight="600" fill="#111827">→ dimer + WATER</text><text x="916" y="212" text-anchor="start" font-size="13" font-weight="700" fill="#2563eb">water comes OUT</text><text x="916" y="236" text-anchor="start" font-size="13" font-weight="600" fill="#475569">builds polymers</text><text x="916" y="260" text-anchor="start" font-size="13" font-weight="600" fill="#475569">needs energy (ATP) + enzyme</text><text x="916" y="284" text-anchor="start" font-size="13" font-weight="400" fill="#000"></text><text x="916" y="308" text-anchor="start" font-size="13" font-weight="800" fill="#d97706">HYDROLYSIS</text><text x="916" y="332" text-anchor="start" font-size="13" font-weight="600" fill="#111827">dimer + WATER</text><text x="916" y="356" text-anchor="start" font-size="13" font-weight="600" fill="#111827">→ monomer + monomer</text><text x="916" y="380" text-anchor="start" font-size="13" font-weight="700" fill="#d97706">water goes IN</text><text x="916" y="404" text-anchor="start" font-size="13" font-weight="600" fill="#475569">breaks polymers down</text><text x="916" y="428" text-anchor="start" font-size="13" font-weight="600" fill="#475569">e.g. digestion</text><text x="916" y="452" text-anchor="start" font-size="13" font-weight="400" fill="#000"></text><text x="916" y="476" text-anchor="start" font-size="13" font-weight="800" fill="#111827">Bonds made this way</text><text x="916" y="500" text-anchor="start" font-size="13" font-weight="600" fill="#111827">sugars: glycosidic bond</text><text x="916" y="524" text-anchor="start" font-size="13" font-weight="600" fill="#111827">amino acids: peptide bond</text><text x="916" y="548" text-anchor="start" font-size="13" font-weight="600" fill="#111827">glycerol + fatty acid:</text><text x="916" y="572" text-anchor="start" font-size="13" font-weight="600" fill="#111827">   ester bond</text></g>
<rect x="30" y="80" width="850" height="300" rx="16" fill="#eff6ff" stroke="#bfdbfe"/><text x="60" y="110" text-anchor="start" font-size="17" font-weight="800" fill="#2563eb">CONDENSATION — joining (water comes out)</text>
<g class="part" data-part="mono" data-name="Monomers" data-info="Small single units, e.g. glucose. Each has an –OH (hydroxyl) group that can react." tabindex="0" role="button" aria-label="Monomers"><g transform="translate(180 230)"><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.3250;0.4000;0.4800;1.0000" values="180 230;180 230;240 230;240 230;240 230" dur="20s" begin="ch-play.begin+0s" fill="freeze"/><polygon points="39.8,23.0 0.0,46.0 -39.8,23.0 -39.8,-23.0 -0.0,-46.0 39.8,-23.0" fill="#fde68a" stroke="#b45309" stroke-width="3"/><text x="0" y="6" text-anchor="middle" font-size="15" font-weight="800" fill="#111827">glucose</text></g><g transform="translate(560 230)"><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.3250;0.4000;0.4800;1.0000" values="560 230;560 230;500 230;500 230;500 230" dur="20s" begin="ch-play.begin+0s" fill="freeze"/><polygon points="39.8,23.0 0.0,46.0 -39.8,23.0 -39.8,-23.0 -0.0,-46.0 39.8,-23.0" fill="#fde68a" stroke="#b45309" stroke-width="3"/><text x="0" y="6" text-anchor="middle" font-size="15" font-weight="800" fill="#111827">glucose</text></g></g>
<g><animate attributeName="opacity" keyTimes="0.0000;0.2250;0.2500;1.0000" values="1;1;0;0" dur="20s" begin="ch-play.begin+0s" fill="freeze"/><line x1="226" y1="230" x2="260" y2="230" stroke="#111827" stroke-width="3"/><rect x="274.0" y="215" width="36" height="30" rx="8" fill="#fff" stroke="#dc2626" stroke-width="2.5"/><text x="292" y="236" text-anchor="middle" font-size="15" font-weight="800" fill="#dc2626">OH</text></g><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.3250;0.4000;1.0000" values="0 0;0 0;-60 0;-60 0" dur="20s" begin="ch-play.begin+0s" fill="freeze"/><line x1="514" y1="230" x2="484" y2="230" stroke="#111827" stroke-width="3"/><rect x="449.5" y="215" width="25" height="30" rx="8" fill="#fff" stroke="#111827" stroke-width="2.5"/><text x="462" y="236" text-anchor="middle" font-size="15" font-weight="800" fill="#111827">O</text></g><g><animate attributeName="opacity" keyTimes="0.0000;0.2250;0.2500;1.0000" values="1;1;0;0" dur="20s" begin="ch-play.begin+0s" fill="freeze"/><rect x="407.5" y="215" width="25" height="30" rx="8" fill="#fff" stroke="#dc2626" stroke-width="2.5"/><text x="420" y="236" text-anchor="middle" font-size="15" font-weight="800" fill="#dc2626">H</text><line x1="432" y1="230" x2="448" y2="230" stroke="#111827" stroke-width="3"/></g>
<g><animate attributeName="opacity" keyTimes="0.0000;0.1500;0.1650;0.2500;0.2650;1.0000" values="0;0;1;1;0;0" dur="20s" begin="ch-play.begin+0s" fill="freeze"/><ellipse cx="356.0" cy="230" rx="80" ry="34" fill="none" stroke="#dc2626" stroke-width="3" stroke-dasharray="8 6"/><text x="356.0" y="184" text-anchor="middle" font-size="14" font-weight="800" fill="#dc2626">OH + H</text></g>
<g class="part" data-part="wout" data-name="Water released" data-info="Condensation produces water: “condense” = water comes out. It needs energy (from ATP) and an enzyme." tabindex="0" role="button" aria-label="Water released"><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.2400;0.2600;0.4750;0.5000;1.0000" values="0;0;1;1;0;0" dur="20s" begin="ch-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.2500;0.3250;1.0000" values="356.0 230;356.0 230;356.0 330;356.0 330" dur="20s" begin="ch-play.begin+0s" fill="freeze"/><g transform="translate(0 0)"><circle r="17" fill="#ef4444" stroke="#7f1d1d" stroke-width="1.5"/><text x="0" y="5" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">O</text><circle cx="-18" cy="-14" r="10" fill="#fff" stroke="#6b7280" stroke-width="1.5"/><text x="-18" y="-10" text-anchor="middle" font-size="10" font-weight="800" fill="#111827">H</text><circle cx="18" cy="-14" r="10" fill="#fff" stroke="#6b7280" stroke-width="1.5"/><text x="18" y="-10" text-anchor="middle" font-size="10" font-weight="800" fill="#111827">H</text></g></g></g><g><animate attributeName="opacity" keyTimes="0.0000;0.3000;0.3150;0.4900;0.5050;1.0000" values="0;0;1;1;0;0" dur="20s" begin="ch-play.begin+0s" fill="freeze"/><text x="396.0" y="342" text-anchor="start" font-size="15" font-weight="800" fill="#2563eb">H₂O released</text></g></g>
<g class="part" data-part="bond" data-name="New covalent bond" data-info="The two monomers are joined through the remaining oxygen. Between two sugars this is a glycosidic bond; the product is a dimer (here maltose)." tabindex="0" role="button" aria-label="New covalent bond"><g><animate attributeName="opacity" keyTimes="0.0000;0.3500;0.3650;1.0000" values="0;0;1;1" dur="20s" begin="ch-play.begin+0s" fill="freeze"/><line x1="286" y1="230" x2="388" y2="230" stroke="#16a34a" stroke-width="6"/><text x="350.0" y="174" text-anchor="middle" font-size="15" font-weight="800" fill="#16a34a">covalent (glycosidic) bond</text><path d="M 350.0 182 L 350.0 216" stroke="#16a34a" stroke-width="2.5"/></g></g>
<g><animate attributeName="opacity" keyTimes="0.0000;0.3500;0.3650;1.0000" values="0;0;1;1" dur="20s" begin="ch-play.begin+0s" fill="freeze"/><text x="455" y="360" text-anchor="middle" font-size="16" font-weight="800" fill="#1e3a8a">glucose + glucose  →  maltose (a dimer)  +  water</text></g>
<rect x="30" y="400" width="850" height="300" rx="16" fill="#fffbeb" stroke="#fde68a"/><text x="60" y="430" text-anchor="start" font-size="17" font-weight="800" fill="#d97706">HYDROLYSIS — splitting (water goes in)</text>
<g class="part" data-part="hyd" data-name="Hydrolysis" data-info="“Hydro” = water, “lysis” = splitting. A water molecule is used to break the bond." tabindex="0" role="button" aria-label="Hydrolysis"><g transform="translate(240 560)"><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.6750;0.7750;1.0000" values="240 560;240 560;180 560;180 560" dur="20s" begin="ch-play.begin+0s" fill="freeze"/><polygon points="39.8,23.0 0.0,46.0 -39.8,23.0 -39.8,-23.0 -0.0,-46.0 39.8,-23.0" fill="#fde68a" stroke="#b45309" stroke-width="3"/><text x="0" y="6" text-anchor="middle" font-size="15" font-weight="800" fill="#111827">glucose</text></g><g transform="translate(500 560)"><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.6750;0.7750;1.0000" values="500 560;500 560;560 560;560 560" dur="20s" begin="ch-play.begin+0s" fill="freeze"/><polygon points="39.8,23.0 0.0,46.0 -39.8,23.0 -39.8,-23.0 -0.0,-46.0 39.8,-23.0" fill="#fde68a" stroke="#b45309" stroke-width="3"/><text x="0" y="6" text-anchor="middle" font-size="15" font-weight="800" fill="#111827">glucose</text></g></g>
<g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.6750;0.7750;1.0000" values="0 0;0 0;60 0;60 0" dur="20s" begin="ch-play.begin+0s" fill="freeze"/><rect x="389.5" y="545" width="25" height="30" rx="8" fill="#fff" stroke="#111827" stroke-width="2.5"/><text x="402" y="566" text-anchor="middle" font-size="15" font-weight="800" fill="#111827">O</text><line x1="454" y1="560" x2="416" y2="560" stroke="#111827" stroke-width="3"/></g><g><animate attributeName="opacity" keyTimes="0.0000;0.6600;0.6800;1.0000" values="1;1;0;0" dur="20s" begin="ch-play.begin+0s" fill="freeze"/><line x1="286" y1="560" x2="388" y2="560" stroke="#16a34a" stroke-width="6"/></g>
<g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.5000;0.5150;0.6000;0.6150;1.0000" values="0;0;1;1;0;0" dur="20s" begin="ch-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.5000;0.5750;1.0000" values="340.0 670;340.0 670;340.0 600;340.0 600" dur="20s" begin="ch-play.begin+0s" fill="freeze"/><g transform="translate(0 0)"><circle r="17" fill="#ef4444" stroke="#7f1d1d" stroke-width="1.5"/><text x="0" y="5" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">O</text><circle cx="-18" cy="-14" r="10" fill="#fff" stroke="#6b7280" stroke-width="1.5"/><text x="-18" y="-10" text-anchor="middle" font-size="10" font-weight="800" fill="#111827">H</text><circle cx="18" cy="-14" r="10" fill="#fff" stroke="#6b7280" stroke-width="1.5"/><text x="18" y="-10" text-anchor="middle" font-size="10" font-weight="800" fill="#111827">H</text></g></g></g><g><animate attributeName="opacity" keyTimes="0.0000;0.5000;0.5150;0.6500;0.6650;1.0000" values="0;0;1;1;0;0" dur="20s" begin="ch-play.begin+0s" fill="freeze"/><text x="380.0" y="664" text-anchor="start" font-size="15" font-weight="800" fill="#d97706">H₂O added</text></g>
<g class="part" data-part="split" data-name="Water is split" data-info="The water splits into –H and –OH; the H goes to one monomer and the OH to the other, so both get their groups back." tabindex="0" role="button" aria-label="Water is split"><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.6000;0.6200;1.0000" values="0;0;1;1" dur="20s" begin="ch-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.6000;0.6750;0.7750;1.0000" values="340.0 600;340.0 600;320 560;260 560;260 560" dur="20s" begin="ch-play.begin+0s" fill="freeze"/><line x1="-34" y1="0" x2="-16" y2="0" stroke="#111827" stroke-width="3"/><rect x="-8.0" y="-15" width="36" height="30" rx="8" fill="#fff" stroke="#dc2626" stroke-width="2.5"/><text x="10" y="6" text-anchor="middle" font-size="15" font-weight="800" fill="#dc2626">OH</text></g></g><g opacity="0"><animate attributeName="opacity" keyTimes="0.0000;0.6000;0.6200;1.0000" values="0;0;1;1" dur="20s" begin="ch-play.begin+0s" fill="freeze"/><g><animateTransform attributeName="transform" type="translate" keyTimes="0.0000;0.6000;0.6750;0.7750;1.0000" values="340.0 600;340.0 600;360 560;420 560;420 560" dur="20s" begin="ch-play.begin+0s" fill="freeze"/><rect x="-12.5" y="-15" width="25" height="30" rx="8" fill="#fff" stroke="#dc2626" stroke-width="2.5"/><text x="0" y="6" text-anchor="middle" font-size="15" font-weight="800" fill="#dc2626">H</text><line x1="12" y1="0" x2="28" y2="0" stroke="#111827" stroke-width="3"/></g></g><g><animate attributeName="opacity" keyTimes="0.0000;0.6000;0.6150;0.7900;0.8050;1.0000" values="0;0;1;1;0;0" dur="20s" begin="ch-play.begin+0s" fill="freeze"/><text x="455" y="500" text-anchor="middle" font-size="14" font-weight="800" fill="#dc2626">water splits: OH to one monomer, H to the other</text></g></g>
<g><animate attributeName="opacity" keyTimes="0.0000;0.8000;0.8150;1.0000" values="0;0;1;1" dur="20s" begin="ch-play.begin+0s" fill="freeze"/><text x="455" y="680" text-anchor="middle" font-size="16" font-weight="800" fill="#92400e">maltose  +  water  →  glucose  +  glucose</text></g>
</svg>